# ==================================================================
# Pipeline: Build NodeJS Docker - CI/CD para Bibliotecas Node
# -----------------------------------------------------
# Pipeline para build, teste, e publicação de uma imagem Docker - NodeJS 
# com suporte à versionamento automático, testes unitários e
# cobertura de código usando Azure DevOps e ACR registry
# OBS:
# O .npmrc deve estar presente no repositório configurado conforme documentação
# O Setup da versão do nodejs é realizado através do asdf (.tools-version)
# Utilizar o nexus somente para libs legadas que não foram migradas para o Artifacts
# ==================================================================

# Dependencies:
# - .npmrc no repositório (configuração do feed) - Veja documentação e decisão 1 no final do documento

parameters:
  # ==================================================================
  # Infraestrutura e Ambiente
  # ==================================================================
  - name: agentPool
    type: string
    default: GeneralPurposeLinuxAgentsCI
    displayName: 'Agent Pool para execução'

  - name: useNetworkProxy
    type: boolean
    default: false
    displayName: 'Configurar proxy de rede para acesso externo (se necessário)'

  # ==================================================================
  # Configurações de NodeJS e Feed
  # ==================================================================
  - name: getDependenciesFromNexus
    type: boolean
    default: false
    displayName: 'Usar Nexus para autenticação (true) ou Azure Artifacts (false)'
  # Observação: Olhar decisão 2 no final do documento sobre o uso do Nexus
  # A credencial utilizada é readonly, as publicações devem ser feitas no Artifacts apenas.
  - name: workingDirectory
    type: string
    default: $(Build.SourcesDirectory)
    displayName: 'Diretório do projeto NodeJS'

  # ==================================================================
  # Configurações de Versionamento e Validação
  # ==================================================================
  - name: versionFile
    type: string
    default: 'package.json'
    displayName: 'Arquivo de versionamento (package.json)'

  - name: branchingStrategy
    type: string
    default: 'trunkbased'
    displayName: 'Estratégia de versionamento'
    values:
      - 'trunkbased'
      - 'vivoflow'
      - 'releaseflow'
      - 'gitlabflow'
      - 'gitlabflow-semantic'
      - 'custom'
      - 'monorepo'
  
  - name: prValidationOnly
    type: boolean
    default: false
    displayName: 'Executa apenas a validação, não publica nem gera versão'

  # ==================================================================
  # Configurações de Docker / Imagem
  # ==================================================================
  - name: imageName
    type: string
    default: '$(SIGLA)/$(Build.Repository.Name)'
    displayName: 'Nome da imagem Docker'

  - name: dockerfilePath
    type: string
    default: 'Dockerfile'
    displayName: 'Caminho do Dockerfile'

  - name: registryServiceConnection
    type: string
    default: 'ACR-DEVOPS'
    displayName: 'Service Connection do Registry'

  # ==================================================================
  # Configurações de Capacidades
  # ==================================================================
  - name: enableTest
    type: boolean
    default: true
    displayName: 'Habilitar execução de testes'

  # ==================================================================
  # Configurações de Publicação de Testes e Cobertura
  # ==================================================================
  - name: testResultsFormat
    type: string
    default: 'JUnit'
    displayName: 'Formato dos resultados de testes'
    values:
      - 'JUnit'
      - 'NUnit'
      - 'VSTest'
      - 'XUnit'
      - 'CTest'

  - name: testResultsFiles
    type: string
    default: 'test-results/junit.xml'
    displayName: 'Caminho relativo dos arquivos de resultados de testes'

  - name: failTaskOnFailedTests
    type: boolean
    default: true
    displayName: 'Falhar task se houver testes com falha'

  - name: mergeTestResults
    type: boolean
    default: true
    displayName: 'Mesclar resultados de testes'

  - name: coverageSummaryFile
    type: string
    default: 'test-results/coverage/clover.xml'
    displayName: 'Caminho relativo do arquivo de resumo de cobertura'

  - name: failIfCoverageEmpty
    type: boolean
    default: false
    displayName: 'Falhar se não houver resultados de cobertura'

  - name: publishAllureReport
    type: boolean
    default: false
    displayName: 'Publicar relatório Allure (gerado durante npm run test)'

  - name: testAllureResultsDir
    type: string
    default: '$(Pipeline.Workspace)/allure-results'
    displayName: 'Diretório de resultados do Allure (evite Build.SourcesDirectory)'

  - name: enableCache
    type: boolean
    default: true
    displayName: 'Habilitar cache de dependências npm'

  - name: runQualityGate
    type: boolean
    default: true
    displayName: 'Executar Quality Gate (SonarQube)'

  # ==================================================================
  # Configurações de Publicação de Artefatos
  # ==================================================================
  - name: artifactPaths
    type: string
    default: |
      **/*
      !.git/**/*
    displayName: 'Padrões de arquivos para publicar (glob patterns, um por linha)'

# ==================================================================
# Configurações de Segurança
# ==================================================================
  # - name: fortifyScanDirectory
  #   type: string
  #   default: $(Build.SourcesDirectory)
  #   displayName: 'Diretório scan Fortify'
  - name: enableFortifyExclusions
    displayName: 'Faz checkout do repositório Fortify Exclusions'
    type: boolean
    default: false
  # Se enableFortifyExclusions, mude fortifyScanDirectory para $(Build.SourcesDirectory)/$(Build.Repository.Name)
  - name: convisoCompany
    type: string
    default: '430'
    displayName: 'Conviso Company ID'

# ==================================================================
# Configurações do Sonar
# ==================================================================
  - name: useSonarConfigFile
    type: boolean
    default: true
    displayName: 'Usar arquivo de configuração do SonarQube?'

  - name: sonarConfigFilePath
    type: string
    default: '.azuredevops/sonar-project.properties'
    displayName: 'Caminho do arquivo de configuração do SonarQube'

  - name: sonarPollingTimeoutSec
    type: string
    default: '300'
    displayName: 'Timeout do Polling SonarQube (s)'

  - name: sonarJavaVersion
    type: string
    default: 'openjdk-17.0.2'
    displayName: 'Versão do Java para análise SonarQube'
    values:
      - 'openjdk-21.0.2'
      - 'openjdk-17.0.2'
      - 'openjdk-11.0.2'

  # ==================================================================
  # Service Connection do SonarQube
  # Hoje ainda permite referenciar manualmente o Sonar VIP ou comum.
  # Será depreciado em breve (história futura) para aderir à governança da ADR 0006.
  # ==================================================================
  - name: sonarServiceConnection
    type: string
    default: 'VIVO_SONARQUBE'
    displayName: '(DEPRECATED) Service Connection do SonarQube'

  - name: sonarQualityGate
    type: string
    default: 'AzureDevOps-Default'
    displayName: 'Quality Gate do SonarQube'

  - name: sonarScannerMode
    type: string
    default: 'cli'
    displayName: 'Modo do scanner SonarQube'
    values:
      - 'cli'
      - 'dotnet'

  - name: sonarProjectKey
    type: string
    default: '$(System.TeamProject)-$(Build.Repository.Name)'
    displayName: 'Chave do projeto no SonarQube'

  - name: sonarProjectName
    type: string
    default: '$(System.TeamProject)-$(Build.Repository.Name)'
    displayName: 'Nome do projeto no SonarQube'

  - name: useAppConfig
    type: boolean
    default: true
    displayName: 'Usar Azure App Configuration para SonarQube'

# ==================================================================
# Variáveis Internas do Pipeline
# ==================================================================
variables:
  - name: SIGLA
    value: $[ lower(split(variables['System.TeamProject'],' ')[0]) ]
  - name: NODE_CACHE_FOLDER
    value: $(Pipeline.Workspace)/.npm

  # Variáveis utilizadas por templates de Segurança (Fortify/SCA)
  - name: CACORP_LOCATION
    value: $(Agent.HomeDirectory)/../../certs/CACORP.pem
  - name: FORTIFY_APP_DEFAULT_VERSION
    value: DevSecOps
  - name: APP_LANGUAGE
    value: 'nodejs'
  - name: DOCKER_SERVICE_CONNECTION
    value: ${{ parameters.registryServiceConnection }}

 # Configurações de KeyVault para Segurança
  - name: AKV_DEVOPS_NAME
    value: 'kv-azdevops-shared'

  # Variables for Proxy
  - name: PROXY_NSKP_SERVER
    value: "nskp.redecorp.br:8080"
  - name: PROXY_SQUID_SERVER
    value: "10.240.58.39:3128"
  - name: PROXY_AGENT_HTTP
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_HTTPS
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"

# ==================================================================
# Estágios do Pipeline
# ==================================================================
stages:

# ==================================================================
# Stage 1: NodeBuild - Build, Testes e Análise de Qualidade
# Descrição: Instala dependências npm, executa build da aplicação, testes unitários (Jest),
#            gera relatório de cobertura (LCOV) e executa análise SonarQube
# ==================================================================
- stage: NodeBuild
  displayName: 'Build e Testes NodeJS'
  condition: succeeded()
  jobs:
  - job: NodeBuild
    displayName: 'Build e Testes'
    pool: ${{ parameters.agentPool }}
    steps:
      # ==================================================================
      # Configuração Inicial e Checkout
      # ==================================================================
      - checkout: self
        fetchDepth: 0

      # AVISO TEMPORÁRIO: Este bloco será removido após a remoção definitiva do parâmetro 'sonarServiceConnection'.
      # Exibe warning para quem ainda sobrescreve manualmente o parâmetro.
      - ${{ if ne(parameters.sonarServiceConnection, 'VIVO_SONARQUBE') }}:
        - script: |
            echo "##vso[task.logissue type=warning]O parâmetro 'sonarServiceConnection' está depreciado e será removido após 30/06/2026. Consulte ADR 0006 e ADR 0008 para detalhes. A escolha da instância Sonar será automática via custom task e vip.json. Atualize seu pipeline!"
            echo "##vso[task.logissue type=warning]ADR 0006: https://dev.azure.com/telefonica-vivo-brasil/DevOps/_git/Vivo.CodePlay.Pipelines?path=/doc/adr/0006-uso-do-sonar.md"
            echo "##vso[task.logissue type=warning]ADR 0008: https://dev.azure.com/telefonica-vivo-brasil/DevOps/_git/Vivo.CodePlay.Pipelines?path=/framework/docs/adr/0008-sonar-vip-governance.md"
            echo "##vso[task.complete result=SucceededWithIssues;]"
          displayName: '⚠️ AVISO: Depreciação do sonarServiceConnection'

      # ==================================================================
      # Observabilidade e Diagnóstico
      # ==================================================================
      - task: VivoUtilsFromVivo@1
        displayName: 'Show Pipeline Parameters'
        condition: eq(variables['System.Debug'], 'true')
        inputs:
          command: 'show-pipeline-parameters'
          parameters: '${{ convertToJson(parameters) }}'

      # ==================================================================
      # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
      # ==================================================================
      - task: VivoDevOpsConfigCompliance@1
        displayName: 'Check DevOps Config Compliance'
        inputs:
          workDir: ${{ parameters.workingDirectory }}
          policySets: |
            image-definition-files

      # ==================================================================
      # Autenticação no Nexus (Para download de libs)
      # A credencial utilizada é readonly, as publicações devem ser feitas no Artifacts apenas.
      # ==================================================================
      - ${{ if eq(parameters.getDependenciesFromNexus, true) }}:
        - task: AzureKeyVault@2
          displayName: 'Secrets from AKV'
          inputs:
            azureSubscription: "DevOpsSharedResources"
            KeyVaultName: "kv-azdevops-shared"
            SecretsFilter: >-
              NEXUS-DEPS-USR, NEXUS-DEPS-PSW

      # ==================================================================
      # Otimização de Performance (Cache)
      # ==================================================================
      - ${{ if eq(parameters.enableCache, true) }}:
        - task: Cache@2
          displayName: 'Cache Node dependencies'
          inputs:
            key: 'node | "$(Agent.OS)" | **/package-lock.json'
            restoreKeys: |
              node | "$(Agent.OS)" | **/package-lock.json
            path: $(NODE_CACHE_FOLDER)

      # ==================================================================
      # [Versionamento] Definição da versão (VersionManager)
      # ==================================================================
      - task: VersionManagerVivo@8
        displayName: 'Next version package.json'
        inputs:
          command: 'nextVersion'
          branchingStrategy: ${{ parameters.branchingStrategy }}
          versionFile: '${{ parameters.workingDirectory }}/${{ parameters.versionFile }}'
          bumpMethod: 'patch'
          passthroughVersion: ${{ parameters.prValidationOnly }}

        name: VersionManagerVivo
      
      # Para o .npmrc funcionar com var precisa ser usado a versão base64 do token
      - script: |
          echo "##[debug] Exporting B64_AZURE_DEVOPS_PAT var"
          B64_AZURE_DEVOPS_PAT=$(echo -n $AZURE_DEVOPS_PAT | base64 -w0)
          echo "##vso[task.setvariable variable=B64_AZURE_DEVOPS_PAT;isOutput=true;issecret=true]${B64_AZURE_DEVOPS_PAT}"
        displayName: 'Exportando Token'
        name: setupToken
        env:
          AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
          SYSTEM_ACCESSTOKEN: $(System.AccessToken) # Algumas docs mostram para configurar essa var (ver decisão 3)

      # ==================================================================
      # Instalação de Dependências
      # ==================================================================
      - task: npm@1
        displayName: 'npm install'
        inputs:
          command: 'install'
          workingDir: ${{ parameters.workingDirectory }}
          customRegistry: 'useNpmrc'
          customRegistryFile: '.npmrc'
        env:
          NPM_CONFIG_CACHE: $(NODE_CACHE_FOLDER)
          NEXUS_DEPS_USR: $(NEXUS-DEPS-USR) # A credencial utilizada é readonly, as publicações devem ser feitas no Artifacts apenas.
          NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW) # A credencial utilizada é readonly, as publicações devem ser feitas no Artifacts apenas.
          AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
          B64_AZURE_DEVOPS_PAT: $(setupToken.B64_AZURE_DEVOPS_PAT) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
          SYSTEM_ACCESSTOKEN: $(System.AccessToken) # Algumas docs mostram para configurar essa var (ver decisão 3)

      # ==================================================================
      # Build do Projeto
      # ==================================================================
      - task: npm@1
        displayName: 'npm run build'
        inputs:
          command: 'custom'
          customCommand: 'run build'
          workingDir: ${{ parameters.workingDirectory }}
          customRegistry: 'useNpmrc'
          customRegistryFile: '.npmrc'
        env:
          NPM_CONFIG_CACHE: $(NODE_CACHE_FOLDER)
          VERSION: $(VersionManagerVivo.VERSION)

      # ==================================================================
      # Testes Unitários e Cobertura de Código
      # ==================================================================
      # CAPACIDADE: TESTES UNITÁRIOS + COBERTURA (condicional enableTest)
      # Descrição: Executa testes unitários e coleta cobertura de código
      # Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/testes-unitarios
      # Pré-requisitos: 
      # Artefatos: relatórios JUnit XML + cobertura HTML/XML
      # Observação: Veja documentação para configurar o Jest com cobertura
      - ${{ if eq(parameters.enableTest, true) }}:
        # Execução de testes
        - task: npm@1
          displayName: 'npm test'
          inputs:
            command: 'custom'
            customCommand: 'test'
            workingDir: ${{ parameters.workingDirectory }}
            customRegistry: 'useNpmrc'
            customRegistryFile: '.npmrc'
          env:
            NPM_CONFIG_CACHE: $(NODE_CACHE_FOLDER)

        # Publicação dos relatórios de testes
        - task: PublishTestResults@2
          displayName: 'Publish Test Results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: '${{ parameters.testResultsFormat }}'
            testResultsFiles: '${{ parameters.workingDirectory }}/${{ parameters.testResultsFiles }}'
            failTaskOnFailedTests: ${{ parameters.failTaskOnFailedTests }}
            mergeTestResults: ${{ parameters.mergeTestResults }}

        # Publicação dos relatórios de cobertura
        - task: PublishCodeCoverageResults@2
          displayName: 'Publish Code Coverage'
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '${{ parameters.workingDirectory }}/${{ parameters.coverageSummaryFile }}'
            failIfCoverageEmpty: ${{ parameters.failIfCoverageEmpty }}

      - ${{ if eq(parameters.publishAllureReport, true) }}:
        # ==================================================================
        # CAPACIDADE: ALLURE REPORT (condicional publishAllureReport)
        # Pré-requisitos:
        #   - Os resultados do Allure são gerados durante a execução de 'npm run test'
        #   - Dependências npm: reporter Allure (ex: jest-allure, mocha-allure-reporter)
        #   - Extensão Allure instalada na Org (task PublishAllureReport@2)
        # ==================================================================
        - task: PublishAllureReport@2.1.4
          displayName: 'Publish Allure Report'
          condition: succeededOrFailed()
          inputs:
            testResultsDir: '${{ parameters.testAllureResultsDir }}'

#############################################################################
# CAPACIDADE: QUALITY GATE (SONARQUBE)
#############################################################################
# Descrição: Análise estática de código e quality gate
# Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/quality-gate
# Pré-requisitos:
#   - Service Connection 'SonarQube' configurada
#   - Projeto configurado no SonarQube
#   - Quality Gate definido no SonarQube
# Configuração: Parâmetro 'runQualityGate' = true
# Observações: Não executa em Pull Requests
#############################################################################
      - ${{ if eq(parameters.runQualityGate, true) }}:
        # ==================================================================
        # [SonarQube] Análise Completa de Qualidade de Código
        # ==================================================================
        - task: SonarAnalysisFromVivo@4
          displayName: 'SonarQube Full Analysis'
          inputs:
            command: 'analysis'
            SonarQubeVip: 'VIVO_SONARQUBE_VIP'
            SonarQube: 'VIVO_SONARQUBE'
            scannerMode: ${{ parameters.sonarScannerMode }}
            ${{ if eq(parameters.useSonarConfigFile, true) }}:
              configFile: ${{ parameters.sonarConfigFilePath }}
            cliProjectKey: ${{ parameters.sonarProjectKey }}
            cliProjectName: ${{ parameters.sonarProjectName }}
            cliProjectVersion: $(VersionManagerVivo.VERSION)
            qualityGate: ${{ parameters.sonarQualityGate }}
            acronym: $(SIGLA)
            reportPath: '$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt'
            pollingTimeoutSec: ${{ parameters.sonarPollingTimeoutSec }}
            useOpaRepository: 'true'
            codePlayServiceConnection: 'CodePlay'
            opaProject: 'DVPS - DEVOPS'
            opaRepository: 'Vivo.OpenPolicy.SonarQube'
            opaBranch: 'master'
            useAppConfig: ${{ parameters.useAppConfig }}
            appConfigurationEndpoint: 'https://appcs-azdevops-shared.azconfig.io'
            azureSubscription: DevOpsSharedResources
            sonarUrlPemCertificate: $(Agent.HomeDirectory)/../../certs/CACORP.pem
            extraProperties: |
              sonar.javascript.lcov.reportPaths=${{ parameters.workingDirectory }}/test-results/coverage/lcov.info
              sonar.typescript.lcov.reportPaths=${{ parameters.workingDirectory }}/test-results/coverage/lcov.info
              sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
              sonar.qualitygate.wait=false
              sonar.qualitygate.timeout=${{ parameters.sonarPollingTimeoutSec }}
              sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.d.ts
              sonar.sources=${{ parameters.workingDirectory }}
              sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js
              sonar.test.exclusions=**/*.spec.ts,**/*.test.ts
              sonar.verbose=${SYSTEM_DEBUG,,}
          env:
            ASDF_JAVA_VERSION: ${{ parameters.sonarJavaVersion }}

      # ==================================================================
      # Publicação de Artefatos de Build
      # ==================================================================
      # Usa lista de paths definida no parâmetro artifactPaths
      - task: CopyFiles@2
        displayName: 'Prepare Build Artifacts'
        condition: succeeded()
        inputs:
          sourceFolder: '${{ parameters.workingDirectory }}'
          contents: ${{ parameters.artifactPaths }}
          targetFolder: '$(Build.ArtifactStagingDirectory)/node-build-context'
          flattenFolders: false

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Node Build Artifacts'
        condition: succeeded()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/node-build-context'
          artifact: 'node-build-artifacts'
          publishLocation: 'pipeline'

# ==================================================================
# Stage 2: SecurityAnalysis - Análise de Segurança SAST
# Descrição: Executa análise de segurança estática (SAST) com Fortify ScanCentral.
#            Gates de segurança (bloqueio ou não do pipeline) são realizados pelo
#            time de AppSec via chaves de configuração recuperadas do AppConfig corporativo.
# ==================================================================
- stage: SecurityAnalysis
  displayName: 'Security Analysis'
  dependsOn:
  - NodeBuild
  condition: succeeded()
  jobs:

  - job: AppSecConfigKeys
    displayName: 'Get AppSec Config Keys'
    pool: ${{ parameters.agentPool }}
    steps:
    - template: /security/get_appconfig_keys_framework.yml
      parameters:
        azureSubscription: DevOpsSharedResources
        appConfigurationEndpoint: https://appcs-azdevops-shared.azconfig.io
        useNetworkProxy: ${{ parameters.useNetworkProxy }}

# ==================================================================
# CAPACIDADE: FORTIFY SCAN (SAST)
# ==================================================================
# Descrição: Análise estática de código (SAST) usando Fortify ScanCentral e SSC, com integração à Conviso e publicação de artefatos.
# Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/sast
# Observações: Exporta variáveis e publica artefatos para uso no Security Gate.
# ==================================================================

  - job: FortifyScan
    displayName: 'Fortify Scan'
    dependsOn: 
    - AppSecConfigKeys
    variables:
      USE_FORTIFY: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_FORTIFY'] ]
      USE_CONVISO: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_CONVISO'] ]
      SKIP_SECURITY_GATE: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
      FORTIFY_LOCAL_SCANCENTRAL_VERSION: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.FORTIFY_LOCAL_SCANCENTRAL_VERSION'] ]
    condition: and(succeeded(), eq(variables.USE_FORTIFY, true))
    pool: ${{ parameters.agentPool }}
    steps:

    - template: /security/define_appsec_app_version.yml

    - template: /security/run_fortify_scan.yml
      parameters:
        fortifyExclusionRepository: 'FortifyExclusion'
        enableFortifyExclusions:  ${{ parameters.enableFortifyExclusions }}
        appLanguage: 'nodejs'
        appVersion: "$(FORTIFY_APP_VERSION)" # OBS: A variável FORTIFY_APP_VERSION é definida no template /security/define_appsec_app_version.yml
        convisoCompany: ${{ parameters.convisoCompany }}

# ==================================================================
# Stage 3: DockerBuild - Construção da Imagem Docker
# Descrição: Baixa artefatos, constrói imagem Docker com aplicação,
#            executa análise SCA (Dependency Track) se habilitado pelo AppSec
#            e publica no Azure Container Registry
# ==================================================================
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: 
  - SecurityAnalysis
  condition: succeeded()
  jobs:
  # ==================================================================
  # Job 3.1: DockerBuild - Construção e Publicação da Imagem Docker
  # Descrição: Baixa artefatos, copia para contexto Docker, constrói e publica imagem
  # ==================================================================
  - job: DockerBuild
    displayName: 'Build Docker Image'
    pool: ${{ parameters.agentPool }}
    variables:
      USE_DT_DOCKER: $[ stageDependencies.SecurityAnalysis.AppSecConfigKeys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
      USE_CONVISO: $[ stageDependencies.SecurityAnalysis.AppSecConfigKeys.outputs['evaluate_flags.USE_CONVISO'] ]
      SKIP_SECURITY_GATE_SCA: $[ stageDependencies.SecurityAnalysis.AppSecConfigKeys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]
    steps:
    # ==================================================================
    # [Configuração Inicial] Checkout e Download de Artefatos
    # ==================================================================
    - checkout: self
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Node Build Artifacts'
      inputs:
        buildType: 'current'
        artifactName: 'node-build-artifacts'
        targetPath: '$(System.ArtifactsDirectory)/node-build-artifacts'

    # ==================================================================
    # [Versionamento] Definição da versão (VersionManager)
    # ==================================================================
    - task: VersionManagerVivo@8
      displayName: 'Next version package.json'
      inputs:
        command: 'nextVersion'
        branchingStrategy: ${{ parameters.branchingStrategy }}
        versionFile: '${{ parameters.workingDirectory }}/${{ parameters.versionFile }}'
        bumpMethod: 'patch'
        passthroughVersion: ${{ parameters.prValidationOnly }}
      name: VersionManagerVivo

    # ==================================================================
    # [Preparação Docker] Cópia dos Artefatos para Contexto de Build
    # ==================================================================
    - task: CopyFiles@2
      displayName: 'Copy Build Artifacts to Build Context'
      inputs:
        sourceFolder: '$(System.ArtifactsDirectory)/node-build-artifacts'
        contents: '**/*'
        targetFolder: '${{ parameters.workingDirectory }}'
        flattenFolders: false
        overWrite: false  # Não vai sobrescrever os arquivos existentes
        
    - script: | 
        echo "##[group] Docker Build Context"
        ls -la '${{ parameters.workingDirectory }}'
        echo "##[endgroup]"
      condition: eq(variables['System.Debug'], 'true')
      displayName: 'Show Docker Build Context'

    # Para o .npmrc funcionar com var precisa ser usado a versão base64 do token
    - script: |
        echo "##[debug] Exporting B64_AZURE_DEVOPS_PAT var"
        B64_AZURE_DEVOPS_PAT=$(echo -n $AZURE_DEVOPS_PAT | base64 -w0)
        echo "##vso[task.setvariable variable=B64_AZURE_DEVOPS_PAT;isOutput=true;issecret=true]${B64_AZURE_DEVOPS_PAT}"
      displayName: 'Exportando Token'
      name: setupToken
      env:
        AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
        SYSTEM_ACCESSTOKEN: $(System.AccessToken) # Algumas docs mostram para configurar essa var (ver decisão 3)

    # ==================================================================
    # [Docker Build & Push] Construção da Imagem com Template Central
    # ==================================================================
    - ${{ if eq(parameters.prValidationOnly, false) }}:
      - template: /framework/templates/docker-build-and-push.yaml
        parameters:
          imageName: ${{ parameters.imageName }}
          imageTag: '$(VersionManagerVivo.VERSION)'
          registryServiceConnection: '${{ parameters.registryServiceConnection }}'
          pushImage: true
          buildArgs:
            - "APPLICATION_NAME=$(Build.Repository.Name)"
            - "APP_VERSION=$(VersionManagerVivo.VERSION)"
            - "AZURE_DEVOPS_PAT=$(System.AccessToken)"
            - "B64_AZURE_DEVOPS_PAT=$(setupToken.B64_AZURE_DEVOPS_PAT)"
            - "VERSION=$(VersionManagerVivo.VERSION)"
          dockerfilePath: ${{ parameters.workingDirectory }}/${{ parameters.dockerfilePath }}
          buildContext: '${{ parameters.workingDirectory }}'
          loginRegistryServiceConnections:
          - ${{ parameters.registryServiceConnection }}
          convisoCompany: ${{ parameters.convisoCompany }}

# ==================================================================
# Stage 4: VersionCommit - Commit e Tag da Versão de Release
# Descrição: Atualiza versão no package.json, cria commit e tag Git
#            Executa apenas na master, quando não é PR de validação e quando Docker push está habilitado
# ==================================================================
- ${{ if eq(parameters.prValidationOnly, false) }}:
  - stage: VersionCommit
    displayName: 'Commit Version'
    dependsOn:
    - DockerBuild
    condition: succeeded()
    jobs:
      - job: CommitVersion
        displayName: 'Commit Release Version'
        pool: ${{ parameters.agentPool }}
        steps:
          # ==================================================================
          # Checkout para Commit da Versão
          # ==================================================================
          - checkout: self
            clean: true
            persistCredentials: true
            fetchDepth: 0

          # ==================================================================
          # [Versionamento] Reafirma versão e realiza commit/tag
          # ==================================================================
          - task: VersionManagerVivo@8
            displayName: 'Next version package.json'
            inputs:
              command: 'nextVersion'
              branchingStrategy: ${{ parameters.branchingStrategy }}
              versionFile: '${{ parameters.workingDirectory }}/${{ parameters.versionFile }}'
              bumpMethod: 'patch'
            name: VersionManagerVivo

          - task: VersionManagerVivo@8
            displayName: 'Commit and Tag Version'
            inputs:
              command: 'commitVersion'
              version: '$(VersionManagerVivo.VERSION)'
              versionFile: ${{ parameters.workingDirectory }}/${{ parameters.versionFile }}
              createTag: true
              pushChanges: true

          # ==============================================================================
          # [Versionamento] Publica versão de build no Event Hub para rastreabilidade
          # ==============================================================================
          - task: VivoEventHubTools@3
            continueOnError: true
            displayName: 'Publish Build Event to Event Hub'
            inputs:
              command: build
              eventHubConnection: EVHCodeProd
              eventHubName: 'govapp.component.build.event'
              componentProject: $(System.TeamProject)
              componentName: $(Build.Repository.Name)
              componentVersion: $(VersionManagerVivo.VERSION)
              componentBuildId: $(Build.BuildId)
              componentPipelineUrl: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results