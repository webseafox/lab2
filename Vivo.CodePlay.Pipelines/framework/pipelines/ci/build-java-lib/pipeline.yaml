# ==================================================================
# Pipeline: CI Build Java Library - Build, Testes e Publicação Maven
# -----------------------------------------------------
# Pipeline de Integração Contínua para bibliotecas Java usando Maven.
# Realiza build, testes (JUnit) com cobertura (JaCoCo), gera relatórios e publica
# artefatos em Azure Artifacts (ou Nexus via Key Vault opcional). Suporta modo validação PR.
# -----------------------------------------------------
# TODOs Futuras Melhorias:
# - Inclusão dos estágios de segurança
# - Inclusão do Sonar
# - Inclusão de gates
# - Mudar versionamento para o Version Manager
# ==================================================================

parameters:
  # ==================================================================
  # Infraestrutura e Ambiente
  # ==================================================================
  - name: agentPool
    type: string
    default: GeneralPurposeLinuxAgentsCI
    displayName: 'Agent Pool para execução'

  - name: useNetworkProxy
    type: boolean
    default: false
    displayName: 'Configurar proxy de rede para acesso externo (se necessário)'

  # ==================================================================
  # Configurações de Java e Feed
  # ------------------------------------------------------------------
  # Para usar o Nexus a service connection DevOpsSharedResources deve estar criada
  # Método default de autenticação: Azure Artifacts (System.AccessToken)
  # Exemplo settings.xml esperado (usar AZURE_DEVOPS_PAT / System.AccessToken):
  # <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" ...>
  #   <servers>
  #     <server>
  #       <id>[SIGLA]</id>
  #       <username>telefonica-vivo-brasil</username>
  #       <password>${AZURE_DEVOPS_PAT}</password>
  #     </server>
  #   </servers>
  # </settings>
  # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
  # Alem disso, o pom.xml deve ter o distributionManagement e repositories configurados (ver README.md)
  - name: getDependenciesFromNexus
    type: boolean
    default: false
    displayName: 'Usar Nexus para autenticação (true) ou Azure Artifacts (false)'
  # Observação: Olhar decisão 3 no final do documento sobre o uso do Nexus

  - name: workingDirectory
    type: string
    default: $(Build.SourcesDirectory)
    displayName: 'Diretório do projeto'

  - name: buildArtifactName
    type: string
    default: $(Build.Repository.Name)
    displayName: 'nome do artefato'

  - name: javaVersion
    type: string
    default: 'openjdk-21.0.2'
    displayName: 'Versão do Java'
    # Versões devem ser instaladas antes: https://dev.azure.com/telefonica-vivo-brasil/DevOps/_git/Vivo.Infra.Ansible.SetupAzdoAgents?path=/roles/asdf/defaults/main.yaml
    values:
      - 'openjdk-21.0.2'
      - 'openjdk-17.0.2'
      - 'openjdk-11.0.2'
      - 'adoptopenjdk-8.0.352+8'
      - 'sapmachine-17.0.10'
  - name: mavenCustomSettings
    type: string
    default: '.azuredevops/settings.xml'
    displayName: 'Caminho para o settings.xml customizado do Maven'

  # ==================================================================
  # Configurações de Versionamento
  # ==================================================================
  - name: versionFile
    type: string
    default: 'pom.xml'
    displayName: 'Arquivo de versionamento (pom.xml)'

  - name: branchingStrategy
    type: string
    default: 'trunkbased'
    displayName: 'Estratégia de versionamento'
    values:
      - 'trunkbased'
      - 'vivoflow'
      - 'releaseflow'
      - 'gitlabflow'
      - 'gitlabflow-semantic'
      - 'custom'
      - 'monorepo'

  # ==================================================================
  # Controle de Fluxo e Capacidades
  # ------------------------------------------------------------------
  # Se cobertura estiver habilitada, os testes também serão executados com jacoco:report.
  # Para configurar o Jacoco, adicione o plugin no pom.xml:
  # <plugin>
  #   <groupId>org.jacoco</groupId>
  #   <artifactId>jacoco-maven-plugin</artifactId>
  #   <version>0.8.8</version>
  #   <executions>
  #     <execution><goals><goal>prepare-agent</goal></goals></execution>
  #     <execution><id>report</id><phase>test</phase><goals><goal>report</goal></goals></execution>
  #   </executions>
  # </plugin>
  # OBS: Parâmetro enableCoverage usado para condicionar geração de relatórios JaCoCo.
  - name: prValidationOnly
    type: boolean
    default: false
    displayName: 'Executa apenas a validação, não publica nem gera versão'
  - name: enableTest
    type: boolean
    default: true
    displayName: 'Habilitar execução de testes'
  - name: enableCache
    type: boolean
    default: true
    displayName: 'Habilitar cache de dependências Maven'
  - name: enableCoverage
    type: boolean
    default: true
    displayName: 'Habilitar geração de relatórios de cobertura de código (JaCoCo)'
  - name: runQualityGate
    type: boolean
    default: true
    displayName: 'Executar Quality Gate (SonarQube)'

# ==================================================================
# Configurações de Segurança
# ==================================================================
  - name: enableFortifyExclusions
    displayName: 'Faz checkout do repositório Fortify Exclusions'
    type: boolean
    default: false

# ==================================================================
# Configurações do Sonar
# ==================================================================
  - name: useSonarConfigFile
    type: boolean
    default: true
    displayName: 'Usar arquivo de configuração do SonarQube?'

  - name: sonarConfigFilePath
    type: string
    default: '.azuredevops/sonar-project.properties'
    displayName: 'Caminho do arquivo de configuração do SonarQube'

  - name: sonarPollingTimeoutSec
    type: string
    default: '300'
    displayName: 'Timeout do Polling SonarQube (s)'

  - name: sonarJavaVersion
    type: string
    default: 'openjdk-17.0.2'
    displayName: 'Versão do Java para análise SonarQube'
    values:
      - 'openjdk-21.0.2'
      - 'openjdk-17.0.2'
      - 'openjdk-11.0.2'

  # ==================================================================
  # Service Connection do SonarQube
  # Hoje ainda permite referenciar manualmente o Sonar VIP ou comum.
  # Será depreciado em breve (história futura) para aderir à governança da ADR 0006.
  # ==================================================================
  - name: sonarServiceConnection
    type: string
    default: 'VIVO_SONARQUBE'
    displayName: '(DEPRECATED) Service Connection do SonarQube'

  - name: sonarQualityGate
    type: string
    default: 'AzureDevOps-Default'
    displayName: 'Quality Gate do SonarQube'

  - name: sonarScannerMode
    type: string
    default: 'cli'
    displayName: 'Modo do scanner SonarQube'
    values:
      - 'cli'
      - 'dotnet'

  - name: sonarProjectKey
    type: string
    default: '$(System.TeamProject)-$(Build.Repository.Name)'
    displayName: 'Chave do projeto no SonarQube'

  - name: sonarProjectName
    type: string
    default: '$(System.TeamProject)-$(Build.Repository.Name)'
    displayName: 'Nome do projeto no SonarQube'

  - name: useAppConfig
    type: boolean
    default: true
    displayName: 'Usar Azure App Configuration para SonarQube'

# ==================================================================
# Variáveis Internas do Pipeline
# ==================================================================
variables:
  - name: SIGLA
    value: $[ lower(split(variables['System.TeamProject'],' ')[0]) ]
  - name: POM_FILE_PATH
    value: ${{ parameters.workingDirectory }}/${{ parameters.versionFile }}
  - name: MAVEN_CACHE_FOLDER
    value: $(Pipeline.Workspace)/.m2/repository
  - name: MAVEN_OPTS
    value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  - name: MAVEN_CUSTOM_SETTINGS
    value: ${{ parameters.workingDirectory }}/${{ parameters.mavenCustomSettings }}
  - ${{ if eq(parameters.enableCache, true) }}:
      - name: MAVEN_REPO_LOCAL
        value: $(MAVEN_CACHE_FOLDER)
  - ${{ if eq(parameters.enableCache, false) }}:
      - name: MAVEN_REPO_LOCAL
        value: '/home/svc_devopscorp/.m2/repository'

 # Configurações de KeyVault para Segurança
  - name: AKV_DEVOPS_NAME
    value: 'kv-azdevops-shared'

  # Variables for Proxy
  - name: PROXY_NSKP_SERVER
    value: "nskp.redecorp.br:8080"
  - name: PROXY_SQUID_SERVER
    value: "10.240.58.39:3128"
  - name: PROXY_AGENT_HTTP
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_HTTPS
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"

  # Variáveis utilizadas por templates de Segurança (Fortify/SCA)
  - name: CACORP_LOCATION
    value: $(Agent.HomeDirectory)/../../certs/CACORP.pem

  - name: APP_LANGUAGE
    value: 'java'

  - name: FORTIFY_APP_DEFAULT_VERSION
    value: DevSecOps

# ==================================================================
# Estágios do Pipeline
# ==================================================================
stages:
  # Stage 1: JavaBuild - Build, Testes e Publicação da biblioteca Java
  - stage: JavaBuild
    displayName: 'Build e Testes Java'
    condition: succeeded()
    jobs:
      - job: JavaBuild
        displayName: 'Build e Testes'
        pool: ${{ parameters.agentPool }}
        steps:
          # ==================================================================
          # [Configuração Inicial] Checkout do código
          # ==================================================================
          - checkout: self
          
          # AVISO TEMPORÁRIO: Este bloco será removido após a remoção definitiva do parâmetro 'sonarServiceConnection'.
          # Exibe warning para quem ainda sobrescreve manualmente o parâmetro.
          - ${{ if ne(parameters.sonarServiceConnection, 'VIVO_SONARQUBE') }}:
            - script: |
                echo "##vso[task.logissue type=warning]O parâmetro 'sonarServiceConnection' está depreciado e será removido após 30/06/2026. Consulte ADR 0006 e ADR 0008 para detalhes. A escolha da instância Sonar será automática via custom task e vip.json. Atualize seu pipeline!"
                echo "##vso[task.logissue type=warning]ADR 0006: https://dev.azure.com/telefonica-vivo-brasil/DevOps/_git/Vivo.CodePlay.Pipelines?path=/doc/adr/0006-uso-do-sonar.md"
                echo "##vso[task.logissue type=warning]ADR 0008: https://dev.azure.com/telefonica-vivo-brasil/DevOps/_git/Vivo.CodePlay.Pipelines?path=/framework/docs/adr/0008-sonar-vip-governance.md"
                echo "##vso[task.complete result=SucceededWithIssues;]"
              displayName: '⚠️ AVISO: Depreciação do sonarServiceConnection'

          # ==================================================================
          # [Observabilidade] Exibe parâmetros quando em modo debug
          # ==================================================================
          - task: VivoUtilsFromVivo@1
            displayName: 'Show Pipeline Parameters'
            condition: eq(variables['System.Debug'], 'true')
            inputs:
              command: 'show-pipeline-parameters'
              parameters: '${{ convertToJson(parameters) }}'

          # ==================================================================
          # [Autenticação Opcional] Nexus via Azure Key Vault
          # ==================================================================
          - ${{ if eq(parameters.getDependenciesFromNexus, true) }}:
            - task: AzureKeyVault@2
              displayName: 'Secrets from AKV'
              inputs:
                azureSubscription: "DevOpsSharedResources"
                KeyVaultName: "kv-azdevops-shared"
                SecretsFilter: >-
                  NEXUS-DEPS-USR, NEXUS-DEPS-PSW

          # ==================================================================
          # [Performance] Cache Maven (dependências)
          # ==================================================================
          - ${{ if eq(parameters.enableCache, true) }}:
            - task: Cache@2
              displayName: 'Cache Maven dependencies'
              inputs:
                key: 'maven | "$(Agent.OS)" | **/pom.xml'
                restoreKeys: |
                  maven | "$(Agent.OS)"
                  maven
                path: $(MAVEN_CACHE_FOLDER)

          # ==================================================================
          # [Versionamento] Definição da versão (VersionManager)
          # ==================================================================
          - task: VersionManagerVivo@8
            displayName: 'Next version'
            inputs:
              command: 'nextVersion'
              branchingStrategy: ${{ parameters.branchingStrategy }}
              versionFile: $(POM_FILE_PATH)
              bumpMethod: 'patch'
              passthroughVersion: ${{ parameters.prValidationOnly }}
            name: VersionManagerVivo
          # ==================================================================
          # [Validate] Validação das informações do projeto
          # ==================================================================
          - task: Maven@4
            displayName: 'Validate Project'
            inputs:
              goals: validate
              options: >-
                -s $(MAVEN_CUSTOM_SETTINGS)
                -Dmaven.repo.local=$(MAVEN_REPO_LOCAL)
              mavenPomFile: $(POM_FILE_PATH)
              mavenOptions: '-Xmx3072m'
              mavenVersionOption: 'Path'
              mavenDirectory: /home/svc_devopscorp/.asdf/installs/maven/3.9.9
              javaHomeOption: 'JDKVersion'
            env:
              ASDF_JAVA_VERSION: ${{ parameters.javaVersion }}
              MAVEN_CUSTOM_SETTINGS: $(MAVEN_CUSTOM_SETTINGS)
              NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
              NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
              AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)


          # ==================================================================
          # [Build] Compilação e empacotamento (pula testes nesta fase)
          # ==================================================================
          - task: Maven@4
            displayName: 'Build'
            inputs:
              goals: clean compile package
              options: >-
                -s $(MAVEN_CUSTOM_SETTINGS)
                -Dmaven.repo.local=$(MAVEN_REPO_LOCAL)
                -Dmaven.test.skip=true
              mavenPomFile: $(POM_FILE_PATH)
              mavenOptions: '-Xmx3072m'
              mavenVersionOption: 'Path'
              mavenDirectory: /home/svc_devopscorp/.asdf/installs/maven/3.9.9
              javaHomeOption: 'JDKVersion'
              publishJUnitResults: false
              workingDirectory: ${{ parameters.workingDirectory }}
            env:
              ASDF_JAVA_VERSION: ${{ parameters.javaVersion }}
              MAVEN_CUSTOM_SETTINGS: $(MAVEN_CUSTOM_SETTINGS)
              # DEVOPS_ARTIFACTS_PASSWORD: $(myConn.auth_password)
              NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
              NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
              AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              VERSION: $(VersionManagerVivo.VERSION)

          # ==================================================================
          # CAPACIDADE: TESTES UNITÁRIOS + COBERTURA (condicional enableTest)
          # Descrição: Executa testes (JUnit) e gera cobertura (JaCoCo) quando enableCoverage=true
          # Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/testes-unitarios
          # Pré-requisitos: plugins Surefire + JaCoCo configurados no pom.xml
          # Artefatos: relatórios JUnit XML + cobertura HTML/XML (quando cobertura habilitada)
          # ==================================================================
          - ${{ if eq(parameters.enableTest, true) }}:
            - task: Maven@4
              displayName: 'Run Tests ${{ parameters.enableCoverage }}'
              inputs:
                goals: 'test jacoco:report'
                options: >-
                  -B
                  -s $(MAVEN_CUSTOM_SETTINGS)
                  -Dmaven.repo.local=$(MAVEN_REPO_LOCAL)
                mavenPomFile: $(POM_FILE_PATH)
                mavenOptions: '-Xmx3072m'
                mavenVersionOption: 'Path'
                mavenDirectory: /home/svc_devopscorp/.asdf/installs/maven/3.9.9
                javaHomeOption: 'JDKVersion'
                publishJUnitResults: false
                workingDirectory: ${{ parameters.workingDirectory }}
              env:
                ASDF_JAVA_VERSION: ${{ parameters.javaVersion }}
                MAVEN_CUSTOM_SETTINGS: $(MAVEN_CUSTOM_SETTINGS)
                # DEVOPS_ARTIFACTS_PASSWORD: $(myConn.auth_password)
                NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
                NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
                AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

            # Publicação dos resultados dos testes
            - task: PublishTestResults@2
              displayName: 'Publish Test Results'
              condition: succeededOrFailed()
              inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '${{ parameters.workingDirectory }}/target/surefire-reports/*.xml'
                failTaskOnFailedTests: true
                mergeTestResults: true

            # Publicação da cobertura de código (condicional)
            - ${{ if eq(parameters.enableCoverage, true) }}:
              - task: PublishCodeCoverageResults@2
                displayName: 'Publish Code Coverage'
                condition: succeededOrFailed()
                inputs:
                  codeCoverageTool: 'JaCoCo'
                  summaryFileLocation: '${{ parameters.workingDirectory }}/target/site/jacoco/jacoco.xml'
                  reportDirectory: '${{ parameters.workingDirectory }}/target/site/jacoco'
#############################################################################
# CAPACIDADE: QUALITY GATE (SONARQUBE)
#############################################################################
# Descrição: Análise estática de código e quality gate
# Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/quality-gate
# Pré-requisitos:
#   - Service Connection 'SonarQube' configurada
#   - Projeto configurado no SonarQube
#   - Quality Gate definido no SonarQube
# Configuração: Parâmetro 'runQualityGate' = true
# Observações: Não executa em Pull Requests
#############################################################################
          - ${{ if eq(parameters.runQualityGate, true) }}:
            # ==================================================================
            # [SonarQube] Análise Completa de Qualidade de Código
            # ==================================================================
            - task: SonarAnalysisFromVivo@4
              displayName: 'SonarQube Full Analysis'
              inputs:
                command: 'analysis'
                SonarQubeVip: 'VIVO_SONARQUBE_VIP'
                SonarQube: 'VIVO_SONARQUBE'
                scannerMode: ${{ parameters.sonarScannerMode }}
                ${{ if eq(parameters.useSonarConfigFile, true) }}:
                  configFile: ${{ parameters.sonarConfigFilePath }}
                cliProjectKey: ${{ parameters.sonarProjectKey }}
                cliProjectName: ${{ parameters.sonarProjectName }}
                cliProjectVersion: $(VersionManagerVivo.VERSION)
                qualityGate: ${{ parameters.sonarQualityGate }}
                acronym: $(SIGLA)
                reportPath: '$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt'
                pollingTimeoutSec: ${{ parameters.sonarPollingTimeoutSec }}
                useOpaRepository: 'true'
                codePlayServiceConnection: 'CodePlay'
                opaProject: 'DVPS - DEVOPS'
                opaRepository: 'Vivo.OpenPolicy.SonarQube'
                opaBranch: 'master'
                useAppConfig: ${{ parameters.useAppConfig }}
                appConfigurationEndpoint: 'https://appcs-azdevops-shared.azconfig.io'
                azureSubscription: DevOpsSharedResources
                sonarUrlPemCertificate: $(Agent.HomeDirectory)/../../certs/CACORP.pem
                extraProperties: |
                  sonar.coverage.jacoco.xmlReportPaths=${{ parameters.workingDirectory }}/target/site/jacoco/jacoco.xml
                  sonar.java.binaries=${{ parameters.workingDirectory }}/target/classes
                  sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
                  sonar.qualitygate.wait=false
                  sonar.qualitygate.timeout=${{ parameters.sonarPollingTimeoutSec }}
              env:
                ASDF_JAVA_VERSION: ${{ parameters.sonarJavaVersion }}

          # ==================================================================
          # [Publicação] Publica artefato compilado para uso em stages seguintes (SCA Scan)
          # ==================================================================
          - task: CopyFiles@2
            displayName: 'Copy pom.xml to target directory'
            condition: succeeded()
            inputs:
              SourceFolder: '${{ parameters.workingDirectory }}'
              Contents: 'pom.xml'
              TargetFolder: '${{ parameters.workingDirectory }}/target'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Build Artifact for Security Analysis'
            condition: succeeded()
            inputs:
              targetPath: '${{ parameters.workingDirectory }}/target'
              artifactName: '${{ parameters.buildArtifactName }}'
              publishLocation: 'pipeline'

# ==================================================================
# STAGE: SECURITY ANALYSIS (PARALLEL)
# ==================================================================
  - stage: SecurityAnalysis
    displayName: 'Security Analysis'
    dependsOn:
    - JavaBuild
    condition: succeeded()
    jobs:

    - job: AppSecConfigKeys
      displayName: 'Get AppSec Config Keys'
      pool: ${{ parameters.agentPool }}
      steps:
      - template: /security/get_appconfig_keys_framework.yml
        parameters:
          azureSubscription: DevOpsSharedResources
          appConfigurationEndpoint: https://appcs-azdevops-shared.azconfig.io
          useNetworkProxy: ${{ parameters.useNetworkProxy }}

# ==================================================================
# CAPACIDADE: FORTIFY SCAN (SAST)
# ==================================================================
# Descrição: Análise estática de código (SAST) usando Fortify ScanCentral e SSC, com integração à Conviso e publicação de artefatos.
# Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog/sast
# Observações: Exporta variáveis e publica artefatos para uso no Security Gate.
# ==================================================================
    - job: FortifyScan
      displayName: 'Fortify Scan (SAST)'
      dependsOn:
      -  AppSecConfigKeys
      variables:
        USE_FORTIFY: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_FORTIFY'] ]
        USE_CONVISO: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_CONVISO'] ]
        SKIP_SECURITY_GATE: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
        FORTIFY_LOCAL_SCANCENTRAL_VERSION: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.FORTIFY_LOCAL_SCANCENTRAL_VERSION'] ]
      condition: and(succeeded(), eq(variables.USE_FORTIFY, true))
      pool: ${{ parameters.agentPool }}
      steps:

      - template: /security/define_appsec_app_version.yml

      - template: /security/run_fortify_scan.yml
        parameters:
          fortifyExclusionRepository: 'FortifyExclusion'
          enableFortifyExclusions:  ${{ parameters.enableFortifyExclusions }}
          appLanguage: 'java'
          appVersion: "$(FORTIFY_APP_VERSION)" # OBS: A variável FORTIFY_APP_VERSION é definida no template /security/define_appsec_app_version.yml

# ==================================================================
# CAPACIDADE: SCA SCAN (SCA)
# ==================================================================
# Descrição: Análise de composição de software (SCA) usando Dependency Track, com integração à Conviso e publicação de artefatos.
# Documentação: https://dvps.redecorp.azr/portal/codeplay/capacidades/catalog
# Observações: Exporta variáveis e publica artefatos para uso no Security Gate.
# ==================================================================

    - job: SCAScan
      displayName: 'SCA Scan'
      dependsOn: 
      - AppSecConfigKeys
      variables:
        USE_DEPENDENCY_TRACK: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]
        USE_DT_DOCKER: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
        USE_CONVISO: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_CONVISO'] ]
        SKIP_SECURITY_GATE_SCA: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]
      condition: and(
                    succeeded(),
                    eq(variables.USE_DEPENDENCY_TRACK, true)
                  )
      pool: ${{ parameters.agentPool }}
      steps:

      - template: /security/define_appsec_app_version.yml

      - template: /security/run_sca_scan.yml
        parameters:  
          appVersion: "$(FORTIFY_APP_VERSION)" # OBS: A variável FORTIFY_APP_VERSION é definida no template /security/define_appsec_app_version.yml
          buildArtifactName: ${{ parameters.buildArtifactName }}

# ==================================================================
# STAGE: PUBLISH ARTIFACT
# ==================================================================
  - ${{ if eq(parameters.prValidationOnly, false) }}:
    - stage: PublishArtifact
      displayName: 'Publish Artifact'
      dependsOn:
        - JavaBuild
        - SecurityAnalysis
      condition: succeeded()
      jobs:
        - job: DeployArtifact
          displayName: 'Deploy to Azure Artifacts'
          pool: ${{ parameters.agentPool }}
          steps:
            - checkout: self

            # ==================================================================
            # [Versionamento] Definição da versão (VersionManager)
            # ==================================================================
            - task: VersionManagerVivo@8
              displayName: 'Next version'
              inputs:
                command: 'nextVersion'
                branchingStrategy: ${{ parameters.branchingStrategy }}
                versionFile: $(POM_FILE_PATH)
                bumpMethod: 'patch'
              name: VersionManagerVivo
            # ==================================================================
            # [Deploy] Publicação do artefato no Azure Artifacts
            # ==================================================================
            - task: Maven@4
              displayName: 'Deploy Artifact to Azure Artifacts'
              inputs:
                goals: deploy
                options: >-
                  -B
                  -s $(MAVEN_CUSTOM_SETTINGS)
                  -Dmaven.repo.local=$(MAVEN_REPO_LOCAL)
                mavenPomFile: $(POM_FILE_PATH)
                mavenOptions: '-Xmx3072m'
                mavenVersionOption: 'Path'
                mavenDirectory: /home/svc_devopscorp/.asdf/installs/maven/3.9.9
                javaHomeOption: 'JDKVersion'
                publishJUnitResults: false
                workingDirectory: ${{ parameters.workingDirectory }}
              env:
                ASDF_JAVA_VERSION: ${{ parameters.javaVersion }}
                NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
                NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
                AZURE_DEVOPS_PAT: $(System.AccessToken)
                MAVEN_CUSTOM_SETTINGS: $(MAVEN_CUSTOM_SETTINGS)
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                VERSION: $(VersionManagerVivo.VERSION)

  # Stage 2: VersionCommit - Commit da nova versão (condicional, não PR validation)
  - ${{ if eq(parameters.prValidationOnly, false) }}:
    - stage: VersionCommit
      displayName: 'Commit Version'
      dependsOn:
        - JavaBuild
        - SecurityAnalysis
        - PublishArtifact
      condition: succeeded()
      jobs:
        - job: CommitVersion
          displayName: 'Commit Release Version'
          pool: ${{ parameters.agentPool }}
          steps:
            # ==================================================================
            # [Git] Checkout com credenciais para push
            # ==================================================================
            - checkout: self
              clean: true
              persistCredentials: true
              fetchDepth: 0

            # ==================================================================
            # [Versionamento] Reafirma versão e realiza commit/tag
            # ==================================================================
            - task: VersionManagerVivo@8
              displayName: 'Next version'
              inputs:
                command: 'nextVersion'
                branchingStrategy: ${{ parameters.branchingStrategy }}
                versionFile: $(POM_FILE_PATH)
                bumpMethod: 'patch'
              name: VersionManagerVivo

            - task: VersionManagerVivo@8
              displayName: 'Commit and Tag Version'
              inputs:
                command: 'commitVersion'
                version: '$(VersionManagerVivo.VERSION)'
                versionFile: $(POM_FILE_PATH)
                createTag: true
                pushChanges: true
