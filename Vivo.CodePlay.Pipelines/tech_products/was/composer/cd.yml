stages:
- stage: Deploy
  displayName: '🚀 Deploy ${{ variables[''Build.SourceBranchName''] }}'
  dependsOn: Publish
  condition: succeeded('Build')
  jobs:
   - job: Deploy
     displayName: '🚚 Deploy WAR'
     pool: GeneralPurposeLinuxAgentsCD
     steps:
     - task: DownloadPipelineArtifact@2
       displayName: '⬇️ Download WAR artifact'
       inputs:
        artifact: 'war_artifact'
        path: '$(Pipeline.Workspace)/war_artifact'

     - task: Bash@3
       displayName: '✏️ Rename WAR for deploy'
       inputs:
         targetType: inline
         script: |
           SUFIXO="$(SUFIXO_PACKAGE)"
           WAR_ORIGINAL="$(Pipeline.Workspace)/war_artifact/$(APP).war"
           WAR_DEPLOY="$(Pipeline.Workspace)/war_artifact/$(APP)$(SUFIXO).war"
           mv "$WAR_ORIGINAL" "$WAR_DEPLOY"

     - task: CopyFilesOverSSH@0
       name: CopyFiles
       displayName: '📤 Transfer WAR via SSH'
       inputs:
        sshEndpoint: $(SSH)
        contents: '**/*.war'
        readyTimeout: '20000'
        targetFolder: '/opt/web/applications/deploy'
        sourceFolder: '$(Pipeline.Workspace)/war_artifact'
        cleanTargetFolder: true

     - task: SSH@0
       name: DeployWar
       displayName: '🚀 Deploy WAR no WebLogic'
       inputs:
        sshEndpoint: $(SSH)
        runOptions: 'commands'
        commands: '$(JAVA_PATH_SSH) -cp $(WL_PATH_SSH) weblogic.Deployer -adminurl t3://$(IP):7000 -username $(WEBLOGIC_USER) -password $(WEBLOGIC_PASS) -targets $(CLUSTER) -redeploy -name $(APP)$(SUFIXO) -remote -upload -source /opt/web/applications/deploy/$(APP)$(SUFIXO).war'
        readyTimeout: '20000'