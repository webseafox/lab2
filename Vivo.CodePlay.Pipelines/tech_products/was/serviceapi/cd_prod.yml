                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_FIXA_CIC=$(WEBLOGIC_ADMIN_SERVER_URL_FIXA_CIC)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_FIXA_NDC=$(WEBLOGIC_ADMIN_SERVER_URL_FIXA_NDC)"
                echo "##[debug] Pipeline.Workspace=$(Pipeline.Workspace)"
                echo "##[debug] Build.SourcesDirectory=$(Build.SourcesDirectory)"
                echo "##[debug] deployMovelBRN=${{ parameters.deployMovelBRN }}"
                echo "##[debug] deployMovelCIC=${{ parameters.deployMovelCIC }}"
                echo "##[debug] deployMovelNDC=${{ parameters.deployMovelNDC }}"
                echo "##[debug] deployFixaBRN=${{ parameters.deployFixaBRN }}"
                echo "##[debug] deployFixaCIC=${{ parameters.deployFixaCIC }}"
                echo "##[debug] deployFixaNDC=${{ parameters.deployFixaNDC }}"
