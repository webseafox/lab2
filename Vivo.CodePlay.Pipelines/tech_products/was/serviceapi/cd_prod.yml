                    readyTimeout: '20000'

            - task: PowerShell@2
              displayName: '🏷️ Atualizando STATUS no VERSION.md'
              inputs:
                targetType: 'inline'
                script: |
                    $version = "${{ parameters.packageVersion }}"
                    $deployDate = Get-Date -Format "dd/MM/yyyy"
                    if (Test-Path "VERSION.md") {
                      $content = Get-Content "VERSION.md" -Raw
                      $lines = $content -split "`r?`n"
                      $versionUpdated = $false
                      for ($i = 0; $i -lt $lines.Length; $i++) {
                        # Procura pela linha da versão (com espaços variáveis) e "Not deployed"
                        if ($lines[$i] -match "^\|\s*$version\s*\|.*\|\s*Not deployed\s*\|") {
                          # Substitui "Not deployed" pela data atual, mantendo o resto da linha
                          $lines[$i] = $lines[$i] -replace "Not deployed", $deployDate
                          Write-Host "Versão $version marcada como deployada em $deployDate"
                          $versionUpdated = $true
                          break
                        }
                      }
                      if (-not $versionUpdated) {
                        Write-Warning "Versão $version não encontrada ou já deployada"
                      }
                      $newContent = $lines -join "`n"
                      $lastUpdated = Get-Date -Format "yyyy.MM.dd"
                      $newContent = $newContent -replace '\*Last updated: [^*]+\*', "*Last updated: $lastUpdated*"
                      Set-Content "VERSION.md" -Value $newContent -Encoding UTF8
                      Write-Host "VERSION.md atualizado - versão $version deployada"
                    } else {
                      Write-Error "VERSION.md não encontrado!"
                      exit 1
                    }
                workingDirectory: '$(Build.SourcesDirectory)'
            
            - task: CmdLine@2
              displayName: '📝 Commitando status de deploy no VERSION.md'
              inputs:
                script: |
                  git config user.email "azure-pipelines@telefonicati.onmicrosoft.com"
                  git config user.name "Azure Pipelines"
                  git checkout master || git checkout -b master
                  git add VERSION.md
                  git commit -m "chore: marca versão ${{ parameters.packageVersion }} como deployada"
                  git push origin master
                workingDirectory: '$(Build.SourcesDirectory)'
            
            - task: CmdLine@2
              displayName: '🔃 Sincronizando VERSION.md em todas as branchs remotas'
              inputs:
                script: |
                  BRANCH_NAME=$(echo $(Build.SourceBranch) | sed 's#refs/heads/##')
                  # ALTERAÇÃO: Garante que a branch principal existe localmente antes de copiar o VERSION.md
                  if ! git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
                    git fetch origin $BRANCH_NAME
                    git checkout $BRANCH_NAME
                  fi
                  # ...continua o script original...
                  for BRANCH in $(git branch -r | grep -v "$BRANCH_NAME" | grep -v '\->' | sed 's#origin/##'); do
                    echo "Sincronizando VERSION.md para $BRANCH"
                    git fetch origin $BRANCH || continue
                    git checkout $BRANCH
                    git pull origin $BRANCH
                    git checkout $BRANCH_NAME -- VERSION.md
                    git add VERSION.md
                    git commit -m "chore: sincroniza VERSION.md da branch $BRANCH_NAME - versão ${{ parameters.packageVersion }} deployada" || echo "Nada a commitar em $BRANCH, forçando push."
                    git status
                    git push --force origin $BRANCH
                  done
                workingDirectory: '$(Build.SourcesDirectory)'

