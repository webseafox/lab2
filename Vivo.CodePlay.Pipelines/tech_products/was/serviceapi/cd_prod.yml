parameters:
  - name: packageVersion
    displayName: 'Versão do pacote para deploy'
    type: string
  - name: environment
    displayName: 'Ambiente de destino'
    default: producao
    values:
      - producao
      - dev
  # - name: deployRotQA4
  #   type: boolean
  # - name: deployMovQA3
  #   type: boolean
  - name: deployMovelBRN
    displayName: 'Deploy URA Móvel BRN'
    type: boolean
    default: false
  - name: deployMovelCIC
    displayName: 'Deploy URA Móvel CIC'
    type: boolean
    default: false
  - name: deployMovelNDC
    displayName: 'Deploy URA Móvel NDC'
    type: boolean
    default: false
  - name: deployFixaBRN
    displayName: 'Deploy URA Fixa BRN'
    type: boolean
    default: false
  - name: deployFixaCIC
    displayName: 'Deploy URA Fixa CIC'
    type: boolean
    default: false
  - name: deployFixaNDC
    displayName: 'Deploy URA Fixa NDC'
    type: boolean
    default: false


stages:
- stage: Deploy
  displayName: '🚀 Deploy Produção'
  pool: GeneralPurposeLinuxAgentsCD
  
