          - task: SSH@0
            displayName: '🔗 Testa Conexao Movel BRN'
            inputs:
              sshEndpoint: 'SSH_WLS_WAS_URA_MOVEL_BRN_PRD'
              runOptions: 'inline'
              inline: >-
                echo "Conectado com sucesso via Service Connection SSH_WLS_WAS_URA_MOVEL_BRN_PRD"
                echo "Testando conectividade com AdminServer Movel BRN..."
                nc -z 10.128.11.242 7000 && echo "AdminServer Movel BRN está acessível na porta 7000" || echo "ERRO: AdminServer Movel BRN não está acessível!"
                ls -lha $(SCRIPTS_TARGETFOLDER) || echo "Diretório $(SCRIPTS_TARGETFOLDER) não existe ainda"
              readyTimeout: '20000'

