- name: COMMOM-PARAMTERS-MAVEN
  value: "clean ${{ parameters.config.params.maven.command }} -f ${{ parameters.config.params.maven.pathFilePom }} -s ${{ parameters.config.params.maven.pathFileSettings }} -Djava.awt.headless=true -Doracle.jdbc.timezoneAsRegion=false -Dmaven.repo.local=${{ parameters.config.params.maven.repoLocal }} -Dremote-server=${{ parameters.config.params.maven.remoteServer }} -DtipoTeste=${{ parameters.config.params.maven.testeType }} -Dmonitor=${{ parameters.config.params.maven.monitor }}"  
 # -X Debug -U força o Maven a atualizar as dependências antes de executar o build

stages:
  - stage: scenarios_exec
    displayName: "${{ parameters.config.params.description }} ${{ parameters.config.params.scenariosType }}"
    pool:
      name: GeneralPurposeLinuxAgentsCI
    jobs:
    - job: scenarios_exec
      displayName: "Execução do Cenário"
      condition: and(not(failed()), not(canceled()))
      timeoutInMinutes: 180
      cancelTimeoutInMinutes: 3 
      steps:
        - task: AzureKeyVault@2
          displayName: 'Recuperando credenciais'
          inputs:
            azureSubscription: DevOpsSharedResources
            KeyVaultName: kv-azdevops-shared
            secretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

        - task: Docker@2
          displayName: 'Fazendo autenticação'
          inputs:
            command: 'login'
            containerRegistry: ACR-DEVOPS
            timeoutInMinutes: 90

        - bash: | 
            echo "##[debug] comando maven $(maven_command)"
            echo "##[debug] parametro description: ${PARAM_DESCRIPTION}"
            echo "##[debug] parametro scenariosType: ${PARAM_SCENARIOS_TYPE}"
            echo "##[debug] parametro branch: ${PARAM_BRANCH}"
            echo "##[debug] parametro docker_image: ${PARAM_DOCKER_IMAGE}"
            echo "##[debug] parametro update_alm_tool: ${PARAM_UPDATE_ALM_TOOL}"
            echo "##[debug] parametro general: ${PARAM_GENERAL_JSON}"
            echo "##[debug] parametro inputs: ${PARAM_INPUTS_JSON}"
            echo "##[debug] parametro maven: ${PARAM_MAVEN_JSON}"
          displayName: "Maven command"
          env:
            PARAM_DESCRIPTION: "${{ parameters.description }}"
            PARAM_SCENARIOS_TYPE: "${{ parameters.scenariosType }}"
            PARAM_BRANCH: "${{ parameters.branch }}"
            PARAM_DOCKER_IMAGE: "${{ parameters.docker_image }}"
            PARAM_UPDATE_ALM_TOOL: "${{ parameters.update_alm_tool }}"
            PARAM_GENERAL_JSON: "${{ convertToJson(parameters.general) }}"
            PARAM_INPUTS_JSON: "${{ convertToJson(parameters.inputs) }}"
            PARAM_MAVEN_JSON: "${{ convertToJson(parameters.maven) }}"

        - bash: >- #shell
            docker run --rm 
            --user="$(id -u):$(id -g)" 
            --log-driver none 
            -e HTTPS_PROXY="$HTTPS_PROXY" 
