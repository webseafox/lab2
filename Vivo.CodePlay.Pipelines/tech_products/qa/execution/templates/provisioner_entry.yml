parameters:
- name: framework
  displayName: Framework utilizado para executar os testes
  type: string
- name: cenario
  displayName: Cenário de teste (arquivo .java)
  type: string
- name: optionals
  displayName: Parâmetros opcionais (maven)
  type: string
  default: ""
- name: docker_image
  displayName: Imagem docker para execução do teste
  type: string
- name: test_environment
  displayName: Environment
  type: string
- name: maven_settings
  type: string
- name: fail_pipeline
  type: boolean
- name: project_id
  type: string
  default: null
- name: enable_collect_metric
  type: boolean
  default: false
- name: extra_env
  displayName: Variáveis de ambiente extras para execução dos testes
  type: object
  default: {}
# Atalho para extra_env: lista de NOMES de variaveis do pipeline. O template
# gera o mapeamento $(NOME) sozinho, evitando repetir o nome duas vezes.
- name: extra_env_names
  displayName: Nomes de variaveis do pipeline a repassar ao container
  type: object
  default: []
- name: qa_proxy
  displayName: Proxy (host:porta) usado pelo container de execucao dos testes
  type: string
  default: ""
# Variable groups (Library) a serem vinculados a esta pipeline. Use quando as
# variaveis referenciadas em extra_env vierem de um grupo: declarar o grupo aqui
# garante que ele seja anexado ao pipeline gerado pelo template.
- name: variable_groups
  type: object
  default: []
# Habilita o modo debug do Maven (-X). Desligado por padrao porque o -X despeja
# todas as variaveis de ambiente no log ("[DEBUG] env.NOME: valor").
- name: maven_debug
  type: boolean
  default: false

## Initialize global variables
variables:
  - template: /tech_products/qa/execution/initialize/init.yml
    parameters:
      qa_proxy: ${{ parameters.qa_proxy }}
  - ${{ each group_name in parameters.variable_groups }}:
    - group: ${{ group_name }}

#resources:
#  repositories:
#    - repository: Metrics
#      name: MIGR-Framework-Qa-Automacao/testes.metrics-framework
#      type: git
#      ref: refs/heads/Metrics_AssertComplexityAzure
#      endpoint: CodePlay

stages:
  # Environment prep
  - template:  /tech_products/qa/execution/templates/ci/ci_environment.yml
    parameters:
      framework: "${{ parameters.framework }}"
  
  # Test Execution
  - template:  /tech_products/qa/execution/templates/ci/ci_test_execution.yml
    parameters:
      framework: "${{ parameters.framework }}"
      cenario: "${{ parameters.cenario }}"
      optionals: "${{ parameters.optionals }}"
      docker_image: "${{ parameters.docker_image }}"
      test_environment: "${{ parameters.test_environment }}"
      fail_pipeline: "${{ parameters.fail_pipeline }}"
      project_id: "${{ parameters.project_id }}"
      extra_env: ${{ parameters.extra_env }}
      extra_env_names: ${{ parameters.extra_env_names }}
      maven_debug: ${{ parameters.maven_debug }}
      enable_collect_metric: false
#      enable_collect_metric: "${{ parameters.enable_collect_metric }}"

  
  # Clean up
  - template:  /tech_products/qa/execution/templates/ci/ci_clean.yml