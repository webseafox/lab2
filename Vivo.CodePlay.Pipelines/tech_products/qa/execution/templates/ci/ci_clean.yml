stages:
- stage: ci_clean
  displayName: "CI - Clean"
  dependsOn: ci_test_execution
  condition: always()
  jobs:
  - job: ci_clean
    displayName: "Cleaning up agent"
    pool:
      name: $(PRIVATE_AGENT_QA)
      #demands:
      #- Agent.Version -equals 3.232.3
    steps:
    - checkout: none
    
    - task: DeleteFiles@1
      displayName: "Clean logs directory"
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: '*.log'
        removeSourceFolder: false

    - task: DeleteFiles@1
      displayName: "Clean build sources directory"
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '*'
        removeSourceFolder: false
    