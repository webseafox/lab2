stages:
- stage: ci_clean
  displayName: "CI - Clean"
  dependsOn: ci_test_execution
  condition: always()
  jobs:
  - job: ci_clean
    displayName: "Cleaning up agent"
    pool:
      name: TestRunnerAgentsWindows
    steps:
    - checkout: none
    
    - task: DeleteFiles@1
      displayName: "Clean logs directory"
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: '*.log'
        removeSourceFolder: false

    - task: PowerShell@2
      displayName: "Clean build checkout_env directory"
      inputs:
        targetType: 'inline'  # Especifica que o script é inline
        script: |
          Remove-item $(Agent.BuildDirectory)\checkout_env\*.* -Recurse -Force

    - task: PowerShell@2
      displayName: "Clean build sources directory"
      inputs:
        targetType: 'inline'  # Especifica que o script é inline
        script: |
          Remove-item $(Build.SourcesDirectory)\*.* -Recurse -Force
    