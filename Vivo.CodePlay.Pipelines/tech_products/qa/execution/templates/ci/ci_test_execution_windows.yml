parameters:
- name: cenario
  type: string
- name: optionals
  type: string
- name: docker_image
  type: string
- name: test_environment
  type: string
- name: framework
  type: string
- name: fail_pipeline
  type: boolean
- name: project_id
  type: string
- name: enable_collect_metric
  type: boolean

stages:
- stage: ci_test_execution
  displayName: "CI - Test Execution"
  dependsOn:
    - ci_environment

  variables:
    - name: SCRIPTS_FOLDER
      value: $(Agent.BuildDirectory)\checkout_env\Vivo.CodePlay.Pipelines\tech_products\qa\execution\scripts
    - name: SRC_FOLDER
      value: $(Agent.BuildDirectory)\checkout_env\src.src-test-atendimento_b2c_movel-v2
    - name: NEXUS_DEPS_USR
      value: $[ stageDependencies.ci_environment.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
    - name: NEXUS_DEPS_PSW
      value: $[ stageDependencies.ci_environment.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
    - name: JAVA_TOOL_OPTIONS
      value: '-Dfile.encoding=UTF-8 -agentlib:jvmhook'
      
  jobs:
  - job: ci_test_execution
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 2
    displayName: "Execução da(s) classe(s) ${{ parameters.cenario }}"
    pool:
      name: TestRunnerAgentsWindows
    steps:
    - task: PowerShell@2
      displayName: "DEBUG"
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "dir Build.SourcesDirectory:" -backgroundcolor green -foregroundcolor red
          dir $(Build.SourcesDirectory)
          Write-Host "dir Agent.BuildDirectory:" -backgroundcolor green -foregroundcolor red
          dir $(Agent.BuildDirectory)
          

    - checkout: self
      clean: true

    # Download the checkout_env artifact to get the context.
    - download: current
      artifact: 'checkout_env'
      displayName: Download checkout_env Artifact

    #- task: Bash@3
    #  displayName: "Set execute permissions for scripts"
    #  inputs:
    #    targetType: 'inline'
    #    script: |
    #      chmod +x $(SCRIPTS_FOLDER)/*
    #      ls -lha $(SCRIPTS_FOLDER)

    - task: PowerShell@2
      displayName: "DEBUG"
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "dir Build.SourcesDirectory:" -backgroundcolor green -foregroundcolor red
          dir $(Build.SourcesDirectory)
          Write-Host "dir Agent.BuildDirectory:" -backgroundcolor green -foregroundcolor red
          dir $(Agent.BuildDirectory)
          Write-Host "Get location (pwd)" -backgroundcolor green -foregroundcolor red
          Get-Location
    - task: PowerShell@2
      displayName: "Executing scenario(s)"
      inputs:
        filePath: '$(SCRIPTS_FOLDER)\exec_tests_windows.ps1'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        NEXUS_DEPS_USR: $(NEXUS_DEPS_USR)
        NEXUS_DEPS_PSW: $(NEXUS_DEPS_PSW)
        DEFAULT_MAX_MEMORY_BUILD: "$DEFAULT_MAX_MEMORY_BUILD"
        ENVIRONMENT: ${{ parameters.test_environment }}
        SCENARIOS: ${{ parameters.cenario }}
        OPTIONALS: ${{ parameters.optionals }}
        FRAMEWORK: ${{ parameters.framework }}
        DOCKER_IMAGE: ${{ parameters.docker_image }}
        CONTAINER_IMAGE: $(CONTAINER_IMAGE)
        SCRIPTS_FOLDER: $(SCRIPTS_FOLDER)
        AGENT_TMP_DIRECTORY: $(Agent.TempDirectory)
        ALM_USER: $(ALM_USER)
        ALM_PASSWORD: $(ALM_PASSWORD)
        PROJECT_ID: ${{ parameters.project_id }}
        ENABLE_COLLECT_METRIC: ${{ parameters.enable_collect_metric }}

    #- task: Bash@3 
    #  displayName: "Executing scenario(s)"
    #  inputs:
    #    targetType: 'inline'
    #    script: exec $(SCRIPTS_FOLDER)/build_scenario.sh
    #  env:
    #    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    #    NEXUS_DEPS_USR: $(NEXUS_DEPS_USR)
    #    NEXUS_DEPS_PSW: $(NEXUS_DEPS_PSW)
    #    DEFAULT_MAX_MEMORY_BUILD: "$DEFAULT_MAX_MEMORY_BUILD"
    #    ENVIRONMENT: ${{ parameters.test_environment }}
    #    SCENARIOS: ${{ parameters.cenario }}
    #    OPTIONALS: ${{ parameters.optionals }}
    #    FRAMEWORK: ${{ parameters.framework }}
    #    DOCKER_IMAGE: ${{ parameters.docker_image }}
    #    CONTAINER_IMAGE: $(CONTAINER_IMAGE)
    #    SCRIPTS_FOLDER: $(SCRIPTS_FOLDER)
    #    AGENT_TMP_DIRECTORY: $(Agent.TempDirectory)
    #    ALM_USER: $(ALM_USER)
    #    ALM_PASSWORD: $(ALM_PASSWORD)
    #    PROJECT_ID: ${{ parameters.project_id }}
    #    ENABLE_COLLECT_METRIC: ${{ parameters.enable_collect_metric }}

    - task: PowerShell@2
      displayName: "DEBUG"
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "dir Build.SourcesDirectory:" -backgroundcolor green -foregroundcolor red
          dir $(Build.SourcesDirectory)
    - publish: $(Agent.TempDirectory)
      displayName: Publish logs
      artifact: logs
      condition: always()

    - publish: $(Build.SourcesDirectory)/RunResults
      displayName: Publish RunResults
      artifact: RunResults
      condition: always()

    - task: PowerShell@2
      displayName: "Checking for failed tests"
      condition: ${{ eq(parameters.fail_pipeline, true) }}
      inputs:
        targetType: 'inline'  # Especifica que o script é inline
        script: |
          # Definindo o caminho para os resultados
          $resultsPath = "$(Build.SourcesDirectory)\RunResults"
          $failedTestsPath = "$(Build.SourcesDirectory)"
          $failPipeline = "${{ parameters.fail_pipeline }}"

          # Lógica para verificar se os resultados existem
          if (Test-Path $resultsPath) {
              Write-Host "Pasta RunResults encontrada no caminho $resultsPath"
          } else {
              Write-Host "Pasta RunResults NÃO foi encontrada no caminho $resultsPath"
              exit 1
          }
          
          if (($failPipeline -eq "True") -and (Test-Path -Path $failedTestsPath\failed_tests.txt)) {
              Write-Host "Um ou mais cenários de testes falharam"
              Get-Content -Path $failedTestsPath\failed_tests.txt
              exit 1
          } else {
              Write-Host "Os testes retornaram sucesso!!"
          }
      env:
        FAIL_PIPELINE: ${{ parameters.fail_pipeline }}
        BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
    
