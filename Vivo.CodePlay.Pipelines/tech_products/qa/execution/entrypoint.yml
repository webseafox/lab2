# Vivo Pipeline Core's entrypoint
# ===============================================================
#
# Usage sample for end user:
#
# trigger: none
#
# resources:
#   repositories:
#     - repository: CodePlay
#       name: DevOps/Vivo.CodePlay.Pipelines
#       type: git
#       ref: refs/heads/master
#       endpoint: CodePlay
#
# extends:
#   template: /tech_products/qa/execution/entrypoint.yml@CodePlay
#   parameters:
#     config:
#       pipelineType: qa
#       technology: java
#       modelName: scenarios_default
#       branchingStrategy: trunkbased
#       params:
#         framework: "${{ parameters.framework }}"
#         cenario: "${{ parameters.cenario }}"
#         optionals: "${{ parameters.optionals }}"
#         docker_image: "${{ parameters.docker_image }}"
#         test_environment: "${{ parameters.test_environment }}"
#         maven_settings: $(pwd)/settings.xml
#         qa_proxy: "${{ parameters.qa_proxy }}"          # opcional
#
# Valores aceitos em docker_image:
#   selenium              -> Chrome 102  (runtime:1.0.1)
#   selenium-v2           -> Chrome 151  (runtime:2.0.0)
#   selenium-xfcb-chrome  -> runtime:1.0.2
#   selenium-xfcb-edge    -> runtime:1.0.2
#   selenium-xfcb-firefox -> runtime:1.0.2
#   uftdeveloper          -> runtime:1.0.2
#   windows / windows-selenium -> provisioner Windows
#
# qa_proxy (opcional): proxy host:porta usado pelo container de execucao.
#   Quando nao informado, usa proxy.redecorp.br:8080.
#
# extra_env (opcional): variaveis repassadas ao container de execucao.
#   Os valores sao mascarados no log da pipeline.
#     params:
#       extra_env:
#         MY_API_TOKEN: $(MY_API_TOKEN)
#
# extra_env_names (opcional): atalho para extra_env quando o nome no container
#   e igual ao nome no pipeline. O template gera o mapeamento sozinho.
#     params:
#       extra_env_names:
#         - MY_API_TOKEN
#
# variable_groups (opcional): lista de variable groups (Library) a vincular.
#   Use quando as variaveis referenciadas em extra_env vierem de um grupo.
#   Precisa vir acompanhado de extra_env ou extra_env_names: o variable_groups
#   apenas VINCULA o grupo; sao os outros que atravessam a variavel ao container.
#   NAO use "variables:" na raiz da pipeline consumidora - colide com o
#   variables do template alvo do extends ("'variables' is already defined").
#     params:
#       variable_groups:
#         - "MeuGrupo-Secrets-QA"
#
# maven_debug (opcional, default false): habilita o -X do Maven.
#   Mantenha desligado: o -X despeja todas as variaveis de ambiente no log,
#   no formato "[DEBUG] env.NOME: valor". Sem ele o Maven roda com -e, que
#   preserva o stack trace completo em caso de erro.
#     params:
#       maven_debug: true
#
#  ===============================================================

parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    pipelineType: app # i.e. app, infra, api_gateway, automation
    technology: java  # i.e. java, nodejs, python, helm, terraform, axway, flutter, acr, azdo_extension, azure_artifacts
    modelName: api_default # i.e. bff_client_default, api_default, lib_default, chart_default, databricks_default, azure, mobile_default, purge (App Legacy names: trunkbasedmicroservicek8s, gitflowmicroservicek8s, azure/m1, api/m2), default
    branchingStrategy: "" # i.e. trunkbased, vivoflow (for "app" type pipelines only)

extends:
  ${{ if eq(parameters.config.params.docker_image, 'windows') }}: 
    template: /tech_products/qa/execution/templates/provisioner_entry_windows.yml
    parameters: "${{ parameters.config.params }}"
  ${{elseif eq(parameters.config.params.docker_image, 'windows-selenium') }}:
    template: /tech_products/qa/execution/templates/provisioner_entry_windows.yml
    parameters: "${{ parameters.config.params }}"
  ${{ else }}:
    template: /tech_products/qa/execution/templates/provisioner_entry.yml
    parameters: "${{ parameters.config.params }}"
  #   template: /tech_products/qa/execution/provisioners/${{ parameters.config.pipelineType }}/${{ parameters.config.branchingStrategy }}/${{ parameters.config.technology }}/${{ parameters.config.modelName}}/provisioner_entry_pr.yml
  # # CI/CD
  # ${{ elseif eq(parameters.config.pipelineType, 'app') }}:
  #   ${{ if or( eq(parameters.config.modelName, 'trunkbasedmicroservicek8s'), eq(parameters.config.modelName, 'api/m2') ) }}:     # Legacy model compatibility
  #     template: /tech_products/qa/execution/provisioners/${{ parameters.config.pipelineType }}/trunkbased/${{ parameters.config.technology }}/api_default/provisioner_entry.yml
  #   ${{ elseif or( eq(parameters.config.modelName, 'gitflowmicroservicek8s'), eq(parameters.config.modelName, 'api/m1') ) }}:    # Legacy model compatibility
  #     template: /tech_products/qa/execution/provisioners/${{ parameters.config.pipelineType }}/vivoflow/${{ parameters.config.technology }}/api_default/provisioner_entry.yml
  #   ${{ elseif eq(parameters.config.modelName, 'lib/m2') }}:                                                                     # Legacy model compatibility
  #     template: /provisioners/${{ parameters.config.pipelineType }}/trunkbased/${{ parameters.config.technology }}/lib_default/provisioner_entry.yml
  #   ${{ else }}:
  #     template: /tech_products/qa/execution/provisioners/${{ parameters.config.pipelineType }}/${{parameters.config.branchingStrategy}}/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry.yml
