parameters:
# Repassado para variables_global.yml. Vazio = usa o proxy padrao.
- name: qa_proxy
  type: string
  default: ""

variables:
- template: /tech_products/qa/execution/initialize/variables_global.yml
  parameters:
    qa_proxy: ${{ parameters.qa_proxy }}

# Variables for Docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.properties."java.version"  | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_NAME
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_GROUP
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULES
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.modules | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULE
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.modules.module | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_DEPENDENCY
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.dependencies.dependency | .[]' pom.xml)  
- name: DOCKER_CMD_EXTRACT_ARTIFACT_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_GROUP_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)


# java
- name: MAVEN_CACHE_FOLDER
  value: $(HOME)/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: ""
- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"

# helm
- name: DEFAULT_GENERIC_JAVA_CHART_NAME
  value: "generic-java-microservice"
- name: DEFAULT_GENERIC_JAVA_CHART_VERSION
  value: ""

# coverage_report
- name: COVERAGE_REPORT_SUMMARY_FILE_LOCATION
  value: "**/target/site/jacoco/jacoco.xml"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src/main/java/"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/target/site/jacoco"
- name: COVERAGE_REPORT_ADDITIONAL_FILE
  value: "**/*.exec"

# variables for app/java
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelos+Java"

# Variables for Pipeline Default
- name: BUMP_VERSION_ENABLED
  value: 'true'

# Variables for Docker
- name: DOCKER_REGISTRY
  value: vcr-docker.nexus.telefonica.com.br
- name: DOCKER_SERVICE_CONNECTION
  value: "VCR-DOCKER"
- name: DOCKER-REGISTRY-USERNAME
  value: ""
- name: DOCKER-REGISTRY-PASSWORD
  value: ""
- name: DOCKER_REGISTRY_EMAIL
  value: "arquiteturati@telefonica.com.br"
- name: DOCKER_CMD_USERNAME
  value: $(id -u)
- name: DOCKER_CMD_GROUP
  value: $(id -g)
- name: DOCKER_WORKDIR
  value: "/app"
- name: DOCKER_BUILDKIT # https://github.com/microsoft/azure-pipelines-tasks/issues/17893
  value: 1
- name: isNexusRegistry
  value: $[ contains(variables.DOCKER_DEFAULT_REGISTRY, 'nexus') ]