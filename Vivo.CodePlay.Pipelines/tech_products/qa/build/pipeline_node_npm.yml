# =========================================================
# QA Pipeline - Node.js Library (Reusable Wrapper)
# ---------------------------------------------------------
# Pipeline de QA para libs Node.js
# Reutiliza o pipeline corporativo sem duplicar templates
# =========================================================

parameters:
  # ==================================================================
  # Infraestrutura e Ambiente
  # ==================================================================
  - name: agentPool
    type: string
    default: 'GeneralPurposeLinuxAgentsCI'
    displayName: 'Agent Pool para execução'

  - name: useNetworkProxy
    type: boolean
    default: false
    displayName: 'Configurar proxy de rede para acesso externo'

  # ==================================================================
  # Configurações de NodeJS e Feed
  # ==================================================================
  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'
    displayName: 'Diretório do projeto NodeJS'

  - name: buildArtifactName
    type: string
    displayName: 'Nome do artefato de build'

  - name: getDependenciesFromNexus
    type: boolean
    default: false
    displayName: 'Usar Nexus para autenticação (true) ou Azure Artifacts (false)'

  # ==================================================================
  # Configurações de Versionamento e Validação
  # ==================================================================
  - name: prValidationOnly
    type: boolean
    default: true
    displayName: 'Executa apenas a validação (não publica nem gera versão)'

  - name: branchingStrategy
    type: string
    default: 'trunkbased'
    displayName: 'Estratégia de versionamento'
    values:
      - 'trunkbased'
      - 'vivoflow'
      - 'releaseflow'
      - 'gitlabflow'
      - 'gitlabflow-semantic'
      - 'custom'

  # ==================================================================
  # Configurações de Capacidades
  # ==================================================================
  - name: enableTest
    type: boolean
    default: false
    displayName: 'Habilitar execução de testes'

  - name: enableCache
    type: boolean
    default: true
    displayName: 'Habilitar cache de dependências npm'

  - name: runQualityGate
    type: boolean
    default: false
    displayName: 'Executar Quality Gate (SonarQube)'

  # ==================================================================
  # Configurações de Segurança
  # ==================================================================
  - name: enableFortifyExclusions
    type: boolean
    default: false
    displayName: 'Faz checkout do repositório Fortify Exclusions'

  # ==================================================================
  # Configurações de Publicação de Artefatos
  # ==================================================================
  - name: artifactPaths
    type: string
    default: |
      **/*
      !.git/**/*
      !.vscode/**/*
      !.idea/**/*
    displayName: 'Padrões de arquivos para publicar (glob patterns)'


extends:
  template: /framework/pipelines/ci/build-nodejs-lib/pipeline.yaml
  parameters:
    agentPool: ${{ parameters.agentPool }}
    useNetworkProxy: ${{ parameters.useNetworkProxy }}
    workingDirectory: ${{ parameters.workingDirectory }}
    buildArtifactName: ${{ parameters.buildArtifactName }}
    getDependenciesFromNexus: ${{ parameters.getDependenciesFromNexus }}
    versionFile: 'package.json'
    branchingStrategy: ${{ parameters.branchingStrategy }}
    prValidationOnly: ${{ parameters.prValidationOnly }}
    enableTest: ${{ parameters.enableTest }}
    enableCache: ${{ parameters.enableCache }}
    runQualityGate: ${{ parameters.runQualityGate }}
    enableFortifyExclusions: ${{ parameters.enableFortifyExclusions }}
    artifactPaths: ${{ parameters.artifactPaths }}