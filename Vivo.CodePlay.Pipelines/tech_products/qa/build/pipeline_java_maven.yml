## Parameters
parameters:
  - name: environment
    type: string
    default: ''
  - name: infrastructureType
    type: string
    default: 'cloud'
  - name: skipComponentTest
    type: boolean
    default: false
  - name: skipPackage
    type: boolean
    default: false
  - name: skipDeploy
    type: boolean
    default: false
  - name: mavenSettings
    type: string
    default: false
  - name: nexusRepository
    type: string
    default: false
  - name: skipPublish
    type: boolean
    default: false
  - name: skipTests
    type: boolean
    default: true
  - name: skipBumpVersion
    type: boolean
    default: false

## Resources
resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines
    - repository: OSSDevOps
      name: 'OSSD - OSS DEVOPS/helm-oss-default'
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines


## Initialize global variables
variables:
  - template: /tech_products/qa/build/initialize/variables_global.yml
    parameters:
      nexusRepository: ${{ parameters.nexusRepository }}
  - template: /tech_products/qa/build/initialize/variables_java.yml
    parameters:
      mavenSettings: ${{ parameters.mavenSettings }}
      skipTests: ${{ parameters.skipTests }}
  - template: /tech_products/qa/build/initialize/variables_gates.yml
  - template: /tech_products/qa/build/initialize/variables_docker.yml
  - ${{ if ne(parameters.skipDeploy, True) }}:
    - template: /tech_products/qa/build/initialize/variables_helm.yml

  # Override global variables, with variables set in Library/Variable Groups (Pipelines)
  # Use this to change the variables on runtime
  # - group: "${{ variables['Build.DefinitionName'] }}"

  - name: CORPORATE_WIKI_DOC_URL
    value: "TBD"

stages:

  ## CI Stage

  # Initialize Java environment
  - template: /tech_products/qa/build/initialize/java_environment.yml

  # Build for CI - Java
  - template: /tech_products/qa/build/templates/ci/ci_build_java_oss.yml

  # Initialize Gates environment
  - template: /tech_products/qa/build/initialize/gates_environment.yml

  # Security Gates (SonarQube)
  - template: /tech_products/qa/build/templates/ci/ci_quality_gate_oss.yml

  # Security Gates (Fortify)
  #- template: /tech_products/qa/build/templates/ci/ci_security_oss.yml
  #  parameters:
  #    fortifyExclusionRepository: FortifyExclusion

  # Publish Build for CI - Java
  - template: /tech_products/qa/build/templates/ci/ci_publish_java_oss.yml
    parameters:
      skipPublish: ${{ parameters.skipPublish }}
      skipBumpVersion: ${{ parameters.skipBumpVersion }}

  # Package for CI - Java
  - ${{ if ne(parameters.skipPackage, True) }}:
    - template: /tech_products/qa/build/templates/ci/ci_package_oss.yml
