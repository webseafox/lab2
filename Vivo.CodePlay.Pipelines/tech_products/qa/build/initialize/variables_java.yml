parameters:
- name: mavenSettings
  type: string
  default: ''
- name: skipTests
  type: boolean
  default: true

variables:

# Variables for java
- name: JAVA_CMD_BUILD
  value: 'mvn clean install'
- name: JAVA_CMD_BUILD_TEST
  value: ''

- ${{ if eq(parameters.skipTests, true) }}:
  - name: JAVA_CMD_OPTIONAL
    value: '-DskipTests'
- ${{ else }}:
  - name: JAVA_CMD_OPTIONAL
    value: ''

# Variables for Maven 
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: "${{ parameters.mavenSettings }}"
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: ""
- name: JAVA_VERSION_PUBLISH_MVN 
  value: "openjdk-11.0.2"

# Variables to extract data with docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: (docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r .project.version pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION
  value: (docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r '.project.properties."java.version"  | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULES
  value: "docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r 'try .project.modules | .[]' pom.xml"
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULE
  value: "docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r 'try .project.modules.module | .[]' pom.xml"
- name: DOCKER_CMD_EXTRACT_POM_XML_DEPENDENCY
  value: (docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r '.project.dependencies.dependency | .[]' pom.xml)  
- name: DOCKER_CMD_EXTRACT_ARTIFACT_ID
  value: (docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_GROUP_ID
  value: (docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) acrsharedservices01.azurecr.io/external/hub/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)

# Variables for coverage_report for java
- name: COVERAGE_REPORT_SUMMARY_FILE_LOCATION
  value: "**/target/site/jacoco/jacoco.xml"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src/main/java/"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/target/site/jacoco"
- name: COVERAGE_REPORT_ADDITIONAL_FILE
  value: "**/*.exec"

# Variables for script path

- name: SCRIPTS_FOLDER_JAVA_ENV
  value: $(Agent.BuildDirectory)/s/Vivo.CodePlay.Pipelines/tech_products/qa/build/scripts/java_environment
- name: SCRIPTS_FOLDER_JAVA_BUILD
  value: $(Agent.BuildDirectory)/checkout_env/Vivo.CodePlay.Pipelines/tech_products/qa/build/scripts/ci_build_java_oss