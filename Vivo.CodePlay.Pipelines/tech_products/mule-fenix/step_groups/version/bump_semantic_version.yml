parameters:
- name: name
  type: string
  default: increment_version

steps:
- template: /tech_products/mule-fenix/steps/version/get_semver_by_tag.yml
  parameters:
    isJobOutput: "false"
    outputVariable: "CURRENT_VERSION"

- template: /tech_products/mule-fenix/steps/maven/extract_from_pom.yml
  parameters:
    pomProperty: "project.version"
    isJobOutput: "false"
    outputVariable: "CURRENT_VERSION"
    name: "pom_reference"
    condition: eq(variables['CURRENT_VERSION'], '')

- template: /tech_products/mule-fenix/steps/version/increment_version.yml
  parameters:
    name: ${{ parameters.name }}