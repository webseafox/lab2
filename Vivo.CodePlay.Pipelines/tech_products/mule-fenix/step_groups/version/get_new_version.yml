steps:
- template: /tech_products/mule-fenix/steps/version/get_semver_by_tag.yml
  parameters:
    isJobOutput: "false"
    outputVariable: "CURRENT_VERSION"

- template: /tech_products/mule-fenix/steps/maven/extract_from_pom.yml
  parameters:
    pomProperty: "project.version"
    isJobOutput: "false"
    outputVariable: "CURRENT_VERSION"
    name: "pom_reference"
    condition: eq(variables['CURRENT_VERSION'], '')

- script: |
    echo "Current version: $CURRENT_VERSION"
    if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
      IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$CURRENT_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
      if (( PATCH > 0 )); then
        ((PATCH--))
      fi
      CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
    fi
    echo "Normalized current version: $CURRENT_VERSION"
    echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=false]$CURRENT_VERSION"
  displayName: "Normalize current version"
  env:
    CURRENT_VERSION: $(CURRENT_VERSION)

- template: /tech_products/mule-fenix/steps/version/increment_version.yml
  parameters:
    name: increment_version

- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
  - script: |
      echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$NEW_VERSION"
    name: versioning
    env:
      NEW_VERSION: $(increment_version.NEW_VERSION)

- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
  - template: /tech_products/mule-fenix/steps/version/get_dev_build_version.yml
    parameters:
      name: versioning
      semanticVersion: $(increment_version.NEW_VERSION)

- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
  - template: /tech_products/mule-fenix/steps/version/get_release_build_version.yml
    parameters:
      name: versioning
      semanticVersion: $(increment_version.NEW_VERSION)