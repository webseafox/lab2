parameters:
- name: environment
  type: string
- name: version
  type: string
    
variables:
- template: /tech_products/mule-fenix/provisioners/mule/release/variables/load.yml

stages:
- template: /tech_products/mule-fenix/provisioners/mule/release/stages/init.yml
  parameters:
    environment: ${{ parameters.environment }}
- template: /tech_products/mule-fenix/provisioners/mule/release/stages/deploy.yml
  parameters:
    version: ${{ parameters.version }}