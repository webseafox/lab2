parameters:
- name: environment
  type: string
  
stages:
- stage: init
  displayName: 'Pipeline initialization'
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: find_artifact_id
    displayName: 'Find artifact id'
    steps:
    - template: /tech_products/mule-fenix/steps/maven/extract_from_pom.yml
      parameters:
        isJobOutput: "true"
        pomProperty: "project.artifactId"
        outputVariable: "ARTIFACT_ID"
        name: "pom_reference"

  - job: get_env_config
    displayName: "Getting Environment Configuration"
    steps:
    - checkout: CodePlay

    - script: |
        echo "Allowed environments: $ALLOWED_DEPLOY_ENVIRONMENTS"
        echo "Choosen environment: ${{ parameters.environment }}"
        IFS=',' read -r -a ALLOWED_ENVS <<< "$ALLOWED_DEPLOY_ENVIRONMENTS"

        for ENV in "${ALLOWED_ENVS[@]}"; do
            if [[ "$ENV" == "${{ parameters.environment }}" ]]; then
                exit 0
            fi
        done
        exit 1
      displayName: "Validating environment choice"
      env:
        ALLOWED_DEPLOY_ENVIRONMENTS: $(ALLOWED_DEPLOY_ENVIRONMENTS)

    - template: /tech_products/mule-fenix/steps/extract_env_config.yml@CodePlay
      parameters:
        envConfigName: ${{ parameters.environment }}