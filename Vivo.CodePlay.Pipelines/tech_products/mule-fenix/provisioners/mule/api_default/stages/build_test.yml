stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn: pipeline_init
  variables:
    NEW_VERSION: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
    PROPERTIES_FILE_NAME: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.PROPERTIES_FILE_NAME'] ]
    ANYPOINT_ENVIRONMENT: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ANYPOINT_ENVIRONMENT'] ]
    ARTIFACT_ID: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: build_test
    displayName: "Build & Test"
    variables:
      SKIP_UNIT_TESTS: $[ ne(variables['Build.SourceBranchName'], 'dev') ]
      EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT: $[ lower(coalesce(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED'], false)) ]
      EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH: $[ lower(containsValue(split(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BRANCHES'], ','), variables['Build.SourceBranchName'])) ]
    steps:

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)

    - template: /tech_products/mule-fenix/steps/properties/extract_properties.yml
      parameters:
        file: src/main/resources/properties/$(PROPERTIES_FILE_NAME)
        propertiesField: unitTestProperties
        outputVariable: UNIT_TEST_PROPS

    - task: Maven@4
      condition: eq(variables['isBumpingVersion'], true)
      displayName: 'Setting new version'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'versions:set'
        options: '-DnewVersion=$(NEW_VERSION)'

    - script: |
          echo "##vso[task.logissue type=warning;] Tests execution was disabled."
          echo "##vso[task.complete result=SucceededWithIssues;]"
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], true))
      displayName: Tests config validation

    - script: |
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
          echo "##[debug] ANYPOINT_ENVIRONMENT: $ANYPOINT_ENVIRONMENT"
          echo "##[debug] ---------------------------------"

          if [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT" == "true" ] || [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH" == "true" ]; then
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(EXCLUSIVE_UNIT_TESTS_PROPERTIES)"
          else
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $ANYPOINT_ENVIRONMENT"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(ANYPOINT_ENVIRONMENT)"
          fi
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      displayName: Defining unit tests properties

    - task: Maven@4
      displayName: 'Executing unit tests'
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      continueOnError: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean test'
        options: >
          -s $(muleSettings.secureFilePath)
          -Djava.net.useSystemProxies=true
          -Dsecurity.key=$(MULE_SECURITY_KEY)
          -Denv=$(UNIT_TESTS_ENV_PROPERTIES)
          $(UNIT_TEST_PROPS)
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)

    - task: PublishTestResults@2
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], false))
      continueOnError: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        publishRunAttachments: false
        failTaskOnFailedTests: true

    - task: Maven@4
      displayName: 'Executing maven build'
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean install'
        options: >
          -s $(muleSettings.secureFilePath)
          -Djava.net.useSystemProxies=true
          -Dsecurity.key=$(MULE_SECURITY_KEY)
          -Denv=$(ANYPOINT_ENVIRONMENT)
          -DskipTests=true
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)

    - task: CopyFiles@2
      displayName: 'Copy to Staging Directory'
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          **/*
          !.git/**/*
          !?/**/*
          !**/*.log

    - task: PublishPipelineArtifact@1
      displayName: 'Publishing pipeline artifact'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: app
        publishLocation: pipeline