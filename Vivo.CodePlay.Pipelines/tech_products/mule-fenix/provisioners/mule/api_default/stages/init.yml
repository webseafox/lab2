stages:
- stage: pipeline_init
  displayName: "Pipeline initialization"
  condition: and(eq(variables['SKIP_LEGACY_PIPELINE'], 'false'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
  variables:
  - name: BRANCH_NAME
    value: $[ coalesce(variables['System.PullRequest.targetBranchName'], variables['Build.SourceBranchName']) ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: get_env_config
    displayName: "Getting Environment Configuration"
    steps:
    - checkout: CodePlay

    - template: /tech_products/mule-fenix/steps/extract_env_config.yml@CodePlay
      parameters:
        envConfigName: $(BRANCH_NAME)

  - job: prepare_pipeline
    displayName: "Prepare"
    steps:
    - template: /tech_products/mule-fenix/steps/maven/extract_from_pom.yml
      parameters:
        pomProperty: "project.artifactId"
        outputVariable: "ARTIFACT_ID"
        name: "pom_reference"

    - task: CopyFiles@2
      displayName: "Copy catalog-info.yaml to Staging Directory"
      inputs:
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          catalog-info.yaml

    - task: PublishPipelineArtifact@1
      displayName: "Publish catalog-info.yaml"
      inputs:
        artifactName: "catalog-info"
        targetPath: "$(Build.ArtifactStagingDirectory)"

  - job: get_new_version
    displayName: "Get new version"
    steps:
    - template: /tech_products/mule-fenix/step_groups/version/get_new_version.yml