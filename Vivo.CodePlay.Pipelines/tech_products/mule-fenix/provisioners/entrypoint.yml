# Fnix Pipeline Core's entrypoint
# ===============================================================
#
# Usage sample for end user:
#
# resources:
#   repositories:
#     - repository: CodePlay
#       name: DevOps/Vivo.CodePlay.Pipelines
#       type: git       
#       ref: refs/heads/master
#       endpoint: CodePlay
#
# extends:
#   template: /tech_products/mule-fenix/provisioners/entrypoint.yml@CodePlay
# ===============================================================

parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    technology: mule  # i.e. mule, brm_java, brm_c
    modelName: api_default # i.e. api_default, lib_default, default

# Template selection switches based on pipeline configuration parameters
extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/mule-fenix/provisioners/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry_pr.yml
  ${{ else }}:
    template: /tech_products/mule-fenix/provisioners/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry.yml
  ${{ if parameters.config.params }}:
    parameters: ${{ parameters.config.params }}