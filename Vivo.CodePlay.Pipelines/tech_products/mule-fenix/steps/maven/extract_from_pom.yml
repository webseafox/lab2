parameters:
- name: pomProperty
- name: isJobOutput
  type: string
  default: "true"
- name: outputVariable
- name: workingDirectory
  default: '$(Build.SourcesDirectory)'
- name: name
- name: condition
  type: object
  default: True

steps:
- script: |
      if [ ! -f "pom.xml" ]; then
        echo "##vso[task.logissue type=error] Unable to find pom.xml file."
        exit 1
      fi

      eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .${{ parameters.pomProperty }} pom.xml)
      if [ -z "$PROP_VALUE" ]; then
        echo "##[debug] Unable to find \"${{ parameters.pomProperty }}\" on pom.xml file. Trying again..."
        eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .${{ parameters.pomProperty }} pom.xml)    
        if [ -z "$PROP_VALUE" ]; then
          echo "##vso[task.logissue type=error] Unable to find \"${{ parameters.pomProperty }}\" on pom.xml file."
          exit 1
        fi
      fi

      echo "##[debug] Exporting \"${{ parameters.pomProperty }}\" property with value \"${PROP_VALUE}\" to output variable \"${{ parameters.outputVariable }}\"."
      echo "##vso[task.setvariable variable=${{ parameters.outputVariable }};isoutput=${{ parameters.isJobOutput }}]$PROP_VALUE"
  displayName: 'Getting ${{ parameters.pomProperty }} from pom.xml'
  name: ${{ parameters.name }}
  condition: ${{ parameters.condition }}
  workingDirectory: ${{ parameters.workingDirectory }}
