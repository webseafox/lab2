parameters:
- name: file
- name: propertiesField
- name: outputVariable
- name: workingDirectory
  default: $(Build.SourcesDirectory)

steps:

- script: |
    echo "##vso[task.setvariable variable=${{ parameters.outputVariable }}]"
    if [ ! -f "${{ parameters.file }}" ]; then
        echo "The file '${{ parameters.file }}' does not exist."
        exit 0
    fi
    PROPS=$(yq '.${{ parameters.propertiesField }} | select (.!=null)' ${{ parameters.file }} | tr -d ':' | awk '{print $1}')
    if [ -z "$PROPS" ]; then
        echo "The field '${{ parameters.propertiesField }}' does not exist."
        exit 0
    fi
    for PROP in $PROPS; do
      PROPERTIES_ARGS_STRING="$PROPERTIES_ARGS_STRING -D$PROP=$(yq ".${{ parameters.propertiesField }}.$PROP" ${{ parameters.file }})"
    done
    echo "##vso[task.setvariable variable=${{ parameters.outputVariable }}]${PROPERTIES_ARGS_STRING}"
  displayName: Extracting properties from config file
  workingDirectory: ${{ parameters.workingDirectory }}