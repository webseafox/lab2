parameters:
- name: newVersion
  type: string
- name: tagRepo
  type: boolean
  default: false

steps:
- checkout: self
  persistCredentials: "true"
  clean: true

- bash: |
    git config --global --replace-all user.name "Azure DevOps"
    git config --global --replace-all user.email "azuredevops@telefonicati.onmicrosoft.com"

    git config pull.rebase true
    git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
    git checkout -f ${BRANCH_NAME}
  displayName: "Preparation"
  env:
    BRANCH_NAME: "$(UPDATE_VERSION_BRANCH_NAME)"

- task: Maven@4
  displayName: 'Setting new version'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'versions:set'
    options: '-DnewVersion=${{ parameters.newVersion }}'

- bash: |
    git add pom.xml
    git commit -am "[CI SKIP] Project version has been updated. Released version '${NEW_VERSION}'"


    TAG_PUSH_PARAM=""
    if [[ "${TAG_REPO}" == "True" ]]; then
      echo "##[debug] Creating tag ${NEW_VERSION}."
      TAG_PUSH_PARAM="--tags"

      git tag ${NEW_VERSION}
    fi

    git push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}
    
    if [ $? -ne 0 ]; then 
      echo "##vso[task.logissue type=error;] Git push failed. Permission denied"
      echo "##vso[task.complete result=Failed;]"
      exit 1
    fi  

    echo "Version updated to ${NEW_VERSION}"
  displayName: 'Commit Updated Version'
  env:
    BRANCH_NAME:  "$(UPDATE_VERSION_BRANCH_NAME)"
    NEW_VERSION: "${{ parameters.newVersion }}"
    TAG_REPO: "${{ parameters.tagRepo }}"