parameters:
- name: outputVariable
  type: string
  default: "NEW_VERSION"
- name: name
  type: string
  default: "increment_version"

steps:
- script: |
    echo "version: $CURRENT_VERSION"
    echo "outputVariable: ${{ parameters.outputVariable }}"
    NEW_VERSION=$(echo ${CURRENT_VERSION} | awk -F. -v OFS=. '{$NF += 1 ; print}')

    echo "${{ parameters.outputVariable }}: ${NEW_VERSION}"
    echo "##vso[task.setvariable variable=${{ parameters.outputVariable }};isOutput=true]${NEW_VERSION}"
  name: ${{ parameters.name }}
  displayName: "Incrementing version"
  env:
    CURRENT_VERSION: $(CURRENT_VERSION)