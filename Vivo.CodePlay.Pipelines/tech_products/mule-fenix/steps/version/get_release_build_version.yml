parameters:
- name: semanticVersion
  type: string
- name: isJobOutput
  type: string
  default: "true"
- name: outputVariable
  type: string
  default: "NEW_VERSION"
- name: name
  type: string
  default: "release_version"

steps:
- script: |
    RELEASE_TAGS=$(git tag -l | grep -E "^[0-9]+\.[0-9]+\.[0-9]+-$BRANCH_NAME\.[0-9]+$")
    echo "##[debug] Release tags: $RELEASE_TAGS"

    if [ -z "$RELEASE_TAGS" ]; then
      echo "##[debug] Nenhuma tag para release ${BRANCH_NAME} encontrada."
      CURRENT_VERSION="${BRANCH_NAME}.0"
    else
      CURRENT_VERSION=$(echo "$RELEASE_TAGS" | sed "s/.*-\($BRANCH_NAME\.[0-9]*\)/\1/" | sort -V | tail -n 1)
    fi

    SEQUENTIAL_NUMBER="${CURRENT_VERSION##*.}"

    NEW_VERSION="${INCREMENTED_SEM_VER}-${BRANCH_NAME}.$((SEQUENTIAL_NUMBER + 1))"
    echo "##[debug] New release version: $NEW_VERSION"
    echo "##vso[task.setvariable variable=${{ parameters.outputVariable }};isOutput=${{ parameters.isJobOutput }}]${NEW_VERSION}"
  env:
    BRANCH_NAME: $(Build.SourceBranchName)
    INCREMENTED_SEM_VER: ${{ parameters.semanticVersion }}
  displayName: Getting release build version
  name: ${{ parameters.name }}