parameters:
- name: semanticVersion
  type: string
- name: isJobOutput
  type: string
  default: "true"
- name: outputVariable
  type: string
  default: "NEW_VERSION"
- name: name
  type: string
  default: "dev_build_version"

steps:
- script: |
      NEW_VERSION="${INCREMENTED_SEM_VER}-${BUILD_NUMBER}-${BUILD_ID}"
      echo "##[debug] NEW_VERSION=${NEW_VERSION}"
      echo "##vso[task.setvariable variable=${{ parameters.outputVariable }};isOutput=${{ parameters.isJobOutput }}]${NEW_VERSION}"
  displayName: Getting dev build version
  name: ${{ parameters.name }}
  env:
    BUILD_ID: $(Build.BuildId)
    BUILD_NUMBER: $(Build.BuildNumber)
    INCREMENTED_SEM_VER: ${{ parameters.semanticVersion }}