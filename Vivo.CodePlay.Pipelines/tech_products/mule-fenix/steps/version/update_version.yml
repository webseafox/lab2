parameters:
- name: variableGroupName
- name: versionName
- name: versionValue

steps:
- script: |
    echo "variableGroupName: ${{ parameters.variableGroupName }}"
    echo "versionName: ${{ parameters.versionName }}"
    echo "versionValue: ${{ parameters.versionValue }}"

    az devops configure -d organization="https://dev.azure.com/telefonica-vivo-brasil/"
    az devops configure -d project="FNIX - Fenix"
    RESPONSE=$(az pipelines variable-group list --group-name ${{ parameters.variableGroupName }})
    echo "RESPONSE: $RESPONSE"
    GROUP_ID=$(echo $RESPONSE | jq -r '.[0].id')
    OLD_VALUE=$(echo $RESPONSE | jq -r '.[0].variables.${{ parameters.versionName }}')

    echo "OLD_VALUE: $OLD_VALUE"
    if [ "$OLD_VALUE" == "null" ]; then
      az pipelines variable-group variable create --group-id $GROUP_ID --name ${{ parameters.versionName }} --value ${{ parameters.versionValue }}
    else
      az pipelines variable-group variable update --group-id $GROUP_ID --name ${{ parameters.versionName }} --value ${{ parameters.versionValue }}
    fi
  displayName: Updating version on Library
  env:
    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    HTTP_PROXY: $(PROXY_AGENT_HTTP)
    HTTPS_PROXY: $(PROXY_AGENT_HTTPS)