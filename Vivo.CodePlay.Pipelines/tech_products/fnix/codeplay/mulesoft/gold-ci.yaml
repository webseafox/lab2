parameters:

- name: variable_groups
  displayName: Lista de Variables Groups para complementar variaveis e segredos.
  default: []
  type: object

variables:
- name: System.debug
  value: 'true'
- ${{ each group_name in parameters.variable_groups }}:
  - group: ${{ group_name }}

- { name: poc_propertiesFileName, value: "B2B-DEV-FENIX.yaml" }
- { name: poc_anypointEnv, value: "B2B-DEV-FENIX" }
- { name: poc_anypointEnvAppName, value: "dev" }
- { name: poc_envHealthEndpoint, value: "dev" }

- { name: dev_propertiesFileName, value: "B2B-DEV-FENIX.yaml" }
- { name: dev_anypointEnv, value: "B2B-DEV-FENIX" }
- { name: dev_anypointEnvAppName, value: "dev" }
- { name: dev_envHealthEndpoint, value: "dev" }

- { name: esteira01_propertiesFileName, value: "B2B-Esteira1.yaml" }
- { name: esteira01_anypointEnv, value: "B2B-Esteira1" }
- { name: esteira01_anypointEnvAppName, value: "qa1" }
- { name: esteira01_envHealthEndpoint, value: "esteira1" }

- { name: esteira02_propertiesFileName, value: "B2B-Esteira2.yaml" }
- { name: esteira02_anypointEnv, value: "B2B-Esteira2" }
- { name: esteira02_anypointEnvAppName, value: "qa2" }
- { name: esteira02_envHealthEndpoint, value: "esteira2" }

- { name: preprod_propertiesFileName, value: "B2B-PreProd.yaml" }
- { name: preprod_anypointEnv, value: "B2B-PreProd" }
- { name: preprod_anypointEnvAppName, value: "preprod" }
- { name: preprod_envHealthEndpoint, value: "preprod" }

- { name: prodlike_propertiesFileName, value: "B2B-Prodlike.yaml" }
- { name: prodlike_anypointEnv, value: "B2B-Prodlike" }
- { name: prodlike_anypointEnvAppName, value: "prodlike" }
- { name: prodlike_envHealthEndpoint, value: "prodlike" }

- { name: master_propertiesFileName, value: "B2B-Producao.yaml" }
- { name: master_anypointEnv, value: "B2B-Producao" }
- { name: master_anypointEnvAppName, value: "prod" }
- { name: master_envHealthEndpoint, value: "prod" }

stages:
- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    displayName: 'Jira Commit Integration'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Regex@4
      displayName: 'Filter Commit Message'
      inputs:
        source: $(Build.SourceVersionMessage)
        regex: '/^[^:]+ {0,}: {0,}(([^| ]+) {0,}\| {0,}([^| ]+) {0,}\| {0,}(.+) {0,})/gm'


    - task: TypeScriptRunner@4
      displayName: 'Get Commit Info'
      condition: eq(variables['REGEX_HAS_MATCH'], 'true')
      inputs:
        azureDevOpsEndpoint: 'Azure DevOps Api Generic'
        script: |- # typescript
          const { BUILD_REPOSITORY_ID } = process.env;
          const commits = await (await connection.getGitApi()).getCommits(BUILD_REPOSITORY_ID, {$top: 1});
          
          set_variable('COMMITTER_NAME)', commits[0].committer.name);
          set_variable('COMMIT_DATE)', commits[0].committer.date);

    # - task: KafkaProducer@0.0.16
    #   displayName: 'Publicar informações no tópico'
    #   condition: eq(variables['REGEX_HAS_MATCH'], 'true')
    #   inputs:
    #     kafkaOamEndpoint: 'KafkaEsteiraDigitalProd'
    #     kafkaProducerClientId: 'esteira-digital-group'
    #     kafkaServer: 'oauth.bootstrap.apps.ocp-kafka-prd.redecorp.br:443'
    #     commitDate: $(COMMIT_DATE)
    #     commitId: $(Build.SourceVersion)
    #     commitMessage: $(Build.SourceVersionMessage)
    #     committerName: $(COMMITTER_NAME)
    #     repoName: $(Build.Repository.Name)
    #     kafkaTopic: "integracao-azure-jira-branch-master"
    #     debug: true

  - job:
    displayName: 'Build, Unit Test and Pack'
    variables:
    - name: ASDF_JDK_8
      value: "adoptopenjdk-8.0.352+8"
    - name: ASDF_JDK_11
      value: "openjdk-11.0.2"
    - name: ASDF_JDK_17
      value: "openjdk-17.0.2"
    - name: ASDF_JDK_21
      value: "adoptopenjdk-21.0.4+7.0.LTS"

    - name: ASDF_JDK_SAP17
      value: "sapmachine-17.0.10"

    - name: SONARQUBE_PROJECT_NAME
      value: "$(System.TeamProject)-$(Build.Repository.Name)"

    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: XmlParseFromVivo@4
      displayName: 'Get pom.xml info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - task: TemplateInline@4
      displayName: 'Branch name'
      inputs:
        sourceType: 'text'
        source: |
          var BRANCH_NAME = BUILD_SOURCEBRANCH | replace(r/refs\/[^\/]+\//, '')

    - task: TemplateInline@4
      displayName: 'Bind "Mule Env Config"'
      inputs:
        autoSurround: false
        sourceType: 'text'
        source: |
          var PROPERTIES_FILE_NAME = {{ $(BRANCH_NAME)_propertiesFileName or "B2B-DEV-FENIX.yaml" }}
          var ANYPOINT_ENV = {{ $(BRANCH_NAME)_anypointEnv or "B2B-DEV-FENIX" }}
          var ANYPOINT_ENV_APP_NAME = {{ $(BRANCH_NAME)_anypointEnvAppName or "dev" }}
          var ENV_HEALTH_ENDPOINT = {{ $(BRANCH_NAME)_envHealthEndpoint or "dev" }}

    # - task: PropertiesParse@4
    #   displayName: Extracting properties from config file
    #   inputs:
    #     source: file://src/main/resources/properties/$(PROPERTIES_FILE_NAME)
    #     queries:
    #       var 

    - task: TemplateInline@4
      displayName: 'Bind "ASDF_JAVA_VERSION"'
      inputs:
        sourceType: 'text'
        source: |
          var ASDF_JAVA_VERSION = {{ ASDF_JDK_$(CATALOG_YAML_JAVA_LANGUAGE_VERSION) }}

    - script: |-
        echo "##vso[build.addbuildtag]mulesoft"
        echo "##vso[build.addbuildtag]java-$(CATALOG_YAML_JAVA_LANGUAGE_VERSION)"
        echo "##vso[build.addbuildtag]maven"
        echo "##vso[build.addbuildtag]nexus"
        echo "##vso[build.addbuildtag]ci-gold"
        echo "##vso[build.addbuildtag]sonar-scan"
        echo "##vso[build.addbuildtag]fortify"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'

    - script: |
        asdf install java $(ASDF_JAVA_VERSION)
        asdf install maven 3.9.9
        echo "##vso[task.setvariable variable=ASDF_MAVEN39_PATH]$(asdf where maven 3.9.9)"
      displayName: 'Ensure tools versions'

    - task: ListFilesAndFolders@4
      displayName: 'Find Custom Maven Settings file'
      inputs:
        script: 'var://MAVEN_SETTINGS_FILES = **/*settings.xml'
        dot: true

    - task: PythonRunner@4
      displayName: 'Ensure Maven Config'
      inputs:
        script: |
          import os
          set_variable('MAVEN_CUSTOM_SETTINGS',
            (os.getenv('MAVEN_SETTINGS_FILES') or '/home/svc_devopscorp/.m2/settings.xml')
            .split(',')[0]
          )

    - task: AzureKeyVault@2
      displayName: 'Secrets from AKV'
      inputs:
        RunAsPreJob: true
        azureSubscription: "DevOpsSharedResources"
        KeyVaultName: "kv-azdevops-shared"
        SecretsFilter: >-
          NEXUS-DEFAULT-USR,
          NEXUS-DEFAULT-PSW,
          NEXUS-DEPS-USR,
          NEXUS-DEPS-PSW,
          SONARQUBE-TOKEN

    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: settings-mule.xml

    - task: SemverIncrementCustomFromVivo@5
      displayName: 'Semver Increment "patch"'
      name: new_version
      inputs:
        currentversion: $(POM_XML_VERSION)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"

    - task: Maven@3
      displayName: "Maven versions:set"
      inputs:
        mavenPomFile: 'pom.xml'
        goals: "versions:set"
        options: -DnewVersion=$(new_version.NEW_VERSION)

    - task: XmlParseFromVivo@4
      displayName: 'Get New pom.xml info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text

    - task: Maven@4
      displayName: 'Executing unit tests'
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      continueOnError: True
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean test'
        options: >-
          -s $(muleSettings.secureFilePath) 
          -Djava.net.useSystemProxies=true 
          -Dsecurity.key=$(MULE_SECURITY_KEY) 
          -Denv=$(ANYPOINT_ENV) 
#          $(UNIT_TEST_PROPS)

    - task: Maven@4
      displayName: 'Executing maven build'
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean install'
        options: >-
          -s $(muleSettings.secureFilePath)
          -Djava.net.useSystemProxies=true
          -Dsecurity.key=$(MULE_SECURITY_KEY)
          -Denv=$(ANYPOINT_ENVIRONMENT)
          -DskipTests=true
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)


    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mergeTestResults: true

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: "$(build.sourcesdirectory)"
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        Contents: |
          **/target/classes/**
          **/target/*.*ar
          **/target/*.ejb
          **/surefire-reports/TEST-*.xml
          **/pom.xml
          .azuredevops/**/*
          .azuredevops/*
          catalog-info.y*ml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: bin

    - task: ListFilesAndFolders@4
      displayName: 'Fetch "sonar.java.binaries"'
      inputs:
        scriptSource: 'text'
        separator: ','
        script: 
          var://BINARIES_DIRECTORIES = $(Build.SourcesDirectory)/**/target/classes

    - task: SonarQubePrepare@5
      displayName: 'Config Sonar'
      inputs:
        SonarQube: VIVO_SONARQUBE
        scannerMode: "CLI"
        # configFile Não funciona no scannerMode Other, apenas CLI (https://learn.microsoft.com/pt-br/azure/devops/pipelines/tasks/reference/sonar-qube-prepare-v5?view=azure-pipelines)
        configFile: $(Build.SourcesDirectory)/.azuredevops/sonar-project.properties
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(Build.SourcesDirectory)
          sonar.projectKey=$(CATALOG_YAML_SONAR_PROJECT_KEY)
          sonar.projectName=$(SONARQUBE_PROJECT_NAME)
          sonar.projectVersion=$(new_version.NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300
          sonar.sources=.
          sonar.inclusions=**/src/main/java/**/*
          sonar.java.binaries=$(BINARIES_DIRECTORIES)

    - script: asdf install java $(ASDF_JDK_11)
      displayName: 'Ensure Sonarqube Java Version'

    - task: SonarQubeAnalyze@5
      displayName: 'Sonar Scan'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: $(ASDF_JDK_11)

