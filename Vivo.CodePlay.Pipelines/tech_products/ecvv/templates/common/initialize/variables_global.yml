variables:

# Variables for Agents
- name: AGENT_POOL_CI
  value: GeneralPurposeLinuxAgentsCI
- name: AGENT_POOL_CD
  value: GeneralPurposeLinuxAgentsCD
- name: PRIVATE_AGENT_DEV
  value: $(PRIVATE_AGENT_SHARED)
- name: PRIVATE_AGENT_ESTEIRA1
  value: $(PRIVATE_AGENT_SHARED)
- name: PRIVATE_AGENT_ESTEIRA2
  value: $(PRIVATE_AGENT_SHARED)
- name: PRIVATE_AGENT_PREPROD
  value: $(PRIVATE_AGENT_SHARED)
- name: PRIVATE_AGENT_PRODLIKE
  value: $(PRIVATE_AGENT_SHARED)
- name: PRIVATE_AGENT_PRODUCAO
  value: VivoOnPremPrdAgents
- name: BUILD_JOB_TIMEOUT
  value: 60

# Variables for CACORP Certificate
- name: CACORP_LOCATION
  value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"

# Variables for AKV DevOps
- name: AKV_DEVOPS_NAME
  value: "kv-azdevops-shared"

# Variables for Azure Artifacts
- name: AZURE_ARTIFACTS_ORGANIZATION
  value: "telefonica-vivo-brasil"
- name: AZURE_ARTIFACTS_FEED
  value: "DevOps"
- name: AZURE_ARTIFACTS_MAVEN_FEED_URL
  value: "https://pkgs.dev.azure.com/$(AZURE_ARTIFACTS_ORGANIZATION)/_packaging/$(AZURE_ARTIFACTS_FEED)/maven/v1"
- name: AZURE_ARTIFACTS_PUBLISH_ENABLE
  value: "true"

# Variables for Governance App
- name: GOVAPP_INTEGRATION_ENABLED
  value: False
- name: GOVAPP_SERVICE_CONNECTION_NAME
  value: "governanceapi"

# Variables for Messages
- name: FORMATED_TIME_TAGS
  value: "$(date +%F--%H-%M-%S)"
- name: ALERT_MESSAGE_START
  value: "##[warning] +------------------+ \n##[warning] | LEIA COM ATENCAO | \n##[warning] +------------------+"
- name: ALERT_MESSAGE_START_SUCCESS
  value: "##[success] +------------------+ \n##[success] | STAGE COMPLETO | \n##[success] +------------------+"
- name: ALERT_MESSAGE_START_ERROR
  value: "##[error] +------------------+ \n##[error] | LEIA COM ATENCAO | \n##[error] +------------------+"
- name: ALERT_MESSAGE_PREFIX_ARROW
  value: "##[warning] ➔"
- name: ALERT_MESSAGE_ARROW
  value: "➔"
- name: ALERT_MESSAGE_PREFIX_WARNING
  value: "##[warning] "
- name: ALERT_MESSAGE_PREFIX_ERROR
  value: "##[error] ➔"
- name: ALERT_MESSAGE_END
  value: "##[warning] +------------------+ \n##[warning] | ---------------- | \n##[warning] +------------------+"
- name: ALERT_MESSAGE_END_SUCCESS
  value: "##[success] +------------------+ \n##[success] | ---------------- | \n##[success] +------------------+"
- name: ALERT_MESSAGE_END_ERROR
  value: "##[error] +------------------+ \n##[error] | ---------------- | \n##[error] +------------------+"
- name: ALERT_MESSAGE_DEBUG_PREFIX
  value: "##[debug] ?"
- name: ALERT_MESSAGE_SECTION_PREFIX
  value: "##[section] "
- name: GIT_AUTHOR_NAME
  value: "CorePipeline"
- name: GIT_AUTHOR_EMAIL
  value: "core-pipeline@telefonica.com.br"
- name: GIT_COMMITTER_NAME
  value: "CorePipeline"
- name: GIT_COMMITTER_EMAIL
  value: "core-pipeline@telefonica.com.br"
- name: ORG_NAME
  value: "$(echo $(System.CollectionUri) | cut -d/ -f 4)"
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Vivo+Core+Pipelines"

# Variables for NEXUS
- name: NEXUS_ENDPOINT_API_REPOSITORY
  value: "https://nexus.telefonica.com.br/service/rest/v1"
- name: NEXUS_REPOSITORY_URL
  value: "https://nexus.telefonica.com.br/repository"
- name: NEXUS_REPO_LIB_MVN
