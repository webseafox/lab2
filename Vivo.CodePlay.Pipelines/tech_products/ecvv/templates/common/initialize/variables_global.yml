- name: PROXY_AGENT_HTTPS
  value: "http://$(PROXY_SQUID_SERVER)"
- name: PROXY_AGENT_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: PROXY_ADDL_NO_PROXY
  value: ""

# Variables for Service Connection
- name: K8S_SERVICE_CONNECTION_DEV
  value: aks-ecvv-dev
- name: K8S_SERVICE_CONNECTION_ESTEIRA1
  value: aks-ecvv-test
- name: K8S_SERVICE_CONNECTION_ESTEIRA2
  value: aks-ecvv-test
- name: K8S_SERVICE_CONNECTION_PREPROD
  value: aks-ecvv-test
- name: K8S_SERVICE_CONNECTION_PRODLIKE
  value: aks-ecvv-test
- name: K8S_SERVICE_CONNECTION_NOPROD
  value: aks-ecvv-test
- name: K8S_SERVICE_CONNECTION_PRODUCAO
  value: aks-ecvv-prod

- name: K8S_RESOURCE_GROUP_DEV
  value: "rg-aks-ecvv-brsouth-dev"
- name: K8S_RESOURCE_GROUP_ESTEIRA1
  value: "rg-aks-ecvv-brsouth-test"
- name: K8S_RESOURCE_GROUP_ESTEIRA2
  value: "rg-aks-ecvv-brsouth-test"
- name: K8S_RESOURCE_GROUP_PREPROD
  value: "rg-aks-ecvv-brsouth-testt"
- name: K8S_RESOURCE_GROUP_PRODLIKE
  value: "rg-aks-ecvv-brsouth-test"
- name: K8S_RESOURCE_GROUP_prod
  value: "rg-aks-ecvv-brsouth-prod"

  
# Variables for Workflow
- name: flowIsMain
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')]
- name: flowIsTriggerCI
  value: $[in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')]
- name: flowIsManual
  value: $[eq(variables['Build.Reason'], 'Manual')]
- name: flowIsPullRequest
  value: $[eq(variables['Build.Reason'],'PullRequest')]
- name: flowIsTagging
  value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
- name: flowIsToReview
  value: $[or( eq(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))]
- name: flowIsTobuildAndRegistry
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/release', 'refs/heads/esteira1', 'refs/heads/develop')]
- name: flowIsToDeploy
  value: $[or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/release', 'refs/heads/esteira1', 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/develop/'), in(variables['Build.SourceBranch'], 'refs/tags/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/esteira1/'), in(variables['Build.SourceBranch'], 'refs/tags/esteira1'), startsWith(variables['Build.SourceBranch'], 'refs/tags/production'), startsWith(variables['Build.SourceBranch'], 'refs/tags/release'))]
- name: flowSkipSecurity
  value: $[and( eq(variables['SKIP_SECURITY'], 'false'), in( variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/release'))]
- name: flowIsSapCommerce
  value: $[or(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'],'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/s1', 'refs/heads/s2', 'refs/heads/s3', 'refs/heads/preprod', 'refs/heads/esteira1', 'refs/heads/esteira2'))]
