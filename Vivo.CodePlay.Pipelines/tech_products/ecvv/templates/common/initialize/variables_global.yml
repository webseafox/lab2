- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: DEFAULT_WORKDIR_WEBLOGIC_CONFIG
  value: "$(Pipeline.Workspace)/source_code/.azuredevops/config"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"
- name: AZURE_APP_CONFIGURATION_ENABLED
  value: "true"
- name: AZURE_APP_CONFIGURATION_AZURE_SUBSCRIPTION
  value: "DevOpsSharedResources"
- name: APP_CONFIGURATION_AZURE_SUBSCRIPTION
  value: "DevOpsSharedResources"  
- name: AZURE_APP_CONFIGURATION_ENDPOINT
  value: 'https://appcs-azdevops-shared.azconfig.io'
- name: BUMP_VERSION_ENABLED
  value: 'true'
- name: DEPLOY_ENVIRONMENT_LIB
  value: "deploy-lib"
- name: MULTIBRANCH_EXCLUSIONS_FILE
