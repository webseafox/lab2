parameters:
- name: apiName

steps:
- script: |
    echo "##[debug] ASDF_PYTHON_VERSION.......: ${ASDF_PYTHON_VERSION}"
    echo "##[debug] HTTP_PROXY................: ${HTTP_PROXY}"
    echo "##[debug] NO_PROXY..................: ${NO_PROXY}"

    pip3 install --proxy ${HTTP_PROXY} -r requirements.txt --user
  displayName: Install python dependencies
  workingDirectory: $(SCRIPTS_FILES_PATH)
  env:
    ASDF_PYTHON_VERSION: $(ASDF_PYTHON_VERSION)
    HTTP_PROXY: $(PROXY_AGENT_HTTP)
    NO_PROXY: $(PROXY_AGENT_NO_PROXY)

- task: PythonScript@0
  displayName: Validate schema
  inputs:
    scriptPath: $(SCRIPTS_FILES_PATH)/json_schema_validation.py
    arguments: '$(SCHEMA_FILES_PATH)/schema_validation.json $(Build.SourcesDirectory)/$(Build.Repository.Name)/configFrontend.json $(CATALOG_FILES_PATH)/allowed_list.json'