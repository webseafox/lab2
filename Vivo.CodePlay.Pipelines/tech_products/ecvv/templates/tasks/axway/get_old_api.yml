parameters:
- name: name
- name: frontendNewApiID
  default: ''

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] FRONTEND_NAME_PARAM......: ${FRONTEND_NAME_PARAM}"
    echo "##[debug] FRONTEND_NEW_API_ID......: ${FRONTEND_NEW_API_ID}"
    VARIABLE_EMPTY=""

    curl -s -k --fail --get \
    --data-urlencode "field=name" \
    --data-urlencode "op=eq" \
    --data-urlencode "value=${FRONTEND_NAME_PARAM}" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/proxies" > $(Agent.TempDirectory)/api_manager_frontend_old_response.json

    FRONTEND_OLD_API_NAME="$(jq -r '. | sort_by(.createdOn) | .[0].name // empty' $(Agent.TempDirectory)/api_manager_frontend_old_response.json)"
    FRONTEND_OLD_API_ID="$(jq -r '. | sort_by(.createdOn) | .[0].id // empty' $(Agent.TempDirectory)/api_manager_frontend_old_response.json)"
    FRONTEND_OLD_API_STATE="$(jq -r '. | sort_by(.createdOn) | .[0].state // empty' $(Agent.TempDirectory)/api_manager_frontend_old_response.json)"
    FRONTEND_OLD_API_VERSION="$(jq -r '. | sort_by(.createdOn) | .[0].version // empty' $(Agent.TempDirectory)/api_manager_frontend_old_response.json)"
    BACKEND_OLD_API_ID="$(jq -r '. | sort_by(.createdOn) | .[0].apiId // empty' $(Agent.TempDirectory)/api_manager_frontend_old_response.json)"

    if [ -z "${FRONTEND_OLD_API_ID}" ]; then
      echo "##[warning] Old Frontend API '${FRONTEND_NAME_PARAM}' not found in environment. First deploy will be performed."
      echo "##vso[task.setvariable variable=FRONTEND_OLD_API_ID;]${VARIABLE_EMPTY}"
      echo "##vso[task.setvariable variable=BACKEND_OLD_API_ID;]${VARIABLE_EMPTY}"
      exit
    fi

    if [ "${FRONTEND_OLD_API_ID}" == "${FRONTEND_NEW_API_ID}" ]; then
      echo "##[warning] Old Frontend API is the New Fronend API and can not be deleted."
     
      echo "##vso[task.setvariable variable=FRONTEND_OLD_API_ID;]${VARIABLE_EMPTY}"
      echo "##vso[task.setvariable variable=BACKEND_OLD_API_ID;]${VARIABLE_EMPTY}"
      exit
    fi

    echo "##[debug] FRONTEND_OLD_API_NAME....: ${FRONTEND_OLD_API_NAME}"

    echo "##[debug] FRONTEND_OLD_API_ID......: ${FRONTEND_OLD_API_ID}"
    echo "##vso[task.setvariable variable=FRONTEND_OLD_API_ID;]${FRONTEND_OLD_API_ID}"

    echo "##[debug] FRONTEND_OLD_API_STATE...: ${FRONTEND_OLD_API_STATE}"
    echo "##vso[task.setvariable variable=FRONTEND_OLD_API_STATE;]${FRONTEND_OLD_API_STATE}"

    echo "##[debug] FRONTEND_OLD_API_VERSION.: ${FRONTEND_OLD_API_VERSION}"
    echo "##vso[task.setvariable variable=FRONTEND_OLD_API_VERSION;]${FRONTEND_OLD_API_VERSION}"

    echo "##[debug] BACKEND_OLD_API_ID.......: ${BACKEND_OLD_API_ID}"
    echo "##vso[task.setvariable variable=BACKEND_OLD_API_ID;]${BACKEND_OLD_API_ID}"
  displayName: Get Old API
  name: get_old_api
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    FRONTEND_NAME_PARAM: ${{ parameters.name }}
    FRONTEND_NEW_API_ID: ${{ parameters.frontendNewApiID }}