parameters:
- name: applicationID
- name: condition
  default: succeeded()

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] APPLICATION_ID...........: ${APPLICATION_ID}"

    echo "##[command] POST /applications/${APPLICATION_ID}/apikeys"
    HTTP_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" "${API_MANAGER_BASE_URL}/applications/${APPLICATION_ID}/apikeys" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --header "content-type: application/json" \
    --data-raw '{"applicationId":"'${APPLICATION_ID}'","enabled":true,"corsOrigins":[]}')

    if [[ "${HTTP_CODE}" = "201" ]]; then
      echo "##[debug] API Key created, http_code '${HTTP_CODE}'."
      echo "##vso[task.complete result=Succeeded;]"
    else
      echo "##vso[task.logissue type=error;] Error when creating API Key, response http_code '${HTTP_CODE}'."
      echo "##vso[task.complete result=Failed;]"
    fi
  displayName: Create API Key
  condition: ${{ parameters.condition }}
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    APPLICATION_ID: ${{ parameters.applicationID }}