parameters:
- name: apiName

steps:
- script: |
    echo "##[debug] API_NAME........................: ${API_NAME}"
    echo "##[debug] CATALOG_FILE....................: $(pwd)/${CATALOG_FILE}"
    
    if [ ! -f "${CATALOG_FILE}" ]; then
      echo "##vso[task.logissue type=error] Catalog file not found."
      echo "##vso[task.complete result=Failed;]"
      exit
    fi

    ORGANIZATION_NAME="$(jq -r --arg apiName "${API_NAME}" '.topology.workflow.organizations[] | select(.apis[].name == $apiName).name' ${CATALOG_FILE})"
    if [ -z "${ORGANIZATION_NAME}" ] || [ "${ORGANIZATION_NAME}" == "null" ]; then
      echo "##vso[task.logissue type=error] Organization Name not found in Catalog for API '${API_NAME}'."
      echo "##vso[task.complete result=Failed;]"
      exit
    fi
    echo "##[debug] ORGANIZATION_NAME...............: ${ORGANIZATION_NAME}"
    echo "##vso[task.setvariable variable=ORGANIZATION_NAME;isOutput=true]${ORGANIZATION_NAME}"

    SHARED_ORGANIZATIONS="$(jq -r --arg apiName "${API_NAME}" --arg organizationName "${ORGANIZATION_NAME}" '.topology.workflow.organizations[] | select(.name == $organizationName).apis[] | select(.name == $apiName).sharedOrganizations | map(.name) | join(",")' ${CATALOG_FILE})"
    echo "##[debug] SHARED_ORGANIZATIONS............: ${SHARED_ORGANIZATIONS}"
    echo "##vso[task.setvariable variable=SHARED_ORGANIZATIONS;isOutput=true]${SHARED_ORGANIZATIONS}"

    MATRIX_SHARED_ORGANIZATIONS="$(jq -rc --arg apiName "${API_NAME}" --arg organizationName "${ORGANIZATION_NAME}" '.topology.workflow.organizations[] | select(.name == $organizationName).apis[] | select(.name == $apiName).sharedOrganizations | map( { (.name|tostring): . }) | add // {}' ${CATALOG_FILE})"
    MATRIX_API_APPLICATIONS="$(jq -rc --arg apiName "${API_NAME}" '.topology.workflow.organizations | map(select(.applications[].apis[] | contains($apiName))) | map(del(.applications[] | select(.apis[] | contains($apiName) | not))) | map({ (.applications[].name|tostring): { applicationOrgName: .name, applicationName: (.applications[].name|tostring) } }) | add // {}' ${CATALOG_FILE})"
  displayName: Extract catalog variables
  name: extract_catalog_variables
  workingDirectory: $(CATALOG_FILES_PATH)
  env:
    API_NAME: ${{ parameters.apiName }}
    CATALOG_FILE: $(CATALOG_FILE_NAME)