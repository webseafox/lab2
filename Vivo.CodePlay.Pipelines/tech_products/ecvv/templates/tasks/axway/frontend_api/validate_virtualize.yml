parameters:
- name: apiName
- name: apiVersion

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] API_NAME.................: ${API_NAME}"
    echo "##[debug] API_VERSION..............: ${API_VERSION}"

    echo "##[command] GET /proxies"
    FRONTEND_API_ID=$(curl -s -k --fail --get \
    --data-urlencode "field=name" \
    --data-urlencode "op=eq" \
    --data-urlencode "value=${API_NAME}" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/proxies" | jq -r --arg apiVersion "${API_VERSION}" '.[] | select (.version == $apiVersion and .state == "published").id // empty')

    if [ -z "${FRONTEND_API_ID}" ]; then
      echo "##[debug] Frontend ID not found in API Manager. It can be virtualized."
      SHOULD_VIRTUALIZE="true"
    else
      echo "##[warning] Frontend ID already virtualized in API Manager."
      SHOULD_VIRTUALIZE="false"
    fi

    echo "##[debug] FRONTEND_API_ID..........: ${FRONTEND_API_ID}"
    echo "##[debug] SHOULD_VIRTUALIZE........: ${SHOULD_VIRTUALIZE}"
    echo "##vso[task.setvariable variable=SHOULD_VIRTUALIZE;isOutput=true]${SHOULD_VIRTUALIZE}"
  displayName: Validate Virtualize
  name: validate_virtualize
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    API_NAME: ${{ parameters.apiName }}
    API_VERSION: ${{ parameters.apiVersion }}