parameters:
- name: frontendApiID
- name: sharedOrganizationsID

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] FRONTEND_API_ID..........: ${FRONTEND_API_ID}"
    echo "##[debug] SHARED_ORGANIZATIONS_ID..: ${SHARED_ORGANIZATIONS_ID}"

    if [ -z "${SHARED_ORGANIZATIONS_ID}" ]; then
      echo "##[warning] No organizations found to share and Grant Access API."
      exit
    fi

    BASE_CURL_COMMAND="curl -s -i -k --fail --request POST '${API_MANAGER_BASE_URL}/proxies/grantaccess' \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --header 'Content-Type: application/x-www-form-urlencoded' \
    --data-urlencode 'action=orgs' \
    --data-urlencode 'apiId=${FRONTEND_API_ID}'"

    IFS=',' read -ra shared_org_id_array <<< "${SHARED_ORGANIZATIONS_ID}"
    
    for org_id in "${shared_org_id_array[@]}"; do
      BASE_CURL_COMMAND+=" --data-urlencode 'grantOrgId=${org_id}' "
    done

    echo "##[debug] BASE_CURL_COMMAND........: ${BASE_CURL_COMMAND}"
    echo "##[command] POST /proxies/grantaccess"
    eval "${BASE_CURL_COMMAND}"
  displayName: Grant API Access to Organizations
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    FRONTEND_API_ID: ${{ parameters.frontendApiID }}
    SHARED_ORGANIZATIONS_ID: ${{ parameters.sharedOrganizationsID }}