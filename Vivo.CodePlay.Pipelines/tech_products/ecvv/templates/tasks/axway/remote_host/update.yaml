parameters:
- name: remoteHostID
  type: string
- name: remoteHostFilePath
  type: string

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] REMOTE_HOST_ID...........: ${REMOTE_HOST_ID}"
    echo "##[debug] REMOTE_HOST_FILE_PATH...........: ${REMOTE_HOST_FILE_PATH}"

    if [ ! -f "${REMOTE_HOST_FILE_PATH}" ]; then
        echo "##[error] O arquivo ${REMOTE_HOST_FILE_PATH} não existe."
        exit 1
    fi

    echo "##[command] PUT /remotehosts/${REMOTE_HOST_ID}"
    response=$(curl -s -k -w "\n%{http_code}" --fail -X PUT \
    --header 'accept: application/javascript, application/json' \
    --header 'content-type: application/json' \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --data-binary "@${REMOTE_HOST_FILE_PATH}" \
    "${API_MANAGER_BASE_URL}/remotehosts/${REMOTE_HOST_ID}")

    status_code=$(echo "$response" | tail -n1)
    response_body=$(echo "$response" | sed '$d')

    if [[ "$status_code" -ge 200 && "$status_code" -lt 300 ]]; then
        echo "##[debug] Requisição bem-sucedida com status code: $status_code"
    else
        echo "##[debug] response_body: $response_body"
        echo "##[error] Falha na requisição com status code: $status_code"
        exit 1
    fi
  displayName: Update Remote Host
  name: remote_host_update
  condition: and(succeeded(), eq(variables['UPDATE_REMOTE_HOST'], 'true'))
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    REMOTE_HOST_ID: ${{ variables.remote_host_get.REMOTE_HOST_ID }}
    REMOTE_HOST_FILE_PATH: ${{ parameters.remoteHostFilePath }}