parameters:
- name: remoteHostAlias
  type: string

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] REMOTE_HOST_ALIAS...........: ${REMOTE_HOST_ALIAS}"

    echo "##[command] GET /remotehosts"

    response=$(curl -s -k -w "\n%{http_code}" --fail --get \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/remotehosts")

    status_code=$(echo "$response" | tail -n1)
    response_body=$(echo "$response" | sed '$d')

    if [[ "$status_code" -ge 200 && "$status_code" -lt 300 ]]; then
        REMOTE_HOST_ID=$(echo "$response_body" | jq -r --arg alias "$REMOTE_HOST_ALIAS" '.[] | select(.alias == $alias) | .id')
    else
        echo "##[debug] response_body: $response_body"
        echo "##[error] Falha na requisição com status code: $status_code"
        exit 1
    fi

    if [ -z "$REMOTE_HOST_ID" ]; then
        UPDATE_REMOTE_HOST=false
        echo "##[debug] REMOTE_HOST_ID.................: Não encontrado, será criado um novo Remote Host"

    else 
        UPDATE_REMOTE_HOST=true
        echo "##[debug] REMOTE_HOST_ID.................: ${REMOTE_HOST_ID}"
    fi
    echo "##vso[task.setvariable variable=UPDATE_REMOTE_HOST]${UPDATE_REMOTE_HOST}"
    echo "##vso[task.setvariable variable=REMOTE_HOST_ID]${REMOTE_HOST_ID}"

  displayName: Get Remote Host ID
  name: remote_host_get
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    REMOTE_HOST_ALIAS: ${{ parameters.remoteHostAlias }}