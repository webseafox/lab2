parameters:
- name: organizationName
  default: ''

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] ORGANIZATION_NAME........: ${ORGANIZATION_NAME}"

    echo "##[command] GET /organizations"
    curl -s -k --fail --get \
    --data-urlencode "field=name" \
    --data-urlencode "op=eq" \
    --data-urlencode "value=${ORGANIZATION_NAME}" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/organizations" > $(Agent.TempDirectory)/api_manager_organizations_response.json

    jq '.' $(Agent.TempDirectory)/api_manager_organizations_response.json

    ORGANIZATION_ID="$(jq -r '.[0].id' $(Agent.TempDirectory)/api_manager_organizations_response.json)"

    if [ -z "${ORGANIZATION_ID}" ] || [ "${ORGANIZATION_ID}" == "null" ]; then
      echo "##vso[task.logissue type=error] Organization ID not found in API Manager."
      echo "##vso[task.complete result=Failed;]"
      exit
    fi

    echo "##[debug] ORGANIZATION_ID..........: ${ORGANIZATION_ID}"

    echo "##vso[task.setvariable variable=ORGANIZATION_ID]${ORGANIZATION_ID}"
  displayName: Get Organization ID
  name: get_organization_id
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    ORGANIZATION_NAME: ${{ parameters.organizationName }}