parameters:
- name: sharedOrganizations

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL........: ${API_MANAGER_BASE_URL}"
    echo "##[debug] SHARED_ORGANIZATIONS........: ${SHARED_ORGANIZATIONS}"

    if [ -z "${SHARED_ORGANIZATIONS}" ]; then
      echo "##[warning] No organizations was found to share."
      echo "##vso[task.setvariable variable=SHARED_ORGANIZATIONS_ID]"
      exit
    fi

    IFS=',' read -ra ORGANIZATION_LIST <<< "${SHARED_ORGANIZATIONS}"
  
    SHARED_ORGANIZATIONS_ID=""
    for org in "${ORGANIZATION_LIST[@]}"; do
      echo "##[group] Organization: ${org}"
      curl -s -k --fail --get \
      --data-urlencode "field=name" \
      --data-urlencode "op=eq" \
      --data-urlencode "value=${org}" \
      --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
      "${API_MANAGER_BASE_URL}/organizations" > $(Agent.TempDirectory)/shared_organizations_response.json

      ORGANIZATION_ID=$(cat $(Agent.TempDirectory)/shared_organizations_response.json | jq -r '.[0].id')

      if [ -z "${ORGANIZATION_ID}" ] || [ "${ORGANIZATION_ID}" == "null" ]; then
        echo "##vso[task.logissue type=warning] Organization '${org}' not found in API Manager."
        echo "##vso[task.complete result=SucceededWithIssues;]"
        continue
      fi

      echo "##[debug] ORGANIZATION_ID.............: ${ORGANIZATION_ID}"
      SHARED_ORGANIZATIONS_ID="${ORGANIZATION_ID},${SHARED_ORGANIZATIONS_ID}"
      echo "##[endgroup]"
    done

    echo "##[command] Preparing variable to be exported"
    SHARED_ORGANIZATIONS_ID="${SHARED_ORGANIZATIONS_ID%,}"
    echo "##[debug] SHARED_ORGANIZATIONS_ID.....: ${SHARED_ORGANIZATIONS_ID}"
    echo "##vso[task.setvariable variable=SHARED_ORGANIZATIONS_ID]${SHARED_ORGANIZATIONS_ID}"
  displayName: Get Shared Organizations ID
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    SHARED_ORGANIZATIONS: ${{ parameters.sharedOrganizations }}