parameters:
- name: applicationID
- name: fileName
  default: app-export.dat
- name: workingDirectory
  default: $(Agent.TempDirectory)

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.............: ${API_MANAGER_BASE_URL}"
    echo "##[debug] APPLICATION_ID...................: ${APPLICATION_ID}"

    echo "##[command] POST /migrate/applications/export/json"
    curl -s -k --fail "${API_MANAGER_BASE_URL}/migrate/applications/export/json" \
    --header "content-type: application/json" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --data '{
        "filename": "'${EXPORTED_FILE_NAME}'",
        "password": "'${DAT_FILE_PASSWORD}'",
        "quota": true,
        "oauth": false,
        "apikeys": true,
        "appIds": [
          "'${APPLICATION_ID}'"
        ]
    }' > ${EXPORTED_FILE_NAME}

    if [ -s ${EXPORTED_FILE_NAME} ]; then
      echo "##[debug] EXPORTED_FILE_NAME...............: ${EXPORTED_FILE_NAME}"
    else
      echo "##vso[task.logissue type=error;] Exported application file is empty."
      echo "##vso[task.complete result=Failed;]"
    fi
  displayName: Export Application
  workingDirectory: ${{ parameters.workingDirectory }}
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    DAT_FILE_PASSWORD: $(DAT_FILE_PASSWORD)
    APPLICATION_ID: ${{ parameters.applicationID }}
    EXPORTED_FILE_NAME: ${{ parameters.fileName }}