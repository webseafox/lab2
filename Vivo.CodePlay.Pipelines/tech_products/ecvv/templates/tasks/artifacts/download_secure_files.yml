parameters:
- name: name
  default: secureFile
- name: secureFile
- name: enabled
  default: true

steps:
- ${{ if eq(parameters.enabled, true) }}:
  - task: DownloadSecureFile@1
    name: ${{ parameters.name }}
    displayName: 'Download ${{ parameters.secureFile }}'
    inputs:
      secureFile: ${{ parameters.secureFile }}