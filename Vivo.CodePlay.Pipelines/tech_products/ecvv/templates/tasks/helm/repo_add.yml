parameters:
- name: name
- name: url
- name: username
- name: password

steps:
- task: HelmDeploy@0
  displayName: 'helm repo add ${{ parameters.name }}'
  inputs:
    connectionType: None
    command: repo
    arguments: 'add ${{ parameters.name }} ${{ parameters.url }} --force-update --username ${{ parameters.username }} --password ${{ parameters.password }}'
  env:
    ASDF_HELM_VERSION: $(HELM_VERSION)