parameters:
- name: repository
- name: chartNewVersion
  
steps:
- checkout: ${{ parameters.repository }}
  persistCredentials: "true"
  clean: true

- bash: |
    git config pull.rebase true
    git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
    git checkout -f ${BRANCH_NAME}
  displayName: "Preparation"
  env:
    BRANCH_NAME: "$(Build.SourceBranchName)"

- bash: |
    echo "Updating chart to new version: ${CHART_NEW_VERSION}"
    sed -i "0,/^version:/s/version:.*/version: ${CHART_NEW_VERSION}/" Chart.yaml
  displayName: 'Update Chart Version'
  env:
    CHART_NEW_VERSION: ${{ parameters.chartNewVersion }}

- bash: |
    git add Chart.yaml
    git commit -am "[CI SKIP] Project version has been updated. Released version '${CHART_NEW_VERSION}'" --author="$BUILD_REQUESTEDFOR <$BUILD_REQUESTEDFOREMAIL>"
    git status
    git push origin ${BRANCH_NAME}

    echo "Version updated to ${CHART_NEW_VERSION}"
  displayName: 'Commit Updated Version'
  env:
    CHART_NEW_VERSION: ${{ parameters.chartNewVersion }}
    BRANCH_NAME: "$(Build.SourceBranchName)"