parameters:
- name: environment
- name: dev_namespace_to_deploy
  default: ''

steps:
- template: /tech_products/ecvv/templates/tasks/docker/export_k8s_namespace.yml
  parameters:
    environment: ${{ parameters.environment }}
    variableNameOut: "K8S_NAMESPACE"
    dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}

- script: |
    DOCKER_OUTPUT="$(cat $(DEFAULT_WORKDIR_DOCKER_ARTIFACTS)/docker.json)"

    GIT_TAG="$(echo $DOCKER_OUTPUT | jq -r '.GIT_TAG')"
    echo "##vso[task.setvariable variable=VAR_GIT_TAG;]$GIT_TAG"
    echo "##[debug] VAR_GIT_TAG...: $GIT_TAG"

  displayName: "Set Git Tag variable"