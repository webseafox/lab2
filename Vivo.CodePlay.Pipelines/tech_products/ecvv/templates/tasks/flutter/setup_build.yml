parameters:
- name: flutterVersion
  type: string
  default: "3.16.0"

steps: 
- task: FlutterInstall@0
  displayName: "Install Flutter SDK"
  inputs:
    mode: 'auto'
    channel: 'stable'
    version: 'custom'
    customVersion: ${{ parameters.flutterVersion }}

- task: FlutterCommand@0
  displayName: "Run Flutter diagnostics"
  inputs:
    projectDirectory: '.'
    arguments: 'doctor -v'