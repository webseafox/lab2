parameters:
- name: flutterVersion
  type: string
  default: "3.16.0"

steps: 
- bash: |
      echo "##[debug]Creating '$(Build.SourcesDirectory)/android/key.properties' file..."
      cat << EOF > $(Build.SourcesDirectory)/android/key.properties
      storePassword=${ANDROID_SIGNING_STORE_PASSWORD}
      keyPassword=${ANDROID_SIGNING_KEY_PASSWORD}
      keyAlias=upload
      storeFile=$(Build.SourcesDirectory)/android/app/key.jks
      EOF

      echo "##[debug]Creating '$(Build.SourcesDirectory)/android/app/key.jks' file..."
      echo -n ${ANDROID_SIGNING_KEY_JKS} | base64 --decode > $(Build.SourcesDirectory)/android/app/key.jks
  displayName: Generate config files
  env:
    ANDROID_SIGNING_KEY_JKS: $(ANDROID_SIGNING_KEY_JKS)
    ANDROID_SIGNING_KEY_PASSWORD: $(ANDROID_SIGNING_KEY_PASSWORD)
    ANDROID_SIGNING_STORE_PASSWORD: $(ANDROID_SIGNING_STORE_PASSWORD)

- template: setup_build.yml
  parameters:
    flutterVersion: ${{ parameters.flutterVersion }}