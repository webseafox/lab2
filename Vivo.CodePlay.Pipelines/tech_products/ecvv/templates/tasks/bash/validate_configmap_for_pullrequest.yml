parameters:
- name: namespaces
  type: string
- name: display_name
  type: string
- name: working_directory
  default: $(Build.SourcesDirectory)/$(Build.Repository.Name)
  type: string
- name: enviroment_type
  type: string
  default: ''
- name: conditions
  type: object
steps:
- bash: |
    echo "##[debug] Executando script de configuração de gerenciamento de variáveis de ambiente"
    # cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
    
    NAMESPACES="${{ parameters.namespaces }}"
    NAMESPACES=($NAMESPACES)

    echo "##[section]Fique tranquilo, o ConfigMap não será aplicado em produção agora, é apenas uma pré-verificação"

    for ENV_CONFIG in "${NAMESPACES[@]}"; do
      echo "##[command]Verificando se o todas as variáveis estão ok e se o ConfigMap está sendo criado corretamente para o ambiente $ENV_CONFIG (${{ parameters.enviroment_type }})"
      mkdir -p $ENV_CONFIG
      python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py -cm -cmf env/env.yaml -cmn "app-example" -cms $ENV_CONFIG -cmda ./$ENV_CONFIG
      if [[ $? != 0 ]]; then
        echo "##[error] Não foi possível finalizar a execução do script python para geração do ConfigMap"
        exit 1
      fi
      FILENAME=./$ENV_CONFIG/configmap$ENV_CONFIG.yaml

      if [ ! -f $FILENAME ]; then
        echo "##[error] Não foi possível gerar o ConfigMap para $ENV_CONFIG"
        exit 1
      fi

      FILE_CONTENT=$(cat $FILENAME)
      if [ "$FILE_CONTENT" == "" ]; then
        echo "##[error] O ConfigMap gerado para $ENV_CONFIG está vazio"
        exit 1
      fi
      echo "##[command]Exemplo de como será gerado o ConfigMap para $ENV_CONFIG"
      echo "##[group]Clique para expandir/ocultar"
      echo "$FILE_CONTENT"
      echo "##[endgroup]"
    done
  displayName: ${{ parameters.display_name }}
  workingDirectory: ${{ parameters.working_directory }}
  condition: ${{ parameters.conditions }}