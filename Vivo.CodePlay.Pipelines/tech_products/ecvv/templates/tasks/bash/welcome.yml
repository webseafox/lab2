parameters:
- name: documentationURL
  default: $(CORPORATE_WIKI_DOC_URL)
- name: message
  default: |
    Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.

steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    echo ' ================================================================================================================================'
    echo '|                            _                ___                   ___ _            _ _                                         |'
    echo '|                     /\   /(_)_   _____     / __\___  _ __ ___    / _ (_)_ __   ___| (_)_ __   ___  ___                         |'
    echo '|                     \ \ / / \ \ / / _ \   / /  / _ \|  __/ _ \  / /_)/ |  _ \ / _ \ | |  _ \ / _ \/ __|                        |'
    echo '|                      \ V /| |\ V / (_) | / /__| (_) | | |  __/ / ___/| | |_) |  __/ | | | | |  __/\__ \                        |'
    echo '|                       \_/ |_| \_/ \___/  \____/\___/|_|  \___| \/    |_|  __/ \___|_|_|_| |_|\___||___/                        |'
    echo '|                                                                        |_|                                                     |'
    echo ' ================================================================================================================================'
    echo "                                                                                                      powered by Vivo DevOps Team"
    echo ""

    printf "
    =================================================================================================================================
    ${GREEN}                                                 ${SYSTEM_STAGEDISPLAYNAME} 
    =================================================================================================================================
    
    ${MESSAGE}

    ${YELLOW}Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}${DOC_URL}

    =================================================================================================================================
    "
  displayName: About Stage
  env:
    DOC_URL: ${{ parameters.documentationURL }}
    MESSAGE: ${{ parameters.message }}