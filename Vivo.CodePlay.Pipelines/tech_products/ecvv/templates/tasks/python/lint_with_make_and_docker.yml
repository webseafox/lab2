parameters:
- name: pythonVersion
  type: string

steps:
- bash: |
    cat << EOF > lib-lint.sh
    #!/bin/bash
    echo "##[debug]Criando ambiente virtual python..."
    make virtualenv
    
    echo "##[debug]Ativando ambiente virtual python..."
    source .venv/bin/activate

    echo "##[debug]Instalando/Restaurando dependências de dev..."
    make install-dev

    echo "##[debug]Executando Lint no source da library..."
    make lint
    EOF
  displayName: Create Lint Script

- template: /tech_products/ecvv/templates/tasks/python/run_bash_on_docker.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    scriptNameOrCmd: "bash lib-lint.sh"
    displayName: Running Lint