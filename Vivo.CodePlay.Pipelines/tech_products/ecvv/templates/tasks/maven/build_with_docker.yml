parameters:
  - name: mavenSettingsLocation
    type: string
    default: $(DEFAULT_MAVEN_SETTINGS)
  - name: mavenMaxMemoryBuild
    type: string
    default: $(DEFAULT_MAX_MEMORY_BUILD)
  - name: dockerWorkDir
    type: string
    default: $(DOCKER_WORKDIR)
  - name: appDependenciesCachePath
    type: string
    default: ""
  - name: appDependenciesCacheFolder
    type: string
    default: ""

steps:
- task: AzureKeyVault@2  
  displayName: 'Getting AKV credentials'
  timeoutInMinutes: 1
  retryCountOnTaskFailure: 5  
  inputs:    
    azureSubscription: DevOpsSharedResources    
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

# ==================================================================
# [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
# ==================================================================
- task: VivoDevOpsConfigCompliance@1
  displayName: 'Check DevOps Config Compliance'
  inputs:
    policySets: |
      image-definition-files

- bash: |
    # Builds image
    BUILDER_IMAGE_NAME="builder/java"
    docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .

    echo "##[debug] mavenSettingsLocation..................: ${{ parameters.mavenSettingsLocation }}"

    MAVEN_CACHE_FOLDER_CONTAINER="/.m2/repository"
    MAVEN_APP_CACHE_VOLUME=""
    if [ -n "${{ parameters.appDependenciesCachePath }}" ]; then
      MAVEN_CACHE_FOLDER_CONTAINER="/tmp/${{ parameters.appDependenciesCacheFolder }}"
      MAVEN_APP_CACHE_VOLUME="-v ${{ parameters.appDependenciesCachePath }}:${MAVEN_CACHE_FOLDER_CONTAINER}"
      
      echo "##[debug] parameters.appDependenciesCachePath....: ${{ parameters.appDependenciesCachePath }}"
      echo "##[debug] parameters.appDependenciesCacheFolder..: ${{ parameters.appDependenciesCacheFolder }}"
      echo "##[debug] app cache volume.......................: ${MAVEN_APP_CACHE_VOLUME}"
    fi

    # Runs builder image
    docker run --rm \
      --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
      --network host \
      --log-driver none \
      -e JAVA_OPTS_MEMORY_MAX="$DEFAULT_MAX_MEMORY_BUILD" \
      -e TZ="America/Sao_Paulo" \
      -e SYSTEM_ACCESSTOKEN="$SYSTEM_ACCESSTOKEN" \
      -e NEXUS_DEPS_USR="$NEXUS_DEPS_USR" \
      -e NEXUS_DEPS_PSW="$NEXUS_DEPS_PSW" \
      -v $(pwd):/app \
      -v $HOME/.m2:/.m2 \
      -v ${{ parameters.mavenSettingsLocation }}:/.m2/settings.xml \
      ${MAVEN_APP_CACHE_VOLUME} \
      -w $DOCKER_WORKDIR \
      $BUILDER_IMAGE_NAME sh -c "mvn clean install test -Dmaven.test.failure.ignore=false -s /.m2/settings.xml -Dmaven.repo.local=${MAVEN_CACHE_FOLDER_CONTAINER}"
  displayName: Build & Test & Coverage
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
    NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
    DEFAULT_MAX_MEMORY_BUILD: ${{ parameters.mavenMaxMemoryBuild }}
    DOCKER_WORKDIR: ${{ parameters.dockerWorkDir }}
