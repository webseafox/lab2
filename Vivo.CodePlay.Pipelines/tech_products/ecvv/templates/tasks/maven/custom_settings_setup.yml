parameters:
  - name: mavenSettingsLocationOutputVarName
    type: string
  - name: mavenSettingsLocation
    type: string
    default: $(DEFAULT_MAVEN_SETTINGS)

steps:
- task: AzureKeyVault@2  
  displayName: 'Getting AKV credentials'
  timeoutInMinutes: 1
  retryCountOnTaskFailure: 5  
  inputs:    
    azureSubscription: DevOpsSharedResources
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

- task: DownloadSecureFile@1
  name: CustomSettings
  displayName: 'Download custom settings.xml from secure file'
  inputs:
    secureFile: '$(MAVEN_CUSTOM_SETTINGS_SECURE_FILE)'
  condition: ne(variables['MAVEN_CUSTOM_SETTINGS_SECURE_FILE'], '')

- bash: |
    MAVEN_SETTINGS_LOCATION=${{ parameters.mavenSettingsLocation }}
    MAVEN_IS_SETTINGS_CUSTOM="false"

    # Supports the use of project's custom settings.xml
    if [[ -f '$(CustomSettings.secureFilePath)' ]]; then
        MAVEN_SETTINGS_LOCATION=$(CustomSettings.secureFilePath)
        MAVEN_IS_SETTINGS_CUSTOM="true"
        echo "##[debug]Pipeline will use custom settings.xml file."
    else
        echo "##[debug]Pipeline will use the default settings.xml file."
    fi

    echo "##vso[task.setvariable variable=$OUTPUT_VARIABLE_NAME;isreadonly=true]$MAVEN_SETTINGS_LOCATION"
    echo "##vso[task.setvariable variable=MAVEN_IS_SETTINGS_CUSTOM;isreadonly=true]$MAVEN_IS_SETTINGS_CUSTOM"
  displayName: Checking for settings.xml
  env:
    OUTPUT_VARIABLE_NAME: ${{ parameters.mavenSettingsLocationOutputVarName }}

- task: qetza.replacetokens.replacetokens-task.replacetokens@5
  displayName: 'Configuring custom settings.xml'
  inputs:
    targetFiles: $(CustomSettings.secureFilePath)
    tokenPattern: azpipelines
    actionOnNoFiles: warn
    enableTelemetry: false
  env:
    NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
    NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
  condition: eq(variables['MAVEN_IS_SETTINGS_CUSTOM'], 'true')