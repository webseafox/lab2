parameters:
- name: appName
- name: appNamespace
- name: k8sKubeconfig

steps:
- script: |
    echo "##[debug] Initiating promotion of the application '${{ parameters.appName }}' in the namespace '${{ parameters.appNamespace }}'."
    echo "##[command] kubectl argo rollouts promote ${{ parameters.appName }} -n ${{ parameters.appNamespace }}"
    kubectl-argo-rollouts promote ${{ parameters.appName }} -n ${{ parameters.appNamespace }} --kubeconfig "${{ parameters.k8sKubeconfig }}"
  displayName: 'Promoting application with Argo Rollouts'
  name: promoting_app_argo_rollouts
  workingDirectory: '$(Agent.TempDirectory)'
  env:
    ARGOROLLOUTS_UPGRADE_TIMEOUT: $(ARGOROLLOUTS_UPGRADE_TIMEOUT)