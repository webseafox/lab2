parameters:
- name: newVersion
  type: string
- name: condition
  type: object
- name: createGitTag
  type: boolean
  default: true
- name: enabledCanaryReleaseWithArgoCD
  type: boolean
  default: False


steps:
- ${{ if ne(parameters.enabledCanaryReleaseWithArgoCD, true) }}:
  - template: /tech_products/ecvv/templates/tasks/versioning/update_repo_version.yml
    parameters:
      condition: ${{ parameters.condition }}
      componentNewVersion: ${{ parameters.newVersion }}
      createGitTag: ${{ parameters.createGitTag }}
      bashScript: 
        content: |
        
          echo "##[debug] Update Repository Version:"
          
          # A versão utilizada do NPM é a versão default do Node.js nos agentes
          # Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF)na pasta do projeto 
          npm --no-git-tag-version version ${NEW_VERSION} --allow-same-version
        envs:
          NEW_VERSION: ${{ parameters.newVersion }}

- ${{ else }}:
  - template: /tech_products/ecvv/templates/tasks/versioning/argocd.yml
    parameters:
      condition: ${{ parameters.condition }}
      componentNewVersion: ${{ parameters.newVersion }}
      createGitTag: ${{ parameters.createGitTag }}
      bashScript: 
        content: |
          echo "##[section]#################### TAGGING CANARY RELEASE ####################"
          echo "##[debug] Update Repository Version:"

          # A versão utilizada do NPM é a versão default do Node.js nos agentes
          # Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF)na pasta do projeto 
          npm --no-git-tag-version version ${NEW_VERSION} --allow-same-version
        envs:
          NEW_VERSION: ${{ parameters.newVersion }}
