steps:
- task: DownloadBuildArtifacts@0
  inputs:
    buildType: "current"
    downloadType: "single"
    artifactName: "$(ArtifactName)"
    downloadPath: "$(System.DefaultWorkingDirectory)"

- task: TfxInstaller@4
  inputs:
    version: "$(TFX_INSTALLER_VERSION)"

- template: /tech_products/ecvv/templates/tasks/extension/publish.yml
  parameters:
    publisherId: "$(PUBLISHER_ID)"
    extensionId: "$(EXTENSION_ID)"
    extensionName: "$(EXTENSION_NAME)"
    azdoExtensionServiceConnection: $(AZDO_EXTENSION_SERVICE_CONNECTION)
    artifactName: "$(ArtifactName)"