parameters:
- name: pythonVersion
  type: string

steps:
- template: /tech_products/ecvv/templates/tasks/python/run_bash_on_docker.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    scriptNameOrCmd: 'sh -c "pip download --no-deps -r requirements.artifacts -d libraries"'
    displayName: Download WHL libraries

- bash: |
    mkdir -p $(Build.BinariesDirectory)/libraries/
    cp libraries/*.* $(Build.BinariesDirectory)/libraries/
    cp requirements.artifacts $(Build.BinariesDirectory)

    # CLEAN NOTEBOOKS DIRECTORY
    rm -r $(Build.BinariesDirectory)/notebooks

    # NORMALIZE NOTEBOOK EXCLUSION
    EXCLUDE_NOTEBOOK_DIR_NORMALIZED=$(echo ${EXCLUDE_NOTEBOOK_DIR} | sed 's\,\|\g')

    if [[ -n "${EXCLUDE_NOTEBOOK_DIR_NORMALIZED}" ]]; then
      EXCLUDE_NOTEBOOK_DIR_NORMALIZED=$(echo "|${EXCLUDE_NOTEBOOK_DIR_NORMALIZED}")
    fi

    # COPY NOTEBOOKS
    mkdir -p $(Build.BinariesDirectory)/notebooks
    find . -maxdepth 1 | grep -Pv "./(libraries|.azuredevops|requirements|.git|README.md|VERSIONFILE${EXCLUDE_NOTEBOOK_DIR_NORMALIZED}).*|^(\.)$" | xargs -I '{}' cp -R '{}' $(Build.BinariesDirectory)/notebooks
  displayName: Packaging
  env:
    EXCLUDE_NOTEBOOK_DIR: $(EXCLUDE_NOTEBOOK_DIR)

- template: /tech_products/ecvv/templates/tasks/artifacts/publish_pipeline.yml
  parameters:
    artifactName: databricksPackage
    targetPath: $(Build.BinariesDirectory)