parameters:
- name: pythonVersion
  type: string
- name: currentVersion
  type: string
- name: newVersion
  type: string
  default: ""
- name: incrementLevel
  default: patch

steps:
- template: /tech_products/ecvv/templates/tasks/python/package_with_docker.yml
  parameters:
    pythonVersion: ${{ parameters.pythonVersion }}
    currentVersion: ${{ parameters.currentVersion }}
    newVersion: ${{ parameters.newVersion }}
    incrementLevel: ${{ parameters.incrementLevel }}

- template: /tech_products/ecvv/templates/tasks/python/copy_lib_to_staging.yml

- template: /tech_products/ecvv/templates/tasks/artifacts/publish_pipeline.yml
  parameters:
    displayName: 'Publish Artifact Python Library'
    artifactName: Library