parameters:
- name: newVersion
  default: ""

steps:
- template: /tech_products/ecvv/templates/tasks/maven/custom_settings_setup.yml
  parameters:
    mavenSettingsLocationOutputVarName: "MAVEN_SETTINGS_LOCATION"

- template: /tech_products/ecvv/templates/tasks/maven/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tech_products/ecvv/templates/tasks/maven/cache_dependencies.yml
  parameters:
    appDependenciesCachePathOutputVarName: "APP_DEPENDENCIES_CACHE_PATH"
    appDependenciesCacheFolderOutputVarName: "APP_DEPENDENCIES_CACHE_FOLDER"
    condition: eq(variables.CACHE_APP_DEPENDENCIES, true)

- template: /tech_products/ecvv/templates/tasks/maven/build_with_docker.yml
  parameters:
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)
    appDependenciesCachePath: $(APP_DEPENDENCIES_CACHE_PATH)
    appDependenciesCacheFolder: $(APP_DEPENDENCIES_CACHE_FOLDER)

- template: /tech_products/ecvv/templates/tasks/artifacts/publish_app.yml