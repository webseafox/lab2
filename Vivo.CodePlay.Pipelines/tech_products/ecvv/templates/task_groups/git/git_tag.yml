parameters:
- name: environment
- name: staticTagName
  default: "$(VAR_GIT_TAG)"
- name: dev_namespace_to_deploy
  default: ''

steps:
- template: /tech_products/ecvv/templates/tasks/artifacts/download_app.yml

- template: /tech_products/ecvv/templates/tasks/artifacts/download_docker.yml

- template: /tech_products/ecvv/templates/tasks/helm/utils.yml
  parameters:
    environment: ${{parameters.environment}}
    dev_namespace_to_deploy: ${{parameters.dev_namespace_to_deploy}}

- template: /tech_products/ecvv/templates/tasks/git/tag.yml
  parameters:
    staticTagName: ${{parameters.staticTagName}}