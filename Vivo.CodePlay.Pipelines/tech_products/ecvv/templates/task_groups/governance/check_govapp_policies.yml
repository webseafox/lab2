parameters:
- name: govAppOperation
  type: string 
  default: "validate"

- name: govAppBreakglass
  type: boolean 
  default: false

- name: environment
  type: string

- name: version
  type: string
  default: ''

- name: continueOnError
  type: boolean
  default: true

- name: stack
  type: string 
  values:
  - JAVA
  - NODEJS
  - PYTHON

- name: dev_namespace_to_deploy
  default: ''

steps:
  - ${{ if eq(parameters['govAppOperation'], 'deploy') }}:
    - checkout: self
      fetchDepth: 1

  - ${{ if eq(parameters['version'], '') }}:

    - ${{ if eq(parameters['stack'], 'JAVA')}}:
      - template: /tech_products/ecvv/templates/global/general/set-output-variable.yml
        parameters:
          variable: "APP_VERSION"
          command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)

    - ${{ if eq(parameters['stack'], 'NODEJS')}}:
      - template: /tech_products/ecvv/templates/global/general/set-output-variable.yml
        parameters:
          variable: "APP_VERSION"
          command: $(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)

    - ${{ if eq(parameters['stack'], 'PYTHON')}}:
      - template: /tech_products/ecvv/templates/global/general/set-output-variable.yml
        parameters:
          variable: "APP_VERSION"
          command: $(DOCKER_CMD_EXTRACT_PYTHON_SETUP_VERSION)

  - template: /tech_products/ecvv/templates/tasks/docker/export_k8s_namespace.yml
    parameters:
      environment: ${{ parameters.environment }}
      variableNameOut: "K8S_NAMESPACE_GOVAPP"
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}

  - task: Governance@0
    inputs:
      breakglass: ${{ parameters.govAppBreakglass }}
      cluster: $(K8S_CLUSTER)
      component: $(Build.DefinitionName)
      deployment: $(Build.DefinitionName)
      environment: ${{ parameters.environment }}
      namespace: $(K8S_NAMESPACE_GOVAPP)
      operation: ${{ parameters.govAppOperation }}
      serverEndpoint: $(GOVAPP_SERVICE_CONNECTION_NAME)
      ${{ if eq(parameters['version'], '') }}:
        version: $(APP_VERSION)
      ${{ else }}:
        version: ${{ parameters.version }}
    continueOnError: ${{ parameters.continueOnError }}
    condition: eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')