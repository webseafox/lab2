# Vivo Pipeline Core's entrypoint
# ===============================================================
#
# Usage sample for end user:
#
# resources:
#   repositories:
#     - repository: CodePlay
#       name: DevOps/Vivo.Core.Pipelines
#       type: git       
#       ref: refs/tags/v1
#       endpoint: CodePlay
#
# extends:
#   template: /tech_products/adbb-aem/provisioners/entrypoint.yml@CodePlay
#   parameters:
#     config:
#       pipelineType: app
#       technology: java
#       modelName: api_default
#       branchingStrategy: trunkbased
#       params:
#         qa_environment: '${{parameters.qa_environment}}'
#         run_component_test: true
# ===============================================================

parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    technology: salesforce
    modelName: default # lib_default, default

# Template selection switches based on pipeline configuration parameters
extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/salesforce-automation/provisioners/${{ parameters.config.technology }}/${{ parameters.config.modelName}}/provisioner_entry_pr.yml
  ${{ else }}:
    template: /tech_products/salesforce-automation/provisioners/${{ parameters.config.technology }}/${{ parameters.config.modelName}}/provisioner_entry.yml
  ${{ if parameters.config.params }}:
    parameters: ${{ parameters.config.params }}
