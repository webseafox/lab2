parameters:
- name: adobeRemoteUrl
  type: string
  default: $(adobe_remote_url)
- name: adobeBranch
  type: string
  default: ''

variables:
- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions.Salesforce
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

stages:
- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/build.yml

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/quality_gates.yml

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion