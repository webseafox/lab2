parameters:
- name: dependsOn
  type: object
  default: [build]

stages:
- stage: quality_gates
  dependsOn: ${{ parameters.dependsOn }} 
  displayName: Quality Gates
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: run_sonarqube_scanner
    displayName: Run Sonarqube Scanner
    steps:
    - template: /tasks/catalog_info/extract_variables.yml@CorePipelines
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tech_products/adbb-aem/global/general/set-output-variable.yml
      parameters:
        variable: APP_VERSION
        command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
    - template: /task_groups/gates/run_sonarqube_scan.yml@CorePipelines
      parameters:
        stack: JAVA
        projectKey: "$(SONAR_PROJECT_KEY)"