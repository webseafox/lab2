parameters:
- name: adobeRemoteUrl
  type: string
  default: $(adobe_remote_url)
- name: adobeBranch
  type: string
  default: ''

variables:
- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions.Salesforce
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

stages:
- ${{ if or(in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/master-migracao'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
  - template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/check_version.yml

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/build.yml
  ${{ if or(in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/master-migracao'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
    parameters:
      dependsOn: [check_version]

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/quality_gates.yml

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

- ${{ if notIn(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/master-migracao') }}:
  - template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/publish.yml

- template: /tech_products/salesforce-automation/provisioners/salesforce/lib_default/stages/sync.yml
  parameters:
    adobeRemoteUrl: "${{parameters.adobeRemoteUrl}}"
    adobeBranch: "${{parameters.adobeBranch}}"
    ${{ if in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/master-migracao') }}:
      dependsOn: [quality_gates, security]
    ${{ else }}:
      dependsOn: [publish_maven]