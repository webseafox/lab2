parameters:
- name: qa_environment
  type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: run_e2e_tests
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: True
- name: trunkbasedEnvironments
  type: object
  default:
  - dev
  - esteira1
  - esteira2
  - preprod
  - prodlike
  - producao
- name: forceDockerK8sSecretCreation
  type: boolean
  default: True
- name: deployStrategy
  type: string
  default: ''

variables:
- template: /provisioners/app/trunkbased/java/api_default/variables/load.yml@CorePipelines
  parameters:
    environment: ${{ parameters.qa_environment }}
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}
    deployStrategy: ${{ parameters.deployStrategy }}
    useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git       
      ref: refs/tags/v1
      endpoint: CorePipelines

stages: 
# CI / CD Flow

## INIT
- template: /provisioners/app/trunkbased/java/api_default/stages/init.yml@CorePipelines

- ${{ if or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
  ## BUILD & TEST
  - template: /provisioners/app/trunkbased/java/api_default/stages/build_test.yml@CorePipelines

  ## COMPONENT TEST
  - template: /provisioners/app/trunkbased/java/api_default/stages/component_test.yml@CorePipelines
    parameters:
      run_component_test: "${{ parameters.run_component_test }}"

  ## GATES
  - template: /provisioners/app/trunkbased/java/api_default/stages/gates.yml@CorePipelines
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## SECURITY
  - template: /provisioners/app/trunkbased/java/api_default/stages/security_sast_sca.yml@CorePipelines
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /provisioners/app/trunkbased/java/api_default/stages/package.yml@CorePipelines
    parameters:
      run_component_test: "${{ parameters.run_component_test }}"
      environment: "${{ parameters.qa_environment }}"

  ## VALIDATIONS
  - template: /provisioners/app/trunkbased/java/api_default/stages/validation.yml@CorePipelines

  ## DEPLOY
  - ${{ if ne(parameters.skip_deploy, True) }}:
    - template: /tech_products/dip/dip_stages/deploy.yml
      parameters:
        environment: dev
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: true
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
        useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}
        deployStrategy: ${{ parameters.deployStrategy }}

    ## BlueGreen & Canary
    - ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
      ## PROMOTE
      - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_promote.yml@CorePipelines
        parameters:
          environment: dev
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      ## ROLLBACK
      - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_rollback.yml@CorePipelines
        parameters:
          environment: dev
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

  # Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - ${{ if and(ne(parameters.qa_environment, 'deploy-simultaneo'), ne(parameters.qa_environment, 'trunkbased')) }}:
    - template: /tech_products/dip/dip_stages/release.yml
      parameters:
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
        run_e2e_tests: ${{ parameters.run_e2e_tests }}
        environment: ${{ parameters.qa_environment }}
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(parameters.qa_environment) }})
        useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}
        deployStrategy: ${{ parameters.deployStrategy }}     
        
  # Manual Realease Deploy Simultaneo
  - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
    - ${{ if eq(parameters.qa_environment, 'deploy-simultaneo') }}:

      - template: /tech_products/dip/dip_stages/release.yml
        parameters:
          useExternalEnv: ${{ parameters.useExternalEnv }}
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
          run_e2e_tests: ${{ parameters.run_e2e_tests }}
          environment: esteira1
          private_agent_pool: $(PRIVATE_AGENT_ESTEIRA1)
          kubeconfig: $(KUBECONFIG_ESTEIRA1)
          helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_ESTEIRA1)
          useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}
          deployStrategy: ${{ parameters.deployStrategy }}       

      - template: /tech_products/dip/dip_stages/release.yml
        parameters:
          useExternalEnv: ${{ parameters.useExternalEnv }}
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
          run_e2e_tests: ${{ parameters.run_e2e_tests }}
          environment:  preprod
          private_agent_pool: $(PRIVATE_AGENT_PREPROD)
          kubeconfig: $(KUBECONFIG_PREPROD)  
          helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_PREPROD)
          useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}
          deployStrategy: ${{ parameters.deployStrategy }} 

  - ${{ if eq(parameters.qa_environment, 'trunkbased') }}:
    - ${{ each tbEnvironment in parameters.trunkbasedEnvironments }}:
        - ${{ if ne(tbEnvironment, 'prodlike') }}:
          - template: /tech_products/dip/dip_stages/release.yml
            parameters:
              useExternalEnv: ${{ parameters.useExternalEnv }}
              azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
              kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
              run_e2e_tests: ${{ parameters.run_e2e_tests }}
              environment: ${{ tbEnvironment }}
              private_agent_pool: $(PRIVATE_AGENT_${{ upper(tbEnvironment) }})
              kubeconfig: $(KUBECONFIG_${{ upper(tbEnvironment) }})
              helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(tbEnvironment) }})
              useArgoRolloutsDeploys: ${{ variables.useArgoRolloutsDeploys }}
              deployStrategy: ${{ parameters.deployStrategy }}            

## DEPLOY BLUE GREEN & CANARY
- ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
  ## PROMOTE
  - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_promote.yml@CorePipelines
    parameters:
      environment: ${{ parameters.qa_environment }}
      dependsOn: release
      kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
      private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
      azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
      kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
  ## ROLLBACK
  - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_rollback.yml@CorePipelines
    parameters:
      environment: ${{ parameters.qa_environment }}
      dependsOn: release
      kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
      private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
      azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
      kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}