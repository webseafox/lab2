parameters:
- name: namespace
  default: $(K8S_NAMESPACE)
- name: namespaceVariableOut
  default: "X_K8S_NAMESPACE"
- name: govAppAcronymEnv
  default: "legacy"

steps:
  - script: |
      set -e

      generate_new_namespace() {
          declare -A domainmap=(
              ["business-partner"]="bsnp"
              ["common"]="cmmn"
              ["customer"]="cstm"
              ["enterprise"]="entp"
              ["integration"]="intg"
              ["market-sales"]="mkts"
              ["product"]="prdt"
              ["resource"]="rsrc"
              ["service"]="srvc"
          )
          local env=${NAMESPACE%%-*}          # Extract prefix (esteira1)
          local fulldomain=${NAMESPACE#*-}    # Remove prefix (market-sales-domain)
          domain=${fulldomain%-domain}        # Remove -domain suffix
          local acronym=${domainmap[$domain]:-"unknown"} # Default to "unknown" if no match
          echo "dip-$acronym-$env"
      }

      if [[ "${GOV_APP_ACRONYM_ENV}" == "legacy" ]]; then
        # Retain the same namespace
        NEW_NAMESPACE="${NAMESPACE}"
      elif [[ "${GOV_APP_ACRONYM_ENV}" == "dev" && "${NAMESPACE}" == dev-* ]]; then
        NEW_NAMESPACE=$(generate_new_namespace)
      elif [[ "${GOV_APP_ACRONYM_ENV}" == "test" && "${NAMESPACE}" != producao-* ]]; then
        NEW_NAMESPACE=$(generate_new_namespace)
      elif [[ "${GOV_APP_ACRONYM_ENV}" == "prod" ]]; then
        TEMP_NAMESPACE=$(generate_new_namespace)
        NEW_NAMESPACE=${TEMP_NAMESPACE%ucao}
      else
        NEW_NAMESPACE="${NAMESPACE}"
      fi

      echo "##vso[task.setvariable variable=${VARIABLE_NAME};]$NEW_NAMESPACE"

      echo "##[debug] Deploy application NAMESPACE=[$NEW_NAMESPACE]"

      echo "##[debug] NAMESPACE.....................: ${NAMESPACE}"
      echo "##[debug] VARIABLE_NAME.................: ${VARIABLE_NAME}"
      echo "##[debug] GOV_APP_ACRONYM_ENV...........: ${GOV_APP_ACRONYM_ENV}"
    displayName: "Set Governace App Acronym for namespace"
    env:
      NAMESPACE: ${{ parameters.namespace }}
      VARIABLE_NAME: ${{ parameters.namespaceVariableOut }}
      GOV_APP_ACRONYM_ENV: ${{ parameters.govAppAcronymEnv }}