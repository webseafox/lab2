        echo "SYSTEM_JOBATTEMPT=$(System.JobAttempt)"
        echo "SYSTEM_JOBDISPLAYNAME=$(System.JobDisplayName)"
        echo "SYSTEM_JOBNAME=$(System.JobName)"
        echo "SYSTEM_PHASEDISPLAYNAME=$(System.PhaseDisplayName)"
        echo "SYSTEM_PHASENAME=$(System.PhaseName)"
        echo "SYSTEM_STAGEDISPLAYNAME=$(System.StageDisplayName)"
