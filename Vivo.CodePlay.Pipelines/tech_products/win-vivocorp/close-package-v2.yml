parameters:
- name: environment
  type: string
  default: 'pp'
- name: dryRun
  type: boolean
  default: false
- name: enableEmail
  type: boolean
  default: false

resources:
  repositories:
  - repository: repoSource
    type: git
    name: 'VVCP - VIVOCORP/src.src-vivocorp-pp'
    ref: refs/heads/pp
  - repository: repoTarget
    type: git
    name: 'VVCP - VIVOCORP/src.src-vivocorp-prod'
    ref: refs/heads/PROD

stages:
- stage: close_package
  displayName: "Fechar pacote"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: close_package_job
    displayName: "Fecha Pacote + Limpa Repositório"
    steps:
      # [Checkout] Ambos os repos localmente com persistCredentials para push
      - checkout: repoSource
        clean: true
        fetchDepth: 0
        fetchTags: true
        persistCredentials: true
        displayName: '📥 Checkout Repo PP (origem)'

      - checkout: repoTarget
        clean: true
        fetchDepth: 0
        persistCredentials: true
        displayName: '📥 Checkout Repo PROD (destino)'

      # trocando a branch dos repositório baixados para repoSource: pp e repoTarget: PROD
      - script: |
          git -C $(Pipeline.Workspace)/s/src.src-vivocorp-pp checkout pp
          git -C $(Pipeline.Workspace)/s/src.src-vivocorp-prod checkout PROD
        displayName: '🔀 Checkout branches corretas'

      # [Processamento Principal] Fecha pacote + limpa repositório via custom task
      - task: AzdoTaskSiebelFromVivo@1
        name: closePackage
        displayName: '📦 Close Package VVCP (${{ parameters.environment }})'
        inputs:
          command: 'close-package-vvcp'
          closePackageEnvironment: '${{ parameters.environment }}'
          closePackageRepoSource: '$(Pipeline.Workspace)/s/src.src-vivocorp-pp'
          closePackageRepoTarget: '$(Pipeline.Workspace)/s/src.src-vivocorp-prod'
          closePackageGitUserEmail: 'dev.crm.b2b.br@telefonicati.onmicrosoft.com'
          closePackageGitUserName: 'devops_b2b-vivocorp'
          closePackageEnableEmail: '${{ parameters.enableEmail }}'
          dryRun: '${{ parameters.dryRun }}'
        env:
          NODE_SKIP_PLATFORM_CHECK: '1'
