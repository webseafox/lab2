stages:
- stage: upload_files
  dependsOn: 
  - compile
  - import_files
  condition: succeeded()
  displayName: "Upload Pacote (SRF)"
  pool: $(PollVivoCorpSiebelAgents)
  jobs:
  - job: put_files
    displayName: "Upload Pacote (SRF)"
    condition: eq(stageDependencies.import_files.import_files.outputs['checkSifFiles.sif_found'], 'true')
    steps:
      - checkout: none
      - task: CmdLine@2
        displayName: "Run SFTP Script"
        inputs:
          script: |
            @echo off
            sftp -o StrictHostKeyChecking=no -i $(SIEBEL_PRIVATE_KEY) -b "$(batchFile)" $(host) 22
            exit
  
  - job: skip_upload
    displayName: "Skip Upload - No SIF Files Found"
    condition: ne(stageDependencies.import_files.import_files.outputs['checkSifFiles.sif_found'], 'true')
    steps:
      - checkout: none
      - task: CmdLine@2
        displayName: "No SIF files found"
        inputs:
          script: |
            echo No SIF files found to upload.
            exit 0