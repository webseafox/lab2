stages:
  - stage: export_adm
    displayName: "Exportação do ADM"
    dependsOn: ['register']
    pool: $(PollVivoCorpSiebelAgents)
    jobs:
      - job: "exportacao_objetos"
        displayName: "Exportação do ADM"
        steps:
          - checkout: none

          - task: PowerShell@2
            displayName: 'Realizar exportação'
            inputs:
              targetType: 'inline'
              script: |
                $command = "ssh -o StrictHostKeyChecking=no -i $(SIEBEL_PRIVATE_KEY) $(SIEBEL_USER)@$(SIEBEL_HOST) '$(PATH_SCRIPT_EXPORT_ADM)'"

                Write-Host "Executando o script no servidor $(SIEBEL_HOST)"
                Invoke-Expression $command

                exit

          - task: PowerShell@2
            displayName: 'Arquivos exportados'
            inputs:
              targetType: 'inline'
              script: |
                # /home/superb/backup directory
                Write-Host "=========================================================================="
                Write-Host "========================= INFORMATIONS ==================================="
                Write-Host "=========================================================================="
                Write-Host "Destino: /home/superb/backup"
                Write-Host "=========================================================================="

                $tempDirectory = "/home/supweb/bkp"

                $lsCommand = "ssh -o StrictHostKeyChecking=no -i $(SIEBEL_PRIVATE_KEY) $(SIEBEL_USER)@$(SIEBEL_HOST) 'ls -l $tempDirectory'"
                
                Write-Host "Listando arquivos no diretório $tempDirectory"
                Invoke-Expression $lsCommand

                exit