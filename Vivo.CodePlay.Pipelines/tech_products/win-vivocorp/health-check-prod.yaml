parameters:
- name: environment
  type: string
  default: 'prd'
  values:
  - 'prod'
  - 'prd'
  - 'pp'
  - 'ppl'

variables:
- template: provisioners/variables/load.yml
  parameters:
    environment: ${{parameters.environment}}

stages:
- stage: health_check
  displayName: "Health Check Siebel Prod"
  pool: $(PollVivoCorpSiebelAgents)
  jobs:
  - job: health_check_job
    displayName: "Run Health Check Siebel Prod"
    condition: always()
    steps:
    - checkout: none

    - task: CmdLine@2
      displayName: 'Teste SSH Grupo 1-2'
      continueOnError: true
      inputs:
        script: |
          echo ==========================================================================
          echo                    TESTE SSH GRUPO 1-2
          echo ==========================================================================
          echo Ambiente: $(environmentNameUpperCase)
          echo.
          echo [INFO] Testando Servidor 1: $(SIEBEL_USER)@10.238.7.12:22 (SB_PRD_SRV01/brtlvlts0437sl)
          ssh -o StrictHostKeyChecking=yes -i "$(SIEBEL_PRIVATE_KEY)" $(SIEBEL_USER)@10.238.7.12 "echo SSH_GROUP_1_2_OK"
          if %errorlevel% equ 0 (
              echo [SUCCESS] $(SIEBEL_USER)@10.238.7.12 está ONLINE
          ) else (
              echo [ERROR] Falha na conexão SSH para $(SIEBEL_USER)@10.238.7.12
          )
          echo.
          echo [INFO] Testando Servidor 2: $(SIEBEL_USER)@10.238.7.13:22 (SB_PRD_SRV02/brtlvlts0438sl)
          ssh -o StrictHostKeyChecking=yes -i "$(SIEBEL_PRIVATE_KEY)" $(SIEBEL_USER)@10.238.7.13 "echo SSH_GROUP_1_2_OK"
