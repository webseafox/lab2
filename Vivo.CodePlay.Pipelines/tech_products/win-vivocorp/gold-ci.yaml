  ## ------------------------------------------------------------------------------ ##
  ## Initial stage to backup the VivoCorp Siebel server and prepare the environment ##
  ## ------------------------------------------------------------------------------ ##
# This pipeline is used to provision the VivoCorp Siebel server.
  ${{ if eq(parameters.model, 'backup') }}:
    stages:
    # - template: stages/backup/identification.yml
    ## ----------------------------------------------------------------- ##
    ## Stage to identify integration objects and prepare the environment ##
    ## ----------------------------------------------------------------- ##
    - stage: identification
      displayName: "Indentificação dos objetos de integração"
      dependsOn: []
      pool: $(GeneralPurposeLinuxAgentsCD)
      variables:
      - name: ALL_SESSION_IDS
        value: ''	
      jobs:
        - job: "object_identification"
          displayName: "Identificação dos objetos"
          steps:
            - checkout: self

            - task: PowerShell@2
              displayName: 'Gerar nome do artefato'
              inputs:
                targetType: 'inline'
                script: |
                  $dateTime = Get-Date -Format "yyyyMMdd-HHmmss"
                  $artifactName = "ADM-backup-$dateTime"
                  
                  Write-Host "##vso[task.setvariable variable=artifactName]$artifactName"
                
            - task: PublishBuildArtifacts@1
              displayName: 'Publicar diretório ADM'
              inputs:
                pathToPublish: '$(Build.SourcesDirectory)/ADM'
                artifactName: '$(artifactName)'
                publishLocation: 'Container'

            - task: PowerShell@2
              displayName: "Extrair SessionId do XML"
              name: "extrair_session_ids"
              inputs:
                targetType: "inline"
                script: |
                  $allSessionIds = @()

                  # Caminho do arquivo de log
                  $logFilePath = "$(Build.ArtifactStagingDirectory)\logfile.txt"

                  # Encontrar todos os arquivos XML dentro do diretório ADM (incluindo subpastas)
                  $xmlFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)\ADM" -Recurse -Filter "*.xml"

                  foreach ($xmlFile in $xmlFiles) {
                      # Carregar o conteúdo do XML
                      try {
                          [xml]$xmlContent = Get-Content -Path $xmlFile.FullName -ErrorAction Stop
                      } catch {
                          $errorMessage = "Erro ao carregar o XML: $($xmlFile.FullName). Detalhes: $_"
                          Write-Host $errorMessage
                          $errorMessage | Out-File -FilePath $logFilePath -Append
                          continue
                      }

                      $sessionId = $null

                      # Usando XPath para encontrar a tag <SessionId>
                      $sessionIdNode = $xmlContent.SelectSingleNode("//SessionId")
                      
                      if ($sessionIdNode -ne $null) {
                          $sessionId = $sessionIdNode.InnerText
                      }

                      # Exibir o resultado e adicionar ao array se encontrado
                      if ($sessionId) {
                          Write-Host "SessionId: $sessionId"
                          $allSessionIds += $sessionId
                      } else {
                          $message = "SessionId não encontrado no XML: $($xmlFile.FullName)"
                          Write-Host $message
                          $message | Out-File -FilePath $logFilePath -Append
                      }
                  }

                  # Converter os SessionIds para uma string separada por vírgulas
                  $sessionIdsString = $allSessionIds -join ","

                  Write-Host "Todos os SessionIds: $sessionIdsString"

                  # Definir a variável de pipeline com todos os SessionIds
                  Write-Host "##vso[task.setvariable variable=ALL_SESSION_IDS;isOutput=true]$sessionIdsString"

    # - template: stages/backup/register.yml
    ## ---------------------------------------------------------- ##
    ## Stage to register the backup in the VivoCorp Siebel server ##
    ## ---------------------------------------------------------- ##
    - stage: register
      displayName: "Registro"
      dependsOn: ['identification']
      pool: $(PollVivoCorpSiebelAgents)
      variables:
      - name: ALL_SESSION_IDS
        value: $[ stageDependencies.identification.object_identification.outputs['extrair_session_ids.ALL_SESSION_IDS'] ]
      jobs:
        - job: "registro_objetos"
          displayName: "Registro de objetos"
          steps:
            - checkout: self
              fetchDepth: 0
              fetchTags: false
            - checkout: CodePlayPipelines
              fetchDepth: 0
              fetchTags: false

            - task: PowerShell@2
              displayName: 'Registro de objetos'
              inputs:
                targetType: 'filePath'
                filePath: '$(Build.SourcesDirectory)\Vivo.CodePlay.Pipelines\tech_products\win-vivocorp\backup.ps1'
                failOnStderr: true
                executable: 'C:\Windows\SysWow64\WindowsPowerShell\v1.0\powershell.exe'
              env:
                ALL_SESSION_IDS: $(ALL_SESSION_IDS)
                ORACLE_HOST_PORT: $(ORACLE_HOST_PORT)
                ORACLE_HOST_SERVICE_NAME: $(ORACLE_HOST_SERVICE_NAME)
                ORACLE_HOST_USER: $(ORACLE_HOST_USER)
                ORACLE_HOST_PASS: $(ORACLE_HOST_PASS)
                FIRST_ORACLE_SERVER: $(ORACLE_HOST_DEV3)
                SECOND_ORACLE_SERVER: $(ORACLE_HOST_DEV1)
                THIRD_ORACLE_SERVER: $(ORACLE_HOST_DEV2)
                TARGET_ORACLE_SERVER: $(ORACLE_PRD_HOST)
                TARGET_ORACLE_HOST_USER: $(ORACLE_PRD_HOST_USER)
                TARGET_ORACLE_HOST_PASS: $(ORACLE_PRD_HOST_PASS)
                TARGET_ORACLE_HOST_SERVICE_NAME: $(ORACLE_PRD_HOST_SERVICE_NAME)
                LOG_PATH: $(Build.ArtifactStagingDirectory)

            - task: PublishBuildArtifacts@1
              displayName: 'Publicar log artefato'
              inputs:
                pathToPublish: '$(Build.ArtifactStagingDirectory)\logfile.log'
                artifactName: 'register.log'
                publishLocation: 'Container'
    ## ----------------------------------------------------------------- ##
    ## End of stage to register the backup in the VivoCorp Siebel server ##
    ## ----------------------------------------------------------------- ##

    # - template: stages/backup/export_adm.yml
    ## ---------------------------------------------------- ##
    ## Stage to export ADMs from the VivoCorp Siebel server ##
    ## ---------------------------------------------------- ##
    - stage: export_adm
      displayName: "Exportação do ADM"
      dependsOn: ['register']
      pool: $(PollVivoCorpSiebelAgents)
      jobs:
        - job: "exportacao_objetos"
          displayName: "Exportação do ADM"
          steps:
            - checkout: none

            - task: PowerShell@2
              displayName: 'Realizar exportação'
              inputs:
                targetType: 'inline'
                script: |
                  $command = "ssh -o StrictHostKeyChecking=no -i $(SIEBEL_PRIVATE_KEY) $(SIEBEL_USER)@$(SIEBEL_HOST) '$(PATH_SCRIPT_EXPORT_ADM)'"

                  Write-Host "Executando o script no servidor $(SIEBEL_HOST)"
                  Invoke-Expression $command

                  exit

            - task: PowerShell@2
              displayName: 'Arquivos exportados'
              inputs:
                targetType: 'inline'
                script: |
                  # /home/superb/backup directory
                  Write-Host "=========================================================================="
                  Write-Host "========================= INFORMATIONS ==================================="
                  Write-Host "=========================================================================="
                  Write-Host "Destino: /home/superb/backup"
                  Write-Host "=========================================================================="

                  $tempDirectory = "/home/supweb/bkp"

                  $lsCommand = "ssh -o StrictHostKeyChecking=no -i $(SIEBEL_PRIVATE_KEY) $(SIEBEL_USER)@$(SIEBEL_HOST) 'ls -l $tempDirectory'"
                  
                  Write-Host "Listando arquivos no diretório $tempDirectory"
                  Invoke-Expression $lsCommand

                  exit
    ## ----------------------------------------------------------- ##
    ## End of stage to export ADMs from the VivoCorp Siebel server ##
    ## ----------------------------------------------------------- ##

  ## ------------------------------------------------------------------------------------- ##
  ## End of initial stage to backup the VivoCorp Siebel server and prepare the environment ##
  ### ------------------------------------------------------------------------------------ ##