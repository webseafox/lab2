parameters:
- name: command
  type: string
  default: ''
- name: environment
  type: string
  default: 'prd'
- name: timeout
  type: number
  default: 20000

variables:
- template: provisioners/variables/load.yml
  parameters:
    environment: ${{parameters.environment}}

stages:
- stage: prod_new_stage
  displayName: "Rodando no ambiente ${{ parameters.environment }} o comando ${{ parameters.command }}"
  pool: $(PollVivoCorpSiebelAgents)
  jobs:
  - job: prod_new_job
    displayName: "Job para rodar no ambiente ${{ parameters.environment }} o comando ${{ parameters.command }}"
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
      - checkout: CodePlayPipelines

      # Validando se a variável scriptsProdNew e command estão sendo recebida corretamente
      # Validação condicional baseada no valor do parameter command
      - ${{ if eq(parameters.command, 'stop_srv.bat') }}:
        - script: |
            echo "Iniciando execução do comando: ${{ parameters.command }}"
            echo "validando se variável $(scriptsProdNew) está sendo recebida corretamente"
            if not exist "$(Build.ArtifactStagingDirectory)\logs" mkdir "$(Build.ArtifactStagingDirectory)\logs"
          displayName: 'Exibindo comando a ser executado no ambiente ${{ parameters.environment }}'
          condition: always()

        # Criando cabeçalho do log de execução do comando principal
        - script: |
            echo === INICIO DA EXECUCAO - STOP_SRV === > "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Data/Hora: %date% %time% >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Comando: ${{ parameters.command }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Script Path: $(scriptsProdNew)${{ parameters.command }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Ambiente: ${{ parameters.environment }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
          displayName: 'Criando cabeçalho do log - comando principal'
          condition: always()

        # Executando comando stop_srv.bat
        - script: |
            call "$(scriptsProdNew)${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            set SCRIPT_EXIT_CODE=%ERRORLEVEL%
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo === FIM DA EXECUCAO - STOP_SRV === >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Exit Code: %SCRIPT_EXIT_CODE% >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            exit /b %SCRIPT_EXIT_CODE%
          displayName: 'Executando script ${{ parameters.command }} no ambiente ${{ parameters.environment }}'
          condition: always()

        # Criando cabeçalho do log de execução do check_srv.bat
        - script: |
            echo === INICIO DA EXECUCAO - CHECK_SRV === > "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo Data/Hora: %date% %time% >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo Comando: check_srv.bat >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo Script Path: $(scriptsProdNew)check_srv.bat >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo Ambiente: ${{ parameters.environment }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
          displayName: 'Criando cabeçalho do log - validação check_srv'
          condition: always()

        # Executando validação check_srv.bat
        - script: |
            call "$(scriptsProdNew)check_srv.bat" >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log" 2>&1
            set CHECK_EXIT_CODE=%ERRORLEVEL%
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo === FIM DA EXECUCAO - CHECK_SRV === >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
            echo Exit Code: %CHECK_EXIT_CODE% >> "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
          displayName: 'Executando validação check_srv.bat no ambiente ${{ parameters.environment }}'
          condition: always()

        # Gerando sumário da execução para stop_srv.bat
        - script: |
            echo "=== SUMÁRIO DA EXECUÇÃO - STOP_SRV ===" > "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Data/Hora: %date% %time%" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Comando executado: ${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Comando de validação: check_srv.bat" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Ambiente: ${{ parameters.environment }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Working Directory: $(Build.SourcesDirectory)" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Script Path: $(scriptsProdNew)${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "=== ARQUIVOS DE LOG GERADOS ===" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            if exist "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" (
                echo "execution-main-${{ parameters.environment }}.log - Tamanho: " >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
                for %%i in ("$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log") do echo %%~zi bytes >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            )
            if exist "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log" (
                echo "execution-check-${{ parameters.environment }}.log - Tamanho: " >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
                for %%i in ("$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log") do echo %%~zi bytes >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            )
          displayName: 'Gerando sumário da execução - stop_srv'
          condition: always()

      - ${{ else }}:
        - script: |
            echo "Iniciando execução do comando: ${{ parameters.command }}"
            echo "validando se variável $(scriptsProdNew) está sendo recebida corretamente"
            if not exist "$(Build.ArtifactStagingDirectory)\logs" mkdir "$(Build.ArtifactStagingDirectory)\logs"
          displayName: 'Exibindo comando a ser executado no ambiente ${{ parameters.environment }}'
          condition: always()

        - script: |
            echo "validando se o agent consegue acessar a pasta clonada no workdir e navegar até tech_products/win-vivocorp/siebel_devops/paliativo/prod"
            echo "Validando acesso ao diretório do script..."
            echo " validando Build.SourcesDirectory $(Build.SourcesDirectory)"

            echo "Listando conteúdo fora do diretório de scripts $(scriptsProdNew):"
            dir
            echo "Navegando até o diretório do script e listando conteúdo:"
            cd $(scriptsProdNew)
            dir
          displayName: 'Validando acesso ao diretório do script'

        # Criando cabeçalho do log de execução genérica
        - script: |
            echo === INICIO DA EXECUCAO - GENERIC === > "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo Data/Hora: %date% %time% >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo Comando: ${{ parameters.command }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo Script Path: $(scriptsProdNew)${{ parameters.command }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo Ambiente: ${{ parameters.environment }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
          displayName: 'Criando cabeçalho do log - comando genérico'
          condition: and(always(), ne('${{ parameters.command }}', ''))

        # Executando comando genérico
        - script: |
            cmd /c "$(scriptsProdNew)${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log" 2>&1
            set SCRIPT_EXIT_CODE=%ERRORLEVEL%
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo === FIM DA EXECUCAO - GENERIC === >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            echo Exit Code: %SCRIPT_EXIT_CODE% >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            exit /b %SCRIPT_EXIT_CODE%
          displayName: 'Executando script ${{ parameters.command }} no ambiente ${{ parameters.environment }}'
          condition: and(succeeded(), ne('${{ parameters.command }}', ''))

        # Gerando sumário da execução genérica
        - script: |
            echo "=== SUMÁRIO DA EXECUÇÃO - GENERIC ===" > "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Data/Hora: %date% %time%" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Comando executado: ${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Ambiente: ${{ parameters.environment }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Working Directory: $(Build.SourcesDirectory)" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Script Path: $(scriptsProdNew)${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "=== ARQUIVOS DE LOG GERADOS ===" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            if exist "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log" (
                echo "execution-generic-${{ parameters.environment }}.log - Tamanho: " >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
                for %%i in ("$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log") do echo %%~zi bytes >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            )
          displayName: 'Gerando sumário da execução - genérica'
          condition: and(always(), ne('${{ parameters.command }}', ''))

      # Tratamento para comando vazio
      - script: |
          echo "Nenhum comando fornecido para execução."
        displayName: 'Nenhum comando fornecido'
        condition: and(succeeded(), eq('${{ parameters.command }}', ''))

      # Exibindo conteúdo dos logs no console para debug
      - script: |
          echo "=== CONTEÚDO DOS LOGS GERADOS ==="
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" (
            echo "--- execution-main-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log" (
            echo "--- execution-check-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log" (
            echo "--- execution-generic-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log" (
            echo "--- execution-summary-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
          )
        displayName: 'Exibindo logs no console (debug)'
        condition: always()

      # Publica os logs da execução local como artefatos
      - task: PublishBuildArtifacts@1
        displayName: 'Publicando log da execução - Main'
        condition: always()
        inputs:
          pathToPublish: '$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log'
          artifactName: 'execution-main-log'
          publishLocation: 'Container'
          
      - task: PublishBuildArtifacts@1
        displayName: 'Publicando log da execução - Check'
        condition: always()
        inputs:
          pathToPublish: '$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log'
          artifactName: 'execution-check-log'
          publishLocation: 'Container'
          
      - task: PublishBuildArtifacts@1
        displayName: 'Publicando log da execução - Generic'
        condition: always()
        inputs:
          pathToPublish: '$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log'
          artifactName: 'execution-generic-log'
          publishLocation: 'Container'

      # Publica todos os logs como um artefato conjunto
      - task: PublishBuildArtifacts@1
        displayName: 'Publicando todos os logs de execução'
        condition: always()
        inputs:
          pathToPublish: '$(Build.ArtifactStagingDirectory)\logs'
          artifactName: 'command-execution-logs'
          publishLocation: 'Container'