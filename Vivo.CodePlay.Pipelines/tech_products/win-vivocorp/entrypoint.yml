parameters:
- name: environment 
  type: string
- name: model 
  type: string
  default: 'deploy'

extends:
  ${{ if eq(parameters.model, 'deploy') }}:
    template: provisioners/provisioner_entry.yml
    parameters: 
      environment: ${{parameters.environment}}
  ${{ if eq(parameters.model, 'backup') }}:
    template: provisioners/provisioner_entry_backup.yml
    parameters: 
      environment: ${{parameters.environment}}