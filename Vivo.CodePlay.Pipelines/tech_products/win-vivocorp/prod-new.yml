            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.6.65 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
