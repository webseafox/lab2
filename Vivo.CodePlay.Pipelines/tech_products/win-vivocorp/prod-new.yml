          inputs:
            targetType: 'inline'
            script: |
              $srcDir = "$(Build.SourcesDirectory)\src.src-vivocorp-prod"
              
              Write-Host "=== ANTES DA LIMPEZA ===" -ForegroundColor Cyan
              Get-ChildItem -Path $srcDir -Force | Select-Object -ExpandProperty Name
              
              Write-Host "`n=== REMOVENDO ARQUIVOS ===" -ForegroundColor Yellow
              Get-ChildItem -Path $srcDir -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin @('.git', '.azuredevops') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              
              Write-Host "`n=== DEPOIS DA LIMPEZA ===" -ForegroundColor Cyan
              Get-ChildItem -Path $srcDir -Force | Select-Object -ExpandProperty Name
              
              if (-not (Test-Path "$srcDir\.git")) {
                Write-Host "`n✗ ERRO: .git NÃO ENCONTRADO!" -ForegroundColor Red
                exit 1
              }
              
              Write-Host "`n✓ .git encontrado - continuando com commit" -ForegroundColor Green
              cd $srcDir
              git config user.email "$(GIT_AUTHOR_EMAIL)"
              git config user.name "$(GIT_AUTHOR_NAME)"
              git config http.extraheader "AUTHORIZATION: bearer $(System.AccessToken)"
              git add -A
              git commit -m "Repository cleanup - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -q 2>$null
              git push origin HEAD:$(Build.SourceBranchName)

