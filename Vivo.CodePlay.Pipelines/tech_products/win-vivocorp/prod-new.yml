stages:
- stage: prod_new_stage
  displayName: "Rodando no ambiente ${{ parameters.environment }} o comando ${{ parameters.command }}"
  pool: $(PollVivoCorpSiebelAgents)
  jobs:
  - job: prod_new_job
    displayName: "Job para rodar no ambiente ${{ parameters.environment }} o comando ${{ parameters.command }}"
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
      - checkout: CodePlayPipelines

      # Validando se a variável scriptsProdNew e command estão sendo recebida corretamente
      # Validação condicional baseada no valor do parameter command
      - ${{ if eq(parameters.command, 'stop_srv_az.bat') }}:
        - script: |
            echo "Iniciando execução do comando: ${{ parameters.command }}"
            echo "validando se variável $(scriptsProdNew) está sendo recebida corretamente"
            if not exist "$(Build.ArtifactStagingDirectory)\logs" mkdir "$(Build.ArtifactStagingDirectory)\logs"
          displayName: 'Exibindo comando a ser executado no ambiente ${{ parameters.environment }}'
          condition: always()

        # Criando cabeçalho do log de execução do comando principal
        - script: |
            echo === INICIO DA EXECUCAO - STOP_SRV === > "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Data/Hora: %date% %time% >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Comando: ${{ parameters.command }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Script: Logica internalizada na pipeline >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo Ambiente: ${{ parameters.environment }} >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
            echo. >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
          displayName: 'Criando cabeçalho do log - comando principal'
          condition: always()

        # Executando comando stop_srv_az.bat
        - script: |
            echo Iniciando stop dos servidores... >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"

            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.6.35 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.6.36 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.6.37 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.6.38 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.7.12 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SERVERS_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.7.13 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SERVERS_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.5.32 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
            ssh -i $(SIEBEL_SSH_KEY_PATH) -o StrictHostKeyChecking=no -o BatchMode=yes pcpweb@10.238.5.33 "nohup sudo -u $(SIEBEL_SSH_USER_SUPWEB) $(SIEBEL_SCRIPTS_PATH_STOP) > $(SIEBEL_LOG_PATH) 2>&1 &" >> "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" 2>&1
