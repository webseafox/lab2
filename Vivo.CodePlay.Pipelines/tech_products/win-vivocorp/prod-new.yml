            echo Exit Code: %SCRIPT_EXIT_CODE% >> "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
            exit /b %SCRIPT_EXIT_CODE%
          displayName: 'Executando script ${{ parameters.command }} no ambiente ${{ parameters.environment }}'
          condition: and(succeeded(), ne('${{ parameters.command }}', ''))

        # Gerando sumário da execução genérica
        - script: |
            echo "=== SUMÁRIO DA EXECUÇÃO - GENERIC ===" > "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Data/Hora: %date% %time%" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Comando executado: ${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Ambiente: ${{ parameters.environment }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Working Directory: $(Build.SourcesDirectory)" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "Script Path: $(scriptsProdNew)${{ parameters.command }}" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            echo "=== ARQUIVOS DE LOG GERADOS ===" >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            if exist "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log" (
                echo "execution-generic-${{ parameters.environment }}.log - Tamanho: " >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
                for %%i in ("$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log") do echo %%~zi bytes >> "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
            )
          displayName: 'Gerando sumário da execução - genérica'
          condition: and(always(), ne('${{ parameters.command }}', ''))

      # Tratamento para comando vazio
      - script: |
          echo "Nenhum comando fornecido para execução."
        displayName: 'Nenhum comando fornecido'
        condition: and(succeeded(), eq('${{ parameters.command }}', ''))

      # Exibindo conteúdo dos logs no console para debug
      - script: |
          echo "=== CONTEÚDO DOS LOGS GERADOS ==="
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log" (
            echo "--- execution-main-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-main-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log" (
            echo "--- execution-check-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-check-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log" (
            echo "--- execution-generic-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-generic-${{ parameters.environment }}.log"
          )
          if exist "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log" (
            echo "--- execution-summary-${{ parameters.environment }}.log ---"
            type "$(Build.ArtifactStagingDirectory)\logs\execution-summary-${{ parameters.environment }}.log"
          )
        displayName: 'Exibindo logs no console (debug)'
        condition: always()