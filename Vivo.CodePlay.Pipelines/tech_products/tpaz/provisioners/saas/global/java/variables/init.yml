variables:

# docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.version // .project.parent.version' pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_NAME
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_GROUP
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId // .project.parent.groupId | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_PACKAGING
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.packaging pom.xml)

# java
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: ""
- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"

# coverage_report
- name: COVERAGE_REPORT_SUMMARY_FILE_LOCATION
  value: "**/target/site/jacoco/jacoco.xml"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src/main/java/"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/target/site/jacoco"
- name: COVERAGE_REPORT_ADDITIONAL_FILE
  value: "**/*.exec"

# variables for app/java
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelos+AEM"

# azure artifacts
- name: AZURE_ARTIFACTS_MAVEN_REST_API
  value: https://pkgs.dev.azure.com/$(AZURE_ARTIFACTS_ORGANIZATION)/_apis/packaging/feeds/$(AZURE_ARTIFACTS_FEED)/maven