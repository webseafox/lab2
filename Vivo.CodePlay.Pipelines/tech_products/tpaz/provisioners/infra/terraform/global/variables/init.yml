parameters:
- name: environment
  type: string
  values:
    - dev
    - test
    - prod
    - shared
- name: resourceType
  type: string
  default: ''

variables:
- name: TF_PROVIDER_SERVICE_CONNECTION
  value: sp-terraform-${{ parameters.environment }}
- name: TF_BACKEND_SERVICE_CONNECTION
  value: SharedResources
- name: TF_BACKEND_RESOURCE_GROUP
  value: rg-devops-sharedservices
- name: TF_BACKEND_STORAGE_ACCOUNT
  value: sttfstatedevopsshared
- name: TF_BACKEND_CONTAINER
  value: terraform-state-${{ parameters.environment }}

- name: terraformVersion 
  value: 1.4.5
- name: tfvarsLocation
  value: environments/${{ parameters.environment }}/terraform.tfvars.json
- name: tfBackendKey
  value: $(System.TeamProject)/$(Build.Repository.Name)/terraform.tfstate
- name: sshKnownHostsEntry
  value: 'ssh.dev.azure.com ssh-rsa '
- name: sshKeySecureFile
  value: ''
- name: approvalApplyEnvironment
  value: terraform-approval-apply-${{ parameters.environment }}
- name: approvalDestroyEnvironment
  value: terraform-approval-destroy-${{ parameters.environment }}
- name: TF_VAR_runtime_tags
  value: '{"trilha":"${{ parameters.environment }}","repositorio":"$(Build.Repository.Uri)"}'
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Terraform+-+Azure"
- name: PROXY_TF_NO_PROXY
  value: "$(PROXY_NSKP_NO_PROXY),$(TF_BACKEND_STORAGE_ACCOUNT).blob.core.windows.net"
- name: environment
  value: ${{ parameters.environment }}
- name: checkovEnabled
  value: true
- name: checkovBaselineFile
  value: $(Build.SourcesDirectory)/.checkov.baseline
- name: tfsecEnabled
  value: true
- name: infracostEnabled
  value: true
- name: ansiblePlaybookLocation
  value: $(System.DefaultWorkingDirectory)/ansible/playbook.yml
- name: AZDO_ORG_SERVICE_URL
  value: 'https://dev.azure.com/telefonica-vivo-brasil'
- name: TF_LOG
  value: ERROR
- name: ANSIBLE_VERBOSITY
  value: 2
- ${{ if contains(parameters.resourceType, 'oci') }}:
  - name: SENHA_SEGURA_BASE_URL
    value: 'https://calisto.redecorp.br'
  - name: SENHA_SEGURA_DOMAIN_SENHA_ID
    value: '2044'  # SVC_OCIAD - Usuário de Domínio Privilegiado em Calisto (OCI)
- ${{ else }}:
  - name: SENHA_SEGURA_BASE_URL
    value: 'https://venus.redecorp.br' # para HML usar 'https://brtlvlty0509pl.redecorp.br'
  - name: SENHA_SEGURA_DOMAIN_SENHA_ID
    value: '1474'  # Equivalente em Venus (Azure) - para HML usar '203'
- name: SENHA_SEGURA_CERTIFICATE_AUTHORITY
  value: '1'
# Valor das variáveis abaixo será obtido do AKV DevOps, se variável não definida na Library.
- name: SENHA-SEGURA-PAM-CLIENT-ID
  value: ''
- name: SENHA-SEGURA-PAM-CLIENT-SECRET
  value: ''
- name: SENHA-SEGURA-DSM-CLIENT-ID
  value: ''
- name: SENHA-SEGURA-DSM-CLIENT-SECRET
  value: ''
- name: SENHA-SEGURA-CERTIFICATE-CLIENT-ID
  value: ''
- name: SENHA-SEGURA-CERTIFICATE-CLIENT-ID
  value: ''
- name: PHPIPAM_APP_ID
  value: 'platformcode'
- name: PHPIPAM_ENDPOINT_ADDR
  value: 'http://10.240.42.97:8000/api'
- name: PHPIPAM_USER_NAME
  value: 'platformcode'
- name: JENKINS_URL
  value: https://automacoes.vivo.com.br/job/liberacao-regra-firewall-aks/buildWithParameters
- name: JENKINS_USER
  value: SVC_AZ_IAC_DEVOPS
- name: HELM_VERSION
  value: '3.11.0'
- name: HELM_DEBUG_LEVEL
  value: 1