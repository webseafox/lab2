parameters:
- name: environment
- name: varFileSecureFileEnabled
- name: setupGitConfigSSH

stages:
- stage: stage_apply
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: 'APPLY -> ${{ parameters.environment }}'
  dependsOn: stage_plan
  condition: succeeded()
  jobs:
  - deployment: job_apply
    displayName: 'APPLY -> ${{ parameters.environment }}'
    environment: $(approvalApplyEnvironment)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: /tech_products/tpaz/tasks/bash/welcome.yml
          - template: /tech_products/tpaz/tasks/terraform/install.yml
          - template: /tech_products/tpaz/tasks/terraform/azure/init.yml
            parameters:
              setupGitConfigSSH: ${{ parameters.setupGitConfigSSH }}
          - template: /tech_products/tpaz/tasks/artifacts/download_secure_files.yml
            parameters:
              name: tfvarsSecureFile
              secureFile: "$(Build.DefinitionName)-${{ lower(parameters.environment) }}.tfvars.json"
              enabled: ${{ parameters.varFileSecureFileEnabled }}
          - template: /tech_products/tpaz/tasks/terraform/azure/apply.yml
            parameters:
              ${{ if eq(parameters.varFileSecureFileEnabled, true) }}:
                commandOptions: "-var-file=$(tfvarsSecureFile.secureFilePath) -var-file=$(tfvarsLocation)"
              ${{ else }}:
                commandOptions: "-var-file=$(tfvarsLocation) --auto-approve"
          - template: /tech_products/tpaz/tasks/terraform/azure/output.yml
          - template: /tech_products/tpaz/tasks/artifacts/publish_pipeline.yml
            parameters:
              artifactName: terraform_apply