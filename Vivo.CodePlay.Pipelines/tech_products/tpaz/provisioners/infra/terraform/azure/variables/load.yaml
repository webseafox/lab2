parameters:
- name: environment
- name: action
# resourceType utilizado para identificar o provider:
# OCI (Calisto): vm-oci-linux, vm-oci-windows
# Azure (Venus): vm-linux, vm-windows
- name: resourceType
  type: string
  default: ''

variables:
- template: /tech_products/tpaz/global/variables/pipeline.yml

- template: /tech_products/tpaz/provisioners/infra/terraform/global/variables/init.yml
  parameters:
    environment: ${{ parameters.environment }}
    resourceType: ${{ parameters.resourceType }}

- name: PHPIPAM_APP_ID
  value: 'platformcode'
- name: PHPIPAM_ENDPOINT_ADDR
  value: 'http://10.240.42.97:8000/api'
- name: PHPIPAM_USER_NAME
  value: 'platformcode'
- name: VM-SVC-SSCS-DEFAULT-PASSWORD
  value: ''
- name: VM-LINUX-ROOT-DEFAULT-PASSWORD
  value: ''
- name: VM-WINDOWS-SPT8486F-DEFAULT-PASSWORD
  value: ''

- group: azdo-team-project-variables

- group: terraform-config-${{ parameters.environment }}

- template: /.azuredevops/variables/private.yml@self

# Read-only
- name: isApply
  value: ${{ eq(parameters.action, 'apply') }}
- name: isDestroy
  value: ${{ eq(parameters.action, 'destroy') }}
- name: isImport
  value: ${{ eq(parameters.action, 'import') }}