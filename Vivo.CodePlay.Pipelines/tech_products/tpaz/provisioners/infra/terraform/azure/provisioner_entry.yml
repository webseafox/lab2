parameters:
- name: environment
  type: string
  values:
    - dev
    - test
    - prod
    - shared
- name: action
  type: string
  values:
    - plan
    - apply
    - destroy
    - import
- name: resourceType
  type: string
  default: ''
- name: varFileSecureFileEnabled
  displayName: Load tfvars.json from Library Secure File?
  type: boolean
  default: false
- name: resourceAddress
  type: string
  default: ''
- name: resourceId
  type: string
  default: ''

variables:
- template: variables/load.yaml
  parameters:
    environment: ${{ parameters.environment }}
    action: ${{ parameters.action }}
    resourceType: ${{ parameters.resourceType }}

stages :
- ${{ if eq(variables.isImport, true) }}:
  - template: stages/import.yml
    parameters:
      environment: ${{ parameters.environment }}
      resourceAddress: ${{ parameters.resourceAddress }}
      resourceId: ${{ parameters.resourceId }}
      setupGitConfigSSH: ${{ ne(variables.sshKeySecureFile, '') }}
- ${{ else }}:
  - template: stages/plan.yml
    parameters:
      action: ${{ parameters.action }}
      environment: ${{ parameters.environment }}
      isDestroy: ${{ variables.isDestroy }}
      varFileSecureFileEnabled: ${{ parameters.varFileSecureFileEnabled }}
      setupGitConfigSSH: ${{ ne(variables.sshKeySecureFile, '') }}

- ${{ if eq(variables.isApply, true) }}:
  - template: stages/apply.yml
    parameters:
      environment: ${{ parameters.environment }}
      varFileSecureFileEnabled: ${{ parameters.varFileSecureFileEnabled }}
      setupGitConfigSSH: ${{ ne(variables.sshKeySecureFile, '') }}
  - ${{ if in(parameters.resourceType, 'vm-linux', 'vm-windows') }}:
    - template: stages/ansible.yml
    - template: stages/senha_segura_apply.yml
      parameters:
        resourceType: ${{ parameters.resourceType }}

- ${{ if eq(variables.isDestroy, true) }}:
  - template: stages/destroy.yml
    parameters:
      environment: ${{ parameters.environment }}
      varFileSecureFileEnabled: ${{ parameters.varFileSecureFileEnabled }}
      setupGitConfigSSH: ${{ ne(variables.sshKeySecureFile, '') }}
  - ${{ if in(parameters.resourceType, 'vm-linux', 'vm-windows') }}:
    - template: stages/senha_segura_destroy.yml