parameters:
- name: gateway
  type: string
  displayName: 'API Gateway'
  values:
  - external

- name: version
  type: string
  displayName: 'Version (leave empty for CI build)'
  default: ''

# Environment Deployment Checkboxes
- name: deploy_dev
  type: boolean
  displayName: 'Dev'
  default: false

- name: deploy_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: deploy_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: deploy_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: deploy_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: deploy_prod
  type: boolean
  displayName: 'Prod'
  default: false

variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}
    version: ${{ parameters.version }}

stages:
# BUILD & PACKAGE STAGES (CI only)
- ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/build.yml
    parameters:
      environments:
      - ${{ if eq(parameters.deploy_dev, true) }}:
        - dev
      - ${{ if eq(parameters.deploy_esteira1, true) }}:
        - esteira1
      - ${{ if eq(parameters.deploy_esteira2, true) }}:
        - esteira2
      - ${{ if eq(parameters.deploy_preprod, true) }}:
        - preprod
      - ${{ if eq(parameters.deploy_prodlike, true) }}:
        - prodlike
      - ${{ if eq(parameters.deploy_prod, true) }}:
        - prod
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/package_publish.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environments:
      - ${{ if eq(parameters.deploy_dev, true) }}:
        - dev
      - ${{ if eq(parameters.deploy_esteira1, true) }}:
        - esteira1
      - ${{ if eq(parameters.deploy_esteira2, true) }}:
        - esteira2
      - ${{ if eq(parameters.deploy_preprod, true) }}:
        - preprod
      - ${{ if eq(parameters.deploy_prodlike, true) }}:
        - prodlike
      - ${{ if eq(parameters.deploy_prod, true) }}:
        - prod

# DEPLOY STAGES: Dynamic environment selection via checkboxes
- ${{ if eq(parameters.deploy_dev, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: dev
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

- ${{ if eq(parameters.deploy_esteira1, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: esteira1
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

- ${{ if eq(parameters.deploy_esteira2, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: esteira2
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

- ${{ if eq(parameters.deploy_preprod, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: preprod
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

- ${{ if eq(parameters.deploy_prodlike, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: prodlike
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

- ${{ if eq(parameters.deploy_prod, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/instance/stages/deploy.yml
    parameters:
      environment: prod
      ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
        dependsOn:
        - stage_build
        - stage_package_publish

# VALIDATION: Fail if no environments selected
- ${{ if and(eq(parameters.deploy_dev, false), eq(parameters.deploy_esteira1, false), eq(parameters.deploy_esteira2, false), eq(parameters.deploy_preprod, false), eq(parameters.deploy_prodlike, false), eq(parameters.deploy_prod, false)) }}:
  - stage: stage_validate_environment_selection
    displayName: 'Validate Environment Selection'
    dependsOn: []
    jobs:
    - job: 'ERROR_NO_ENVIRONMENTS_SELECTED'
      displayName: '❌ ERROR: No environments selected'
      pool: $(PRIVATE_AGENT_DEFAULT)
      steps:
      - script: |
          echo "##[error]At least one environment must be selected"
          exit 1
        displayName: 'Validate Environment Selection'

