parameters:
- name: gateway
  type: string
  displayName: 'API Gateway'
  values:
  - cloud
  - external
  - internal
  - files
  - cmun

- name: defaultRemoteHostFilePath
  type: string
  displayName: 'Default Remote Host File Path'
  default: 'remote-host.json'

- name: remoteHostAlias
  type: string
  displayName: 'Remote Host Alias'

- name: organizationName
  type: string
  displayName: 'Organization Name'
  default: 'Telefonica Vivo'

# Environment Import Checkboxes
- name: import_dev
  type: boolean
  displayName: 'Dev'
  default: false

- name: import_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: import_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: import_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: import_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: import_producao
  type: boolean
  displayName: 'Production'
  default: false

variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}

stages:
# REMOTE HOST API IMPORT STAGES: Dynamic environment selection via checkboxes
- ${{ if eq(parameters.import_dev, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: dev
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-dev.json
      organizationName: ${{ parameters.organizationName }}

- ${{ if eq(parameters.import_esteira1, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: esteira1
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-esteira1.json
      organizationName: ${{ parameters.organizationName }}

- ${{ if eq(parameters.import_esteira2, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: esteira2
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-esteira2.json
      organizationName: ${{ parameters.organizationName }}

- ${{ if eq(parameters.import_preprod, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: preprod
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-preprod.json
      organizationName: ${{ parameters.organizationName }}

- ${{ if eq(parameters.import_prodlike, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: prodlike
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-prodlike.json
      organizationName: ${{ parameters.organizationName }}

- ${{ if eq(parameters.import_producao, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/manager_remote_hosts_api/stages/import.yml
    parameters:
      remoteHostAlias: ${{ parameters.remoteHostAlias }}
      environment: producao
      defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
      gatewayRemoteHostFilePath: gateway/remote-host-${{ parameters.gateway }}.json
      environmentRemoteHostFilePath: environment/remote-host-producao.json
      organizationName: ${{ parameters.organizationName }}

# VALIDATION: Fail if no environments selected
- ${{ if and(eq(parameters.import_dev, false), eq(parameters.import_esteira1, false), eq(parameters.import_esteira2, false), eq(parameters.import_preprod, false), eq(parameters.import_prodlike, false), eq(parameters.import_producao, false)) }}:
  - stage: stage_validate_environment_selection
    displayName: 'Validate Environment Selection'
    dependsOn: []
    jobs:
    - job: 'ERROR_NO_ENVIRONMENTS_SELECTED'
      displayName: '❌ ERROR: No environments selected'
      pool: $(PRIVATE_AGENT_DEFAULT)
      steps:
      - script: |
          echo "##[error]At least one environment must be selected"
          exit 1
        displayName: 'Validate Environment Selection'
