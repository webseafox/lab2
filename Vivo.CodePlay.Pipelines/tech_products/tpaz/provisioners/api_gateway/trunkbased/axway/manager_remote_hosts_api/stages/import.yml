parameters:
- name: environment
  type: string
- name: defaultRemoteHostFilePath
  type: string
- name: gatewayRemoteHostFilePath
  type: string
- name: environmentRemoteHostFilePath
  type: string
- name: remoteHostAlias
  type: string
- name: dependsOn
  type: object
  default: []
- name: organizationName
  type: string

stages:
- stage: stage_import_${{ parameters.environment }}
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: 'Import ${{ parameters.environment }}'
  dependsOn: ${{ parameters.dependsOn }}
  variables:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL_${{ upper(parameters.environment) }})
    ADMIN_USERNAME: $[ coalesce(variables.API_MANAGER_ADMIN_USERNAME_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_USERNAME) ]
    ADMIN_PASSWORD: $[ coalesce(variables.API_MANAGER_ADMIN_PASSWORD_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_PASSWORD) ]
    PATCHED_FILE_PATH: $(System.DefaultWorkingDirectory)/patched_file.json
  jobs:
  - deployment: import
    displayName: 'Import remote host - ${{ parameters.environment }}'
    environment: deploy-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            clean: true
          - template: /tasks/axway/organizations/get_id.yml
            parameters:
              organizationName: ${{ parameters.organizationName }}
          - template: /tasks/axway/remote_host/merge_files.yaml
            parameters:
              defaultRemoteHostFilePath: ${{ parameters.defaultRemoteHostFilePath }}
              gatewayRemoteHostFilePath: ${{ parameters.gatewayRemoteHostFilePath }}
              environmentRemoteHostFilePath: ${{ parameters.environmentRemoteHostFilePath }}
              outputFilePath: $(PATCHED_FILE_PATH)
              remoteHostAlias: ${{ parameters.remoteHostAlias }}
              organizationId: $(ORGANIZATION_ID)
          - template: /tasks/axway/remote_host/get.yaml
            parameters:
              remoteHostAlias: ${{ parameters.remoteHostAlias }}
          - template: /tasks/axway/remote_host/update.yaml
            parameters:
              remoteHostID: ${{ variables.remote_host_get.REMOTE_HOST_ID }}
              remoteHostFilePath: $(PATCHED_FILE_PATH)
          - template: /tasks/axway/remote_host/create.yaml
            parameters:
              remoteHostID: ${{ variables.remote_host_get.REMOTE_HOST_ID }}
              remoteHostFilePath: $(PATCHED_FILE_PATH)