parameters:
- name: environment
- name: applicationName
- name: description
- name: email
- name: phone
- name: clientID
- name: organizationName
- name: corsOrigins
- name: export
  default: false

stages:
- stage: stage_create_${{ parameters.environment }}
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: "Create App - ${{ parameters.environment }}"
  variables:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL_${{ upper(parameters.environment) }})
    ADMIN_USERNAME: $[ coalesce(variables.API_MANAGER_ADMIN_USERNAME_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_USERNAME) ]
    ADMIN_PASSWORD: $[ coalesce(variables.API_MANAGER_ADMIN_PASSWORD_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_PASSWORD) ]
  dependsOn:
  - stage_catalog
  jobs:
  - deployment: create_application
    displayName: Create Application - ${{ parameters.applicationName }}
    environment: deploy-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - template: /tasks/axway/organizations/get_id.yml
            parameters:
              organizationName: ${{ parameters.organizationName }}
          - template: /tasks/axway/applications/new_application.yml
            parameters:
              applicationName: ${{ parameters.applicationName }}
              organizationID: $(ORGANIZATION_ID)
              description: ${{ parameters.description }}
              email: ${{ parameters.email }}
              phone: ${{ parameters.phone }}
          - template: /tasks/axway/applications/new_external_credentials.yml
            parameters:
              applicationID: $(APPLICATION_ID)
              clientID: ${{ parameters.clientID }}
              corsOrigins: ${{ parameters.corsOrigins }}
          - template: /tasks/axway/api_key/get.yml
            parameters:
              applicationID: $(APPLICATION_ID)
          - template: /tasks/axway/api_key/create.yml
            parameters:
              applicationID: $(APPLICATION_ID)
              condition: and(succeeded(), eq(variables['APPLICATION_API_KEYS'], ''))
          - ${{ if eq(parameters.export, true) }}:
            - template: /tasks/axway/applications/export.yml
              parameters:
                applicationID: $(APPLICATION_ID)
                fileName: $(APPLICATION_EXPORT_FILE_NAME)
                workingDirectory: $(Build.ArtifactStagingDirectory)
            - template: /tasks/artifacts/publish_pipeline.yml
              parameters:
                artifactName: application