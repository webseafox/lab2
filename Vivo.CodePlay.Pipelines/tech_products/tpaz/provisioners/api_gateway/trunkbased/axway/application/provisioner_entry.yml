parameters:
- name: gateway
  type: string
  values:
  - cloud
  - external
  - internal
  - files
  - cmun
- name: applicationName
  type: string
- name: description
  type: string
- name: email
  type: string
- name: phone
  type: string
- name: clientID
  type: string
- name: organizationName
  type: string
- name: corsOrigins
  type: string
  displayName: 'CORS Origins'
  default: "*"

# Environment Creation Checkboxes
- name: create_dev
  type: boolean
  displayName: 'Dev'
  default: false

- name: create_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: create_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: create_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: create_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: create_producao
  type: boolean
  displayName: 'Production'
  default: false

variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/application/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}

stages:
# CATALOG STAGE (always run)
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/application/stages/catalog.yml
  parameters:
    applicationName: ${{ parameters.applicationName }}
    description: ${{ parameters.description }}
    email: ${{ parameters.email }}
    phone: ${{ parameters.phone }}
    organizationName: ${{ parameters.organizationName }}
    failApplicationNotFound: ${{ eq(parameters.create_producao, true) }}

