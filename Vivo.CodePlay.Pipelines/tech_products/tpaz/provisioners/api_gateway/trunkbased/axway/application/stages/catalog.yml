parameters:
- name: applicationName
- name: description
- name: email
- name: phone
- name: organizationName
- name: failApplicationNotFound

stages:
- stage: stage_catalog
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Update Catalog
  dependsOn: []
  jobs:
  - job: job_update_catalog
    displayName: Update Catalog
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
    - template: /provisioners/api_gateway/trunkbased/axway/application/task_groups/add_application.yml
      parameters:
        organizationName: ${{ parameters.organizationName }}
        applicationName: ${{ parameters.applicationName }}
        email: ${{ parameters.email }}
        phone: ${{ parameters.phone }}
        description: ${{ parameters.description }}
        failApplicationNotFound: ${{ parameters.failApplicationNotFound }}