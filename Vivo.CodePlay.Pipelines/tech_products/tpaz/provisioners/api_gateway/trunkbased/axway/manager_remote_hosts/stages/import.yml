parameters:
- name: environment
- name: remoteHostAlias
- name: dependsOn
  type: object
  default: []

stages:
- stage: stage_import_${{ parameters.environment }}
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: 'Import ${{ parameters.environment }}'
  dependsOn: ${{ parameters.dependsOn }}
  variables:
    API_MANAGER_URL: $(API_MANAGER_BASE_HOST_URL_${{ upper(parameters.environment) }})
    ADMIN_USERNAME: $[ coalesce(variables.API_MANAGER_ADMIN_USERNAME_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_USERNAME) ]
    ADMIN_PASSWORD: $[ coalesce(variables.API_MANAGER_ADMIN_PASSWORD_${{ upper(parameters.environment) }}, variables.API_MANAGER_ADMIN_PASSWORD) ]
  jobs:
  - deployment: import
    displayName: 'Import remote host - ${{ parameters.environment }}'
    environment: deploy-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            clean: true
          - template: /tasks/axway_cli/download_cli.yml
          - template: /tasks/axway_cli/import_remote_hosts.yml
            parameters:
              environment: ${{ parameters.environment }}
              remoteHostAlias: ${{ parameters.remoteHostAlias }}