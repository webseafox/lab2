parameters:
- name: applicationName
- name: apiName

stages:
- stage: stage_catalog
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Update Catalog
  dependsOn: []
  jobs:
  - job: job_catalog
    displayName: Update Catalog
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
    - template: /provisioners/api_gateway/trunkbased/axway/api_subscription/task_groups/api_subscription_catalog.yml
      parameters:
        applicationName: ${{ parameters.applicationName }}
        apiName: ${{ parameters.apiName }}