parameters:
- name: gateway
  type: string
  displayName: 'API Gateway'
  values:
  - cloud
  - external
  - internal
  - files
  - cmun

- name: applicationName
  type: string
  displayName: 'Application Name'

- name: apiName
  type: string
  displayName: 'API Name'

- name: overrideQuota
  type: boolean
  displayName: 'Override Quota'
  default: false

- name: methodQuota
  type: string
  displayName: 'Method Quota'
  default: '*'

- name: typeQuota
  type: string
  displayName: 'Type Quota'
  default: throttle
  values:
  - throttle
  - throttlemb

- name: valueQuota
  type: string
  displayName: 'Value Quota'
  default: ''

- name: everyQuota
  type: string
  displayName: 'Every Quota'
  default: ''

- name: periodQuota
  type: string
  displayName: 'Period Quota'
  default: second
  values:
  - second
  - minute
  - hour
  - day
  - week

# Environment Configuration Checkboxes
- name: configure_dev
  type: boolean
  displayName: 'Dev'
  default: false

- name: configure_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: configure_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: configure_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: configure_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: configure_producao
  type: boolean
  displayName: 'Production'
  default: false

variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_subscription/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}

stages:
# CATALOG STAGE (always run)
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_subscription/stages/catalog.yml
  parameters:
    applicationName: ${{ parameters.applicationName }}
    apiName: ${{ parameters.apiName }}

