parameters:
- name: apiVersion

steps:
- template: /provisioners/api_gateway/trunkbased/axway/api_default/steps/update_files_version.yml
  parameters:
    apiVersion: ${{ parameters.apiVersion }}

- template: /tasks/nexus/upload_file.yml
  parameters:
    displayName: "Upload swagger.json"
    repository: $(NEXUS_REPOSITORY)
    localFileLocation: "$(Build.SourcesDirectory)/swagger.json"
    remoteFileLocation: "$(NEXUS_COMPONENT_GROUP)/$(NEXUS_COMPONENT_NAME)/$(API_VERSION)/$(NEXUS_COMPONENT_NAME)-$(API_VERSION).json"
    condition: and(succeeded(), eq(variables.isApiRest, true))

- template: /tasks/nexus/upload_file.yml
  parameters:
    displayName: "Upload webservice.wsdl"
    repository: $(NEXUS_REPOSITORY)
    localFileLocation: "$(Build.SourcesDirectory)/webservice.wsdl"
    remoteFileLocation: "$(NEXUS_COMPONENT_GROUP)/$(NEXUS_COMPONENT_NAME)/$(API_VERSION)/$(NEXUS_COMPONENT_NAME)-$(API_VERSION).wsdl"
    condition: and(succeeded(), eq(variables.isApiSoap, true))

- script: |
    if [ ! -d "xsd" ]; then
      echo "##[warning] Folder xsd not found. Skipping upload XSD files."
      exit
    fi

    for filename in xsd/*.xsd; do
      [ -e "$filename" ] || continue
      REMOTE_FILE_LOCATION="${NEXUS_COMPONENT_GROUP}/${NEXUS_COMPONENT_NAME}/${API_VERSION}/${filename}"

      echo "##[debug] XSD_FILE.........................: ${filename}"
      echo "##[debug] REMOTE_FILE_LOCATION.............: ${REMOTE_FILE_LOCATION}"

      echo "##[command] Upload '${filename}'"
      curl -s -i --fail -u ${USERNAME}:${PASSWORD} --upload-file "${filename}" "${URL}/${REPOSITORY}/${REMOTE_FILE_LOCATION}"
    done
  displayName: Upload XSDs
  workingDirectory: $(Build.SourcesDirectory)
  condition: and(succeeded(), eq(variables.isApiSoap, true))
  env:
    URL: $(NEXUS_REPOSITORY_URL)
    REPOSITORY: $(NEXUS_REPOSITORY)
    NEXUS_COMPONENT_GROUP: $(NEXUS_COMPONENT_GROUP)
    NEXUS_COMPONENT_NAME: $(NEXUS_COMPONENT_NAME)
    USERNAME: $(NEXUS-DEFAULT-USR)
    PASSWORD: $(NEXUS-DEFAULT-PSW)
    API_VERSION: ${{ parameters.apiVersion }}