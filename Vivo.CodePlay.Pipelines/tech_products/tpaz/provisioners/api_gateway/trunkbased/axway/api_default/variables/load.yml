parameters:
- name: gateway
- name: apiVersion

variables:
- template: /global/variables/pipeline.yml

- name: NEXUS_COMPONENT_GROUP
  value: br/com/vivo/api

- name: NEXUS_COMPONENT_NAME
  value: $[ replace(variables.API_NAME, ' ', '') ]

- name: NEXUS_COMPONENT_FILE
  value: $(Agent.TempDirectory)/$(NEXUS_COMPONENT_NAME)-$(set_api_version.NEW_API_VERSION).dat

- name: CATALOG_CHECKOUT_PATH
  value: api-management-catalog

- name: CATALOG_FILES_PATH
  value: $(Agent.BuildDirectory)/$(CATALOG_CHECKOUT_PATH)

- name: CATALOG_FILE_NAME
  value: catalog_manager.json

- name: SCRIPTS_CHECKOUT_PATH
  value: vivo-core-pipelines

- name: SCRIPTS_FILES_PATH
  value: $(Agent.BuildDirectory)/$(SCRIPTS_CHECKOUT_PATH)/tasks/axway/validate/scripts

- name: SCHEMA_FILES_PATH
  value: $(Agent.BuildDirectory)/$(SCRIPTS_CHECKOUT_PATH)/tasks/axway/validate/schema

- name: API_VERSION
  value: ${{ replace(parameters.apiVersion, ' ',  '') }}

- name: MANUAL_VALIDATION_ENABLED
  value: false

- template: /provisioners/api_gateway/trunkbased/axway/global/variables/${{ parameters.gateway }}.yml

- group: "api-manager-axway-${{ parameters.gateway }}"

- template: /.azuredevops/variables/private.yml@self

# Variables Read-Only
- name: isApiVersionParameterEmpty
  value: ${{ eq(replace(parameters.apiVersion, ' ', ''), '') }}

- name: isApiRest
  value: $[ eq(variables.API_TYPE, 'swagger') ]

- name: isApiSoap
  value: $[ eq(variables.API_TYPE, 'wsdl') ]

- name: isBumpApiVersionEnabled
  value: $[ and(eq(variables.flowIsMain, true), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) ]