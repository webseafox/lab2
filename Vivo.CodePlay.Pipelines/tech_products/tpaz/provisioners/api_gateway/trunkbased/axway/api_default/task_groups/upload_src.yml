parameters:
- name: repository
- name: localFileLocation
- name: remoteFileLocation

steps:
- script: |
    if [ -d "src" ]; then
      echo "##[debug] Folder 'src' was found"
      ls -lh src/

      echo "##[debug] repository..............: ${{ parameters.repository }}"
      echo "##[debug] localFileLocation.......: ${{ parameters.localFileLocation }}"
      echo "##[debug] remoteFileLocation......: ${{ parameters.remoteFileLocation }}"
      
      echo "##vso[task.setvariable variable=uploadSrc;]true"
    else
      echo "##[debug] Folder 'src' not found."
    fi
  displayName: '[src] Validate'
  workingDirectory: $(Build.SourcesDirectory)
- task: ArchiveFiles@2
  displayName: '[src] Generate .tar'
  condition: eq(variables.uploadSrc, 'true')
  inputs:
    rootFolderOrFile: $(Build.SourcesDirectory)/src
    archiveType: tar
    tarCompression: none
    archiveFile: ${{ parameters.localFileLocation }}
- template: /tasks/nexus/upload_file.yml
  parameters:
    displayName: "[src] Upload .tar"
    repository: ${{ parameters.repository }}
    localFileLocation: ${{ parameters.localFileLocation }}
    remoteFileLocation: ${{ parameters.remoteFileLocation }}
    condition: and(succeeded(), eq(variables.uploadSrc, 'true'))
    credentialsEnabled: false