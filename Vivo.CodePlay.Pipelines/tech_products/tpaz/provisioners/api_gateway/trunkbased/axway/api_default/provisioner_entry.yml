parameters:
- name: gateway
  type: string
  displayName: 'API Gateway'
  values:
  - cloud
  - external
  - internal
  - files
  - cmun

- name: apiVersion
  type: string
  displayName: 'API Version (leave empty for CI build)'
  default: ''

# Environment Deployment Checkboxes
- name: deploy_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: deploy_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: deploy_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: deploy_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: deploy_producao
  type: boolean
  displayName: 'Production'
  default: false
  
variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}
    apiVersion: ${{ parameters.apiVersion }}

resources:
  repositories:
  - repository: api-manager-catalog-cloud
    type: git
    name: f0824df5-1fa5-46b0-a857-903f765aae7a/api-manager-catalog-cloud
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: api-manager-catalog-external
    type: git
    name: 7f39f000-f663-4e7d-ae01-c07ce8333db3/api-manager-catalog-external
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: api-manager-catalog-internal
    type: git
    name: 7f39f000-f663-4e7d-ae01-c07ce8333db3/api-manager-catalog-internal
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: api-manager-catalog-files
    type: git
    name: 7f39f000-f663-4e7d-ae01-c07ce8333db3/api-manager-catalog-files
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: api-manager-catalog-cmun
    type: git
    name: 7f39f000-f663-4e7d-ae01-c07ce8333db3/api-manager-catalog-cmun
    ref: refs/heads/master
    endpoint: CorePipelines

stages:
# BUILD STAGE
- ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/build.yml
    parameters:
      gateway: ${{ parameters.gateway }}

# DEPLOY STAGES: Dynamic environment selection via checkboxes
- ${{ if eq(parameters.deploy_esteira1, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: esteira1
      ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
        dependsOn:
        - stage_build_package

- ${{ if eq(parameters.deploy_esteira2, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: esteira2
      ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
        dependsOn:
        - stage_build_package

- ${{ if eq(parameters.deploy_preprod, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: preprod
      ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
        dependsOn:
        - stage_build_package

- ${{ if eq(parameters.deploy_prodlike, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: prodlike
      ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
        dependsOn:
        - stage_build_package

- ${{ if eq(parameters.deploy_producao, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_default/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: producao
      ${{ if eq(variables.isApiVersionParameterEmpty, true) }}:
        dependsOn:
        - stage_build_package
        - stage_deploy_preprod
      ${{ else }}:
        dependsOn: stage_deploy_preprod

# VALIDATION: Fail if no environments selected
- ${{ if and(eq(parameters.deploy_esteira1, false), eq(parameters.deploy_esteira2, false), eq(parameters.deploy_preprod, false), eq(parameters.deploy_prodlike, false), eq(parameters.deploy_producao, false)) }}:
  - stage: stage_validate_environment_selection
    displayName: 'Validate Environment Selection'
    dependsOn: []
    jobs:
    - job: 'ERROR_NO_ENVIRONMENTS_SELECTED'
      displayName: '❌ ERROR: No environments selected'
      pool: $(PRIVATE_AGENT_DEFAULT)
      steps:
      - script: |
          echo "##[error]At least one environment must be selected"
          exit 1
        displayName: 'Validate Environment Selection'