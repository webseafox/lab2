steps:
- script: |
    if [ ! -z "${API_VERSION}" ]; then
      echo "##[debug] API_VERSION....: ${API_VERSION}"
      echo "##[warning] Version parameter was set. File VERSION won't be used."
      exit
    fi

    CURRENT_API_VERSION=$(cat VERSION)
    echo "##[debug] CURRENT_API_VERSION..: ${CURRENT_API_VERSION}"

    if [ -z "${CURRENT_API_VERSION}" ]; then
      echo "##vso[task.logissue type=error] Current version not found in VERSION file."
      exit 1
    fi

    echo "##vso[task.setvariable variable=API_VERSION]${CURRENT_API_VERSION}"
  displayName: Get current VERSION
  workingDirectory: $(Build.SourcesDirectory)
  env:
    API_VERSION: $(API_VERSION)

- task: semver-bump@1
  displayName: Bump version
  condition: and(succeeded(), eq(variables.isBumpApiVersionEnabled, true))
  inputs:
    VersionVariable: 'API_VERSION'
    IncrementLevel: 'patch'

- script: |
    echo "##[debug] API_VERSION.....: ${API_VERSION}"
    echo "##vso[task.setvariable variable=API_VERSION;isoutput=true]${API_VERSION}"
    echo "##vso[task.logissue type=warning;] API Version: ${API_VERSION}"
  displayName: Set API_VERSION
  condition: succeeded()
  name: set_api_version
  env:
    API_VERSION: $(API_VERSION)