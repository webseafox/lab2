parameters:
- name: apiVersion

steps:
- script: |
    echo "##[debug] API_VERSION......: ${API_VERSION}"
    echo "##[debug] IS_REST_API......: ${IS_REST_API}"
    echo "##[debug] IS_SOAP_API......: ${IS_SOAP_API}"

    echo "##[command] Updating VERSION"
    echo -n "${API_VERSION}" > VERSION
    cat VERSION

    if [[ "${IS_REST_API}" == "True" ]]; then
      echo "##[command] Updating swagger.json"
      jq --arg version "${API_VERSION}" '.info.version = $version' swagger.json > swagger_tmp.json
      mv swagger_tmp.json swagger.json
      jq '.info.version' swagger.json
    fi
  displayName: Update sources to new VERSION
  condition: and(succeeded(), eq(variables.isBumpApiVersionEnabled, true))
  workingDirectory: $(Build.SourcesDirectory)
  env:
    API_VERSION: ${{ parameters.apiVersion }}
    IS_REST_API: $(isApiRest)
    IS_SOAP_API: $(isApiSoap)