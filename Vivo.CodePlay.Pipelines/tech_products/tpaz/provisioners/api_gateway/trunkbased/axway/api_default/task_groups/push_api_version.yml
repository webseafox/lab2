parameters:
- name: apiVersion

steps:
- template: /provisioners/api_gateway/trunkbased/axway/api_default/steps/update_files_version.yml
  parameters:
    apiVersion: ${{ parameters.apiVersion }}

- script: |
    set -e

    echo "##[debug] API_VERSION..............: ${API_VERSION}"
    echo "##[debug] BUILD_SOURCEBRANCHNAME...: ${BUILD_SOURCEBRANCHNAME}"

    git config --global --replace-all user.name "Azure DevOps"
    git config --global --replace-all user.email "devops-automation@telefonicati.onmicrosoft.com"

    git fetch
    git checkout -b ${BUILD_BUILDID}
    git add .
    git status
    git commit -m "Bump VERSION to ${API_VERSION} [skip ci]"

    git checkout ${BUILD_SOURCEBRANCHNAME}
    git pull --rebase
    git merge ${BUILD_BUILDID}
    git branch -d ${BUILD_BUILDID}
   
    git status
    git push origin ${BUILD_SOURCEBRANCHNAME}
  displayName: Push new VERSION
  condition: and(succeeded(), eq(variables.isBumpApiVersionEnabled, true))
  continueOnError: false
  workingDirectory: $(Build.SourcesDirectory)
  name: push_bump_version_file
  env:
    API_VERSION: ${{ parameters.apiVersion }}