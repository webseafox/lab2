parameters:
- name: environment

variables:
- name: NEXUS_REPOSITORY
  value: api-gateway-raw

- name: PROJPACK_VERSION
  value: "7.7.2"

- name: EMT_SCRIPT_VERION
  value: "2.0.0-1-7.7.2"

- name: IMAGE_REGISTRY_MICROSSERVICOS
  value: "api-gateway-dkr.nexus.telefonica.com.br"

- name: DOCKER_REGISTRY_SERVICE_CONNECTION_NAME
  value: "API-GATEWAY-ONPREM-EXTERNAL-DKR"

- name: HELM_VERSION
  value: "2.14.2"

- name: HELM_REPOSITORY
  value: api-gateway-helm

- name: HELM_CHART_NAME
  value: infra-helm-apigw-manager

- name: HELM_CHART_VERSION
  value: "1.0.23"

- name: HELM_RELEASE_NAME
  value: apigw-manager-${{ parameters.environment }}

- name: IMAGE_NAME
  value: apigw-manager-${{ parameters.environment }}

- ${{ if eq(parameters.environment, 'dev') }}:
  - name: HELM_RELEASE_NAMESPACE
    value: dev-emt
- ${{ if eq(parameters.environment, 'esteira1') }}:
  - name: HELM_RELEASE_NAMESPACE
    value: noprod-emt
- ${{ if eq(parameters.environment, 'esteira2') }}:
  - name: HELM_RELEASE_NAMESPACE
    value: noprod-emt
- ${{ elseif eq(parameters.environment, 'preprod') }}:
  - name: HELM_RELEASE_NAME
    value: apigw-manager-pre-prod # Variável preprod sobrescrita devido a nomenclatura deste ambiente ser diferente
  - name: IMAGE_NAME
    value: apigw-manager-pre-prod # Variável preprod sobrescrita devido a nomenclatura deste ambiente ser diferente
  - name: HELM_RELEASE_NAMESPACE
    value: noprod-emt
- ${{ elseif eq(parameters.environment, 'prodlike') }}:
  - name: HELM_RELEASE_NAMESPACE
    value: noprod-emt
- ${{ elseif eq(parameters.environment, 'prod') }}:
  - name: HELM_RELEASE_NAMESPACE
    value: prod-emt