parameters:
- name: environment

stages:
- stage: stage_build
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Build
  jobs:
  - job: job_set_version
    displayName: Set Version
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
    - template: /provisioners/api_gateway/trunkbased/axway/manager_legacy/task_groups/bump_version.yml
      parameters:
        environment: ${{ parameters.environment }}
  - job: job_build
    displayName: Build
    dependsOn:
    - job_set_version
    variables:
      APP_VERSION: $[ dependencies.job_set_version.outputs['set_version.APP_VERSION'] ]
    steps:
    - template: /tasks/nexus/download_file.yml
      parameters:
        displayName: 'Download projpack from Nexus'
        repository: $(NEXUS_REPOSITORY)
        remoteFileLocation: br/com/vivo/devops/projpack/$(PROJPACK_VERSION)/projpack-$(PROJPACK_VERSION).zip
    - task: ExtractFiles@1
      displayName: Extract projpack
      inputs:
        archiveFilePatterns: "$(Agent.TempDirectory)/projpack-$(PROJPACK_VERSION).zip"
        destinationFolder: $(Agent.TempDirectory)
        cleanDestinationFolder: false
    - script: |
        ${AGENT_TEMPDIRECTORY}/projpack-${PROJPACK_VERSION}/apigateway/posix/bin/projpack --create --replace --passphrase-none --name=gtw-grp-manager --type=${API_GATEWAY_PACKAGE_TYPE} --add ${BUILD_SOURCESDIRECTORY}/src --projpass-none
      displayName: 'Generating package .fed'
      workingDirectory: $(Build.ArtifactStagingDirectory)
      env:
        API_GATEWAY_PACKAGE_TYPE: fed
        PROJPACK_VERSION: $(PROJPACK_VERSION)
    - template: /tasks/artifacts/publish_pipeline.yml
      parameters:
        artifactName: manager
        targetPath: $(Build.ArtifactStagingDirectory)
    - template: /tasks/nexus/upload_files.yml
      parameters:
        repository: $(NEXUS_REPOSITORY)
        credentialsEnabled: false
        files:
        - localFileLocation: $(Build.ArtifactStagingDirectory)/gtw-grp-manager.fed
          remoteFileLocation: br/com/vivo/gateway/manager-${{ parameters.environment }}/$(APP_VERSION)/manager-${{ parameters.environment }}-$(APP_VERSION).fed
        - localFileLocation: $(Build.SourcesDirectory)/env/envSettings.props
          remoteFileLocation: br/com/vivo/gateway/manager-${{ parameters.environment }}/$(APP_VERSION)/envSettings.props
        - localFileLocation: $(Build.SourcesDirectory)/api-manager/app.config
          remoteFileLocation: br/com/vivo/gateway/manager-${{ parameters.environment }}/$(APP_VERSION)/app.config
        - localFileLocation: $(Build.SourcesDirectory)/conf/jvm.xml
          remoteFileLocation: br/com/vivo/gateway/manager-${{ parameters.environment }}/$(APP_VERSION)/jvm.xml