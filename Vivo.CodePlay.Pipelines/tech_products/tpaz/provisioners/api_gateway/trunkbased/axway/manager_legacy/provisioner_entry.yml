parameters:
- name: gateway
  type: string
  values:
  - external

- name: version
  type: string
  default: ''

- name: environment
  values:
  - dev
  - esteira1
  - esteira2
  - preprod
  - prodlike
  - prod

variables:
- template: /provisioners/api_gateway/trunkbased/axway/manager_legacy/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}
    version: ${{ parameters.version }}
    environment: ${{ parameters.environment }}

stages:
- ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
  - template: /provisioners/api_gateway/trunkbased/axway/manager_legacy/stages/build.yml
    parameters:
      environment: ${{ parameters.environment }}
  - template: /provisioners/api_gateway/trunkbased/axway/manager_legacy/stages/package_publish.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: ${{ parameters.environment }}

- template: /provisioners/api_gateway/trunkbased/axway/manager_legacy/stages/deploy.yml
  parameters:
    environment: ${{ parameters.environment }}
    ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables.isVersionParameterEmpty, true)) }}:
      dependsOn:
      - stage_build
      - stage_package_publish