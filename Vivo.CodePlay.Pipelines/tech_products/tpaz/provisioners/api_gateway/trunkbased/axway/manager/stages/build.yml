parameters:
- name: environments
  type: object

# Build gtw-grp-manager
stages:
- stage: stage_build
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Build
  jobs:
  - job: job_set_version
    displayName: Set Version
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
    - template: /provisioners/api_gateway/trunkbased/axway/manager/task_groups/bump_version.yml
  - job: job_build
    displayName: Build
    dependsOn:
    - job_set_version
    variables:
      APP_VERSION: $[ dependencies.job_set_version.outputs['set_version.APP_VERSION'] ]
    steps:
    - script: |
        echo -e "\033[1;32m[DEBUG-API-GATEWAY] - Starting build.groovy:\033[0m"
        sleep 2
        echo "---------------------------------------------"
        echo -e "\033[1;32m[DEBUG-API-GATEWAY] - Directory structure:\033[0m"
        pwd
        ls -ltr
        du -sh src

        for environment in "dev" "esteira1" "esteira2" "preprod" "prodlike" "prod"; do
          rm -rf src/Environment\ Configuration/Certificate\ Store/*
          echo -e "\033[1;32m[DEBUG-API-GATEWAY] - Certificates cleaned successfully...\033[0m"
          sleep 2
          echo "[DEBUG-API-GATEWAY] - Get Certificates by environment ${environment}..."
          cp certificate-store/${environment}/* src/Environment\ Configuration/Certificate\ Store/
          echo "[DEBUG-API-GATEWAY] - Certificates get environment ${environment} successfuly."
          echo "[DEBUG-API-GATEWAY] - Generating $(API_GATEWAY_PACKAGE_TYPE) package by environment ${environment}..."
          cd ./src && tar -zcvf "$(Build.ArtifactStagingDirectory)/gtw-grp-manager-yaml-${environment}.tar.gz" * && cd ..
          echo -e "\033[1;32m[DEBUG-API-GATEWAY] - Check files and size in AgentTempDirectory .\033[0m"
          du -sh $(Build.ArtifactStagingDirectory)/*
          echo -e "\033[1;32m[DEBUG-API-GATEWAY] - Package environment ${environment} generated successfully.\033[0m"
        done

        ls -lX && rm -R ./certificate-store
        echo -e "\033[1;32m[DEBUG-API-GATEWAY] - All certificates cleaned successfully.\033[0m"

    - template: /tasks/artifacts/publish_pipeline.yml
      parameters:
        artifactName: manager
        targetPath: $(Build.ArtifactStagingDirectory)

    # Upload files
    - template: /tasks/nexus/upload_files.yml
      parameters:
        repository: $(NEXUS_REPOSITORY_MANAGER)
        files:
        - localFileLocation: $(Build.SourcesDirectory)/api-manager/app.config
          remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/app.config
        - localFileLocation: $(Build.SourcesDirectory)/conf/jvm.xml
          remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/jvm.xml
        - localFileLocation: $(Build.SourcesDirectory)/conf/service.xml
          remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/service.xml

    - ${{ each env in parameters.environments }}:
      - template: /tasks/nexus/upload_files.yml
        parameters:
          repository: $(NEXUS_REPOSITORY_MANAGER)
          files:
          - localFileLocation: $(Build.ArtifactStagingDirectory)/gtw-grp-manager-yaml-${{ env }}.tar.gz
            remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/$(VAR_COMPONENT_NAME_NEXUS)-${{ env }}-$(APP_VERSION).tar.gz
          - localFileLocation: $(Build.SourcesDirectory)/conf/${{ env }}/customRedaction.xml
            remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/customRedaction-${{ env }}-$(APP_VERSION).xml
          - localFileLocation: $(Build.SourcesDirectory)/conf/${{ env }}/instanceRedaction.xml
            remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/instanceRedaction-${{ env }}-$(APP_VERSION).xml
          - localFileLocation: $(Build.SourcesDirectory)/env-settings/${{ env }}/envSettings.props
            remoteFileLocation: br/com/vivo/gateway/$(VAR_COMPONENT_NAME_NEXUS)/$(APP_VERSION)/envSettings-${{ env }}-$(APP_VERSION).props
          credentialsEnabled: false