parameters:
- name: gateway
- name: version

variables:
- template: /global/variables/pipeline.yml

- name: PREFIX_GROUP_NAME
  value: grp-manager

- name: VAR_COMPONENT_NAME_NEXUS
  value: manager

- name: HELM_RELEASE_NAME
  value: apigw-manager

- name: IMAGE_NAME
  value: apigw-manager

- name: BASE_IMAGE_REGISTRY_API_GATEWAY
  value: api-gateway-dkr.nexus.telefonica.com.br

- name: API_GATEWAY_PACKAGE_TYPE
  value: tar.gz

- template: /provisioners/api_gateway/trunkbased/axway/global/variables/${{ parameters.gateway }}.yml

- group: gateway-manager-${{ parameters.gateway }}

# Variables Read-Only
- name: VERSION_FILE
  value: $(cat VERSION)

- name: VERSION_PARAMETER
  value: ${{ replace(parameters.version, ' ', '') }}

- name: isVersionParameterEmpty
  value: ${{ eq(replace(parameters.version, ' ', ''), '') }}
