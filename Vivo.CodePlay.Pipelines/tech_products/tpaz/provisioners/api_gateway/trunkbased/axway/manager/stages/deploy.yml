parameters:
- name: environment
  type: object
- name: dependsOn
  type: object
  default: []

stages:
- stage: stage_deploy_${{ parameters.environment }}
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Deploy-${{ parameters.environment }}
  dependsOn: ${{ parameters.dependsOn }}
  jobs:
  - deployment: job_deploy # need approve team on Environments in ADO.
    displayName: Deploy
    environment: deploy-manager-${{ parameters.environment }}
    variables:
      APP_VERSION: $[ coalesce(variables.VERSION_PARAMETER, stageDependencies.stage_build.job_set_version.outputs['set_version.APP_VERSION'], variables.VERSION_FILE) ]
      ${{ if eq(parameters.environment, 'dev') }}:
        DEPLOY_NAMESPACE: $(PREFIX_NAMESPACE)dev-emt
      ${{ elseif eq(parameters.environment, 'prod') }}:
        DEPLOY_NAMESPACE: $(PREFIX_NAMESPACE)prod-emt
      ${{ else }}:
        DEPLOY_NAMESPACE: $(PREFIX_NAMESPACE)noprod-emt
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: none #if self value checkout is done.
          - template: /tasks/nexus/download_file.yml
            parameters:
              repository: $(HELM_REPOSITORY)
              remoteFileLocation: "$(HELM_CHART_NAME)-$(HELM_CHART_VERSION).tgz"
              displayName: "Download helm package"
              localFileLocation: $(Agent.TempDirectory)
          - task: ExtractFiles@1
            displayName: Extract helm package
            inputs:
              archiveFilePatterns: "$(Agent.TempDirectory)/$(HELM_CHART_NAME)-$(HELM_CHART_VERSION).tgz"
              destinationFolder: $(Agent.TempDirectory)
              cleanDestinationFolder: false
          - script: |
              echo "##[debug] DEPLOY_NAMESPACE................: $(DEPLOY_NAMESPACE)"
              echo "##[debug] HELM_CHART_NAME.................: $(HELM_CHART_NAME)"
              echo "##[debug] HELM_CHART_VERSION..............: $(HELM_CHART_VERSION)"
              echo "##[debug] HELM_RELEASE_NAME...............: $(HELM_RELEASE_NAME)"
              echo "##[debug] IMAGE_TAG.......................: $(APP_VERSION)"
            displayName: Show variables
          - task: HelmDeploy@1
            displayName: Helm upgrade
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: $(GATEWAY_K8S_SERVICE_CONNECTION_${{ upper(parameters.environment) }})
              command: upgrade
              namespace: $(DEPLOY_NAMESPACE)
              chartName: "$(Agent.TempDirectory)/$(HELM_CHART_NAME)"
              chartVersion: $(HELM_CHART_VERSION)
              releaseName: $(HELM_RELEASE_NAME)-${{ parameters.environment }}
              overrideValues: 'apimgr.image.tag=$(APP_VERSION),apitraffic.image.tag=$(APP_VERSION)'
              valueFile: .azuredevops/env/${{ parameters.environment }}/values.yaml
              arguments: '--install --debug --set-file envSettings.envSettings\.props=./env-settings/${{ parameters.environment }}/envSettings.props' # remove --dry-run to deploy. OBS: Just dev environment.
              waitForExecution: false
