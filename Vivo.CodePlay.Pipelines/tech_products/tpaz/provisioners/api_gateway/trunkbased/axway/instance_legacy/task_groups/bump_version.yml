steps:
- script: |
    CURRENT_VERSION=$(cat VERSION)
    echo "##[debug] CURRENT_VERSION.....: ${CURRENT_VERSION}"

    if [ -z "${CURRENT_VERSION}" ]; then
      echo "##vso[task.logissue type=error] Current version not found in VERSION file."
      exit 1
    fi

    echo "##vso[task.setvariable variable=CURRENT_VERSION]${CURRENT_VERSION}"
  displayName: Get Current Version
  workingDirectory: $(Build.SourcesDirectory)

- task: semver-bump@1
  displayName: Bump VERSION file
  condition: and(succeeded(), eq(variables.flowIsMain, true))
  inputs:
    VersionVariable: 'CURRENT_VERSION'
    IncrementLevel: 'patch'

# - template: /tasks/nexus/validate_path.yml
#   parameters:
#     repository: $(NEXUS_REPOSITORY)
#     remoteFileLocation: br/com/vivo/gateway/instance-api-projects-$(ENVIRONMENT)/$(CURRENT_VERSION)/instance-api-projects-$(ENVIRONMENT)-$(CURRENT_VERSION).pol

- script: |
    echo "##vso[task.logissue type=warning;] New VERSION: ${APP_VERSION}"
    echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]${CURRENT_VERSION}"
  displayName: Set New Version
  name: set_version
  env:
    APP_VERSION: $(CURRENT_VERSION)

- script: |
    set -e

    echo "##[debug] APP_VERSION..............: ${APP_VERSION}"
    echo "##[debug] BUILD_SOURCEBRANCHNAME...: ${BUILD_SOURCEBRANCHNAME}"

    git config --global --replace-all user.name "Azure DevOps"
    git config --global --replace-all user.email "azuredevops@telefonicati.onmicrosoft.com"

    git fetch
    git checkout ${BUILD_SOURCEBRANCHNAME}
    git reset --hard origin/${BUILD_SOURCEBRANCHNAME}

    echo -n "${APP_VERSION}" > VERSION

    git status
    git add VERSION

    git commit -m "Bump VERSION to ${APP_VERSION} [skip ci]"
    git push origin ${BUILD_SOURCEBRANCHNAME}
  displayName: Push new VERSION
  condition: and(succeeded(), eq(variables.flowIsMain, true))
  continueOnError: false
  workingDirectory: $(Build.SourcesDirectory)
  env:
    APP_VERSION: $(CURRENT_VERSION)
