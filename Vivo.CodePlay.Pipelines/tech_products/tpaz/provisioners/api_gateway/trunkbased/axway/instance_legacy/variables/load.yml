parameters:
- name: gateway
- name: version
- name: environments
  type: object

variables:
- template: /global/variables/pipeline.yml

- name: PRIVATE_AGENT_DEFAULT_DEPLOY
  value: GeneralPurposeLinuxAgentsCD

- name: ASDF_PYTHON_VERSION
  value: "2.7.18"

- template: /provisioners/api_gateway/trunkbased/axway/instance_legacy/variables/${{ parameters.gateway }}.yml

- group: gateway-manager-${{ parameters.gateway }}

# Variables Read-Only
- name: VERSION_FILE
  value: $(cat VERSION)

- name: VERSION_PARAMETER
  value: ${{ replace(parameters.version, ' ', '') }}

- name: isVersionParameterEmpty
  value: ${{ eq(replace(parameters.version, ' ', ''), '') }}

- name: isDeployProd
  value: ${{ containsValue(parameters.environments, 'prod') }}