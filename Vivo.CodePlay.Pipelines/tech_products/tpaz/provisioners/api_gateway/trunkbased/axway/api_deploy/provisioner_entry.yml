parameters:
- name: gateway
  type: string
  displayName: 'API Gateway'
  values:
  - cloud
  - external
  - internal
  - files
  - cmun

- name: gatewayVersion
  type: string
  displayName: 'Gateway Version'

- name: apiName
  type: string
  displayName: 'API Name'

- name: apiVersion
  type: string
  displayName: 'API Version'

- name: apiType
  type: string
  displayName: 'API Type'

# Environment Deployment Checkboxes
- name: deploy_dev
  type: boolean
  displayName: 'Dev'
  default: false

- name: deploy_esteira1
  type: boolean
  displayName: 'Esteira1'
  default: false

- name: deploy_esteira2
  type: boolean
  displayName: 'Esteira2'
  default: false

- name: deploy_preprod
  type: boolean
  displayName: 'Preprod'
  default: false

- name: deploy_prodlike
  type: boolean
  displayName: 'Prodlike'
  default: false

- name: deploy_producao
  type: boolean
  displayName: 'Production'
  default: false

variables:
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/variables/load.yml
  parameters:
    gateway: ${{ parameters.gateway }}
    gatewayVersion: ${{ parameters.gatewayVersion }}
    apiName: ${{ parameters.apiName }}
    apiVersion: ${{ parameters.apiVersion }}
    apiType: ${{ parameters.apiType }}

stages:
# VALIDATE STAGE
- template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/validate.yml
  parameters:
    gateway: ${{ parameters.gateway }}
    gatewayVersion: ${{ parameters.gatewayVersion }}
    apiName: ${{ parameters.apiName }}
    apiVersion: ${{ parameters.apiVersion }}
    apiType: ${{ parameters.apiType }}

# DEPLOY STAGES: Dynamic environment selection via checkboxes
- ${{ if eq(parameters.deploy_dev, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: dev
      dependsOn:
      - stage_validate

- ${{ if eq(parameters.deploy_esteira1, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: esteira1
      dependsOn:
      - stage_validate

- ${{ if eq(parameters.deploy_esteira2, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: esteira2
      dependsOn:
      - stage_validate

- ${{ if eq(parameters.deploy_preprod, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: preprod
      dependsOn:
      - stage_validate

- ${{ if eq(parameters.deploy_prodlike, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: prodlike
      dependsOn:
      - stage_validate

- ${{ if eq(parameters.deploy_producao, true) }}:
  - template: /tech_products/tpaz/provisioners/api_gateway/trunkbased/axway/api_deploy/stages/deploy.yml
    parameters:
      gateway: ${{ parameters.gateway }}
      environment: producao
      dependsOn:
      - stage_validate
      - stage_deploy_preprod

# VALIDATION: Fail if no environments selected
- ${{ if and(eq(parameters.deploy_dev, false), eq(parameters.deploy_esteira1, false), eq(parameters.deploy_esteira2, false), eq(parameters.deploy_preprod, false), eq(parameters.deploy_prodlike, false), eq(parameters.deploy_producao, false)) }}:
  - stage: stage_validate_environment_selection
    displayName: 'Validate Environment Selection'
    dependsOn: []
    jobs:
    - job: 'ERROR_NO_ENVIRONMENTS_SELECTED'
      displayName: '❌ ERROR: No environments selected'
      pool: $(PRIVATE_AGENT_DEFAULT)
      steps:
      - script: |
          echo "##[error]At least one environment must be selected"
          exit 1
        displayName: 'Validate Environment Selection'