parameters:
- name: gateway
- name: gatewayVersion
- name: apiName
- name: apiVersion
- name: apiType

variables:
- template: /global/variables/pipeline.yml

- name: NEXUS_COMPONENT_GROUP
  value: br/com/vivo/api

- name: NEXUS_COMPONENT_NAME
  value: ${{ replace(parameters.apiName, ' ', '') }}

- name: API_NAME
  value: ${{ parameters.apiName }}

- name: API_VERSION
  value: ${{ replace(parameters.apiVersion, ' ',  '') }}

- name: CATALOG_CHECKOUT_PATH
  value: api-management-catalog

- name: CATALOG_FILES_PATH
  value: $(Agent.BuildDirectory)/$(CATALOG_CHECKOUT_PATH)

- name: CATALOG_FILE_NAME
  value: catalog_manager.json

- name: MANUAL_VALIDATION_ENABLED
  value: true

- ${{ if eq(parameters.gatewayVersion, 'latest') }}:
  - template: /provisioners/api_gateway/trunkbased/axway/global/variables/${{ parameters.gateway }}.yml
  - group: "api-manager-axway-${{ parameters.gateway }}"
- ${{ else }}:
  - template: /provisioners/api_gateway/trunkbased/axway/global/variables/${{ parameters.gateway }}-${{ parameters.gatewayVersion }}.yml
  - group: "api-manager-axway-${{ parameters.gateway }}-${{ parameters.gatewayVersion }}"

# Variables Read-Only
- name: isApiVersionParameterEmpty
  value: false

- name: isApiRest
  value: ${{ eq(parameters.apiType, 'swagger') }}

- name: isApiSoap
  value: ${{ eq(parameters.apiType, 'wsdl') }}