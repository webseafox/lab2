variables:
- template: /global/variables/pipeline.yml

# docker
- name: CMD_EXTRACT_FLUTTER_VERSION
  value: $(yq -r .version pubspec.yaml)

# variables for app/flutter
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Flutter"
- name: APP_CENTER_DEFAULT_SERVICE_CONNECTION
  value: AppCenter