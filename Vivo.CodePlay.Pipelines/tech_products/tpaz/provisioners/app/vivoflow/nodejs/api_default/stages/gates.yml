stages:
- stage: gate
  displayName: "Quality Gates"
  dependsOn: 
  - build_test
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: sonarqube
      condition: and(succeeded(), ne(variables.skip_sonarqube, true), eq(variables.flowIsTagging, false))
      displayName: Code Analysis
      steps:
      - template: /tasks/bash/welcome.yml
      - ${{ if and( ne(variables.skip_sonarqube, true), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/release', 'refs/heads/esteira1', 'refs/heads/develop') ) }}:
        - template: /tasks/catalog_info/extract_variables.yml
          parameters:
            workingDirectory: $(Build.SourcesDirectory)
            skipDownload: true
        - template: /task_groups/gates/run_sonarqube_scan.yml
          parameters:
            stack: "NODE"
            configFile: "$(DEFAULT_WORKDIR_ARTIFACTS)/.azuredevops/sonar-project.properties"
            workdirArtifacts: "$(DEFAULT_WORKDIR_ARTIFACTS)"
            projectKey: "$(SONAR_PROJECT_KEY)"
        - template: /tasks/telemetry/telemetry.yml

    - job: governance
      condition: and(
                  succeeded(),
                  and( 
                    eq(variables.flowIsPullRequest, false),
                    not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
                  ),
                  eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')
                )
      displayName: Governance Policies Check
      steps:
        - template: /task_groups/governance/check_govapp_policies.yml
          parameters:
            govAppBreakglass: false
            govAppOperation: "validate"
            continueOnError: true
            environment: ${{ parameters.environment }}
            stack: "NODEJS"
