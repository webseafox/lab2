parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False

variables:
- template: /provisioners/app/global/nodejs/variables/init.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}

# MODELO NODEJS NÃO SUPORTA BUMP DE VERSÃO NO MOMENTO
- name: BUMP_VERSION_ENABLED
  value: 'false'

- group: "azdo-team-project-variables"

- group: "${{ variables['Build.DefinitionName'] }}"

- template: /.azuredevops/variables/private.yml@self

- ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/develop/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/develop/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop') ) }}:
  - name: serviceConnectionDeploySuffix
    value: dev
- ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/release/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['Build.SourceBranch'], 'refs/heads/release') ) }}:
  - name: serviceConnectionDeploySuffix
    value: test
- ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/production/'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master') ) }}:
  - name: serviceConnectionDeploySuffix
    value: prod