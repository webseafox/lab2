stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
    - pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: build_test
    condition: and(succeeded(), eq(variables.flowIsTagging, false))
    displayName: Test & Coverage
    steps:
    - template: /tasks/bash/welcome.yml
    - template: /task_groups/build/nodejs_build_test.yml
    - template: /task_groups/tests/publish_tests_reports.yml
      parameters:
        testResultsFilesPattern: "**/junit.xml"
        coverageFilePattern: "**/cobertura-coverage.xml"
        codeCoverageTool: "Cobertura"