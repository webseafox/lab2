steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    echo ' ================================================================================================================================'
    echo '|                            _                ___                   ___ _            _ _                                         |'
    echo '|                     /\   /(_)_   _____     / __\___  _ __ ___    / _ (_)_ __   ___| (_)_ __   ___  ___                         |'
    echo '|                     \ \ / / \ \ / / _ \   / /  / _ \|  __/ _ \  / /_)/ |  _ \ / _ \ | |  _ \ / _ \/ __|                        |'
    echo '|                      \ V /| |\ V / (_) | / /__| (_) | | |  __/ / ___/| | |_) |  __/ | | | | |  __/\__ \                        |'
    echo '|                       \_/ |_| \_/ \___/  \____/\___/|_|  \___| \/    |_|  __/ \___|_|_|_| |_|\___||___/                        |'
    echo '|                                                                        |_|                                                     |'
    echo ' ================================================================================================================================'
    echo "                                                                                                      powered by Vivo DevOps Team"
    echo ""

    printf "${YELLOW}=================================================================================================================================
    ${YELLOW}                                                       PIPELINE NODE API (M1)
    ${YELLOW}=================================================================================================================================
    Iniciando a pipeline para build de aplicação NODE API, com entrega em Kubernetes.

    O Fluxo dessa pipele comtemplate os seguintes stages:
    $(ALERT_MESSAGE_ARROW) INIT - realiza a inicialização de variáveis e dados necessários para o fluxo do pipeline.
    $(ALERT_MESSAGE_ARROW) BUILD & TEST - compila a aplicação e realizar os teste unitários
    $(ALERT_MESSAGE_ARROW) GATES - realiza as verificações de qualidade de código utilizando o sonarqube.
    $(ALERT_MESSAGE_ARROW) SECURITY - realiza as verificações de segurança.
    $(ALERT_MESSAGE_ARROW) APPROVALS - realiza as validações de qualidade de código, segurança e se necessário uma aprovação manual.
    $(ALERT_MESSAGE_ARROW) PACKAGE & PUBLISH - realiza o build e publicação da imagem no registry corporativo
    $(ALERT_MESSAGE_ARROW) DEPLOY - realiza o deploy da aplicação e entrega no ambiente de destino (Kubernetes)
    ${YELLOW}=================================================================================================================================

    ${BLUE}=================================================================================================================================
    ${BLUE}                                                            SHOW INFO
    ${BLUE}=================================================================================================================================
    Executor              : $(Build.RequestedForEmail)  ${GREEN}[ Quem Executou Pipeline  ]
    Directory             : $(Build.SourcesDirectory) ${GREEN}[ Diretorio de Build  ]
    Workspace             : $(Pipeline.Workspace) ${GREEN}[ Workspace do Pipeline ]
    SonarQube             : $(SONARQUBE_URL) ${GREEN}[ SonarQube URL ]
    Image Registry        : $(DOCKER_DEFAULT_REGISTRY) ${GREEN}[ Default Imagem Resgistry ]
    ${BLUE}=================================================================================================================================
    "
  displayName: About Pipeline