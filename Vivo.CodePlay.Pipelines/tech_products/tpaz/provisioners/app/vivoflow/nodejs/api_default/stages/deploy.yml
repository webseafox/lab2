parameters:
- name: private_agent_pool
- name: environment
- name: kubeconfig
- name: git_tag
- name: rdm
- name: approval
- name: skipDeploy
  default: false
- name: helm_release_name_prefix
- name: azureServiceConnectionEnabled
  default: false
- name: kubernetesServiceConnectionEnabled
  default: false

stages:
- ${{ if ne(parameters.skipDeploy, True) }}:
  - stage: deploy
    dependsOn:
    - validation
    pool: ${{ parameters.private_agent_pool }}
    displayName: "Deploy ${{ parameters.environment }}"
    jobs:
      - deployment: ${{ parameters.environment }}
        condition: and(always(), eq(variables.flowIsTagging, false), eq(variables.flowIsToDeploy, true))
        workspace:
          clean: all
        displayName: Deploy
        environment: "deploy-${{parameters.environment}}"
        strategy:
          runOnce:
            preDeploy:
              steps:
                - template: /provisioners/app/vivoflow/nodejs/api_default/steps/deploy/pre_deploy.yml
                  parameters:
                    environment: ${{parameters.environment}}
                    rdm: ${{parameters.rdm}}
                    approval: ${{parameters.approval}}
                    kubeconfig: ${{parameters.kubeconfig}}
                    git_tag: ${{parameters.git_tag}}
                    helm_release_name_prefix: ${{parameters.helm_release_name_prefix}}
            
            deploy:
              steps:
                - checkout: self
                - template: /provisioners/app/vivoflow/nodejs/api_default/steps/deploy/deploy.yml
                  parameters:
                    environment: ${{parameters.environment}}
                    rdm: ${{parameters.rdm}}
                    approval: ${{parameters.approval}}
                    kubeconfig: ${{parameters.kubeconfig}}
                    git_tag: ${{parameters.git_tag}}
                    helm_release_name_prefix: ${{parameters.helm_release_name_prefix}}
                    azureServiceConnectionEnabled: ${{ parameters.azureServiceConnectionEnabled }}
                    kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}

            on:
              success:
                steps:
                  - template: /provisioners/app/vivoflow/nodejs/api_default/steps/deploy/success.yml
                    parameters:
                      environment: ${{parameters.environment}}
                      rdm: ${{parameters.rdm}}
                      approval: ${{parameters.approval}}
                      kubeconfig: ${{parameters.kubeconfig}}
                      git_tag: ${{parameters.git_tag}}
                      helm_release_name_prefix: ${{parameters.helm_release_name_prefix}}

                  - template: /task_groups/governance/check_govapp_policies.yml
                    parameters:
                      govAppBreakglass: false
                      govAppOperation: "deploy"
                      continueOnError: true
                      environment: ${{ parameters.environment }}
                      stack: "NODEJS"
                      
                  - template: /tasks/telemetry/telemetry.yml
                  
              failure:
                steps:
                  - template: /provisioners/app/vivoflow/nodejs/api_default/steps/deploy/failure.yml
                    parameters:
                      environment: ${{parameters.environment}}
                      rdm: ${{parameters.rdm}}
                      approval: ${{parameters.approval}}
                      kubeconfig: ${{parameters.kubeconfig}}
                      git_tag: ${{parameters.git_tag}}
                      helm_release_name_prefix: ${{parameters.helm_release_name_prefix}}

                  - template: /tasks/telemetry/telemetry.yml
