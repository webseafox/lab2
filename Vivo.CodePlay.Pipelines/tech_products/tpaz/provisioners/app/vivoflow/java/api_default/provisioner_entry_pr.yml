variables:
- template: /provisioners/app/vivoflow/java/api_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /provisioners/app/vivoflow/java/api_default/stages/init.yml

## BUILD & TEST
- template: /provisioners/app/vivoflow/java/api_default/stages/build_test.yml

## GATES
- template: /provisioners/app/vivoflow/java/api_default/stages/gates.yml
  parameters:
    environment: $(VIVOFLOW_ENVIRONMENT)

## SECURITY
- template: /provisioners/app/vivoflow/java/api_default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion