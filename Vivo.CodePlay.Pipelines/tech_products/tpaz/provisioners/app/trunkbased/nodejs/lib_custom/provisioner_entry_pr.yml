parameters:
- name: incrementLevel
  default: patch

variables:
  - template: /provisioners/app/trunkbased/nodejs/lib_custom/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /provisioners/app/trunkbased/nodejs/lib_custom/stages/init.yml

## BUMP_VERSION
- template: /provisioners/app/trunkbased/nodejs/lib_custom/stages/version.yml
  parameters:
    incrementLevel: ${{ parameters.incrementLevel }}

## GATES
- template: /provisioners/app/trunkbased/nodejs/lib_custom/stages/gates.yml

## SECURITY
- template: /provisioners/app/trunkbased/nodejs/lib_custom/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion
