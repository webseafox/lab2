parameters:
- name: qa_environment
  type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: argocd_enabled
  type: boolean
  default: False
- name: enableDevflowValidations
  type: boolean
  default: False
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: enabledCanaryReleaseWithArgoCD
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False

variables:
- template: /provisioners/app/trunkbased/nodejs/api_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    environment: ${{ parameters.qa_environment }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
# CI / CD Flow

## INIT
- template: /provisioners/app/trunkbased/nodejs/api_default/stages/init.yml

- ${{ if or( and( ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')), and(startsWith(variables['Build.SourceBranch'], 'refs/heads/'), ne(parameters.dev_namespace_to_deploy, '')) ) }}:
  ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
    - template: /provisioners/app/trunkbased/nodejs/api_default/stages/validate_standards_dev_flow.yml
  
  ## BUILD & TEST
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/build_test.yml
    parameters:
      enableDevflowValidations: ${{ parameters.enableDevflowValidations }}

  ## GATES
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/gates.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## SECURITY
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/security_sast_sca.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/package.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
      environment: "dev"
      enabledCanaryReleaseWithArgoCD: ${{ parameters.enabledCanaryReleaseWithArgoCD }}


- ${{ if or( and( ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')), and(startsWith(variables['Build.SourceBranch'], 'refs/heads/'), ne(parameters.dev_namespace_to_deploy, '')) ) }}:
  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
  ## FINALIZE PRE VALIDATIONS 
    - template: /provisioners/app/trunkbased/nodejs/api_default/stages/pos_validate_standards_dev_flow.yml

  ## VALIDATIONS
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/validation.yml

  ## COMPONENT TEST
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/component_test.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"

  ## DEPLOY
  - ${{ if ne(parameters.skip_deploy, True) }}:
    - template: /provisioners/app/trunkbased/nodejs/api_default/stages/deploy.yml
      parameters:
        ${{ if ne(parameters.dev_namespace_to_deploy, '') }}:
            environment: ${{ parameters.dev_namespace_to_deploy }}
        ${{ else }}:
            environment: ${{ parameters.qa_environment }}
        argocd_enabled: ${{ parameters.argocd_enabled }}
        dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: true
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

    ## BlueGreen & Canary
    - ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
      ## PROMOTE
      - template: /provisioners/app/trunkbased/nodejs/api_default/stages/argorollouts_promote.yml
        parameters:
          ${{ if eq(parameters.dev_namespace_to_deploy, '') }}:
            environment: dev
          ${{ elseif ne(parameters.dev_namespace_to_deploy, '') }}:
            environment: ${{ parameters.dev_namespace_to_deploy }}
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      ## ROLLBACK
      - template: /provisioners/app/trunkbased/nodejs/api_default/stages/argorollouts_rollback.yml
        parameters:
          ${{ if eq(parameters.dev_namespace_to_deploy, '') }}:
            environment: dev
          ${{ elseif ne(parameters.dev_namespace_to_deploy, '') }}:
            environment: ${{ parameters.dev_namespace_to_deploy }}
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

# Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/release.yml
    parameters:
      argocd_enabled: ${{ parameters.argocd_enabled }}
      git_tag: false
      useExternalEnv: ${{ parameters.useExternalEnv }}
      azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
      kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      environment: ${{ parameters.qa_environment }}
      private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
      kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
      helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(parameters.qa_environment) }})

  ## DEPLOY BLUE GREEN & CANARY
  - ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
    ## PROMOTE
    - template: /provisioners/app/trunkbased/nodejs/api_default/stages/argorollouts_promote.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        dependsOn: release
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
    ## ROLLBACK
    - template: /provisioners/app/trunkbased/nodejs/api_default/stages/argorollouts_rollback.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        dependsOn: release
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}