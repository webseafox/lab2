parameters:
- name: qa_environment
  type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: bumpVersionOnManual
  type: boolean
  default: false
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False

variables:
- template: /provisioners/app/trunkbased/nodejs/bff_client_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages: 
# CI / CD Flow

## INIT
- template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/init.yml

- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  ## BUILD & TEST
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/build_test_bff_and_client.yml

  ## COMPONENT TEST
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/component_test.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"

  ## GATES
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/gates.yml

  ## SECURITY
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/security_sast_sca.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/package.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
      environment: dev

  ## VALIDATIONS
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/validation.yml

  ## DEPLOY
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/deploy.yml
    parameters:
      environment: dev
      private_agent_pool: $(PRIVATE_AGENT_DEV)
      kubeconfig: $(KUBECONFIG_DEV)
      git_tag: true
      helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
      skip_deploy: ${{ parameters.skip_deploy }}

# Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - template: /provisioners/app/trunkbased/nodejs/bff_client_default/stages/release.yml
    parameters:
      ${{ if eq(parameters.qa_environment, 'dev') }}:
        environment: dev
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)

      ${{ if eq(parameters.qa_environment, 'esteira1') }}:
        environment: esteira1
        private_agent_pool: $(PRIVATE_AGENT_ESTEIRA1)
        kubeconfig: $(KUBECONFIG_ESTEIRA1)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_ESTEIRA1)

      ${{ if eq(parameters.qa_environment, 'esteira2') }}:
        environment: esteira2
        private_agent_pool: $(PRIVATE_AGENT_ESTEIRA2)
        kubeconfig: $(KUBECONFIG_ESTEIRA2)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_ESTEIRA2)

      ${{ if eq(parameters.qa_environment, 'preprod') }}:
        environment: preprod
        private_agent_pool: $(PRIVATE_AGENT_PREPROD)
        kubeconfig: $(KUBECONFIG_PREPROD)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_PREPROD)

      ${{ if eq(parameters.qa_environment, 'prodlike') }}:
        environment: prodlike
        private_agent_pool: $(PRIVATE_AGENT_PRODLIKE)
        kubeconfig: $(KUBECONFIG_PRODLIKE)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_PRODLIKE)

      ${{ if eq(parameters.qa_environment, 'producao') }}:
        environment: producao
        private_agent_pool: $(PRIVATE_AGENT_PRODUCAO)
        kubeconfig: $(KUBECONFIG_PRODUCAO)
        git_tag: false
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_PRODUCAO)
