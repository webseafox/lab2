parameters:
- name: run_component_test
  type: boolean
- name: archiveName
  type: string
  default: app
- name: environment

stages:
- stage: package
  dependsOn:
  - security
  - build_test_bff_and_client
  - gates
  - ${{ if eq(parameters.run_component_test, True)}}:
    - component_test
  displayName: "Package & Publish"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: "Package"
    condition: and(always(), eq(variables.flowIsTagging, false), eq(variables.flowIsMain, true))
    displayName: "Package"
    variables:
      - name: SONAR_TASK_ID_CLIENT
        value: $[ stageDependencies.gates_client.sonarqube.outputs['sonar_task_id.SONAR_TASK_ID'] ]
      - name: SONAR_TASK_ID_BFF
        value: $[ stageDependencies.gates_bff.sonarqube.outputs['sonar_task_id.SONAR_TASK_ID'] ]
      - name: APP_VERSION
        value: $[ stageDependencies.build_test_bff_and_client.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
      - name: VERSION_EXISTS
        value: $[ dependencies.npm_check.outputs['check_version_exists.VERSION_EXISTS'] ]
      - name: USE_DT_DOCKER
        value: $[ stageDependencies.security.app_config_keys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
      - name: USE_CONVISO
        value: $[ stageDependencies.security.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
      - name: SKIP_SECURITY_GATE_SCA
        value: $[ stageDependencies.security.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]        
    steps:
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
    - template: /task_groups/package/docker_package.yml
      parameters:
        environment: ${{ parameters.environment }}
        artifactName: app
    - template: /tasks/nodejs/update_repo_version_bff_client.yml
      parameters:
        newVersion: "$(APP_VERSION)"
        condition: and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, true))

