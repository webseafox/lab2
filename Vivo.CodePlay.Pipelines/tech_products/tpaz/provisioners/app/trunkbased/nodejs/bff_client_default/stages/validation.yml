stages:
- stage: validation
  displayName: "Validation"
  dependsOn:
  - package
  - build_test_bff_and_client
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: validation
    condition: and(succeeded(), eq(variables.flowIsTagging, false), eq(variables.flowIsMain, true))
    variables:
    - name: IMAGE_DIGEST
      value: $[ stageDependencies.package.Package.outputs['docker_digest.DOCKER_DIGEST'] ]
    - name: APP_VERSION
      value: $[ stageDependencies.build_test_bff_and_client.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
    displayName: "Gates Validation"
    steps:
    - template: /tasks/bash/welcome.yml
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tasks/grafeas/validate_notes.yml
      parameters:
        imageDigest: $(IMAGE_DIGEST)
        dockerImageName: $(APP_NAME)
        dockerAppVersion: $(APP_VERSION)
