parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
  
variables:
- template: /global/variables/pipeline.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}

- template: /provisioners/app/global/nodejs/variables/init.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}

- name: BUMP_VERSION_ENABLED
  value: 'true'

- name: COMPONENT_TESTS_WORKING_DIRECTORY
  value: $(Agent.TempDirectory)/component_test

- name: COMPONENT_TESTS_COMPOSE_PROJECT_NAME
  value: $(Build.BuildId)

- name: COMPONENT_TESTS_COMPOSE_MAIN_SERVICE
  value: ""

- name: COMPONENT_TESTS_COMPOSE_FILE_PATH
  value: ""

- name: COMPONENT_TESTS_RESULT_DIRECTORY
  value: ""

- name: CMD_BUILD_TEST_BFF
  value: ""

- name: CMD_BUILD_TEST_CLIENT
  value: ""

- name: BFF_FOLDER_NAME
  value: "bff"

- name: CLIENT_FOLDER_NAME
  value: "client"

- name: BFF_SONARQUBE_CONFIG_FILE
  value: "./$(BFF_FOLDER_NAME)/sonar-project.properties"

- name: CLIENT_SONARQUBE_CONFIG_FILE
  value: "./$(CLIENT_FOLDER_NAME)/sonar-project.properties"

- name: BFF_ESLINT_RESULT_PATH
  value: ""

- name: CLIENT_ESLINT_RESULT_PATH
  value: ""

- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"

- group: "azdo-team-project-variables"

- group: "${{ variables['Build.DefinitionName'] }}"

- template: /.azuredevops/variables/private.yml@self