stages:
- ${{ if ne(parameters.skip_deploy, True)}}:
  - stage: deploy
    dependsOn:
    - validation
    pool: ${{ parameters.private_agent_pool }}
    displayName: "Deploy ${{ parameters.environment }}"
    jobs:
    - deployment: ${{ parameters.environment }}
      condition: and(always(), eq(variables.flowIsTagging, false), eq(variables.flowIsMain, true))
      workspace:
        clean: all
      displayName: Deploy
      environment: "deploy-${{ parameters.environment }}"
      strategy:
        runOnce:
          deploy:
            steps:
            - template: /provisioners/app/trunkbased/nodejs/bff_client_default/steps/deploy/deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                kubeconfig: ${{ parameters.kubeconfig }}
                git_tag: ${{ parameters.git_tag }}
                helm_release_name_prefix: ${{ parameters.helm_release_name_prefix }}

          on:
            success:
              steps:
              - template: /provisioners/app/trunkbased/nodejs/bff_client_default/steps/deploy/success.yml
                parameters:
                  environment: ${{ parameters.environment }}
                  kubeconfig: ${{ parameters.kubeconfig }}
                  git_tag: ${{ parameters.git_tag }}
                  helm_release_name_prefix: ${{ parameters.helm_release_name_prefix }}
                
            failure:
              steps:
              - template: /provisioners/app/trunkbased/nodejs/bff_client_default/steps/deploy/failure.yml
                parameters:
                  environment: ${{ parameters.environment }}
                  kubeconfig: ${{ parameters.kubeconfig }}
                  git_tag: ${{ parameters.git_tag }}
                  helm_release_name_prefix: ${{ parameters.helm_release_name_prefix }}