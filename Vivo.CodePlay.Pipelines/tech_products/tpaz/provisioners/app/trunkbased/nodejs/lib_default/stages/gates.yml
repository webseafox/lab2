stages:
- stage: gate
  displayName: "Quality Gates"
  dependsOn: 
  - build_test
  variables:
    APP_VERSION: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.LIB_NEW_VERSION'] ]
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: sonarqube
    condition: and(succeeded(), eq(variables.flowIsTagging, false), ne(variables.skip_sonarqube, true), eq(variables.flowIsMain, true))
    displayName: Code Analysis
    steps:
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        skipDownload: true
        workingDirectory: $(Build.SourcesDirectory)
    - template: /task_groups/gates/run_sonarqube_scan.yml
      parameters:
        stack: "NODE"
        projectKey: "$(SONAR_PROJECT_KEY)"

  - job: grafeas_occurrences
    displayName: Grafeas Occurrences
    condition: eq(variables['GRAFEAS_INTEGRATION_ENABLED'], true)
    dependsOn:
    - sonarqube
    variables: 
      SONAR_TASK_ID: $[ dependencies.sonarqube.outputs['sonar_task_id.SONAR_TASK_ID'] ]
    steps:
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        skipDownload: true
        workingDirectory: $(Build.SourcesDirectory)
    - template: /tasks/grafeas/make_occurrences_lib.yml
      parameters:
        dockerAppName: "$(APP_NAME)"
        dockerAppVersion: "$(APP_VERSION)"
        sonarProjectKey: "$(SONAR_PROJECT_KEY)"
        sonarTaskId: $(SONAR_TASK_ID)
