parameters:
- name: incrementLevel
  default: patch

variables:
  - template: /provisioners/app/trunkbased/nodejs/lib_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /provisioners/app/trunkbased/nodejs/lib_default/stages/init.yml

## BUILD & TEST
- template: /provisioners/app/trunkbased/nodejs/lib_default/stages/build_test.yml
  parameters:
    incrementLevel: ${{ parameters.incrementLevel }}

## GATES
- template: /provisioners/app/trunkbased/nodejs/lib_default/stages/gates.yml

## SECURITY
- template: /provisioners/app/trunkbased/nodejs/lib_default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

## PUBLISH
- ${{ if and(not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')) }}:
  - template: /provisioners/app/trunkbased/nodejs/lib_default/stages/publish.yml
    parameters:
      environment: $(DEPLOY_ENVIRONMENT_LIB)
      gitTag: true      
      incrementLevel: ${{ parameters.incrementLevel }}
