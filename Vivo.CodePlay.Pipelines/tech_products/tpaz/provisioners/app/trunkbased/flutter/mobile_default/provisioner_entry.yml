parameters:
- name: appSlugAndroid
  type: string
- name: appSlugIOS
  type: string
- name: releaseNotesInput
  default: 'New release'

- name: target
  values:
  - 'apk'
  - 'ios'
  - 'both'
  default: both

- name: iosProvProfileSecureFile
  type: string
  default: ''

- name: iosAppIdentifier
  type: string
  default: ''

- name: iosAppSpecificId
  type: string
  default: ''

- name: iosDeployment
  values:
  - 'appcenter'
  - 'testflight'
  - 'both'
  default: both

variables:
- template: /provisioners/app/trunkbased/flutter/mobile_default/variables/load.yml

stages: 
## INIT
- template: /provisioners/app/trunkbased/flutter/mobile_default/stages/init.yml

# CI / CD Flow
- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  ## BUILD & TEST
  - template: /provisioners/app/trunkbased/flutter/mobile_default/stages/build_test.yml
    parameters:
      target: ${{ parameters.target }}

  ## GATES
  - template: /provisioners/app/trunkbased/flutter/mobile_default/stages/gates.yml

  ## SECURITY
  - template: /provisioners/app/trunkbased/flutter/mobile_default/stages/security.yml

  ## PACKAGE
  - template: /provisioners/app/trunkbased/flutter/mobile_default/stages/package.yml
    parameters:
      target: ${{ parameters.target }}
      iosProvProfileSecureFile: ${{ parameters.iosProvProfileSecureFile }}

  ## DEPLOY
  - template: /provisioners/app/trunkbased/flutter/mobile_default/stages/deploy.yml
    parameters:
      appSlugAndroid: ${{ parameters.appSlugAndroid }}
      appSlugIOS: ${{ parameters.appSlugIOS }}
      releaseNotesInput: ${{ parameters.releaseNotesInput }}
      target: ${{ parameters.target }}
      iosAppIdentifier: ${{ parameters.iosAppIdentifier }}
      iosAppSpecificId: ${{ parameters.iosAppSpecificId }}
      iosDeployment: ${{ parameters.iosDeployment }}

