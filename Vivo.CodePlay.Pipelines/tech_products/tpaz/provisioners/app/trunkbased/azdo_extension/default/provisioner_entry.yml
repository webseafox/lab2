variables:
- template: /provisioners/app/trunkbased/azdo_extension/default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/init.yml

## BUILD & TEST
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/build_test.yml

## GATES
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/gates.yml

## SECURITY
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/security_sast_sca.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

## PACKAGE
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/package.yml

## PUBLISH TO MARKET PLACE
- template: /provisioners/app/trunkbased/azdo_extension/default/stages/publish.yml
