stages:
- stage: package
  dependsOn:
  - security
  - gate
  displayName: "Package & Publish"
  pool: "GeneralPurposeLinuxAgentsCI"
  jobs:
  - job: package
    condition: and(succeeded(), eq(variables.flowIsMain, true))
    displayName: "Package"
    steps:
    - template: /task_groups/package/extension_package.yml