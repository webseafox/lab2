stages:
- stage: validate_${{ parameters.environment }}
  displayName: Prepare Deploy
  dependsOn:
    - pipeline_init
  variables:
  - template: /provisioners/app/trunkbased/java/api_default/variables/override.yml
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: validate
    steps:
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /global/general/set-output-variable.yml
      parameters:
        variable: APP_VERSION
        command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
    - template: /task_groups/release/run_validate.yml
      parameters:
        environment: ${{ parameters.environment }}

# Deploy QA Environments
- stage: release_${{ parameters.environment }}
  pool: ${{ parameters.private_agent_pool }}
  displayName: "Deploy ${{ parameters.environment }}"
  dependsOn:
  - validate_${{ parameters.environment }}
  variables:
  - template: /provisioners/app/trunkbased/java/api_default/variables/override.yml
  jobs:
  - deployment: ${{ parameters.environment }}
    workspace:
      clean: all
    displayName: Deploy
    environment: "deploy-${{ parameters.environment }}"
    strategy:
      runOnce:
        preDeploy:
          steps:
          - template: /task_groups/deploy/run_pre_deploy.yml
              
        deploy:
          steps:
          - ${{ if or(eq(parameters.azureServiceConnectionEnabled, true), eq(parameters.kubernetesServiceConnectionEnabled, true)) }}:
            - template: /task_groups/release/run_deploy_with_service_connection.yml
              parameters:
                environment: ${{ parameters.environment }}
                helmReleaseNamePrefix: ${{ parameters.helm_release_name_prefix }}
                useExternalEnv: ${{ parameters.useExternalEnv }} 
                azureServiceConnectionEnabled: ${{ parameters.azureServiceConnectionEnabled }}
                kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}
          - ${{ else }}:
            - template: /task_groups/release/run_deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                kubeconfig: ${{ parameters.kubeconfig }}
                helmReleaseNamePrefix: ${{ parameters.helm_release_name_prefix }}
                useExternalEnv: ${{ parameters.useExternalEnv }}

        on:
          success:
            steps:
            - template: /task_groups/release/run_pos_deploy_success.yml
            - template: /task_groups/governance/check_govapp_policies.yml
              parameters:
                govAppBreakglass: false
                govAppOperation: "deploy"
                continueOnError: false
                environment: ${{ parameters.environment }}
                stack: "JAVA"
              
          failure:
            steps:
              - template: /task_groups/release/run_pos_deploy_failure.yml