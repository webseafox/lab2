parameters:
- name: qa_environment
  type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False

variables:
- template: /provisioners/app/trunkbased/java/api_default/variables/load.yml
  parameters:
    environment: ${{ parameters.qa_environment }}
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages: 
# CI / CD Flow

## INIT
- template: /provisioners/app/trunkbased/java/api_default/stages/init.yml

- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  ## BUILD & TEST
  - template: /provisioners/app/trunkbased/java/api_default/stages/build_test.yml

  ## COMPONENT TEST
  - template: /provisioners/app/trunkbased/java/api_default/stages/component_test.yml
    parameters:
      run_component_test: "${{ parameters.run_component_test }}"

  ## GATES
  - template: /provisioners/app/trunkbased/java/api_default/stages/gates.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## SECURITY
  - template: /provisioners/app/trunkbased/java/api_default/stages/security_sast_sca.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /provisioners/app/trunkbased/java/api_default/stages/package.yml
    parameters:
      run_component_test: "${{ parameters.run_component_test }}"
      environment: "${{ parameters.qa_environment }}"

  ## VALIDATIONS
  - template: /provisioners/app/trunkbased/java/api_default/stages/validation.yml

  ## DEPLOY
  - ${{ if ne(parameters.skip_deploy, True) }}:
    - template: /provisioners/app/trunkbased/java/api_default/stages/deploy.yml
      parameters:
        environment: dev
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: true
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

    ## BlueGreen & Canary
    - ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
      ## PROMOTE
      - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_promote.yml
        parameters:
          environment: dev
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      ## ROLLBACK
      - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_rollback.yml
        parameters:
          environment: dev
          dependsOn: deploy
          kubeconfig: $(KUBECONFIG_DEV)
          private_agent_pool: $(PRIVATE_AGENT_DEV)
          azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
          kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

  # Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - ${{ if ne(parameters.qa_environment, 'deploy-simultaneo') }}:
    - template: /provisioners/app/trunkbased/java/api_default/stages/release.yml
      parameters:
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
        environment: ${{ parameters.qa_environment }}
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(parameters.qa_environment) }})
      
  # Deploy Simultaneo
  - ${{ if eq(parameters.qa_environment, 'deploy-simultaneo') }}:
    - template: /provisioners/app/trunkbased/java/api_default/stages/release.yml
      parameters:
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
        environment: esteira1
        private_agent_pool: $(PRIVATE_AGENT_ESTEIRA1)
        kubeconfig: $(KUBECONFIG_ESTEIRA1)
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_ESTEIRA1)

    - template: /provisioners/app/trunkbased/java/api_default/stages/release.yml
      parameters:
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
        environment:  preprod
        private_agent_pool: $(PRIVATE_AGENT_PREPROD)
        kubeconfig: $(KUBECONFIG_PREPROD)  
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_PREPROD)

  ##DEPLOY BLUE GREEN & CANARY
  - ${{ if eq(variables.useArgoRolloutsDeploys, true) }}:
    ## PROMOTE
    - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_promote.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        dependsOn: release_${{ parameters.qa_environment }}
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
    ## ROLLBACK
    - template: /provisioners/app/trunkbased/java/api_default/stages/argorollouts_rollback.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        dependsOn: release_${{ parameters.qa_environment }}
        kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
        private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}