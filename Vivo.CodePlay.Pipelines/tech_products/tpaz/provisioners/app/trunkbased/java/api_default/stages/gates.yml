stages:
- stage: gate
  displayName: "Quality Gates"
  dependsOn: 
  - build_test
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: sonarqube
      condition: and(succeeded(), eq(variables.flowIsTagging, false), ne(variables.skip_sonarqube, true))
      displayName: Code Analysis
      variables:
      - name: APP_VERSION
        value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
      steps:
      - template: /tasks/catalog_info/extract_variables.yml
        parameters:
          skipDownload: true
          workingDirectory: $(Build.SourcesDirectory)
      - template: /task_groups/gates/run_sonarqube_scan.yml
        parameters:
          stack: "JAVA"
          projectKey: "$(SONAR_PROJECT_KEY)"
      - template: /tasks/grafeas/sonar_occurrence.yml
        parameters:
          dockerAppName: $(APP_NAME)
          dockerAppVersion: $(APP_VERSION)
          sonarProjectKey: "$(SONAR_PROJECT_KEY)"
          sonarTaskId: $(sonar_task_id.SONAR_TASK_ID)

    - job: governance
      condition: and(succeeded(), eq(variables.flowIsTagging, false), eq(variables.flowIsPullRequest, false), eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true'))
      displayName: Governance Policies Check
      steps:
        - template: /task_groups/governance/check_govapp_policies.yml
          parameters:
            govAppBreakglass: false
            govAppOperation: "validate"
            continueOnError: false
            environment: ${{ parameters.environment }}
            stack: "JAVA"