parameters:
- name: pythonVersion
  type: string
- name: incrementLevel
  default: patch

stages:
- stage: package
  dependsOn:
  - build_test
  displayName: "Package & Publish"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: package
    condition: eq(variables.flowIsMain, true)
    displayName: "Package"
    steps:
    - template: /tasks/bash/welcome.yml
    
    - template: /task_groups/package/databricks_package.yml
      parameters:
        pythonVersion: ${{ parameters.pythonVersion }}

    - template: /tasks/telemetry/telemetry.yml
