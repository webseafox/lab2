parameters:
- name: environment
  type: string
- name: pythonVersion
  type: string
- name: databricksHost
  type: string
- name: databricksToken
  type: string

stages:
- stage: release_package
  displayName: "Package"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: package
    displayName: "Package"
    steps:
    - template: /task_groups/package/databricks_package.yml
      parameters:
        pythonVersion: ${{ parameters.pythonVersion }}

    - template: /tasks/telemetry/telemetry.yml

# Deploy Environments
- stage: release
  pool: $(PRIVATE_AGENT_DEFAULT)
  dependsOn:
  - release_package
  displayName: "Deploy ${{ parameters.environment }}"
  jobs:
  - deployment: ${{ parameters.environment }}
    workspace:
      clean: all
    displayName: Deploy
    environment: "deploy-${{parameters.environment}}"
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none

          - template: /task_groups/deploy/databricks_run_deploy.yml
            parameters:
              pythonVersion: "${{ parameters.pythonVersion }}"
              databricksHost: ${{ parameters.databricksHost }}
              databricksToken: ${{ parameters.databricksToken }}

        on:
          failure:
            steps:
            - template: /task_groups/deploy/run_pos_deploy_failure.yml
                
            - template: /tasks/telemetry/telemetry.yml
