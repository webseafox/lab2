parameters:
- name: pythonVersion
  default: '3.9'
  values:
    - "3.7"
    - "3.9"
    - "3.10"
    - "3.11"
- name: updateVersion
  default: false
  type: boolean
- name: incrementLevel
  default: patch

variables:
- template: /provisioners/app/trunkbased/python/lib_default/variables/load.yml
  parameters:
    updateVersion: ${{ parameters.updateVersion }}
    pythonVersion: ${{ parameters.pythonVersion }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /provisioners/app/trunkbased/python/lib_default/stages/init.yml

## EXTRACT VERSION
- template: /provisioners/app/trunkbased/python/lib_default/stages/extract_version.yml

## BUILD & TEST
- template: /provisioners/app/trunkbased/python/lib_default/stages/build_test.yml
  parameters:
    pythonVersion: ${{parameters.pythonVersion}}

## GATES
- template: /provisioners/app/trunkbased/python/lib_default/stages/gates.yml
  parameters:
    pythonVersion: ${{parameters.pythonVersion}}

## SECURITY
- template: /provisioners/app/trunkbased/python/lib_default/stages/security_sast_sca.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

## PACKAGE
- template: /provisioners/app/trunkbased/python/lib_default/stages/package.yml
  parameters:
    pythonVersion: ${{parameters.pythonVersion}}
    incrementLevel: ${{ parameters.incrementLevel }}

## VALIDATIONS
- template: /provisioners/app/trunkbased/python/lib_default/stages/validation.yml

## PUBLISH
- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  - template: /provisioners/app/trunkbased/python/lib_default/stages/publish.yml
    parameters:
      environment: production
      gitTag: true
      pythonVersion: ${{parameters.pythonVersion}}
      incrementLevel: ${{ parameters.incrementLevel }}
