steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    printf "
    ${RED}=================================================================================================================================
    ${RED}                                              FAILURE PACKAGE PUBLISH
    ${RED}=================================================================================================================================
    Se está vendo essa mensagem é porque aconteceu algo erro durante a implantação da sua aplicação. Mas não se preocupe a sua aplicação tem auto 
    remediação. Vou tentar dar umas dicas para você descobrir o que aconteceu de errado durante o processo de implantação da sua aplicação.

    Segue abaixo umas dicas parao TSHOOT:
    $(ALERT_MESSAGE_ARROW) CASO o step abaixo falhe com timeout, antes de tudo, ACESSE OS LOGS DA APLICAÇÃO
    $(ALERT_MESSAGE_ARROW) Pergunte ao responsável técnico de sua equipe como localizar esses logs.
    $(ALERT_MESSAGE_ARROW) Com os logs em mãos, identifique o problema e prossiga com a correção

    $(ALERT_MESSAGE_ARROW) Faça uma conferência se as configs de portas NÃO FORAM ALTERADAS e estão compativeis no (values.yml e no dockerfile)
    $(ALERT_MESSAGE_ARROW) Faça uma conferência se o health check está CORRETAMENTE configurado no values.yml e a aplicação possui a rota.
    $(ALERT_MESSAGE_ARROW) Faça uma conferência se a aplicação no mínimo roda localmente e você consegui rodar a imagem docker gerada.
    
    $(ALERT_MESSAGE_ARROW) Caso ainda tenha duvidas, solicite informações ao responsável técnico da sua equipe.

    Lembre-se que a esteira apenas reflete o comportamento da sua aplicação.
    Caso tenha dúvidas sobre essa fase do pipeline acesse a nossa documentação: $(CORPORATE_WIKI_DOC_URL)
    ${RED}=================================================================================================================================
    "
  displayName: Package Publish Failure
  name: t_failure_message

