stages:
- stage: stage_helm_update_repo
  displayName: Update Repository
  dependsOn:
    - stage_helm_bump_version
    - stage_helm_package
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: job_helm_update_repo
    displayName: Updating Chart Version Repository
    condition: eq(variables.BUMP_VERSION_ENABLED, true)
    variables:
      HELM_CHART_VERSION: $[ stageDependencies.stage_helm_bump_version.job_helm_bump_version.outputs['helm_bump_version.HELM_CHART_VERSION'] ]
    steps:
    - template: /tasks/bash/welcome.yml
    - template: /tasks/helm/update_repo_version.yml
      parameters:
        repository: self
        chartNewVersion: $(HELM_CHART_VERSION)
    - template: /tasks/telemetry/telemetry.yml