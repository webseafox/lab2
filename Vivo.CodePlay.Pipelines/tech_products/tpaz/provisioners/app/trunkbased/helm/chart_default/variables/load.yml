parameters:
- name: updateChartVersion
  type: boolean
  default: false

variables:
- template: /provisioners/app/global/helm/variables/init.yml

- group: "azdo-team-project-variables"

- group: "${{ variables['Build.DefinitionName'] }}"

- template: /.azuredevops/variables/private.yml@self

- name: BUMP_VERSION_ENABLED
  value: $[and(eq(${{parameters.updateChartVersion}}, true), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))]