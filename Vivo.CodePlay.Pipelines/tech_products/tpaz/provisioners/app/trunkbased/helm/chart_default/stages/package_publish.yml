stages:
- stage: stage_helm_package
  displayName: Package & Publish
  dependsOn: stage_helm_bump_version
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:  
  - job: job_helm_package
    displayName: Helm package & publish
    variables:
      HELM_CHART_VERSION: $[ stageDependencies.stage_helm_bump_version.job_helm_bump_version.outputs['helm_bump_version.HELM_CHART_VERSION'] ]
    steps:
    - template: /tasks/bash/welcome.yml
    - template: /tasks/helm/install_helm_dependency.yml
    - template: /task_groups/package/helm_publish.yml
      parameters:
        chartNewVersion: $(HELM_CHART_VERSION)
