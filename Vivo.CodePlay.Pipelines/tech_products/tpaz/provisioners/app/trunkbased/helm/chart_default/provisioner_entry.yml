parameters:
- name: updateChartVersion
  default: false
  type: boolean
- name: incrementLevel
  default: patch

variables:
- template: /provisioners/app/trunkbased/helm/chart_default/variables/load.yml
  parameters:
    updateChartVersion: ${{ parameters.updateChartVersion }}

stages:
## Lint
- template: stages/lint.yml

## Bump Version
- template: stages/bump_version.yml
  parameters:
    incrementLevel: ${{ parameters.incrementLevel }}

## Package & Publish
- template: stages/package_publish.yml

## Update Repo
- template: stages/update_repo.yml
