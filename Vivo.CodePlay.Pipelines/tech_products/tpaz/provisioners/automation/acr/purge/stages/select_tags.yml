parameters:
- name: keepDev
  type: boolean
  default: false

- name: keepRC
  type: boolean
  default: false

- name: enablePurgePrd
  type: boolean
  default: false

- name: dryRun
  type: boolean
  default: false

- name: amountToKeep
  default: 10

- name: amountToKeepPrd
  default: 20

stages:
- stage: stage_select_tags
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: "Select Tags"
  dependsOn:
  - stage_init
  jobs:
  - job: job_select_tags
    displayName: "Select Tags"
    variables:
      ACRONYM: $[ stageDependencies.stage_init.job_init.outputs['get_acronym.ACRONYM'] ]
    steps:
    - task: VivoCorePipelines-DVPS-ACRExpurgoSelectPurgeTags@1
      displayName: 'ACR Expurgo: $(ACRONYM)'
      inputs:
        acrEndpoint: 'https://$(HELM_REGISTRY_ACR_NAME)'
        serviceConnectionName: DevOpsSharedResources
        acronym: '$(ACRONYM)'
        dryRun: ${{ parameters.dryRun }}
        keepDev: ${{ parameters.keepDev }}
        keepRc: ${{ parameters.keepRc }}
        amountToKeep: ${{ parameters.amountToKeep }}
        enablePurgePrd: ${{ parameters.enablePurgePrd }}
        amountToKeepPrd: ${{ parameters.amountToKeepPrd }}
      env:
        PROXY: $(PROXY_AGENT_HTTP)