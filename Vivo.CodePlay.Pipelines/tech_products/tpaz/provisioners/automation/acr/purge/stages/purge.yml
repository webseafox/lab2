parameters:
- name: dryRun
  type: boolean
  default: false

stages:
- stage: stage_purge
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: Purge
  dependsOn:
  - stage_init
  - stage_select_tags
  jobs:
  - job: job_purge
    displayName: "Purge Images"
    variables:
      ACRONYM: $[ stageDependencies.stage_init.job_init.outputs['get_acronym.ACRONYM'] ]
    steps:
    - task: VivoCorePipelines-DVPS-ACRExpurgoPurgeImages@1
      displayName: 'ACR Expurgo'
      inputs:
        acrEndpoint: 'https://$(HELM_REGISTRY_ACR_NAME)'
        serviceConnectionName: DevOpsSharedResources
        acronym: '$(ACRONYM)'
        dryRun: ${{ parameters.dryRun }}
      env:
        PROXY: $(PROXY_AGENT_HTTP)