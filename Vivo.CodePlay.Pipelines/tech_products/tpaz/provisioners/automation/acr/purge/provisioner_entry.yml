parameters:
- name: keepDev
  type: boolean
  default: false

- name: keepRC
  type: boolean
  default: false

- name: enablePurgePrd
  type: boolean
  default: false

- name: dryRun
  type: boolean
  default: false

- name: amountToKeep
  default: 10

- name: amountToKeepPrd
  default: 20

variables:
- template: variables/load.yml

stages :
- template: stages/init.yml
  parameters:
    keepDev: ${{ parameters.keepDev }}
    keepRC: ${{ parameters.keepRC }}
    enablePurgePrd: ${{ parameters.enablePurgePrd }}
    dryRun: ${{ parameters.dryRun }}
    amountToKeep: ${{ parameters.amountToKeep }}
    amountToKeepPrd: ${{ parameters.amountToKeepPrd }}

- template: stages/select_tags.yml
  parameters:
    keepDev: ${{ parameters.keepDev }}
    keepRC: ${{ parameters.keepRC }}
    enablePurgePrd: ${{ parameters.enablePurgePrd }}
    dryRun: ${{ parameters.dryRun }}
    amountToKeep: ${{ parameters.amountToKeep }}
    amountToKeepPrd: ${{ parameters.amountToKeepPrd }}

- template: stages/purge.yml
  parameters:
    dryRun: ${{ parameters.dryRun }}