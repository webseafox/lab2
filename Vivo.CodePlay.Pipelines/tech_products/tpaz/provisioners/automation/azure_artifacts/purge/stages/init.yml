stages:
- stage: stage_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: Initialize
  jobs:
  - job: job_init
    displayName: "Initialize"
    steps:
    - bash: |
        ACRONYM=$(echo ${REPO_NAME} | grep -oP "(?<=Vivo.AzArtifacts.).*(?=.Expurgo)" | tr '[:lower:]' '[:upper:]')
        if [[ -z "$ACRONYM" ]]; then
          echo "##vso[task.logissue type=error;] The Repository/Pipeline Name doesn't match the pattern 'Vivo.AzArtifacts.<sigla>.Expurgo'."
          echo "##vso[task.complete result=Failed;]"
          exit
        fi
        
        echo "##[debug] ACRONYM............: ${ACRONYM}"
        echo "##vso[task.setvariable variable=ACRONYM;isoutput=true]${ACRONYM}"
      displayName: Get Repository Acronym
      name: get_acronym
      env:
        REPO_NAME: $(Build.DefinitionName)
