variables:
- group: "azdo-team-project-variables"

- template: /global/variables/pipeline.yml

- group: "${{ variables['Build.DefinitionName'] }}"

- name: LIQUIBASE_IMAGE_VERSION
  value: latest

- name: LIQUIBASE_IMAGE
  value: "vcr-docker.nexus.telefonica.com.br/liquibase/liquibase:$(LIQUIBASE_IMAGE_VERSION)"

- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/db"

- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"

- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)

- name: CMD_BUILD_TEST
  value: ""

- name: RED
  value: '\033[0;31m'

- name: GREEN
  value: '\033[0;32m'

- name: BLUE
  value: '\033[0;34m'

- name: YELLOW
  value: '\033[1;33m'

- name: BG_GREEN
  value: '\033[42;1;37m'

# docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.properties."java.version"  | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_NAME
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_APP_GROUP
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)

# Maven
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: ""
- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"


# messages
- name: LINHA_DE_ASTERISCOS
  value: "*************************************************************************************"

- name: CHECKSUMS_WARNING
  value: "$(LINHA_DE_ASTERISCOS) \n##[warning]The checksums do not need to be cleared. \n$(LINHA_DE_ASTERISCOS)"

- name: SNAPSHOT_MESSAGES
  value: "[INFO]The task will snapshot the schemas $schemas" 

- name: DATABASE_UPDATE_WARNING
  value: 'Database $(ENVIRONMENT) is aligned with the currently changelogs. Deploy is not required.'

- name: DATABASE_MSG_UPDATE
  value: '[INFO] Database $(URL_DATABASE) is up to date'


- name: DATABASE_MSG_NOT_UPDATE
  value: '##[warning] Database is NOT up to date'

- name: DEPLOY_ATTEMPT_MSG
  value: "${YELLOW}=================================================================================================================================\n${YELLOW}                                     DEPLOY ATTEMPT $i \n${YELLOW}=================================================================================================================================\n"

- name: TASK_ERROR_MSG
  value: 'task has finished with an error. Please check the logs for more information'

- name: CHANGESETS_NOT_APPLIED_MSG
  value: 'Some changesets have not been applied. Please check the system logs and verify if it is expected'

- name: ROLLBACK_ERROR_MSG
  value: 'The Rollback operation was unable to remove the changes. Please check the system logs and verify if it is expected'

- name: COMPARE_DESCRIPTIONS
  value: |
      "
      ${YELLOW}=================================================================================================================================
      ${YELLOW}                          Compare Descriptions
      ${YELLOW}=================================================================================================================================
      
      ${GREEN} $(ALERT_MESSAGE_ARROW) \e[1mMissing\e[0m: there are objects on your source database (before deploy) that are not on your target database (after deploy). Deleted objects by this build
      ${GREEN} $(ALERT_MESSAGE_ARROW) \e[1mUnexpected\e[0m: there are objects on your target database (after deploy) that are not on your source database (before deploy). Objects that are added by this build
      ${GREEN} $(ALERT_MESSAGE_ARROW) \e[1mChanged\e[0m: the object as it exists on the source database (before deploy) is different than as it exists in the target database(after deploy). Changed objects by this build

      ${YELLOW}=================================================================================================================================
      "

- name: DB_BUILD_WELCOME_MSG
  value: |
    Nessa etapa do pipeline vamos e validar os códigos e gerar os scripts necessários.

    Abaixo uma breve descrição dos steps dessa fase do pipeline:
    $(ALERT_MESSAGE_ARROW) DOWNLOAD CUSTOM SETTINGS.XML FROM SECURE FILE - Download do custon settings se inserido no Scure file do variable group $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) CHECKING FOR SETTINGS - Verifica se Settings é Custon $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) CONFIGURING CUSTOM SETTINGS.XML - Configuração do Custon  Settings $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) BUILD JAVA DOCKER IMAGE - Realiza o pull da imagem do java Maven e realiza seu build$(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) BUILD LIQUIBASE DOCKER IMAGE - Realiza o pull da imagem do Liquibase e realiza seu build, ativado via variável "ENABLE_SNAPSHOT_COMPARE=true"  $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) VALIDATE CHANGELOG - Realiza o processo validação do Changelog . $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) SNAPSHOT TARGET DATABASE - Realiza o snapshot o banco de dados no qual será realizado o deploy dos changesets, ativado via variável "ENABLE_SNAPSHOT_COMPARE=true" $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) COPY FILE TO STAGE - Copia o resultado da compilação para diretório de staging do Azure DevOps. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) PUBLISH ARTIFACT - Publica o resultado da compilação do componente para Azure DevOps. Disponível nos assets do pipeline. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) GENERATE DEPLOY SQL SCRIPT - Geração do script do que será modificado no banco. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) PUBLISH DEPLOY SQL SCRIPT FILE - Publica o script de deploy na pipeline. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) GENERATE ROLLBACK SQL SCRIPT - Geração do script de rollback do que será modificado no banco após do DEPLOY. Ativado via variável "ENABLE_ROLLBACK=true" $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) PUBLISH ROLLBACK SQL SCRIPT FILE - Publica o script de rollback na pipeline. Ativado via variável "ENABLE_ROLLBACK=true" $(RED) [FAILED]
    
    $(RED) [FAILED] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline é interrompido.
    $(GREEN) [CONTINUE ON ERROR] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline não é interrompido.

    Vamos guia-lo durante todas as fases do pipeline

- name: DB_VALIDATION_WELCOME_MSG
  value: |
    Nessa etapa do pipeline serão realizado algumas validações para conferencia antes da aprovação do DEPLOY.

    $(RED)Caso esteja com dúvida sobre esse stage siga as seguintes instruções:
        $(ALERT_MESSAGE_ARROW) Revise todos os gates do seu pipeline e garanta que eles atendem o critério de qualidade exigido.
        $(ALERT_MESSAGE_ARROW) Não sabe quais gates minha aplicação precisa ter? Entre em contato com sua liderança técnica para tirar suas dúvidas.
    
    Abaixo uma breve descrição dos steps dessa fase do pipeline:
    $(ALERT_MESSAGE_ARROW) DOWNLOAD BUILD ARTIFACTS - Realiza o download dos arquivos gerados durante o processo de compilação $(GREEN) [CONTINUE ON ERROR]
    $(ALERT_MESSAGE_ARROW) BUILD JAVA DOCKER IMAGE - Realiza o pull da imagem do java Maven e realiza seu build $(GREEN) [CONTINUE ON ERROR]
    $(ALERT_MESSAGE_ARROW) VERIFY IF DATABASE IS UP TO DATE - Verifica se os changesets já foram aplicados no banco de dados a ser realizado o DEPLOY. $(GREEN) [CONTINUE ON ERROR]

    $(RED) [FAILED] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline é interrompido.
    $(GREEN) [CONTINUE ON ERROR] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline não é interrompido.

- name: DB_DEPLOY_WELCOME_MSG
  value: |
    Nessa etapa do pipeline vamos implantar seus changesets no banco de dados de acordo com as configurações da sua 
    pipeline.

    Abaixo uma breve descrição dos steps dessa fase do pipeline:
    $(ALERT_MESSAGE_ARROW) DOWNLOAD BUILD ARTIFACTS - Realiza o download dos arquivos gerados durante o processo de build,gates e package. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) PRE-DEPLOY TAG pre-$(Build.BuildNumber) - Aplica uma tag ao banco de dados antes do deploy. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) DEPLOY CHANGESETS TO DATABASE - Aplica as mudanças ao banco de dados conforme configuração dos changelogs. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) POST-DEPLOY TAG post-$(Build.BuildNumber) - Aplica uma tag ao banco de dados apos do deploy. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) LIST UNDEPLOYED CHANGESETS - Lista os changesets não aplicas, caso existe. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) COMPARE DATABASE OBJECT - Comparação do estado do banco de dados antes e depois das mudanças, variável "ENABLE_SNAPSHOT_COMPARE=true". $(RED) [FAILED]

    $(RED) [FAILED] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline é interrompido.
    $(GREEN) [CONTINUE ON ERROR] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline não é interrompido.

- name: DB_DEPLOY_SUCCESS_MSG
  value: |
    Parabéns seus changesets foram aplicados com sucesso no banco de dados conforme configurado. Acesse o banco e valide. 
    com sucesso.

    $(ALERT_MESSAGE_PREFIX_WARNING) Seu banco de dados foi atualizado com sucesso no ambiente
    $(ALERT_MESSAGE_PREFIX_WARNING) Verifique com o responsável técnico como acessar o Banco de Dados.

    Abaixo uma breve descrição dos proximos steps dessa fase do pipeline:
    $(ALERT_MESSAGE_ARROW) Tag Pipeline - Adicionar uma Azure Devops Tag nesse build.
    $(ALERT_MESSAGE_ARROW) Preparation - Preparação para atualizar a versão do componente remotamente.
    $(ALERT_MESSAGE_ARROW) Update Component Version - Atualizar a versão do componente
    $(ALERT_MESSAGE_ARROW) Commit Updated Version - commit a versão atualizada

- name: DB_FAILURE_MSG
  value: |
    Se está vendo essa mensagem é porque aconteceu algo erro durante a implantação. 
    Vou tentar dar umas dicas para você descobrir o que aconteceu de errado durante o processo de implantação da sua aplicação.

    Segue abaixo umas dicas para a análise:
    $(ALERT_MESSAGE_ARROW) CASO o step abaixo falhe com timeout, antes de tudo, ACESSE OS LOGS
    $(ALERT_MESSAGE_ARROW) Pergunte ao responsável técnico de sua equipe como localizar esses logs.
    $(ALERT_MESSAGE_ARROW) Com os logs em mãos, identifique o problema e prossiga com a correção

    Lembre-se que a esteira apenas reflete o comportamento da sua aplicação.

- name: DB_ROLLBACK_WELCOME_MSG
  value: |
    Nessa etapa do pipeline vamos remover TODOS os changesets aplicado no banco de dados após a Liquibase Tag pre-$(Build.BuildNumber) de acordo com as configurações da sua pipeline.

    Abaixo uma breve descrição dos steps dessa fase do pipeline:
    $(ALERT_MESSAGE_ARROW) DOWNLOAD BUILD ARTIFACTS - Realiza o download dos arquivos gerados durante o processo de build,gates e package. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) ROLLBACK CHANGES - Rollback as mudanças realizadas após a tag pre-$(Build.BuildNumber) como configurado nos changesets. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) LIST CHANGESETS WERE ROLLED BACK - Listas os changes sets não aplicados no banco de dados, util para analise se os changesets foram removidos. $(RED) [FAILED]
    $(ALERT_MESSAGE_ARROW) COMPARE DATABASE OBJECT - Comparação do estado do banco de dados antes e depois das mudanças, variável "ENABLE_SNAPSHOT_COMPARE=true". $(RED) [FAILED]

    $(RED) [FAILED] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline é interrompido.
    $(GREEN) [CONTINUE ON ERROR] $(ALERT_MESSAGE_ARROW) Os steps com essa legenda caso acorra um erro na execução o pipeline não é interrompido.

- name: DB_ROLLBACK_SUCCESS_MSG
  value: |
    Parabéns seus changesets foram removidos com sucesso do banco de dados conforme configurado.  
    $(ALERT_MESSAGE_PREFIX_ARROW) Acesse o banco e valide as modificações.    
    $(ALERT_MESSAGE_PREFIX_ARROW) Verifique com o responsável técnico como acessar o banco de dados.
    $(ALERT_MESSAGE_PREFIX_ARROW) Caso não esteja conseguindo acessar o banco de dados entre em contato com suporte.
