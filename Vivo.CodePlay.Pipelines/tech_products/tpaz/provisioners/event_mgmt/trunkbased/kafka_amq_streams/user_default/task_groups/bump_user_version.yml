parameters:
- name: catalogPath

steps:
- script: |
    USER_VERSION=$(yq -r '.spec.version' catalog-info.yaml)
    echo "##[debug] USER_VERSION..: ${USER_VERSION}"

    if [ -z "${USER_VERSION}" ]; then
      echo "##vso[task.logissue type=error] Current version not found in catalog-info.yaml file."
      exit 1
    fi

    echo "##vso[task.setvariable variable=CURRENT_USER_VERSION]${USER_VERSION}"
    echo "##vso[task.setvariable variable=NEXT_USER_VERSION]${USER_VERSION}"
  displayName: Getting Current Version
  workingDirectory: ${{ parameters.catalogPath }}

- task: semver-bump@1
  displayName: Bump Version
  condition: and(succeeded(), eq(variables.BUMP_USER_VERSION_ENABLED, true))
  inputs:
    VersionVariable: 'NEXT_USER_VERSION'
    IncrementLevel: 'patch'

- script: |
    set -e
 
    echo "##[debug] CURRENT_USER_VERSION.........: ${CURRENT_USER_VERSION}"
    echo "##[debug] NEXT_USER_VERSION.........: ${NEXT_USER_VERSION}"
    echo "##[debug] BUILD_SOURCEBRANCHNAME...: ${BUILD_SOURCEBRANCHNAME}"
 
    git config --replace-all user.name "Azure DevOps"
    git config --replace-all user.email "devops-automation@telefonicati.onmicrosoft.com"
 
    git fetch
    git checkout -b ${BUILD_BUILDID}

    echo "##[command] Updating catalog-info.yaml"
    yq e '.spec.version = env(NEXT_USER_VERSION)' -i catalog-info.yaml
    
    git add catalog-info.yaml
    git status
    git commit -m "Bump VERSION to ${NEXT_USER_VERSION} [skip ci]"
 
    git checkout ${BUILD_SOURCEBRANCHNAME}
    git pull --rebase
    git merge ${BUILD_BUILDID}
    git branch -d ${BUILD_BUILDID}
   
    git status
    git push origin ${BUILD_SOURCEBRANCHNAME}

    echo "##vso[task.logissue type=warning;] Updated User Version from '${CURRENT_USER_VERSION}' to '${NEXT_USER_VERSION}'"
  displayName: Updating Version
  condition: and(succeeded(), eq(variables.BUMP_USER_VERSION_ENABLED, true))
  continueOnError: false
  workingDirectory: ${{ parameters.catalogPath }}
  name: push_bump_version_file
  env:
    NEXT_USER_VERSION: $(NEXT_USER_VERSION)
    CURRENT_USER_VERSION: $(CURRENT_USER_VERSION)

- script: |
    set -e
 
    echo "##[debug] CURRENT_USER_VERSION.........: ${CURRENT_USER_VERSION}"
    echo "##[debug] NEXT_USER_VERSION.........: ${NEXT_USER_VERSION}"

    git config --replace-all user.name "Azure DevOps"
    git config --replace-all user.email "devops-automation@telefonicati.onmicrosoft.com"

    echo "##[command] Tagging Version ${NEXT_USER_VERSION}"
    git fetch --prune --tags --force
    if git rev-parse -q --verify "refs/tags/${NEXT_USER_VERSION}" >/dev/null; then
      git tag -d ${NEXT_USER_VERSION}
    fi

    git tag -a ${NEXT_USER_VERSION} -m "Setting Tag ${NEXT_USER_VERSION}"
    git push -f origin ${NEXT_USER_VERSION}

    echo "##[command] Tagging Latest"
    git fetch --prune --tags --force
    if git rev-parse -q --verify "refs/tags/latest" >/dev/null; then
      echo "Latest tag found. Moving it."
      git tag -d latest
    else
      echo "Latest tag not found. Creating it."
    fi

    git tag -a latest -m "Setting Tag Latest"
    git push -f origin latest
  displayName: Tagging Version
  condition: succeeded()
  continueOnError: false
  workingDirectory: ${{ parameters.catalogPath }}
  name: tagging_version
  env:
    NEXT_USER_VERSION: $(NEXT_USER_VERSION)
    CURRENT_USER_VERSION: $(CURRENT_USER_VERSION)

- script: |
    echo "##[debug] NEXT_USER_VERSION.....: ${NEXT_USER_VERSION}"
    echo "##[debug] CURRENT_USER_VERSION.....: ${CURRENT_USER_VERSION}"
    echo "##vso[task.setvariable variable=NEXT_USER_VERSION;isoutput=true]${NEXT_USER_VERSION}"
    echo "##vso[task.setvariable variable=CURRENT_USER_VERSION;isoutput=true]${CURRENT_USER_VERSION}"
  displayName: Exposing Version Variables
  condition: succeeded()
  name: set_version
  env:
    NEXT_USER_VERSION: $(NEXT_USER_VERSION)
    CURRENT_USER_VERSION: $(CURRENT_USER_VERSION)