parameters:
- name: srcPath
- name: patchesPath

steps:
- script: |
    echo "Starting Build Phase"
  displayName: Starting Build Phase

- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-dev
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: "patch --filename ${{ parameters.srcPath }}/$(USER_DEFAULT_FILE_NAME) --patch-file ${{ parameters.patchesPath }}/dev/strimzi-metadata.yml -n desenvolvimento --local=true --type merge --output yaml > ${{ parameters.srcPath }}/patched-user.yaml"
  displayName: Patching User

- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-dev
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: 'apply --dry-run=server --filename ${{ parameters.srcPath }}/patched-user.yaml -n desenvolvimento'
  displayName: Dry Running User

- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-dev
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: 'apply --filename ${{ parameters.srcPath }}/patched-user.yaml -n desenvolvimento'
  condition: succeeded()
  displayName: Deploying User in Dev Environment