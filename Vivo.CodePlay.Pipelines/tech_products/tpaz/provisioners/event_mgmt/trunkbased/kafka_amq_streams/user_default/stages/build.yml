parameters:
- name: pool
  type: string

stages:
- stage: stage_build
  pool: ${{ parameters.pool }}
  displayName: Prepare & Build
  jobs:
  - job: job_build
    displayName: Prepare & Build
    variables:
      KUBE_API_SERVER_ENDPOINT: $(KUBE_API_SERVER_ENDPOINT_DESENVOLVIMENTO)
    steps:
    - checkout: self
      persistCredentials: true
      fetchTags: true
      path: src
    - checkout: kafka-amq-streams-user-patches
      path: patches
    - template: /tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Agent.BuildDirectory)/src
        skipDownload: true
    - template: /provisioners/event_mgmt/trunkbased/kafka_amq_streams/user_default/steps/build/build.yml
      parameters:
        srcPath: $(Agent.BuildDirectory)/src
        patchesPath: $(Agent.BuildDirectory)/patches
    - template: /provisioners/event_mgmt/trunkbased/kafka_amq_streams/user_default/task_groups/bump_user_version.yml
      parameters:
        catalogPath: $(Agent.BuildDirectory)/src