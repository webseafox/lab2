parameters:
- name: buildVersion
- name: parameterVersion

steps:
- script: |
    echo "##[debug] PARAMETER_VERSION..........: ${PARAMETER_VERSION}"
    echo "##[debug] BUILD_VERSION..............: ${BUILD_VERSION}"

    if [[ ! -z "${PARAMETER_VERSION}" ]]; then
      echo "##[warning] TOPIC_VERSION set with Pipeline Parameter value."
      echo "##vso[task.setvariable variable=TOPIC_VERSION;]${PARAMETER_VERSION}"
      echo "##vso[task.complete result=Succeeded;]"
    elif [[ ! -z "${BUILD_VERSION}" ]]; then
      echo "##[warning] TOPIC_VERSION set with Build & Package value."
      echo "##vso[task.setvariable variable=TOPIC_VERSION;]${BUILD_VERSION}"
      echo "##vso[task.complete result=Succeeded;]"
    else
      echo "##vso[task.logissue type=error;] Invalid TOPIC_VERSION"
      echo "##vso[task.complete result=Failed;]"
    fi
  displayName: Setting Deploy Topic Version
  env:
    PARAMETER_VERSION: ${{ parameters.parameterVersion }}
    BUILD_VERSION: ${{ parameters.buildVersion }}