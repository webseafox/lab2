parameters:
- name: environment
- name: project
- name: topicVersion
- name: srcPath
- name: patchesPath

steps:
- script: |
    echo "Starting Deploy Phase"
  displayName: Starting Deploy Phase

- script: |
    set -e
 
    echo "##[debug] TOPIC_VERSION.........: ${TOPIC_VERSION}"
 
    git config --replace-all user.name "Azure DevOps"
    git config --replace-all user.email "devops-automation@telefonicati.onmicrosoft.com"
 
    git fetch
    git checkout tags/${TOPIC_VERSION}
  displayName: Preparing Version
  continueOnError: false
  workingDirectory: ${{ parameters.srcPath }}
  name: preparing_version
  env:
    TOPIC_VERSION: ${{ parameters.topicVersion }}
    
- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-${{ parameters.environment }}
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: "patch --filename ${{ parameters.srcPath }}/$(TOPIC_DEFAULT_FILE_NAME) --patch-file ${{ parameters.patchesPath }}/${{ parameters.environment }}/strimzi-metadata.yml -n ${{ parameters.project }} --local=true --type merge --output yaml > ${{ parameters.srcPath }}/patched-topic.yaml"
  displayName: Patching Topic

- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-${{ parameters.environment }}
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: "apply --filename ${{ parameters.srcPath }}/patched-topic.yaml -n ${{ parameters.project }}"
  displayName: Deploying Topic

- task: oc-cmd@3
  inputs:
    connectionType: 'OpenShift Connection Service'
    openshiftService: api-ocp-kafka-${{ parameters.environment }}
    version: '$(OPENSHIFT_CLI_VERSION_URL)'
    proxy: '$(OPENSHIFT_PROXY)'
    cmd: "get KafkaTopic -n ${{ parameters.project }}"
  displayName: Getting Kafka Topics
