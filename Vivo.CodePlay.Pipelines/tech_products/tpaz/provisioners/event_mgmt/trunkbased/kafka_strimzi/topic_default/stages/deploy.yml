parameters:
- name: environment
  type: string
  values:
  - dev
  - esteira1
  - esteira2
  - prodlike
  - preprod
  - producao
- name: project
  type: string
  values:
  - desenvolvimento
  - esteira-01
  - esteira-02
  - prodlike
  - preproducao
  - producao
- name: credential_ref
  type: string
  values:
  - staging
  - producao
- name: dependsOn
  type: object
  default: []
- name: pool
  type: string

stages:
- stage: stage_deploy_${{ parameters.environment }}
  pool: ${{ parameters.pool }}
  displayName: Deploy ${{ parameters.environment }}
  condition: and(succeeded(), eq(variables.flowIsMain, true))
  dependsOn: ${{ parameters.dependsOn }}
  jobs:
  - deployment: deployment_${{ parameters.environment }}
    displayName: Deploy ${{ parameters.environment }}
    environment: deploy-${{ parameters.environment }}
    variables:
      KUBE_API_SERVER_ENDPOINT: $(KUBE_API_SERVER_ENDPOINT_${{ upper(parameters.environment) }})
      NEXT_TOPIC_VERSION: $[ stageDependencies.stage_build.job_build.outputs['set_version.NEXT_TOPIC_VERSION'] ]
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchTags: true
            path: src
          - checkout: kafka-strimzi-topic-patches
            path: patches
          - template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/task_groups/deploy_set_version.yml
            parameters:
              parameterVersion: $(TOPIC_VERSION)
              buildVersion: $(NEXT_TOPIC_VERSION)
          - template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/steps/deploy/deploy.yml
            parameters:
              environment: ${{ parameters.environment }}
              project: ${{ parameters.project }}
              credential_ref: ${{ parameters.credential_ref }}
              topicVersion: $(TOPIC_VERSION)
              srcPath: $(Agent.BuildDirectory)/src
              patchesPath: $(Agent.BuildDirectory)/patches