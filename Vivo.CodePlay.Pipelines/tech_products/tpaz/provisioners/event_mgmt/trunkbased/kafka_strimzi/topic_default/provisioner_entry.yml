parameters:
- name: topicVersion
  type: string
  default: ''

variables:
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/variables/load.yml
  parameters:
    topicVersion: ${{ parameters.topicVersion }}

resources:
  repositories:
  - repository: kafka-strimzi-topic-patches
    type: git
    name: EMDP - Event Management Digital Platform/kafka-strimzi-topic-patches
    ref: refs/heads/master
    endpoint: CorePipelines

stages:
- ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
  - template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/build.yml
    parameters:
      pool: '$(PRIVATE_AGENT_DEV)'
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/deploy.yml
  parameters:
    environment: esteira1
    project: esteira-01
    credential_ref: staging
    pool: '$(PRIVATE_AGENT_ESTEIRA1)'
    ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
      dependsOn: 
        - stage_build
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/deploy.yml
  parameters:
    environment: esteira2
    project: esteira-02
    credential_ref: staging
    pool: '$(PRIVATE_AGENT_ESTEIRA2)'
    ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
      dependsOn: 
        - stage_build
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/deploy.yml
  parameters:
    environment: preprod
    project: preproducao
    credential_ref: staging
    pool: '$(PRIVATE_AGENT_PREPROD)'
    ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
      dependsOn: 
        - stage_build
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/deploy.yml
  parameters:
    environment: prodlike
    project: prodlike
    credential_ref: staging
    pool: '$(PRIVATE_AGENT_PRODLIKE)'
    ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
      dependsOn: 
        - stage_build
- template: /provisioners/event_mgmt/trunkbased/kafka_strimzi/topic_default/stages/deploy.yml
  parameters:
    environment: producao
    project: producao
    credential_ref: producao
    pool: '$(PRIVATE_AGENT_PRODUCAO)'
    ${{ if eq(variables.isTopicVersionParameterEmpty, true) }}:
      dependsOn: 
      - stage_build
      - stage_deploy_preprod
