parameters:
- name: topicVersion

variables:
- template: /global/variables/pipeline.yml

- name: BUMP_TOPIC_VERSION_ENABLED
  value: $[ and(eq(variables.flowIsMain, true), eq(variables['Build.Reason'], 'IndividualCI')) ]

- name: TOPIC_DEFAULT_FILE_NAME
  value: strimzi-topic-definition.yaml

- name: SCRIPTS_CHECKOUT_PATH
  value: vivo-core-pipelines

- name: ASDF_PYTHON_VERSION
  value: "3.9.16"

- name: PRIVATE_AGENT_DEV
  value: '$(PRIVATE_AGENT_DEV_REF)'
- name: PRIVATE_AGENT_ESTEIRA1
  value: '$(PRIVATE_AGENT_ESTEIRA1_REF)'
- name: PRIVATE_AGENT_ESTEIRA2
  value: '$(PRIVATE_AGENT_ESTEIRA2_REF)'
- name: PRIVATE_AGENT_PREPROD
  value: '$(PRIVATE_AGENT_PREPROD_REF)'
- name: PRIVATE_AGENT_PRODLIKE
  value: '$(PRIVATE_AGENT_PRODLIKE_REF)'
- name: PRIVATE_AGENT_PRODUCAO
  value: '$(PRIVATE_AGENT_PRODUCAO_REF)'

- group: "kafka-strimzi-topic"

# Variables Read-Only
- name: isTopicVersionParameterEmpty
  value: ${{ eq(replace(parameters.topicVersion, ' ', ''), '') }}

- name: TOPIC_VERSION
  value: ${{ replace(parameters.topicVersion, ' ',  '') }}