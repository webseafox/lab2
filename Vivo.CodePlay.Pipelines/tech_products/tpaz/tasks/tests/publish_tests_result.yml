parameters:
- name: displayName
  default: Publish Test Results
- name: testResultsFilesPattern
  default: "**/TEST-*.xml"
- name: testResultsFormat
  default: JUnit
- name: searchFolder
  default: $(System.DefaultWorkingDirectory)
- name: failTaskOnFailedTests
  default: true
- name: mergeTestResults
  default: true
- name: continueOnError
  default: true
- name: publishRunAttachments
  default: true
- name: testRunTitle
  default: "Test Results"
- name: condition
  default: succeeded()

steps:
- task: PublishTestResults@2
  name: t_publish_test_result
  displayName: ${{ parameters.displayName }}
  inputs:
    mergeTestResults: ${{ parameters.mergeTestResults }}
    searchFolder: ${{ parameters.searchFolder }}
    testResultsFiles: ${{ parameters.testResultsFilesPattern }}
    testResultsFormat: ${{ parameters.testResultsFormat }}
    testRunTitle: ${{ parameters.testRunTitle }}
    failTaskOnFailedTests: ${{ parameters.failTaskOnFailedTests }}
    publishRunAttachments: ${{ parameters.publishRunAttachments }}
  continueOnError: ${{ parameters.continueOnError }}
  condition: ${{ parameters.condition }}