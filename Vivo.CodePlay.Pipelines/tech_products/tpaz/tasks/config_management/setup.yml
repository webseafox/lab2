steps:
- bash: |
    if [ "${{ variables.CONFIG_MANAGEMENT }}" == "true" ]; then
        echo "##[debug] Variável CONFIG_MANAGEMENT está com o valor = true"
    else
        echo "##[debug] Variável CONFIG_MANAGEMENT está com o valor = false"
    fi
  displayName: "Config Mgmt"

- task: PipAuthenticate@1
  displayName: 'Config Mgmt - Pip Authenticate'
  inputs:
    artifactFeeds: $(AZURE_ARTIFACTS_FEED)
  env:
    http_proxy: $(PROXY_AGENT_HTTP)
    https_proxy: $(PROXY_AGENT_HTTPS)
    no_proxy: $(PROXY_AGENT_NO_PROXY)
  condition: and(
              succeeded(),
              eq(variables.CONFIG_MANAGEMENT, true)
            )

- bash: |
    echo "##[debug] Instalando requirements.txt"
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    pip install -r requirements.txt
  condition: and(
              succeeded(),
              eq(variables.CONFIG_MANAGEMENT, true)
            )
  displayName: "Config Mgmt - Install Packages"