parameters:
- name: passwordVariable
- name: privateKeyContentVariable

steps:
- task: Bash@3
  displayName: '[COE] Decrypt senha segura password'
  env:
    ENCRYPTED_PASSWORD_B64: $(${{ parameters.passwordVariable }})
    PRIVATE_KEY_CONTENT: $(${{ parameters.privateKeyContentVariable }})
  inputs:
    targetType: inline
    script: |
      key_file_path="$(Build.SourcesDirectory)/$(Build.BuildId)/senha_segura_private.key"
      mkdir -p "$(dirname "${key_file_path}")"

      trap 'rm -f "${key_file_path}"' EXIT

      # Insere as quebras de linha do formato PEM esperadas pelo OpenSSL.
      printf '%s' "${PRIVATE_KEY_CONTENT}" \
        | sed 's/-----BEGIN PRIVATE KEY-----/-----BEGIN PRIVATE KEY-----\n/' \
        | sed 's/-----END PRIVATE KEY-----/\n-----END PRIVATE KEY-----/' \
        > "${key_file_path}"

      decrypted_password="$(
        printf '%s' "${ENCRYPTED_PASSWORD_B64}" \
          | base64 -d --ignore-garbage \
          | openssl rsautl \
              -decrypt \
              -inkey "${key_file_path}" \
              -oaep
      )"

      echo "##vso[task.setvariable variable=${{ parameters.passwordVariable }};isSecret=true;]${decrypted_password}"