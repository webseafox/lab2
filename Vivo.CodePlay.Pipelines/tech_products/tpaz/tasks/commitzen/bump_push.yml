steps:
- script: |
    echo "##[debug] BUILD_SOURCEBRANCHNAME............: ${BUILD_SOURCEBRANCHNAME}"

    git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
    git config --global user.name "Azure DevOps"
    git fetch --prune --tags
    git checkout ${BUILD_SOURCEBRANCHNAME}
    git reset --hard origin/${BUILD_SOURCEBRANCHNAME}

    echo "##[command] git tag --list"
    git tag --list

    echo "##[command] cz bump --yes"
    cz bump --yes
    git push --tags origin ${BUILD_SOURCEBRANCHNAME}
  displayName: 'cz bump and push tag'
  condition: eq(variables.flowIsMain, true)