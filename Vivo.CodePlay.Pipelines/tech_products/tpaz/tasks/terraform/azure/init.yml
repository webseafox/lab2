parameters:
- name: setupGitConfigSSH

steps:
- ${{ if eq(parameters.setupGitConfigSSH, true) }}:
  - task: InstallSSHKey@0
    displayName: 'Setup git config ssh'
    continueOnError: true
    inputs:
      knownHostsEntry: $(sshKnownHostsEntry)
      sshKeySecureFile: $(sshKeySecureFile)
- task: AzureKeyVault@2
  displayName: 'Get Key Vault Credentials'
  inputs:    
    azureSubscription: DevOpsSharedResources    
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, AZ-DEVOPS-PAT-TOKEN, PHPIPAM-PASSWORD'
- script: |
    echo "##[debug] GIT_ASKPASS........: ${GIT_ASKPASS}"
    echo "exec echo \"$GIT_PASS\"" >> "${GIT_ASKPASS}"
    chmod 777 "${GIT_ASKPASS}"
    echo "##vso[task.setvariable variable=GIT_ASKPASS]$GIT_ASKPASS"
  displayName: 'Setup git config https'
  workingDirectory: $(Agent.TempDirectory)
  env:
    GIT_PASS : $(AZ-DEVOPS-PAT-TOKEN)
    GIT_ASKPASS: "$(Agent.TempDirectory)/git_env_password.sh"
- script: |
    echo "##[debug] TF_LOG............................: $(TF_LOG)"
    echo "##[debug] TF_BACKEND_SERVICE_CONNECTION.....: $(TF_BACKEND_SERVICE_CONNECTION)"
    echo "##[debug] TF_BACKEND_RESOURCE_GROUP.........: $(TF_BACKEND_RESOURCE_GROUP)"
    echo "##[debug] TF_BACKEND_STORAGE_ACCOUNT........: $(TF_BACKEND_STORAGE_ACCOUNT)"
    echo "##[debug] TF_BACKEND_CONTAINER..............: $(TF_BACKEND_CONTAINER)"
    echo "##[debug] tfBackendKey......................: $(tfBackendKey)"
    echo ""
    echo "##[debug] TF_PROVIDER_SERVICE_CONNECTION....: $(TF_PROVIDER_SERVICE_CONNECTION)"
    echo "##[debug] tfvarsLocation....................: $(tfvarsLocation)"
    echo ""
    echo "##[group] Additional env variables"
    echo "##[debug] AZDO_ORG_SERVICE_URL..............: $(AZDO_ORG_SERVICE_URL)"
    echo "##[debug] PHPIPAM_APP_ID....................: $(PHPIPAM_APP_ID)"
    echo "##[debug] PHPIPAM_ENDPOINT_ADDR.............: $(PHPIPAM_ENDPOINT_ADDR)"
    echo "##[debug] PHPIPAM_USER_NAME.................: $(PHPIPAM_USER_NAME)"
    echo "##[debug] TF_VAR_runtime_tags...............: $(TF_VAR_runtime_tags)"
    echo "##[endgroup]"
  displayName: 'Show terraform variables'
- task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
  displayName: 'Terraform INIT - azurerm'
  inputs:
    backendServiceArm: $(TF_BACKEND_SERVICE_CONNECTION)
    backendAzureRmResourceGroupName: $(TF_BACKEND_RESOURCE_GROUP)
    backendAzureRmStorageAccountName: $(TF_BACKEND_STORAGE_ACCOUNT)
    backendAzureRmContainerName: $(TF_BACKEND_CONTAINER)
    backendAzureRmKey: $(tfBackendKey)
    workingDirectory: $(Build.SourcesDirectory)
  env:
    TF_LOG: $(TF_LOG)