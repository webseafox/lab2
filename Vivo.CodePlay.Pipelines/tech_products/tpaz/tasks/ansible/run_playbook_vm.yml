parameters:
- name: playbookLocation
  default: $(ansiblePlaybookLocation)
- name: vmIp
- name: vmHostname
- name: vmAdminUsername
- name: vmAdminPassword
- name: domainUsername
  default: ''
- name: domainPassword
  default: ''
- name: svc_sscs_password
  default: ''
- name: unix_root_password
  default: ''
- name: windows_spt8486f_password
  default: ''

steps:
- task: AnsibleFromVivo@1
  inputs:
    playbookPathOnAgentMachine: ${{ parameters.playbookLocation }}
    failOnStdErr: false
    inventoriesAgentMachine: inlineContent
    inventoryInlineContentAgentMachine: |
      [hosts]
      ${{ parameters.vmIp }}

      [hosts:vars]
      hostname=${{ parameters.vmHostname }}
      ansible_user=${{ parameters.vmAdminUsername }}
      ansible_ssh_pass=${{ parameters.vmAdminPassword }}
      ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      svc_sscs_password=${{ parameters.svc_sscs_password }}

      ansible_winrm_server_cert_validation=ignore
      domain_user=${{ parameters.domainUsername }}
      domain_password=${{ parameters.domainPassword }}
      windows_spt8486f_password=${WINDOWS_SPT8486F_PASSWORD}

      unix_root_password=${{ parameters.unix_root_password }}
  displayName: Ansible Playbook VM
  env:
    ANSIBLE_VERBOSITY: $(ANSIBLE_VERBOSITY)
    ZABBIX_USER: $(ZABBIX-USER)
    ZABBIX_PASSWORD: $(ZABBIX-PASSWORD)
    PRISMA_AGENT_USER_PASS: $(PRISMA-AGENT-USER-PASS)
    SVC_LDVH: $(svc-ldvh)
    SVC_SSCS_AZURE: $(svc-sscs-azure)
    CAPACITY: $(capacity)
    SUPUNIX: $(supunix)
    TOPOLOGY: $(topology)
    SVCSNSOUNIX: $(svcsnsounix)
    MONITORACAO: $(monitoracao)
    SUPBKP: $(supbkp)
    REGISTRA_MAQUINA_REDHAT_8_CAMPINAS_BEARER: $(registra-maquina-redhat-8-campinas-bearer)
    REGISTRA_MAQUINA_REDHAT_7_CAMPINAS_BEARER: $(registra-maquina-redhat-7-campinas-bearer)
    REGISTRA_MAQUINA_REDHAT_8_NDC_Q1_BEARER: $(registra-maquina-redhat-8-ndc-q1-bearer)
    REGISTRA_MAQUINA_REDHAT_7_NDC_Q1_BEARER: $(registra-maquina-redhat-7-ndc-q1-bearer)
    REGISTRA_MAQUINA_REDHAT_8_NDC_Q2_BEARER: $(registra-maquina-redhat-8-ndc-q2-bearer)
    REGISTRA_MAQUINA_REDHAT_7_NDC_Q2_BEARER: $(registra-maquina-redhat-7-ndc-q2-bearer)
    REGISTRA_MAQUINA_REDHAT_8_BERRINI_BEARER: $(registra-maquina-redhat-8-berrini-bearer)
    REGISTRA_MAQUINA_REDHAT_7_BERRINI_BEARER: $(registra-maquina-redhat-7-berrini-bearer)
    REGISTRA_MAQUINA_REDHAT_8_CURITIBA_BEARER: $(registra-maquina-redhat-8-curitiba-bearer)
    REGISTRA_MAQUINA_REDHAT_7_CURITIBA_BEARER: $(registra-maquina-redhat-7-curitiba-bearer)
    REGISTRA_MAQUINA_ORACLE_LINUX_8_BEARER: $(registra-maquina-oracle-linux-8-bearer)
    CONNECTION_WITH_SATELLITE_BEARER: $(connection-with-satellite-bearer)
    UI_UM_PASSWORD_ANSIBLE: $(ui-um-password-ansible)
    WAZUH_REGISTRATION_PASSWORD: $(wazuh-registration-password)