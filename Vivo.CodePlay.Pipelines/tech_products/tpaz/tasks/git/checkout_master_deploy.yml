steps:
  - script: |
      echo "🔍 Buscando branches e verificando qual está mais atualizada..."
      git fetch --all

      MAIN_DATE=$(git log -1 --format=%ct origin/main 2>/dev/null || echo 0)
      MASTER_DATE=$(git log -1 --format=%ct origin/master 2>/dev/null || echo 0)

      if [[ "$MAIN_DATE" -eq 0 && "$MASTER_DATE" -eq 0 ]]; then
        echo "❌ Nenhuma das branches 'main' ou 'master' foi encontrada."
        exit 1
      fi

      BRANCH="main"
      if [[ "$MASTER_DATE" -gt "$MAIN_DATE" ]]; then
        BRANCH="master"
      fi

      echo "🔄 A branch mais recente é '$BRANCH'. Fazendo checkout..."
      
      git switch "$BRANCH" || { echo "⚠️ Erro ao fazer o checkout da branch '$BRANCH'"; exit 1; }
      git reset --hard origin/"$BRANCH" || { echo "⚠️ Erro ao atualizar a branch '$BRANCH'"; exit 1; }

      echo "✅ Código atualizado com sucesso na branch '$BRANCH'."
      
    displayName: "Checkout to Master or Main"
    condition: eq(variables['CHECKOUT_MASTER'], 'true')
