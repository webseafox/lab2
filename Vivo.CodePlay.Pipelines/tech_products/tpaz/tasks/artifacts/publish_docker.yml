steps:
- task: CopyFiles@2
  displayName: 'Copy to Staging Directory'
  inputs:
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    OverWrite: true
    CleanTargetFolder: true
    Contents: |
      docker.json

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact Docker'
  inputs:
    ArtifactName: docker
    StoreAsTar: false