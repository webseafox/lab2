parameters:
- name: skipSecurityGate
  default: false

steps:
- template: /tasks/checkmarx/prepare_gate.yml
  parameters:
    skipSecurityGate: ${{ parameters.skipSecurityGate }}

- template: /tasks/checkmarx/checkmarx_scan.yml
  parameters:
    additionalParams: $(CHECKMARX_THRESHOLD_ARGS)
    skipSecurityGate: ${{ parameters.skipSecurityGate }}
