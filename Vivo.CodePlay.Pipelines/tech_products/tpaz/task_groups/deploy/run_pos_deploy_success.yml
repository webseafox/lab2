parameters:
- name: environment
- name: dev_namespace_to_deploy
  default: ''

steps:
- task: DownloadBuildArtifacts@1
  displayName: 'Download Build Artifacts'
  inputs:
    artifactName: app
    parallelizationLimit: 20
    extractTars: true

- template: /tasks/artifacts/download_docker.yml

- template: /tasks/helm/utils.yml
  parameters:
    environment: ${{parameters.environment}}
    dev_namespace_to_deploy: ${{parameters.dev_namespace_to_deploy}}