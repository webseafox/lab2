parameters:
- name: pythonVersion
  type: string
- name: databricksHost
  type: string
  default: $(BASE_DATABRICKS_URL_DEV)
- name: databricksToken
  type: string
  default: $(DATABRICKS_TOKEN_DEV)

steps:
- template: /tasks/artifacts/download_pipeline.yml
  parameters:
    artifactName: databricksPackage
    targetPath: $(Build.SourcesDirectory)

- template: /tasks/databricks/install_whl_lib.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    databricksHost: ${{ parameters.databricksHost }}
    databricksToken: ${{ parameters.databricksToken }}

- template: /tasks/databricks/deploy_notebooks.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    databricksHost: ${{ parameters.databricksHost }}
    databricksToken: ${{ parameters.databricksToken }}