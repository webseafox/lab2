parameters:
- name: cmdBuildTest
  default: $(CMD_BUILD_TEST)
- name: artifactPublishEnable
  default: true
- name: artifactPublishName
  default: app
- name: dockerWorkDir
  type: string
  default: $(DOCKER_WORKDIR)
- name: newVersion
  default: ""

steps:
- template: /tasks/nodejs/setup_credentials.yml

- template: /tasks/nodejs/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tasks/nodejs/cache_dependencies.yml
  parameters:
    appDependenciesCachePathOutputVarName: "APP_DEPENDENCIES_CACHE_PATH"
    appDependenciesCacheFolderOutputVarName: "APP_DEPENDENCIES_CACHE_FOLDER"
    condition: eq(variables.CACHE_APP_DEPENDENCIES, true)

- template: /tasks/nodejs/build_with_docker.yml
  parameters:
    dockerWorkDir: ${{ parameters.dockerWorkDir}}
    cmdBuildTest: ${{ parameters.cmdBuildTest }}
    appDependenciesCachePath: $(APP_DEPENDENCIES_CACHE_PATH)
    appDependenciesCacheFolder: $(APP_DEPENDENCIES_CACHE_FOLDER)

- ${{ if eq(parameters.artifactPublishEnable, true) }}:
  - template: /tasks/artifacts/publish_app.yml
    parameters:
      artifactPublishName: ${{ parameters.artifactPublishName }}