parameters:
- name: artifactName
  default: app
- name: environment
  default: ""

steps:
- template: /tasks/artifacts/download_app.yml
  parameters: 
    artifactName: ${{ parameters.artifactName }}
    
- template: /tasks/docker/export_image_tags.yml
  parameters:
    namespace: $(GOV_APP_ACRONYM)
    appSystem: $(APP_SYSTEM)
    appName: $(APP_NAME)
    appVersion: $(APP_VERSION)
    environment: ${{ parameters.environment }}

- template: /tasks/docker/build_publish_image.yml
  parameters:
    appName: $(APP_NAME)
    dockerImageName: $(DOCKER_IMAGE_NAME)
    dockerImageTag: $(DOCKER_IMAGE_TAG)
    appVersion: $(APP_VERSION)

- template: /tasks/git/tag.yml
  parameters:
    staticTagName: "$(DOCKER_IMAGE_TAG)"
    condition: ne(variables.BUMP_VERSION_ENABLED, true)

- template: /tasks/docker/export_metadata.yml

- template: /tasks/artifacts/publish_docker.yml