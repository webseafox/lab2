name: '$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none

parameters:
- name: deleteWorkFolder
  displayName: 'Limpar pasta _work?'
  type: boolean
  default: true
- name: execDockerPrune
  displayName: 'Executar Docker Prune?'
  type: boolean
  default: false
- name: agents
  displayName: 'Agentes'
  type: object
  default:
  - pool: DevOpsPrivateAgents
    agents:
    - BRTAZLTB0009CO.azagent.dvps.001
    - BRTAZLTB0009CO.azagent.dvps.002
    - BRTAZLTB0009CO.azagent.dvps.003
    - BRTAZLTB0009CO.azagent.dvps.004
    - BRTAZLTB0009CO.azagent.dvps.005

stages:
- ${{ each agentPool in parameters.agents }}:
  - stage: ${{ agentPool.pool }}
    displayName: 'Pool: ${{ agentPool.pool }}'
    dependsOn: []
    jobs:
    - ${{ each agentName in agentPool.agents }}:
      - job: ${{ replace(agentName, '.', '_') }}
        displayName: 'Agent: ${{ agentName }}'
        pool:
          name: ${{ agentPool.pool }}
          demands:
          - Agent.Name -equals ${{ agentName }}
        steps:
        - checkout: none
        - script: |
            echo "##[debug] AGENT_NAME...............: ${AGENT_NAME}"
            echo "##[debug] AGENT_WORKFOLDER.........: ${AGENT_WORKFOLDER}"
            echo "##[group] show disc size"
            df -h
            echo "##[endgroup]"
            echo "##[group] show folder size"
            du -h -d 1
            echo "##[endgroup]"
          workingDirectory: '$(Agent.WorkFolder)'
          displayName: 'Show disc size'
        - task: Bash@3
          displayName: 'Execute Docker Prune'
          enabled: ${{ parameters.execDockerPrune }}
          inputs:
            targetType: 'inline'
            script: 'docker system prune -a --volumes -f'
        - task: DeleteFiles@1
          displayName: 'Delete files $(Agent.WorkFolder)'
          enabled: ${{ parameters.deleteWorkFolder }}
          inputs:
            SourceFolder: '$(Agent.WorkFolder)'
            Contents: |
              **/*