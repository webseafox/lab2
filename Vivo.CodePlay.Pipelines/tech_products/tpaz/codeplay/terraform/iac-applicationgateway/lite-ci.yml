              inlineScript: |
                set -euo pipefail
    
                SIGLA="${{parameters.sigla}}"
                ENVIRONMENT="${{parameters.environment}}"
                KEY_VAULT_NAME="kv-appgw-stfe-br-01-${ENVIRONMENT}"
                CERT_NAME="cert-${SIGLA}-astfe-${ENVIRONMENT}"
    
                echo "Deleting certificate ${CERT_NAME} from ${KEY_VAULT_NAME}..."
    
                # Delete certificate
                az keyvault certificate delete \
                  --vault-name "${KEY_VAULT_NAME}" \
                  --name "${CERT_NAME}"

                echo "Waiting for certificate to enter deleted state..."
                
                # Espera até aparecer no soft-delete
                for i in {1..12}; do
                  if az keyvault certificate show-deleted \
                    --vault-name "${KEY_VAULT_NAME}" \
                    --name "${CERT_NAME}" >/dev/null 2>&1; then
                    echo "Certificate is now in deleted state."
                    break
                  fi
                
                  echo "Still deleting... attempt $i"
                  sleep 5
                done
                
                echo "Purging certificate..."
                  
    
                # Purge deleted certificate (optional)
                az keyvault certificate purge \
                  --vault-name "${KEY_VAULT_NAME}" \
                  --name "${CERT_NAME}"
    
                echo "Certificate deleted and purged successfully."
