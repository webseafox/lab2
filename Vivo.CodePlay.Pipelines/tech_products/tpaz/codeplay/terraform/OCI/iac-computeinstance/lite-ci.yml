      inputs:
        script: |
          echo "##[debug] GIT_ASKPASS........: ${GIT_ASKPASS}"
          echo "exec echo \"$GIT_PASS\"" >> "${GIT_ASKPASS}"
          chmod 777 "${GIT_ASKPASS}"
          echo "##vso[task.setvariable variable=GIT_ASKPASS]$GIT_ASKPASS"
        workingDirectory: $(Agent.TempDirectory)
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform INIT - azurerm'
      inputs:
        backendServiceArm: SharedResources
        backendAzureRmResourceGroupName: rg-devops-sharedservices
        backendAzureRmStorageAccountName: sttfstatedevopsshared
        backendAzureRmContainerName: oci-terraform-state-${{parameters.environment}}
        backendAzureRmKey: $(System.TeamProject)/$(Build.Repository.Name)/terraform.tfstate
        workingDirectory: $(Build.SourcesDirectory)
      env:
        TF_LOG: ERROR
    - task: TerraformTaskV4@4
      displayName: 'Terraform VALIDATE'
      inputs:
        provider: 'oci'
        environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
        command: validate
        commandOptions: ''
        workingDirectory: $(Build.SourcesDirectory)
    - task: TerraformTaskV4@4
      displayName: 'Terraform PLAN - DESTROY'
      inputs:
        provider: 'oci'
        command: plan
        commandOptions: --out=tfplan.out -var-file=$(tfvarsLocation) -destroy
        environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
        environmentServiceNameAzureRM: mi-terraform-${{parameters.environment}}
        workingDirectory: $(Build.SourcesDirectory)
      env:
        AZDO_ORG_SERVICE_URL: https://dev.azure.com/telefonica-vivo-brasil
        PHPIPAM_APP_ID: platformcode
        PHPIPAM_ENDPOINT_ADDR: http://10.240.42.97:8000/api
        PHPIPAM_PASSWORD: $(PHPIPAM-PASSWORD)
        PHPIPAM_USER_NAME: platformcode
        TF_VAR_NEXUS_USERNAME: $(NEXUS-DEPS-USR)
        TF_VAR_NEXUS_PASSWORD: $(NEXUS-DEPS-PSW)
        TF_VAR_runtime_tags: '{"trilha":"${{parameters.environment}}","repositorio":"$(Build.Repository.Uri)"}'
        ASDF_HELM_VERSION: 3.11.0
        OCI_CONFIG_DIR: $(Build.SourcesDirectory)/$(Build.BuildId)/.oci
        OCI_CONFIG_FILE: $(Build.SourcesDirectory)/$(Build.BuildId)/.oci/config
    - task: CmdLine@2
      displayName: 'Terraform SHOW - Export to .json'
      inputs:
        script: |
          terraform --version -json
          echo "##[command] terraform show -json tfplan.out | jq '.' > tfplan.json"
          terraform show -json tfplan.out | jq '.' > tfplan.json
        workingDirectory: $(Build.SourcesDirectory)
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials for Infracost'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'INFRACOST-API-KEY'
    - task: CmdLine@2
      name: step_infracost_breakdown
      displayName: Infracost breakdown
      env:
        INFRACOST_API_KEY: $(INFRACOST-API-KEY)
      inputs:
        script: |
          infracost configure set currency BRL
          infracost breakdown --show-skipped --project-name $BUILD_REPOSITORY_NAME --path tfplan.json
        workingDirectory: $(Build.SourcesDirectory)
    - task: CmdLine@2
      name: step_checkov
      displayName: Run Checkov
      env:
        DIRECTORY: $(Build.SourcesDirectory)
        BASELINE: $(Build.SourcesDirectory)/.checkov.baseline
        VAR_FILE: $(tfvarsLocation)
        DOWNLOAD_EXTERNAL_MODULES: "true"
        OUTPUT_FILE_PATH: "console,$(System.DefaultWorkingDirectory)/TEST-Checkov.xml"
      inputs:
        script: |
          echo "##[debug] DIRECTORY....................: ${DIRECTORY}"
          echo "##[debug] BASELINE.....................: ${BASELINE}"
          echo "##[debug] VAR_FILE.....................: ${VAR_FILE}"
          echo "##[debug] DOWNLOAD_EXTERNAL_MODULES....: ${DOWNLOAD_EXTERNAL_MODULES}"
          echo "##[debug] OUTPUT_FILE_PATH.............: ${OUTPUT_FILE_PATH}"

          if [ ! -f "${BASELINE}" ]; then
          BASELINE="${AGENT_TEMPDIRECTORY}/.checkov.baseline"
          echo "##[debug] Arquivo .checkov.baseline não encontrado. Criando baseline padrão."
            cat <<EOF > "${BASELINE?}"
          {
            "failed_checks": []
          }
          EOF
          fi

          echo "##[command] checkov"
          checkov --directory ${DIRECTORY} \
            --baseline ${BASELINE} \
            --var-file ${VAR_FILE} \
            --download-external-modules ${DOWNLOAD_EXTERNAL_MODULES} \
            --skip-path tfplan.json \
            --skip-path examples \
            --output cli \
            --output junitxml \
            --output-baseline-as-skipped \
            --soft-fail \
            --output-file-path ${OUTPUT_FILE_PATH}
        workingDirectory: $(Build.SourcesDirectory)
    - task: CmdLine@2
      name: step_tfsec
      displayName: Run tfsec
      env:
        TFVARS_LOCATION: $(tfvarsLocation)
      inputs:
        script: |
          echo "##[command] tfsec --var-file ${TFVARS_LOCATION} --exclude-path examples --exclude-downloaded-modules --format junit --soft-fail --verbose --out ${SYSTEM_DEFAULTWORKINGDIRECTORY}/TEST-tfsec.xml"
          tfsec \
            --var-file ${TFVARS_LOCATION} \
            --exclude-path examples \
            --exclude-downloaded-modules \
            --format junit \
            --soft-fail \
            --verbose \
            --out ${SYSTEM_DEFAULTWORKINGDIRECTORY}/TEST-tfsec.xml
        workingDirectory: $(Build.SourcesDirectory)
    - task: PublishTestResults@2
      name: t_publish_test_result
      displayName: Publish Test Results
      inputs:
        mergeTestResults: false
        searchFolder: $(System.DefaultWorkingDirectory)
        testResultsFiles: '**/TEST-*.xml'
        testResultsFormat: JUnit
        testRunTitle: Test Results
        failTaskOnFailedTests: true
        publishRunAttachments: true
      continueOnError: true
      condition: succeeded()

    - task: Bash@3
      displayName: 'Limpar diretório do build com credenciais OCI'
      condition: always()
      inputs:
        targetType: inline
        script: |
          echo "🧹 Removendo diretório .oci para segurança"
          rm -rf $(Build.SourcesDirectory)/$(Build.BuildId)
          echo "✅ Diretório $(Build.BuildId)/.oci removido com sucesso"

