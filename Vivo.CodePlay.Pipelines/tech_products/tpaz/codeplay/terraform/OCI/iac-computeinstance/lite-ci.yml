              OCI_CONFIG_FILE: $(Build.SourcesDirectory)/$(Build.BuildId)/.oci/config
          
          - task: Bash@3
            displayName: 'Limpar diretório do build com credenciais OCI'
            condition: always()
            inputs:
              targetType: inline
              script: |
                echo "🧹 Removendo diretório .oci para segurança"
                rm -rf $(Build.SourcesDirectory)/$(Build.BuildId)
                echo "✅ Diretório $(Build.BuildId)/.oci removido com sucesso"

          - task: CmdLine@2
            displayName: 'Terraform OUTPUT .json'
            env:
              OUTPUT_FILE: $(Build.ArtifactStagingDirectory)/outputs.json
            inputs:
              script: |
                terraform --version -json

                echo "##[command] terraform output -json > ${OUTPUT_FILE}"
                terraform output -json > ${OUTPUT_FILE}

                jq 'if . == {} then error("") else . end | {"outputs": "exported"}' ${OUTPUT_FILE}
                retVal=$?

                if [ $retVal -ne 0 ]; then
                  echo "##[debug] File '${OUTPUT_FILE}' is empty, removing it from artifact staging directory."
                  rm ${OUTPUT_FILE}
                fi
              workingDirectory: $(Build.SourcesDirectory)
          - task: PublishPipelineArtifact@1
            displayName: Publish Pipeline Artifact
            condition: ''
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifactName: terraform_apply
              publishLocation: pipeline

- stage: stage_plan_destroy
  pool:
    name: GeneralPurposeLinuxAgentsCD
  displayName: PLAN to DESTROY -> ${{parameters.environment}}
  dependsOn: []
  condition: and(succeeded(), or(eq('${{parameters.action}}','planDestroy'), eq('${{parameters.action}}','destroy')))
  jobs:
  - job: job_plan_destroy
    displayName: PLAN to DESTROY -> ${{parameters.environment}}
    steps:
    - checkout: self

    - task: AzureKeyVault@2
      displayName: 'Obter chave privada do Key Vault'
      inputs:
        azureSubscription: kv-dvps-brsouth-shared
        KeyVaultName: kv-dvps-brsouth-shared
        SecretsFilter: 'svc-ocidevops-plat-code-${{ parameters.environment }}-private'

    - task: Bash@3
      displayName: 'Configurar OCI CLI'
      env:
        OCI_USER_OCID: $(OCI_USER_OCID)
        OCI_FINGERPRINT: $(OCI_FINGERPRINT)
        OCI_TENANCY_OCID: $(OCI_TENANCY_OCID)
        OCI_REGION: $(OCI_REGION)
        OCI_PRIVATE_KEY: $(svc-ocidevops-plat-code-${{ parameters.environment }}-private)
