- stage: stage_ansible
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: Ansible
  dependsOn:
  - stage_apply
  jobs:
  - job: job_ansible
    displayName: Ansible
    steps:

    - task: AzureKeyVault@2
      displayName: 'Get Zabbix and Prisma Secrets'
      inputs:
        azureSubscription: kv-dvps-brsouth-shared
        KeyVaultName: kv-dvps-brsouth-shared
        SecretsFilter: >-
          ZABBIX-PASSWORD,
          ZABBIX-USER,
          PRISMA-AGENT-USER-PASS,
          svc-ldvh,
          svc-sscs-oci,
          root-oci,
          capacity,
          supunix,
          topology,
          svcsnsounix,
          monitoracao,
          supbkp,
          registra-maquina-redhat-8-campinas-bearer,
          registra-maquina-redhat-7-campinas-bearer,
          registra-maquina-redhat-8-ndc-q1-bearer,
          registra-maquina-redhat-7-ndc-q1-bearer,
          registra-maquina-redhat-8-ndc-q2-bearer,
          registra-maquina-redhat-7-ndc-q2-bearer,
          registra-maquina-redhat-8-berrini-bearer,
          registra-maquina-redhat-7-berrini-bearer,
          registra-maquina-redhat-8-curitiba-bearer,
          registra-maquina-redhat-7-curitiba-bearer,
          registra-maquina-oracle-linux-8-bearer,
          connection-with-satellite-bearer,
          ui-um-password-ansible,
          wazuh-registration-password

    - task: AzureKeyVault@2
      displayName: 'Get SVC-OCID Secret'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'SENHA-SEGURA-OCI-CALISTO-SVC-OCID'

    - checkout: self
    - template: /tech_products/tpaz/tasks/bash/welcome.yml
    - template: /tech_products/tpaz/tasks/artifacts/download_pipeline.yml
      parameters:
        artifactName: terraform_apply
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.private_ip'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.admin_username'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.admin_password'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.hostname'
    - template: /tech_products/tpaz/tasks/senha_segura/oauth2_token.yml
      parameters:
        module: PAM
        resourceType: ${{ parameters.resourceType }}
    - template: /tech_products/tpaz/tasks/senha_segura/get_coe_senha.yml
      parameters:
        senhaId: $(SENHA_SEGURA_DOMAIN_SENHA_ID)
        usernameVariable: SENHA_SEGURA_DOMAIN_USERNAME
        passwordVariable: SENHA_SEGURA_DOMAIN_PASSWORD
    - template: /tech_products/tpaz/tasks/senha_segura/decrypt_senha.yml
      parameters:
        passwordVariable: SENHA_SEGURA_DOMAIN_PASSWORD
        privateKeyContentVariable: SENHA-SEGURA-OCI-CALISTO-SVC-OCID
    - template: /tech_products/tpaz/tasks/ansible/run_playbook_computeinstance.yml
      parameters:
        vmIp: $(.private_ip)
        vmHostname: $(.hostname)
        vmAdminUsername: $(.admin_username)
        vmAdminPassword: $(.admin_password)
        svc_sscs_password: $(VM-SVC-SSCS-DEFAULT-PASSWORD)
        domainUsername: $(SENHA_SEGURA_DOMAIN_USERNAME)
        domainPassword: $(SENHA_SEGURA_DOMAIN_PASSWORD)
        windows_spt8486f_password: $(VM-WINDOWS-SPT8486F-DEFAULT-PASSWORD)

- stage: stage_senha_segura
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: Senha Segura
  dependsOn:
  - stage_ansible
  jobs:
  - job: job_senha_segura
    displayName: Senha Segura
    steps:
    - template: /tech_products/tpaz/tasks/bash/welcome.yml
    - template: /tech_products/tpaz/tasks/artifacts/download_pipeline.yml
      parameters:
        artifactName: terraform_apply
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.hostname'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.private_ip'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.admin_username'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.admin_password'
    - template: /tech_products/tpaz/tasks/senha_segura/oauth2_token.yml
      parameters:
        module: PAM
        resourceType: ${{ parameters.resourceType }}
    - ${{ if eq(parameters.resourceType, 'vm-oci-windows') }}:
      - template: /tech_products/tpaz/tasks/azure_key_vault/get_akv_credentials.yml
        parameters:
          secretsFilter: 'IAC-VM-WINDOWS-SVC-SSCS-DEFAULT-PASSWORD, IAC-VM-WINDOWS-SPT8486F-DEFAULT-PASSWORD'
      - template: /tech_products/tpaz/tasks/senha_segura/create_device.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          deviceSite: 'OCI'
          deviceModel: 'Insert OCI Windows'
          deviceVendor: 'Oracle'
          deviceType: 'Servidor Windows'
          deviceDomain: 'redecorp.br'
          deviceConnectivities: 'Windows RM:5985,Windows RM:5986,RDP:3389'
          tags: 'OCI'
      - template: /tech_products/tpaz/tasks/senha_segura/create_credential.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          credentialUsername: svc_sscs
          credentialPassword: $(IAC-VM-WINDOWS-SVC-SSCS-DEFAULT-PASSWORD)
          credentialType: 'Usuário Local Privilegiado'
          credentialAutomaticChange: true
          credentialChangePlugin: 'Windows RM'
          credentialChangeTemplate: 'RM - Change Password over HTTP'
          credentialUseOwnCredentialToConnect: true
          credentialRDP: true
          tags: 'OCI'
      - template: /tech_products/tpaz/tasks/senha_segura/create_credential.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          credentialUsername: spt8486f
          credentialPassword: $(IAC-VM-WINDOWS-SPT8486F-DEFAULT-PASSWORD)
          credentialType: 'Usuário Local Privilegiado'
          credentialAutomaticChange: true
          credentialChangePlugin: 'Windows RM'
          credentialChangeTemplate: 'RM - Change Password over HTTP'
          credentialUseOwnCredentialToConnect: true
          credentialRDP: true
          tags: 'OCI'
    - ${{ elseif eq(parameters.resourceType, 'vm-oci-linux') }}:
      - template: /tech_products/tpaz/tasks/azure_key_vault/get_akv_credentials.yml
        parameters:
          secretsFilter: 'IAC-VM-LINUX-SVC-SSCS-DEFAULT-PASSWORD, IAC-VM-LINUX-ROOT-DEFAULT-PASSWORD'
      - template: /tech_products/tpaz/tasks/senha_segura/create_device.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          deviceSite: 'OCI'
          deviceModel: 'Insert OCI Linux'
          deviceVendor: 'Oracle'
          deviceType: 'Servidor Unix'
          deviceDomain: 'redecorp.br'
          deviceConnectivities: 'SSH:22'
          tags: 'OCI'
      - template: /tech_products/tpaz/tasks/senha_segura/create_credential.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          credentialUsername: svc_sscs
          credentialPassword: $(IAC-VM-LINUX-SVC-SSCS-DEFAULT-PASSWORD)
          credentialType: 'Usuário Local Privilegiado'
          credentialAutomaticChange: true
          credentialChangePlugin: 'SSH'
          credentialChangeTemplate: 'Linux - Troca scan - Vivo'
          credentialUseOwnCredentialToConnect: true
          credentialSSH: true
          tags: 'OCI'
      - template: /tech_products/tpaz/tasks/senha_segura/create_credential.yml
        parameters:
          deviceHostname: $(.hostname)
          deviceIp: $(.private_ip)
          credentialUsername: root
          credentialPassword: $(IAC-VM-LINUX-ROOT-DEFAULT-PASSWORD)
          credentialType: 'Usuário Local Privilegiado'
          credentialAutomaticChange: true
          credentialChangePlugin: 'SSH'
          credentialChangeTemplate: 'Linux - Troca scan - Vivo'
          credentialUseOwnCredentialToConnect: true
          credentialSSH: true
          tags: 'OCI'

- stage: stage_senha_segura_destroy
  pool: $(PRIVATE_AGENT_SHARED)
  displayName: Deactivate Senha Segura
  dependsOn:
  - stage_destroy
  jobs:
  - job: job_senha_segura_destroy
    displayName: Deactivate Senha Segura
    steps:
    - template: /tech_products/tpaz/tasks/bash/welcome.yml
    - template: /tech_products/tpaz/tasks/artifacts/download_pipeline.yml
      parameters:
        artifactName: terraform_destroy
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.hostname'
    - template: /tech_products/tpaz/tasks/bash/set_terraform_output_variable.yml
      parameters:
        jsonPath: '.private_ip'
    - template: /tech_products/tpaz/tasks/senha_segura/oauth2_token.yml
      parameters:
        resourceType: ${{ parameters.resourceType }}
    - template: /tech_products/tpaz/tasks/senha_segura/delete_device.yml
      parameters:
        deviceIp: $(.private_ip)
        deviceHostname: $(.hostname)
