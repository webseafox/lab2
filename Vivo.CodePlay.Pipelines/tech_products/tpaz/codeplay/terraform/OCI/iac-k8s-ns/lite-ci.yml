    name: GeneralPurposeLinuxAgentsCD
  displayName: PLAN to DESTROY -> ${{parameters.environment}}
  dependsOn: []
  condition: and(succeeded(), or(eq('${{parameters.action}}','planDestroy'), eq('${{parameters.action}}','destroy')))
  jobs:
  - job: job_plan_destroy
    displayName: PLAN to DESTROY -> ${{parameters.environment}}
    steps:
    - checkout: self

    - task: AzureKeyVault@2
      displayName: 'Obter chave privada do Key Vault'
      inputs:
        azureSubscription: kv-dvps-brsouth-shared
        KeyVaultName: kv-dvps-brsouth-shared
        SecretsFilter: 'svc-ocidevops-plat-code-${{ parameters.environment }}-private,DEVOPS-ACR-PASSWORD,DEVOPS-ACR-USERNAME'


    - task: Bash@3
      displayName: About Stage
      inputs:
        targetType: inline
        script: |
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            BLUE='\033[0;34m'
            YELLOW='\033[1;33m'
            BG_GREEN='\033[42;1;37m'

            echo ' ================================================================================================================================'
            echo '|                       __   __  _                  ___            _         ___   _                                             |'
            echo '|                       \ \ / / (_) __ __  ___     / __|  ___   __| |  ___  | _ \ | |  __ _   _  _                               |'
            echo '|                        \ V /  | | \ V / / _ \   | (__  / _ \ / _` | / -_) |  _/ | | / _` | | || |                              |'                 
            echo '|                         \_/   |_|  \_/  \___/    \___| \___/ \__,_| \___| |_|   |_| \__,_|  \_, |                              |'               
            echo '|                                                                                             |__/                               |'
            echo ' ================================================================================================================================'
            echo "                                                                                                      powered by Vivo DevOps Team"
            echo ""

            printf "
            =================================================================================================================================
            ${GREEN}                                                 ${SYSTEM_STAGEDISPLAYNAME} 
            =================================================================================================================================

              Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.

            ${YELLOW} Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}https://wikicorp.telefonica.com.br/display/AC/Terraform+-+Azure

            =================================================================================================================================
            "
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: 'Install Terraform 1.4.5'
      inputs:
        terraformVersion: 1.4.5
