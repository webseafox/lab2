parameters:
- name: okeServiceConnectionPrefix
  type: string
- name: environment
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - test
  - prod
- name: action
  displayName: Action
  type: string
  default: plan
  values:
  - plan
  - apply
  - destroy
  - planDestroy

- name: requiresManualApproval
  type: boolean
  default: 'false'

- name: isDestroy
  type: boolean
  default: 'false'

- name: productName
  displayName: Product Name (for certificate)
  type: string
  default: ''

- name: forceRenewal
  displayName: Force Certificate Renewal
  type: boolean 
  default: false

stages:
- stage: security_scan
  pool: GeneralPurposeLinuxAgentsCI
  displayName: Security Scan
  jobs:
  - job: AppSecConfigKeys
    displayName: 'Get AppSec Config Keys'
    steps:
    - template: /security/get_appconfig_keys_framework.yml
      parameters:
        azureSubscription: DevOpsSharedResources
        appConfigurationEndpoint: https://appcs-azdevops-shared.azconfig.io

  - job: run_fortify
    displayName: Run Fortify
    dependsOn: AppSecConfigKeys
    variables:
      USE_FORTIFY: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_FORTIFY'] ]
      USE_CONVISO: $[ dependencies.AppSecConfigKeys.outputs['evaluate_flags.USE_CONVISO'] ]
      SKIP_SECURITY_GATE: True
      FORTIFY_APP_VERSION: $[ dependencies.AppSecConfigKeys.outputs['scan_version_name.FORTIFY_APP_VERSION'] ]
    condition: and(succeeded(), eq(variables.USE_FORTIFY, 'true'))
    steps:
    - template: /security/define_appsec_app_version.yml

    - template: /security/run_fortify_scan.yml
      parameters:
        fortifyExclusionRepository: 'FortifyExclusion'
        enableFortifyExclusions: false
        appLanguage: 'java'
        appVersion: "$(FORTIFY_APP_VERSION)" # OBS: A variável FORTIFY_APP_VERSION é definida no template /security/define_appsec_app_version.yml
        convisoCompany: 1345
- stage: stage_plan
  pool:
    name: GeneralPurposeLinuxAgentsCD
  displayName: PLAN -> ${{parameters.environment}}
  dependsOn: 
  - security_scan
  condition: and(succeeded(), or(eq('${{parameters.action}}','plan'), eq('${{parameters.action}}','apply')))
  jobs:
  - job: job_plan
    displayName: PLAN -> ${{parameters.environment}}
    steps:
    - checkout: self

    - task: AzureKeyVault@2
      displayName: 'Obter chave privada do Key Vault'
      inputs:
        azureSubscription: kv-dvps-brsouth-shared
        KeyVaultName: kv-dvps-brsouth-shared
        SecretsFilter: 'svc-ocidevops-plat-code-${{ parameters.environment }}-private,DEVOPS-ACR-PASSWORD,DEVOPS-ACR-USERNAME'

    - task: Kubernetes@1
      displayName: "Login OKE (${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }})"
      inputs:
        kubernetesServiceEndpoint: ${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }}
        command: login
        outputFormat: none

    - task: Bash@3
      displayName: About Stage
      inputs:
        targetType: inline
        script: |
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            BLUE='\033[0;34m'
            YELLOW='\033[1;33m'
            BG_GREEN='\033[42;1;37m'

            echo ' ================================================================================================================================'
            echo '|                       __   __  _                  ___            _         ___   _                                             |'
            echo '|                       \ \ / / (_) __ __  ___     / __|  ___   __| |  ___  | _ \ | |  __ _   _  _                               |'
            echo '|                        \ V /  | | \ V / / _ \   | (__  / _ \ / _` | / -_) |  _/ | | / _` | | || |                              |'                 
            echo '|                         \_/   |_|  \_/  \___/    \___| \___/ \__,_| \___| |_|   |_| \__,_|  \_, |                              |'               
            echo '|                                                                                             |__/                               |'
            echo ' ================================================================================================================================'
            echo "                                                                                                      powered by Vivo DevOps Team"
            echo ""

            printf "
            =================================================================================================================================
            ${GREEN}                                                 ${SYSTEM_STAGEDISPLAYNAME} 
            =================================================================================================================================

              Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.

            ${YELLOW} Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}https://wikicorp.telefonica.com.br/display/AC/Terraform+-+Azure

            =================================================================================================================================
            "
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: 'Install Terraform 1.4.5'
      inputs:
        terraformVersion: 1.4.5
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, AZ-DEVOPS-PAT-TOKEN, PHPIPAM-PASSWORD'

    - task: CmdLine@2
      displayName: 'Setup git config https'
      env:
        GIT_PASS: $(AZ-DEVOPS-PAT-TOKEN)
        GIT_ASKPASS: "$(Agent.TempDirectory)/git_env_password.sh"
      inputs:
        script: |
          echo "##[debug] GIT_ASKPASS........: ${GIT_ASKPASS}"
          echo "exec echo \"$GIT_PASS\"" >> "${GIT_ASKPASS}"
          chmod 777 "${GIT_ASKPASS}"
          echo "##vso[task.setvariable variable=GIT_ASKPASS]$GIT_ASKPASS"
        workingDirectory: $(Agent.TempDirectory)
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform INIT - OCI'
      inputs:
        backendServiceArm: SharedResources
        backendAzureRmResourceGroupName: rg-devops-sharedservices
        backendAzureRmStorageAccountName: sttfstatedevopsshared
        backendAzureRmContainerName: oci-terraform-state-${{parameters.environment}}
        backendAzureRmKey: $(System.TeamProject)/$(Build.Repository.Name)/terraform.tfstate
        workingDirectory: $(Build.SourcesDirectory)
      env:
        TF_LOG: ERROR

    - task: TerraformTaskV4@4
      displayName: 'Terraform VALIDATE'
      inputs:
        provider: 'oci'
        environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
        command: validate
        commandOptions: ''
        workingDirectory: $(Build.SourcesDirectory)
    - task: TerraformTaskV4@4
      displayName: 'Terraform PLAN'
      inputs:
        provider: 'oci'
        command: plan
        commandOptions: --out=tfplan.out -var-file=environments/${{ parameters.environment }}/terraform.tfvars.json
        environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
        environmentServiceNameAzureRM: mi-terraform-${{parameters.environment}}
        workingDirectory: $(Build.SourcesDirectory)
      env:
        AZDO_ORG_SERVICE_URL: https://dev.azure.com/telefonica-vivo-brasil
        KUBECONFIG: $(KUBECONFIG)
        TF_VAR_kubeconfig_path: $(KUBECONFIG)
        PHPIPAM_APP_ID: platformcode
        PHPIPAM_ENDPOINT_ADDR: http://10.240.42.97:8000/api
        PHPIPAM_PASSWORD: $(PHPIPAM-PASSWORD)
        PHPIPAM_USER_NAME: platformcode
        TF_VAR_NEXUS_USERNAME: $(NEXUS-DEPS-USR)
        TF_VAR_NEXUS_PASSWORD: $(NEXUS-DEPS-PSW)
        TF_VAR_runtime_tags: '{"trilha":"${{parameters.environment}}","repositorio":"$(Build.Repository.Uri)"}'
        TF_VAR_azuredevops_org_url: https://dev.azure.com/telefonica-vivo-brasil
        TF_VAR_azuredevops_pat_token: $(System.AccessToken)
        ASDF_HELM_VERSION: 3.11.0
    - task: CmdLine@2
      displayName: 'Terraform SHOW - Export to .json'
      inputs:
        script: |
          terraform --version -json
          echo "##[command] terraform show -json tfplan.out | jq '.' > tfplan.json"
          terraform show -json tfplan.out | jq '.' > tfplan.json
        workingDirectory: $(Build.SourcesDirectory)
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'INFRACOST-API-KEY'
    - task: CmdLine@2
      name: step_infracost_breakdown
      displayName: Infracost breakdown
      env:
        INFRACOST_API_KEY: $(INFRACOST-API-KEY)
      inputs:
        script: |
          infracost configure set currency BRL
          infracost breakdown --show-skipped --project-name $BUILD_REPOSITORY_NAME --path tfplan.json
        workingDirectory: $(Build.SourcesDirectory)
    - task: CmdLine@2
      name: step_checkov
      displayName: Run Checkov
      env:
        DIRECTORY: $(Build.SourcesDirectory)
        BASELINE: $(Build.SourcesDirectory)/.checkov.baseline
        VAR_FILE: environments/${{ parameters.environment }}/terraform.tfvars.json
        DOWNLOAD_EXTERNAL_MODULES: "true"
        OUTPUT_FILE_PATH: "console,$(System.DefaultWorkingDirectory)/TEST-Checkov.xml"
      inputs:
        script: |
          echo "##[debug] DIRECTORY....................: ${DIRECTORY}"
          echo "##[debug] BASELINE.....................: ${BASELINE}"
          echo "##[debug] VAR_FILE.....................: ${VAR_FILE}"
          echo "##[debug] DOWNLOAD_EXTERNAL_MODULES....: ${DOWNLOAD_EXTERNAL_MODULES}"
          echo "##[debug] OUTPUT_FILE_PATH.............: ${OUTPUT_FILE_PATH}"

          if [ ! -f "${BASELINE}" ]; then
          BASELINE="${AGENT_TEMPDIRECTORY}/.checkov.baseline"
          echo "##[debug] Arquivo .checkov.baseline não encontrado. Criando baseline padrão."
            cat <<EOF > "${BASELINE?}"
          {
            "failed_checks": []
          }
          EOF
          fi

          echo "##[command] checkov"
          checkov --directory ${DIRECTORY} \
            --baseline ${BASELINE} \
            --var-file ${VAR_FILE} \
            --download-external-modules ${DOWNLOAD_EXTERNAL_MODULES} \
            --skip-path tfplan.json \
            --skip-path examples \
            --output cli \
            --output junitxml \
            --output-baseline-as-skipped \
            --soft-fail \
            --output-file-path ${OUTPUT_FILE_PATH}
        workingDirectory: $(Build.SourcesDirectory)
    - task: CmdLine@2
      name: step_tfsec
      displayName: Run tfsec
      env:
        TFVARS_LOCATION: environments/${{ parameters.environment }}/terraform.tfvars.json
      inputs:
        script: |
          echo "##[command] tfsec --var-file ${TFVARS_LOCATION} --exclude-path examples --exclude-downloaded-modules --format junit --soft-fail --verbose --out ${SYSTEM_DEFAULTWORKINGDIRECTORY}/TEST-tfsec.xml"
          tfsec \
            --var-file ${TFVARS_LOCATION} \
            --exclude-path examples \
            --exclude-downloaded-modules \
            --format junit \
            --soft-fail \
            --verbose \
            --out ${SYSTEM_DEFAULTWORKINGDIRECTORY}/TEST-tfsec.xml
        workingDirectory: $(Build.SourcesDirectory)
    - task: PublishTestResults@2
      name: t_publish_test_result
      displayName: Publish Test Results
      inputs:
        mergeTestResults: false
        searchFolder: $(System.DefaultWorkingDirectory)
        testResultsFiles: '**/TEST-*.xml'
        testResultsFormat: JUnit
        testRunTitle: Test Results
        failTaskOnFailedTests: true
        publishRunAttachments: true
      continueOnError: true
      condition: succeeded()

    - script: |
        set -e
        echo "Verificando se há recursos para destroy"

        # Extrai os tipos de ações do plano Terraform
        CREATE_COUNT=$(jq '[.resource_changes[] | select(.change.actions[] == "create")] | length' tfplan.json)
        DESTROY_COUNT=$(jq '[.resource_changes[] | select(.change.actions[] == "delete")] | length' tfplan.json)

        echo "Recursos a adicionar: $CREATE_COUNT"
        echo "Recursos a destruir: $DESTROY_COUNT"

        # Se houver pelo menos um add e um destroy ao mesmo tempo, barramos a execução
        if [ "$CREATE_COUNT" -gt 0 ] && [ "$DESTROY_COUNT" -gt 0 ]; then
          echo "Aviso: O plano detectou que há recursos sendo destruídos e recriados ao mesmo tempo."
          echo "Definindo variável de controle para aprovação manual..."
          echo "##vso[task.setvariable variable=requiresManualApproval;isOutput=true]true"  # Define a variável de controle
        else
          echo "##vso[task.setvariable variable=requiresManualApproval;isOutput=true]false"
          echo "Não há conflitos de ADD e DESTROY."
        fi
      displayName: 'Verificando se há recursos para destroy'
      name: setRequiresApproval   
      workingDirectory: $(Build.SourcesDirectory)
      #condition: eq('${{ parameters.isDestroy }}', false)
      condition: and(eq('${{ parameters.isDestroy }}', false), eq('${{ parameters.action }}', 'apply'))

   # Aprovação manual somente se a variável requiresManualApproval for verdadeira
  - job: waitForValidation 
    displayName: Aprovação Manual para destroy
    pool: server
    timeoutInMinutes: 4320
    dependsOn: job_plan 
    #condition: and(succeeded(), eq('${{ parameters.isDestroy }}', false))
    condition: and(succeeded(), eq('${{ parameters.isDestroy }}', false), eq('${{ parameters.action }}', 'apply'))
    variables:
      requiresManualApproval: $[ dependencies.job_plan.outputs['setRequiresApproval.requiresManualApproval'] ]
    steps:
    - task: ManualValidation@1
      condition: eq(variables['requiresManualApproval'], 'true') 
      inputs:
        instructions: |
          O plano detectou recursos sendo destruídos e recriados ao mesmo tempo. 
          Por favor, aprove ou negue a execução dessa mudança.
          Caso não deseje permitir a destruição e recriação dos recursos, recuse a execução.
        onTimeout: 'reject'

- stage: stage_apply
  pool:
    name: GeneralPurposeLinuxAgentsCD
  displayName: APPLY -> ${{parameters.environment}}
  dependsOn:
  - stage_plan
  condition: and(succeeded(), eq('${{parameters.action}}','apply'))
  jobs:
  - deployment: job_apply
    displayName: APPLY -> ${{parameters.environment}}
    environment:
      name: terraform-approval-apply-${{parameters.environment}}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureKeyVault@2
            displayName: 'Obter chave privada do Key Vault'
            inputs:
              azureSubscription: kv-dvps-brsouth-shared
              KeyVaultName: kv-dvps-brsouth-shared
              SecretsFilter: 'svc-ocidevops-plat-code-${{ parameters.environment }}-private,DEVOPS-ACR-PASSWORD,DEVOPS-ACR-USERNAME'
      
          - task: Bash@3
            displayName: About Stage
            inputs:
              targetType: inline
              script: |
                RED='\033[0;31m'
                GREEN='\033[0;32m'
                BLUE='\033[0;34m'
                YELLOW='\033[1;33m'
                BG_GREEN='\033[42;1;37m'

                echo ' ================================================================================================================================'
                echo '|                       __   __  _                  ___            _         ___   _                                             |'
                echo '|                       \ \ / / (_) __ __  ___     / __|  ___   __| |  ___  | _ \ | |  __ _   _  _                               |'
                echo '|                        \ V /  | | \ V / / _ \   | (__  / _ \ / _` | / -_) |  _/ | | / _` | | || |                              |'                 
                echo '|                         \_/   |_|  \_/  \___/    \___| \___/ \__,_| \___| |_|   |_| \__,_|  \_, |                              |'               
                echo '|                                                                                             |__/                               |'
                echo ' ================================================================================================================================'
                echo "                                                                                                      powered by Vivo DevOps Team"
                echo ""

                printf "
                =================================================================================================================================
                ${GREEN}                                                 ${SYSTEM_STAGEDISPLAYNAME} 
                =================================================================================================================================

                  Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.

                ${YELLOW} Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}https://wikicorp.telefonica.com.br/display/AC/Terraform+-+Azure

                =================================================================================================================================
                "

          - task: Kubernetes@1
            displayName: "Login OKE (${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }})"
            inputs:
              kubernetesServiceEndpoint: ${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }}
              command: login
              outputFormat: none

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            displayName: 'Install Terraform 1.4.5'
            inputs:
              terraformVersion: 1.4.5 
          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, AZ-DEVOPS-PAT-TOKEN, PHPIPAM-PASSWORD, JENKINS-TOKEN, JENKINS-PASSWORD-IAC-DEVOPS'

          - task: CmdLine@2
            displayName: 'Setup git config https'
            env:
              GIT_PASS: $(AZ-DEVOPS-PAT-TOKEN)
              GIT_ASKPASS: "$(Agent.TempDirectory)/git_env_password.sh"
            inputs:
              script: |
                echo "##[debug] GIT_ASKPASS........: ${GIT_ASKPASS}"
                echo "exec echo \"$GIT_PASS\"" >> "${GIT_ASKPASS}"
                chmod 777 "${GIT_ASKPASS}"
                echo "##vso[task.setvariable variable=GIT_ASKPASS]$GIT_ASKPASS"
              workingDirectory: $(Agent.TempDirectory)  
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
            displayName: 'Terraform INIT - azurerm'
            inputs:
              backendServiceArm: SharedResources
              backendAzureRmResourceGroupName: rg-devops-sharedservices
              backendAzureRmStorageAccountName: sttfstatedevopsshared
              backendAzureRmContainerName: oci-terraform-state-${{parameters.environment}}
              backendAzureRmKey: $(System.TeamProject)/$(Build.Repository.Name)/terraform.tfstate
              workingDirectory: $(Build.SourcesDirectory)
            env:
              TF_LOG: ERROR

          # ==============================
          # SSL CERTIFICATE MANAGEMENT
          # ==============================
          - task: AzureCLI@2
            name: SSLCertificateGeneration
            displayName: 'Generate/Renew SSL Certificate'
            condition: eq('${{parameters.action}}', 'apply')
            inputs:
              azureSubscription: kv-dvps-brsouth-shared
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                
                # Extract product name
                if [ -z "${{parameters.productName}}" ]; then
                  if [ -f "environments/${{parameters.environment}}/K8sInitConfig/values.yaml" ]; then
                    PRODUCT_NAME=$(grep -A1 "k8sInitConfig:" environments/${{parameters.environment}}/K8sInitConfig/values.yaml | grep "productName:" | sed 's/.*productName: *"\([^"]*\)".*/\1/')
                  else
                    echo "##vso[task.logissue type=error]values.yaml not found and productName parameter is empty"
                    exit 1
                  fi
                else
                  PRODUCT_NAME="${{parameters.productName}}"
                fi
                
                # Set variables
                ENVIRONMENT="${{parameters.environment}}"
                KEY_VAULT_NAME="kv-dvps-k8s-certs-shared"
                CERT_NAME="oke-${PRODUCT_NAME}-${ENVIRONMENT}-tls-backend"
                DOMAIN="${PRODUCT_NAME}-${ENVIRONMENT}.redecorp.oci"
                CERT_SRV="https://brtlvbgs0492co.redecorp.br/certsrv"
                FORCE_RENEWAL="${{parameters.forceRenewal}}"
                
                echo "Product: ${PRODUCT_NAME}, Environment: ${ENVIRONMENT}"
                
                # Export variables for next tasks
                echo "##vso[task.setvariable variable=PRODUCT_NAME;isOutput=true]${PRODUCT_NAME}"
                echo "##vso[task.setvariable variable=CERT_NAME;isOutput=true]${CERT_NAME}"
                echo "##vso[task.setvariable variable=DOMAIN;isOutput=true]${DOMAIN}"
                
                # Check certificate existence (force latest version)
                CERT_EXISTS=$(az keyvault certificate show --vault-name "${KEY_VAULT_NAME}" --name "${CERT_NAME}" --query "id" -o tsv 2>/dev/null || echo "")
                
                # Determine if a new certificate is needed and whether the existing key should be reused
                NEEDS_NEW_CERT=false
                REUSE_EXISTING_KEY=false
                
                if [ "${FORCE_RENEWAL}" = "True" ]; then
                  echo "FORCE RENEWAL enabled"
                  NEEDS_NEW_CERT=true
                  if [ -n "$CERT_EXISTS" ]; then
                    REUSE_EXISTING_KEY=true
                    echo "Existing certificate found - will reuse private key (true renewal, not recreation)"
                  else
                    echo "No existing certificate found - generating new private key (first-time creation)"
                  fi
                elif [ -n "$CERT_EXISTS" ]; then
                  # Get LATEST VERSION of certificate (not default/old version)
                  LATEST_VERSION=$(az keyvault certificate list-versions --vault-name "${KEY_VAULT_NAME}" --name "${CERT_NAME}" --query "[0].version" -o tsv 2>/dev/null)
                  EXPIRY=$(az keyvault certificate show --vault-name "${KEY_VAULT_NAME}" --name "${CERT_NAME}" --version "${LATEST_VERSION}" --query "attributes.expires" -o tsv)
                  EXPIRY_EPOCH=$(date -d "${EXPIRY}" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${EXPIRY%+*}" +%s 2>/dev/null)
                  CURRENT_EPOCH=$(date +%s)
                  DAYS_UNTIL_EXPIRY=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
                  
                  echo "Certificate expires in ${DAYS_UNTIL_EXPIRY} days"
                  
                  if [ ${DAYS_UNTIL_EXPIRY} -gt 30 ]; then
                    echo "Certificate valid, reusing existing"
                    echo "##vso[task.setvariable variable=CERT_REUSED;isOutput=true]true"
                    echo "##vso[task.setvariable variable=CERT_GENERATED;isOutput=true]false"
                    exit 0
                  else
                    echo "Certificate expires soon, auto-renewing (reusing existing private key)"
                    NEEDS_NEW_CERT=true
                    REUSE_EXISTING_KEY=true
                  fi
                else
                  # Certificate does not exist yet - first-time creation
                  NEEDS_NEW_CERT=true
                fi
                
                # Clean up soft-deleted certificates
                CERT_DELETED=$(az keyvault certificate list-deleted --vault-name "${KEY_VAULT_NAME}" --query "[?name=='${CERT_NAME}'].name" -o tsv 2>/dev/null || echo "")
                if [ -n "$CERT_DELETED" ]; then
                  az keyvault certificate purge --vault-name "${KEY_VAULT_NAME}" --name "${CERT_NAME}" || true
                  sleep 5
                fi
                
                echo "Generating new certificate via CertSRV"
                
                # ------------------------------------------------------------------
                # Obtain the private key:
                #   - Renewal (REUSE_EXISTING_KEY=true): download the existing PFX
                #     from Key Vault and extract the private key → same key, new cert
                #   - First-time creation: generate a brand-new RSA key
                # ------------------------------------------------------------------
                if [ "${REUSE_EXISTING_KEY}" = "true" ]; then
                  echo "##[section]Downloading existing private key from Key Vault for renewal"
                  az keyvault secret download \
                    --vault-name "${KEY_VAULT_NAME}" \
                    --name "${CERT_NAME}" \
                    --file existing_certificate.pfx \
                    --encoding base64
                  
                  if [ ! -f existing_certificate.pfx ] || [ ! -s existing_certificate.pfx ]; then
                    echo "##vso[task.logissue type=error]Failed to download existing PFX from Key Vault for private key reuse"
                    exit 1
                  fi
                  
                  openssl pkcs12 -in existing_certificate.pfx -nocerts -out certificate_raw.key -nodes -passin pass: 2>/dev/null
                  sed -n '/-----BEGIN/,/-----END/p' certificate_raw.key > certificate.key
                  rm -f existing_certificate.pfx certificate_raw.key
                  
                  if ! openssl rsa -in certificate.key -check -noout &>/dev/null; then
                    echo "##vso[task.logissue type=error]Extracted private key is invalid - cannot proceed with renewal"
                    exit 1
                  fi
                  echo "Existing private key recovered successfully - proceeding with true renewal"
                else
                  echo "##[section]Generating new RSA private key (first-time creation)"
                  openssl genrsa -out certificate.key 2048
                fi
                
                # Deriva os hosts reais do ingress.hosts (values.yaml) para o SAN; fallback para o dominio legado
                VALUES_FILE="environments/${ENVIRONMENT}/K8sInitConfig/values.yaml"
                SAN_HOSTS=""
                if [ -f "${VALUES_FILE}" ]; then
                  SAN_HOSTS=$(awk '
                    /^[[:space:]]*hosts:[[:space:]]*$/ { inhosts=1; next }
                    inhosts==1 {
                      if ($0 ~ /^[[:space:]]*-[[:space:]]*[^[:space:]#]/) {
                        line=$0
                        sub(/^[[:space:]]*-[[:space:]]*/, "", line)
                        gsub(/[[:space:]]+$/, "", line)
                        print line
                      } else if ($0 ~ /^[[:space:]]*[^[:space:]#-]/) {
                        inhosts=0
                      }
                    }
                  ' "${VALUES_FILE}" | tr '\n' ',' | sed 's/,$//')
                fi

                # CN por ambiente (${DOMAIN}); SAN apenas com os hosts reais das esteiras.
                SAN_ENTRIES=""
                if [ -n "${SAN_HOSTS}" ]; then
                  IFS=',' read -ra _SAN_ARR <<< "${SAN_HOSTS}" || true
                  for h in "${_SAN_ARR[@]}"; do
                    # ignora entradas invalidas (placeholder nao expandido, vazio, com espaco)
                    case "$h" in
                      *'{'*|*'}'*|*' '*|'') continue ;;
                    esac
                    if [ -z "${SAN_ENTRIES}" ]; then
                      SAN_ENTRIES="DNS:${h}"
                    else
                      SAN_ENTRIES="${SAN_ENTRIES},DNS:${h}"
                    fi
                  done
                fi

                # Fallback legado: sem hosts validos no ingress, usa o dominio do ambiente no SAN.
                if [ -z "${SAN_ENTRIES}" ]; then
                  SAN_ENTRIES="DNS:${DOMAIN}"
                fi

                # Generate new CSR using the private key (existing for renewal, new for first creation)
                echo "Generating CSR. CN=${DOMAIN} SAN=${SAN_ENTRIES}"
                openssl req -new -key certificate.key -out certificate.csr \
                  -subj "/CN=${DOMAIN}/O=TELEFONICA BRASIL S A/OU=TELEFONICA/C=BR/ST=SAO PAULO/L=SAO PAULO" \
                  -addext "subjectAltName=${SAN_ENTRIES}"
                
                # Submit to CertSRV
                CSR_CONTENT=$(cat certificate.csr)
                
                if [ -z "${SVC_AZ_IAC_DEVOPS}" ] || [ -z "${SVC_AZ_IAC_DEVOPS_PASSWORD}" ]; then
                  echo "##vso[task.logissue type=error]CertSRV credentials missing"
                  exit 1
                fi
                
                set +e
                curl --ntlm \
                  --user "REDECORP\\${SVC_AZ_IAC_DEVOPS}:${SVC_AZ_IAC_DEVOPS_PASSWORD}" \
                  --location "${CERT_SRV}/certfnsh.asp" \
                  --http1.1 \
                  --insecure \
                  --connect-timeout 30 \
                  --max-time 60 \
                  --header 'Content-Type: application/x-www-form-urlencoded' \
                  --data-urlencode 'Mode=newreq' \
                  --data-urlencode "CertRequest=${CSR_CONTENT}" \
                  --data-urlencode 'CertAttrib=CertificateTemplate:WebServer' \
                  --output response.html >/dev/null 2>&1
                CURL_EXIT_CODE=$?
                set -e
                
                if [ $CURL_EXIT_CODE -ne 0 ]; then
                  echo "##vso[task.logissue type=error]Failed to submit CSR to CertSRV"
                  exit 1
                fi
                
                if grep -qi "Certificate Request Denied" response.html; then
                  echo "##vso[task.logissue type=error]Certificate Request DENIED by CertSRV"
                  exit 1
                fi
                
                if grep -qi "401\|unauthorized\|invalid credentials\|access.*denied" response.html; then
                  echo "##vso[task.logissue type=error]CertSRV Authentication Failed (401 Unauthorized)"
                  exit 1
                fi
                
                if grep -qi "denied\|rejected\|error\|failed\|invalid" response.html; then
                  echo "##vso[task.logissue type=error]Certificate request denied or failed"
                  exit 1
                fi
                
                # Extract request ID
                REQ_ID=$(grep -oP 'ReqID=\K\d+' response.html | head -1 | tr -d '\r\n\t ')
                
                if [[ ! "$REQ_ID" =~ ^[0-9]+$ ]]; then
                  echo "##vso[task.logissue type=error]Failed to extract request ID from CertSRV response"
                  exit 1
                fi
                
                # Download certificado via PKCS#7 (.p7b)
                curl --ntlm \
                  --user "REDECORP\\${SVC_AZ_IAC_DEVOPS}:${SVC_AZ_IAC_DEVOPS_PASSWORD}" \
                  --location "${CERT_SRV}/certnew.p7b?ReqID=${REQ_ID}" \
                  --http1.1 \
                  --insecure \
                  --connect-timeout 30 \
                  --max-time 60 \
                  --output certificate.p7b >/dev/null 2>&1
                
                if [ ! -f certificate.p7b ] || [ ! -s certificate.p7b ]; then
                  echo "##vso[task.logissue type=error]Certificate download failed"
                  exit 1
                fi
                
                # Extrair certificado leaf
                openssl pkcs7 -print_certs -in certificate.p7b 2>/dev/null \
                  | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
                  | openssl x509 \
                  > certificate.crt
                
                if [ ! -s certificate.crt ]; then
                  echo "##vso[task.logissue type=error]Failed to extract leaf certificate from PKCS#7"
                  exit 1
                fi
                
                if ! openssl x509 -in certificate.crt -noout -text &>/dev/null; then
                  echo "##vso[task.logissue type=error]Invalid certificate format"
                  exit 1
                fi
                
                # Import to Key Vault
                openssl pkcs12 -export -out certificate.pfx -inkey certificate.key -in certificate.crt -passout pass:
                
                az keyvault certificate import \
                  --vault-name "${KEY_VAULT_NAME}" \
                  --name "${CERT_NAME}" \
                  --file certificate.pfx \
                  --tags "product=${PRODUCT_NAME}" "environment=${ENVIRONMENT}" "auto-renewal=enabled" >/dev/null 2>&1
                
                echo "Certificate imported successfully"
                
                # Set output variables
                echo "##vso[task.setvariable variable=CERT_REUSED;isOutput=true]false"
                echo "##vso[task.setvariable variable=CERT_GENERATED;isOutput=true]true"
              workingDirectory: $(Build.SourcesDirectory)
            env:
              SVC_AZ_IAC_DEVOPS: 'SVC_AZ_IAC_DEVOPS'  
              SVC_AZ_IAC_DEVOPS_PASSWORD: $(JENKINS-PASSWORD-IAC-DEVOPS)

          - task: AzureCLI@2
            name: PrepareCertificateForTerraform
            displayName: 'Prepare Certificate for Terraform (OKE)'
            condition: and(eq('${{parameters.action}}', 'apply'), succeeded())
            inputs:
              azureSubscription: kv-dvps-brsouth-shared
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                
                echo "##[section]Preparing Certificate Files for Terraform (OCI/OKE)"
                
                # ==========================================
                # STEP 1: Get Variables from Previous Task
                # ==========================================
                PRODUCT_NAME="$(SSLCertificateGeneration.PRODUCT_NAME)"
                CERT_NAME="$(SSLCertificateGeneration.CERT_NAME)"
                ENVIRONMENT="${{parameters.environment}}"
                DOMAIN="$(SSLCertificateGeneration.DOMAIN)"
                CERT_REUSED="$(SSLCertificateGeneration.CERT_REUSED)"
                KEY_VAULT_NAME="kv-dvps-k8s-certs-shared"
                
                echo "Certificate: ${CERT_NAME}, Domain: ${DOMAIN}, Reused: ${CERT_REUSED}"
                
                # ==========================================
                # STEP 2: Create SSL Directory
                # ==========================================
                SSL_DIR="environments/${{parameters.environment}}/ssl"
                mkdir -p "${SSL_DIR}"
                
                # ==========================================
                # STEP 3: Get Certificate Files
                # ==========================================
                echo "##[section]Obtaining Certificate Files"
                
                if [ "${CERT_REUSED}" == "true" ]; then
                  echo "Downloading certificate from Azure Key Vault..."
                  
                  az keyvault secret download \
                    --vault-name "${KEY_VAULT_NAME}" \
                    --name "${CERT_NAME}" \
                    --file certificate.pfx \
                    --encoding base64
                  
                  if [ ! -f certificate.pfx ]; then
                    echo "##vso[task.logissue type=error]Failed to download certificate from Key Vault"
                    exit 1
                  fi
                  
                  # Extract private key
                  openssl pkcs12 -in certificate.pfx -nocerts -out certificate_raw.key -nodes -passin pass: 2>/dev/null
                  # Extract certificate chain (nokeys without -clcerts to preserve CA chain)
                  openssl pkcs12 -in certificate.pfx -nokeys -out certificate_raw.crt -passin pass: 2>/dev/null
                  
                  # Clean PEM format (keep only PEM blocks)
                  sed -n '/-----BEGIN/,/-----END/p' certificate_raw.key > certificate.key
                  sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' certificate_raw.crt > certificate.crt
                  
                  rm -f certificate_raw.key certificate_raw.crt certificate.pfx
                  
                  echo "Certificate downloaded and extracted from Key Vault"
                else
                  echo "Using newly generated certificate files from previous task"
                  
                  if [ ! -f certificate.key ] || [ ! -f certificate.crt ]; then
                    echo "##vso[task.logissue type=error]Certificate files not found (certificate.key or certificate.crt)"
                    exit 1
                  fi
                fi
                
                # ==========================================
                # STEP 4: Validate PEM Format
                # ==========================================
                echo "##[section]Validating Certificate Format"
                
                if ! grep -q "BEGIN.*PRIVATE KEY" certificate.key; then
                  echo "##vso[task.logissue type=error]Invalid private key format (missing PEM header)"
                  exit 1
                fi
                
                if ! grep -q "BEGIN CERTIFICATE" certificate.crt; then
                  echo "##vso[task.logissue type=error]Invalid certificate format (missing PEM header)"
                  exit 1
                fi
                
                if ! openssl rsa -in certificate.key -check -noout &>/dev/null; then
                  echo "##vso[task.logissue type=error]Invalid private key (OpenSSL validation failed)"
                  exit 1
                fi
                
                if ! openssl x509 -in certificate.crt -noout -text &>/dev/null; then
                  echo "##vso[task.logissue type=error]Invalid certificate (OpenSSL validation failed)"
                  exit 1
                fi
                
                echo "Certificate Subject:"
                openssl x509 -in certificate.crt -noout -subject
                echo "Certificate Validity:"
                openssl x509 -in certificate.crt -noout -dates
                
                # ==========================================
                # STEP 5: Copy to SSL Directory
                # ==========================================
                cp certificate.key "${SSL_DIR}/tls.key"
                cp certificate.crt "${SSL_DIR}/tls.crt"
                chmod 600 "${SSL_DIR}/tls.key"
                chmod 644 "${SSL_DIR}/tls.crt"
                
                # ==========================================
                # STEP 6: Enable TLS in values.yaml if available
                # ==========================================
                VALUES_FILE="environments/${{parameters.environment}}/K8sInitConfig/values.yaml"
                if [ -f "$VALUES_FILE" ]; then
                  sed -i '/tls:/,/enabled:/ { s/enabled: false/enabled: true/; }' "$VALUES_FILE" 2>/dev/null || true
                  sed -i '/ingress:/,/enabled:/ { s/enabled: false/enabled: true/; }' "$VALUES_FILE" 2>/dev/null || true
                fi
                
                # ==========================================
                # STEP 7: Export Terraform Variables
                # ==========================================
                TLS_KEY_FILE="$(pwd)/${SSL_DIR}/tls.key"
                TLS_CRT_FILE="$(pwd)/${SSL_DIR}/tls.crt"
                
                echo "##vso[task.setvariable variable=TF_VAR_k8s_init_config_ingress_tls_key;]${TLS_KEY_FILE}"
                echo "##vso[task.setvariable variable=TF_VAR_k8s_init_config_ingress_tls_crt;]${TLS_CRT_FILE}"
                
                echo "Certificate files prepared for Terraform:"
                echo "  TLS Key: ${TLS_KEY_FILE}"
                echo "  TLS Crt: ${TLS_CRT_FILE}"
              workingDirectory: $(Build.SourcesDirectory)

          - task: TerraformTaskV4@4
            displayName: 'Terraform APPLY'
            inputs:
              provider: 'oci'
              command: apply
              commandOptions: -var-file=environments/${{ parameters.environment }}/terraform.tfvars.json --auto-approve
              environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
              environmentServiceNameAzureRM: sp-terraform-${{parameters.environment}}
              workingDirectory: $(Build.SourcesDirectory)
            env:
              AZDO_ORG_SERVICE_URL: https://dev.azure.com/telefonica-vivo-brasil
              KUBECONFIG: $(KUBECONFIG)
              TF_VAR_kubeconfig_path: $(KUBECONFIG)
              PHPIPAM_APP_ID: platformcode
              PHPIPAM_ENDPOINT_ADDR: http://10.240.42.97:8000/api
              PHPIPAM_PASSWORD: $(PHPIPAM-PASSWORD)
              PHPIPAM_USER_NAME: platformcode
              TF_VAR_NEXUS_USERNAME: $(NEXUS-DEPS-USR)
              TF_VAR_NEXUS_PASSWORD: $(NEXUS-DEPS-PSW)
              TF_VAR_ACR_PASSWORD: $(DEVOPS-ACR-PASSWORD)
              TF_VAR_ACR_USERNAME: $(DEVOPS-ACR-USERNAME)
              TF_VAR_runtime_tags: '{"trilha":"${{parameters.environment}}","repositorio":"$(Build.Repository.Uri)"}'
              TF_VAR_k8s_init_config_ingress_tls_key: $(TF_VAR_k8s_init_config_ingress_tls_key)
              TF_VAR_k8s_init_config_ingress_tls_crt: $(TF_VAR_k8s_init_config_ingress_tls_crt)
              ASDF_HELM_VERSION: 3.11.0

          - task: CmdLine@2
            displayName: 'Cleanup Certificate Files'
            condition: always()
            inputs:
              script: |
                set +e
                
                echo "##[section]Cleaning up sensitive certificate files"
                
                FILES_TO_CLEAN=(
                  "certificate.key"
                  "certificate.csr"
                  "certificate.crt"
                  "certificate.pfx"
                  "certificate.p7b"
                  "certificate_raw.key"
                  "certificate_raw.crt"
                  "response.html"
                )
                
                for file in "${FILES_TO_CLEAN[@]}"; do
                  if [ -f "$file" ]; then
                    echo "Securely deleting: $file"
                    if command -v shred &>/dev/null; then
                      shred -vfz -n 3 "$file" 2>/dev/null || rm -f "$file"
                    else
                      FILE_SIZE=$(wc -c < "$file" 2>/dev/null || echo "0")
                      if [ "$FILE_SIZE" -gt 0 ]; then
                        dd if=/dev/urandom of="$file" bs=1 count=$FILE_SIZE conv=notrunc 2>/dev/null || true
                        dd if=/dev/zero of="$file" bs=1 count=$FILE_SIZE conv=notrunc 2>/dev/null || true
                      fi
                      rm -f "$file"
                    fi
                  fi
                done
                
                # Clean SSL directory
                SSL_DIR="environments/${{parameters.environment}}/ssl"
                if [ -d "$SSL_DIR" ]; then
                  find "$SSL_DIR" -name "*.key" -delete 2>/dev/null || true
                  find "$SSL_DIR" -name "*.crt" -delete 2>/dev/null || true
                  rmdir "$SSL_DIR" 2>/dev/null || true
                fi
                
                echo "Cleanup complete"
              workingDirectory: $(Build.SourcesDirectory)

          - task: CmdLine@2
            displayName: 'Terraform OUTPUT .json'
            env:
              OUTPUT_FILE: $(Build.ArtifactStagingDirectory)/outputs.json
            inputs:
              script: |
                terraform --version -json

                echo "##[command] terraform output -json > ${OUTPUT_FILE}"
                terraform output -json > ${OUTPUT_FILE}

                jq 'if . == {} then error("") else . end | {"outputs": "exported"}' ${OUTPUT_FILE}
                retVal=$?

                if [ $retVal -ne 0 ]; then
                  echo "##[debug] File '${OUTPUT_FILE}' is empty, removing it from artifact staging directory."
                  rm ${OUTPUT_FILE}
                fi
              workingDirectory: $(Build.SourcesDirectory)
          - task: PublishPipelineArtifact@1
            displayName: Publish Pipeline Artifact
            condition: ''
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifactName: terraform_apply
              publishLocation: pipeline

- stage: stage_plan_destroy
