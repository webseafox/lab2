                  Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.

                ${YELLOW} Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}https://wikicorp.telefonica.com.br/display/AC/Terraform+-+Azure

                =================================================================================================================================
                "

          - task: Kubernetes@1
            displayName: "Login OKE (${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }})"
            inputs:
              kubernetesServiceEndpoint: ${{ parameters.okeServiceConnectionPrefix }}-${{ parameters.environment }}
              command: login
              outputFormat: none

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            displayName: 'Install Terraform 1.4.5'
            inputs:
              terraformVersion: 1.4.5 
          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, AZ-DEVOPS-PAT-TOKEN, PHPIPAM-PASSWORD'
          - task: CmdLine@2
            displayName: 'Setup git config https'
            env:
              GIT_PASS: $(AZ-DEVOPS-PAT-TOKEN)
              GIT_ASKPASS: "$(Agent.TempDirectory)/git_env_password.sh"
            inputs:
              script: |
                echo "##[debug] GIT_ASKPASS........: ${GIT_ASKPASS}"
                echo "exec echo \"$GIT_PASS\"" >> "${GIT_ASKPASS}"
                chmod 777 "${GIT_ASKPASS}"
                echo "##vso[task.setvariable variable=GIT_ASKPASS]$GIT_ASKPASS"
              workingDirectory: $(Agent.TempDirectory)
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
            displayName: 'Terraform INIT - azurerm'
            inputs:
              backendServiceArm: SharedResources
              backendAzureRmResourceGroupName: rg-devops-sharedservices
              backendAzureRmStorageAccountName: sttfstatedevopsshared
              backendAzureRmContainerName: oci-terraform-state-${{parameters.environment}}
              backendAzureRmKey: $(System.TeamProject)/$(Build.Repository.Name)/terraform.tfstate
              workingDirectory: $(Build.SourcesDirectory)
            env:
              TF_LOG: $(TF_LOG)  
          - task: CmdLine@2
            displayName: 'Terraform OUTPUT .json'
            env:
              OUTPUT_FILE: $(Build.ArtifactStagingDirectory)/outputs.json
            inputs:
              script: |
                terraform --version -json

                echo "##[command] terraform output -json > ${OUTPUT_FILE}"
                terraform output -json > ${OUTPUT_FILE}

                jq 'if . == {} then error("") else . end | {"outputs": "exported"}' ${OUTPUT_FILE}
                retVal=$?

                if [ $retVal -ne 0 ]; then
                  echo "##[debug] File '${OUTPUT_FILE}' is empty, removing it from artifact staging directory."
                  rm ${OUTPUT_FILE}
                fi
              workingDirectory: $(Build.SourcesDirectory)
          - task: PublishPipelineArtifact@1
            displayName: Publish Pipeline Artifact
            condition: ''
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifactName: terraform_destroy
              publishLocation: pipeline
          - task: TerraformTaskV4@4
            displayName: 'Terraform DESTROY'
            inputs:
              provider: 'oci'
              command: destroy
              commandOptions: -var-file=environments/${{ parameters.environment }}/terraform.tfvars.json --auto-approve
              environmentServiceNameOCI: svc-ocidevops-plat-code-${{parameters.environment}}-terraform-gru
              environmentServiceNameAzureRM: sp-terraform-${{parameters.environment}}
              workingDirectory: $(Build.SourcesDirectory)
            env:
              AZDO_ORG_SERVICE_URL: https://dev.azure.com/telefonica-vivo-brasil
              PHPIPAM_APP_ID: platformcode
              PHPIPAM_ENDPOINT_ADDR: http://10.240.42.97:8000/api
              PHPIPAM_PASSWORD: $(PHPIPAM-PASSWORD)
              TF_VAR_kubeconfig_path: $(KUBECONFIG)
              PHPIPAM_USER_NAME: platformcode
              TF_VAR_NEXUS_USERNAME: $(NEXUS-DEPS-USR)
              TF_VAR_NEXUS_PASSWORD: $(NEXUS-DEPS-PSW)
              TF_VAR_ACR_PASSWORD: $(DEVOPS-ACR-PASSWORD)
              TF_VAR_ACR_USERNAME: $(DEVOPS-ACR-USERNAME)
              KUBECONFIG: $(KUBECONFIG)
              TF_VAR_runtime_tags: '{"trilha":"${{parameters.environment}}","repositorio":"$(Build.Repository.Uri)"}'
              ASDF_HELM_VERSION: 3.11.0