## -> Parameters:
parameters:
- name: qa_environment
  type: string
  default: ''
  values:
    - 'hml'
    - 'prod'
- name: createScripts
  displayName: 'Criar scripts blobStorage'
  type: boolean
  default: false    
- name: scriptName
  displayName: 'Nome + extensão do script a ser adicionado (Required caso script)'
  type: string
  default: 'none'
- name: enabled
  displayName: 'Habilitar script'
  type: boolean
  default: false  
- name: createNewBlob
  type: boolean
  default: false
- name: containerName
  displayName: 'Nome do container no Blob Storage (Required caso imagem)'
  type: string
  default: 'none' 
- name: autoOptimizeImages
  type: boolean
  default: false
  

## -> Resources:
resources:
  repositories:
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/tags/latest
    endpoint: CorePipelines

## -> Initialize global variables   

variables:
  - template: /tech_products/appv/global/initialize/variables-global.yml
  - template: /tech_products/appv/global/initialize/variables-nodejs.yml
  - group: "${{ variables['Build.DefinitionName'] }}"
  - group: "vivo-spa-pipeline-secrets"
  - template: /tech_products/appv/appv_upload_blobstorage/initialize/variables_azure.yml
    parameters:
      qa_environment: ${{parameters.qa_environment}}


stages:

  - template: /tech_products/appv/appv_upload_blobstorage/initialize/environment_blob_storage.yml
  - ${{ if eq(parameters.createScripts, true) }}:
    - template: /tech_products/appv/appv_upload_blobstorage/templates/ci/ci_create_scripts_file_in_blobstorage.yml
      parameters:
        qa_environment: ${{parameters.qa_environment}}
        createScripts: ${{parameters.createScripts}}
        scriptName: ${{parameters.scriptName}}
        enabled: ${{parameters.enabled}}
        AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
        AZURE_STORAGE_ACCOUNT_KEY: $(AZURE_STORAGE_ACCOUNT_KEY)
  
  - ${{ if eq(parameters.createScripts, false) }}:
    - template: /tech_products/appv/appv_upload_blobstorage/templates/ci/ci_publish_img_to_blobstorage.yml
      parameters:
        qa_environment: ${{parameters.qa_environment}}
        createNewBlob: ${{parameters.createNewBlob}}
        containerName: ${{parameters.containerName}}
        AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
        AZURE_STORAGE_ACCOUNT_KEY: $(AZURE_STORAGE_ACCOUNT_KEY)
        autoOptimizeImages: ${{parameters.autoOptimizeImages}}