parameters:
  - name: BUNDLE_NAME
    type: string
  - name: ENVIRONMENT
    type: string

steps:
  - bash: |
      cd ..
      ls ${{parameters.BUNDLE_NAME}}-$(BUNDLE_VERSION)

      ASSET_MANIFEST_NAME=asset-manifest-${{parameters.ENVIRONMENT}}.json

      cp ${{parameters.BUNDLE_NAME}}-$(BUNDLE_VERSION)/asset-manifest.json $ASSET_MANIFEST_NAME

      echo "##vso[task.setvariable variable=ASSET_MANIFEST_NAME]$ASSET_MANIFEST_NAME"

      echo "##[debug] Renamed asset manifest file: '$ASSET_MANIFEST_NAME'"
    displayName: "Copy and Rename Asset Manifest"

  - task: Bash@3
    condition: succeeded()
    displayName: "Upload Asset Manifest to Blob Storage"
    inputs:
      targetType: inline
      script: |
        echo "##[debug] Target directory path: './$(AZURE_STORAGE_CONTAINER_NAME)/$(AZURE_STORAGE_CONTAINER_PREFIX_PATH)/${{parameters.BUNDLE_NAME}}'"
        echo "##[debug] Source file path: '../$(ASSET_MANIFEST_NAME)'"
        echo "##[debug] Uploading asset manifest to Preprod Storage Account"

        az storage blob upload \
          --verbose \
          --account-name $(AZURE_STORAGE_ACCOUNT_NAME_PREPROD) \
          --account-key $(AZURE_STORAGE_ACCOUNT_KEY_PREPROD) \
          --container-name $(AZURE_STORAGE_CONTAINER_NAME) \
          --file ../$(ASSET_MANIFEST_NAME) \
          --name "$(AZURE_STORAGE_CONTAINER_PREFIX_PATH)/${{parameters.BUNDLE_NAME}}/$(ASSET_MANIFEST_NAME)" \
          --overwrite
