parameters:
  - name: qa_environment
    type: string

variables:
  - name: AZURE_BLOB_CONTAINER_URL
    ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
      value: https://corelocal4pframworkbrsa.telefonicabigdata.com/fb-core
    ${{ else }}:
      value: https://preframeworkbrasilsa.telefonicabigdata.com/fb-core

  - name: KEYCLOAK_URL
    ${{ if eq(parameters.qa_environment, 'prod') }}:
      value: https://prod-tools.telefonicabigdata.com/keycloak/realms/prod
    ${{ elseif eq(parameters.qa_environment, 'darklaunch') }}:
      value: https://prod-tools.telefonicabigdata.com/keycloak/realms/darklaunch
    ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
      value: https://preprod-tools.telefonicabigdata.com/keycloak/realms/preprod
    ${{ elseif eq(parameters.qa_environment, 'esteira01') }}:
      value: https://preprod-tools.telefonicabigdata.com/keycloak/realms/esteira01
    ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
      value: https://preprod-tools.telefonicabigdata.com/keycloak/realms/prodlike
    ${{ else }}:
      value: https://preprod-tools.telefonicabigdata.com/keycloak/realms/dev

  - name: KEYCLOAK_CLIENT_SECRET
    ${{ if eq(parameters.qa_environment, 'prod') }}:
      value: $(KEYCLOAK_CLIENT_SECRET_PROD)
    ${{ elseif eq(parameters.qa_environment, 'darklaunch') }}:
      value: $(KEYCLOAK_CLIENT_SECRET_DARKLAUNCH)
    ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
      value: $(KEYCLOAK_CLIENT_SECRET_PREPROD)
    ${{ elseif eq(parameters.qa_environment, 'esteira01') }}:
      value: $(KEYCLOAK_CLIENT_SECRET_ESTEIRA01)
    ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
      value: $(KEYCLOAK_CLIENT_SECRET_PRODLIKE)
    ${{ else }}:
      value: $(KEYCLOAK_CLIENT_SECRET_DEV)

  - name: AZURE_STORAGE_ACCOUNT_NAME
    ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
      value: $(AZURE_STORAGE_ACCOUNT_NAME_PROD)
    ${{ else }}:
      value: $(AZURE_STORAGE_ACCOUNT_NAME_PREPROD)

  - name: AZURE_STORAGE_ACCOUNT_KEY
    ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
      value: $(AZURE_STORAGE_ACCOUNT_KEY_PROD)
    ${{ else }}:
      value: $(AZURE_STORAGE_ACCOUNT_KEY_PREPROD)