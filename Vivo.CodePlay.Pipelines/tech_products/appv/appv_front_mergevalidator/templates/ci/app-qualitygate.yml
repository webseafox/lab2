stages:
- stage: ci_quality_gate
  displayName: "CI - Quality Gate"
  pool:
    name: GeneralPurposeLinuxAgentsCI
  dependsOn:
  - environment_init
  - gates_environment_init
  - ci_build
  condition: succeeded()
  
  ## -> Loads variables from other stages.
  variables:
  - name: SONARQUBE_TOKEN
    value: $[ stageDependencies.gates_environment_init.environment.outputs['sonarqube_credentials.SONARQUBE_TOKEN'] ]
  - name: NEW_VERSION
    value: $[ stageDependencies.ci_build.build.outputs['new_version.NEW_VERSION'] ]
  - name: ARTIFACT_NAME
    value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_NAME'] ]
  
  - template: /tech_products/appv/global/initialize/catalog-info-environment.yml
  - template: /tech_products/appv/global/initialize/variables-gates.yml
  jobs:
  
  - job: governance
    displayName: Governance Policies Check
    condition: and(
        succeeded(), 
        or(
        eq(variables['Build.SourceBranchName'],'master'),
        eq(variables['Build.SourceBranchName'],'main'),
        eq(variables['Build.SourceBranchName'],'prodlike'),
        eq(variables['Build.SourceBranchName'],'preprod'),
        eq(variables['Build.SourceBranchName'],'esteira1'),
        eq(variables['Build.SourceBranchName'],'esteira2'),
        eq(variables['Build.SourceBranchName'],'dev'),
        eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')))
    # steps:

    # - task: VivoGovernance@1
    #   inputs:
    #     breakglass: $(GOVAPP_BREAK_GLASS)
    #     cluster: "$(GOVAPP_CLUSTER)"
    #     component: "$(COMPONENT_NAME)"
    #     deployment: "$(COMPONENT_NAME)"
    #     environment: $(Build.SourceBranchName) 
    #     namespace: "$(GOVAPP_NAMESPACE)"
    #     operation: "validate"
    #     serverEndpoint: $(GOVAPP_SERVICE_CONNECTION_NAME)
    #     version: "$(NEW_VERSION)"
    #     catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
    #   continueOnError: true
    #   condition: eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')

  - job: sonarqube
    displayName: Code Analysis
    condition: and(
        succeeded(), 
        or(
        eq(variables['Build.SourceBranchName'],'master'),
        eq(variables['Build.SourceBranchName'],'main'),
        eq(variables['Build.SourceBranchName'],'prodlike'),
        eq(variables['Build.SourceBranchName'],'preprod'),
        eq(variables['Build.SourceBranchName'],'esteira1'),
        eq(variables['Build.SourceBranchName'],'esteira2'),
        eq(variables['Build.SourceBranchName'],'dev'),
        ne(variables.skip_sonarqube, 'true')))
    steps:
        
    ## -> Download Artifacts
    - download: none

    ## -> Download and uncompress the artifact.
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: $(ARTIFACT_NAME)
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)
    
    ## -> Set artifact information to variables.
    - task: Bash@3
      displayName: Artifacts Info
      continueOnError: true
      inputs:
        workingDirectory: $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)
        targetType: inline
        script: |

          pwd
          tree . -a

    ## -> Setup Project and Quality Gate
    - task: Bash@3
      displayName: 'Setup Project and Quality Gate'
      name: setup_quality_gate
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          url="$(SONARQUBE_URL)"
          token="$(SONARQUBE_TOKEN)"          
          projectKey="$(echo $(Build.Repository.Name) | sed 's/ /+/g')"
          projectName="$(echo $(System.TeamProject)-$(Build.Repository.Name) | sed 's/ /+/g')"         
          projectQualityGate="$(SONARQUBE_PROJECT_QUALITYGATE)"
          defaultQualityGate="$(SONARQUBE_DEFAULT_QUALITYGATE)"

          ## -> If no custom quality gate was provided, use default
          if [[ -z $projectQualityGate ]]; then
            echo "##[debug] Quality Gate not found, using default."                
            projectQualityGate="$defaultQualityGate"
          fi

          ## -> Checks if the project exists. If not, creates it.
          echo "##[debug] Cheking if project exists on SonarQube..."         
          projectExists=$(curl -s -X GET -u $token: "$url/api/projects/search?projects=$projectKey" | jq '.paging.total' | sed 's/null/0/g')

          if [ "$projectExists" -ne 1 ]; then
              echo "##[debug] Project do not exists, creating..."
              projectStatus=$(curl -s -X POST -o ./.tmp.sonar.out -w "%{http_code}" -u $token: "$url/api/projects/create?name=$projectName&project=$projectKey&visibility=public")
           
              if [ "$projectStatus" -eq 200 ]; then
                echo "##[debug] SonarQube project created for key $(SONAR_PROJECT_KEY)"
              else
                echo "##[error] Error to create SonarQube project for key $(SONAR_PROJECT_KEY)"
                echo "##[error] $(cat ./.tmp.sonar.out | jq '.errors[0].msg')"                   
              fi
          fi

          ## -> Checks if the project's Quality Gate exists. If not, use default.
          projectQualityGateStatus=$(curl -s -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/show?name=$projectQualityGate")

          if [ "$projectQualityGateStatus" -eq 200 ]; then
            echo "##[debug] Quality Gate found for $projectQualityGate"            
          else
            echo "##[debug] Quality Gate not found, using default."                
            projectQualityGate="$defaultQualityGate"
          fi

          ## -> Links the project to its Quality Gate
          echo "##[debug] Linking project to Quality Gate..."

          status=$(curl -s -X POST -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/select?gateName=$projectQualityGate&projectKey=$projectKey")

          if [ "$status" -ne 204 ]; then
            echo "##[error] Error while linking application to Quality Gate!"
            rm -rf ./.tmp.sonar.out
            exit 1;
          fi

          rm -rf ./.tmp.sonar.out

          ## -> Load sonar-project.properties
          sonarqubeProperties="$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.azuredevops/sonar-project.properties"
          if [[ -z $sonarqubeProperties ]]; then
            echo "##[debug] sonar-project.properties not found."
            echo "##[debug] Please add the file in the folder .azuredevops of the project."                            
            exit 1;
          else
            echo "##[debug] sonar-project.properties loaded."
            echo "##vso[task.setvariable variable=SONARQUBE_PROPERTIES_FILE]$sonarqubeProperties"
          fi
    
    ## -> Check if is a NodeJS project
    - task: Bash@3
      displayName: Check for package.json
      name: check_package_json
      condition: succeeded()
      continueOnError: false
      inputs:
        workingDirectory: $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)
        targetType: inline
        script: |
          
          packageJson="./package.json"

          if [ -s $packageJson  ]; then
            
            if [ -e "$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.nvmrc" ]; then
              echo "##[debug] File .nvmrc found. Version: $(cat $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.nvmrc)"
              echo "##vso[task.setvariable variable=NODE_VERSION;]$(cat $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.nvmrc)"
            else
              echo "##[debug] File .nvmrc not found. Using default: $(DEFAULT_NODE_VERSION)"
              echo "##vso[task.setvariable variable=NODE_VERSION;]$(DEFAULT_NODE_VERSION)"
            fi
          else
            echo "##[debug] It is not a NodeJs application, continue..."
          fi

    ## -> Configuring NodeJS
    - task: NodeTool@0
      displayName: 'Configuring NodeJS'
      condition: and(
        succeeded(),       
        ne(variables.NODE_VERSION,''))
      inputs:
        versionSource: 'spec'
        versionSpec: '$(NODE_VERSION)'
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    ## -> Prepare analysis on SonarQube for NodeJS
    - task: SonarSource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@5
      displayName: 'NODEJ - Prepare SonarQube Analysis'
      condition: and(
        succeeded(),       
        ne(variables.NODE_VERSION,''))
      inputs:
        SonarQube: $(SONARQUBE_SERVICE_CONNECTION_NAME)
        scannerMode: CLI
        configFile: $(SONARQUBE_PROPERTIES_FILE)
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/
          sonar.inclusions=**
          sonar.projectKey=$(SONAR_PROJECT_KEY)
          sonar.projectName=$(System.TeamProject)-$(Build.Repository.Name)
          sonar.projectVersion=$(NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.eslint.reportPaths=${{ parameters.eslintPath }}
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=false
          sonar.qualitygate.timeout=300
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    ## -> Prepare analysis on SonarQube for Java
    - task: SonarSource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@5
      displayName: 'JAVA - Prepare SonarQube Analysis'
      condition: and(
        succeeded(),       
        eq(variables.NODE_VERSION,''))
      inputs:
        SonarQube: $(SONARQUBE_SERVICE_CONNECTION_NAME)
        scannerMode: CLI
        configFile: $(SONARQUBE_PROPERTIES_FILE)
        extraProperties: |
          sonar.scm.disabled=True
          sonar.java.libraries=${MAVEN_CACHE_FOLDER}/**/*.jar
          sonar.java.test.libraries=${MAVEN_CACHE_FOLDER}/**/*.jar
          sonar.projectBaseDir=$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/
          sonar.inclusions=**
          sonar.projectKey=$(SONAR_PROJECT_KEY)
          sonar.projectName=$(System.TeamProject)-$(Build.Repository.Name)
          sonar.projectVersion=$(NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=false
          sonar.qualitygate.timeout=300
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    ## -> Run Sonarqube Analysis
    - task: SonarSource.sonarqube.6D01813A-9589-4B15-8491-8164AEB38055.SonarQubeAnalyze@5
      displayName: 'Run Code Analysis'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: "openjdk-11.0.2"
        
    ## -> Get Sonarqube taskId
    - task: Bash@3
      displayName: Get Sonar TaskId
      name: sonar_task_id
      condition: succeeded()
      continueOnError: false
      inputs:
        workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
        targetType: inline
        script: |

          ## -> Load report_task
          if [[ -z $(REPORT_TASK_NAME) ]]; then
            echo "##[debug] report not found."
            exit 1;
          else
            sonarTaskId="$(cat $(REPORT_TASK_NAME) | grep -o 'ceTaskId=[^,]*' | awk -F= '{print $2}')"
            echo "##[debug] SONAR_TASK_ID.......: $sonarTaskId"
            echo "##vso[task.setvariable variable=SONAR_TASK_ID;isOutput=true]$sonarTaskId"
          fi

    - task: SonarSource.sonarqube.291ed61f-1ee4-45d3-b1b0-bf822d9095ef.SonarQubePublish@5
      displayName: 'Publish Quality Gate Result'
      continueOnError: true
      inputs:
        pollingTimeoutSec: '60'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    ## -> Verify QualityGate Status
    - task: Bash@3
      displayName: Analyze Quality Gate status
      name: quality_gate_status
      condition: succeeded()
      continueOnError: false
      inputs:
        workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
        targetType: inline
        script: |

          echo "##[debug] SONAR_TASK_ID...............: $(sonar_task_id.SONAR_TASK_ID)"

          sonarTaskUrl="$(SONARQUBE_URL)/api/ce/task?id=$(sonar_task_id.SONAR_TASK_ID)"
          echo "##[debug] SONAR_TASK_URL..............: $sonarTaskUrl"

          echo "##[section] --- Starting SonarQube Task Status Monitoring --- "

          queueStatus="$(curl -s -u "$(SONARQUBE_TOKEN):" "$(SONARQUBE_URL)/api/ce/activity?status=PENDING" | jq '.paging.total')"
          echo "##[debug] Current queue size: $queueStatus"

          retryCount=10
          attempt=1
          waitTime=30

          while [ $retryCount -gt 0 ]; do
            if [[ "$attempt" -gt 1 ]]; then
              echo "##[debug] REMAINING TRIES..............: $retryCount"
            fi

            taskStatus="$(curl -s -u "$(SONARQUBE_TOKEN):" "$sonarTaskUrl" | jq -r '.task.status')"
            echo "##[debug] TASK_STATUS..................: $taskStatus"

            if [ "$taskStatus" = "SUCCESS" ]; then
              echo "##[section] * Analysis completed successfully *"

              analysisId="$(curl -s -u "$(SONARQUBE_TOKEN):" "$sonarTaskUrl" | jq -r '.task.analysisId')"
              echo "##[debug] ANALYSIS_ID.................: $analysisId"

              sonarProjectStatusUrl="$(SONARQUBE_URL)/api/qualitygates/project_status?analysisId=$analysisId"
              echo "##[debug] SONAR_PROJECT_STATUS_URL....: $sonarProjectStatusUrl"

              analysisStatus="$(curl -s -u "$(SONARQUBE_TOKEN):" "$sonarProjectStatusUrl" | jq -r '.projectStatus.status')"
              echo "##[debug] ANALYSIS_STATUS.............: $analysisStatus"

              if [[ "$analysisStatus" == "ERROR" ]]; then
                echo "##vso[task.logissue type=error;] Sonar Quality Gate status is ERROR - View details on step Run Code Analysis."
                echo "##vso[task.complete result=Failed;]"
              fi

              projectKey="$(echo $(Build.Repository.Name) | sed 's/ /+/g')"

              codeSmellsUrl="$(SONARQUBE_URL)/api/measures/component?component=$projectKey&metricKeys=new_code_smells&pullRequest=$(System.PullRequest.PullRequestId)&additionalFields=metrics"
              echo "##[debug] CODE_SMELLS_URL.............: $codeSmellsUrl"

              codeSmells="$(curl -s -u "$(SONARQUBE_TOKEN):" "$codeSmellsUrl" | jq -r '.component.measures[0].period.value')"
              echo "##[debug] CODE_SMELLS.................: $codeSmells"

              if [[ "$codeSmells" -gt 0 ]]; then
                echo "##vso[task.logissue type=error;] Sonar Quality Gate failed - Found $codeSmells code smell(s). View details on $(SONARQUBE_URL)/dashboard?id=$projectKey&pullRequest=$(System.PullRequest.PullRequestId)"
                echo "##vso[task.complete result=Failed;]"
              fi

              break
            elif [ "$taskStatus" = "FAILED" ] || [ "$taskStatus" = "CANCELED" ]; then
              echo "##vso[task.logissue type=error;] Sonar Quality Gate Task has failed or was canceled."
              echo "##vso[task.complete result=Failed;]"
              break
            fi

            echo " * Analysis still in progress * "
            echo "##[debug] Waiting $waitTime seconds before next check..."

            retryCount=$((retryCount-1))
            attempt=$((attempt+1))
            sleep $waitTime
          done

          echo "##[section] --- SonarQube Task Status Monitoring Complete --- "

          if [ $retryCount -le 0 ] && [ "$taskStatus" != "SUCCESS" ]; then
            queueStatus="$(curl -s -u "$(SONARQUBE_TOKEN):" "$(SONARQUBE_URL)/api/ce/activity?status=PENDING" | jq '.paging.total')"
            echo "##[debug] Current queue size: $queueStatus"
            echo "##[debug] Maximum number of attempts exceeded. Final task status: $taskStatus"
            echo "##vso[task.logissue type=warning;] SonarQube analysis did not complete successfully within the timeout period."
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi
    
    - task: Bash@3
      name: set_qualitygate_result
      displayName: 'Set Quality Gate Result Variable'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          # Agent.JobStatus reflects the current job status after previous tasks
          JOB_STATUS='$(Agent.JobStatus)'
          
          echo "Current job status: $JOB_STATUS"
          
          if [[ "$JOB_STATUS" == "Succeeded" || "$JOB_STATUS" == "SucceededWithIssues" ]]; then
            echo "Quality Gate analysis succeeded"
            echo "##vso[task.setvariable variable=qualitygate_result;isOutput=true]true"
            RESULT="true"
          else
            echo "Quality Gate analysis failed or was skipped (job status: $JOB_STATUS)"
            echo "##vso[task.setvariable variable=qualitygate_result;isOutput=true]false"
            RESULT="false"
          fi
          
          echo "qualitygate_result set to: $RESULT"