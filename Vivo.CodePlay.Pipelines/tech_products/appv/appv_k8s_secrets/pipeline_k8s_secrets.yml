parameters:
  - name: dryRun
    type: boolean
    displayName: "Dry Run (validation only, no changes applied)"
    default: false

  - name: targetEnvironment
    type: string
    displayName: "Target Environment"
    default: ""

  - name: gitRepoName
    type: string
    displayName: "Git Repository Name (optional, e.g., my-service-ms)"
    default: " "

  - name: secretName
    type: string
    displayName: "Secret Name (full name, e.g., my-app-ms-secrets)"
    default: ""

  - name: secretsJson
    type: string
    displayName: 'Secrets JSON: {"KEY":"value", ...}'
    default: "{}"

  - name: overrideExistingKeys
    type: boolean
    displayName: "Override Existing Keys (if key exists, overwrite it)"
    default: false

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines

variables:
  - template: /tech_products/appv/global/initialize/variables-global.yml
  - ${{ if ne(parameters.gitRepoName, ' ') }}:
      - group: "${{ parameters.gitRepoName }}"

stages:
  - stage: naming_and_tagging
    displayName: "Build Info"
    pool:
      name: GeneralPurposeLinuxAgentsCI
    jobs:
      - job: set_build_info
        displayName: "Set Build Name and Tags"
        steps:
          - task: Bash@3
            displayName: "Set Build Tags"
            condition: succeeded()
            inputs:
              targetType: inline
              script: |
                echo "##vso[build.addbuildtag]${{ parameters.targetEnvironment }}"
                echo "##vso[build.addbuildtag]${{ parameters.secretName }}"

          - task: Bash@3
            displayName: "Set Build Name"
            condition: succeeded()
            inputs:
              targetType: inline
              script: |
                echo "##vso[build.updatebuildnumber]${{ parameters.targetEnvironment }} • ${{ parameters.secretName }}"

  - template: /tech_products/appv/global/initialize/nodejs-environment.yml

  - template: /tech_products/appv/appv_k8s_secrets/templates/cd/cd_validate_and_prepare.yml
    parameters:
      targetEnvironment: ${{ parameters.targetEnvironment }}
      gitRepoName: ${{ parameters.gitRepoName }}
      secretName: ${{ parameters.secretName }}
      secrets: ${{ parameters.secretsJson }}
      overrideExistingKeys: ${{ parameters.overrideExistingKeys }}
      dryRun: ${{ parameters.dryRun }}

  - template: /tech_products/appv/appv_k8s_secrets/templates/cd/cd_seal_and_commit.yml
    parameters:
      targetEnvironment: ${{ parameters.targetEnvironment }}
      secretName: ${{ parameters.secretName }}
      dryRun: ${{ parameters.dryRun }}
