stages:

## -> Initialize pipeline enviroment
- template: /tech_products/appv/global/initialize/nodejs-environment.yml




## -> Build for CI - NodeJS
- template: /tech_products/appv/appv_update_template/templates/ci/ci_update_template.yml
  parameters:
    projects: "${{parameters.projects}}"
    type: "${{parameters.type}}"

