parameters:
  - name: projects
    type: object
    default:
      default:
        src: null
        deploy: null
        package: null
  - name: type
    type: string
    default: ''

## -> Resources:
resources:
  repositories:
  # - repository: FortifyExclusion
  #   name: DevOps/Vivo.Fortify.Exclusions
  #   type: git
  #   ref: refs/heads/master
  #   endpoint: CorePipelines
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/tags/latest
    endpoint: CorePipelines

## -> Initialize global variables   
variables:

- template: /tech_products/appv/global/initialize/variables-global.yml
