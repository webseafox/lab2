stages:
- stage: update_template
  displayName: "CI - Update Template"
  pool:
    name: GeneralPurposeLinuxAgentsCI
  dependsOn:
  - environment_init

  variables:
  - name: NEXUS_DEPS_USR
    value: $[ stageDependencies.nodejs_environment_init.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
  - name: NEXUS_DEPS_PSW
    value: $[ stageDependencies.nodejs_environment_init.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
  
  jobs:      
  - job: build
    displayName: Build
    steps:

    - checkout: self
      name: checkout_project
      path: s

    - checkout: git://${{ parameters.projects[parameters.type].template }} 
      persistCredentials: "true"
      name: checkout_template
      path: s/template

    - script: |
        cd template
        rm -rf ./src
        rm -rf ./package
        rm -rf ./deploy
      displayName: 'Remove old files'
      condition: succeeded()

    - ${{ if ne(parameters.projects[parameters.type].src, '') }}:
      - checkout: git://${{ parameters.projects[parameters.type].src }} 
        condition: succeeded()
        name: checkout_src 
        path: s/template/skeleton/src


    - ${{ if ne(parameters.projects[parameters.type].package, '') }}:
      - checkout: git://${{ parameters.projects[parameters.type].package }} 
        condition: succeeded()
        name: checkout_package
        path: s/template/skeleton/package


    - ${{ if ne(parameters.projects[parameters.type].deploy, '') }}:
      - checkout: git://${{ parameters.projects[parameters.type].deploy }} 
        condition: succeeded()
        name: checkout_deploy
        path: s/template/skeleton/deploy

    - script: |
        cd template/skeleton

        rm -rf ./src/.git
        rm -rf ./package/.git
        rm -rf ./deploy/.git
      displayName: 'Remove .git files'
      condition: succeeded()

    - script: |
        echo "Parameter type: ${{ parameters.type }}"

        cd lib
        npm i 

        cd ../template/skeleton
        node ../../lib/transform-in-template.js --config=${{ parameters.type }}
      displayName: 'Transform sources in template'
      condition: succeeded()


    - script: |
        cd template
        UPDATE_BRANCH=$(date +%s)

        git checkout update-template
        git add . || /bin/true
        git commit -m 'feat: new template' || /bin/true
        git push -f -u origin update-template || /bin/true
      displayName: 'Push changes to template'
      condition: succeeded()