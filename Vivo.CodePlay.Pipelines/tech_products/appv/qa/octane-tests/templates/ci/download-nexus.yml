parameters:
  - name: repositoryName
    type: string

  - name: version
    type: string
    default: ''

steps:
  - task: Bash@3
    displayName: 'Download Cucumber Report From Nexus'
    inputs:
      targetType: inline
      script: |
        set -e

        echo "##[section]Starting download of cucumber-report.json from Nexus"

        REPOSITORY_NAME="${{ parameters.repositoryName }}"
        VERSION="${{ parameters.version }}"
        OUTPUT_DIRECTORY="$(Build.ArtifactStagingDirectory)"
        OUTPUT_FILE="$OUTPUT_DIRECTORY/cucumber-report.json"

        if [ -z "$REPOSITORY_NAME" ]; then
          echo "##[error]Repository name was not provided."
          exit 1
        fi

        NEXUS_PATH="framework-brasil-raw/reports/$REPOSITORY_NAME-$VERSION/merge/cucumber-report.json"
        echo "##[debug]Using versioned path strategy: $VERSION"

        NEXUS_URL="$(NEXUS_REPOSITORY_URL)/$NEXUS_PATH"

        echo "##[group]Nexus Download Details"
        echo "Repository name : $REPOSITORY_NAME"
        echo "Version         : ${VERSION:-merge}"
        echo "Target URL      : $NEXUS_URL"
        echo "Output file     : $OUTPUT_FILE"
        echo "##[endgroup]"

        mkdir -p "$OUTPUT_DIRECTORY"

        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u $(NEXUS_DEPS_USR):$(NEXUS_DEPS_PSW) "$NEXUS_URL" || echo "000")

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "##[error]Failed to download cucumber-report.json from Nexus. HTTP status: $HTTP_STATUS"
          echo "##[error]The cucumber-report.json file does not exist. Run merge-validator and build to generate it."
          exit 1
        fi

        echo "##[debug]Downloading file from Nexus..."
        curl -f -s -u $(NEXUS_DEPS_USR):$(NEXUS_DEPS_PSW) -o "$OUTPUT_FILE" "$NEXUS_URL"
        CURL_EXIT_CODE=$?

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "##[error]Failed to download file. Curl exit code: $CURL_EXIT_CODE"
          exit 1
        fi

        if [ ! -s "$OUTPUT_FILE" ]; then
          echo "##[error]The downloaded cucumber-report.json file is empty or corrupted."
          exit 1
        fi

        FILE_SIZE=$(stat -f%z "$OUTPUT_FILE" 2>/dev/null || stat -c%s "$OUTPUT_FILE" 2>/dev/null)
        echo "##[debug]Downloaded file size: $FILE_SIZE bytes"

        echo "##[section]Download completed successfully"