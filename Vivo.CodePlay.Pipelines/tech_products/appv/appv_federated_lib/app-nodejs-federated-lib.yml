parameters:
  - name: MANUAL_BUNDLE_VERSION
    type: string
  - name: skipReleaseCreation
    type: boolean
  - name: skipReleaseUpdate
    type: boolean
  - name: RELEASE_ENABLED_FLAG
    type: boolean
  - name: RELEASE_PREFETCH_FLAG
    type: boolean
  - name: qa_environment
    type: string
  - name: spa_selector
    type: string
    default: APP
  - name: notifyChangelog
    type: boolean
    default: False
  - name: publishAssetManifest
    type: boolean
    default: False

  - name: canaryDeploy
    type: boolean
    default: False
  - name: INTERVAL_MINUTES
    default: 5
  - name: INCREMENT_PERCENTAGE
    default: 10
  - name: MAX_PERCENTAGE
    default: 100
  - name: IS_FEDERATED_COMPONENT
    type: boolean
    default: true
  - name: FEDERATED_MODULE_NAME
    type: string
    default: ''
  - name: jira_id
    type: string
    default: ""
  - name: component_test_id
    type: string
    default: ""
  - name: octane_workspace
    type: string
    default: ""
  - name: octane_environment
    type: string
    default: PROD
  - name: test_environment
    type: string
    default: ""
  - name: docker_image
    type: string
    default: selenium
  - name: framework
    type: string
    default: JUnit
  ## -> Fortify Exclusion Repository
  - name: fortifyExclusionRepository
    type: string
    default: FortifyExclusion

resources:
  repositories:
    - repository: CodePlay
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
  - template: /tech_products/appv/global/initialize/variables-global.yml
  - template: /tech_products/appv/global/initialize/variables-nodejs.yml
  - template: /tech_products/appv/global/initialize/variables-gates.yml
  - group: "${{ variables['Build.DefinitionName'] }}"
  - group: "vivo-spa-pipeline-secrets"
  - template: /tech_products/appv/appv_node_vivo_spa/initialize/variables/common.yml
    parameters:
      qa_environment: ${{parameters.qa_environment}}

  - ${{ if eq(parameters.spa_selector, 'WEB') }}:
      - template: /tech_products/appv/appv_node_vivo_spa/initialize/variables/vivo_spa_web.yml
        parameters:
          qa_environment: ${{parameters.qa_environment}}

  - ${{ if eq(parameters.spa_selector, 'APP') }}:
      - template: /tech_products/appv/appv_node_vivo_spa/initialize/variables/vivo_spa.yml
        parameters:
          qa_environment: ${{parameters.qa_environment}}

  - name: versionLog
    value: "${{parameters.MANUAL_BUNDLE_VERSION}}"
  - name: environmentLog
    value: "${{parameters.qa_environment}}"

stages:
  - template: /tech_products/appv/appv_node_vivo_spa/initialize/nodejs-environment-vivo-spa.yml

  ## -> Build for CI - NodeJS
  - template: /tech_products/appv/appv_federated_lib/templates/ci/app-build-federated-lib.yml
    parameters:
      skipReleaseCreation: ${{parameters.skipReleaseCreation}}

  ## -> Initialize gates environment
  - template: /tech_products/appv/global/initialize/gates-environment.yml

  ## -> Security Gates (SonarQube)
  - template: /tech_products/appv/appv_node/templates/ci/app-qualitygate.yml

  ## -> Security Gates (Fortify)
  - template: /tech_products/appv/appv_node/templates/ci/app-securitygate.yml
    parameters:
      fortifyExclusionRepository: ${{ parameters.fortifyExclusionRepository }}

  ## -> Publish Build for CI - NodeJS
  - template: /tech_products/appv/appv_node_vivo_spa/templates/ci/ci_publish_nodejs_appv_vivo_spa.yml
    parameters:
      skipReleaseCreation: ${{parameters.skipReleaseCreation}}
  - ${{ if eq(parameters.notifyChangelog, True) }}:
    - template: /tech_products/appv/global/templates/ci/ci-changelog-notification-appv.yml

  - template: /tech_products/appv/appv_node_vivo_spa/templates/keycloak_auth.yml
    parameters:
      KEYCLOAK_URL: $(KEYCLOAK_URL)
      CLIENT_SECRET: $(KEYCLOAK_CLIENT_SECRET)
      CLIENT_ID: $(KEYCLOAK_CLIENT_ID)

  # For federated components, check the individual module registered in Route Orchestrator, not the parent bundle
  - ${{ if eq(parameters.IS_FEDERATED_COMPONENT, true) }}:
    - template: /tech_products/appv/appv_node_vivo_spa/templates/cd/cd_environment_checklist.yml
      parameters:
        BUNDLE_NAME: ${{ lower(parameters.FEDERATED_MODULE_NAME) }}
        qa_environment: ${{ parameters.qa_environment }}
        MANUAL_BUNDLE_VERSION: ${{ parameters.MANUAL_BUNDLE_VERSION }}
        ROUTE_ORCHESTRATOR_URL: $(ROUTE_ORCHESTRATOR_URL)
        desiredEnvFilePath: modules/${{ lower(parameters.FEDERATED_MODULE_NAME) }}/envs/.env.${{ parameters.qa_environment }}
  - ${{ else }}:
    - template: /tech_products/appv/appv_node_vivo_spa/templates/cd/cd_environment_checklist.yml
      parameters:
        BUNDLE_NAME: $(BUNDLE_NAME)
        qa_environment: ${{ parameters.qa_environment }}
        MANUAL_BUNDLE_VERSION: ${{ parameters.MANUAL_BUNDLE_VERSION }}
        ROUTE_ORCHESTRATOR_URL: $(ROUTE_ORCHESTRATOR_URL)

  - template: /tech_products/appv/appv_node_vivo_spa/templates/publish_release.yml
    parameters:
      BUNDLE_NAME: $(BUNDLE_NAME)
      MANUAL_BUNDLE_VERSION: ${{parameters.MANUAL_BUNDLE_VERSION}}
      BUNDLE_NEXUS_REPOSITORY: $(BUNDLE_NEXUS_REPOSITORY)
      BUNDLE_NEXUS_COMPONENT_GROUP: $(BUNDLE_NEXUS_COMPONENT_GROUP)
      AZURE_STORAGE_CONTAINER_NAME: $(AZURE_STORAGE_CONTAINER_NAME)
      AZURE_STORAGE_CONTAINER_PREFIX_PATH: $(AZURE_STORAGE_CONTAINER_PREFIX_PATH)
      AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
      AZURE_STORAGE_ACCOUNT_KEY: $(AZURE_STORAGE_ACCOUNT_KEY)
      skipReleaseCreation: ${{parameters.skipReleaseCreation}}

  - template: /tech_products/appv/appv_node_vivo_spa/templates/register_federated_release.yml
    parameters:
      BUNDLE_NAME: $(BUNDLE_NAME)
      MANUAL_BUNDLE_VERSION: ${{parameters.MANUAL_BUNDLE_VERSION}}
      AZURE_BLOB_CONTAINER_URL: $(AZURE_BLOB_CONTAINER_URL)
      ROUTE_ORCHESTRATOR_URL: $(ROUTE_ORCHESTRATOR_URL)
      skipReleaseCreation: ${{parameters.skipReleaseCreation}}
      skipReleaseUpdate: ${{parameters.skipReleaseUpdate}}
      RELEASE_ENABLED_FLAG: ${{parameters.RELEASE_ENABLED_FLAG}}
      RELEASE_PREFETCH_FLAG: ${{parameters.RELEASE_PREFETCH_FLAG}}
      qa_environment: ${{parameters.qa_environment}}
      FEDERATED_MODULE_NAME: ${{parameters.FEDERATED_MODULE_NAME}}

  - ${{ if notIn(parameters.jira_id, '', 'none') }}:
    - template: /tech_products/rbqa/test-execution-stage/v3/pipeline_rbqa_testexecution_stage_cd_v3.0.yml@CodePlay
      parameters:
          jira_id: ${{ parameters.jira_id }}
          component_test_id: ${{ parameters.component_test_id }}
          test_environment: ${{ parameters.test_environment }}
          octane_workspace: ${{ parameters.octane_workspace }}
          octane_environment: ${{ parameters.octane_environment }}
          docker_image: ${{ parameters.docker_image }}
          framework: ${{ parameters.framework }}
