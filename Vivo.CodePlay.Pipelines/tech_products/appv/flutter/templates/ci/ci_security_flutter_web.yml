parameters:
- name: fortifyExclusionRepository

stages:
- stage: security
  displayName: "Security"
  dependsOn:
  - build_test
  pool: $(PRIVATE_AGENT_SHARED)
  jobs:
  - job: app_config_keys
    displayName: "Get AppSec Config Keys"
    steps:

    - bash: | 
        echo "##[debug] APP CONFIG ENABLED.............: $(APP_CONFIGURATION_ENABLED)"
        echo "##[debug] APP CONFIG SUBSCRIPTION........: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)"
        echo "##[debug] APP CONFIG ENDPOINT............: $(APP_CONFIGURATIN_ENDPOINT)"
      displayName: "App Configuration Info"

    - bash: |
        source ~/.bashrc
        
        REPO_ID="`echo $(Build.Repository.ID) | tr '-' '_'`"
        REPO_NAME="$(Build.Repository.Name)"
        TEAM_PROJECT_NAME="$(System.TeamProject)"
        TEAM_PROJECT_ID="`echo $(System.TeamProjectId) | tr '-' '_'`"
        
        LABEL_GLOBAL="GLOBAL"
        KEY_GLOBAL_FORTIFY=$(echo "fortify" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_GLOBAL_DEPENDENCY_TRACK=$(echo "dependency_track" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_GLOBAL_CONVISO=$(echo "conviso" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_GLOBAL_CHECKMARX=$(echo "checkmarx" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_GLOBAL_SKIP_SECURITY_GATE=$(echo "skip_security_gate" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_GLOBAL_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca" | awk 'BEGIN { getline; print toupper($0) }')
        
        LABEL_PROJECT="$TEAM_PROJECT_NAME"
        KEY_PROJECT_FORTIFY=$(echo "fortify_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_PROJECT_DEPENDENCY_TRACK=$(echo "dependency_track_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_PROJECT_CONVISO=$(echo "conviso_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_PROJECT_CHECKMARX=$(echo "checkmarx_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_PROJECT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_PROJECT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
        
        LABEL_COMPONENT="$TEAM_PROJECT_NAME/$REPO_NAME"
        KEY_COMPONENT_FORTIFY=$(echo "fortify_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_COMPONENT_DEPENDENCY_TRACK=$(echo "dependency_track_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_COMPONENT_CONVISO=$(echo "conviso_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_COMPONENT_CHECKMARX=$(echo "checkmarx_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_COMPONENT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
        KEY_COMPONENT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')

        echo "##[debug] LABEL_GLOBAL.........................: $LABEL_GLOBAL"
        echo "##[debug] KEY_GLOBAL_FORTIFY...................: $KEY_GLOBAL_FORTIFY"
        echo "##[debug] KEY_GLOBAL_DEPENDENCY_TRACK..........: $KEY_GLOBAL_DEPENDENCY_TRACK"
        echo "##[debug] KEY_GLOBAL_CONVISO...................: $KEY_GLOBAL_CONVISO"
        echo "##[debug] KEY_GLOBAL_CHECKMARX.................: $KEY_GLOBAL_CHECKMARX"
        echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE........: $KEY_GLOBAL_SKIP_SECURITY_GATE"
        echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE_SCA....: $KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"
        echo ""
        
        echo "##[debug] LABEL_PROJECT........................: $LABEL_PROJECT"
        echo "##[debug] KEY_PROJECT_FORTIFY..................: $KEY_PROJECT_FORTIFY"
        echo "##[debug] KEY_PROJECT_DEPENDENCY_TRACK.........: $KEY_PROJECT_DEPENDENCY_TRACK"
        echo "##[debug] KEY_PROJECT_CONVISO..................: $KEY_PROJECT_CONVISO"
        echo "##[debug] KEY_PROJECT_CHECKMARX................: $KEY_PROJECT_CHECKMARX"
        echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE.......: $KEY_PROJECT_SKIP_SECURITY_GATE"
        echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE_SCA...: $KEY_PROJECT_SKIP_SECURITY_GATE_SCA"
        echo ""
        
        echo "##[debug] LABEL_COMPONENT......................: $LABEL_COMPONENT"
        echo "##[debug] KEY_COMPONENT_FORTIFY................: $KEY_COMPONENT_FORTIFY"
        echo "##[debug] KEY_COMPONENT_DEPENDENCY_TRACK.......: $KEY_COMPONENT_DEPENDENCY_TRACK"
        echo "##[debug] KEY_COMPONENT_CONVISO................: $KEY_COMPONENT_CONVISO"
        echo "##[debug] KEY_COMPONENT_CHECKMARX..............: $KEY_COMPONENT_CHECKMARX"
        echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE.....: $KEY_COMPONENT_SKIP_SECURITY_GATE"
        echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE_SCA.: $KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
        echo ""
        
        echo "##vso[task.setvariable variable=OUT_LABEL_GLOBAL]$LABEL_GLOBAL"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_FORTIFY]$KEY_GLOBAL_FORTIFY"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_DEPENDENCY_TRACK]$KEY_GLOBAL_DEPENDENCY_TRACK"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CONVISO]$KEY_GLOBAL_CONVISO"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CHECKMARX]$KEY_GLOBAL_CHECKMARX"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE]$KEY_GLOBAL_SKIP_SECURITY_GATE"
        echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA]$KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"
        
        echo "##vso[task.setvariable variable=OUT_LABEL_PROJECT]$LABEL_PROJECT"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_FORTIFY]$KEY_PROJECT_FORTIFY"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_DEPENDENCY_TRACK]$KEY_PROJECT_DEPENDENCY_TRACK"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CONVISO]$KEY_PROJECT_CONVISO"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CHECKMARX]$KEY_PROJECT_CHECKMARX"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE]$KEY_PROJECT_SKIP_SECURITY_GATE"
        echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA]$KEY_PROJECT_SKIP_SECURITY_GATE_SCA"
        
        echo "##vso[task.setvariable variable=OUT_LABEL_COMPONENT]$LABEL_COMPONENT"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_FORTIFY]$KEY_COMPONENT_FORTIFY"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_DEPENDENCY_TRACK]$KEY_COMPONENT_DEPENDENCY_TRACK"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CONVISO]$KEY_COMPONENT_CONVISO"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CHECKMARX]$KEY_COMPONENT_CHECKMARX"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE]$KEY_COMPONENT_SKIP_SECURITY_GATE"
        echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA]$KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
      
      condition: and( succeeded(), eq(variables['APP_CONFIGURATION_ENABLED'], 'true') )
      displayName: 'Generate app configuration keys'

    - task: AzureAppConfiguration.azure-app-configuration-task.custom-build-release-task.AzureAppConfiguration@6
      displayName: 'Download app configuration keys'
      condition: and( succeeded(), eq(variables['APP_CONFIGURATION_ENABLED'], 'true') )
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        Label: '$(OUT_LABEL_GLOBAL),$(OUT_LABEL_PROJECT),$(OUT_LABEL_COMPONENT)'
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    - bash: |
        source ~/.bashrc
        
        get_app_configuration_key() {
            VAR_NAME="$1";
            DEFAULT_VALUE="$2"
            eval VAR_VALUE="\$$VAR_NAME";
            [ -z "$VAR_VALUE" ] && echo "$DEFAULT_VALUE" || echo "$VAR_VALUE"
        }
        
        GLOBAL_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_FORTIFY "true"`
        GLOBAL_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_DEPENDENCY_TRACK "true"`
        GLOBAL_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CONVISO "true"`
        GLOBAL_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CHECKMARX "false"`
        GLOBAL_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE "false"`
        GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA "false"`
        
        PROJECT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_FORTIFY "true"`
        PROJECT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_DEPENDENCY_TRACK "true"`
        PROJECT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CONVISO "true"`
        PROJECT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CHECKMARX "false"`
        PROJECT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE "false"`
        PROJECT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA "false"`
        
        COMPONENT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_FORTIFY "true"`
        COMPONENT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_DEPENDENCY_TRACK "true"`
        COMPONENT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CONVISO "true"`
        COMPONENT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CHECKMARX "false"`
        COMPONENT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE "false"`
        COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA "true"`

        echo "##[debug] GLOBAL VARIABLES"
        echo "##[debug] OUT_KEY_GLOBAL_FORTIFY.................: $GLOBAL_FORTIFY_VALUE"
        echo "##[debug] OUT_KEY_GLOBAL_DEPENDENCY_TRACK........: $GLOBAL_DEPENDENCY_TRACK_VALUE"
        echo "##[debug] OUT_KEY_GLOBAL_CONVISO.................: $GLOBAL_CONVISO_VALUE"
        echo "##[debug] OUT_KEY_GLOBAL_CHECKMARX...............: $GLOBAL_CHECKMARX_VALUE"
        echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE......: $GLOBAL_SKIP_SECURITY_GATE_VALUE"
        echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA..: $GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE"
        echo ""
        
        echo "##[debug] PROJECT VARIABLES"
        echo "##[debug] OUT_KEY_PROJECT_FORTIFY................: $PROJECT_FORTIFY_VALUE"
        echo "##[debug] OUT_KEY_PROJECT_DEPENDENCY_TRACK.......: $PROJECT_DEPENDENCY_TRACK_VALUE"
        echo "##[debug] OUT_KEY_PROJECT_CONVISO................: $PROJECT_CONVISO_VALUE"
        echo "##[debug] OUT_KEY_PROJECT_CHECKMARX..............: $PROJECT_CHECKMARX_VALUE"
        echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE.....: $PROJECT_SKIP_SECURITY_GATE_VALUE"
        echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA.: $PROJECT_SKIP_SECURITY_GATE_SCA_VALUE"
        echo ""
        
        echo "##[debug] COMPONENT VARIABLES"
        echo "##[debug] OUT_KEY_COMPONENT_FORTIFY................: $COMPONENT_FORTIFY_VALUE"
        echo "##[debug] OUT_KEY_COMPONENT_DEPENDENCY_TRACK.......: $COMPONENT_DEPENDENCY_TRACK_VALUE"
        echo "##[debug] OUT_KEY_COMPONENT_CONVISO................: $COMPONENT_CONVISO_VALUE"
        echo "##[debug] OUT_KEY_COMPONENT_CHECKMARX..............: $COMPONENT_CHECKMARX_VALUE"
        echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE.....: $COMPONENT_SKIP_SECURITY_GATE_VALUE"
        echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA.: $COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE"
        echo ""
        
        cat <<EOF > ${AGENT_TEMPDIRECTORY}/app_config_vars.json
        {
          "items": [
            {"key": "$OUT_KEY_GLOBAL_FORTIFY","value": "$GLOBAL_FORTIFY_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_GLOBAL_DEPENDENCY_TRACK","value": "$GLOBAL_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_GLOBAL_CONVISO","value": "$GLOBAL_CONVISO_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_GLOBAL_CHECKMARX","value": "$GLOBAL_CHECKMARX_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE","value": "$GLOBAL_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA","value": "$GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_FORTIFY", "value": "$PROJECT_FORTIFY_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_DEPENDENCY_TRACK", "value": "$PROJECT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_CONVISO","value": "$PROJECT_CONVISO_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_CHECKMARX","value": "$PROJECT_CHECKMARX_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE","value": "$PROJECT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA","value": "$PROJECT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_FORTIFY","value": "$COMPONENT_FORTIFY_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_DEPENDENCY_TRACK","value": "$COMPONENT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_CONVISO","value": "$COMPONENT_CONVISO_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_CHECKMARX","value": "$COMPONENT_CHECKMARX_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE","value": "$COMPONENT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
            {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA","value": "$COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}}
          ]
        }
        EOF
        echo "##[debug] JSON FILE: app_config_vars.json"
        cat ${AGENT_TEMPDIRECTORY}/app_config_vars.json

      condition: and( succeeded(), eq(variables['APP_CONFIGURATION_ENABLED'], 'true') )
      displayName: 'Validate app configuration keys'

    - task: AzureAppConfiguration.azure-app-configuration-task-push.custom-build-release-task.AzureAppConfigurationPush@6
      displayName: 'Push app configuration keys'
      condition: and( succeeded(), eq(variables['APP_CONFIGURATION_ENABLED'], 'true') )
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        ConfigurationFile: '$(Agent.TempDirectory)/app_config_vars.json'
        FileContentProfile: appconfig/kvset
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    - bash: |
        source ~/.bashrc
        
        getvar() {
            VAR_NAME="$1"; 
            eval VAR_VALUE="\$$VAR_NAME"; 
            [ -z "$VAR_VALUE" ] && echo "false" || echo "$VAR_VALUE"
        }
        
        USE_FORTIFY=false
        USE_DEPENDENCY_TRACK=false
        USE_CONVISO=false
        USE_CHECKMARX=false
        SKIP_GATE=false
        SKIP_GATE_SCA=false
        USE_APPCONFIG="$(APP_CONFIGURATION_ENABLED)"
        
        if [ "$USE_APPCONFIG" = "true" ]; then
          
          # FORTIFY SETTING
          FORTIFY_GLOBAL="$(getvar $OUT_KEY_GLOBAL_FORTIFY)"
          FORITFY_PROJECT="$(getvar "$OUT_KEY_PROJECT_FORTIFY" )"
          FORTIFY_COMPONENT="$(getvar $OUT_KEY_COMPONENT_FORTIFY)"
          if [ "$FORTIFY_GLOBAL" = "true" ] && [ "$FORITFY_PROJECT" = "true" ] && [ "$FORTIFY_COMPONENT" = "true" ]; then
              USE_FORTIFY=true
          fi
          
          # DEPENDENCY_TRACK SETTING
          DEPENDENCY_TRACK_GLOBAL="$(getvar $OUT_KEY_GLOBAL_DEPENDENCY_TRACK)"
          DEPENDENCY_TRACK_PROJECT="$(getvar "$OUT_KEY_PROJECT_DEPENDENCY_TRACK" )"
          DEPENDENCY_TRACK_COMPONENT="$(getvar $OUT_KEY_COMPONENT_DEPENDENCY_TRACK)"
          if [ "$DEPENDENCY_TRACK_GLOBAL" = "true" ] && [ "$DEPENDENCY_TRACK_PROJECT" = "true" ] && [ "$DEPENDENCY_TRACK_COMPONENT" = "true" ]; then
              USE_DEPENDENCY_TRACK=true
          fi

          # CONVISO SETTING
          CONVISO_GLOBAL="$(getvar $OUT_KEY_GLOBAL_CONVISO)"
          CONVISO_PROJECT="$(getvar $OUT_KEY_PROJECT_CONVISO)"
          CONVISO_COMPONENT="$(getvar $OUT_KEY_COMPONENT_CONVISO)"
          if [ "$CONVISO_GLOBAL" = "true" ] && [ "$CONVISO_PROJECT" = "true" ] && [ "$CONVISO_COMPONENT" = "true" ]  && [ "$USE_FORTIFY" = "true" ]; then
              USE_CONVISO=true
          fi
          
          # CHECKMARX SETTING
          CHECKMARX_GLOBAL="$(getvar $OUT_KEY_GLOBAL_CHECKMARX)"
          CHECKMARX_PROJECT="$(getvar $OUT_KEY_PROJECT_CHECKMARX)"
          CHECKMARX_COMPONENT="$(getvar $OUT_KEY_COMPONENT_CHECKMARX)"
          if [ "$CHECKMARX_GLOBAL" = "true" ] && [ "$CHECKMARX_PROJECT" = "true" ] && [ "$CHECKMARX_COMPONENT" = "true" ]; then
              USE_CHECKMARX=true
              USE_FORTIFY=false
              USE_CONVISO=false
          fi

          # SKIP_SECURITY_GATE SETTING
          SKIP_SECURITY_GATE_GLOBAL="$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE)"
          SKIP_SECURITY_GATE_PROJECT="$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE)"
          SKIP_SECURITY_GATE_COMPONENT="$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE)"
          if [ "$SKIP_SECURITY_GATE_GLOBAL" = "true" ] || [ "$SKIP_SECURITY_GATE_PROJECT" = "true" ] || [ "$SKIP_SECURITY_GATE_COMPONENT" = "true" ]; then
              SKIP_GATE=true
          fi

          # SKIP_SECURITY_GATE_SCA SETTING
          SKIP_SECURITY_GATE_SCA_GLOBAL="$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA)"
          SKIP_SECURITY_GATE_SCA_PROJECT="$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA)"
          SKIP_SECURITY_GATE_SCA_COMPONENT="$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA)"
          if [ "$SKIP_SECURITY_GATE_SCA_GLOBAL" = "true" ] || [ "$SKIP_SECURITY_GATE_SCA_PROJECT" = "true" ] || [ "$SKIP_SECURITY_GATE_SCA_COMPONENT" = "true" ]; then
              SKIP_GATE_SCA=true
          fi

          echo "##[debug] GLOBAL VARIABLES ###########################################"
          echo "##[debug] FORTIFY_GLOBAL................: $FORTIFY_GLOBAL"
          echo "##[debug] DEPENDENCY_TRACK_GLOBAL.......: $DEPENDENCY_TRACK_GLOBAL"
          echo "##[debug] CONVISO_GLOBAL................: $CONVISO_GLOBAL"
          echo "##[debug] CHECKMARX_GLOBAL..............: $CHECKMARX_GLOBAL"
          echo "##[debug] SKIP_SECURITY_GATE_GLOBAL.....: $SKIP_SECURITY_GATE_GLOBAL"
          echo "##[debug] SKIP_SECURITY_GATE_SCA_GLOBAL.: $SKIP_SECURITY_GATE_SCA_GLOBAL"
          echo ""
          
          echo "##[debug] PROJECT VARIABLES ###########################################"
          echo "##[debug] FORITFY_PROJECT................: $FORITFY_PROJECT"
          echo "##[debug] DEPENDENCY_TRACK_PROJECT.......: $DEPENDENCY_TRACK_PROJECT"
          echo "##[debug] CONVISO_PROJECT................: $CONVISO_PROJECT"
          echo "##[debug] CHECKMARX_PROJECT..............: $CHECKMARX_PROJECT"
          echo "##[debug] SKIP_SECURITY_GATE_PROJECT.....: $SKIP_SECURITY_GATE_PROJECT"
          echo "##[debug] SKIP_SECURITY_GATE_SCA_PROJECT.: $SKIP_SECURITY_GATE_SCA_PROJECT"
          echo ""
          
          echo "##[debug] COMPONENT VARIABLES #########################################"
          echo "##[debug] FORTIFY_COMPONENT.............: $FORTIFY_COMPONENT"
          echo "##[debug] DEPENDENCY_TRACK_COMPONENT.......: $DEPENDENCY_TRACK_COMPONENT"
          echo "##[debug] CONVISO_COMPONENT.............: $CONVISO_COMPONENT"
          echo "##[debug] CHECKMARX_COMPONENT...........: $CHECKMARX_COMPONENT"
          echo "##[debug] SKIP_SECURITY_GATE_COMPONENT..: $SKIP_SECURITY_GATE_COMPONENT"
          echo "##[debug] SKIP_SECURITY_GATE_SCA_COMPONENT.: $SKIP_SECURITY_GATE_SCA_COMPONENT"
          echo ""
          
          echo "##[debug] USE_FORTIFY............: $USE_FORTIFY"
          echo "##[debug] USE_DEPENDENCY_TRACK...: $USE_DEPENDENCY_TRACK"
          echo "##[debug] USE_CONVISO............: $USE_CONVISO"
          echo "##[debug] USE_CHECKMARX..........: $USE_CHECKMARX"
          echo "##[debug] SKIP_SECURITY_GATE.....: $SKIP_GATE"
          echo "##[debug] SKIP_SECURITY_GATE_SCA.: $SKIP_GATE_SCA"
          echo ""
        else
          USE_FORTIFY="false"
          USE_DEPENDENCY_TRACK="false"
          USE_CONVISO="false"
          USE_CHECKMARX="$(USE_CHECKMARX)"
          SKIP_GATE="$(SKIP_SECURITY_GATE)"
          SKIP_GATE_SCA="$(SKIP_SECURITY_GATE_SCA)"

          SKIP_SECURITY="$(skip_security)"
          SKIP_FORTIFY_GATE="$(skip_fortify_gate)"
          SKIP_CONVISO_SECURITY_GATE="$(SKIP_CONVISO_SECURITY_GATE)"

          if [ "$SKIP_SECURITY" != "true" ]; then

            if [ "$SKIP_FORTIFY_GATE" != 'true' ]; then
              USE_FORTIFY="true"
            fi

            if [ "$SKIP_CONVISO_SECURITY_GATE" != 'true' ]; then
              USE_CONVISO="true"
            fi

            if [ "$USE_CHECKMARX" = 'true' ]; then
              USE_FORTIFY="false"
              USE_CONVISO="false"
            fi
          else
            USE_CHECKMARX="false"
          fi

          echo "##[debug] SKIP_SECURITY...............: $SKIP_SECURITY"
          echo "##[debug] SKIP_FORTIFY_GATE...........: $SKIP_FORTIFY_GATE"
          echo "##[debug] SKIP_CONVISO_SECURITY_GATE..: $SKIP_CONVISO_SECURITY_GATE"
          echo ""

          echo "##[debug] USE_FORTIFY............: $USE_FORTIFY"
          echo "##[debug] USE_DEPENDENCY_TRACK...: $USE_DEPENDENCY_TRACK"
          echo "##[debug] USE_CONVISO............: $USE_CONVISO"
          echo "##[debug] USE_CHECKMARX..........: $USE_CHECKMARX"
          echo "##[debug] SKIP_SECURITY_GATE.....: $SKIP_GATE"
          echo "##[debug] SKIP_SECURITY_GATE_SCA.: $SKIP_GATE_SCA"
          echo ""
        fi

        echo "##vso[task.setvariable variable=USE_FORTIFY;isOutput=true;]$USE_FORTIFY"
        echo "##vso[task.setvariable variable=USE_DEPENDENCY_TRACK;isOutput=true;]$USE_DEPENDENCY_TRACK"
        echo "##vso[task.setvariable variable=USE_CONVISO;isOutput=true;]$USE_CONVISO"
        echo "##vso[task.setvariable variable=USE_CHECKMARX;isOutput=true;]$USE_CHECKMARX"
        echo "##vso[task.setvariable variable=SKIP_SECURITY_GATE;isOutput=true;]$SKIP_GATE"
        echo "##vso[task.setvariable variable=SKIP_SECURITY_GATE_SCA;isOutput=true;]$SKIP_GATE_SCA"

      condition: succeeded()
      displayName: 'Evaluate security flags'
      name: evaluate_flags


  - job: sast_scan
    displayName: "SAST Scan"
    dependsOn: 
    - app_config_keys
    variables:
      USE_FORTIFY: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_FORTIFY'] ]          
      USE_DEPENDENCY_TRACK: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]          
      USE_CONVISO: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]          
      USE_CHECKMARX: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CHECKMARX'] ]          
      SKIP_SECURITY_GATE: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]          
      SKIP_SECURITY_GATE_SCA: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]          
    condition: |
               and(
                  succeeded(),
                  eq(variables.USE_FORTIFY, 'true')
                )
    steps:

    ## -> Taks the explain this job
    - task: Bash@3
      displayName: 'About the Job'
      inputs:
        targetType: inline
        script: |

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'

          printf "
          =================================================================================================================================
          ${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME}
          =================================================================================================================================

          ${YELLOW}The objective of this stage is to assess whether there are vulnerabilities in the source code of this application..
          ${YELLOW}If you have any questions about this phase of the pipeline, access the documentation https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659

          ================================================================================================================================="

    ## -> Checkout FortifyExclusion repository
    - checkout: ${{ parameters.fortifyExclusionRepository }}
      path: 'fortify-exclusions'
      fetchDepth: 1

    ## -> Checkout project
    - checkout: self
      fetchDepth: 1

    ## -> Setup FORTIFY exclusions
    - task: Bash@3
      displayName: 'Setup FORTIFY Exclusions'
      name: fortify_exclusions
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          fortifyRepositoryTech="${APP_LANGUAGE}"
          projectName="${SYSTEM_TEAMPROJECT}"
          repositoryName="$(Build.Repository.Name)"
          excludeFileParam=""
          excludel=""

          # Workaround to avoid interpreting wildcards as disk paths
          mkdir -p $(Pipeline.Workspace)/fortify-exclusions/tmp
          cd $(Pipeline.Workspace)/fortify-exclusions/tmp

          json=$(jq -c '.' < $(Pipeline.Workspace)/fortify-exclusions/${FORTIFY_EXCLUSION_FILE})

          ## -> Search exclusions based on (PROJECT/REPOSITORY)
          echo "##[debug] Search exclusions based on (PROJECT/REPOSITORY)..."
          excludeList=$(echo "$json" | jq -r --arg projectName "${projectName:-0}" --arg repositoryName "${repositoryName:-0}" '.[$projectName + "/" + $repositoryName]')

          if [ "$excludeList" != "null" ]; then
            excludel=($(grep -oE '\S+' <<< "$excludeList"))
            echo "##[debug] EXCLUSION KEY: ${projectName}/${repositoryName}"
          else
            ## -> Search exclusions based on technology (got from catalog-info)
            echo "##[debug] Exclusion list not found, searching based on technology ${fortifyRepositoryTech} ..."
            if [[ -n "$fortifyRepositoryTech" && "$fortifyRepositoryTech" != "null" ]]; then
              repository_type=$fortifyRepositoryTech
              query_origin="Library"
              excludeList=$(echo "$json" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')
              excludel=($(grep -oE '\S+' <<< "$excludeList"))
              echo "##[debug] EXCLUSION KEY: ${repository_type} (FROM: $query_origin)"
            fi
          fi

          ## -> Validade Exclusion Query
          if [[ -n "$excludel" && "$excludel" != "null" ]]; then
              echo "##[debug] Will be excluded from FORTIFY scan:"
            for arg in "${excludel[@]}"; do
              excludeFileParam+="-exclude \"${arg}\" "
              echo "[Excluded]: $arg"
            done
          else
            echo "##[debug] None of the keys were found in the exclusions files."
            echo "##[debug] Keys: ${projectName}/${repositoryName}, ${repository_type}"
          fi
 
    ## -> Download Security Tokens
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Security Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, CONVISO-API-KEY'

    ## -> Defines the version name for the scan
    - task: Bash@3
      displayName: 'Defining App Version'
      name: scan_version_name
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          appVersion="$(FORTIFY_APP_DEFAULT_VERSION)"

          echo "##vso[task.setvariable variable=FORTIFY_APP_VERSION]$appVersion"
          echo "##[debug] FORTIFY_APP_VERSION: $appVersion."

     ## -> Search FORTIFY Project/Project Version ID
    - task: Bash@3
      displayName: 'Search FORTIFY Project/Project Version ID'
      name: search_fortify_project
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          fortifyAppDefaultName=$(echo $(FORTIFY_APP_DEFAULT_NAME) | sed 's/ /%20/g')
          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)
          echo "##[debug] Search FORTIFY project for $(FORTIFY_APP_DEFAULT_NAME)"

          requestQuery="project.name:$fortifyAppDefaultName"
          requestParams="fields=id,name,project&q=$requestQuery"

          response=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X GET "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions?$requestParams" \
          --header 'Accept: application/json' \
          --header "Authorization: FortifyToken $fortifyToken")

          echo "##[debug] Response....: $response"

          projectId=$(echo $response | jq -r '.data[0].project.id // ""')
          projectVersionId=$(echo $response | jq '.data[] | select(.name == "'$(FORTIFY_APP_VERSION)'") | .id')

          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_ID]$projectId"
          echo "##[debug] FORTIFY_PROJECT_ID: $projectId."

          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_VERSION_ID]$projectVersionId"
          echo "##[debug] FORTIFY_PROJECT_VERSION_ID: $projectVersionId."

     ## -> Create Fortify Project/Project Version
    - task: Bash@3
      displayName: 'Create FORTIFY Project/Project Version ID'
      name: create_fortify_project
      condition: and(
        succeeded(),
        eq(variables.FORTIFY_PROJECT_VERSION_ID, ''))
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          ## -> If the Project already exists, it will only be necessary to create the version
          if [[ -n "$(FORTIFY_PROJECT_ID)" ]]; then
            echo "##[debug] Project already exists, creating Project Version Id..."
            requestBodyProject='{ "id": $(FORTIFY_PROJECT_ID) }'
          else
            echo "##[debug] Creating both Project and Project Version Id..."
            requestBodyProject='{
              "name": "$(FORTIFY_APP_DEFAULT_NAME)",
              "issueTemplateId": "Prioritized-HighRisk-Project-Template"
            }'
          fi

          requestData='{
            "name": "'$(FORTIFY_APP_VERSION)'",
            "issueTemplateId": "Prioritized-HighRisk-Project-Template",
            "project": '$requestBodyProject'
          }'

          responseProject=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X POST "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data "$requestData")

          projectVersionId=$(echo $responseProject | jq .data.id)
          projectId=$(echo $responseProject | jq .data.project.id)

          if [[ -n $projectVersionId ]]; then
            echo "##[debug] Success while creating both Project and Project Version Id..."

            echo "##vso[task.setvariable variable=FORTIFY_PROJECT_ID]$projectId"
            echo "##[debug] FORTIFY_PROJECT_ID: $projectId."

            echo "##vso[task.setvariable variable=FORTIFY_PROJECT_VERSION_ID]$projectVersionId"
            echo "##[debug] FORTIFY_PROJECT_VERSION_ID: $projectVersionId."

          else
            echo "##[error] Error while creating both Project and Project Version Id..."
            echo $responseProject | jq .message
            exit -1
          fi

