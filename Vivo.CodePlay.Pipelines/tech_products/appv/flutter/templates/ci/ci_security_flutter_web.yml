    ## -> Prepare FORTIFY Project Version Fields
    - task: Bash@3
      displayName: 'Prepare Fortify Project Version Fields'
      name: prepare_fortify
      condition: succeeded()
      continueOnError: false
      env:
        FORTIFY_ATTRIBUTES_FILE_NAME: "fortify-attributes"
      inputs:
        targetType: inline
        script: |

          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          # Export the fortify project id to use in convisio job
          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_VERSION_ID;isoutput=true]$(FORTIFY_PROJECT_VERSION_ID)"

          echo "##[debug] Adding/updating attributes in the Project Version."
          response=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X PUT "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/attributes" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data @${FORTIFY_ATTRIBUTES_FILE_NAME})

          counter=$(echo $response | jq .count)
          echo "##[debug] Added/updated attributes. Total: $counter"

          echo "##[debug] Updating 'committed' field..."
          reponseUpdate=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X PUT "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data '{"committed": true}')

          commitedProjectVersionId=$(echo $reponseUpdate | jq .data.id)
          if [[ -n "$commitedProjectVersionId" ]]; then
            echo "##[debug] Project Version 'committed' field updated."
          else
            echo "##[error] Error while updating Project Version 'committed' field."
            echo $reponseUpdate | jq .message
            exit 1;
          fi

    ## -> Run FORTIFY
    - task: Bash@3
      displayName: 'Run Fortify SAST (client)'
      name: run_fortify
      condition: succeeded()
      continueOnError: false
      env:
        ASDF_JAVA_VERSION: "openjdk-17.0.2"
      inputs:
        targetType: inline
        script: |

          echo "##[debug] Running FORTIFY scan with local ScanCentral Client version $(FORTIFY_LOCAL_SCANCENTRAL_VERSION)..."

          scancentralCMD=$(FORTIFY_LOCAL_SCANCENTRAL_PATH)$(FORTIFY_LOCAL_SCANCENTRAL_VERSION)$(FORTIFY_LOCAL_SCANCENTRAL_SCRIPT)

          echo "##[command] $scancentralCMD"
          echo "##[debug] FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT...: $(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT)"
          echo "##[debug] FORTIFY_SSC_ENDPOINT......................: $(FORTIFY_SSC_ENDPOINT)"
          echo "##[debug] EXCLUDE_FILE_PARAM........................: $(EXCLUDE_FILE_PARAM)"
          echo "##[debug] FORTIFY_APP_DEFAULT_NAME..................: $(FORTIFY_APP_DEFAULT_NAME)"
          echo "##[debug] FORTIFY_APP_VERSION.......................: $(FORTIFY_APP_VERSION)"

          $scancentralCMD -url $(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT) -sscurl $(FORTIFY_SSC_ENDPOINT) \
          -ssctoken $(FORTIFY-SSC-CLI-TOKEN) \
          start $(EXCLUDE_FILE_PARAM) -bt none -upload -block \
          --log-file "$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log" --overwrite \
          --application "$(FORTIFY_APP_DEFAULT_NAME)" --application-version "$(FORTIFY_APP_VERSION)" \
          -uptoken $(FORTIFY-SSC-CLI-TOKEN)

          if [ $? -eq 0 ]; then
            echo "##[debug] Fortify scan completed successfully."
          else
            echo "##vso[task.logissue type=error;] Fortify scan exited with errors."
            echo "##vso[task.complete result=Failed;]"
          fi

    ## -> Publish Scan log
    - task: PublishPipelineArtifact@1
      displayName: "Publish Scan log"
      inputs:
        targetPath: "$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log"
        artifactName: "fortify-log-$(System.JobAttempt)"
        publishLocation: pipeline

    ## -> Get Fortify Report
    - task: Bash@3
      displayName: 'Get Fortify Report'
      name: process_report
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          i="0"
          retries="10"
          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          echo "##[debug] Waiting for FORTIFY to process the report..."

          while [[ $i -lt $retries ]]
          do
            sleep 30s
            responseArtifact=$(curl --cacert $(CACORP_LOCATION) -s -g \
            -X GET "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/artifacts?limit=1" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: FortifyToken $fortifyToken")

            status=$(echo $responseArtifact | jq -r .data[0].status)
            echo "##[debug] Process status: $status"

            if [[ "$status" == "REQUIRE_AUTH" ]]; then
                echo "##vso[task.logissue type=error] There is a pending approval on the Fortify portal. To proceed with approval, contact AppSec by email (appsec_vivo.br@telefonica.com)"
                exit 1;
            elif [[ "$status" == "PROCESS_COMPLETE" ]]; then
                echo "##[debug] Process complete!"
                break
            fi

            i=$[$i+1]

          done

          echo "##[debug] Get FORTIFY report result "

          responseIssues=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X GET "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/issues?orderby=id" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken")

          ## -> Export the fortify response vulnerabilities to an file
          fortifyVulnerabilitiesFileName="$(Build.Repository.Name)_fortify_vulnerabilities-$(System.JobAttempt).json"
          echo "##vso[task.setvariable variable=FORTIFY_VULNERABILITIES_FILE;]$fortifyVulnerabilitiesFileName"
          echo $responseIssues > "$fortifyVulnerabilitiesFileName"

          issueCount=$(echo $responseIssues | jq --raw-output '.data | map({"prioridade": .enginePriority, "avaliado": .issueStatus, "situacoes": .primaryTag, "count": 1})')

          ## -> Variables for not reviewed vulnerabilities
          criticalNotReviewed=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and .avaliado == "Unreviewed")] | map(.count) | add // 0' || echo "0")
          highNotReviewed=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and .avaliado == "Unreviewed")] | map(.count) | add // 0' || echo "0")

          ## -> Variables for exploitable vulnerabilities
          criticalExploitable=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and .situacoes == "Exploitable")] | map(.count) | add // 0' || echo "0")
          highExploitable=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and .situacoes == "Exploitable")] | map(.count) | add // 0' || echo "0")

          ## -> Variables for Risk Accepted
          criticalRiskAccepted=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and .avaliado != "Unreviewed" and .situacoes != "Exploitable")] | map(.count) | add // 0' || echo "0")
          highRiskAccepted=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and .avaliado != "Unreviewed" and .situacoes != "Exploitable")] | map(.count) | add // 0' || echo "0")

          ## -> Variables for medium and low vulnerabilities
          medium=$(echo $issueCount | jq '[.[] | select(.prioridade == "Medium")] | map(.count) | add // 0' || echo "0")
          low=$(echo $issueCount | jq '[.[] | select(.prioridade == "Low")] | map(.count) | add // 0' || echo "0")

          totalVulnerabilities=$((criticalNotReviewed + highNotReviewed + criticalExploitable + highExploitable))

          if [[ $totalVulnerabilities -gt 0 ]]; then
            echo "##vso[task.logissue type=error;] Critical and/or high vulnerabilities were found in this project. Number of identified violations: ${totalVulnerabilities}"
          else
            echo "##[debug] No violations identified"
          fi

          echo ""
          echo "##[section]## Summary of Identified Vulnerabilities ##"

          echo "##[error]     CRITICAL.................: $((criticalNotReviewed + criticalExploitable))"
          echo "##[warning]   CRITICAL RISK ACCEPTED...: $criticalRiskAccepted"
          echo "##[error]     HIGH.....................: $((highNotReviewed + highExploitable))"
          echo "##[warning]   HIGH RISK ACCEPTED.......: $highRiskAccepted"
          echo "##[warning]   MEDIUM...................: $medium"
          echo "##[debug]     LOW......................: $low"

          if [[ $totalVulnerabilities -gt 0 ]]; then
            echo ""
            echo "##[section]## List of Critical and Hight Violations ##"
            echo $responseIssues | jq -r '
              .data[] |
              select((.enginePriority == "High" or .enginePriority == "Critical") and
              (.primaryTag == "Exploitable" or .issueStatus == "Unreviewed")) |
              "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName + "[" + .issueStatus + " " + (.primaryTag) + "]"
            '
          fi

          if [[ $criticalRiskAccepted -gt 0 || $highRiskAccepted -gt 0 ]]; then
            echo ""
            echo "##[section]## List of Aceepted Risk of Critical and Hight Vulnerabilities ##"
            echo $responseIssues | jq -r '
              .data[] |
              select(
                (.enginePriority == "High" or .enginePriority == "Critical") and
                .primaryTag != "Exploitable" and
                .issueStatus != "Unreviewed"
              ) |
              "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName + "[" + .issueStatus + " " + (.primaryTag) + "]"
            '
          fi

          echo ""
          echo "##[section]## List of all Vulnerabilities ##"
          echo "##[group]  Click Here to see all Vulnerabilities"
          echo $responseIssues | jq -r '.data[] | "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName'
          echo "##[endgroup]"

          echo "##vso[task.setvariable variable=CRITICAL_VULNERABILITIES_EXPLOITABLE;isreadonly=true]$criticalExploitable"
          echo "##vso[task.setvariable variable=CRITICAL_VULNERABILITIES_NOT_REVIEWED;isreadonly=true]$criticalNotReviewed"
          echo "##vso[task.setvariable variable=HIGH_VULNERABILITIES_EXPLOITABLE;isreadonly=true]$highExploitable"
          echo "##vso[task.setvariable variable=HIGH_VULNERABILITIES_NOT_REVIEWED;isreadonly=true]$highNotReviewed"

    ## -> Publish Fortify Report
    - task: PublishPipelineArtifact@1
      displayName: "Publish Fortify Report"
      continueOnError: true
      inputs:
        targetPath: "$(FORTIFY_VULNERABILITIES_FILE)"
        artifactName: "fortify-vulnerabilities-report-$(System.JobAttempt)"
        publishLocation: pipeline

    ## -> Getting Conviso Association and Project IDs
    - task: Bash@3
      displayName: 'Conviso Associate'
      inputs:
        targetType: inline
        script: |
          useConviso=$(USE_CONVISO)
          convisoAppEndpoint="$(CONVISO_APP_ENDPOINT)"
          convisoApiKey="$(CONVISO-API-KEY)"
          proxyAgentHttps="$(PROXY_AGENT_HTTPS)"
          convisoCompanyId=$(CONVISO_COMPANY_ID)

          if [[ ! "${useConviso}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=warning;] The Conviso flag is disable."
          else
            sleep 5s

            echo "##[debug] CONVISO_COMPANY_ID...........: ${convisoCompanyId}"
            echo "##[debug] FORTIFY_PROJECT_VERSION_ID...: $(FORTIFY_PROJECT_VERSION_ID)"
            echo ""

            ## -> Check the conviso company id, remove the hardcoded
            RESPONSE=$(curl -s -S -g -X POST "${convisoAppEndpoint}/api/v2/integrations/scanners/fortify/associate_project" \
            --proxy "${proxyAgentHttps}" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${convisoApiKey}" \
            --data '{"company_id": '${convisoCompanyId}',"project_id": "'$(FORTIFY_PROJECT_VERSION_ID)'"}')

            associationId=$(echo $RESPONSE | jq .data.id)
            projectId=$(echo $RESPONSE | jq .data.project.id)
            assetId=$(echo $RESPONSE | jq -r .data.asset.id)

            echo "##vso[task.setvariable variable=CONVISO_PROJECT_ID]$projectId"
            echo "##[debug] The Conviso Projeto ID '${projectId}' stored in varible CONVISO_PROJECT_ID'."

            echo "##vso[task.setvariable variable=CONVISO_ASSOCIATION_ID]$associationId"
            echo "##[debug] The Association ID '${associationId}' between Conviso and Fortify stored in varible 'CONVISO_ASSOCIATION_ID'."

            echo "##vso[task.setvariable variable=CONVISO_ASSET_ID]$assetId"
            echo "##[debug] The Conviso Projeto Asset ID '${assetId}' stored in varible 'CONVISO_ASSET_ID'."

            ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')

            if [[ ! -z "$ERROR" ]]; then
              MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
              echo "##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
              else
              echo "##[debug] Conviso association passed successfully."
            fi
          fi

    ## -> Starting Conviso Synchronization and Getting Track Key / Asset ID
    - task: Bash@3
      displayName: 'Conviso Sync'
      inputs:
        targetType: inline
        script: |
          useConviso=$(USE_CONVISO)
          convisoAppEndpoint="$(CONVISO_APP_ENDPOINT)"
          proxyAgentHttps="$(PROXY_AGENT_HTTPS)"
          convisoCompanyId=$(CONVISO_COMPANY_ID)
          convisoApiKey="$(CONVISO-API-KEY)"
          convisoAssociationId=$(CONVISO_ASSOCIATION_ID)

          if [[ ! "${useConviso}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=warning;] The Conviso flag is disable."
          else

            echo "##[debug] CONVISO_COMPANY_ID...........: ${convisoCompanyId}"
            echo "##[debug] CONVISO_ASSOCIATION_ID.......: ${convisoAssociationId}"
            echo ""

            i="0"
            retries="3"
            while [[ $i -lt $retries ]]
            do

              RESPONSE=$(curl -s -S -g -X POST "${convisoAppEndpoint}/api/v2/integrations/scanners/fortify/synchronize" \
              --proxy "${proxyAgentHttps}" \
              --header 'Content-Type: application/json' \
              --header "x-api-key: ${convisoApiKey}" \
              --data '{"company_id": '${convisoCompanyId}',"integration_association_id": "'${convisoAssociationId}'"}')

              echo "Response: ${RESPONSE}"

              if [[ ! -z "$RESPONSE" ]]; then
                break
              fi
                echo "##[debug] Something unexpected happened. Trying to perform the synchronization again. Please wait..."
                sleep 5s
                i=$[$i+1]
            done

            trackKey=$(echo $RESPONSE | jq -r .data.job.track_key)
            assetId=$(echo $RESPONSE | jq -r .data.asset.id)

            echo "##[debug] Conviso Asset ID: ${assetId}"

            if [[ -z "$assetId" ]]; then
              echo "##vso[task.logissue type=error;] An error occurred while requesting Conviso API. Please, try running the pipeline again. If the error persists, contact the AppSec team on appsec_vivo.br@telefonica.com"
              exit
            fi

            echo "##[debug] Conviso synchronization initiated."

            ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')

            if [[ ! -z "$ERROR" ]]; then
              MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
              echo "##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
            else
              echo "The Conviso synchronization completed successfully."
              exit
            fi
          fi

    ## -> Evaluate SAST Security Gate
    - task: Bash@3
      displayName: 'Evaluate Security Gate'
      name: evaluate_security_gate
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          skipSecurityGate=$(SKIP_SECURITY_GATE)

          if [[ ! "${skipSecurityGate}" =~ ^(T|t)rue$ ]]; then

            ## -> Analyze Security Gate data
            declare -i criticalVulnerabilitiesExploitable=$(CRITICAL_VULNERABILITIES_EXPLOITABLE)
            declare -i criticalVulnerabilitiesNotReviewed=$(CRITICAL_VULNERABILITIES_NOT_REVIEWED)
            declare -i highVulnerabilitiesExploitable=$(HIGH_VULNERABILITIES_EXPLOITABLE)
            declare -i highVulnerabilitiesNotReviewed=$(HIGH_VULNERABILITIES_NOT_REVIEWED)

            totalVulnerabilities=$((criticalVulnerabilitiesExploitable + criticalVulnerabilitiesNotReviewed + highVulnerabilitiesExploitable + highVulnerabilitiesNotReviewed))

            if [[ $criticalVulnerabilitiesExploitable -gt 0 || $criticalVulnerabilitiesNotReviewed -gt 0 || $highVulnerabilitiesExploitable -gt 0 || $highVulnerabilitiesNotReviewed -gt 0 ]]; then
              echo "##[error] Security Gate was not reached due to the existence of $totalVulnerabilities Critical and/or High vulnerabilities!"
              echo "##vso[task.logissue type=error;] Security Gate failed! Check below or the publish report to see the violations."

              echo ""
              echo "##[section]## List of vulnerabilities that failed the Security Gate ##"
              cat "$(FORTIFY_VULNERABILITIES_FILE)" | jq -r '
                .data[] | select((.enginePriority == "High" or .enginePriority == "Critical")
                and (.primaryTag == "Exploitable" or .issueStatus == "Unreviewed")) |
                "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName + "[" + .issueStatus + " " + (.primaryTag) + "]"
              '

              echo "##vso[task.complete result=Failed;]"
              exit
            else
              echo "##[debug] Security Gate has been reached!"
            fi
          else
            echo "##vso[task.logissue type=warning;] Security Gate is OFF and Gate validation has been skipped! "
            echo "##[warning] Even if the Security Gate is turned off at the moment this does not mean that it cannot be turned on again in the near future."
            echo "##[warning] Please analyze the Critical and High vulnerabilities and try to fix them as soon as possible. "
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi

  - job: sca_scan
    displayName: "SCA Scan"
    dependsOn: 
    - app_config_keys
    variables:
      USE_DEPENDENCY_TRACK: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]          
      USE_CONVISO: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]          
    condition: |
               and(
                  succeeded(),
                  eq(variables.USE_DEPENDENCY_TRACK, 'true')
                )

    steps:

    ## -> Taks the explain this job
    - task: Bash@3
      displayName: 'About the Job'
      inputs:
        targetType: inline
        script: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'

          printf "
          =================================================================================================================================
          ${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME}
          =================================================================================================================================

          ${YELLOW}The objective of this stage is to evaluate if there are vulnerabilities in the dependencies and third-party libraries used in this application.
          ${YELLOW}It is under the responsibility of the AppSec team
          ${YELLOW}If you have any questions about this phase of the pipeline, please refer to the documentation at https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659

          ================================================================================================================================="

    ## -> Download Security Tokens
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Security Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'CONVISO-API-KEY, DEPENDENCY-TRACK-TOKEN'

    ## -> Generate the SBOM and upload it to Dependency-Track
    ## -> Begin of SCA scan tasks

    ## -> Syft Install
    - task: SyftInstall@1
      displayName: Install Syft
      inputs:
        mode: custom
        useCache: true
        version: 1.19.0

    ## -> Generates SBOM from Docker image    
    - task: GenerateSbomSyft@1
      displayName: 'Generating SBOM with Syft'
      inputs:
        useDockerImage: false
        reportPath: $(REPORT_PATH)
    
    ## -> Validates whether the image scan occurred normally and the SBOM was generated
    - task: Bash@3
      displayName: 'Validating SCAN'
      inputs:
        workingDirectory: '$(Build.SourcesDirectory)'
        targetType: inline
        script: |

          echo "##[debug] Project name: $(DT_APP_DEFAULT_NAME)"
          echo "##[debug] Project version: $(DT_APP_DEFAULT_VERSION)"          
          echo "##[debug] Report Path: $(REPORT_PATH)"

          if [ -e "$(REPORT_PATH)" ]; then
            echo "##[debug] Scan completed."
          else
            echo "##[debug] Scan fail."
            exit 1
          fi

    ## ->  Uploading SBOM to DT
    - task: UploadSbomDT@1
      name: upload_sbom
      displayName: 'Uploading SBOM to DT'
      inputs:
        projectName: '$(DT_APP_DEFAULT_NAME)'
        projectVersion: '$(DT_APP_DEFAULT_VERSION)'
        cacorpLocation: '$(CACORP_LOCATION)'
        dtScaEndpoint: '$(DT_SCA_ENDPOINT)'
        dtScaToken: '$(DEPENDENCY-TRACK-TOKEN)'
        reportPath: '$(REPORT_PATH)'
        sbomTokenVariable: 'SBOM_TOKEN'

    ## ->  Monitoring synchronization with DT
    - task: AnalysisSbomDT@1
      name: analysis_sbom
      displayName: 'Analysing SBOM'
      inputs:
        cacorpLocation: '$(CACORP_LOCATION)'
        dtScaEndpoint: '$(DT_SCA_ENDPOINT)'
        dtScaToken: '$(DEPENDENCY-TRACK-TOKEN)'
        sbomToken: $(upload_sbom.SBOM_TOKEN)
        maxAttempts: 20
        retryInterval: 15

    ## -> Getting project ID and parameters from Security Gate. 
    ## -> Critical and/or high new vulnerabilities should be equal to 0
    - task: GetProjectDT@1
      name: get_projetct_id
      displayName: 'Retriving project ID'
      inputs:
        projectName: '$(DT_APP_DEFAULT_NAME)'
        projectVersion: '$(DT_APP_DEFAULT_VERSION)'
        cacorpLocation: '$(CACORP_LOCATION)'
        dtScaEndpoint: '$(DT_SCA_ENDPOINT)'
        dtScaToken: '$(DEPENDENCY-TRACK-TOKEN)'
        projectIdVariable: 'PROJECT_ID'
        gateValidationVariable: 'GATE_VALIDATION'

    ## -> Retriving SBOM Token and Moving SBOM to Artifacts Directory
    - task: Bash@3
      displayName: 'Moving SBOM to Artifacts Staging Directory'
      inputs:
        targetType: inline
        script: |
          echo "##[debug] SBOM token: $(upload_sbom.SBOM_TOKEN)"
          mv $(REPORT_PATH) $(Build.ArtifactStagingDirectory)/  

    ## -> Publishing SBOM (Software Bill Of Materials)

    - task: PublishBuildArtifacts@1
      displayName: "Publishing SBOM"
      inputs:
        pathToPublish: "$(Build.ArtifactStagingDirectory)/$(REPORT_PATH)"
        artifactName: "sbom-docker"

    ## -> Results Sync With Conviso Platform

    - task: convisoAzureSyncTask@1
      displayName: "Conviso Sync"
      condition: eq(variables.USE_CONVISO, 'true')
      continueOnError: true
      inputs:
        API_KEY: "$(CONVISO-API-KEY)"
        PROJECT_ID: "$(get_projetct_id.PROJECT_ID)"
        INTEGRATION: "DEPENDENCY_TRACK"
        COMPANY_ID: "$(CONVISO_COMPANY_ID)"        

    ## -> Evaluate SCA Security Gate
    - task: Bash@3
      displayName: "Evaluate Security Gate"
      condition: eq(variables.SKIP_SECURITY_GATE_SCA, 'false')
      env:
        SKIP_SECURITY_GATE_SCA: $(SKIP_SECURITY_GATE_SCA)
        SG_BLOCK: "$(get_projetct_id.GATE_VALIDATION)"
      inputs:
        targetType: 'inline'
        script: |

          echo "##[debug] SKIP_SECURITY_GATE_SCA: ${SKIP_SECURITY_GATE_SCA}"
          echo "##[debug] SG_BLOCK: ${SG_BLOCK}"

          if [[ "${SG_BLOCK}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=error;] Security Gate failed because critical and high potential vulnerabilities were found by our security tools in the source code for this project. For more information."
            echo "##vso[task.logissue type=error;] Check Vivo Appsec team wiki in https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659 for more details."
            echo "##vso[task.complete result=Failed;]"
            exit
          fi
          
          echo "##[debug] No critical and high vulnerabilities were found that violate AppSec policies."
          echo "##[debug] For more information about the process, check Vivo Appsec team wiki in https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659."