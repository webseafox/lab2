parameters:
- name: bump_version
- name: bump_message

stages:

- stage: tag
  displayName: "DOC & TAG"   
  dependsOn:
  - build_test
  - gates
  - security
  pool: $(PRIVATE_AGENT_SHARED)
  jobs:
  - job: Tag
    displayName: "DOC & Version & TAG"
    condition: |
               and(
                  succeeded(),
                  in(variables['Build.SourceBranch'], 'refs/heads/master' )
                )    
    steps:
    
    - checkout: self
      persistCredentials: true
      fetchDepth: 0
      fetchTags: true
      clean: true

 
    # Set Flutter Env in Vivo Agent
    - task: FlutterEnv@0
      displayName: 'Flutter Env'
      inputs:
        pathType: flutterDirectory
        flutterDirectory: '/home/svc_devopscorp/.asdf/installs/flutter/3.19.5'      

    # Generate Doc
    - task: Bash@3
      displayName: 'Generate Doc'
      condition: |
        and(
            succeeded(),
            ne(variables.skip_doc, true)
          )
      name: doc
      inputs:
        targetType: inline
        script: |

          export FLUTTER_ROOT=/home/svc_devopscorp/.asdf/installs/flutter/3.19.5
          
          echo "##[debug]Activate dartdoc & dhttpd"
          dart pub global activate dartdoc && dart pub global activate dhttpd
          
          echo "##[debug]Run dart doc"
          dart pub get
          rm -rf doc
          dart doc

          git add .
          git commit -am "feat: Updated dart doc [skip ci]"
          echo "##[debug]Commit success"

          echo "##[debug] Publishing Doc master"
          
          # Debug git configuration
          echo "##[debug]Current git remote URL:"
          git config --get remote.origin.url
          
          echo "##[debug]Current git configuration:"
          git config --list | grep -E "(url\.|http\.)"
          
          # Try push with detailed error output
          echo "##[debug]Attempting git push..."
          if git push origin HEAD:master; then
            echo "##[debug]Doc pushed successfully"
          else
            echo "##[error]Doc pushed with error"
            echo "##[debug]Git push exit code: $?"
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi          

    # Get Pull Request Number
    - task: Bash@3
      displayName: 'Pull Request Number'
      name: pull_request_numnber
      inputs:
        targetType: inline
        script: |

          source_version_message=$BUILD_SOURCEVERSIONMESSAGE
          echo "##[debug]BUILD_SOURCEVERSIONMESSAGE: $source_version_message"

          #PR title: 'Merged PR 21515: fix: patch validation'
          #PR number is 21515
          # Expressão regular para capturar o valor após "INCREMENTO e CHANGE"
          pattern_pr="Merged\ PR\ ([0-9]+):"

          if [[ $source_version_message =~ $pattern_pr ]]; then
              pr_number=${BASH_REMATCH[1]}
              echo "##[debug]PULL REQUEST NUMBER: $pr_number"
              echo "##vso[task.setvariable variable=PULL_REQUEST_NUMBER;]$pr_number"
              echo "##vso[task.setvariable variable=HAS_PULL_REQUEST;]true"
          else
              echo "##vso[task.setvariable variable=HAS_PULL_REQUEST;]false"
          fi

    # Get Pull Request Info if exists
    - task: PullRequestGetInfo@1
      displayName: 'Get Pull Request Info'
      condition: eq(variables.HAS_PULL_REQUEST, true)
      inputs:
        pullRequestNumber: $(PULL_REQUEST_NUMBER)
        pullRequestTitleVariable: 'PULL_REQUEST_TITLE'
        pullRequestDescriptionVariable: 'PULL_REQUEST_DESCRIPTION'

    # Tag
    # Use standard-version to update the version and tag
    - task: Bash@3
      displayName: 'Updating Version & Tag'
      name: tag
      env:
        GIT_ACCESS_TOKEN: $(GIT_ACCESS_TOKEN)
      inputs:
        targetType: inline
        script: |

          build_reason="$BUILD_REASON"
          echo "##[debug]Build reason is: $build_reason"         

          if [[ "$build_reason" == "Manual" ]]; then

            bump_version="${{ parameters.bump_version }}"
            bump_message="${{ parameters.bump_message }}"

            # Manual
            echo "##[debug]Bump version: $bump_version"
            echo "##[debug]Bump message: $bump_message"

            if [[ $bump_message =~ (feat!:|chore!:|fix!:|feat:|fix:) ]]; then
              # Debug current git configuration before standard-version
              echo "##[debug]Git remote URL before standard-version:"
              git config --get remote.origin.url
              
              npx standard-version --release-as "$bump_version" --releaseCommitMessageFormat "$bump_message [skip ci]" 
              
              # Debug git configuration after standard-version
              # echo "##[debug]Git remote URL after standard-version:"
              # git config --get remote.origin.url
              
              # Ensure the URL still has the PAT
              # current_url=$(git config --get remote.origin.url)
              # if [[ "$current_url" != *"$GIT_ACCESS_TOKEN"* ]]; then
              #   echo "##[debug]URL lost PAT, fixing it..."
              #   new_url=$(echo "$current_url" | sed "s|https://dev.azure.com/|https://:$GIT_ACCESS_TOKEN@dev.azure.com/|")
              #   git remote set-url origin "$new_url"
              #   echo "##[debug]Fixed URL: $new_url"
              # fi
              
              git push --follow-tags origin HEAD:$(Build.SourceBranchName)
            else
              echo "##[error]Message type error"
              echo "##[debug]Esta pipeline espera um tipo no parâmetro de mensagem. [feat/fix]"
              echo "##vso[task.complete result=Failed;]"            
              exit 1
            fi

          else

            # Pull Request
            commit_description=$BUILD_SOURCEVERSIONMESSAGE
            echo "##[debug]Commit description is: $commit_description"

            if [[ $(HAS_PULL_REQUEST) == true ]]; then
              echo "##[debug]Pull request"
            
              pr_description="$(PULL_REQUEST_DESCRIPTION)"            
              if [[ -n "$pr_description" ]]; then
                echo "##[debug]Pull request description OK"
              else
                echo "##[error]Pull request description is empty"
                echo "##vso[task.complete result=Failed;]"
                exit 1
              fi              

              #Conventional commits
              #PR title: 'Merged PR 21515: fix: patch validation'
              #Excluir caracteres antes de 'fix:'
              #Commit message: fix: patch validation

              if [[ $commit_description =~ (BREAKING CHANGE|feat!:|chore!:|fix!:) ]]; then
                echo "##[debug]Bump major version"
                # Extrai a palavra-chave (feat!: ou chore!: ou fix!:)
                keyword=$(echo "$commit_description" | grep -oE 'feat!:|chore!:|fix!:')          
                # Remove tudo antes da palavra-chave
                description_after_keyword="${description_pull_request#*$keyword}"
                commit_message=$keyword$description_after_keyword             
                
                # Debug git configuration before standard-version
                echo "##[debug]Git remote URL before standard-version:"
                git config --get remote.origin.url
                
                npx standard-version --release-as major --releaseCommitMessageFormat "$commit_message [skip ci]"
                
                # Ensure the URL still has the PAT after standard-version
                # current_url=$(git config --get remote.origin.url)
                # if [[ "$current_url" != *"$GIT_ACCESS_TOKEN"* ]]; then
                #   echo "##[debug]URL lost PAT, fixing it..."
                #   new_url=$(echo "$current_url" | sed "s|https://dev.azure.com/|https://:$GIT_ACCESS_TOKEN@dev.azure.com/|")
                #   git remote set-url origin "$new_url"
                #   echo "##[debug]Fixed URL: $new_url"
                # fi

              elif [[ $commit_description =~ (feat:) ]]; then
                echo "##[debug]Feat"
                # Extrai a palavra-chave (feat:)
                keyword=$(echo "$commit_description" | grep -oE 'feat:')          
                # Remove tudo antes da palavra-chave
                description_after_keyword="${description_pull_request#*$keyword}"
                commit_message=$keyword$description_after_keyword
                
                # Debug git configuration before standard-version
                echo "##[debug]Git remote URL before standard-version:"
                git config --get remote.origin.url            
                
                npx standard-version --release-as minor --releaseCommitMessageFormat "$commit_message [skip ci]"
                
                # Ensure the URL still has the PAT after standard-version
                # current_url=$(git config --get remote.origin.url)
                # if [[ "$current_url" != *"$GIT_ACCESS_TOKEN"* ]]; then
                #   echo "##[debug]URL lost PAT, fixing it..."
                #   new_url=$(echo "$current_url" | sed "s|https://dev.azure.com/|https://:$GIT_ACCESS_TOKEN@dev.azure.com/|")
                #   git remote set-url origin "$new_url"
                #   echo "##[debug]Fixed URL: $new_url"
                # fi

              elif [[ $commit_description =~ (fix:) ]]; then
                echo "##[debug]Patch"
                # Extrai a palavra-chave (fix:)
                keyword=$(echo "$commit_description" | grep -oE 'fix:')          
                # Remove tudo antes da palavra-chave
                description_after_keyword="${description_pull_request#*$keyword}"
                commit_message=$keyword$description_after_keyword
                
                # Debug git configuration before standard-version
                echo "##[debug]Git remote URL before standard-version:"
                git config --get remote.origin.url            
                
                npx standard-version --release-as patch --releaseCommitMessageFormat "$commit_message [skip ci]"
                
                # Ensure the URL still has the PAT after standard-version
                # current_url=$(git config --get remote.origin.url)
                # if [[ "$current_url" != *"$GIT_ACCESS_TOKEN"* ]]; then
                #   echo "##[debug]URL lost PAT, fixing it..."
                #   new_url=$(echo "$current_url" | sed "s|https://dev.azure.com/|https://:$GIT_ACCESS_TOKEN@dev.azure.com/|")
                #   git remote set-url origin "$new_url"
                #   echo "##[debug]Fixed URL: $new_url"
                # fi            

              else
      
                echo "##[error]Commit type error"
                echo "##[debug]Esta pipeline espera um tipo na descrição do commit ou titulo do PR. [feat/fix]"
                echo "##vso[task.complete result=Failed;]"            
                exit 1
              fi

              git push --follow-tags origin HEAD:$(Build.SourceBranchName) 
              #git push --follow-tags origin $(Build.SourceBranchName)
            
            else

              echo "##[debug]Pull request does not exist"
              echo "##[debug]Skipping TAG."

            fi
          fi
