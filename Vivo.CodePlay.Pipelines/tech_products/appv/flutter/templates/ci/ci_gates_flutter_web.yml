stages:

- stage: gates
  displayName: "Quality Gates"
  dependsOn:
  - build_test
  pool: $(PRIVATE_AGENT_SHARED)
  jobs:

  # Governance Job
  - job: governance
    displayName: Governance Policies Check    
    condition: |
               and(
                  succeeded(),
                  in(variables['Build.SourceBranch'], 'refs/heads/master')
                )
    steps:

    # Read Catalog Info
    - task: Bash@3
      name: export_catalog_info
      displayName: Reading Catalog Info File
      inputs:
        targetType: inline
        script: |      
          if [ ! -f "catalog-info.yaml" ]; then
            echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi
          COMPONENT_NAME="$(yq -r 'select(documentIndex == 0) | .metadata.name | select (.!=null)' catalog-info.yaml)"
          echo "##vso[task.setvariable variable=COMPONENT_NAME]${COMPONENT_NAME}"
          echo "##vso[task.setvariable variable=CATALOG_INFO_FILE_CONTENT]$(cat catalog-info.yaml)"

    # Export APP VERSION
    - task: Bash@3
      name: export_current_version
      displayName: Extract App Version
      inputs:
        targetType: inline
        script: |
          version=$(yq e '.version' pubspec.yaml | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "##vso[task.setvariable variable=APP_VERSION]$version"
          echo "##[debug] Exporting variable 'APP_VERSION': $version"

    # Governance task - validate
    - task: VivoGovernance@1
      inputs:
        breakglass: $(GOVAPP_BREAK_GLASS)
        cluster: "$(GOVAPP_CLUSTER)"
        component: "$(COMPONENT_NAME)"
        deployment: "$(COMPONENT_NAME)"
        environment: "producao"
        namespace: "$(GOVAPP_NAMESPACE)"
        operation: "validate"
        serverEndpoint: $(GOVAPP_SERVICE_CONNECTION_NAME)
        version: "$(APP_VERSION)"
        catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
      continueOnError: true
      condition: eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')

  # Sonar Job
  - job: sonarqube
    displayName: Code Analysis
    condition: |
               and(
                  succeeded(),
                  ne(variables.skip_sonarqube, true)
                )

    steps:

    # Get Sonar Project Key in catalog-info.yaml
    - task: Bash@3
      displayName: "Get Sonar Project Key - catalog-info.yaml"
      inputs:
        targetType: inline
        script: |
          if [ ! -f "catalog-info.yaml" ]; then
            echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi

          SONAR_PROJECT_KEY="$(yq -r 'select(documentIndex == 0) | .metadata.annotations."sonarqube.org/project-key" | select (.!=null)' catalog-info.yaml)"
          echo "##[debug]SONAR_PROJECT_KEY..........: ${SONAR_PROJECT_KEY}"
          echo "##vso[task.setvariable variable=SONAR_PROJECT_KEY]${SONAR_PROJECT_KEY}"
        
    # Get sonar token in AKV
    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'SONARQUBE-TOKEN'

    # Download build artifacts
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: app
        parallelizationLimit: 20
        extractTars: true

    # Export APP VERSION from pubspec.yaml
    - task: Bash@3
      displayName: Extract App Version 
      name: export_current_version
      condition: succeeded()
      inputs:
        targetType: inline
        script: |
          version=$(yq e '.version' pubspec.yaml | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "##vso[task.setvariable variable=APP_VERSION]$version"
          echo "##[debug]Exporting variable 'APP_VERSION': $version"

    # Setup Project and Quality Gate
    - task: Bash@3
      displayName: 'Setup Project and Quality Gate'
      name: setup_quality_gate
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          url="$(SONARQUBE_URL)"
          token="$(SONARQUBE-TOKEN)"
          project_key="$(echo $(SONAR_PROJECT_KEY) | sed 's/ /+/g')"
          project_name="$(echo $(System.TeamProject)-$(Build.Repository.Name) | sed 's/ /+/g')"
          project_quality_gate="$(SONARQUBE_PROJECT_QUALITYGATE)"
          default_quality_gate="$(SONARQUBE_DEFAULT_QUALITYGATE)"

          # If no custom quality gate was provided, use default.
          if [[ -z $project_quality_gate ]]; then
              echo "##[debug]Quality Gate not found, using default."  
              project_quality_gate="$default_quality_gate"
          fi
          echo "##[debug] Project quality gate: $project_quality_gate" 

          ## -> Checks if the project exists. If not, creates it.
          echo "##[debug] Cheking if project exists on SonarQube..."  
          project_exists=$(curl -s -X GET -u $token: "$url/api/projects/search?projects=$project_key" | jq '.paging.total' | sed 's/null/0/g')

          if [ "$project_exists" -ne 1 ]; then
              echo "##[debug]Project do not exists, creating..."
              project_status=$(curl -s -X POST -o ./.tmp.sonar.out -w "%{http_code}" -u $token: "$url/api/projects/create?name=$project_name&project=$project_key&visibility=public")

              if [ "$project_status" -eq 200 ]; then
                  echo "##[debug]SonarQube project created for key $(SONAR_PROJECT_KEY)"
                  echo "##[debug]SonarQube project created for $project_name"
              else
                  echo "##[error]Error to create SonarQube project for key $(SONAR_PROJECT_KEY)"
                  echo "##[error]$(cat ./.tmp.sonar.out | jq '.errors[0].msg')"      
              fi
          fi

          ## -> Checks if the project's Quality Gate exists. If not, use default.
          app_quality_gate_status=$(curl -s -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/show?name=$project_quality_gate")

          if [ "$app_quality_gate_status" -eq 200 ]; then
              echo "##[debug]Quality Gate found for $project_quality_gate" 
          else
              echo "##[debug]Quality Gate not found, using default."
              project_quality_gate="$default_quality_gate"
          fi

          ## -> Links the project to its Quality Gate
          echo "##[debug] Linking project to Quality Gate..."

          status=$(curl -s -X POST -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/select?gateName=$project_quality_gate&projectKey=$project_key")

          if [ "$status" -ne 204 ]; then
            echo "##[error]Error while linking application to Quality Gate!"
            rm -rf ./.tmp.sonar.out
            exit 1;
          fi

          rm -rf ./.tmp.sonar.out

    # Prepare analysis on SonarQube
    - task: SonarSource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@5
      displayName: 'Prepare analysis on SonarQube'
      inputs:
        SonarQube: '$(SONARQUBE_SERVICE_CONNECTION_NAME)'
        scannerMode: CLI
        configFile: '$(SONARQUBE_CONFIG_FILE)'
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(DEFAULT_WORKDIR_ARTIFACTS)
          sonar.projectKey=$(SONAR_PROJECT_KEY)
          sonar.projectName=$(System.TeamProject)-$(Build.Repository.Name)
          sonar.projectVersion=$(APP_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300
          sonar.dart.analyzer.mode=MANUAL
          sonar.dart.analyzer.report.mode=LEGACY
          sonar.dart.analyzer.report.path=$(DEFAULT_WORKDIR_ARTIFACTS)/analyze-report.txt
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    # Run Code Analysis
    - task: SonarSource.sonarqube.6D01813A-9589-4B15-8491-8164AEB38055.SonarQubeAnalyze@5
      displayName: 'Run Code Analysis'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: "openjdk-11.0.2"

    # Get Sonarqube taskId
    - task: Bash@3
      displayName: Get Sonar TaskId
      name: sonar_task_id
      condition: succeeded()
      inputs:
        workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
        targetType: inline
        script: |

          ## -> Load report_task      
          if [[ -z $(REPORT_TASK_NAME) ]]; then
            echo "##[debug] report not found."
            exit 1;
          else
            sonarTaskId="$(cat $(REPORT_TASK_NAME) | grep -o 'ceTaskId=[^,]*' | awk -F= '{print $2}')"
            echo "##[debug] SONAR_TASK_ID.......: $sonarTaskId"
            echo "##vso[task.setvariable variable=SONAR_TASK_ID;isOutput=true]$sonarTaskId"
          fi

    # Publish SonarQube Quality Gate Result
    - task: SonarSource.sonarqube.291ed61f-1ee4-45d3-b1b0-bf822d9095ef.SonarQubePublish@5
      displayName: 'Publish Quality Gate Result'
      continueOnError: true
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    # Verify QualityGate Status
    - task: Bash@3
      displayName: Analyze Quality Gate status
      name: quality_gate_status
      condition: succeeded()
      continueOnError: true
      inputs:
        workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
        targetType: inline
        script: |

          echo "##[debug] SONAR_TASK_ID...............: $(sonar_task_id.SONAR_TASK_ID)"

          sonarTaskUrl="$(SONARQUBE_URL)/api/ce/task?id=$(sonar_task_id.SONAR_TASK_ID)"
          echo "##[debug] SONAR_TASK_URL..............: $sonarTaskUrl"
          
          analysisId="$(curl -s -u "$(SONARQUBE-TOKEN):" "$sonarTaskUrl" | jq -r '.task.analysisId')"
          echo "##[debug] ANALYSIS_ID.................: $analysisId"

          sonarProjectStatusUrl="$(SONARQUBE_URL)/api/qualitygates/project_status?analysisId=$analysisId"
          echo "##[debug] SONAR_PROJECT_STATUS_URL....: $sonarProjectStatusUrl"
          
          analysisStatus="$(curl -s -u "$(SONARQUBE-TOKEN):" "$sonarProjectStatusUrl" | jq -r '.projectStatus.status')"
          echo "##[debug] ANALYSIS_STATUS.............: $analysisStatus"

          sonarProjectDashboard="$(SONARQUBE_URL)/dashboard?id=$(SONAR_PROJECT_KEY)"
          echo "##[debug] SONAR_PROJECT_DASHBOARD.....: $sonarProjectDashboard"

          if [[ "$analysisStatus" == "ERROR" ]]; then
            echo "##vso[task.logissue type=error;] Sonar Quality Gate status is ERROR - View details on step Run Code Analysis."
            echo "##vso[task.complete result=Failed;]"
          fi

