parameters:
- name: bump_version
  type: string
  default: "1.0.0"
- name: bump_message
  type: string
  default: "feat!: Message"
- name: use_flutter_version_latest
  type: string
  default: "True"

resources:
  repositories:
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines

variables:
- template: /tech_products/appv/flutter/initialize/variables_global.yml
- template: /tech_products/appv/flutter/initialize/variables_flutter_lib.yml
- group: "${{ variables['Build.DefinitionName'] }}"

stages:
- template: /tech_products/appv/flutter/templates/ci/ci_build_flutter_lib.yml
  parameters:
    use_flutter_version_latest: ${{ parameters.use_flutter_version_latest }}

- template: /tech_products/appv/flutter/templates/ci/ci_gates_flutter_lib.yml

- template: /tech_products/appv/flutter/templates/ci/ci_security_flutter_lib.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

- template: /tech_products/appv/flutter/templates/ci/ci_tag_flutter_lib.yml
  parameters:
    bump_version: ${{ parameters.bump_version }}
    bump_message: ${{ parameters.bump_message }}
