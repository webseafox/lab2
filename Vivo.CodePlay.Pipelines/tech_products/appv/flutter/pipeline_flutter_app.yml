## -> Parameters:
parameters:

- name: release_notes
- name: target
- name: qa_environment
- name: firebase_groups_android
- name: firebase_groups_ios
- name: skip_signing
  default: false
- name: skip_protect
  default: false
- name: skip_promote
  default: false
- name: use_flutter_version_latest
  default: true

## -> Resources:
resources:
  repositories:
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/tags/latest
    endpoint: CorePipelines

## -> Initialize global variables   
variables:

- template: /tech_products/appv/flutter/initialize/variables_global.yml
- template: /tech_products/appv/flutter/initialize/variables_flutter_app.yml
- group: "${{ variables['Build.DefinitionName'] }}"
- template: /.azuredevops/config/${{ parameters.qa_environment }}/environments_variables.yml@self

stages:

## -> Initialize pipeline 
- template: /tech_products/appv/flutter/initialize/pipeline_init_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}  

## -> Build for CI - Flutter
- template: /tech_products/appv/flutter/templates/ci/ci_build_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}
    use_flutter_version_latest: ${{ parameters.use_flutter_version_latest }}

## -> Gates for CI - Gates
- template: /tech_products/appv/flutter/templates/ci/ci_gates_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}

## -> Gates for CI - Security 
- template: /tech_products/appv/flutter/templates/ci/ci_security_flutter_app.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

## -> Package for CI - Flutter
- template: /tech_products/appv/flutter/templates/ci/ci_package_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}
    use_flutter_version_latest: ${{ parameters.use_flutter_version_latest }}
    target: ${{ parameters.target }}
    skip_signing: ${{ parameters.skip_signing }}
    skip_protect: ${{ parameters.skip_protect }}

# -> Publish for CI - Flutter
- template: /tech_products/appv/flutter/templates/ci/ci_publish_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}  
    release_notes: ${{ parameters.release_notes }}
    target: ${{ parameters.target }}
    firebase_groups_android: "${{parameters.firebase_groups_android}}"
    firebase_groups_ios: "${{parameters.firebase_groups_ios}}"
    skip_protect: ${{ parameters.skip_protect }}

## -> TAG for CI - Flutter
- template: /tech_products/appv/flutter/templates/ci/ci_tag_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}

## -> Deploy for CD - Flutter
- template: /tech_products/appv/flutter/templates/cd/cd_deploy_flutter_app.yml
  parameters:
    qa_environment: ${{ parameters.qa_environment }}
    target: ${{ parameters.target }}
    skip_protect: ${{ parameters.skip_protect }}
    skip_promote: ${{ parameters.skip_promote }}
    release_notes: ${{ parameters.release_notes }}