## -> Parameters:
parameters:

- name: skipComponentTest
  type: boolean
  default: False

- name: gatesEnabled
  type: boolean
  default: False

- name : notifyChangelog
  type: boolean
  default: False

## -> Resources:
resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOpsVivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOpsVivo.Core.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: Codeplay
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

## -> Initialize global variables   
variables:

- template: /tech_products/appv/global/initialize/variables-global.yml
- template: /tech_products/appv/global/initialize/variables-nodejs.yml
- template: /tech_products/appv/global/initialize/variables-gates.yml
# - ${{ if ne(parameters.skipPackage, True) }}:    
#   - template: /tech_products/appv/global/initialize/variables-docker.yml

## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
## -> Use this to change the variables on runtime
- group: "${{ variables['Build.DefinitionName'] }}"

- name: CORPORATE_WIKI_DOC_URL
  value: "TBD"

stages:

## -> Initialize pipeline enviroment
- template: /tech_products/appv/global/initialize/nodejs-environment.yml

## -> Build for CI - NodeJS
- template: /tech_products/appv/appv_node_lib/templates/ci/ci_build_nodejs_appv_lib.yml

## -> initialize gates environment
- ${{ if eq(parameters.gatesEnabled, True) }}:
  - template: /tech_products/appv/global/initialize/gates-environment.yml
  - template: /tech_products/appv/appv_node_lib/templates/ci/ci_quality_gate_appv.yml
  - template: /tech_products/appv/appv_node_lib/templates/ci/ci_security_appv.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

## -> Publish Build for CI - NodeJS
- template: /tech_products/appv/appv_node_lib/templates/ci/ci_publish_nodejs_appv_lib.yml
  parameters:
    gatesEnabled: "${{parameters.gatesEnabled}}"

- ${{ if eq(parameters.notifyChangelog, True) }}:
  - template: /tech_products/appv/global/templates/ci/ci-changelog-notification-appv.yml