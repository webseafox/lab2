parameters:
  - name: project
    type: string
  - name: environment
    type: string
  - name: dryRun
    type: boolean
  - name: deploymentList
    type: object

stages:
  - stage: approval
    displayName: "Approval"
    dependsOn: validation
    jobs:
      - job: approve
        displayName: "Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              allowApproversToApproveTheirOwnRuns: true
              approvers: |
                [APPV - APP VIVO]\Maintainer,
                [FRBR - FRAMEWORK BRASIL]\Maintainer
              instructions: |
                Mass Deployment Approval Required

                Project: ${{ parameters.project }}
                Environment: ${{ parameters.environment }}
                Dry Run: ${{ parameters.dryRun }}
                Total Deployments: ${{ length(parameters.deploymentList) }}

                Deployments:
                ${{ convertToJson(parameters.deploymentList) }}

                Review and approve to proceed.
              onTimeout: reject
