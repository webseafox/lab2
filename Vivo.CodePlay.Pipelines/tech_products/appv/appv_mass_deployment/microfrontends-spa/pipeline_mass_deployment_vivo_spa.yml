## ========================================================================
## Pipeline for Mass Deployment - Microfrontends SPA
## ========================================================================
##
## Queue Time Variables:
##   - AZURE_DEVOPS_PAT: Personal PAT of the executor (insert as secret)
##
## Prerequisites:
##   1. Executor must have a valid PAT with permissions: Code (Read & Write), Build (Read & Execute)
##   2. When running the pipeline, enter PAT in AZURE_DEVOPS_PAT variable
##      and check "Keep this value secret"
##
## ========================================================================

name: Mass Deployment - Microfrontends SPA

trigger: none

parameters:
  - name: dryRun
    type: boolean
    displayName: "Dry Run (Preview only)"
    default: true

  - name: project
    type: string
    displayName: "Target Project"
    default: "APPV - APP VIVO"
    values:
      - "APPV - APP VIVO"
      - "FRBR - FRAMEWORK BRASIL"

  - name: environment
    type: string
    displayName: "Target Environment"
    default: "prodlike"
    values:
      - prodlike

  - name: deploymentList
    type: object
    displayName: "Deployment List (JSON)"
    default: {}

  - name: skipReleaseCreation
    type: boolean
    displayName: "Skip Release Creation"
    default: false

  - name: skipReleaseUpdate
    type: boolean
    displayName: "Skip Release Enable/Update"
    default: false

  - name: releaseEnabledFlag
    type: string
    displayName: "Release Enabled Flag Value"
    default: "true"
    values:
      - "true"
      - "false"

  - name: organization
    type: string
    displayName: "Azure DevOps Organization URL"
    default: "https://dev.azure.com/telefonica-vivo-brasil/"

variables:
  - name: pipelinePrefix
    value: "src.src-"
  - name: maxDeployments
    value: 10

stages:
  - template: templates/validation.yml
    parameters:
      project: ${{ parameters.project }}
      environment: ${{ parameters.environment }}
      dryRun: ${{ parameters.dryRun }}
      deploymentList: ${{ parameters.deploymentList }}
      maxDeployments: 10
      pipelinePrefix: $(pipelinePrefix)

  - template: templates/approval.yml
    parameters:
      project: ${{ parameters.project }}
      environment: ${{ parameters.environment }}
      dryRun: ${{ parameters.dryRun }}
      deploymentList: ${{ parameters.deploymentList }}

  - template: templates/deploy.yml
    parameters:
      project: ${{ parameters.project }}
      environment: ${{ parameters.environment }}
      dryRun: ${{ parameters.dryRun }}
      deploymentList: ${{ parameters.deploymentList }}
      pipelinePrefix: $(pipelinePrefix)
      skipReleaseCreation: ${{ parameters.skipReleaseCreation }}
      skipReleaseUpdate: ${{ parameters.skipReleaseUpdate }}
      releaseEnabledFlag: ${{ parameters.releaseEnabledFlag }}
      organization: ${{ parameters.organization }}

  - template: templates/report.yml
    parameters:
      project: ${{ parameters.project }}
      environment: ${{ parameters.environment }}
      dryRun: ${{ parameters.dryRun }}
      deploymentList: ${{ parameters.deploymentList }}
      pipelinePrefix: $(pipelinePrefix)
      organization: ${{ parameters.organization }}
