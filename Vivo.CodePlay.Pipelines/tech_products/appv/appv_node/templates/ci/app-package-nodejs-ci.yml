parameters:
  - name: setEnvironment
  - name: reuseArtifacts

stages:
- stage: ci_package
  displayName: "CI - Package"  
  pool:
    name: GeneralPurposeLinuxAgentsCI
  dependsOn:
  - ci_build
  - ${{ if eq(parameters.reuseArtifacts, False) }}:
    - ci_publish
  condition: succeeded()

  ## -> Loads variables from other stages.
  variables:
    - name: SONAR_TASK_ID
      value: $[ stageDependencies.gate.sonarqube.outputs['sonar_task_id.SONAR_TASK_ID'] ]
    - name: APP_VERSION
      value: $[ stageDependencies.ci_build.build.outputs['new_version.NEW_VERSION'] ]
    - name: ARTIFACT_NAME
      value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_NAME'] ]

  jobs:

  - job: "app_config_keys"
    condition: succeeded()
    displayName: "Get AppSec Config Keys"
    steps:
     - template: /task_groups/security/get_appconfig_keys.yml@CorePipelines 

  - job: "Package"
    condition: succeeded()
    displayName: "Package"
    dependsOn: app_config_keys 
    variables:
    - name: USE_DT_DOCKER
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
    - name: USE_CONVISO
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
    - name: SKIP_SECURITY_GATE_SCA
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]
    steps:
    
    ## -> Download and uncompress the downloaded artifact.         
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: $(ARTIFACT_NAME)
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)
        
    - script: | 
        cd $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)
        unzip -q '$(ARTIFACT_NAME).zip'
        rm '$(ARTIFACT_NAME).zip'
      displayName: 'Unzip with symlinks'

    - task: Bash@3
      displayName: Artifacts Info
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Artifact name: '$(ARTIFACT_NAME)'"

          echo "##[debug] Target directory location: '$(pwd "$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)")'"
          echo "##[debug] Target directory path: '$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)'"
          echo "##[debug] Target directory content:'"
          echo "$(ls -lha '$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)')"
          echo "##[debug] NEW_VERSION: $(NEW_VERSION)"

    - task: Bash@3
      displayName: 'Verify Existing Version'
      condition: eq(${{ parameters.reuseArtifacts }}, True)
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[debug] APP_VERSION: $(APP_VERSION)"

          response=$(curl -s -f https://$(IMAGE_REGISTRY)/v2/$(IMAGE_NAME)/tags/list)

          if [ $? -ne 0 ]; then
            echo "##vso[task.logissue type=error]Failed to access registry"
            echo "$response"
            exit 1
          fi

          if echo "$response" | jq -e ".tags[] | select(. == \"$(APP_VERSION)\")" > /dev/null; then
            echo "##vso[task.logissue type=error]Version '$(APP_VERSION)' already exists for '$(IMAGE_NAME)' in registry at '$(IMAGE_REGISTRY)'."
            exit 1
          else
            echo "Version '$(APP_VERSION)' does NOT exist for '$(IMAGE_NAME)' in registry at '$(IMAGE_REGISTRY)'."
            exit 0
          fi
        
    - task: CmdLine@2
      displayName: "Define Variables"
      inputs:
        workingDirectory: '$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/'
        script: |


          echo "##vso[task.setvariable variable=APP_NAME]$(IMAGE_NAME)"

          echo "##[group] Docker Variables"
          echo "##[debug] DOCKER_REGISTRY............: $(IMAGE_REGISTRY)"
          echo "##[debug] DOCKER_SERVICE_CONNECTION..: ${DOCKER_SERVICE_CONNECTION}"   
          echo "##[debug] DOCKER_IMAGE_NAME..........: $(IMAGE_NAME)"   
          echo "##[debug] DOCKER_IMAGE_TAG...........: ${APP_VERSION}"             
          if [ ! -f "runtime.Dockerfile"  ]; then
            DOCKER_FILE=$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.azuredevops/runtime.Dockerfile
          else
            DOCKER_FILE=$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/.azuredevops/runtime.Dockerfile
          fi
          echo "##[debug] DOCKER_FILE...........: ${DOCKER_FILE}"
          echo "##vso[task.setvariable variable=DOCKER_FILE]${DOCKER_FILE}"
          echo "##vso[task.setvariable variable=DOCKER_IMAGE_NAME]$(IMAGE_NAME)"
          echo "##vso[task.setvariable variable=DOCKER_IMAGE_TAG]${APP_VERSION}"
          echo "##[endgroup]"

    - task: Docker@2
      name: login_devops
      displayName: 'Login to Docker Registry'
      continueOnError: true
      inputs:
        containerRegistry: ACR-DEVOPS
        displayName: 'Login to Docker Registry'
        command: 'login'

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)
        policySets: |
          image-definition-files

    - task: Docker@2
      displayName: Docker Build
      condition: succeeded()
      inputs:
        containerRegistry: $(DOCKER_SERVICE_CONNECTION)
        command: build
        repository: $(DOCKER_IMAGE_NAME)
        Dockerfile: $(DOCKER_FILE)
        buildContext: '$(DEFAULT_WORKDIR_ARTIFACTS)/$(ARTIFACT_NAME)/'
        arguments: --no-cache --build-arg APPLICATION_NAME=$(APP_NAME) --build-arg APPLICATION_PATH=target --build-arg APP_VERSION=$(APP_VERSION) --build-arg HTTP_PROXY="$(PROXY_AGENT_HTTP)" --build-arg HTTPS_PROXY="$(PROXY_AGENT_HTTPS)" --build-arg NO_PROXY="$(PROXY_AGENT_NO_PROXY)"
        tags: >
          $(DOCKER_IMAGE_TAG)

    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'DEPENDENCY-TRACK-TOKEN, CONVISO-API-KEY'
      condition: and(eq(variables['DEPENDENCY-TRACK-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''), eq(variables.USE_DT_DOCKER, 'true'))
      
    - template: /task_groups/security/run_sca_scan_docker.yml@CorePipelines
      parameters: 
        skipSecurityGate: ${{ variables['SKIP_SECURITY_GATE_SCA'] }}
          
    - task: Docker@2
      displayName: Docker Push
      name: dockerPushImage
      condition: succeeded()
      inputs:
        containerRegistry: $(DOCKER_SERVICE_CONNECTION)
        command: push
        repository: $(DOCKER_IMAGE_NAME)
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(DOCKER_IMAGE_TAG)

    - task: CmdLine@2
      displayName: Export Image Digest
      name: docker_digest
      env:
        DOCKER_OUTPUT: $(dockerPushImage.DockerOutput)
      inputs:
        script: |
          echo "##[group] ${DOCKER_OUTPUT}"
          cat ${DOCKER_OUTPUT}
          echo "##[endgroup]"

          DOCKER_DIGEST="$(cat ${DOCKER_OUTPUT} | grep "digest" | awk -F ' ' '{print $3}')"
          echo "##[debug] DOCKER_DIGEST..........: ${DOCKER_DIGEST}"
          echo "##vso[task.setvariable variable=DOCKER_DIGEST;isOutput=true]${DOCKER_DIGEST}"

    - task: CmdLine@2
      displayName: "Generate docker.json metadata"
      env:
        DOCKER_REGISTRY: $(DOCKER_DEFAULT_REGISTRY)
        DOCKER_IMAGE_NAME: $(DOCKER_IMAGE_NAME)
        DOCKER_IMAGE_TAG: $(DOCKER_IMAGE_TAG)
        DOCKER_APP_NAME: $(APP_NAME)
        DOCKER_APP_VERSION: $(APP_VERSION)
        K8S_NAMESPACE: "${{ parameters.setEnvironment }}"
      inputs:
        script: |
          cat <<EOF > docker.json
          {
            "DOCKER_REGISTRY": "${DOCKER_REGISTRY}",
            "DOCKER_IMAGE_NAME": "${DOCKER_IMAGE_NAME}",
            "DOCKER_IMAGE_TAG": "${DOCKER_IMAGE_TAG}",
            "DOCKER_APP": "${DOCKER_APP_NAME}",
            "DOCKER_APP_VERSION": "$(APP_VERSION)",
            "DOCKER_IMAGE_NAME_FULL": "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}",
            "K8S_NAMESPACE": "${{ parameters.setEnvironment }}",
            "GIT_TAG": "${DOCKER_IMAGE_TAG}"
          }
          EOF

          echo "##[command] cat docker.json"
          cat docker.json

    - task: CopyFiles@2
      displayName: 'Copy to Staging Directory'
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          docker.json

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact Docker'
      inputs:
        ArtifactName: docker
        StoreAsTar: false
