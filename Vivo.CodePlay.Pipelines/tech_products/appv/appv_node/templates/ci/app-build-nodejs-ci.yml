parameters:
  - name: artifactDir
    type: string
    default: ''
  - name: setVersion
    type: string
  - name: reuseArtifacts
    type: boolean

stages:
- stage: ci_build
  displayName: "CI - Build"
  pool:
    name: GeneralPurposeLinuxAgentsCI
  dependsOn:
  - environment_init

#DefaultDevopsAgents

  ## -> Loads variables from other stages.
  variables:
  - name: NEXUS_DEPS_USR
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
  - name: NEXUS_DEPS_PSW
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
  - name: setVersion
    value: $(echo "${{ parameters.setVersion }}" | xargs)
  
  jobs:      
  - job: build
    displayName: Build
    steps:

    ## -> Clean the pipeline workspace and checkout the code.
    ## -> 6d15af64-176c-496d-b583-fd2ae21d4df4 is the decorator for checkout.
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: Checkout Code
      name: checkout_code 
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true

    ## -> Checkout the last commit that was pushed to the repository. 
    ## -> Set last commit HASH to a variable. 
    - task: Bash@3
      displayName: Checkout Last Commit
      name: checkout_last_commit
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Checkout last commit from '$(Build.SourceBranchName)'"

          git config pull.rebase true
          git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)
          git checkout -f $(Build.SourceBranchName)
          lastCommitHash=$(git rev-parse --short=6 HEAD)

          echo "##[debug] Last commit short hash '$lastCommitHash'"
          echo "##vso[task.setvariable variable=SHORT_HASH]$lastCommitHash"

    ## -> Start of Bump Version section
    ## -> If branch is master, use numeric system. e.g: 0.0.1, 2.0.0;
    ## -> If branch is NOT master, use branch name + last commit hash. e.g: dev-1a2b;

    ## -> Get version and set to variables. 
    ## -> For master, set a variable to increment version further on.
    - task: CmdLine@2
      displayName: Get Version
      name: get_version
      condition: succeeded()
      continueOnError: false
      inputs:
        script: |
          setVariables(){
            eval result=$2
            echo "##vso[task.setvariable variable=$1]$result"
          }

          echo "##[debug] setVersion input value: $(setVersion)"

          if [ -z "$(setVersion)" ]; then
            echo "##[debug] setVersion is empty."
            echo "##[debug] Extracting version from 'package.json'."
            currentVersion=$(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)
            
            APP_VERSION=$(echo $currentVersion | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          else
            echo "##[debug] setVersion is not empty, no changes will be made."

            APP_VERSION=$(setVersion)
          fi

          echo "##[debug] INCREMENT_VERSION: $APP_VERSION"
          setVariables "INCREMENT_VERSION" $APP_VERSION

    ## -> Bump/Increment version and update increment variable. 
    ## -> Only allows this for master branch and in CI steps. Do not allow manual pushes.
    ## -> To disable set BUMP_VERSION_ENABLED in pipeline's library.
    - task: semver-bump@1
      displayName: Bump Version Master
      name: bump_version
      condition: and(
        succeeded(),
        or(
        and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')),
        and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))))
      continueOnError: false
      inputs:
        VersionVariable: 'INCREMENT_VERSION'
        IncrementLevel: 'patch'
        targetType: inline

    ## -> Check if bumped version exists in Nexus
    - task: Bash@3
      displayName: Check Version in Nexus
      name: check_nexus_version
      condition: and(
        succeeded(),
        or(
          and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')),
          and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))))
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          set -e
          
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "##[debug] Package name: $PACKAGE_NAME"
          
          REGISTRY_URL=$(node -p "require('./package.json').publishConfig?.registry || ''" | sed 's:/*$::')
          
          if [ -z "$REGISTRY_URL" ]; then
            echo "##vso[task.logissue type=error;] No publishConfig.registry found in package.json"
            exit 0
          fi
          
          echo "##[debug] Registry URL: $REGISTRY_URL"
          
          ARTIFACT_NAME_ONLY=$(echo $PACKAGE_NAME | awk -F '/' '{print $NF}')
          echo "##[debug] Artifact name: $ARTIFACT_NAME_ONLY"
          
          CURRENT_VERSION="$(INCREMENT_VERSION)"
          
          echo "##[section] Checking if version exists in Nexus"
          echo "##[debug] Version to check: $CURRENT_VERSION"
          
          file_name="$ARTIFACT_NAME_ONLY-${CURRENT_VERSION}.tgz"
          nexus_url="$REGISTRY_URL/$PACKAGE_NAME/-/$file_name"
          
          echo "##[debug] Nexus URL: $nexus_url"
          
          http_code=$(curl -s -o /dev/null -w "%{http_code}" -u $(NEXUS_DEPS_USR):$(NEXUS_DEPS_PSW) "$nexus_url" || echo "000")
          
          echo "##[debug] HTTP response code: $http_code"
          
          if [ "$http_code" = "200" ]; then
            echo "##[warning] Version $CURRENT_VERSION already exists in Nexus"
            echo "##vso[task.setvariable variable=VERSION_EXISTS]true"
          elif [ "$http_code" = "404" ]; then
            echo "##[section] Version $CURRENT_VERSION is available in Nexus"
            echo "##vso[task.setvariable variable=VERSION_EXISTS]false"
          else
            echo "##[warning] Unexpected HTTP code $http_code. Treating as available."
            echo "##vso[task.setvariable variable=VERSION_EXISTS]false"
          fi

    ## -> Bump version again if it exists in Nexus
    - task: semver-bump@1
      displayName: Second Bump Version Master
      name: second_bump_version
      condition: and(
        succeeded(),
        eq(variables.VERSION_EXISTS, 'true'),
        or(
          and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')),
          and(eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))))
      continueOnError: false
      inputs:
        VersionVariable: 'INCREMENT_VERSION'
        IncrementLevel: 'patch'
        targetType: inline

    ## -> Set the new version to a variable. This allows it to be used in other stages, jobs or tasks.
    - task: Bash@3
      displayName: 'Set New Version'
      name: new_version
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Source INCREMENT_VERSION: '$(INCREMENT_VERSION)'"
          if [ '$(Build.SourceBranchName)' == 'master' ]; then
            echo "##[debug] Source NEW_VERSION: '$(INCREMENT_VERSION)'"
            echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$(INCREMENT_VERSION)"
          else
            newVersion=$(INCREMENT_VERSION)-$(Build.SourceBranchName).$(SHORT_HASH)
            echo "##[debug] Source NEW_VERSION: $newVersion"
            echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$newVersion"
          fi

    ## -> Bump version in code 
    - task: Bash@3
      displayName: Update Source Version
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      inputs:
        targetType: inline
        script: |

          echo "##[debug] Pushing NEW_VERSION: $(new_version.NEW_VERSION)"
          jq '.version="$(new_version.NEW_VERSION)"' package.json > /tmp/package.json
          mv /tmp/package.json package.json

    ## -> Set artifact information to variables. This allows it to be used in other stages, jobs or tasks. 
    - task: CmdLine@2
      name: artifact_name
      displayName: 'Get Artifact Name'
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          setVariables(){
            eval result=$2
            echo "##vso[task.setvariable variable=$1;isOutput=true]$result"
          }

          packageJsonName=$(DOCKER_CMD_EXTRACT_PACKAGE_JSON_NAME)
          setVariables "PACKAGE_JSON_NAME" $packageJsonName
          echo "##[debug] package.json Name '$packageJsonName'"

          echo "##[debug] Set Artifact Name + New Version"

          artifactNameOnly="$(echo $packageJsonName | awk -F '/' '{print$NF}')"
          setVariables "ARTIFACT_NAME_ONLY" $artifactNameOnly
          echo "##[debug] Artifact Name '$artifactNameOnly'"
          echo "##vso[task.setvariable variable=ARTIFACT_NAME_ONLY;isOutput=true]$artifactNameOnly"

          artifactName="$artifactNameOnly-$(new_version.NEW_VERSION)"
          setVariables "ARTIFACT_NAME" $artifactName
          echo "##[debug] Full Artifact Name '$artifactName'"
          echo "##vso[task.setvariable variable=ARTIFACT_NAME;isOutput=true]$artifactName"

    - task: Bash@3
      displayName: 'Download Artifacts from Nexus'
      condition: and(
        succeeded(),
        eq(${{ parameters.reuseArtifacts }}, True))
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          set -e

          file_name="$(artifact_name.ARTIFACT_NAME).tgz"
          nexus_url="$(NEXUS_REPOSITORY_URL)/$(NEXUS_REPOSITORY)/$(NEXUS_COMPONENT_GROUP)/$(artifact_name.ARTIFACT_NAME_ONLY)/-/$file_name"
          download_path="$(System.ArtifactsDirectory)"

          echo "##[debug] Fetching artifact $file_name from: $nexus_url"

          echo "##[debug] Download path: $download_path"
          cd $download_path
          curl -u $(NEXUS_DEPS_USR):$(NEXUS_DEPS_PSW) -O $nexus_url

          echo "$(ls -lha '$(System.ArtifactsDirectory)')"
          file -b $file_name

          mkdir -p $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)
          tar -zxf $download_path/$file_name -C $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)

          shopt -s dotglob
          mv $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/*/* $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/
          rm -rf $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/.azuredevops
          cp -r $(System.DefaultWorkingDirectory)/.azuredevops $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/.azuredevops
          shopt -u dotglob

          echo "##[debug] Target directory content:"
          echo "$(ls -lha '$(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)')"

          echo "##[debug] package.json:"
          cat $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/package.json

          touch $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/$file_name

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    - task: Bash@3
      displayName: 'Update npmrc file and path'
      condition: and(
        succeeded(),
        eq(${{ parameters.reuseArtifacts }}, True))
      inputs:
        targetType: inline
        script: |
          echo "Update npmrc path to: $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)"
          DEFAULT_NPMRC_TEMP_PATH=$(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)

          echo "Update npmrc file path to: $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/.npmrc"
          DEFAULT_NPMRC_TEMP_FILE_PATH=$(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)/.npmrc

          echo "##vso[task.setvariable variable=DEFAULT_NPMRC_TEMP_PATH]$DEFAULT_NPMRC_TEMP_PATH"
          echo "npmrc path is $DEFAULT_NPMRC_TEMP_PATH"

          echo "##vso[task.setvariable variable=DEFAULT_NPMRC_TEMP_FILE_PATH]$DEFAULT_NPMRC_TEMP_FILE_PATH"
          echo "npmrc file path is $DEFAULT_NPMRC_TEMP_FILE_PATH"

    - bash: |
         echo "##[debug]DEFAULT_NPMRC_TEMP_FILE_PATH.....: $(DEFAULT_NPMRC_TEMP_FILE_PATH)"

         if [ -f .npmrc ]; then
           cp .npmrc $(DEFAULT_NPMRC_TEMP_FILE_PATH)
         else
           echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
           echo "##[error]O arquivo .npmrc não foi encontrado!"
           exit 1;
         fi

         echo ##vso[task.setvariable variable=NPM_CONFIG_USERCONFIG]$(DEFAULT_NPMRC_TEMP_FILE_PATH)
      displayName: "Setting up .npmrc"
      workingDirectory: "${{ parameters.artifactDir }}"
      env:
        DEFAULT_NPMRC_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)

    - task: npmAuthenticate@0
      inputs:
        workingFile: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
      displayName: Set dependencies credentials (Azure Artifacts)
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    - bash: |
        if [ -f .npmrc ]; then
          auth_opt="email=vivo.devops.br@telefonica.com\nalways-auth=true"
          auth=$(echo -n ${NEXUS_DEFAULT_USR}:${NEXUS_DEFAULT_PSW} | openssl base64)
          repos=$(grep -o "registry=.*" .npmrc | cut -d':' -f2 | awk -v auth="$auth" '{print $0 ":_auth="auth""}')
          { printf '\n'; echo -e "$repos\n$auth_opt"; } | tee -a >(cat >> .npmrc) > /dev/null
          echo "##[debug]Credenciais configuradas!"
        else
          echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
          echo "##[error]O arquivo .npmrc não foi encontrado!"
        exit 1;
        fi

      displayName: "Set dependencies credentials (Nexus)"
      workingDirectory: $(DEFAULT_NPMRC_TEMP_PATH)
      env:    
        NEXUS_DEFAULT_USR: $(NEXUS-DEFAULT-USR)
        NEXUS_DEFAULT_PSW: $(NEXUS-DEFAULT-PSW)  
    ## -> Bump version in code and build code.

    # - task: Bash@3
    #   displayName: "Reading properties file"
    #   name: properties
    #   condition: succeeded()
    #   inputs:
    #     targetType: inline
    #     script: |

    #       echo "Reading properties.yaml file..."
    #       IMAGE_REGISTRY=$(cat .azuredevops/variables/properties.yaml | grep IMAGE_REGISTRY | awk '{print $2}')
    #       IMAGE_NAME=$(cat .azuredevops/variables/properties.yaml | grep IMAGE_NAME | awk '{print $2}')
    #       CHART_REPOSITORY=$(cat .azuredevops/variables/properties.yaml | grep CHART_REPOSITORY | awk '{print $2}')
    #       CHART_NAME=$(cat .azuredevops/variables/properties.yaml | grep CHART_NAME | awk '{print $2}')
    #       CHART_VERSION=$(cat .azuredevops/variables/properties.yaml | grep CHART_VERSION | awk '{print $2}')
    #       APPLICATION_NAME=$(cat .azuredevops/variables/properties.yaml | grep APPLICATION_NAME | awk '{print $2}')
    #       WAIT_TIMEOUT=$(cat .azuredevops/variables/properties.yaml | grep WAIT_TIMEOUT | awk '{print $2}')
    #       echo "##vso[task.setvariable variable=IMAGE_REGISTRY;isOutput=true]${IMAGE_REGISTRY}"
    #       echo "##vso[task.setvariable variable=IMAGE_NAME;isOutput=true]${IMAGE_NAME}"
    #       echo "##vso[task.setvariable variable=CHART_REPOSITORY;isOutput=true]${CHART_REPOSITORY}"
    #       echo "##vso[task.setvariable variable=CHART_NAME;isOutput=true]${CHART_NAME}"
    #       echo "##vso[task.setvariable variable=CHART_VERSION;isOutput=true]${CHART_VERSION}"
    #       echo "##vso[task.setvariable variable=APPLICATION_NAME;isOutput=true]${APPLICATION_NAME}"
    #       echo "##vso[task.setvariable variable=WAIT_TIMEOUT;isOutput=true]${WAIT_TIMEOUT}"
          
    #       echo "##[debug]IMAGE_REGISTRY: ${IMAGE_REGISTRY}"

    #       echo "##[group] Properties for deployment"
    #       echo "##[debug]IMAGE_REGISTRY: ${IMAGE_REGISTRY}"
    #       echo "##[debug]IMAGE_NAME: ${IMAGE_NAME}"
    #       echo "##[debug]CHART_REPOSITORY: ${CHART_REPOSITORY}"
    #       echo "##[debug]CHART_NAME: ${CHART_NAME}"
    #       echo "##[debug]CHART_VERSION: ${CHART_VERSION}"
    #       echo "##[debug]APPLICATION_NAME: ${APPLICATION_NAME}"
    #       echo "##[debug]WAIT_TIMEOUT: ${WAIT_TIMEOUT}"
    #       echo "##[endgroup]"

    - task: Docker@2
      name: login_devops
      displayName: 'Login to Docker Registry'
      continueOnError: true
      inputs:
        containerRegistry: ACR-DEVOPS
        command: 'login'

    - task: Bash@3
      displayName: 'Set build location and commands'
      name: set_commands
      inputs:
        targetType: inline
        script: |
          echo "NODEJS_CMD_BUILD: $(NODEJS_CMD_BUILD)"
          echo "NODEJS_CMD_BUILD_TEST: $(NODEJS_CMD_BUILD_TEST)"
          echo "NODEJS_CMD_BUILD_POST_TEST: $(NODEJS_CMD_BUILD_POST_TEST)"

          BUILD_LOCATION=.
          BUILD_COMMAND="$NODEJS_CMD_BUILD && $NODEJS_CMD_BUILD_TEST && $NODEJS_CMD_BUILD_POST_TEST"
          
          if [ "${{ parameters.reuseArtifacts }}" = "True" ]; then
            echo "##[debug] Using settings for reuseble artifact"

            INSTALL_CMD=$(echo "$NODEJS_CMD_BUILD" | cut -d'&' -f1 | xargs)
            if [ "$INSTALL_CMD" = "npm ci" ] || [ "$INSTALL_CMD" = "npm install" ]; then
              BUILD_COMMAND="$INSTALL_CMD"
            else
              BUILD_COMMAND="npm install"
            fi
          fi

          echo "##vso[task.setvariable variable=BUILD_LOCATION]$BUILD_LOCATION"
          echo "BUILD_LOCATION: $BUILD_LOCATION"

          echo "##vso[task.setvariable variable=BUILD_COMMAND]$BUILD_COMMAND"
          echo "BUILD_COMMAND: $BUILD_COMMAND"

    
    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(BUILD_LOCATION)
        policySets: |
          image-definition-files

    - task: Bash@3
      displayName: Build Version
      name: build_version
      condition: and(
        succeeded(), 
        eq(variables.new_version.NEW_VERSION, ''), 
        eq(${{ parameters.reuseArtifacts }}, False))
      continueOnError: false
      inputs:
        targetType: inline
        script: >
          set -e
          
          BUILDER_IMAGE_NAME="builder/node"

          docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile $(BUILD_LOCATION)

          echo "###[debug]docker run --rm \
              --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
              --network host \
              --log-driver none \
              -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
              -e HTTPS_PROXY=$(PROXY_AGENT_HTTPS) \
              -e PUPPETEER_SKIP_DOWNLOAD=true \
              -e HTTP_PROXY=$(PROXY_AGENT_HTTP) \
              -e NO_PROXY=$(PROXY_AGENT_NO_PROXY) \
              -e TZ="America/Sao_Paulo" \
              -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
              -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
              -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
              -e NPM_CONFIG_CACHE=/tmp/npm-cache \
              -e JEST_CLOVER_OUTPUT_DIR=./_devops/test \
              -v $(pwd):/app \
              -v $(DEFAULT_NPMRC_TEMP_FILE_PATH):/tmp/.npmrc \
              -w $(DOCKER_WORKDIR) \
              $BUILDER_IMAGE_NAME sh -c '$(BUILD_COMMAND)'"

          docker run --rm \
              --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
              --network host \
              --log-driver none \
              -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
              -e HTTPS_PROXY=$(PROXY_AGENT_HTTPS) \
              -e PUPPETEER_SKIP_DOWNLOAD=true \
              -e HTTP_PROXY=$(PROXY_AGENT_HTTP) \
              -e NO_PROXY=$(PROXY_AGENT_NO_PROXY) \
              -e TZ="America/Sao_Paulo" \
              -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
              -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
              -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
              -e NPM_CONFIG_CACHE=/tmp/npm-cache \
              -e JEST_CLOVER_OUTPUT_DIR=./_devops/test \
              -v $(pwd):/app \
              -v $(DEFAULT_NPMRC_TEMP_FILE_PATH):/tmp/.npmrc \
              -w $(DOCKER_WORKDIR) \
              $BUILDER_IMAGE_NAME sh -c "$(BUILD_COMMAND)"
                    

          echo "##[debug] Build with version: $(new_version.NEW_VERSION)"

          if [[ "${BUMP_VERSION_ENABLED}" == 'true' ]]; then
            npm --no-git-tag-version version $(new_version.NEW_VERSION) --allow-same-version
          fi

    - task: Bash@3
      displayName: Install dependencies
      name: install_dependencies
      condition: and(
        succeeded(), 
        eq(variables.new_version.NEW_VERSION, ''), 
        eq(${{ parameters.reuseArtifacts }}, True))
      continueOnError: false
      inputs:
        targetType: inline
        script: >
          set -e

          ARTIFACT_LOCATION=$(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)

          BUILDER_IMAGE_NAME="builder/node"

          docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile $(BUILD_LOCATION)

          echo "###[debug]docker run --rm \
              --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
              --network host \
              --log-driver none \
              -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
              -e HTTPS_PROXY=$(PROXY_AGENT_HTTPS) \
              -e PUPPETEER_SKIP_DOWNLOAD=true \
              -e HTTP_PROXY=$(PROXY_AGENT_HTTP) \
              -e NO_PROXY=$(PROXY_AGENT_NO_PROXY) \
              -e TZ="America/Sao_Paulo" \
              -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
              -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
              -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
              -e NPM_CONFIG_CACHE=/tmp/npm-cache \
              -v $ARTIFACT_LOCATION:/app \
              -v $(DEFAULT_NPMRC_TEMP_FILE_PATH):/tmp/.npmrc \
              -w $(DOCKER_WORKDIR) \
              $BUILDER_IMAGE_NAME sh -c '$(BUILD_COMMAND)'"

          docker run --rm \
              --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
              --network host \
              --log-driver none \
              -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
              -e HTTPS_PROXY=$(PROXY_AGENT_HTTPS) \
              -e PUPPETEER_SKIP_DOWNLOAD=true \
              -e HTTP_PROXY=$(PROXY_AGENT_HTTP) \
              -e NO_PROXY=$(PROXY_AGENT_NO_PROXY) \
              -e TZ="America/Sao_Paulo" \
              -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
              -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
              -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
              -e NPM_CONFIG_CACHE=/tmp/npm-cache \
              -v $ARTIFACT_LOCATION:/app \
              -v $(DEFAULT_NPMRC_TEMP_FILE_PATH):/tmp/.npmrc \
              -w $(DOCKER_WORKDIR) \
              $BUILDER_IMAGE_NAME sh -c "$(BUILD_COMMAND)"

          ls -la $ARTIFACT_LOCATION

    - script: | 
        if [ "${{ parameters.reuseArtifacts }}" = "True" ]; then
          echo "##[debug] Using settings for reuseble artifact"

          cd $(DEFAULT_WORKDIR_ARTIFACTS)/$(APPLICATION_NAME)
        fi
        
        zip -r -q --symlinks '$(Build.ArtifactStagingDirectory)/$(artifact_name.ARTIFACT_NAME).zip' . -x .git/\* ?/\* \*/npm-cache/\* \*/\*.log
      displayName: 'Add zip with symlinks'

    ## -> Compress artifacts into tar. This allows it to use less space and to be used in other stages, jobs or tasks.
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      condition: succeeded()
      continueOnError: false
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(artifact_name.ARTIFACT_NAME).zip'
        ArtifactName: $(artifact_name.ARTIFACT_NAME)
        StoreAsTar: true

    ## -> Publish results for JUnit tests
    - task: PublishTestResults@2
      name: t_publish_test_result
      displayName: Publish Test Results
      condition: eq(${{ parameters.reuseArtifacts }}, False)
      inputs:
        mergeTestResults: true
        searchFolder: $(Build.SourcesDirectory)
        testResultsFiles: '**/TEST-*.xml'
        testResultsFormat: JUnit
        testRunTitle: Test Results
        failTaskOnFailedTests: true
        publishRunAttachments: false
      continueOnError: true

    ## -> Publish results for Code Coverage
    - task: PublishCodeCoverageResults@1
      name: t_publish_code_coverage_result
      displayName: 'Publish Code Coverage Result'
      condition: eq(${{ parameters.reuseArtifacts }}, False)
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_SUMMARY_FILE_LOCATION)/lcov.info
        pathToSources: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH_TO_SOURCE)
        reportDirectory: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_REPORT_DIRECTORY)/lcov-report
        additionalCodeCoverageFiles: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_REPORT_DIRECTORY)/**/*.xml
      continueOnError: true