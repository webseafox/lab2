## ========================================================================
## Pipeline for Generic YAML Editing
## ========================================================================
## This pipeline allows structured YAML editing across multiple repositories
## using yq (YAML processor) for reliable, indentation-aware edits.
##
## Supported Operations:
##   - add-pipeline-parameter: Add parameter to .parameters array (specialized - auto-syncs extends)
##   - set-value: Set value at any YAML path (requires existing path)
##   - delete-path: Delete any YAML path (skips if path doesn't exist)
##
## Operation Details:
##
## 1. add-pipeline-parameter (Specialized):
##    - Always operates on .parameters array
##    - Automatically syncs extends.parameters section
##    - Preserves blank lines between parameters
##    - Validates: parameter added, no duplicates, extends synced
##    - valueDefinition: JSON object with {name, type, displayName, default, ...}
##    - Example: {"name": "foo", "type": "string", "default": "bar"}
##
## 2. set-value (Generic):
##    - Sets value at targetProperty path (yq syntax)
##    - Requires path to exist (skips if path doesn't exist)
##    - Validates: value was set at target path
##    - valueDefinition: JSON scalar or object
##    - Examples:
##      - targetProperty: .spec.replicas, valueDefinition: 3
##      - targetProperty: .variables.FOO, valueDefinition: "bar"
##      - targetProperty: .spec.resources, valueDefinition: {"limits": {"cpu": "1"}}
##
## 3. delete-path (Generic):
##    - Deletes targetProperty path (yq syntax)
##    - Skips if path doesn't exist (no error)
##    - Validates: path no longer exists
##    - valueDefinition: IGNORED for delete operation
##    - Example: targetProperty: .deprecated.section
##
## Advantages over pipeline_replace_from_repo.yml:
##   - Structured YAML editing (not string replacement)
##   - Automatic YAML structure validation
##   - Operation-specific validation
##   - Preserves YAML formatting
##
## Parameters:
##   - operation: Type of YAML edit operation
##   - targetProperty: YAML path (yq syntax) - IGNORED for add-pipeline-parameter
##   - valueDefinition: JSON string (scalar, object, or array) - IGNORED for delete-path
##   - targetFilePath: File path pattern (supports wildcards)
##   - projectName: Azure DevOps project name
##   - branch: Target branch (default: master)
##   - startsWith/endsWith: Repository filters
##   - specificRepositories: Explicit repository list
##   - dryRun: Simulate without applying changes
##   - commitMessage: Commit message (required)
##   - skipCi: Add [CI SKIP] to commit
##
## Execution Identifier:
##   - A unique ID is automatically generated for each execution
##   - Format: [YML-EDIT-XXXXXX] where XXXXXX is a unique identifier
##   - Use this ID in the revert pipeline to undo changes
##
## Queue Time Variables:
##   - AZURE_DEVOPS_PAT: Personal PAT of the executor (insert as secret)
##
## Prerequisites:
##   1. Executor must have a valid PAT with permissions: Code (Read & Write)
##   2. When running the pipeline, enter PAT in AZURE_DEVOPS_PAT variable
##      and check "Keep this value secret"
##   3. yq (mikefarah/yq v4) will be installed if not available
##
## Usage Examples:
##
##   Example 1 - add-pipeline-parameter:
##     operation: add-pipeline-parameter
##     targetProperty: (ignored)
##     valueDefinition: '{"name": "resourcesAndHpaValues", "displayName": "Recursos", "type": "object", "default": {"cpu": "1"}}'
##     targetFilePath: app-*-ci.yml
##
##   Example 2 - set-value (scalar):
##     operation: set-value
##     targetProperty: .spec.replicas
##     valueDefinition: 3
##     targetFilePath: deployment.yml
##
##   Example 3 - set-value (object):
##     operation: set-value
##     targetProperty: .variables.CONFIG
##     valueDefinition: '{"key1": "value1", "key2": "value2"}'
##     targetFilePath: config.yml
##
##   Example 4 - delete-path:
##     operation: delete-path
##     targetProperty: .deprecated.section
##     valueDefinition: (ignored)
##     targetFilePath: config.yml
##
## ========================================================================

parameters:
  - name: dryRun
    displayName: "Dry Run (não aplicar alterações)"
    type: boolean
    default: true

  - name: projectName
    displayName: "Nome do Projeto"
    type: string
    default: ""
    values:
      - FRBR - FRAMEWORK BRASIL
      - APPV - APP VIVO
      - APPV - Microservicosmeuvivo
      - APPV - Microservicos4p

  - name: targetFilePath
    displayName: "Caminho do Arquivo (ex: /.azuredevops/pipelines/buildpack.yml)"
    type: string
    default: ""

  - name: operation
    displayName: "Tipo de Operação"
    type: string
    default: "add-pipeline-parameter"
    values:
      - "add-pipeline-parameter"
      - "set-value"
      - "delete-path"

  - name: targetProperty
    displayName: "Propriedade Alvo (sintaxe yq, ex: .spec.replicas)"
    type: string
    default: " "

  - name: valueDefinition
    displayName: "Valor/Definição (JSON - objeto para add-pipeline-parameter, qualquer tipo para set-value)"
    type: string
    default: '{"name": "newParameter", "displayName": "New Parameter", "type": "string", "default": "value"}'

  - name: startsWith
    displayName: "Repositório começa com (use * para todos)"
    type: string
    default: "src"

  - name: endsWith
    displayName: "Repositório termina com (use * para todos)"
    type: string
    default: "*"

  - name: specificRepositories
    displayName: "Repositórios Específicos (1 por linha, deixe vazio para todos)"
    type: object
    default: []

  - name: branch
    displayName: "Branch Alvo"
    type: string
    default: "master"

  - name: commitMessage
    displayName: "Mensagem do Commit"
    type: string

  - name: skipCi
    displayName: "Adicionar [CI SKIP] ao commit (evita trigger de pipelines)"
    type: boolean
    default: true

trigger: none
pr: none

name: "YML-EDIT-$(Date:yyyyMMdd)-$(Rev:r)"

variables:
  - name: AZURE_DEVOPS_ORG
    value: "https://dev.azure.com/telefonica-vivo-brasil"

jobs:
  - job: yml_editor
    displayName: "YAML Editor"
    steps:
      # ================================================================
      # Task 1: Validate Parameters
      # ================================================================
      - task: Bash@3
        name: validate_parameters
        displayName: "1. Validate Parameters"
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]PARAMETER VALIDATION"
            echo "##[section]============================================================"

            OPERATION='${{ parameters.operation }}'
            TARGET_FILE_PATH='${{ parameters.targetFilePath }}'
            STARTS_WITH='${{ parameters.startsWith }}'
            ENDS_WITH='${{ parameters.endsWith }}'
            PROJECT_NAME='${{ parameters.projectName }}'
            DRY_RUN='${{ parameters.dryRun }}'
            TARGET_PROP='${{ parameters.targetProperty }}'
            VALUE_DEF='${{ parameters.valueDefinition }}'

            echo "##[debug]Operation: ${OPERATION}"
            echo "##[debug]Target File Path: ${TARGET_FILE_PATH}"
            echo "##[debug]Filter startsWith: ${STARTS_WITH}"
            echo "##[debug]Filter endsWith: ${ENDS_WITH}"
            echo "##[debug]Project Name: ${PROJECT_NAME}"
            echo "##[debug]Dry Run: ${DRY_RUN}"

            # Validation 1: Project name is required
            if [ -z "${PROJECT_NAME}" ]; then
              echo "##[error] Project name is required"
              exit 1
            fi

            # Validation 2: Target file path is required
            if [ -z "${TARGET_FILE_PATH}" ]; then
              echo "##[error] Target file path is required"
              exit 1
            fi

            # Validation 3: Filter validation
            SPECIFIC_REPOS='${{ convertToJson(parameters.specificRepositories) }}'
            SPECIFIC_REPOS_COUNT=$(echo "${SPECIFIC_REPOS}" | jq '. | length')
            echo "##[debug]Specific repositories count: ${SPECIFIC_REPOS_COUNT}"

            # At least one filter must be set (not all wildcards with empty specific list)
            if [ "${STARTS_WITH}" == "*" ] && [ "${ENDS_WITH}" == "*" ] && [ "${SPECIFIC_REPOS_COUNT}" -eq 0 ]; then
              echo "##[warning]All filters are wildcards - this will process ALL repositories"
            fi

            # Validation 4: Operation-specific validation
            case "$OPERATION" in
              "add-pipeline-parameter")
                # Validate valueDefinition is valid JSON
                echo "##[debug]Validating valueDefinition: $VALUE_DEF"
                set +e
                VALUE_JSON=$(echo "$VALUE_DEF" | jq '.' 2>&1)
                JQ_EXIT_CODE=$?
                set -e
                
                if [ $JQ_EXIT_CODE -ne 0 ]; then
                  echo "##[error] valueDefinition must be valid JSON for add-pipeline-parameter operation"
                  echo "##[error] Provided value: $VALUE_DEF"
                  echo "##[error] jq error: $VALUE_JSON"
                  echo "##[error] Expected format: JSON object with 'name', 'type', 'displayName', 'default' fields"
                  echo "##[error] Example: {\"name\": \"myParam\", \"type\": \"string\", \"displayName\": \"My Parameter\", \"default\": \"value\"}"
                  exit 1
                fi
                
                # Validate it's an object, not a scalar
                VALUE_TYPE=$(echo "$VALUE_JSON" | jq -r 'type')
                if [ "$VALUE_TYPE" != "object" ]; then
                  echo "##[error] valueDefinition must be a JSON object for add-pipeline-parameter operation"
                  echo "##[error] Provided type: $VALUE_TYPE"
                  echo "##[error] Provided value: $VALUE_DEF"
                  echo "##[error] Expected format: {\"name\": \"paramName\", \"type\": \"string\", \"displayName\": \"Display Name\", \"default\": \"defaultValue\"}"
                  echo "##[error] For setting simple values, use operation 'set-value' instead"
                  exit 1
                fi
                
                # Extract and validate parameter name and type
                set +e
                PARAM_NAME=$(echo "$VALUE_JSON" | jq -r '.name // empty' 2>&1)
                PARAM_NAME_EXIT=$?
                PARAM_TYPE=$(echo "$VALUE_JSON" | jq -r '.type // empty' 2>&1)
                PARAM_TYPE_EXIT=$?
                set -e
                
                if [ $PARAM_NAME_EXIT -ne 0 ]; then
                  echo "##[error] Failed to extract 'name' field from valueDefinition"
                  echo "##[error] jq error: $PARAM_NAME"
                  exit 1
                fi
                
                if [ $PARAM_TYPE_EXIT -ne 0 ]; then
                  echo "##[error] Failed to extract 'type' field from valueDefinition"
                  echo "##[error] jq error: $PARAM_TYPE"
                  exit 1
                fi
                
                if [ -z "$PARAM_NAME" ]; then
                  echo "##[error] valueDefinition must include 'name' field for add-pipeline-parameter operation"
                  echo "##[error] Provided value: $VALUE_DEF"
                  echo "##[error] Example: {\"name\": \"myParam\", \"type\": \"string\", \"default\": \"value\"}"
                  exit 1
                fi
                if [ -z "$PARAM_TYPE" ]; then
                  echo "##[error] valueDefinition must include 'type' field for add-pipeline-parameter operation"
                  echo "##[error] Provided value: $VALUE_DEF"
                  echo "##[error] Example: {\"name\": \"myParam\", \"type\": \"string\", \"default\": \"value\"}"
                  exit 1
                fi
                
                echo "##[debug]Parameter name: $PARAM_NAME"
                echo "##[debug]Parameter type: $PARAM_TYPE"
                
                # Set variable for use in other tasks
                echo "##vso[task.setvariable variable=PARAM_NAME]${PARAM_NAME}"
                ;;
                
              "set-value")
                # Validate targetProperty is provided
                if [ -z "$TARGET_PROP" ]; then
                  echo "##[error] targetProperty is required for set-value operation"
                  exit 1
                fi
                
                # Validate valueDefinition is valid JSON
                echo "##[debug]Validating valueDefinition: $VALUE_DEF"
                set +e
                VALUE_JSON=$(echo "$VALUE_DEF" | jq '.' 2>&1)
                JQ_EXIT_CODE=$?
                set -e
                
                if [ $JQ_EXIT_CODE -ne 0 ]; then
                  echo "##[error] valueDefinition must be valid JSON for set-value operation"
                  echo "##[error] Provided value: $VALUE_DEF"
                  echo "##[error] jq error: $VALUE_JSON"
                  exit 1
                fi
                
                echo "##[debug]Target property: $TARGET_PROP"
                echo "##[debug]Value: $VALUE_JSON"
                ;;
                
              "delete-path")
                # Validate targetProperty is provided
                if [ -z "$TARGET_PROP" ]; then
                  echo "##[error] targetProperty is required for delete-path operation"
                  exit 1
                fi
                
                echo "##[debug]Target property to delete: $TARGET_PROP"
                # valueDefinition is ignored for delete-path
                ;;
                
              *)
                echo "##[error] Unknown operation: $OPERATION"
                exit 1
                ;;
            esac

            echo "##[section]Validation completed successfully"

            # Generate unique execution identifier
            EXECUTION_ID="YML-EDIT-$(date +%s | sha256sum | head -c 6 | tr '[:lower:]' '[:upper:]')"
            echo ""
            echo "##[section]============================================================"
            echo "##[section]EXECUTION IDENTIFIER: $EXECUTION_ID"
            echo "##[section]============================================================"
            echo "##[warning]Save this identifier to revert changes later!"
            echo "##[command]Use it in pipeline 'pipeline_revert_from_repo.yml'"
            echo "##[section]============================================================"
            echo ""

            # Set pipeline variables for next tasks
            echo "##vso[task.setvariable variable=OPERATION]${OPERATION}"
            echo "##vso[task.setvariable variable=EXECUTION_ID]${EXECUTION_ID}"

      # ================================================================
      # Task 2: Setup & Dependencies
      # ================================================================
      - task: Bash@3
        name: setup
        displayName: "2. Setup & Install Dependencies"
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]SETUP & DEPENDENCIES"
            echo "##[section]============================================================"

            # Check jq
            if ! command -v jq &> /dev/null; then
              echo "Installing jq..."
              sudo apt-get update && sudo apt-get install -y jq
            fi
            echo "##[command]jq: OK"

            # Check PAT
            if [ -z "$AZURE_DEVOPS_PAT" ]; then
              echo "##[error] Variable AZURE_DEVOPS_PAT was not provided."
              echo "##[error] When running the pipeline, enter your personal PAT in the AZURE_DEVOPS_PAT variable."
              echo "##[error] Check 'Keep this value secret' to protect your token."
              exit 1
            fi
            echo "##[command]PAT: OK"

            # Check and install yq if needed
            echo "##[group]Checking yq installation"
            if command -v yq &> /dev/null; then
              YQ_VERSION=$(yq --version)
              echo "##[debug]yq is already installed: ${YQ_VERSION}"
            else
              echo "##[warning]yq not found, installing..."
              YQ_VERSION="v4.35.1"
              YQ_BINARY="yq_linux_amd64"
              wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" -O /tmp/yq
              chmod +x /tmp/yq
              sudo mv /tmp/yq /usr/local/bin/yq
              echo "##[debug]yq installed: $(yq --version)"
            fi
            echo "##[endgroup]"

            # Create working directory
            WORK_DIR="${AGENT_TEMPDIRECTORY}/yml_editor_${BUILD_BUILDID}"
            mkdir -p "${WORK_DIR}"
            echo "##[debug]Working directory: ${WORK_DIR}"
            echo "##vso[task.setvariable variable=WORK_DIR]${WORK_DIR}"

            # Copy operation scripts to work directory
            REPO_ROOT="${BUILD_SOURCESDIRECTORY}"
            OPERATIONS_SOURCE="${REPO_ROOT}/tech_products/appv/common/scripts/yml-editor/operations"
            OPERATIONS_DEST="${WORK_DIR}/operations"
            
            echo "##[debug]Copying operation scripts from ${OPERATIONS_SOURCE} to ${OPERATIONS_DEST}"
            mkdir -p "${OPERATIONS_DEST}"
            cp -r "${OPERATIONS_SOURCE}"/* "${OPERATIONS_DEST}/"
            chmod +x "${OPERATIONS_DEST}"/*.sh
            echo "##[debug]Operation scripts copied and made executable"

            # Save value definition to file (operation-dependent)
            OPERATION="$(OPERATION)"
            VALUE_DEF='${{ parameters.valueDefinition }}'

            case "$OPERATION" in
              "add-pipeline-parameter")
                # Convert JSON string to YAML and save
                echo "$VALUE_DEF" | jq '.' | yq eval -P '.' > "${WORK_DIR}/param_to_add.yml"
                echo "##[group]Parameter definition saved"
                cat "${WORK_DIR}/param_to_add.yml"
                echo "##[endgroup]"
                ;;
                
              "set-value")
                # Save JSON value to file for later use
                echo "$VALUE_DEF" > "${WORK_DIR}/value_to_set.json"
                echo "##[debug]Saved value to ${WORK_DIR}/value_to_set.json"
                ;;
                
              "delete-path")
                # No file needed for delete operation
                echo "##[debug]Delete operation - no value file needed"
                ;;
            esac

            echo "##[section]Setup completed successfully"

      # ================================================================
      # Task 3: List & Filter Repositories
      # ================================================================
      - task: Bash@3
        name: list_repositories
        displayName: "3. List & Filter Repositories"
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
          WORK_DIR: $(WORK_DIR)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]LIST & FILTER REPOSITORIES"
            echo "##[section]============================================================"

            PROJECT_NAME='${{ parameters.projectName }}'
            STARTS_WITH='${{ parameters.startsWith }}'
            ENDS_WITH='${{ parameters.endsWith }}'
            SPECIFIC_REPOS='${{ convertToJson(parameters.specificRepositories) }}'
            ORG_URL="${AZURE_DEVOPS_ORG}"

            SPECIFIC_REPOS_COUNT=$(echo "${SPECIFIC_REPOS}" | jq '. | length')

            AUTH_HEADER=$(printf ":%s" "$AZURE_DEVOPS_PAT" | base64 -w 0)
            PROJECT_ENCODED=$(echo "$PROJECT_NAME" | sed 's/ /%20/g')

            echo "##[command]Project: ${PROJECT_NAME}"
            echo "##[command]Filter startsWith: ${STARTS_WITH}"
            echo "##[command]Filter endsWith: ${ENDS_WITH}"
            if [ "${SPECIFIC_REPOS_COUNT}" -gt 0 ]; then
              echo "##[command]Specific repositories: ${SPECIFIC_REPOS_COUNT} repo(s)"
            else
              echo "##[command]Specific repositories: (all)"
            fi
            echo ""

            echo "##[group]Fetching repositories from project: ${PROJECT_NAME}"
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: Basic $AUTH_HEADER" \
              -H "Content-Type: application/json" \
              "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories?api-version=7.0")

            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
            REPOS_RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "##[error] Failed to list repositories. HTTP Status: $HTTP_CODE"
              echo "##[error] Response: $REPOS_RESPONSE"
              exit 1
            fi

            echo "$REPOS_RESPONSE" | jq '.value' > "${WORK_DIR}/all_repos.json"
            TOTAL_REPOS=$(jq '. | length' "${WORK_DIR}/all_repos.json")
            echo "##[debug]Total repositories in project: ${TOTAL_REPOS}"
            echo "##[endgroup]"

            # Prepare specific repositories list for filtering
            SPECIFIC_REPOS_FILE="${WORK_DIR}/specific_repos.txt"
            if [ "${SPECIFIC_REPOS_COUNT}" -gt 0 ]; then
              echo "${SPECIFIC_REPOS}" | jq -r '.[]? // empty' > "${SPECIFIC_REPOS_FILE}"
              echo "##[debug]Specific repos list:"
              cat "${SPECIFIC_REPOS_FILE}" || true
            fi

            # Function to check if repo is in specific list
            is_in_specific_list() {
              local repo_name="$1"
              local found=1
              while IFS= read -r specific_repo || [ -n "$specific_repo" ]; do
                [ -z "$specific_repo" ] && continue
                if [ "$repo_name" = "$specific_repo" ]; then
                  found=0
                  break
                fi
              done < "${SPECIFIC_REPOS_FILE}"
              return $found
            }

            # Apply filters (same logic as pipeline_replace_from_repo.yml)
            echo "##[group]Applying filters"
            jq -r '.[] | "\(.id)|\(.name)"' "${WORK_DIR}/all_repos.json" > "${WORK_DIR}/repos_list.txt"

            > "${WORK_DIR}/filtered_repos.txt"
            while IFS='|' read -r REPO_ID REPO_NAME; do
              # Filter by prefix (skip if not wildcard and doesn't match)
              if [ "${STARTS_WITH}" != "*" ]; then
                [[ ! "${REPO_NAME}" =~ ^${STARTS_WITH} ]] && continue
              fi
              
              # Filter by suffix (skip if not wildcard and doesn't match)
              if [ "${ENDS_WITH}" != "*" ]; then
                [[ ! "${REPO_NAME}" =~ ${ENDS_WITH}$ ]] && continue
              fi
              
              # Filter by specific list (skip if list exists and repo not in it)
              if [ "${SPECIFIC_REPOS_COUNT}" -gt 0 ]; then
                is_in_specific_list "${REPO_NAME}" || continue
              fi
              
              echo "${REPO_ID}|${REPO_NAME}" >> "${WORK_DIR}/filtered_repos.txt"
            done < "${WORK_DIR}/repos_list.txt"

            FILTERED_COUNT=$(wc -l < "${WORK_DIR}/filtered_repos.txt" 2>/dev/null || echo "0")
            echo "##[debug]Repositories after filter: ${FILTERED_COUNT}"
            echo "##[endgroup]"

            if [ "${FILTERED_COUNT}" -eq 0 ]; then
              echo "##[warning]No repositories matched the filter criteria"
              echo "##vso[task.setvariable variable=REPO_COUNT]0"
              exit 0
            fi

            echo "##[section]Repositories to process:"
            while IFS='|' read -r REPO_ID REPO_NAME; do
              echo "  - ${REPO_NAME}"
            done < "${WORK_DIR}/filtered_repos.txt"

            # Convert to JSON format for next task
            echo "[]" > "${WORK_DIR}/filtered_repos.json"
            while IFS='|' read -r REPO_ID REPO_NAME; do
              jq --arg id "${REPO_ID}" --arg name "${REPO_NAME}" '. += [{id: $id, name: $name}]' "${WORK_DIR}/filtered_repos.json" > "${WORK_DIR}/filtered_repos.tmp"
              mv "${WORK_DIR}/filtered_repos.tmp" "${WORK_DIR}/filtered_repos.json"
            done < "${WORK_DIR}/filtered_repos.txt"

            echo "##vso[task.setvariable variable=REPO_COUNT]${FILTERED_COUNT}"

      # ================================================================
      # Task 4: Process YAML Edits
      # ================================================================
      - task: Bash@3
        name: process_edits
        displayName: "4. Process YAML Edits"
        condition: and(succeeded(), gt(variables['REPO_COUNT'], 0))
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
          WORK_DIR: $(WORK_DIR)
          PARAM_NAME: $(PARAM_NAME)
          EXECUTION_ID: $(EXECUTION_ID)
          OPERATION: $(OPERATION)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]PROCESS YAML EDITS"
            echo "##[section]============================================================"

            # Retrieve variables
            TARGET_FILE_PATH='${{ parameters.targetFilePath }}'
            DRY_RUN='${{ parameters.dryRun }}'
            BRANCH='${{ parameters.branch }}'
            COMMIT_MESSAGE='${{ parameters.commitMessage }}'
            SKIP_CI='${{ parameters.skipCi }}'
            PROJECT_NAME='${{ parameters.projectName }}'
            TARGET_PROP='${{ parameters.targetProperty }}'
            VALUE_DEF='${{ parameters.valueDefinition }}'
            ORG_URL="${AZURE_DEVOPS_ORG}"

            # Set default commit message based on operation
            if [ -z "$COMMIT_MESSAGE" ] || [ "$COMMIT_MESSAGE" == " " ]; then
              case "$OPERATION" in
                "add-pipeline-parameter")
                  PARAM_NAME="$(PARAM_NAME)"
                  COMMIT_MESSAGE="Add parameter: ${PARAM_NAME}"
                  ;;
                "set-value")
                  COMMIT_MESSAGE="Set ${TARGET_PROP}"
                  ;;
                "delete-path")
                  COMMIT_MESSAGE="Delete ${TARGET_PROP}"
                  ;;
              esac
            fi

            # Build commit message with prefixes
            [ "$SKIP_CI" == "True" ] && COMMIT_MESSAGE="[CI SKIP][$EXECUTION_ID] $COMMIT_MESSAGE" || COMMIT_MESSAGE="[$EXECUTION_ID] $COMMIT_MESSAGE"

            # Update build name with DRY RUN prefix if applicable
            if [ "$DRY_RUN" == "True" ]; then
              echo "##vso[build.updatebuildnumber][DRY RUN] $COMMIT_MESSAGE"
            else
              echo "##vso[build.updatebuildnumber]$COMMIT_MESSAGE"
            fi

            # Setup auth and encoding
            AUTH_HEADER=$(printf ":%s" "$AZURE_DEVOPS_PAT" | base64 -w 0)
            PROJECT_ENCODED=$(echo "$PROJECT_NAME" | sed 's/ /%20/g')

            # Extract just the filename from path for temp files
            TARGET_FILE_NAME=$(basename "${TARGET_FILE_PATH}")

            # Initialize results tracking
            echo "[]" > "${WORK_DIR}/results.json"
            SUCCESS_COUNT=0
            FAIL_COUNT=0
            SKIP_COUNT=0

            # Create counter file for tracking (handles subshell issues)
            COUNTER_FILE="${WORK_DIR}/counters.txt"
            echo "0 0 0" > "$COUNTER_FILE"

            # Process each repository
            jq -c '.[]' "${WORK_DIR}/filtered_repos.json" | while read -r REPO; do
              REPO_NAME=$(echo "$REPO" | jq -r '.name')
              REPO_ID=$(echo "$REPO" | jq -r '.id')
              
              echo "##[group]Processing repository: ${REPO_NAME}"
              
              echo "##[debug]Fetching file: ${TARGET_FILE_PATH} from branch: ${BRANCH}"
              HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
                -H "Authorization: Basic $AUTH_HEADER" \
                "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/items?path=$TARGET_FILE_PATH&versionDescriptor.version=$BRANCH&api-version=7.0")
              
              HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
              FILE_CONTENT=$(echo "$HTTP_RESPONSE" | sed '$d')
              
              if [ "$HTTP_CODE" == "404" ]; then
                echo "##[warning]File not found: $TARGET_FILE_PATH. Skipping..."
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_SKIP=$((TOTAL_SKIP + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "skipped" --arg reason "File not found" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              elif [ "$HTTP_CODE" != "200" ]; then
                echo "##[error] Failed to fetch file. HTTP Status: $HTTP_CODE"
                echo "##[error] Response: $FILE_CONTENT"
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "failed" --arg reason "Failed to fetch file" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              fi
              
              TEMP_FILE="${WORK_DIR}/${REPO_NAME}_${TARGET_FILE_NAME}"
              TEMP_ORIGINAL="${TEMP_FILE}.original"
              echo "$FILE_CONTENT" > "$TEMP_FILE"
              cp "$TEMP_FILE" "$TEMP_ORIGINAL"
              
              # Export variables for operation scripts
              export TEMP_FILE
              export REPO_NAME
              export WORK_DIR
              export TARGET_FILE_PATH
              export COUNTER_FILE
              export TARGET_PROP
              export PARAM_NAME
              
              # Execute operation-specific script
              if ! bash "${WORK_DIR}/operations/${OPERATION}.sh"; then
                echo "##[endgroup]"
                continue
              fi
              
              # Check if changes were made (compare to original)
              if diff -q "$TEMP_ORIGINAL" "$TEMP_FILE" > /dev/null 2>&1; then
                echo "##[warning]No changes detected. Skipping..."
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_SKIP=$((TOTAL_SKIP + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "skipped" --arg reason "No changes needed" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              fi
              
              echo ""
              echo "##[section]Changes DIFF:"
              echo "------------------------------------------------------------"
              diff -u -w -B --label "a/$TARGET_FILE_PATH (original)" --label "b/$TARGET_FILE_PATH (modified)" \
                "$TEMP_ORIGINAL" "$TEMP_FILE" || true
              echo "------------------------------------------------------------"
              
              echo "##[section]Running validation checks..."
              VALIDATION_FAILED=false
              VALIDATION_REASON=""
              
              # Validation 1: YAML syntax check (ALWAYS)
              echo "##[debug]Validation 1: Checking YAML syntax..."
              if ! yq eval '.' "$TEMP_FILE" > /dev/null 2>&1; then
                VALIDATION_FAILED=true
                VALIDATION_REASON="Invalid YAML syntax after modifications"
                echo "##[error]YAML syntax validation failed"
              else
                echo "##[debug]YAML syntax valid"
              fi
              
              if [ "$VALIDATION_FAILED" = false ]; then
                case "$OPERATION" in
              "add-pipeline-parameter")
                    echo "##[debug]Validation 2: Verifying parameter '${PARAM_NAME}' exists..."
                    PARAM_EXISTS=$(yq eval ".parameters[] | select(.name == \"${PARAM_NAME}\") | .name" "$TEMP_FILE")
                    if [ -z "$PARAM_EXISTS" ]; then
                      VALIDATION_FAILED=true
                      VALIDATION_REASON="Parameter '${PARAM_NAME}' not found after addition"
                      echo "##[error]Parameter verification failed: parameter not found in modified file"
                    else
                      echo "##[debug]Parameter exists"
                    fi
                    
                    if [ "$VALIDATION_FAILED" = false ]; then
                      echo "##[debug]Validation 3: Checking for duplicate parameters..."
                      DUPLICATE_COUNT=$(yq eval ".parameters[] | select(.name == \"${PARAM_NAME}\") | .name" "$TEMP_FILE" | wc -l)
                      if [ "$DUPLICATE_COUNT" -gt 1 ]; then
                        VALIDATION_FAILED=true
                        VALIDATION_REASON="Duplicate parameter '${PARAM_NAME}' detected ($DUPLICATE_COUNT occurrences)"
                        echo "##[error]Duplicate parameter check failed: found $DUPLICATE_COUNT occurrences"
                      else
                        echo "##[debug]No duplicates"
                      fi
                    fi
                    
                    # Validation 4: Verify extends section sync (warning only, not fatal)
                    if [ "$VALIDATION_FAILED" = false ]; then
                      echo "##[debug]Validation 4: Checking extends section sync..."
                      if yq eval 'has("extends")' "$TEMP_FILE" | grep -q "true"; then
                        EXTENDS_HAS_PARAM=$(yq eval ".extends.parameters.${PARAM_NAME}" "$TEMP_FILE")
                        if [ "$EXTENDS_HAS_PARAM" = "null" ] || [ -z "$EXTENDS_HAS_PARAM" ]; then
                          echo "##[warning]Extends section does not reference parameter '${PARAM_NAME}'"
                          echo "##[warning]  This may be intentional, continuing..."
                        else
                          echo "##[debug]Extends synced"
                        fi
                      else
                        echo "##[debug]No extends section found, skipping sync check"
                      fi
                    fi
                    ;;
                    
                  "set-value")
                    echo "##[debug]Validation 2: Verifying ${TARGET_PROP} was set..."
                    NEW_VALUE=$(yq eval "${TARGET_PROP}" "$TEMP_FILE" 2>&1 || echo "null")
                    if [ "$NEW_VALUE" = "null" ]; then
                      VALIDATION_FAILED=true
                      VALIDATION_REASON="Value at ${TARGET_PROP} was not set"
                      echo "##[error]Set operation failed: value not found at target property"
                    else
                      echo "##[debug]Value set successfully"
                    fi
                    ;;
                    
                  "delete-path")
                    echo "##[debug]Validation 2: Verifying ${TARGET_PROP} was deleted..."
                    PATH_CHECK=$(yq eval "${TARGET_PROP}" "$TEMP_FILE" 2>&1)
                    if [ "$PATH_CHECK" != "null" ] && ! echo "$PATH_CHECK" | grep -q "Error"; then
                      VALIDATION_FAILED=true
                      VALIDATION_REASON="Path ${TARGET_PROP} still exists after delete"
                      echo "##[error]Delete operation failed: path still exists"
                    else
                      echo "##[debug]Path deleted successfully"
                    fi
                    ;;
                esac
              fi
              
              if [ "$VALIDATION_FAILED" = true ]; then
                echo "##[warning]Validation failed: ${VALIDATION_REASON}. Skipping..."
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_SKIP=$((TOTAL_SKIP + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "validation-failed" --arg reason "$VALIDATION_REASON" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              fi
              
              
              if [ "${DRY_RUN}" == "True" ]; then
                echo ""
                echo "##[warning][DRY-RUN] Changes that would be made:"
                echo "##[command]  - Repository: $REPO_NAME"
                echo "##[command]  - File: $TARGET_FILE_PATH"
                echo "##[command]  - Branch: $BRANCH"
                echo "##[warning][DRY-RUN] Commit will NOT be created."
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_SUCCESS=$((TOTAL_SUCCESS + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "dry-run-success" \
                  '. += [{repo: $repo, status: $status}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              fi
              
              echo "##[debug]Getting branch object ID"
              BRANCH_RESPONSE=$(curl -s -X GET \
                -H "Authorization: Basic $AUTH_HEADER" \
                "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/refs?filter=heads/$BRANCH&api-version=7.0")
              
              BRANCH_OBJECT_ID=$(echo "$BRANCH_RESPONSE" | jq -r '.value[0].objectId // empty')
              if [ -z "$BRANCH_OBJECT_ID" ]; then
                echo "##[error] Failed to get branch object ID"
                read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
                echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
                jq --arg repo "${REPO_NAME}" --arg status "failed" --arg reason "Failed to get branch object ID" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                echo "##[endgroup]"
                continue
              fi
              
              echo "##[command]Creating commit..."
              NEW_CONTENT=$(cat "$TEMP_FILE")
              NEW_CONTENT_BASE64=$(echo "$NEW_CONTENT" | base64 -w 0)
              
              PUSH_PAYLOAD=$(cat <<EOF
            {
              "refUpdates": [{"name": "refs/heads/$BRANCH", "oldObjectId": "$BRANCH_OBJECT_ID"}],
              "commits": [{
                "comment": "$COMMIT_MESSAGE",
                "changes": [{
                  "changeType": "edit",
                  "item": {"path": "$TARGET_FILE_PATH"},
                  "newContent": {"content": "$NEW_CONTENT_BASE64", "contentType": "base64encoded"}
                }]
              }]
            }
            EOF
            )
              
              PUSH_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Basic $AUTH_HEADER" \
                -H "Content-Type: application/json" \
                -d "$PUSH_PAYLOAD" \
                "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/pushes?api-version=7.0")
              
              PUSH_ID=$(echo "$PUSH_RESPONSE" | jq -r '.pushId // empty')
              COMMIT_ID=$(echo "$PUSH_RESPONSE" | jq -r '.commits[0].commitId // empty')
              
              read TOTAL_SUCCESS TOTAL_FAIL TOTAL_SKIP < "$COUNTER_FILE"
              if [ -n "$PUSH_ID" ] && [ "$PUSH_ID" != "null" ]; then
                echo "##[section]Commit created successfully! Push ID: $PUSH_ID"
                if [ -n "$COMMIT_ID" ] && [ "$COMMIT_ID" != "null" ]; then
                  COMMIT_URL="$ORG_URL/$PROJECT_ENCODED/_git/$REPO_NAME/commit/$COMMIT_ID"
                  echo "##[section]Commit URL: $COMMIT_URL"
                  jq --arg repo "${REPO_NAME}" --arg status "success" --arg url "$COMMIT_URL" \
                    '. += [{repo: $repo, status: $status, commit_url: $url}]' \
                    "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                    mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                else
                  jq --arg repo "${REPO_NAME}" --arg status "success" \
                    '. += [{repo: $repo, status: $status}]' \
                    "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                    mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                fi
                TOTAL_SUCCESS=$((TOTAL_SUCCESS + 1))
              else
                ERROR_MSG=$(echo "$PUSH_RESPONSE" | jq -r '.message // "Unknown error"')
                echo "##[error] Failed to create commit: $ERROR_MSG"
                jq --arg repo "${REPO_NAME}" --arg status "failed" --arg reason "$ERROR_MSG" \
                  '. += [{repo: $repo, status: $status, reason: $reason}]' \
                  "${WORK_DIR}/results.json" > "${WORK_DIR}/results.tmp" && \
                  mv "${WORK_DIR}/results.tmp" "${WORK_DIR}/results.json"
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
              fi
              echo "$TOTAL_SUCCESS $TOTAL_FAIL $TOTAL_SKIP" > "$COUNTER_FILE"
              
              sleep 1
            done

            # Read final counters
            read SUCCESS_COUNT FAIL_COUNT SKIP_COUNT < "$COUNTER_FILE"
            rm -f "$COUNTER_FILE"

            echo ""
            echo "##[section]============================================================"
            echo "##[section]PROCESSING COMPLETED"
            echo "##[section]============================================================"
            echo "##[command]Total repositories processed: $((SUCCESS_COUNT + FAIL_COUNT + SKIP_COUNT))"
            echo "##[section]Successful: $SUCCESS_COUNT"
            echo "##[warning]Skipped: $SKIP_COUNT"
            [ "$FAIL_COUNT" -gt 0 ] && echo "##[error]Failed: $FAIL_COUNT" || echo "##[command]Failed: $FAIL_COUNT"

            echo "##vso[task.setvariable variable=SUCCESS_COUNT]${SUCCESS_COUNT}"
            echo "##vso[task.setvariable variable=FAIL_COUNT]${FAIL_COUNT}"
            echo "##vso[task.setvariable variable=SKIP_COUNT]${SKIP_COUNT}"

      # ================================================================
      # Task 5: Display Summary
      # ================================================================
      - task: Bash@3
        name: display_summary
        displayName: "5. Display Summary"
        condition: always()
        env:
          WORK_DIR: $(WORK_DIR)
          EXECUTION_ID: $(EXECUTION_ID)
          OPERATION: $(OPERATION)
          PARAM_NAME: $(PARAM_NAME)
        inputs:
          targetType: inline
          script: |
            echo "##[section]============================================================"
            echo "##[section]EXECUTION SUMMARY"
            echo "##[section]============================================================"
            echo ""
            echo "##[section]EXECUTION IDENTIFIER: ${EXECUTION_ID}"
            echo ""

            # Retrieve parameters
            TARGET_FILE_PATH='${{ parameters.targetFilePath }}'
            BRANCH='${{ parameters.branch }}'
            DRY_RUN='${{ parameters.dryRun }}'
            PROJECT_NAME='${{ parameters.projectName }}'
            TARGET_PROP='${{ parameters.targetProperty }}'

            echo "##[command]------------------------------------------------------------"
            echo "##[command]Project: ${PROJECT_NAME}"
            echo "##[command]Target File: ${TARGET_FILE_PATH}"
            echo "##[command]Branch: ${BRANCH}"
            echo "##[command]Operation: ${OPERATION}"

            # Display operation-specific info
            case "$OPERATION" in
              "add-pipeline-parameter")
                echo "##[command]Parameter: ${PARAM_NAME}"
                ;;
              "set-value"|"delete-path")
                echo "##[command]Target Property: ${TARGET_PROP}"
                ;;
            esac

            echo "##[command]Dry-run: ${DRY_RUN}"
            echo "##[command]------------------------------------------------------------"

            # Get counters (with defaults)
            SUCCESS_COUNT="${SUCCESS_COUNT:-0}"
            FAIL_COUNT="${FAIL_COUNT:-0}"
            SKIP_COUNT="${SKIP_COUNT:-0}"
            REPO_COUNT="${REPO_COUNT:-0}"
            TOTAL_PROCESSED=$((SUCCESS_COUNT + FAIL_COUNT + SKIP_COUNT))

            echo "##[command]Repositories processed: ${TOTAL_PROCESSED}"
            echo "##[section]Successfully modified: ${SUCCESS_COUNT}"
            echo "##[warning]Skipped (no changes): ${SKIP_COUNT}"
            [ "${FAIL_COUNT}" -gt 0 ] && echo "##[error]Errors: ${FAIL_COUNT}" || echo "##[command]Errors: ${FAIL_COUNT}"
            echo "##[section]============================================================"

            if [ "${DRY_RUN}" == "True" ]; then
              echo ""
              echo "##[warning]DRY-RUN MODE: No changes were applied."
              echo "##[command]Run again with 'Dry Run = false' to apply changes."
            else
              echo ""
              echo "##[command]To REVERT these changes, use:"
              echo "##[command]  Pipeline: pipeline_revert_from_repo.yml"
              echo "##[command]  Identifier: ${EXECUTION_ID}"
            fi

            if [ "${FAIL_COUNT}" -gt 0 ]; then
              echo ""
              echo "##[warning]There were ${FAIL_COUNT} error(s) during execution."
            fi

            # Display detailed results if available
            if [ -f "${WORK_DIR}/results.json" ]; then
              RESULTS_COUNT=$(jq '. | length' "${WORK_DIR}/results.json" 2>/dev/null || echo "0")
              if [ "${RESULTS_COUNT}" -gt 0 ]; then
                echo ""
                echo "##[group]Detailed Results"
                jq -r '.[] | "  - \(.repo): \(.status)\(if .reason then " (\(.reason))" else "" end)\(if .commit_url then " - " + .commit_url else "" end)"' \
                  "${WORK_DIR}/results.json" || echo "  Error reading results"
                echo "##[endgroup]"
              fi
            fi

            echo ""
            echo "Execution ID: ${EXECUTION_ID}"
            echo "Operation: ${OPERATION}"

            # Display operation-specific info
            case "$OPERATION" in
              "add-pipeline-parameter")
                echo "Parameter: ${PARAM_NAME}"
                ;;
              "set-value"|"delete-path")
                echo "Target Property: ${TARGET_PROP}"
                ;;
            esac

            echo "Mode: $([ \"${DRY_RUN}\" == \"True\" ] && echo \"DRY RUN\" || echo \"APPLY CHANGES\")"
            echo ""

            if [ "${REPO_COUNT}" == "0" ]; then
              echo "##[warning]No repositories matched the filter criteria"
              echo ""
              exit 0
            fi

            echo "Repositories processed: ${REPO_COUNT}"
            echo "  - Successful: ${SUCCESS_COUNT}"
            echo "  - Failed: ${FAIL_COUNT}"
            echo "  - Skipped: ${SKIP_COUNT}"
            echo ""

            if [ -f "${WORK_DIR}/results.json" ]; then
              echo "##[section]Detailed Results:"
              echo ""
              jq -r '.[] | "  - \(.repo): \(.status)\(if .reason then " (\(.reason))" else "" end)"' \
                "${WORK_DIR}/results.json" || echo "  No detailed results available"
              echo ""
            fi

            if [ "${DRY_RUN}" == "True" ]; then
              echo "##[warning]================================================"
              echo "##[warning]DRY RUN MODE - No changes were committed"
              echo "##[warning]Set dryRun=false to apply changes"
              echo "##[warning]================================================"
            elif [ ${SUCCESS_COUNT} -gt 0 ]; then
              echo "##[section]================================================"
              echo "##[section]Changes committed successfully!"
              echo "##[section]To revert: Use pipeline_revert_from_repo.yml"
              echo "##[section]Execution ID: ${EXECUTION_ID}"
              echo "##[section]================================================"
            fi

            echo ""
