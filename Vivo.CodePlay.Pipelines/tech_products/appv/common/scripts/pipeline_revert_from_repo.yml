## ========================================================================
## Pipeline para Reverter Modificações em Massa de Repositórios
## ========================================================================
## Esta pipeline permite reverter commits feitos pela pipeline de replace
## em múltiplos repositórios.
##
## Como usar:
##   1. Execute a pipeline pipeline_replace_from_repo.yml
##   2. Anote o identificador gerado (formato: MASS-XXXXXX)
##   3. Para reverter, execute esta pipeline informando o identificador
##
## Variáveis de Execução (Queue Time Variables):
##   - AZURE_DEVOPS_PAT: PAT pessoal do executor (inserir como secret)
##
## Pré-requisitos:
##   1. O executor deve ter um PAT válido com permissões: Code (Read & Write)
##   2. Ao executar a pipeline, inserir o PAT na variável AZURE_DEVOPS_PAT
##      e marcar como "Keep this value secret"
## ========================================================================

parameters:
  - name: dryRun
    displayName: "Dry Run (não aplicar alterações)"
    type: boolean
    default: true

  - name: projectName
    displayName: "Nome do Projeto"
    type: string
    default: ""
    values:
      - FRBR - FRAMEWORK BRASIL
      - APPV - APP VIVO
      - APPV - Microservicosmeuvivo
      - APPV - Microservicos4p

  - name: executionId
    displayName: "Identificador de Execução (ex: MASS-ABC123)"
    type: string
    default: ""

  - name: startsWith
    displayName: "Repositório começa com (use * para todos)"
    type: string
    default: "src"

  - name: endsWith
    displayName: "Repositório termina com (use * para todos)"
    type: string
    default: "*"

  - name: specificRepositories
    displayName: "Repositórios Específicos (1 por linha, deixe vazio para todos)"
    type: object
    default: []

  - name: branch
    displayName: "Branch Alvo"
    type: string
    default: "master"

  - name: revertCommitMessage
    displayName: "Mensagem do Commit de Reversão"
    type: string
    default: "rollback de alterações em massa"

  - name: skipCi
    displayName: "Adicionar [CI SKIP] ao commit (evita trigger de pipelines)"
    type: boolean
    default: true

trigger: none
pr: none

name: "MASS-REVERT-$(Date:yyyyMMdd)-$(Rev:r)"

pool:
  name: GeneralPurposeLinuxAgentsCD

variables:
  - name: AZURE_DEVOPS_ORG
    value: "https://dev.azure.com/telefonica-vivo-brasil"

jobs:
  - job: revert_in_repos
    displayName: "Revert modifications in repositories"
    steps:
      # ================================================================
      # Task 1: Validar parâmetros de entrada
      # ================================================================
      - task: Bash@3
        name: validar
        displayName: "1. Validate parameters"
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]PARAMETER VALIDATION"
            echo "##[section]============================================================"

            PROJECT_NAME='${{ parameters.projectName }}'
            EXECUTION_ID='${{ parameters.executionId }}'
            STARTS_WITH='${{ parameters.startsWith }}'
            ENDS_WITH='${{ parameters.endsWith }}'
            BRANCH='${{ parameters.branch }}'
            REVERT_COMMIT_MESSAGE='${{ parameters.revertCommitMessage }}'
            DRY_RUN='${{ parameters.dryRun }}'
            SKIP_CI='${{ parameters.skipCi }}'
            SPECIFIC_REPOS='${{ convertToJson(parameters.specificRepositories) }}'

            # Normalizar parâmetros opcionais
            STARTS_WITH=$(echo "$STARTS_WITH" | xargs)
            ENDS_WITH=$(echo "$ENDS_WITH" | xargs)
            EXECUTION_ID=$(echo "$EXECUTION_ID" | xargs)

            # Processar lista de repositórios específicos
            SPECIFIC_REPOS_LIST=$(echo "$SPECIFIC_REPOS" | jq -r '.[]? // empty' 2>/dev/null | xargs)
            SPECIFIC_REPOS_COUNT=$(echo "$SPECIFIC_REPOS" | jq -r 'length // 0' 2>/dev/null)

            # Tratar '*' como sem filtro
            [ "$STARTS_WITH" == "*" ] && STARTS_WITH=""
            [ "$ENDS_WITH" == "*" ] && ENDS_WITH=""

            # Validações obrigatórias
            [ -z "$PROJECT_NAME" ] && echo "##[error] Parameter 'projectName' is required." && exit 1
            [ -z "$EXECUTION_ID" ] && echo "##[error] Parameter 'executionId' is required. Provide the execution identifier (e.g.: MASS-ABC123)." && exit 1

            # O identificador é usado como filtro de mensagem
            SEARCH_PATTERN="[$EXECUTION_ID]"

            # Normalizar booleanos
            DRY_RUN=$(echo "$DRY_RUN" | tr '[:upper:]' '[:lower:]')
            [[ "$DRY_RUN" =~ ^(true|1|yes|y)$ ]] && DRY_RUN="true" || DRY_RUN="false"

            SKIP_CI=$(echo "$SKIP_CI" | tr '[:upper:]' '[:lower:]')
            [[ "$SKIP_CI" =~ ^(true|1|yes|y)$ ]] && SKIP_CI="true" || SKIP_CI="false"

            # Construir mensagem de commit com [CI SKIP] se configurado
            [ "$SKIP_CI" == "true" ] && REVERT_COMMIT_MESSAGE="[CI SKIP] $REVERT_COMMIT_MESSAGE"

            # Atualizar nome do build
            echo "##vso[build.updatebuildnumber]REVERT $EXECUTION_ID - $REVERT_COMMIT_MESSAGE"

            echo "##[group]Revert Parameters"
            echo "##[command]Project: $PROJECT_NAME"
            echo "##[section]Execution identifier: $EXECUTION_ID"
            echo "##[command]Search pattern: $SEARCH_PATTERN"
            echo "##[command]Repo prefix: ${STARTS_WITH:-'(no filter)'}"
            echo "##[command]Repo suffix: ${ENDS_WITH:-'(no filter)'}"
            echo "##[command]Branch: $BRANCH"
            echo "##[command]Dry-run: $DRY_RUN"
            echo "##[command]Skip CI: $SKIP_CI"
            if [ "$SPECIFIC_REPOS_COUNT" -gt 0 ]; then
              echo "##[command]Specific repositories ($SPECIFIC_REPOS_COUNT):"
              echo "$SPECIFIC_REPOS" | jq -r '.[]? // empty' 2>/dev/null | while read -r repo; do
                echo "##[command]  - $repo"
              done
            else
              echo "##[command]Specific repositories: (all)"
            fi
            echo "##[endgroup]"

            # Exportar variáveis
            echo "##vso[task.setvariable variable=PROJECT_NAME]$PROJECT_NAME"
            echo "##vso[task.setvariable variable=EXECUTION_ID]$EXECUTION_ID"
            echo "##vso[task.setvariable variable=SEARCH_PATTERN]$SEARCH_PATTERN"
            echo "##vso[task.setvariable variable=STARTS_WITH]$STARTS_WITH"
            echo "##vso[task.setvariable variable=ENDS_WITH]$ENDS_WITH"
            echo "##vso[task.setvariable variable=BRANCH]$BRANCH"
            echo "##vso[task.setvariable variable=REVERT_COMMIT_MESSAGE]$REVERT_COMMIT_MESSAGE"
            echo "##vso[task.setvariable variable=DRY_RUN]$DRY_RUN"
            # Encode SPECIFIC_REPOS as base64 to preserve JSON structure through pipeline variables
            SPECIFIC_REPOS_BASE64=$(echo "$SPECIFIC_REPOS" | base64 -w 0)
            echo "##vso[task.setvariable variable=SPECIFIC_REPOS_BASE64]$SPECIFIC_REPOS_BASE64"
            echo "##vso[task.setvariable variable=SPECIFIC_REPOS_COUNT]$SPECIFIC_REPOS_COUNT"

      # ================================================================
      # Task 2: Verificar dependências e autenticação
      # ================================================================
      - task: Bash@3
        name: setup
        displayName: "2. Check dependencies"
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]DEPENDENCY CHECK"
            echo "##[section]============================================================"

            # Check jq
            if ! command -v jq &> /dev/null; then
              echo "Installing jq..."
              sudo apt-get update && sudo apt-get install -y jq
            fi
            echo "##[command]jq: OK"

            # Check PAT
            if [ -z "$AZURE_DEVOPS_PAT" ]; then
              echo "##[error] Variable AZURE_DEVOPS_PAT was not provided."
              echo "##[error] When running the pipeline, enter your personal PAT in the AZURE_DEVOPS_PAT variable."
              exit 1
            fi
            echo "##[command]PAT: OK"

      # ================================================================
      # Task 3: Listar e filtrar repositórios
      # ================================================================
      - task: Bash@3
        name: listar
        displayName: "3. List repositories"
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]LISTING REPOSITORIES"
            echo "##[section]============================================================"

            PROJECT_NAME="$(PROJECT_NAME)"
            STARTS_WITH="$(STARTS_WITH)"
            ENDS_WITH="$(ENDS_WITH)"
            # Decode SPECIFIC_REPOS from base64
            SPECIFIC_REPOS=$(echo "$(SPECIFIC_REPOS_BASE64)" | base64 -d)
            SPECIFIC_REPOS_COUNT="$(SPECIFIC_REPOS_COUNT)"
            ORG_URL="$(AZURE_DEVOPS_ORG)"

            echo "##[debug]SPECIFIC_REPOS JSON: $SPECIFIC_REPOS"

            AUTH_HEADER=$(printf ":%s" "$AZURE_DEVOPS_PAT" | base64 -w 0)
            PROJECT_ENCODED=$(echo "$PROJECT_NAME" | sed 's/ /%20/g')

            echo "##[command]Project: $PROJECT_NAME"
            echo "##[command]Filter startsWith: ${STARTS_WITH:-'(no filter)'}"
            echo "##[command]Filter endsWith: ${ENDS_WITH:-'(no filter)'}"
            if [ "$SPECIFIC_REPOS_COUNT" -gt 0 ]; then
              echo "##[command]Specific repositories: $SPECIFIC_REPOS_COUNT repo(s)"
            else
              echo "##[command]Specific repositories: (all)"
            fi
            echo ""

            # Listar repositórios
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: Basic $AUTH_HEADER" \
              -H "Content-Type: application/json" \
              "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories?api-version=7.0")

            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
            REPOS_JSON=$(echo "$HTTP_RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "##[error] Failed to list repositories. HTTP Status: $HTTP_CODE"
              exit 1
            fi

            REPOS=$(echo "$REPOS_JSON" | jq -r '.value[]? | "\(.id)|\(.name)"' 2>/dev/null)
            [ -z "$REPOS" ] && echo "##[error] No repositories found." && exit 1

            TOTAL_FOUND=$(echo "$REPOS" | wc -l)
            echo "##[command]Total repositories in project: $TOTAL_FOUND"

            # Preparar lista de repositórios específicos para filtro
            SPECIFIC_REPOS_FILE=$(mktemp)
            if [ "$SPECIFIC_REPOS_COUNT" -gt 0 ]; then
              echo "$SPECIFIC_REPOS" | jq -r '.[]? // empty' 2>/dev/null > "$SPECIFIC_REPOS_FILE"
              echo "##[debug]Specific repos file content:"
              cat "$SPECIFIC_REPOS_FILE" || true
            fi

            # Função para verificar se repo está na lista
            is_in_specific_list() {
              local repo_name="$1"
              local found=1
              while IFS= read -r specific_repo || [ -n "$specific_repo" ]; do
                [ -z "$specific_repo" ] && continue
                if [ "$repo_name" = "$specific_repo" ]; then
                  found=0
                  break
                fi
              done < "$SPECIFIC_REPOS_FILE"
              return $found
            }

            # Filtrar repositórios
            FILTERED_REPOS_FILE=$(mktemp)
            while IFS='|' read -r REPO_ID REPO_NAME; do
              [ -n "$STARTS_WITH" ] && [[ ! "$REPO_NAME" =~ ^$STARTS_WITH ]] && continue
              [ -n "$ENDS_WITH" ] && [[ ! "$REPO_NAME" =~ $ENDS_WITH$ ]] && continue
              # Filtrar por lista de repositórios específicos
              if [ "$SPECIFIC_REPOS_COUNT" -gt 0 ]; then
                is_in_specific_list "$REPO_NAME" || continue
              fi
              echo "$REPO_ID|$REPO_NAME" >> "$FILTERED_REPOS_FILE"
            done < <(echo "$REPOS")
            rm -f "$SPECIFIC_REPOS_FILE"

            FILTERED_COUNT=$(wc -l < "$FILTERED_REPOS_FILE" 2>/dev/null || echo "0")
            echo ""
            echo "##[section]Repositories after filter: $FILTERED_COUNT"

            if [ "$FILTERED_COUNT" -eq 0 ]; then
              echo "##[warning]No repositories match the filters."
              echo "##vso[task.setvariable variable=FILTERED_REPOS]"
              echo "##vso[task.setvariable variable=FILTERED_COUNT]0"
              rm -f "$FILTERED_REPOS_FILE"
              exit 0
            fi

            echo ""
            echo "##[group]Repositories to be processed"
            while IFS='|' read -r REPO_ID REPO_NAME; do
              echo "  - $REPO_NAME"
            done < "$FILTERED_REPOS_FILE"
            echo "##[endgroup]"

            # Exportar lista de repositórios (base64 para preservar caracteres especiais)
            FILTERED_REPOS_BASE64=$(cat "$FILTERED_REPOS_FILE" | base64 -w 0)
            echo "##vso[task.setvariable variable=FILTERED_REPOS]$FILTERED_REPOS_BASE64"
            echo "##vso[task.setvariable variable=FILTERED_COUNT]$FILTERED_COUNT"
            rm -f "$FILTERED_REPOS_FILE"

      # ================================================================
      # Task 4: Processar reversões
      # ================================================================
      - task: Bash@3
        name: revert
        displayName: "4. Process reversions"
        condition: and(succeeded(), gt(variables['FILTERED_COUNT'], 0))
        env:
          AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
        inputs:
          targetType: inline
          script: |
            set -e
            echo "##[section]============================================================"
            echo "##[section]PROCESSING REVERSIONS"
            echo "##[section]============================================================"

            # Recuperar variáveis
            PROJECT_NAME="$(PROJECT_NAME)"
            EXECUTION_ID="$(EXECUTION_ID)"
            SEARCH_PATTERN="$(SEARCH_PATTERN)"
            BRANCH="$(BRANCH)"
            REVERT_COMMIT_MESSAGE="$(REVERT_COMMIT_MESSAGE)"
            DRY_RUN="$(DRY_RUN)"
            ORG_URL="$(AZURE_DEVOPS_ORG)"
            FILTERED_REPOS_BASE64="$(FILTERED_REPOS)"
            FILTERED_COUNT="$(FILTERED_COUNT)"

            AUTH_HEADER=$(printf ":%s" "$AZURE_DEVOPS_PAT" | base64 -w 0)
            PROJECT_ENCODED=$(echo "$PROJECT_NAME" | sed 's/ /%20/g')

            # Decodificar lista de repositórios
            FILTERED_REPOS=$(echo "$FILTERED_REPOS_BASE64" | base64 -d)

            # Contadores
            COUNTER_FILE=$(mktemp)
            echo "0 0 0 0" > "$COUNTER_FILE"

            echo "##[command]Processing $FILTERED_COUNT repositories..."
            echo ""

            while IFS='|' read -r REPO_ID REPO_NAME; do
              read TOTAL_REPOS TOTAL_REVERTED TOTAL_SKIPPED TOTAL_ERRORS < "$COUNTER_FILE"
              TOTAL_REPOS=$((TOTAL_REPOS + 1))
              echo "$TOTAL_REPOS $TOTAL_REVERTED $TOTAL_SKIPPED $TOTAL_ERRORS" > "$COUNTER_FILE"

              echo ""
              echo "##[group]$REPO_NAME ($TOTAL_REPOS/$FILTERED_COUNT)"

              # Buscar commits recentes na branch
              COMMITS_JSON=$(curl -s -X GET \
                -H "Authorization: Basic $AUTH_HEADER" \
                -H "Content-Type: application/json" \
                "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/commits?searchCriteria.itemVersion.version=$BRANCH&searchCriteria.\$top=50&api-version=7.0")

              # Filtrar commits pelo identificador de execução
              COMMITS_TO_REVERT=$(echo "$COMMITS_JSON" | jq -r --arg pattern "$SEARCH_PATTERN" \
                '.value[]? | select(.comment | contains($pattern)) | "\(.commitId)|\(.comment)|\(.author.date)"' 2>/dev/null)

              if [ -z "$COMMITS_TO_REVERT" ]; then
                echo "##[warning]No commits found to revert. Skipping..."
                read TOTAL_REPOS TOTAL_REVERTED TOTAL_SKIPPED TOTAL_ERRORS < "$COUNTER_FILE"
                TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                echo "$TOTAL_REPOS $TOTAL_REVERTED $TOTAL_SKIPPED $TOTAL_ERRORS" > "$COUNTER_FILE"
                echo "##[endgroup]"
                continue
              fi

              echo "##[section]Commits found to revert:"
              echo "$COMMITS_TO_REVERT" | while IFS='|' read -r CID CCOMMENT CDATE; do
                echo "  - ${CID:0:8}: $CCOMMENT ($CDATE)"
              done

              while IFS='|' read -r COMMIT_ID COMMIT_COMMENT COMMIT_DATE; do
                echo ""
                echo "##[section]Reverting commit: ${COMMIT_ID:0:8}"
                echo "##[command]Original message: $COMMIT_COMMENT"

                # Obter o commit pai
                COMMIT_DETAILS=$(curl -s -X GET \
                  -H "Authorization: Basic $AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/commits/$COMMIT_ID?api-version=7.0")

                PARENT_COMMIT=$(echo "$COMMIT_DETAILS" | jq -r '.parents[0] // empty')

                if [ -z "$PARENT_COMMIT" ]; then
                  echo "##[warning]Parent commit not found. Skipping..."
                  continue
                fi

                echo "##[command]Parent commit: ${PARENT_COMMIT:0:8}"

                # Obter as mudanças do commit
                CHANGES_JSON=$(curl -s -X GET \
                  -H "Authorization: Basic $AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/commits/$COMMIT_ID/changes?api-version=7.0")

                CHANGED_FILES=$(echo "$CHANGES_JSON" | jq -r '.changes[]? | select(.item.gitObjectType == "blob") | "\(.item.path)|\(.changeType)"' 2>/dev/null)

                if [ -z "$CHANGED_FILES" ]; then
                  echo "##[warning]No files to revert in this commit."
                  continue
                fi

                echo "##[command]Files to revert:"
                while IFS='|' read -r FPATH FTYPE; do
                  echo "  - $FPATH ($FTYPE)"
                done <<< "$CHANGED_FILES"

                # Obter referência atual da branch
                REFS_JSON=$(curl -s -X GET \
                  -H "Authorization: Basic $AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/refs?filter=heads/$BRANCH&api-version=7.0")

                BRANCH_OBJECT_ID=$(echo "$REFS_JSON" | jq -r '.value[0].objectId // empty')

                if [ -z "$BRANCH_OBJECT_ID" ]; then
                  echo "##[warning]Branch not found. Skipping..."
                  continue
                fi

                # Mostrar diff para cada arquivo
                while IFS='|' read -r FILE_PATH CHANGE_TYPE; do
                  [ -z "$FILE_PATH" ] && continue

                  OLD_CONTENT=$(curl -s -X GET \
                    -H "Authorization: Basic $AUTH_HEADER" \
                    "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/items?path=$FILE_PATH&versionDescriptor.version=$PARENT_COMMIT&versionDescriptor.versionType=commit&api-version=7.0" 2>/dev/null)

                  CURRENT_CONTENT=$(curl -s -X GET \
                    -H "Authorization: Basic $AUTH_HEADER" \
                    "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/items?path=$FILE_PATH&versionDescriptor.version=$BRANCH&api-version=7.0" 2>/dev/null)

                  if [ -n "$OLD_CONTENT" ] && [ -n "$CURRENT_CONTENT" ]; then
                    echo ""
                    echo "##[section]DIFF for $FILE_PATH (reversion):"
                    echo "------------------------------------------------------------"
                    TEMP_CURRENT=$(mktemp)
                    TEMP_OLD=$(mktemp)
                    echo "$CURRENT_CONTENT" > "$TEMP_CURRENT"
                    echo "$OLD_CONTENT" > "$TEMP_OLD"
                    diff -u --label "a/$FILE_PATH (atual)" --label "b/$FILE_PATH (revertido)" "$TEMP_CURRENT" "$TEMP_OLD" || true
                    echo "------------------------------------------------------------"
                    rm -f "$TEMP_CURRENT" "$TEMP_OLD"
                  fi
                done < <(echo "$CHANGED_FILES")

                if [ "$DRY_RUN" == "true" ]; then
                  echo ""
                  echo "##[warning][DRY-RUN] Reversion that would be made:"
                  echo "##[command]  - Repository: $REPO_NAME"
                  echo "##[command]  - Commit: ${COMMIT_ID:0:8}"
                  echo "##[command]  - Branch: $BRANCH"
                  echo "##[warning][DRY-RUN] Revert commit will NOT be created."
                  read TOTAL_REPOS TOTAL_REVERTED TOTAL_SKIPPED TOTAL_ERRORS < "$COUNTER_FILE"
                  TOTAL_REVERTED=$((TOTAL_REVERTED + 1))
                  echo "$TOTAL_REPOS $TOTAL_REVERTED $TOTAL_SKIPPED $TOTAL_ERRORS" > "$COUNTER_FILE"
                  # Não fecha o grupo - será fechado após processar todos os commits do repo
                  continue
                fi

                # Criar commit de reversão
                echo "##[command]Creating revert commit..."

                echo "[" > /tmp/changes.json
                FIRST_CHANGE=true

                while IFS='|' read -r FILE_PATH CHANGE_TYPE; do
                  [ -z "$FILE_PATH" ] && continue

                  OLD_CONTENT=$(curl -s -X GET \
                    -H "Authorization: Basic $AUTH_HEADER" \
                    "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/items?path=$FILE_PATH&versionDescriptor.version=$PARENT_COMMIT&versionDescriptor.versionType=commit&api-version=7.0" 2>/dev/null)

                  if [ -n "$OLD_CONTENT" ]; then
                    OLD_CONTENT_BASE64=$(echo "$OLD_CONTENT" | base64 -w 0)

                    if [ "$FIRST_CHANGE" = true ]; then
                      FIRST_CHANGE=false
                    else
                      echo "," >> /tmp/changes.json
                    fi

                    cat >> /tmp/changes.json <<CHANGE_EOF
              {
                "changeType": "edit",
                "item": { "path": "$FILE_PATH" },
                "newContent": {
                  "content": "$OLD_CONTENT_BASE64",
                  "contentType": "base64encoded"
                }
              }
            CHANGE_EOF
                  fi
                done < <(echo "$CHANGED_FILES")

                echo "]" >> /tmp/changes.json

                CHANGES_CONTENT=$(cat /tmp/changes.json)

                PUSH_PAYLOAD=$(cat <<EOF
            {
              "refUpdates": [{
                "name": "refs/heads/$BRANCH",
                "oldObjectId": "$BRANCH_OBJECT_ID"
              }],
              "commits": [{
                "comment": "$REVERT_COMMIT_MESSAGE (reverts ${COMMIT_ID:0:8})",
                "changes": $CHANGES_CONTENT
              }]
            }
            EOF
            )

                PUSH_RESPONSE=$(curl -s -X POST \
                  -H "Authorization: Basic $AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  -d "$PUSH_PAYLOAD" \
                  "$ORG_URL/$PROJECT_ENCODED/_apis/git/repositories/$REPO_ID/pushes?api-version=7.0")

                PUSH_RESULT_ID=$(echo "$PUSH_RESPONSE" | jq -r '.pushId // empty')
                NEW_COMMIT_ID=$(echo "$PUSH_RESPONSE" | jq -r '.commits[0].commitId // empty')

                read TOTAL_REPOS TOTAL_REVERTED TOTAL_SKIPPED TOTAL_ERRORS < "$COUNTER_FILE"
                if [ -n "$PUSH_RESULT_ID" ] && [ "$PUSH_RESULT_ID" != "null" ]; then
                  echo "##[section]Reversion created successfully! Push ID: $PUSH_RESULT_ID"
                  if [ -n "$NEW_COMMIT_ID" ] && [ "$NEW_COMMIT_ID" != "null" ]; then
                    COMMIT_URL="$ORG_URL/$PROJECT_ENCODED/_git/$REPO_NAME/commit/$NEW_COMMIT_ID"
                    echo "##[section]Commit URL: $COMMIT_URL"
                  fi
                  TOTAL_REVERTED=$((TOTAL_REVERTED + 1))
                else
                  ERROR_MSG=$(echo "$PUSH_RESPONSE" | jq -r '.message // "Unknown error"')
                  echo "##[error]Failed to create reversion: $ERROR_MSG"
                  TOTAL_ERRORS=$((TOTAL_ERRORS + 1))
                fi
                echo "$TOTAL_REPOS $TOTAL_REVERTED $TOTAL_SKIPPED $TOTAL_ERRORS" > "$COUNTER_FILE"

                rm -f /tmp/changes.json
                sleep 1
              done < <(echo "$COMMITS_TO_REVERT")

              # Grupo permanece aberto para destacar modificações
            done < <(echo "$FILTERED_REPOS")

            # Ler contadores finais
            read TOTAL_REPOS TOTAL_REVERTED TOTAL_SKIPPED TOTAL_ERRORS < "$COUNTER_FILE"
            rm -f "$COUNTER_FILE"

            echo ""
            echo "##[section]============================================================"
            echo "##[section]PROCESSING COMPLETED"
            echo "##[section]============================================================"
            echo "##[command]Total repositories processed: $TOTAL_REPOS"
            echo "##[section]Reverted: $TOTAL_REVERTED"
            echo "##[warning]Skipped: $TOTAL_SKIPPED"
            [ "$TOTAL_ERRORS" -gt 0 ] && echo "##[error]Errors: $TOTAL_ERRORS" || echo "##[command]Errors: $TOTAL_ERRORS"

            echo "##vso[task.setvariable variable=TOTAL_REPOS]$TOTAL_REPOS"
            echo "##vso[task.setvariable variable=TOTAL_REVERTED]$TOTAL_REVERTED"
            echo "##vso[task.setvariable variable=TOTAL_SKIPPED]$TOTAL_SKIPPED"
            echo "##vso[task.setvariable variable=TOTAL_ERRORS]$TOTAL_ERRORS"

      # ================================================================
      # Task 5: Exibir resumo final
      # ================================================================
      - task: Bash@3
        name: resumo
        displayName: "5. Display summary"
        condition: always()
        inputs:
          targetType: inline
          script: |
            echo "##[section]============================================================"
            echo "##[section]REVERSION SUMMARY"
            echo "##[section]============================================================"
            echo ""
            echo "##[command]Project: $(PROJECT_NAME)"
            echo "##[command]Identifier: $(EXECUTION_ID)"
            echo "##[command]Branch: $(BRANCH)"
            echo "##[command]Dry-run: $(DRY_RUN)"
            echo "##[command]------------------------------------------------------------"

            TOTAL_REPOS="${TOTAL_REPOS:-0}"
            TOTAL_REVERTED="${TOTAL_REVERTED:-0}"
            TOTAL_SKIPPED="${TOTAL_SKIPPED:-0}"
            TOTAL_ERRORS="${TOTAL_ERRORS:-0}"

            echo "##[command]Repositories processed: $TOTAL_REPOS"
            echo "##[section]Successfully reverted: $TOTAL_REVERTED"
            echo "##[warning]Skipped: $TOTAL_SKIPPED"
            [ "$TOTAL_ERRORS" -gt 0 ] && echo "##[error]Errors: $TOTAL_ERRORS" || echo "##[command]Errors: $TOTAL_ERRORS"
            echo "##[section]============================================================"

            if [ "$(DRY_RUN)" == "true" ]; then
              echo ""
              echo "##[warning]DRY-RUN MODE: No reversions were applied."
              echo "##[command]Run again with 'Dry Run = false' to apply reversions."
            fi

            exit 0
