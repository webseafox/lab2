steps:
    - task: Bash@3
      displayName: 'Set Build Tags'
      name: set_tags
      condition: |
        and(
          succeeded(),
          eq(variables['Build.Reason'], 'Manual'),
          ne(variables['environmentLog'], ''),
          ne(variables['versionLog'], ''),
          ne(variables['versionLog'], ' ')
        )
      inputs:
        targetType: 'inline'
        script: |
          echo "##[debug] setEnvironment: $(environmentLog)"
          echo "##[debug] setVersion: $(versionLog)"
          echo "##vso[build.addbuildtag]v$(versionLog)"
          echo "##vso[build.addbuildtag]$(environmentLog)"

    - task: Bash@3
      displayName: 'Set Build Name'
      name: set_name
      condition: |
        and(
          succeeded(),
          eq(variables['Build.Reason'], 'Manual'),
          ne(variables['environmentLog'], ''),
          ne(variables['versionLog'], ''),
          ne(variables['versionLog'], ' ')
        )
      inputs:
        targetType: 'inline'
        script: |
          echo "##[debug] setEnvironment: $(environmentLog)"
          echo "##[debug] setVersion: $(versionLog)"
          echo "##vso[build.updatebuildnumber]$(environmentLog) • v$(versionLog) • $(Build.BuildNumber)"