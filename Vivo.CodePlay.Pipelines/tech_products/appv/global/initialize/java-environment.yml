stages:
- stage: environment_init
  displayName: "CI - Environment"
  pool:
    name: GeneralPurposeLinuxAgentsCI

  jobs:      
  
  - job: environment
    displayName: Set up environment
    steps: 

    ## -> Clean the pipeline workspace and checkout the code.
    - checkout: self
      displayName: Checkout Code
      name: checkout_code 
      submodules: true
      persistCredentials: true

    ## -> Checkout the working branch. 
    - task: Bash@3
      displayName: Checkout Last Commit
      name: checkout_last_commit     
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Checkout branch '$(Build.SourceBranchName)'"

          git config pull.rebase true
          git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)
          git checkout -f $(Build.SourceBranchName)
    
    ## -> Initialize Catalog-Info
    - template: /tech_products/appv/global/initialize/catalog-info-environment.yml

    ## -> Download NEXUS Credentials 
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    ## -> Set NEXUS credentials to variables. This allows it to used in other stages, jobs or tasks.
    ## -> NEXUS_DEPS_USR and NEXUS_DEPS_PSW, use these to download dependencies. 
    ## -> NEXUS_DEFAULT_USR and NEXUS_DEFAULT_PSW, use these to upload artifacts. 
    - task: Bash@3
      displayName: 'Set Credentials Variables'
      name: credentials
      condition: and(
        succeeded(),
        ne(variables['NEXUS-DEPS-USR'], ''), ne(variables['NEXUS-DEPS-PSW'], ''),
        ne(variables['NEXUS-DEFAULT-USR'], ''), ne(variables['NEXUS-DEFAULT-PSW'], ''))
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |          
          echo "##[group] Variables to DOWNLOAD dependencies from NEXUS"
          echo "##[debug] NEXUS-DEPS-USR: $(NEXUS-DEPS-USR). Use as >> NEXUS_DEPS_USR."
          echo "##vso[task.setvariable variable=NEXUS_DEPS_USR;isOutput=true;isSecret=true]$(NEXUS-DEPS-USR)"
          echo "##[debug] NEXUS-DEPS-PSW: $(NEXUS-DEPS-PSW). Use as >> NEXUS_DEPS_PSW"          
          echo "##vso[task.setvariable variable=NEXUS_DEPS_PSW;isOutput=true;isSecret=true]$(NEXUS-DEPS-PSW)"
          echo "##[endgroup]"

          echo "##[group] Variables to PUBLISH artifacts to NEXUS"          
          echo "##[debug] NEXUS-DEFAULT-USR: $(NEXUS-DEFAULT-USR). Use as >> NEXUS_DEFAULT_USR"          
          echo "##vso[task.setvariable variable=NEXUS_DEFAULT_USR;isOutput=true;isSecret=true]$(NEXUS-DEFAULT-USR)"
          echo "##[debug] NEXUS-DEFAULT-PSW: $(NEXUS-DEFAULT-PSW). Use as >> NEXUS_DEFAULT_PSW"          
          echo "##vso[task.setvariable variable=NEXUS_DEFAULT_PSW;isOutput=true;isSecret=true]$(NEXUS-DEFAULT-PSW)"
          echo "##[endgroup]"
          echo "##[debug] To open and check the information above, click the arrows on the left."

          echo "##[debug] Secure File Path: $(settings.secureFilePath)"
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    ## -> Download a Secure File in the 'Azure Agent' as a copy. This allows it to used for the pipeline.
    ## -> This step will download a different settings.xml, a custom one.
    ## -> Set MAVEN_CUSTOM_SETTINGS_SECURE_FILE in pipeline's library.
    - task: DownloadSecureFile@1      
      displayName: 'Download custom settings.xml from secure file'
      name: settings
      condition: and(succeeded(), ne(variables['MAVEN_CUSTOM_SETTINGS_SECURE_FILE'], ''))
      continueOnError: false
      inputs:
        actionOnNoFiles: 'warn'
        secureFile: '$(MAVEN_CUSTOM_SETTINGS_SECURE_FILE)'

    ## -> Set MAVEN information to variables. This allows it to used in other stages, jobs or tasks.
    ## -> If MAVEN_CUSTOM_SETTINGS_SECURE_FILE is not used. Use default MAVEN settings.
    - task: Bash@3
      displayName: 'Defining Maven Settings Variables'
      name: settings_variables
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |
          if [[ -f $(settings.secureFilePath) ]]; then
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION;isreadonly=true;isOutput=true]$(settings.secureFilePath)"
            echo "##[debug] Pipeline will use custom settings.xml file."
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_LOCATION = $(settings.secureFilePath) ."
          else            
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION;isreadonly=true;isOutput=true]$(DEFAULT_MAVEN_SETTINGS)"
            echo "##[debug] Pipeline will use the default settings.xml file."
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_LOCATION = $(DEFAULT_MAVEN_SETTINGS) ."
          fi

    ## -> Replace variables in the downloaded settings.xml to the correct values.
    - task: qetza.replacetokens.replacetokens-task.replacetokens@5
      displayName: 'Configuring custom settings.xml'
      condition: and(succeeded(), ne(variables['MAVEN_CUSTOM_SETTINGS_SECURE_FILE'], ''))
      continueOnError: false
      inputs:
        targetFiles: $(settings_variables.MAVEN_SETTINGS_LOCATION)
        tokenPattern: 'azpipelines'
        enableTelemetry: false
      env:
        NEXUS_DEPS_USR: $(credentials.NEXUS_DEPS_USR)
        NEXUS_DEPS_PSW: $(credentials.NEXUS_DEPS_PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    ## -> Export custom settings.xml file to a variable. This allows it to used in other stages, jobs or tasks.    
    - task: CmdLine@2
      displayName: "Exporting Custom Settings"
      name: custom_settings
      condition: and(succeeded(), ne(variables['MAVEN_CUSTOM_SETTINGS_SECURE_FILE'], ''))
      continueOnError: false
      inputs:
        script: |
          file_content=$(base64 -w 0 $(settings_variables.MAVEN_SETTINGS_LOCATION))
          echo "##vso[task.setvariable variable=MAVEN_CUSTOM_SETTINGS_CONTENT;isreadonly=true;isOutput=true]$file_content"