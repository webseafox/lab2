variables:

- template: /global/variables/pipeline.yml@CorePipelines
# Above template is extended from the below repository:
#
#  - repository: CorePipelines
#    name: DevOps/Vivo.Core.Pipelines
#    type: git
#    ref: refs/tags/latest
#    endpoint: CorePipelines
#

# - group: "azdo-team-project-variables"

- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"

- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)

- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"

- name: DEPLOY_ENVIRONMENT_PROD
  value: "deploy-prod"

- name: DEPLOY_ENVIRONMENT_QA
  ${{ if and(eq(parameters.setQaDeploy, 'true'), notIn(parameters.setEnvironment, 'desenvolvimento','esteira-01','esteira-02', 'esteira-03', 'darklaunch', 'prodlike', 'producao','poc-app-mvms')) }}:
    value: "deploy-qa"
  ${{ else }}:
    value: "deploy-lib"


# Variables for NEXUS
- name: NEXUS_ENDPOINT_API_REPOSITORY
  value: "https://nexus.telefonica.com.br/service/rest/v1"
- name: NEXUS_REPOSITORY_URL
  value: "https://nexus.telefonica.com.br/repository"

- name: SENTINELS_ENDPOINT_URL 
  value: "https://pre-framework-brasil-ingress.telefonicabigdata.com/dev/ms/sentinels/azure/changelog"

- name: DEFAULT_BFF_CHART_VERSION_PROD
  value: "1.0.41"
- name: DEFAULT_FRONT_CHART_VERSION_PROD
  value: "1.0.28"
