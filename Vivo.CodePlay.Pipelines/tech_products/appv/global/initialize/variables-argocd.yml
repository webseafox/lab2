parameters:
  - name: setEnvironment
    type: string
    displayName: "Target Environment for ArgoCD Configuration"

variables:
  - name: ARGO_USERNAME
    ${{if or(eq(parameters.setEnvironment, 'prod'), eq(parameters.setEnvironment, 'prod-front'), eq(parameters.setEnvironment, 'prod-bff'), eq(parameters.setEnvironment, 'prod-tools'), eq(parameters.setEnvironment, 'prod-ms'), contains(parameters.setEnvironment, 'darklaunch'))}}:
      value: $(ARGO_USERNAME_PROD)
    ${{ else }}:
      value: $(ARGO_USERNAME_PREPROD)
  - name: ARGO_PASSWORD
    ${{if or(eq(parameters.setEnvironment, 'prod'), eq(parameters.setEnvironment, 'prod-front'), eq(parameters.setEnvironment, 'prod-bff'), eq(parameters.setEnvironment, 'prod-tools'), eq(parameters.setEnvironment, 'prod-ms'), contains(parameters.setEnvironment, 'darklaunch'))}}:
      value: $(ARGO_PASSWORD_PROD)
    ${{ else }}:
      value: $(ARGO_PASSWORD_PREPROD)
  - name: ARGO_URL
    ${{if or(eq(parameters.setEnvironment, 'prod'), eq(parameters.setEnvironment, 'prod-front'), eq(parameters.setEnvironment, 'prod-bff'), eq(parameters.setEnvironment, 'prod-tools'), eq(parameters.setEnvironment, 'prod-ms'), contains(parameters.setEnvironment, 'darklaunch'))}}:
      value: $(ARGO_URL_PROD)
    ${{ else }}:
      value: $(ARGO_URL_PREPROD)

      