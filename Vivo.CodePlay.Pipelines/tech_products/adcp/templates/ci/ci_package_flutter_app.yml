        displayName: "Install Flutter SDK"
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(FLUTTER_VERSION)

    - task: JavaToolInstaller@0
      displayName: 'Use Java 17'
      inputs:
        jdkArchitectureOption: x64
        versionSpec: 17
        jdkSourceOption: PreInstalled

    - task: DownloadSecureFile@1
      name: keyprop
      displayName: Download key properties file
      inputs:
        secureFile: 'key.properties' 

    # Download Secure Files
    # Key File contains the keystore file for Android Signing
    - task: DownloadSecureFile@1
      name: key
      displayName: Download signing key
      inputs:
        secureFile: 'key.jks'

    # Extract Build Number adding a zero to the left if it is less than 10
    - task: Bash@3
      displayName: Extract Build Number 
      inputs:
        targetType: 'inline'
        script: |
          number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 2)
          if [ "$number" -lt 10 ]; then
            # Adicione um zero à esquerda
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"0"$number
          else
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"$number"
          fi
          echo "##[debug]Build number: $build_number"
          echo "##vso[task.setvariable variable=BUILD_NUMBER;]$build_number"

    - task: Bash@3
      displayName: Config Files
      inputs:
        targetType: 'inline'
        script: |
          cp $(keyprop.secureFilePath) $(Build.SourcesDirectory)/android/key.properties
          cp $(key.secureFilePath) $(Build.SourcesDirectory)/android/key.jks
          echo "##[debug]key.properties copied to $(Build.SourcesDirectory)/android/key.properties"
          echo "##[debug]key.jks copied to $(Build.SourcesDirectory)/android/key.jks"

          echo "##[debug]Current environment is: ${{ parameters.qa_environment }}"            

          if [[ ${{ parameters.qa_environment }} == "preprod" ]]; then       
            # Update blueprint 
            echo "##[debug]Update blueprint preprod"
            sed -i 's/#{BUILD_NUMBER}#/$(BUILD_NUMBER)/g' $(Build.SourcesDirectory)/config/preprod/arxan/blueprint.json

            echo "##[debug]View blueprint preprod"
            cat $(Build.SourcesDirectory)/config/preprod/arxan/blueprint.json

          elif [[ ${{ parameters.qa_environment }} == "prodlike" ]]; then 

            # Update blueprint
            echo "##[debug]Update blueprint prodlike"
            sed -i 's/#{BUILD_NUMBER}#/$(BUILD_NUMBER)/g' $(Build.SourcesDirectory)/config/prodlike/arxan/blueprint.json

            echo "##[debug]View blueprint prodlike"
            cat $(Build.SourcesDirectory)/config/prodlike/arxan/blueprint.json
                      
          elif [[ ${{ parameters.qa_environment }} == "producao" ]]; then 

            # Update blueprint 
            echo "##[debug]Update blueprint prod"
            sed -i 's/#{BUILD_NUMBER}#/$(BUILD_NUMBER)/g' $(Build.SourcesDirectory)/config/prod/arxan/blueprint.json

            echo "##[debug]View blueprint prod"
            cat $(Build.SourcesDirectory)/config/prod/arxan/blueprint.json

          else

            # Update blueprint 
            echo "##[debug]Update blueprint release"
            sed -i 's/#{BUILD_NUMBER}#/$(BUILD_NUMBER)/g' $(Build.SourcesDirectory)/config/release/arxan/blueprint.json

            echo "##[debug]View blueprint release"
            cat $(Build.SourcesDirectory)/config/release/arxan/blueprint.json

          fi

    - task: DownloadPackage@1
      displayName: "Download Arxan"
      inputs:
        packageType: 'upack'
        feed: '/3d53bc62-8749-4931-ae46-a443b73bc87a'
        view: 'da88d2ff-67d7-44d6-a91b-cc4bffa5fa70'
        definition: '$(ARXAN_ARTIFACTS_DEFINITION)'
        version: '$(ARXAN_VERSION)'
        downloadPath: '$(System.DefaultWorkingDirectory)'

    - task: ExtractFiles@1        
      displayName: 'Extract Arxan'
      inputs:
        archiveFilePatterns: '$(System.DefaultWorkingDirectory)/$(ARXAN_PACKAGE_FILENAME)'
        destinationFolder: '$(System.DefaultWorkingDirectory)/protect-android'
        cleanDestinationFolder: false
        overwriteExistingFiles: true       

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Pipeline Artifact'
      inputs:
        buildType: current
        artifactName: 'android_package'
        targetPath: '$(DEFAULT_WORKDIR_ARTIFACTS)'
        itemPattern: '**'
        
    - task: Bash@3
      displayName: Protect Android
      inputs:
        targetType: 'inline'
        script: |             
          $(System.DefaultWorkingDirectory)/protect-android/$(ARXAN_PACKAGE_FOLDER)/bin/protect-android --restrict-app-aware-reporting -b $(Build.SourcesDirectory)/$(BLUEPRINT_PATH) -i $(DEFAULT_WORKDIR_ARTIFACTS)/$(APP_FILE_NAME_ANDROID).apk -o $(Build.SourcesDirectory)/build/app/outputs/flutter-apk
      env:
        LICENSE_TOKEN: "$(ARXAN_LICENSE_TOKEN)"
        ANDROID_HOME: "$(ANDROID_HOME)"
        ANDROID_SDK_ROOT: "$(ANDROID_HOME)"
        #ASDF_JAVA_VERSION: "openjdk-17.0.2"

    - task: AndroidSigning@3
      displayName: "Signing APK"
      inputs:
        apkFiles: "$(Build.SourcesDirectory)/build/app/outputs/flutter-apk/$(APP_FILE_NAME_ANDROID)-unaligned-unsigned-protected.apk"
        apksign: true
        apksignerKeystoreFile: key.jks
        apksignerKeystorePassword: $(ANDROID_SIGNING_STORE_PASSWORD)
        apksignerKeystoreAlias: upload
        apksignerKeyPassword: $(ANDROID_SIGNING_KEY_PASSWORD)
        apksignerArguments: --out $(Build.SourcesDirectory)/build/app/outputs/flutter-apk/$(APP_FILE_NAME_ANDROID).apk
      #env:
      #  ASDF_JAVA_VERSION: "openjdk-17.0.2"

    - task: CopyFiles@2
      displayName: "Copy Sign APK to Staging"
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: '**/build/app/outputs/flutter-apk/$(APP_FILE_NAME_ANDROID).apk'
        targetFolder: '$(Build.StagingDirectory)'
        flattenFolders: true
        CleanTargetFolder: true

    - task: PublishBuildArtifacts@1
      displayName: "Publish Sign APK"
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'android_package_protected'
        publishLocation: 'Container'

    ## PACKAGE TO PROD
    - ${{ if in(parameters.qa_environment, 'release', 'producao') }}: 

      - task: DownloadPipelineArtifact@2
        displayName: 'Download Pipeline Artifact'
        inputs:
          buildType: current
