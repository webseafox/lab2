  - job: "Package_ios"
    timeoutInMinutes: 60
    dependsOn: 
    - akv_secrets
    - config_env
    condition: | 
                and(
                  succeeded(),
                  in(dependencies.config_env.result, 'Succeeded', 'Skipped'), 
                  in(dependencies.akv_secrets.result, 'Succeeded', 'Skipped'), 
                  in('${{ parameters.target }}', 'ios', 'both')
                )
    displayName: "Package (iOS)"
    variables:
      EXTRA_ARGS_FLUTTER: $[ dependencies.config_env.outputs['export_variables.EXTRA_ARGS_FLUTTER'] ]           
    pool: $(PRIVATE_MACOS_AGENT_DEFAULT)
    workspace:
      clean: outputs    # Preserva Agent.ToolsDirectory (cache do Flutter SDK)
    steps:

    - checkout: self
      persistCredentials: true
      clean: true
               

    - task: Bash@3
      displayName: 'Pre-Build Agent Cleanup'
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          echo "##[section]Starting Pre-Build Agent Cleanup"
          
          # Verificar espaço inicial
          echo "##[debug]Initial disk space:"
          df -h / | tail -1 | awk '{print "Used: "$3" ("$5") - Available: "$4}'

          # Limpeza de arquivos temporários do sistema
          echo "##[debug]Cleaning system temp files..."
          rm -rf /tmp/flutter_* 2>/dev/null || true
          rm -rf /tmp/xcodebuild_* 2>/dev/null || true

          # # ✅ Limpeza preventiva de zips antigos do Flutter
          # echo "##[debug]Cleaning old Flutter SDK zip files..."
          # rm -f ~/Downloads/flutter_*.zip 2>/dev/null || true
          # find $(Agent.TempDirectory) -name "*flutter*.zip" -type f -mtime +1 -delete 2>/dev/null || true
         
          # # ✅ Limpeza de builds antigos (mantém apenas os últimos 3 dias)
          # echo "##[debug]Cleaning old build directories..."
          # find $(Agent.BuildDirectory)/.. -maxdepth 1 -type d -name "*" -mtime +3 -not -path "$(Agent.BuildDirectory)" -exec rm -rf {} \; 2>/dev/null || true
         
          # # ✅ Limpeza de Xcode DerivedData antigos (>7 dias)
          # echo "##[debug]Cleaning old Xcode DerivedData..."
          # find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \; 2>/dev/null || true
         
          # # ✅ Limpeza de Xcode Archives antigos (>30 dias)
          # echo "##[debug]Cleaning old Xcode Archives..."
          # find ~/Library/Developer/Xcode/Archives -maxdepth 1 -type d -mtime +30 -exec rm -rf {} \; 2>/dev/null || true
         
          # # ✅ Limpeza de caches do Homebrew (se existir)
          # echo "##[debug]Cleaning Homebrew caches..."
          # if command -v brew &> /dev/null; then
          #   brew cleanup --prune=30 2>/dev/null || true
          # fi
         
          # # ✅ Limpeza de caches do CocoaPods antigos
          # echo "##[debug]Cleaning old CocoaPods caches..."
          # find ~/Library/Caches/CocoaPods -type f -mtime +30 -delete 2>/dev/null || true

          # Verificar espaço após limpeza
          echo "##[debug]Disk space after cleanup:"
          df -h / | tail -1 | awk '{print "Used: "$3" ("$5") - Available: "$4}'

    - task: Cache@2
      displayName: "Flutter Pub Cache"
      inputs:
        key: 'flutter pub v4 | "${{ parameters.qa_environment }}" | "$(Agent.OS)" | pubspec.yaml'
        path: '$(Agent.ToolsDirectory)/.pub-cache'
        cacheHitVar: PUB_CACHE_RESTORED

    # Cache CocoaPods - CRÍTICO para iOS
    - task: Cache@2
      displayName: "CocoaPods Cache"
      inputs:
        key: 'cocoapods v4 | "${{ parameters.qa_environment }}" | "$(Agent.OS)" | ios/Podfile'
        path: '$(Pipeline.Workspace)/ios-pods-cache'
        cacheHitVar: PODS_CACHE_RESTORED
        restoreKeys: |
          cocoapods v4 | "$(Agent.OS)"        

    # Validar e limpar Pods corrompidos se necessário
    - task: Bash@3
      displayName: 'Validate and Clean Pods Cache'
      condition: eq(variables['PODS_CACHE_RESTORED'], 'true')
      inputs:
        targetType: inline
        script: |
          echo "##[section]Validating Pods Cache Integrity"
          
          # Verificar se diretório Pods existe
          if [ ! -d "$(Build.SourcesDirectory)/ios/Pods" ]; then
            echo "##vso[task.logissue type=warning;]Pods directory not found in cache!"
            echo "##vso[task.setvariable variable=PODS_CACHE_RESTORED]false"
            exit 0
          fi
          
          # Verificar se arquivos críticos existem
          CRITICAL_PODS=("FirebaseAnalytics" "FirebaseCore" "GoogleUtilities")
          CORRUPTED=false
          
          for POD in "${CRITICAL_PODS[@]}"; do
            POD_PATH="$(Build.SourcesDirectory)/ios/Pods/$POD"
            if [ -d "$POD_PATH" ]; then
              # Verificar se tem arquivos .xcframework corrompidos
              if find "$POD_PATH" -name "*.xcframework" -type d | while read FRAMEWORK; do
                if [ ! -f "$FRAMEWORK/Info.plist" ]; then
                  echo "##vso[task.logissue type=warning;]Corrupted framework: $FRAMEWORK (missing Info.plist)"
                  exit 1
                fi
              done; then
                CORRUPTED=true
                break
              fi
            fi
          done
          
          if [ "$CORRUPTED" = true ]; then
            echo "##[warning]Corrupted Pods detected in cache, forcing clean install"
            echo "##vso[task.setvariable variable=PODS_CACHE_RESTORED]false"
            
            echo "##[section]Cleaning corrupted Pods and cache"
            # Remover Pods corrompidos
            echo "##[debug]Removing corrupted Pods directory..."
            rm -rf "$(Build.SourcesDirectory)/ios/Pods"
            
            # Limpar cache local do CocoaPods (apenas quando há corrupção detectada)
            echo "##[debug]Cleaning CocoaPods local cache to prevent reusing corrupted files..."
            pod cache clean --all 2>/dev/null || true
            
            echo "##[debug]Corrupted Pods cleanup completed"
          else
            echo "##[debug]Pods cache validation passed - using cached dependencies"
          fi

    - task: Bash@3
      displayName: 'Setup Environment'
      inputs:
        targetType: inline
        script: |
          echo "##[section]Setting up macOS agent"
          
          # Configurar diretórios de cache em workspace (persistente)
          mkdir -p $(Agent.ToolsDirectory)/.pub-cache
          
          # Exportar como variável de JOB (não apenas de task)
          echo "##vso[task.setvariable variable=PUB_CACHE_PATH;isOutput=false]$(Agent.ToolsDirectory)/.pub-cache"
          
          # Exportar também no shell atual
          export PUB_CACHE="$(Agent.ToolsDirectory)/.pub-cache"
          
          # Validar que variável foi setada
          echo "##[debug]PUB_CACHE path configured: $(Agent.ToolsDirectory)/.pub-cache"

          echo "##[section]Setting up CocoaPods symlink"
          
          PODS_CACHE_DIR="$(Pipeline.Workspace)/ios-pods-cache"
          PODS_PROJECT_DIR="$(Build.SourcesDirectory)/ios/Pods"
          
          # Remover Pods do projeto se existir
          if [ -d "$PODS_PROJECT_DIR" ] || [ -L "$PODS_PROJECT_DIR" ]; then
            echo "##[debug]Removing existing Pods directory/symlink..."
            rm -rf "$PODS_PROJECT_DIR"
          fi
          
          # Criar diretório de cache se não existir (redundante, mas seguro)
          mkdir -p "$PODS_CACHE_DIR"
          
          # Criar symlink
          echo "##[debug]Creating symlink: $PODS_PROJECT_DIR -> $PODS_CACHE_DIR"
          ln -s "$PODS_CACHE_DIR" "$PODS_PROJECT_DIR"
          
          # Validar symlink
          if [ -L "$PODS_PROJECT_DIR" ]; then
            echo "##[debug]✅ Symlink created successfully"
            ls -la "$(Build.SourcesDirectory)/ios/" | grep Pods
          else
            echo "##vso[task.logissue type=error;]Failed to create symlink"
            exit 1
          fi
          
          # Status do cache
          if [ "$(PODS_CACHE_RESTORED)" = "true" ]; then
            echo "##[debug]✅ Cache HIT - Pods restored from cache"
            echo "##[debug]Pods count: $(find $PODS_CACHE_DIR -maxdepth 1 -type d | wc -l)"
          else
            echo "##[debug]⚠️ Cache MISS - Will install pods"
          fi

          # Pre-warm sistema
          echo "##[debug]System info for optimization:"
          system_profiler SPHardwareDataType SPSoftwareDataType
          
          # Configurar Xcode para performance máxima
          defaults write com.apple.dt.XCBuild EnableSwiftBuildSystemIntegration 1
          defaults write com.apple.dt.XCBuild UseNewBuildSystem -bool YES
          defaults write com.apple.dt.XCBuild ShowBuildOperationDuration -bool YES
          
          # Configurar paralelismo máximo
          CORES=$(sysctl -n hw.ncpu)
          echo "##vso[task.setvariable variable=PARALLEL_JOBS]$CORES"
          echo "##[debug]Configured for $CORES parallel jobs"

          # Compilação paralela do Swift
          echo "##[debug]Configuring Swift compilation for parallelism"
          echo "##vso[task.setvariable variable=SWIFT_COMPILATION_MODE]wholemodule"
          echo "##vso[task.setvariable variable=SWIFT_OPTIMIZATION_LEVEL]-O"

          # Desabilitar depuração em builds de release
          echo "##[debug]Disabling debug information for release builds"
          echo "##vso[task.setvariable variable=DEBUG_INFORMATION_FORMAT]dwarf"

          # ✅ Habilitar compilação incremental
          echo "##[debug]Enabling incremental compilation"
          echo "##vso[task.setvariable variable=COMPILER_INDEX_STORE_ENABLE]NO"

          # Otimizar linking
          echo "##[debug]Enabling dead code stripping"
          echo "##vso[task.setvariable variable=DEAD_CODE_STRIPPING]YES"
          echo "##vso[task.setvariable variable=STRIP_INSTALLED_PRODUCT]YES" 
          echo "##vso[task.setvariable variable=STRIP_SWIFT_SYMBOLS]YES"

    - ${{ if eq(parameters.use_flutter_version_latest, 'True' ) }}: 
   
      # Set Flutter Env in Vivo Agent
      - task: FlutterEnv@0
        displayName: 'Flutter Env'
        inputs:
          pathType: flutterDirectory
          flutterDirectory: '/Users/svc_devopscorp/.asdf/installs/flutter/3.35.3'

    - ${{ else }}:

      # Set Flutter Env in Vivo Agent
      - task: FlutterEnv@0
        displayName: 'Flutter Env'
        inputs:
          pathType: flutterDirectory
          flutterDirectory: '/Users/svc_devopscorp/.asdf/installs/flutter/3.29.2'

    - task: Bash@3
      displayName: 'Debug iOS Configuration'
      inputs:
        targetType: inline
        script: |
          echo "##[debug]Current directory: $(pwd)"
          echo "##[debug]Xcode path:"
          xcode-select --print-path
          echo "##[debug]Xcode version:"
          xcodebuild -version
          echo "##[debug]List of installed simulators:"
          xcrun simctl list runtimes

    # Download Secure Files
    # App Cert File contains the certificate for the app to login
    - task: DownloadSecureFile@1
      name: appCert
      displayName: Download App Cert 
      inputs:
        secureFile: $(APP_CERT_FILE_NAME)

    # Download Secure Files
    # App Key File contains the private key for the app to login
    - task: DownloadSecureFile@1
      name: appKey
      displayName: Download App Key 
      inputs:
        secureFile: $(APP_KEY_FILE_NAME)

    # Install and configure EnsureIT to protect the app
    - ${{ if or( eq( parameters.skip_protect, False ), in( parameters.qa_environment, 'release', 'prodlike', 'producao' ) ) }}:  

      - task: DownloadPackage@1
        displayName: 'Download EnsureIT x86-64'
        inputs:
          packageType: 'upack'
          feed: '/3d53bc62-8749-4931-ae46-a443b73bc87a'
          view: 'da88d2ff-67d7-44d6-a91b-cc4bffa5fa70'
          definition: '37290c39-1ea5-47fd-b117-9b61fbab90ba'
          version: '16.5.0'
          downloadPath: '$(System.ArtifactsDirectory)'

      - task: Bash@3
        displayName: 'Descompactar arquivo EnsureIT'
        inputs:
          targetType: 'inline'
          script: |      
            echo "##[debug]Descompactando arquivo DMG..."
            hdiutil attach $(System.ArtifactsDirectory)/ensureit-16.5.0.3526c77b-macosx-x64-ios-arm.dmg -mountpoint /Volumes/EnsureIT
            cp -R /Volumes/EnsureIT/EnsureIT-16.5.0.3526c77b-macosx-x64-ios-arm.app $(System.ArtifactsDirectory)/EnsureIT
            hdiutil detach /Volumes/EnsureIT
            echo "##[debug]Arquivo DMG descompactado com sucesso!"

      - task: Bash@3
        displayName: Config Ensure IT
        inputs:
          targetType: 'inline'
          script: |           
            # source
            echo "##[debug]EnsureIT setenv..."
            source $(System.ArtifactsDirectory)/EnsureIT/Contents/EnsureIT/bin/setenv.sh
            
            # Check if EnsureIT is properly configured
            echo "##[debug]EnsureIT version details:"
            $(System.ArtifactsDirectory)/EnsureIT/Contents/EnsureIT/bin/ensureit --version

            # Update Token
            echo "##[debug]Updating EnsureIt directory token..."
            sed -i '' "s|#{ENSUREIT_ARTIFACTS_DIRECTORY}#|$SYSTEM_ARTIFACTSDIRECTORY|g" "$(Build.SourcesDirectory)/ios/EnsureIT.Protection.xcconfig"

            echo "##[debug]Validating EnsureIt configuration..."
            cat $(Build.SourcesDirectory)/ios/EnsureIT.Protection.xcconfig            

        env:
