parameters:
- name: qa_environment
- name: target
- name: skip_signing
- name: skip_protect
- name: use_flutter_version_latest
  default: false

stages:

- stage: package
  dependsOn:
  - build_test
  - gates
  - security
  displayName: "Build & Package"
  pool: $(PRIVATE_AGENT_SHARED)
  jobs:
  - job: config_env
    displayName: "Configure Arguments"
    steps:

    # Configure the arguments to be used in the Flutter build
    - bash: |
        echo "##[debug]Environment: ${{ parameters.qa_environment }}"
        extra_args_flutter=''

        if [ ${{ parameters.qa_environment }} == "preprod" ]; then
        
          echo "##[debug]Setting PREPROD config variables"

          if [[ ${{ parameters.skip_signing }} == False ]]; then
            extra_args_flutter='--release --dart-define-from-file=config/preprod/.env'
          else
            extra_args_flutter='--profile --dart-define-from-file=config/preprod/.env'
          fi

        elif [[ ${{ parameters.qa_environment }} == "esteira1" ]]; then

          echo "##[debug]Setting ESTEIRA1 config variables"

          if [[ ${{ parameters.skip_signing }} == False ]]; then
            extra_args_flutter='--release --dart-define-from-file=config/esteira1/.env'
          else
            extra_args_flutter='--profile --dart-define-from-file=config/esteira1/.env'
          fi

        elif [[ ${{ parameters.qa_environment }} == "prodlike" ]]; then

          echo "##[debug]Setting PRODLIKE config variables"
          extra_args_flutter='--release --dart-define-from-file=config/prodlike/.env' 

        elif [[ ${{ parameters.qa_environment }} == "release" ]]; then

          echo "##[debug]Setting RELEASE config variables"
          extra_args_flutter='--release --dart-define-from-file=config/release/.env'

        elif [[ ${{ parameters.qa_environment }} == "producao" ]]; then

          echo "##[debug]Setting PROD config variables"
          extra_args_flutter='--release --dart-define-from-file=config/prod/.env'

        else
          
          echo "##[error]Invalid Environment!"
          exit 1

        fi

        echo "##[debug]EXTRA_ARGS_FLUTTER: $extra_args_flutter"
        echo "##vso[task.setvariable variable=EXTRA_ARGS_FLUTTER;isOutput=true;]$extra_args_flutter"

      name: export_variables
      displayName: 'Set Variables'

  - job: akv_secrets
    displayName: Get AKV Secrets
    steps:

    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'ANDROID-SIGNING-KEY-JKS, ANDROID-SIGNING-KEY-PASSWORD, ANDROID-SIGNING-STORE-PASSWORD, IOS-TESTFLIGHT-API-KEY-ID, IOS-TESTFLIGHT-API-ISSUER, IOS-TESTFLIGHT-API-TOKEN'

    - bash: |

        echo "##[debug]Exporting 'ANDROID-SIGNING-KEY-JKS' secret to 'ANDROID_SIGNING_KEY_JKS' var"
        echo "##vso[task.setvariable variable=ANDROID_SIGNING_KEY_JKS;issecret=true;isOutput=true;]$(ANDROID-SIGNING-KEY-JKS)"
        
        echo "##[debug]Exporting 'ANDROID-SIGNING-KEY-PASSWORD' secret to 'ANDROID_SIGNING_KEY_PASSWORD' var"
        echo "##vso[task.setvariable variable=ANDROID_SIGNING_KEY_PASSWORD;issecret=true;isOutput=true;]$(ANDROID-SIGNING-KEY-PASSWORD)"
        
        echo "##[debug]Exporting 'ANDROID-SIGNING-STORE-PASSWORD' secret to 'ANDROID_SIGNING_STORE_PASSWORD' var"
        echo "##vso[task.setvariable variable=ANDROID_SIGNING_STORE_PASSWORD;issecret=true;isOutput=true;]$(ANDROID-SIGNING-STORE-PASSWORD)"        
       
        echo "##[debug]Exporting 'IOS-TESTFLIGHT-API-KEY-ID' secret to 'IOS_TESTFLIGHT_API_KEY_ID' var"
        echo "##vso[task.setvariable variable=IOS_TESTFLIGHT_API_KEY_ID;issecret=true;isOutput=true;]$(IOS-TESTFLIGHT-API-KEY-ID)"
        
        echo "##[debug]Exporting 'IOS-TESTFLIGHT-API-ISSUER' secret to 'IOS_TESTFLIGHT_API_ISSUER' var"
        echo "##vso[task.setvariable variable=IOS_TESTFLIGHT_API_ISSUER;issecret=true;isOutput=true;]$(IOS-TESTFLIGHT-API-ISSUER)"
        
        echo "##[debug]Exporting 'IOS-TESTFLIGHT-API-TOKEN' secret to 'IOS_TESTFLIGHT_API_TOKEN' var"
        echo "##vso[task.setvariable variable=IOS_TESTFLIGHT_API_TOKEN;issecret=true;isOutput=true;]$(IOS-TESTFLIGHT-API-TOKEN)"

      name: export_secrets
      displayName: Exporting Secrets
    
  - job: "Package_android"
    dependsOn: 
    - config_env
    - akv_secrets
    condition: | 
                and(
                  succeeded(),
                  in(dependencies.config_env.result, 'Succeeded', 'Skipped'), 
                  in(dependencies.akv_secrets.result, 'Succeeded', 'Skipped'), 
                  in('${{ parameters.target }}', 'android', 'both')
                )
    displayName: "Package (Android)"
    variables:
      ANDROID_SIGNING_KEY_JKS: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_KEY_JKS'] ]
      ANDROID_SIGNING_KEY_PASSWORD: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_KEY_PASSWORD'] ]
      ANDROID_SIGNING_STORE_PASSWORD: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_STORE_PASSWORD'] ]
      EXTRA_ARGS_FLUTTER: $[ dependencies.config_env.outputs['export_variables.EXTRA_ARGS_FLUTTER'] ]
    pool: $(PRIVATE_AGENT_SHARED)
    steps:

    - checkout: self
      persistCredentials: true
      clean: true

    - task: Cache@2
      displayName: "Flutter Pub Cache"
      inputs:
        key: 'flutter pub v4 | "${{ parameters.qa_environment }}" | "$(Agent.OS)" | pubspec.yaml'
        path: '$(Agent.ToolsDirectory)/.pub-cache'
        cacheHitVar: PUB_CACHE_RESTORED        

    - script: |
        mkdir -p $(Agent.ToolsDirectory)/.pub-cache
        export PUB_CACHE=$(Agent.ToolsDirectory)/.pub-cache
      displayName: 'Create and Export Pub Cache'

    - ${{ if eq(parameters.use_flutter_version_latest, 'True' ) }}: 

      # Install Flutter
      - task: FlutterInstall@0
        displayName: "Install Flutter SDK"
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(FLUTTER_VERSION_LATEST)

    - ${{ else }}:

      # Install Flutter
      - task: FlutterInstall@0
        displayName: "Install Flutter SDK"
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(FLUTTER_VERSION)

    # Key Properties File contains storePassword, keyPassword and keyAlias for Android Signing
    - task: DownloadSecureFile@1
      name: keyprop
      displayName: Download key properties file
      inputs:
        secureFile: 'key.properties' 

    # Key File contains the keystore file for Android Signing
    - task: DownloadSecureFile@1
      name: key
      displayName: Download signing key
      inputs:
        secureFile: 'key.jks'

    # App Cert File contains the certificate for the app to login
    - task: DownloadSecureFile@1
      name: appCert
      displayName: Download App Cert
      inputs:
        secureFile: $(APP_CERT_FILE_NAME)

    # App Key File contains the private key for the app to login
    - task: DownloadSecureFile@1
      name: appKey
      displayName: Download App Key
      inputs:
        secureFile: $(APP_KEY_FILE_NAME)

    # Firebase Options File contains the Firebase options for the app
    - task: DownloadSecureFile@1
      name: firebaseOptionsEsteira1
      condition: eq('${{ parameters.qa_environment }}', 'esteira1')
      displayName: Download Firebase Options Esteira1
      inputs:
        secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_ESTEIRA1)

    # Google Services File contains the Google Services for the app
    - task: DownloadSecureFile@1
      name: googleServicesEsteira1
      condition: eq('${{ parameters.qa_environment }}', 'esteira1')
      displayName: Download Google Services Esteira1
      inputs:
        secureFile: $(ANDROID_GOOGLE_SERVICES_FILE_NAME_ESTEIRA1)

    # Firebase Options File contains the Firebase options for the app
    - task: DownloadSecureFile@1
      name: firebaseOptionsPreprod
      condition: eq('${{ parameters.qa_environment }}', 'preprod')
      displayName: Download Firebase Options Pre Producao
      inputs:
        secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_PREPROD)

    # Google Services File contains the Google Services for the app
    - task: DownloadSecureFile@1
      name: googleServicesPreprod
      condition: eq('${{ parameters.qa_environment }}', 'preprod')
      displayName: Download Google Services Pre Producao
      inputs:
        secureFile: $(ANDROID_GOOGLE_SERVICES_FILE_NAME_PREPROD)

    # Firebase Options File contains the Firebase options for the app
    - task: DownloadSecureFile@1
      name: firebaseOptionsProdlike
      condition: eq('${{ parameters.qa_environment }}', 'prodlike')
      displayName: Download Firebase Options Prodlike
      inputs:
        secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_PRODLIKE)

    # Google Services File contains the Google Services for the app
    - task: DownloadSecureFile@1
      name: googleServicesProdlike
      condition: eq('${{ parameters.qa_environment }}', 'prodlike')
      displayName: Download Google Services Prodlike
      inputs:
        secureFile: $(ANDROID_GOOGLE_SERVICES_FILE_NAME_PRODLIKE)

    # Firebase Options File contains the Firebase options for the app
    - task: DownloadSecureFile@1
      name: firebaseOptions
      condition: in('${{ parameters.qa_environment }}', 'producao', 'release')
      displayName: Download Firebase Options Producao
      inputs:
        secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME)

    # Google Services File contains the Google Services for the app
    - task: DownloadSecureFile@1
      name: googleServices
      condition: in('${{ parameters.qa_environment }}', 'producao', 'release')
      displayName: Download Google Services Producao
      inputs:
        secureFile: $(ANDROID_GOOGLE_SERVICES_FILE_NAME)

    # Extract Build Number adding a zero to the left if it is less than 10
    - task: Bash@3
      displayName: Extract Build Number 
      inputs:
        targetType: 'inline'
        script: |
          number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 2)
          if [ "$number" -lt 10 ]; then
            # Adicione um zero à esquerda
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"0"$number
          else
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"$number"
          fi
          echo "##[debug]Build number: $build_number"
          echo "##vso[task.setvariable variable=BUILD_NUMBER;]$build_number"


    # Configure Files
    - task: Bash@3
      displayName: Config Files
      inputs:
        targetType: 'inline'
        script: |

          echo "##[debug]Current environment is: ${{ parameters.qa_environment }}"            

          cp $(keyprop.secureFilePath) $(Build.SourcesDirectory)/android/key.properties
          cp $(key.secureFilePath) $(Build.SourcesDirectory)/android/key.jks
          echo "##[debug]key.properties copied to $(Build.SourcesDirectory)/android/key.properties"
          echo "##[debug]key.jks copied to $(Build.SourcesDirectory)/android/key.jks"          

          if [[ ${{ parameters.qa_environment }} == "esteira1" ]]; then       

            echo "##[debug]Copying firebase esteira1 files"
            cp $(firebaseOptionsEsteira1.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(googleServicesEsteira1.secureFilePath) $(Build.SourcesDirectory)/android/app/google-services.json
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_ESTEIRA1) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(ANDROID_GOOGLE_SERVICES_FILE_NAME_ESTEIRA1) copied to $(Build.SourcesDirectory)/android/app/google-services.json"

            echo "##[debug]Copying key and cert files to esteira1"
            echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/esteira1/certs/cert.crt"
            echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/esteira1/certs/private.pem"
            cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/esteira1/certs/cert.crt
            cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/esteira1/certs/private.pem
            
            # Update ELK tokens
            echo "##[debug]Update tokens esteira1"
            sed -i 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/esteira1/.env
            sed -i 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/esteira1/.env            

            # Update pubspec token if #{MAPP_PAYMENT_REF}# exists in pubspec.yaml
            if grep -q '#{MAPP_PAYMENT_REF}#' $(Build.SourcesDirectory)/pubspec.yaml; then
              echo "##[debug]Update mapp_payment ref pubspec token with snapshot-"
              sed -i 's/#{MAPP_PAYMENT_REF}#/$(MAPP_PAYMENT_REF)/g' $(Build.SourcesDirectory)/pubspec.yaml
            else
              echo "##[debug]No mapp_payment ref token found in pubspec.yaml"
            fi

          elif [[ ${{ parameters.qa_environment }} == "preprod" ]]; then

            echo "##[debub]Copying firebase preprod files"  
            cp $(firebaseOptionsPreprod.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(googleServicesPreprod.secureFilePath) $(Build.SourcesDirectory)/android/app/google-services.json
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_PREPROD) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(ANDROID_GOOGLE_SERVICES_FILE_NAME_PREPROD) copied to $(Build.SourcesDirectory)/android/app/google-services.json"

            echo "##[debug]Copying key and cert files to preprod"
            echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/preprod/certs/cert.crt"
            echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/preprod/certs/private.pem"
            cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/preprod/certs/cert.crt
            cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/preprod/certs/private.pem

            # Update ELK tokens
            echo "##[debug]Update tokens preprod"
            sed -i 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/preprod/.env
            sed -i 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/preprod/.env

            # Update pubspec token if #{MAPP_PAYMENT_REF}# exists in pubspec.yaml
            if grep -q '#{MAPP_PAYMENT_REF}#' $(Build.SourcesDirectory)/pubspec.yaml; then
              echo "##[debug]Update mapp_payment ref pubspec token with snapshot-"
              sed -i 's/#{MAPP_PAYMENT_REF}#/$(MAPP_PAYMENT_REF)/g' $(Build.SourcesDirectory)/pubspec.yaml
            else
              echo "##[debug]No mapp_payment ref token found in pubspec.yaml"
            fi

          elif [[ ${{ parameters.qa_environment }} == "prodlike" ]]; then

            echo "##[debug]Copying firebase prodlike files"
            cp $(firebaseOptionsProdlike.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(googleServicesProdlike.secureFilePath) $(Build.SourcesDirectory)/android/app/google-services.json
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_PRODLIKE) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(ANDROID_GOOGLE_SERVICES_FILE_NAME_PRODLIKE) copied to $(Build.SourcesDirectory)/android/app/google-services.json"

            echo "##[debug]Copying key and cert files to prodlike"
            echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prodlike/certs/cert.crt"
            echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prodlike/certs/private.pem"
            cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/prodlike/certs/cert.crt
            cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/prodlike/certs/private.pem

            # Update ELK tokens
            echo "##[debug]Update tokens prodlike"
            sed -i 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/prodlike/.env
            sed -i 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/prodlike/.env

            # Update pubspec token if #{MAPP_PAYMENT_REF}# exists in pubspec.yaml
            if grep -q '#{MAPP_PAYMENT_REF}#' $(Build.SourcesDirectory)/pubspec.yaml; then
              echo "##[debug]Clear mapp_payment ref pubspec token"
              sed -i 's/#{MAPP_PAYMENT_REF}#//g' $(Build.SourcesDirectory)/pubspec.yaml
            else
              echo "##[debug]No mapp_payment ref token found in pubspec.yaml"
            fi

          elif [[ ${{ parameters.qa_environment }} == "release" ]]; then 

            echo "##[debug]Copying firebase prod files"  
            cp $(firebaseOptions.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(googleServices.secureFilePath) $(Build.SourcesDirectory)/android/app/google-services.json
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(ANDROID_GOOGLE_SERVICES_FILE_NAME) copied to $(Build.SourcesDirectory)/android/app/google-services.json"

            echo "##[debug]Copying key and cert files to release"
            echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/release/certs/cert.crt"
            echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/release/certs/private.pem"
            cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/release/certs/cert.crt
            cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/release/certs/private.pem

            # Update ELK tokens
            echo "##[debug]Update tokens"
            sed -i 's/#{ELK_LOG_USER}#/$(ELK_LOG_USER)/g' $(Build.SourcesDirectory)/config/release/.env
            sed -i 's/#{ELK_LOG_PASSWORD}#/$(ELK_LOG_PASSWORD)/g' $(Build.SourcesDirectory)/config/release/.env
            sed -i 's/#{FLUTTER_LOGIN_CLIENT_ID}#/$(FLUTTER_LOGIN_CLIENT_ID)/g' $(Build.SourcesDirectory)/config/release/.env

            # Clear pubspec token
            echo "##[debug]Clear mapp_payment ref pubspec token"
            sed -i 's/#{MAPP_PAYMENT_REF}#//g' $(Build.SourcesDirectory)/pubspec.yaml

          elif [[ ${{ parameters.qa_environment }} == "producao" ]]; then       

            echo "##[debub]Copying firebase prod files"  
            cp $(firebaseOptions.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(googleServices.secureFilePath) $(Build.SourcesDirectory)/android/app/google-services.json
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(ANDROID_GOOGLE_SERVICES_FILE_NAME) copied to $(Build.SourcesDirectory)/android/app/google-services.json"

            echo "##[debug]Copying key and cert files to prod"
            echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prod/certs/cert.crt"
            echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prod/certs/private.pem"
            cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/prod/certs/cert.crt
            cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/prod/certs/private.pem

            # Update token 
            echo "##[debug]Update tokens"
            sed -i 's/#{ELK_LOG_USER}#/$(ELK_LOG_USER)/g' $(Build.SourcesDirectory)/config/prod/.env
            sed -i 's/#{ELK_LOG_PASSWORD}#/$(ELK_LOG_PASSWORD)/g' $(Build.SourcesDirectory)/config/prod/.env
            sed -i 's/#{FLUTTER_LOGIN_CLIENT_ID}#/$(FLUTTER_LOGIN_CLIENT_ID)/g' $(Build.SourcesDirectory)/config/prod/.env

            # Clear pubspec token
            echo "##[debug]Clear mapp_payment ref pubspec token"
            sed -i 's/#{MAPP_PAYMENT_REF}#//g' $(Build.SourcesDirectory)/pubspec.yaml
            
          fi

          # Update Google Maps token
          sed -i 's/#{GOOGLE_MAPS_API_KEY}#/$(GOOGLE_MAPS_API_KEY)/g' $(Build.SourcesDirectory)/android/app/src/main/AndroidManifest.xml            

    - task: Bash@3
      displayName: 'Agent Optimization'
      inputs:
        targetType: inline
        script: |
          echo "##[section]Agent Optimization"
          
          PUB_CACHE_DIR="$(Agent.ToolsDirectory)/.pub-cache"
          export PUB_CACHE="$PUB_CACHE_DIR"
          echo "##[debug]Setting PUB_CACHE to: $PUB_CACHE"
          
          # Status do cache
          echo "##[debug]Cache Status:"
          echo "##[debug]- Pub Cache: $(PUB_CACHE_RESTORED)"
          
          # Build condicional baseado em cache
          if [ "$(PUB_CACHE_RESTORED)" = "true" ]; then
            echo "##[debug]Cache hit - skipping clean operations"
            SKIP_CLEAN=true
          else
            echo "##[debug]Cache miss - performing selective clean"
            SKIP_CLEAN=false
          fi
          
          # Clean condicional (economia de tempo)
          if [ "$SKIP_CLEAN" = "false" ]; then
            echo "##[debug]Performing flutter clean..."
            flutter clean
          else
            echo "##[debug]Skipping flutter clean due to cache hit"
          fi

          echo "##[debug]Fetching pubspec dependencies..."

          # Configurar git para usar System Access Token para autenticação com Azure Repos
          
          # Usa System.CollectionUri para extrair a organização
          COLLECTION_URI="$(System.CollectionUri)"
          # Remove 'https://' e trailing '/'
          ORG_PATH=${COLLECTION_URI#https://}
          ORG_PATH=${ORG_PATH%/}
          
          # Extrai apenas o nome da organização
          ORG_NAME=$(echo "$ORG_PATH" | cut -d'/' -f2)
          
          echo "##[debug]Collection: $COLLECTION_URI"
          echo "##[debug]Organização: $ORG_NAME"
          
          # Configura Git com autenticação via System Access Token
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://$(System.AccessToken)@dev.azure.com/${ORG_NAME}/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://${ORG_NAME}@dev.azure.com/${ORG_NAME}/"

          flutter pub upgrade
          flutter pub get --no-example --verbose

    # Build Flutter APK
    - task: FlutterBuild@0
      displayName: "Build Application APK"
      inputs:
        target: 'apk'
        projectDirectory: '$(Build.SourcesDirectory)'
        extraArgs: $(EXTRA_ARGS_FLUTTER) 
        buildName: '$(Build.BuildNumber)'
        buildNumber: '$(BUILD_NUMBER)'
      env:
        ASDF_JAVA_VERSION: 'openjdk-17.0.2'       

    # Run Flutter Diagnostics if build fails
    - task: FlutterCommand@0
      displayName: "Run Flutter diagnostics"
      condition: failed()
      inputs:
        projectDirectory: '.'
        arguments: 'doctor -v'
      env:
        ASDF_JAVA_VERSION: 'openjdk-17.0.2'       

    # Sign and Align APK if not skipping and not in esteira1 or develop
    - ${{ if not( and( eq(parameters.skip_signing, True), in(variables['Build.SourceBranch'], 'refs/heads/esteira1', 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/feature/') )) }}:
    
      # Signing and aligning APK
      - task: AndroidSigning@3
        displayName: "Signing and aligning APK"
        inputs:
          apkFiles: "**/*.apk"
          apksign: true
          apksignerKeystoreFile: key.jks
          apksignerKeystorePassword: $(ANDROID_SIGNING_STORE_PASSWORD)
          apksignerKeystoreAlias: upload
          apksignerKeyPassword: $(ANDROID_SIGNING_KEY_PASSWORD)      
        env:
          ASDF_JAVA_VERSION: 'openjdk-17.0.2'       

      # Rename Build package, using APP_FILE_NAME_ANDROID variable in variable group  
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |             
            mv $(Build.SourcesDirectory)/build/app/outputs/flutter-apk/app-release.apk $(Build.SourcesDirectory)/build/app/outputs/flutter-apk/$(APP_FILE_NAME_ANDROID).apk
        displayName: Rename Build  

    - ${{ else }}:

      # Rename Build package, using APP_FILE_NAME_ANDROID variable in variable group  
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |             
            mv $(Build.SourcesDirectory)/build/app/outputs/apk/profile/app-profile.apk $(Build.SourcesDirectory)/build/app/outputs/apk/profile/$(APP_FILE_NAME_ANDROID).apk
        displayName: Rename Build  

    - task: CopyFiles@2
      displayName: "Copy APK to Staging"
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: '**/$(APP_FILE_NAME_ANDROID).apk'
        targetFolder: '$(Build.StagingDirectory)'
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: "Publish APK"
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'android_package'
        publishLocation: 'Container'

    ## PACKAGE TO PROD
