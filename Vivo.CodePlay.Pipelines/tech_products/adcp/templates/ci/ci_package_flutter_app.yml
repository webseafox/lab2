            md5sum $(Build.SourcesDirectory)/$(BLUEPRINT_PATH)
            cat $(Build.SourcesDirectory)/$(BLUEPRINT_PATH) | grep signatureCheck -A10

      - task: Bash@3
        displayName: Protect Android
        inputs:
          targetType: 'inline'
          script: |             
            $(System.DefaultWorkingDirectory)/protect-android/$(ARXAN_PACKAGE_FOLDER)/bin/protect-android --restrict-app-aware-reporting -b $(Build.SourcesDirectory)/$(BLUEPRINT_PATH) -i $(DEFAULT_WORKDIR_ARTIFACTS)/$(APP_FILE_NAME_ANDROID).aab -o $(Build.SourcesDirectory)/build/app/outputs/flutter-aab
        env:
          LICENSE_TOKEN: "$(ARXAN_LICENSE_TOKEN)"
          ANDROID_HOME: "$(ANDROID_HOME)"
          ANDROID_SDK_ROOT: "$(ANDROID_HOME)"
          #ASDF_JAVA_VERSION: "openjdk-17.0.2"

      - task: AndroidSigning@3
        displayName: "Signing AAB"
        inputs:
          apkFiles: "$(Build.SourcesDirectory)/build/app/outputs/flutter-aab/$(APP_FILE_NAME_ANDROID)-unaligned-unsigned-protected.aab"
          apksign: true
          apksignerKeystoreFile: key.jks
          apksignerKeystorePassword: $(ANDROID_SIGNING_STORE_PASSWORD)
          apksignerKeystoreAlias: upload
          apksignerKeyPassword: $(ANDROID_SIGNING_KEY_PASSWORD)
          apksignerArguments: '--min-sdk-version 24 --v1-signing-enabled true --v2-signing-enabled true --out $(Build.SourcesDirectory)/build/app/outputs/flutter-aab/$(APP_FILE_NAME_ANDROID).aab'
        #env:
        #  ASDF_JAVA_VERSION: "openjdk-17.0.2"          

      - task: CopyFiles@2
        displayName: "Copy Sign AAB to Staging"
        inputs:
          sourceFolder: '$(Build.SourcesDirectory)'
          contents: '**/build/app/outputs/flutter-aab/$(APP_FILE_NAME_ANDROID).aab'
          targetFolder: '$(Build.StagingDirectory)'
