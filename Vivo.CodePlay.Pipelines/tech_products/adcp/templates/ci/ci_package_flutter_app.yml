  - job: "Protect_android"
    dependsOn: 
    - akv_secrets
    - Package_android
    condition: | 
                and(
                  succeeded(),
                  in(dependencies.Package_android.result, 'Succeeded', 'Skipped'), 
                  in('${{ parameters.target }}', 'android', 'both'),
                  or(
                    eq('${{ parameters.skip_protect }}', False),
                    in('${{ parameters.qa_environment }}', 'producao', 'prodlike', 'release')
                  )
                )
    displayName: "Protect (Android)"
    pool: 
      #GeneralPurposeLinuxAgentsCI
      vmImage: 'ubuntu-latest'
    variables:
      ANDROID_SIGNING_KEY_JKS: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_KEY_JKS'] ]
      ANDROID_SIGNING_KEY_PASSWORD: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_KEY_PASSWORD'] ]
      ANDROID_SIGNING_STORE_PASSWORD: $[ dependencies.akv_secrets.outputs['export_secrets.ANDROID_SIGNING_STORE_PASSWORD'] ]      
    steps:

    - checkout: self
      persistCredentials: true
      clean: true

    - ${{ if eq(parameters.use_flutter_version_latest, 'True' ) }}: 

      - task: Cache@2
        displayName: "Flutter Install Cache"
        inputs:
          key: 'Flutter | "$(Agent.OS)" | "$(FLUTTER_VERSION_LATEST)"'
          path: '$(Agent.ToolsDirectory)/Flutter'
          cacheHitVar: FLUTTER_INSTALL_RESTORED

      # Install Flutter
      - task: FlutterInstall@0
        displayName: "Install Flutter SDK"
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(FLUTTER_VERSION_LATEST)

    - ${{ else }}:

      - task: Cache@2
        displayName: "Flutter Install Cache"
        inputs:
          key: 'Flutter | "$(Agent.OS)" | "$(FLUTTER_VERSION_LATEST)"'
          path: '$(Agent.ToolsDirectory)/Flutter'
          cacheHitVar: FLUTTER_INSTALL_RESTORED

