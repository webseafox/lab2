      - task: Bash@3
        displayName: Name iOS Package Protected
        inputs:
          targetType: 'inline'
          script: |           
            # source
            echo "##[debug]Setting iOS Package Name Pro"
            name='package_protected'
            echo "##vso[task.setvariable variable=IOS_PACKAGE_NAME]$name"

      # Download EnsureIT Release Config
      - task: DownloadSecureFile@1
        name: ensureIT
        displayName: Download EnsureIT Release Config
        inputs:
          secureFile: $(ENSUREIT_RELEASE_FILE_NAME)

    - ${{ else }}:

      - task: Bash@3
        displayName: Name iOS Package
        inputs:
          targetType: 'inline'
          script: |           
            # source
            echo "##[debug]Setting iOS Package Name"
            name='package'
            echo "##vso[task.setvariable variable=IOS_PACKAGE_NAME]$name"

    ## PACKAGE TO ESTEIRA1 PRODLIKE OR PREPROD
    - ${{ if in( parameters.qa_environment, 'esteira1', 'prodlike', 'preprod' ) }}: 

      # Download secure files first
      - task: DownloadSecureFile@1
        name: p12CertificateDev
        displayName: 'Download P12 Certificate DEV'
        inputs:
          secureFile: $(IOS_P12_SECURE_FILE_DEV)

      - task: DownloadSecureFile@1
        name: provisioningProfileDev
        displayName: 'Download Provisioning Profile DEV'
        inputs:
          secureFile: $(IOS_PROV_PROFILE_SECURE_FILE_DEV)

      # Install certificate and provisioning profile manually
      - task: Bash@3
        displayName: 'Setup iOS Signing (Manual)'
        inputs:
          targetType: inline
          script: |
            set -e
            
            echo "##[section]Setting up iOS Code Signing"
            
            # Create temporary keychain using Azure DevOps temp directory
            KEYCHAIN_PATH="$HOME/Library/Keychains/app-signing-$(Build.BuildId).keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            
            echo "##[debug]Removing existing keychain if present..."
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            
            echo "##[debug]Creating new temporary keychain..."
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            echo "##[debug]Configuring keychain settings..."
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            echo "##[debug]Adding keychain to search list..."
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
            security default-keychain -s "$KEYCHAIN_PATH"
            
            echo "##[section]Validating P12 Certificate"
            P12_FILE="$(p12CertificateDev.secureFilePath)"
            echo "##[debug]P12 file path: $P12_FILE"
            echo "##[debug]P12 file exists: $(test -f "$P12_FILE" && echo "YES" || echo "NO")"
            echo "##[debug]P12 file size: $(ls -lh "$P12_FILE" | awk '{print $5}')"
            echo "##[debug]P12 file permissions: $(ls -l "$P12_FILE" | awk '{print $1}')"
            
            # Verificar conteúdo do P12 (sem senha)
            echo "##[debug]Validating P12 structure..."
            openssl pkcs12 -info -in "$P12_FILE" -passin pass:"$(IOS_P12_CERTIFICATE_PWD_DEV)" -noout 2>&1 || {
              echo "##vso[task.logissue type=error;]Failed to validate P12 certificate. Password may be incorrect or file corrupted."
              exit 1
            }
            
            echo "##[debug]P12 certificate validated successfully"
            
            echo "##[section]Installing Apple Certificate Chain"
            # Download and install Apple Worldwide Developer Relations Certification Authority
            echo "##[debug]Downloading Apple WWDR certificate..."
            curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
            curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o /tmp/AppleWWDRCAG6.cer
            
            echo "##[debug]Importing Apple WWDR certificates..."
            security import /tmp/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security -A
            security import /tmp/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security -A
            
            echo "##[debug]Importing P12 certificate..."
            security import "$P12_FILE" \
              -k "$KEYCHAIN_PATH" \
              -P "$(IOS_P12_CERTIFICATE_PWD_DEV)" \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -A 2>&1 || {
              echo "##vso[task.logissue type=error;]Failed to import P12 certificate into keychain"
              exit 1
            }
            
            echo "##[debug]Certificate import completed"
            
            echo "##[debug]Setting key partition list..."
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH" 2>&1 || {
              echo "##vso[task.logissue type=warning;]Failed to set key partition list, trying alternative approach..."
              # Alternative: set partition list for all items
              security set-key-partition-list -S apple-tool:,apple: \
                -k "$KEYCHAIN_PASSWORD" \
                "$KEYCHAIN_PATH" 2>&1
            }
            
            echo "##[debug]Verifying certificate installation..."
            IDENTITY_OUTPUT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
            echo "$IDENTITY_OUTPUT"
            
            # Check if at least one certificate was found
            if echo "$IDENTITY_OUTPUT" | grep -q "0 valid identities found"; then
              echo "##vso[task.logissue type=error;]No valid signing identities found in keychain after import!"
              echo "##[debug]Keychain contents:"
              security dump-keychain "$KEYCHAIN_PATH"
              exit 1
            fi
            
            echo "##[debug]Certificate successfully installed and accessible"
            
            echo "##[section]Installing Provisioning Profile"
            
            # Get profile UUID from the file
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfileDev.secureFilePath)"))
            echo "##[debug]Profile UUID: $PROFILE_UUID"
            
            # Get profile name
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfileDev.secureFilePath)"))
            echo "##[debug]Profile Name: $PROFILE_NAME"
            
            # Get profile type
            PROFILE_TYPE=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfileDev.secureFilePath)") 2>/dev/null && echo "Development/Ad-Hoc" || echo "App Store")
            echo "##[debug]Profile Type: $PROFILE_TYPE"
            
            # Get expiration date
            EXPIRATION_DATE=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfileDev.secureFilePath)"))
            echo "##[debug]Expiration Date: $EXPIRATION_DATE"
            
            # Get team name
            TEAM_NAME=$(/usr/libexec/PlistBuddy -c "Print :TeamName" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfileDev.secureFilePath)"))
            echo "##[debug]Team Name: $TEAM_NAME"
            
            echo "##[debug]Installing provisioning profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            cp "$(provisioningProfileDev.secureFilePath)" "$PROFILE_PATH"
            
            echo "##[debug]Profile installed at: $PROFILE_PATH"
            echo "##[debug]Verifying profile installation..."
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ | grep "${PROFILE_UUID}"
            
            # Extract signing identity from certificate
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | grep -o '"[^"]*"' | sed 's/"//g')
            echo "##[debug]Signing Identity: $SIGNING_IDENTITY"
            
            # Export variables for cleanup and later use
            echo "##vso[task.setvariable variable=KEYCHAIN_PATH]$KEYCHAIN_PATH"
            echo "##vso[task.setvariable variable=KEYCHAIN_PASSWORD;issecret=true]$KEYCHAIN_PASSWORD"
            echo "##vso[task.setvariable variable=PROFILE_PATH]$PROFILE_PATH"
            echo "##vso[task.setvariable variable=APPLE_PROV_PROFILE_UUID]$PROFILE_UUID"
            echo "##vso[task.setvariable variable=APPLE_CERTIFICATE_SIGNING_IDENTITY]$SIGNING_IDENTITY"
            
            echo "##[section]iOS Code Signing setup completed successfully"
        env:
          IOS_P12_CERTIFICATE_PWD_DEV: $(IOS_P12_CERTIFICATE_PWD_DEV)


      # Firebase Options File contains the Firebase options for the app
      - task: DownloadSecureFile@1
        name: firebaseOptionsEsteira1
        condition: eq('${{ parameters.qa_environment }}', 'esteira1')
        displayName: Download Firebase Options Esteira1
        inputs:
          secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_ESTEIRA1)

      # Firebase App Id File contains the Firebase App Id for the app
      - task: DownloadSecureFile@1
        name: firebaseAppIdEsteira1
        condition: eq('${{ parameters.qa_environment }}', 'esteira1')
        displayName: Download Firebase App Id Esteira1
        inputs:
          secureFile: $(IOS_FIREBASE_APP_ID_FILE_NAME_ESTEIRA1)

      # Google Service Info File contains the Google Service Info for the app
      - task: DownloadSecureFile@1
        name: googleServiceInfoEsteira1
        condition: eq('${{ parameters.qa_environment }}', 'esteira1')
        displayName: Download Google Service Info Esteira1
        inputs:
          secureFile: $(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_ESTEIRA1)

      # Firebase Options File contains the Firebase options for the app
      - task: DownloadSecureFile@1
        name: firebaseOptionsPreprod
        condition: eq('${{ parameters.qa_environment }}', 'preprod')
        displayName: Download Firebase Options Pre Producao
        inputs:
          secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_PREPROD)

      # Firebase App Id File contains the Firebase App Id for the app
      - task: DownloadSecureFile@1
        name: firebaseAppIdPreprod
        condition: eq('${{ parameters.qa_environment }}', 'preprod')
        displayName: Download Firebase App Id Pre Producao
        inputs:
          secureFile: $(IOS_FIREBASE_APP_ID_FILE_NAME_PREPROD)

      # Google Service Info File contains the Google Service Info for the app
      - task: DownloadSecureFile@1
        name: googleServiceInfoPreprod
        condition: eq('${{ parameters.qa_environment }}', 'preprod')
        displayName: Download Google Service Info Pre Producao
        inputs:
          secureFile: $(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_PREPROD)

      # Firebase Options File contains the Firebase options for the app
      - task: DownloadSecureFile@1
        name: firebaseOptionsProdlike
        condition: eq('${{ parameters.qa_environment }}', 'prodlike')
        displayName: Download Firebase Options Prodlike
        inputs:
          secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME_PRODLIKE)

      # Firebase App Id File contains the Firebase App Id for the app
      - task: DownloadSecureFile@1
        name: firebaseAppIdProdlike
        condition: eq('${{ parameters.qa_environment }}', 'prodlike')
        displayName: Download Firebase App Id Prodlike
        inputs:
          secureFile: $(IOS_FIREBASE_APP_ID_FILE_NAME_PRODLIKE)

      # Google Service Info File contains the Google Service Info for the app
      - task: DownloadSecureFile@1
        name: googleServiceInfoProdlike
        condition: eq('${{ parameters.qa_environment }}', 'prodlike')
        displayName: Download Google Service Info Prodlike
        inputs:
          secureFile: $(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_PRODLIKE)

      # Manipulate Secure Files
      - task: Bash@3
        displayName: Config Files 
        inputs:
          targetType: 'inline'
          script: |           

            echo "##[debug]Current environment is: ${{ parameters.qa_environment }}"                    
            
            if [[ ${{ parameters.qa_environment }} == "esteira1" ]]; then       

              echo "##[debug]Copying firebase esteira1 files"  
              cp $(firebaseOptionsEsteira1.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
              cp $(firebaseAppIdEsteira1.secureFilePath) $(Build.SourcesDirectory)/ios/firebase_app_id_file.json
              cp $(googleServiceInfoEsteira1.secureFilePath) $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist
              echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_ESTEIRA1) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
              echo "##[debug]$(IOS_FIREBASE_APP_ID_FILE_NAME_ESTEIRA1) copied to $(Build.SourcesDirectory)/ios/firebase_app_id_file.json"
              echo "##[debug]$(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_ESTEIRA1) copied to $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist"

              echo "##[debug]Copying key and cert files to esteira1"
              echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/esteira1/certs/cert.crt"
              echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/esteira1/certs/private.pem"
              cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/esteira1/certs/cert.crt
              cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/esteira1/certs/private.pem

              # Update ELK tokens
              echo "##[debug]Update ELK tokens ESTEIRA1"
              sed -i '' 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/esteira1/.env
              sed -i '' 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/esteira1/.env

            elif [[ ${{ parameters.qa_environment }} == "prodlike" ]]; then 

              echo "##[debug]Copying firebase prodlike files"  
              cp $(firebaseOptionsProdlike.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
              cp $(firebaseAppIdProdlike.secureFilePath) $(Build.SourcesDirectory)/ios/firebase_app_id_file.json
              cp $(googleServiceInfoProdlike.secureFilePath) $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist
              echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_PRODLIKE) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
              echo "##[debug]$(IOS_FIREBASE_APP_ID_FILE_NAME_PRODLIKE) copied to $(Build.SourcesDirectory)/ios/firebase_app_id_file.json"
              echo "##[debug]$(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_PRODLIKE) copied to $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist"

              echo "##[debug]Copying key and cert files to prodlike"
              echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prodlike/certs/cert.crt"
              echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prodlike/certs/private.pem"
              cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/prodlike/certs/cert.crt
              cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/prodlike/certs/private.pem

              # Update ELK tokens
              echo "##[debug]Update tokens prodlike"
              sed -i '' 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/prodlike/.env
              sed -i '' 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/prodlike/.env        

            else

              echo "##[debub]Copying firebase preprod files"  
              cp $(firebaseOptionsPreprod.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
              cp $(firebaseAppIdPreprod.secureFilePath) $(Build.SourcesDirectory)/ios/firebase_app_id_file.json
              cp $(googleServiceInfoPreprod.secureFilePath) $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist
              echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME_PREPROD) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
              echo "##[debug]$(IOS_FIREBASE_APP_ID_FILE_NAME_PREPROD) copied to $(Build.SourcesDirectory)/ios/firebase_app_id_file.json"
              echo "##[debug]$(IOS_GOOGLE_SERVICE_INFO_FILE_NAME_PREPROD) copied to $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist"

              echo "##[debug]Copying key and cert files to preprod"
              echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/preprod/certs/cert.crt"
              echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/preprod/certs/private.pem"
              cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/preprod/certs/cert.crt
              cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/preprod/certs/private.pem

              # Update ELK tokens
              echo "##[debug]Update ELK tokens PRE"
              sed -i '' 's/#{ELK_LOG_USER_PRE}#/$(ELK_LOG_USER_PRE)/g' $(Build.SourcesDirectory)/config/preprod/.env
              sed -i '' 's/#{ELK_LOG_PASSWORD_PRE}#/$(ELK_LOG_PASSWORD_PRE)/g' $(Build.SourcesDirectory)/config/preprod/.env

            fi

            # Update Guard Spec
            if [[ ${{ parameters.skip_protect }} == "False" ]]; then       
              echo "##[debug]Update GUARD SPEC token"
              echo "##[debug]GUARD_SPEC_SETTINGS is: $(GUARD_SPEC_SETTINGS)"            
              sed -i '' 's|#{GUARD_SPEC_SETTINGS}#|$(GUARD_SPEC_SETTINGS)|g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj
              echo "##[debug]ENSUREIT_COMPILE_FLAG is: $(ENSUREIT_COMPILE_FLAG)"            
              sed -i '' 's|#{ENSUREIT_COMPILE_FLAG}#|$(ENSUREIT_COMPILE_FLAG)|g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj

              echo "##[debug]$(ENSUREIT_RELEASE_FILE_NAME) copied to $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig"
              cp $(ensureIT.secureFilePath) $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig

            else
              echo "##[debug]Clear GUARD_SPEC_SETTINGS token"
              sed -i '' 's/#{GUARD_SPEC_SETTINGS}#//g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj
              echo "##[debug]Clear ENSUREIT_COMPILE_FLAG token"
              sed -i '' 's/#{ENSUREIT_COMPILE_FLAG}#//g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj

            fi

            # Update Google Maps token
            sed -i '' 's/#{GOOGLE_MAPS_API_KEY}#/$(GOOGLE_MAPS_API_KEY)/g' $(Build.SourcesDirectory)/ios/Runner/AppDelegate.swift

            # Update pubspec token if #{MAPP_PAYMENT_REF}# exists in pubspec.yaml
            if grep -q '#{MAPP_PAYMENT_REF}#' $(Build.SourcesDirectory)/pubspec.yaml; then
              echo "##[debug]Update mapp_payment ref pubspec token with snapshot-"
              sed -i '' 's/#{MAPP_PAYMENT_REF}#/$(MAPP_PAYMENT_REF)/g' $(Build.SourcesDirectory)/pubspec.yaml
            else
              echo "##[debug]No mapp_payment ref token found in pubspec.yaml"
            fi

            echo "##[debug]Current project.pbxproj" 
            cat $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj
            echo ""
            echo "##[debug]Current Release.xcconfig"
            cat $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig
            echo ""


    ## PACKAGE TO PROD
    - ${{ if in(parameters.qa_environment, 'release', 'producao') }}: 

      # Download secure files first
      - task: DownloadSecureFile@1
        name: p12Certificate
        displayName: 'Download P12 Certificate PROD'
        inputs:
          secureFile: $(IOS_P12_SECURE_FILE)

      - task: DownloadSecureFile@1
        name: provisioningProfile
        displayName: 'Download Provisioning Profile PROD'
        inputs:
          secureFile: $(IOS_PROV_PROFILE_SECURE_FILE)

      # Install certificate and provisioning profile manually
      - task: Bash@3
        displayName: 'Setup iOS Signing (Manual)'
        inputs:
          targetType: inline
          script: |
            set -e
            
            echo "##[section]Setting up iOS Code Signing"
            
            # Create temporary keychain using Azure DevOps temp directory
            KEYCHAIN_PATH="$HOME/Library/Keychains/app-signing-$(Build.BuildId).keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            
            echo "##[debug]Removing existing keychain if present..."
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            
            echo "##[debug]Creating new temporary keychain..."
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            echo "##[debug]Configuring keychain settings..."
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            echo "##[debug]Adding keychain to search list..."
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
            security default-keychain -s "$KEYCHAIN_PATH"
            
            echo "##[section]Validating P12 Certificate"
            P12_FILE="$(p12Certificate.secureFilePath)"
            echo "##[debug]P12 file path: $P12_FILE"
            echo "##[debug]P12 file exists: $(test -f "$P12_FILE" && echo "YES" || echo "NO")"
            echo "##[debug]P12 file size: $(ls -lh "$P12_FILE" | awk '{print $5}')"
            echo "##[debug]P12 file permissions: $(ls -l "$P12_FILE" | awk '{print $1}')"
            
            # Verificar conteúdo do P12 (sem senha)
            echo "##[debug]Validating P12 structure..."
            openssl pkcs12 -info -in "$P12_FILE" -passin pass:"$(IOS_P12_CERTIFICATE_PWD)" -noout 2>&1 || {
              echo "##vso[task.logissue type=error;]Failed to validate P12 certificate. Password may be incorrect or file corrupted."
              exit 1
            }
            
            echo "##[debug]P12 certificate validated successfully"
            
            echo "##[section]Installing Apple Certificate Chain"
            # Download and install Apple Worldwide Developer Relations Certification Authority
            echo "##[debug]Downloading Apple WWDR certificate..."
            curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
            curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o /tmp/AppleWWDRCAG6.cer
            
            echo "##[debug]Importing Apple WWDR certificates..."
            security import /tmp/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security -A
            security import /tmp/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security -A
            
            echo "##[debug]Importing P12 certificate..."
            security import "$P12_FILE" \
              -k "$KEYCHAIN_PATH" \
              -P "$(IOS_P12_CERTIFICATE_PWD)" \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -A 2>&1 || {
              echo "##vso[task.logissue type=error;]Failed to import P12 certificate into keychain"
              exit 1
            }
            
            echo "##[debug]Certificate import completed"
            
            echo "##[debug]Setting key partition list..."
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH" 2>&1 || {
              echo "##vso[task.logissue type=warning;]Failed to set key partition list, trying alternative approach..."
              # Alternative: set partition list for all items
              security set-key-partition-list -S apple-tool:,apple: \
                -k "$KEYCHAIN_PASSWORD" \
                "$KEYCHAIN_PATH" 2>&1
            }
            
            echo "##[debug]Verifying certificate installation..."
            IDENTITY_OUTPUT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
            echo "$IDENTITY_OUTPUT"
            
            # Check if at least one certificate was found
            if echo "$IDENTITY_OUTPUT" | grep -q "0 valid identities found"; then
              echo "##vso[task.logissue type=error;]No valid signing identities found in keychain after import!"
              echo "##[debug]Keychain contents:"
              security dump-keychain "$KEYCHAIN_PATH"
              exit 1
            fi
            
            echo "##[debug]Certificate successfully installed and accessible"
            
            echo "##[section]Installing Provisioning Profile"
            
            # Get profile UUID from the file
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfile.secureFilePath)"))
            echo "##[debug]Profile UUID: $PROFILE_UUID"
            
            # Get profile name
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfile.secureFilePath)"))
            echo "##[debug]Profile Name: $PROFILE_NAME"
            
            # Get profile type
            PROFILE_TYPE=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfile.secureFilePath)") 2>/dev/null && echo "Development/Ad-Hoc" || echo "App Store")
            echo "##[debug]Profile Type: $PROFILE_TYPE"
            
            # Get expiration date
            EXPIRATION_DATE=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfile.secureFilePath)"))
            echo "##[debug]Expiration Date: $EXPIRATION_DATE"
            
            # Get team name
            TEAM_NAME=$(/usr/libexec/PlistBuddy -c "Print :TeamName" /dev/stdin <<< $(/usr/bin/security cms -D -i "$(provisioningProfile.secureFilePath)"))
            echo "##[debug]Team Name: $TEAM_NAME"
            
            echo "##[debug]Installing provisioning profile..."
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            cp "$(provisioningProfile.secureFilePath)" "$PROFILE_PATH"
            
            echo "##[debug]Profile installed at: $PROFILE_PATH"
            echo "##[debug]Verifying profile installation..."
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ | grep "${PROFILE_UUID}"
            
            # Extract signing identity from certificate
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | grep -o '"[^"]*"' | sed 's/"//g')
            echo "##[debug]Signing Identity: $SIGNING_IDENTITY"
            
            # Export variables for cleanup and later use
            echo "##vso[task.setvariable variable=KEYCHAIN_PATH]$KEYCHAIN_PATH"
            echo "##vso[task.setvariable variable=KEYCHAIN_PASSWORD;issecret=true]$KEYCHAIN_PASSWORD"
            echo "##vso[task.setvariable variable=PROFILE_PATH]$PROFILE_PATH"
            echo "##vso[task.setvariable variable=APPLE_PROV_PROFILE_UUID]$PROFILE_UUID"
            echo "##vso[task.setvariable variable=APPLE_CERTIFICATE_SIGNING_IDENTITY]$SIGNING_IDENTITY"
            
            echo "##[section]iOS Code Signing setup completed successfully"
        env:
          IOS_P12_CERTIFICATE_PWD: $(IOS_P12_CERTIFICATE_PWD)

      # Firebase Options File contains the Firebase options for the app
      - task: DownloadSecureFile@1
        name: firebaseOptions
        displayName: Download Firebase Options Producao
        inputs:
          secureFile: $(LIB_FIREBASE_OPTIONS_FILE_NAME)

      # Firebase App Id File contains the Firebase App Id for the app
      - task: DownloadSecureFile@1
        name: firebaseAppId
        displayName: Download Firebase App Id Producao
        inputs:
          secureFile: $(IOS_FIREBASE_APP_ID_FILE_NAME)

      # Google Service Info File contains the Google Service Info for the app
      - task: DownloadSecureFile@1
        name: googleServiceInfo
        displayName: Download Google Service Info Producao
        inputs:
          secureFile: $(IOS_GOOGLE_SERVICE_INFO_FILE_NAME)

      # Manipulate Secure Files
      - task: Bash@3
        displayName: Config Files 
        inputs:
          targetType: 'inline'
          script: |

            echo "##[debug]Current environment is: ${{ parameters.qa_environment }}"            

            echo "##[debub]Copying firebase prod files"  
            cp $(firebaseOptions.secureFilePath) $(Build.SourcesDirectory)/lib/firebase_options.dart
            cp $(firebaseAppId.secureFilePath) $(Build.SourcesDirectory)/ios/firebase_app_id_file.json
            cp $(googleServiceInfo.secureFilePath) $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist
            echo "##[debug]$(LIB_FIREBASE_OPTIONS_FILE_NAME) copied to $(Build.SourcesDirectory)/lib/firebase_options.dart"
            echo "##[debug]$(IOS_FIREBASE_APP_ID_FILE_NAME) copied to $(Build.SourcesDirectory)/ios/firebase_app_id_file.json"
            echo "##[debug]$(IOS_GOOGLE_SERVICE_INFO_FILE_NAME) copied to $(Build.SourcesDirectory)/ios/Runner/GoogleService-Info.plist"

            if [[ ${{ parameters.qa_environment }} == "producao" ]]; then       

              cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/prod/certs/cert.crt
              cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/prod/certs/private.pem

              echo "##[debub]Copying files to prod"  
              echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prod/certs/cert.crt"
              echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/prod/certs/private.pem"

              # Update ELK tokens
              echo "##[debug]Update tokens PROD"
              sed -i '' 's/#{FLUTTER_LOGIN_CLIENT_ID}#/$(FLUTTER_LOGIN_CLIENT_ID)/g' $(Build.SourcesDirectory)/config/prod/.env
              sed -i '' 's/#{ELK_LOG_USER}#/$(ELK_LOG_USER)/g' $(Build.SourcesDirectory)/config/prod/.env
              sed -i '' 's/#{ELK_LOG_PASSWORD}#/$(ELK_LOG_PASSWORD)/g' $(Build.SourcesDirectory)/config/prod/.env

            else
              
              cp $(appCert.secureFilePath) $(Build.SourcesDirectory)/config/release/certs/cert.crt
              cp $(appKey.secureFilePath) $(Build.SourcesDirectory)/config/release/certs/private.pem

              echo "##[debub]Copying files to release"
              echo "##[debug]$(APP_CERT_FILE_NAME) copied to $(Build.SourcesDirectory)/config/release/certs/cert.crt"
              echo "##[debug]$(APP_KEY_FILE_NAME) copied to $(Build.SourcesDirectory)/config/release/certs/private.pem"

              # Update ELK token 
              echo "##[debug]Update tokens RELEASE"
              sed -i '' 's/#{FLUTTER_LOGIN_CLIENT_ID}#/$(FLUTTER_LOGIN_CLIENT_ID)/g' $(Build.SourcesDirectory)/config/release/.env
              sed -i '' 's/#{ELK_LOG_USER}#/$(ELK_LOG_USER)/g' $(Build.SourcesDirectory)/config/release/.env
              sed -i '' 's/#{ELK_LOG_PASSWORD}#/$(ELK_LOG_PASSWORD)/g' $(Build.SourcesDirectory)/config/release/.env

            fi 

            # Update Google Maps token 
            sed -i '' 's/#{GOOGLE_MAPS_API_KEY}#/$(GOOGLE_MAPS_API_KEY)/g' $(Build.SourcesDirectory)/ios/Runner/AppDelegate.swift

            # Clear pubspec token
            echo "##[debug]Clear mapp_payment ref pubspec token"
            sed -i '' 's/#{MAPP_PAYMENT_REF}#//g' $(Build.SourcesDirectory)/pubspec.yaml

            # Update Guard Spec
       
            echo "##[debug]Update Guard tokens"
            echo "##[debug]GUARD_SPEC_SETTINGS is: $(GUARD_SPEC_SETTINGS)"            
            sed -i '' 's|#{GUARD_SPEC_SETTINGS}#|$(GUARD_SPEC_SETTINGS)|g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj

            echo "##[debug]ENSUREIT_COMPILE_FLAG is: $(ENSUREIT_COMPILE_FLAG)"            
            sed -i '' 's|#{ENSUREIT_COMPILE_FLAG}#|$(ENSUREIT_COMPILE_FLAG)|g' $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj

            echo "##[debug]$(ENSUREIT_RELEASE_FILE_NAME) copied to $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig"
            cp $(ensureIT.secureFilePath) $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig

            echo "##[debug]Current project.pbxproj" 
            cat $(Build.SourcesDirectory)/ios/Runner.xcodeproj/project.pbxproj
            echo ""
            echo "##[debug]Current Release.xcconfig"
            cat $(Build.SourcesDirectory)/ios/Flutter/Release.xcconfig
            echo ""

    - task: Bash@3
      displayName: Extract Build Number 
      inputs:
        targetType: 'inline'
        script: |
          number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 2)
          if [ "$number" -lt 10 ]; then
            # Adicione um zero à esquerda
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"0"$number
          else
            build_number=$(echo "$(Build.BuildNumber)" | cut -d '.' -f 1)"$number"
          fi
          echo "##[debug]Build number: $build_number"
          echo "##vso[task.setvariable variable=BUILD_NUMBER;]$build_number"

    - task: Bash@3
      displayName: 'Agent Optimization'
      inputs:
        targetType: inline
        script: |
          echo "##[section]Agent Optimization"
          
          PUB_CACHE_DIR="$(Agent.ToolsDirectory)/.pub-cache"
          export PUB_CACHE="$PUB_CACHE_DIR"
          echo "##[debug]Setting PUB_CACHE to: $PUB_CACHE"
          
          # Status do cache
          echo "##[debug]Cache Status:"
          echo "##[debug]- Pub Cache: $(PUB_CACHE_RESTORED)"
          echo "##[debug]- Pods Cache: $(PODS_CACHE_RESTORED)"
          
          # Build condicional baseado em cache
          if [ "$(PUB_CACHE_RESTORED)" = "true" ] && [ "$(PODS_CACHE_RESTORED)" = "true" ]; then
            echo "##[debug]Cache hit - skipping clean operations"
            SKIP_CLEAN=true
          else
            echo "##[debug]Cache miss - performing selective clean"
            SKIP_CLEAN=false
          fi
          
          # Clean condicional (economia de tempo)
          if [ "$SKIP_CLEAN" = "false" ]; then
            echo "##[debug]Performing flutter clean..."
            flutter clean
          else
            echo "##[debug]Skipping flutter clean due to cache hit"
          fi

          echo "##[debug]Fetching pubspec dependencies..."

          # Configurar git para usar System Access Token para autenticação com Azure Repos
                    
          # Usa System.CollectionUri para extrair a organização
          COLLECTION_URI="$(System.CollectionUri)"
          # Remove 'https://' e trailing '/'
          ORG_PATH=${COLLECTION_URI#https://}
          ORG_PATH=${ORG_PATH%/}
          
          # Extrai apenas o nome da organização
          ORG_NAME=$(echo "$ORG_PATH" | cut -d'/' -f2)
          
          echo "##[debug]Collection: $COLLECTION_URI"
          echo "##[debug]Organização: $ORG_NAME"
          
          # Limpar regras insteadOf anteriores (tokens expirados de builds anteriores no agente self-hosted)
          echo "##[debug]Cleaning stale git insteadOf rules for org..."
          git config --global --get-regexp "url\..*dev\.azure\.com/${ORG_NAME}.*\.insteadof" 2>/dev/null | while read key value; do
            git config --global --unset "$key" 2>/dev/null || true
          done
          
          # Configura Git com autenticação via System Access Token
          git config --global url."https://$(System.AccessToken)@dev.azure.com/${ORG_NAME}/".insteadOf "https://${ORG_NAME}@dev.azure.com/${ORG_NAME}/"
          
          echo "##[debug]Git insteadOf config applied:"
          git config --global --get-regexp 'url.*insteadOf' | sed 's/$(System.AccessToken)/***TOKEN***/g' || true

          flutter pub upgrade
          flutter pub get --no-example --verbose

          # Limpar credencial do git config global após uso
          git config --global --unset url."https://$(System.AccessToken)@dev.azure.com/${ORG_NAME}/".insteadOf || true

    - task: CocoaPods@0
      displayName: "Install CocoaPods dependencies"
      condition: eq(variables['PODS_CACHE_RESTORED'], 'false')
      inputs:
        workingDirectory: 'ios'
        forceRepoUpdate: true

    # Flutter Build 
    - task: FlutterBuild@0
      displayName: "Build application"
      inputs:
        target: 'ios'
        projectDirectory: '$(Build.SourcesDirectory)'
        buildName: '$(Build.BuildNumber)'
        buildNumber: '$(BUILD_NUMBER)'
        iosCodesign: false
        extraArgs: '$(EXTRA_ARGS_FLUTTER) -v'
      env:
        LICENSE_TOKEN: "$(ARXAN_LICENSE_TOKEN)"
        ANDROID_HOME: "$(ANDROID_HOME)"
        ANDROID_SDK_ROOT: "$(ANDROID_HOME)"
        # Variáveis de otimização Swift/Xcode
        SWIFT_COMPILATION_MODE: "$(SWIFT_COMPILATION_MODE)"
        SWIFT_OPTIMIZATION_LEVEL: "$(SWIFT_OPTIMIZATION_LEVEL)"
        DEBUG_INFORMATION_FORMAT: "$(DEBUG_INFORMATION_FORMAT)"
        DEAD_CODE_STRIPPING: "$(DEAD_CODE_STRIPPING)"
        STRIP_INSTALLED_PRODUCT: "$(STRIP_INSTALLED_PRODUCT)"

    # Run Flutter Diagnostics if build fails
    - task: FlutterCommand@0
      displayName: "Run Flutter diagnostics"
      condition: failed()
      inputs:
        projectDirectory: '.'
        arguments: 'doctor -v'

    # Manual signing usando Xcode@5
    - task: Xcode@5
      displayName: "Manual signing"
      inputs:
        actions: 'archive'
        xcWorkspacePath: 'ios/Runner.xcworkspace'
        signingOption: 'manual'
        signingIdentity: '$(APPLE_CERTIFICATE_SIGNING_IDENTITY)'
        provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
        sdk: 'iphoneos'
        configuration: Release
        scheme: 'Runner'
        packageApp: true
        exportPath: '$(Build.SourcesDirectory)/ios/deploy/Runner.ipa'
        args: >-
          -verbose
          -jobs $(PARALLEL_JOBS)
          -parallelizeTargets
          SWIFT_COMPILATION_MODE=$(SWIFT_COMPILATION_MODE)
          SWIFT_OPTIMIZATION_LEVEL=$(SWIFT_OPTIMIZATION_LEVEL)
          ENABLE_BITCODE=NO

      env:
        LICENSE_TOKEN: "$(ARXAN_LICENSE_TOKEN)"
        # Variáveis de otimização Swift/Xcode
        SWIFT_COMPILATION_MODE: "$(SWIFT_COMPILATION_MODE)"
        SWIFT_OPTIMIZATION_LEVEL: "$(SWIFT_OPTIMIZATION_LEVEL)"
        DEBUG_INFORMATION_FORMAT: "$(DEBUG_INFORMATION_FORMAT)"
        DEAD_CODE_STRIPPING: "$(DEAD_CODE_STRIPPING)"
        STRIP_INSTALLED_PRODUCT: "$(STRIP_INSTALLED_PRODUCT)"

    # Diagnóstico detalhado em caso de falha do Xcode (código 65)
    - task: Bash@3
      displayName: 'Xcode Build Failure Diagnostics'
      condition: failed()
      continueOnError: true
      inputs:
        targetType: 'inline'
        workingDirectory: 'ios'
        script: |
          echo "##[error]Xcode archive failed with code 65 - Running diagnostics..."
          
          echo "##[section]1. Verificando estrutura do projeto iOS"
          ls -la
          
          echo "##[section]2. Verificando arquivos .xcprivacy problemáticos"
          find . -name "*.xcprivacy" -type f | while read file; do
            echo "##[warning]Found: $file"
          done
          
          echo "##[section]3. Verificando configuração do Podfile"
          if [ -f "Podfile" ]; then
            echo "##[debug]Podfile content:"
            cat Podfile
          else
            echo "##[error]Podfile not found!"
          fi
          
          echo "##[section]4. Verificando targets do projeto Pods"
          if [ -d "Pods" ]; then
            echo "##[debug]Pods installed:"
            ls -la Pods/
            
            # Verificar build settings dos targets problemáticos
            if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
              echo "##[debug]Checking build settings for EXCLUDED_SOURCE_FILE_NAMES:"
              grep -A 2 "EXCLUDED_SOURCE_FILE_NAMES" Pods/Pods.xcodeproj/project.pbxproj || echo "Not found in Pods project"
            fi
          else
            echo "##[error]Pods directory not found!"
          fi
          
          echo "##[section]5. Verificando certificados e provisioning profiles"
          security find-identity -v -p codesigning || echo "##[error]Failed to list certificates"
          
          echo "##[section]6. Verificando DerivedData para logs detalhados"
          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"
          if [ -d "$DERIVED_DATA" ]; then
            echo "##[debug]Recent build logs:"
            find "$DERIVED_DATA" -name "*.xcactivitylog" -mtime -1 | head -5
          fi
          
          echo "##[section]Diagnostic complete. Check logs above for specific errors."


    - task: CopyFiles@2
      displayName: "Copy app to staging directory"
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: '/**/Runner.ipa/*.ipa'
        targetFolder: '$(Build.StagingDirectory)'
        CleanTargetFolder: true
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: "Publish IPA file"
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'ios_$(IOS_PACKAGE_NAME)'
        publishLocation: 'Container'  

    - task: Bash@3
      displayName: 'Agent Performance Metrics'
      condition: always()
      inputs:
        targetType: inline
        script: |
          echo "##[section]Agent Performance Report"
          
          # Métricas de cache
          echo "##[debug]Cache Effectiveness:"
          echo "##[debug]- Pub Cache Hit: $(PUB_CACHE_RESTORED)"
          echo "##[debug]- Pods Cache Hit: $(PODS_CACHE_RESTORED)"
          
          # Calcular eficiência
          CACHE_HITS=0
          [ "$(PUB_CACHE_RESTORED)" = "true" ] && CACHE_HITS=$((CACHE_HITS + 1))
          [ "$(PODS_CACHE_RESTORED)" = "true" ] && CACHE_HITS=$((CACHE_HITS + 1))
          
          CACHE_EFFICIENCY=$((CACHE_HITS * 50))
          echo "##[debug]Cache Efficiency: ${CACHE_EFFICIENCY}%"
          
          # Alertas de performance
          if [ $CACHE_EFFICIENCY -lt 50 ]; then
            echo "##vso[task.logissue type=warning;]Low cache efficiency: ${CACHE_EFFICIENCY}%"
          fi          
        
    - task: Bash@3
      displayName: 'Post-Build Cleanup & Metrics'
      condition: always()
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          echo "##[section]Starting Post-Build Agent Cleanup"          

          # Espaço em disco antes da limpeza

          # Métricas iniciais
          INITIAL_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          INITIAL_AVAILABLE=$(df -g / | tail -1 | awk '{print $4}')          
          echo "##[debug]Initial disk state:"
          echo "##[debug]- Usage: ${INITIAL_USAGE}%"
          echo "##[debug]- Available: ${INITIAL_AVAILABLE}GB" 

          # Limpeza do build atual
          echo "##[section]Cleaning Current Build Artifacts"
          rm -rf $(Build.SourcesDirectory)/build 2>/dev/null || true
          rm -rf $(Build.SourcesDirectory)/ios/build 2>/dev/null || true
          rm -rf $(Build.SourcesDirectory)/ios/deploy 2>/dev/null || true
          rm -rf /tmp/flutter_* /tmp/xcodebuild_* 2>/dev/null || true

          # ✅ Limpar keychain temporário (segurança)
          if [ -n "$(KEYCHAIN_PATH)" ]; then
            echo "##[debug]Cleaning temporary keychain..."
            security delete-keychain "$(KEYCHAIN_PATH)" 2>/dev/null || true
            echo "##[debug]Keychain removed"
          fi
          
          # ✅ Limpar provisioning profile temporário (segurança)
          if [ -n "$(PROFILE_PATH)" ]; then
            echo "##[debug]Cleaning temporary provisioning profile..."
            rm -f "$(PROFILE_PATH)" 2>/dev/null || true
            echo "##[debug]Provisioning profile removed"
          fi

          # ✅ Limpar DerivedData do Xcode deste build específico
          echo "##[debug]Cleaning Xcode DerivedData for this build..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/Runner-* 2>/dev/null || true
          
          # ✅ Gestão inteligente do Pub Cache
          PUB_CACHE_SIZE=$(du -sh $(Agent.ToolsDirectory)/.pub-cache 2>/dev/null | awk '{print $1}')
          echo "##[debug]Pub cache size: $PUB_CACHE_SIZE"
          
          # Se pub cache > 5GB, limpar versões antigas
          PUB_CACHE_SIZE_MB=$(du -sm $(Agent.ToolsDirectory)/.pub-cache 2>/dev/null | awk '{print $1}')
          if [ "$PUB_CACHE_SIZE_MB" -gt 5120 ]; then
            echo "##[warning]Pub cache exceeds 5GB, cleaning old versions..."
            find $(Agent.ToolsDirectory)/.pub-cache/hosted -type d -mtime +60 -exec rm -rf {} \; 2>/dev/null || true
          fi
          
          # Métricas finais
          FINAL_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          FINAL_AVAILABLE=$(df -g / | tail -1 | awk '{print $4}')
          
          echo "##[debug]Final disk state:"
          echo "##[debug]- Usage: ${FINAL_USAGE}%"
          echo "##[debug]- Available: ${FINAL_AVAILABLE}GB"
          echo "##[debug]- Pub Cache: $PUB_CACHE_SIZE"
          
          echo "##[section]Post-build cleanup completed"