stages:

- stage: publish
  dependsOn:
  - package
  displayName: "Publish Firebase"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:

  - job: "Publish"
    displayName: "Publish (Web)"
    condition: in(variables['Build.SourceBranch'], 'refs/heads/master')
    pool:
      vmImage: 'macOS-14'
    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Pipeline Artifact'
      inputs:
        buildType: current
        artifactName: 'web_package'
        targetPath: '$(System.ArtifactsDirectory)'
        itemPattern: '**'

    # Download Secure File
    # firebaseKey to connect to firebase
    - task: DownloadSecureFile@1
      name: firebaseKey
      displayName: 'Download Firebase Key'
      inputs:
        secureFile: $(FIREBASE_KEY_FILE_NAME)

    # Install Firebase CLI
    # Deploy to Firebase Hosting
    - task: Bash@3
      displayName: "Upload to firebase app distribution"
      inputs:
        targetType: "inline"
        script: |
          npm i -g firebase-tools  
          cd $(System.ArtifactsDirectory)
          firebase deploy --only hosting --project arquitetura-mobile          
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(firebaseKey.secureFilePath)

