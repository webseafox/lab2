# =============================================================================
# CD Template - CCDI ClickOnce (Conector WDE Custom)
# =============================================================================
# Deploy ClickOnce via SSH para servidor HTTP + validação da URL de publicação.
# Utilizado pelo pipeline pai: PIPES PAIS/CCDI/azure-pipelines.yml
# =============================================================================

stages:

# ---------------------------------------------------------------------------
# Stage: Deploy
# ---------------------------------------------------------------------------
- stage: Deploy
  displayName: '🚚 Deploy ClickOnce'
  dependsOn: Build
  condition: succeeded('Build')
  jobs:
  - job: Deploy
    displayName: '🚚 Deploy ClickOnce to HTTP server'
    pool: GeneralPurposeLinuxAgentsCD
    steps:

      - task: DownloadPipelineArtifact@2
        displayName: '⬇️ Download ClickOnce Artifact'
        inputs:
          buildType: 'current'
          artifact: '$(clickOnceArtifactName)'
          targetPath: '$(Pipeline.Workspace)/$(clickOnceArtifactName)'

      - task: CopyFilesOverSSH@0
        displayName: '📤 Deploy ClickOnce files via SSH'
        inputs:
          sshEndpoint: '$(sshEndpoint)'
          sourceFolder: '$(Pipeline.Workspace)/$(clickOnceArtifactName)'
          contents: '**'
          targetFolder: '$(webRootPath)/$(targetFolder)'
          cleanTargetFolder: true
          cleanHiddenFilesInTarget: true
          readyTimeout: '20000'

# ---------------------------------------------------------------------------
# Stage: Validate
# ---------------------------------------------------------------------------
- stage: Validate
  displayName: '✅ Validate ClickOnce'
  dependsOn: Deploy
  condition: succeeded('Deploy')
  jobs:
  - job: Validate
    displayName: '✅ Validate ClickOnce URL'
    pool: GeneralPurposeLinuxAgentsCD
    steps:

      - checkout: self
        displayName: '🔄 Checkout code'

      - task: PowerShell@2
        displayName: '✅ Validate ClickOnce URL (HTTP)'
        inputs:
          filePath: 'CCDI/validate-clickonce-url.ps1'
          arguments: '-ProjectRoot "$(Build.SourcesDirectory)" -ServerUrl "$(validationUrl)/$(targetFolder)"'
          pwsh: true
