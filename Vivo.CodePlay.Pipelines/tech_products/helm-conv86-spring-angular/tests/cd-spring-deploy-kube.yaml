

trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - '*'
    exclude:
      - docs/*

parameters:
- name: environment
  displayName: Escolha o ambiente para publicar
  type: string
  default: dev
  values:
  - dev
  - test
  - prod

resources:
  repositories:
  - repository: Deploy
    name: MIGR-Conv86/deploy.deploy-micro-service-conv86-spring-boot
    type: git
    # ref: refs/tags/latest
    ref: refs/heads/master

#Incluir Variaveis da Library
variables:
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: System.debug
  value: "true"

