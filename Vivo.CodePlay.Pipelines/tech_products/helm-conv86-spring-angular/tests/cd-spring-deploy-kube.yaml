stages:
- stage: deploy_kube
  displayName: Deploy Kubernetes
  jobs:
  - job: deploy_on_kube
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Kubernetes
    pool: GeneralPurposeLinuxAgentsCD
    steps:
    # - task: DownloadBuildArtifacts@1
    #   displayName: Get new pom.xml
    #   inputs:
    #     buildType: 'current'
    #     downloadPath: '$(System.ArtifactsDirectory)'

    - task: DownloadBuildArtifacts@1
      inputs:
        project: '1f3d25d3-7351-492f-b8e7-6254027b96c8'
        pipeline: '18853'
        buildVersionToDownload: 'specific'
        buildId: '247700'
        buildType: 'specific'
        itemPattern: |
          bin/**/*.war
          bin/**/pom.xml
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - checkout: Deploy
      fetchDepth: 1

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >- 
          DOCKER-REGISTRY-USERNAME, DOCKER-REGISTRY-PASSWORD,
          HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
          HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW

    - task: DownloadSecureFile@1
      name: kubeconfig
      displayName: 'Download kube-${{parameters.environment}}'
      inputs:
        secureFile: 'kube-${{parameters.environment}}'

    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text
    
    - task: YamlParseFromVivo@4
      displayName: Get Helm/Kube Info
      name: deploy_helm_kube_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pipeline/properties.yaml
        jpaths: |
          # default
          var KUBE_NAMESPACE = .kubernetes.namespace.${{parameters.environment}}
                        
          # "3.5.3"
          var HELM_VERSION = helm.VERSION
          # "conv86-helm"
          var HELM_CHART_REPOSITORY = helm.CHART_REPOSITORY
          # "helm-conv86"
          var HELM_CHART_NAME = helm.CHART_NAME
          # "1.0.79"
          var HELM_CHART_VERSION = helm.CHART_VERSION
          # "micro-service-conv86-spring-boot"
          var HELM_APPLICATION_NAME = helm.APPLICATION_NAME
          # "30s"
          var HELM_WAIT_TIMEOUT = helm.WAIT_TIMEOUT

    - task: YamlParseFromVivo@4
      displayName: Get Env Info
      name: deploy_env_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/env/${{parameters.environment}}.yaml
        jpaths: |          
          var DOCKER_REGISTRY = .global.imageRegistry
          var DOCKER_REPOSITORY = .image.repository

    # - bash: |
