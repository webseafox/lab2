    ## -> Copy files for staging area
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Staging Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: |
          **/target/*.*ar
          **/target/*.ejb
          **/pom.xml
          **/surefire-reports/TEST-*.xml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: Bash@3
      displayName: Download Charts
      continueOnError: False
      inputs:
          targetType: inline
          script: |
            curl --user $(NEXUS-DEPS-USR):$(NEXUS-DEPS-PSW) https://nexus.telefonica.com.br/repository/conv86-helm/helm-conv86-1.0.79.tgz -O
            tar -zxvf helm-conv86-1.0.79.tgz
            rm helm-conv86-1.0.79.tgz

    - task: Bash@3
      displayName: 'Create helm chart status '
      condition: succeeded()
      inputs:
        targetType: inline
        script: |              
          helm --kubeconfig $(kubeconfig.secureFilePath) status micro-service-conv86-spring-boot --namespace default

    - task: Bash@3
      displayName: 'Create helm chart upgrade '
      condition: succeeded()
      inputs:
        targetType: inline
        script: |        
          helm repo add --force-update conv86-helm https://nexus.telefonica.com.br/repository/conv86-helm/ \
          --insecure-skip-tls-verify \
          --username $(NEXUS-DEPS-USR) \
          --password $(NEXUS-DEPS-PSW) \
          --kubeconfig $(kubeconfig.secureFilePath)

          helm repo update --kubeconfig $(kubeconfig.secureFilePath)      
          helm --kubeconfig $(kubeconfig.secureFilePath) upgrade micro-service-conv86-spring-boot --install helm-conv86 -f $(Build.SourcesDirectory)/env/preprod.yaml --namespace default --wait --timeout 30s --set image.tag=$(POM_XML_VERSION)