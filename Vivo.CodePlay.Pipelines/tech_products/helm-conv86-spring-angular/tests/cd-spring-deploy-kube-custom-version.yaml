

trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - '*'
    exclude:
      - docs/*

parameters:
- name: environment
  displayName: Escolha o ambiente para publicar
  type: string
  default: dev
  values:
  - dev
  - preprod
  - prod

- name: version
  displayName: Escolha uma versao para publicar
  type: string
  default: 1.0.97

resources:
  repositories:
  - repository: Deploy
    name: MIGR-Conv86/deploy.deploy-micro-service-conv86-spring-boot
    type: git
    # ref: refs/tags/latest
    ref: refs/heads/master

#Incluir Variaveis da Library
variables:
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: System.debug
  value: "true"

stages:
- stage: deploy_kube
  displayName: Deploy Kubernetes
  jobs:
  - job: deploy_on_kube
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Kubernetes
    pool: GeneralPurposeLinuxAgentsCD
    steps:

    - checkout: Deploy
      fetchDepth: 1

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >- 
          DOCKER-REGISTRY-USERNAME, DOCKER-REGISTRY-PASSWORD,
          HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
          HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW

    - task: DownloadSecureFile@1
      name: kubeconfig
      displayName: 'Download kube-${{parameters.environment}}'
      inputs:
        secureFile: 'kube-${{parameters.environment}}'
    
    - task: YamlParseFromVivo@4
      displayName: Get Helm/Kube Info
      name: deploy_helm_kube_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pipeline/properties.yaml
        jpaths: |
          # default
          var KUBE_NAMESPACE = .kubernetes.namespace.${{parameters.environment}}
                        
          # "3.5.3"
          var HELM_VERSION = helm.VERSION
          # "conv86-helm"
          var HELM_CHART_REPOSITORY = helm.CHART_REPOSITORY
          # "helm-conv86"
          var HELM_CHART_NAME = helm.CHART_NAME
          # "1.0.79"
          var HELM_CHART_VERSION = helm.CHART_VERSION
          # "micro-service-conv86-spring-boot"
          var HELM_APPLICATION_NAME = helm.APPLICATION_NAME
          # "30s"
          var HELM_WAIT_TIMEOUT = helm.WAIT_TIMEOUT

    - task: YamlParseFromVivo@4
      displayName: Get Env Info
      name: deploy_env_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/env/${{parameters.environment}}.yaml
        jpaths: |          
          var DOCKER_REGISTRY = .global.imageRegistry
          var DOCKER_REPOSITORY = .image.repository
          
    - task: Bash@3
      displayName: Download Charts
      continueOnError: False
      inputs:
          targetType: inline
          script: |
            curl --user $(NEXUS-DEPS-USR):$(NEXUS-DEPS-PSW) https://nexus.telefonica.com.br/repository/conv86-helm/helm-conv86-1.0.79.tgz -O
            tar -zxvf helm-conv86-1.0.79.tgz
            rm helm-conv86-1.0.79.tgz

    - task: Bash@3
      displayName: 'Create helm chart status '
      condition: succeeded()
      inputs:
        targetType: inline
        script: |              
          helm --kubeconfig $(kubeconfig.secureFilePath) status micro-service-conv86-spring-boot --namespace default

    - task: Bash@3
      displayName: 'Create helm chart upgrade '
      condition: succeeded()
      inputs:
        targetType: inline
        script: |        
          helm repo add --force-update conv86-helm https://nexus.telefonica.com.br/repository/conv86-helm/ \
          --insecure-skip-tls-verify \
          --username $(NEXUS-DEPS-USR) \
          --password $(NEXUS-DEPS-PSW) \
          --kubeconfig $(kubeconfig.secureFilePath)

          helm repo update --kubeconfig $(kubeconfig.secureFilePath)      
          helm \
          --kubeconfig $(kubeconfig.secureFilePath) upgrade micro-service-conv86-spring-boot \
          --install helm-conv86 -f $(Build.SourcesDirectory)/env/${{ parameters.environment }}.yaml \
          --namespace default \
          --wait \
          --timeout 30s \
          --set image.tag=${{ parameters.version }}