# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- master
variables:
- name: System.debug
  value: "true"

stages:
- stage: build
  displayName: Build
  jobs:
  - job: package
    displayName: Build, Test and Pack
    pool: GeneralPurposeLinuxAgentsCI

    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: NodeTool@0
      inputs:
        versionSource: 'spec'
        versionSpec: '14.x'

    - task: AzureKeyVault@2
      displayName: 'Getting AKV Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    - script: echo "##vso[task.setvariable variable=NEXUS_USR]$(NEXUS-DEFAULT-USR)"
      displayName: Set NEXUS_USR Var
    
    - script: npm version patch --no-git-tag-version
      displayName: Bump version

    - script: npm i -ddd
      displayName: Install dependencies
    
    - script: npm run build-ci
      displayName: Build CI

    - script: npm pack
      displayName: Pack

    - task: JsonParseFromVivo@4
      displayName: Get package.json info
      name: package_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION =  .version

    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Staging Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: |
          *.tgz
          package.json
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: bin


    - task: Bash@3
      displayName: Commit new version
      name: commit_new_version
      continueOnError: false
      inputs:
        targetType: inline
        script: |-
          
          git stash save package.json
          git clean -fdX
          
          export TAG="${PACKAGE_JSON_VERSION:4}+$(date -u +"%Y%m%d%H%M")-${BUILD_SOURCEBRANCHNAME}-${BUILD_BUILDID}"

          echo "##[command] git checkout ${BUILD_SOURCEBRANCHNAME} --"
          git fetch
          git checkout ${BUILD_SOURCEBRANCHNAME} --
          git pull --rebase origin ${BUILD_SOURCEBRANCHNAME}
          git stash pop

          echo "##[command] git commit"
          git add package.json
          git commit -m "[skip ci] CodePlay bump version ${TAG}"

          echo "##[command]git tag ${TAG}"
          git tag ${TAG} -m "Version has been updated to ${TAG}"

          echo "##[command] git push origin ${BUILD_SOURCEBRANCHNAME}"
          git push origin --tags ${BUILD_SOURCEBRANCHNAME}

- stage: deploy
  displayName: Deploy
  jobs:
  - job: deploy_nexus
    displayName: Deploy on Nexus
    pool: GeneralPurposeLinuxAgentsCI
    steps:
    - checkout: none

    - task: DownloadBuildArtifacts@1
      displayName: Download artifacts
      inputs:
        buildType: 'current'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: NodeTool@0
      inputs:
        versionSource: 'spec'
        versionSpec: '14.x'

    - task: AzureKeyVault@2
      displayName: 'Getting AKV Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    - script: echo "##vso[task.setvariable variable=NEXUS_USR]$(NEXUS-DEFAULT-USR)"
      displayName: Set NEXUS_USR Var
    
    - script: |
        cat > $(System.ArtifactsDirectory)/bin/.npmrc <<EOF
        registry=https://nexus.telefonica.com.br/repository/conv86-npm/
        @conv86:registry=https://nexus.telefonica.com.br/repository/conv86-npm/
        _auth=$(echo -n $(NEXUS-DEFAULT-USR):$(NEXUS-DEFAULT-PSW) | base64)
        legacy-peer-deps=true
        EOF
      displayName: Write .npmrc

    - script: npm publish --access=restricted --registry https://nexus.telefonica.com.br/repository/conv86-npm/
      workingDirectory: $(System.ArtifactsDirectory)/bin
      displayName: Publish
