

trigger:
  branches:
    include:
      - 'master'
  paths:
    exclude:
      - .azuredevops/azure-pipeline-cd.yml
 
  
parameters:
- name: useMavenCache
  displayName: Usar cache do maven
  type: boolean
  default: True

#Incluir Variaveis da Library
variables:
  - name: ASDF_JDK_11
    value: "openjdk-11.0.2"
  - name: System.debug
    value: "true"
  - name: USE_MAVEN_CACHE
    ${{ if not(not(parameters.useMavenCache)) }}:
      value: ''
    ${{ if not(parameters.useMavenCache) }}:
      value: '-U'  

  - name: SONARQUBE_CONNECTION_NAME
    value: VIVO_SONARQUBE
  - name: SONARQUBE_PROJECTKEY
    value: br.com.vivo.gps4:app-gps-convergente
  - name: SONARQUBE_URL
    value: http://sonar.devops.redecorp.br
  - name: SONARQUBE_PROJECT_NAME
    value: $(System.TeamProject)-$(Build.Repository.Name)

stages:
- stage: build
  displayName: Build
  jobs:
  - job: package
    displayName: Build, Test and Pack
    pool: GeneralPurposeLinuxAgentsCI
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - script: asdf shim-versions java

    - task: XmlParseFromVivo@4
      displayName: Get pom.xml info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var FRONTEND_NAME = .project.properties['frontend-name']._text
          var FRONTEND_VERSION = .project.properties['frontend-version']._text

    - task: SemverIncrementCustomFromVivo@5
      displayName: Semver Increment 'patch'
      name: new_version
      continueOnError: false
      inputs:
        currentversion: $(POM_XML_VERSION)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"
    
    - task: Maven@3
      displayName: "Maven versions:set"
      env:
        ASDF_JAVA_VERSION: $(ASDF_JDK_11)
      inputs:
          options: >
            -Dmaven.test.skip=true 
            -DnewVersion=$(new_version.NEW_VERSION)
          mavenPomFile: $(Build.SourcesDirectory)/pom.xml
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          goals: 'versions:set'

    - task: XmlParseFromVivo@4
      displayName: Get New pom.xml info
      name: pom_info_new
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION      =  .project.version._text

    # # https://dev.azure.com/telefonica-vivo-brasil/MIGR-Gps2/_library?itemType=SecureFiles
    # - task: DownloadSecureFile@1      
    #   displayName: 'Get settings-gps2.xml'
    #   name: GPS2_NEXUS_SETTINGS
    #   continueOnError: false
    #   inputs:
    #     actionOnNoFiles: 'error'
    #     secureFile: settings-gps2.xml


    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, SONARQUBE-TOKEN'
        RunAsPreJob: true

    - task: Bash@3
      displayName: Copy Angular package to Spring
      continueOnError: false
      inputs:
        targetType: inline
        script: |-
            curl --user $(NEXUS-DEPS-USR):$(NEXUS-DEPS-PSW) https://nexus.telefonica.com.br/repository/conv86-npm/@conv86/$(FRONTEND_NAME)/-/$(FRONTEND_NAME)-$(FRONTEND_VERSION).tgz -O
            tar -zxvf $(FRONTEND_NAME)-$(FRONTEND_VERSION).tgz
            rm $(FRONTEND_NAME)-$(FRONTEND_VERSION).tgz
            tar -xf package/conv86-$(FRONTEND_NAME)-$(FRONTEND_VERSION).tgz
            mkdir -p src/main/webapp
            cp -r package/dist/ressarcimento/* src/main/webapp/
            cp -r package/dist/ressarcimento src/main/webapp/
            rm -rf package

    - task: Maven@3
      displayName: Maven Test and Pack
      continueOnError: False
      env:
        ASDF_JAVA_VERSION: $(ASDF_JDK_11)
      inputs:
          options: >-
            -Dmaven.test.skip=false
            $(USE_MAVEN_CACHE)
            -Dnpm.repositoryUrl="https://nexus.telefonica.com.br/repository/conv86-npm"
            -Dnpm.username="$(NEXUS-DEPS-USR)"
            -Dnpm.password="$(NEXUS-DEPS-PSW)"

          mavenPomFile: $(Build.SourcesDirectory)/pom.xml
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          publishJUnitResults: false
          testResultsFiles: $(Build.SourcesDirectory)/**/surefire-reports/TEST-*.xml
          goals: 'package'


    # - task: PublishTestResults@2
    #   inputs:
    #     testResultsFormat: 'JUnit'
    #     testResultsFiles: '**/surefire-reports/TEST-*.xml'
    #     mergeTestResults: true

    ## -> Copy files for staging area
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Staging Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: |
          **/target/*.*ar
          **/target/*.ejb
          **/pom.xml
          **/surefire-reports/TEST-*.xml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - script: |
        cd $(Build.ArtifactStagingDirectory)
        pwd
        ls

    - script: |
        cd $(build.sourcesdirectory)
        pwd
        ls

    ## -> Compress artifacts into tar. This allows to use less space and to be used in other stages, jobs or tasks.           
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: bin
    
    - task: SonarQubePrepare@5
      displayName: Overwrite Sonar Props
      inputs:
        SonarQube: $(SONARQUBE_CONNECTION_NAME)
        scannerMode: 'CLI'
        # configFile Não funciona no scannerMode Other, apenas CLI (https://learn.microsoft.com/pt-br/azure/devops/pipelines/tasks/reference/sonar-qube-prepare-v5?view=azure-pipelines)
        configFile: $(Build.SourcesDirectory)/sonar-project.properties
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(Build.SourcesDirectory)
          sonar.projectKey=$(SONARQUBE_PROJECTKEY)
          sonar.projectName=$(SONARQUBE_PROJECT_NAME)
          sonar.projectVersion=$(build.new_version.NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300

    - task: SonarQubeAnalyze@5
      displayName: 'Sonar Scan'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: $(ASDF_JDK_11)


    - task: Bash@3
      displayName: Commit new version
      name: commit_new_version
      continueOnError: false
      inputs:
        targetType: inline
        script: |-
          git stash save pom.xml
          git clean -fdX
          
          export TAG="${POM_XML_VERSION:4}+$(date -u +"%Y%m%d%H%M")-${BUILD_SOURCEBRANCHNAME}-${BUILD_BUILDID}"

          echo "##[command] git checkout ${BUILD_SOURCEBRANCHNAME} --"
          git fetch
          git checkout ${BUILD_SOURCEBRANCHNAME} --
          git pull --rebase origin ${BUILD_SOURCEBRANCHNAME}
          git stash pop

          echo "##[command] git commit"
          git add pom.xml
          git commit -m "[skip ci] CodePlay bump version ${TAG}"

          echo "##[command]git tag ${TAG}"
          git tag ${TAG} -m "Version has been updated to ${TAG}"

          echo "##[command] git push origin ${BUILD_SOURCEBRANCHNAME}"
          git push origin --tags ${BUILD_SOURCEBRANCHNAME}

