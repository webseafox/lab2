- stage: deploy
  displayName: Deploy
  condition: succeeded()
  dependsOn:
    - build
    # - gates
  jobs:
  - job: deploy_on_nexus
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Nexus
    pool: GeneralPurposeLinuxAgentsCI
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: Get new pom.xml
      inputs:
        buildType: 'current'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |     
          cd $(Build.ArtifactStagingDirectory)
          pwd
          ls

    - task: NexusUploadMvnFromVivo@5
      continueOnError: true
      displayName: Upload ressarcimento
      inputs:
        nexusEndpoint: "Nexus Asis"
        nexusRepoMaven: "conv86-mvn"
        groupId: $(POM_XML_GROUP_ID) # br.com.kyros
        generatePom: false
        artifactId: $(POM_XML_ARTIFACT_ID)
        artifactVersion: $(POM_XML_VERSION)
        artifactFile1: $(System.ArtifactsDirectory)/bin/target/ressarcimento.war
        artifactExtension1: war
        artifactFile2: $(System.ArtifactsDirectory)/bin/pom.xml
        artifactExtension2: pom
      

- stage: deploy_docker
  displayName: Deploy Docker
  jobs:
  - job: deploy_on_docker
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Docker
    pool: GeneralPurposeLinuxAgentsCI
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: Get new pom.xml
      inputs:
        buildType: 'current'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(System.ArtifactsDirectory)/bin
        policySets: |
          image-definition-files

    - task: Docker@2
      displayName: Docker Build
      condition: succeeded()
      inputs:
        containerRegistry: conv86-docker
        command: build
        repository: conv86/micro-service-conv86-spring-boot
        Dockerfile: ./Dockerfile
        buildContext: $(System.ArtifactsDirectory)/bin
        arguments: --no-cache
        tags: >
          $(POM_XML_VERSION)
          
    - task: Docker@2
      displayName: Docker Push
      name: dockerPushImage
      condition: succeeded()
      inputs:
        containerRegistry: conv86-docker
        command: push
        repository: conv86/micro-service-conv86-spring-boot
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(POM_XML_VERSION)
