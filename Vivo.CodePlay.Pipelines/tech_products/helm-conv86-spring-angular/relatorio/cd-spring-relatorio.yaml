

trigger: none

parameters:
- name: environment
  displayName: Escolha o ambiente para publicar
  type: string
  default: dev
  values:
  - dev
  - preprod
  - prod

resources:
  repositories:
  - repository: Deploy
    name: MIGR-Conv86/deploy.deploy-relatorio-spring-batch
    type: git
    ref: refs/heads/master

  - repository: Helm
    name: MIGR-Conv86/package.package-helm-relatorio
    type: git
    # ref: refs/tags/latest
    ref: refs/heads/codeplay

#Incluir Variaveis da Library
variables:
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: System.debug
  value: "true"

stages:
- stage: deploy_kube
  displayName: Deploy Kubernetes
  jobs:
  - job: deploy_on_kube
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Kubernetes
    pool: GeneralPurposeLinuxAgentsCD
    steps:
    - checkout: self
      fetchDepth: 1

    - checkout: Deploy
      fetchDepth: 1
    
    - checkout: Helm
      fetchDepth: 1

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >- 
          DOCKER-REGISTRY-USERNAME, DOCKER-REGISTRY-PASSWORD,
          HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
          HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW

    - task: DownloadSecureFile@1
      name: kubeconfig
      displayName: 'Download kube-${{parameters.environment}}'
      inputs:
        secureFile: 'kube-${{parameters.environment}}'

    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/src.src-relatorio-spring-batch/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text
    
    - task: YamlParseFromVivo@4
      displayName: Get Helm/Kube Info
      name: deploy_helm_kube_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/deploy.deploy-relatorio-spring-batch/pipeline/properties.yaml
        jpaths: |
          # default
          var KUBE_NAMESPACE = .kubernetes.namespace.${{parameters.environment}}
                        
          # "3.5.3"
          var HELM_VERSION = helm.VERSION
          # "conv86-helm"
          var HELM_CHART_REPOSITORY = helm.CHART_REPOSITORY
          # "helm-conv86"
          var HELM_CHART_NAME = helm.CHART_NAME
          # "1.0.79"
          var HELM_CHART_VERSION = helm.CHART_VERSION
          # "micro-service-conv86-spring-boot"
          var HELM_APPLICATION_NAME = helm.APPLICATION_NAME
          # "30s"
          var HELM_WAIT_TIMEOUT = helm.WAIT_TIMEOUT

    - task: YamlParseFromVivo@4
      displayName: Get Env Info
      name: deploy_env_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/deploy.deploy-relatorio-spring-batch/env/${{parameters.environment}}.yaml
        jpaths: |          
          var DOCKER_REGISTRY = .global.imageRegistry
          var DOCKER_REPOSITORY = .image.repository
    
    - task: YamlParseFromVivo@4
      displayName: Get Helm Chart Info
      name: deploy_helm_chart_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.package-helm-relatorio/Chart.yaml
        jpaths: |
          var CHART_VERSION = .version
          var CHART_NAME = .name

    
    - task: Bash@3
      displayName: Download Charts
      continueOnError: False
      inputs:
        targetType: inline
        script: |
          curl --user $(NEXUS-DEPS-USR):$(NEXUS-DEPS-PSW) https://nexus.telefonica.com.br/repository/conv86-helm/$(CHART_NAME)-$(CHART_VERSION).tgz -O
          tar -zxvf $(CHART_NAME)-$(CHART_VERSION).tgz
          rm $(CHART_NAME)-$(CHART_VERSION).tgz

    - task: Bash@3
      displayName: 'Helm status'
      condition: succeeded()
      inputs:
        targetType: inline
        script: |              
          helm --kubeconfig $(kubeconfig.secureFilePath) status relatorio-spring-batch --namespace default

    - script: |-
        kubectl get secrets conv86-docker \
        --namespace default \
        --kubeconfig="$(kubeconfig.secureFilePath)" \
        --insecure-skip-tls-verify

        echo "##vso[task.setvariable variable=EXISTING_SECRETS]$?"
      displayName: Fetch Docker Secret

    - script: >-
        kubectl create secret docker-registry conv86-docker
        --docker-server="conv86-docker.nexus.telefonica.com.br" 
        --docker-username="$(DOCKER-REGISTRY-USERNAME)" 
        --docker-password="$(DOCKER-REGISTRY-PASSWORD)" 
        --docker-email='arquiteturati@telefonica.com.br'
        --namespace default
        --kubeconfig="$(kubeconfig.secureFilePath)"
        --insecure-skip-tls-verify
      condition: eq(variables['EXISTING_SECRETS'], '1')
      displayName: Create Docker Secret

    - task: Bash@3
      displayName: 'Helm upgrade'
      condition: succeeded()
      inputs:
        targetType: inline
        script: |        
          helm repo add --force-update conv86-helm https://nexus.telefonica.com.br/repository/conv86-helm/ \
          --insecure-skip-tls-verify \
          --username $(NEXUS-DEPS-USR) \
          --password $(NEXUS-DEPS-PSW) \
          --kubeconfig $(kubeconfig.secureFilePath)

          helm repo update --kubeconfig $(kubeconfig.secureFilePath)      
          
          helm \
          --kubeconfig $(kubeconfig.secureFilePath) upgrade relatorio-spring-batch \
          --install helm-relatorio -f $(Build.SourcesDirectory)/deploy.deploy-relatorio-spring-batch/env/${{ parameters.environment }}.yaml \
          --namespace default \
          --timeout 90s \
          --set image.tag=$(POM_XML_VERSION) \
          --set "imagePullSecrets[0].name=conv86-docker" \
          --set "env.SPRING_PROFILES_ACTIVE=${{parameters.environment}}"

        # helm upgrade $(CATALOG_YAML_NAME) $(Pipeline.Workspace)/self-files/${{ parameters.helm_chart_name }}
        # --set "nameOverride=$(CATALOG_YAML_NAME)"
        # --set "fullnameOverride=$(CATALOG_YAML_NAME)"
        # --set "containerName=$(CATALOG_YAML_NAME)"
        # --set "image.repository=vcr-docker.nexus.telefonica.com.br/$(CATALOG_YAML_ACRONYM)/$(CATALOG_YAML_NAME)"
        # --set "image.tag=$(POM_XML_VERSION)-$(DOCKER_TAG_SUFIX)"
        # --set "imagePullSecrets[0].name=vcr-devops"
        # -f "$(Pipeline.Workspace)/kube-files/.azuredevops/config/${{ parameters.environment }}/values.yml"
        # -f "$(Pipeline.Workspace)/kube-files/.azuredevops/config/${{ parameters.environment }}/environments_variables.yml"
        # -f "$(Pipeline.Workspace)/kube-files/.azuredevops/config/${{ parameters.environment }}/secrets.yaml"
        # --kubeconfig $(kubeconfig.secureFilePath)
        # --namespace "$(CATALOG_YAML_K8S_NS)"
        # --install
        # --insecure-skip-tls-verify
        # --output table
        # --history-max 5
        # --debug
        # --atomic
        # --wait
        # --timeout 300s

    - task: CLIPolling@4
      inputs:
        script: >-
          kubectl get pods
          --no-headers -o custom-columns=":metadata.name"
          --kubeconfig="$(kubeconfig.secureFilePath)" 
          --insecure-skip-tls-verify | grep relatorio
          | 
          xargs -I {} 
          kubectl logs -f {} 
          --kubeconfig="$(kubeconfig.secureFilePath)" 
          --insecure-skip-tls-verify 
          -p
        displayName: 'Fetch logs'
        interpreter: bash
        startDelay: 1s # parse-duration format
        pollingInterval: 100ms # parse-duration format
        timeout: 30s # parse-duration format
        stopScript: |-
          text://stdout = teste
