    name: GeneralPurposeLinuxAgentsCD
  displayName: DESTROY ${{ parameters.componentName }} -> ${{ parameters.environment }}
  ${{ if eq(parameters.nextWorkDir, '') }}:
    dependsOn:
    - stage_${{ parameters.workDir }}_plan_destroy
  ${{ else }}:
    dependsOn:
    - stage_${{ parameters.workDir }}_plan_destroy
    - stage_${{ parameters.nextWorkDir }}_destroy
  condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
  variables:
  - name: tfvarsLocation
    value: environments/${{ parameters.environmentType }}/${{ parameters.workDir }}.tfvars.json
  - name: conditionalVar
