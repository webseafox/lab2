

trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - '*'
    exclude:
      - docs/*
 

#Incluir Variaveis da Library
variables:
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: System.debug
  value: "true"

# - name: DOCKER_REGISTRY
#   value: vcr-docker.nexus.telefonica.com.br
#   # value: conv86-docker.nexus.telefonica.com.br # come from https://dev.azure.com/telefonica-vivo-brasil/MIGR-Conv86/_git/package.package-micro-service-conv86-spring-boot?path=/pipeline/properties.yaml&version=GBmaster&line=15&lineEnd=16&lineStartColumn=1&lineEndColumn=1&lineStyle=plain&_a=contents

# - name: DOCKER_SERVICE_CONNECTION
#   value: "ACR-DEVOPS"
# - name: DOCKER_REGISTRY_EMAIL
#   value: "arquiteturati@telefonica.com.br"
# - name: DOCKER_CMD_USERNAME
#   value: $(id -u)
# - name: DOCKER_CMD_GROUP
#   value: $(id -g)
# - name: DOCKER_IMAGE_NAME
#   value: conv86/micro-service-conv86-spring-boot

  # IMAGE_REGISTRY: "conv86-docker.nexus.telefonica.com.br" #"10.129.178.173:5017"
  # IMAGE_NAME: "conv86/micro-service-conv86-spring-boot"

stages:
- stage: deploy_docker
  displayName: Deploy Docker
  jobs:
  - job: deploy_on_docker
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Docker
    pool: GeneralPurposeLinuxAgentsCI
    steps:
    # - task: DownloadBuildArtifacts@1
    #   displayName: Get new pom.xml
    #   inputs:
    #     buildType: 'current'
    #     downloadPath: '$(System.ArtifactsDirectory)'

    - task: DownloadBuildArtifacts@1
      inputs:
        project: '1f3d25d3-7351-492f-b8e7-6254027b96c8'
        pipeline: '18853'
        buildVersionToDownload: 'specific'
        buildId: '210933'
        buildType: 'specific'
        itemPattern: |
          bin/**/*.war
          bin/**/pom.xml
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true


    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(System.ArtifactsDirectory)/bin
        policySets: |
          image-definition-files

    - task: Docker@2
      displayName: Docker Build
      condition: succeeded()
      inputs:
        containerRegistry: conv86-docker
        command: build
        repository: conv86/micro-service-conv86-spring-boot
        Dockerfile: ./Dockerfile
        buildContext: $(System.ArtifactsDirectory)/bin
        arguments: --no-cache
        tags: >
          $(POM_XML_VERSION)
          
    - task: Docker@2
      displayName: Docker Push
      name: dockerPushImage
      condition: succeeded()
      inputs:
        containerRegistry: conv86-docker
        command: push
        repository: conv86/micro-service-conv86-spring-boot
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(POM_XML_VERSION)
