## -> Parameters:
parameters:
  - name: environment
  - name: infrastructureType
  - name: packageName
  - name: packageVersion

stages:
  ## -> CI
  ## -> Initialize enviroment
  - template: /tech_products/vv30/externals-packages/initializers/default_initializer.yml

  ## -> Rename Package
  - template: /tech_products/vv30/externals-packages/templates/ci/ci_rename_package.yml
    parameters:
      packageName: "${{ parameters.packageName }}"
      packageVersion: "${{ parameters.packageVersion }}"

  ## -> Ask for Package to be uploaded
  - template: /tech_products/vv30/externals-packages/templates/ci/ci_upload_external_package.yml
    parameters:
      packageName: "${{ parameters.packageName }}"

  ## -> Initialize Gates enviroment
  - template: /tech_products/vv30/externals-packages/initializers/gates_initializer.yml

  ## -> Security Gates
  - template: /tech_products/vv30/externals-packages/templates/ci/ci_security.yml
    parameters:
      packageName: "${{ parameters.packageName }}"

  ## -> Publish Build for CI
  - template: /tech_products/vv30/externals-packages/templates/ci/ci_publish_package.yml
    parameters:
      infrastructureType: "${{ parameters.infrastructureType }}"
      packageName: "${{ parameters.packageName }}"
      packageVersion: "${{ parameters.packageVersion }}"
