## -> Parameters:
parameters:
  - name: environment
    displayName: "Escolha o ambiente para publicar"
    type: string
    default: dev
    values:
      - dev
      - esteira1
      - esteira2
      - preprod
      - prodlike
      - producao
  - name: packageName
  - name: packageVersion
  - name: infrastructureType
    type: string
    default: "weblogic"
    values:
      - weblogic

stages:
  ## -> Entrypoint
  ## -> Use CI-CD pipeline if no package version has been provided
  ## -> Use CD only pipeline if package version has been provided

  ## -> CD
  ## -> Initialize enviroment
  - template: /tech_products/vv30/externals-packages/initializers/cd_initializer.yml

  - ${{ if and(eq(parameters.infrastructureType, 'weblogic'), not(eq(variables['Build.Repository.Name'], 'pipeline-vivo360-catalogo'))) }}:
      - template: /tech_products/vv30/externals-packages/templates/cd/cd_deploy_weblogic.yml
        parameters:
          environment: "${{ parameters.environment }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          packageVersion: "${{ parameters.packageVersion }}"
          packageName: "${{ parameters.packageName }}"
  - ${{ elseif and(eq(parameters.infrastructureType, 'weblogic'), eq(variables['Build.Repository.Name'], 'pipeline-vivo360-catalogo')) }}:
      - template: /tech_products/vv30/externals-packages/templates/cd/catalogo/cd_deploy_weblogic_catalogo.yml
        parameters:
          environment: "${{ parameters.environment }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          packageVersion: "${{ parameters.packageVersion }}"
          packageName: "${{ parameters.packageName }}"