## -> Parameters:
parameters:
  - name: packageName

stages:
  - stage: ci_upload_async
    displayName: "CI - Upload External Package"
    dependsOn:
      - ci_rename_package
    condition: succeeded()

    # -> Loads variables from other stages.
    variables:
    - name: KEBAB_CASE_PACKAGE_NAME
      value: $[ stageDependencies.ci_rename_package.rename_package.outputs['packages.KEBAB_CASE_PACKAGE_NAME'] ]

    jobs:
      - job: upload_files
        displayName: "Files Upload"
        pool: Server
        condition: succeeded()
        steps:
          - task: ManualValidation@0
            displayName: "Waiting Upload and Approval"
            inputs:
              notifyUsers: "" # string. Required. Notify users.
              instructions: |
                1) Instale o azure cli (https://learn.microsoft.com/en-us/azure/devops/cli/?view=azure-devops)
                2) Faça login:
                  az login
                3) Faça upload do artefato:
                  az pipelines runs artifact upload --artifact-name $(KEBAB_CASE_PACKAGE_NAME) --path CAMINHO_ABSOLUTO_DO_ARTEFATO_LOCAL --run-id $(Build.BuildId) --organization $(System.CollectionUri) --project "$(System.TeamProject)"
                4) Após o upload, clique em 'Resume' para continuar.
              onTimeout: "reject" # 'reject' | 'resume'. On timeout. Default: reject.
