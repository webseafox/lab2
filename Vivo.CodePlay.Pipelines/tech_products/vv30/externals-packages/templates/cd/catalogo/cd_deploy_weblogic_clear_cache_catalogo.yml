parameters:
- name: environment
- name: parity
  type: string
  default: ''

steps:

  ## -> Skip Download
  - download: none
  
  ## -> Checkout the source code.
  - checkout: self
    displayName: Checkout Source Code
    name: checkout_source_code
    clean: true
    path: source_code
    submodules: recursive

  - task: Bash@3
    displayName: Stop Start Set Up
    inputs:
      targetType: 'inline'
      script: |

        echo "##vso[task.setvariable variable=PARITY_LOWER]$(echo ${{ parameters.parity }} | tr '[:upper:]' '[:lower:]')"
        
        if [ "${{ parameters.parity }}" == "EVEN" ]; then
          echo "##[warning] Properties file was already transfered on ODD restart servers job..."
          echo "##[warning] Setting TRANSFER_FILE_DONE variable to prevent redundant backups and transfers..."
          echo "##[debug] TRANSFER_FILE_DONE: true"
          echo "##vso[task.setvariable variable=TRANSFER_FILE_DONE]true"
        fi

  - template: /tech_products/dvps/scripts/weblogic-12.2/ShutdownServers.yml
    parameters:
      WEBLOGIC_USER: $(WEBLOGIC_USER)
      WEBLOGIC_PASS: $(WEBLOGIC_PASS)
      WEBLOGIC_ADMIN_SERVER_URL: $(WEBLOGIC_ADMIN_SERVER_URL)
      WEBLOGIC_TIMEOUT: $(WEBLOGIC_TIMEOUT)
      EVEN_OR_ODD: $(PARITY_LOWER)

  # - template: /tech_products/dvps/scripts/weblogic-12.2/ClearCache.yml
  #   parameters:
  #     WEBLOGIC_USER: $(WEBLOGIC_USER)
  #     WEBLOGIC_PASS: $(WEBLOGIC_PASS)
  #     WEBLOGIC_ADMIN_SERVER_URL: $(WEBLOGIC_ADMIN_SERVER_URL)
  #     WEBLOGIC_TIMEOUT: $(WEBLOGIC_TIMEOUT)
  #     EVEN_OR_ODD: $(PARITY_LOWER)


  - template: /tech_products/dvps/scripts/weblogic-12.2/StartServers.yml
    parameters:
      WEBLOGIC_USER: $(WEBLOGIC_USER)
      WEBLOGIC_PASS: $(WEBLOGIC_PASS)
      WEBLOGIC_ADMIN_SERVER_URL: $(WEBLOGIC_ADMIN_SERVER_URL)
      WEBLOGIC_TIMEOUT: $(WEBLOGIC_TIMEOUT)