stages:

  - stage: build_test
    displayName: "Build & Test"
    dependsOn:
      - pipeline_init
    pool: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: bump_version
        displayName: Bumping Version
        condition: and(succeeded(), eq(variables.flowIsTagging, false))
        steps:

          - checkout: self
            persistCredentials: "true"
            clean: true

          - bash: |
              version=$(grep version il-gtw/pom.xml | grep -v '<?xml' | grep '<version>'|head -n 1|awk '{print $1}'| cut -d'>' -f 2 | cut -d'<' -f 1)
              echo "##vso[task.setvariable variable=APP_CURRENT_VERSION]$version"
              echo "##[debug] Exporting variable 'APP_CURRENT_VERSION': $version"
            name: export_current_version
            displayName: Extract App Version

          - task: semver-bump@1
            displayName: Bump Version
            condition:  or(
              and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')),
              and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))
              )
            inputs:
              VersionVariable: 'APP_CURRENT_VERSION'
              IncrementLevel: 'patch'

          - bash: |
              echo "##vso[task.setvariable variable=${NEW_VERSION_OUT};isOutput=true]${NEW_VERSION}"
              echo "##[debug] Exporting variable '${NEW_VERSION_OUT}': ${NEW_VERSION}"
            displayName: 'Defining New Component Version'
            name: component_bump_version
            env:
              NEW_VERSION: $(APP_CURRENT_VERSION)
              NEW_VERSION_OUT: "APP_NEW_VERSION"

      - job: build_app
        displayName: Build & Test
        dependsOn:
          - bump_version
        condition: and(succeeded(), eq(variables.flowIsTagging, false))
        variables:
          - name: APP_NEW_VERSION
            value: $[ dependencies.bump_version.outputs['component_bump_version.APP_NEW_VERSION'] ]
        steps:
          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)"'
              path: '$(MAVEN_CACHE_FOLDER)'
              cacheHitVar: 'CacheRestored'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven

          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: $(AKV_DEVOPS_NAME)
              SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

          - task: ReplaceTokens@3
            displayName: 'Configuring Settings.xml'
            inputs:
              rootDirectory: '$(system.defaultWorkingDirectory)'
              targetFiles: 'settings.xml'
              tokenPattern: azpipelines
              tokenPrefix: '#{'
              tokenSuffix: '}#'

          - task: DownloadPackage@1
            displayName: 'Download Apache Maven'
            inputs:
              packageType: 'upack'
              feed: '$(PACKAGE_FEED)'
              view: '$(PACKAGE_VIEW)'
              definition: '$(MAVEN_PACKAGE_DEFINITION)'
              version: '$(MAVEN_PACKAGE_VERSION)'
              downloadPath: '$(System.ArtifactsDirectory)'
            env:
              HTTPS_PROXY: "http://10.240.58.39:3128"

          - task: ExtractFiles@1
            displayName: 'Extract Apache Maven'
            inputs:
              archiveFilePatterns: '$(System.ArtifactsDirectory)/$(MAVEN_PACKAGE_FILE)'
              destinationFolder: '$(System.ArtifactsDirectory)/maven'
              cleanDestinationFolder: false

          - task: DownloadPackage@1
            displayName: 'Download Oracle JDK-8'
            inputs:
              packageType: 'upack'
              feed: '$(PACKAGE_FEED)'
              view: '$(PACKAGE_VIEW)'
              definition: '$(JAVA_PACKAGE_DEFINITION)'
              version: '$(JAVA_PACKAGE_VERSION)'
              downloadPath: '$(System.ArtifactsDirectory)'
            env:
              HTTPS_PROXY: "http://10.240.58.39:3128"

          - task: JavaToolInstaller@0
            displayName: 'Use Java 8'
            inputs:
              versionSpec: 8
              jdkArchitectureOption: x64
              jdkSourceOption: LocalDirectory
              jdkFile: '$(System.ArtifactsDirectory)/$(JAVA_PACKAGE_FILE)'
              jdkDestinationDirectory: '$(System.ArtifactsDirectory)/java'
              createExtractDirectory: false

         # - task: Maven@4
        #    displayName: 'Maven Clean Install'
       #     inputs:
        #      mavenPomFile: 'il-gtw/pom.xml'
        #      options: '-s settings.xml'
        #      mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
        #      javaHomeOption: 'Path'
        #      jdkDirectory: '$(System.ArtifactsDirectory)/$(JAVA_DIRECTORY)'
         #     jdkArchitectureOption: 'x64'
        #      mavenVersionOption: 'Path'
        #      mavenDirectory: '$(System.ArtifactsDirectory)/$(MAVEN_DIRECTORY)'
        #      mavenAuthenticateFeed: false
       #       goals: '-X clean install'
       #       publishJUnitResults: false
       #       testResultsFiles: false

          - task: Maven@4
            displayName: 'Maven Clean Install'
            inputs:
              mavenPomFile: 'il-gtw/pom.xml'
              options: '-s settings.xml'
              mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
              javaHomeOption: 'Path'
              jdkDirectory: '$(System.ArtifactsDirectory)/$(JAVA_DIRECTORY)'
              jdkArchitectureOption: 'x64'
              mavenVersionOption: 'Path'
              mavenDirectory: '$(System.ArtifactsDirectory)/$(MAVEN_DIRECTORY)'
              mavenAuthenticateFeed: false
              goals: 'clean install'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

          - task: PublishCodeCoverageResults@2
            displayName: Publish Code Coverage
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/il-gtw/**/target/**/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/il-gtw/engine/api-engine/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/engine/commons-engine/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/engine/data-mapping/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/engine/router-engine/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/commons/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-mapping/ilgtw-core-mapping-engine/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-mapping/ilgtw-core-mapping-grammar/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-mapping/ilgtw-core-mapping-test-grammar/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-mapping/ilgtw-core-mapping-validation/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-validation/ilgtw-core-validation-data/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-validation/ilgtw-core-validation-platform/ilgtw-core-validation-platform-camel/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-validation/ilgtw-core-validation-schema/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-validation/ilgtw-core-validation-test-model/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/ilgtw-core-validation/swagger-schema/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/logging/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/mongo/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/redis/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/script-route/custom/src/main/java/;$(System.DefaultWorkingDirectory)/il-gtw/plugins/script-route/script/src/main/java/'
              failIfCoverageEmpty: true

          - task: Maven@4
            displayName: 'Update Build POM Version'
            inputs:
              mavenPomFile: 'il-gtw/pom.xml'
              options: '-s settings.xml'
              mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
              javaHomeOption: 'Path'
              jdkDirectory: '$(System.ArtifactsDirectory)/$(JAVA_DIRECTORY)'
              jdkArchitectureOption: 'x64'
              mavenVersionOption: 'Path'
              mavenDirectory: '$(System.ArtifactsDirectory)/$(MAVEN_DIRECTORY)'
              mavenAuthenticateFeed: false
              goals: 'versions:set -DnewVersion=$(APP_NEW_VERSION)'
              publishJUnitResults: false
              testResultsFiles: false

          - task: CopyFiles@2
            displayName: Copy Files Staging Directory
            inputs:
              SourceFolder: '$(build.sourcesdirectory)'
              Contents: |
                **/*
                !.git/**/*
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              OverWrite: true
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: Publish Build Artifacts
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: app
              StoreAsTar: true

          - task: CopyFiles@2
            displayName: Copy Bundles Files Staging Directory
            inputs:
              SourceFolder: '$(build.sourcesdirectory)'
              Contents: |
                **/repo*.zip
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              OverWrite: true
              flattenFolders: true

          - task: PublishBuildArtifacts@1
            displayName: Publish Bundles Artifacts
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: bundles
              StoreAsTar: true