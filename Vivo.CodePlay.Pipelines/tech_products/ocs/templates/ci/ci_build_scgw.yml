stages:
  - stage: build_test
    displayName: "Build & Test"
    pool: GeneralPurposeLinuxAgentsCI
    jobs:
      - job: bump_version
        displayName: Bumping Version
        condition: and(succeeded(), eq(variables.flowIsTagging, false))
        steps:

        - checkout: self
          persistCredentials: "true"
          clean: true

        - bash: |
            version=$(grep version pom.xml | grep -v '<?xml' | grep '<version>'|head -n 1|awk '{print $1}'| cut -d'>' -f 2 | cut -d'<' -f 1)
            echo "##vso[task.setvariable variable=APP_CURRENT_VERSION]$version"
            echo "##[debug] Exporting variable 'APP_CURRENT_VERSION': $version"
          name: export_current_version
          displayName: Extract App Version     

        - task: semver-bump@1
          displayName: Bump Version
          condition:  or(
                        and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')), 
                        and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))
                      )
          inputs:
            VersionVariable: 'APP_CURRENT_VERSION'
            IncrementLevel: 'patch' 

        - bash: |
            echo "##vso[task.setvariable variable=${NEW_VERSION_OUT};isOutput=true]${NEW_VERSION}"
            echo "##[debug] Exporting variable '${NEW_VERSION_OUT}': ${NEW_VERSION}"
          displayName: 'Defining New Component Version'
          name: component_bump_version
          env:
            NEW_VERSION: $(APP_CURRENT_VERSION)
            NEW_VERSION_OUT: "APP_NEW_VERSION"
      
      - job: build_test
        displayName: 'Build Job'
        dependsOn:
          - bump_version
        condition: and(succeeded(), eq(variables.flowIsTagging, false))
        variables:
          - name: APP_NEW_VERSION 
            value: $[ dependencies.bump_version.outputs['component_bump_version.APP_NEW_VERSION'] ]        
          - name: MAVEN_OPTS
            value: '-Xmx3072m'
          - name: MAVEN_CACHE_FOLDER
            value: $(Pipeline.Workspace)/.m2/repository

        steps:
          - task: AzureKeyVault@2  
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5  
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: $(AKV_DEVOPS_NAME)
              SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'
              
          - task: ReplaceTokens@3
            displayName: 'Configuring Settings.xml'
            inputs:
              rootDirectory: '$(System.DefaultWorkingDirectory)'
              targetFiles: 'settings.xml'
              tokenPattern: azpipelines
              tokenPrefix: '#{'
              tokenSuffix: '}#'
              
          - task: DownloadPackage@1
            displayName: 'Download Java 17'
            inputs:
              packageType: 'upack'
              feed: '/3d53bc62-8749-4931-ae46-a443b73bc87a'
              view: 'da88d2ff-67d7-44d6-a91b-cc4bffa5fa70'
              definition: '017f4968-da6d-4cf4-b1db-b4a4499604a7'
              version: '17.0.3'
              downloadPath: '$(System.ArtifactsDirectory)/java'
            #env:
            # HTTPS_PROXY: "http://10.240.58.39:3128"
              
          - task: JavaToolInstaller@0
            displayName: 'Use Java 17'
            inputs:
              versionSpec: 17
              jdkArchitectureOption: x64
              jdkSourceOption: LocalDirectory
              jdkFile: '$(System.ArtifactsDirectory)/java/jdk-17.0.3.1_linux-x64_bin.tar.gz'
              jdkDestinationDirectory: '$(System.ArtifactsDirectory)/JDK17'
              createExtractDirectory: false
              
          - task: DownloadPackage@1.238.1
            displayName: 'Download Apache Maven'
            inputs:
              packageType: 'upack'
              feed: '$(PACKAGE_FEED)'
              view: '$(PACKAGE_VIEW)'
              definition: '$(MAVEN_PACKAGE_DEFINITION)'
              version: '$(MAVEN_PACKAGE_VERSION)'
              downloadPath: '$(System.ArtifactsDirectory)'
            env:
              HTTPS_PROXY: "http://10.240.58.39:3128"

          - task: ExtractFiles@1
            displayName: 'Extract Apache Maven'
            inputs:
                archiveFilePatterns: '$(System.ArtifactsDirectory)/$(MAVEN_PACKAGE_FILE)'
                destinationFolder: '$(System.ArtifactsDirectory)/maven'
                cleanDestinationFolder: false

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Artifacts from Previous Build'
            inputs:
              buildType: 'specific'
              project: 'SMRC - SMART CGW'
              pipeline: 'alarm-monitor-libs'
              runVersion: 'latest'
              artifact: 'eisa'
              targetPath: '$(Pipeline.Workspace)/maven-repo'

          - script: |
              echo "Using downloaded artifacts..."
              mkdir -p ~/.m2/repository/br/com/eisa
              cp -r $(Pipeline.Workspace)/maven-repo/* ~/.m2/repository/br/com/eisa/
              echo "Contents of ~/.m2/repository/br:"
              ls -laR ~/.m2/repository/br
            displayName: 'Copy Artifacts to Local Maven Repository'

          - task: Maven@3
            displayName: 'Maven Clean Install'
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              options: '-B -e -s settings.xml'
              goals: 'versions:set -DnewVersion=$(APP_NEW_VERSION) -Djava.io.tmpdir=$(Agent.TempDirectory) clean verify install'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
            env:
              HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
              HTTP_PROXY: $(PROXY_AGENT_HTTP)
              NO_PROXY: $(PROXY_AGENT_NO_PROXY)
              
          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/apps/scgw-app/src/main/java/;$(System.DefaultWorkingDirectory)/apps/scgw-cdr-app/src/main/java/;$(System.DefaultWorkingDirectory)/apps/scgw-rrp-app/src/main/java/;$(System.DefaultWorkingDirectory)/apps/scgw-synchronizer-app/src/main/java/;$(System.DefaultWorkingDirectory)/apps/scgw-tools-app/src/main/java/;$(System.DefaultWorkingDirectory)/commons/src/main/java/;$(System.DefaultWorkingDirectory)/dyna/src/main/java/;$(System.DefaultWorkingDirectory)/base-config/src/main/java/;$(System.DefaultWorkingDirectory)/schemas/src/main/java/;$(System.DefaultWorkingDirectory)/fiveg-schemas/src/main/java/'
              reportDirectory: '$(System.DefaultWorkingDirectory)/**/jacoco'
              failIfCoverageEmpty: false

          # - script: |
          #     echo "Build directory: $(Build.SourcesDirectory)"
          #     ls -laR $(Build.SourcesDirectory)
          #     echo "Staging directory: $(Build.ArtifactStagingDirectory)"
          #     echo "Copying JARs and POMs from Maven local repository to staging directory..."
          #     mkdir -p $(Build.ArtifactStagingDirectory)
          #     cp -r ~/.m2/repository/br/com/eisa/smarts/* $(Build.ArtifactStagingDirectory)/
          #     ls -la $(Build.ArtifactStagingDirectory)
          #   displayName: 'Copy Maven Local Repository to Staging Directory'

          # - task: Bash@3
          #   displayName: 'Rename RPM Files'
          #   inputs:
          #     targetType: inline
          #     script: |
          #       for file in $(find $(build.sourcesdirectory) -name '*.rpm'); do
          #         version=$(echo $file | grep -oP '\d+\.\d+\.\d+(-SNAPSHOT)?')
          #         if [[ $file == *SNAPSHOT* ]]; then
          #           new_name="$(dirname $file)/$(basename $file | sed -E "s/(.*)-\d+\.\d+\.\d+-SNAPSHOT\.\d+\.noarch\.rpm/\1-$version.rpm/")"
          #         else
          #           new_name="$(dirname $file)/$(basename $file | sed -E "s/(.*)-\d+\.\d+\.\d+-\d+\.noarch\.rpm/\1-$version.rpm/")"
          #         fi
          #         mv "$file" "$new_name"
          #         echo "Renamed $file to $new_name"
          #       done

          # Copiar a aplicação para Staging
          - task: CopyFiles@2
            displayName: Copy Files Staging Directory
            inputs:
              SourceFolder: '$(build.sourcesdirectory)'
              Contents: |
                **/*
                !**/*.tar.gz
                !**/*.jar
                !.git/**/*
                !**/*.rpm
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              OverWrite: true
              flattenFolders: false

          # Publicar para pasta app (será utilizada pelo Sonar)
          - task: PublishBuildArtifacts@1
            displayName: Publish Build Artifacts
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: app
              StoreAsTar: true

          - task: CopyFiles@2
            displayName: Copy Bundles Files Staging Directory
            inputs:
              SourceFolder: '$(build.sourcesdirectory)'
              Contents: |
                **/*.rpm
                !$HOME/**/*        
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              OverWrite: true
              flattenFolders: true
          
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'jar'

          - task: CopyFiles@2
            displayName: 'Copy Scripts to Staging Directory'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/scripts/deploy'
              Contents: '**/*'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/scripts'
              CleanTargetFolder: true
              OverWrite: true
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Script Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/scripts'
              ArtifactName: 'scripts'
              StoreAsTar: false    