parameters:
- name: components_to_install
- name: qa_environment
- name: skip_deploy

stages:
- stage: deploy
  displayName: "Deploy ${{ parameters.qa_environment }}"
  dependsOn:
  - package
  #pool: $(PRIVATE_AGENT_DEFAULT)
  pool: VivoOnPremPrdAgents
  jobs:
  - job: bundles_to_install
    displayName: Select Bundles
    condition: eq('${{ parameters.skip_deploy }}', false)
    variables:
      - template: /.azuredevops/config/${{ parameters.qa_environment }}/environments_variables.yml@self
      - template: /.azuredevops/config/${{ parameters.qa_environment }}/server01_variables.yml@self
    steps:
    - download: none 
    - checkout: self

    ## ARTIFACTS ANOTHER BUILD ID
    - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags') }}:
      - bash: |
          build_id=$(yq '.buildId' $(Build.SourcesDirectory)/.azuredevops/build.yaml)
          echo "##vso[task.setvariable variable=BUILD_ID]$build_id"
          echo "##[debug] Exporting variable 'BUILD_ID': $build_id"
        name: export_build_id
        displayName: Extract Build ID 

      - task: DownloadBuildArtifacts@1
        displayName: 'Download Specific Build Artifact'
        inputs:
          buildType: specific
          project: '$(PROJECT_NAME)' 
          pipeline: '$(PIPELINE_NAME)' 
          buildVersionToDownload: specific
          buildId: '$(BUILD_ID)' 
          artifactName: 'bundles' 
          downloadPath: '$(System.ArtifactsDirectory)'
    ## ARTIFACTS CURRENT BUILD ID
    - ${{ else }}:
      - task: DownloadBuildArtifacts@1
        displayName: 'Download Pipeline Artifact'
        inputs:
          buildType: current
          artifactName: 'bundles'
          downloadPath: '$(System.ArtifactsDirectory)'
    - task: Bash@3
      name: package_bundles
      displayName: 'Package Bundles'
      inputs:
        targetType: inline
        script: |
          mkdir bundles_temp_dir
          tar -xmf $(System.ArtifactsDirectory)/bundles/bundles.tar -C bundles_temp_dir
          echo "##[debug] List bundles_temp_dir:"
          ls -la bundles_temp_dir

          mkdir selected_bundles;

          component="${{parameters.components_to_install}}"

            case $component in
            "main")
              echo "##[debug] main deploy"
              component="smarthistory-main-*.jar"
              mkdir -p selected_bundles/bin-oracle
              ;;
            "commons")
              echo "##[debug] commons deploy"
              component="smarthistory-rm-business-*.jar,smartnotification-model-*.jar,smartnotification-commons-*.jar,smartnotification-business-*.jar,smartfinance-model-*.jar,smartfinance-business-*.jar,smarthistory-recovery-*.jar,smarthistory-model-*.jar,smarthistory-messaging-business-layer-*.jar,smarthistory-core-layer-*.jar,smarthistory-commons-*.jar,smarthistory-business-layer-*.jar"
              mkdir -p selected_bundles/libs_commons
              ;;
            "models")
              echo "##[debug] models deploy"
              component="smarthistory-rm-model-recurring-*.jar,smarthistory-rm-model-refill-*.jar,smarthistory-rm-model-refund-*.jar,smarthistory-rm-model-threshold-*.jar,smarthistory-rm-model-balance-adjustment-*.jar,smarthistory-rm-model-balance-creation-*.jar,smarthistory-rm-model-bucket-maintenance-*.jar,smarthistory-rm-model-usage-charge-*.jar,smarthistory-rm-model-cpm-customer-change-*.jar,smarthistory-rm-model-*.jar,smarthistory-rm-model-end-user-notification-history-*.jar,smarthistory-rm-model-network-policy-counter-status-*.jar,smarthistory-rm-model-purchase-charge-*.jar,smarthistory-rm-model-service-charge-*.jar"
              mkdir -p selected_bundles/libs_model
              ;;
            *)
              echo "##[debug] default deploy"
              component="smarthistory-rm-business-*.jar,smartnotification-model-*.jar,smartnotification-commons-*.jar,smartnotification-business-*.jar,smartfinance-model-*.jar,smartfinance-business-*.jar,smarthistory-recovery-*.jar,smarthistory-model-*.jar,smarthistory-messaging-business-layer-*.jar,smarthistory-core-layer-*.jar,smarthistory-commons-*.jar,smarthistory-business-layer-*.jar,smarthistory-main-*.jar,smarthistory-rm-model-recurring-*.jar,smarthistory-rm-model-refill-*.jar,smarthistory-rm-model-refund-*.jar,smarthistory-rm-model-threshold-*.jar,smarthistory-rm-model-balance-adjustment-*.jar,smarthistory-rm-model-balance-creation-*.jar,smarthistory-rm-model-bucket-maintenance-*.jar,smarthistory-rm-model-usage-charge-*.jar,smarthistory-rm-model-cpm-customer-change-*.jar,smarthistory-rm-model-*.jar,smarthistory-rm-model-end-user-notification-history-*.jar,smarthistory-rm-model-network-policy-counter-status-*.jar,smarthistory-rm-model-purchase-charge-*.jar,smarthistory-rm-model-service-charge-*.jar"
              mkdir -p selected_bundles/bin-oracle
              mkdir -p selected_bundles/libs_commons
              mkdir -p selected_bundles/libs_model
              ;;
            esac

          echo "##[debug] The files that will be copied are -> $component"

          file_name=""
          for file in $(echo "$component" | tr "," "\n")
            do
              echo "##[debug] Copying file: $file"
              if [[ "$file" == *main-* ]]; then
                echo "##[debug] Copy to bin-oracle"
                cp bundles_temp_dir/$file selected_bundles/bin-oracle/
                file_name=$(find selected_bundles/bin-oracle -maxdepth 1 -name "$file" | head -n 1)
                continue
              elif [[ "$file" == *rm-model* ]]; then
                echo "##[debug] Copy to libs_models"
                cp bundles_temp_dir/$file selected_bundles/libs_model/
                file_name=$(find selected_bundles/libs_models -maxdepth 1 -name "$file" | head -n 1)
                continue
              else
                echo "##[debug] Copy to libs_commons"
                cp bundles_temp_dir/$file selected_bundles/libs_commons/
                file_name=$(find selected_bundles/libs_commons -maxdepth 1 -name "$file" | head -n 1)
              fi

              echo "##[debug] verify: $file_name"

              if [ -n "$file_name" ]; then
                echo "##[debug] The copy of the $file_name file was successful."
              else
                echo "##[error] Error: The copy of the $file_name file failed."
                echo "##vso[task.complete result=Failed;]"
                echo "##vso[task.setvariable variable=INVALID_COMPONENT_TO_INSTALL;isOutput=true;]true"
                echo "##[debug] Exporting variable 'INVALID_COMPONENT_TO_INSTALL': true"                                            

                exit 1
              fi                 
            done
          
          echo "##[debug] List selected bundles:"
          ls -la selected_bundles

          echo "##vso[task.setvariable variable=INVALID_COMPONENT_TO_INSTALL;isOutput=true;]false"
          echo "##[debug] Exporting variable 'INVALID_COMPONENT_TO_INSTALL': false"                    

    - task: CopyFiles@2
      displayName: Copy Bundles Files Staging Directory
      inputs:
        SourceFolder: "$(System.DefaultWorkingDirectory)/selected_bundles"
        Contents: |
          **
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: Publish Bundles Artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: bundles
        StoreAsTar: true

  - deployment: ${{ parameters.qa_environment }}
    dependsOn: 
    - bundles_to_install
    variables:
      - template: /.azuredevops/config/${{ parameters.qa_environment }}/environments_variables.yml@self
      - template: /.azuredevops/config/${{ parameters.qa_environment }}/server01_variables.yml@self
      - name: currentDate
        value: $[ format('{0:yyyy}.{0:MM}.{0:dd}', pipeline.startTime) ]
    condition: and(succeeded(), eq('${{ parameters.skip_deploy }}', false))
    workspace:
      clean: all
    displayName: Deploy ${{ parameters.qa_environment }}

    ${{ if or(contains(parameters.qa_environment, 'teste'), contains(parameters.qa_environment, 'lab')) }}:
      environment:
        name: "deploy-his_lab"
        resourceType: VirtualMachine
    ${{ else }}:
      environment: "deploy-${{ parameters.qa_environment }}"

    strategy:
      runOnce:      
        deploy:
          steps:
          - download: none
          - checkout: none

          - task: DownloadBuildArtifacts@1
            displayName: 'Download Pipeline Artifact'
            inputs:
              buildType: current
              artifactName: 'bundles'
              downloadPath: '$(System.ArtifactsDirectory)'

          - template: /tech_products/ocs/templates/cd/smarthistory/cd_create_backup.yml
            parameters:
              qa_environment: ${{ parameters.qa_environment }}
              components_to_install: ${{ parameters.components_to_install }}
              currentDate: ${{ variables.currentDate }}
              MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
              COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
              MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
              CLIENT_ID: ${{ variables.CLIENT_ID }}
              CLIENT_SECRET: ${{ variables.CLIENT_SECRET }}
              CREDENTIAL_ID: ${{ variables.CREDENTIAL_ID }}
              SMART_KEY: ${{ variables.SMART_KEY }}            
              USER: ${{ variables.USER }}

          - template: /tech_products/ocs/templates/cd/smarthistory/cd_install_bundles.yml
            parameters:
              qa_environment: ${{ parameters.qa_environment }}
              components_to_install: ${{ parameters.components_to_install }}
              currentDate: ${{ variables.currentDate }}
              MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
              COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
              MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
              USER: ${{ variables.USER }}

          - template: /tech_products/ocs/templates/cd/smarthistory/cd_stop_application.yml
            parameters:
              qa_environment: ${{ parameters.qa_environment }}
              components_to_install: ${{ parameters.components_to_install }}
              currentDate: ${{ variables.currentDate }}
              MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
              COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
              MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
              USER: ${{ variables.USER }}

          - template: /tech_products/ocs/templates/cd/smarthistory/cd_start_application.yml
            parameters:
              qa_environment: ${{ parameters.qa_environment }}
              components_to_install: ${{ parameters.components_to_install }}
              currentDate: ${{ variables.currentDate }}
              MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
              COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
              MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
              USER: ${{ variables.USER }}
              FORCE_ROLLBACK: 1

  - deployment: rollback_${{ parameters.qa_environment }}
    displayName: Rollback Bundles

    dependsOn:
    - bundles_to_install
    - ${{ parameters.qa_environment }}

    variables:
      - template: /.azuredevops/config/${{ parameters.qa_environment }}/environments_variables.yml@self
      - name: INVALID_COMPONENT_TO_INSTALL
        value: $[ dependencies.bundles_to_install.outputs['package_bundles.INVALID_COMPONENT_TO_INSTALL'] ]
      - name: currentDate
        value: $[ format('{0:yyyy}.{0:MM}.{0:dd}', pipeline.startTime) ]

    condition: and(failed(), eq(variables.INVALID_COMPONENT_TO_INSTALL, false), eq('${{ parameters.skip_deploy }}', false))

    ${{ if or(contains(parameters.qa_environment, 'teste'), contains(parameters.qa_environment, 'lab')) }}:
      environment:
        name: "deploy-his_lab"
        resourceType: VirtualMachine
    ${{ else }}:
      environment: "deploy-${{ parameters.qa_environment }}"

    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: none

            - template: /tech_products/ocs/templates/cd/smarthistory/cd_rollback_binaries.yml
              parameters:
                qa_environment: ${{ parameters.qa_environment }}
                components_to_install: ${{ parameters.components_to_install }}
                currentDate: ${{ variables.currentDate }}
                MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
                COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
                MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
                USER: ${{ variables.USER }}

            - template: /tech_products/ocs/templates/cd/smarthistory/cd_stop_application.yml
              parameters:
                qa_environment: ${{ parameters.qa_environment }}
                components_to_install: ${{ parameters.components_to_install }}
                currentDate: ${{ variables.currentDate }}
                MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
                COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
                MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
                USER: ${{ variables.USER }}

            - template: /tech_products/ocs/templates/cd/smarthistory/cd_start_application.yml
              parameters:
                qa_environment: ${{ parameters.qa_environment }}
                components_to_install: ${{ parameters.components_to_install }}
                currentDate: ${{ variables.currentDate }}
                MAIN_SERVERS: ${{ variables.MAIN_SERVERS }}
                COMMONS_SERVERS: ${{ variables.COMMONS_SERVERS }}
                MODELS_SERVERS: ${{ variables.MODELS_SERVERS }}
                USER: ${{ variables.USER }}
                FORCE_ROLLBACK: 0
                
  - job: manual_rollback_${{ parameters.qa_environment }}
    displayName: Manual Rollback Bundles
    pool: server
    dependsOn:
    - bundles_to_install
    - ${{ parameters.qa_environment }}
    - rollback_${{ parameters.qa_environment }}
    condition: and( 
                  failed('rollback_${{ parameters.qa_environment }}'),
                  eq('${{ parameters.skip_deploy }}', false)
                )
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'vinicius.silva1@telefonica.com'
        instructions: 'Instruções: service conn '
        onTimeout: 'resume'

  - job: governance_deploy
    displayName: Governance Deploy
    pool: $(PRIVATE_AGENT_DEFAULT)
    
    dependsOn: 
    - ${{ parameters.qa_environment }}
    condition: and(succeeded(), eq('${{ parameters.skip_deploy }}', false))    
    steps:
    - download: none 
    - checkout: self

    - script: |
        if [ ! -f "catalog-info.yaml" ]; then
          echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
        fi

        COMPONENT_NAME="$(yq -r 'select(documentIndex == 0) | .metadata.name | select (.!=null)' catalog-info.yaml)"
        echo "##vso[task.setvariable variable=COMPONENT_NAME]${COMPONENT_NAME}"
        echo "##vso[task.setvariable variable=CATALOG_INFO_FILE_CONTENT]$(cat catalog-info.yaml)"
      name: export_catalog_info
      displayName: Reading Catalog Info File

    - bash: |
        version=$(grep version pom.xml | grep -v '<?xml' | grep '<version>'|head -n 1|awk '{print $1}'| cut -d'>' -f 2 | cut -d'<' -f 1)
        echo "##vso[task.setvariable variable=APP_VERSION]$version"
        echo "##[debug] Exporting variable 'APP_VERSION': $version"
      name: export_current_version
      displayName: Extract App Version 

    ## DEPLOY TO PROD
    - ${{ if startsWith(parameters.qa_environment, 'producao_') }}:
      - task: VivoGovernance@1
        inputs:
          breakglass: $(GOVAPP_BREAK_GLASS)
          cluster: "$(GOVAPP_CLUSTER)"
          component: "$(COMPONENT_NAME)"
          deployment: "$(COMPONENT_NAME)"
          environment: "producao"
          namespace: "$(GOVAPP_NAMESPACE)"
          operation: "deploy"
          serverEndpoint: $(GOVAPP_SERVICE_CONNECTION_NAME)
          version: "$(APP_VERSION)"
          catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
        continueOnError: true
        condition: eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')

    - ${{ else }}:
      - task: VivoGovernance@1
        inputs:
          breakglass: $(GOVAPP_BREAK_GLASS)
          cluster: "$(GOVAPP_CLUSTER)"
          component: "$(COMPONENT_NAME)"
          deployment: "$(COMPONENT_NAME)"
          environment: "${{ parameters.qa_environment }}"
          namespace: "$(GOVAPP_NAMESPACE)"
          operation: "deploy"
          serverEndpoint: $(GOVAPP_SERVICE_CONNECTION_NAME)
          version: "$(APP_VERSION)"
          catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
        continueOnError: true
        condition: eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true')	  