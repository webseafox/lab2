steps:
  - ${{ if contains(parameters.components_to_install, 'receivers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - ${{ each service_connection in split(parameters.BACKUP_RECEIVER_PAR_SERVERS,',') }}:
        - task: CopyFilesOverSSH@0
          displayName: "Copy Package to NOF Receiver - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            sourceFolder: $(System.ArtifactsDirectory)/bundles
            contents: 'bundles.tar'
            targetFolder: '/tmp'

      - task: SSH@0
        displayName: "Execute install bundle NOF Receiver - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: true
          inline: |
            ssh NOF@10.240.3.185 'tar --no-same-owner -xvf /tmp/bundles.tar -C /opt/interfaces/nof/bin/ --warning=no-timestamp;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Execute install bundle NOF Receiver - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: true
          inline: |
            ssh NOF@10.240.3.201 'tar --no-same-owner -xvf /tmp/bundles.tar -C /opt/interfaces/nof/bin/ --warning=no-timestamp;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
