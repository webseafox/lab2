parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: BACKUP_RECEIVER_PAR_SERVERS
- name: BACKUP_RECEIVER_IMPAR_SERVERS
- name: BACKUP_RECEIVER_SERVERS
- name: BACKUP_ENGINE_PAR_SERVERS
- name: BACKUP_ENGINE_IMPAR_SERVERS
- name: BACKUP_ENGINE_SERVERS
- name: BACKUP_PUBLISHER_PAR_SERVERS
- name: BACKUP_PUBLISHER_IMPAR_SERVERS
- name: BACKUP_PUBLISHER_SERVERS
- name: BACKUP_COLLECTOR_PAR_SERVERS
- name: BACKUP_COLLECTOR_IMPAR_SERVERS
- name: BACKUP_COLLECTOR_SERVERS
- name: BACKUP_CONFIGURATIONMANAGER_SERVERS
- name: BACKUP_ZOOKEEPER_SERVERS
- name: BACKUP_KAFKA_SERVERS
