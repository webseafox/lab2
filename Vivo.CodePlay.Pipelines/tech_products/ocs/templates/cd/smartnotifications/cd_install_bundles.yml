          displayName: "Copy Package to NOF Receiver - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            sourceFolder: $(System.ArtifactsDirectory)/bundles
            contents: 'bundles.tar'
            targetFolder: '/tmp'

      - task: SSH@0
        displayName: "Execute install bundle NOF Receiver - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: true
          inline: |
            ssh NOF@10.240.3.184 'tar --no-same-owner -xvf /tmp/bundles.tar -C /opt/interfaces/nof/bin/ --warning=no-timestamp;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Execute install bundle NOF Receiver - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: true
          inline: |
            ssh NOF@10.240.3.200 'tar --no-same-owner -xvf /tmp/bundles.tar -C /opt/interfaces/nof/bin/ --warning=no-timestamp;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ if ne(parameters.BACKUP_RECEIVER_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.BACKUP_RECEIVER_SERVERS,',') }}:
          - task: CopyFilesOverSSH@0
            displayName: "Copy Package to NOF Receiver - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              sourceFolder: $(System.ArtifactsDirectory)/bundles
              contents: 'bundles.tar'
              targetFolder: '/tmp'
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: true
              inline: |
                sudo su - nof <<EOF
                tar -xvf /tmp/bundles.tar -C /opt/interfaces/nof --warning=no-timestamp
                chmod 0755 -R /opt/interfaces/nof/bin
                EOF
