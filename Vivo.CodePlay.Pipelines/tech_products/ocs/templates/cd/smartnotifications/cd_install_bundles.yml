          displayName: "Execute install bundle - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              tar --no-same-owner -xvf /opt/interfaces/nof/bundles-install-par-$(currentDate)/bundles.tar -C /opt/interfaces/nof/bin/ --warning=no-timestamp
              cp -f /opt/interfaces/nof/backup-bundles-par-$(currentDate)/*.jar /opt/interfaces/nof/bin/
              EOF
