parameters:
- name: components_to_install
- name: version_to_install
- name: qa_environment
- name: currentDate
- name: STOP_RECEIVER_PAR_SERVERS
- name: STOP_RECEIVER_IMPAR_SERVERS
- name: STOP_RECEIVER_SERVERS
- name: STOP_ENGINE_PAR_SERVERS
- name: STOP_ENGINE_IMPAR_SERVERS
- name: STOP_ENGINE_SERVERS
- name: STOP_PUBLISHER_PAR_SERVERS
- name: STOP_PUBLISHER_IMPAR_SERVERS
- name: STOP_PUBLISHER_SERVERS
- name: STOP_COLLECTOR_PAR_SERVERS
- name: STOP_COLLECTOR_IMPAR_SERVERS
- name: STOP_COLLECTOR_SERVERS
- name: STOP_CONFIGURATIONMANAGER_SERVERS
- name: STOP_ZOOKEEPER_SERVERS
- name: STOP_KAFKA_SERVERS
- name: STOP_QUEUEMANAGER_SERVERS
- name: STOP_ENRICHER_SERVERS

steps:
  - ${{ if contains(parameters.components_to_install, 'receivers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Stopping NOF Collector - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.159 'sh /opt/interfaces/nof/scripts/stop-collector.sh 1;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.161 'sh /opt/interfaces/nof/scripts/stop-collector.sh 2;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.163 'sh /opt/interfaces/nof/scripts/stop-collector.sh 3;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.165 'sh /opt/interfaces/nof/scripts/stop-collector.sh 4;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Receiver - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'sh /opt/interfaces/nof/scripts/stop-nof.sh receiver 2;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Receiver - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'sh /opt/interfaces/nof/scripts/stop-nof.sh receiver 4;sleep 90;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Stopping NOF Collector - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.159 'sh /opt/interfaces/nof/scripts/stop-collector.sh 1;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.161 'sh /opt/interfaces/nof/scripts/stop-collector.sh 2;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.163 'sh /opt/interfaces/nof/scripts/stop-collector.sh 3;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Collector - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.165 'sh /opt/interfaces/nof/scripts/stop-collector.sh 4;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Receiver - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'sh /opt/interfaces/nof/scripts/stop-nof.sh receiver 1;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Receiver - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.200 'sh /opt/interfaces/nof/scripts/stop-nof.sh receiver 3;sleep 90;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.STOP_COLLECTOR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-collector.sh ${{ split(service_connection, '|')[1] }}
              sleep 45
              EOF
      - ${{ each service_connection in split(parameters.STOP_RECEIVER_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Receiver ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-nof.sh receiver ${{ split(service_connection, '|')[1] }}
              sleep 45
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'engines') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Stopping NOF Engine - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'sh /opt/interfaces/nof/scripts/stop-nof.sh engine 2;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Engine - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'sh /opt/interfaces/nof/scripts/stop-nof.sh engine 4;sleep 90;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Stopping NOF Engine - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'sh /opt/interfaces/nof/scripts/stop-nof.sh engine 1;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Stopping NOF Engine - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.200 'sh /opt/interfaces/nof/scripts/stop-nof.sh engine 3;sleep 90;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.STOP_ENGINE_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Engine ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-nof.sh engine ${{ split(service_connection, '|')[1] }}
              sleep 45
              sh /opt/interfaces/nof/scripts/stop-nof.sh smart-notif ${{ split(service_connection, '|')[1] }}
              sleep 45
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'publishers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Stopping NOF Publisher - 3 e 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.175 'sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 3;sleep 45;sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 4;sleep 45;' 2>/dev/null &
      - task: SSH@0
        displayName: "Stopping NOF Publisher - 7 e 8"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.183 'sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 7;sleep 45;sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 8;sleep 45;' 2>/dev/null &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Stopping NOF Publisher - 1 e 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.174 'sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 1;sleep 45;sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 2;sleep 45;' 2>/dev/null &
      - task: SSH@0
        displayName: "Stopping NOF Publisher - 5 e 6"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.176 'sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 5;sleep 45;sh /opt/interfaces/nof/scripts/stop-nof.sh publisher 6;sleep 45;' 2>/dev/null &
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.STOP_PUBLISHER_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Publisher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-nof.sh publisher ${{ split(service_connection, '|')[1] }}
              sleep 45
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'collectors') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - ${{ each service_connection in split(parameters.STOP_COLLECTOR_PAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-collector.sh ${{ split(service_connection, '|')[1] }}
              sleep 45
              exit
              EOF
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - ${{ each service_connection in split(parameters.STOP_COLLECTOR_IMPAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-collector.sh ${{ split(service_connection, '|')[1] }}
              sleep 45
              exit
              EOF
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.STOP_COLLECTOR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Stopping NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: false
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              sh /opt/interfaces/nof/scripts/stop-collector.sh ${{ split(service_connection, '|')[1] }}
              sleep 45
              exit
              EOF
  - ${{ else }}:
    - ${{ each service_connection in split(parameters.STOP_COLLECTOR_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-collector.sh ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_PUBLISHER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Publisher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh publisher ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_ENGINE_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Engine ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh engine ${{ split(service_connection, '|')[1] }}
            sleep 45
            sh /opt/interfaces/nof/scripts/stop-nof.sh smart-notif ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_RECEIVER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Receiver ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh receiver ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_ENRICHER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Enricher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh enricher ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_QUEUEMANAGER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Queue Manager ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh queue-manager ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_KAFKA_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Kafka ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-kafka.sh ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_ZOOKEEPER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Zookeeper ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-zookeeper.sh ${{ split(service_connection, '|')[1] }}
            sleep 45
    - ${{ each service_connection in split(parameters.STOP_CONFIGURATIONMANAGER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Stopping NOF Configuration Manager ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sh /opt/interfaces/nof/scripts/stop-nof.sh configuration-manager ${{ split(service_connection, '|')[1] }}
            sleep 45