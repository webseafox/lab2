            ssh NOF@10.240.3.200 'cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
