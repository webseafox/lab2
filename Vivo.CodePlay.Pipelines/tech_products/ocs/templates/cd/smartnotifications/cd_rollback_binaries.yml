parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: BACKUP_RECEIVER_PAR_SERVERS
- name: BACKUP_RECEIVER_IMPAR_SERVERS
- name: BACKUP_RECEIVER_SERVERS
- name: BACKUP_ENGINE_PAR_SERVERS
- name: BACKUP_ENGINE_IMPAR_SERVERS
- name: BACKUP_ENGINE_SERVERS
- name: BACKUP_PUBLISHER_PAR_SERVERS
- name: BACKUP_PUBLISHER_IMPAR_SERVERS
- name: BACKUP_PUBLISHER_SERVERS
- name: BACKUP_COLLECTOR_PAR_SERVERS
- name: BACKUP_COLLECTOR_IMPAR_SERVERS
- name: BACKUP_COLLECTOR_SERVERS
- name: BACKUP_CONFIGURATIONMANAGER_SERVERS
- name: BACKUP_ZOOKEEPER_SERVERS
- name: BACKUP_KAFKA_SERVERS
- name: BACKUP_QUEUEMANAGER_SERVERS
- name: BACKUP_ENRICHER_SERVERS

steps:
  - ${{ if contains(parameters.components_to_install, 'receivers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Backup NOF Receiver - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Backup NOF Receiver - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Backup NOF Receiver - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Backup NOF Receiver - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.200 'cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/;chmod 0755 -R /opt/interfaces/nof/bin;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ if ne(parameters.BACKUP_RECEIVER_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.BACKUP_RECEIVER_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup NOF Receiver - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - nof <<EOF
                cp -f /opt/interfaces/nof/backup-bundles-$(currentDate)/*.jar /opt/interfaces/nof/bin/
                chmod 0755 -R /opt/interfaces/nof/bin
                EOF
  - ${{ elseif contains(parameters.components_to_install, 'engines') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Backup NOF Engine - 2"
