  - ${{ if contains(parameters.components_to_install, 'receivers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Backup NOF Receiver - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-$(currentDate);chmod 0755 -R /opt/interfaces/nof/backup-bundles-$(currentDate);' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Backup NOF Receiver - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-$(currentDate);chmod 0755 -R /opt/interfaces/nof/backup-bundles-$(currentDate);' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Backup NOF Receiver - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-$(currentDate);chmod 0755 -R /opt/interfaces/nof/backup-bundles-$(currentDate);' 2>&1 | grep -v "cannot find name for group ID" &
