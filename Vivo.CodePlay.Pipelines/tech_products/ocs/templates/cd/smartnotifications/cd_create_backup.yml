      - ${{ each service_connection in split(parameters.BACKUP_COLLECTOR_PAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Backup NOF Collector - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              echo "##[error]: something gone wrong"
              cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-par-$(currentDate)
              chmod 0755 -R /opt/interfaces/nof/backup-bundles-par-$(currentDate)
              EOF
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - ${{ each service_connection in split(parameters.BACKUP_COLLECTOR_IMPAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Backup NOF Collector - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            runOptions: inline
            failOnStdErr: false
            interactiveSession: true
            inline: |
