            ssh NOF@10.240.3.200 'cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-$(currentDate);chmod 0755 -R /opt/interfaces/nof/backup-bundles-$(currentDate);' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ if ne(parameters.BACKUP_RECEIVER_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.BACKUP_RECEIVER_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup NOF Receiver - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - nof <<EOF
                cp -R /opt/interfaces/nof/bin /opt/interfaces/nof/backup-bundles-$(currentDate)
                chmod 0755 -R /opt/interfaces/nof/backup-bundles-$(currentDate)
                EOF
  - ${{ elseif contains(parameters.components_to_install, 'engines') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
