parameters:
  - name: components_to_install
  - name: version_to_install
  - name: qa_environment
  - name: currentDate
  - name: START_RECEIVER_PAR_SERVERS
  - name: START_RECEIVER_IMPAR_SERVERS
  - name: START_RECEIVER_SERVERS
  - name: START_ENGINE_PAR_SERVERS
  - name: START_ENGINE_IMPAR_SERVERS
  - name: START_ENGINE_SERVERS
  - name: START_PUBLISHER_PAR_SERVERS
  - name: START_PUBLISHER_IMPAR_SERVERS
  - name: START_PUBLISHER_SERVERS
  - name: START_COLLECTOR_PAR_SERVERS
  - name: START_COLLECTOR_IMPAR_SERVERS
  - name: START_COLLECTOR_SERVERS
  - name: START_CONFIGURATIONMANAGER_SERVERS
  - name: START_ZOOKEEPER_SERVERS
  - name: START_KAFKA_SERVERS
  - name: START_QUEUEMANAGER_SERVERS
  - name: START_ENRICHER_SERVERS

steps:
  - ${{ if contains(parameters.components_to_install, 'receivers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Starting NOF Receiver - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh receiver 2 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Receiver - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh receiver 4 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.159 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 1 1902;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.161 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 2 1903;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.163 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 3 1904;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.165 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 4 1905;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Starting NOF Receiver - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh receiver 1 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Receiver - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.200 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh receiver 3 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.159 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 1 1902;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.161 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 2 1903;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.163 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 3 1904;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Collector - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh nof@10.238.50.165 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-collector.sh 4 1905;sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.START_RECEIVER_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Receiver ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-nof-deploy.sh receiver ${{ split(service_connection, '|')[1] }} ${{ parameters.version_to_install }}
              sleep 90
              EOF
      - ${{ each service_connection in split(parameters.START_COLLECTOR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-collector-deploy.sh ${{ split(service_connection, '|')[1] }} ${{ split(service_connection, '|')[2] }} ${{ parameters.version_to_install }}
              sleep 90
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'engines') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Starting NOF Engine - 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.185 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh engine 2 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Engine - 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.201 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh engine 4 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Starting NOF Engine - 1"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.184 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh engine 1 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &
      - task: SSH@0
        displayName: "Starting NOF Engine - 3"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.200 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh engine 3 ${{ parameters.version_to_install }};sleep 45;' 2>&1 | grep -v "cannot find name for group ID" &            
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.START_ENGINE_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Engine ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-nof-deploy.sh engine ${{ split(service_connection, '|')[1] }} ${{ parameters.version_to_install }}
              sleep 90
              sh /opt/interfaces/nof/scripts/start-nof-deploy.sh smart-notif ${{ split(service_connection, '|')[1] }} ${{ parameters.version_to_install }}
              sleep 90
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'publishers') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - task: SSH@0
        displayName: "Starting NOF Publisher - 3 e 4"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.175 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 3 ${{ parameters.version_to_install }};sleep 45;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 4 ${{ parameters.version_to_install }};sleep 45;' 2>/dev/null &
      - task: SSH@0
        displayName: "Starting NOF Publisher - 7 e 8"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.3.183 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 7 ${{ parameters.version_to_install }};sleep 45;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 8 ${{ parameters.version_to_install }};sleep 45;' 2>/dev/null &
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - task: SSH@0
        displayName: "Starting NOF Publisher - 1 e 2"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.174 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 1 ${{ parameters.version_to_install }};sleep 45;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 2 ${{ parameters.version_to_install }};sleep 45;' 2>/dev/null &
      - task: SSH@0
        displayName: "Starting NOF Publisher - 5 e 6"
        inputs:
          sshEndpoint: cruzeta_monitoria
          runOptions: inline
          failOnStdErr: false
          inline: |
            ssh NOF@10.240.2.176 'source /home/NOF/.bash_profile 2>/dev/null;source /home/nof/.bash_profile 2>/dev/null;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 5 ${{ parameters.version_to_install }};sleep 45;sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher 6 ${{ parameters.version_to_install }};sleep 45;' 2>/dev/null &
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.START_PUBLISHER_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Publisher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-nof-deploy.sh publisher ${{ split(service_connection, '|')[1] }} ${{ parameters.version_to_install }}
              sleep 90
              EOF
  - ${{ elseif contains(parameters.components_to_install, 'collectors') }}:
    - ${{ if contains(parameters.qa_environment, 'producao_par') }}:
      - ${{ each service_connection in split(parameters.START_COLLECTOR_PAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-collector-deploy.sh ${{ split(service_connection, '|')[1] }} ${{ split(service_connection, '|')[2] }} ${{ parameters.version_to_install }}
              sleep 90
              exit
              EOF
    - ${{ elseif contains(parameters.qa_environment, 'producao_impar') }}:
      - ${{ each service_connection in split(parameters.START_COLLECTOR_IMPAR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-collector-deploy.sh ${{ split(service_connection, '|')[1] }} ${{ split(service_connection, '|')[2] }}  ${{ parameters.version_to_install }}
              sleep 90
              exit
              EOF
    - ${{ else }}:
      - ${{ each service_connection in split(parameters.START_COLLECTOR_SERVERS,',') }}:
        - task: SSH@0
          displayName: "Starting NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
          inputs:
            sshEndpoint: ${{ split(service_connection, '|')[0] }}
            runOptions: inline
            failOnStdErr: true
            inline: |
              sudo su - nof 2> >(grep -v "cannot find name for group ID" >&2) <<EOF
              source /home/NOF/.bash_profile 2>/dev/null
              source /home/nof/.bash_profile 2>/dev/null
              sh /opt/interfaces/nof/scripts/start-collector.sh ${{ split(service_connection, '|')[1] }} ${{ split(service_connection, '|')[2] }}
              sleep 90
              EOF
  - ${{ else }}:
    - ${{ each service_connection in split(parameters.START_CONFIGURATIONMANAGER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Configuration Manager ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh configuration-manager ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_ZOOKEEPER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Zookeeper ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-zookeeper.sh ${{ split(service_connection, '|')[2] }} ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_KAFKA_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Kafka ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
