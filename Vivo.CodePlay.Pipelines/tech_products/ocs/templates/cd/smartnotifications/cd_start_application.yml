          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-kafka.sh ${{ split(service_connection, '|')[2] }} ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_QUEUEMANAGER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Queue Manager ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh queue-manager ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_ENRICHER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Enricher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh enricher ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_RECEIVER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Receiver ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh receiver ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_ENGINE_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Engine ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh engine ${{ split(service_connection, '|')[1] }}
            sleep 90
            sh /opt/interfaces/nof/scripts/start-nof.sh smart-notif ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_PUBLISHER_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Publisher ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-nof.sh publisher ${{ split(service_connection, '|')[1] }}
            sleep 90
    - ${{ each service_connection in split(parameters.START_COLLECTOR_SERVERS,',') }}:
      - task: SSH@0
        displayName: "Starting NOF Collector ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
        inputs:
          sshEndpoint: ${{ split(service_connection, '|')[0] }}
          runOptions: inline
          failOnStdErr: true
          inline: |
            source /home/NOF/.bash_profile 2>/dev/null
            source /home/nof/.bash_profile 2>/dev/null
            sh /opt/interfaces/nof/scripts/start-collector.sh ${{ split(service_connection, '|')[1] }} ${{ split(service_connection, '|')[2] }}
            sleep 90