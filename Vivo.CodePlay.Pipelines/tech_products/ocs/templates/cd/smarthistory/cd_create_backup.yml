parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: MAIN_SERVERS
- name: COMMONS_SERVERS
- name: MODELS_SERVERS
- name: CLIENT_ID
- name: CLIENT_SECRET
- name: CREDENTIAL_ID
- name: SMART_KEY
- name: USER 

steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - task: GetCredentialsSenhaSegura@1
      displayName: 'Get Credentials Senha Segura'
      name: get_credentials
      inputs:
        clientId: ${{ parameters.CLIENT_ID }}
        clientSecret: ${{ parameters.CLIENT_SECRET }}
        credentialId: ${{ parameters.CREDENTIAL_ID }}
        SenhaSeguraEndpoint: 'https://10.238.69.35'
        #SenhaSeguraEndpoint: 'https://10.128.62.35'
        #SenhaSeguraEndpoint: 'https://10.243.17.35'
        #SenhaSeguraEndpoint: 'https://urano.redecorp.br'
        usernameVariable: 'SENHA_SEGURA_USERNAME'
        passwordVariable: 'SENHA_SEGURA_PASSWORD'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
        #HTTPS_PROXY: "http://10.240.58.39:3128"

    - task: DownloadSecureFile@1
      name: senhaSeguraKey
      displayName: Download Smart Key
      inputs:
        secureFile: ${{ parameters.SMART_KEY }}


    - task: Bash@3
      displayName: 'Decrypt Password'
      name: get_token
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          echo "Username: $(get_credentials.SENHA_SEGURA_USERNAME)"
          DECRYPTED_PASSWORD=$(echo -n $(get_credentials.SENHA_SEGURA_PASSWORD) | base64 -d --ignore-garbage | openssl rsautl -decrypt -inkey $(senhaSeguraKey.secureFilePath) -oaep)
          echo "##vso[task.setvariable variable=DECRYPTED_PASSWORD;]$DECRYPTED_PASSWORD"

    - task: Bash@3
      displayName: 'Show Password'
      name: show_password
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          echo "Decrypted password: $(DECRYPTED_PASSWORD)"

    - task: UpdateCredentialsEndpointSshFromVivo@4
      displayName: "Update Service Connection"
      inputs:
        sshEndpoint: ${{ parameters.MAIN_SERVERS }}
        username: $(get_credentials.SENHA_SEGURA_USERNAME)
        password: $(DECRYPTED_PASSWORD)
      env:
        HTTPS_PROXY: "http://10.240.58.39:3128"
        PAT: $(AZURE_DEVOPS_PAT)


    - task: Bash@3
      displayName: 'Delay for 5 seconds'    
      inputs:
        targetType: inline
        script: |
          echo "Waiting for 5 seconds..."
          sleep 5  
        
    - ${{ if contains(parameters.components_to_install, 'main') }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ elseif contains(parameters.components_to_install, 'commons') }}:
      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ elseif contains(parameters.components_to_install, 'models') }}:
      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ else }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF
  - ${{ else }}:
    - ${{ if contains(parameters.components_to_install, 'main') }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Backup Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/backup_smart_history_main.sh ${{ parameters.qa_environment }}

      - ${{ elseif contains(parameters.components_to_install, 'commons') }}:
        - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Backup Smart History - COMMONS - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/backup_smart_history_commons.sh ${{ parameters.qa_environment }}

      - ${{ elseif contains(parameters.components_to_install, 'models') }}:
        - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Backup Smart History - MODELS - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/backup_smart_history_models.sh ${{ parameters.qa_environment }}

      - ${{ else }}:
        - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Backup Smart History - MAIN - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/backup_smart_history_main.sh ${{ parameters.qa_environment }}

        - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Backup Smart History - COMMONS - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/backup_smart_history_commons.sh ${{ parameters.qa_environment }}

        - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Backup Smart History - MODELS - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/backup_smart_history_models.sh ${{ parameters.qa_environment }}
