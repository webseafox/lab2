parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: MAIN_SERVERS
- name: COMMONS_SERVERS
- name: MODELS_SERVERS
- name: USER
- name: FORCE_ROLLBACK


steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - ${{ if eq(parameters.FORCE_ROLLBACK, 1) }}:
      - script: |
          echo "This is a forced error"
          exit 1
        displayName: 'Force error in Bash' 
    - ${{ else }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Starting Smart History - MAIN ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
            inputs:
              sshEndpoint: ${{ split(service_connection, '|')[0] }}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/start_smart_history_application.sh ${{ parameters.qa_environment }}
                EOF

  - ${{ else }}:
    - ${{ if eq(parameters.FORCE_ROLLBACK, 1) }}:
      - script: |
          echo "This is a forced error"
          exit 1
        displayName: 'Force error in Bash' 
    - ${{ else }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Starting Smart History - MAIN ${{ split(service_connection, '|')[1] }} - ${{ split(service_connection, '|')[0] }}"
            inputs:
              sshEndpoint: ${{ split(service_connection, '|')[0] }}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/start_smart_history_application.sh ${{ parameters.qa_environment }}
