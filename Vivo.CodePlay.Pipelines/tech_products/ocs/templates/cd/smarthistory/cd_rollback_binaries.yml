parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: MAIN_SERVERS
- name: COMMONS_SERVERS
- name: MODELS_SERVERS
- name: USER

steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - ${{ if contains(parameters.components_to_install, 'main') }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ elseif contains(parameters.components_to_install, 'commons') }}:
      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ elseif contains(parameters.components_to_install, 'models') }}:
      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ else }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF

  - ${{ else }}:
    - ${{ if contains(parameters.components_to_install, 'main') }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MAIN - ${{parameters.MAIN_SERVERS}}"
            inputs:
              sshEndpoint: ${{ parameters.MAIN_SERVERS }}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_main.sh ${{ parameters.qa_environment }}

    - ${{ elseif contains(parameters.components_to_install, 'commons') }}:
      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_commons.sh ${{ parameters.qa_environment }}

    - ${{ elseif contains(parameters.components_to_install, 'models') }}:
      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_models.sh ${{ parameters.qa_environment }}

    - ${{ else }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MAIN - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_main.sh ${{ parameters.qa_environment }}

      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - COMMONS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_commons.sh ${{ parameters.qa_environment }}

      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Rollback Smart History - MODELS - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/rollback_smart_history_models.sh ${{ parameters.qa_environment }}
