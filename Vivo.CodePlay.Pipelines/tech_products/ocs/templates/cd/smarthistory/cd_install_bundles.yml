parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: MAIN_SERVERS
- name: COMMONS_SERVERS
- name: MODELS_SERVERS
- name: USER

steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
      - task: SSH@0
        displayName: " Clean Target Folder  - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sudo su - $(user) <<EOF
              set -e
              trap 'echo "Error during execution"; exit 1' ERR
              rm -rf /opt/eisa/devops_smarthistory/deployments/*
              chmod 777 /opt/eisa/devops_smarthistory/deployments
            EOF
      - task: CopyFilesOverSSH@0
        displayName: "Copy Package to Smart History - MAIN - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          sourceFolder: $(System.ArtifactsDirectory)/bundles
          contents: 'bundles.tar'
          targetFolder: '/opt/eisa/devops_smarthistory/deployments'
      - task: SSH@0
        displayName: " Unpack bundles to install - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sudo su - $(user) <<EOF
              sh /opt/eisa/devops_smarthistory/unpack_bundles.sh ${{ parameters.qa_environment }}
            EOF
    - ${{ if contains(parameters.components_to_install, 'main') }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ if and(not(contains(parameters.components_to_install, 'main')), contains(parameters.components_to_install, 'commons')) }}:
      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ if and(not(contains(parameters.components_to_install, 'main')), not(contains(parameters.components_to_install, 'commons')), contains(parameters.components_to_install, 'models')) }}:
      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF

    - ${{ if and(not(contains(parameters.components_to_install, 'main')), not(contains(parameters.components_to_install, 'commons')), not(contains(parameters.components_to_install, 'models'))) }}:
      - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_main.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_commons.sh ${{ parameters.qa_environment }}
                EOF

      - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                sudo su - $(user) <<EOF
                  sh /opt/eisa/devops_smarthistory/install_smart_history_models.sh ${{ parameters.qa_environment }}
                EOF

  - ${{ else }}:
    - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
      - task: SSH@0
        displayName: " Clean Target Folder  - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          runOptions: inline
          failOnStdErr: false
          inline: |
              set -e
              trap 'echo "Error during execution"; exit 1' ERR
              rm -rf /opt/eisa/devops_smarthistory/deployments/*
              chmod 777 /opt/eisa/devops_smarthistory/deployments
      
      - task: CopyFilesOverSSH@0
        displayName: "Copy Package to Smart History - MAIN - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          sourceFolder: $(System.ArtifactsDirectory)/bundles
          contents: 'bundles.tar'
          targetFolder: '/opt/eisa/devops_smarthistory/deployments'

      - task: SSH@0
        displayName: " Unpack bundles to install - ${{service_connection}}"
        inputs:
          sshEndpoint: ${{service_connection}}
          runOptions: inline
          failOnStdErr: false
          inline: |
              sh /opt/eisa/devops_smarthistory/unpack_bundles.sh ${{ parameters.qa_environment }}
      
      - ${{ if contains(parameters.components_to_install, 'main') }}:
          - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
            - task: SSH@0
              displayName: "Execute install bundle - ${{parameters.MAIN_SERVERS}}"
              inputs:
                sshEndpoint: ${{ parameters.MAIN_SERVERS }}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/install_smart_history_main.sh ${{ parameters.qa_environment }}

      - ${{ if and(not(contains(parameters.components_to_install, 'main')), contains(parameters.components_to_install, 'commons')) }}:
        - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Execute install bundle - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/install_smart_history_commons.sh ${{ parameters.qa_environment }}

      - ${{ if and(not(contains(parameters.components_to_install, 'main')), not(contains(parameters.components_to_install, 'commons')), contains(parameters.components_to_install, 'models')) }}:
        - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
            - task: SSH@0
              displayName: "Execute install bundle - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/install_smart_history_models.sh ${{ parameters.qa_environment }}

      - ${{ if and(not(contains(parameters.components_to_install, 'main')), not(contains(parameters.components_to_install, 'commons')), not(contains(parameters.components_to_install, 'models'))) }}:
        - ${{ if ne(parameters.MAIN_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.MAIN_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Execute install bundle - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/install_smart_history_main.sh ${{ parameters.qa_environment }}

        - ${{ if ne(parameters.COMMONS_SERVERS, '') }}:
          - ${{ each service_connection in split(parameters.COMMONS_SERVERS,',') }}:
            - task: SSH@0
              displayName: "Execute install bundle - ${{service_connection}}"
              inputs:
                sshEndpoint: ${{service_connection}}
                runOptions: inline
                failOnStdErr: false
                inline: |
                    sh /opt/eisa/devops_smarthistory/install_smart_history_commons.sh ${{ parameters.qa_environment }}

        - ${{ if ne(parameters.MODELS_SERVERS, '') }}:
        - ${{ each service_connection in split(parameters.MODELS_SERVERS,',') }}:
          - task: SSH@0
            displayName: "Execute install bundle - ${{service_connection}}"
            inputs:
              sshEndpoint: ${{service_connection}}
              runOptions: inline
              failOnStdErr: false
              inline: |
                  sh /opt/eisa/devops_smarthistory/install_smart_history_models.sh ${{ parameters.qa_environment }}
