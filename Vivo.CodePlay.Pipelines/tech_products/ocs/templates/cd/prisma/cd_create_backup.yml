parameters:
- name: service_connection
- name: backup_datetime
- name: deploy_app_folder

steps:
  - task: SSH@0
    displayName: "Backup Full"
    inputs:
      sshEndpoint: ${{ parameters.service_connection }}
      runOptions: inline
      failOnStdErr: false
      inline: |
        $(deploy_app_folder)/prisma_azuredevops_backup_env.sh $(backup_datetime)
  - script: |
      #!/bin/bash        
      echo "##vso[task.setvariable variable=backup_datetime;isOutput=true]$(backup_datetime)"
      echo "##[debug] Exporting variable 'backup_datetime': $(backup_datetime)"
    name: set_backup_datetime