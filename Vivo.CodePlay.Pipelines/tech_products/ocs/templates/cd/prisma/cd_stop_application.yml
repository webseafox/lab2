parameters:
- name: qa_environment
- name: service_connection
- name: deploy_app_folder 

steps:
  - task: SSH@0
    displayName: "Stop Karaf"
    inputs:
      sshEndpoint: ${{ parameters.service_connection }}
      runOptions: inline
      failOnStdErr: false
      inline: |
        $(deploy_app_folder)/prisma_azuredevops_stop_karaf.sh
        sleep 20
  - task: SSH@0
    displayName: "Drop Mongo Database"
    inputs:
      sshEndpoint: ${{ parameters.service_connection }}
      runOptions: inline
      failOnStdErr: false
      inline: |
        $(deploy_app_folder)/prisma_azuredevops_drop_mongo_database.sh
        sleep 10
  - task: SSH@0
    displayName: "Clean Env"
    inputs:
      sshEndpoint: ${{ parameters.service_connection }}
      runOptions: inline
      failOnStdErr: false
      inline: |
        $(deploy_app_folder)/prisma_azuredevops_clean_bin.sh
        sleep 10