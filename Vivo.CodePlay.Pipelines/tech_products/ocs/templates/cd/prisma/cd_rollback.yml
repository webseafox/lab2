parameters:
- name: service_connection
- name: backup_datetime
- name: deploy_app_folder

steps:
  - task: SSH@0
    displayName: "Rollback configurations and artifacts"
    inputs:
      sshEndpoint: ${{ parameters.service_connection }}
      runOptions: inline
      failOnStdErr: false
      inline: |
        $(deploy_app_folder)/prisma_azuredevops_rollback.sh $(backup_datetime)
        sleep 5