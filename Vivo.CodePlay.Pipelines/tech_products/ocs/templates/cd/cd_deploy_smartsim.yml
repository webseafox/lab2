                    - task: GetCredentialsSenhaSegura@1
                      displayName: 'Get Credentials Senha Segura'
                      name: get_credentials_${{split(service_connection, '|')[0]}}
                      inputs:
                        clientId: 'b0b8aecf3534fb7f8367fa8b0c553947'
                        clientSecret: '90db4470f1a0c0adb8b197109ba796647b7ae5568c45d3ee74cbbed7ec509774'
                        credentialId: ${{ split(service_connection, '|')[1] }}
                        SenhaSeguraEndpoint: 'https://10.238.69.35'
                        #SenhaSeguraEndpoint: 'https://10.128.62.35'
                        #SenhaSeguraEndpoint: 'https://10.243.17.35'
                        #SenhaSeguraEndpoint: 'https://urano.redecorp.br'
                        usernameVariable: 'SENHA_SEGURA_USERNAME'
                        passwordVariable: 'SENHA_SEGURA_PASSWORD'
                      env:
                        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
