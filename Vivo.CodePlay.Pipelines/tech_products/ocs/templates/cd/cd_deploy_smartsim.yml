                        inline: |
                          sudo su - ${{USER}}
                          cp /opt/smartsim/bin/ctr-smart-sim-provisioners-*.jar /opt/smartsim/backup-bundles-data
                          chmod 0755 -R /opt/smartsim/backup-bundles-data
                - ${{ elseif contains(parameters.qa_environment, 'producao_par') }}:
                  - ${{ each service_connection in split(variables.PROVISIONER_SERVERS_PAR,',') }}:
                    - task: SSH@0
                      displayName: "Backup Provisioners - ${{service_connection}}"
                      inputs:
                        sshEndpoint: ${{service_connection}}
                        runOptions: inline
                        failOnStdErr: false
                        inline: |
                          sudo su - ${{USER}}
                          cp /opt/smartsim/bin/ctr-smart-sim-provisioners-*.jar /opt/smartsim/backup-bundles-data
                          chmod 0755 -R /opt/smartsim/backup-bundles-data
                - ${{ else }}:    
                  - ${{ each service_connection in split(variables.PROVISIONER_SERVERS,',') }}:
