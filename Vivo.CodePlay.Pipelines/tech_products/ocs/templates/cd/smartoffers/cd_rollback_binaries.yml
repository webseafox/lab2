parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: ENGINE_SERVERS

steps:
  - ${{ each service_connection in split(parameters.ENGINE_SERVERS,',') }}:
    - task: SSH@0
      displayName: "Backup Smart Offers - ${{service_connection}}"
      inputs:
        sshEndpoint: ${{service_connection}}
        runOptions: inline
        failOnStdErr: false
        inline: |
          cp -f /opt/ptin/acm/lib/backup-bundles-$(currentDate)/*.jar /opt/ptin/acm/lib/eng/
          
          for file in $(echo ${{parameters.components_to_install}} | tr "," "\n")
          do
            rm -f /opt/ptin/acm/lib/eng/$file
          done

          chmod 0755 -R /opt/ptin/acm/lib/eng