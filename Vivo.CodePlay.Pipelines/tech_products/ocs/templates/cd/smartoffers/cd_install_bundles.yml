parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: ENGINE_SERVERS

steps:
    - ${{ each service_connection in split(parameters.ENGINE_SERVERS,',') }}:
        - task: CopyFilesOverSSH@0
          displayName: "Copy Package to Bundles Offers - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            sourceFolder: $(System.ArtifactsDirectory)/bundles
            contents: 'bundles.tar'
            targetFolder: '/opt/ptin/acm/lib/eng'
        - task: SSH@0
          displayName: "Execute install Bundles Offers - ${{service_connection}}"
          inputs:
            sshEndpoint: ${{service_connection}}
            runOptions: inline
            failOnStdErr: false
            inline: |
              tar -xvf /opt/ptin/acm/lib/eng/bundles.tar -C /opt/ptin/acm/lib/eng/ --warning=no-timestamp
              chmod 0755 -R /opt/ptin/acm/lib/eng