parameters:
- name: components_to_install
- name: qa_environment
- name: currentDate
- name: ENGINE_SERVERS

steps:
  - ${{ each service_connection in split(parameters.ENGINE_SERVERS,',') }}:
    - task: SSH@0
      displayName: "Backup Bundles Offers - ${{service_connection}}"
      inputs:
        sshEndpoint: ${{service_connection}}
        runOptions: inline
        failOnStdErr: false
        inline: |
          cp -R /opt/ptin/acm/lib/eng /opt/ptin/acm/lib/backup-bundles-$(currentDate)
          chmod 0755 -R /opt/ptin/acm/lib/backup-bundles-$(currentDate)