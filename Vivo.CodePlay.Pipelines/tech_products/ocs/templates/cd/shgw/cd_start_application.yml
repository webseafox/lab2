parameters:
  - name: qa_environment
  - name: service_connection
  - name: deploy_app_folder
  - name: user

steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - task: SSH@0
      displayName: "Start Karaf"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e
          $(deploy_app_folder)/prisma_azuredevops_start_karaf.sh
          sleep 90
          EOF

    - task: SSH@0
      displayName: "Load Configs"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e  
          $(deploy_app_folder)/shgw_azuredevops_load_configs.sh
          sleep 60
          EOF

  - ${{ else }}:  
    - task: SSH@0
      displayName: "Start Karaf"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          set -e
          $(deploy_app_folder)/prisma_azuredevops_start_karaf.sh
          sleep 90

    - task: SSH@0
      displayName: "Load Configs"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          $(deploy_app_folder)/shgw_azuredevops_load_configs.sh
          sleep 60