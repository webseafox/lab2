parameters:
- name: qa_environment
- name: service_connection
- name: deploy_app_folder
- name: user 
- name: components_to_install
- name: version_to_install

steps:
  - ${{ if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - task: SSH@0
      displayName: "Stop Karaf"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e
          $(deploy_app_folder)/prisma_azuredevops_stop_karaf.sh
          sleep 20
          EOF

    - task: SSH@0
      displayName: "Drop Mongo Database"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e
          $(deploy_app_folder)/prisma_azuredevops_drop_mongo_database.sh
          sleep 10
          EOF

    - task: SSH@0
      displayName: "Clean Env"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e
          $(deploy_app_folder)/prisma_azuredevops_clean_bin.sh ${{parameters.version_to_install}} ${{parameters.components_to_install}} 
          sleep 10
          EOF

  - ${{ else }}:
    - task: SSH@0
      displayName: "Stop Karaf"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          set -e
          $(deploy_app_folder)/prisma_azuredevops_stop_karaf.sh
          sleep 20

    - task: SSH@0
      displayName: "Drop Mongo Database"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          set -e
          $(deploy_app_folder)/prisma_azuredevops_drop_mongo_database.sh
          sleep 10

    - task: SSH@0
      displayName: "Clean Env"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          set -e
          $(deploy_app_folder)/prisma_azuredevops_clean_bin.sh ${{parameters.version_to_install}} ${{parameters.components_to_install}} 
          sleep 10
