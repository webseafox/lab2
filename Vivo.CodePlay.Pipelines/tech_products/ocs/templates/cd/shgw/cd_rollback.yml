parameters:
- name: service_connection
- name: backup_datetime
- name: deploy_app_folder
- name: user
- name: qa_environment

steps:
  - ${{if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - task: SSH@0
      displayName: "Rollback configurations and artifacts"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          sudo su - $(user) <<EOF
          set -e
          $(deploy_app_folder)/prisma_azuredevops_rollback.sh ${{parameters.backup_datetime}}
          EOF
          sleep 5

  - ${{ else }}:
    - task: SSH@0
      displayName: "Rollback configurations and artifacts"
      inputs:
        sshEndpoint: ${{ parameters.service_connection }}
        runOptions: inline
        failOnStdErr: false
        inline: |
          set -e
          $(deploy_app_folder)/prisma_azuredevops_rollback.sh ${{parameters.backup_datetime}}
          sleep 5