parameters:
- name: version_to_install
- name: service_connection
- name: deploy_app_folder
- name: user
- name: FORCE_ROLLBACK
- name: qa_environment

steps:
  - ${{if or(or(contains(parameters.qa_environment, 'esteira1'), contains(parameters.qa_environment, 'esteira2')), or (contains(parameters.qa_environment, 'prodlike'), contains(parameters.qa_environment, 'preprod'))) }}:
    - ${{ if eq(parameters.FORCE_ROLLBACK, 1) }}:
      - script: |
          echo "This is a forced error"
          exit 1
        displayName: 'Force error in Bash' 
    - ${{ else }}:  
      - task: CopyFilesOverSSH@0
        displayName: "Copy Package to Server"
        inputs:
          sshEndpoint: ${{ parameters.service_connection }}
          sourceFolder: $(System.ArtifactsDirectory)/bundles
          contents: "bundles.tar"
          targetFolder: "$(deploy_app_folder)/azure_binarios"

      - task: SSH@0
        displayName: "Execute install bundle"
        inputs:
          sshEndpoint: ${{ parameters.service_connection }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            sudo su - $(user) <<EOF
            set -e
            $(deploy_app_folder)/prisma_azuredevops_deploy.sh ${{parameters.version_to_install}} $(deploy_app_folder)/azure_binarios
            EOF

  - ${{ else }}:
    - ${{ if eq(parameters.FORCE_ROLLBACK, 1) }}:
      - script: |
          echo "This is a forced error"
          exit 1
        displayName: 'Force error in Bash' 
    - ${{ else }}:  
      - task: CopyFilesOverSSH@0
        displayName: "Copy Package to Server"
        inputs:
          sshEndpoint: ${{ parameters.service_connection }}
          sourceFolder: $(System.ArtifactsDirectory)/bundles
          contents: "bundles.tar"
          targetFolder: "$(deploy_app_folder)/azure_binarios"

      - task: SSH@0
        displayName: "Execute install bundle"
        inputs:
          sshEndpoint: ${{ parameters.service_connection }}
          runOptions: inline
          failOnStdErr: false
          inline: |
            set -e
            $(deploy_app_folder)/prisma_azuredevops_deploy.sh ${{parameters.version_to_install}} $(deploy_app_folder)/azure_binarios