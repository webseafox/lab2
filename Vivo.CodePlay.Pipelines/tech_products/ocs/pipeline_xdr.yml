parameters:
  - name: environment
    type: string
  - name: skip_deploy
    type: boolean
    default: false

variables:
  - template: /tech_products/ocs/initialize/variables_global.yml
  - template: /tech_products/ocs/initialize/variables_weblogic_osgi.yml
  - template: /.azuredevops/config/${{ parameters.environment }}/server01_variables.yml@self
  - template: /.azuredevops/config/${{ parameters.environment }}/environments_variables.yml@self
  - group: "${{ variables['Build.DefinitionName'] }}"
  - name: PRIVATE_AGENT_DEFAULT
    value: GeneralPurposeLinuxAgentsCD

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines      

stages:
  - template: /tech_products/ocs/templates/ci/ci_build_xdr.yml
  #-> Gates for CI
  - template: /tech_products/ocs/templates/ci/ci_gates_xdr.yml
    parameters:
      environment: ${{ parameters.environment }}
  
  ##-> Security for CI - Weblogic
  - template: /tech_products/ocs/templates/ci/ci_security_weblogic_osgi.yml
    #parameters:
      #fortifyExclusionRepository: FortifyExclusion
  
  - template: /tech_products/ocs/templates/ci/ci_package_xdr.yml  
  
  - template: /tech_products/ocs/templates/cd/cd_deploy_xdr.yml
    parameters:
      qa_environment: ${{ parameters.environment }}
      skip_deploy: ${{ parameters.skip_deploy }}