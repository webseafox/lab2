## -> Parameters:
parameters:
  - name: environment
    type: string
    default: ''
  - name: infrastructureType
    type: string
    default: 'ACR-ALETEIA'
  - name: skipComponentTest
    type: boolean
    default: False
  - name: skipPackage
    type: boolean
    default: False
  - name: skipDeploy
    type: boolean
    default: False
  - name: packageVersion
    type: string
    default: ''
  - name: deployAppsettings
    type: boolean
    default: False

## -> Resources:
resources:
  repositories:

    ## -> Fortify
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    ## -> OSSD Repository
    - repository: OSSDevOpsHelm
      name: 'OSSD - OSS DEVOPS/helm-oss-default'
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: OSSDevOpsSettings
      name: 'OSSD - OSS DEVOPS/settings-oss-default'
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: OSSDevOpsWeblogic
      name: 'OSSD - OSS DEVOPS/weblogic-oss-default'
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: OSSDevOpsExclusions
      name: 'OSSD - OSS DEVOPS/exclusions-oss-default'
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: OSSDevOpsHosts
      name: 'OSSD - OSS DEVOPS/hosts-oss-default'
      type: git
      ref: refs/heads/master
      endpoint: CodePlay

## -> Initialize global variables
variables:
  - group: azdo-team-project-variables
  - template: /tech_products/oss/initialize/variables_global.yml
  - template: /tech_products/oss/initialize/variables_java.yml
  - template: /tech_products/oss/initialize/variables_gates.yml
  - template: /tech_products/oss/initialize/variables_docker.yml
  ## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
  ## -> Use this to change the variables on runtime
  - group: "${{ variables['Build.Repository.Name'] }}"
  - template: /tech_products/oss/initialize/variables_azure_function.yml
    parameters:
      environment: "${{ parameters.environment }}"
      skipDeploy: "${{ parameters.skipDeploy }}"
  - name: CORPORATE_WIKI_DOC_URL
    value: "TBD"

stages:

  ## -> Entrypoint
  ## -> Use CI-CD pipeline if no package version has been provided
  ## -> Use CD only pipeline if package version has been provided
  - ${{ if or(eq(parameters.packageVersion, ''), eq(parameters.packageVersion, 'none')) }}:
      - template: /tech_products/oss/pipeline_azure_function_java_oss_ci_cd.yml
        parameters:
          environment: "${{ variables.environment }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          skipComponentTest: "${{ parameters.skipComponentTest }}"
          deployAppsettings: "${{ parameters.deployAppsettings }}"
          servicePrincipalEnv: "${{ variables.SERVICE_PRINCIPAL_ENV }}"
          skipDeploy: "${{ parameters.skipDeploy }}"

  - ${{ else }}:
      - template: /tech_products/oss/pipeline_azure_function_java_oss_cd_only.yml
        parameters:
          environment: "${{ variables.environment }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          packageVersion: "${{ parameters.packageVersion }}"
          deployAppsettings: "${{ parameters.deployAppsettings }}"
          servicePrincipalEnv: "${{ variables.SERVICE_PRINCIPAL_ENV }}"
