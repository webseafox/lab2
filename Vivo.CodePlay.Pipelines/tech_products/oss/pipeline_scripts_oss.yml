## -> Parameters:
parameters:
- name: environment
  type: string
  default: ''
- name: infrastructureType
  type: string
  default: 'cloud'
- name: skipComponentTest
  type: boolean
  default: False
- name: skipPackage
  type: boolean
  default: False
- name: skipDeploy
  type: boolean
  default: False
- name: packageVersion
  type: string
  default: ''

## -> Resources:
resources:
  repositories:
 
  ## -> OSSD Repository
  - repository: OSSDevOpsHelm
    name: 'OSSD - OSS DEVOPS/helm-oss-default'
    type: git
    ref: refs/heads/master
    endpoint: CodePlay
  - repository: OSSDevOpsSettings
    name: 'OSSD - OSS DEVOPS/settings-oss-default'
    type: git
    ref: refs/heads/master
    endpoint: CodePlay
  - repository: OSSDevOpsWeblogic
    name: 'OSSD - OSS DEVOPS/weblogic-oss-default'
    type: git
    ref: refs/heads/master
    endpoint: CodePlay
  - repository: OSSDevOpsExclusions
    name: 'OSSD - OSS DEVOPS/exclusions-oss-default'
    type: git
    ref: refs/heads/master
    endpoint: CodePlay
    
## -> Initialize global variables
variables:

- template: /tech_products/oss/initialize/variables_global.yml
- template: /tech_products/oss/initialize/variables_java.yml
  
## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
## -> Use this to change the variables on runtime
- group: "${{ variables['Build.Repository.Name'] }}"

- name: CORPORATE_WIKI_DOC_URL
  value: "TBD"

stages:

  ## -> Initialize enviroment
  - template: /tech_products/oss/initialize/default_environment.yml
    parameters:
      packageVersion: "${{ parameters.packageVersion }}"
  
  ## -> Build for CI - Java
  - template: /tech_products/oss/templates/ci/ci_build_scripts_oss.yml

  ## -> Publish Build for CI - Scripts
  - template: /tech_products/oss/templates/ci/ci_publish_scripts_oss.yml