## -> Parameters:
parameters:
- name: environment
- name: infrastructureType
  type: string
  default: 'cloud'
- name: packageVersion
  type: string
  default: 'latest'
- name: legacy

## -> Parameters RBQA 
- name: rbqa_jira_id
  displayName: 'RBQA Jira ID'
  type: string
  default: '' 
- name: rbqa_component_test_id
  displayName: 'RBQA Component Test ID'
  type: string
  default: ''
- name: rbqa_octane_workspace
  displayName: 'RBQA Octane Workspace'
  type: string
  default: ''
- name: rbqa_docker_image
  displayName: 'RBQA Docker Image'
  type: string
  default: ''
- name: rbqa_octane_environment
  displayName: 'RBQA Octane Environment'
  type: string
  default: ''

stages:
## -> CD Orchestration
- template: /tech_products/oss/templates/cd/cd_deploy_only_orchestrator.yml
  parameters:
    environment: "${{ parameters.environment }}"
    infrastructureType: "${{ parameters.infrastructureType }}"
    packageVersion: "${{ parameters.packageVersion }}"
    legacy: "${{ parameters.legacy }}"
    buildType: 'gradle'
    
    ## -> Parameters RBQA
    rbqa_jira_id: "${{ parameters.rbqa_jira_id }}"
    rbqa_component_test_id: "${{ parameters.rbqa_component_test_id }}"
    rbqa_octane_workspace: "${{ parameters.rbqa_octane_workspace }}"
    rbqa_docker_image: "${{ parameters.rbqa_docker_image }}"
    rbqa_octane_environment: "${{ parameters.rbqa_octane_environment }}"
