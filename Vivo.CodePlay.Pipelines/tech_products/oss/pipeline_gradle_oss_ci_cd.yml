## -> Parameters:
parameters:
- name: environment
- name: buildEnvironment
- name: infrastructureType
- name: skipComponentTest
- name: skipPackage
- name: skipDeploy
- name: packageVersion
  type: string
  default: ''
- name: legacy
  type: boolean
  default: false  
- name: rbqa_jira_id
- name: rbqa_component_test_id
- name: rbqa_octane_workspace
- name: rbqa_docker_image
- name: rbqa_octane_environment

stages:

## -> CI/CD
## -> Orchestrator Call
- template: /tech_products/oss/templates/ci/ci_cd_orchestrator.yml
  parameters:
    buildType: 'gradle'
    buildEnvironment: "${{ parameters.buildEnvironment }}"
    environment: "${{ parameters.environment }}"
    infrastructureType: "${{ parameters.infrastructureType }}"
    skipComponentTest: "${{ parameters.skipComponentTest }}"
    skipPackage: "${{ parameters.skipPackage }}"
    skipDeploy: "${{ parameters.skipDeploy }}"
    packageVersion: "${{ parameters.packageVersion }}"
    legacy: "${{ parameters.legacy }}"
    rbqa_jira_id: "${{ parameters.rbqa_jira_id }}"
    rbqa_component_test_id: "${{ parameters.rbqa_component_test_id }}"
    rbqa_octane_workspace: "${{ parameters.rbqa_octane_workspace }}"
    rbqa_docker_image: "${{ parameters.rbqa_docker_image }}"
    rbqa_octane_environment: "${{ parameters.rbqa_octane_environment }}"