parameters:
- name: environment
  type: string
  default: ''
- name: infrastructureType
  type: string
  default: ''
- name: skipComponentTest
  type: boolean
  default: False
- name: skipPackage
  type: boolean
  default: False
- name: skipDeploy
  type: boolean
  default: False
- name: packageVersion
  type: string
  default: ''

## -> Resources:
resources:
  repositories:
  - repository: OSSDevOpsSettings
    name: 'OSSD - OSS DEVOPS/settings-oss-default'
    type: git
    ref: refs/heads/master

## -> Initialize global variables
variables:

- template: /tech_products/oss/initialize/variables_global.yml
- template: /tech_products/oss/initialize/variables_java.yml

## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
## -> Use this to change the variables on runtime
- group: "${{ variables['Build.Repository.Name'] }}"

- name: CORPORATE_WIKI_DOC_URL
  value: "TBD"

stages:

- stage: stage_get_settings
  displayName: Stage - Get Settings
  pool:
    name: $(AGENT_POOL_CI)

  jobs:

  - job: job_get_settings
    displayName: Job - Get Settings
    steps:

    ## -> Download a Secure File in the 'Azure Agent' as a copy. This allows it to used for the pipeline.
    ## -> This step will download a different settings.xml, a custom one.
    ## -> Set MAVEN_CUSTOM_SETTINGS_SECURE_FILE in pipeline's library.
    - task: DownloadSecureFile@1
      displayName: 'Download custom settings.xml from secure file'
      name: settings
      condition: ne(variables['MAVEN_CUSTOM_SETTINGS_SECURE_FILE'], '')
      continueOnError: false
      inputs:
        actionOnNoFiles: 'warn'
        secureFile: '$(MAVEN_CUSTOM_SETTINGS_SECURE_FILE)'

    ## -> Set MAVEN information to variables. This allows it to used in other stages, jobs or tasks.
    ## -> If MAVEN_CUSTOM_SETTINGS_SECURE_FILE is not used. Use default MAVEN settings.
    - task: Bash@3
      displayName: 'Defining Maven Settings Variables'
      name: settings_variables
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |
          if [[ -f $(settings.secureFilePath) ]]; then
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_LOCATION = $(settings.secureFilePath) ."
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION;isreadonly=true]$(settings.secureFilePath)"
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_FILE_NAME = $(basename $(settings.secureFilePath))"
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_FILE_NAME;isreadonly=true]$(basename $(settings.secureFilePath))"
          else
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_LOCATION = $(DEFAULT_MAVEN_SETTINGS) ."
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION;isreadonly=true]$(DEFAULT_MAVEN_SETTINGS)"
            echo "##[debug] Pipeline will use the MAVEN_SETTINGS_FILE_NAME = $(basename $(DEFAULT_MAVEN_SETTINGS))."
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_FILE_NAME;isreadonly=true]$(basename $(DEFAULT_MAVEN_SETTINGS))"
          fi

    ## -> Set MAVEN_SETTINGS_LOCATION to file.
    - task: Bash@3
      displayName: Generate settings file
      name: settings_file
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |
          cat $(MAVEN_SETTINGS_LOCATION) > $(MAVEN_SETTINGS_FILE_NAME)

    ## -> Copy files for staging area
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Copy to Staging Directory'
      condition: succeeded()
      continueOnError: false
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: >
          **/*settings*

    ## -> Publish Artifact in pipeline
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: $(MAVEN_SETTINGS_FILE_NAME)
        StoreAsTar: false