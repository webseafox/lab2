parameters:
- name: environment


stages:
- stage: ci_quality_gate
  displayName: "CI - Quality Gate"
  pool:
    name: $(AGENT_POOL_CI)
  dependsOn:
  - environment_init
  - gates_environment_init
  - ci_build
  condition: succeeded()

  ## -> Loads variables from other stages.
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.ci_build.build.outputs['new_version.NEW_VERSION'] ]

  - template: /tech_products/oss/initialize/variables_catalog_info.yml

  jobs:

  - job: governance
    displayName: Governance Policies Check
    steps:
    ## -> Validate the application on Governance App
    - template: /tech_products/oss/templates/gov_app/gov_app.yaml
      parameters:
        environment: "${{ parameters.environment }}"
        operation: "validate"
        version: "$(NEW_VERSION)"
