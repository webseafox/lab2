stages:
- stage: ci_build
  displayName: "CI - Build"
  pool:
    name: $(AGENT_POOL_CI)
  dependsOn:
  - environment_init

  ## -> Loads variables from other stages.
  variables:
  - name: MAVEN_SETTINGS_LOCATION
    value: $[ stageDependencies.environment_init.environment.outputs['settings_variables.MAVEN_SETTINGS_LOCATION'] ]
  - name: MAVEN_CUSTOM_SETTINGS_CONTENT
    value: $[ stageDependencies.environment_init.environment.outputs['custom_settings.MAVEN_CUSTOM_SETTINGS_CONTENT'] ]
  - name: NEXUS_DEPS_USR
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
  - name: NEXUS_DEPS_PSW
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
  - name: NEXUS_DEFAULT_USR
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_USR'] ]
  - name: NEXUS_DEFAULT_PSW
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_PSW'] ]
  # -> Catalog Info Variables
  - template: /tech_products/oss/initialize/variables_catalog_info.yml
  - template: /tech_products/oss/initialize/variables_source_data.yml

  jobs:

  - job: build
    displayName: Build
    timeoutInMinutes: $[ variables['BUILD_JOB_TIMEOUT'] ]
    steps:
    ## -> checkout repository with unbuild files for custpackage
    - checkout: self
      displayName: Checkout Code
      name: checkout_code
      path: source_code
      submodules: true
      persistCredentials: true

    ########################################
    ########################################
    ########################################
    - checkout: OSSDevOpsSettings
      displayName: 'Checkout Maven Settings Repository'
      name: checkout_settings_oss
      path: settings_oss

    ## -> Resolve Maven Settings (Custom → SIGLA → Default)
    - task: Bash@3
      displayName: 'Resolve Maven Settings'
      name: resolve_settings
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail                
          
          SETTINGS_REPO_DIR="$(Pipeline.Workspace)/settings_oss"
          APP_NAME="$(APP_NAME)"
          AGENT_TEMP_DIR="$(Agent.TempDirectory)/maven-settings"

          SIGLA=$(echo "$(GOV_APP_ACRONYM)" | tr '[:lower:]' '[:upper:]')
          
          mkdir -p "$AGENT_TEMP_DIR"
          
          echo "##[debug] Application Name: $APP_NAME"
          echo "##[debug] Project Acronym: $SIGLA"
          echo "##[debug] Settings Repository: $SETTINGS_REPO_DIR"
          
          echo "##[group] Files in settings repository:"
          tree -a "$SETTINGS_REPO_DIR" 2>/dev/null | grep -E "\.xml$" || echo "##[debug]   (no XML files found in root)"
          echo "##[endgroup]"
          
          ## -> Custom Settings (Application-Specific)
          echo "##[section]────────────────────────────────────────"
          echo "##[section] Searching for Custom Settings"
          echo "##[section]────────────────────────────────────────"
          
          CUSTOM_SETTINGS_FILE="custom/${APP_NAME}-Settings.xml"
          CUSTOM_SETTINGS_PATH="$SETTINGS_REPO_DIR/$CUSTOM_SETTINGS_FILE"
          
          echo "##[debug] Expected filename: ${APP_NAME}-Settings.xml"
          echo "##[debug] Expected path: $CUSTOM_SETTINGS_FILE"
          echo "##[debug] looking for the custom settings"
          if [ -f "$CUSTOM_SETTINGS_PATH" ]; then
            echo "##[debug] CUSTOM SETTINGS FOUND!"
            echo "##[debug] Source: custom-application"
            echo "##[debug] File: $CUSTOM_SETTINGS_FILE"
            echo "##[debug] Application: $APP_NAME"
            
            cp "$CUSTOM_SETTINGS_PATH" "$AGENT_TEMP_DIR/settings.xml"
            
            # -> Export variables
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]custom-application"
            
            echo "##[section]════════════════════════════════════════"
            echo "##[section] Resolution Summary"
            echo "##[section]════════════════════════════════════════"
            echo "##[section] File: $CUSTOM_SETTINGS_FILE"
            echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
            echo "##[section]════════════════════════════════════════"
            
            exit 0
          fi
          
          echo "##[debug] Custom settings NOT found"
          echo "##[debug] Will try project acronym settings..."
        
          ## -> Project Acronym Settings (Team-Specific)
          echo "##[section]────────────────────────────────────────"
          echo "##[section] Searching for Project Acronym Settings"
          echo "##[section]────────────────────────────────────────"
          
          SIGLA_SETTINGS="$SETTINGS_REPO_DIR/${SIGLA}-Settings.xml"
          
          echo "##[debug] Expected filename: ${SIGLA}-Settings.xml"
          echo "##[debug] Expected path: $SIGLA_SETTINGS"
          
          echo "##[debug] Project Acronym: $SIGLA"
          
          if [ -f "$SIGLA_SETTINGS" ]; then
            echo "##[section]PROJECT ACRONYM SETTINGS FOUND!"
            echo "##[debug] File: ${SIGLA}-Settings.xml"
            
            cp "$SIGLA_SETTINGS" "$AGENT_TEMP_DIR/settings.xml"
            
            ## -> Export variables
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]Project Acronym"
            
            echo "##[section]════════════════════════════════════════"
            echo "##[section] Resolution Summary"
            echo "##[section]════════════════════════════════════════"
            echo "##[section] File: ${SIGLA}-Settings.xml"
            echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
            echo "##[section]════════════════════════════════════════"
            
            exit 0
          fi
          
          echo "Project Acronym settings NOT found"
          echo "Will try default settings..."
          echo ""
          
          ## -> Default Settings (OSS)
          echo "##[section]────────────────────────────────────────"
          echo "##[section] Searching for Default Settings"
          echo "##[section]────────────────────────────────────────"
          
          DEFAULT_SETTINGS="$SETTINGS_REPO_DIR/Settings-Default.xml"
          
          echo "##[debug] Expected filename: Settings-Default.xml"
          echo "##[debug] Expected path: $DEFAULT_SETTINGS"

          echo "##[debug] File exists? $([ -f "$DEFAULT_SETTINGS" ] && echo 'YES' || echo 'NO')"
          
          if [ -f "$DEFAULT_SETTINGS" ]; then
            echo "##[section] DEFAULT SETTINGS FOUND!"
            echo "File: Settings-Default.xml"
            
            cp "$DEFAULT_SETTINGS" "$AGENT_TEMP_DIR/settings.xml"
            
            ## -> Export variables
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
            echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]oss-default"
            
            echo "##[section]════════════════════════════════════════"
            echo "##[section] Resolution Summary"
            echo "##[section]════════════════════════════════════════"
            echo "##[section] File: Settings-Default.xml"
            echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
            echo "##[section]════════════════════════════════════════"
            
            exit 0
          fi
          
          ## -> NO SETTINGS FOUND - FAIL PIPELINE
          echo ""
          echo "##[error]════════════════════════════════════════"
          echo "##[error]  NO MAVEN SETTINGS FOUND"
          echo "##[error]════════════════════════════════════════"
          echo "##[error]"
          echo "##[error] Tried the following locations (in order):"
          echo "##[error]   1. custom/${APP_NAME}-Settings.xml (application-specific)"
          echo "##[error]   2. ${SIGLA}-Settings.xml (Project Acronym specific)"
          echo "##[error]   3. Settings-Default.xml (OSS default)"
          echo "##[error]"
          echo "##[error] Repository: $SETTINGS_REPO_DIR"
          echo "##[error]"
          echo "##[error]────────────────────────────────────────"
          echo "##[error] Available Files in Repository"
          echo "##[error]────────────────────────────────────────"
          
          echo "##[error] Root directory:"
          ls -lah "$SETTINGS_REPO_DIR" 2>/dev/null | grep -E "\.xml$" || echo "##[error]   (no XML files found)"
          echo "##[error]"
          
          if [ -d "$SETTINGS_REPO_DIR/custom" ]; then
            echo "##[error] Custom directory:"
            ls -lah "$SETTINGS_REPO_DIR/custom" 2>/dev/null | grep -E "\.xml$" || echo "##[error]   (no XML files found)"
          else
            echo "##[error] Custom directory: DOES NOT EXIST"
          fi
          
          exit 1

    ## -> Replace variables in settings.xml
    - task: qetza.replacetokens.replacetokens-task.replacetokens@5
      displayName: 'Configure Maven Settings'
      condition: succeeded()
      continueOnError: false
      inputs:
        targetFiles: $(MAVEN_SETTINGS_LOCATION)
        tokenPattern: 'azpipelines'
        enableTelemetry: false
      env:
        NEXUS_DEPS_USR: $(NEXUS_DEPS_USR)
        NEXUS_DEPS_PSW: $(NEXUS_DEPS_PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    
    - task: Bash@3
      displayName: 'Validate Maven Settings (Post-Tokens)'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          
          SETTINGS_FILE="$(MAVEN_SETTINGS_LOCATION)"  
          SETTINGS_SOURCE="$(MAVEN_SETTINGS_SOURCE)"  
          
          echo ""
          echo "Settings Source: $SETTINGS_SOURCE"
          echo "Settings Location: $SETTINGS_FILE"
          echo ""
          
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "##[error] Settings file not found: $SETTINGS_FILE"
            exit 1
          fi
          
          echo "##[debug] Checking for unreplaced tokens..."
          
          if grep -q '#{.*}#' "$SETTINGS_FILE"; then
            echo "##[error] Found unreplaced tokens in settings.xml:"
            grep -o '#{[^}]*}#' "$SETTINGS_FILE" | sort | uniq
            echo ""
            echo "##[error] Possible causes:"
            echo "##[error]   - Variable not defined in 'env:' section of replacetokens task"
            echo "##[error]   - Variable not propagated from Library Group"
            exit 1
          fi
          
          echo "##[debug] ✓ All tokens successfully replaced"
          
          # Settings.xml preview
          echo ""
          echo "##[section] Settings.xml Preview (first 30 lines, passwords masked):"
          echo "##[section]────────────────────────────────────────"
          
          head -n 30 "$SETTINGS_FILE" | \
            sed 's/<password>.*<\/password>/<password>***MASKED***<\/password>/g' | \
            sed 's/<username>\(.*\)<\/username>/<username>***MASKED***<\/username>/g'
          
          echo ""

    ########################################
    ########################################
    ########################################

    ## -> Download Custpackage artifacts to create the custpackage
    - task: Bash@3
      displayName: Download Artifacts
      inputs:
        targetType: inline
        workingDirectory: $(Pipeline.Workspace)/source_code
        script: |
          BUILDER_IMAGE_NAME="builder/java"
          docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .

          # function to run docker image, and if it fails exit 1
          run_docker() {
            docker run --rm \
              --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
              --network host \
              --log-driver none \
              -e JAVA_OPTS_MEMORY_MAX="$(DEFAULT_MAX_MEMORY_BUILD)" \
              -e TZ="America/Sao_Paulo" \
              -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
              -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
              -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
              -e NEXUS-DEFAULT-USR="$(NEXUS_DEFAULT_USR)" \
              -e NEXUS-DEFAULT-PSW="$(NEXUS_DEFAULT_PSW)" \
              -v $(pwd):/app \
              -v $HOME/.m2:/.m2 \
              -v $(MAVEN_SETTINGS_LOCATION):/.m2/settings.xml \
              -w $(DOCKER_WORKDIR) \
              "$BUILDER_IMAGE_NAME" sh -c "$1" || exit 1
          }

          echo -e "\033[0;33m\u2193 To view the List Dependency Tree, click the arrows below on the left. \u2193\033[0m"
          echo "##[group]List Dependency Tree"
          run_docker "mvn -U dependency:tree -Dverbose 2>/dev/null"
          echo "##[endgroup]"

          run_docker "mvn -U dependency:copy-dependencies -DoutputDirectory=./ -DexcludeTransitive=true -s /.m2/settings.xml"

          echo "##[group]List Working directory with downloaded artifacts"
          ls -l
          echo "##[endgroup]"

    ## -> Create custpackage with unbuild files and downloaded files
    - task: Bash@3
      displayName: Build Custpackage
      inputs:
        targetType: inline
        workingDirectory: $(Pipeline.Workspace)/source_code
        script: |
          echo "##[group]List Working directory with downloaded artifacts"
          ls -l
          echo "##[endgroup]"

          # CustPackage Destination directories
          destDirWebWebapps="./custpackage/web/webapps"
          destDirNeo4jPlugins="./custpackage/neo4j/plugins"
          destDirNeo4jScripts="./custpackage/neo4j/scripts"
          destDirChetakScripts="./custpackage/chetak/scripts"

          # Create the destination directories for the artifacts if they don't exist
          mkdir -p "$destDirWebWebapps"
          mkdir -p "$destDirNeo4jPlugins"
          mkdir -p "$destDirNeo4jScripts"
          mkdir -p "$destDirChetakScripts"

          # Function to log copy message
          function copyMessage() {
            local dest_dir="$1"
            echo "##[command]Copying $artifact artifact to $dest_dir in custpackage"
          }

          # Function to rename and copy artifact
          function renameCopyArtifact() {
            local newName="$1"
            local dest_dir="$2"
            echo -e "##[group]\e[34mRename and copy artifact $artifact to $newName"
            echo "##[debug]Artifact $artifact new name is $newName"
            echo "##[command]Copying $artifact artifact to $dest_dir in custpackage"
            cp "$file" "$dest_dir/$newName"
            echo "##[command]Copied $artifact artifact to $dest_dir in custpackage"
            echo "##[endgroup]"
          }
          
          # Function to untar script artifact to destination
          function untarScriptToDest() {
            local dest_dir="$1"
            echo -e "##[group]\e[33mCopying $artifact artifact to $dest_dir in custpackage"
            tar -xvf "$artifact" -C "$dest_dir"
            echo "##[endgroup]"
          }

          # Search in the current folder for the artifacts
          # Copy the artifacts to its directory and
          # Rename the file keeping the name up to the string 'rest' or 'ui', as the custpacka acept just artifact name
          for file in $(find . -maxdepth 1 -type f -name "*rest*.war" -o -name "*ui*.war" -o -name "*.jar" -o -name "*.tar"); do

            # Get the base name of the artifact file
            artifact=$(basename "$file")

            # check BPI version before renaming and copying artifacts
            if [[ $artifact == *"blueplanet-inventory-ui"* ]] && [[ $artifact == *.war ]]; then
              renameCopyArtifact "blueplanet-inventory-ui.war" "$destDirWebWebapps"
            elif [[ $artifact == *"blueplanet-inventory-rest-showcase"* ]] && [[ $artifact == *.war ]]; then
              renameCopyArtifact "blueplanet-inventory-rest-showcase.war" "$destDirWebWebapps"
            elif [[ $artifact == *"comp-bpi-custartifact-neo4j-plugin-v1"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "comp-bpi-custartifact-neo4j-plugin-v1.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"blueplanet-inventory-staging-ingestion-converter-core"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "blueplanet-inventory-staging-ingestion-converter-core.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"blueplanet-inventory-staging-ingestion-project-plugin"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "blueplanet-inventory-staging-ingestion-project-plugin.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"blueplanet-inventory-staging-ingestion-ra-plugin"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "blueplanet-inventory-staging-ingestion-ra-plugin.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"bpi-custpackage-neo4j-ri-plugin"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "bpi-custpackage-neo4j-ri-plugin.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"blueplanet-inventory-staging-ingestion-converter"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "blueplanet-inventory-staging-ingestion-converter.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *"comp-bpi-custpackage-sif-ingestion-naming-convention-v1"* ]] && [[ $artifact == *.jar ]]; then
              renameCopyArtifact "comp-bpi-custpackage-sif-ingestion-naming-convention-v1.jar" "$destDirNeo4jPlugins"
            elif [[ $artifact == *blueplanet-inventory-vivo-neo4j-scripts* ]] && [[ $artifact == *.tar ]]; then
              untarScriptToDest "$destDirNeo4jScripts"
            elif [[ $artifact == *blueplanet-inventory-vivo-postgres-scripts* ]] && [[ $artifact == *.tar ]]; then
              untarScriptToDest "$destDirChetakScripts"
            fi
          done

          echo "##[group]The Custpackage structure set for Deployment"
          tree ./custpackage
          echo "##[endgroup]"

          echo -e "##[group]\e[1mCreating the Custpackage.tar file"

          cd custpackage

          # set custpackage file and path
          custpackageFile="$(Build.StagingDirectory)/custpackage.tar"

          tar -cvf $custpackageFile ./
          ls -l $custpackagePath
          echo "##[endgroup]"

          # output variable for custpackage
          echo "##vso[task.setvariable variable=CUSTPACKAGE_FILE;]$custpackageFile"

    ## -> Publish Custpackage
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Custpackage to Pipeline'
      inputs:
          PathtoPublish: '$(CUSTPACKAGE_FILE)'
          ArtifactName: 'custpackage'
