parameters:
- name: fortifyExclusionRepository

stages:
- stage: ci_security
  displayName: "CI - Security Gates"
  pool:
    name: $(AGENT_POOL_CI)
  dependsOn:
  - environment_init
  - gates_environment_init
  - ci_build
  condition: succeeded()

  variables:
  - name: USE_FORTIFY
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.USE_FORTIFY'] ]
  - name: USE_CONVISO
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.USE_CONVISO'] ]
  - name: USE_CHECKMARX
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.USE_CHECKMARX'] ]
  - name: SKIP_SECURITY_GATE
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
  - name: USE_DEPENDENCY_TRACK
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]
  - name: USE_DT_DOCKER
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.USE_DT_DOCKER'] ]
  - name: SKIP_SECURITY_GATE_SCA
    value: $[ stageDependencies.gates_environment_init.environment.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]
  - name: APP_LANGUAGE
    value: $[ stageDependencies.environment_init.environment.outputs['catalog_info.APP_LANGUAGE'] ]
  - name: ALLOW_MULTIBRANCH
    value: $[ stageDependencies.environment_init.environment.outputs['multibranch_exclusions.ALLOW_MULTIBRANCH'] ]
  - name: ARTIFACT_NAME
    value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_NAME'] ]

  jobs:

  - job: sast_scan
    displayName: "SAST Scan"
    condition: and(
      succeeded(),
      eq(variables.USE_FORTIFY, 'true'))
    steps:

    ## -> Set app versions task template from security team
    - template: /security/define_appsec_app_version.yml

    ## -> Run Fortify Scan task template from security team
    - template: /security/run_fortify_scan.yml
      parameters:
        fortifyExclusionRepository: ${{ parameters.fortifyExclusionRepository }}
        appVersion: "$(FORTIFY_APP_VERSION)"
        branchName: "$(Build.SourceBranchName)"
        appLanguage: "$(APP_LANGUAGE)"
        vivoFlow: "dev,esteira1,esteira2,preprod,prodlike,producao"

    ## -> Tasks to set variable to avoid the bypass in the next stages
    - task: Bash@3
      displayName: 'Set Job Status Variable'
      condition: always()
      name: job_status
      inputs:
        targetType: inline
        script: |

          ## -> Set variable to avoid the bypass in the next stages
          echo "##[debug] Setting the SAST_STATUS variable to $(Agent.JobStatus)"
          echo "##vso[task.setvariable variable=SAST_STATUS;isOutput=true]$(Agent.JobStatus)"

  - job: sca_scan
    displayName: "SCA Scan"
    condition: and(
                succeeded(),
                eq(variables.USE_DEPENDENCY_TRACK, true),
                eq(variables.USE_DT_DOCKER, false)
                )
    steps:

    ## -> Tasks to explain this job
    - task: Bash@3
      displayName: 'About the Job'
      inputs:
        targetType: inline
        script: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'

          printf "
          =================================================================================================================================
          ${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME}
          =================================================================================================================================

          ${YELLOW}The objective of this stage is to evaluate if there are vulnerabilities in the dependencies and third-party libraries used in this application.
          ${YELLOW}It is under the responsibility of the AppSec team
          ${YELLOW}If you have any questions about this phase of the pipeline, please refer to the documentation at https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659

          ================================================================================================================================="

    ## -> Generate the SBOM and upload it to Dependency-Track
    ## -> Begin of SCA scan tasks
    - template: /security/define_appsec_app_version.yml

    - template: /security/run_sca_scan.yml
      parameters:
        skipSecurityGate: ${{ variables['SKIP_SECURITY_GATE_SCA'] }}
        appVersion: "$(FORTIFY_APP_VERSION)"
        buildArtifactName: $(ARTIFACT_NAME)
        vivoFlow: "dev,prodlike,producao,esteira1,esteira2,preprod"

    ## -> Tasks to set variable to avoid the bypass in the next stages
    - task: Bash@3
      displayName: 'Set Job Status Variable'
      condition: always()
      name: job_status
      inputs:
        targetType: inline
        script: |

          ## -> Set variable to avoid the bypass in the next stages
          echo "##[debug] Setting the SCA_STATUS variable to $(Agent.JobStatus)"
          echo "##vso[task.setvariable variable=SCA_STATUS;isOutput=true]$(Agent.JobStatus)"