parameters:
- name: environment

stages:
  - stage: ci_build
    displayName: "CI - Build"
    pool:
      name: $(AGENT_POOL_CI)
    dependsOn:
      - environment_init

    ## -> Loads variables from other stages.
    variables:
      - name: NEXUS_DEPS_USR
        value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
      - name: NEXUS_DEPS_PSW
        value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
      - name: NEXUS_DEFAULT_USR
        value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_USR'] ]
      - name: NEXUS_DEFAULT_PSW
        value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_PSW'] ]
      # -> Catalog Info Variables
      - template: /tech_products/oss/initialize/variables_catalog_info.yml
      - template: /tech_products/oss/initialize/variables_source_data.yml

    jobs:

      - job: build
        displayName: Build
        timeoutInMinutes: $[ variables['BUILD_JOB_TIMEOUT'] ]
        steps:

          ## -> Checkout the code
          - checkout: self
            displayName: Checkout Code
            name: checkout_code
            submodules: true
            path: source_code
            persistCredentials: true

          ## -> Checkout the last commit that was pushed to the repository.
          ## -> Set last commit HASH to a variable.
          - task: Bash@3
            displayName: Checkout Last Commit
            name: checkout_last_commit
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                echo "##[debug] Checkout last commit from '$(Build.SourceBranchName)'"
                
                git config pull.rebase true
                git fetch -f --depth 50 origin $(Build.SourceBranchName):$(Build.SourceBranchName)
                git checkout -f $(Build.SourceBranchName)
                
                ## -> Ignore commits that only change .azuredevops/ content
                lastCommit=$(git log --format=%H -- . ':!'".azuredevops/" | head -n 1)
                lastCommitHash=$(git rev-parse --short=6 $lastCommit)
                
                echo "##[debug] Last commit short hash '$lastCommitHash'"
                echo "##vso[task.setvariable variable=SHORT_HASH]$lastCommitHash"

          - checkout: OSSDevOpsHosts
            displayName: Checkout Hosts OSS
            name: checkout_hosts_oss
            path: hosts_oss

          - checkout: OSSDevOpsSettings
            displayName: 'Checkout Maven Settings Repository'
            name: checkout_settings_oss
            path: settings_oss

          ## -> Resolve Maven Settings (Custom → SIGLA → Default)
          - task: Bash@3
            displayName: 'Resolve Maven Settings'
            name: resolve_settings
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail                
                
                SETTINGS_REPO_DIR="$(Pipeline.Workspace)/settings_oss"
                AGENT_TEMP_DIR="$(Agent.TempDirectory)/maven-settings"
                APP_NAME="$(APP_NAME)"
                SIGLA=$(echo "$(GOV_APP_ACRONYM)" | tr '[:lower:]' '[:upper:]')
                
                mkdir -p "$AGENT_TEMP_DIR"
                
                echo "##[debug] Application Name: $APP_NAME"
                echo "##[debug] Project Acronym: $SIGLA"
                echo "##[debug] Settings Repository: $SETTINGS_REPO_DIR"
                
                echo "##[group] Files in settings repository:"
                tree -a "$SETTINGS_REPO_DIR" 2>/dev/null | grep -E "\.xml$" || echo "##[debug]   (no XML files found in root)"
                echo "##[endgroup]"
                
                ## -> Custom Settings (Application-Specific)
                echo "##[section]────────────────────────────────────────"
                echo "##[section] Searching for Custom Settings"
                echo "##[section]────────────────────────────────────────"
                
                CUSTOM_SETTINGS_FILE="custom/${APP_NAME}-Settings.xml"
                CUSTOM_SETTINGS_PATH="$SETTINGS_REPO_DIR/$CUSTOM_SETTINGS_FILE"
                
                echo "##[debug] Expected filename: ${APP_NAME}-Settings.xml"
                echo "##[debug] Expected path: $CUSTOM_SETTINGS_FILE"
                echo "##[debug] looking for the custom settings"
                if [ -f "$CUSTOM_SETTINGS_PATH" ]; then
                  echo "##[debug] CUSTOM SETTINGS FOUND!"
                  echo "##[debug] Source: custom-application"
                  echo "##[debug] File: $CUSTOM_SETTINGS_FILE"
                  echo "##[debug] Application: $APP_NAME"
                  
                  cp "$CUSTOM_SETTINGS_PATH" "$AGENT_TEMP_DIR/settings.xml"
                  
                  # -> Export variables
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]custom-application"
                  
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] Resolution Summary"
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] File: $CUSTOM_SETTINGS_FILE"
                  echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
                  echo "##[section]════════════════════════════════════════"
                  
                  exit 0
                fi
                
                echo "##[debug] Custom settings NOT found"
                echo "##[debug] Will try project acronym settings..."
              
                ## -> Project Acronym Settings (Team-Specific)
                echo "##[section]────────────────────────────────────────"
                echo "##[section] Searching for Project Acronym Settings"
                echo "##[section]────────────────────────────────────────"
                
                SIGLA_SETTINGS="$SETTINGS_REPO_DIR/${SIGLA}-Settings.xml"
                
                echo "##[debug] Expected filename: ${SIGLA}-Settings.xml"
                echo "##[debug] Expected path: $SIGLA_SETTINGS"
                
                echo "##[debug] Project Acronym: $SIGLA"
                
                if [ -f "$SIGLA_SETTINGS" ]; then
                  echo "##[section]PROJECT ACRONYM SETTINGS FOUND!"
                  echo "##[debug] File: ${SIGLA}-Settings.xml"
                  
                  cp "$SIGLA_SETTINGS" "$AGENT_TEMP_DIR/settings.xml"
                  
                  ## -> Export variables
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]Project Acronym"
                  
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] Resolution Summary"
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] File: ${SIGLA}-Settings.xml"
                  echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
                  echo "##[section]════════════════════════════════════════"
                  
                  exit 0
                fi
                
                echo "Project Acronym settings NOT found"
                echo "Will try default settings..."
                echo ""
                
                ## -> Default Settings (OSS)
                echo "##[section]────────────────────────────────────────"
                echo "##[section] Searching for Default Settings"
                echo "##[section]────────────────────────────────────────"
                
                DEFAULT_SETTINGS="$SETTINGS_REPO_DIR/Settings-Default.xml"
                
                echo "##[debug] Expected filename: Settings-Default.xml"
                echo "##[debug] Expected path: $DEFAULT_SETTINGS"

                echo "##[debug] File exists? $([ -f "$DEFAULT_SETTINGS" ] && echo 'YES' || echo 'NO')"
                
                if [ -f "$DEFAULT_SETTINGS" ]; then
                  echo "##[section] DEFAULT SETTINGS FOUND!"
                  echo "File: Settings-Default.xml"
                  
                  cp "$DEFAULT_SETTINGS" "$AGENT_TEMP_DIR/settings.xml"
                  
                  ## -> Export variables
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_LOCATION]$AGENT_TEMP_DIR/settings.xml"
                  echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SOURCE]oss-default"
                  
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] Resolution Summary"
                  echo "##[section]════════════════════════════════════════"
                  echo "##[section] File: Settings-Default.xml"
                  echo "##[section] Location: $AGENT_TEMP_DIR/settings.xml"
                  echo "##[section]════════════════════════════════════════"
                  
                  exit 0
                fi
                
                ## -> NO SETTINGS FOUND - FAIL PIPELINE
                echo ""
                echo "##[error]════════════════════════════════════════"
                echo "##[error]  NO MAVEN SETTINGS FOUND"
                echo "##[error]════════════════════════════════════════"
                echo "##[error]"
                echo "##[error] Tried the following locations (in order):"
                echo "##[error]   1. custom/${APP_NAME}-Settings.xml (application-specific)"
                echo "##[error]   2. ${SIGLA}-Settings.xml (Project Acronym specific)"
                echo "##[error]   3. Settings-Default.xml (OSS default)"
                echo "##[error]"
                echo "##[error] Repository: $SETTINGS_REPO_DIR"
                echo "##[error]"
                echo "##[error]────────────────────────────────────────"
                echo "##[error] Available Files in Repository"
                echo "##[error]────────────────────────────────────────"
                
                echo "##[error] Root directory:"
                ls -lah "$SETTINGS_REPO_DIR" 2>/dev/null | grep -E "\.xml$" || echo "##[error]   (no XML files found)"
                echo "##[error]"
                
                if [ -d "$SETTINGS_REPO_DIR/custom" ]; then
                  echo "##[error] Custom directory:"
                  ls -lah "$SETTINGS_REPO_DIR/custom" 2>/dev/null | grep -E "\.xml$" || echo "##[error]   (no XML files found)"
                else
                  echo "##[error] Custom directory: DOES NOT EXIST"
                fi
                
                
                exit 1
                    

          ## -> Replace variables in settings.xml
          - task: qetza.replacetokens.replacetokens-task.replacetokens@5
            displayName: 'Configure Maven Settings'
            condition: succeeded()
            continueOnError: false
            inputs:
              targetFiles: $(MAVEN_SETTINGS_LOCATION)
              tokenPattern: 'azpipelines'
              enableTelemetry: false
            env:
              NEXUS_DEPS_USR: $(NEXUS_DEPS_USR)
              NEXUS_DEPS_PSW: $(NEXUS_DEPS_PSW)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          
          - task: Bash@3
            displayName: 'Validate Maven Settings (Post-Tokens)'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                
                SETTINGS_FILE="$(MAVEN_SETTINGS_LOCATION)"  
                SETTINGS_SOURCE="$(MAVEN_SETTINGS_SOURCE)"  
                
                echo ""
                echo "Settings Source: $SETTINGS_SOURCE"
                echo "Settings Location: $SETTINGS_FILE"
                echo ""
                
                if [ ! -f "$SETTINGS_FILE" ]; then
                  echo "##[error] Settings file not found: $SETTINGS_FILE"
                  exit 1
                fi
                
                echo "##[debug] Checking for unreplaced tokens..."
                
                if grep -q '#{.*}#' "$SETTINGS_FILE"; then
                  echo "##[error] Found unreplaced tokens in settings.xml:"
                  grep -o '#{[^}]*}#' "$SETTINGS_FILE" | sort | uniq
                  echo ""
                  echo "##[error] Possible causes:"
                  echo "##[error]   - Variable not defined in 'env:' section of replacetokens task"
                  echo "##[error]   - Variable not propagated from Library Group"
                  exit 1
                fi
                
                echo "##[debug] ✓ All tokens successfully replaced"
                
                # Settings.xml preview
                echo ""
                echo "##[section] Settings.xml Preview (first 30 lines, passwords masked):"
                echo "##[section]────────────────────────────────────────"
                
                head -n 30 "$SETTINGS_FILE" | \
                  sed 's/<password>.*<\/password>/<password>***MASKED***<\/password>/g' | \
                  sed 's/<username>\(.*\)<\/username>/<username>***MASKED***<\/username>/g'
                
                echo ""
                

          ## -> Get source code data
          - task: CmdLine@2
            displayName: Get Source Data
            name: source_data
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                
                artifactId=$(DOCKER_CMD_EXTRACT_ARTIFACT_ID)
                echo "##[debug] Source ARTIFACT_ID: $artifactId"
                echo "##vso[task.setvariable variable=ARTIFACT_ID;isOutput=true]$artifactId"
                
                groupId=$(DOCKER_CMD_EXTRACT_GROUP_ID)
                echo "##[debug] Source GROUP_ID: $groupId"
                echo "##vso[task.setvariable variable=GROUP_ID;isOutput=true]$groupId"

          ## -> Start of Bump Version section
          ## -> If branch is master, use numeric system. e.g: 0.0.1, 2.0.0;
          ## -> If branch is NOT master, use branch name + last commit hash. e.g: dev-1a2b;

          ## -> Get current version and set to variables.
          ## -> For master, set a variable to increment version further on.
          - task: CmdLine@2
            displayName: Get Current Version
            name: current_version
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                
                currentVersion=$(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
                echo "##[debug] Source CURRENT_VERSION: '$currentVersion' "
                echo "##vso[task.setvariable variable=CURRENT_VERSION;]$currentVersion"
                
                incrementVersion=$(echo $currentVersion | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
                if [[ -n $incrementVersion ]]; then
                  echo "##vso[task.setvariable variable=INCREMENT_VERSION;]$incrementVersion"
                else
                  echo "##[error] Version in the pom.xml is not following semantic versioning."
                  echo "##[error] Verify if the version contains the pattern: <major>.<minor>.<patch>; e.g: 0.0.1, 1.0.0-branch, 1.1.0-branch+hash, 0.0.1-SNAPSHOT; "
                  exit 1
                fi

          ## -> Bump/Increment version and update increment variable.
          ## -> Only allows this for master branch and in CI steps. Do not allow manual pushes.
          ## -> To disable set BUMP_VERSION_ENABLED in pipeline's library.
          - task: semver-bump@1
            displayName: Bump Version Master
            name: bump_version
            condition: and(
              succeeded(),
              and(eq(variables.BUMP_VERSION_ENABLED, 'true'), ne(variables['Build.Reason'], 'Manual')))
            continueOnError: false
            inputs:
              VersionVariable: 'INCREMENT_VERSION'
              IncrementLevel: 'patch'
              targetType: inline

          ## -> Set the new version to a variable. This allows it to be used in other stages, jobs or tasks.
          - task: Bash@3
            displayName: 'Set New Version'
            name: new_version
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              script: |
                echo "##[debug] Source CURRENT_VERSION: '$(CURRENT_VERSION)'"
                if [ '$(Build.SourceBranchName)' == 'master' ]; then
                  echo "##[debug] Source NEW_VERSION: '$(INCREMENT_VERSION)'"
                  echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$(INCREMENT_VERSION)"
                else
                  newVersion=$(INCREMENT_VERSION)-$(Build.SourceBranchName).$(SHORT_HASH)
                  echo "##[debug] Source NEW_VERSION: $newVersion"
                  echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$newVersion"
                fi

          ## -> Check Java Version
          - task: Bash@3
            displayName: Check for Legacy Java Version
            name: java_version
            condition: and(
              succeeded(),
              eq(variables.new_version.NEW_VERSION, ''))
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                
                javaVersion=$(DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION)
                
                if [ $? -gt 0 ] ; then
                  echo "##[warning] No java version found..."
                else
                  if [[ $(echo "$javaVersion < 1.8" | bc) == 1 ]]; then
                    echo "##[debug] Java version: $javaVersion"
                    echo "##[debug] Java version is less than 1.8 (JDK8), bump version as legacy mode."
                
                    ## -> Necessary to duplicate variable due to Azure DevOps issues.
                    ## In task-condition, output variable do not work within the same stage.
                
                    echo "##vso[task.setvariable variable=LEGACY_MODE]true"
                    echo "##vso[task.setvariable variable=LEGACY_MODE;isOutput=true]true"
                
                  else
                    echo "##[debug] Java version: $javaVersion"
                    echo "##[debug] Java version is greater or equal than 1.8 (JDK8), bump version with mvn versions:set."
                    echo "##vso[task.setvariable variable=LEGACY_MODE]false"
                    echo "##vso[task.setvariable variable=LEGACY_MODE;isOutput=true]false"
                  fi
                
                fi

          ## -> Bump version for Java <= 7
          - task: Bash@3
            displayName: Bump Version on Legacy Mode (Java <= 7)
            name: bump_java_7_or_less
            condition: and(
              succeeded(),
              eq(variables.LEGACY_MODE, 'true'),
              eq(variables.BUMP_VERSION_ENABLED, 'true'))
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                
                echo "##[debug] Bumping version on legacy mode..."
                
                run_docker() {
                  docker run --rm \
                    --log-driver none \
                    --entrypoint xq \
                    -v $(pwd)/"$1":$(pwd)/"$1" \
                    -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq \
                    -x "$2" \
                    "$1" > pom_temp.xml
                }
                
                echo "##[debug] Build with version: $(new_version.NEW_VERSION)"
                
                ## -> Try to collect an array of modules
                ## -> Verify if uses profiles
                if [[ $JAVA_CMD_OPTIONAL == *"-P"* ]]; then
                  profiles=$(DOCKER_CMD_EXTRACT_POM_XML_PROFILES)
                  for profile in $profiles; do
                    echo $profile
                    ## -> TODO - Get modules within profile
                  done
                else
                modules=$(DOCKER_CMD_EXTRACT_POM_XML_MODULE)
                fi;
                
                if [ $? -gt 0 ]; then
                  echo "##[warning] No modules found or is not an array, switching to string..."
                  modules=$(DOCKER_CMD_EXTRACT_POM_XML_MODULES)
                  if [ $? -gt 0 ]; then
                    echo "##[warning] No modules found, proceeding to pom parent..."
                  fi
                  dependenciesExpression=".project.dependencies.dependency"
                else
                  dependenciesExpression=".project.dependencies.dependency[]"
                fi;
                
                for module in $modules; do
                  echo "##[debug] Bumping version for module: $module"
                  if [ -f "$module/pom.xml" ]; then
                
                    for dependency in $modules; do
                      run_docker "$module/pom.xml" "(try "$dependenciesExpression" | select(.artifactId==\""$dependency"\")).version=\""$(new_version.NEW_VERSION)"\""
                      if [ -f "pom_temp.xml" ]; then
                        mv pom_temp.xml $(pwd)/"$module/pom.xml"
                      fi
                    done
                
                    run_docker "$module/pom.xml" "(try .project.parent | select(.artifactId==\""$(source_data.ARTIFACT_ID)"\")).version=\""$(new_version.NEW_VERSION)"\""
                    mv pom_temp.xml $(pwd)/"$module/pom.xml"
                
                    run_docker "$module/pom.xml" ".project.version=\""$(new_version.NEW_VERSION)"\""
                    mv pom_temp.xml $(pwd)/"$module/pom.xml"
                
                    echo "##[group] /$module/pom.xml"
                    cat $(pwd)/$module/pom.xml
                    echo "##[endgroup]"
                
                  else
                    echo "##[warning] No pom.xml file found for module: $module"
                  fi
                
                done
                
                echo "##[debug] Bumping version for pom parent"
                
                run_docker "pom.xml" ".project.version=\""$(new_version.NEW_VERSION)"\""
                mv pom_temp.xml $(pwd)/pom.xml
                
                echo "##[group] pom.xml"
                cat $(pwd)/pom.xml
                echo "##[endgroup]"

          ## -> Generate HOSTS
          - task: Bash@3
            displayName: Generate HOSTS
            name: generate_hosts
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              script: |

                #Generate HOSTS
                echo "##[debug] Generate HOSTS $(environment)"
                
                addHostsArgs=""
                
                pwd
                find $(Pipeline.Workspace) -maxdepth 3
                
                dos2unix $(Pipeline.Workspace)/hosts_oss/${{ parameters.environment }}/hosts
                while IFS= read -r line || [[ -n "$line" ]]; do
                  if [[ $line != \#* ]]; then
                    IP=$(echo $line | awk '{print $1}')
                    HOST=$(echo $line | awk '{print $2}')
                    echo $HOST":"$IP
                    addHostsArgs+="--add-host=$HOST:$IP "
                  fi
                done < $(Pipeline.Workspace)/hosts_oss/${{ parameters.environment }}/hosts
                
                addHostsArgs=$(echo $addHostsArgs | sed 's/ *$//')
                echo "##vso[task.setvariable variable=ADD_HOST_ARGS;isOutput=true]$addHostsArgs"

          ## -> Bump version (Java > 7) in code and build code.
          - task: Bash@3
            displayName: Build Version
            name: build_version
            condition: succeeded()
            continueOnError: false
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                
                echo "##[debug] Environment: ${{ parameters.environment }}"
                
                echo "##[debug] Add hosts to docker: $(generate_hosts.ADD_HOST_ARGS)"
                
                BUILDER_IMAGE_NAME="builder/$(Build.BuildId)"
                
                docker build --no-cache --build-arg USER_ID=$(DOCKER_CMD_USERNAME) --build-arg GROUP_ID=$(DOCKER_CMD_GROUP) -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .
                
                run_docker() {
                  docker run --rm \
                    --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
                    --network host \
                    --log-driver none \
                    -e JAVA_OPTS_MEMORY_MAX="$(DEFAULT_MAX_MEMORY_BUILD)" \
                    -e TZ="America/Sao_Paulo" \
                    -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
                    -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
                    -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
                    -e NEXUS-DEFAULT-USR="$(NEXUS_DEFAULT_USR)" \
                    -e NEXUS-DEFAULT-PSW="$(NEXUS_DEFAULT_PSW)" \
                    $(generate_hosts.ADD_HOST_ARGS) \
                    -v $(pwd):/app \
                    -v $HOME/.m2:/.m2 \
                    -v $(MAVEN_SETTINGS_LOCATION):/.m2/settings.xml \
                    -w $(DOCKER_WORKDIR) \
                    "$BUILDER_IMAGE_NAME" sh -c "$1"
                }
                
                if [[ ("${BUMP_VERSION_ENABLED}" == 'true') && !( "$(java_version.LEGACY_MODE)" == 'true') ]]; then
                  echo "##[debug] Bump version to NEW_VERSION: $(new_version.NEW_VERSION)"
                  run_docker "mvn -X -e $MAVEN_OPTS versions:set -DnewVersion=$(new_version.NEW_VERSION) -s /.m2/settings.xml -Dmaven.repo.local=/.m2/repository"
                fi
                
                echo "##[debug] Build with version: $(new_version.NEW_VERSION)"
                echo "##[debug] JAVA_CMD_BUILD: $(JAVA_CMD_BUILD)"
                echo "##[debug] JAVA_CMD_BUILD_TEST: $(JAVA_CMD_BUILD_TEST)"
                echo "##[debug] JAVA_CMD_OPTIONAL: $(JAVA_CMD_OPTIONAL)"
                
                run_docker "$(JAVA_CMD_BUILD) $(JAVA_CMD_BUILD_TEST) $(JAVA_CMD_OPTIONAL) -Dmaven.test.failure.ignore=false -s /.m2/settings.xml -Dmaven.repo.local=/.m2/repository"

          ## -> Copy files for staging area
          - task: CopyFiles@2
            name: t_copy_file
            displayName: 'Copy to Staging Directory'
            condition: succeeded()
            continueOnError: false
            inputs:
              SourceFolder: '$(Pipeline.Workspace)/source_code'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              OverWrite: true
              CleanTargetFolder: true
              Contents: >
                **/*
                
                !.git/**/*
                
                !?/**/*
                
                !**/*.log

          ## -> Set artifact information to variables. This allows it to be used in other stages, jobs or tasks.
          - task: CmdLine@2
            name: artifact_name
            displayName: 'Set Artifact Name'
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/source_code
              script: |
                function getArtifactInfo() {
                  argModule=$1
                
                  if [ ! -z $argModule ]; then
                    echo "##[group] Module $argModule info:"
                    targetDirectory=$(echo "$(Build.ArtifactStagingDirectory)/$argModule/target")
                  else
                    targetDirectory=$(echo "$(Build.ArtifactStagingDirectory)/target")
                    echo "##[group] Project Target Directory"
                    echo "##[debug] $targetDirectory"
                    echo "$(ls -lah $targetDirectory)"
                    echo "##[endgroup]"
                  fi
                
                  ## -> Check if the artifact is a .ear, .war or .jar
                  echo "##[debug] Searching for the artifact in the target directory in the following order: EAR, WAR, then JAR."
                
                  if [ "$(ls -1 $targetDirectory/*.ear 2>/dev/null)" ]; then
                    echo "##[debug] Found an EAR artifact in the target directory."
                    artifact=$(echo $targetDirectory/$(ls -1 "$targetDirectory" | grep -E "\.ear$" | sort | head -n 1))
                  elif [ "$(ls -1 $targetDirectory/*.war 2>/dev/null)" ]; then
                    echo "##[debug] No EAR artifact was found in the target directory."
                    echo "##[debug] Found a WAR artifact in the target directory."
                    artifact=$(echo $targetDirectory/$(ls -1 "$targetDirectory" | grep -E "\.war$" | sort | head -n 1))
                  elif [ "$(ls -1 $targetDirectory/*.jar 2>/dev/null)" ]; then
                    echo "##[debug] No EAR or WAR artifact was found in the target directory."
                    echo "##[debug] Found a JAR artifact in the target directory."
                    artifact=$(echo $targetDirectory/$(ls -1 "$targetDirectory" | grep -E "\.jar$" | sort | head -n 1))
                  else
                    echo "##[debug] No EAR, WAR, or JAR artifacts were found in the target directory."
                    exit 1
                  fi
                
                  echo "##[debug] The artifact file path is: $artifact"
                
                  artifactFile=$(basename $artifact)
                  echo "##[debug] Artifact File: $artifactFile"
                
                  artifactPath=$(echo $artifact | sed "s|^$(Build.ArtifactStagingDirectory)\/||" | sed "s|$artifactFile||")
                  echo "##[debug] Artifact Directory: $artifactPath"
                
                  artifactName=$(basename $artifact | sed 's/\.[^.]*$//')
                  echo "##[debug] Artifact Name: $artifactName"
                
                  echo "$(ls -lah $artifactPath)"
                
                  if [ ! -z $argModule ]; then
                    echo "##[endgroup]"
                  fi
                
                  if [[ $artifact != *"$(new_version.NEW_VERSION)"* ]]; then
                    echo "##[error] The artifact generated is not from version $(new_version.NEW_VERSION)."
                    echo "##[error] Possible causes may include:"
                    echo "##[error] - Build cache enabled and the build generated the artifact with the previous version, as code has no change."
                    echo "##[error] - A variable forcing the name in the pom.xml, e.g: <finalName> attribute inside the pom.xml"
                    exit 1
                  fi
                }
                
                echo "$(pwd)"
                
                echo "##[group] Project File Structure"
                echo "$(ls -lah)"
                echo "$(tree)"
                echo "##[endgroup]"
                
                echo "##[debug] Setting the artifact name based on the build file, pom.xml, and catalog-info.yaml..."
                echo "##[debug] Check if the project includes multiple modules..."
                
                modules=$(DOCKER_CMD_EXTRACT_POM_XML_MODULES)
                
                if [ $? -gt 0 ]; then
                  echo "##[debug] The Project is not multi-module."
                
                  getArtifactInfo
                
                else
                  echo "##[debug] Project is multi-module."
                
                  artifactModules=$(echo $modules | tr -d '[]' | tr -d '""' | tr -d ' ' | tr ',' ' ')
                  echo "Modules: $modules"
                
                  ## -> Export artifactModules to use in Publish satage
                  echo "##vso[task.setvariable variable=ARTIFACT_MODULES;isOutput=true]$artifactModules"
                
                  modulesArray=($artifactModules)
                
                  for module in "${modulesArray[@]}"; do
                
                    getArtifactInfo $module
                
                  done
                
                  artifactName="$(source_data.ARTIFACT_ID)-$(new_version.NEW_VERSION)"
                
                  if [ "$(APP_COMPONENT_TYPE)" != "lib" ] ; then
                    if [ "$PUBLISH_MULTIMODULES" != "true" ]; then
                      echo "##[warning] The last module will be used as the project's artifact."
                      echo "##[debug] Last Module           : $argModule"
                      echo "##[debug] Project Artifact File : $artifactFile"
                    fi
                  fi
                
                  echo "##[debug] Project Artifact Name : $artifactName"
                fi
                
                echo "##vso[task.setvariable variable=ARTIFACT_PATH;isOutput=true]$artifactPath"
                echo "##vso[task.setvariable variable=ARTIFACT_FILE;isOutput=true]$artifactFile"
                echo "##vso[task.setvariable variable=ARTIFACT_NAME;isOutput=true]$artifactName"
          

          ## -> Compress artifacts into tar. This allows to use less space and to be used in other stages, jobs or tasks.
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            condition: succeeded()
            continueOnError: false
            inputs:
              ArtifactName: $(artifact_name.ARTIFACT_NAME)
              StoreAsTar: true

          ## -> Publish results for JUnit tests
          - task: PublishTestResults@2
            name: t_publish_test_result
            displayName: Publish Test Results
            inputs:
              mergeTestResults: true
              searchFolder: $(Build.ArtifactStagingDirectory)
              testResultsFiles: '**/TEST-*.xml'
              testResultsFormat: JUnit
              testRunTitle: Test Results
              failTaskOnFailedTests: true
              publishRunAttachments: false
            continueOnError: true

          ## -> Publish results for Code Coverage
          - task: PublishCodeCoverageResults@1
            name: t_publish_code_coverage_result
            displayName: 'Publish Code Coverage Result'
            inputs:
              codeCoverageTool: JaCoCo
              summaryFileLocation: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_SUMMARY_FILE_LOCATION)
              pathToSources: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH_TO_SOURCE)
              reportDirectory: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_REPORT_DIRECTORY)
              additionalCodeCoverageFiles: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_ADDITIONAL_FILE)
            continueOnError: true