variables:

## -> Variables for source data
- name: GROUP_ID
  value: $[ stageDependencies.environment_init.environment.outputs['source_data.GROUP_ID'] ]
- name: ARTIFACT_ID
  value: $[ stageDependencies.environment_init.environment.outputs['source_data.ARTIFACT_ID'] ]
- name: ARTIFACT_MODULES
  value: $[ stageDependencies.environment_init.environment.outputs['source_data.ARTIFACT_MODULES'] ]
- name: ARTIFACT_PATH
  value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_PATH'] ]
- name: ARTIFACT_FILE
  value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_FILE'] ]
- name: ARTIFACT_NAME
  value: $[ stageDependencies.ci_build.build.outputs['artifact_name.ARTIFACT_NAME'] ]
- name: NEW_VERSION
  value: $[ stageDependencies.ci_build.build.outputs['new_version.NEW_VERSION'] ]
- name: LEGACY_MODE
  value: $[ stageDependencies.ci_build.build.outputs['java_version.LEGACY_MODE'] ]
