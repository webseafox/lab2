variables:
  ## -> Proxy
  AZURE_HTTP_PROXY: "http://10.240.58.39:3128"
  AZURE_HTTPS_PROXY: "http://10.240.58.39:3128"
  AZURE_NO_PROXY: "scm.azurewebsites.net"

  ## -> Skip Deploy if parameter is true, the branch is not as listed or is not an tag
  SKIP_DEPLOY: ${{ or(eq(parameters.skipDeploy, true),
                not(or(in(variables['Build.SourceBranchName'], 'master', 'main', 'dev', 'esteira1', 'esteira2', 'preprod', 'prodlike'),
                startsWith(variables['Build.SourceBranch'], 'refs/tags')))) }}

  ## -> Set Environment base on branch and the its parameters
  ${{ if in(variables['Build.SourceBranchName'],'dev','esteira1','esteira2','preprod','prodlike' )}}:
    ENVIRONMENT: ${{variables['Build.SourceBranchName']}}
  ${{ else }}:
    ENVIRONMENT: ${{ parameters.environment }}

  ## -> Variables for liquibase Deploy to DEV
  ${{ if eq(variables['ENVIRONMENT'], 'dev') }}:
    FUNCTION_NAME: $(APPNAME_DEV)
    RESOURCE_GROUP: $(RESOURCE_GROUP_DEV)
    SERVICE_PRINCIPAL_ENV: DEV

  ## -> Variables for liquibase to Deploy to ESTEIRA1
  ${{ if eq(variables['ENVIRONMENT'], 'esteira1') }}:
    FUNCTION_NAME: $(APPNAME_ESTEIRA1)
    RESOURCE_GROUP: $(RESOURCE_GROUP_ESTEIRA1)
    SERVICE_PRINCIPAL_ENV: TEST

  ## -> Variables for liquibase to Deploy to ESTEIRA2
  ${{ if eq(variables['ENVIRONMENT'], 'esteira2') }}:
    FUNCTION_NAME: $(APPNAME_ESTEIRA2)
    RESOURCE_GROUP: $(RESOURCE_GROUP_ESTEIRA2)
    SERVICE_PRINCIPAL_ENV: TEST

  ## -> Variables for liquibase to Deploy to PREPROD
  ${{ if eq(variables['ENVIRONMENT'], 'preprod') }}:
    FUNCTION_NAME: $(APPNAME_PREPROD)
    RESOURCE_GROUP: $(RESOURCE_GROUP_PREPROD)
    SERVICE_PRINCIPAL_ENV: TEST

  ## -> Variables for liquibase to Deploy to PRODLIKE
  ${{ if eq(variables['ENVIRONMENT'], 'prodlike') }}:
    FUNCTION_NAME: $(APPNAME_PRODLIKE)
    RESOURCE_GROUP: $(RESOURCE_GROUP_PRODLIKE)
    SERVICE_PRINCIPAL_ENV: TEST

  ## -> Variables for liquibase to Deploy to PROD
  ${{ if eq(variables['ENVIRONMENT'], 'producao') }}:
    FUNCTION_NAME: $(APPNAME_PRODUCAO)
    RESOURCE_GROUP: $(RESOURCE_GROUP_PRODUCAO)
    SERVICE_PRINCIPAL_ENV: PROD
