stages:
- stage: gates_environment_init
  displayName: "CI - Gates - Environment"
  pool:
    name: $(AGENT_POOL_CI)

  jobs:

  - job: environment
    displayName: Set up environment
    condition: succeeded()
    steps:

    ## -> Checkout code
    - checkout: none

    ## -> Download SONARQUBE Token
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Sonarqube Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'SONARQUBE-TOKEN'

    ## -> Set SONARQUBE credentials to variables. This allows it to used in other stages, jobs or tasks.
    - task: Bash@3
      displayName: 'Set Sonarqube Credentials Variables'
      name: sonarqube_credentials
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[group] Secrets for SONARQUBE"

          echo "##[debug] SONARQUBE-TOKEN: $(SONARQUBE-TOKEN). Use as >> SONARQUBE_TOKEN. "
          echo "##vso[task.setvariable variable=SONARQUBE_TOKEN;isOutput=true;isSecret=true]$(SONARQUBE-TOKEN)"

          echo "##[endgroup]"
          echo "##[debug] To open and check the information above, click the arrows on the left."
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'SONARQUBE-TOKEN'

    ## -> Configuration key for security from security team template
    - template: /security/get_appconfig_keys.yml
      parameters:
        azureSubscription: $(AZURE_APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        appConfigurationEndpoint: $(AZURE_APP_CONFIGURATION_ENDPOINT)
