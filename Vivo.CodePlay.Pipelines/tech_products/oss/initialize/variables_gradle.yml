variables:

# Variables for java
- name: GRADLE_CMD_BUILD
  value: 'gradle assemble'
- name: GRADLE_CMD_BUILD_OPTIONAL
  value: ''
- name: GRADLE_CMD_TEST
  value: 'gradle check'
- name: GRADLE_CMD_TEST_OPTIONAL
  value: ''
- name: GRADLE_CMD_PUBLISH
  value: 'gradle publish'
- name: GRADLE_CMD_PUBLISH_OPTIONAL
  value: ''
- name: GRADLE_BUILD_FILE
  value: 'build.gradle'
- name: GRADLE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/x/aDrcJg"

# Variables to extract data with docker
- name: GRADLE_PIPELINE_BUILD_VERSION
  value: $(docker run --rm --log-driver none --entrypoint yq -v $(pwd)/pipeline/properties.yaml:$(pwd)/pipeline/properties.yaml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq .artifacts.VERSION $(pwd)/pipeline/properties.yaml)
- name: GRADLE_PIPELINE_PROPERTIES_GROUP_ID
  value: $(docker run --rm --log-driver none --entrypoint yq -v $(pwd)/pipeline/properties.yaml:$(pwd)/pipeline/properties.yaml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq .artifacts.GROUP_ID $(pwd)/pipeline/properties.yaml)
- name: GRADLE_PIPELINE_PROPERTIES_ARTIFACT_ID
  value: $(docker run --rm --log-driver none --entrypoint yq -v $(pwd)/pipeline/properties.yaml:$(pwd)/pipeline/properties.yaml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq .artifacts.ARTIFACT_ID $(pwd)/pipeline/properties.yaml)
