variables:

# Variables for java
- name: JAVA_CMD_BUILD
  value: 'mvn clean install'
- name: JAVA_CMD_BUILD_TEST
  value: ''
- name: JAVA_CMD_OPTIONAL
  value: ''

# Variables for Maven 
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: ""
- name: JAVA_VERSION_PUBLISH_MVN 
  value: "openjdk-11.0.2"
- name: JAVA_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/x/YzrcJg"

# Variables to extract data with docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.properties."java.version"  | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULES
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.modules | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULE
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.modules.module | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_PROFILE_MODULE
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.profiles.profile.modules.module | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_PROFILES
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.profiles | .[]' pom.xml)  
- name: DOCKER_CMD_EXTRACT_POM_XML_PROFILE
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r 'try .project.profiles.profile | .[]' pom.xml)  
- name: DOCKER_CMD_EXTRACT_POM_XML_DEPENDENCY
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.dependencies.dependency | .[]' pom.xml)  
- name: DOCKER_CMD_EXTRACT_ARTIFACT_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_GROUP_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)

# Variables for generic YAML validation (yq inside docker)
- name: DOCKER_CMD_YQ_VALIDATE_VALUES_FILE
  value: $(docker run --rm --log-driver none -v ${VALUES_FILE}:/work/values.yml vcr-docker.nexus.telefonica.com.br/ossd/oss-yq:d9968a3 eval '.' /work/values.yml > /dev/null)
- name: DOCKER_CMD_YQ_VALIDATE_FILE
  value: $(docker run --rm --log-driver none -v ${FILE_TO_VALIDATE}:/work/file.yml vcr-docker.nexus.telefonica.com.br/ossd/oss-yq:d9968a3 eval '.' /work/file.yml > /dev/null)

# Variables for coverage_report for java
- name: COVERAGE_REPORT_SUMMARY_FILE_LOCATION
  value: "**/target/site/jacoco/jacoco.xml"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src/main/java/"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/target/site/jacoco"
- name: COVERAGE_REPORT_ADDITIONAL_FILE

# Variables for istio.json conversion and merge (yq inside docker)
- name: DOCKER_CMD_YQ_CONVERT_ISTIO_JSON
  value: $(docker run --rm --log-driver none -v ${ISTIO_FILE}:/work/istio.json ${YQ_IMAGE} -P /work/istio.json > istio.yml)
- name: DOCKER_CMD_YQ_MERGE_VALUES_ISTIO
  value: $(docker run --rm --log-driver none -v ${VALUES_FILE}:/work/values.yml -v ${ISTIO_YML}:/work/istio.yml ${YQ_IMAGE} eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' /work/values.yml /work/istio.yml > temp.yml)
