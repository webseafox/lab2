parameters:
- name: environment
  type: string
  default: ''
- name: skipDeploy
  type: boolean

variables:
  LIQUIBASE_LABELS: ''

  ## -> Skip Deploy if parameter is true, the branch is not as listed or is not an tag
  SKIP_DEPLOY: ${{ or(eq(parameters.skipDeploy, true),
                not(or(in(variables['Build.SourceBranchName'], 'master', 'main', 'dev', 'esteira1', 'esteira2', 'preprod', 'prodlike', 'producao'),
                startsWith(variables['Build.SourceBranch'], 'refs/tags')))) }}

  ## -> Set Environment base on branch and the its parameters
  ${{ if in(variables['Build.SourceBranchName'],'dev','esteira1','esteira2','preprod','prodlike','producao' )}}:
    ENVIRONMENT: ${{variables['Build.SourceBranchName']}}
  ${{ else }}:
    ENVIRONMENT: ${{ parameters.environment }}

  ## -> Variables for liquibase Deploy to DEV
  ${{ if eq(variables['ENVIRONMENT'], 'dev') }}:
    URL_DATABASE: $(DATABASE_URL_DEV)
    DATABASE_USERNAME: $(DATABASE_USERNAME_DEV)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_DEV)

  ## -> Variables for liquibase to Deploy to ESTEIRA1
  ${{ if eq(variables['ENVIRONMENT'], 'esteira1') }}:
    URL_DATABASE: $(DATABASE_URL_ESTEIRA1)
    DATABASE_USERNAME: $(DATABASE_USERNAME_ESTEIRA1)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_ESTEIRA1)

  ## -> Variables for liquibase to Deploy to ESTEIRA2
  ${{ if eq(variables['ENVIRONMENT'], 'esteira2') }}:
    URL_DATABASE: $(DATABASE_URL_ESTEIRA2)
    DATABASE_USERNAME: $(DATABASE_USERNAME_ESTEIRA2)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_ESTEIRA2)

  ## -> Variables for liquibase to Deploy to PREPROD
  ${{ if eq(variables['ENVIRONMENT'], 'preprod') }}:
    URL_DATABASE: $(DATABASE_URL_PREPROD)
    DATABASE_USERNAME: $(DATABASE_USERNAME_PREPROD)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_PREPROD)

  ## -> Variables for liquibase to Deploy to PRODLIKE
  ${{ if eq(variables['ENVIRONMENT'], 'prodlike') }}:
    URL_DATABASE: $(DATABASE_URL_PRODLIKE)
    DATABASE_USERNAME: $(DATABASE_USERNAME_PRODLIKE)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_PRODLIKE)

  ## -> Variables for liquibase to Deploy to PROD
  ${{ if eq(variables['ENVIRONMENT'], 'producao') }}:
    URL_DATABASE: $(DATABASE_URL_PRODUCAO)
    DATABASE_USERNAME: $(DATABASE_USERNAME_PRODUCAO)
    DATABASE_PASSWORD: $(DATABASE_PASSWORD_PRODUCAO)