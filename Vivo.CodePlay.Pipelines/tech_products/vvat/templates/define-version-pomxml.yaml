# ESSE TEMPLATE DEVE SER ABSORVIDO PELO VERSION MANAGER

parameters:
  - name: workingDirectory
    type: string
    default: '.'
  - name: javaVersion
    type: string
    default: 'temurin-17.0.11'
  - name: versionFile
    type: string
    default: 'pom.xml'
  - name: versionIncrement
    type: string
    default: 'patch'
    values:
      - patch
      - minor
      - major


steps:
  - task: XmlParseFromVivo@4  
    displayName: 'Get version from pom.xml'
    inputs:
      type: 'file'
      origin: ${{ parameters.versionFile }}
      jpaths: |
        var VERSION = .project.version._text

  # Define a próxima versão
  - task: semver-bump@1
    displayName: Bump Version
    name: defineVersion
    inputs:
      VersionVariable: 'VERSION'
      IncrementLevel: ${{ parameters.versionIncrement }}

  - task: Maven@4
    displayName: "Maven versions:set"
    inputs:
      goals: "versions:set"
      options: >
        -s $(MAVEN_CUSTOM_SETTINGS)
        -Dmaven.repo.local=$(MAVEN_REPO_LOCAL)
        -Dmaven.test.skip=true 
        -DnewVersion=$(VERSION)
        -DprocessAllModules
        -DgenerateBackupPoms=false
        -N versions:update-child-modules
      mavenPomFile: ${{ parameters.versionFile }}
      mavenOptions: "-Xmx3072m"
      mavenVersionOption: 'Path'
      mavenDirectory: /home/svc_devopscorp/.asdf/installs/maven/3.9.9
      javaHomeOption: "JDKVersion"
      workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ASDF_JAVA_VERSION: ${{ parameters.javaVersion }}
      MAVEN_CUSTOM_SETTINGS: $(MAVEN_CUSTOM_SETTINGS)
      DEVOPS_PREPROD_ARTIFACTS_PASSWORD: $(System.AccessToken)
      # DEVOPS_ARTIFACTS_PASSWORD: $(myConn.auth_password)
      NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
      NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
      AZURE_DEVOPS_PAT: $(System.AccessToken) # O Nome é AZURE_DEVOPS_PAT para deixar mais claro como desenvolvedor deve usar o arquivo para build local
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)