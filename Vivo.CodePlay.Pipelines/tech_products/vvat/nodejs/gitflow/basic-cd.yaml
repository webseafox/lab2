trigger:
  branches:
    include:
      - "master"
      - "main"
      - "codeplay"
  paths:
    exclude:
      - .azuredevops/*ci.*
      - .azuredevops/*pr.*

variables:
  - group: "azdo-team-project-variables"
  - group: "${{ variables['Build.Repository.Name'] }}"

parameters:
  - name: helm_use_config_file
    type: boolean
    default: false

stages:
  - stage: Deploy
    jobs:
      - job: Helm
        pool:
          name: GeneralPurposeLinuxAgentsCD
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: true

          - task: Bash@3
            displayName: "Generate Helm Commands from Variable Group"
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
            inputs:
              targetType: "inline"
              script: |
                echo "##[group]🔧 Descobrindo variáveis da Variable Group"

                VARIABLE_GROUP_NAME="$(Build.Repository.Name)"
                echo "📛 Variable Group: $VARIABLE_GROUP_NAME"

                # Obter variáveis do grupo
                GROUP_VARS_JSON=$(az pipelines variable-group list --group-name "$VARIABLE_GROUP_NAME" --query "[0].variables" -o json 2>/dev/null)

                if [ -z "$GROUP_VARS_JSON" ] || [ "$GROUP_VARS_JSON" = "null" ] || [ "$GROUP_VARS_JSON" = "{}" ]; then
                  echo "❌ Variable Group não encontrado: $VARIABLE_GROUP_NAME"
                  exit 1
                fi

                echo "✅ Variable Group localizado com $(echo "$GROUP_VARS_JSON" | jq 'keys | length') variáveis"
                echo "##[endgroup]"

                echo "##[group]🚀 Gerando comandos Helm dinâmicos"

                HELM_ENV_COMMANDS=""

                # Processar cada variável da Variable Group
                while IFS= read -r var_name; do
                  if [ -n "$var_name" ]; then
                    var_value=$(echo "$GROUP_VARS_JSON" | jq -r ".\"$var_name\".value // \"\"")
                    is_secret=$(echo "$GROUP_VARS_JSON" | jq -r ".\"$var_name\".isSecret // false")
                    
                    echo "🔍 $var_name (secret: $is_secret)"
                    
                    if [ "$is_secret" = "true" ]; then
                      # Para variáveis secretas: usar referência a variável de ambiente
                      HELM_ENV_COMMANDS="$HELM_ENV_COMMANDS --set secret.data.$var_name=\"\$($var_name)\""
                    elif [ -n "$var_value" ] && [ "$var_value" != "null" ]; then
                      # Para variáveis normais: usar valor literal
                      HELM_ENV_COMMANDS="$HELM_ENV_COMMANDS --set config.data.$var_name=\"$var_value\""
                    fi
                  fi
                done <<< "$(echo "$GROUP_VARS_JSON" | jq -r 'keys[]')"

                echo "✅ Comandos gerados (${#HELM_ENV_COMMANDS} caracteres)"
                echo "##[endgroup]"

                echo "##[group]💾 Salvando comandos para uso posterior"

                # Salvar comando para uso em tasks Helm reais
                echo "##vso[task.setvariable variable=HELM_ENV_COMMANDS]$HELM_ENV_COMMANDS"

                echo "📋 Comando salvo na variável HELM_ENV_COMMANDS:"
                echo "$HELM_ENV_COMMANDS"
                echo ""
                echo "💡 Para usar em uma task Helm real:"
                echo "helm upgrade --install myapp chart \$HELM_ENV_COMMANDS"
                echo "##[endgroup]"

                echo "##[group]🧪 Demonstração de uso"

                echo "📋 Comando gerado (pronto para usar em Helm):"
                echo "$HELM_ENV_COMMANDS"
                echo ""

                echo "🎯 Exemplo de uso em uma task Helm:"
                echo "- task: HelmDeploy@0"
                echo "  inputs:"
                echo "    command: 'upgrade'"
                echo "    chartType: 'FilePath'"
                echo "    chartPath: './chart'"
                echo "    releaseName: 'myapp'"
                echo "    arguments: '$HELM_ENV_COMMANDS --set labels.team=integracao'"
                echo ""

                echo "🚀 Ou via linha de comando:"
                echo "helm upgrade --install myapp ./chart \\"

                # Mostrar comando sem tentar expandir (pois secrets podem não estar disponíveis aqui)
                echo "$HELM_ENV_COMMANDS" | sed 's/--set/  --set/g' | sed 's/^  //'
                echo "  --set labels.team=integracao \\"
                echo "  --namespace mynamespace"

                echo ""
                echo "💡 IMPORTANTE: As variáveis \$(VAR_NAME) serão automaticamente expandidas"
                echo "   pelo Azure DevOps quando o comando for executado em uma task Helm real."
                echo ""
                echo "✅ SUCESSO! Comando universal gerado para qualquer Variable Group!"
                echo "##[endgroup]"

          - ${{ if eq(parameters.helm_use_config_file, true) }}:
              - task: Bash@3
                displayName: "Check Helm values file"
                inputs:
                  targetType: "inline"
                  script: |
                    HELM_PATH="$(Build.SourcesDirectory)/.azuredevops/helm"
                    
                    echo "Verificando diretório: $HELM_PATH"
                    
                    # Verifica se o diretório existe
                    if [ ! -d "$HELM_PATH" ]; then
                      echo "❌ Diretório $HELM_PATH não encontrado."
                      exit 1
                    fi
                    
                    echo "✅ Diretório $HELM_PATH encontrado."
                    
                    # Verifica diretamente os arquivos conhecidos
                    VALUES_FILE=""
                    if [ -f "$HELM_PATH/values.yml" ]; then
                      VALUES_FILE="values.yml"
                    elif [ -f "$HELM_PATH/values.yaml" ]; then
                      VALUES_FILE="values.yaml"
                    fi
                    
                    if [ -n "$VALUES_FILE" ]; then
                      echo "📄 Arquivo de valores encontrado: $VALUES_FILE"
                      FULL_PATH="$HELM_PATH/$VALUES_FILE"
                      echo "📍 Caminho completo: $FULL_PATH"
                      echo "##vso[task.setvariable variable=HELM_VALUES_FILE]$FULL_PATH"
                    else
                      echo "❌ Arquivo de valores não encontrado."
                      echo "📂 Conteúdo do diretório $HELM_PATH:"
                      ls -la "$HELM_PATH" 2>/dev/null || echo "Não foi possível listar o diretório"
                      exit 1
                    fi
                    PATH_VALUES="$PATH/$FILE_VALUES"
                    echo "##vso[task.setvariable variable=HELM_VALUES_FILE]$PATH_VALUES"

          - task: YamlParseFromVivo@4
            displayName: "Get Metadata Info"
            inputs:
              type: "file"
              origin: $(Build.SourcesDirectory)/catalog-info.yaml
              jpaths: |
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']

          - task: Bash@3
            displayName: "Get Version"
            inputs:
              targetType: "inline"
              script: |
                if [ ! -f package.json ]; then
                  echo "❌ package.json não encontrado!"
                  ls -la
                  exit 1
                fi
                
                echo "✅ package.json encontrado"
                
                # Verifica se jq está disponível
                if ! command -v jq &> /dev/null; then
                  echo "❌ jq não encontrado! Instalando..."
                  sudo apt-get update && sudo apt-get install -y jq
                fi
                
                # Extrai a versão
                VERSION=$(jq -r '.version' package.json)
                
                # Valida se a versão foi extraída
                if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                  echo "❌ Não foi possível extrair a versão do package.json"
                  echo "📂 Conteúdo do package.json:"
                  cat package.json
                  exit 1
                fi
                
                echo "📋 Versão extraída: $VERSION"
                echo "##vso[task.setvariable variable=VERSION]$VERSION"
                echo "✅ Variável VERSION definida com sucesso"

          - task: DownloadSecureFile@1
            # this task must have a name
            name: kubeconfig
            displayName: "Download config from VVAT"
            inputs:
              secureFile: "kubeconfig-vvat.yml"

          - task: AzureKeyVault@2
            displayName: "[Helm ACR] Getting AKV credentials"
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 3
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: $(AKV_DEVOPS_NAME)
              SecretsFilter: "HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD"

          - task: CmdLine@2
            displayName: "[ACR] Helm upgrade"
            env:
              HELM_USE_CONFIG_FILE: ${{ parameters.helm_use_config_file }}
              HELM_REGISTRY_ACR_NAME: $(HELM_REGISTRY_ACR_NAME)
              USERNAME: $(HELM-REGISTRY-ACR-USERNAME)
              PASSWORD: $(HELM-REGISTRY-ACR-PASSWORD)
              HTTP_PROXY: "http://10.240.58.39:3128"
              HTTPS_PROXY: "http://10.240.58.39:3128"
              NO_PROXY: "localHELM_REGISTRY_ACR_NAME,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
            inputs:
             script: |
                source ~/.bashrc
                echo "##[debug] HELM_REGISTRY_ACR_NAME.......: ${HELM_REGISTRY_ACR_NAME}"
                echo "##[debug] USERNAME...: ${USERNAME}"
                echo "##[debug] PASSWORD...: ************"
                echo "##[debug] HTTP_PROXY.: ${HTTP_PROXY}"
                echo "##[debug] HTTPS_PROXY: ${HTTPS_PROXY}"
                echo "##[debug] HELM_USE_CONFIG_FILE: ${HELM_USE_CONFIG_FILE}"

                if [ -z "${USERNAME}" ] || [ -z "${PASSWORD}" ]; then
                  echo "❌ Credenciais ACR não encontradas"
                  echo "USERNAME: ${USERNAME:+SET}"
                  echo "PASSWORD: ${PASSWORD:+SET}"
                  exit 1
                fi

                echo "✅ Fazendo login no ACR: ${HELM_REGISTRY_ACR_NAME}"
                helm registry login ${HELM_REGISTRY_ACR_NAME} \
                  --username ${USERNAME} \
                  --password "${PASSWORD}"

                if [ $? -ne 0 ]; then
                  echo "❌ Falha no login do ACR"
                  exit 1
                fi

                # Construir comando base do Helm
                VALUES_ARG="--install $(CATALOG_YAML_NAME) \
                oci://${HELM_REGISTRY_ACR_NAME}/helm/devops/generic-nodejs \
                --version 1.0.5 \
                --kubeconfig $(kubeconfig.secureFilePath) \
                --namespace $(CATALOG_YAML_K8S_NS) \
                --create-namespace \
                --set fullnameOverride=$(CATALOG_YAML_NAME) \
                $(HELM_ENV_COMMANDS) \
                --set image.repository=${HELM_REGISTRY_ACR_NAME}/${CATALOG_YAML_ACRONYM}/$(CATALOG_YAML_NAME) \
                --set image.tag=${VERSION} \
                --set health.livenessProbe.enabled=false \
                --set health.readinessProbe.enabled=false \
                --set health.livenessProbe.path=/$(CATALOG_YAML_NAME)/v1/health/live \
                --set health.readinessProbe.path=/$(CATALOG_YAML_NAME)/v1/health/ready \
                --set 'virtualService.http[0].match[0].uri.prefix=/comp-atlas' \
                --set 'virtualService.http[0].rewrite.uri=/' \
                --set 'virtualService.http[0].headers.request.set.X-Forwarded-Prefix=/comp-atlas' \
                --set 'virtualService.http[0].headers.request.set.X-Script-Name=/comp-atlas' \
                --force \
                --debug \
                --atomic \
                --wait \
                --timeout 300s"

                # Adicionar values file se especificado
                HELM_USE_CONFIG_FILE=$(echo "$HELM_USE_CONFIG_FILE" | tr '[:upper:]' '[:lower:]')
                if [[ "$HELM_USE_CONFIG_FILE" == "true" ]]; then
                  if [ -n "$(HELM_VALUES_FILE)" ]; then
                    VALUES_ARG="$VALUES_ARG --values $(HELM_VALUES_FILE)"
                    echo "✅ Adicionado arquivo de valores: $(HELM_VALUES_FILE)"
                  else
                    echo "⚠️ HELM_USE_CONFIG_FILE=true mas HELM_VALUES_FILE não está definido"
                  fi
                fi

                echo "##[group]🚀 Executando Helm upgrade"
                echo "📋 Comando completo: helm upgrade $VALUES_ARG"
                echo "📋 Variáveis da Variable Group: $(HELM_ENV_COMMANDS)"
                echo "##[endgroup]"
                
                helm upgrade $VALUES_ARG
                
                if [ $? -eq 0 ]; then
                  echo "✅ Helm executado com sucesso"
                else
                  echo "❌  Falha na execução do Helm"
                  exit 1
                fi