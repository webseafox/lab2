parameters:
- name: description
  type: string
- name: maven_command
  type: string
- name: docker_image
  type: string
- name: execution_parameters
  type: string

stages:
- stage: scenarios_exec
  displayName: "${{ parameters.description }}"
  pool:
    name: GeneralPurposeLinuxAgentsCI 
  jobs:
  - job: scenarios_exec
    timeoutInMinutes: 180
    cancelTimeoutInMinutes: 3  
    displayName: "Execução do Cenário"
    steps:
      - task: AzureKeyVault@2
        displayName: 'Recuperando credenciais'
        inputs:
          azureSubscription: DevOpsSharedResources
          KeyVaultName: kv-azdevops-shared
          secretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'
      - task: Docker@2
        displayName: 'Fazendo autenticação'
        inputs:
          command: 'login'
          containerRegistry: ACR-DEVOPS
          timeoutInMinutes: 90   
      - bash: |
          set -e
          # Runs builder image
          docker run --rm \
            --user="$(id -u):$(id -g)" \
            --network host \
            --log-driver none \
            -e HTTPS_PROXY="$HTTPS_PROXY" \
            -e HTTP_PROXY="$HTTP_PROXY" \
            -e NO_PROXY="$NO_PROXY" \
            -e JAVA_OPTS_MEMORY_MAX="$DEFAULT_MAX_MEMORY_BUILD" \
            -e TZ="America/Sao_Paulo" \
            -e SYSTEM_ACCESSTOKEN="$SYSTEM_ACCESSTOKEN" \
            -e NEXUS_DEPS_USR="$NEXUS_DEPS_USR" \
            -e NEXUS_DEPS_PSW="$NEXUS_DEPS_PSW" \
            -v $(pwd):/app \
            -v $HOME/.m2:/.m2 \
            -w /app \
            acrsharedservices01.azurecr.io/base/qa/selenium-junit/oraclient/runtime:1.0.1 \
            /bin/bash -c "mvn ${{ parameters.maven_command }} ${{ parameters.execution_parameters }} 2>&1 | tee maven_output.log"

          # Verificação de Falhas
          if grep -q 'BUILD FAILURE' maven_output.log; then
            echo "Build failed. Pipeline failed."
            exit 1
          elif grep -q 'There are test failures.' maven_output.log; then
            echo "There are test failures. Pipeline failed."
            exit 1
          elif grep -q 'Tests in error:' maven_output.log; then
            echo "There are test errors. Pipeline failed."
            exit 1
          else
            echo "Tests passed successfully. Pipeline passed."
          fi
        displayName: 'Fazendo o build e os testes'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
          NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
          DEFAULT_MAX_MEMORY_BUILD: "$DEFAULT_MAX_MEMORY_BUILD"
          DOCKER_WORKDIR: $(DOCKER_WORKDIR)/app/

      
      - task: PublishPipelineArtifact@1
        displayName: 'Upload relatório'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/RunResults/'
          publishLocation: 'pipeline' 
        condition: always()
      - task: DeleteFiles@1
        displayName: 'Limpar diretório'
        inputs:
          SourceFolder: '$(System.DefaultWorkingDirectory)/s'
          Contents: 'RunResults/**'     
        condition: always()
