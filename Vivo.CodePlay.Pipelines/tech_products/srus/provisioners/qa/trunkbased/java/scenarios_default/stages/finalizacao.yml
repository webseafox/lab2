stages:
- stage: finalizacao
  displayName: "Finalização"
  dependsOn:
    - execucao    
  jobs:
  - job: finalizacao
    displayName: "Finalização"
    pool:
      name: GeneralPurposeLinuxAgentsCI
    steps:
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/RunResults/'
        publishLocation: 'pipeline' 
    - task: DeleteFiles@1
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/s'
        Contents: 'RunResults/**'