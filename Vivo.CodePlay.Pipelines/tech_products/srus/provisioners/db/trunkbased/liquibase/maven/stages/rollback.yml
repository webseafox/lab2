stages:
- stage: rollback
  condition: failed('deploy')
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: "Rollback ${{parameters.environment}}"
  jobs:
    - deployment: 'rollback_${{variables.environment}}'
      workspace:
        clean: all
      displayName: Rollback
      environment: "rollback-db-${{parameters.environment}}"
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - template: /tech_products/srus/task_groups/rollback/liquibase_run_rollback.yml
          on:
            success:
              steps:
                - template: /tech_products/srus/task_groups/rollback/liquibase_run_pos_rollback_success.yml
            failure:
              steps:
                - template: /tech_products/srus/task_groups/rollback/liquibase_run_pos_rollback_failure.yml
