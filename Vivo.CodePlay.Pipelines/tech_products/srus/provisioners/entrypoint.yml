# Vivo Pipeline Core's entrypoint
# ===============================================================
#
# Usage sample for end user:
#
# resources:
#   repositories:
#     - repository: CorePipelines
#       name: DevOps/Vivo.Core.Pipelines
#       type: git       
#       ref: refs/tags/v1
#       endpoint: CorePipelines
#
# extends:
#   template: /tech_products/srus/provisioners/entrypoint.yml@CorePipelines
#   parameters:
#     config:
#       pipelineType: app
#       technology: java
#       modelName: api_default
#       branchingStrategy: trunkbased
#       params:
#         qa_environment: '${{parameters.qa_environment}}'
#         run_component_test: true
# ===============================================================

parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    pipelineType: app # i.e. app, infra, api_gateway, automation
    technology: java  # i.e. java, nodejs, python, helm, terraform, axway, flutter, acr, azdo_extension, azure_artifacts
    modelName: api_default # i.e. bff_client_default, api_default, lib_default, chart_default, databricks_default, azure, mobile_default, purge (App Legacy names: trunkbasedmicroservicek8s, gitflowmicroservicek8s, azure/m1, api/m2), default
    branchingStrategy: "" # i.e. trunkbased, vivoflow (for "app" type pipelines only)

# Template selection switches based on pipeline configuration parameters
extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/${{ parameters.config.branchingStrategy }}/${{ parameters.config.technology }}/${{ parameters.config.modelName}}/provisioner_entry_pr.yml
  # CI/CD
  ${{ elseif eq(parameters.config.pipelineType, 'app') }}:
    ${{ if or( eq(parameters.config.modelName, 'trunkbasedmicroservicek8s'), eq(parameters.config.modelName, 'api/m2') ) }}:     # Legacy model compatibility
      template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/trunkbased/${{ parameters.config.technology }}/api_default/provisioner_entry.yml
    ${{ elseif or( eq(parameters.config.modelName, 'gitflowmicroservicek8s'), eq(parameters.config.modelName, 'api/m1') ) }}:    # Legacy model compatibility
      template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/vivoflow/${{ parameters.config.technology }}/api_default/provisioner_entry.yml
    ${{ elseif eq(parameters.config.modelName, 'lib/m2') }}:                                                                     # Legacy model compatibility
      template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/trunkbased/${{ parameters.config.technology }}/lib_default/provisioner_entry.yml
    ${{ else }}:
      template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/${{parameters.config.branchingStrategy}}/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry.yml
  ${{ else }}:
    template: /tech_products/srus/provisioners/${{ parameters.config.pipelineType }}/${{parameters.config.branchingStrategy}}/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry.yml
  ${{ if parameters.config.params }}:
    parameters: ${{ parameters.config.params }}
