parameters:
- name: pythonVersion
  type: string

variables:
- template: /tech_products/srus/global/variables/pipeline.yml

# docker
- name: DOCKER_CMD_EXTRACT_PYTHON_SETUP_VERSION
  value: $(docker run --rm --log-driver none -v $(pwd):/app -w /app acrsharedservices01.azurecr.io/docker.io/library/python:${{ parameters.pythonVersion }} python setup.py --version)

# variables for app/python
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Python"
  
# variables for databricks
- name: CMD_EXTRACT_DATABRICKS_COMPONENT_VERSION
  value: $(cat VERSIONFILE)