parameters:
- name: incrementLevel
  default: patch

stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
    - pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: bump_version
    displayName: Bumping Version
    steps:
    - template: /tech_products/srus/tasks/git/checkout_last_commit.yml
      parameters:
        branchName: "$(Build.SourceBranchName)"
    - template: /tech_products/srus/tasks/maven/extract_api_version.yml
      parameters:
        currentVersionVariableOut: API_CURRENT_VERSION
    - template: /tech_products/srus/tasks/versioning/bump_version.yml
      parameters:
        currentVersion: $(export_current_version.API_CURRENT_VERSION)
        newVersionVariableOut: API_NEW_VERSION
        incrementLevel: ${{ parameters.incrementLevel }}

  - job: build_app
    displayName: Build & Test & Coverage
    dependsOn:
      - bump_version
    variables:
      - name: API_NEW_VERSION 
        value: $[ dependencies.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
    steps:
    - template: /tech_products/srus/tasks/bash/welcome.yml
    - template: /tech_products/srus/task_groups/build/maven_build_test.yml
      parameters:
        newVersion: $(API_NEW_VERSION)

    - script: |
        echo "===== PWD ====="
        pwd

        echo "===== target ====="
        ls -la target || true

        echo "===== target/classes ====="
        ls -la target/classes || true

        echo "===== Procurando .class ====="
        find . -name "*.class" | head -50
      displayName: Debug após Maven


    - template: /tech_products/srus/task_groups/tests/publish_tests_reports.yml
      parameters:
        coverageFilePattern: "$(COVERAGE_REPORT_SUMMARY_FILE_LOCATION)"
        pathToSources: "$(COVERAGE_REPORT_PATH_TO_SOURCE)"
        additionalCodeCoverageFiles: "$(COVERAGE_REPORT_ADDITIONAL_FILE)"
    - template: /tech_products/srus/tasks/catalog_info/extract_variables.yml
      parameters:
        condition: eq(variables['GRAFEAS_INTEGRATION_ENABLED'], true)

    - template: /tech_products/srus/tasks/grafeas/unit_test_occurrence.yml
      parameters:
        dockerAppName: $(APP_NAME)
        dockerAppVersion: $(API_NEW_VERSION)