stages:
- stage: validation
  displayName: "Validation"
  dependsOn:
  - package
  - build_test
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: grafeas
    displayName: "Grafeas Validation"
    condition: eq(variables['GRAFEAS_INTEGRATION_ENABLED'], true)
    variables:
    - name: IMAGE_DIGEST
      value: $[ stageDependencies.package.Package.outputs['docker_digest.DOCKER_DIGEST'] ]
    - name: APP_VERSION
      value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
    steps:
    - template: /tech_products/srus/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tech_products/srus/tasks/grafeas/validate_notes.yml
      parameters:
        imageDigest: $(IMAGE_DIGEST)
        dockerImageName: $(APP_NAME)
        dockerAppVersion: $(APP_VERSION)