stages:
- ${{ if eq(parameters.run_component_test, True)}}:
  - stage: component_test
    displayName: "Component Test"
    dependsOn: build_test
    pool: GeneralPurposeLinuxAgentsCI
    jobs:
    - job: component_test
      variables:
        - name: APP_VERSION
          value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.API_NEW_VERSION'] ]
      steps:
        - template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/steps/component_test/component_test.yml
        - template: /tech_products/srus/tasks/bash/change_root_files_ownership.yml