parameters:
# - name: qa_environment
#   type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False

variables:
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages: 
## INIT
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/stages/init.yml

## BUILD & TEST
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/stages/build_test.yml

## GATES
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/stages/gates.yml

## SECURITY
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

## COMPONENT TEST
- template: /tech_products/srus/provisioners/app/trunkbased/java/regression_test/stages/component_test.yml
  parameters:
    run_component_test: "${{parameters.run_component_test}}"