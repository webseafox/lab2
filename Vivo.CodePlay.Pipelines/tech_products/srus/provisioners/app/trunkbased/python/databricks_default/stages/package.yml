parameters:
- name: pythonVersion
  type: string
- name: incrementLevel
  default: patch
- name: unityCatalog
  type: boolean
- name: diretorio
  type: string
- name: environment
  type: string

stages:
- stage: package
  dependsOn:
  - build_test
  displayName: "Package & Publish"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: package
    condition: eq(variables.flowIsMain, true)
    displayName: "Package"
    steps:
    - template: /tech_products/srus/tasks/bash/welcome.yml
    
    - template: /tech_products/srus/task_groups/package/databricks_package.yml
      parameters:
        pythonVersion: ${{ parameters.pythonVersion }}
        unityCatalog: ${{ parameters.unityCatalog }}
        diretorio: ${{ parameters.diretorio }}
        environment: ${{ parameters.environment }}

    - template: /tech_products/srus/tasks/telemetry/telemetry.yml
