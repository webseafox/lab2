parameters:
- name: environment
  type: string
- name: pythonVersion
  type: string
- name: databricksHost
  type: string
- name: unityCatalog
  type: boolean
- name: diretorio
  type: string
- name: proxyAddl
  type: string 


stages:

# ================= PACKAGE =================
- stage: release_package
  displayName: "Package"
  pool: $(PRIVATE_AGENT_DEFAULT)

  jobs:
  - job: package
    displayName: "Package"
    steps:

    - template: /tech_products/srus/task_groups/package/databricks_package.yml
      parameters:
        pythonVersion: ${{ parameters.pythonVersion }}
        unityCatalog: ${{ parameters.unityCatalog }}
        diretorio: ${{ parameters.diretorio }}
        environment: ${{ parameters.environment }}

    - template: /tech_products/srus/tasks/telemetry/telemetry.yml



# ================= RELEASE =================
- stage: release
  pool: $(PRIVATE_AGENT_DEFAULT)
  dependsOn:
    - release_package
  displayName: "Deploy ${{ parameters.environment }}"

  jobs:
  - deployment: ${{ parameters.environment }}
    workspace:
      clean: all
    displayName: Deploy
    environment: "deploy-${{ parameters.environment }}"

    strategy:
      runOnce:
        deploy:
          steps:

          - download: none
          # =============================
          # Deploy Databricks
          # =============================

          - template: /tech_products/srus/task_groups/deploy/databricks_run_deploy.yml
            parameters:
              environment: ${{ parameters.environment }}
              pythonVersion: "${{ parameters.pythonVersion }}"
              databricksHost: ${{ parameters.databricksHost }}
              diretorio: ${{ parameters.diretorio }}
              proxyAddl: ${{ parameters.proxyAddl }}

        on:
          failure:
            steps:
            - template: /tech_products/srus/task_groups/deploy/run_pos_deploy_failure.yml
            - template: /tech_products/srus/tasks/telemetry/telemetry.yml
