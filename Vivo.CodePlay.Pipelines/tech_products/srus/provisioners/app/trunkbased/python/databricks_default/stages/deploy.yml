parameters:
- name: environment
- name: pythonVersion
  type: string
- name: gitTag

stages:
- stage: deploy
  dependsOn:
  - validation
  - bump_version
  pool: $(PRIVATE_AGENT_DEFAULT)
  displayName: "Deploy ${{ parameters.environment }}"
  jobs:
  - deployment: ${{ parameters.environment }}
    condition: eq(variables.flowIsMain, true)
    workspace:
      clean: all
    displayName: Deploy
    variables:
      NEW_VERSION: $[ stageDependencies.bump_version.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
      CURRENT_VERSION: $[ stageDependencies.bump_version.get_version.outputs['export_current_version.CURRENT_VERSION'] ]
    environment: "deploy-${{ parameters.environment }}"
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none

          - template: /tech_products/srus/task_groups/deploy/databricks_run_deploy.yml
            parameters:
              pythonVersion: "${{ parameters.pythonVersion }}"

        on:
          success:
            steps:
            - template: /tech_products/srus/tasks/databricks/update_repo_version.yml
              parameters:
                gitTag: ${{ parameters.gitTag }}
                currentVersion: $(CURRENT_VERSION)
                newVersion: $(NEW_VERSION)
                condition: eq(variables.BUMP_VERSION_ENABLED, true)

            - template: /tech_products/srus/tasks/telemetry/telemetry.yml
              
          failure:
            steps:
            - template: /tech_products/srus/task_groups/deploy/run_pos_deploy_failure.yml
                
            - template: /tech_products/srus/tasks/telemetry/telemetry.yml
