parameters:
- name: incrementLevel
  default: patch

stages:
- stage: bump_version
  displayName: Bump Version
  dependsOn:
    - pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: get_version
    displayName: Get Version
    steps:
    - template: /tech_products/srus/tasks/databricks/extract_component_version.yml
      parameters:
        currentVersionVariableOut: CURRENT_VERSION

  - job: bump_version
    displayName: Bumping Library Version
    dependsOn: get_version
    condition: eq(variables.BUMP_VERSION_ENABLED, true)
    variables:
      CURRENT_VERSION: $[ dependencies.get_version.outputs['export_current_version.CURRENT_VERSION'] ]
    steps:
    - template: /tech_products/srus/tasks/bash/welcome.yml
    - template: /tech_products/srus/tasks/versioning/bump_version.yml
      parameters:
        currentVersion: $(CURRENT_VERSION)
        newVersionVariableOut: NEW_VERSION
        incrementLevel: ${{ parameters.incrementLevel }}
    - template: /tech_products/srus/tasks/telemetry/telemetry.yml
