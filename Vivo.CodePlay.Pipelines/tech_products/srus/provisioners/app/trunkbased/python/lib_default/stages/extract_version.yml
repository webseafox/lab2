stages:
- stage: extract_version
  displayName: Extract Lib Version
  dependsOn: pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: get_version
    displayName: Get Version
    steps:
    - task: Docker@2
      displayName: 'Fazendo autenticação'
      inputs:
        command: 'login'
        containerRegistry: ACR-DEVOPS
        timeoutInMinutes: 90   
    - template: /tech_products/srus/tasks/git/checkout_last_commit.yml
      parameters:
        branchName: "$(Build.SourceBranchName)"
    - template: /tech_products/srus/tasks/python/extract_lib_version.yml
      parameters:
        currentVersionVariableOut: LIB_VERSION
