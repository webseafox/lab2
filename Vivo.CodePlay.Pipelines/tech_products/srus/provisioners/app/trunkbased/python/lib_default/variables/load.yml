parameters:
- name: updateVersion
  type: boolean
  default: false
- name: pythonVersion
  type: string

variables:
- template: /tech_products/srus/provisioners/app/global/python/variables/init.yml
  parameters:
    pythonVersion: ${{ parameters.pythonVersion }}

- group: "azdo-team-project-variables"

- group: "${{ variables['Build.DefinitionName'] }}"

- template: /.azuredevops/variables/private.yml@self

# variables for python/lib/m2
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Python+Lib"
  
- name: BUMP_VERSION_ENABLED
  value: $[and(eq(${{parameters.updateVersion}}, true), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))]