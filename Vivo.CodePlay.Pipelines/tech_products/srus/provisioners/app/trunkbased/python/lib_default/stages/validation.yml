stages:
- stage: validation
  displayName: "Validation"
  dependsOn:
  - security 
  - package
  - gate
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: validation
      condition: and(
                    succeeded(),
                    not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')),
                    or(
                      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                      eq(variables['Build.SourceBranch'], 'refs/heads/master')
                    )
                  )
      displayName: "Gates Validation"
      steps:
      - template: /tech_products/srus/tasks/bash/welcome.yml
