parameters:
- name: gitTag
- name: pythonVersion
  type: string
- name: currentVersion
  type: string
- name: newVersion
  type: string
- name: incrementLevel
  default: patch

steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    printf "
    ${GREEN}=================================================================================================================================
    ${GREEN}                                                 SUCCESS PACKAGE PUBLISH
    ${GREEN}=================================================================================================================================
    Parabéns sua aplicação foi implantada com sucesso no ambiente de runtime. Acesse a url da sua aplicação e valide  se sua nova versão foi entregue
    com sucesso.

    $(ALERT_MESSAGE_PREFIX_ARROW) Sua aplicação foi implantada com sucesso no ambiente
    $(ALERT_MESSAGE_PREFIX_ARROW) Verifique com o responsável técnico como acessar acessar a sua aplicação.
    $(ALERT_MESSAGE_PREFIX_ARROW) Caso não esteja conseguindo acessar a sua aplicação entre em contato com suporte.

    Caso tenha dúvidas sobre essa fase do pipeline acesse a nossa documentação: $(CORPORATE_WIKI_DOC_URL)
    ${GREEN}=================================================================================================================================
    "
  displayName: Package Publish Success
  name: t_success_message

- ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags')) }}:
  - template: /tech_products/srus/task_groups/publish/success_python_lib_publish.yml
    parameters: 
      gitTag: ${{parameters.gitTag}}
      pythonVersion: ${{parameters.pythonVersion}}
      currentVersion: ${{ parameters.currentVersion }}
      newVersion: ${{ parameters.newVersion }}
      incrementLevel: ${{ parameters.incrementLevel }}