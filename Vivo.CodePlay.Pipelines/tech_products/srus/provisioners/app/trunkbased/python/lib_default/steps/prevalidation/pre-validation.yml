steps:
- bash: |
    SONAR_FILE=".azuredevops/sonar-project.properties"
    VAR_FILE=".azuredevops/variables/private.yml"
    REQ_FILE="requirements.txt"
    REQ_DEV_FILE="requirements-dev.txt"
    SETUP_FILE="setup.py"
    MAKE_FILE="Makefile"
    FILES=($SONAR_FILE $VAR_FILE $REQ_FILE $REQ_DEV_FILE $SETUP_FILE $MAKE_FILE)

    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'

    EXIT_CODE=0
    for FILE in ${FILES[*]};
    do
      printf "${YELLOW} Verificando se o arquivo '${FILE}' existe -> "
      if [[ -f "$FILE" ]]; then
        printf "${GREEN} '${FILE}' existe!\n"
      else
        EXIT_CODE=1
        printf "${RED} [FAILED] '${FILE}' não existe!\n"
      fi
    done

    exit $EXIT_CODE
  displayName: Checking file structure
