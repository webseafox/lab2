parameters:
- name: run_component_test
  type: boolean
- name: qa_environment
  type: string

variables:
- template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages: 
# CI / CD Flow
  ## INIT
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/init.yml

  ## BUILD & TEST
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/build_test_bff_and_client.yml
  
  ## COMPONENT TEST
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/component_test.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
  
  ## GATES 
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/gates.yml

  ## SECURITY
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/security.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/package.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"

  ## VALIDATIONS
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/bff_client_default/stages/validation.yml