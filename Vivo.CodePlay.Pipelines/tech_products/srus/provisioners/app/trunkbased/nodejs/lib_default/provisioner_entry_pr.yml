parameters:
- name: incrementLevel
  default: patch

variables:
  - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
## INIT
- template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/stages/init.yml

## BUILD & TEST
- template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/stages/build_test.yml
  parameters:
    incrementLevel: ${{ parameters.incrementLevel }}

## GATES
- template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/stages/gates.yml

## SECURITY
- template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion