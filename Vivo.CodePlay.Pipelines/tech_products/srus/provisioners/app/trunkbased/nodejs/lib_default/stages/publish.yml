parameters:
- name: environment
  type: string
- name: gitTag
- name: incrementLevel
  default: patch    

stages:
- stage: Publish
  displayName: Check & Publish
  variables:
  - name: LIB_CURRENT_VERSION
    value: $[ stageDependencies.extract_version.get_version.outputs['export_current_version.LIB_VERSION'] ]
  - name: LIB_NEW_VERSION
    value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.LIB_NEW_VERSION'] ]
  dependsOn:
    - build_test
    - security
    - gate
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
#    - job: npm_check_publish
#      displayName: "Check"
#      steps:
#      - template: /tech_products/srus/tasks/catalog_info/extract_variables.yml
#        parameters:
#            workingDirectory: $(Build.SourcesDirectory)
#      - task: DownloadPipelineArtifact@2
#        inputs:
#          downloadPath: '$(System.ArtifactsDirectory)/myArtifact'
#      - task: ExtractFiles@1
#        displayName: Extract App Files
#        inputs:
#          archiveFilePatterns: '$(System.ArtifactsDirectory)/myArtifact/app/app.tar' ## obter nome via parametros
#          destinationFolder: '$(System.DefaultWorkingDirectory)/app'
#      - template: /tech_products/srus/tasks/nodejs/update_repo_version.yml
#        parameters:
#          newVersion: "$(LIB_NEW_VERSION)"
#          condition: eq(variables.BUMP_VERSION_ENABLED, true)

    - deployment: publish
      condition: succeeded()
      workspace:
        clean: all     
      environment: ${{ parameters.environment }}
      displayName: Publish Library
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - template: /tech_products/srus/task_groups/publish/npm_lib_publish.yml
          on:
            success:
              steps:
                - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/steps/publish/success.yml
                  parameters:
                    gitTag: ${{parameters.gitTag}}                    
                    currentVersion: $(LIB_CURRENT_VERSION)
                    newVersion: $(LIB_NEW_VERSION)
                    incrementLevel: ${{ parameters.incrementLevel }}
                - template: /tech_products/srus/tasks/telemetry/telemetry.yml                
            failure:
              steps:
                - template: /tech_products/srus/provisioners/app/trunkbased/nodejs/lib_default/steps/publish/failure.yml
                - template: /tech_products/srus/tasks/telemetry/telemetry.yml
