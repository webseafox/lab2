parameters:
- name: environment
- name: workDir
  default: "$(DEFAULT_WORKDIR_ARTIFACTS)"
- name: dev_namespace_to_deploy
  default: ''

steps:
- task: DownloadBuildArtifacts@1
  displayName: 'Download Build Artifacts'
  inputs:
    artifactName: app
    parallelizationLimit: 20
    extractTars: true

- template: /tech_products/srus/tasks/artifacts/download_docker.yml

- template: /tech_products/srus/tasks/helm/utils.yml
  parameters:
    environment: ${{parameters.environment}}
    dev_namespace_to_deploy: ${{parameters.dev_namespace_to_deploy}}