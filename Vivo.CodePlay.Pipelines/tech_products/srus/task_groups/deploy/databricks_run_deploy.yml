parameters:
- name: environment
  type: string
  default: dev

- name: databricksHost
  type: string
  default: $(BASE_DATABRICKS_URL_DEV)

- name: proxyAddl
  type: string
  default: $(PROXY_DEV)


- name: pythonVersion
  type: string

- name: diretorio
  type: string
  default: "SIRIUS_CORE"
  values:
    - "SIRIUS_CORE"
    - "SIRIUS_CORE_BSIM"

steps:
# =============================
# Load Key Vault (by environment)
# =============================

- ${{ if eq(parameters.environment, 'dev') }}:
  - task: AzureKeyVault@2
    displayName: "Load Databricks secrets - DEV"
    inputs:
      azureSubscription: "kv-nfcom-dev"
      KeyVaultName: "kv-nfcom-dev"
      SecretsFilter: sec-tenant-id,sec-dbw-sp-client-id,sec-service-principal-secret
      RunAsPreJob: true

- ${{ if eq(parameters.environment, 'homologation') }}:
  - task: AzureKeyVault@2
    displayName: "Load Databricks secrets - HML"
    inputs:
      azureSubscription: "kv-nfcom-test"
      KeyVaultName: "kv-nfcom-test"
      SecretsFilter: sec-tenant-id,sec-dbw-sp-client-id,sec-service-principal-secret
      RunAsPreJob: true

- ${{ if eq(parameters.environment, 'bsim') }}:
  - task: AzureKeyVault@2
    displayName: "Load Databricks secrets - BSIM"
    inputs:
      azureSubscription: "kv-nfcom-prod"
      KeyVaultName: "kv-nfcom-prod"
      SecretsFilter: sec-tenant-id,sec-dbw-sp-client-id,sec-service-principal-secret
      RunAsPreJob: true

- ${{ if eq(parameters.environment, 'production') }}:
  - task: AzureKeyVault@2
    displayName: "Load Databricks secrets - PRD"
    inputs:
      azureSubscription: "kv-nfcom-prod"
      KeyVaultName: "kv-nfcom-prod"
      SecretsFilter: sec-tenant-id,sec-dbw-sp-client-id,sec-service-principal-secret
      RunAsPreJob: true

# =============================
# Download artifact
# =============================

- template: /tech_products/srus/tasks/artifacts/download_pipeline.yml
  parameters:
    artifactName: databricksPackage
    targetPath: $(Build.SourcesDirectory)

# =============================
# Deploy notebooks
# =============================

- template: /tech_products/srus/tasks/databricks/deploy_notebooks.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    databricksHost: ${{ parameters.databricksHost }}
    databricksTenantId: $(sec-tenant-id)
    databricksClientId: $(sec-dbw-sp-client-id)
    databricksClientSecret: $(sec-service-principal-secret)
    diretorio: ${{ parameters.diretorio }}
    proxyAddl: ${{ parameters.proxyAddl }}
