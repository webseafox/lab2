parameters:
#JAVA|NODE|PYTHON
- name: stack
  type: string 
  values:
  - JAVA
  - NODE
  - PYTHON

- name: serviceConnectionName
  default: $(SONARQUBE_SERVICE_CONNECTION_NAME)

- name: configFile
  default: $(SONARQUBE_CONFIG_FILE)

- name: workdirArtifacts
  default: $(DEFAULT_WORKDIR_ARTIFACTS)

- name: librariesPath
  default: $(LIBRARIES_PATH)

- name: projectKey
  default: $(SONAR_PROJECT_KEY)

- name: version
  default: $(APP_VERSION)

- name: pythonVersion
  default: '3.9'

- name: javaVersion
  default: "openjdk-11.0.2"

- name: qualityGate
  default: $(SONARQUBE_PROJECT_QUALITYGATE)

steps:
- template: /tech_products/srus/tasks/sonar/setup_variables_liquibase.yml
  parameters:
    stack: '${{ parameters.stack }}'

- template: /tech_products/srus/tasks/sonar/setup_gate.yml
  parameters:
    projectKey: '${{ parameters.projectKey }}'
    qualityGate: '${{ parameters.qualityGate }}'

- template: /tech_products/srus/tasks/sonar/prepare_analysis.yml
  parameters:
    stack: '${{ parameters.stack }}'
    serviceConnectionName: '${{ parameters.serviceConnectionName }}'
    configFile: '${{ parameters.configFile }}'
    workdirArtifacts: '${{ parameters.workdirArtifacts }}'
    librariesPath: '${{ parameters.librariesPath }}'
    projectKey: '${{ parameters.projectKey }}'
    version: '${{ parameters.version }}'
    pythonVersion: '${{ parameters.pythonVersion }}'

- template: /tech_products/srus/tasks/sonar/run_code_analysis.yml
  parameters:
    javaVersion: '${{ parameters.javaVersion }}'

- template: /tech_products/srus/tasks/sonar/publish_analysis_result.yml

- template: /tech_products/srus/tasks/sonar/break_build_onfailure.yml
  parameters:
    serviceConnectionName: '${{ parameters.serviceConnectionName }}'
    
