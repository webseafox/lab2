parameters:
- name: newVersion
  default: ""
# - name: test_tag
#   type: string

steps:
- template: /tech_products/srus/tasks/maven/custom_settings_setup.yml
  parameters:
    mavenSettingsLocationOutputVarName: "MAVEN_SETTINGS_LOCATION"

- template: /tech_products/srus/tasks/maven/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tech_products/srus/tasks/maven/test_build_with_docker.yml
  parameters:
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)
    # test_tag: ${{ parameters.test_tag}}

- template: /tech_products/srus/tasks/artifacts/publish_app.yml