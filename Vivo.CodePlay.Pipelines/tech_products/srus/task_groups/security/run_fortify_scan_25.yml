                  "inUse": true
                }
              ],
              "guid": "TargetPlatform"
            },
            {
              "attributeDefinitionId": 10,
              "values": [
                {
                  "guid": "API",
                  "name": "Programmatic API",
                  "description": "Logic is only available through programmatic API access.",
                  "inUse": true
                }
              ],
              "guid": "Interfaces"
            },
            {
              "attributeDefinitionId": 12,
              "values": [
                {
                  "guid": "Custom",
