    ## -> Prepare FORTIFY Project Version Fields
    - task: Bash@3
      displayName: 'Prepare Fortify Project Version Fields'
      name: prepare_fortify
      condition: succeeded()
      continueOnError: false
      env:
        FORTIFY_ATTRIBUTES_FILE_NAME: "fortify-attributes"
      inputs:
        targetType: inline
        script: |

          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          # Export project id for Conviso sync
          echo "##vso[task.setvariable variable=PROJECT_ID;isoutput=true]$(FORTIFY_PROJECT_VERSION_ID)"

          echo "##[debug] Adding/updating attributes in the Project Version."
          response=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X PUT "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/attributes" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data @${FORTIFY_ATTRIBUTES_FILE_NAME})

          counter=$(echo $response | jq .count)
          echo "##[debug] Added/updated attributes. Total: $counter"

          echo "##[debug] Updating 'committed' field..."
          reponseUpdate=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X PUT "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data '{"committed": true}')

          commitedProjectVersionId=$(echo $reponseUpdate | jq .data.id)
          if [[ -n "$commitedProjectVersionId" ]]; then
            echo "##[debug] Project Version 'committed' field updated."
          else
            echo "##[error] Error while updating Project Version 'committed' field."
            echo $reponseUpdate | jq .message
            exit 1;
          fi

    ## -> Run FORTIFY
    - task: Bash@3
      displayName: 'Run Fortify SAST (client)'
      name: run_fortify
      condition: succeeded()
      continueOnError: false
      env:
        ASDF_JAVA_VERSION: "openjdk-17.0.2"
      inputs:
        targetType: inline
        script: |

          export FORTIFY_LOCAL_SCANCENTRAL_VERSION="25.2.0"

          echo "##[debug] Forçando versão do ScanCentral: ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}"

          if [ -d "$(Build.SourcesDirectory)/${{ parameters.repositoryName }}" ]; then
            echo "##[debug] Entrando no diretório do repositório: $(Build.SourcesDirectory)/${{ parameters.repositoryName }}"
            cd "$(Build.SourcesDirectory)/${{ parameters.repositoryName }}"
          else
            echo "##[debug] Permanecendo no diretório de sources: $(Build.SourcesDirectory)"
            cd "$(Build.SourcesDirectory)"
          fi

          echo "##[debug] Running FORTIFY scan with version ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}"

          scancentralCMD="$(FORTIFY_LOCAL_SCANCENTRAL_PATH)${FORTIFY_LOCAL_SCANCENTRAL_VERSION}$(FORTIFY_LOCAL_SCANCENTRAL_SCRIPT)"

          echo "##[command] $scancentralCMD"
          echo "##[debug] FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT...: $(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT)"
          echo "##[debug] FORTIFY_SSC_ENDPOINT......................: $(FORTIFY_SSC_ENDPOINT)"
          echo "##[debug] EXCLUDE_FILE_PARAM........................: $(EXCLUDE_FILE_PARAM)"
          echo "##[debug] FORTIFY_LOCAL_SCANCENTRAL_VERSION.........: ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}"
          echo "##[debug] FORTIFY_APP_DEFAULT_NAME..................: $(FORTIFY_APP_DEFAULT_NAME)"
          echo "##[debug] FORTIFY_APP_VERSION.......................: $(FORTIFY_APP_VERSION)"

          $scancentralCMD \
            -url $(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT) \
            -sscurl $(FORTIFY_SSC_ENDPOINT) \
            -ssctoken $(FORTIFY-SSC-CLI-TOKEN) \
            start $(EXCLUDE_FILE_PARAM) \
            -upload -block \
            -pool db170771-7d0d-40d9-a0d7-8aa8e1832854 \
            --log-file "$(Build.SourcesDirectory)/$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log" \
            --overwrite \
            --application "$(FORTIFY_APP_DEFAULT_NAME)" \
            --application-version "$(FORTIFY_APP_VERSION)" \
            -uptoken $(FORTIFY-SSC-CLI-TOKEN)

          if [ $? -eq 0 ]; then
            echo "##[debug] Fortify scan completed successfully."
          else
            echo "##vso[task.logissue type=error;] Fortify scan exited with errors."
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi
    ## -> Publish Scan log
    - task: PublishPipelineArtifact@1
      displayName: "Publish Scan log"
      inputs:
        targetPath: "$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log"
        artifactName: "${{ parameters.fortifyArtifactName }}"
        publishLocation: pipeline

    ## -> Setup Custom Tag 'Author'
    - task: Bash@3
      displayName: 'Setup Custom Tag Author'
      name: setup_custom_tag_author
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          
          echo "=================================================================="
          echo "Iniciando a configuração da Custom Tag 'Author'"
          echo "=================================================================="

          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)
          
          guid="8ddec2a8-6407-4731-951a-f366cb84c597"
          
          echo "##[debug] Usando Custom Tag 'Author' com GUID fixo: $guid"
          echo "##vso[task.setvariable variable=AUTHOR_TAG_GUID]$guid"

          # Verifica as custom tags aplicadas atualmente no projeto
          echo "##[debug] Verificando Custom Tags aplicadas atualmente para o projeto..."
          response=$(curl --cacert $(CACORP_LOCATION) -s -w "%{http_code}" \
          -H "Authorization: FortifyToken $fortifyToken" \
          "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/customTags?start=0&limit=100")

          code="${response: -3}"
          body="${response::-3}"

          if [ "$code" != "200" ]; then
              echo "##[error] Falha ao consultar Custom tags do projeto (HTTP $code)"
              exit 1
          fi

          echo "$body" | jq empty >/dev/null 2>&1 || { echo "##[error] JSON inválido recebido"; exit 1; }
          
          aplicada=$(echo "$body" | jq -r --arg guid "$guid" '.data[] | select(.guid==$guid) | .guid')

          if [ -n "$aplicada" ]; then
              echo "##[debug] A Custom Tag 'Author' já está habilitada no projeto."
          else
              echo "##[debug] A Custom Tag 'Author' ainda não está habilitada. Aplicando..."
              payload=$(echo "$body" | jq -r '.data[].guid' | jq -R . | jq -s 'map({guid:.})' | jq --arg guid "$guid" '. + [{"guid":$guid}]')

              applyResponse=$(curl --cacert $(CACORP_LOCATION) -s -w "%{http_code}" -X PUT \
              -H "Authorization: FortifyToken $fortifyToken" \
              -H "Content-Type: application/json" -d "$payload" \
              "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/customTags")

              applyCode="${applyResponse: -3}"
              
              if [ "$applyCode" == "200" ]; then
                  echo "##[debug] Custom Tag 'Author' aplicada com sucesso!"
              else
                  echo "##[warning] Falha ao aplicar Custom Tag 'Author' (HTTP $applyCode)"
              fi
          fi

    ## -> Get Fortify Report
    - task: Bash@3
      displayName: 'Get Fortify Report'
      name: process_report
      condition: succeeded()
      continueOnError: false
      env:
        REPOSITORY_NAME: "${{ parameters.repositoryName }}"
      inputs:
        targetType: inline
        script: |

          i="0"
          retries="10"
          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          guid="8ddec2a8-6407-4731-951a-f366cb84c597"
          echo "##[debug] Waiting for FORTIFY to process the report..."

          while [[ $i -lt $retries ]]
          do
            sleep 30s
            responseArtifact=$(curl --cacert $(CACORP_LOCATION) -s -g \
            -X GET "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/artifacts?limit=1" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: FortifyToken $fortifyToken")

            status=$(echo $responseArtifact | jq -r .data[0].status)
            echo "##[debug] Process status: $status"

            if [[ "$status" == "REQUIRE_AUTH" ]]; then
                echo "##vso[task.logissue type=error] There is a pending approval on the Fortify portal. To proceed with approval, contact AppSec by email (appsec_vivo.br@telefonica.com)"
                exit 1;
            elif [[ "$status" == "PROCESS_COMPLETE" ]]; then
                echo "##[debug] Process complete!"
                break
            fi

            i=$[$i+1]

          done

          echo "##[debug] Get FORTIFY report result "

          responseIssues=$(curl --cacert $(CACORP_LOCATION) -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/issues?start=0&limit=-1&orderby=id&q=%5Bfortify%20priority%20order%5D%3Acritical%20%5Bfortify%20priority%20order%5D%3Ahigh&qm=issues&showhidden=false&showremoved=false&showsuppressed=false" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken")

          ## -> Export the fortify response vulnerabilities to an file
          fortifyVulnerabilitiesFileName="${REPOSITORY_NAME}_fortify_vulnerabilities-$(System.JobAttempt).json"
          VULN_FILE_ABSOLUTE_PATH="$(Pipeline.Workspace)/s/${fortifyVulnerabilitiesFileName}"
          echo $responseIssues > "$VULN_FILE_ABSOLUTE_PATH"
          echo "##vso[task.setvariable variable=FORTIFY_VULNERABILITIES_FILE]$VULN_FILE_ABSOLUTE_PATH"

          issueCount=$(echo $responseIssues | jq --raw-output '.data | map({"prioridade": .enginePriority, "avaliado": .issueStatus, "situacoes": .primaryTag, "count": 1})')

          ## -> Variables for not reviewed vulnerabilities
          criticalNotReviewed=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and (.avaliado == "Unreviewed" or .avaliado == "Under Review"))] | map(.count) | add // 0' || echo "0")
          highNotReviewed=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and (.avaliado == "Unreviewed" or .avaliado == "Under Review"))] | map(.count) | add // 0' || echo "0")

          ## -> Variables for exploitable vulnerabilities
          criticalExploitable=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and .situacoes == "Exploitable" and (.avaliado != "Unreviewed" and .avaliado != "Under Review"))] | map(.count) | add // 0' || echo "0")
          highExploitable=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and .situacoes == "Exploitable" and (.avaliado != "Unreviewed" and .avaliado != "Under Review"))] | map(.count) | add // 0' || echo "0")

          ## -> Variables for Risk Accepted
          criticalRiskAccepted=$(echo $issueCount | jq '[.[] | select(.prioridade == "Critical" and (.avaliado != "Unreviewed" and .avaliado != "Under Review") and .situacoes != "Exploitable")] | map(.count) | add // 0' || echo "0")
          highRiskAccepted=$(echo $issueCount | jq '[.[] | select(.prioridade == "High" and (.avaliado != "Unreviewed" and .avaliado != "Under Review") and .situacoes != "Exploitable")] | map(.count) | add // 0' || echo "0")

          ## -> Variables for medium and low vulnerabilities
          medium=$(echo $issueCount | jq '[.[] | select(.prioridade == "Medium")] | map(.count) | add // 0' || echo "0")
          low=$(echo $issueCount | jq '[.[] | select(.prioridade == "Low")] | map(.count) | add // 0' || echo "0")

          totalVulnerabilities=$((criticalNotReviewed + highNotReviewed + criticalExploitable + highExploitable))

          if [[ $totalVulnerabilities -gt 0 ]]; then
            echo "##vso[task.logissue type=error;] Critical and/or high vulnerabilities were found in this project. Number of identified violations: ${totalVulnerabilities}"
          else
            echo "##[debug] No violations identified"
          fi

          echo "##vso[task.setvariable variable=CRITICAL_VULNERABILITIES_EXPLOITABLE;isreadonly=true]$criticalExploitable"
          echo "##vso[task.setvariable variable=CRITICAL_VULNERABILITIES_NOT_REVIEWED;isreadonly=true]$criticalNotReviewed"
          echo "##vso[task.setvariable variable=HIGH_VULNERABILITIES_EXPLOITABLE;isreadonly=true]$highExploitable"
          echo "##vso[task.setvariable variable=HIGH_VULNERABILITIES_NOT_REVIEWED;isreadonly=true]$highNotReviewed"

          # Navegar para o diretório correto do repositório
          if [ -d "$(Build.SourcesDirectory)/${{ parameters.repositoryName }}" ]; then
            cd "$(Build.SourcesDirectory)/${{ parameters.repositoryName }}"
          else
            cd "$(Build.SourcesDirectory)"
          fi

          if [ ! -f "$VULN_FILE_ABSOLUTE_PATH" ]; then
            echo "##[warning] Vulnerability report file not found at '$VULN_FILE_ABSOLUTE_PATH'."
            exit 0
          fi

          echo ""
          echo "##[section]## Blocking vulnerabilities report with Author ##"
          echo ""

    ## -> Publish Fortify Report
    - task: PublishPipelineArtifact@1
      displayName: "Publish Fortify Report"
      continueOnError: true
      inputs:
        targetPath: "$(FORTIFY_VULNERABILITIES_FILE)"
        artifactName: "${{ parameters.fortifyArtifactNameToPublish }}"
        publishLocation: pipeline

    ## -> Results Sync With Conviso Platform
    - task: convisoAzureSyncTask@1
      displayName: "Conviso Sync"
      condition: and(succeeded(), eq(variables.USE_CONVISO, 'true'), ne(variables['prepare_fortify.PROJECT_ID'], ''))
      continueOnError: true
      inputs:
        API_KEY: "$(CONVISO-API-KEY)"
        PROJECT_ID: "$(prepare_fortify.PROJECT_ID)"
        INTEGRATION: "FORTIFY"
        COMPANY_ID: ${{ parameters.convisoCompany }}

    ## -> Evaluate SAST Security Gate
    - task: Bash@3
      displayName: 'Evaluate Security Gate'
      name: evaluate_security_gate
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          skipSecurityGate=$(SKIP_SECURITY_GATE)

          if [[ ! "${skipSecurityGate}" =~ ^(T|t)rue$ ]]; then

            ## -> Analyze Security Gate data
            declare -i criticalVulnerabilitiesExploitable=$(CRITICAL_VULNERABILITIES_EXPLOITABLE)
            declare -i criticalVulnerabilitiesNotReviewed=$(CRITICAL_VULNERABILITIES_NOT_REVIEWED)
            declare -i highVulnerabilitiesExploitable=$(HIGH_VULNERABILITIES_EXPLOITABLE)
            declare -i highVulnerabilitiesNotReviewed=$(HIGH_VULNERABILITIES_NOT_REVIEWED)

            totalVulnerabilities=$((criticalVulnerabilitiesExploitable + criticalVulnerabilitiesNotReviewed + highVulnerabilitiesExploitable + highVulnerabilitiesNotReviewed))

            if [[ $criticalVulnerabilitiesExploitable -gt 0 || $criticalVulnerabilitiesNotReviewed -gt 0 || $highVulnerabilitiesExploitable -gt 0 || $highVulnerabilitiesNotReviewed -gt 0 ]]; then
              echo ""
              echo "════════════════════════════════════════════════════════════════════════════════"
              echo "##[error]❌ SECURITY GATE FAILED"
              echo "════════════════════════════════════════════════════════════════════════════════"
              echo ""
              echo "📊 Resumo das vulnerabilidades bloqueantes:"
              echo "   🔴 Critical: $((criticalVulnerabilitiesNotReviewed + criticalVulnerabilitiesExploitable))"
              echo "   🟠 High....: $((highVulnerabilitiesNotReviewed + highVulnerabilitiesExploitable))"
              echo "   ──────────────────────────────"
              echo "   ⚠️  Total...: ${totalVulnerabilities}"
              echo ""
              echo "👉 Para detalhes completos (arquivos, linhas, categorias de vulnerabilidades), consulte a task"
              echo "   'Get Fortify Report' acima nesta pipeline."
              echo ""
              echo "════════════════════════════════════════════════════════════════════════════════"
              echo ""
              echo "##vso[task.logissue type=error;] Security Gate failed! Check below or the publish report to see the violations."

              echo ""
              echo "##[section]## List of vulnerabilities that failed the Security Gate ##"
              cat "$(FORTIFY_VULNERABILITIES_FILE)" | jq -r '
                .data[] | select((.enginePriority == "High" or .enginePriority == "Critical")
                and (.primaryTag == "Exploitable" or .issueStatus == "Unreviewed" or .issueStatus == "Under Review")) |
                "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName + "[" + .issueStatus + " " + (.primaryTag) + "]"
              '

              echo "##vso[task.complete result=Failed;]"
              exit
            else
              echo "##[debug] Security Gate has been reached!"
            fi
          else
            echo "##vso[task.logissue type=warning;] Security Gate is OFF and Gate validation has been skipped! "
            echo "##[warning] Even if the Security Gate is turned off at the moment this does not mean that it cannot be turned on again in the near future."
            echo "##[warning] Please analyze the Critical and High vulnerabilities and try to fix them as soon as possible. "
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi

  - ${{ else }}:

    - task: Bash@3
      displayName: 'Security Scan Skipped'
      inputs:
        targetType: inline
        script: |
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          echo -e "${YELLOW}==================================[ AÇÃO: SCAN IGNORADO (SKIPPED) ]==================================${NC}"
          echo -e "Modo de Operação Ativo: ${YELLOW}VivoFlow${NC}"
          echo -e "Branch Atual: ${YELLOW}$(Build.SourceBranchName)${NC}"
          echo -e "Regras de Validação em Vigor: ${YELLOW}master, main, release/*, ${{ join(', ', parameters.vivoFlow) }}${NC}"
          echo ""
          echo -e "${YELLOW}MOTIVO: O scan de segurança foi intencionalmente ignorado pois o branch '$(Build.SourceBranchName)' não corresponde a nenhuma das regras de validação ativas.${NC}"
          echo ""
          echo -e "${BLUE}Dica: Se este branch deveria ser validado, acione a Equipe de AppSec appsec_vivo.br@telefonica.com${NC}"
          echo -e "${YELLOW}====================================================================================================${NC}"
