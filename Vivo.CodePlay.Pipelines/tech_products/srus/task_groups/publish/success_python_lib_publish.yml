parameters:
- name: gitTag
- name: pythonVersion
  type: string
- name: currentVersion
  type: string
- name: newVersion
  default: ''
- name: incrementLevel
  type: string
  default: patch

steps:
- template: /tech_products/srus/tasks/python/update_repo_version.yml
  parameters:
    pythonVersion: ${{parameters.pythonVersion}}
    currentVersion: ${{ parameters.currentVersion }}
    newVersion: ${{ parameters.newVersion }}
    incrementLevel: ${{ parameters.incrementLevel }}
    condition: eq(variables.BUMP_VERSION_ENABLED, true)
    createGitTag: ${{ parameters.gitTag }}

- ${{ if and(eq(parameters.gitTag, 'true'), eq(variables.BUMP_VERSION_ENABLED, false)) }}:
  - bash: |
      GIT_TAG=${NEW_VERSION}
      if [[ -z "${NEW_VERSION}" ]]; then
        GIT_TAG=${CURRENT_VERSION}
      fi

      echo "##vso[task.setvariable variable=VAR_GIT_TAG]${GIT_TAG}"
      echo "##[debug] Exporting variable 'VAR_GIT_TAG': ${GIT_TAG}"
    displayName: Defining Git Tag Version
    env:
      NEW_VERSION: ${{ parameters.newVersion }}
      CURRENT_VERSION: ${{ parameters.currentVersion }}

  - template: /tech_products/srus/tasks/git/tag.yml
    parameters:
      staticTagName: '$(VAR_GIT_TAG)'