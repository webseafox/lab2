parameters:
- name: stack
  type: string
  values:
  - JAVA
  - NODE
  - PYTHON

steps:
# - template: /tasks/artifacts/download_app.yml
#   parameters:
#     downloadPath: $(DEFAULT_WORKDIR_ARTIFACTS)

- task: DownloadBuildArtifacts@1
  displayName: 'Download Build Artifacts'
  inputs:
    artifactName: app
    parallelizationLimit: 20
    extractTars: true

- template: /global/general/set-output-variable.yml
  parameters:
    variable: SONAR_PROJECT_KEY
    command: $(DOCKER-CMD-EXTRACT-SONAR-PROJECT-KEY)

# JAVA STACK
- ${{ if eq(parameters['stack'], 'JAVA')}}:
  - template: /global/general/set-output-variable.yml
    parameters:
      variable: APP_VERSION
      command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)

  - template: /global/general/set-output-variable.yml
    parameters:
      variable: LIBRARIES_PATH
      command: $(echo $(MAVEN_CACHE_FOLDER))

# NODE STACK
- ${{ if eq(parameters['stack'], 'NODE')}}:
  - template: /global/general/set-output-variable.yml
    parameters:
      variable: APP_VERSION
      command: $(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)

# PHYTON STACK
- ${{ if eq(parameters['stack'], 'PYTHON')}}:
  - template: /global/general/set-output-variable.yml
    parameters:
      variable: APP_VERSION
      command: $(DOCKER_CMD_EXTRACT_PYTHON_SETUP_VERSION)