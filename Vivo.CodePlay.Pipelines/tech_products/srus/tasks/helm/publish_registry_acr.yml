parameters:
- name: chartName
  default: $(CHART_NAME)
- name: chartVersion
  default: $(CHART_VERSION)
- name: chartNewVersion
  default: ""
  type: string
- name: workingDirectory
  default: $(Build.ArtifactStagingDirectory)/helm/package

steps:
- script: |
    FULLY_QUALIFIED_TARGET_REPOSITORY="${REPOSITORY_URL}"

    if [[ -z "${CHART_NEW_VERSION}" ]]; then
      CHART_ARCHIVE="${CHART_NAME}-${CHART_VERSION}.tgz"
    else
      CHART_ARCHIVE="${CHART_NAME}-${CHART_NEW_VERSION}.tgz"
    fi

    echo "##[debug] REPOSITORY_URL.......................: ${REPOSITORY_URL}"
    echo "##[debug] REPOSITORY_NAMESPACE.................: ${REPOSITORY_NAMESPACE}"
    echo "##[debug] REPOSITORY_SUB_NAMESPACE.............: ${REPOSITORY_SUB_NAMESPACE}"
    echo "##[debug] FULLY_QUALIFIED_TARGET_REPOSITORY....: ${FULLY_QUALIFIED_TARGET_REPOSITORY}"
    echo "##[debug] CHART_ARCHIVE........................: ${CHART_ARCHIVE}"
    echo "##[debug] HTTPS_PROXY..........................: ${HTTPS_PROXY}"
    echo "##[debug] HTTP_PROXY...........................: ${HTTP_PROXY}"

    echo "##[command] helm push ${CHART_ARCHIVE} ${FULLY_QUALIFIED_TARGET_REPOSITORY}"
    helm push ${CHART_ARCHIVE} ${FULLY_QUALIFIED_TARGET_REPOSITORY}
  displayName: Publish to ACR
  condition: and(succeeded(), eq(lower(variables['HELM_REGISTRY_ACR_ENABLED']), 'true'))
  workingDirectory: ${{ parameters.workingDirectory }}
  env:
    REPOSITORY_URL: $(HELM_REGISTRY_ACR_CHART_BASE_URL)
    REPOSITORY_NAMESPACE: $(HELM_REGISTRY_ACR_NAMESPACE)
    REPOSITORY_SUB_NAMESPACE: $(HELM_REGISTRY_ACR_SUB_NAMESPACE)
    CHART_NAME: '${{ parameters.chartName }}'
    CHART_VERSION: '${{ parameters.chartVersion }}'
    CHART_NEW_VERSION: '${{ parameters.chartNewVersion }}'