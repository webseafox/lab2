parameters:
- name: dockerAppName
  type: string
- name: dockerAppVersion
  type: string
- name: sonarProjectKey
  type: string
- name: sonarTaskId
  type: string

steps:
- task: AzureKeyVault@2  
  displayName: 'Getting AKV credentials'
  timeoutInMinutes: 1
  retryCountOnTaskFailure: 5
  condition: eq(variables['GRAFEAS_INTEGRATION_ENABLED'], true)
  inputs:    
    azureSubscription: DevOpsSharedResources    
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, SONARQUBE-GRAFEAS-USERNAME, SONARQUBE-GRAFEAS-PASSWORD'

- script: |
    echo "##[debug] SONAR_PROJECT_KEY.......: ${SONAR_PROJECT_KEY}"
    echo "##[debug] SONAR_TASK_ID...........: ${SONAR_TASK_ID}"
    echo "##[debug] COMPONENT_IMAGE_NAME....: ${COMPONENT_IMAGE_NAME}"
    echo "##[debug] VERSION_CURRENT.........: ${VERSION_CURRENT}"
    echo "##[debug] GRAFEAS_VERSION.........: ${GRAFEAS_VERSION}"
    echo "##[debug] REPORTPORTAL_URL........: ${REPORTPORTAL_URL}"
    echo "##[debug] SONARQUBE_URL...........: ${SONARQUBE_URL}"

    curl -s -u ${NEXUS_DEPS_USR}:${NEXUS_DEPS_PSW} https://nexus.telefonica.com.br/repository/b2b-canaisdigitais-grafeas/io/grafeas/grafeas-project/${GRAFEAS_VERSION}/grafeas-project-${GRAFEAS_VERSION}-jar-with-dependencies.jar -o grafeas-cli.jar

    echo "##[group] Occurrence for for unit-tests"
    java -cp grafeas-cli.jar GrafeasBuildOccurrence  \
    -p "${COMPONENT_IMAGE_NAME}" \
    -bp "${VERSION_CURRENT}" \
    -n "unit-tests" \
    -rn "Report Portal - Dashboard" \
    -ru "${REPORTPORTAL_URL}"
    echo "##[endgroup]"

    echo "##[group] Occurrence for component-tests"
    java -cp grafeas-cli.jar GrafeasBuildOccurrence \
    -p "${COMPONENT_IMAGE_NAME}" \
    -bp "${VERSION_CURRENT}" \
    -n "component-tests" \
    -rn "Report Portal - Dashboard" \
    -ru "${REPORTPORTAL_URL}"
    echo "##[endgroup]"

    echo "##[group] Occurrence for sonar-code-coverage"
    java -cp grafeas-cli.jar GrafeasCoverageOccurrence \
    -p "${COMPONENT_IMAGE_NAME}" \
    -sp "${SONAR_PROJECT_KEY}" \
    -bp "${VERSION_CURRENT}" \
    -n "sonar-code-coverage" \
    -rn "Sonar Analysis Dashboard" \
    -ru "${SONARQUBE_URL}/dashboard?id=${SONAR_PROJECT_KEY}" \
    -t "${SONAR_TASK_ID}"
    echo "##[endgroup]"
  displayName: "Grafeas occurrences"
  condition: eq(variables['GRAFEAS_INTEGRATION_ENABLED'], true)
  workingDirectory: $(Agent.TempDirectory)
  env:
    NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
    NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
    SONAR_PROJECT_KEY: ${{ parameters.sonarProjectKey}}
    SONAR_TASK_ID: "${{ parameters.sonarTaskId }}"
    COMPONENT_IMAGE_NAME: ${{ parameters.dockerAppName }}
    VERSION_CURRENT: ${{ parameters.dockerAppVersion }}
    DEPS_CREDENTIAL_USR: $(SONARQUBE-GRAFEAS-USERNAME)
    DEPS_CREDENTIAL_PSW: $(SONARQUBE-GRAFEAS-PASSWORD)
    GRAFEAS_VERSION: $(GRAFEAS_VERSION)
    REPORTPORTAL_URL: $(REPORTPORTAL_URL)
    SONARQUBE_URL: $(SONARQUBE_URL)