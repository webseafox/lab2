parameters:
- name: currentVersion
  type: string
- name: registryPath
  type: string
  default: "b2b-canaisdigitais"
- name: appName
  type: string
- name: incrementLevel
  default: patch  

steps:

- template: /tech_products/srus/tasks/nodejs/setup_credentials.yml

- bash: |
    echo "##[debug] NEXUS_COMPONENT_GROUP...............: ${NEXUS_COMPONENT_GROUP}"
    echo "##[debug] NEXUS_COMPONENT_NAME...............: ${NEXUS_COMPONENT_NAME}"
    echo "##[debug] APP_VERSION...............: ${APP_VERSION}"

    export NPM_CONFIG_USERCONFIG=$(Agent.TempDirectory)/.npmrc
    
    version_exist=$(npm show @${NEXUS_COMPONENT_GROUP}/${NEXUS_COMPONENT_NAME}@${APP_VERSION} version)
    echo "##vso[task.setvariable variable=VERSION_EXISTS]$version_exist"

    echo "##[debug] VERSION_EXISTS...............: $version_exist"


    if [[ "${APP_VERSION}" != "$version_exist" ]]; then
      echo "##[debug] Publishing new package..."
      cd bff
      npm --no-git-tag-version version ${{ parameters.incrementLevel }}
      npm publish --verbose --access=restricted
    fi


  displayName: Check Current Version Exist
  name: check_version_exists
  env:
    APP_VERSION: ${{ parameters.currentVersion }}
    NEXUS_COMPONENT_GROUP: ${{ parameters.registryPath }}
    NEXUS_COMPONENT_NAME: ${{ parameters.appName }}