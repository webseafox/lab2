parameters:
- name: dockerWorkdir
  default: $(DOCKER_WORKDIR)
- name: cmdBuildTest
  type: string

steps:
# ==================================================================
# [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
# ==================================================================
- task: VivoDevOpsConfigCompliance@1
  displayName: 'Check DevOps Config Compliance'
  inputs:
    policySets: |
      image-definition-files

- bash: |
    echo "##[debug] HTTPS_PROXY.............: ${HTTPS_PROXY}"
    echo "##[debug] HTTP_PROXY..............: ${HTTP_PROXY}"
    echo "##[debug] NO_PROXY................: ${NO_PROXY}"
    
    BUILDER_IMAGE_NAME="builder/node"
    docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .
    docker run --rm \
      --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
      --network host \
      --log-driver none \
      -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
      -e HTTPS_PROXY="$HTTPS_PROXY" \
      -e HTTP_PROXY="$HTTP_PROXY" \
      -e NO_PROXY="$NO_PROXY" \
      -v $(pwd):/app \
      -v ${NPM_TEMP_FILE_PATH}:/tmp/.npmrc \
      -w ${DOCKER_WORKDIR} \
      $BUILDER_IMAGE_NAME sh -c "${COMMAND_BUILD_TEST}"
  displayName: Build & Test & Coverage
  env:
    DOCKER_WORKDIR: "${{ parameters.dockerWorkdir }}"
    COMMAND_BUILD_TEST: "${{ parameters.cmdBuildTest }}"
    NPM_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
    HTTPS_PROXY: ''
    HTTP_PROXY: ''
    NO_PROXY: ""
    # HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
    # HTTP_PROXY: $(PROXY_AGENT_HTTP)
    # NO_PROXY: "$(PROXY_AGENT_NO_PROXY),$(PROXY_ADDL_NO_PROXY)"
