parameters:
- name: additionalParams
- name: skipSecurityGate
  default: false

steps:
- task: Checkmarx AST@2
  displayName: Checkmarx Scan
  continueOnError: true
  inputs:
    CheckmarxService: 'checkmarx'
    projectName: '$(CHECKMARX_APP_DEFAULT_NAME)'
    branchName: '$(Build.SourceBranchName)'
    tenantName: '$(CHECKMARX_TENANT)'
    additionalParams: '${{ parameters.additionalParams }}'
  env:
    HTTP_PROXY: $(PROXY_AGENT_HTTPS)

- template: /tech_products/srus/tasks/bash/security_gate_validation.yml
  parameters:
    skipSecurityGate: ${{ parameters.skipSecurityGate }}