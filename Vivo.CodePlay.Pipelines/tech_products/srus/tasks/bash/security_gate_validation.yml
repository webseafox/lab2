parameters:
- name: skipSecurityGate
  default: false

steps:
- bash: |
    echo "SKIP_SECURITY_GATE: ${SKIP_SECURITY_GATE}"
    if [[ ! "${SKIP_SECURITY_GATE}" =~ ^(T|t)rue$ ]]; then
      echo "##vso[task.logissue type=error;]O Security Gate falhou!"
      echo "##vso[task.complete result=Failed;]"
      exit
    fi
    echo "##[warning]O Security Gate está Desligado e a validação do Gate foi ignorada!"
  displayName: Gate Validation
  condition: in(variables['Agent.JobStatus'], 'SucceededWithIssues')
  env:
    SKIP_SECURITY_GATE: ${{ parameters.skipSecurityGate }}
