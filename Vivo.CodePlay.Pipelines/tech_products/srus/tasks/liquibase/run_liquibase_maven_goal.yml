parameters:

- name: goal
  type: string
  values:
    - clearCheckSums
    - validate
    - snapshot
    - futureRollbackSQL
    - updateSQL
    - verifyDbStatus
    - tag
    - update
    - listUndeployedChangesets
    - diff
    - rollback
    - listRollbackChangesets

- name: mavenSettingsLocation
  type: string
  default: $(DEFAULT_MAVEN_SETTINGS)

- name: mavenMaxMemoryBuild
  type: string
  default: $(DEFAULT_MAX_MEMORY_BUILD)

- name: dockerWorkDir
  type: string
  default: $(DOCKER_WORKDIR)

- name: taskName
  type: string
  default: ''

- name: displayName
  type: string
  default: ''

- name: condition
  default: succeeded()

- name: extraAttributes
  type: string
  default: ''

- name: continueOnError
  default: false

- name: workingDirectory
  type: string
  default: $(Build.SourcesDirectory)

steps:
- bash: |
    BUILDER_IMAGE_NAME="builder/java"

    echo '[INFO] Maven Settings Location: ${{ parameters.mavenSettingsLocation }}'
    
    DOCKER_RUN() {
      docker run --rm \
        --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
        --network host \
        --log-driver none \
        -e JAVA_OPTS_MEMORY_MAX="$DEFAULT_MAX_MEMORY_BUILD" \
        -e TZ="America/Sao_Paulo" \
        -e SYSTEM_ACCESSTOKEN="$SYSTEM_ACCESSTOKEN" \
        -e NEXUS_DEPS_USR="$NEXUS_DEPS_USR" \
        -e NEXUS_DEPS_PSW="$NEXUS_DEPS_PSW" \
        -v $(pwd):/app \
        -v $HOME/.m2:/.m2 \
        -v ${{ parameters.mavenSettingsLocation }}:/.m2/settings.xml \
        -w $DOCKER_WORKDIR \
        $1 \
        $2
    }

    LIQUIBASE_MVN() {
      DOCKER_RUN $BUILDER_IMAGE_NAME "mvn liquibase:$1 -Dliquibase.url=$(URL_DATABASE) -Dliquibase.username=$(DATABASE_USERNAME) -Dliquibase.password=$(DATABASE_PASSWORD) -Dliquibase.log-level=INFO $2 -s /.m2/settings.xml -Dmaven.repo.local=/.m2/repository"
    }

    LIQUIBASE_CMD() {
      DOCKER_RUN $(LIQUIBASE_IMAGE) "liquibase $1 --url=$(URL_DATABASE) --username=$(DATABASE_USERNAME) --password=$(DATABASE_PASSWORD) --log-level=INFO $2"
    }

    ##=================== Menssagens e Configurações especificas  ===================
    if [[ "${{ parameters.goal }}" == "diff" ]]; then
      db_type=$(grep -Po '(?<="shortName": ")[^"]*' snapshot_db_'$(environment)'.json)
      printf $(COMPARE_DESCRIPTIONS)
    fi

    #=================== Goals jobs ========================

    #----- clear_checksums -----------------------------------
    if [[ "${{ parameters.goal }}" == "clearCheckSums" ]]; then
      STATUS=$(LIQUIBASE_MVN status)
      if [[ "$STATUS" == *"changesets check sum"*  ]]; then
        LIQUIBASE_MVN clearCheckSums
      else
        echo "$(CHECKSUMS_WARNING)"
      fi
    
    #----- Snapshot CMD -----------------------------------
    elif [[ "${{ parameters.goal }}" == "snapshot" ]]; then
      arquivo_pom=$(Build.SourcesDirectory)/pom.xml
      property_file=$(grep -oP '(?<=<propertyFile>).*?(?=</propertyFile>)' "$arquivo_pom")
      schemas=$(grep "^schemas:" $(Build.SourcesDirectory)/$property_file | cut -d':' -f2 | tr -d ' ')
      echo -e "$(SNAPSHOT_MESSAGES)"
      LIQUIBASE_CMD ${{ parameters.goal }} "--schemas=$schemas --output-file=snapshot_db_$(environment).json --snapshot-format=json"

    #----- Verify DB Status -----------------------------------
    # Verifica se os goals sao listRollbackChangesets, listUndeployedChangesets e verifyDbStatus
    # cada goal é mesmo comando liquibase mas a analise do comando difere
    elif [[ "${{ parameters.goal }}" == "listRollbackChangesets" ]] || [[ "${{ parameters.goal }}" == "listUndeployedChangesets" ]] || [[ "${{ parameters.goal }}" == "verifyDbStatus" ]]; then
      STATUS=$(LIQUIBASE_MVN status ${{ parameters.extraAttributes }} )
      echo "$STATUS"
      if [[ "$STATUS" == *"BUILD FAILURE"*  ]]; then 
        echo '##vso[task.logissue type=warning]The ${{ parameters.displayName }} $(TASK_ERROR_MSG)' & exit 1;
      else
        if [[ "${{ parameters.goal }}" == "listRollbackChangesets" ]]; then
          if [[ "$STATUS" == *"is up to date"*  ]]; then 
            echo '##vso[task.logissue type=error]$(ROLLBACK_ERROR_MSG)' & exit 1;
          else 
            exit 0
          fi
        elif [[ "${{ parameters.goal }}" == "listUndeployedChangesets" ]]; then
          if [[ "$STATUS" == *"not been applied"*  ]]; then 
            echo '##vso[task.logissue type=warning]$(CHANGESETS_NOT_APPLIED_MSG)' & exit 0;
          elif [[ "$STATUS" == *"is up to date"*  ]]; then
            echo -e "$(GREEN) $(DATABASE_MSG_UPDATE)" & exit 0; 
          else 
            exit 0
          fi
        elif [[ "${{ parameters.goal }}" == "verifyDbStatus" ]]; then
          if [[ "$STATUS" == *"is up to date"*  ]]; then
            echo '##vso[task.logissue type=warning]$(DATABASE_UPDATE_WARNING)' & exit 0;
          else 
            echo "$(DATABASE_MSG_NOT_UPDATE)" & exit 0;
          fi
        fi
      fi
    
    #----- Update -----------------------------------
    elif [[ "${{ parameters.goal }}" == "update" ]]; then
      for i in {1..3}; do
        echo -e "$(DEPLOY_ATTEMPT_MSG)"
        LIQUIBASE_MVN ${{ parameters.goal }} ${{ parameters.extraAttributes }}
        if [ $? -ne 0 ] && [ $i -eq 3 ]; then
          exit 1
        fi
      done
      echo
    
    #----- Comando padrao -----------------------------------    
    else
      LIQUIBASE_MVN ${{ parameters.goal }} ${{ parameters.extraAttributes }}
    fi
  displayName: ${{ parameters.displayName }}
  name: ${{ parameters.taskName }}
  condition: ${{ parameters.condition }}
  continueOnError: ${{ parameters.continueOnError }}
  workingDirectory: ${{ parameters.workingDirectory }}
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
    NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
    DEFAULT_MAX_MEMORY_BUILD: ${{ parameters.mavenMaxMemoryBuild }}
    DOCKER_WORKDIR: ${{ parameters.dockerWorkDir }}
    ASDF_JAVA_VERSION: $(JAVA_VERSION_PUBLISH_MVN)


