parameters:
- name: currentVersionVariableOut
  default: CURRENT_VERSION

steps:
- script: |
    CURRENT_VERSION=$(cat VERSION)
    echo "##vso[task.setvariable variable=${CURRENT_VERSION_OUT};isOutput=true]${CURRENT_VERSION}"
    echo "##[debug] Exporting variable '${CURRENT_VERSION_OUT}']: ${CURRENT_VERSION}"
  displayName: Defining Current Version
  name: export_current_version
  env:
    CURRENT_VERSION_OUT: ${{ parameters.currentVersionVariableOut }}    
