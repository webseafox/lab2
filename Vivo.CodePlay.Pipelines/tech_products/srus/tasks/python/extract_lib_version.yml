parameters:
- name: currentVersionVariableOut
  default: LIB_CURRENT_VERSION

steps:
- template: /tech_products/srus/global/general/set-output-variable.yml
  parameters:
    variable: CURRENT_VERSION
    command: $(DOCKER_CMD_EXTRACT_PYTHON_SETUP_VERSION)

- bash: |
    echo "##vso[task.setvariable variable=${LIB_CURRENT_VERSION_OUT};isOutput=true]${CURRENT_VERSION}"
    echo "##[debug] Exporting variable '${LIB_CURRENT_VERSION_OUT}': ${CURRENT_VERSION}"
  displayName: Defining Current Version
  name: export_current_version
  env:
    CURRENT_VERSION: $(CURRENT_VERSION)
    LIB_CURRENT_VERSION_OUT: ${{ parameters.currentVersionVariableOut }}