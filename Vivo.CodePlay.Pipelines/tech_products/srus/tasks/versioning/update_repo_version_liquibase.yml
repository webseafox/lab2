parameters:
- name: componentNewVersion
  type: string
- name: bashScript
  type: object
- name: condition
  type: object
- name: createGitTag
  type: boolean
  default: false
- name: usePullRequest
  type: boolean
  default: false

steps: 
- checkout: self
  displayName: 'Checkout repository'
  persistCredentials: true

- bash: |
    cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
    git config pull.rebase true
    git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)
    git checkout -f $(Build.SourceBranchName)
  displayName: "Preparation for all projects"

# Step para executar o script Bash fornecido

- bash: ${{ parameters.bashScript.content }}
  displayName: 'Update Component Version'
  condition: ${{ parameters.condition }}
  ${{ if ne(parameters.bashScript.envs, '') }}:
    env: ${{ parameters.bashScript.envs }}

# Step para depuração
- bash: |
    echo "##[debug] usePullRequest: ${USE_PULL_REQUEST}"
    echo "##[debug] createGitTag: ${CREATE_GIT_TAG}"
    echo "##[debug] condition: ${CONDITION}"
    echo "##[debug] componentNewVersion: ${COMPONENT_NEW_VERSION}"
  displayName: 'Debug Parameters'
  env:
    USE_PULL_REQUEST: "${{ parameters.usePullRequest }}"
    CREATE_GIT_TAG: "${{ parameters.createGitTag }}"
    CONDITION: "${{ parameters.condition }}"
    COMPONENT_NEW_VERSION: "${{ parameters.componentNewVersion }}"

# Step para commits diretos, condicionado ao parâmetro usePullRequest
- bash: |
    TAG_PUSH_PARAM=""

    echo "##[debug] TAG_REPO.....: ${TAG_REPO}"

    cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
    git add .
    git commit -am "[CI SKIP] Project version has been updated. Released version '${COMPONENT_NEW_VERSION}'" --author="$BUILD_REQUESTEDFOR <$BUILD_REQUESTEDFOREMAIL>"

    if [[ "${TAG_REPO}" == "true" ]]; then
      TAG_PUSH_PARAM="--tags"
      git tag ${COMPONENT_NEW_VERSION}
    fi

    git status
    echo "##[command] git push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}"
    git push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}

    if [ $? -ne 0 ]; then 
      echo "##vso[task.logissue type=error;] Git push failed. Permission denied"
      echo "##vso[task.complete result=Failed;]"
      exit 1
    fi  

    echo "Version updated to ${COMPONENT_NEW_VERSION}"
  displayName: 'Commit Updated Version Directly'
  condition: and(succeeded(), ne('${{ parameters.usePullRequest }}', 'true'))
  env:
    COMPONENT_NEW_VERSION: ${{ parameters.componentNewVersion }}
    BRANCH_NAME: "$(Build.SourceBranchName)"
    TAG_REPO: "${{ lower(parameters.createGitTag) }}"
    BUILD_REQUESTEDFOR: "$(Build.RequestedFor)"
    BUILD_REQUESTEDFOREMAIL: "$(Build.RequestedForEmail)"