# variables used to allow internet access for some resource
# using it may cause internet throttling, in this case, it might be required to open a ticket for the network team add the required domain to be ignored on the proxy rules.

variables:
- name: PROXY_NSKP_SERVER
  value: "10.240.58.39" # proxy Squid para evitar erros de timeout do proxy NetSkope.

- name: PROXY_NSKP_PORT
  value: "3128"

- name: PROXY_NSKP_HTTP
  value: "http://$(PROXY_NSKP_SERVER):$(PROXY_NSKP_PORT)"

- name: PROXY_NSKP_HTTPS
  value: "http://$(PROXY_NSKP_SERVER):$(PROXY_NSKP_PORT)"

- name: PROXY_NSKP_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io"