variables:
- name: FORMATED_TIME_TAGS
  value: "$(date +%F--%H-%M-%S)"

- name: ALERT_MESSAGE_START
  value: "##[warning] +------------------+ \n##[warning] | LEIA COM ATENCAO | \n##[warning] +------------------+"

- name: ALERT_MESSAGE_START_SUCCESS
  value: "##[success] +------------------+ \n##[success] | STAGE COMPLETO | \n##[success] +------------------+"

- name: ALERT_MESSAGE_START_ERROR
  value: "##[error] +------------------+ \n##[error] | LEIA COM ATENCAO | \n##[error] +------------------+"

- name: ALERT_MESSAGE_PREFIX_ARROW
  value: "##[warning] ➔"

- name: ALERT_MESSAGE_ARROW
  value: "➔"

- name: ALERT_MESSAGE_PREFIX_WARNING
  value: "##[warning] "

- name: ALERT_MESSAGE_PREFIX_ERROR
  value: "##[error] ➔"

- name: ALERT_MESSAGE_END
  value: "##[warning] +------------------+ \n##[warning] | ---------------- | \n##[warning] +------------------+"

- name: ALERT_MESSAGE_END_SUCCESS
  value: "##[success] +------------------+ \n##[success] | ---------------- | \n##[success] +------------------+"

- name: ALERT_MESSAGE_END_ERROR
  value: "##[error] +------------------+ \n##[error] | ---------------- | \n##[error] +------------------+"

- name: ALERT_MESSAGE_DEBUG_PREFIX
  value: "##[debug] 🚧"

- name: ALERT_MESSAGE_SECTION_PREFIX
  value: "##[section] "

- name: GIT_AUTHOR_NAME
  value: "CorePipeline"

- name: GIT_AUTHOR_EMAIL
  value: "core-pipeline@telefonica.com.br"

- name: GIT_COMMITTER_NAME
  value: "CorePipeline"

- name: GIT_COMMITTER_EMAIL
  value: "core-pipeline@telefonica.com.br"

- name: ORG_NAME
  value: "$(echo $(System.CollectionUri) | cut -d/ -f 4)"

