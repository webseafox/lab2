parameters:
- name: qaEnvironment
  type: string
- name: namespaceToDeploy
  type: string
- name: enableDevflowValidations
  type: boolean
  default: False
- name: isDevEnvironment
  type: boolean
  default: False


extends:
  ## NOT IS DEV ENVIRONMENT
  ${{ if ne(parameters.isDevEnvironment, True) }}:
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      template: /tech_products/ecmc/hybris67/provisioners/provisioner_entry_pr.yaml
      parameters:
        enableDevflowValidations: ${{ parameters.enableDevflowValidations }}
    ${{ else }}:
      template: /tech_products/ecmc/hybris67/provisioners/provisioner_entry.yaml
      parameters:
        qaEnvironment: ${{ parameters.qaEnvironment }}
  ## IS DEV ENVIRONMENT
  ${{ else }}:
    template: /tech_products/ecmc/hybris67/provisioners/provisioner_entry_dev.yaml
    parameters:
      namespaceToDeploy: ${{ parameters.namespaceToDeploy }}