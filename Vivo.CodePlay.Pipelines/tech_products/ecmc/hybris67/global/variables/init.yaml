variables:
- group: azdo-team-project-variables
- group: src-lojaonline-vivo-hybris
- name: DefaultDevopsAgents
  value: 'DefaultDevopsAgents'
- name: PRIVATE_AGENT_DEFAULT
  value: 'PRIVATE_AGENT_DEFAULT'
- name: global_poollImage
  value: 'default'
- name: PROXY_AGENT_HTTP
  value: "http://10.240.58.39:3128"
- name: PROXY_AGENT_HTTPS
  value: "http://10.240.58.39:3128"

# CACORP CERTIFICATE
- name: CACORP_LOCATION
  value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"

# PROXY
- name: PROXY_NSKP_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: "no_proxy"
  value: $(PROXY_NSKP_NO_PROXY)
- name: PROXY_SQUID_SERVER
  value: "10.240.58.39:3128" # proxy Squid para evitar erros de timeout do proxy NetSkope.
- name: PROXY_NSKP_SERVER
  value: "nskp.redecorp.br:8080"
- name: PROXY_AGENT_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: PROXY_ADDL_NO_PROXY
  value: ""
- name: PROXY_NSKP_HTTP
  value: "nskp.redecorp.br:8080"
- name: PROXY_NSKP_HTTPS
  value: "nskp.redecorp.br:8080"

# REPOSITORIES ALIASES
- name: flowIsMain
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')]
- name: flowIsTriggerCI
  value: $[in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')]
- name: flowIsManual
  value: $[eq(variables['Build.Reason'], 'Manual')]
- name: flowIsPullRequest
  value: $[eq(variables['Build.Reason'],'PullRequest')]
- name: flowIsTagging
  value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
- name: flowIsToReview
  value: $[or( eq(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))]
- name: flowIsSapCommerce
  value: $[or(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'],'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/s1', 'refs/heads/s2', 'refs/heads/s3', 'refs/heads/preprod', 'refs/heads/esteira1', 'refs/heads/esteira2'))]

# NPM
- name: DEFAULT_NPMRC_TEMP_PATH
  value: "$(Agent.TempDirectory)"
- name: DEFAULT_NPMRC_TEMP_FILE_PATH
  value: "$(DEFAULT_NPMRC_TEMP_PATH)/.npmrc"
- name: NVM_FILE_VERSION
  value: "$(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/.nvmrc"
- name: PROJECT_NODE_VERSION
  value: "$(cat $(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/.nvmrc)"

# AKV DevOps
- name: AKV_DEVOPS_NAME
  value: "kv-azdevops-shared"
- name: AKV_DEVOPS_LOJAONLINE_CONNECTION_NAME
  value: "HashicorpVault"
- name: AKV_DEVOPS_LOJAONLINE_NAME
  value: "kv-lojaonline/ccv2"

# DOCKER
- name: DOCKER_CMD_USERNAME
  value: $(id -u $USER)
- name: DOCKER_CMD_GROUP
  value: $(id -g $USER)
- name: DOCKER_NODE_USERNAME
  value: node
- name: DOCKER_NODE_GROUP
  value: node
- name: DOCKER_CMD_EXTRACT_PACKAGE_VERSION
  value: $(cat VERSION)
- name: DOCKER_CMD_EXTRACT_APP_NAME
  value: $(yq -r '.name' package.json)
- name: DOCKER_WORKDIR
  value: "/app"
- name: DOCKER_SERVICE_CONNECTION
  value: lojaonline-dkr

# SONAR
- name: SONAR_PROJECT_KEY
  value: "src-lojaonline-vivo-hybris"
- name: SONARQUBE_URL
  value: "http://sonar.devops.redecorp.br"
- name: SONARQUBE_DEFAULT_QUALITYGATE
  value: "AzureDevOps-Default"
- name: SONARQUBE_PROJECT_QUALITYGATE
  value: ""
- name: SONAR_SCANNER_TEMP_CACHE
  value: "$(Agent.HomeDirectory)/.sonar"
- name: SONARQUBE_SERVICE_CONNECTION_NAME
  value: VIVO_SONARQUBE
- name: SONARQUBE_CONFIG_FILE
  value: "$(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/sonar-project.properties"
- name: SONAR_ANALYSIS_CACHE_ENABLED
  value: "false"

# CODE ANALISYS/TESTS
- name: ESLINT_JSON_OUTPUT_DIR
  value: $(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/coverage/$(FOLDER_BASE_SRC)
- name: ESLINT_JSON_OUTPUT_FILE_FULL_PATH
  value: $(ESLINT_JSON_OUTPUT_DIR)/$(ESLINT_JSON_OUTPUT_FILE)

# FORTIFY
- name: FORTIFY_SSC_ENDPOINT
  value: "https://ssc-fortify.redecorp.br/ssc/"
- name: FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT
  value: "https://scancentral-sast.redecorp.br/scancentral-ctrl"
- name: FORTIFY_APP_DEFAULT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: FORTIFY_APP_DEFAULT_VERSION
  value: "DevSecOps"
- name: FORTIFY_EXCLUSION_FILE
  value: "sast_fortify_exclude_files.json"
- name: FORTIFY_REPOSITORY_TECH
  value: ""
- name: FORTIFY_LOCAL_SCANCENTRAL_VERSION
  value: "22.1.0"
- name: FORTIFY_LOCAL_SCANCENTRAL_PATH
  value: "/devops/fortify/scancentral/"
- name: FORTIFY_LOCAL_SCANCENTRAL_SCRIPT
  value: "/bin/scancentral"
- name: FORTIFY-SSC-CLI-TOKEN
  value: ""

# Release Toggles
- name: RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND
  value: "true"
- name: RT_CONVISO_NEW_INTEGRATION
  value: ""

# APP CONFIGURATION VARIABLES
- name: APP_CONFIGURATION_ENABLED
  value: "true"
- name: APP_CONFIGURATION_AZURE_SUBSCRIPTION
  value: "DevOpsSharedResources"
- name: APP_CONFIGURATIN_ENDPOINT
  value: 'https://appcs-azdevops-shared.azconfig.io'
- name: AZURE_APP_CONFIGURATION_ENDPOINT
  value: 'https://appcs-azdevops-shared.azconfig.io'

# CONVISO
- name: CONVISO_APP_ENDPOINT
  value: "https://app.conviso.com.br"
- name: CONVISO_COMPANY_ID
  value: "430"
- name: CONVISO_GRAPHQL_ENDPOINT
  value: "https://app.convisoappsec.com/graphql"
- name: SKIP_CONVISO_SECURITY_GATE
  value: 'true'
- name: CONVISO-API-KEY
  value: ""

# azure_artifacts
- name: AZURE_ARTIFACTS_ORGANIZATION
  value: "telefonica-vivo-brasil"
- name: AZURE_ARTIFACTS_FEED
  value: "DevOps"
- name: AZURE_ARTIFACTS_MAVEN_FEED_URL
  value: "https://pkgs.dev.azure.com/$(AZURE_ARTIFACTS_ORGANIZATION)/_packaging/$(AZURE_ARTIFACTS_FEED)/maven/v1"
- name: AZURE_ARTIFACTS_PUBLISH_ENABLE
  value: "true"

#custom
- name: TEAM_PROJECT
  value: $(echo "$(System.TeamProject)" | sed 's/ /%20/g')
- name: API_URL_REPOSITORY
  value: $(System.TeamFoundationCollectionUri)$(TEAM_PROJECT)/_apis/git/repositories/$(Build.Repository.Name)/items
- name: PROJECT_SOURCE_BRANCH
  value: $(echo "$(Build.SourceBranch)" | sed  's/refs\/heads\///')
- name: GET_VERSION_FILE
  value: $(curl -s -u ":$(System.AccessToken)" "$(API_URL_REPOSITORY)/?path=%2FVERSION&versionType=Branch&versionDescriptor.version=$PROJECT_SOURCE_BRANCH&api-version=7.1")