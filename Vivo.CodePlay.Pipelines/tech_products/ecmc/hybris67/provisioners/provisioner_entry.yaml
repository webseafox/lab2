parameters:
- name: qaEnvironment
  type: string

variables:
- template: /tech_products/ecmc/hybris67/provisioners/variables/load.yaml

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
# CI / CD Flow

  ## INIT
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/init.yml


  ## UPDATE VERSION
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'Manual')) }}:
    - template: stages/bump-version.yaml


  ## BUILD
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - template: stages/build.yaml


  ## CONFIG MANAGEMENT
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - template: stages/config-management.yaml
      parameters:
        environment: ${{ parameters.qaEnvironment }}
        qaEnvironment: ${{ parameters.qaEnvironment }}
        argocdEnabled: true
        privateAgentPool: $(PRIVATE_AGENT_DEFAULT)
        helmReleaseNamePrefix: ""


  ## SECURITY
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - template: stages/security.yaml
      parameters:
        fortifyExclusionRepository: FortifyExclusion


  ## DEPLOY
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - template: stages/deploy-and-argo.yaml
      parameters:
        qaEnvironment: ${{ parameters.qaEnvironment }}


  ## SAVE INFORMATION IN WIKI
  - ${{ if and(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: stages/pos_validate_standards_dev_flow.yaml