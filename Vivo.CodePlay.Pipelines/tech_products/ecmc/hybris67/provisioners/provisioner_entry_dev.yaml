parameters:
- name: namespaceToDeploy
  type: string

variables:
- template: /tech_products/ecmc/hybris67/provisioners/variables/load.yaml

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
# CI / CD Flow

  ## INIT
  - template: /provisioners/app/trunkbased/nodejs/api_default/stages/init.yml@CorePipelines
    

  ## BUILD  
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - template: stages/dev/build.yaml


  ## CONFIG MANAGEMENT
  - ${{if and(ne(variables['Build.Reason'],'PullRequest'), eq(variables['Build.Reason'], 'Manual')) }}:
    - template: stages/dev/config-management.yaml
      parameters:
        environment: ${{ parameters.namespaceToDeploy }}
        argocdEnabled: true
        privateAgentPool: $(PRIVATE_AGENT_DEFAULT)
        helmReleaseNamePrefix: ""
  

  ## DEPLOY
  - template: stages/dev/deploy.yaml
    parameters:
      namespaceToDeploy: ${{ parameters.namespaceToDeploy }}