parameters:
  - name: qa_environment
    type: string

variables:
  - name: AZURE_STORAGE_ACCOUNT_NAME
    ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
      value: $(AZURE_STORAGE_ACCOUNT_NAME_PROD)
    ${{ else }}:
      value: $(AZURE_STORAGE_ACCOUNT_NAME_PREPROD)

  - name: AZURE_STORAGE_ACCOUNT_KEY
    ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
      value: $(AZURE_STORAGE_ACCOUNT_KEY_PROD)
    ${{ else }}:
      value: $(AZURE_STORAGE_ACCOUNT_KEY_PREPROD)