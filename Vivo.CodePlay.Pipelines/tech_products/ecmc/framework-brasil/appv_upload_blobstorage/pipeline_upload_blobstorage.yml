## -> Parameters:
parameters:
- name: qa_environment
  type: string
  default: ''
  values:
    - 'hml'
    - 'prod'
- name: createNewBlob
  type: boolean
  default: false
- name: containerName
  type: string
  default: ''
- name: autoOptimizeImages
  type: boolean
  default: false


## -> Resources:
resources:
  repositories:
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/tags/latest
    endpoint: CorePipelines

## -> Initialize global variables

variables:
  - template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_global.yml
  - template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_nodejs.yml
  - group: "${{ variables['Build.DefinitionName'] }}"
  - group: "vivo-spa-pipeline-secrets"
  - template: /tech_products/appv_upload_blobstorage/initialize/variables_azure.yml
    parameters:
      qa_environment: ${{parameters.qa_environment}}


stages:

  - template: /tech_products/appv_upload_blobstorage/initialize/environment_blob_storage.yml

  - template: /tech_products/appv_upload_blobstorage/templates/ci/ci_publish_img_to_blobstorage.yml
    parameters:
      qa_environment: ${{parameters.qa_environment}}
      createNewBlob: ${{parameters.createNewBlob}}
      containerName: ${{parameters.containerName}}
      AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
      AZURE_STORAGE_ACCOUNT_KEY: $(AZURE_STORAGE_ACCOUNT_KEY)
      autoOptimizeImages: ${{parameters.autoOptimizeImages}}
