stages:
- stage: build_test
  displayName: "CI - Build"
  pool:
    name: GeneralPurposeLinuxAgentsCI
  dependsOn:
  - environment_init

  ## -> Loads variables from other stages.
  variables:
  - name: NEXUS_DEPS_USR
    value: $[ stageDependencies.nodejs_environment_init.environment.outputs['credentials.NEXUS_DEPS_USR'] ]
  - name: NEXUS_DEPS_PSW
    value: $[ stageDependencies.nodejs_environment_init.environment.outputs['credentials.NEXUS_DEPS_PSW'] ]
  - name: NEXUS_DEFAULT_USR
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_USR'] ]
  - name: NEXUS_DEFAULT_PSW
    value: $[ stageDependencies.environment_init.environment.outputs['credentials.NEXUS_DEFAULT_PSW'] ]

  jobs:
  - job: build
    displayName: Build
    workspace:
      clean: all
    steps:
    ## -> Clean the pipeline workspace and checkout the code.
    ## -> 6d15af64-176c-496d-b583-fd2ae21d4df4 is the decorator for checkout.
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      displayName: Checkout Code
      name: checkout_code
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true

    ## -> Checkout the last commit that was pushed to the repository.
    ## -> Set last commit HASH to a variable.
    - task: Bash@3
      displayName: Checkout Last Commit
      name: checkout_last_commit
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Checkout last commit from '$(Build.SourceBranchName)'"

          git config pull.rebase true
          git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)
          git checkout -f $(Build.SourceBranchName)
          lastCommitHash=$(git rev-parse --short=6 HEAD)

          echo "##[debug] Last commit short hash '$lastCommitHash'"
          echo "##vso[task.setvariable variable=SHORT_HASH]$lastCommitHash"

    - task: CmdLine@2
      displayName: Get Current Version
      name: current_version
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          currentVersion=$(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)
          echo "##[debug] Source CURRENT_VERSION: '$currentVersion' "
          echo "##vso[task.setvariable variable=CURRENT_VERSION;]$currentVersion"

          incrementVersion=$(echo $currentVersion | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [[ -n $incrementVersion ]]; then
            echo "##vso[task.setvariable variable=INCREMENT_VERSION;]$incrementVersion"
          else
            echo "##[error] Version in the pom.xml is not following semantic versioning."
            echo "##[error] Verify if the version contains the pattern: <major>.<minor>.<patch>; e.g: 0.0.1, 1.0.0-branch, 1.1.0-branch+hash, 0.0.1-SNAPSHOT; "
            exit 1
          fi
    ## -> Start of Bump Version section
    ## -> If branch is master, use numeric system. e.g: 0.0.1, 2.0.0;
    ## -> If branch is NOT master, use branch name + last commit hash. e.g: dev-1a2b;

    ## -> Get current version and set to variables.
    ## -> For master, set a variable to increment version further on.

    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

    - bash: |
        echo "##[debug]DEFAULT_NPMRC_TEMP_FILE_PATH.....: ${DEFAULT_NPMRC_TEMP_FILE_PATH}"

        if [ -f .npmrc ]; then
          cp .npmrc ${DEFAULT_NPMRC_TEMP_FILE_PATH}
        else
          echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
          echo "##[error]O arquivo .npmrc não foi encontrado!"
          exit 1;
        fi

        echo ##vso[task.setvariable variable=NPM_CONFIG_USERCONFIG]${DEFAULT_NPMRC_TEMP_FILE_PATH}
      displayName: "Setting up .npmrc"
      workingDirectory: "${{ parameters.artifactDir }}"
      env:
        DEFAULT_NPMRC_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
    - task: npmAuthenticate@0
      inputs:
        workingFile: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
      displayName: Set dependencies credentials (Azure Artifacts)
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    - bash: |
        if [ -f .npmrc ]; then
          auth_opt="email=vivo.devops.br@telefonica.com\nalways-auth=true"
          auth=$(echo -n ${NEXUS_DEFAULT_USR}:${NEXUS_DEFAULT_PSW} | openssl base64)
          repos=$(grep -o "registry=.*" .npmrc | cut -d':' -f2 | awk -v auth="$auth" '{print $0 ":_auth="auth""}')
          { printf '\n'; echo -e "$repos\n$auth_opt"; } | tee -a >(cat >> .npmrc) > /dev/null
          echo "##[debug]Credenciais configuradas!"
        else
          echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
          echo "##[error]O arquivo .npmrc não foi encontrado!"
        exit 1;
        fi

      displayName: "Set dependencies credentials (Nexus)"
      workingDirectory: $(DEFAULT_NPMRC_TEMP_PATH)
      env:
        NEXUS_DEFAULT_USR: $(NEXUS-DEFAULT-USR)
        NEXUS_DEFAULT_PSW: $(NEXUS-DEFAULT-PSW)


    - task: Docker@2
      name: login_devops
      displayName: 'Login to Docker Registry'
      continueOnError: true
      inputs:
        containerRegistry: ACR-DEVOPS
        displayName: 'Login to Docker Registry'
        command: 'login'

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        policySets: |
          image-definition-files

    - bash: |
        BUILDER_IMAGE_NAME="builder/node"
        echo "##[section]Build command: ${NODEJS_CMD_BUILD} && ${NODEJS_CMD_BUILD_TEST}"

        docker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .

        set -e

        docker run --rm \
        --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
        --network host \
        --log-driver none \
        -e NPM_CONFIG_USERCONFIG="/tmp/.npmrc" \
        -e HTTPS_PROXY=$(PROXY_AGENT_HTTPS) \
        -e HTTP_PROXY=$(PROXY_AGENT_HTTP) \
        -e NO_PROXY=$(PROXY_AGENT_NO_PROXY) \
        -e NODEJS_CMD_BUILD="${NODEJS_CMD_BUILD}" \
        -e NODEJS_CMD_BUILD_TEST="${NODEJS_CMD_BUILD_TEST}" \
        -e CYPRESS_CACHE_FOLDER=/.cache/Cypress \
        -e TZ="America/Sao_Paulo" \
        -e SYSTEM_ACCESSTOKEN="$(System.AccessToken)" \
        -e HUSKY="${HUSKY}" \
        -e NEXUS_DEPS_USR="$(NEXUS_DEPS_USR)" \
        -e NEXUS_DEPS_PSW="$(NEXUS_DEPS_PSW)" \
        -e DISPLAY=:99 \
        -v $(pwd):/app \
        -v $(DEFAULT_NPMRC_TEMP_FILE_PATH):/tmp/.npmrc \
        -w $(DOCKER_WORKDIR) \
        $BUILDER_IMAGE_NAME sh -c "Xvfb -screen 0 1024x768x24 :99 & ${NODEJS_CMD_BUILD} && ${NODEJS_CMD_BUILD_TEST}"

      displayName: Running Build/Tests/Lint
      name: run_tests
      env:
        HTTPS_PROXY: http://10.240.58.39:3128
        NODEJS_CMD_BUILD: $(NODEJS_CMD_BUILD)
        NODEJS_CMD_BUILD_TEST: $(NODEJS_CMD_BUILD_TEST)
        HUSKY: $(HUSKY)

    - task: CmdLine@2
      name: artifact_name
      displayName: 'Get Artifact Name'
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          echo "$(pwd)"
          echo "$(ls -lah)"

          packageJsonName=$(DOCKER_CMD_EXTRACT_PACKAGE_JSON_NAME)
          echo "##[debug] package.json .name: '$packageJsonName'"

          echo "##[debug] Set Artifact Name + Version"
          artifactNameOld="$(echo $packageJsonName | awk -F '/' '{print$NF}')-$(CURRENT_VERSION)"
          artifactName=app
          echo "##[debug] Artifact Name: '$artifactName'"

          echo "##vso[task.setvariable variable=PACKAGE_JSON_NAME;isOutput=true]$packageJsonName"
          echo "##vso[task.setvariable variable=ARTIFACT_NAME;isOutput=true]$artifactName"

    ## -> Copy files for staging area
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Copy to Staging Directory'
      condition: succeeded()
      continueOnError: false
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: >
          **/*

          !.git/**/*

          !?/**/*

          !**/*.log

          !**/npm-cache/**

     ## - > Publish mutation test report
    - task: PublishMutationReport@1
      displayName: 'Publish Mutation Test Report'
      inputs:
        reportPattern: '**/reports/mutation/mutation.html'
        reportDisplayName: 'Mutation Report'
      continueOnError: true
    ## -> Compress artifacts into tar. This allows to use less space and to be used in other stages, jobs or tasks.
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: app
        StoreAsTar: true

    # - task: PublishMutationReport@1
    #   displayName: 'Publish Mutation Test Report'
    #   inputs:
    #     reportPattern: '/reports/mutation/mutation.html'
    #     reportDisplayName: 'Mutation Report'
    #/reports/mutation/mutation.html
    ## -> Publish results for JUnit tests
    - task: PublishTestResults@2
      name: t_publish_test_result
      displayName: Publish Test Results
      inputs:
        mergeTestResults: true
        searchFolder: $(Build.SourcesDirectory)
        testResultsFiles: '**/TEST-*.xml'
        testResultsFormat: JUnit
        testRunTitle: Test Results
        failTaskOnFailedTests: true
        publishRunAttachments: false
      continueOnError: true

    ## -> Publish results for Code Coverage
    - task: PublishCodeCoverageResults@2
      name: t_publish_code_coverage_result
      displayName: 'Publish Code Coverage Result'
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_SUMMARY_FILE_LOCATION)/lcov.info
        pathToSources: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH_TO_SOURCE)
        reportDirectory: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_REPORT_DIRECTORY)/lcov-report
        additionalCodeCoverageFiles: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_REPORT_DIRECTORY)/**/*.xml
      continueOnError: true

    - task: Bash@3
      displayName: 'Publish Component Report to Nexus'
      name: publish_report
      condition: always()
      env:
        HTTPS_PROXY: http://10.240.58.39:3128
      inputs:
        targetType: 'inline'
        script: |
          echo "PROCURANDO POR REPORT EM : $(Build.SourcesDirectory)/reports/component/component.html"
          curl --insecure -v --user $(NEXUS_DEFAULT_USR):$(NEXUS_DEFAULT_PSW) --upload-file '$(Build.SourcesDirectory)/reports/component/component.html' 'https://nexus.telefonica.com.br/repository/framework-brasil-raw/reports/$(artifact_name.ARTIFACT_NAME)/$(Build.SourceBranchName)/component.html'
          echo "-------REPORT------: https://nexus.telefonica.com.br/repository/framework-brasil-raw/reports/$(artifact_name.ARTIFACT_NAME)/$(Build.SourceBranchName)/component.html"
