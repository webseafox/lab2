variables:

# variables for nodejs
- name: NODEJS_CMD_BUILD
  value: npm ci && npm run build-ci
- name: NODEJS_CMD_BUILD_TEST
  value: "npm run test-ci"
- name: NODEJS_CMD_BUILD_POST_TEST
  value: "npm prune --production"
- name: HUSKY
  value: "0"

- name: DEFAULT_NPMRC_TEMP_PATH
  value: "$(Agent.TempDirectory)"
- name: DEFAULT_NPMRC_TEMP_FILE_PATH
  value: "$(DEFAULT_NPMRC_TEMP_PATH)/.npmrc"

# docker - nodejs
- name: DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION
  value: $(docker run --rm --log-driver none --entrypoint yq -v $(pwd)/package.json:$(pwd)/package.json -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .version package.json)
- name: DOCKER_CMD_EXTRACT_PACKAGE_JSON_NAME
  value: $(docker run --rm --log-driver none --entrypoint yq -v $(pwd)/package.json:$(pwd)/package.json -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .name package.json)
- name: DOCKER_CMD_DEVELOPMENT_FLOW_VERSION
  value: $(date +%Y%m%d%H%M%S)

# coverage_report for nodejs
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/_devops/test/"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/_devops/test/"
