parameters:
  - name: qa_environment
    type: string

variables:
  - name: ROUTE_ORCHESTRATOR_URL
    ${{ if eq(parameters.qa_environment, 'preprod') }}:
      value: https://pre-framework-brasil-ingress.telefonicabigdata.com:443/ms/route-orchestrator-spa-web
    ${{ elseif eq(parameters.qa_environment, 'esteira01') }}:
      value: https://pre-framework-brasil-ingress.telefonicabigdata.com:443/esteira1/ms/route-orchestrator-spa-web
    ${{ elseif eq(parameters.qa_environment, 'prod') }}:
      value: https://pro-framework-brasil-ingress.telefonicabigdata.com:443/ms/route-orchestrator-spa-web
    ${{ elseif eq(parameters.qa_environment, 'darklaunch') }}:
      value: https://pro-framework-brasil-ingress.telefonicabigdata.com:443/darklaunch/ms/route-orchestrator-spa-web
    ${{ else }}:
      value: https://pre-framework-brasil-ingress.telefonicabigdata.com:443/dev/ms/route-orchestrator-spa-web