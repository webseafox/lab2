parameters:
  - name: qa_environment
    type: string

variables:
  - name: ROUTE_ORCHESTRATOR_URL
    ${{ if eq(parameters.qa_environment, 'preprod') }}:
      value: https://uncm-preprod.redecorp.azr/ms/route-orchestrator
    ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
      value: https://uncm-esteira1.redecorp.azr/ms/route-orchestrator
    ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
      value: https://uncm-esteira2.redecorp.azr/ms/route-orchestrator
    ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
      value: https://uncm-prodlike.redecorp.azr/ms/route-orchestrator              
    ${{ elseif eq(parameters.qa_environment, 'prod') }}:
      value: https://uncm.redecorp.azr/ms/route-orchestrator
    ${{ else }}:
      value: https://uncm-dev.redecorp.azr/dev/ms/route-orchestrator