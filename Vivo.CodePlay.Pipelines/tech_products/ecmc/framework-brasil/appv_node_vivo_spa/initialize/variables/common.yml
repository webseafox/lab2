parameters:
  - name: qa_environment
    type: string

variables:
- name: AZURE_BLOB_CONTAINER_URL
  ${{ if eq(parameters.qa_environment, 'dev') }}:
    value: https://z9w200.loja.vivo.com.br
  ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
    value: https://z9w201.loja.vivo.com.br
  ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
    value: https://z9w201.loja.vivo.com.br
  ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
    value: https://z9w201.loja.vivo.com.br
  ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
    value: https://z9w201.loja.vivo.com.br         
  ${{ elseif or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
    value: https://z9w202.loja.vivo.com.br

- name: KEYCLOAK_URL
  ${{ if eq(parameters.qa_environment, 'prod') }}:
    value: https://uncm.redecorp.azr/keycloak/realms/prod
  ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
    value: https://uncm-preprod.redecorp.azr/keycloak/realms/preprod
  ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
    value: https://uncm-preprod.redecorp.azr/keycloak/realms/esteira1
  ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
    value: https://uncm-preprod.redecorp.azr/keycloak/realms/esteira2
  ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
    value: https://uncm-preprod.redecorp.azr/keycloak/realms/prodlike
  ${{ else }}:
    value: https://uncm-dev.redecorp.azr/keycloak/realms/dev

- name: KEYCLOAK_CLIENT_SECRET
  ${{ if eq(parameters.qa_environment, 'prod') }}:
    value: $(KEYCLOAK_CLIENT_SECRET_PROD)
  ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
    value: $(KEYCLOAK_CLIENT_SECRET_PREPROD)
  ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
    value: $(KEYCLOAK_CLIENT_SECRET_ESTEIRA01)
  ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
    value: $(KEYCLOAK_CLIENT_SECRET_ESTEIRA02)
  ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
    value: $(KEYCLOAK_CLIENT_SECRET_PRODLIKE)        
  ${{ else }}:
    value: $(KEYCLOAK_CLIENT_SECRET_DEV)

- name: AZURE_STORAGE_ACCOUNT_NAME
  ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_PROD)
  ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_PREPROD)
  ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_ESTEIRA1)
  ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_ESTEIRA2)
  ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_PRODLIKE)             
  ${{ else }}:
    value: $(AZURE_STORAGE_ACCOUNT_NAME_DEV)

- name: AZURE_STORAGE_ACCOUNT_KEY
  ${{ if or(eq(parameters.qa_environment, 'prod'), eq(parameters.qa_environment, 'darklaunch')) }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_PROD)
  ${{ elseif eq(parameters.qa_environment, 'preprod') }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_PREPROD)
  ${{ elseif eq(parameters.qa_environment, 'esteira1') }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_ESTEIRA1)
  ${{ elseif eq(parameters.qa_environment, 'esteira2') }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_ESTEIRA2)
  ${{ elseif eq(parameters.qa_environment, 'prodlike') }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_PRODLIKE)            
  ${{ else }}:
    value: $(AZURE_STORAGE_ACCOUNT_KEY_DEV)