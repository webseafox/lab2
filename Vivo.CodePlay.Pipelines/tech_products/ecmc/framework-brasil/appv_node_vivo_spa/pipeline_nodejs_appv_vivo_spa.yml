parameters:
  - name: MANUAL_BUNDLE_VERSION
    type: string
  - name: skipReleaseCreation
    type: boolean
  - name: skipReleaseUpdate
    type: boolean
  - name: RELEASE_ENABLED_FLAG
    type: boolean
  - name: RELEASE_PREFETCH_FLAG
    type: boolean
  - name: qa_environment
    type: string
  - name: spa_selector
    type: string
    default: APP
  - name : notifyChangelog
    type: boolean
    default: False
  - name: jira_id
    type: string
    default: ''
  - name: component_test_id
    type: string
    default: ''
  - name: octane_workspace
    type: string
    default: ''
  - name: docker_image
    type: string
    default: selenium
  - name: framework
    type: string
    default: JUnit
  - name: test_environment
    type: string
    default: ''
  - name: octane_environment
    type: string
    default: ''
  - name: canaryRelease
    displayName: Canary Release (publicar no blob sem ativar no ambiente)
    type: string
    default: "Não"
    values:
      - "Sim"
      - "Não"
resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines

    - repository: CodePlay
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CodePlay

variables:
  - name: HUSKY
    value: 0
  - template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_global.yml
  - template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_nodejs.yml
  - group: "${{ variables['Build.DefinitionName'] }}"
  - group: "vivo-spa-pipeline-secrets"
  - template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/initialize/variables/common.yml
    parameters:
      qa_environment: ${{parameters.qa_environment}}
  - template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_gates.yml
  - group: "lojaonline-sonar-variables"

  - ${{ if eq(parameters.spa_selector, 'WEB') }}:
    - template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/initialize/variables/vivo_spa_web.yml
      parameters:
        qa_environment: ${{parameters.qa_environment}}

  - ${{ if eq(parameters.spa_selector, 'APP') }}:
    - template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/initialize/variables/vivo_spa.yml
      parameters:
        qa_environment: ${{parameters.qa_environment}}

stages:
- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/initialize/nodejs_environment_vivo_spa.yml
## -> Build for CI - NodeJS
- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/ci/ci_build_nodejs_appv_vivo_spa.yml
  parameters:
    skipReleaseCreation: ${{parameters.skipReleaseCreation}}

## -> Gates Environment (needed for SonarQube token setup)
# - template: /tech_products/ecmc/framework-brasil/appv/initialize/gates_environment.yml

## -> Quality and Security Gates for master/main branches and Pull Requests
- ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
  - template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/ci/ci_quality_gate_appv.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

- ${{ if and( or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest')), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))) }}:
  - template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/ci/ci_security_appv.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

## -> Publish Build for CI - NodeJS
- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/ci/ci_publish_nodejs_appv_vivo_spa.yml
  parameters:
    skipReleaseCreation: ${{parameters.skipReleaseCreation}}
- ${{ if eq(parameters.notifyChangelog, True) }}:
  - template: /tech_products/ecmc/framework-brasil/appv/templates/ci/ci_changelog_notification_appv.yml

- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/keycloak_auth.yml
  parameters:
    KEYCLOAK_URL: $(KEYCLOAK_URL)
    CLIENT_SECRET: $(KEYCLOAK_CLIENT_SECRET)
    CLIENT_ID: $(KEYCLOAK_CLIENT_ID)

- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/publish_release.yml
  parameters:
    BUNDLE_NAME: $(BUNDLE_NAME)
    MANUAL_BUNDLE_VERSION: ${{parameters.MANUAL_BUNDLE_VERSION}}
    BUNDLE_NEXUS_REPOSITORY: $(BUNDLE_NEXUS_REPOSITORY)
    BUNDLE_NEXUS_COMPONENT_GROUP: $(BUNDLE_NEXUS_COMPONENT_GROUP)
    AZURE_STORAGE_CONTAINER_NAME: $(AZURE_STORAGE_CONTAINER_NAME)
    AZURE_STORAGE_CONTAINER_PREFIX_PATH: $(AZURE_STORAGE_CONTAINER_PREFIX_PATH)
    AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
    AZURE_STORAGE_ACCOUNT_KEY: $(AZURE_STORAGE_ACCOUNT_KEY)
    skipReleaseCreation: ${{parameters.skipReleaseCreation}}

- template: /tech_products/ecmc/framework-brasil/appv_node_vivo_spa/templates/register_release.yml
  parameters:
    BUNDLE_NAME: $(BUNDLE_NAME)
    MANUAL_BUNDLE_VERSION: ${{parameters.MANUAL_BUNDLE_VERSION}}
    AZURE_BLOB_CONTAINER_URL: $(AZURE_BLOB_CONTAINER_URL)
    ROUTE_ORCHESTRATOR_URL: $(ROUTE_ORCHESTRATOR_URL)
    skipReleaseCreation: ${{parameters.skipReleaseCreation}}
    skipReleaseUpdate: ${{parameters.skipReleaseUpdate}}
    RELEASE_ENABLED_FLAG: ${{parameters.RELEASE_ENABLED_FLAG}}
    RELEASE_PREFETCH_FLAG: ${{parameters.RELEASE_PREFETCH_FLAG}}
    qa_environment: ${{parameters.qa_environment}}
    canaryRelease: ${{parameters.canaryRelease}}

# Testes QA
- ${{ if notIn(parameters.jira_id, '', 'none') }}:
  - template: /tech_products/rbqa/test-execution-stage/latest/pipeline_rbqa_testexecution_stage.yml
    parameters:
      docker_image: ${{ parameters.docker_image }}
      framework: ${{ parameters.framework }}
      jira_id: ${{ parameters.jira_id }}
      component_test_id: ${{ parameters.component_test_id }}
      test_environment: ${{ parameters.test_environment }}
      octane_workspace: ${{ parameters.octane_workspace }}
      octane_environment: "${{ parameters.octane_environment }}"
