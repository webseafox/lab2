variables:

# java
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

# maven
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: JAVA_VERSION_PUBLISH_MVN 
  value: "openjdk-21.0.2"

# helm
- name: DEFAULT_GENERIC_JAVA_CHART_NAME
  value: "generic-java-microservice"
- name: DEFAULT_GENERIC_JAVA_CHART_VERSION
  value: ""

# variables for java
- name: JAVA_CMD_BUILD
  value: "clean install"
- name: JAVA_CMD_BUILD_NATIVE
  value: "native:compile -Pnative"
- name: JAVA_CMD_UNIT_TEST
  value: "clean verify -DskipITs"
- name: JAVA_CMD_COMPONENT_TEST
  value: "clean verify -DskipUTs"
- name: JAVA_CMD_MUTATION_TEST
  value: "clean test-compile org.pitest:pitest-maven:mutationCoverage -DmutationThreshold=90"

# docker - java
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_JAVA_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.properties."java.version"  | select (.!=null)' pom.xml)
- name: DOCKER_CMD_EXTRACT_POM_XML_MODULES
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.modules | .[]' pom.xml)
- name: DOCKER_CMD_EXTRACT_ARTIFACT_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)
- name: DOCKER_CMD_EXTRACT_GROUP_ID
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r '.project.groupId | select (.!=null)' pom.xml)  

# coverage_report for java
- name: COVERAGE_REPORT_SUMMARY_FILE_LOCATION
  value: "**/_devops/artifacts/reports/jacoco.xml"
- name: COVERAGE_REPORT_COMPONENT_TEST_FILE_LOCATION
  value: "target/cucumber-reports/CucumberReport.json"
- name: COVERAGE_REPORT_MUTATION_TEST_FILE_LOCATION
  value: "target/pit-reports"
- name: COVERAGE_REPORT_PATH_TO_SOURCE
  value: "src/main/java/"
- name: COVERAGE_REPORT_REPORT_DIRECTORY
  value: "**/_devops/artifacts/reports"
- name: COVERAGE_REPORT_ADDITIONAL_FILE
  value: "**/*.exec"

# Bump version for java
- name: BUMP_VERSION_ENABLED
  value: "true"