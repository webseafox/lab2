variables:

# Variables for SONARQUBE
- name: SONARQUBE_URL
  value: "http://10.129.194.5:9000"
- name: SONARQUBE_DEFAULT_QUALITYGATE
  value: "AzureDevOps-Default"
- name: SONAR_SCANNER_TEMP_CACHE
  value: "$(Agent.HomeDirectory)/.sonar"
- name: PUBLISH_TEST_RESULT_FORMAT
  value: JUnit
- name: PUBLISH_TEST_RESULT_FILES
  value: target/site/jacoco/jacoco.xml
- name: PUBLISH_TEST_HTML_REPORT
  value: target/site/jacoco/index.html
- name: PUBLISH_TEST_COVERAGE_TOOL
  value: jacoco
- name: PUBLISH_TEST_COVERAGE_PATH_TO_SOURCES
  value: target
- name: SONARQUBE_SERVICE_CONNECTION_NAME
  value: VIVO_SONARQUBE
- name: REPORT_TASK_NAME
  value: "report-task.txt"

# Variables for CHECKMARX
- name: USE_CHECKMARX
  value: 'false'
- name: CHECKMARX_TENANT
  value: 'vivo'
- name: CHECKMARX_APP_DEFAULT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: CHECKMARX_IGNORE_SECURITY_GATE
  value: $[and(
            not(in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/production')),
            not(and(
              eq(variables['Build.Reason'], 'PullRequest'),
              in(variables['System.PullRequest.TargetBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/production')
            ))
          )]

# Variables for Conviso
- name: CONVISO_APP_ENDPOINT
  value: "https://app.conviso.com.br"
- name: CONVISO_COMPANY_ID
  value: "430"
- name: CONVISO_GRAPHQL_ENDPOINT
  value: "https://app.convisoappsec.com/graphql"
- name: SKIP_CONVISO_SECURITY_GATE
  value: 'true'
- name: CONVISO-API-KEY
  value: ""

# Variables for Fortify
- name: FORTIFY_SSC_ENDPOINT
  value: "https://ssc-fortify.redecorp.br/ssc/"
- name: FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT
  value: "https://scancentral-sast.redecorp.br/scancentral-ctrl"
- name: FORTIFY_APP_DEFAULT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: FORTIFY_APP_DEFAULT_VERSION
  value: "DevSecOps"
- name: FORTIFY_EXCLUSION_FILE
  value: "sast_fortify_exclude_files.json"
- name: FORTIFY_REPOSITORY_TECH
  value: "java"
- name: FORTIFY_LOCAL_SCANCENTRAL_VERSION
  value: "22.1.0"
- name: FORTIFY_LOCAL_SCANCENTRAL_PATH
  value: "/devops/fortify/scancentral/"
- name: FORTIFY_LOCAL_SCANCENTRAL_SCRIPT
  value: "/bin/scancentral"
- name: FORTIFY-SSC-CLI-TOKEN
  value: ""
