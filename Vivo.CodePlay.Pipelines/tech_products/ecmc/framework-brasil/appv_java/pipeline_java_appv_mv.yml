## -> Resources:
resources:
  repositories:
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines

## -> Initialize global variables
variables:
- template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_global.yml
- template: /tech_products/appv_java/initialize/variables_java.yml
- template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_docker.yml
- template: /tech_products/appv_java/initialize/variables_catalog_info.yml
- name: CORPORATE_WIKI_DOC_URL
  value: "TBD"

## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
## -> Use this to change the variables on runtime
- group: "${{ variables['Build.DefinitionName'] }}"

stages:
## -> Initialize pipeline enviroment
- template: /tech_products/appv_java/initialize/java_environment.yml
  parameters:
    isMergeValidation: True

## -> Build
- template: /tech_products/appv_java/templates/ci/ci_build_java_appv.yml
  parameters:
    isMergeValidation: True

## -> Unit test
- template: /tech_products/appv_java/templates/ci/ci_unit_test_java_appv.yml
  parameters:
    isMergeValidation: True

## -> Component test
- template: /tech_products/appv_java/templates/ci/ci_component_test_java_appv.yml

## -> Mutation test
- template: /tech_products/appv_java/templates/ci/ci_mutation_test_java_appv.yml

## -> Initialize Gates enviroment
- template: /tech_products/appv_java/initialize/gates_environment.yml

## -> Security Gates (SonarQube) and (Fortify) - Execute for master/main branches and Pull Requests
- ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest')) }}:
  - template: /tech_products/appv_java/templates/ci/ci_quality_gate_java_appv.yml
    parameters:
      breakOnQualityGateFailure: ${{ eq(variables['Build.Reason'], 'PullRequest') }}
      isPullRequest: ${{ eq(variables['Build.Reason'], 'PullRequest') }}
  - template: /tech_products/appv_java/templates/ci/ci_security_java_appv.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion
