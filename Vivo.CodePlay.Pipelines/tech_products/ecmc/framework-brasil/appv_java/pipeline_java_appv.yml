parameters:
- name: setEnvironment
  type: string
  default: ''
- name: deployOnly
  type: boolean
  default: False
- name: setVersion
  type: string
  default: ''
- name: gatesEnabled
  type: boolean
  default: False
- name: libOnly
  type: boolean
  default: False
- name: nativeBuild
  type: boolean
  default: False
- name : forceUpgrade
  type: boolean
  default: False
- name : notifyChangelog
  type: boolean
  default: False

resources:
  repositories:
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines

variables:
- template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_global.yml
- template: /tech_products/appv_java/initialize/variables_java.yml
- template: /tech_products/ecmc/framework-brasil/appv/initialize/variables_docker.yml
- template: /tech_products/appv_java/initialize/variables_catalog_info.yml
- name: CORPORATE_WIKI_DOC_URL
  value: "TBD"
- name: gatesEnabled
  value: "${{parameters.gatesEnabled}}"

## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
## -> Use this to change the variables on runtime
- group: "${{ variables['Build.DefinitionName'] }}"

stages:
- template: /tech_products/appv_java/initialize/java_environment.yml

- ${{ if ne(parameters.deployOnly, True) }}:
  - template: /tech_products/appv_java/templates/ci/ci_build_java_appv.yml
    parameters:
      libOnly: "${{parameters.libOnly}}"

  # Execute Quality and Security gates when gatesEnabled=True OR always for master/main branches
  - template: /tech_products/appv_java/initialize/gates_environment.yml
  - ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest')) }}:
    - template: /tech_products/appv_java/templates/ci/ci_quality_gate_java_appv.yml
      parameters:
        breakOnQualityGateFailure: ${{ eq(variables['Build.Reason'], 'PullRequest') }}
        isPullRequest: ${{ eq(variables['Build.Reason'], 'PullRequest') }}
    - template: /tech_products/appv_java/templates/ci/ci_security_java_appv.yml
      parameters:
        fortifyExclusionRepository: FortifyExclusion

  - template: /tech_products/appv_java/templates/ci/ci_publish_java_appv.yml
    parameters:
      gatesEnabled: "${{parameters.gatesEnabled}}"
      libOnly: "${{parameters.libOnly}}"
  - ${{ if eq(parameters.notifyChangelog, True) }}:
    - template: /tech_products/ecmc/framework-brasil/appv/templates/ci/ci_changelog_notification_appv.yml

  - ${{ if ne(parameters.libOnly, True) }}:
    - ${{ if ne(parameters.nativeBuild, True) }}:
      - template: /tech_products/appv_java/templates/ci/ci_package_java_appv.yml
        parameters:
          gatesEnabled: "${{parameters.gatesEnabled}}"

    - ${{ if eq(parameters.nativeBuild, True) }}:
      - template: /tech_products/appv_java/templates/ci/ci_build_native_appv.yml
      - template: /tech_products/appv_java/templates/ci/ci_package_native_appv.yml
        parameters:
          gatesEnabled: "${{parameters.gatesEnabled}}"

    - template: /tech_products/appv_java/initialize/deploy_environment.yml
    - template: /tech_products/appv_java/templates/cd/cd_deploy_helm_java.yml
      parameters:
        nativeBuild: "${{ parameters.nativeBuild }}"
        setEnvironment: "${{ parameters.setEnvironment }}"

## DEPLOY ONLY
- ${{ if ne(parameters.deployOnly, False) }}:

  ## QA
  - ${{ if notIn(parameters.setEnvironment, 'prod-ms', 'producao') }}:
    - template: /tech_products/appv_java/initialize/deploy_environment.yml
    - template: /tech_products/appv_java/templates/cd/cd_deploy_only_helm_java.yml
      parameters:
        setEnvironment: "${{ parameters.setEnvironment }}"
        namespace: "${{ parameters.setEnvironment }}"
        setVersion: "${{ parameters.setVersion }}"
        forceUpgrade: "${{ parameters.forceUpgrade }}"

  ## PROD
  - ${{ if in(parameters.setEnvironment, 'prod-ms', 'producao') }}:
    - template: /tech_products/appv_java/initialize/deploy_environment_prod.yml
    - template: /tech_products/appv_java/templates/cd/cd_deploy_only_prod_helm_java.yml
      parameters:
        setEnvironment: "${{ parameters.setEnvironment }}"
        namespace: "${{ parameters.setEnvironment }}"
        setVersion: "${{ parameters.setVersion }}"
        forceUpgrade: "${{ parameters.forceUpgrade }}"
