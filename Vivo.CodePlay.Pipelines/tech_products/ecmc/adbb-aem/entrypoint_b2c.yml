parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    technology: aem
    modelName: default # lib_default, default

# Template selection switches based on pipeline configuration parameters
extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/ecmc/adbb-aem/provisioners/${{ parameters.config.technology }}/b2c/${{ parameters.config.modelName}}/provisioner_entry_pr.yml
  ${{ else }}:
    template: /tech_products/ecmc/adbb-aem/provisioners/${{ parameters.config.technology }}/b2c/${{ parameters.config.modelName}}/provisioner_entry.yml
  ${{ if parameters.config.params }}:
    parameters: ${{ parameters.config.params }}
