parameters:
- name: dependsOn
  type: object
  default:
  - build

stages:
- stage: quality_gates
  dependsOn: ${{ parameters.dependsOn }}
  displayName: Quality Gates
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: run_sonarqube_scanner
    displayName: Run Sonarqube Scanner
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
      parameters:
        variable: APP_VERSION
        command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
    - template: /tech_products/ecmc/core-pipelines/task_groups/gates/run_sonarqube_scan.yml
      parameters:
        stack: JAVA
        projectKey: "$(SONAR_PROJECT_KEY)"
