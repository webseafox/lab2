parameters:
- name: adobeRemoteUrl
  type: string
  default: $(adobe_remote_url)
- name: adobeBranch
  type: string
  default: ''
- name: dependsOn
  type: object
  default:
  - gate_java
  - gate_node

stages:
- stage: sync
  displayName: Sync
  isSkippable: false
  dependsOn: ${{ parameters.dependsOn }}
  pool: $(PRIVATE_AGENT_DEFAULT)
  condition: succeeded()
  jobs:
  - job: push_adobe
    workspace:
      clean: resources
    displayName: Push to Adobe Cloud
    steps:


    - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
      parameters:
        variable: SOURCE_BRANCH
        command: $(branchRef=$(Build.SourceBranch);echo ${branchRef#refs/heads/})

    - template: /tech_products/ecmc/adbb-aem/provisioners/aem/tasks/remove_submodule.yml
      parameters:
        sourceBranch: "${SOURCE_BRANCH}"
        targetRemoteUrl: "${{parameters.adobeRemoteUrl}}"
        targetBranch: "${{parameters.adobeBranch}}"
        targetName: "Adobe"
