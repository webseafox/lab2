parameters:
- name: dependsOn
  type: object
  default: []

stages:
  - stage: check_version
    dependsOn: ${{ parameters.dependsOn }}
    displayName: Check Version
    pool: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: check_version
        steps:
          - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
            parameters:
              variable: ARTIFACT_VERSION
              command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
          - bash: |
              echo "##[debug] Version: ${ARTIFACT_VERSION}"
              if [[ $(echo "$(ARTIFACT_VERSION)" | tr '[:upper:]' '[:lower:]') == *snapshot ]]; then
                echo "##vso[task.logissue type=error] Current version is SNAPSHOT."
                exit 1;
              fi
            displayName: Verifying version name

          - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release') }}:
            - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
              parameters:
                variable: ARTIFACT_ID
                command: $(DOCKER_CMD_EXTRACT_APP_NAME)
            - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
              parameters:
                variable: ARTIFACT_GROUP
                command: $(DOCKER_CMD_EXTRACT_APP_GROUP)
            - template: /tech_products/ecmc/core-pipelines/tasks/artifacts/check_version_exists.yml
              parameters:
                artifactGroup: $(ARTIFACT_GROUP)
                artifactId: $(ARTIFACT_ID)
                artifactVersion: $(ARTIFACT_VERSION)