parameters:
- name: dependsOn
  type: object
  default:
  - project_validations

stages:
- stage: build
  dependsOn: ${{ parameters.dependsOn }}
  displayName: Build, Test & Coverage
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: build
      displayName: Build
      timeoutInMinutes: 120
      steps:
        - template: /tech_products/ecmc/adbb-aem/global/general/tasks/setup_credentials.yml
        - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/templates/setup-maven.yml
        - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/templates/build.yml
        - template: /tech_products/ecmc/core-pipelines/tasks/artifacts/publish_app.yml
