parameters:
  - name: mavenSettingsLocation
    type: string
    default: $(DEFAULT_MAVEN_SETTINGS)
  - name: mavenCommand
    type: string
    default: "mvn clean package -DskipTests -U"

steps:
  - task: AzureKeyVault@2
    displayName: "Getting AKV credentials"
    timeoutInMinutes: 1
    retryCountOnTaskFailure: 5
    inputs:
      azureSubscription: DevOpsSharedResources
      KeyVaultName: $(AKV_DEVOPS_NAME)
      SecretsFilter: "NEXUS-DEPS-USR, NEXUS-DEPS-PSW"

  - bash: |
      # Clean corrupted Maven cache for this project
      echo "🧹 Limpando cache Maven corrompido..."

      # Remove cache do projeto completo (br/com/vivo/)
      rm -rf $(MAVEN_CACHE_FOLDER)/br/com/vivo/telefonica-vivo* 2>/dev/null || true
      rm -rf $(MAVEN_CACHE_FOLDER)/br/com/vivo/*aem* 2>/dev/null || true

      echo "✓ Cache limpo "
    displayName: "Clean Maven cache for project"

  - bash: |
      echo '${{ parameters.mavenSettingsLocation }}'
      export MAVEN_OPTS="-Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true -Djavax.net.ssl.trustStoreType=jks -Daether.connector.basic.threads=1"
      ${{ parameters.mavenCommand }} -s ${{ parameters.mavenSettingsLocation }} -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -X
    displayName: Maven Build
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
      NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
      PERSONAL_ACCESS_TOKEN: $(PERSONAL_ACCESS_TOKEN)
