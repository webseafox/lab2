stages:
- stage: node_unit_test
  displayName: "Tests - Node"
  dependsOn: ${{ parameters.dependsOn }}
  condition: ne(variables['AEM_FRONTEND_FOLDER_NAME'], '')
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: unit_test_node
      displayName: Test & Coverage - Node
      workspace:
        clean: outputs
      condition: and( succeeded(), and( eq(variables.flowIsToReview, true), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
      steps:
      - checkout: self
        clean: false
        persistCredentials: true
        
      - template: /tech_products/ecmc/core-pipelines/tasks/bash/welcome.yml
      - template: /tech_products/ecmc/adbb-aem/global/general/tasks/setup_credentials.yml
        parameters:
          workingDirectory: "$(Build.SourcesDirectory)/$(AEM_FRONTEND_FOLDER_NAME)"
      - template: /tech_products/ecmc/adbb-aem/global/nodejs/tasks/test_with_docker.yml
        parameters:
          dockerWorkDir: "/app/$(AEM_FRONTEND_FOLDER_NAME)"
          dockerfileLocation: ".azuredevops/nodejs/tester.Dockerfile"
          cmdNodeTest: $(CMD_NODE_TEST)
      - template: /tech_products/ecmc/core-pipelines/tasks/artifacts/publish_pipeline.yml
        parameters:
          artifactName: $(AEM_FRONTEND_FOLDER_NAME)
          targetPath: $(Build.SourcesDirectory)/$(AEM_FRONTEND_FOLDER_NAME)
      - template: /tech_products/ecmc/core-pipelines/tasks/tests/publish_tests_result.yml
        parameters:
          testResultsFilesPattern: "**/junit.xml"
          searchFolder: "$(Build.SourcesDirectory)/$(AEM_FRONTEND_FOLDER_NAME)"
          publishRunAttachments: false
      
      # Cleanup após testes Node
      - bash: |
          echo "Limpando node_modules/ e arquivos temporários..."
          if [ -d "$(AEM_FRONTEND_FOLDER_NAME)" ]; then
            cd "$(AEM_FRONTEND_FOLDER_NAME)"
            [ -d "node_modules" ] && rm -rf node_modules 2>/dev/null || true
            [ -d "coverage" ] && rm -rf coverage 2>/dev/null || true
            [ -d ".next" ] && rm -rf .next 2>/dev/null || true
            [ -d "build" ] && rm -rf build 2>/dev/null || true
            [ -d "dist" ] && rm -rf dist 2>/dev/null || true
          fi
          echo "✓ Cleanup Node concluído"
        displayName: 'Cleanup Node Artifacts'
        workingDirectory: $(Build.SourcesDirectory)
        condition: always()
        continueOnError: true