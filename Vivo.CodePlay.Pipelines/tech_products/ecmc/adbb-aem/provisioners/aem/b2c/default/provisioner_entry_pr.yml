parameters:
- name: adobeRemoteUrl
  type: string
  default: ''
- name: adobeBranch
  type: string
  default: ''

variables:
- template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/variables/load.yml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
- template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/project_validations.yml

- template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/prepare_catalog_info.yml
  parameters:
    dependsOn:
      - project_validations

- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/validate_standards_dev_flow.yml
  parameters:
    dependsOn:
      - prepare_catalog_info

- ${{ if ne(variables.skip_quality_gates, true) }}:
  - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/maven_test.yml
    parameters:
      dependsOn:
      - repo_validations

  - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/node_test.yml
    parameters:
      dependsOn:
      - repo_validations

  - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/gates_java.yml

  - template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/gates_node.yml

- template: /tech_products/ecmc/adbb-aem/provisioners/aem/b2c/default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion
    ${{ if eq(variables.skip_quality_gates, true) }}:
      dependsOn: []
