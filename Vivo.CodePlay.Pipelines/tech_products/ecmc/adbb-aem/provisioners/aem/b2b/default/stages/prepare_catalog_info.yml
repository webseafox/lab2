stages:
- stage: prepare_catalog_info
  displayName: "Preparar catalog-info"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: publish_catalog_info
      displayName: "Publicar catalog-info.yaml"
      workspace:
        clean: false
      steps:
        - checkout: self
          clean: false
          persistCredentials: true
        
        - task: PublishPipelineArtifact@1
          displayName: "Publish catalog-info.yaml"
          inputs:
            targetPath: '$(Build.SourcesDirectory)/catalog-info.yaml'
            artifact: 'catalog-info'
            publishLocation: 'pipeline'
