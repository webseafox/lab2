stages:
- stage: gate_node
  displayName: "Quality Gates - Node"
  dependsOn: 
  - node_unit_test
  condition: and(not(or(failed(), canceled())), ne(variables['AEM_FRONTEND_FOLDER_NAME'], ''))
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: sonarqube_node
      condition: and( succeeded(), eq(variables.flowIsToReview, true), ne(variables.skip_sonarqube, true), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
      displayName: Code Analysis
      continueOnError: true
      steps:
      - template: /tech_products/ecmc/core-pipelines/tasks/bash/welcome.yml
      - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
        parameters:
          workingDirectory: $(Build.SourcesDirectory)
          skipDownload: true
      - template: /tech_products/ecmc/adbb-aem/global/general/set-output-variable.yml
        parameters:
          variable: APP_VERSION_NODE
          command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
      - template: /tech_products/ecmc/core-pipelines/task_groups/gates/run_sonarqube_scan.yml
        parameters:
          stack: "NODE"
          configFile: ".azuredevops/nodejs/sonar-project.properties"
          workdirArtifacts: $(Build.ArtifactStagingDirectory)/$(AEM_FRONTEND_FOLDER_NAME)
          artifactName: $(AEM_FRONTEND_FOLDER_NAME)
          artifactType: "pipeline"
          projectKey: "$(SONAR_PROJECT_KEY)-$(AEM_FRONTEND_FOLDER_NAME)"
          version: $(APP_VERSION_NODE)
      - template: /tech_products/ecmc/core-pipelines/tasks/telemetry/telemetry.yml