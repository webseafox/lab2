parameters:
  - name: workingDirectory
    type: string
    default: "$(Build.SourcesDirectory)/$(AEM_FRONTEND_FOLDER_NAME)"

steps:
  - task: AzureKeyVault@2
    displayName: "Getting AKV credentials"
    timeoutInMinutes: 1
    retryCountOnTaskFailure: 5
    inputs:
      azureSubscription: DevOpsSharedResources
      KeyVaultName: $(AKV_DEVOPS_NAME)
      SecretsFilter: "NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW"

  - bash: |
      echo "##[debug]DEFAULT_NPMRC_TEMP_FILE_PATH.....: ${DEFAULT_NPMRC_TEMP_FILE_PATH}"
      echo "##[debug]Working Directory................: ${WORKING_DIR}"

      cd ${WORKING_DIR}

      if [ -f .npmrc ]; then
        cp .npmrc ${DEFAULT_NPMRC_TEMP_FILE_PATH}
        echo "##[debug]Arquivo .npmrc copiado para ${DEFAULT_NPMRC_TEMP_FILE_PATH}"
      elif [ -f nexus.txt ]; then
        echo "##[debug]Arquivo .npmrc não encontrado, mas nexus.txt existe. Renomeando..."
        mv nexus.txt .npmrc
        cp .npmrc ${DEFAULT_NPMRC_TEMP_FILE_PATH}
        echo "##[debug]Arquivo nexus.txt renomeado para .npmrc e copiado para ${DEFAULT_NPMRC_TEMP_FILE_PATH}"
      else
        echo "##vso[task.logissue type=error]Nenhum arquivo .npmrc ou nexus.txt foi encontrado em ${WORKING_DIR}!"
        echo "##[error]Arquivo .npmrc ou nexus.txt não foi encontrado!"
        exit 1;
      fi

      echo ##vso[task.setvariable variable=NPM_CONFIG_USERCONFIG]${DEFAULT_NPMRC_TEMP_FILE_PATH}
    displayName: "Setting up .npmrc"
    env:
      DEFAULT_NPMRC_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
      WORKING_DIR: "${{ parameters.workingDirectory }}"

  - task: npmAuthenticate@0
    inputs:
      workingFile: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
    displayName: Set dependencies credentials (Azure Artifacts)
    env:
      HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
      HTTP_PROXY: $(PROXY_AGENT_HTTP)
      NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    continueOnError: true

  - bash: |
      cd $(DEFAULT_NPMRC_TEMP_PATH)

      if [ -f .npmrc ]; then
        auth_opt="email=vivo.devops.br@telefonica.com\nalways-auth=true"
        auth=$(echo -n ${NEXUS_DEFAULT_USR}:${NEXUS_DEFAULT_PSW} | openssl base64)
        repos=$(grep -o "registry=.*" .npmrc | cut -d':' -f2 | awk -v auth="$auth" '{print $0 ":_auth="auth""}')
        { printf '\n'; echo -e "$repos\n$auth_opt"; } | tee -a >(cat >> .npmrc) > /dev/null
        echo "##[debug]Credenciais Nexus configuradas no .npmrc temporário!"
        
        echo "##[debug]Conteúdo do .npmrc (sem credenciais):"
        grep -v "_auth" .npmrc || true
      else
        echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado em ${DEFAULT_NPMRC_TEMP_PATH}!"
        echo "##[error]O arquivo .npmrc não foi encontrado!"
        exit 1;
      fi

    displayName: "Set dependencies credentials (Nexus)"
    workingDirectory: $(DEFAULT_NPMRC_TEMP_PATH)
    env:
      NEXUS_DEFAULT_USR: $(NEXUS-DEFAULT-USR)
      NEXUS_DEFAULT_PSW: $(NEXUS-DEFAULT-PSW)
      DEFAULT_NPMRC_TEMP_PATH: $(DEFAULT_NPMRC_TEMP_PATH)
