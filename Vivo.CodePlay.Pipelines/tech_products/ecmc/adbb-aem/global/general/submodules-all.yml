# ===============================================================
# Pipeline de Atualização de Repositórios AEM B2B
# ===============================================================
# Atualiza individualmente os repositórios selecionados e
# sincroniza o repositório agregador aem-all com a Adobe.
#
# Etapas:
#   1. Extrair e validar a versão
#   2. Atualizar os repositórios individuais
#   3. Atualizar pom.xml e .gitmodules do aem-all (Azure)
#   4. Sincronizar aem-all com Adobe Cloud Manager
#   5. Exibir o resumo
# ===============================================================

parameters:
  # =============================================================
  # Versão e branches
  # =============================================================
  - name: versaoPom
    type: string
    displayName: 'Versão dos pom.xml (ex: 2.68.1)'

  - name: branch
    type: string
    displayName: 'Branch/Release (ex: release/2.68.1)'

  - name: targetBranch
    type: string
    displayName: 'Branch base'
    default: 'master'

  # =============================================================
  # Repositórios que serão atualizados
  # =============================================================
  - name: updateCommon
    type: boolean
    displayName: 'Atualizar aem-common'
    default: true

  - name: updateEquipamentosLojaOnline
    type: boolean
    displayName: 'Atualizar aem-equipamentos-loja-online'
    default: true

  - name: updateEquipamentosPresencial
    type: boolean
    displayName: 'Atualizar aem-equipamentos-presencial'
    default: true

  # - name: updateTelco
  #   type: boolean
  #   displayName: 'Atualizar aem-telco'
  #   default: true

  - name: updateVivoTech
    type: boolean
    displayName: 'Atualizar aem-equipamentos-vivo-tech'
    default: true

  - name: updateMeuVivo
    type: boolean
    displayName: 'Atualizar aem-meu-vivo'
    default: true

  - name: updateUnicom
    type: boolean
    displayName: 'Atualizar comp-aem-unicom-v1'
    default: true

  # =============================================================
  # Execução
  # =============================================================
  - name: dryRun
    type: boolean
    displayName: 'Dry Run (não faz push)'
    default: false


stages:

  # =============================================================
  # STAGE 1: Extrair e validar versão
  # =============================================================
  - stage: ExtractVersion
    displayName: 'Extrair Versão'

    jobs:
      - job: ExtractVersionJob
        displayName: 'Extrair Versão da Branch'

        steps:
          - checkout: none

          - bash: |
              set -euo pipefail

              VERSAO_POM="${{ parameters.versaoPom }}"
              BRANCH="${{ parameters.branch }}"

              echo "=========================================="
              echo "          EXTRAÇÃO DE VERSÃO              "
              echo "=========================================="
              echo "Versão informada: $VERSAO_POM"
              echo "Branch informada: $BRANCH"
              echo ""

              # Remove espaços acidentais
              VERSION="$(echo "$VERSAO_POM" | xargs)"

              # Valida se a versão foi informada
              if [[ -z "$VERSION" ]]; then
                echo "##vso[task.logissue type=error]Parâmetro versaoPom não foi informado."
                exit 1
              fi

              # Valida formato semântico X.Y.Z
              if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "##vso[task.logissue type=error]Versão inválida: $VERSION"
                echo "Formato esperado: X.Y.Z"
                echo "Exemplo: 2.68.1"
                exit 1
              fi

              echo "[section]✓ Versão válida: $VERSION"
              echo "=========================================="

              # Disponibiliza a versão para os próximos stages
              echo "##vso[task.setvariable variable=VERSION;isOutput=true]$VERSION"
            displayName: 'Extrair e Validar Versão'
            name: version


  # =============================================================
  # STAGE 2: Atualizar repositórios individuais
  # =============================================================
  - stage: UpdateRepositories
    displayName: 'Atualizar Repositórios'
    dependsOn: ExtractVersion

    variables:
      - group: aem-all-variables

      - name: VERSION
        value: $[ stageDependencies.ExtractVersion.ExtractVersionJob.outputs['version.VERSION'] ]

      - name: GIT_USER_NAME
        value: 'Azure DevOps Pipeline'

      - name: GIT_USER_EMAIL
        value: 'devopsforce.br@telefonicati.onmicrosoft.com'

    jobs:

      # ===========================================================
      # aem-common
      # ===========================================================
      - ${{ if eq(parameters.updateCommon, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'aem-common'
              repoResource: 'common'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleCommon'


      # ===========================================================
      # aem-equipamentos-loja-online
      # ===========================================================
      - ${{ if eq(parameters.updateEquipamentosLojaOnline, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'aem-equipamentos-loja-online'
              repoResource: 'equipamentosLojaOnline'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleEquipamentosLojaOnline'


      # ===========================================================
      # aem-equipamentos-presencial
      # ===========================================================
      - ${{ if eq(parameters.updateEquipamentosPresencial, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'aem-equipamentos-presencial'
              repoResource: 'equipamentosPresencial'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleEquipamentosPresencial'


      # ===========================================================
      # aem-telco (COMENTADO - NÃO UTILIZADO NO MOMENTO)
      # ===========================================================
      # - ${{ if eq(parameters.updateTelco, true) }}:
      #     - template: templates/update-repo-version.yml
      #       parameters:
      #         repoName: 'aem-telco'
      #         repoResource: 'telco'
      #         version: $(VERSION)
      #         branch: ${{ parameters.branch }}
      #         baseBranch: ${{ parameters.targetBranch }}
      #         dryRun: ${{ parameters.dryRun }}
      #         adobePath: 'TelefonicaVivoProgramB2BSubmoduleTelco'


      # ===========================================================
      # aem-equipamentos-vivo-tech
      # ===========================================================
      - ${{ if eq(parameters.updateVivoTech, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'aem-equipamentos-vivo-tech'
              repoResource: 'vivoTech'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleVivoTech'


      # ===========================================================
      # aem-meu-vivo
      # ===========================================================
      - ${{ if eq(parameters.updateMeuVivo, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'aem-meu-vivo'
              repoResource: 'meuVivo'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleMeuVivo'


      # ===========================================================
      # comp-aem-unicom-v1
      # ===========================================================
      - ${{ if eq(parameters.updateUnicom, true) }}:
          - template: templates/update-repo-version.yml
            parameters:
              repoName: 'comp-aem-unicom-v1'
              repoResource: 'unicom'
              version: $(VERSION)
              branch: ${{ parameters.branch }}
              baseBranch: ${{ parameters.targetBranch }}
              dryRun: ${{ parameters.dryRun }}
              adobePath: 'TelefonicaVivoProgramB2BSubmoduleUnicom'


  # =============================================================
  # STAGE 3: Atualizar pom.xml e .gitmodules do aem-all
  # =============================================================
  - stage: UpdateAemAllGitmodules
    displayName: 'Atualizar aem-all (pom.xml + .gitmodules)'
    dependsOn:
      - ExtractVersion
      - UpdateRepositories

    variables:
      - group: aem-all-variables

      - name: VERSION
        value: $[ stageDependencies.ExtractVersion.ExtractVersionJob.outputs['version.VERSION'] ]

      - name: GIT_USER_NAME
        value: 'Azure DevOps Pipeline'

      - name: GIT_USER_EMAIL
        value: 'devopsforce.br@telefonicati.onmicrosoft.com'

    jobs:
      - job: UpdateGitmodulesJob
        displayName: 'Atualizar pom.xml + .gitmodules + submodules'

        steps:

          # ========================================
          # Checkout do repositório aem-all
          # ========================================
          - checkout: self
            persistCredentials: true
            clean: true
            fetchDepth: 0
            path: s/aem-all


          # ========================================
          # Determinar/Criar branch de trabalho
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "REPOSITÓRIO: aem-all"
              echo "=========================================="
              echo "Branch alvo: ${{ parameters.branch }}"
              echo "Branch base: ${{ parameters.targetBranch }}"
              echo ""

              git fetch origin --prune

              # Verifica se a branch alvo existe remotamente
              if git ls-remote --exit-code --heads origin "${{ parameters.branch }}" >/dev/null 2>&1; then
                echo "[section]✓ Branch ${{ parameters.branch }} existe remotamente"

                # Alinha a branch local com a branch remota
                git checkout -B "${{ parameters.branch }}" "origin/${{ parameters.branch }}"

                WORKING_BRANCH="${{ parameters.branch }}"
              else
                echo "⚠️ Branch ${{ parameters.branch }} não existe"
                echo "→ Criando branch ${{ parameters.branch }} a partir de ${{ parameters.targetBranch }}"

                # Verifica se a branch base existe
                if ! git ls-remote --exit-code --heads origin "${{ parameters.targetBranch }}" >/dev/null 2>&1; then
                  echo "##vso[task.logissue type=error]A branch base ${{ parameters.targetBranch }} não existe no repositório."
                  exit 1
                fi

                # Alinha a branch base local com o remoto
                git checkout -B "${{ parameters.targetBranch }}" "origin/${{ parameters.targetBranch }}"

                # Cria a nova branch
                git checkout -b "${{ parameters.branch }}"

                # Cria a branch no repositório remoto
                git push --set-upstream origin "${{ parameters.branch }}"

                echo "[section]✓ Branch ${{ parameters.branch }} criada com sucesso"

                WORKING_BRANCH="${{ parameters.branch }}"
              fi

              echo ""
              echo "[section]✓ Trabalhando na branch: $WORKING_BRANCH"

              echo "##vso[task.setvariable variable=WORKING_BRANCH]$WORKING_BRANCH"
            displayName: 'Checkout/Criar Branch'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Atualizar pom.xml
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "ATUALIZAÇÃO DO POM.XML"
              echo "=========================================="
              echo "Versão: $(VERSION)"
              echo "Diretório: $(pwd)"
              echo ""

              # Valida se o pom.xml existe
              if [[ ! -f "pom.xml" ]]; then
                echo "##vso[task.logissue type=error]pom.xml não encontrado em $(pwd)"
                exit 1
              fi

              # Define se será utilizado Maven Wrapper ou Maven instalado
              if [[ -x "./mvnw" ]]; then
                MVN_COMMAND="./mvnw"
              elif command -v mvn >/dev/null 2>&1; then
                MVN_COMMAND="mvn"
              else
                echo "##vso[task.logissue type=error]Maven não foi encontrado no agente."
                exit 1
              fi

              echo "Comando Maven selecionado: $MVN_COMMAND"
              echo ""

              "$MVN_COMMAND" --version

              echo ""
              echo "Versão atual do pom.xml:"
              grep -m 1 "<version>" pom.xml | sed 's/^[[:space:]]*//' || echo "Versão não encontrada"
              echo ""

              # Atualiza a versão usando o Maven Versions Plugin
              # Flag -N (non-recursive): atualiza apenas o pom.xml do agregador, 
              # sem processar módulos filhos (submodules já foram atualizados no STAGE 2)
              echo "Executando Maven Versions Plugin..."
              echo ""

              MAVEN_PLUGIN="${MAVEN_VERSIONS_PLUGIN}"

              "$MVN_COMMAND" \
                --batch-mode \
                --no-transfer-progress \
                "$MAVEN_PLUGIN" \
                -N \
                -DnewVersion=$(VERSION) \
                -DgenerateBackupPoms=false

              echo ""
              echo "[section]✓ Atualização de versão finalizada"

              # Remove backups, caso alguma configuração do projeto os gere
              find . -type f -name "pom.xml.versionsBackup" -delete

              echo ""
              echo "Versão atualizada do pom.xml:"
              grep -m 1 "<version>" pom.xml | sed 's/^[[:space:]]*//'
              echo ""

              # Verifica se houve alterações no pom.xml
              if git diff --quiet pom.xml; then
                echo "[warning]⚠️ Nenhuma alteração detectada no pom.xml"
                echo "##vso[task.setvariable variable=POM_CHANGED]false"
              else
                echo "[section]✓ Alterações detectadas no pom.xml:"
                git diff pom.xml
                echo ""
                echo "##vso[task.setvariable variable=POM_CHANGED]true"
              fi
            displayName: 'Atualizar pom.xml'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Validar pom.xml
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "VALIDAÇÃO DO POM.XML"
              echo "=========================================="
              echo ""

              # Define se será utilizado Maven Wrapper ou Maven instalado
              if [[ -x "./mvnw" ]]; then
                MVN_COMMAND="./mvnw"
              elif command -v mvn >/dev/null 2>&1; then
                MVN_COMMAND="mvn"
              else
                echo "##vso[task.logissue type=error]Maven não foi encontrado no agente."
                exit 1
              fi

              echo "Validando estrutura Maven..."
              echo ""

              # Extrai a versão do pom.xml usando Maven (apenas o agregador, sem módulos filhos)
              EXTRACTED_VERSION=$("$MVN_COMMAND" \
                --batch-mode \
                --no-transfer-progress \
                help:evaluate \
                -N \
                -Dexpression=project.version \
                -DforceStdout \
                -q)

              echo "Versão esperada: $(VERSION)"
              echo "Versão extraída do pom.xml: $EXTRACTED_VERSION"
              echo ""

              # Valida se a versão foi atualizada corretamente
              if [[ "$EXTRACTED_VERSION" == "$(VERSION)" ]]; then
                echo "[section]✓ Versão do pom.xml está correta"
              else
                echo "##vso[task.logissue type=error]Versão do pom.xml ($EXTRACTED_VERSION) não corresponde à versão esperada ($(VERSION))"
                exit 1
              fi

              echo ""
              echo "[section]✓ Estrutura Maven validada"
            displayName: 'Validar pom.xml'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Atualizar .gitmodules
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "ATUALIZAÇÃO DO .GITMODULES"
              echo "=========================================="
              echo "Branch alvo: ${{ parameters.branch }}"
              echo "Diretório: $(pwd)"
              echo ""

              # Valida se o .gitmodules existe
              if [[ ! -f ".gitmodules" ]]; then
                echo "##vso[task.logissue type=error].gitmodules não encontrado em $(pwd)"
                exit 1
              fi

              echo "Conteúdo atual do .gitmodules:"
              cat .gitmodules
              echo ""

              # Atualiza todas as linhas 'branch = <qualquer-valor>' para 'branch = <nova-branch>'
              sed -i.bak "s|^[[:space:]]*branch[[:space:]]*=.*|\tbranch = ${{ parameters.branch }}|g" .gitmodules

              # Remove arquivo de backup
              rm -f .gitmodules.bak

              echo "Conteúdo atualizado do .gitmodules:"
              cat .gitmodules
              echo ""

              # Verifica se houve alterações no arquivo .gitmodules
              if git diff --quiet .gitmodules; then
                echo "[warning]⚠️ Nenhuma alteração detectada no .gitmodules"
                echo "##vso[task.setvariable variable=GITMODULES_CHANGED]false"
              else
                echo "[section]✓ Alterações detectadas no .gitmodules:"
                git diff .gitmodules
                echo ""
                echo "##vso[task.setvariable variable=GITMODULES_CHANGED]true"
              fi
            displayName: 'Atualizar .gitmodules'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Configurar credenciais Adobe para submodules
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "CONFIGURAÇÃO DE CREDENCIAIS ADOBE"
              echo "=========================================="
              echo ""

              # Valida as credenciais Adobe
              if [[ -z "${ADOBE_USER:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_username não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_TOKEN:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_password não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_GIT_URL:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_git_url não encontrada."
                exit 1
              fi

              # Configura git para usar credenciais nas URLs da Adobe
              git config --local "url.https://${ADOBE_USER}:${ADOBE_TOKEN}@${ADOBE_GIT_URL}/.insteadOf" "https://${ADOBE_GIT_URL}/"

              # Verifica se a configuração foi aplicada
              echo ""
              echo "Verificando configuração:"
              git config --get-regexp 'url\..*\.insteadof' || echo "Nenhuma configuração de URL encontrada"

              echo ""
              echo "[section]✓ Credenciais Adobe configuradas para clone de submodules"
            displayName: 'Configurar Credenciais Adobe'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all
            env:
              ADOBE_USER: $(adobe_username)
              ADOBE_TOKEN: $(adobe_password)
              ADOBE_GIT_URL: $(adobe_git_url)


          # ========================================
          # Atualizar submodules
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "ATUALIZAÇÃO DOS SUBMODULES"
              echo "=========================================="
              echo "Branch alvo: ${{ parameters.branch }}"
              echo ""

              # Valida as credenciais Adobe para uso no submodule update
              if [[ -z "${ADOBE_USER:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_username não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_TOKEN:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_password não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_GIT_URL:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_git_url não encontrada."
                exit 1
              fi

              # Faz backup do .gitmodules original
              cp .gitmodules .gitmodules.original

              # Modifica URLs no .gitmodules para incluir credenciais
              echo "Modificando URLs do .gitmodules com credenciais..."
              sed -i.tmp "s|https://${ADOBE_GIT_URL}/|https://${ADOBE_USER}:${ADOBE_TOKEN}@${ADOBE_GIT_URL}/|g" .gitmodules
              rm -f .gitmodules.tmp

              # Inicializa os submodules
              echo "Inicializando submodules..."
              git submodule init

              echo ""
              echo "Atualizando submodules para as branches especificadas..."
              echo ""

              # Primeiro, clona os submodules
              echo "Clonando submodules..."
              git submodule update --init --recursive

              echo ""
              echo "Configurando branches nos submodules..."
              echo ""

              # Para cada submodule, verifica se a branch existe e cria se necessário
              git submodule foreach --recursive '
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "Submodule: $name"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                
                # Configura usuário Git para commits/push
                git config user.name "'"$(GIT_USER_NAME)"'"
                git config user.email "'"$(GIT_USER_EMAIL)"'"
                
                # Busca informações do remote
                git fetch origin
                
                # Verifica se a branch alvo existe no remote
                if git ls-remote --exit-code --heads origin "${{ parameters.branch }}" >/dev/null 2>&1; then
                  echo "[section]✓ Branch ${{ parameters.branch }} existe"
                  git checkout "${{ parameters.branch }}"
                  git pull origin "${{ parameters.branch }}"
                else
                  echo "⚠️ Branch ${{ parameters.branch }} não existe"
                  
                  # Verifica se a branch base existe
                  if git ls-remote --exit-code --heads origin "${{ parameters.targetBranch }}" >/dev/null 2>&1; then
                    echo "→ Criando branch ${{ parameters.branch }} a partir de ${{ parameters.targetBranch }}"
                    git checkout -b "${{ parameters.branch }}" "origin/${{ parameters.targetBranch }}"
                    
                    # Push da nova branch para o remote
                    git push -u origin "${{ parameters.branch }}"
                    echo "[section]✓ Branch ${{ parameters.branch }} criada"
                  else
                    echo "⚠️ Branch base ${{ parameters.targetBranch }} não existe, usando HEAD"
                    git checkout -b "${{ parameters.branch }}"
                    git push -u origin "${{ parameters.branch }}"
                  fi
                fi
                
                echo ""
              '

              echo ""
              echo "[section]✓ Submodules configurados com branches corretas"
              echo ""

              # Restaura o .gitmodules original (sem credenciais)
              echo "Restaurando .gitmodules original..."
              mv .gitmodules.original .gitmodules

              # Mostra o status dos submodules
              echo "Status dos submodules:"
              git submodule status

              echo ""

              # Verifica se houve alterações nos ponteiros dos submodules
              if git diff --quiet; then
                echo "[warning]⚠️ Nenhuma alteração nos ponteiros dos submodules"
                echo "##vso[task.setvariable variable=HAS_CHANGES]false"
              else
                echo "[section]✓ Alterações detectadas nos ponteiros dos submodules:"
                git diff --stat
                echo ""
                echo "##vso[task.setvariable variable=HAS_CHANGES]true"
              fi
            displayName: 'Atualizar Submodules'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all
            env:
              ADOBE_USER: $(adobe_username)
              ADOBE_TOKEN: $(adobe_password)
              ADOBE_GIT_URL: $(adobe_git_url)


          # ========================================
          # Commit das alterações
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "COMMIT DAS ALTERAÇÕES"
              echo "=========================================="
              echo ""

              git config user.name "$(GIT_USER_NAME)"
              git config user.email "$(GIT_USER_EMAIL)"

              # Mostra status ANTES de adicionar
              echo "Status do repositório (antes do git add):"
              git status --short
              echo ""

              # Adiciona pom.xml, .gitmodules e os ponteiros dos submodules
              git add pom.xml
              git add .gitmodules
              git add --all

              # Mostra arquivos staged
              echo "Arquivos staged para commit:"
              git diff --cached --name-status || echo "  (nenhum arquivo staged)"
              echo ""

              # Verifica se há alterações staged
              if git diff --cached --quiet; then
                echo "[warning]⚠️ Nenhuma alteração detectada (commit vazio será criado)"
                HAS_CHANGES_VAR="false"
              else
                echo "[section]✓ Alterações detectadas e staged para commit"
                HAS_CHANGES_VAR="true"
              fi

              echo ""

              # Commit com --allow-empty para garantir que sempre seja criado
              git commit --allow-empty \
                -m "DevOps: atualiza versão $(VERSION) e branch dos submodules para ${{ parameters.branch }}"

              echo ""
              echo "[section]✓ Commit realizado com sucesso"
              echo ""

              git log -1 \
                --pretty=format:"Commit: %H%nAutor: %an <%ae>%nMensagem: %s%nData: %ad" \
                --date=iso

              echo ""
              echo ""
              echo "##vso[task.setvariable variable=HAS_CHANGES]$HAS_CHANGES_VAR"
            displayName: 'Commit'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Push para Azure DevOps
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "PUSH PARA AZURE DEVOPS"
              echo "=========================================="
              echo "Repositório: aem-all"
              echo "Branch: $(WORKING_BRANCH)"
              echo ""

              if [[ "$(HAS_CHANGES)" != "true" ]]; then
                echo "[warning]⚠️ Commit vazio (sem alterações de arquivos)"
                echo "→ Push será realizado para sincronizar o commit"
              else
                echo "[section]✓ Alterações detectadas, realizando push"
              fi

              echo ""

              git push origin "HEAD:$(WORKING_BRANCH)"

              echo ""
              echo "[section]✓ Push realizado para Azure DevOps"
            displayName: 'Push para Azure'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all
            condition: |
              and(
                succeeded(),
                eq('${{ parameters.dryRun }}', 'false')
              )


  # =============================================================
  # STAGE 4: Sincronizar aem-all com Adobe
  # =============================================================
  - stage: SyncAemAllToAdobe
    displayName: 'Sincronizar aem-all com Adobe'
    dependsOn:
      - ExtractVersion
      - UpdateRepositories
      - UpdateAemAllGitmodules

    variables:
      - group: aem-all-variables

      - name: VERSION
        value: $[ stageDependencies.ExtractVersion.ExtractVersionJob.outputs['version.VERSION'] ]

      - name: GIT_USER_NAME
        value: 'Azure DevOps Pipeline'

      - name: GIT_USER_EMAIL
        value: 'devopsforce.br@telefonicati.onmicrosoft.com'

    jobs:
      - job: PushToAdobeJob
        displayName: 'Push para Adobe Cloud Manager'

        steps:

          # ========================================
          # Checkout do repositório aem-all
          # ========================================
          - checkout: self
            persistCredentials: true
            clean: true
            fetchDepth: 0
            path: s/aem-all


          # ========================================
          # Checkout da branch de trabalho
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "CHECKOUT DA BRANCH"
              echo "=========================================="
              echo "Branch: ${{ parameters.branch }}"
              echo ""

              git fetch origin --prune

              # Verifica se a branch existe
              if git ls-remote --exit-code --heads origin "${{ parameters.branch }}" >/dev/null 2>&1; then
                echo "[section]✓ Branch ${{ parameters.branch }} encontrada no Azure"
                
                # Checkout da branch mais recente do Azure
                git checkout -B "${{ parameters.branch }}" "origin/${{ parameters.branch }}"
                
                echo ""
                echo "Últimos 3 commits da branch:"
                git log -3 --oneline
                echo ""
                
                echo "[section]✓ Branch ${{ parameters.branch }} checked out com commits atualizados"
              else
                echo "##vso[task.logissue type=error]Branch ${{ parameters.branch }} não encontrada no repositório Azure."
                echo "A branch deveria ter sido criada no stage anterior (UpdateAemAllGitmodules)."
                exit 1
              fi
            displayName: 'Checkout Branch'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all


          # ========================================
          # Push para Adobe Cloud Manager
          # ========================================
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "PUSH PARA ADOBE CLOUD MANAGER"
              echo "=========================================="
              echo "Repositório: $(adobe_repo)"
              echo "Branch: ${{ parameters.branch }}"
              echo ""

              # Valida as credenciais Adobe
              if [[ -z "${ADOBE_USER:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_username não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_TOKEN:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_password não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_GIT_URL:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_git_url não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_PROJECT:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_project não encontrada."
                exit 1
              fi

              if [[ -z "${ADOBE_REPO:-}" ]]; then
                echo "##vso[task.logissue type=error]Variável adobe_repo não encontrada."
                exit 1
              fi

              # Monta a URL do repositório Adobe
              ADOBE_URL="https://${ADOBE_USER}:${ADOBE_TOKEN}@${ADOBE_GIT_URL}/${ADOBE_PROJECT}/${ADOBE_REPO}"

              # Adiciona ou atualiza o remote Adobe
              if git remote get-url adobe >/dev/null 2>&1; then
                git remote set-url adobe "$ADOBE_URL"
              else
                git remote add adobe "$ADOBE_URL"
              fi

              echo "Remote Adobe configurado"
              echo ""
              
              # Mostra informações sobre o commit atual
              echo "Commit atual no Azure:"
              git log -1 --oneline
              echo ""
              
              # Busca informações da branch na Adobe
              echo "Verificando branch na Adobe..."
              git fetch adobe "${{ parameters.branch }}" 2>/dev/null || echo "Branch não existe na Adobe ou erro ao buscar"
              echo ""
              
              # Verifica se há diferenças entre Azure e Adobe
              if git rev-parse adobe/"${{ parameters.branch }}" >/dev/null 2>&1; then
                echo "Branch existe na Adobe. Comparando commits..."
                echo ""
                
                AZURE_COMMIT=$(git rev-parse HEAD)
                ADOBE_COMMIT=$(git rev-parse adobe/"${{ parameters.branch }}")
                
                echo "Commit no Azure:  $AZURE_COMMIT"
                echo "Commit na Adobe:  $ADOBE_COMMIT"
                echo ""
                
                # Verifica se são o mesmo commit
                if [[ "$AZURE_COMMIT" == "$ADOBE_COMMIT" ]]; then
                  echo "[warning]⚠️ Azure e Adobe já estão sincronizados no mesmo commit"
                  echo "Push não é necessário, mas será realizado mesmo assim"
                  echo ""
                  NEED_DELETE=false
                else
                  # Verifica se o Azure está à frente da Adobe (fast-forward possível)
                  if git merge-base --is-ancestor adobe/"${{ parameters.branch }}" HEAD; then
                    echo "[section]✓ Push será fast-forward (Adobe está atrás do Azure)"
                    echo ""
                    echo "Commits novos no Azure:"
                    git log adobe/"${{ parameters.branch }}"..HEAD --oneline
                    echo ""
                    NEED_DELETE=false
                  else
                    # Há divergência - precisa deletar a branch na Adobe
                    echo "[warning]⚠️ DIVERGÊNCIA DETECTADA"
                    echo ""
                    echo "Commits no Azure que não estão na Adobe:"
                    git log adobe/"${{ parameters.branch }}"..HEAD --oneline || echo "  (nenhum)"
                    echo ""
                    echo "Commits na Adobe que não estão no Azure:"
                    git log HEAD..adobe/"${{ parameters.branch }}" --oneline || echo "  (nenhum)"
                    echo ""
                    echo "[section]→ Azure é a fonte da verdade: branch será deletada na Adobe e recriada"
                    echo ""
                    NEED_DELETE=true
                  fi
                fi
              else
                echo "[section]✓ Branch não existe na Adobe. Será criada."
                echo ""
                NEED_DELETE=false
              fi
              
              # Deleta a branch na Adobe se houver divergência
              if [[ "$NEED_DELETE" == "true" ]]; then
                echo "Deletando branch ${{ parameters.branch }} na Adobe..."
                if git push adobe --delete "${{ parameters.branch }}" 2>/dev/null; then
                  echo "[section]✓ Branch deletada na Adobe"
                else
                  echo "[warning]⚠️ Não foi possível deletar (pode já estar deletada)"
                fi
                echo ""
              fi
              
              echo "Iniciando push para Adobe..."
              echo ""

              if git push adobe "HEAD:refs/heads/${{ parameters.branch }}" ; then
                echo ""
                echo "[section]✓ Push realizado para Adobe Cloud Manager"
                echo "[section]✓ Azure sincronizado com Adobe (Azure como fonte da verdade)"
              else
                echo ""
                echo "##vso[task.logissue type=error]Falha no push para Adobe. Verifique credenciais, URL e permissões."
                exit 1
              fi
            displayName: 'Push para Adobe'
            workingDirectory: $(Pipeline.Workspace)/s/aem-all
            env:
              ADOBE_USER: $(adobe_username)
              ADOBE_TOKEN: $(adobe_password)
              ADOBE_GIT_URL: $(adobe_git_url)
              ADOBE_PROJECT: $(adobe_project)
              ADOBE_REPO: $(adobe_repo)
            condition: |
              and(
                succeeded(),
                eq('${{ parameters.dryRun }}', 'false')
              )


  # =============================================================
  # STAGE 5: Resumo
  # =============================================================
  - stage: Summary
    displayName: 'Resumo'

    dependsOn:
      - ExtractVersion
      - UpdateRepositories
      - UpdateAemAllGitmodules
      - SyncAemAllToAdobe

    condition: always()

    variables:
      - name: VERSION
        value: $[ stageDependencies.ExtractVersion.ExtractVersionJob.outputs['version.VERSION'] ]

    jobs:
      - job: ShowSummary
        displayName: 'Mostrar Resumo'

        steps:
          - bash: |
              set -euo pipefail

              echo "=========================================="
              echo "📊 RESUMO DA PIPELINE"
              echo "=========================================="
              echo ""
              echo "🎯 Versão: $(VERSION)"
              echo "🌿 Branch de trabalho: ${{ parameters.branch }}"
              echo "🌱 Branch base: ${{ parameters.targetBranch }}"
              echo "📅 Timestamp: $(date '+%d-%m-%Y %H:%M:%S')"
              echo ""
              echo "📦 Repositórios selecionados:"
              echo ""

              REPOS_UPDATED=""

              if [[ "$UPDATE_COMMON" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • aem-common\n"
              fi

              if [[ "$UPDATE_ELO" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • aem-equipamentos-loja-online\n"
              fi

              if [[ "$UPDATE_ELP" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • aem-equipamentos-presencial\n"
              fi

              # if [[ "$UPDATE_TELCO" == "True" ]]; then
              #   REPOS_UPDATED="${REPOS_UPDATED}   • aem-telco\n"
              # fi

              if [[ "$UPDATE_VIVO_TECH" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • aem-equipamentos-vivo-tech\n"
              fi

              if [[ "$UPDATE_MEU_VIVO" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • aem-meu-vivo\n"
              fi

              if [[ "$UPDATE_UNICOM" == "True" ]]; then
                REPOS_UPDATED="${REPOS_UPDATED}   • comp-aem-unicom-v1\n"
              fi

              if [[ -z "$REPOS_UPDATED" ]]; then
                echo "   ⚠️ Nenhum repositório foi selecionado."
              else
                echo -e "$REPOS_UPDATED"
              fi

              echo ""

              echo ""
              echo "📦 Repositório agregador:"
              echo "   • aem-all (pom.xml + .gitmodules → Azure → Adobe)"
              echo ""

              if [[ "$DRY_RUN" == "True" ]]; then
                echo "⚠️ DRY RUN"
                echo "Nenhum push foi realizado."
              else
                echo "✅ Atualização dos repositórios concluída."
                echo "✅ Repositório aem-all sincronizado com Adobe Cloud Manager."
              fi

              echo ""
              echo "=========================================="
            displayName: 'Resumo Final'

            env:
              UPDATE_COMMON: ${{ parameters.updateCommon }}
              UPDATE_ELO: ${{ parameters.updateEquipamentosLojaOnline }}
              UPDATE_ELP: ${{ parameters.updateEquipamentosPresencial }}
              # UPDATE_TELCO: ${{ parameters.updateTelco }}
              UPDATE_VIVO_TECH: ${{ parameters.updateVivoTech }}
              UPDATE_MEU_VIVO: ${{ parameters.updateMeuVivo }}
              UPDATE_UNICOM: ${{ parameters.updateUnicom }}
              DRY_RUN: ${{ parameters.dryRun }}