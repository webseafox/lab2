parameters:
  - name: workingDirectory
    type: string
    default: "$(Build.SourcesDirectory)"
  - name: configFile
    type: string
    default: ".tool-versions"

steps:
  - bash: |
      set -uo pipefail

      echo "##[section]#################### CONFIGURAR VERSÃO DO PYTHON ####################"

      CONFIG_FILE_PATH="${{ parameters.configFile }}"
      echo "##[debug] Config file: ${CONFIG_FILE_PATH}"

      if [ ! -f "${CONFIG_FILE_PATH}" ]; then
        echo "##vso[task.logissue type=error]Arquivo ${CONFIG_FILE_PATH} não encontrado em ${{ parameters.workingDirectory }}."
        exit 1
      fi

      CUSTOM_PYTHON_VERSION=$(awk '/^python[[:space:]]/{print $2; exit}' "${CONFIG_FILE_PATH}")
      if [ -z "${CUSTOM_PYTHON_VERSION}" ]; then
        echo "##vso[task.logissue type=error]Versão do Python não declarada em ${CONFIG_FILE_PATH}."
        exit 1
      fi

      echo "##[command] asdf local python ${CUSTOM_PYTHON_VERSION}"
      asdf local python "${CUSTOM_PYTHON_VERSION}"

      PYTHON_DIR=$(asdf where python "${CUSTOM_PYTHON_VERSION}")
      echo "##[debug] Python dir: ${PYTHON_DIR}"
      echo "##vso[task.prependpath]${PYTHON_DIR}/bin"
    displayName: "Config Python version"
    workingDirectory: "${{ parameters.workingDirectory }}"

  - bash: |
      echo "##[command] python --version"
      python --version
    displayName: "Validar versão do Python"
    workingDirectory: "${{ parameters.workingDirectory }}"
