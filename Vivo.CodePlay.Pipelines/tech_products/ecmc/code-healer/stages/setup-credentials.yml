parameters:
  - name: runSync
    type: boolean

steps:
  - task: AzureKeyVault@2
    displayName: "Getting AKV Credentials"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'))
    timeoutInMinutes: 1
    retryCountOnTaskFailure: 5
    inputs:
      azureSubscription: DevOpsSharedResources
      KeyVaultName: $(AKV_DEVOPS_NAME)
      SecretsFilter: "DEPENDENCY-TRACK-TOKEN, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW, CONVISO-API-KEY"

  - task: Bash@3
    displayName: "Define AppConfig Labels"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'))
    inputs:
      targetType: inline
      script: |
        echo "##vso[task.setvariable variable=OUT_LABEL_GLOBAL]GLOBAL"
        echo "##vso[task.setvariable variable=OUT_LABEL_PROJECT]$(System.TeamProject)"
        echo "##vso[task.setvariable variable=OUT_LABEL_COMPONENT]$(System.TeamProject)/$(REPO_NAME)"

  - task: AzureAppConfiguration@8
    displayName: "Download app configuration keys"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'))
    timeoutInMinutes: 1
    retryCountOnTaskFailure: 5
    inputs:
      azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
      AppConfigurationEndpoint: $(AZURE_APP_CONFIGURATION_ENDPOINT)
      Label: "$(OUT_LABEL_GLOBAL),$(OUT_LABEL_PROJECT),$(OUT_LABEL_COMPONENT),VIVO-CORE-PIPELINES"
    env:
      HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
      HTTP_PROXY: $(PROXY_AGENT_HTTP)
      NO_PROXY: $(PROXY_AGENT_NO_PROXY)

  - task: Bash@3
    displayName: "Evaluate security flags (Conviso & DT)"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'), eq('${{ parameters.runSync }}', 'true'))
    inputs:
      targetType: inline
      script: |
        # Seu código de mapeamento getvar() entra aqui
        echo "##vso[task.setvariable variable=DT_SCA_ENDPOINT]$DT_SCA_ENDPOINT"

  - task: Bash@3
    displayName: "Setting up .npmrc"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'), eq('${{ parameters.runSync }}', 'true'))
    inputs:
      targetType: inline
      workingDirectory: $(REPO_NAME)
      script: |
        echo "##[section]#################### SETTING UP .NPMRC ####################"
        touch .npmrc

  - task: npmAuthenticate@0
    displayName: "Set dependencies credentials (Azure Artifacts)"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'), eq('${{ parameters.runSync }}', 'true'))
    inputs:
      workingFile: $(REPO_NAME)/.npmrc
    env:
      HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
      HTTP_PROXY: $(PROXY_AGENT_HTTP)
      NO_PROXY: $(PROXY_AGENT_NO_PROXY)

  - task: Bash@3
    displayName: "Set dependencies credentials (Nexus)"
    condition: and(succeeded(), eq(variables['VERSION_OK'], 'true'), eq('${{ parameters.runSync }}', 'true'))
    env:
      NEXUS_DEFAULT_USR: $(NEXUS-DEFAULT-USR)
      NEXUS_DEFAULT_PSW: $(NEXUS-DEFAULT-PSW)
    inputs:
      targetType: inline
      workingDirectory: $(REPO_NAME)
      script: |
        echo "##[section]#################### CONFIGURE NEXUS CREDENTIALS ####################"
        echo "##[debug] Working Directory: $(pwd)"

        if [ -f .npmrc ]; then
          auth_opt="email=vivo.devops.br@telefonica.com\nalways-auth=true"
          auth=$(echo -n ${NEXUS_DEFAULT_USR}:${NEXUS_DEFAULT_PSW} | openssl base64)
          repos=$(grep -o "registry=.*" .npmrc | cut -d':' -f2 | awk -v auth="$auth" '{print $0 ":_auth="auth""}')

          if [ ! -z "$repos" ]; then
            { printf '\n'; echo -e "$repos\n$auth_opt"; } | tee -a >(cat >> .npmrc) > /dev/null
            echo "##[debug] Credenciais do Nexus configuradas com sucesso!"
          else
            echo "##[debug] Nenhum repositório do Nexus localizado no .npmrc para autenticação."
          fi
        fi
