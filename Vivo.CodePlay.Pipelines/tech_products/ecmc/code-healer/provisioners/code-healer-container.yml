parameters:
  - name: image
    type: string
    default: ""

stages:
  - stage: code_healer_container
    displayName: "Code Healer de Container"
    pool: $(PRIVATE_AGENT_DEFAULT)
    condition: ne('${{ parameters.image }}', '')
    jobs:
      - job: RunContainerHealer
        displayName: "Corrigir vulnerabilidades da imagem"
        workspace:
          clean: all
        variables:
          CONTAINER_AGENT_PATH: "$(Build.SourcesDirectory)/src/_code_healer/_container"
        steps:
          - checkout: CorePipelinesScripts
            persistCredentials: true
            fetchDepth: 1
            displayName: "Checkout do agente de container"

          - template: /tech_products/ecmc/code-healer/stages/setup-python-version.yml
            parameters:
              workingDirectory: "$(CONTAINER_AGENT_PATH)"

          - template: /tech_products/ecmc/code-healer/stages/validate-image.yml
            parameters:
              image: ${{ parameters.image }}

          - template: /tech_products/ecmc/code-healer/stages/agent-container.yml
            parameters:
              image: ${{ parameters.image }}

          - template: /tech_products/ecmc/code-healer/stages/push-acr-and-create-pr.yml

          - task: Bash@3
            displayName: "Limpar imagens Docker"
            condition: always()
            inputs:
              targetType: inline
              script: |
                echo "##[section]#################### LIMPEZA ####################"
                echo "##[debug] Removendo imagens locais do Code Healer..."
                images=$(docker images --filter=reference='code-healer-fix:*' --format '{{.ID}}' | sort -u)
                if [ -n "$images" ]; then
                  echo "$images" | xargs -r docker rmi -f || true
                fi
