stages:
- stage: TriggerTests
  displayName: 'Trigger Automation Tests (Health Check)'
  condition: false
  jobs:
  - job: TriggerTestsJob
    displayName: 'Trigger Tests Job'
    steps:
    - task: CmdLine@2
      displayName: "Install azure-devops CLI extension"
      retryCountOnTaskFailure: 3
      inputs:
        script: |
          echo "##[group]Install azure-devops extension"
          echo "##[command]az extension add --name azure-devops"
          az extension add --name azure-devops
          echo "##[endgroup]"
      env:
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)


    - task: CmdLine@2
      displayName: "Trigger Pipeline - HealthCheckEquipamentos"
      inputs:
        script: |
          PIPELINE_NAME="testes.testes-cenarios_healthcheck" 
          PROJECT="RBQA - ROBOSQA" 
          ORG="https://dev.azure.com/telefonica-vivo-brasil"  
          BRANCH_NAME="master"  
          SUITE="HealthCheckEquipamentos"  

          RUN_ID=$(az pipelines run \
            --name "$PIPELINE_NAME" \
            --branch "$BRANCH_NAME" \
            --project "$PROJECT" \
            --org "$ORG" \
            --parameters suite="$SUITE" \
            --query "id" -o tsv)

          if [ -z "$RUN_ID" ]; then
            echo "Erro ao disparar o pipeline."
            exit 1
          fi

          echo "Pipeline disparado com sucesso. RUN_ID: $RUN_ID"
          
          check_pipeline_status() {
            local status
            while : ; do
              status=$(az pipelines runs show \
                --id "$RUN_ID" \
                --project "$PROJECT" \
                --org "$ORG" \
                --query "status" -o tsv | tr -d '\r')

              if [ -z "$status" ] || [ "$status" == "null" ]; then
                echo "Erro ao capturar o status do pipeline."
                exit 1
              fi

              if [[ "$status" == "completed" ]]; then
                break
              fi

              echo "Pipeline em andamento. Status atual: $status"
              sleep 10  
            done

            echo "Pipeline concluído. Verificando resultado final..."
          }

          check_pipeline_status

          FINAL_STATUS=$(az pipelines runs show \
            --id "$RUN_ID" \
            --project "$PROJECT" \
            --org "$ORG" \
            --query "result" -o tsv | tr -d '\r')

          if [[ "$FINAL_STATUS" == "succeeded" ]]; then
            echo "Pipeline concluído com sucesso."
            exit 0
          else
            echo "Pipeline falhou com o status: $FINAL_STATUS"
            exit 1
          fi

      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)


    - task: CmdLine@2
      displayName: "Trigger Pipeline - HealthCheckEquipamentosEcomm"
      inputs:
        script: |
          PIPELINE_NAME="testes.testes-cenarios_healthcheck" 
          PROJECT="RBQA - ROBOSQA" 
          ORG="https://dev.azure.com/telefonica-vivo-brasil"  
          BRANCH_NAME="master" 
          SUITE="HealthCheckEquipamentosEcomm" 

          RUN_ID=$(az pipelines run \
            --name "$PIPELINE_NAME" \
            --branch "$BRANCH_NAME" \
            --project "$PROJECT" \
            --org "$ORG" \
            --parameters suite="$SUITE" \
            --query "id" -o tsv)

          if [ -z "$RUN_ID" ]; then
            echo "Erro ao disparar o pipeline."
            exit 1
          fi

          echo "Pipeline disparado com sucesso. RUN_ID: $RUN_ID"
          
          check_pipeline_status() {
            local status
            while : ; do
              status=$(az pipelines runs show \
                --id "$RUN_ID" \
                --project "$PROJECT" \
                --org "$ORG" \
                --query "status" -o tsv | tr -d '\r')

              if [ -z "$status" ] || [ "$status" == "null" ]; then
                echo "Erro ao capturar o status do pipeline."
                exit 1
              fi

              if [[ "$status" == "completed" ]]; then
                break
              fi

              echo "Pipeline em andamento. Status atual: $status"
              sleep 10  
            done

            echo "Pipeline concluído. Verificando resultado final..."
          }

          check_pipeline_status

          FINAL_STATUS=$(az pipelines runs show \
            --id "$RUN_ID" \
            --project "$PROJECT" \
            --org "$ORG" \
            --query "result" -o tsv | tr -d '\r')

          if [[ "$FINAL_STATUS" == "succeeded" ]]; then
            echo "Pipeline concluído com sucesso."
            exit 0
          else
            echo "Pipeline falhou com o status: $FINAL_STATUS"
            exit 1
          fi

      env:
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)


