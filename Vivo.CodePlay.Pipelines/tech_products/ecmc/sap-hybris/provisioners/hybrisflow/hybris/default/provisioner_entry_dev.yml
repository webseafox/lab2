parameters:
- name: environmentCode
  type: string
  values:
  - d1
  - d2
  - d3
- name: databaseUpdateMode
  type: string
  values:
  - NONE
  - UPDATE
- name: deployStrategy
  type: string
  values:
  - RECREATE
  - ROLLING_UPDATE

variables:
- template: /tech_products/ecmc/sap-hybris/global/variables/pipeline.yml
- group: lojaonline-sap-commerce-core-customize-java-b2b-dev

resources:
  repositories:
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/heads/master

  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines

  - repository: EcmcPythonScripts
    name: ECMC - Ecomm Cloud B2C/src-devops-scripts
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines

stages:
- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/init.yml
  parameters:
    isDevEnvironment: True

- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/build_test.yml
  parameters:
      isDevEnvironment: True

- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion

- ${{ if eq(variables['Build.Reason'], 'Manual') }}:
  - template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/build_sap.yml
    parameters:
      conditionToDeploy: ne('${{ parameters.environmentCode }}', '')
      isDevEnvironment: True

  - template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/deploy_sap.yml
    parameters:
      environmentCode: ${{ parameters.environmentCode }}
      databaseUpdateMode: ${{ parameters.databaseUpdateMode }}
      deployStrategy: ${{ parameters.deployStrategy }}
      conditionToDeploy: ne('${{ parameters.environmentCode }}', '')
      isDevEnvironment: True
