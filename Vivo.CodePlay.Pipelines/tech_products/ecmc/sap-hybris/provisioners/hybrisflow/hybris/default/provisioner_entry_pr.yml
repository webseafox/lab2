variables:
- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/variables/load.yml

resources:
  repositories:
  - repository: CorePipelines
    name: DevOps/Vivo.Core.Pipelines
    type: git
    ref: refs/heads/master
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  - repository: CorePipelinesScripts
    name: DevOps/Vivo.Core.Pipelines.Scripts
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
stages:
- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/init.yml

## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
## EXECUTA A VALIDAÇÃO EM TODOS OS PRs
- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/validate_standards_dev_flow.yaml

- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/build_test.yml
  parameters:
    enableDevflowValidations: True

# QUALITY GATE
- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/gates.yaml

- template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/stages/security.yml
  parameters:
    fortifyExclusionRepository: FortifyExclusion
