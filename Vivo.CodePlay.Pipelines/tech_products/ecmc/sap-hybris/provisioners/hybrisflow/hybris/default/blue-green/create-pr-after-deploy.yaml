parameters:
- name: blue_green
  type: string
  default: 'Não'
  values:
  - 'Não'
  - 'Sim'
- name: environment_for_deploy
  type: string
- name: targetRepo
  type: string
  default: "src-sap-commerce-core-customize-java-b2b"

jobs:
- job: create_pr_after_deploy
  displayName: "${{ parameters.environment_for_deploy }} - Create PR for branches after deploy"
  dependsOn:
  - verificar_deploy_job
  - acompanhar_deploy_job
  - ${{ if eq(parameters.blue_green, 'Sim') }}:
    - deploy_blue_green_success
  condition: succeeded()
  workspace:
    clean: all
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  variables:
  - name: BUILD_CODE_FROM_SAP
    value: $[ dependencies.verificar_deploy_job.outputs['verificar_deploy_bash.BUILD_CODE_FROM_SAP'] ]
  - name: BRANCH_NAME_IN_BUILD
    value: $[ dependencies.verificar_deploy_job.outputs['verificar_deploy_bash.BRANCH_NAME_IN_BUILD'] ]
  - name: COMMIT_HASH_IN_BUILD
    value: $[ dependencies.verificar_deploy_job.outputs['verificar_deploy_bash.COMMIT_HASH_IN_BUILD'] ]

  steps:
  - template: /tech_products/ecmc/shared/tasks/git/create_pr_in_branches.yaml
    parameters:
      targetRepo: ${{ parameters.targetRepo }}
      branchSourceRef: $(BRANCH_NAME_IN_BUILD)
      prBranches: $(PR_BRANCHES_TOMBAMENTO)
      sourceCommit: $(COMMIT_HASH_IN_BUILD)

