parameters:
- name: isDevEnvironment
  type: boolean
  default: False
- name: testParam
  type: string
  default: "$(BRANCH_NAME_TO_USE_SEMANTIC)"
stages:
- stage: pipeline_init
  displayName: "Pipeline initialization"
  isSkippable: false
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: prepare_pipeline
    displayName: "Prepare"
    steps:
    - template: /tech_products/sap-hybris/tasks/artifacts/publish_catalog_info.yml
      parameters:
        breakWhenNotFound: true

  - ${{ if in(variables['Build.Reason'], 'Schedule') }}:
    - job: validate_run_scheduled
      workspace:
        clean: all
      displayName: "Pre validate run"
      steps:
      - checkout: self
        fetchDepth: 2
        persistCredentials: true

      - bash: |
          echo "##vso[task.setvariable variable=NO_CHANGES]FALSE"

          LAST_HASH=$(git log -n 1  --pretty=format:"%H")
          FILES_CHANGED=$(git log -n 1 --name-only --pretty=format: )
          TOTAL_FILES=$(echo $FILES_CHANGED | wc -l)

          if [ $TOTAL_FILES -eq 1 ] && [ "$FILES_CHANGED" == "VERSION" ]; then
            echo "##[error]Total de arquivos modificados: $TOTAL_FILES"
            echo "##[error]Encerrando pipeline"
            echo "##[error]O único arquivo modificado foi $FILES_CHANGED"
            echo "##vso[task.setvariable variable=NO_CHANGES]TRUE"
            echo "##[error]Não existem arquivos relevantes para o build da aplicação."
            echo "##[error]A pipeline será encerrada sem criação de build na plataforma da SAP"
          fi

          echo "##[section]Arquivos alterados"
          for FILE_CHANGED in $FILES_CHANGED; do
            echo "##[section]$FILE_CHANGED"
          done
        displayName: "Validate run"
        condition: eq(variables['Build.Reason'], 'Schedule')

      - bash: |
          if [ $NO_CHANGES_ENV == "TRUE" ]; then
            echo "NO_CHANGES $(NO_CHANGES)"
            echo "NO_CHANGES_ENV $NO_CHANGES_ENV"
            az pipelines build cancel --build-id $(Build.BuildId)
          fi
        displayName: "Cancel if empty changes"
        env:
          AZURE_DEVOPS_EXT_PAT: $(SYSTEM_ACCESS_TOKEN)
          NO_CHANGES_ENV: $(NO_CHANGES)

  - ${{ if ne(variables['Build.Reason'],'PullRequest') }}:
    - job: first_steps
      workspace:
        clean: all
      dependsOn:
      - prepare_pipeline
      - ${{ if in(variables['Build.Reason'], 'Schedule') }}:
        - validate_run_scheduled
      displayName: "Running init"
      steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true

      - ${{ if and(ne(parameters.isDevEnvironment, True), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/project/')), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual', 'Schedule')) }}:

        - template: /tech_products/ecmc/shared/tasks/upgrade_semantic_version_with_python.yaml
          parameters:
            taskName: determine_new_version
            extraEnvironmentVars:
              FILE_VERSION_PATH: "VERSION"

        - bash: |
            echo "[debug]SAP_COMMERCE_OPTIONS_VERSION ....................: ${SAP_COMMERCE_OPTIONS_VERSION}"
            echo "[debug]NEW_VERSION .....................................: ${NEW_VERSION}"
            echo "[debug]COMPONENT_VERSION ...............................: ${COMPONENT_VERSION}"

            BUILD_ID=$(Build.BuildId)

            cd $(Build.SourcesDirectory)

            set -e
            echo "##[section]BUILD.SOURCEBRANCH: ................. $(PROJECT_SOURCE_BRANCH)"
            CURRENT_VERSION_BEFORE=$(cat VERSION)
            NEW_VERSION_FILE=${NEW_VERSION}
            NEW_VERSION_CLEAN="${NEW_VERSION}.${BUILD_ID}"
            NEW_VERSION="v${NEW_VERSION}"

            echo "##[section]CURRENT VERSION: .................... $CURRENT_VERSION_BEFORE"
            echo "##[section]NEW VERSION: ........................ $NEW_VERSION"
            echo "##[section]NEW VERSION FILE: ................... $NEW_VERSION_FILE"
            echo "##[section]CHANGE SEMANTIC VERSION: ............ $UPDATE_VERSION"
            echo "##[section]BUILD_ID: ........................... $BUILD_ID"

            echo "##vso[task.setvariable variable=NEW_VERSION_FILE]$NEW_VERSION_FILE"
            echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$NEW_VERSION"
            echo "##vso[task.setvariable variable=NEW_VERSION_CLEAN;isOutput=true]$NEW_VERSION_CLEAN"
          name: set_build_version
          displayName: 'Set new Version'
          condition: and(or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/project/')), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual', 'Schedule'))

        - template: /tech_products/ecmc/sap-hybris/tasks/versioning/send_commit_with_new_version.yaml

      - ${{ else }}:
          - bash: |
              echo "isDevEnvironment  ${{ parameters.isDevEnvironment }}"
              BUILD_ID=$(Build.BuildId)

              cd $(Build.SourcesDirectory)

              set -e

              echo "##[section]BUILD.SOURCEBRANCH: ................. $(PROJECT_SOURCE_BRANCH)"
              CURRENT_VERSION=$(date '+%Y%m%d.%H%M%S')
              NEW_VERSION="${CURRENT_VERSION}.${BUILD_ID}-DEV"
              NEW_VERSION_CLEAN="$CURRENT_VERSION.${BUILD_ID}"

              echo "##[section]NEW VERSION: ........................ $NEW_VERSION"
              echo "##[section]CHANGE SEMANTIC VERSION: ............ $UPDATE_VERSION"
              echo "##[section]CURRENT VERSION: .................... $CURRENT_VERSION"
              echo "##[section]BUILD_ID: ........................... $BUILD_ID"

              echo "##vso[task.setvariable variable=NEW_VERSION_FILE]$NEW_VERSION_FILE"
              echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$NEW_VERSION"
              echo "##vso[task.setvariable variable=NEW_VERSION_CLEAN;isOutput=true]$NEW_VERSION_CLEAN"
            name: set_build_version
            displayName: 'Set new Version (with suffix "-DEV")'
