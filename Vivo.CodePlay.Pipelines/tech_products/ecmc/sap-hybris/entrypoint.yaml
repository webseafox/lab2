parameters:
- name: environmentCode
  type: string
  values:
  - s1
  - s2
  - s3
  - d1
  - d2
  - d3
- name: databaseUpdateMode
  type: string
  values:
  - NONE
  - UPDATE
- name: deployStrategy
  type: string
  values:
  - RECREATE
  - ROLLING_UPDATE
- name: buildAndDeploySap
  type: boolean
  default: true
- name: isDevEnvironment
  type: boolean
  default: False

extends:
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/provisioner_entry_pr.yml

  ${{ else }}:
    ${{ if eq(lower(parameters.isDevEnvironment), true) }}:
      template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/provisioner_entry_dev.yml
      parameters:
        environmentCode: ${{ parameters.environmentCode   }}
        databaseUpdateMode: ${{ parameters.databaseUpdateMode  }}
        deployStrategy: ${{ parameters.deployStrategy  }}

    ${{ else }}:
      template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/provisioner_entry.yml
      parameters:
        environmentCode: ${{ parameters.environmentCode   }}
        databaseUpdateMode: ${{ parameters.databaseUpdateMode  }}
        deployStrategy: ${{ parameters.deployStrategy  }}
        buildAndDeploySap: ${{ parameters.buildAndDeploySap  }}
