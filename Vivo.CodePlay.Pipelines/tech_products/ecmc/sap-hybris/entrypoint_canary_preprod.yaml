parameters:
- name: blue_green
  type: string
  default: 'Não'
  values:
  - 'Não'
  - 'Sim'
- name: build_name
  type: string
  default: ''
- name: database_update_mode
  type: string
  default: 'NONE'
  values:
  - NONE
  - UPDATE
- name: deploy_strategy
  type: string
  default: 'RECREATE'
  values:
  - RECREATE
  - ROLLING_UPDATE
- name: environment_for_deploy
  type: string
  values:
  - s1
  - s2
  - s3
  - d1
  - d2
  - d3
  - d4
  - d5
  - d6
  - d7
  - d8
  - d9
  - d10
  - d11
  - d12
  - d13
  - d14
  - d15
- name: is_rollback
  type: boolean
  default: true #não abre pr tombamento

# Template selection switches based on pipeline configuration parameters
extends:
  template: /tech_products/ecmc/sap-hybris/provisioners/hybrisflow/hybris/default/provisioner_entry_canary.yaml
  parameters:
    build_name: ${{ parameters.build_name}}
    blue_green: ${{ parameters.blue_green }}
    database_update_mode: ${{ parameters.database_update_mode}}
    deploy_strategy: ${{ parameters.deploy_strategy }}
    environment_for_deploy: ${{ parameters.environment_for_deploy }}
    is_rollback: ${{ parameters.is_rollback }}
