steps:
- bash: |
    cd $(Build.SourcesDirectory)

    verify_and_stop_if_error() {
      if [[ $1 != 0 ]]; then
        exit 1
      fi
    }

    if [[ "${NEW_VERSION_FILE}" == "" ]]; then
      MSG="Problema ao recuperar a versão"
      echo "##[command]$MSG"
      echo "##vso[task.logissue type=error;] $MSG"
      echo "##vso[task.complete result=Failed;]"
      exit 1
    fi

    git config --replace-all user.name "Azure DevOps" && git config --replace-all user.email "azuredevops@telefonicati.onmicrosoft.com"
    GIT_CURRENT_SHA=$(git rev-parse HEAD)

    echo "##[section]COMMIT HASH DO PROJETO: $GIT_CURRENT_SHA"

    echo "##[debug]Verificando se ACTUAL_BRANCH ${ACTUAL_BRANCH} é igual ao conteúdo da variável BRANCH_NAME_TO_USE_SEMANTIC ${BRANCH_NAME_TO_USE_SEMANTIC}"
    if [[ "${ACTUAL_BRANCH}" == "refs/heads/${BRANCH_NAME_TO_USE_SEMANTIC}" ]]; then
      echo "##[debug]Setando versão semântica no  arquivo  VERSION"
      echo -n "${NEW_VERSION_FILE}" > VERSION
      git add -f VERSION
    else
      echo "##[debug]Setando versão não semântica no  arquivo  .azuredevops/VERSION"
      echo "##[debug]ACTUAL_BRANCH ${ACTUAL_BRANCH} não é igual ao conteúdo da variável BRANCH_NAME_TO_USE_SEMANTIC ${BRANCH_NAME_TO_USE_SEMANTIC}"
      echo -n "${NEW_VERSION_FILE}" > .azuredevops/VERSION
      git add -f .azuredevops/VERSION
    fi

    COMMIT_MESSAGE="[CI SKIP] Project version updated to ${NEW_VERSION_FILE}"
    git commit -am "${COMMIT_MESSAGE}"

    verify_and_stop_if_error $(echo $?)
    CMD_RUN="push origin HEAD:$(PROJECT_SOURCE_BRANCH)"
    echo "##[command]git $CMD_RUN"
    git $CMD_RUN

    if [[ "$TAG_REPO" == "true" ]]; then
      CMD_TAG="tag ${NEW_VERSION_FILE}"
      echo "##[command]Enviando $CMD_TAG"
      git $CMD_TAG
      git push origin refs/tags/$NEW_VERSION_FILE
      if [ $? -ne 0 ]; then
        echo "##vso[task.logissue type=error;] Git push tag"
        echo "##vso[task.complete result=Failed;]"
        exit 1
      fi
    fi

    if [ $? -ne 0 ]; then
      echo "##vso[task.logissue type=error;] Git push failed"
      echo "##vso[task.complete result=Failed;]"
      exit 1
    fi
  displayName: "Update Version"
  name: core_new_version_commit
  condition: succeeded()
  env:
    ACTUAL_BRANCH: $(Build.SourceBranch)
