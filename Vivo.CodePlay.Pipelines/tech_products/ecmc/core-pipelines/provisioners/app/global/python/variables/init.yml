parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/core-pipelines/global/variables/pipeline.yml

# PROXY
- name: PROXY_NSKP_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: "no_proxy"
  value: $(PROXY_NSKP_NO_PROXY)
- name: PROXY_SQUID_SERVER
  value: "10.240.58.39:3128" # proxy Squid para evitar erros de timeout do proxy NetSkope.
- name: PROXY_NSKP_SERVER
  value: "nskp.redecorp.br:8080"
- name: PROXY_AGENT_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: PROXY_ADDL_NO_PROXY
  value: ""
# 10.240.58.39:3128 ? 10.238.70.1
- name: PROXY_NSKP_HTTP
  value: "nskp.redecorp.br:8080"
- name: PROXY_NSKP_HTTPS
  value: "nskp.redecorp.br:8080"

# variables for app/python
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Python"
- name: SOURCE_DIR
  value: "app"

# Python configs
- name: LINT_ENABLED
  value: true
- name: BUMP_VERSION_ENABLED
  value: true
- name: VERSION_MANAGER_TYPE
  value: "version_file" # uv or version_file
- name: CMD_EXTRACT_PYTHON_SETUP_VERSION
  value: 'uv version --short'

# Python test commands
- name: DEFAULT_CMD_RUN_TESTS
  value: "export PYTHONPATH=./; pytest --rootdir=. tests/ --junitxml=junit.xml --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing"
- name: UV_CMD_RUN_TESTS
  value: "uv sync --dev && uv run pytest --rootdir=. tests/ --junitxml=junit.xml --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing"
- name: BREAK_TEST_FAILED
  value: false

# Python uv
- name: UV_VERSION
  value: "0.11.18"
- name: UV_CMD_SYNC
  value: "uv sync --no-dev --no-cache"

# Python linting
- name: BREAK_LINT_FAILED
  value: false
- name: DEFAULT_CMD_LINT
  value: "python -m pip install ruff && export PYTHONPATH=. && python -m ruff check ."
- name: UV_CMD_LINT
  value: "uv sync --dev && uv run ruff check ."


# Pull request validations
- name: DEVFLOW_BRANCH_PATTERN
  value: '(?:(^refs\/heads\/)|^)(docs|feat|fix|perf|refactor|style|test|devops|upgrade)(\/.*)'
- name: DEVFLOW_COMMIT_PATTERN
  value: '(docs|feat|fix|perf|refactor|style|test|devops|project|upgrade): .+|((.*CI\s+SKIP.*|.*ci\s+skip.*|.*SKIP\s+CI .*|.*skip\s+ci.*|.*Merged PR.*|.*Merge branch.*|.*Merge remote-tracking.*)[^:]*)'
- name: DEVFLOW_VALIDATE_LIMIT_TOP_COMMITS
  value: 1
- name: DEVFLOW_FILES_TO_COMMIT
  value: 'pyproject.toml uv.lock'

# variables for databricks
- name: CMD_EXTRACT_DATABRICKS_COMPONENT_VERSION
  value: $(cat VERSIONFILE)

# helm
- name: DEFAULT_GENERIC_JAVA_CHART_NAME
  value: "helm-lojaonline-python"
- name: DEFAULT_GENERIC_JAVA_CHART_VERSION
  value: "1.0.0"

# deploy stage
- name: CMD_EXTRACT_DEPLOY_APP_VERSION
  value: ${BUILD_SOURCEBRANCH#refs/tags/}
