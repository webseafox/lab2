parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/core-pipelines/global/variables/pipeline.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}

# java/maven commands
- name: JAVA_CMD_EXTRACT_VERSION_FROM_POM
  value: mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec
- name: JAVA_CMD_EXTRACT_APP_NAME_FROM_POM
  value: mvn -q -Dexec.executable=echo -Dexec.args='${project.artifactId}' --non-recursive exec:exec

# docker
- name: DOCKER_CMD_EXTRACT_POM_XML_VERSION
  value: $(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)

# maven configuration
- name: MAVEN_CACHE_FOLDER
  value: $HOME/.m2/repository
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
- name: DEFAULT_MAVEN_SETTINGS
  value: $HOME/.m2/settings.xml
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: "settings.xml"  # Nome do arquivo no Secure Files
- name: DEFAULT_MAX_MEMORY_BUILD
  value: "4096m"

# Disable custom settings by default to prevent authentication errors
- name: SKIP_MAVEN_CUSTOM_SETTINGS
  value: true

# docker configuration
- name: DOCKER_WORKDIR
  value: "/app"

- name: DOCKER_CMD_DEVELOPMENT_FLOW_VERSION
  value: $(date +%Y%m%d%H%M%S)

# variables for app/java
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CMD_BUILD_TEST
  value: ""
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Java"
- name: ARGOCD_PRODUCTION_MAIN_BRANCH
  value: "master"
- name: ARGOCD_HML_MAIN_BRANCH
  value: "master"
- name: CACHE_APP_DEPENDENCIES
  value: true

- name: CONTENTS
  value: |
    **/*
    !.git/**/*
    !?/**/*
    !**/*.log