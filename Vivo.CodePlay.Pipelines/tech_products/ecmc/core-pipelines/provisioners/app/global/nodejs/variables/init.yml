parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/core-pipelines/global/variables/pipeline.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}

# docker
- name: DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION
  value: $(yq -r '.version' package.json)
- name: DOCKER_CMD_EXTRACT_APP_NAME
  value: $(yq -r '.name' package.json)

- name: DOCKER_CMD_DEVELOPMENT_FLOW_VERSION
  value: $(date +%Y%m%d%H%M%S)

# variables for app/node
- name: DEFAULT_WORKDIR_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/extracted_tars/app"
- name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
  value: "$(System.ArtifactsDirectory)/docker"
- name: CMD-GET-ORGANIZATION-NAME
  value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
- name: CMD_BUILD_TEST
  value: ""
- name: DEFAULT_NPMRC_TEMP_PATH
  value: "$(Agent.TempDirectory)"
- name: DEFAULT_NPMRC_TEMP_FILE_PATH
  value: "$(DEFAULT_NPMRC_TEMP_PATH)/.npmrc"
- name: CORPORATE_WIKI_DOC_URL
  value: "https://wikicorp.telefonica.com.br/display/AC/Modelo+Node.js"
- name: ARGOCD_PRODUCTION_MAIN_BRANCH
  value: "master"
- name: ARGOCD_HML_MAIN_BRANCH
  value: "master"
- name: CACHE_APP_DEPENDENCIES
  value: true
- name: RUN_CODE_HEALER_SCA
  value: false

- name: CONTENTS
  value: |
    **/*
    !.git/**/*
    !?/**/*
    !**/*.log