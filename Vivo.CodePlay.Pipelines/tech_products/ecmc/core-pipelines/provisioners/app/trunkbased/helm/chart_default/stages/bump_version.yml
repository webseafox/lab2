parameters:
- name: incrementLevel
  type: string

stages:
- stage: stage_helm_bump_version
  displayName: Bump Version
  dependsOn: stage_helm_lint
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: job_helm_bump_version
    displayName: Bumping Chart Version
    condition: eq(variables.BUMP_VERSION_ENABLED, true)
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/bash/welcome.yml
    - template: /tech_products/ecmc/core-pipelines/tasks/helm/bump_version.yml
      parameters:
        helmChartVersionVariable: "HELM_CHART_VERSION"
        ${{ if parameters.incrementLevel }}:
          incrementLevel: ${{ parameters.incrementLevel }}
    - template: /tech_products/ecmc/core-pipelines/tasks/telemetry/telemetry.yml