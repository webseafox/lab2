parameters:
- name: updateChartVersion
  default: false
  type: boolean
- name: incrementLevel
  default: patch
- name: ACRAsDefaultHelmRegistry
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/helm/chart_default/variables/load.yml
  parameters:
    updateChartVersion: ${{ parameters.updateChartVersion }}
    ACRAsDefaultHelmRegistry: ${{ parameters.ACRAsDefaultHelmRegistry }}

stages:
## Lint
- template: stages/lint.yml

## Bump Version
- template: stages/bump_version.yml
  parameters:
    incrementLevel: ${{ parameters.incrementLevel }}

## Package & Publish
- template: stages/package_publish.yml

## Update Repo
- template: stages/update_repo.yml
