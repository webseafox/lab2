stages:
- stage: validate
  displayName: Prepare Deploy
  dependsOn:
    - pipeline_init
  pool: ${{ parameters.private_agent_pool }}
  jobs:
  - job: GetDockerMetadata
    displayName: Get Docker Metadata
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tech_products/ecmc/core-pipelines/tasks/docker/export_metadata.yml
      parameters:
        dockerImageTag: ${{ parameters.appVersion }}
        dockerAppVersion: ${{ parameters.appVersion }}
        ${{ if eq(parameters.imageName, '') }}:
          dockerImageName: "$(GOV_APP_ACRONYM)/$(APP_NAME)"
        ${{ else }}:
          dockerImageName: ${{ parameters.imageName }}
    - template: /tech_products/ecmc/core-pipelines/tasks/artifacts/publish_docker.yml

# Deploy QA Environments
- stage: release
  pool: ${{ parameters.private_agent_pool }}
  displayName: "Deploy ${{ parameters.environment }}"
  jobs:
    - deployment: ${{ parameters.environment }}
      workspace:
        clean: all
      displayName: Deploy
      environment: "deploy-${{parameters.environment}}"
      strategy:
        runOnce:               
          deploy:
            steps:
            - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_deploy.yml
              parameters:
                environment: ${{parameters.environment}}
                kubeconfig: ${{parameters.kubeconfig}}
                helmReleaseNamePrefix: ${{parameters.helm_release_name_prefix}}

          on:
            success:
              steps:
              - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_pos_deploy_success.yml
                
            failure:
              steps:
                - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_pos_deploy_failure.yml