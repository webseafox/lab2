parameters:
- name: run_component_test
  type: boolean
  default: False
- name: runSecurityStage
  type: boolean
  default: True
- name: qa_environment
  type: string
- name: enableDevflowValidations
  type: boolean
  default: False
- name: argocd_enabled
  type: boolean
  default: False
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: bumpVersionOnManual
  type: boolean
  default: false

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    environment: ${{ parameters.qa_environment }}
    forceDockerK8sSecretCreation: False

stages:
# Pull Request Flow

## INIT
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/init.yml

## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
- ${{ if eq(parameters.enableDevflowValidations, True) }}:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/validate_standards_dev_flow.yml

## BUILD & TEST
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/build_test.yml
  parameters:
    enableDevflowValidations: ${{ parameters.enableDevflowValidations }}
    bumpVersionOnManual: ${{ parameters.bumpVersionOnManual }}

## GATES
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/gates.yml
  parameters:
    environment: "${{parameters.qa_environment}}"

## SECURITY
- ${{ if eq(parameters.runSecurityStage, True) }}:
  - template: /provisioners/app/trunkbased/java/api_default/stages/security_sast_sca.yml@CorePipelines
    parameters:
      fortifyExclusionRepository: FortifyExclusion

## PACKAGE
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/package.yml
  parameters:
    run_component_test: ${{ parameters.run_component_test }}
    environment: "${{parameters.qa_environment}}"
    enabledCanaryReleaseWithArgoCD: False
    ${{ if eq(parameters.runSecurityStage, True) }}:
      dependsOnSecurityStage: True

## VALIDATIONS
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/validation.yml

## COMPONENT TEST
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/component_test.yml
  parameters:
    run_component_test: ${{ parameters.run_component_test }}

- ${{ if eq(parameters.enableDevflowValidations, True) }}:
## FINALIZE PRE VALIDATIONS
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/pos_validate_standards_dev_flow.yml
    parameters:
      stage_depends_on: package
