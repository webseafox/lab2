# LIBRARY DEFAULT OVERRIDES
# Use this file to override any variables from the load.yml file
# This allows for customization per project without modifying the base template

variables:
# Example overrides (uncomment and modify as needed):

# Override Maven goals for specific library needs
# - name: MAVEN_GOALS
#   value: "clean compile install"

# Override version strategy
# - name: LIBRARY_VERSION_STRATEGY
#   value: "timestamp"

# Override code coverage requirements
# - name: MINIMUM_CODE_COVERAGE
#   value: "90"

# Override Nexus repository settings
# - name: NEXUS_REPOSITORY_URL
#   value: "https://custom-nexus.company.com/repository/maven-public/"

# Override SonarQube settings
# - name: SONARQUBE_PROJECT_KEY
#   value: "custom:project:key"

# Override allowed licenses
# - name: ALLOWED_LICENSES
#   value: "Apache-2.0,MIT"

# Override documentation settings
# - name: GENERATE_DOCUMENTATION
#   value: false

# Add custom variables specific to your library
# - name: CUSTOM_LIBRARY_SETTING
#   value: "custom_value"
