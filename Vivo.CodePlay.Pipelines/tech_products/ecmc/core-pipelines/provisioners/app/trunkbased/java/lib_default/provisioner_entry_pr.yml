parameters:
- name: runSecurityStage
  type: boolean
  default: True
- name: enableDevflowValidations
  type: boolean
  default: False
- name: run_integration_tests
  type: boolean
  default: False

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: False
    environment: 'dev'
    forceDockerK8sSecretCreation: False

stages:
# Pull Request Flow for Libraries

## INIT
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/init.yml

## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
- ${{ if eq(parameters.enableDevflowValidations, True) }}:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/validate_standards_dev_flow.yml

## BUILD & TEST
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/build_test.yml
  parameters:
    enableDevflowValidations: ${{ parameters.enableDevflowValidations }}
    run_integration_tests: ${{ parameters.run_integration_tests }}

## GATES  
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/gates.yml

## SECURITY
- ${{ if eq(parameters.runSecurityStage, True) }}:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/security_sast_sca.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

## PACKAGE
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/package.yml
  parameters:
    generate_documentation: False
    ${{ if eq(parameters.runSecurityStage, True) }}:
      dependsOnSecurityStage: True

- ${{ if eq(parameters.enableDevflowValidations, True) }}:
## FINALIZE PRE VALIDATIONS
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/lib_default/stages/pos_validate_standards_dev_flow.yml
    parameters:
      stage_depends_on: package
