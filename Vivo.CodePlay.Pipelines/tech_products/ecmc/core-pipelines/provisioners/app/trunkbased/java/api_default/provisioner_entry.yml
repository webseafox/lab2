parameters:
- name: qa_environment
  type: string
- name: run_component_test
  type: boolean
- name: skip_deploy
  type: boolean
  default: False
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: argocd_enabled
  type: boolean
  default: True
- name: enableDevflowValidations
  type: boolean
  default: False
- name: runSecurityStage
  type: boolean
  default: True
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: enabledCanaryReleaseWithArgoCD
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False
- name: bumpVersionOnManual
  type: boolean
  default: false

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    environment: ${{ parameters.qa_environment }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}

stages:
# CI / CD Flow

## INIT
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/init.yml

- ${{ if or( and(ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')), and(startsWith(variables['Build.SourceBranch'], 'refs/heads/'), ne(parameters.dev_namespace_to_deploy, '')) ) }}:
  ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/validate_standards_dev_flow.yml

  ## BUILD & TEST
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/build_test.yml
    parameters:
      enableDevflowValidations: ${{ parameters.enableDevflowValidations }}
      bumpVersionOnManual: ${{ parameters.bumpVersionOnManual }}

  ## GATES
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/gates.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## SECURITY
  - ${{ if eq(parameters.runSecurityStage, True) }}:
    # Execução do stage de segurança para branch master e pull requests
    - ${{ if eq(parameters.dev_namespace_to_deploy, '') }}:
      - template: /provisioners/app/trunkbased/java/api_default/stages/security_sast_sca.yml@CorePipelines
        parameters:
          fortifyExclusionRepository: FortifyExclusion

    # Execução do stage de segurança para branch diferente de master e o ambiente é dev1 a dev12
    - ${{ if ne(parameters.dev_namespace_to_deploy, '') }}:
      - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/security_sast_dev.yml
        parameters:
          fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/package.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
      environment: "dev"
      enabledCanaryReleaseWithArgoCD: ${{ parameters.enabledCanaryReleaseWithArgoCD }}
      ${{ if eq(parameters.runSecurityStage, True) }}:
        dependsOnSecurityStage: True

  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
  ## FINALIZE PRE VALIDATIONS
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/pos_validate_standards_dev_flow.yml
      parameters:
        stage_depends_on: package

  ## VALIDATIONS
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/validation.yml

  ## COMPONENT TEST
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/component_test.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"

  ## DEPLOY
  - ${{ if ne(parameters.skip_deploy, True) }}:
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/deploy.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        argocd_enabled: ${{ coalesce(variables.ARGOCD_ENABLED, parameters.argocd_enabled) }}
        dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: true
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

# Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/java/api_default/stages/release.yml
    parameters:
      argocd_enabled: ${{ coalesce(variables.ARGOCD_ENABLED, parameters.argocd_enabled) }}
      git_tag: false
      useExternalEnv: ${{ parameters.useExternalEnv }}
      azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
      kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      environment: ${{ parameters.qa_environment }}
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
      private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
      kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
      helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(parameters.qa_environment) }})