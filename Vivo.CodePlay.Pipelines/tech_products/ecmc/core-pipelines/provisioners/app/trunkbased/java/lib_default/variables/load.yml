parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: environment
  type: string
  default: 'dev'
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False

variables:
# LOAD GLOBAL JAVA VARIABLES
- template: /tech_products/ecmc/core-pipelines/provisioners/app/global/java/variables/init.yml

# LIBRARY SPECIFIC OVERRIDES
- name: MAVEN_BUILD_GOALS
  value: "clean compile"
- name: MAVEN_TEST_GOALS
  value: "clean verify -DskipITs"
- name: MAVEN_PACKAGE_GOALS
  value: "package"
- name: MAVEN_INSTALL_GOALS
  value: "install"
- name: MAVEN_DEPLOY_GOALS
  value: "deploy"
- name: MAVEN_COMPONENT_TEST_GOALS
  value: "clean verify -DskipUTs"

# ARTIFACT PUBLISHING
- name: PUBLISH_TO_NEXUS
  value: true
- name: NEXUS_REPOSITORY_URL
  value: $(CORPORATE_NEXUS_URL)
- name: NEXUS_REPOSITORY_ID
  value: "vivo-nexus"

# LIBRARY VERSIONING
- name: LIBRARY_VERSION_STRATEGY
  value: "semantic"
- name: AUTO_INCREMENT_VERSION
  value: true
- name: VERSION_FILE_PATH
  value: "pom.xml"

# BUILD ARTIFACTS
- name: JAR_ARTIFACT_PATH
  value: "target/*.jar"
- name: SOURCES_JAR_ENABLED
  value: true
- name: JAVADOC_JAR_ENABLED
  value: true

# TESTING
- name: UNIT_TEST_ENABLED
  value: true
- name: INTEGRATION_TEST_ENABLED
  value: false
- name: MUTATION_TEST_ENABLED
  value: false
- name: MINIMUM_CODE_COVERAGE
  value: "80"
- name: MINIMUM_MUTATION_COVERAGE
  value: "90"

# QUALITY GATES - Dynamic Configuration
- name: SONARQUBE_PROJECT_KEY
  value: ${{ coalesce(variables['CUSTOM_SONARQUBE_PROJECT_KEY'], format('{0}:{1}', variables['ORGANIZATION_KEY'], variables['APPLICATION_NAME'])) }}
- name: SONARQUBE_PROJECT_NAME
  value: ${{ coalesce(variables['CUSTOM_SONARQUBE_PROJECT_NAME'], format('{0} - Library', variables['APPLICATION_NAME'])) }}
- name: SONARQUBE_ORGANIZATION
  value: ${{ coalesce(variables['CUSTOM_SONARQUBE_ORGANIZATION'], variables['CORPORATE_SONARQUBE_ORGANIZATION']) }}

# SECURITY
- name: DEPENDENCY_CHECK_ENABLED
  value: true
- name: LICENSE_CHECK_ENABLED
  value: true
- name: ALLOWED_LICENSES
  value: "Apache-2.0,MIT,BSD-3-Clause"

# DOCUMENTATION
- name: GENERATE_DOCUMENTATION
  value: true
- name: DOCUMENTATION_FORMAT
  value: "javadoc"
- name: PUBLISH_DOCUMENTATION
  value: true
