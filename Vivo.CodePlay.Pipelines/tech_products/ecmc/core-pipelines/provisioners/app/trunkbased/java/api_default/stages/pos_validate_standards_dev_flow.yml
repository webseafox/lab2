parameters:
- name: base_repository_with_package_json
  type: string
  default: $(Build.SourcesDirectory)/$(Build.Repository.Name)
- name: stage_depends_on
  type: string
  default: package

# Chama diretamente o template do NodeJS
stages:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/pos_validate_standards_dev_flow.yml
  parameters:
    base_repository_with_package_json: ${{ parameters.base_repository_with_package_json }}
    stage_depends_on: ${{ parameters.stage_depends_on }}
