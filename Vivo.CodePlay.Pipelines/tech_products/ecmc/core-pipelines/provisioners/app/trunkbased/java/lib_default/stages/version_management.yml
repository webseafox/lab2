stages:
- stage: version_management
  displayName: "Version Management"
  dependsOn: pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: manage_version
    displayName: "Manage Library Version"
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/git/checkout_last_commit.yml
      parameters:
        branchName: "$(Build.SourceBranchName)"
    - template: /tech_products/ecmc/core-pipelines/tasks/maven/extract_api_version.yml
      parameters:
        currentVersionVariableOut: CURRENT_VERSION
    - template: /tech_products/ecmc/core-pipelines/tasks/versioning/bump_version.yml
      parameters:
        currentVersion: $(export_current_version.CURRENT_VERSION)
        newVersionVariableOut: LIB_NEW_VERSION
        incrementLevel: patch
