parameters:
- name: generate_documentation
  type: boolean
  default: True
- name: dependsOnSecurityStage
  type: boolean
  default: False

stages:
- stage: package
  dependsOn:
  - build_test
  - gate
  - ${{ if eq(parameters.dependsOnSecurityStage, True)}}:
    - security
  displayName: "Package Library"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: "Package"
    displayName: "Package Library"
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
      parameters:
        skipDownload: true
        workingDirectory: $(Build.SourcesDirectory)
    - template: /tech_products/ecmc/core-pipelines/tasks/maven/custom_settings_setup.yml
      parameters:
        mavenSettingsLocationOutputVarName: "MAVEN_SETTINGS_LOCATION"
    - script: |
        mvn -s $(MAVEN_SETTINGS_LOCATION) clean package -DskipTests
      displayName: "Package JAR artifacts"
    - ${{ if eq(parameters.generate_documentation, True) }}:
      - script: |
          mvn -s $(MAVEN_SETTINGS_LOCATION) javadoc:jar
        displayName: "Generate Javadoc"
    - script: |
        mvn -s $(MAVEN_SETTINGS_LOCATION) source:jar
      displayName: "Generate Sources JAR"
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Library Artifacts'
      inputs:
        ArtifactName: 'lib-package'
        PathtoPublish: 'target/'
        StoreAsTar: true
