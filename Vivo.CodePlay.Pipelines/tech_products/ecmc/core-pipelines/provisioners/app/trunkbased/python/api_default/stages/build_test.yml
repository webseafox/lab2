parameters:
- name: enableDevflowValidations
  type: boolean
  default: False
- name: mutationTestsEnable
  type: boolean
  default: False
- name: newVersionVariableOut
  type: string
  default: NEW_VERSION

stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
    - pipeline_init
    - ${{ if eq(parameters.enableDevflowValidations, True) }}:
      - repo_validations
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: bump_build_test
      displayName: Bumping Version & Build/Test
      workspace:
        clean: all
      steps:
      - template: /tech_products/ecmc/core-pipelines/tasks/git/checkout_last_commit.yml
        parameters:
          branchName: "$(Build.SourceBranchName)"
          fetchDepth: 1

      - template: /tech_products/ecmc/core-pipelines/tasks/python/config.yml

      - template: /tech_products/ecmc/core-pipelines/tasks/versioning/bump_version_python.yml
        parameters:
          currentVersion: $(export_current_version.CURRENT_VERSION)
          newVersionVariableOut: ${{ parameters.newVersionVariableOut }}

      - template: /tech_products/ecmc/core-pipelines/task_groups/build/python_build_test_without_docker.yml
        parameters:
          newVersion: "$(component_bump_version.${{ parameters.newVersionVariableOut }})"
          mutationTestsEnable: ${{ parameters.mutationTestsEnable }}



