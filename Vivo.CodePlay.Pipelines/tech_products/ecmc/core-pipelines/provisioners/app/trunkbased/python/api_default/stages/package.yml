parameters:
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: environment
  type: string
  default: ''

stages:
- stage: package
  dependsOn:
  - build_test
  - gate
  displayName: "Package & Publish"
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: "Package"
    condition: or(
                and(
                  always(),
                  eq(variables.flowIsTagging, false),
                  eq(variables.flowIsMain, true)
                ),
                or(
                  eq(variables.flowIsMain, true),
                  eq(variables['Build.Reason'], 'PullRequest'),
                  and(
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/'),
                    ${{ ne(parameters.dev_namespace_to_deploy, '') }}
                  )
                )
            )
    workspace:
      clean: all
    displayName: "Package"
    variables:
      - name: APP_VERSION
        value: $[ stageDependencies.build_test.bump_build_test.outputs['component_bump_version.NEW_VERSION'] ]
    steps:
    - checkout: self
      persistCredentials: true
      fetchDepth: 1

    - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)

    - template: /tech_products/ecmc/core-pipelines/task_groups/package/docker_package_internal_app.yml
      parameters:
        environment: ${{ parameters.environment }}
