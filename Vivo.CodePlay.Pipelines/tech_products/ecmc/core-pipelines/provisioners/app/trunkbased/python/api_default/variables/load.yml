parameters:
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: environment
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/global/python/variables/init.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}

- template: /.azuredevops/variables/private.yml@self
  parameters:
    isQaEnviromentDev:  ${{ in(parameters.environment, 'dev') }}

- name: COMPONENT_TESTS_WORKING_DIRECTORY
  value: $(Agent.TempDirectory)/component_test

- name: COMPONENT_TESTS_COMPOSE_PROJECT_NAME
  value: $(Build.BuildId)

- name: COMPONENT_TESTS_COMPOSE_MAIN_SERVICE
  value: ""

- name: COMPONENT_TESTS_COMPOSE_FILE_PATH
  value: ""

- name: COMPONENT_TESTS_RESULT_DIRECTORY
  value: ""

- group: "azdo-team-project-variables"

- ${{ if eq(parameters.environment, 'dev') }}:
  - name: serviceConnectionDeploySuffix
    value: dev
- ${{ elseif in(parameters.environment, 'esteira1', 'esteira2', 'preprod', 'prodlike') }}:
  - name: serviceConnectionDeploySuffix
    value: test
- ${{ elseif eq(parameters.environment, 'producao') }}:
  - name: serviceConnectionDeploySuffix
    value: prod
