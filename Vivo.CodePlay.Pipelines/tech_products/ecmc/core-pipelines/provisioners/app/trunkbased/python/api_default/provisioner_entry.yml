parameters:
- name: qa_environment
  type: string
- name: skip_deploy
  type: boolean
  default: False
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: argocd_enabled
  type: boolean
  default: False
- name: enableDevflowValidations
  type: boolean
  default: False
- name: ACRAsDefaultDockerRegistry
  type: boolean
  default: False
- name: useExternalEnv
  type: boolean
  default: False
- name: forceDockerK8sSecretCreation
  type: boolean
  default: False
- name: mutationTestsEnable
  type: boolean
  default: False


resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CodePlay
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/variables/load.yml
  parameters:
    ACRAsDefaultDockerRegistry: ${{ parameters.ACRAsDefaultDockerRegistry }}
    environment: ${{ parameters.qa_environment }}
    forceDockerK8sSecretCreation: ${{ parameters.forceDockerK8sSecretCreation }}

# CI / CD Flow
stages:
## INIT
- template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/init.yml

- ${{ if or( and(ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')), and(startsWith(variables['Build.SourceBranch'], 'refs/heads/'), ne(parameters.dev_namespace_to_deploy, '')) ) }}:
  ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/validate_standards_dev_flow.yml

  ## BUILD & TEST
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/build_test.yml
    parameters:
      enableDevflowValidations: ${{ parameters.enableDevflowValidations }}
      mutationTestsEnable: ${{ parameters.mutationTestsEnable }}

  ## GATES
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/gates.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## PACKAGE
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/package.yml
    parameters:
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
      environment: "dev"

  ## FINALIZE PRE VALIDATIONS
  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/pos_validate_standards_dev_flow.yml
      parameters:
        stage_depends_on: package

  ## DEPLOY
  - ${{ if ne(parameters.skip_deploy, True) }}:
    - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/deploy.yml
      parameters:
        environment: ${{ parameters.qa_environment }}
        argocd_enabled: ${{ parameters.argocd_enabled }}
        dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
        private_agent_pool: $(PRIVATE_AGENT_DEV)
        kubeconfig: $(KUBECONFIG_DEV)
        git_tag: true
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
        useExternalEnv: ${{ parameters.useExternalEnv }}
        azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
        kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}

# Manual Release Flow
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/python/api_default/stages/release.yml
    parameters:
      argocd_enabled: ${{ parameters.argocd_enabled }}
      git_tag: false
      useExternalEnv: ${{ parameters.useExternalEnv }}
      azureServiceConnectionEnabled: ${{ variables.azureServiceConnectionEnabled }}
      kubernetesServiceConnectionEnabled: ${{ variables.kubernetesServiceConnectionEnabled }}
      environment: ${{ parameters.qa_environment }}
      dev_namespace_to_deploy: ${{ parameters.dev_namespace_to_deploy }}
      private_agent_pool: $(PRIVATE_AGENT_${{ upper(parameters.qa_environment) }})
      kubeconfig: $(KUBECONFIG_${{ upper(parameters.qa_environment) }})
      helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_${{ upper(parameters.qa_environment) }})
