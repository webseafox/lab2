parameters:
- name: gitTag
- name: currentVersion
  type: string
- name: newVersion
  type: string
  default: ''
- name: incrementLevel
  type: string
  default: patch
  
steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    printf "
    ${GREEN}=================================================================================================================================
    ${GREEN}                                                 SUCCESS LIB PUBLISH
    ${GREEN}=================================================================================================================================
    Parabéns sua biblioteca foi publicada com sucesso no repositório de artefatos.

    Caso tenha dúvidas sobre essa fase do pipeline acesse a nossa documentação: $(CORPORATE_WIKI_DOC_URL)
    ${GREEN}=================================================================================================================================
    "
  displayName: Lib Publish Success
  name: t_success_message

- ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags')) }}:
  - template: /tech_products/ecmc/core-pipelines/task_groups/publish/success_nodejs_lib_publish.yml
    parameters: 
      gitTag: ${{parameters.gitTag}}      
      currentVersion: ${{ parameters.currentVersion }}
      newVersion: ${{ parameters.newVersion }}
      incrementLevel: ${{ parameters.incrementLevel }}