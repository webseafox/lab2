steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'

    printf "
    ${RED}=================================================================================================================================
    ${RED}                                              FAILURE LIB PUBLISH
    ${RED}=================================================================================================================================
    Se está vendo essa mensagem é porque aconteceu algo erro durante a publicação da sua biblioteca.

    Segue abaixo umas dicas parao TSHOOT:
    $(ALERT_MESSAGE_ARROW) Consulte o log do estágio de publicação do artefato.
    $(ALERT_MESSAGE_ARROW) Verifique se a versão corrente da biblioteca já existe no repositório (sobrescrita não é permitido).
    $(ALERT_MESSAGE_ARROW) Confira se as informações do repositório e credenciais de acesso estão corretas.

    Caso tenha dúvidas sobre essa fase do pipeline acesse a nossa documentação: $(CORPORATE_WIKI_DOC_URL)
    ${RED}=================================================================================================================================
    "
  displayName: Lib Publish Failure
  name: t_failure_message

