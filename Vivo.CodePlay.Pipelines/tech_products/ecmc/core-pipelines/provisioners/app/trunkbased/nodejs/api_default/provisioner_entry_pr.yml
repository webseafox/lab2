parameters:
  - name: run_component_test
    type: boolean
  - name: qa_environment
    type: string
  - name: enableDevflowValidations
    type: boolean
    default: False
  - name: argocd_enabled
    type: boolean
    default: False
  - name: ACRAsDefaultDockerRegistry
    type: boolean
    default: False
  - name: mutationTestsEnable
    type: boolean
    default: False

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

variables:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/variables/load.yml
    parameters:
      environment: ${{ parameters.qa_environment }}

stages:
  # CI / CD Flow

  ## INIT
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/init.yml

  - ${{ if eq(parameters.enableDevflowValidations, True) }}:
      ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
      - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/validate_standards_dev_flow.yml

  ## BUILD & TEST
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/build_test.yml
    ${{ if eq(parameters.enableDevflowValidations, True) }}:
      parameters:
        enableDevflowValidations: "${{parameters.enableDevflowValidations}}"
        mutationTestsEnable: "${{parameters.mutationTestsEnable}}"

  ## GATES
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/gates.yml
    parameters:
      environment: "${{parameters.qa_environment}}"

  ## SECURITY
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/security_sast_sca.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## PACKAGE
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/package.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
      environment: "${{parameters.qa_environment}}"
      dependsOnSecurityStage: True

  ## CODE-HEALER SCA
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/code_healer_sca.yml
    parameters:
      repositoryName: $(Build.Repository.Name)
      branchName: $(System.PullRequest.SourceBranch)
      codeHealerPipelineName: $(CODE_HEALER_SCA_PIPELINE_NAME)
      codeHealerPipelineBranch: $(CODE_HEALER_SCA_PIPELINE_BRANCH)
      codeHealerProject: $(System.TeamProject)
      scaFailedCondition: "and(eq(variables.RUN_CODE_HEALER_SCA, 'true'), eq(dependencies.package.outputs['Package.sca_status.SCA_FAILED'], 'true'))"
      minNodeVersion: $(CODE_HEALER_SCA_MIN_NODE_VERSION)
      dependsOn: package

  ## VALIDATIONS
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/validation.yml

  ## COMPONENT TEST
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/stages/component_test.yml
    parameters:
      run_component_test: "${{parameters.run_component_test}}"
