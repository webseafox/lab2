stages:
- stage: validate
  displayName: Prepare Deploy
  dependsOn:
  - pipeline_init
  variables:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/variables/override.yml
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: validate
    displayName: Validate
    steps:
    - template: /tech_products/ecmc/core-pipelines/tasks/bash/welcome.yml
    - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
        skipDownload: true
    - template: /tech_products/ecmc/core-pipelines/global/general/set-output-variable.yml
      parameters:
        variable: APP_VERSION
        command: $(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)
    - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_validate.yml
      parameters:
        environment: ${{ parameters.environment }}

# Deploy QA Environments
- stage: release
  variables:
  - template: /tech_products/ecmc/core-pipelines/provisioners/app/trunkbased/nodejs/api_default/variables/override.yml
  pool: ${{ parameters.private_agent_pool }}
  displayName: "Deploy ${{ parameters.environment }}"
  jobs:
  - deployment: ${{ parameters.environment }}
    workspace:
      clean: all
    displayName: Deploy
    environment: "deploy-${{ parameters.environment }}"
    strategy:
      runOnce:
        preDeploy:
          steps:
          - template: /tech_products/ecmc/core-pipelines/task_groups/deploy/run_pre_deploy.yml

          - ${{ if eq(parameters.argocd_enabled, 'true') }}:
            - checkout: CorePipelinesScripts
              persistCredentials: true
              fetchDepth: 1
            - checkout: ArgoCD
              persistCredentials: true
              fetchDepth: 1
            - checkout: ArgoCD-Production
              persistCredentials: true
              fetchDepth: 1
            - checkout: self
              persistCredentials: true
              fetchDepth: 1

          - template: /tech_products/ecmc/core-pipelines/tasks/git/checkout_master_deploy.yml

          - template: /tech_products/ecmc/core-pipelines/tasks/config_management/setup.yml

          - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml

          - template: /tech_products/ecmc/core-pipelines/tasks/config_management/run_deploy_or_release.yml
            parameters: ${{ parameters }}

        deploy:
          steps:
          - ${{ if or(eq(parameters.azureServiceConnectionEnabled, true), eq(parameters.kubernetesServiceConnectionEnabled, true)) }}:
            - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_deploy_with_service_connection.yml
              parameters:
                environment: ${{ parameters.environment }}
                helmReleaseNamePrefix: ${{ parameters.helm_release_name_prefix }}
                useExternalEnv: ${{ parameters.useExternalEnv }}
                azureServiceConnectionEnabled: ${{ parameters.azureServiceConnectionEnabled }}
                kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}
          - ${{ else }}:
            - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_deploy.yml
              parameters:
                environment: ${{ parameters.environment }}
                kubeconfig: ${{ parameters.kubeconfig }}
                helmReleaseNamePrefix: ${{ parameters.helm_release_name_prefix }}
                useExternalEnv: ${{ parameters.useExternalEnv }}
                argocd_enabled: ${{ parameters.argocd_enabled }}

        on:
          success:
            steps:
            - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_pos_deploy_success.yml
            - template: /tech_products/ecmc/core-pipelines/task_groups/governance/check_govapp_policies.yml
              parameters:
                govAppBreakglass: false
                govAppOperation: "deploy"
                continueOnError: false
                environment: ${{ parameters.environment }}
                stack: "NODEJS"

          failure:
            steps:
            - template: /tech_products/ecmc/core-pipelines/task_groups/release/run_pos_deploy_failure.yml
