parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    pipelineType: app # i.e. app, infra, api_gateway, automation
    technology: nodejs  # i.e. java, nodejs, python, helm, terraform, axway, flutter, acr, azdo_extension, azure_artifacts
    modelName: api_default # i.e. bff_client_default, api_default, lib_default, chart_default, databricks_default, azure, mobile_default, purge (App Legacy names: trunkbasedmicroservicek8s, gitflowmicroservicek8s, azure/m1, api/m2), default
    branchingStrategy: "" # i.e. trunkbased, vivoflow (for "app" type pipelines only)
    mutationTestsEnable: False # Enable mutation tests (true/false)

# Template selection switches based on pipeline configuration parameters
extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/ecmc/core-pipelines/provisioners/${{ parameters.config.pipelineType }}/${{ parameters.config.branchingStrategy }}/${{ parameters.config.technology }}/${{ parameters.config.modelName}}/provisioner_entry_pr.yml
  # CI/CD
  ${{ else }}:
    template: /tech_products/ecmc/core-pipelines/provisioners/${{ parameters.config.pipelineType }}/${{parameters.config.branchingStrategy}}/${{ parameters.config.technology }}/${{ parameters.config.modelName }}/provisioner_entry.yml

  ${{ if parameters.config.params }}:
    parameters: ${{ parameters.config.params }}
