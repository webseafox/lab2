parameters:
- name: cmdBuildTest
  default: $(CMD_BUILD_TEST)
- name: artifactPublishEnable
  default: true
- name: artifactPublishName
  default: app
- name: dockerWorkDir
  type: string
  default: $(DOCKER_WORKDIR)
- name: newVersion
  default: ""
- name: contents
  default: $(CONTENTS)
- name: mutationTestsEnable
  type: boolean
  default: False

steps:
- template: /tech_products/ecmc/core-pipelines/tasks/nodejs/setup_credentials.yml

- template: /tech_products/ecmc/core-pipelines/tasks/nodejs/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tech_products/ecmc/core-pipelines/tasks/nodejs/cache_dependencies.yml
  parameters:
    appDependenciesCachePathOutputVarName: "APP_DEPENDENCIES_CACHE_PATH"
    appDependenciesCacheFolderOutputVarName: "APP_DEPENDENCIES_CACHE_FOLDER"
    condition: eq(variables.CACHE_APP_DEPENDENCIES, true)

- ${{ if eq(parameters.mutationTestsEnable, True) }}:
  - template: /tech_products/ecmc/core-pipelines/tasks/nodejs/prepare_build_files.yml
    parameters:
      mutationTestsEnable: ${{ parameters.mutationTestsEnable }}

- template: /tech_products/ecmc/core-pipelines/tasks/nodejs/build_with_docker.yml
  parameters:
    dockerWorkDir: ${{ parameters.dockerWorkDir}}
    cmdBuildTest: ${{ parameters.cmdBuildTest }}
    appDependenciesCachePath: $(APP_DEPENDENCIES_CACHE_PATH)
    appDependenciesCacheFolder: $(APP_DEPENDENCIES_CACHE_FOLDER)
    mutationTestsEnable: ${{ parameters.mutationTestsEnable }}

- ${{ if eq(parameters.artifactPublishEnable, true) }}:
  - template: /tech_products/ecmc/core-pipelines/tasks/artifacts/publish_app.yml
    parameters:
      artifactPublishName: ${{ parameters.artifactPublishName }}
      contents: ${{ parameters.contents }}
