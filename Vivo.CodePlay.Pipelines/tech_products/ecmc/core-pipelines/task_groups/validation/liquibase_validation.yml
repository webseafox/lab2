steps:
- template: /tech_products/ecmc/core-pipelines/tasks/azure_key_vault/get_akv_credentials.yml
  parameters:
    secretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

- template: /tech_products/ecmc/core-pipelines/tasks/docker/docker_image_build.yml.yml

- template: /tech_products/ecmc/core-pipelines/tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'verifyDbStatus'
    taskName: 't_verify_db_is_updated'
    displayName: 'Verify if Database is up to date'
    continueOnError: 'true'