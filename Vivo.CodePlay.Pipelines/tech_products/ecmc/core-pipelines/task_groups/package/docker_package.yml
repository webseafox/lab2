parameters:
- name: artifactName
  default: app
- name: environment
  default: ""
- name: dependsOnSecurityStage
  type: boolean
  default: False

steps:
- template: /tech_products/ecmc/core-pipelines/tasks/artifacts/download_app.yml
  parameters:
    artifactName: ${{ parameters.artifactName }}

- template: /tech_products/ecmc/core-pipelines/tasks/docker/export_image_tags.yml
  parameters:
    namespace: $(GOV_APP_ACRONYM)
    appSystem: $(APP_SYSTEM)
    appName: $(APP_NAME)
    appVersion: $(APP_VERSION)
    environment: ${{ parameters.environment }}

- template: /tech_products/ecmc/core-pipelines/tasks/docker/build_publish_image.yml
  parameters:
    appName: $(APP_NAME)
    dockerImageName: $(DOCKER_IMAGE_NAME)
    dockerImageTag: $(DOCKER_IMAGE_TAG)
    appVersion: $(APP_VERSION)
    dependsOnSecurityStage: ${{ parameters.dependsOnSecurityStage }}

- template: /tech_products/ecmc/core-pipelines/tasks/git/tag.yml
  parameters:
    staticTagName: "$(DOCKER_IMAGE_TAG)"
    condition: and(succeeded(), ne(variables.BUMP_VERSION_ENABLED, true))

- template: /tech_products/ecmc/core-pipelines/tasks/docker/export_metadata.yml

- template: /tech_products/ecmc/core-pipelines/tasks/artifacts/publish_docker.yml
