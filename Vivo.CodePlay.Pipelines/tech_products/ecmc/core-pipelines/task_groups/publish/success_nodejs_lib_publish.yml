parameters:
- name: gitTag
- name: currentVersion
  type: string
- name: newVersion
  type: string
- name: incrementLevel
  type: string
  default: patch

steps:
- template: /tech_products/ecmc/core-pipelines/tasks/nodejs/update_repo_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- ${{ if eq(parameters.gitTag, 'true') }}:
  - bash: |
      GIT_TAG=${NEW_VERSION}
      if [[ -z "${NEW_VERSION}" ]]; then
        GIT_TAG=${CURRENT_VERSION}
      fi

      echo "##vso[task.setvariable variable=VAR_GIT_TAG]${GIT_TAG}"
      echo "##[debug] Exporting variable 'VAR_GIT_TAG': ${GIT_TAG}"
    displayName: Defining Git Tag Version
    env:
      NEW_VERSION: ${{ parameters.newVersion }}
      CURRENT_VERSION: ${{ parameters.currentVersion }}

  - template: /tech_products/ecmc/core-pipelines/tasks/git/tag.yml
    parameters:
      staticTagName: '$(VAR_GIT_TAG)'