
parameters:
- name: branchName
  type: string
- name: fetchDepth
  type: number
  default: 0

steps:
  - checkout: self
    persistCredentials: true
    clean: true
    fetchDepth: ${{ parameters.fetchDepth }}

  - ${{ if eq(parameters.fetchDepth, 0) }}:
    - bash: |
        echo "[section]Checkout last commit from '${BRANCH_NAME}'"

        git config pull.rebase true
        git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
        git checkout -f ${BRANCH_NAME}

        echo "[section]Git command result code: '${?}'"

      displayName: Checkout last commit
      name: checkout_last_commit
      env:
        BRANCH_NAME: ${{ parameters.branchName }}
