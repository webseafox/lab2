parameters:
- name: targetRemoteUrl
  type: string
  default: ''
- name: sourceBranch
  type: string
  default: $(Build.SourceBranch)
- name: targetBranch
  type: string
  default: ''
- name: targetName
  type: string
  default: ''
- name: gitPushParameter
  type: string
  default: ''
- name: workingDirectory
  default: "$(Pipeline.Workspace)/$(Build.Repository.Name)"

steps:
- checkout: self
  persistCredentials: true
  path: $(Build.Repository.Name)
  fetchDepth: 0

- script: |
    echo "Switching to source branch ${{ parameters.sourceBranch }}"
    git checkout ${{ parameters.sourceBranch }}
  displayName: 'Switching to source branch'
  env:
    FILES_TO_ADOBE_IGNORE: $(FILES_TO_ADOBE_IGNORE)
  workingDirectory: ${{ parameters.workingDirectory }}

- script: |
    if [ -d "Vivo.CodePlay.Pipelines" ]; then
      echo "##[debug]Submodule Vivo.CodePlay.Pipelines encontrado. Removendo..."
      git rm -f Vivo.CodePlay.Pipelines
      rm -rf .git/modules/Vivo.CodePlay.Pipelines .gitmodules
    fi
  displayName: 'Remove submodule if exists'
  workingDirectory: ${{ parameters.workingDirectory }}

- script: |
    if [ ! -z "${FILES_TO_ADOBE_IGNORE}" ]; then
      echo "Removing files from source branch that should not be pushed to Adobe"
      for FILE in $FILES_TO_ADOBE_IGNORE; do
        rm -rf "$FILE"
      done
      git commit -am "Azure Devops: Removing files that should not be pushed to Adobe" || echo "No files to remove"
    fi
  displayName: 'Removing files that should not be pushed to Adobe'

- script: |
    if [ ! -z "${FILES_TO_ADOBE_IGNORE}" ]; then
      echo "Removing files from source branch that should not be pushed to Adobe"
      for FILE in $FILES_TO_ADOBE_IGNORE; do
        rm -rf "$FILE"
      done
    fi
  displayName: 'Removing files that should not be pushed to Adobe'
  env:
    FILES_TO_ADOBE_IGNORE: $(FILES_TO_ADOBE_IGNORE)
  workingDirectory: ${{ parameters.workingDirectory }}
  condition: and(succeeded(), eq(variables['RUN_FILES_TO_ADOBE_IGNORE'], true))

- script: |
    echo "sourceBranch......${{ parameters.sourceBranch }}"
    echo "targetRemoteUrl......${{parameters.targetRemoteUrl}}"

    targetBranch=${{parameters.targetBranch}}
    if [[ -z "${{parameters.targetBranch}}" ]]; then
      targetBranch=${{ parameters.sourceBranch }}
    fi
    echo "targetBranch......${targetBranch}"

    git commit -am "Azure Devops: Removing files that should not be pushed to Adobe" || echo "No files to remove"
    git remote add target "${{parameters.targetRemoteUrl}}"
    git pull 
    
    git commit -am "Azure Devops: Merge Adobe remote with local" || echo "No files to merge"
    git push -f ${{ parameters.gitPushParameter }} target ${{ parameters.sourceBranch }}:${targetBranch}
  displayName: 'Push changes to branch on ${{parameters.targetName}}'
  workingDirectory: ${{ parameters.workingDirectory }}
