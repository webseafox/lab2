parameters:
- name: pythonVersion
  type: string

steps:
- bash: |
    cat << EOF > lib-tests.sh
    #!/bin/bash
    echo "##[debug]Criando ambiente virtual python..."
    make virtualenv

    echo "##[debug]Ativando ambiente virtual python..."
    source .venv/bin/activate

    echo "##[debug]Instalando/Restaurando dependências de dev..."
    make install-dev

    echo "##[debug]Executando Testes no source da library..."
    make test
    EOF
  displayName: Create Tests Script Script

- template: /tech_products/ecmc/core-pipelines/tasks/python/run_bash_on_docker.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    scriptNameOrCmd: "bash lib-tests.sh"
    displayName: Running Tests
