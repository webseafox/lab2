parameters:
- name: newVersion
  type: string
- name: conditionUv
  type: object
- name: conditionVersionFile
  type: object

steps:

- bash: |
    git config user.email "azuredevops@telefonicati.onmicrosoft.com"
    git config user.name "Azure DevOps"
  displayName: "Config git user/email"
  workingDirectory: "$(Build.SourcesDirectory)"

- bash: |
    git add VERSION
    git commit -am "[CI SKIP] Project version has been updated. Released version ${NEW_VERSION}"
    git switch master 2>/dev/null || git switch -c master
    git push origin --delete ${NEW_VERSION}

    git tag -a ${NEW_VERSION} -m "Automatically generated tag from pipeline"
    git push origin ${NEW_VERSION} -f
    git push origin master
  displayName: "Updating version file and add tag"
  workingDirectory: "$(Build.SourcesDirectory)"
  condition: ${{ parameters.conditionVersionFile }}
  env:
    NEW_VERSION: ${{ parameters.newVersion }}

- task: VersionManagerVivo@8
  inputs:
    command: 'commitVersion'
    branchStrategy: trunkbased
    fileStrategy: 'singleFile'
    versionFile: pyproject.toml
    createTag: true
    version: "${{ parameters.newVersion }}"
    commitMessage: "[CI SKIP] Project version has been updated. Released version ${{ parameters.newVersion }}"
  condition: ${{ parameters.conditionUv }}
  displayName: "Updating pyproject.toml/uv.lock"

- script: |
    if [ "$(Agent.JobStatus)" == "Failed" ]; then
      echo "[error]Erro no push para o repositório"
      echo ""
      echo "[error]Por favor, reexecute novamente para descartar problemas de rede. Caso a reexecução falhe, verifique se o repositório informado existe e se a pipeline tem permissão para acessá-lo."
      exit 1
    fi
  displayName: "Troubleshooting help"
  condition: failed()
