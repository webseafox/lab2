parameters:
- name: chartPath
  default: $(Build.SourcesDirectory)
- name: destination
  default: $(Build.ArtifactStagingDirectory)/helm/package
- name: chartNewVersion
  default: ""
  type: string

steps:
- task: HelmDeploy@0
  displayName: 'Helm package'
  inputs:
    command: package
    chartPath: ${{ parameters.chartPath }}
    destination: ${{ parameters.destination }}
    ${{ if and(parameters.chartNewVersion, ne(parameters.chartNewVersion, '')) }}:
      chartVersion: ${{ parameters.chartNewVersion }}
