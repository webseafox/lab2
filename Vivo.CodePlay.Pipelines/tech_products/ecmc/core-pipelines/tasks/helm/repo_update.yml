parameters:
- name: connectionType
  default: None
- name: name

steps:
- task: HelmDeploy@0
  displayName: 'helm repo update ${{ parameters.name }}'
  inputs:
    connectionType: ${{ parameters.connectionType }}
    command: repo
    arguments: update ${{ parameters.name }}
  env:
    ASDF_HELM_VERSION: $(HELM_VERSION)