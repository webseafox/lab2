parameters:
- name: helmChartVersionVariable
  type: string
- name: incrementLevel
  type: string
  values:
    - major
    - minor
    - patch
    - prerelease
  default: patch

steps:
- template: /tech_products/ecmc/core-pipelines/tasks/git/checkout_last_commit.yml
  parameters:
    branchName: "$(Build.SourceBranchName)"
- template: /tech_products/ecmc/core-pipelines/tasks/helm/extract_chart_info.yml
  parameters:
    chartCurrentVersionOut: 'HELM_CHART_VERSION'

- task: semver-bump@1
  inputs:
    VersionVariable: 'HELM_CHART_VERSION'
    IncrementLevel: ${{ parameters.incrementLevel }}

- bash: |
    echo "##vso[task.setvariable variable=${CHART_NEW_VERSION_OUT};isOutput=true]${CHART_VERSION}"
    echo "##[debug] Exporting variable '${CHART_NEW_VERSION_OUT}': ${CHART_VERSION}"
  displayName: 'Defining New Chart Version'
  name: helm_bump_version
  env:
    CHART_VERSION: $(HELM_CHART_VERSION)
    CHART_NEW_VERSION_OUT: "${{ parameters.helmChartVersionVariable }}"
