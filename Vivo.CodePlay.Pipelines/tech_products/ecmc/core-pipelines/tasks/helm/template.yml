parameters:
- name: environment
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: workDir
- name: k8sKubeconfig
- name: helmReleaseNamePrefix
- name: helmReleaseName
- name: helmReleaseNamespace
- name: helmRepoName
- name: helmChartName
- name: helmChartVersion
- name: helmTimeout
- name: helmHistoryMax
- name: helmImageRepository
- name: helmImageTag
- name: helmOciResgitryEnabled
- name: helmOciRegistryUrl
- name: helmOciChartBaseUrl
- name: helmImagePullSecret
- name: helmOciUsername
- name: helmOciPassword
- name: argocd_enabled
  type: boolean
  default: 'false'

steps:
- ${{ if eq(parameters.argocd_enabled, 'true') }}:
  - checkout: ArgoCD
    persistCredentials: true
    fetchDepth: 1
  - checkout: ArgoCD-Production
    persistCredentials: true
    fetchDepth: 1
  - checkout: self
    persistCredentials: true
    fetchDepth: 1

- template: /tech_products/ecmc/core-pipelines/tasks/helm/registry_login.yml

- bash: |
    echo "##[debug] HELM_REGISTRY_ACR_ENABLED...: ${HELM_REGISTRY_ACR_ENABLED}"
    echo "##[debug] HELM_CHART_NAME.............: ${HELM_CHART_NAME}"
    echo "##[debug] HELM_CHART_VERSION..........: ${{ parameters.helmChartVersion }}"
    echo "##[debug] HELM_RELEASE_NAME_PREFIX....: ${{ parameters.helmReleaseNamePrefix }}"
    echo "##[debug] HELM_RELEASE_NAME...........: ${{ parameters.helmReleaseName }}"
    echo "##[debug] HELM_RELEASE_NAMESPACE......: ${{ parameters.helmReleaseNamespace }}"
    echo "##[debug] HELM_TIMEOUT................: ${{ parameters.helmTimeout }}"
    echo "##[debug] HELM_IMAGE_REPOSITORY.......: ${{ parameters.helmImageRepository }}"
    echo "##[debug] HELM_IMAGE_TAG..............: ${{ parameters.helmImageTag }}"
    echo "##[debug] HELM_IMAGE_PULL_SECRET......: ${{ parameters.helmImagePullSecret }}"
    echo "##[debug] HELM_HISTORY_MAX............: ${{ parameters.helmHistoryMax }}"
    echo "##[debug] ENVIRONMENT.................: ${{ parameters.environment }}"

    if [ "${HELM_REGISTRY_ACR_ENABLED}" == "true" ]; then
      echo "##[debug] HELM_OCI_CHART_BASE_URL.....: ${HELM_OCI_CHART_BASE_URL}"
      HELM_FULL_CHART_NAME="${HELM_OCI_CHART_BASE_URL}${HELM_CHART_NAME}"
    else
      echo "##[debug] HELM_REPO_NAME:.............: ${HELM_REPO_NAME}"
      HELM_FULL_CHART_NAME="${HELM_REPO_NAME}/${HELM_CHART_NAME}"
    fi

    echo "##[debug] HELM_FULL_CHART_NAME........: ${HELM_FULL_CHART_NAME}"
    echo "##vso[task.setvariable variable=HELM_FULL_CHART_NAME;]$HELM_FULL_CHART_NAME"

  displayName: "Show Helm variables"
  env:
    HELM_REGISTRY_ACR_ENABLED: $(HELM_REGISTRY_ACR_ENABLED)
    HELM_CHART_NAME: ${{ parameters.helmChartName }}
    HELM_REPO_NAME: ${{ parameters.helmRepoName }}
    HELM_OCI_CHART_BASE_URL: ${{ parameters.helmOciChartBaseUrl }}
    serviceConnectionDeploySuffix: $(serviceConnectionDeploySuffix)
    azureServiceConnectionPrefix: $(azureServiceConnectionPrefix)
    azureResourceGroupPrefix: $(azureResourceGroupPrefix)
    azureKubernetesClusterPrefix: $(azureKubernetesClusterPrefix)
    kubernetesServiceConnectionPrefix: $(kubernetesServiceConnectionPrefix)

- bash: |
    function git_commands {
        BRANCH_NAME=$1
        echo "##[section]Executing git commands for branch: $BRANCH_NAME"
        git config --replace-all user.name "Azure DevOps"
        git config --replace-all user.email "azuredevops@telefonicati.onmicrosoft.com"
        git fetch
        git checkout $BRANCH_NAME
        git reset --hard origin/$BRANCH_NAME
    }

    source ~/.bashrc

    IS_PRODUCTION=$(echo "${HELM_RELEASE_NAMESPACE}" | grep -qE "^(production|prod|producao|ms|uncm-prod|devops)$" && echo "true" || echo "false")
    IS_PRODUCTION_ENVIRONMENT=$(echo "${ENVIRONMENT_CONFIG}" | grep -qE "^(production|prod|producao|ms|uncm-prod)$" && echo "true" || echo "false")
    ARGOCD_BRANCH=$(ARGOCD_HML_MAIN_BRANCH)
    ARGOCD_REPOSITORY="argocd"

    echo "##[debug] HELM_FULL_CHART_NAME........: ${HELM_FULL_CHART_NAME}"
    echo "##[debug] HELM_CHART_NAME.............: ${HELM_CHART_NAME}"
    echo "##[debug] HELM_CHART_VERSION..........: ${HELM_CHART_VERSION}"
    echo "##[debug] HELM_RELEASE_NAME_PREFIX....: ${HELM_RELEASE_NAME_PREFIX}"
    echo "##[debug] HELM_RELEASE_NAME...........: ${HELM_RELEASE_NAME}"
    echo "##[debug] HELM_RELEASE_NAMESPACE......: ${HELM_RELEASE_NAMESPACE}"
    echo "##[debug] HELM_TIMEOUT................: ${HELM_TIMEOUT}"
    echo "##[debug] HELM_IMAGE_REPOSITORY.......: ${HELM_IMAGE_REPOSITORY}"
    echo "##[debug] HELM_IMAGE_TAG..............: ${HELM_IMAGE_TAG}"
    echo "##[debug] HELM_IMAGE_PULL_SECRET......: ${HELM_IMAGE_PULL_SECRET}"
    echo "##[debug] HELM_HISTORY_MAX............: ${HELM_HISTORY_MAX}"
    echo "##[debug] ENVIRONMENT_CONFIG..........: ${ENVIRONMENT_CONFIG}"
    echo "##[debug] K8S_KUBE_CONFIG.............: ${K8S_KUBE_CONFIG}"
    echo "##[debug] DEPLOY_ARGO_CD..............: ${ARGOCD_ENABLED}"
    echo "##[debug] UNICOMM.....................: ${ENVIRONMENT_FOR_UNICOMM}"
    echo "##[debug] IS_PRODUCTION...............: ${IS_PRODUCTION}"

    if [[ "${IS_PRODUCTION}" == "true" ]] && [[ "${IS_PRODUCTION_ENVIRONMENT}" == "true" ]]; then
        ARGOCD_REPOSITORY="argocd-production"
        ARGOCD_BRANCH=$(ARGOCD_PRODUCTION_MAIN_BRANCH)

        cd $(Build.SourcesDirectory)/$(Build.Repository.Name)

        mkdir "${HELM_RELEASE_NAMESPACE}"

        helm template "${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            "${HELM_FULL_CHART_NAME}" --version "${HELM_CHART_VERSION}" \
            -f "./env/prd.yaml" \
            --kubeconfig "${K8S_KUBE_CONFIG}" \
            --namespace "${HELM_RELEASE_NAMESPACE}" \
            --set "nameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "fullnameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "containerName=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "image.repository=${HELM_IMAGE_REPOSITORY}" \
            --set "image.tag=${HELM_IMAGE_TAG}" \
            --set "imagePullSecrets[0].name=${HELM_IMAGE_PULL_SECRET}" \
            > "${HELM_RELEASE_NAMESPACE}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml"

        cd ../$ARGOCD_REPOSITORY/
        git_commands $ARGOCD_BRANCH

        cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${HELM_RELEASE_NAMESPACE}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml ${HELM_RELEASE_NAMESPACE}/

        git pull origin $ARGOCD_BRANCH
        git add ${HELM_RELEASE_NAMESPACE}/
        git commit -m "Nova versão do ${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME} no namespace ${HELM_RELEASE_NAMESPACE} "
        git push origin $ARGOCD_BRANCH

        if [ $? -ne 0 ]; then
          echo "##vso[task.logissue type=error;] Git push failed. Exiting with error"
          echo "##vso[task.complete result=Failed;]"
          echo "##[error]Falha ao enviar o commit para o repositório $ARGOCD_REPOSITORY"
          exit 1
        fi
        cd $(Build.SourcesDirectory)/$(Build.Repository.Name)

    elif [ "${ARGOCD_ALLNAMESPACES_HML}" == "true" ]; then
        if [[ "${ENVIRONMENT_FOR_UNICOMM}" == "true" ]]; then
          echo "##[debug] Variavel UNICOMM está habilitado com valor ${ENVIRONMENT_FOR_UNICOMM}."
          namespaces=("uncm-${{ parameters.environment }}")
        else
          namespaces=($ARGOCD_NAMESPACES)
        fi

        for namespace in "${namespaces[@]}"; do
            cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
            mkdir "${namespace}"

            helm template "${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
                "${HELM_FULL_CHART_NAME}" --version "${HELM_CHART_VERSION}" \
                -f "./env/hml.yaml" \
                --kubeconfig "${K8S_KUBE_CONFIG}" \
                --namespace "${namespace}" \
                --set "nameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
                --set "fullnameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
                --set "containerName=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
                --set "image.repository=${HELM_IMAGE_REPOSITORY}" \
                --set "image.tag=${HELM_IMAGE_TAG}" \
                --set "imagePullSecrets[0].name=${HELM_IMAGE_PULL_SECRET}" \
                > "${namespace}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml"

            cd ../$ARGOCD_REPOSITORY/
            git_commands $ARGOCD_BRANCH

            cp $(Build.SourcesDirectory)/$(Build.Repository.Name)/${namespace}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml ${namespace}

            git pull origin $ARGOCD_BRANCH
            git add -f ${namespace}/
            git commit -m "Nova versão do ${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME} no namespace ${namespace}"
            git push origin $ARGOCD_BRANCH

            if [ $? -ne 0 ]; then
              echo "##vso[task.logissue type=error;] Git push failed. Exiting with error"
              echo "##vso[task.complete result=Failed;]"
              echo "##[error]Falha ao enviar o commit para o repositório $ARGOCD_REPOSITORY"
              exit 1
            fi
            cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
        done
    else
        cd $(Build.SourcesDirectory)/$(Build.Repository.Name)

        if [[ "${IS_CONFIG_MANAGEMENT_DEV}" == "true" ]]; then
          HELM_RELEASE_NAMESPACE=$DEV_NAMESPACE
        fi
        mkdir "${HELM_RELEASE_NAMESPACE}"

        helm template "${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            "${HELM_FULL_CHART_NAME}" --version "${HELM_CHART_VERSION}" \
            -f "./env/hml.yaml" \
            --kubeconfig "${K8S_KUBE_CONFIG}" \
            --namespace "${HELM_RELEASE_NAMESPACE}" \
            --set "nameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "fullnameOverride=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "containerName=${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}" \
            --set "image.repository=${HELM_IMAGE_REPOSITORY}" \
            --set "image.tag=${HELM_IMAGE_TAG}" \
            --set "imagePullSecrets[0].name=${HELM_IMAGE_PULL_SECRET}" \
            > "${HELM_RELEASE_NAMESPACE}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml"

        cat "${HELM_RELEASE_NAMESPACE}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml"
        cd ../$ARGOCD_REPOSITORY/
        git_commands $ARGOCD_BRANCH

        cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${HELM_RELEASE_NAMESPACE}/${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME}.yaml ${HELM_RELEASE_NAMESPACE}/

        git pull origin $ARGOCD_BRANCH
        git add ${HELM_RELEASE_NAMESPACE}/
        git commit -m "Nova versão do ${HELM_RELEASE_NAME_PREFIX}${HELM_RELEASE_NAME} no namespace ${HELM_RELEASE_NAMESPACE} "
        git push origin $ARGOCD_BRANCH

        if [ $? -ne 0 ]; then
          echo "##vso[task.logissue type=error;] Git push failed. Exiting with error"
          echo "##vso[task.complete result=Failed;]"
          echo "##[error]Falha ao enviar o commit para o repositório $ARGOCD_REPOSITORY"
          exit 1
        fi
    fi
  displayName: "Deploy application via helm repository with argocd"
  workingDirectory: "${{parameters.workDir}}"
  condition: and(succeeded(), eq('${{ parameters.argocd_enabled }}', 'true'))
  env:
    HELM_REPO_NAME: ${{ parameters.helmRepoName }}
    HELM_CHART_NAME: ${{ parameters.helmChartName }}
    HELM_CHART_VERSION: ${{ parameters.helmChartVersion }}
    HELM_RELEASE_NAME_PREFIX: ${{ parameters.helmReleaseNamePrefix }}
    HELM_RELEASE_NAME: ${{ parameters.helmReleaseName }}
    HELM_RELEASE_NAMESPACE: ${{ parameters.helmReleaseNamespace }}
    HELM_TIMEOUT: ${{ parameters.helmTimeout }}
    HELM_IMAGE_REPOSITORY: ${{ parameters.helmImageRepository }}
    HELM_IMAGE_TAG: ${{ parameters.helmImageTag }}
    HELM_IMAGE_PULL_SECRET: ${{ parameters.helmImagePullSecret }}
    HELM_HISTORY_MAX: ${{ parameters.helmHistoryMax }}
    ENVIRONMENT_CONFIG: ${{ parameters.environment }}
    DEV_NAMESPACE: ${{ parameters.dev_namespace_to_deploy }}
    K8S_KUBE_CONFIG: ${{ parameters.k8sKubeconfig }}
    ARGOCD_ENABLED: ${{ parameters.argocd_enabled }}
    IS_CONFIG_MANAGEMENT_DEV: $(CONFIG_MANAGEMENT_DEV)
