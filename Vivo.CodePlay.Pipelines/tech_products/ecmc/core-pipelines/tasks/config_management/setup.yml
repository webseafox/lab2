steps:
- bash: |
    echo "##[debug] Variável CONFIG_MANAGEMENT está com o valor = ${CONFIG_MANAGEMENT}"
  displayName: "Config Mgmt"
  env:
    CONFIG_MANAGEMENT: "$(CONFIG_MANAGEMENT)"

- task: PipAuthenticate@1
  displayName: 'Config Mgmt - Pip Authenticate'
  inputs:
    artifactFeeds: $(AZURE_ARTIFACTS_FEED)
  env:
    http_proxy: $(PROXY_AGENT_HTTP)
    https_proxy: $(PROXY_AGENT_HTTPS)
    no_proxy: $(PROXY_AGENT_NO_PROXY)
  condition: and(
              succeeded(),
              eq(variables.CONFIG_MANAGEMENT, true)
            )

- bash: |
    set -uo pipefail
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    CONFIG_FILE_PATH=".tool-versions"

    echo "[command] Configuring Python version using asdf from file ${CONFIG_FILE_PATH}"

    CUSTOM_PYTHON_VERSION=$(awk '/^python[[:space:]]/{print $2; exit}' "${CONFIG_FILE_PATH}")

    asdf local python "${CUSTOM_PYTHON_VERSION}"
    PYTHON_DIR=$(asdf where python "${CUSTOM_PYTHON_VERSION}")
    echo "##vso[task.prependpath]${PYTHON_DIR}/bin"
  displayName: "Config Python version"
  condition: and(
              succeeded(),
              eq(variables.CONFIG_MANAGEMENT, true)
            )
  env:
    http_proxy: $(PROXY_AGENT_HTTP)
    https_proxy: $(PROXY_AGENT_HTTPS)
    no_proxy: $(PROXY_AGENT_NO_PROXY)

- bash: |
    echo "##[debug] Instalando requirements.txt"
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    python -m pip install -r requirements.txt
  displayName: "Config Mgmt - Install Packages"
  condition: and(
              succeeded(),
              eq(variables.CONFIG_MANAGEMENT, true)
            )


