parameters:
- name: publisherId
- name: extensionId
- name: extensionName
- name: azdoExtensionServiceConnection
- name: versionAction
  default: 'Patch'
- name: artifactName

steps:
- task: Npm@1
  inputs:
    command: 'install'
  displayName: Npm install Dependencies

- task: Npm@1
  inputs:
    command: 'custom'
    customCommand: 'run install:all'
  displayName: Npm install Tasks

- task: Npm@1
  inputs:
    command: 'custom'
    customCommand: 'run build:all'
  displayName: Npm Build Tasks

- task: QueryAzureDevOpsExtensionVersion@4
  name: QueryVersion
  inputs:
    connectTo: 'VsTeam'
    connectedServiceName: '${{ parameters.azdoExtensionServiceConnection }}'
    publisherId: '${{ parameters.publisherId }}'
    extensionId: '${{ parameters.extensionId }}'
    versionAction: '${{ parameters.versionAction }}'
    extensionVersionOverride: 'ExtensionVersionOverride'

- task: PackageAzureDevOpsExtension@4
  inputs:
    rootFolder: '$(System.DefaultWorkingDirectory)'
    publisherId: '${{ parameters.publisherId }}'
    extensionId: '${{ parameters.extensionId }}'
    extensionName: '${{ parameters.extensionName }}'
    extensionVersion: '$(QueryVersion.Extension.Version)'
    updateTasksVersion: true
    updateTasksVersionType: 'patch'
    extensionVisibility: 'private'
    extensionPricing: 'free'

- task: CopyFiles@2
  displayName: "Copy Files to: $(Build.ArtifactStagingDirectory)"
  inputs:
    Contents: "**/*.vsix"
    TargetFolder: "$(Build.ArtifactStagingDirectory)"

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: '${{ parameters.artifactName }}'
    publishLocation: 'Container'