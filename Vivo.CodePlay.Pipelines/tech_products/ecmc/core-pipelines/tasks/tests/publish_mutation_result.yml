parameters:
- name: displayName
  default: Publish Mutation Test Results
- name: mutationResultsFilesPattern
  default: "reports/mutation/mutation.html"
- name: searchFolder
  default: $(System.DefaultWorkingDirectory)

steps:
- task: PublishMutationReport@2
  displayName: 'Publish Mutation Test Report'
  continueOnError: true
  inputs:
    reportPattern: '${{ parameters.searchFolder }}/${{ parameters.mutationResultsFilesPattern }}'
    reportDisplayName: '${{ parameters.displayName }}'