parameters:
- name: environment
- name: namespace
- name: version
- name: cluster
- name: srcPath

steps:
- script: |
    if [ ! -f "catalog-info.yaml" ]; then
      echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
      exit 1
    fi

    COMPONENT_NAME="$(yq -r 'select(documentIndex == 0) | .metadata.name | select (.!=null)' catalog-info.yaml)"
    echo "##vso[task.setvariable variable=COMPONENT_NAME]${COMPONENT_NAME}"
    echo "##vso[task.setvariable variable=CATALOG_INFO_FILE_CONTENT]$(cat catalog-info.yaml)"
  displayName: Reading Catalog File
  workingDirectory: "${{ parameters.srcPath }}"
  continueOnError: false
  name: reading_catalog_file

- script: |
    set -e
 
    echo "##[debug] COMPONENT_NAME.........: ${COMPONENT_NAME}"
    echo "##[debug] VERSION.........: ${VERSION}"
    echo "##[debug] ENVIRONMENT.........: ${ENVIRONMENT}"
    echo "##[debug] NAMESPACE.........: ${NAMESPACE}"
    echo "##[debug] CATALOG_INFO_FILE_CONTENT.........: ${CATALOG_INFO_FILE_CONTENT}"
  displayName: Governance Data
  env:
    VERSION: "${{ parameters.version }}"
    NAMESPACE: "${{ parameters.namespace }}"
    ENVIRONMENT: "${{ parameters.environment }}"
    CLUSTER: "${{ parameters.cluster }}"
    COMPONENT_NAME: $(COMPONENT_NAME)
    CATALOG_INFO_FILE_CONTENT: $(CATALOG_INFO_FILE_CONTENT)

- task: VivoGovernance@1
  inputs:
    serverEndpoint: "governanceapi"
    breakglass: false
    operation: "deploy"
    component: $(COMPONENT_NAME)
    version: "${{ parameters.version }}"
    cluster: "${{ parameters.cluster }}"
    namespace: "${{ parameters.namespace }}"
    deployment: $(COMPONENT_NAME)
    environment: "${{ parameters.environment }}"
    catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
  displayName: Checking Consistency Through GApp
  continueOnError: true # devido falhas de timeout e redes mantem a entrega com warning
  condition: and(succeeded(), eq(lower(variables.GOVAPP_INTEGRATION_ENABLED), 'true'))
  name: checking_governance_consistency