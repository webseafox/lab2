parameters:
- name: overwrite
  default: true
- name: cleanTargetFolder
  default: true

steps:
- task: Bash@3
  name: t_copy_file
  displayName: 'Copy to Staging Directory with rsync'
  inputs:
    targetType: 'inline'
    script: |
      SOURCE_DIR="$(Build.SourcesDirectory)/"
      TARGET_DIR="$(Build.ArtifactStagingDirectory)/"

      if [ "${{ parameters.cleanTargetFolder }}" = "true" ]; then
        echo "Cleaning target directory..."
        rm -rf "$TARGET_DIR"
      fi

      echo "Starting rsync copy..."
      rsync -avhl --exclude='.git/' --exclude='?/' --exclude='*.log' "$SOURCE_DIR" "$TARGET_DIR"

      echo "Copy completed!"
  