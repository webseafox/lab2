parameters:
- name: downloadPath
  default: '$(System.ArtifactsDirectory)'
- name: parallelizationLimit
  default: 8
- name: cleanDestinationFolder
  default: false
- name: artifactName
  default: app

steps:
- task: DownloadBuildArtifacts@1
  displayName: 'Download Build Artifacts'
  inputs:
    artifactName: ${{ parameters.artifactName }}
    cleanDestinationFolder: ${{ parameters.cleanDestinationFolder }}
    extractTars: true
    parallelizationLimit: ${{ parameters.parallelizationLimit }}
    downloadPath: ${{ parameters.downloadPath }}