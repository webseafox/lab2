steps:
- bash: |
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    BLUE='\033[0;34m'
    YELLOW='\033[1;33m'
    BG_GREEN='\033[42;1;37m'
    
    printf "${YELLOW}=================================================================================================================================
    ${YELLOW}                                                       TELEMETRY
    ${YELLOW}=================================================================================================================================
    Esse step é responsável em enviar alguns dados de execução do pipeline um datalake para posteriomente ser proccesso.
    Em caso de falha deste step o fluxo de execução do pipeline não será interrompido.

    Para saber mais sobre esse step, entre em contato com time de DevOps Corporativo.
    "
    echo "AGENT_JOBNAME=$(Agent.JobName)"
    echo "AGENT_JOBSTATUS=$(Agent.JobStatus)"
    echo "AGENT_MACHINENAME=$(Agent.MachineName)"
    echo "BUILD_BUILDID=$(Build.BuildId)"
    echo "BUILD_BUILDURI=$(Build.BuildUri)"
    echo "BUILD_DEFINITIONNAME=$(Build.DefinitionName)"
    echo "Build_Reason=$(Build.Reason)"
    echo "Build_Repository_Name=$(Build.Repository.Name)"
    echo "Build_RequestedFor=$(Build.RequestedFor)"
    echo "Build_RequestedForEmail=$(Build.RequestedForEmail)"
    echo "Build_SourceBranch=$(Build.SourceBranch)"
    echo "Build_SourceBranchName=$(Build.SourceBranchName)"
    echo "SYSTEM_COLLECTIONURI=$(System.CollectionUri)"
    echo "SYSTEM_JOBATTEMPT=$(System.JobAttempt)"
    echo "SYSTEM_JOBDISPLAYNAME=$(System.JobDisplayName)"
    echo "SYSTEM_JOBNAME=$(System.JobName)"
    echo "SYSTEM_PHASEDISPLAYNAME=$(System.PhaseDisplayName)"
    echo "SYSTEM_PHASENAME=$(System.PhaseName)"
    echo "SYSTEM_STAGEDISPLAYNAME=$(System.StageDisplayName)"
    echo "SYSTEM_STAGENAME=$(System.StageName)"
    echo "SYSTEM_TEAMPROJECT=$(System.TeamProject)"
    echo "SYSTEM_HOSTTYPE=$(System.HostType)"
    echo "SYSTEM_DEFINITIONID=$(System.DefinitionId)"
    echo "SYSTEM_TIMELINEID=$(System.TimelineId)"

    printf "${YELLOW}================================================================================================================================="
  displayName: Telemetry
  # name: t_telemetry
  condition: always()
  continueOnError: true