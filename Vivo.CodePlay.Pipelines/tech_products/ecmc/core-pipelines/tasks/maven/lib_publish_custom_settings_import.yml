parameters:
  - name: mavenCustomSettingsContent
    type: string
  - name: condition
    type: object

steps:
- script: |
    echo "##[debug]Importing custom settings.xml for library deploy..."
    echo "##[debug]MAVEN_LIB_CUSTOM_SETTINGS_LOCATION.....: ${MAVEN_LIB_CUSTOM_SETTINGS_LOCATION}"

    base64 -d <<< "$(MAVEN_LIB_CUSTOM_SETTINGS_CONTENT)" > ${MAVEN_LIB_CUSTOM_SETTINGS_LOCATION}

    echo "##vso[task.setvariable variable=DEFAULT_MAVEN_SETTINGS]${MAVEN_LIB_CUSTOM_SETTINGS_LOCATION}"
  displayName: "Import custom settings.xml"
  condition: ${{ parameters.condition }}
  env:
    MAVEN_LIB_CUSTOM_SETTINGS_LOCATION: $(MAVEN_LIB_CUSTOM_SETTINGS_LOCATION)
    MAVEN_LIB_CUSTOM_SETTINGS_CONTENT: ${{ parameters.mavenCustomSettingsContent }}