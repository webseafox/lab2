parameters:
  - name: mavenSettingsContentOutputVarName
    type: string
    default: "MAVEN_LIB_CUSTOM_SETTINGS_CONTENT"
  - name: mavenIsSettingsCustomOutputVarName
    type: string
    default: "MAVEN_LIB_IS_SETTINGS_CUSTOM"

steps:
- template: /tech_products/ecmc/core-pipelines/tasks/maven/custom_settings_setup.yml
  parameters:
    mavenSettingsLocationOutputVarName: "MAVEN_SETTINGS_LOCATION"

- script: |
    echo "##[debug]Exporting custom settings.xml for library deploy..."
    echo "##[debug]MAVEN_SETTINGS_LOCATION.....: $(MAVEN_SETTINGS_LOCATION)"

    file_content=$(base64 -w 0 $(MAVEN_SETTINGS_LOCATION))

    echo "##vso[task.setvariable variable=$OUTPUT_SETTINGS_CONTENT_VARIABLE_NAME;isreadonly=true;isOutput=true]$file_content"
    echo "##vso[task.setvariable variable=$OUTPUT_IS_SETTINGS_CUSTOM_VARIABLE_NAME;isreadonly=true;isOutput=true]$MAVEN_IS_SETTINGS_CUSTOM"
  displayName: "Export custom settings.xml"
  name: custom_settings_export
  condition: eq(variables['MAVEN_IS_SETTINGS_CUSTOM'], 'true')
  env:
    OUTPUT_SETTINGS_CONTENT_VARIABLE_NAME: ${{ parameters.mavenSettingsContentOutputVarName }}
    OUTPUT_IS_SETTINGS_CUSTOM_VARIABLE_NAME: ${{ parameters.mavenIsSettingsCustomOutputVarName }}