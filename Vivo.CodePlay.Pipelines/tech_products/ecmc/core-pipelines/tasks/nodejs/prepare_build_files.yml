parameters:
- name: mutationTestsEnable
  type: boolean
  default: False

steps:
- script: |
    echo "##[section]Preparing build files before execute build command"
  displayName: 'Prepare Build Files'
  name: prepare_build_files_initial_checks
  
- ${{ if eq(parameters.mutationTestsEnable, True) }}:
  - task: FileTransform@2
    displayName: 'Update stryker config file'
    inputs:
      folderPath: $(System.DefaultWorkingDirectory)
      jsonTargetFiles: '$(DEFAULT_STRYKER_FILE_PATH)'
      fileType: 'json'
    name: stryker_file_transform