parameters:
  - name: artifactDir
    type: string
    default: "$(DEFAULT_WORKDIR_ARTIFACTS)"

steps:
- bash: |
    echo "##[debug]Publishing to npm registry..."

    export NPM_CONFIG_USERCONFIG=$(Agent.TempDirectory)/.npmrc
  
    npm publish --verbose --access=restricted
  displayName: "Publish to npm registry with new version"
  workingDirectory: "${{ parameters.artifactDir }}"
  env:
    CMD_PUBLISH_LIB: $(CMD_PUBLISH_LIB)
  condition: or(
              and(
                succeeded(),
                eq(variables.BUMP_VERSION_ENABLED, 'true'),
                in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')
              ),
              and(
                succeeded(), 
                eq(variables['Build.Reason'], 'Manual'),
                in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')
              )              
            )