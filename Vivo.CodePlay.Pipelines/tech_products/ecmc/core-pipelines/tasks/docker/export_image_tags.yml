parameters:
- name: manualRelease
  default: false
- name: namespace
  type: string
- name: appSystem
  type: string
- name: appName
  type: string
- name: appVersion
  type: string
- name: environment
  type: string

steps:
- script: |
    echo "##[debug] BUILD_SOURCEBRANCH............: ${BUILD_SOURCEBRANCH}"
    echo "##[debug] MANUAL_RELEASE................: ${MANUAL_RELEASE}"
    echo "##[debug] NAMESPACE.....................: ${NAMESPACE}"
    echo "##[debug] APP_SYSTEM....................: ${APP_SYSTEM}"
    echo "##[debug] APP_NAME......................: ${APP_NAME}"
    echo "##[debug] APP_VERSION...................: ${APP_VERSION}"
    echo "##[debug] DOCKER_DEFAULT_REGISTRY.......: ${DOCKER_DEFAULT_REGISTRY}"
    echo "##[debug] DOCKER_SERVICE_CONNECTION.....: ${DOCKER_SERVICE_CONNECTION}"
    echo "##[debug] IS_NEXUS_REGISTRY.............: ${IS_NEXUS_REGISTRY}"
    echo "##[debug] IS_ACR_REGISTRY...............: ${IS_ACR_REGISTRY}"
    echo "##[debug] ENVIRONMENT...................: ${ENVIRONMENT}"
    echo "##[debug] ACR_TAGGING_ENABLED...........: ${ACR_TAGGING_ENABLED}"

    echo "##[section] Define docker tags"
    SUFFIX=""
    if [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/develop" || "${BUILD_SOURCEBRANCH}" =~ ^"refs/heads/develop/" ]]; then
      PREFIX=dev
      BUILD_VERSION="${BUILD_SOURCEVERSION:0:7}"
      SUFFIX="-SNAPSHOT"
    elif [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/release" || "${BUILD_SOURCEBRANCH}" =~ ^"refs/heads/release/" ]]; then
      PREFIX=rc
      BUILD_VERSION="${BUILD_SOURCEVERSION:0:7}"
      SUFFIX="-RC"
    elif [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/esteira1" || "${BUILD_SOURCEBRANCH}" =~ ^"refs/heads/esteira1/" ]]; then
      PREFIX=rc
      BUILD_VERSION="${BUILD_SOURCEVERSION:0:7}"
      SUFFIX="-RC"  
    elif [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/master" || "${BUILD_SOURCEBRANCH}" == "refs/heads/main" || "${BUILD_SOURCEBRANCH}" =~ ^"refs/tags/production/" || "${MANUAL_RELEASE}" == "true" ]]; then
      BUILD_VERSION="${BUILD_SOURCEVERSION:0:7}"
      if [[ "${ENVIRONMENT}" == "dev" ]]; then
        PREFIX=dev
      elif [[ "${ENVIRONMENT}" == "esteira1" || "${ENVIRONMENT}" == "esteira2" || "${ENVIRONMENT}" == "preprod" || "${ENVIRONMENT}" == "prodlike" ]]; then
        PREFIX=rc
      else
        PREFIX=prd
      fi
    fi

    if [[ -z "${NAMESPACE}" ]]; then
      echo "##[debug] RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND.............: ${RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND}"
      if [[ "${RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND}" == "true" ]]; then
        echo "##vso[task.logissue type=error] Unable to find Governance App Acronym (techarch.governance-app.acronym) in catalog-info.yaml file. Contact DevOps Team for help."
        exit 1;
      else
        echo "##vso[task.logissue type=warning] Governance App Acronym property not found in catalog-info.yaml file. Setting APP_SYSTEM as NAMESPACE. Contact DevOps Team for help."
        NAMESPACE="${APP_SYSTEM}"
      fi
    fi

        
    IMAGE_NAME="${NAMESPACE}/${APP_NAME}"
    
    if [[ "${DEVELOPMENT_ENVIRONMENT_FLOW}" == "true" ]]; then
      echo "##[warning] Development flow"
      APP_VERSION=$(DOCKER_CMD_DEVELOPMENT_FLOW_VERSION)
    fi

    if [[ ! "${IS_ACR_REGISTRY}" =~ "(T|t)rue$" ]]; then
      BUILD_VERSION="${BUILD_VERSION}${SUFFIX}"
    fi

    if [[ "${BUMP_VERSION_ENABLED}" == "true" || "${BUMP_VERSION_ENABLED}" == True ]]; then
      IMAGE_TAG="${APP_VERSION}"
    else
      IMAGE_TAG="${APP_VERSION}-${BUILD_VERSION}"
    fi
    
    if [[ ${IS_ACR_REGISTRY} =~ (T|t)rue$ && ${ACR_TAGGING_ENABLED} =~ (T|t)rue$ ]]; then
      IMAGE_TAG="${PREFIX}-${IMAGE_TAG}"
    fi

    
    echo "##vso[task.setvariable variable=DOCKER_IMAGE_NAME;]${IMAGE_NAME}"
    echo "##vso[task.setvariable variable=DOCKER_IMAGE_TAG;]${IMAGE_TAG}"

    echo "##[debug] APP_VERSION...................: ${APP_VERSION}"
    echo "##[debug] DOCKER_IMAGE_NAME.............: ${IMAGE_NAME}"
    echo "##[debug] DOCKER_IMAGE_TAG..............: ${IMAGE_TAG}"
  displayName: Define Docker Tags
  env:
    MANUAL_RELEASE: ${{ parameters.manualRelease }}
    NAMESPACE: ${{ parameters.namespace }}
    APP_SYSTEM: ${{ parameters.appSystem }}
    APP_NAME: ${{ parameters.appName }}
    APP_VERSION: ${{ parameters.appVersion }}
    IS_NEXUS_REGISTRY: $(isNexusRegistry)
    IS_ACR_REGISTRY: $(isACRRegistry)
    DOCKER_SERVICE_CONNECTION: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)
    ENVIRONMENT: ${{ parameters.environment }}
    ACR_TAGGING_ENABLED: $[ eq(variables.ACR_TAGGING_ENABLED, true) ]