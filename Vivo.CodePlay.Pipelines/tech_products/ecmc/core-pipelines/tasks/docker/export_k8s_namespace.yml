parameters:
  - name: environment
  - name: variableNameOut
    default: "K8S_NAMESPACE"
  - name: dev_namespace_to_deploy
    default: ""

steps:
  - template: /tech_products/ecmc/core-pipelines/tasks/catalog_info/extract_variables.yml

  - script: |
      echo "##[debug] DEPLOY ENVIRONMENT NAME: ${DEPLOY_ENV_NAME}"
      echo "##[debug] DEVELOPMENT FLOW ENVIRONMENT IS: ${DEVELOPMENT_FLOW}"

      if [ "${DEPLOY_ENV_NAME}" = "development" ] || [ "${DEPLOY_ENV_NAME}" = "dev" ]; then
        NAMESPACE="$(K8S_NAMESPACE_DEV)"
      elif [ "${DEPLOY_ENV_NAME}" = "homologation" ]; then
        NAMESPACE="$(K8S_NAMESPACE_HML)"
      elif [ "${DEPLOY_ENV_NAME}" = "production" ]; then
        NAMESPACE="$(K8S_NAMESPACE_PRD)"
      elif [ "${DEPLOY_ENV_NAME}" = "esteira1" ]; then
        NAMESPACE="$(K8S_NAMESPACE_ESTEIRA1)"
      elif [ "${DEPLOY_ENV_NAME}" = "esteira2" ]; then
        NAMESPACE="$(K8S_NAMESPACE_ESTEIRA2)"
      elif [ "${DEPLOY_ENV_NAME}" = "preprod" ]; then
        NAMESPACE="$(K8S_NAMESPACE_PREPROD)"
      elif [ "${DEPLOY_ENV_NAME}" = "prodlike" ]; then
        NAMESPACE="$(K8S_NAMESPACE_PRODLIKE)"
      elif [ "${DEPLOY_ENV_NAME}" = "producao" ]; then
        NAMESPACE="$(K8S_NAMESPACE_PRODUCAO)"
      elif [ "${DEPLOY_ENV_NAME}" = "prod" ]; then
        NAMESPACE="uncm-prod"
      elif [ "${DEPLOY_ENV_NAME}" = "uncm-prod" ]; then
        NAMESPACE="uncm-prod"
      elif [ "$DEPLOY_ENV_NAME" = "devops" ]; then
        NAMESPACE="$(K8S_NAMESPACE_DEVOPS)"
      elif [ "$DEPLOY_ENV_NAME" = "$DEVELOPMENT_FLOW" ]; then
        NAMESPACE="${DEVELOPMENT_FLOW}"
      else
        echo "##[error] Não foi possível identificar o ambiente de deploy, entre em contato com admnistrador do pipeline! -- $DEPLOY_ENV_NAME --- $DEVELOPMENT_FLOW -- "
        exit 1;
      fi

      echo "##vso[task.setvariable variable=${VARIABLE_NAME};]$NAMESPACE"

      echo "##[debug] Deploy application NAMESPACE=[$NAMESPACE]"
    displayName: "Get deploy k8s namespace (${{parameters.environment}})"
    env:
      VARIABLE_NAME: ${{parameters.variableNameOut}}
      DEPLOY_ENV_NAME: ${{parameters.environment}}
      DEVELOPMENT_FLOW: ${{parameters.dev_namespace_to_deploy}}
