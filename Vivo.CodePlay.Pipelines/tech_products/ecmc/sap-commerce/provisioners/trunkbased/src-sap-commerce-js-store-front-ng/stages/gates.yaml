stages:
- stage: gate
  displayName: "Quality Gates"
  condition: and(succeeded(), eq(variables.SONAR_IS_ENABLED, true))
  dependsOn:
  - build_test
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: gates_development_flow
    displayName: "Check development flow"
    condition: and(
                succeeded(),
                eq(variables.DEVELOPMENT_ENVIRONMENT_FLOW, true),
                ne(variables.flowIsMain, True)
              )
    steps:
    - bash: echo "##[warning] Pulando validações de quality gates devido ser um deploy em ambiente de testes"
      displayName: "About stage"

  - job: sonarqube
    condition: and(
                succeeded(),
                eq(variables.SONAR_IS_ENABLED, true),
                ne(variables.DEVELOPMENT_ENVIRONMENT_FLOW, true)
              )
    displayName: Code Analysis
    variables:
      - name: APP_VERSION
        value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
    steps:
    - ${{ if or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), and(ne(variables.DEVELOPMENT_ENVIRONMENT_FLOW, true), startsWith(variables['Build.SourceBranch'], 'refs/pull/'))) }}:
      - template: /tech_products/ecmc/sap-commerce/tasks/catalog_info/extract_variables.yaml
        parameters:
          skipDownload: true
          workingDirectory: $(Build.SourcesDirectory)
      - template: /tech_products/ecmc/sap-commerce/task_groups/gates/sonarqube_scan.yaml
        parameters:
          projectKey: $(SONAR_PROJECT_KEY)
          workdirArtifacts: $(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)
           