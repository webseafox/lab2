parameters:
- name: incrementLevel
  default: patch

stages:
- stage: pipeline_init
  displayName: "Start pipeline"
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: initial_job
    workspace:
      clean: all
    displayName: "Running Init/Bump Version"
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true  
      - bash: |
          FILE=$(Build.SourcesDirectory)/catalog-info.yaml
          if [ ! -f "$FILE" ]; then
            echo "##[error] Unable to find catalog-info.yaml file $FILE"
            exit 1
          fi
        displayName: "Check for catalog-info.yml"
        name: init_bash
      
      - task: CopyFiles@2
        displayName: "Copy catalog-info.yaml to Staging Directory"
        inputs:
          TargetFolder: "$(Build.ArtifactStagingDirectory)"
          OverWrite: true
          CleanTargetFolder: true
          Contents: |
            $(Build.SourcesDirectory)/catalog-info.yaml

      - task: PublishPipelineArtifact@1
        displayName: "Publish catalog-info.yaml"
        inputs:
          artifactName: "catalog-info"
          targetPath: "$(Build.ArtifactStagingDirectory)"
    
      - ${{ if and(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
        - template: /tech_products/ecmc/sap-commerce/tasks/nodejs/npm_extract_version.yaml
          parameters:
            currentVersionVariableOut: CURRENT_VERSION

        - template: /tech_products/ecmc/sap-commerce/tasks/versioning/bump_version.yaml
          parameters:
            currentVersion: $(export_current_version.CURRENT_VERSION)
            newVersionVariableOut: NEW_VERSION
            incrementLevel: ${{ parameters.incrementLevel }}

        - template: /tech_products/ecmc/sap-commerce/tasks/nodejs/update_repo_version.yaml
          parameters:
            newVersion: $(SET_NEW_VERSION)
            condition: and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, true))
            commitNewVersion: true
            createGitTag: false
            workingDirectory: $(Build.SourcesDirectory)
            workingDirectoryCore: $(Build.SourcesDirectory)/$(CORE_PROJECT)
        