parameters:

- name: project_name
  type: string
- name: enable_devflow_validations
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/variables/load.yaml

resources:
  repositories:
    - repository: FortifyExclusion

      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
  - template: stages/init.yaml

  # VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  - ${{ if eq(parameters.enable_devflow_validations, True) }}:
    - template: stages/validate_standards_dev_flow.yaml

  - template: stages/build_test.yaml
    parameters:
      enable_devflow_validations: ${{ parameters.enable_devflow_validations }}

  # QUALITY GATE
  - template: stages/gates.yaml

  # SECURITY
  - template: stages/security.yaml
    parameters:
     fortifyExclusionRepository: FortifyExclusion
