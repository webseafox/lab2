parameters:
- name: database_update_mode
  type: string
  default: 'NONE' # "UPDATE", "INITIALIZE"
- name: environment_code
  type: string
- name: deploy_strategy
  type: string
  default: 'RECREATE' #ROLLING_UPDATE
- name: project_name
  type: string
  default: ''
- name: branch_backend
  type: string
  default: ''
- name: branch_frontend
  type: string
  default: ''

stages:
  - stage: deploy
    dependsOn:
      - build
      - pipeline_init
    displayName: 'Deploy'
    pool:
      name: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: check_environment_availability
        workspace:
          clean: all
        displayName: 'Environment validation'
        steps:
          - template: /tech_products/ecmc/sap-commerce/tasks/security/get_sap_tu_token.yaml
            parameters:
              displayName: 'Get SAP TU token (environment validation)'
              exportAsOutput: true
              stepName: 'get_sap_tu_token'
          - checkout: none
          - script: |
              ACCESS_TOKEN="${SAP_TU_ACCESS_TOKEN}"
              if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
                echo "##[error]Access token não disponível para o job"
                exit 1
              fi
              echo "##[section]Access token reutilizado (valor oculto)"

              echo "DEPLOY STRATEGY: ......... ${{ parameters.deploy_strategy }}"
              echo "DATABASE UPDATE MODE: .... ${{ parameters.database_update_mode }}"
              echo "ENVIRONMENT CODE: ........ $ENVIRONMENT_CODE"
              echo "BUILD CODE: .............. $BUILD_CODE"

              echo "##[section]Verificando disponibilidade do ambiente e se existe algum deploy em execução no ambiente ${ENVIRONMENT_CODE}"

              API_URL_ENVIROMENTS=$(echo "$API_URL_ENVIROMENTS" | sed "s/<SUBSCRIPTION_CODE>/$SUBSCRIPTION_CODE/")
              echo "##[command]Requisição para $API_URL_ENVIROMENTS"

              HTTP_CODE_RESPONSE=$(curl --max-time $CURL_HTTP_TIMEOUT -o $SAP_API_RESPONSE_FILE -s -w "%{http_code}"  -H "x-approuter-authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json" --compressed "$API_URL_ENVIROMENTS")

              if [[ "$HTTP_CODE_RESPONSE" != "200" ]];then
                echo "##[error]Não foi possível verificar a disponibilidade do ambiente"
                exit 1
              fi

              RESPONSE_BODY=$(cat $SAP_API_RESPONSE_FILE && rm $SAP_API_RESPONSE_FILE)
              STATUS_ENVIROMENT=$(echo $RESPONSE_BODY | jq -r '.value[] | select(.name  == "$ENVIRONMENT_CODE")')
              STATUS_VALUE=$(echo $STATUS_ENVIROMENT | jq -r '.status')
              DEPLOYMENT_STATUS_VALUE=$(echo $STATUS_ENVIROMENT | jq -r '.deploymentStatus')

              if [ "$STATUS_VALUE" != "AVAILABLE" ] && [ "$DEPLOYMENT_STATUS_VALUE" == "DEPLOYING" ];then
                echo "##[error]Ambiente $ENVIRONMENT_CODE indisponível ou deploy sendo realizado no momento"
                exit 1
              fi

              echo "##[section]Status: $STATUS_VALUE"
              echo "##[section]Deployment status: $DEPLOYMENT_STATUS_VALUE"
            displayName: 'Verify availability'
            name: checking_environment_availability_job_step
            env:
              ENVIRONMENT_CODE: ${{ parameters.environment_code }}
              SAP_TU_ACCESS_TOKEN: $(SAP_TU_ACCESS_TOKEN)

      - job: start_deploy
        dependsOn:
          - check_environment_availability
        displayName: 'Create deploy'
        workspace:
          clean: all
        variables:
          - name: BUILD_CODE
            value: $[ stageDependencies.build.create_build.outputs['send_data_to_build_job_step.BUILD_CODE'] ]
          - name: SAP_TU_ACCESS_TOKEN
            value: $[ dependencies.check_environment_availability.outputs['get_sap_tu_token.SAP_TU_ACCESS_TOKEN'] ]
          - name: SAP_TU_TOKEN_EXPIRATION
            value: $[ dependencies.check_environment_availability.outputs['get_sap_tu_token.SAP_TU_TOKEN_EXPIRATION'] ]
        steps:
          - checkout: none
          - bash: |
              echo "##[section]Repassando token do job anterior"
              echo "##vso[task.setvariable variable=SAP_TU_ACCESS_TOKEN;issecret=true;isOutput=true]${SAP_TU_ACCESS_TOKEN}"
              echo "##vso[task.setvariable variable=SAP_TU_TOKEN_EXPIRATION;isOutput=true]${SAP_TU_TOKEN_EXPIRATION}"
            displayName: 'Re-export token'
            name: 'get_sap_tu_token'
            env:
              SAP_TU_ACCESS_TOKEN: $(SAP_TU_ACCESS_TOKEN)
              SAP_TU_TOKEN_EXPIRATION: $(SAP_TU_TOKEN_EXPIRATION)
          - bash: |
              ACCESS_TOKEN="${SAP_TU_ACCESS_TOKEN}"
              if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
                echo "##[error]Access token não disponível para o job"
                echo "##vso[task.setvariable variable=BUILD_HTTP_ERROR]TRUE"
                echo "##vso[task.setvariable variable=BUILD_ERROR_NUMBER_OR_MESSAGE]TOKEN_UNAVAILABLE"
                exit 1
              fi
              echo "##[section]Access token reutilizado (valor oculto)"

              echo "##[section]Iniciando Deploy"
              echo "##[section]BUILD_CODE $BUILD_CODE"

              API_URL_DEPLOYMENTS=$(echo "$API_URL_DEPLOYMENTS" | sed "s/<SUBSCRIPTION_CODE>/$SUBSCRIPTION_CODE/")
              echo "##[command]Requisição para $API_URL_DEPLOYMENTS"
              
              echo "DEPLOY STRATEGY: ......... $DEPLOY_STRATEGY"
              echo "DATABASE UPDATE MODE: .... ${{ parameters.database_update_mode }}"
              echo "ENVIRONMENT CODE: ........ $ENVIRONMENT_CODE"
              echo "BUILD CODE: .............. $BUILD_CODE"

              BODY="{\"buildCode\": \"$BUILD_CODE\", \"databaseUpdateMode\": \"${{ parameters.database_update_mode }}\", \"environmentCode\": \"$ENVIRONMENT_CODE\", \"strategy\": \"$DEPLOY_STRATEGY\"}"
              for i in 1 2 3
              do
                echo "##[section]Tentativa $i de 3"
                HTTP_CODE_RESPONSE=$(curl --max-time $CURL_HTTP_TIMEOUT -s -o $SAP_API_RESPONSE_FILE -w "%{http_code}" -X POST -H "x-approuter-authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json" --compressed "$API_URL_DEPLOYMENTS" --data "$BODY")
                echo $HTTP_CODE_RESPONSE
                RESPONSE_FILE=$(cat $SAP_API_RESPONSE_FILE)
                echo $RESPONSE_FILE

                if [[ "$HTTP_CODE_RESPONSE" == "201" ]];then
                  RESPONSE_BODY=$(cat $SAP_API_RESPONSE_FILE && rm $SAP_API_RESPONSE_FILE) 
                  echo "##[section]Resposta da requisição $RESPONSE_BODY"
                
                  DEPLOY_CODE=$(echo $RESPONSE_BODY | jq -r '.code')
                  echo "##vso[task.setvariable variable=DEPLOY_CODE;isOutput=true]$DEPLOY_CODE"
                  echo "##[section]Deploy iniciado com buildCode $BUILD_CODE (deploy code $DEPLOY_CODE)"
                  exit 0
                else
                  if [[ $i == 3 ]];then
                    echo "##[error]Não foi possível iniciar o deploy"
                    echo "##[error]Erro $HTTP_CODE_RESPONSE"
                    echo "##vso[task.setvariable variable=BUILD_HTTP_ERROR]TRUE"
                    CODE=$(echo $RESPONSE_BODY | jq -r '.' )
                    echo "##vso[task.setvariable variable=BUILD_ERROR_NUMBER_OR_MESSAGE]$HTTP_CODE_RESPONSE<br><pre><code><br><div>$CODE</div></code></pre>"
                    exit 1
                  fi
                fi
              done

              echo "##[error]Não foi possível iniciar o deploy"
              echo "##[error]$RESPONSE_BODY"
              exit 1
            displayName: 'Send data to create deploy'
            name: start_deploy_job_step
            env:
              ENVIRONMENT_CODE: ${{ parameters.environment_code }}
              DEPLOY_STRATEGY: ${{ parameters.deploy_strategy }}
              SAP_TU_ACCESS_TOKEN: $(SAP_TU_ACCESS_TOKEN)

          - template: /tech_products/ecmc/sap-commerce/tasks/messages/create_work_item.yaml
            parameters:
              project_name: ${{ parameters.project_name }}
              environment_code: ${{ parameters.environment_code }}
              database_update_mode: ${{ parameters.database_update_mode }}
              deploy_strategy: ${{ parameters.deploy_strategy }}
              branch_frontend: ${{ parameters.branch_frontend }}
              branch_backend: ${{ parameters.branch_backend }}
              pipeline_status: 'HTTP_ERROR'
              work_item_title: 'Deploy Sap Commerce cloud - Http Error - E-commerce B2C'
              description_details: $(BUILD_ERROR_NUMBER_OR_MESSAGE)
              condition: and(eq(variables.BUILD_HTTP_ERROR, 'TRUE'), eq(variables.CREATE_WORK_ITEM, 'true'))

      - job: watch_deploy
        dependsOn:
          - start_deploy
        workspace:
          clean: all
        displayName: 'Waiting/watching deploy'
        variables:
          - name: DEPLOY_CODE
            value: $[ dependencies.start_deploy.outputs['start_deploy_job_step.DEPLOY_CODE'] ]
          - name: NEW_VERSION
            value: $[ stageDependencies.pipeline_init.first_steps.outputs['set_build_version.NEW_VERSION'] ]
          - name: IS_DEV_BRANCH
            value: $[ stageDependencies.pipeline_init.first_steps.outputs['set_build_version.IS_DEV_BRANCH'] ]
          - name: SAP_TU_ACCESS_TOKEN
            value: $[ dependencies.start_deploy.outputs['get_sap_tu_token.SAP_TU_ACCESS_TOKEN'] ]
          - name: SAP_TU_TOKEN_EXPIRATION
            value: $[ dependencies.start_deploy.outputs['get_sap_tu_token.SAP_TU_TOKEN_EXPIRATION'] ]
        steps:
          - checkout: none
          - bash: |
              function progress_bar {
                percent_total=${2}
                echo "##vso[task.setprogress value=$percent_total;]Progress"
                let _progress=(${2}*100/100)
                let _done=(${_progress}*5)/10
                let _left=50-$_done
                _fill=$(printf "%${_done}s")
                _empty=$(printf "%${_left}s")

                printf "\r##[command]Status:$1 - Progresso : [${_fill// /#}${_empty// /-}] ${_progress}%%"
                echo -e "\n"
              }
              ACCESS_TOKEN="${SAP_TU_ACCESS_TOKEN}"
              TOKEN_EXPIRATION="${SAP_TU_TOKEN_EXPIRATION:-0}"
              TOKEN_REFRESH_BUFFER=120

              function renew_access_token {
                echo "##[section]Renovando access token (client credentials)"
                TOKEN_PAYLOAD="grant_type=client_credentials&client_id=${SAP_TU_CLIENT_ID}&client_secret=${SAP_TU_CLIENT_SECRET}&resource=${SAP_TU_RESOURCE}"
                SAP_TOKEN_RESPONSE=$(curl -s -X POST "$SAP_TU_TOKEN_ENDPOINT" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "$TOKEN_PAYLOAD")

                ACCESS_TOKEN=$(echo "$SAP_TOKEN_RESPONSE" | jq -r '.access_token // empty')
                EXPIRES_IN=$(echo "$SAP_TOKEN_RESPONSE" | jq -r '.expires_in // empty')

                if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
                  echo "##[error]Falha ao renovar access token do Technical User"
                  echo "##[debug]Resposta bruta do endpoint: $SAP_TOKEN_RESPONSE"
                  echo "##vso[task.setvariable variable=BUILD_ERROR]TRUE"
                  echo "##vso[task.setvariable variable=SAP_ERROR_TYPE]HTTP_ERROR"
                  echo "##vso[task.setvariable variable=BUILD_ERROR_NUMBER_OR_MESSAGE]TOKEN_GENERATION_FAILED"
                  exit 1
                fi

                if [ -z "$EXPIRES_IN" ] || [ "$EXPIRES_IN" == "null" ]; then
                  EXPIRES_IN=3600
                fi

                NOW_TS=$(date +%s)
                TOKEN_EXPIRATION=$((NOW_TS + EXPIRES_IN - TOKEN_REFRESH_BUFFER))
                if [ $TOKEN_EXPIRATION -le $NOW_TS ]; then
                  TOKEN_EXPIRATION=$((NOW_TS + EXPIRES_IN))
                fi

                echo "##[section]Token renovado com sucesso (valor oculto)"
                echo "##vso[task.setvariable variable=SAP_TU_ACCESS_TOKEN;issecret=true]$ACCESS_TOKEN"
                echo "##vso[task.setvariable variable=SAP_TU_TOKEN_EXPIRATION]$TOKEN_EXPIRATION"
              }

              if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
                renew_access_token
              fi

              function ensure_token {
                local now_ts=$(date +%s)
                if [ -z "$TOKEN_EXPIRATION" ] || [ $now_ts -ge $TOKEN_EXPIRATION ]; then
                  renew_access_token
                fi
              }

              ensure_token
              echo "##[section]Aguardando Deploy"
              API_URL_DEPLOYMENTS_PROGRESS=$(echo "$API_URL_DEPLOYMENTS_PROGRESS" | sed "s/<SUBSCRIPTION_CODE>/$SUBSCRIPTION_CODE/")
              API_URL_DEPLOYMENTS_PROGRESS=$(echo "$API_URL_DEPLOYMENTS_PROGRESS" | sed "s/<DEPLOY_CODE>/$DEPLOY_CODE/")
              echo "##[command]Requisição para $API_URL_DEPLOYMENTS_PROGRESS"

              COUNT_FAILS=0
              LAST_PERCENT=0
              while (true)
              do
                ensure_token
                HTTP_CODE_RESPONSE=$(curl --max-time $CURL_HTTP_TIMEOUT  -o $SAP_API_RESPONSE_FILE -s  -w "%{http_code}" -H "x-approuter-authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json" --compressed "$API_URL_DEPLOYMENTS_PROGRESS")
                
                if [[ "$HTTP_CODE_RESPONSE" != "200" ]];then
                  ((COUNT_FAILS++))
                  if [[ $COUNT_FAILS == 10 ]]; then
                    echo "##[error]Não foi possível retornar os dados do deploy"
                    exit 1
                  fi
                  echo "##[warning]Não foi possível retornar os dados do deploy (tentativa $COUNT_FAILS). Será realizada uma nova tentativa em alguns instantes"
                  sleep 180
                  continue
                fi

                if [[ "$HTTP_CODE_RESPONSE" == "200" ]];then
                  RESPONSE_BODY=$(cat $SAP_API_RESPONSE_FILE && rm $SAP_API_RESPONSE_FILE)
                  
                  DEPLOYMENT_STATUS=$(echo $RESPONSE_BODY | jq -r '.deploymentStatus')
                  DEPLOYMENT_PERCENTAGE=$(echo $RESPONSE_BODY | jq -r '.percentage')                
                  
                  if [[ "$DEPLOYMENT_STATUS" == "UNKNOWN" ]];then
                    echo -e "##[command]Status ainda não definido, aguarde ...\n"
                    sleep 180
                  fi

                  if [[ "$DEPLOYMENT_STATUS" == "DEPLOYING" ]];then
                    if [ "$DEPLOYMENT_PERCENTAGE" == "100" ]; then
                      sleep 60
                      continue
                    fi
                    if [ "$LAST_PERCENT" != "$DEPLOYMENT_PERCENTAGE" ]; then
                      progress_bar $DEPLOYMENT_STATUS $DEPLOYMENT_PERCENTAGE
                    fi
                  fi

                  if [[ "$DEPLOYMENT_STATUS" == "DEPLOYED" ]];then
                    progress_bar $DEPLOYMENT_STATUS $DEPLOYMENT_PERCENTAGE
                    break
                  fi

                  if [[ "$DEPLOYMENT_STATUS" == "FAIL" ]];then
                    DEPLOYMENT_ERROR_MESSAGE=$(echo $RESPONSE_BODY | jq -r '.errorMessage')
                    echo "##[error]$DEPLOYMENT_ERROR_MESSAGE"
                    echo "##[error]O deploy não foi concluído"
                    echo "##vso[task.setvariable variable=SAP_ERROR_TYPE]SAP_ERROR"
                    echo "##vso[task.setvariable variable=BUILD_ERROR_NUMBER_OR_MESSAGE]$DEPLOYMENT_ERROR_MESSAGE"
                    echo "##vso[task.setvariable variable=BUILD_ERROR]TRUE"
                    exit 1
                  fi
                  LAST_PERCENT=$DEPLOYMENT_PERCENTAGE
                  sleep 180
                fi
                sleep 180
              done
            displayName: 'Wait/Watch deploy'
            env:
              SAP_TU_CLIENT_ID: $(SAP_TU_CLIENT_ID)
              SAP_TU_CLIENT_SECRET: $(SAP_TU_CLIENT_SECRET)
              SAP_TU_TOKEN_ENDPOINT: $(SAP_TU_TOKEN_ENDPOINT)
              SAP_TU_RESOURCE: $(SAP_TU_RESOURCE)
              SAP_TU_ACCESS_TOKEN: $(SAP_TU_ACCESS_TOKEN)
              SAP_TU_TOKEN_EXPIRATION: $(SAP_TU_TOKEN_EXPIRATION)

          - template: /tech_products/ecmc/sap-commerce/tasks/messages/create_work_item.yaml
            parameters:
              project_name: ${{ parameters.project_name }}
              environment_code: ${{ parameters.environment_code }}
              database_update_mode: ${{ parameters.database_update_mode }}
              deploy_strategy: ${{ parameters.deploy_strategy }}
              branch_frontend: ${{ parameters.branch_frontend }}
              branch_backend: ${{ parameters.branch_backend }}
              pipeline_status: '$(SAP_ERROR_TYPE)'
              work_item_title: 'Deploy Sap Commerce cloud - Http/Sap Error - E-commerce B2C'
              display_name: 'Create work item (http/Sap error)'
              description_details: $(BUILD_ERROR_NUMBER_OR_MESSAGE)
              condition: and(eq(variables.BUILD_ERROR, 'TRUE'), eq(variables.CREATE_WORK_ITEM, 'true'))

