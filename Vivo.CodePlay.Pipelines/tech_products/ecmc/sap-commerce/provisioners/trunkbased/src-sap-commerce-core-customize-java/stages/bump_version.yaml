parameters:
  - name: enable_devflow_validations
    type: boolean
    default: False

stages:
- stage: bump_version
  displayName: "Bump Version"
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
    # demands: Agent.Version -gtVersion 2.210.1
  dependsOn:
    - pipeline_init
    - ${{ if eq(parameters.enable_devflow_validations, True) }}:
      - repo_validations
  jobs:
    - job: "bump_version"
      workspace:
        clean: all
      displayName: "Bump Version"
      steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
      - bash: |
          cd $(Build.SourcesDirectory)

          set -e
          git fetch origin $(PROJECT_SOURCE_BRANCH)
          git checkout $(PROJECT_SOURCE_BRANCH)
          git pull origin $(PROJECT_SOURCE_BRANCH)

          cat VERSION
          CURRENT_VERSION=$(cat VERSION)
          echo "VERSION: $CURRENT_VERSION"
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          PATCH_VERSION=$((${VERSION_PARTS[2]} + 1))
          SET_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${PATCH_VERSION}"

          echo -n $SET_VERSION > VERSION
          echo "Nova versão: $SET_VERSION"
          echo "##vso[task.setvariable variable=NEW_VERSION;isoutput=true]$SET_VERSION"
          echo -n $SET_VERSION > VERSION

          git config user.email "azure-pipelines@telefonicati.onmicrosoft.com"
          git config user.name "Azure Pipelines"
          git add VERSION && git commit -m "[CI SKIP] Change VERSION file: $SET_VERSION" && git push origin HEAD:$(PROJECT_SOURCE_BRANCH)
          GIT_CURRENT_SHA=$(git rev-parse HEAD)
          echo "Meu novo SHA: $GIT_CURRENT_SHA"

          echo "##vso[task.setvariable variable=NEW_GIT_SHA;isoutput=true]$GIT_CURRENT_SHA"
        name: BumpVersion
        displayName: 'Bump Version'
