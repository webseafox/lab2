parameters:
- name: environment_for_deploy
  type: string
- name: blue_green
  type: string

jobs:
- job: deploy_blue_green_rejected
  displayName: "${{ parameters.environment_for_deploy }} - Deploy Blue/Green Rejected status"
  dependsOn:
  - task_manual
  - acompanhar_deploy_job
  variables:
  - name: DEPLOY_CODE
    value: $[ dependencies.acompanhar_deploy_job.outputs['acompanhar_deploy_bash.DEPLOY_CODE'] ]
  - name: SAP_TU_ACCESS_TOKEN
    value: $[ dependencies.acompanhar_deploy_job.outputs['reexport_token.SAP_TU_ACCESS_TOKEN'] ]
  - name: SAP_TU_TOKEN_EXPIRATION
    value: $[ dependencies.acompanhar_deploy_job.outputs['reexport_token.SAP_TU_TOKEN_EXPIRATION'] ]
  condition: and(eq('${{ parameters.blue_green }}', 'Sim'), ne(dependencies.task_manual.result,'Succeeded'))
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  steps:
  - checkout: none
  - bash: |
      ACCESS_TOKEN="${SAP_TU_ACCESS_TOKEN}"
      if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
        echo "##[error]Access token do Technical User indisponível"
        exit 1
      fi
      echo "[section]Access token reutilizado (valor oculto)"
      TZ='America/Sao_Paulo'
      DATE_SAP=$(date +"%d-%m-%Y %H:%M:%S")
      echo "O manualValidation foi negado"
      TEST=$(curl -s --compressed-w -X POST $URL_SAP_DEPLOY$DEPLOY_CODE/decisions \
              --max-time $CURL_HTTP_TIMEOUT \
              -H "x-approuter-authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"decision\": \"REJECT\", \"reason\": \"Deploy rejeitado via pipeline\"}"
            )
      echo "##[error] ❌❌ DEPLOY GREEN FOI RECUSADO, MANTENDO DEPLOY BLUE NO AMBIENTE $ENVIRONMENT_FOR_DEPLOY ❌❌"
    displayName: "Deploy Blue/Green rejected"
    env:
      SAP_TU_ACCESS_TOKEN: $(SAP_TU_ACCESS_TOKEN)
      ENVIRONMENT_FOR_DEPLOY: ${{ parameters.environment_for_deploy }}
