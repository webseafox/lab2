parameters:
- name: downloadDirectory
  default: '$(System.DefaultWorkingDirectory)'
- name: feedsToUse
  default: 'internal'
- name: vstsFeed
  default: '3d53bc62-8749-4931-ae46-a443b73bc87a'
- name: vstsFeedPackage
  default: 'dvps-cxcomm'
- name: vstsFeedPackageTelco
  default: 'dvps-cxtelpack'
- name: isUpgradeSap
  type: boolean
  default: False

steps:
- bash: |
    BRANCH_NAME=$(echo $(Build.SourceBranch) | sed 's/refs\/heads\///' | sed 's/stage\///')

    if [[ "$(Build.Reason)" == "PullRequest" ]]; then
      BRANCH_NAME=$(echo $(System.PullRequest.TargetBranch) | sed 's/refs\/heads\///' | sed 's/stage\///')
    fi

    BRANCH_NAME=$(echo "${BRANCH_NAME}" | sed 's/refs\/heads\///' | sed 's/stage\///')
    BRANCH_NAME=$(echo ${BRANCH_NAME} | tr '[:lower:]' '[:upper:]')
    SET_ACCELERATOR_VERSION="HYBRIS_ACCELERATOR_VERSION_${BRANCH_NAME}"
    SET_TELCO_VERSION="HYBRIS_TELCO_VERSION_${BRANCH_NAME}"

    # Se for pipeline (branch) usa a versão setada HYBRIS_ACCELERATOR_VERSION
    VALID_BRANCH=(echo "(echo "{BRANCH_NAME}" | grep -E '[/_-]' && ! echo "${BRANCH_NAME}" | grep -E '(stage/|project/)')")

    if [[ "${VALID_BRANCH}" ]]; then
      SET_ACCELERATOR_VERSION="HYBRIS_ACCELERATOR_VERSION"
      SET_TELCO_VERSION="HYBRIS_TELCO_VERSION"
    fi

    if [[ "${{ lower(parameters.isUpgradeSap) }}" == "true" ]]; then
      SET_ACCELERATOR_VERSION="HYBRIS_ACCELERATOR_VERSION_UPGRADE"
      SET_TELCO_VERSION="HYBRIS_TELCO_VERSION_UPGRADE"
    fi 

    ACCELERATOR_VERSION=$(eval echo "\$$SET_ACCELERATOR_VERSION")
    TELCO_VERSION=$(eval echo "\$$SET_TELCO_VERSION")

    echo "##[section]####### Utilizando o Accelerator na versão ${ACCELERATOR_VERSION} (sufixo ${BRANCH_NAME}) #######"
    echo "##[section]####### Utilizando o Telco na versão ${TELCO_VERSION} (sufixo ${BRANCH_NAME}) #######"

    echo "##vso[task.setvariable variable=ACCELERATOR_VERSION]${ACCELERATOR_VERSION}"
    echo "##vso[task.setvariable variable=TELCO_VERSION]${TELCO_VERSION}"
  displayName: 'Set HYBRIS_ACCELERATOR_VERSION'

- task: UniversalPackages@0
  inputs:
    command: 'download'
    downloadDirectory: ${{ parameters.downloadDirectory }}
    feedsToUse: ${{ parameters.feedsToUse }}
    vstsFeed: ${{ parameters.vstsFeed }}
    vstsFeedPackage: ${{ parameters.vstsFeedPackage }}
    vstsPackageVersion: $(ACCELERATOR_VERSION)
  displayName: 'Download: CXCOMM'
  env:
    https_proxy: $(PROXY_NSKP_HTTPS)
    http_proxy: $(PROXY_NSKP_HTTP)
    no_proxy: $(PROXY_NSKP_NO_PROXY)

- task: UniversalPackages@0
  inputs:
    command: 'download'
    downloadDirectory: ${{ parameters.downloadDirectory }}
    feedsToUse: ${{ parameters.feedsToUse }}
    vstsFeed: ${{ parameters.vstsFeed }}
    vstsFeedPackage: ${{ parameters.vstsFeedPackageTelco }}
    vstsPackageVersion: $(TELCO_VERSION)
  displayName: 'Download: CXTELPACK'
  env:
    https_proxy: $(PROXY_NSKP_HTTPS)
    http_proxy: $(PROXY_NSKP_HTTP)
    no_proxy: $(PROXY_NSKP_NO_PROXY)
