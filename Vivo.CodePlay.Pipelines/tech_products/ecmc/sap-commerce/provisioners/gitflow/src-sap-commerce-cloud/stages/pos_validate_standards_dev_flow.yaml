stages:
  - stage: repo_finalize_validations
    dependsOn:
      - pipeline_init
      - build
      - deploy

    displayName: 'Finalize project validation'
    pool:
      name: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: 'project_validations'
        workspace:
          clean: all
        displayName: 'Finalize'
        variables:
          - name: HASH_BACKEND
            value: $[ stageDependencies.pipeline_init.get_hash_commit.outputs['task_get_hash_commit.HASH_BACKEND'] ]
          - name: HASH_FRONTEND
            value: $[ stageDependencies.pipeline_init.get_hash_commit.outputs['task_get_hash_commit.HASH_FRONTEND'] ]
          - name: NEW_VERSION
            value: $[ stageDependencies.pipeline_init.first_steps.outputs['set_build_version.NEW_VERSION'] ]
          - name: NEW_VERSION_CLEAN
            value: $[ stageDependencies.pipeline_init.first_steps.outputs['set_build_version.NEW_VERSION_CLEAN'] ]
          - name: IS_DEV_BRANCH
            value: $[ stageDependencies.pipeline_init.first_steps.outputs['set_build_version.IS_DEV_BRANCH'] ]
        condition: ne(variables.IS_DEV_BRANCH, True)
        steps:
          - checkout: CorePipelinesScripts
            fetchDepth: 1
            clean: true
            displayName: 'Get Python Scripts'
            condition: and(
                        succeeded(),
                        eq(variables.DEVFLOW_PUBLISH_CONFLUENCE, true)
                      )

          - checkout: self
            persistCredentials: true
            fetchDepth: 1
            clean: true
            displayName: 'Checkout sap-commerce-cloud'
            condition: and(
                        succeeded(),
                        eq(variables.DEVFLOW_PUBLISH_CONFLUENCE, true)
                      )

          - checkout: CoreCustomize
            persistCredentials: true
            fetchDepth: 1
            clean: true
            displayName: 'Checkout core-customize'

          - bash: |
              SOURCE_BRANCH=$(echo "$(Build.SourceBranch)" | sed  's/refs\/heads\///')
              TAG="${SOURCE_BRANCH}/$(NEW_VERSION_CLEAN)"
              echo "##[debug]Realizando checkout na branch $SOURCE_BRANCH"

              #CD BACKEND
              echo "##[section]Enter in directory src-sap-commerce-core-customize-java"
              cd $(Build.SourcesDirectory)/src-sap-commerce-core-customize-java

              git config user.email "azure-pipelines@telefonicati.onmicrosoft.com"
              git config user.name "Azure DevOps"

              git fetch origin $SOURCE_BRANCH

              git pull origin $SOURCE_BRANCH

              echo "##[debug]Git checkout $SOURCE_BRANCH"
              git checkout $SOURCE_BRANCH

              echo "##[debug]Git pull origin $SOURCE_BRANCH"
              git pull origin $SOURCE_BRANCH

              echo "##[debug]Git reset to hash $HASH_BACKEND"
              git reset --hard $HASH_BACKEND

              echo "##[debug]Git create tag $TAG with same build name"
              git tag $TAG

              echo "##[debug]Git push tag refs/tags/$TAG"
              git push origin refs/tags/$TAG
            displayName: 'Tagging backend build name $(NEW_VERSION_CLEAN)'
            condition: succeeded()

          - checkout: JsStoreFront
            persistCredentials: true
            fetchDepth: 1
            clean: true
            displayName: 'Checkout js-storefront'

          - bash: |
              SOURCE_BRANCH=$(echo "$(Build.SourceBranch)" | sed  's/refs\/heads\///')
              TAG="${SOURCE_BRANCH}/$(NEW_VERSION_CLEAN)"
              echo "##[debug]Realizando checkout na branch $SOURCE_BRANCH"

              #CD FRONTEND_PROJECT_DIR
              echo "##[debug]Enter in directory src-sap-commerce-js-store-front-ng"
              cd $(Build.SourcesDirectory)/src-sap-commerce-js-store-front-ng

              git config user.email "azure-pipelines@telefonicati.onmicrosoft.com"
              git config user.name "Azure DevOps"
              git fetch origin $SOURCE_BRANCH
              git pull origin $SOURCE_BRANCH

              echo "##[debug]Git checkout $SOURCE_BRANCH"
              git checkout $SOURCE_BRANCH

              echo "##[debug]Git pull origin $SOURCE_BRANCH"
              git pull origin $SOURCE_BRANCH

              echo "##[debug]Git reset to hash $HASH_FRONTEND"
              git reset --hard $HASH_FRONTEND

              echo "##[debug]Git create tag $TAG with same build name"
              git tag $TAG

              echo "##[debug]Git push tag refs/tags/$TAG"
              git push origin refs/tags/$TAG

            displayName: 'Tagging frontend build name $(NEW_VERSION_CLEAN)'
            condition: succeeded()

          - template: /tech_products/ecmc/sap-commerce/tasks/python/pip_auth.yaml
            parameters:
              condition: and(succeeded(), eq(variables.DEVFLOW_PUBLISH_CONFLUENCE, true))

          - bash: |
              echo "##[command]Skipando de envio dos dados do Pull Request a Wiki do Confluence"
              echo "##[command]Variável DEVFLOW_PUBLISH_CONFLUENCE não está com valor = true ou a branch é main/master"
            displayName: 'Send to Wiki Enabled/Disabled'
            condition: and(succeeded(), or(ne(variables.DEVFLOW_PUBLISH_CONFLUENCE, true), ne(variables.flowIsMain, True)))

          - bash: |
              verify_and_stop_if_error() {
                if [[ $1 != 0 ]]; then
                  exit 1
                fi
              }
              cd $(Build.SourcesDirectory)/$(Build.Repository.Name)
              SCRIPT_PATH=$(Agent.TempDirectory)/devflow_finalize_validations.py
              SCRIPT_PATH_UPDATE_IDS=$(Agent.TempDirectory)/devflow_finalize_validations_update.py


              export JSON_FILE_WITH_IDS=$(Agent.TempDirectory)/ids.json
              export APP_NAME=$(sed -r 's/(-)(\w)/-\U\2/g' <<<"${AGGREGATOR_PROJECT_NAME^}")
              export APP_NAME_TEMP=$APP_NAME
              export BASE_REST_API_URL=$(echo "$SYSTEM_TEAMFOUNDATIONCOLLECTIONURI" | sed  "s/https:\/\///")
              export TEXT_WIKI="$(Build.SourcesDirectory)/$(Build.Repository.Name)/text-wiki.html"
              export DATETIME_FOR_API="$(date '+%F %T' -u)"

              export APP_GET_VERSION=$(NEW_VERSION)
              # $(cat $(Build.SourcesDirectory)/$(Build.Repository.Name)/VERSION)
              echo "##[command]Etapa de envio dos dados do Pull Request para a Wiki do Confluence $DEVFLOW_API_PRE_WRITE"

              # Cria Script de busca de dados caso não exista
              if [ ! -f $SCRIPT_PATH ]; then
                cat <<EOF > $SCRIPT_PATH
              # -*- coding: utf-8 -*-
              #!/usr/bin/env python
              import json
              import os
              import sys
              import requests
              import urllib.parse
              requests.packages.urllib3.disable_warnings()
              from requests.auth import HTTPBasicAuth

              os.environ['HTTP_PROXY']  = os.getenv('PROXY_AGENT_HTTP')
              os.environ['HTTPS_PROXY'] = os.getenv('PROXY_AGENT_HTTP')

              def get_pull_request_data_from_custom_api(app_name):
                """"Retorna os dados enviados para a api \"Pre-write\" """
                try:
                  datetime_for_api=urllib.parse.quote(os.getenv('DATETIME_FOR_API'))
                  team_project = urllib.parse.quote(os.getenv('SYSTEM_TEAMPROJECT'))
                  devflow_api_pre_write = os.getenv('DEVFLOW_API_PRE_WRITE')
                  url_base_url_api = f'{devflow_api_pre_write}/{app_name}?datetime={datetime_for_api}&owner={team_project}'
                  headers = {"Content-Type": "application/json"}
                  print(f'##[command]Buscando dados através da url {url_base_url_api}')

                  data_from_api_custom  = requests.get(url_base_url_api,
                                                      headers=headers,
                                                      proxies={'http': '','https': ''},
                                                      verify=False
                                                  )
                  if not data_from_api_custom.status_code == 200:
                      print(f'##[error] Não foi possível retornar os dados da API url {url_base_url_api}')
                      sys.exit(1)

                  data_from_api_custom = data_from_api_custom.json()
                  if len(data_from_api_custom):
                      return data_from_api_custom

                  print(f'##[command]Não foram encontrados dados para enviar para a Wiki')
                  return []

                except Exception as e:
                  print(f'## [debug] Exception')
                  print(e)
                  print('##[command]Um erro ao tentar retornar os dados')
                  sys.exit(1)

              def get_pull_request_data_from_azure(pull_request_id):
                """Retorna dados do Pull request na api da Azure"""
                try:
                  auth_api_rest_token = os.getenv('SYSTEM_ACCESS_TOKEN')

                  auth_api_rest_token_temp = os.getenv('SYSTEM_ACCESS_TOKEN_TEMP')

                  base_rest_api_url = os.getenv('SYSTEM_TEAMFOUNDATIONCOLLECTIONURI', '').replace('https://','')
                  # env REST_ORG_NAME
                  auth_org_name = base_rest_api_url.split('/')[1]
                  team_project = urllib.parse.quote(os.getenv('SYSTEM_TEAMPROJECT'))
                  rest_azure_api_version = os.getenv('REST_AZURE_API_VERSION')
                  url_base_url_api = f'https://telefonica-vivo-brasil:{auth_api_rest_token}@{base_rest_api_url}{team_project}/_apis/git/pullRequests/{pull_request_id}?api-version={rest_azure_api_version}'
                  url_base_url_api_temp = f'https://:{auth_api_rest_token_temp}@{base_rest_api_url}{team_project}/_apis/git/pullRequests/{pull_request_id}?api-version={rest_azure_api_version}'
                  headers = {"Content-Type": "application/json"}
                  proxies ={'http': os.getenv('HTTP_PROXY'), 'https': os.getenv('HTTP_PROXY')}

                  # pull_request_data = requests.get(url_base_url_api, headers=headers, proxies=proxies, auth=HTTPBasicAuth(auth_org_name, auth_api_rest_token), verify= False)
                  # print(pull_request_data)
                  # pull_request_data = requests.get(url_base_url_api, headers=headers, proxies=proxies, verify= False)
                  # print(pull_request_data)

                  pull_request_data = requests.get(url_base_url_api_temp, headers=headers, proxies=proxies, verify= False)
                  print(pull_request_data)

                  if not pull_request_data.status_code == 200:
                    print(f'##[error] Não foi possível retornar os dados do Pull request na url {url_base_url_api}')
                    sys.exit(1)

                  pull_request_data = pull_request_data.json()
                  if pull_request_data.get('status', '') == 'completed' and pull_request_data.get('mergeStatus', '') == 'succeeded':
                    return pull_request_data

                  return []

                except Exception as e:
                  print(f'## [debug] Exception')
                  print('##[command]Houve um erro ao tentar atualizar os dados')
                  sys.exit(1)

              app_get_version = os.getenv('APP_GET_VERSION')
              text_wiki_file  = os.getenv('TEXT_WIKI')
              projects = [os.getenv('BACKEND_PROJECT_NAME'), os.getenv('FRONTEND_PROJECT_NAME')]
              ids_for_update = []
              text_wiki = ''
              final_text_wiki = ''
              for project_name in projects:
                sub_module='js-store-front/core-customize'
                if project_name == 'js-store-front-ng':
                  sub_module='js-store-front'

                if project_name == 'core-customize':
                  sub_module=project_name

                data_from_api_pre_write = get_pull_request_data_from_custom_api(project_name)

                if len(data_from_api_pre_write):
                  for item in data_from_api_pre_write:
                    item_id = item.get('id')
                    item_description = item.get('description')
                    item_pull_request_id = item.get('merge_request_id')
                    data_azure = get_pull_request_data_from_azure(item_pull_request_id)

                    if not len(data_azure):
                      print(f'## [error] Sem dados para publicar na Wiki para o Pull Request {item_pull_request_id} com status=completed e mergeStatus=succeeded (projeto {project_name})')
                      continue

                    ids_for_update.append(f"{item_id}")

                    reviewers = data_azure.get('reviewers', [])
                    if not len(reviewers):
                      print(f'## [error] Não foi possível obter a lista de revisores/aprovadores')
                      sys.exit(1)

                    text_wiki += f'<h4>Submódulo: {sub_module}</h4>'
                    text_wiki += '<h4>Aprovadores ??</h4>'
                    for reviewer in reviewers:
                      reviewer_name = reviewer.get('displayName')
                      reviewer_email = reviewer.get('uniqueName')
                      text_wiki += f'<p>{reviewer_name} {reviewer_email}</p>'

                    # Adicionando a descrição (recuperada da api pre-write)
                    print(item_description)
                    text_wiki += f'<br/>{item_description}<br/>'

                  file_is_ok = False
                  if len(text_wiki):
                    file_is_ok = False
                    final_text_wiki = f'<h2>Versão: {app_get_version}</h2> <br/> {text_wiki} <hr/>'

                    try:
                      final_text_wiki = final_text_wiki.replace('\n', '')
                      f = open(text_wiki_file, 'w')
                      f.write(final_text_wiki)
                      print(final_text_wiki)
                      f.close()
                      file_is_ok = True
                    except Exception as e:
                      print(f'## [debug] {e}')
                      sys.exit(1)

                  if file_is_ok:
                    with open(os.getenv('JSON_FILE_WITH_IDS') , 'w' ) as write_data:
                      json.dump(ids_for_update , write_data )
              EOF
              fi

              # Cria Script de atualização de dados caso não exista
              if [ ! -f $SCRIPT_PATH_UPDATE_IDS ]; then
                cat <<EOF > $SCRIPT_PATH_UPDATE_IDS
              # -*- coding: utf-8 -*-
              #!/usr/bin/env python
              import json
              import os
              import sys
              import requests
              import urllib.parse
              requests.packages.urllib3.disable_warnings()

              def update_items_by_array_of_ids(ids):
                """Atualiza o status published para 1 de acordo com os ids ex [\"1as-addd-dd112\", \"asdf-123-1dd2\"]"""
                try:
                  headers = {"Content-Type": "application/json"}
                  owner = urllib.parse.quote(os.getenv('SYSTEM_TEAMPROJECT'))
                  url_base_url_api = os.getenv('DEVFLOW_API_PRE_WRITE')
                  url_base_url_api = f'{url_base_url_api}?owner={owner}'

                  print(f'##[command]Enviando requisição PUT para {url_base_url_api}')
                  put_data = requests.put(url_base_url_api, json=ids, headers=headers, proxies={'http': '','https': ''},)

                  if put_data.status_code == 200:
                      print(f'?? ?? Dados atualizados ?? ??')
                      return True

                  error_msg = f'## [debug] Não foi possível atualizar o status dos ids informados (http code {put_data.status_code})'
                  print(error_msg)
                  print('##[command]Isso não é um problema mas poderá gerar conteúdo redundante na Wiki do Confluence')
                except Exception as e:
                  print(f'## [debug] Exception')
                  print('##[command]Um erro ao tentar atualizar os dados')
                  sys.exit(1)

              ids_for_update = []
              with open(os.getenv('JSON_FILE_WITH_IDS') , 'r' ) as read_data:
                ids_for_update = json.load(read_data)
              print('##[command]Atualizando registros na api Pre-write')
              update_items_by_array_of_ids(ids_for_update)
              EOF
              fi

              python $SCRIPT_PATH

              verify_and_stop_if_error $(echo $?)

              if [ -f $JSON_FILE_WITH_IDS ]; then
                python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py --call-wiki-confluence --wiki-confluence-file $TEXT_WIKI
                verify_and_stop_if_error $(echo $?)
                python $SCRIPT_PATH_UPDATE_IDS
              fi
            displayName: 'Send to Wiki'
            env:
              SYSTEM_ACCESS_TOKEN_TEMP: $(SYSTEM_ACCESS_TOKEN_TEMP) # token de usuário
              SYSTEM_ACCESSTOKEN: $(System.AccessToken) # token gerado pela pipeline
              API_CONFLUENCE_TOKEN: $(API_CONFLUENCE_TOKEN)
              http_proxy: $(PROXY_AGENT_HTTP)
              https_proxy: $(PROXY_AGENT_HTTPS)
              no_proxy: $(PROXY_AGENT_NO_PROXY)

            condition: and(
                    succeeded(),
                    eq(variables.DEVFLOW_PUBLISH_CONFLUENCE, true)
                  )
