stages:
- stage: pipeline_pre_init
  displayName: "Start pipeline"
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: first_steps
    workspace:
      clean: all
    displayName: "Pipeline information"
    steps:
      - checkout: none

      - bash: |
          echo "[section]SAP Commerce Cloud - Dev Pipeline Initiated Successfully."
          echo "[section]Essa pipeline permite criar um build e realizar um deploy SAP Commerce."
          echo "[section]Se encontrar algum problema, por favor, abra um chamado para o time de DevOps do Ecom/Unicom na ferramenta (de uso interno) https://devopstools.lojaonline.vivo.com.br/help-desk (login com usuário e senha de rede)"
        displayName: 'Helpful information'


