parameters:
- name: storefront_hash
  type: string
  default: ''
- name: core_customize_hash
  type: string
  default: ''
- name: build_name
  type: string
  default: ''
- name: isUpgradeSap
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/variables/load.yaml

resources:
  repositories:
    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:  
  - template: stages/rebuild.yaml
    parameters:
      storefront_hash: ${{ parameters.storefront_hash }}
      core_customize_hash: ${{ parameters.core_customize_hash }}
      build_name: ${{ parameters.build_name }}


