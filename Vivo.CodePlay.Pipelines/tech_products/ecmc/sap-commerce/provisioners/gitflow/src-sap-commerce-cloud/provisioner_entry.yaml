parameters:
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: project_name
  type: string
- name: enable_devflow_validations
  type: boolean
  default: False
- name: show_pos_validate
  type: boolean
  default: False
- name: environment_code
  type: string
  values:
  - d1
  - d2
  - d3
  - d4
  - d5
  - d6
  - d7
  - d8
  - d9
  - d10
  - d11
  - d12
  - d13
  - d14
  - d15
  - s1

- name: database_update_mode
  type: string
  values:
  - NONE
  - UPDATE

- name: deploy_strategy
  type: string
  values:
  - RECREATE
  - ROLLING_UPDATE

- name: branch_backend
  type: string
  default: ''
- name: branch_frontend
  type: string
  default: ''
- name: qa_branch
  type: boolean
  default: False
- name: s1_branch
  type: boolean
  default: False
- name: git_strategy
  type: string
- name: save_backup
  type: boolean
  default: True
- name: isUpgradeSap
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/${{parameters.git_strategy }}/variables/load.yaml

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: EcmcPythonScripts
      name: ECMC - Ecomm Cloud B2C/src-devops-scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CoreCustomize
      name: ECMC - Ecomm Cloud B2C/src-sap-commerce-core-customize-java
      type: git
      ref: $(Build.SourceBranch)

    - repository: JsStoreFront
      name: ECMC - Ecomm Cloud B2C/src-sap-commerce-js-store-front-ng
      type: git
      ref: $(Build.SourceBranch)

stages:
  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/init.yaml
    parameters:
      environment_code: ${{ parameters.environment_code}}
      ${{ if and(eq(variables['Build.Reason'], 'Manual'), ne(parameters.branch_frontend, ''), ne(parameters.branch_backend, '')) }}:
        branch_frontend: ${{ parameters.branch_frontend }}
        branch_backend: ${{ parameters.branch_backend }}

  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/build.yaml
    parameters:
      environment_code: ${{ parameters.environment_code}}
      ${{ if and(eq(variables['Build.Reason'], 'Manual'), ne(parameters.branch_frontend, ''), ne(parameters.branch_backend, ''), ne(parameters.database_update_mode, '')) }}:
        branch_frontend: ${{ parameters.branch_frontend }}
        branch_backend: ${{ parameters.branch_backend }}

  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), eq(parameters.project_name, 'src-sap-commerce-cloud')) }}:
    - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/send_message.yaml
      parameters:
        project_name: ${{ parameters.project_name }}
        environment_code: ${{ parameters.environment_code }}
        database_update_mode: ${{ parameters.database_update_mode }}
        deploy_strategy: ${{ parameters.deploy_strategy }}
        branch_frontend: ${{ parameters.branch_frontend }}
        branch_backend: ${{ parameters.branch_backend }}
        pipeline_status: 'STARTED'
        work_item_title_prefix: 'Build'

  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/deploy.yaml
    parameters:
      environment_code: ${{ parameters.environment_code}}
      ${{ if and(in(variables['Build.Reason'], 'Manual', 'Schedule'), ne(parameters.deploy_strategy, ''), ne(parameters.database_update_mode, ''))  }}:
        database_update_mode: ${{ parameters.database_update_mode }}
        deploy_strategy: ${{ parameters.deploy_strategy }}

  - ${{ if and(and(eq(parameters.branch_backend, ''), eq(parameters.branch_frontend, '')), or(and(ne(variables['Build.Reason'],'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')), startsWith(variables['Build.SourceBranch'], 'refs/heads/'))) }}:
    - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/pos_validate_standards_dev_flow.yaml

  - ${{ if and(eq(parameters.branch_backend, ''), eq(parameters.branch_frontend, '')) }}:
    - template: /tech_products/ecmc/sap-commerce/tasks/tests/run_automated_tests.yaml
      parameters:
        environment_code: ${{ parameters.environment_code }}

    - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/run_stress_test.yaml
      parameters:
        environmentCode: ${{ parameters.environment_code }}
        dependsOn: "deploy"

  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), eq(parameters.project_name, 'src-sap-commerce-cloud')) }}:
    - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-cloud/stages/send_message.yaml
      parameters:
        project_name: ${{ parameters.project_name }}
        environment_code: ${{ parameters.environment_code }}
        database_update_mode: ${{ parameters.database_update_mode }}
        deploy_strategy: ${{ parameters.deploy_strategy }}
        branch_frontend: ${{ parameters.branch_frontend }}
        branch_backend: ${{ parameters.branch_backend }}
        pipeline_status: 'DEPLOYED'
        work_item_title_prefix: 'Deploy'
