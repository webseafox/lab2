parameters:
- name: project_name
  type: string
- name: enable_devflow_validations
  type: boolean
  default: False
- name: qa_branch
  type: boolean
  default: False
- name: s1_branch
  type: boolean
  default: False
- name: downloadAccelerator
  type: boolean
  default: True

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/variables/core/load.yaml

resources:
  repositories:
    - repository: FortifyExclusion

      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
# CI / CD Flow

  ## INIT
  - template: stages/init.yaml

  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), in(variables['Build.SourceBranch'],'refs/heads/main','refs/heads/master','refs/heads/s1','refs/heads/s2','refs/heads/s3','refs/heads/s4','refs/heads/s5','refs/heads/s6')), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: /tech_products/ecmc/sap-commerce/tasks/messages/create_work_item_merge.yaml

  ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  ## EXECUTA VALIDAÇÃO PARA TODOS OS PRs
  - ${{ if eq(variables['Build.Reason'],'PullRequest') }}:
    - ${{ if eq(parameters.enable_devflow_validations, True) }}:
      - template: stages/validate_standards_dev_flow.yaml

  - ${{ if in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI') }}:
    - template: stages/bump_version.yaml
      parameters:
        enable_devflow_validations: ${{ parameters.enable_devflow_validations }}
        qa_branch: ${{ parameters.qa_branch }}
        s1_branch: ${{ parameters.s1_branch }}

  # BUILD TEST
  - ${{ if not(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - ${{ if eq(parameters.downloadAccelerator, True) }}:
      - template: stages/build_test.yaml
        parameters:
          enable_devflow_validations: ${{ parameters.enable_devflow_validations }}
    - ${{ else }}:
      - template: stages/build_test_local_agent.yaml
        parameters:
          enable_devflow_validations: ${{ parameters.enable_devflow_validations }}

  # QUALITY GATE (não executa em CI de commit — IndividualCI/BatchedCI)
  - ${{ if not(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: stages/gates.yaml

  # SECURITY WILL RUN ONLY IN PULL REQUESTS (view file tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-core-customize-java/provisioner_entry_pr.yaml)
  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: stages/finalize.yaml

