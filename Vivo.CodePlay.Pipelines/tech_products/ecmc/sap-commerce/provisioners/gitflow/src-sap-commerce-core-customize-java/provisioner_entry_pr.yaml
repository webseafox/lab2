parameters:
- name: project_name
  type: string
- name: enable_devflow_validations
  type: boolean
  default: False
- name: qa_branch
  type: boolean
  default: False
- name: s1_branch
  type: boolean
  default: False
- name: downloadAccelerator
  type: boolean
  default: True

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/variables/core/load.yaml

resources:
  repositories:
    - repository: FortifyExclusion

      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
# CI / CD Flow

  ## INIT
  - template: stages/init.yaml

  ## VALIDATE PREDEFINED STANDARDS (COMMIT MESSAGES, BRANCH NAME ETC)
  ## EXECUTA A VAIDAÇÃO EM TODOS OS PRs
  - ${{ if eq(variables['Build.Reason'],'PullRequest') }}:
    - ${{ if eq(parameters.enable_devflow_validations, True) }}:
      - template: stages/validate_standards_dev_flow.yaml

  # BUILD TEST
  - ${{ if eq(parameters.downloadAccelerator, True) }}:
    - template: stages/build_test.yaml
      parameters:
        enable_devflow_validations: ${{ parameters.enable_devflow_validations }}
  - ${{ else }}:
    - template: stages/build_test_local_agent.yaml
      parameters:
        enable_devflow_validations: ${{ parameters.enable_devflow_validations }}

  ## QUALITY GATE
  - template: stages/gates.yaml

  ## SECURITY
  - template: stages/security.yaml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## SCA VIOLATION
  - template: stages/sca_violation.yaml
    parameters:
      scaFailedCondition: "eq(dependencies.security.outputs['sca_scan.sca_failed_status.SCA_FAILED'], 'true')"

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/s1'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: stages/finalize.yaml
