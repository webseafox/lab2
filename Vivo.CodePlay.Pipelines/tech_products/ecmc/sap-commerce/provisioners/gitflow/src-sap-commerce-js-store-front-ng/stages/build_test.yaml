parameters:
- name: enable_devflow_validations
  type: boolean
  default: False
- name: incrementLevel
  default: patch
- name: s1_branch
  type: boolean
  default: False
- name: qa_branch
  type: boolean
  default: False

stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
    - pipeline_init
    - ${{ if and(eq(variables['Build.Reason'],'PullRequest'), eq(parameters.enable_devflow_validations, True)) }}:
      - repo_validations
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
    - job: about_build_test
      displayName: "About Build, Test and Coverage"
      steps:
        - checkout: none
        - bash: |
            echo "##[section]Stage para execução de build, testes e publicação de artefatos de cobertura/testes"
          displayName: "Job information" 

    - job: build_test_coverage
      workspace:
        clean: all
      displayName: Build, Test and Coverage
      ${{ if and(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
        condition: succeeded()
        variables:
          - name: NEW_VERSION 
            value: $[ stageDependencies.pipeline_init.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
          - name: NEW_VERSION_OUT 
            value: $[ stageDependencies.pipeline_init.bump_version.outputs['component_bump_version.NEW_VERSION_OUT'] ]
      steps:

      - ${{ if and(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
        - template: /tech_products/ecmc/sap-commerce/tasks/nodejs/update_build_version.yaml
          parameters:
            newVersion: "$(NEW_VERSION)"
            workingDirectory: "$(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)"
            condition: eq(variables.BUMP_VERSION_ENABLED, true)  

      - template: /tech_products/ecmc/sap-commerce/task_groups/build/nodejs_build_test.yaml
        parameters:
          sourceFolder: $(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)