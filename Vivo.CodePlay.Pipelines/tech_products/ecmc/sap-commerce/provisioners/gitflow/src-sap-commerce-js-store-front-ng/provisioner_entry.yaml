parameters:
- name: enable_devflow_validations
  type: boolean
  default: False
- name: project_name
  type: string
- name: qa_branch
  type: boolean
  default: False
- name: s1_branch
  type: boolean
  default: False

variables:
- template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/variables/load.yaml

resources:
  repositories:
    - repository: FortifyExclusion

      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CorePipelines

    - repository: CorePipelinesScripts
      name: DevOps/Vivo.Core.Pipelines.Scripts
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:

  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-js-store-front-ng/stages/init.yaml

  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), in(variables['Build.SourceBranch'],'refs/heads/main','refs/heads/master','refs/heads/s1','refs/heads/s2','refs/heads/s3','refs/heads/s4','refs/heads/s5','refs/heads/s6')), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: /tech_products/ecmc/sap-commerce/tasks/messages/create_work_item_merge.yaml

  - ${{ if and(ne(variables['Build.Reason'],'PullRequest'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), in(variables['Build.SourceBranch'], 'refs/heads/s1', 'refs/heads/s2', 'refs/heads/s3', 'refs/heads/s4', 'refs/heads/s5', 'refs/heads/s6')), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) }}:
    - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-js-store-front-ng/stages/finalize.yaml

  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-js-store-front-ng/stages/build_test.yaml
    parameters:
      enable_devflow_validations: ${{ parameters.enable_devflow_validations }}

  ## QUALITY GATE
  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-js-store-front-ng/stages/gates.yaml


  # SECURITY
  - template: /tech_products/ecmc/sap-commerce/provisioners/gitflow/src-sap-commerce-js-store-front-ng/stages/security.yaml
    parameters:
      fortifyExclusionRepository: FortifyExclusion
