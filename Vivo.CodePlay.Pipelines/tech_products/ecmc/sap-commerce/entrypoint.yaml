parameters:
- name: project_name #Pipeline configuration object
  type: string
  default: ''
  values:
  - src-sap-commerce-cloud
  - src-sap-commerce-js-store-front-ng
  - src-sap-commerce-core-customize-java
- name: enable_devflow_validations
  type: boolean
  default: False
- name: git_strategy
  type: string
  default: 'trunkbased'
- name: environment_code
  type: string
  default: ''
- name: database_update_mode
  type: string
  default: 'NONE'
- name: deploy_strategy
  type: string
  default: 'RECREATE'
- name: branch_backend
  type: string
  default: ''
- name: branch_frontend
  type: string
  default: ''
- name: qa_branch
  type: boolean
  default: False
- name: s1_branch
  type: boolean
  default: False
- name: save_backup
  type: boolean
  default: True
- name: isUpgradeSap
  type: boolean
  default: False
- name: downloadAccelerator
  type: boolean
  default: True

extends:
  ${{ if and(eq(variables['Build.Reason'], 'PullRequest'), ne(parameters.project_name, 'src-sap-commerce-cloud')) }}:
    template: /tech_products/ecmc/sap-commerce/provisioners/${{parameters.git_strategy}}/${{ parameters.project_name }}/provisioner_entry_pr.yaml
  ${{ else }}:
    ${{ if and(eq(parameters.branch_backend, ''), eq(parameters.branch_frontend, '')) }}:
      template: /tech_products/ecmc/sap-commerce/provisioners/${{parameters.git_strategy}}/${{ parameters.project_name }}/provisioner_entry.yaml
    ${{ else }}:
      template: /tech_products/ecmc/sap-commerce/provisioners/${{parameters.git_strategy}}/${{ parameters.project_name }}/provisioner_entry_dev.yaml

  parameters:
    ${{ if eq(parameters.project_name, 'src-sap-commerce-cloud') }}:
      ${{ each pair in parameters }}:
        ${{ if ne(pair.key, 'downloadAccelerator') }}:
          ${{ pair.key }}: ${{ pair.value }}
    ${{ else }}:
      project_name: ${{ parameters.project_name }}
      enable_devflow_validations: ${{ parameters.enable_devflow_validations }}
      qa_branch: ${{ parameters.qa_branch }}
      s1_branch: ${{ parameters.s1_branch }}
      ${{ if eq(parameters.project_name, 'src-sap-commerce-core-customize-java') }}:
        downloadAccelerator: ${{ parameters.downloadAccelerator }}
