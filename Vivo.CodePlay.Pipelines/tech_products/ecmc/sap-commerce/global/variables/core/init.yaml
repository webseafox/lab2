# REPOSITORIES ALIASES
- name: BRANCH_NAME_TO_USE_SEMANTIC
  value: "stage/preprod"
- name: flowIsMain
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')]
- name: flowIsTriggerCI
  value: $[in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')]
- name: flowIsManual
  value: $[eq(variables['Build.Reason'], 'Manual')]
- name: flowIsPullRequest
  value: $[eq(variables['Build.Reason'],'PullRequest')]
- name: flowIsTagging
  value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
- name: flowIsToReview
  value: $[or( eq(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))]
- name: flowIsQa
  value: $[or(startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'), in(variables['Build.SourceBranch'], 'refs/heads/s1', 'refs/heads/s2', 'refs/heads/s3', 'refs/heads/s4', 'refs/heads/s5', 'refs/heads/s6'))]
- name: flowIsSapCommerce
  value: $[or(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'],'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/s1', 'refs/heads/s2', 'refs/heads/s3', 'refs/heads/preprod', 'refs/heads/esteira1', 'refs/heads/esteira2'), startsWith(variables['Build.SourceBranch'], 'refs/heads/project/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/stage/'))]
- name: flowIsPRStageWithMasterSapCommerce
  value: $[and(
            eq(variables['Build.Reason'],'PullRequest'),
            or(
              and(
                or(
                  in(variables['System.PullRequest.targetBranchName'], 'master', 'refs/heads/master'),
                  startsWith(variables['System.PullRequest.targetBranchName'], 'refs/heads/stage/'),
                  startsWith(variables['System.PullRequest.targetBranchName'], 'stage/')
                ),
                or(
                  startsWith(variables['System.PullRequest.SourceBranch'], 'stage/'),
                  startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/stage/')
                )
              ),
              and(
                in(variables['System.PullRequest.SourceBranch'], 'master', 'refs/heads/master'),
                or(
                  startsWith(variables['System.PullRequest.targetBranchName'], 'stage/'),
                  startsWith(variables['System.PullRequest.targetBranchName'], 'refs/heads/stage/')
                )
              )
            )
          )]

