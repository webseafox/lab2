parameters:
  - name: environmentCode
    type: string
    default: ''

jobs:
- job: pre_start_run_stress_test
  workspace:
    clean: all
  condition: succeeded()
  displayName: "Validate run stress test"
  steps:
  - checkout: none
  - bash: |
      echo "[section]Verifying environment"
      if [[ "${ENVIRONMENT_CODE}" == "" ]];then
        echo "[error]O parâmetro environmentCode não pode ser vazio"
        echo "##vso[task.setvariable variable=ALLOW_RUN_STRESS_TEST;isOutput=true]false"
        exit 1
      fi

      if echo ";${ENVIRONMENTS_TO_RUN_STRESS_TESTS};" | grep -q ";${ENVIRONMENT_CODE};"; then
        echo "[section]${ENVIRONMENT_CODE} está na lista para execução de stress test"
        echo "##vso[task.setvariable variable=ALLOW_RUN_STRESS_TEST;isOutput=true]true"
      else
        echo "[section]'${ENVIRONMENT_CODE}' não está na lista para execução de stress test"
        echo "##vso[task.setvariable variable=ALLOW_RUN_STRESS_TEST;isOutput=true]false"
      fi
    displayName: "Validate environment"
    name: validate_run_stress_test
    env:
      ENVIRONMENT_CODE: ${{ parameters.environmentCode }}
