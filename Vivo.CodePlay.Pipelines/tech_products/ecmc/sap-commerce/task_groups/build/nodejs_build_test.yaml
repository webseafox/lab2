parameters:
- name: cmdBuildTest
  default: $(CMD_BUILD_TEST)
- name: artifactPublishName
  default: app
- name: dockerWorkDir
  type: string
  default: $(DOCKER_WORKDIR)
- name: sourceFolder
  default: $(Build.SourcesDirectory)
- name: isDevelopment
  type: boolean
  default: False

steps:
- template: /tech_products/ecmc/sap-commerce/tasks/nodejs/setup_credentials.yaml
- template: /tech_products/ecmc/sap-commerce/tasks/nodejs/test_with_docker_and_lint.yaml
  parameters:
    cmdNodeTest: $CMD_NODE_TEST
    dockerWorkDir: ${{ parameters.dockerWorkDir}}
    isDevelopment: ${{ parameters.isDevelopment }}

- ${{ if eq(parameters.isDevelopment, False) }}:
  - template: /tech_products/ecmc/sap-commerce/tasks/nodejs/publish_tests_result.yaml

- template: /tech_products/ecmc/sap-commerce/tasks/artifacts/publish_app.yaml
  parameters:
    artifactPublishName: ${{ parameters.artifactPublishName }}
    sourceFolder: ${{ parameters.sourceFolder }}
    excludeFiles: '{"*\.tar","*.tar\.gz","*/dist","\.pnpm-store","\.angular","*/mock","*/.git",".git/"}'
