parameters:
- name: artifactName
  type: string
  default: "app"

steps:

- template: /tech_products/ecmc/sap-commerce/tasks/artifacts/copy_cxcom.yaml

- bash: |
    echo "##[section]LIST DIRECTORY HYBRIS"
    ls -la $(Build.SourcesDirectory)/hybris/bin/modules
  displayName: "List hybris directory"

- bash: |
    cd $(Build.SourcesDirectory)/hybris

    echo "##[section]CRIANDO ARQUIVO .tar.gz COM OS ARQUIVOS .jar"

    tar --warning=no-file-changed -hczf $FILE_TO_PUBLISH $(find -name "*.jar")

    STATUS_TAR_CREATION=$?
    if [[ $STATUS_TAR_CREATION != 0 ]]; then
      SET_MSG="NÃO FOI POSSÍVEL GERAR O ARQUIVO app.tar.gz"
      echo "##[error]$SET_MSG"
      echo "##vso[task.logissue type=error;]$SET_MSG"
      exit 1
    fi

    echo "##[section]ARQUIVO TAR CRIADO COM SUCESSO"
    tar -tf $FILE_TO_PUBLISH
  displayName: 'Generate app.tar.gz'
  env:
    FILE_TO_PUBLISH: $(Build.SourcesDirectory)/app.tar.gz
    EXCLUDE_FILES: '{"*\.tar","*.tar\.gz","*/dist","\.pnpm-store","\.angular","*/mock","*/.git",".git/"}'

- task: CopyFiles@2
  displayName: "Copy app.tar.gz to Staging Directory"
  inputs:
    TargetFolder: "$(Build.ArtifactStagingDirectory)"
    OverWrite: true
    CleanTargetFolder: true
    Contents: |
      $(Build.SourcesDirectory)/app.tar.gz

- task: PublishPipelineArtifact@1
  displayName: "Publish app.tar.gz"
  inputs:
    artifactName: ${{ parameters.artifactName }}
    targetPath: "$(Build.ArtifactStagingDirectory)"
