steps:
- download: current
  artifact: JunitReport
  displayName: 'Download HTML Report'
  condition: and(eq(variables.flowIsPullRequest, True), ne(variables['flowIsPRStageWithMasterSapCommerce'], 'true'))
  continueOnError: true

- bash: |
    echo "##[section]Iniciando validação do relatório do JUnit..."
    echo "##[debug]Parâmetro JACOCO_EXEC: $(JACOCO_EXEC)"

    if [[ "$(JACOCO_EXEC)" != "True" ]]; then
      echo "⚠️  ATENÇÃO: A execução dos testes foi pulada, portanto a validação de testes não será aplicada."
      exit 0
    fi

    html_file="$(Pipeline.Workspace)/JunitReport/overview-summary.html"

    if [[ ! -f "$html_file" ]]; then
      echo "Erro: Arquivo $html_file não encontrado!"
      exit 1
    fi

    # Extrai a linha que contém os links com titles "Display all failures" e "Display all errors"
    failures=$(grep -o '<a title="Display all failures"[^>]*>\([0-9]*\)</a>' "$html_file" | sed 's/.*>\([0-9]*\)<\/a>/\1/')
    errors=$(grep -o '<a title="Display all errors"[^>]*>\([0-9]*\)</a>' "$html_file" | sed 's/.*>\([0-9]*\)<\/a>/\1/')

    # Também extrai o total de testes e taxa de sucesso para contexto
    total_tests=$(grep -o '<a title="Display all tests"[^>]*>\([0-9]*\)</a>' "$html_file" | sed 's/.*>\([0-9]*\)<\/a>/\1/')
    success_rate=$(grep -o '<td>[0-9]*\.[0-9]*%</td>' "$html_file" | sed 's/<td>\([0-9]*\.[0-9]*%\)<\/td>/\1/')

    echo "=== Resultados dos Testes ==="
    echo "Total de testes: $total_tests"
    echo "Failures: $failures"
    echo "Errors: $errors"
    echo "Taxa de sucesso: $success_rate"
    echo "=========================="

    # Verifica se há falhas ou erros
    if [[ "$failures" -gt 0 ]] || [[ "$errors" -gt 0 ]]; then
      echo "⚠️  ATENÇÃO: Foram encontradas falhas ou erros nos testes! Por favor, valide o resultado da execução dos testes dessa pipeline"
      exit 1
    else
      echo "✅ Todos os testes passaram com sucesso!"
    fi
  displayName: 'JUnit Coverage Report'
  condition: and(eq(variables.flowIsPullRequest, True), ne(variables['flowIsPRStageWithMasterSapCommerce'], 'true'))
  continueOnError: false
