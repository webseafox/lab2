parameters:
- name: downloadDirectory
  default: '$(System.DefaultWorkingDirectory)'
- name: feedsToUse
  default: 'internal'
- name: vstsFeed
  default: '3d53bc62-8749-4931-ae46-a443b73bc87a'
- name: vstsFeedPackage
  default: 'dvps-cxcomm'
- name: vstsFeedPackageTelco
  default: 'dvps-cxtelpack'

steps:
- bash: |
    CONFIG_FILE="$(Build.SourcesDirectory)/.azuredevops/sapcomm-versions.yaml"

    if [ ! -f "$CONFIG_FILE" ]; then
      echo "##[error]Arquivo de configuração não encontrado: $CONFIG_FILE"
      echo "##[error]Crie o arquivo .azuredevops/sapcomm-versions.yaml com os atributos 'versions.sapcomm' e 'versions.telco'."
      exit 1
    fi

    echo "##[section]####### Lendo versões do arquivo $CONFIG_FILE #######"
    cat "$CONFIG_FILE"
    echo "##[section]#####################################################"

    ACCELERATOR_VERSION=$(awk -F': ' '/sapcomm:/ {gsub(/[[:space:]]/, "", $2); print $2}' "$CONFIG_FILE")
    TELCO_VERSION=$(awk -F': ' '/telco:/ {gsub(/[[:space:]]/, "", $2); print $2}' "$CONFIG_FILE")

    if [ -z "$ACCELERATOR_VERSION" ] || [ "$ACCELERATOR_VERSION" = "null" ]; then
      echo "##[error]Atributo 'versions.sapcomm' não encontrado ou vazio em $CONFIG_FILE"
      exit 1
    fi

    if [ -z "$TELCO_VERSION" ] || [ "$TELCO_VERSION" = "null" ]; then
      echo "##[error]Atributo 'versions.telco' não encontrado ou vazio em $CONFIG_FILE"
      exit 1
    fi

    echo "##[section]####### Informações do diretório atual de trabalho #######"
    pwd
    ls -la

    echo "##[section]####### Utilizando o Accelerator (sapcomm) na versão ${ACCELERATOR_VERSION} #######"
    echo "##[debug]Unzip o Accelerator ${ACCELERATOR_VERSION}"    
    if [ -f "/devops/sapcommerce/CXCOMM/${ACCELERATOR_VERSION}.ZIP" ]; then
      unzip -o -U /devops/sapcommerce/CXCOMM/${ACCELERATOR_VERSION}.ZIP
    else
      echo "##[warning]Accelerator ZIP not found on agent..."
      exit 1
    fi

    echo "##[section]####### Utilizando o Telco na versão ${TELCO_VERSION} #######"
    echo "##[debug]Unzip o Telco ${TELCO_VERSION}"
    if [ -f "/devops/sapcommerce/CXTELPACK/${TELCO_VERSION}.ZIP" ]; then
      unzip -o -U /devops/sapcommerce/CXTELPACK/${TELCO_VERSION}.ZIP
    else
      echo "##[warning]Telco ZIP not found on agent..."
      exit 1
    fi
  displayName: 'Set HYBRIS versions / Unzip the Accelerator and Telco'