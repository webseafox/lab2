parameters:
- name: downloadDirectory
  default: '$(System.DefaultWorkingDirectory)'
- name: feedsToUse
  default: 'internal'
- name: vstsFeed
  default: '3d53bc62-8749-4931-ae46-a443b73bc87a'
- name: vstsFeedPackage
  default: 'dvps-cxcomm'
- name: vstsFeedPackageTelco
  default: 'dvps-cxtelpack'

steps:
- bash: |
    CONFIG_FILE="$(Build.SourcesDirectory)/.azuredevops/sapcomm-versions.yaml"

    if [ ! -f "$CONFIG_FILE" ]; then
      echo "##[error]Arquivo de configuração não encontrado: $CONFIG_FILE"
      echo "##[error]Crie o arquivo .azuredevops/sapcomm-versions.yaml com os atributos 'versions.sapcomm' e 'versions.telco'."
      exit 1
    fi

    echo "##[section]####### Lendo versões do arquivo $CONFIG_FILE #######"
    cat "$CONFIG_FILE"
    echo "##[section]#####################################################"

    ACCELERATOR_VERSION=$(awk -F': ' '/sapcomm:/ {gsub(/[[:space:]]/, "", $2); print $2}' "$CONFIG_FILE")
    TELCO_VERSION=$(awk -F': ' '/telco:/ {gsub(/[[:space:]]/, "", $2); print $2}' "$CONFIG_FILE")

    if [ -z "$ACCELERATOR_VERSION" ] || [ "$ACCELERATOR_VERSION" = "null" ]; then
      echo "##[error]Atributo 'versions.sapcomm' não encontrado ou vazio em $CONFIG_FILE"
      exit 1
    fi

    if [ -z "$TELCO_VERSION" ] || [ "$TELCO_VERSION" = "null" ]; then
      echo "##[error]Atributo 'versions.telco' não encontrado ou vazio em $CONFIG_FILE"
      exit 1
    fi

    echo "##vso[task.setvariable variable=ACCELERATOR_VERSION]${ACCELERATOR_VERSION}"
    echo "##vso[task.setvariable variable=TELCO_VERSION]${TELCO_VERSION}"
  displayName: 'Set HYBRIS versions'

- task: UniversalPackages@0
  inputs:
    command: 'download'
    downloadDirectory: ${{ parameters.downloadDirectory }}
    feedsToUse: ${{ parameters.feedsToUse }}
    vstsFeed: ${{ parameters.vstsFeed }}
    vstsFeedPackage: ${{ parameters.vstsFeedPackage }}
    vstsPackageVersion: $(ACCELERATOR_VERSION)
  displayName: 'Download: CXCOMM'
  env:
    https_proxy: $(PROXY_NSKP_HTTPS)
    http_proxy: $(PROXY_NSKP_HTTP)
    no_proxy: $(PROXY_NSKP_NO_PROXY)

- task: UniversalPackages@0
  inputs:
    command: 'download'
    downloadDirectory: ${{ parameters.downloadDirectory }}
    feedsToUse: ${{ parameters.feedsToUse }}
    vstsFeed: ${{ parameters.vstsFeed }}
    vstsFeedPackage: ${{ parameters.vstsFeedPackageTelco }}
    vstsPackageVersion: $(TELCO_VERSION)
  displayName: 'Download: CXTELPACK'
  env:
    https_proxy: $(PROXY_NSKP_HTTPS)
    http_proxy: $(PROXY_NSKP_HTTP)
    no_proxy: $(PROXY_NSKP_NO_PROXY)