parameters:
- name: overwrite
  default: true
- name: cleanTargetFolder
  default: true
- name: contents
  default: '$(Build.SourcesDirectory)/app.tar'
- name: excludeFiles
  default: '{"*\.tar","*.tar\.gz","*/dist","\.pnpm-store","\.angular","*/mock","*/.git",".git/"}'
- name: sourceFolder
  default: $(Build.SourcesDirectory)

steps:

- task: CopyFiles@2
  displayName: 'Copy to Staging Directory'
  inputs:
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    OverWrite: ${{ parameters.overwrite }}
    CleanTargetFolder: ${{ parameters.cleanTargetFolder }}
    Contents: ${{ parameters.contents }}
    SourceFolder: ${{ parameters.sourceFolder }}
  condition: succeeded()