steps:
- bash: |
    echo "##[debug]Para desabilitar essa task, altere a variável VALIDATE_TARGET_BRANCH_ON_PR para false"
    echo "##[section]S1 BRANCH: .................... ${{ parameters.s1_branch }}"
    echo "##[section]VALIDATE_TARGET_BRANCH_ON_PR: . ${VALIDATE_TARGET_BRANCH_ON_PR}"

    echo "##[section]S1 BRANCH: .................... ${{ parameters.s1_branch }}"
    if [[ "$(Build.Reason)" == "PullRequest" ]]; then
      TARGET_BRANCH="$(System.PullRequest.targetBranchName)"
      PR_BRANCH=$(echo "$(System.PullRequest.SourceBranch)" | sed 's/refs\/heads\///g')
      TARGET_BRANCH_TYPE_PROJECT=$(echo "$TARGET_BRANCH" | sed -E 's/(project)\/.*/\1/g')
      TARGET_BRANCH_TYPE_stage=$(echo "$TARGET_BRANCH" | sed -E 's/(stage)\/.*/\1/g')

      echo "##[section]TARGET BRANCH: ................ $TARGET_BRANCH"
      echo "##[section]PULL REQUEST BRANCH: .......... $PR_BRANCH"
      BRANCHES_TARGET_ALLOWED=("refs/heads/stage/" "refs/heads/project/" "stage/" "project/")
      TARGET_BRANCH_PROJECT=$(echo "$TARGET_BRANCH" | sed -E 's/(project\/).*/\1/g')
      TARGET_BRANCH_STAGE=$(echo "$TARGET_BRANCH" | sed -E 's/(stage\/).*/\1/g')

      if [[ "project" == "$TARGET_BRANCH_TYPE_PROJECT" ]]; then
        echo "##[section]TARGET BRANCH TYPE PROJECT:.... TRUE"
        TARGET_BRANCH=$TARGET_BRANCH_PROJECT
      else
        echo "##[section]TARGET BRANCH TYPE PROJECT:.... FALSE"
      fi

      if [[ "stage" == "$TARGET_BRANCH_TYPE_stage" ]]; then
        echo "##[section]TARGET BRANCH TYPE stage:...... TRUE"
        TARGET_BRANCH=$TARGET_BRANCH_STAGE
      else
        echo "##[section]TARGET BRANCH TYPE stage:...... FALSE"
      fi

      BRANCHES_TARGET_ALLOWED=("project" "preprod" "prodlike" "esteira1" "esteira2" "hotfix")
      ALLOWED_BRANCHES_STRING="${BRANCHES_TARGET_ALLOWED[*]}"
      if [[ ! " $ALLOWED_BRANCHES_STRING " =~ " $TARGET_BRANCH " ]]; then
        echo "##[error]Para esse pull request e a pipeline serem concluídos, ao abrir o pull request, a branch $PR_BRANCH deve ser mesclada com uma das branches a seguir:"
        BRANCHES_TARGET_ALLOWED=("project/*" "stage/*")
        BRANCHES_AS_STRING=$(echo "${BRANCHES_TARGET_ALLOWED[@]}" | sed 's/ / | /g')
        echo "##[error]$BRANCHES_AS_STRING"
        exit 1
      fi
    else
      echo "##[section]Not a Pull Request, skipping branch validation."
    fi
  displayName: "Information about branch"
  condition: and(
                eq(variables.VALIDATE_TARGET_BRANCH_ON_PR, 'true'),
                or(
                  startsWith(variables['System.PullRequest.targetBranchName'], 'project/'),
                  startsWith(variables['System.PullRequest.targetBranchName'], 'stage/')
                )
            )