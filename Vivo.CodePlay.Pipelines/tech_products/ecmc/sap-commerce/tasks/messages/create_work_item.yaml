parameters:
- name: project_name
  type: string
  default: ''
- name: environment_code
  type: string
  default: ''
- name: database_update_mode
  type: string
  default: ''
- name: deploy_strategy
  type: string
  default: ''
- name: branch_backend
  type: string
  default: ''
- name: branch_frontend
  type: string
  default: ''
- name: pipeline_status
  type: string
  default: ''
- name: work_item_type
  type: string
  default: 'task'
- name: work_item_title
  type: string
  default: 'Deploy Sap Commerce cloud - E-commerce B2C'
- name: area_path
  type: string
  default: 'ECMC - Ecomm Cloud B2C\\Deploy-SAPCLOUD'
- name: iteration_path
  type: string
  default: 'ECMC - Ecomm Cloud B2C'
- name: display_name
  type: string
  default: 'Create work item'
- name: description_details
  type: string
  default: ''
- name: condition
  type: object
  default: succeeded()

steps:
  - bash: |
      PIPELINE_STATUS="${{ parameters.pipeline_status }}"
      WORK_ITEM_TITLE="${{ parameters.work_item_title }}"

      STATUS_MESSAGE=""
      if [ "$PIPELINE_STATUS" == "STARTED" ]; then
        STATUS_MESSAGE="Status: <b>Executando</b> ⚙️"
      elif [ "$PIPELINE_STATUS" == "HTTP_ERROR" ]; then
        STATUS_MESSAGE="Status: <b>Erro HTTP</b> ❌"
      elif [ "$PIPELINE_STATUS" == "SAP_ERROR" ]; then
        STATUS_MESSAGE="Status: <b>Erro na SAP</b> ❌"
      elif [ "$PIPELINE_STATUS" == "BUILD_COMPLETED" ]; then
        STATUS_MESSAGE="Status: <b>Concluído</b> ✅"
      elif [ "$PIPELINE_STATUS" == "DEPLOYED" ]; then
        STATUS_MESSAGE="Status: <b>Concluído</b> ✅"
      fi

      AUTHOR="Solicitante: <b>$(Build.QueuedBy) ✋👀</b>"
      if [ "$(Build.QueuedBy)" == "Microsoft.VisualStudio.Services.TFS" ]; then
        AUTHOR="<b>Build iniciado via Trigger ✋👀</b>"
      fi

      WORK_ITEM_DATA="🚀🔗 <a href='https://dev.azure.com/telefonica-vivo-brasil/ECMC%20-%20Ecomm%20Cloud%20B2C/_build/results?buildId=$(Build.BuildId)'>Link para a pipe</a> 🔗🚀<br><br> \
        Pipeline: <b>$(Build.DefinitionName)</b> 🚧<br><br> \
        $AUTHOR<br><br>"
    
      if [ "${{ parameters.environment_code }}" != "" ]; then
        if [ "${{ parameters.environment_code }}" != "Escolha um ambiente" ]; then
          WORK_ITEM_DATA+="Ambiente: <b>${{ parameters.environment_code }}</b> 🏗️<br><br>"
        else
          WORK_ITEM_DATA+="O ambiente escolhido <b>❗❗❗ ${{ parameters.environment_code }} </b> não existe ❗❗❗<br><br>"
        fi
      fi

      if [ "${{ parameters.deploy_strategy }}" != "" ]; then
        WORK_ITEM_DATA+="Estratégia de Deploy: <b>${{ parameters.deploy_strategy }}</b> 🔝<br><br>"
      fi
      
      if [ "${{ parameters.database_update_mode }}" != "" ]; then
        WORK_ITEM_DATA+="DB Update: <b>${{ parameters.database_update_mode }}</b> 💾<br><br>"
      fi
      
      if [ "${{ parameters.branch_frontend }}" != "" ]; then
        WORK_ITEM_DATA+="Branch do Storefront: <b>${{ parameters.branch_frontend }}</b> 👓<br><br>"
      fi

      if [ "${{ parameters.branch_backend }}" != "" ]; then
        WORK_ITEM_DATA+="Branch do Core customize: <b>${{ parameters.branch_backend }}</b> 🌄<br><br>"
      fi

      if [ "${{ parameters.description_details }}" != "" ]; then
        WORK_ITEM_DATA+="Detalhes: <b>${{ parameters.description_details }}</b> 🌄<br><br>"
      fi

      WORK_ITEM_DATA+="---<br><br>"

      echo "##[command]*** INFORMAÇÕES SOBRE A PIPELINE ***"
      echo "##[section]$WORK_ITEM_DATA"

      AREA_PATH="${{ parameters.area_path }}"
      ITERATION_PATH="${{ parameters.iteration_path }}"
      WORK_ITEM_TYPE="${{ parameters.work_item_type }}"
      
      CREATE_WIT=$(az boards work-item create \
        --title "$WORK_ITEM_TITLE" \
        --description "$WORK_ITEM_DATA$STATUS_MESSAGE" \
        --type $WORK_ITEM_TYPE \
        --project "$(System.TeamProject)" \
        --org "$(System.TeamFoundationCollectionUri)" \
        --fields "System.AreaPath=$AREA_PATH" "System.IterationPath=$ITERATION_PATH")
      
      echo "Resposta: $CREATE_WIT"

    displayName: ${{ parameters.display_name }}
    env: 
      AZURE_DEVOPS_EXT_PAT: $(SYSTEM_ACCESS_TOKEN_JOBS)
    condition: ${{ parameters.condition }}