parameters:
- name: newVersion
  type: string
- name: condition
  type: object
- name: createGitTag
  type: boolean
  default: false
- name: workingDirectory
  type: string
  default: ''
- name: workingDirectoryCore
  type: string
  default: ''
- name: repoIsCore
  type: boolean
  default: false
- name: commitNewVersion
  type: boolean
  default: false
- name: downloadDistFolder
  type: boolean
  default: false
- name: condition_version_file
  type: object
  default: false

steps:
- template: /tech_products/ecmc/sap-commerce/tasks/versioning/update_repo_version.yaml
  parameters:
    condition: ${{ parameters.condition }}
    condition_version_file: ${{ parameters.condition_version_file }}
    componentNewVersion: ${{ parameters.newVersion }}
    commitNewVersion: ${{ parameters.commitNewVersion }}
    downloadDistFolder: ${{ parameters.downloadDistFolder }}
    createGitTag: ${{ parameters.createGitTag }}
    workingDirectory: ${{ parameters.workingDirectory }}
    workingDirectoryCore: ${{ parameters.workingDirectoryCore }}
    repoIsCore: ${{ parameters.repoIsCore }}