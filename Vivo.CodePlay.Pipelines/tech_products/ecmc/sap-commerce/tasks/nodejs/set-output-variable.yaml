steps:

- ${{if not(parameters.workdir) }}:
  - script: |
      setVariables(){
        eval result=$2
        echo "##vso[task.setvariable variable=$1;]$result"
      }
      setVariables "${VARIABLE_NAME}" "${VARIABLE_VALUE}"
      echo "VARIABLE_VALUE: $VARIABLE_VALUE"
    displayName: "Set output variable ${{parameters.variable}}"
    env:
      VARIABLE_NAME: ${{parameters.variable}}
      VARIABLE_VALUE: ${{parameters.command}}
      # name: t_set_variable_without_workdir

- ${{if parameters.workdir }}:
  - script: |
      setVariables(){
        eval result=$2
        echo "##vso[task.setvariable variable=$1;]$result"
      }
      setVariables "${VARIABLE_NAME}" "${VARIABLE_VALUE}"
    displayName: "Set output variable ${{parameters.variable}}"
    workingDirectory: "${{ parameters.workdir }}"
    env:
      VARIABLE_NAME: ${{parameters.variable}}
      VARIABLE_VALUE: ${{parameters.command}}
      # name: t_set_variable_with_workdir

