parameters:
- name: newVersion
  type: string
- name: condition
  type: object
- name: workingDirectory
  type: string

steps:
- bash: |
    cd ${{ parameters.workingDirectory }}
    if [[ "$NEW_VERSION " != "" ]]; then
      echo "##[section]Update Build Version:"
              
      # A versão utilizada do NPM é a versão default do Node.js nos agentes
      # Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF) na pasta raiz do projeto 
      npm --no-git-tag-version version $NEW_VERSION --allow-same-version
    else
      echo "##[section]Não foi possível atualizar a versão. A variável NEW_VERSION possui o valor '$NEW_VERSION'"
      exit 1
    fi
  
  displayName: 'Update package.json version'
  condition: ${{ parameters.condition }}
  env:
    NEW_VERSION: ${{ parameters.newVersion }}