steps:
- task: PublishTestResults@2
  name: publish_test_result
  displayName: "Publish Test Results"
  inputs:
    testResultsFiles: "$(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/$(COVERAGE_TEST_OUTPUT_DIR)/$(TEST_OUTPUT_FILE)"
    testRunTitle: "Publish Test Results"
  condition: succeededOrFailed()

- task: PublishCodeCoverageResults@2
  displayName: "Publish Code Coverage Results(V2)" 
  inputs:
    codeCoverageTool: Cobertura
    reportDirectory: "$(Build.SourcesDirectory)/coverage/$FOLDER_BASE_SRC/"
    summaryFileLocation: "$(Build.SourcesDirectory)/$(FOLDER_BASE_SRC)/$(COVERAGE_TEST_OUTPUT_DIR)/$(COVERAGE_OUTPUT_FILE)"
    failIfCoverageEmpty: true
  condition: and(succeededOrFailed(), eq(variables.PUBLISH_CODE_COVERAGE, true))