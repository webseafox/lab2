parameters:
- name: environment_code
  type: string
  default: ''

stages:
  - stage: run_automated_tests
    dependsOn:
    - deploy
    displayName: "Run automated tests"
    pool:
      name: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: pre_start_run_tests
        workspace:
          clean: all
        condition: succeeded()
        displayName: "Prepare to run tests"
        steps:
          - checkout: none
          - bash: |
              echo "##[section]Verifying environment"
              if [[ "${ENVIRONMENT_CODE}" == "" ]];then
                echo "##[error]O parâmetro environment_code não pode ser vazio"
                echo "##vso[task.setvariable variable=ALLOW_RUN_TESTS;isOutput=true]false"
              fi

              if echo ";${ENVIRONMENTS_TO_RUN_AUTOMATED_TESTS};" | grep -q ";${ENVIRONMENT_CODE};"; then
                echo "##[section]'${ENVIRONMENT_CODE}' está na lista para execução dos testes automatizados"
                echo "##vso[task.setvariable variable=ALLOW_RUN_TESTS;isOutput=true]true"
              else
                echo "##[section]'${ENVIRONMENT_CODE}' não está na lista para execução dos testes automatizados"
                echo "##vso[task.setvariable variable=ALLOW_RUN_TESTS;isOutput=true]false"
              fi
            displayName: "Verify environment"
            env:
              ENVIRONMENT_CODE: ${{ parameters.environment_code }}

      - job: start_run_tests
        workspace:
          clean: all
        condition: and(succeeded(), eq(variables.ALLOW_RUN_TESTS, 'true'))
        displayName: "Start run automated tests"
        timeoutInMinutes: 120
        steps:
          - checkout: none
          - bash: |
              PIPELINE_ID=$(PIPELINE_ID_AUTOMATED_TESTS)
              BASE_URL_API_LOJA_ONLINE="https://dev.azure.com/telefonica-vivo-brasil/ECMC%20-%20Ecomm%20Cloud%20B2C"
              URL_POST_API="$BASE_URL_API_LOJA_ONLINE/_apis/pipelines/$PIPELINE_ID/runs?api-version=7.1"

              for i in 1 2 3
              do
                BUILD_DATA_RESPONSE=$(curl -s -o $SAP_API_RESPONSE_FILE -w "%{http_code}" \
                                      -X POST -H 'accept: application/json;api-version=7.1' \
                                      -H "Content-Type: application/json" -u ":$(System.AccessToken)" "$URL_POST_API" \
                                      --data "{ \"resources\": { \"repositories\": { \"self\": { \"refName\": \"refs/heads/master\" } } }, \"templateParameters\": { \"ENVIRONMENT_TO_RUN\": \"${{ parameters.environment_code }}\" }  }")

                if [[ "$BUILD_DATA_RESPONSE" == "200" ]];then
                  RESPONSE_BODY=$(cat $SAP_API_RESPONSE_FILE && rm $SAP_API_RESPONSE_FILE)
                  BUILD_ID=$(echo $RESPONSE_BODY | jq -r '.id')
                  echo "##vso[task.setvariable variable=BUILD_ID_RUNNING]$BUILD_ID"
                  echo "##vso[task.setvariable variable=SET_BUILD_ID]$BUILD_ID"
                  break
                fi
              done


              if [ "$BUILD_ID" == null ] || [ "$BUILD_ID" == "" ]; then
                echo "##[error]Não foi possível iniciar os testes para a pipeline de testes automatizados"
                exit 1
              fi  

              URL_GET_BUILDS_API="$BASE_URL_API_LOJA_ONLINE/_apis/build/builds/$BUILD_ID?api-version=7.1"
              
              echo "##[section]BUILD_ID ..........: $BUILD_ID"

              FINALIZE=0
              LAST_STATUS=''
              COUNT=0
              while [ $FINALIZE == 0 ]
              do
                BUILD_DATA_RESPONSE=$(curl -s -o $SAP_API_RESPONSE_FILE -w "%{http_code}" \
                                    -H 'accept: application/json;api-version=7.1' -H "Content-Type: application/json" \
                                    -u :$(System.AccessToken) "$URL_GET_BUILDS_API" | jq -r '.')

                if [[ "$BUILD_DATA_RESPONSE" != "200" ]];then
                  sleep 180
                  continue
                fi
                RESPONSE_BODY=$(cat $SAP_API_RESPONSE_FILE && rm $SAP_API_RESPONSE_FILE)

                STATUS=$(echo $RESPONSE_BODY | jq -r '.status')
                RESULT=$(echo $RESPONSE_BODY | jq -r '.result')
                LINK=$(echo $RESPONSE_BODY | jq -r '._links.web.href')
                if [[ $LAST_STATUS == '' ]]; then
                  echo "##[section]Para visualizar os detalhes do teste acesse $LINK"
                fi

                if [[ $STATUS == 'completed' ]]; then
                  FINALIZE=1

                  if [[ $RESULT == 'succeeded' ]]; then
                    echo "##[section]Pipeline finalizada com sucesso"
                  else
                    echo "##[error]Pipeline finalizada com erro"
                    exit 1
                  fi
                else
                  if [[ $COUNT -ge 5 ]]; then
                    COUNT=0
                  else
                    COUNT=$((COUNT+1))
                  fi

                  if [[ $LAST_STATUS != $STATUS ]] || [[ $COUNT == 0 ]]; then
                    LAST_STATUS=$STATUS
                    echo "##[command]Status .......... : $STATUS"
                  fi
                fi
                sleep 180
              done
            displayName: "Start and watch tests"

          - bash: |
              TESTES_COM_FALHA=""
              echo "##vso[task.setvariable variable=TESTES_COM_FALHA]$TESTES_COM_FALHA"

              cd $(Build.SourcesDirectory)
              if [[ "$(BUILD_ID_RUNNING)" == "" ]];then
                exit 1
              fi

              HTTP_CODE_RESPONSE=$(curl -s -w "%{http_code}" -o json_data.json -u ":$(System.AccessToken)" "https://vstmr.dev.azure.com/telefonica-vivo-brasil/ECMC%20-%20Ecomm%20Cloud%20B2C/_apis/testresults/resultsbybuild?buildId=$(BUILD_ID_RUNNING)&api-version=7.1-preview")
              if [[ "$HTTP_CODE_RESPONSE" != "200" ]];then
                  exit 1
              fi
              BUILD_DATA=$(cat json_data.json | jq -c '.value')
              rm -f json_data.json
              while read DATA; do
                while read ITEMS; do
                  TEST_ID=$(echo "$ITEMS" | jq -r '.runId')
                  TEST_NAME=$(echo "$ITEMS" | jq -r '.automatedTestStorage')
                  TEST_NAME="${TEST_NAME//\./_}"
                  TEST_STATUS=$(echo "$ITEMS" | jq -r '.outcome')
                  echo "##[section]TEST ID: ........... $TEST_ID"
                  echo "##[section]TEST NAME: ......... $TEST_NAME"
                  echo "##[section]TEST STATUS: ....... $TEST_STATUS"
                  rm -rf json_data.json

                  if [[ "$TEST_STATUS" == "Failed" ]];then
                    TESTES_COM_FALHA="$(TESTES_COM_FALHA)\n$TEST_NAME"
                    echo "##vso[task.setvariable variable=TESTES_COM_FALHA]$TESTES_COM_FALHA"
                  fi

                  RESPONSE=$(curl -s -w "%{http_code}" -o json_data.json -u ":$(System.AccessToken)" "https://vstmr.dev.azure.com/telefonica-vivo-brasil/ECMC%20-%20Ecomm%20Cloud%20B2C/_apis/testresults/runs/$TEST_ID/attachments?api-version=7.1-preview" | jq -r '.')
                  if [[ "$RESPONSE" == "200" ]];then
                    TEST_RESULTS_DATA=$(cat json_data.json | jq -c '.value')
                    rm -f json_data.json
                    while read TEST_RESULT; do
                      URL_DOWNLOAD=$(echo $TEST_RESULT | jq -r '.[].url')
                      FILENAME=$(echo $TEST_RESULT | jq -r '.[].fileName')                      
                      curl -s -u ":$(System.AccessToken)" -o "$FILENAME" "$URL_DOWNLOAD"
                    done < <(echo "$TEST_RESULTS_DATA")
                  fi
                done < <(echo "$DATA" | jq -c '.[]')
              done < <(echo "$BUILD_DATA")
            displayName: "Download test results"

          - task: CopyFiles@2
            displayName: "Copy result files"
            inputs:
              SourceFolder: $(Build.SourcesDirectory)/
              TargetFolder: "$(Build.ArtifactStagingDirectory)"
              OverWrite: true
              CleanTargetFolder: true
              Contents: |
                $(Build.SourcesDirectory)/*.xml
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: "Publish test results as artifact"
            inputs:
              artifactName: "test_results_$(System.JobAttempt)"
              targetPath: "$(Build.ArtifactStagingDirectory)"
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(Build.SourcesDirectory)/*.xml"
              # mergeTestResults: False
              # testRunTitle: "Test results automated tests"
            condition: succeededOrFailed()

          - bash: |
              echo  "##[section]TESTES COM FALHA"
              echo -e "##[section]$(TESTES_COM_FALHA)"

              #variable STOP_ON_FAILED_TEST  variablegroups.lojaonline-sap-commerce-cloud.STOP_ON_FAILED_TEST
              if [ "$(STOP_ON_FAILED_TEST)" == "true" ];then
                exit 1
              fi
            condition: succeededOrFailed()
            displayName: "Show Tests failed"

          - bash: |
              if [[ "$SET_BUILD_ID" == "" ]];then
                exit 0
              fi

              BASE_URL_API_LOJA_ONLINE="https://dev.azure.com/telefonica-vivo-brasil/ECMC%20-%20Ecomm%20Cloud%20B2C"
              URL_BUILDS_API="$BASE_URL_API_LOJA_ONLINE/_apis/build/builds/$SET_BUILD_ID?api-version=7.1"
              FINALIZE=0
              LAST_STATUS=''
              COUNT=0
              BODY_DATA='{"status": "Cancelling"}'

              while [ $FINALIZE == 0 ]
              do
                echo $URL_BUILDS_API
                DATA=$(curl -s -H 'accept: application/json;api-version=7.1' -H "Content-Type: application/json" \
                      -u :$(System.AccessToken) -X PATCH "$URL_BUILDS_API" \
                      --data "$BODY_DATA" | jq -r '.')

                STATUS=$(echo $DATA | jq -r '.status')
                echo "##[command]Requisição de cancelamento enviada, aguarde"

                echo "##[command]Status ..... : $STATUS"
                if [ "$STATUS" == null ] || [ "$STATUS" == "" ]; then
                  sleep 2
                  if [[ $COUNT -ge 3 ]]; then
                    FINALIZE=1
                  fi
                  COUNT=$((COUNT+1))
                else
                  if [[ $STATUS == 'cancelling' ]]; then
                    FINALIZE=1
                  fi

                  if [[ $STATUS == 'completed' ]]; then
                    URL_BUILD_ID="$BASE_URL_API_LOJA_ONLINE/_build/results?buildId=$SET_BUILD_ID&view=results"
                    echo "##[error]Não foi possível concluir o cancelamento. Acesse $URL_BUILD_ID para visualizar detalhes"
                    FINALIZE=1
                  fi
                fi

              done

            condition: and(always(), eq(succeededOrFailed(), false))
            displayName: "Kill tests"