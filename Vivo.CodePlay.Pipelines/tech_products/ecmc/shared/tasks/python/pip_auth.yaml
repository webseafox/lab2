parameters:
- name: condition
  type: object

steps:
- task: PipAuthenticate@1
  displayName: 'Pip Authenticate'
  inputs:
    artifactFeeds: $(AZURE_ARTIFACTS_FEED)
  env:
    http_proxy: $(PROXY_NSKP_HTTP)
    https_proxy: $(PROXY_NSKP_HTTPS)
    no_proxy: $(PROXY_NSKP_NO_PROXY)
  condition: ${{ parameters.condition }}

- bash: |
    set -uo pipefail
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    CONFIG_FILE_PATH=".tool-versions"

    if [ ! -f "${CONFIG_FILE_PATH}" ]; then
      echo -e "$(DEFAULT_PYTHON_VERSION_SCRIPTS)\n" > "${CONFIG_FILE_PATH}"
    fi
    CUSTOM_PYTHON_VERSION=$(awk '/^python[[:space:]]/{print $2; exit}' "${CONFIG_FILE_PATH}")
    asdf local python "${CUSTOM_PYTHON_VERSION}"
    PYTHON_DIR=$(asdf where python "${CUSTOM_PYTHON_VERSION}")
    echo "##vso[task.prependpath]${PYTHON_DIR}/bin"
  displayName: "Config Python version"
  condition: ${{ parameters.condition }}

- bash: |
    echo "[command]Using python version $(python --version)"
    set -uo pipefail
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    python -m pip install --upgrade pip

    echo "[section]Creating virtual environment"
    python -m venv .venv

    source .venv/bin/activate
  displayName: "Install venv and create virtual env"
  condition: ${{ parameters.condition }}

- bash: |
    echo "[section]Using python version $(python --version)"
    echo "[command] Instalando requirements.txt"
    cd $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts
    python -m pip install -r requirements.txt
  condition: ${{ parameters.condition }}
  displayName: "Install Python packages"
