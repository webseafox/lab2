parameters:
  - name: environment
    type: string
    default: preprod
    values:
      - preprod
      - esteira1
      - esteira2

variables:
  - template: /.azuredevops/variables/private.yml@self

stages:
  - stage: CargaODS
    displayName: 'Carga ODS'
    pool:
      name: $(PRIVATE_AGENT_DEFAULT)
    jobs:
      - job: ExecuteCargaODS
        displayName: 'Executar Carga ODS'
        timeoutInMinutes: 150
        steps:
          - checkout: self
            displayName: "Checkout do código"

          - task: PipAuthenticate@1
            displayName: "Pip Authenticate"
            inputs:
              artifactFeeds: DevOps
            env:
              http_proxy: http://10.240.58.39:3128
              https_proxy: http://10.240.58.39:3128
              no_proxy: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net,vault.azure.net"
            condition: succeeded()

          - bash: |
              set -euo pipefail

              echo "##[group]Criando ambiente virtual"
              python -m venv .venv
              source .venv/bin/activate
              python -m pip install --upgrade pip
              echo "##[endgroup]"

              echo "##[group]Instalando dependências"
              python -m pip install -r requirements.txt
              echo "##[endgroup]"

            displayName: 'Instalar dependências'

          - bash: |
              source .venv/bin/activate

              AMBIENTE="${{ parameters.environment }}"

              echo "##[group]Executando Carga ODS"
              echo "Ambiente: $AMBIENTE"
              echo "Usuário: $(Build.RequestedFor)"
              echo "Build: $(Build.BuildId)"
              echo "##[endgroup]"

              python -m src.scripts.load_pipeline \
                --environment "$AMBIENTE" \
                --user "$(Build.RequestedFor)" \
                --pipeline-url "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
            env:
              CONFLUENCE_URL: $(CONFLUENCE_URL)
              CONFLUENCE_USERNAME: $(CONFLUENCE_USERNAME)
              CONFLUENCE_TOKEN: $(CONFLUENCE_TOKEN)
              CONFLUENCE_PAGE_ID: $(CONFLUENCE_PAGE_ID)
              AZURE_PREPROD_ACCOUNT_NAME: $(AZURE_PREPROD_ACCOUNT_NAME)
              AZURE_PREPROD_ACCOUNT_KEY: $(AZURE_PREPROD_ACCOUNT_KEY)
              AZURE_ESTEIRA1_ACCOUNT_NAME: $(AZURE_ESTEIRA1_ACCOUNT_NAME)
              AZURE_ESTEIRA1_ACCOUNT_KEY: $(AZURE_ESTEIRA1_ACCOUNT_KEY)
              AZURE_ESTEIRA2_ACCOUNT_NAME: $(AZURE_ESTEIRA2_ACCOUNT_NAME)
              AZURE_ESTEIRA2_ACCOUNT_KEY: $(AZURE_ESTEIRA2_ACCOUNT_KEY)
              AZURE_D2_ACCOUNT_NAME: $(AZURE_D2_ACCOUNT_NAME)
              AZURE_D2_ACCOUNT_KEY: $(AZURE_D2_ACCOUNT_KEY)
              AZURE_STORAGE_CONTAINER_NAME: $(AZURE_STORAGE_CONTAINER_NAME)
              AZURE_HOTFOLDER_PATH: $(AZURE_HOTFOLDER_PATH)
              AZURE_AMDOCS_FOLDER_NAME: $(AZURE_AMDOCS_FOLDER_NAME)
              AZURE_AMDOCS_MAX_WAIT_TIME: $(AZURE_AMDOCS_MAX_WAIT_TIME)
              AZURE_AMDOCS_POLLING_INTERVAL: $(AZURE_AMDOCS_POLLING_INTERVAL)
              TEAMS_CHAT_ID: $(TEAMS_CHAT_ID)
              TEAMS_SUCCESS_CHAT_ID: $(TEAMS_SUCCESS_CHAT_ID)
              TEAMS_FAILURE_CHAT_ID: $(TEAMS_FAILURE_CHAT_ID)
              SEND_MESSAGE_TEAMS: $(SEND_MESSAGE_TEAMS)
              AZURE_ALLOWED_FILE_PREFIXES: $(AZURE_ALLOWED_FILE_PREFIXES)
              GRAFANA_CARGA_ODS_URL: $(GRAFANA_CARGA_ODS_URL)
            displayName: 'Executar Carga ODS'

          - bash: |
              echo "##[section]Carga ODS concluída com sucesso!"
            condition: succeeded()
            displayName: 'Sucesso'

          - bash: |
              echo "##[error]Carga ODS falhou. Verifique os logs."
              exit 1
            condition: failed()
            displayName: 'Falha'
