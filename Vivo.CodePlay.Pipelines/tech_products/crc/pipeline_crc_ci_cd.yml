trigger: none
parameters:
  - name: environment
    type: string
    values:
    - qa1
    - qa2
    - qa3
    - prod1
    - prod2
    default: qa2
  - name: packageName
    type: string
    default: crc
  - name: packageVersion
    type: string
    default: '1.0.0'
  - name: dry_run
    type: boolean
    default: true
  - name: CHG
    type: string
    default: 'CHG00011'
  - name: pipeline_mode
    type: string
    values:
      - "CI"
      - "CD"
      - "CI-CD"
    default: "CI-CD"
stages:
 - template: dry_run.yml
   parameters:
     dry_run: ${{ parameters.dry_run }}
     packageName: ${{ parameters.packageName }}
     packageVersion: ${{ parameters.packageVersion }}
     CHG: ${{ parameters.CHG }}
     environment: ${{ parameters.environment }}
 - template: ci_upload_external_package.yml
   parameters:
     packageName: ${{ parameters.packageName }}
     pipeline_mode: ${{ parameters.pipeline_mode }}
     dry_run: ${{ parameters.dry_run }}
 - template: ci_publish_package.yml
   parameters:
     packageName: ${{ parameters.packageName }}
     packageVersion: ${{ parameters.packageVersion }}
     pipeline_mode: ${{ parameters.pipeline_mode }}
     dry_run: ${{ parameters.dry_run }}
 - template: cd_deploy_package.yml
   parameters:
     environment: ${{ parameters.environment }}
     packageName: ${{ parameters.packageName }}
     packageVersion: ${{ parameters.packageVersion }}
     dry_run: ${{ parameters.dry_run }}
     CHG: ${{ parameters.CHG }}
     pipeline_mode: ${{ parameters.pipeline_mode }}