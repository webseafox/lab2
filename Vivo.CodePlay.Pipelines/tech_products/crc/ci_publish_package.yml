parameters:
  - name: packageName
  - name: packageVersion
  - name: pipeline_mode
  - name: dry_run

stages:
  - stage: ci_publish_package
    displayName: "CI - Publish Package on Feed"
    pool: GeneralPurposeLinuxAgentsCD
    jobs:
    - job: Publish
      displayName: "Downloading Package from Pipeline Artifact"
      condition: and(or(eq('${{ parameters.pipeline_mode }}','CI'), eq('${{ parameters.pipeline_mode }}','CI-CD')), eq('${{ parameters.dry_run }}', 'False'))
      steps:
        ## -> Download Artifacts
        - download: none
        - task: DownloadPipelineArtifact@1
          displayName: Download Artifact
          inputs:
            buildType: "current"
            downloadPath: "$(Build.ArtifactStagingDirectory)"

        # Verifica se o pacote já existe no feed
