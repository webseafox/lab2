## -> Parameters:
parameters:
  - name: packageName
  - name: pipeline_mode
  - name: dry_run

stages:
  - stage: ci_upload_async
    displayName: "CI - Upload External Package"
    jobs:
      - job: upload_files
        displayName: "Files Upload"
        pool: Server
        condition: and(or(eq('${{ parameters.pipeline_mode }}','CI'), eq('${{ parameters.pipeline_mode }}','CI-CD')), eq('${{ parameters.dry_run }}', 'False'))
        steps:
          - task: ManualValidation@0
            displayName: "Waiting Upload and Approval"
            inputs:
              notifyUsers: "" # string. Required. Notify users.
              instructions: |
                Pré-requisitos:
                - Possuir usuario telefonicati.onmicrosoft.com
                - Possuir permissão de acesso ao Azure DevOps
                - Possuir permissão de acesso ao projeto $(System.TeamProject)
                Configuração passo a passo:
                1) Instale o azure cli (https://learn.microsoft.com/en-us/azure/devops/cli/?view=azure-devops)
                2) Faça login:
                  az login
                3) Faça upload do artefato:
                  az pipelines runs artifact upload --artifact-name ${{ parameters.packageName }} --path <PATH-TO-FILE>/<FILENAME> --run-id $(Build.BuildId) --organization $(System.CollectionUri) --project $(System.TeamProject)
                4) Após o upload, clique em 'Resume' para continuar.
              onTimeout: "reject" # 'reject' | 'resume'. On timeout. Default: reject.
