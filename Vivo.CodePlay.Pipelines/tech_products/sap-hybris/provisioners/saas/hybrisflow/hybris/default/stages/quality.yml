stages:

- stage: quality_gates
  displayName: "Quality Gates"
  dependsOn: build_test
  pool: $(GENERAL_PURPOSE_CI_AGENT)
  jobs:
    - job: sonarqube_java
      condition: and( succeeded(), eq(variables.flowIsToReview, true), ne(variables.skip_sonarqube, true), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
      displayName: Code Analysis
      steps:
      - template: /tasks/bash/welcome.yml@CorePipeline
      - template: /tech_products/sap-hybris/global/general/set-output-variable.yml@CorePipeline
        parameters:
          variable: SONAR_PROJECT_KEY_JAVA
          command: $(DOCKER-CMD-EXTRACT-SONAR-PROJECT-KEY)
      - template: /tech_products/sap-hybris/global/general/set-output-variable.yml@CorePipeline
        parameters:
          variable: APP_VERSION_JAVA
          command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)
      - template: /task_groups/gates/run_sonarqube_scan.yml@CorePipeline
        parameters:
          stack: "JAVA"
          configFile: ".azuredevops/ant/sonar-project.properties"
          workdirArtifacts: $(Build.ArtifactStagingDirectory)/$(SCC_JAVA_FOLDER_NAME)
          artifactName: $(SCC_JAVA_FOLDER_NAME)
          artifactType: "pipeline"
          projectKey: "$(SONAR_PROJECT_KEY_JAVA)-$(SCC_JAVA_FOLDER_NAME)"
          version: $(APP_VERSION_JAVA)
      - template: /tech_products/sap-hybris/tasks/telemetry/telemetry.yml@CorePipeline