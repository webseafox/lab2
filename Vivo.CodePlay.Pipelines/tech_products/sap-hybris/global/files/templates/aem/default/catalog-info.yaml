#|               Evite alterar este arquivo                 |
#|              Só altere se for recomendado                |
#| Alterações erradas podem impactar a entrega da aplicação |
#+----------------------------------------------------------+
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: [component_name]
  namespace: azure
  description: "[component_name]"
  tags:
    - aem
    - telefonica-vivo-brasil
    - ecomb2b
  annotations:
    # Backstage default annotations  
    backstage.io/techdocs-ref: dir:.
    backstage.io/code-coverage: scm-only
    backstage.io/kubernetes-id: "[component_name]"  
    backstage.io/kubernetes-namespace: ""
    # KUBERNTES
    vivo.io/kubernetes-k8s-namespace-dev: "devops"
    vivo.io/kubernetes-k8s-namespace-esteira1: "devops"
    vivo.io/kubernetes-k8s-namespace-esteira2: "devops"
    vivo.io/kubernetes-k8s-namespace-preprod: "devops"
    vivo.io/kubernetes-k8s-namespace-prodlike: "devops"
    vivo.io/kubernetes-k8s-namespace-producao: "devops"
    # Azure DevOps Plugin
    dev.azure.com/project-repo: "ECOMB2B - Ecommerce B2B/[component_name]"
    # Sonarqube Plugin
    sonarqube.org/project-key: "[component_name]"
    # Arquitetura
    arqtech.telefonica.com.br/architecture: 'code'
    arqtech.telefonica.com.br/domain: "devops"
    arqtech.telefonica.com.br/sub-domain: "vivo-core-pipeline"
    # Framework
    arqtech.telefonica.com.br/framework: aem
    arqtech.telefonica.com.br/framework-version: '6.5.7'
    # Language
    tech.kode3/stack: java
    arqtech.telefonica.com.br/language: java
    arqtech.telefonica.com.br/language-version: "11"
spec:
  type: service
  lifecycle: experimental   
  owner: "devops"
  system: "vivo-core-pipeline"