###
### ISTO NAO E UM TEMPLATE 
###
### E UM TESTE PARA DOWNLOAD DE DEPENDENCIAS DO NEXUS 
###    REF. ./pipeline-deploy-nexus.yml OU ./pipeline.yml
###


trigger: none
parameters:
- name: useMavenCache
  displayName: Usar cache do maven
  type: boolean
  default: True

#Incluir Variaveis da Library
variables:
  - name: ASDF_JDK_8
    value: "adoptopenjdk-8.0.352+8"
  - name: ASDF_JDK_11
    value: "openjdk-11.0.2"
  - name: System.debug
    value: "true"
  - name: USE_MAVEN_CACHE
    ${{ if not(not(parameters.useMavenCache)) }}:
      value: ''
    ${{ if not(parameters.useMavenCache) }}:
      value: '-U'  
  - group: ci.ci-gps2-resources-creds

stages:
- stage: test_nexus
  displayName: Test Nexus Artifacts
  jobs:
  - job: install
    displayName: Install dependencies
    pool: DefaultDevOpsAgents
    steps:

    # https://dev.azure.com/telefonica-vivo-brasil/MIGR-Gps2/_library?itemType=SecureFiles
    - task: DownloadSecureFile@1      
      displayName: 'Get settings-gps2.xml'
      name: GPS2_NEXUS_SETTINGS
      continueOnError: false
      inputs:
        actionOnNoFiles: 'error'
        secureFile: settings-gps2.xml

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'
        RunAsPreJob: true

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |-
          cat > pom.xml <<EOF
          <project 
            xmlns="http://maven.apache.org/POM/4.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd"
          >
            <modelVersion>4.0.0</modelVersion>

            <groupId>br.com.vivo.teste</groupId>
            <version>1.0.0</version>
            <name>gps-test-dependencies</name>
            <artifactId>gps-test-dependencies</artifactId>
            <packaging>jar</packaging>

            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <dependencies>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>admin-common-ui</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>admin-external-common-ui</artifactId> <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>common-model</artifactId>             <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>common-ui</artifactId>                <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>admin-next-business</artifactId>      <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>common-business</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>admin-next-ear</artifactId>           <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>admin-next-web</artifactId>           <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>engine-business</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>external-common-business</artifactId> <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>next-common-business</artifactId>     <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-common-business</artifactId>   <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-common-ui</artifactId>         <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-diagnostic-next-</artifactId>  <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-external-common-ui</artifactId><version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-next-api</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-next-api-business</artifactId> <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-next-business</artifactId>     <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-next-ear</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
              <dependency> <groupId>br.com.vivo.gps4</groupId> <artifactId>wizard-next-web</artifactId>          <version>4.1.2080-code-play-v2-841054</version> </dependency>
            </dependencies>
          </project>
          EOF

    - task: Maven@3
      displayName: Maven Test and Pack
      continueOnError: False
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        DEPS_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        DEPS_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        ASDF_JAVA_VERSION: $(ASDF_JDK_8)
      inputs:
          options: > 
            -Dmaven.test.skip=false
            -s $(GPS2_NEXUS_SETTINGS.secureFilePath)
            $(USE_MAVEN_CACHE)
            
          mavenPomFile: $(Build.SourcesDirectory)/pom.xml
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          publishJUnitResults: false
          testResultsFiles: $(Build.SourcesDirectory)/**/surefire-reports/TEST-*.xml
          goals: 'install'

    
