          - task: DownloadBuildArtifacts@1
            displayName: Download Artifacts
            inputs:
              buildType: 'specific'
              project: 'a343d156-bf04-4e77-87d6-c4d4fdd81335'
              pipeline: '18573'
              buildId: '221638'
              buildVersionToDownload: 'specific'
              downloadPath: '$(System.ArtifactsDirectory)'

          # - task: DownloadBuildArtifacts@1
          #   displayName: Get pom.xml
          #   inputs:
          #     buildType: 'current'
          #     downloadPath: '$(System.ArtifactsDirectory)'

          - task: XmlParseFromVivo@4
            displayName: Get Main Info
            name: pom_info
            inputs:
              type: 'file'
              origin: $(System.ArtifactsDirectory)/bin/pom.xml
              jpaths: |
                var POM_XML_VERSION      =  .project.version._text
                var POM_XML_GROUP_ID     =  .project.groupId._text
          
          - task: NexusUploadMvnFromVivo@5
            continueOnError: true
            displayName: Upload admin-co-business
            inputs:
              nexusEndpoint: "Nexus Asis"
              nexusRepoMaven: "gps2-mvn"
              groupId: $(POM_XML_GROUP_ID)
              generatePom: false
              artifactId: admin-co-business
              artifactVersion: $(POM_XML_VERSION)
              artifactFile1: $(System.ArtifactsDirectory)/bin/admin-co-business/target/ADMIN-CO-BUSINESS.$(POM_XML_VERSION).jar
              artifactExtension1: jar
              artifactFile2: $(System.ArtifactsDirectory)/bin/admin-co-business/pom.xml
              artifactExtension2: pom
