trigger:
  branches:
    exclude:
      - '*'
  paths:
    exclude:
      - '*'
  
parameters:
- name: useMavenCache
  displayName: Usar cache do maven
  type: boolean
  default: True
 
#Incluir Variaveis da Library
variables:
  - name: System.debug
    value: "true"
    
stages:
- stage: deploy
  displayName: Deploy
  jobs:
  - deployment: deploy_on_nexus
