## -> Parameters:
parameters:
- name: environment
  type: string
  default: ''
- name: skipDeploy
  type: boolean
  default: false
- name: packageVersion
  type: string
  default: ''
- name: proxy
  type: string
  default: "nskp.redecorp.br:8080"
- name: buildConfiguration
  type: string
  default: "Release"
- name: entrypoint
  type: string
  default: '.'
- name: dotnetVersion
  type: string
  default: "8.0.300"
- name: kubernetesServiceConnectionEnabled
  default: false
## -> Resources:
resources:
  repositories:
  
  ## -> Fortify
  - repository: FortifyExclusion
    name: DevOps/Vivo.Fortify.Exclusions
    type: git
    ref: refs/heads/master
    endpoint: CorePipelines
  
## -> Initialize global variables
variables:
  - name: REGISTRY_SERVICE_CONNECTION
    value: "ACR-DEVOPS"
  - name: SKIP_SCAN
    value: 'false'
  - name: AKV_DEVOPS_NAME
    value: "kv-azdevops-shared"
  - name: DT_SCA_ENDPOINT
    value: "https://sca.redecorp.br/api"
  - name: CACORP_LOCATION
    value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"
  - name: REGISTRY_NAME
    value: acrsharedservices01.azurecr.io
  - name: PROXY
    value: ${{ parameters.proxy }}
  - name: NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"

  - template: /tech_products/hrcl/templates/common/initialize/variables_global.yml
    parameters:
      environment: "${{ parameters.environment }}"
  - template: /tech_products/hrcl/templates/common/initialize/variables_gates.yml
  - template: /tech_products/hrcl/templates/common/initialize/variables_docker.yml
  ## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
  ## -> Use this to change the variables on runtime
  - group: "${{ variables['Build.DefinitionName'] }}"
  - group: "common-variables"

  ## -> Whether branch is dev, esteira1, esteira2, preprod, prodlike or producao, set environment to branch name, 
  ## -> Otherwise use parameter environment
  - ${{ if in(variables['Build.SourceBranchName'],'dev','esteira1','esteira2','preprod','prodlike','producao' )}}:
      - name: environment
        value: ${{variables['Build.SourceBranchName']}}
  - ${{ else }}:
      - name: environment
        value: ${{ parameters.environment }}

stages:

## -> Entrypoint
## -> Use CI-CD pipeline if no package version has been provided
## -> Use CD only pipeline if package version has been provided
- ${{ if or(eq(parameters.packageVersion, ''), eq(parameters.packageVersion, 'none')) }}: 
  - template: /tech_products/hrcl/templates/dotnet/pipeline_ci_cd.yml
    parameters:
      environment: "${{ variables.environment }}"
      skipDeploy: "${{ parameters.skipDeploy }}"
      proxy: "${{ parameters.proxy }}"
      packageVersion: "${{ parameters.packageVersion }}"
      buildConfiguration: "${{ parameters.buildConfiguration }}"
      entrypoint: "${{ parameters.entrypoint }}"
      dotnetVersion: "${{ parameters.dotnetVersion }}"
      kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}

- ${{ else }}:
  - template: /tech_products/hrcl/templates/dotnet/pipeline_cd_only.yml
    parameters:
      environment: "${{ parameters.environment }}"
      packageVersion: "${{ parameters.packageVersion }}"
      kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}
