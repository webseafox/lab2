parameters:
  - name: nextVersion
    type: string
  - name: proxy
    type: string
  - name: buildConfiguration
    type: string
  - name: entrypoint
    type: string
  - name: dotnetVersion
    type: string

steps:
  - task: Bash@3
    displayName: "Debug Information"
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        echo ""
        echo "##[debug] IMAGE_VERSION.............: ${{ parameters.nextVersion }}"
        echo "##[debug] PROXY.....................: ${{ parameters.proxy }}"
        echo "##[debug] BUILD_CONFIGURATION.......: ${{ parameters.buildConfiguration }}"
        echo "##[debug] ENTRYPOINT................: ${{ parameters.entrypoint }}"
        echo "##[debug] DOTNET_VERSION............: ${{ parameters.dotnetVersion }}"

  - task: DownloadBuildArtifacts@1
    displayName: 'Download Build Artifacts'
    inputs:
      artifactName: bin
      downloadPath: '$(Build.ArtifactStagingDirectory)'

  - task: ExtractFiles@1
    inputs:
      archiveFilePatterns: '$(Build.ArtifactStagingDirectory)/**/*.zip'
      destinationFolder: '$(Build.SourcesDirectory)/bin'
      cleanDestinationFolder: true
      overwriteExistingFiles: true

  - task: Docker@2
    displayName: "Docker Login"
    condition: succeeded()
    inputs:
      containerRegistry: $(REGISTRY_SERVICE_CONNECTION)
      command: login

  - task: Docker@2
    displayName: "Docker Login on ACR"
    condition: succeeded()
    inputs:
      containerRegistry: "ACR-DEVOPS"
      command: login

  # ==================================================================
  # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
  # ==================================================================
  - task: VivoDevOpsConfigCompliance@1
    displayName: 'Check DevOps Config Compliance'
    inputs:
      workDir: $(Build.SourcesDirectory)
      policySets: |
        image-definition-files

  - task: Docker@2
    displayName: "Docker Build"
    condition: succeeded()
    inputs:
      containerRegistry: "ACR-DEVOPS"
      command: build
      repository: $(GOV_APP_ACRONYM)/$(Build.Repository.Name)
      Dockerfile: $(Build.SourcesDirectory)/.azuredevops/runtime.Dockerfile
      buildContext: '$(Build.SourcesDirectory)'
      tags: |
        ${{ parameters.nextVersion }}

  - task: Docker@2
    displayName: Docker Push
    inputs:
      containerRegistry: $(REGISTRY_SERVICE_CONNECTION)
      repository: $(GOV_APP_ACRONYM)/$(Build.Repository.Name)
      command: push
      tags: |
        ${{ parameters.nextVersion }}
    condition: succeeded()

  - task: Bash@3
    displayName: "Clean Up"
    condition: always()
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        echo "##[command] docker rmi ${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
        docker rmi ${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_VERSION}
    env:
      REGISTRY: $(REGISTRY_NAME)
      IMAGE_REPOSITORY: $(GOV_APP_ACRONYM)/$(Build.Repository.Name)
      IMAGE_VERSION: ${{ parameters.nextVersion }}

  - template: /tech_products/hrcl/templates/tasks/artifacts/publish_app.yml
    parameters:
      artifactPublishName: 'app'