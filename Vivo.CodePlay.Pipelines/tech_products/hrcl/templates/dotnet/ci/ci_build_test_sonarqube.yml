parameters:
  - name: nextVersion
    type: string
  - name: proxy
    type: string
  - name: buildConfiguration
    type: string
  - name: entrypoint
    type: string
  - name: dotnetVersion
    type: string

steps:
## -> Download SONARQUBE Token
- task: AzureKeyVault@2
  displayName: 'Getting AKV SonarQube Credentials'
  timeoutInMinutes: 1
  retryCountOnTaskFailure: 5
  inputs:
    azureSubscription: DevOpsSharedResources
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'SONARQUBE-TOKEN, SONARQUBE-TOKEN-TAG'

## -> Set SONARQUBE credentials to variables. This allows it to used in other stages, jobs or tasks.
- task: Bash@3
  displayName: 'Set SonarQube Credentials Variables'
  name: sonarqube_credentials
  condition: succeeded()
  continueOnError: false
  inputs:
    targetType: inline
    script: |
      echo "##[group] Secrets for SONARQUBE"

      echo "##vso[task.setvariable variable=SONARQUBE_TOKEN;isSecret=true]$(SONARQUBE-TOKEN)"

      echo "##[endgroup]"
      echo "##[debug] To open and check the information above, click the arrows on the left."
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'SONARQUBE-TOKEN'

## -> Setup Project and Quality Gate
- task: Bash@3
  displayName: 'Setup Project and Quality Gate'
  name: setup_quality_gate
  condition: succeeded()
  continueOnError: true
  inputs:
    targetType: inline
    script: |
      url="$(SONARQUBE_URL)"
      token="$(SONARQUBE_TOKEN)"
      projectKey="$(SONAR_PROJECT_KEY)"
      projectName="$(System.TeamProject)-$(Build.Repository.Name)"
      projectQualityGate="$(SONARQUBE_PROJECT_QUALITYGATE)"
      defaultQualityGate="$(SONARQUBE_DEFAULT_QUALITYGATE)"
      
      echo "##[debug] URL:......................: $url"
      echo "##[debug] ProjectKey: ..............: $projectKey"
      echo "##[debug] ProjectName: .............: $projectName"
      echo "##[debug] ProjectQualityGate: ......: $projectQualityGate"
      echo "##[debug] DefaultQualityGate: ......: $defaultQualityGate"

      echo "##vso[task.setvariable variable=SONARQUBE_PROJECT_KEY;]$projectKey"
      echo "##vso[task.setvariable variable=SONARQUBE_PROJECT_NAME]$projectName"

      ## -> If no custom quality gate was provided, use default
      if [[ -z $projectQualityGate ]]; then
        echo "##[debug] Quality Gate not found, using default."
        projectQualityGate="$defaultQualityGate"
      fi

      ## -> Checks if the project exists. If not, creates it.
      echo "##[debug] Cheking if project exists on SonarQube..."
      projectExists=$(curl -s -X GET -u $token: "$url/api/projects/search?projects=$projectKey" | jq '.paging.total' | sed 's/null/0/g')

      echo "##[debug] Project Exists: $projectExists"

      if [[ "$projectExists" -ne 1 ]]; then
          echo "##[debug] Project do not exists, creating..."
          echo "##[debug] Using curl --data-urlencode for automatic character encoding"
          
          projectStatus=$(curl -s -X POST -o ./.tmp.sonar.out -w "%{http_code}" -u $token: \
            --data-urlencode "name=$projectName" \
            --data-urlencode "project=$projectKey" \
            --data-urlencode "visibility=public" \
            "$url/api/projects/create")

          echo "##[debug] Project Status: $projectStatus"

          if [[ "$projectStatus" -eq 200 ]]; then
            echo "##[debug] SonarQube project created for key $(SONAR_PROJECT_KEY)"
          else
            echo "##[error] Error to create SonarQube project for key $(SONAR_PROJECT_KEY)"
            echo "##[error] $(cat ./.tmp.sonar.out | jq '.errors[0].msg')"
          fi
      fi

      ## -> Checks if the project's Quality Gate exists. If not, use default.
      projectQualityGateStatus=$(curl -s -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/show?name=$projectQualityGate")

      if [[ "$projectQualityGateStatus" -eq 200 ]]; then
        echo "##[debug] Quality Gate found for $projectQualityGate"
      else
        echo "##[debug] Quality Gate not found, using default."
        projectQualityGate="$defaultQualityGate"
      fi

      ## -> Links the project to its Quality Gate
      echo "##[debug] Linking project to Quality Gate..."

      status=$(curl -s -X POST -o /dev/null -w "%{http_code}" -u $token: "$url/api/qualitygates/select?gateName=$projectQualityGate&projectKey=$projectKey")

      if [[ "$status" -ne 204 ]]; then
        echo "##[error] Error while linking application to Quality Gate!"
        rm -rf ./.tmp.sonar.out
        exit 1;
      fi

      rm -rf ./.tmp.sonar.out

      ## -> Load sonar-project.properties
      
      sonarqubeProperties="$(Build.SourcesDirectory)/.azuredevops/sonar-project.properties"
      if [[ -f $sonarqubeProperties ]]; then
        echo "##[debug] sonar-project.properties found on path: $sonarqubeProperties"
        echo "##[debug] sonar-project.properties loaded."
        echo "##vso[task.setvariable variable=SONARQUBE_PROPERTIES_FILE]$sonarqubeProperties"
      else
        echo "##[debug] sonar-project.properties not found."
        echo "##[debug] Please add the file in the folder .azuredevops of the project."
        exit 1;
      fi

## -> Switching .NET SDK Version
- task: UseDotNet@2
  displayName: 'Switching .NET SDK Version'
  condition: succeeded()
  inputs:
    packageType: "sdk"
    version: ${{ parameters.dotnetVersion }}
    installationPath: $(Agent.ToolsDirectory)/dotnet
    performMultiLevelLookup: true

## -> Restoring .NET Workloads
- script: |
    echo "Restoring .NET Workloads"
    dotnet workload restore --verbosity detailed
  displayName: 'Dotnet Workload Restore'

## -> Prepare analysis on SonarQube for .NET (DEVE vir ANTES do build)
- task: SonarQubePrepare@7
  displayName: 'Prepare SonarQube Analysis'
  condition: succeeded()
  continueOnError: true
  inputs:
    SonarQube: $(SONARQUBE_SERVICE_CONNECTION_NAME)
    scannerMode: dotnet
    configFile: $(SONARQUBE_PROPERTIES_FILE)
    projectKey: $(SONARQUBE_PROJECT_KEY)
    projectName: $(SONARQUBE_PROJECT_NAME)
    projectVersion: $(NEXT_VERSION)
    extraProperties: |
      sonar.scm.disabled=True
      sonar.salesforce.enabled=false
      sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/test-results.trx
      sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/coverage.opencover.xml
      sonar.analysis.repositoryName=$(Build.Repository.Name)
      sonar.analysis.buildId=$(Build.BuildId)
      sonar.analysis.repositoryId=$(Build.Repository.ID)
      sonar.analysis.projectName=$(System.TeamProject)
      sonar.analysis.projectId=$(System.TeamProjectId)
      sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
      sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
      sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
      sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
      sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
      sonar.qualitygate.wait=true
      sonar.verbose=true

## -> Restore .NET Projects
- task: DotNetCoreCLI@2
  displayName: 'Restore .NET Projects'
  condition: succeeded()
  name: Restore
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

## -> Build .NET Projects
- task: DotNetCoreCLI@2
  displayName: 'Build .NET Projects'
  condition: succeeded()
  name: Build
  inputs:
    command: 'build'
    projects: ${{ parameters.entrypoint }}
    arguments: '--configuration $(buildConfiguration) --no-restore'

## -> Run Tests with Coverlet Coverage Collection
- task: Bash@3
  displayName: 'Run .NET Tests with Coverlet Coverage'
  condition: succeeded()
  name: Test
  inputs:
    targetType: inline
    script: |
      echo "=== Executando testes com cobertura Coverlet ==="
      
      # Configurar bash para falhar imediatamente em caso de erro
      set -e
      set -o pipefail
      
      # Definir arquivos de cobertura
      COVERAGE_JSON="$(Build.SourcesDirectory)/coverage.json"
      COVERAGE_OPENCOVER="$(Build.SourcesDirectory)/coverage.opencover.xml"
      BUILD_CONFIG="${{ parameters.buildConfiguration }}"
      
      echo "🔧 Configuração de build: $BUILD_CONFIG"
      
      # Limpar arquivos de cobertura anteriores
      echo "🧹 Limpando arquivos de cobertura anteriores..."
      rm -f "$COVERAGE_JSON" "$COVERAGE_OPENCOVER"
      
      # Encontrar todos os projetos de teste
      TEST_PROJECTS=$(find $(Build.SourcesDirectory) -path "*/tests/**/*.csproj" -type f | sort)
      
      if [ -z "$TEST_PROJECTS" ]; then
        echo "❌ Nenhum projeto de teste encontrado em tests/**/*.csproj"
        exit 1
      fi
      
      echo "📋 Projetos de teste encontrados:"
      echo "$TEST_PROJECTS"
      
      # Analisar referências dos projetos de teste
      echo ""
      echo "🔍 Analisando referências dos projetos de teste..."
      for test_project in $TEST_PROJECTS; do
        echo "📁 Projeto: $test_project"
        PROJECT_REFS=$(grep -o '<ProjectReference.*Include="[^"]*"' "$test_project" 2>/dev/null || echo "Nenhuma referência encontrada")
        echo "   Referências: $PROJECT_REFS"
      done
      
      # Executar primeiro projeto gerando JSON
      FIRST_PROJECT=$(echo "$TEST_PROJECTS" | head -n 1)
      REMAINING_PROJECTS=$(echo "$TEST_PROJECTS" | tail -n +2)
      
      echo ""
      echo "🧪 Executando primeiro projeto: $FIRST_PROJECT"
      
      if ! dotnet test "$FIRST_PROJECT" \
        --configuration "$BUILD_CONFIG" \
        --logger "trx;LogFileName=$(Build.SourcesDirectory)/test-results.trx" \
        --no-restore \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=json \
        /p:CoverletOutput="$COVERAGE_JSON"; then
        echo "❌ Falha nos testes do primeiro projeto: $FIRST_PROJECT"
        exit 1
      fi
      
      # Executar projetos restantes com merge usando JSON
      if [ -n "$REMAINING_PROJECTS" ]; then
        echo ""
        echo "🔄 Executando projetos restantes com merge..."
        
        while IFS= read -r project; do
          if [ -n "$project" ]; then
            echo "🧪 Executando projeto: $project"
            
            if ! dotnet test "$project" \
              --configuration "$BUILD_CONFIG" \
              --no-restore \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=json \
              /p:CoverletOutput="$COVERAGE_JSON" \
              /p:MergeWith="$COVERAGE_JSON"; then
              echo "❌ Falha nos testes do projeto: $project"
              exit 1
            fi
          fi
        done <<< "$REMAINING_PROJECTS"
      fi
      
      echo ""
      echo "✅ Todos os testes executados com sucesso"
      echo "🔄 Convertendo JSON para OpenCover..."
      
      # Converter JSON final para OpenCover usando o primeiro projeto
      if ! dotnet test "$FIRST_PROJECT" \
        --configuration "$BUILD_CONFIG" \
        --no-restore \
        --no-build \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=opencover \
        /p:CoverletOutput="$COVERAGE_OPENCOVER" \
        /p:MergeWith="$COVERAGE_JSON" \
        /p:SkipAutoProps=true; then
        echo "❌ Falha na conversão para OpenCover"
        exit 1
      fi
      
      echo "✅ Arquivo OpenCover gerado: $COVERAGE_OPENCOVER"
      
      # Diagnóstico: Verificar estatísticas gerais de cobertura
      echo ""
      echo "🔍 Diagnóstico - Verificando estatísticas de cobertura..."
      
      if [ -f "$COVERAGE_OPENCOVER" ]; then
        # Contar módulos instrumentados
        TOTAL_MODULES=$(grep -c "<Module " "$COVERAGE_OPENCOVER" 2>/dev/null || echo "0")
        echo "📦 Total de módulos instrumentados: $TOTAL_MODULES"
        
        if [ "$TOTAL_MODULES" -gt 0 ]; then
          echo "✅ Módulos encontrados no relatório de cobertura"
          
          # Verificar se há cobertura real (métodos executados)
          echo "📊 Verificando se há métodos com cobertura executada..."
          
          COVERED_METHODS=$(grep -o 'vc="[^"]*"' "$COVERAGE_OPENCOVER" | grep -v 'vc="0"' | wc -l || echo "0")
          TOTAL_METHODS=$(grep -o 'vc="[^"]*"' "$COVERAGE_OPENCOVER" | wc -l || echo "0")
          
          echo "📈 Métodos com cobertura > 0: $COVERED_METHODS"
          echo "📊 Total de métodos instrumentados: $TOTAL_METHODS"
          
          if [ "$COVERED_METHODS" -gt 0 ] && [ "$TOTAL_METHODS" -gt 0 ]; then
            COVERAGE_PERCENTAGE=$(( (COVERED_METHODS * 100) / TOTAL_METHODS ))
            echo "✅ Taxa geral de cobertura: ${COVERAGE_PERCENTAGE}%"
          else
            echo "⚠️  PROBLEMA: Não há métodos com execução registrada"
            echo "💡 Isso pode indicar que os testes não estão executando código do projeto principal"
          fi
          
          # Listar alguns módulos encontrados
          echo "📋 Amostra de módulos instrumentados:"
          grep -o 'moduleName="[^"]*"' "$COVERAGE_OPENCOVER" | head -5 || true
          
          # Verificar se o SonarQube pode encontrar os arquivos
          echo ""
          echo "🔍 Verificando paths dos arquivos para SonarQube..."
          echo "📂 Diretório de build: $(Build.SourcesDirectory)"
        else
          echo "❌ Nenhum módulo encontrado no relatório de cobertura!"
          echo "🔍 Verificando se o arquivo contém dados válidos..."
          head -10 "$COVERAGE_OPENCOVER" || true
        fi
      fi

## -> Validate Coverage Report Generated by Coverlet
- task: Bash@3
  displayName: 'Validate Coverage Report'
  condition: succeeded()
  inputs:
    targetType: inline
    script: |
      echo "=== Validando arquivos de cobertura do Coverlet ==="
      
      COVERAGE_JSON="$(Build.SourcesDirectory)/coverage.json"
      COVERAGE_OPENCOVER="$(Build.SourcesDirectory)/coverage.opencover.xml"
      
      # Verificar arquivo JSON intermediário
      if [ -f "$COVERAGE_JSON" ]; then
        echo "✅ Arquivo JSON de cobertura encontrado: $COVERAGE_JSON"
        echo "📊 Tamanho JSON: $(wc -c < "$COVERAGE_JSON") bytes"
        
        # Validar se é um JSON válido
        if jq empty "$COVERAGE_JSON" 2>/dev/null; then
          echo "✅ JSON de cobertura é válido"
        else
          echo "❌ Erro: JSON de cobertura é inválido"
          echo "Primeiras 5 linhas do arquivo:"
          head -n 5 "$COVERAGE_JSON"
        fi
      else
        echo "⚠️ Arquivo JSON de cobertura não encontrado: $COVERAGE_JSON"
      fi
      
      # Verificar arquivo OpenCover final
      if [ -f "$COVERAGE_OPENCOVER" ]; then
        echo "✅ Arquivo OpenCover de cobertura encontrado: $COVERAGE_OPENCOVER"
        echo "📊 Tamanho OpenCover: $(wc -c < "$COVERAGE_OPENCOVER") bytes"
        echo "📄 Linhas: $(wc -l < "$COVERAGE_OPENCOVER")"
        
        # Validar se é um XML válido
        if xmllint --noout "$COVERAGE_OPENCOVER" 2>/dev/null; then
          echo "✅ XML de cobertura é válido"
          
          # Mostrar estatísticas básicas do OpenCover
          COVERAGE_SUMMARY=$(xmllint --xpath "//Summary/@*" "$COVERAGE_OPENCOVER" 2>/dev/null || echo "N/A")
          echo "📈 Coverage Summary: $COVERAGE_SUMMARY"
          
          # Contar modules cobertos
          MODULES_COUNT=$(xmllint --xpath "count(//Module)" "$COVERAGE_OPENCOVER" 2>/dev/null || echo "0")
          echo "📦 Modules cobertos: $MODULES_COUNT"
          
          # Mostrar primeiras linhas do XML
          echo "📄 Primeiras 5 linhas do arquivo:"
          head -n 5 "$COVERAGE_OPENCOVER"
          
        else
          echo "❌ Erro: XML de cobertura é inválido"
          echo "Primeiras 10 linhas do arquivo:"
          head -n 10 "$COVERAGE_OPENCOVER"
        fi
        
      else
        echo "❌ Arquivo OpenCover de cobertura não encontrado: $COVERAGE_OPENCOVER"
        echo "🔍 Procurando arquivos de cobertura alternativos..."
        find $(Build.SourcesDirectory) -name "*.opencover.xml" -o -name "*.cobertura.xml" -o -name "coverage.xml" -o -name "*.coverage" -o -name "*.json" | grep -E "(coverage|cover)" | head -10
      fi

## -> Publish Test Results
- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(Build.SourcesDirectory)/test-results.trx'
    failTaskOnFailedTests: false
    publishRunAttachments: true

## -> Publish Code Coverage Results (OpenCover format)
- task: PublishCodeCoverageResults@1
  displayName: 'Publish OpenCover Coverage Results'
  condition: and(always(), or(succeeded(), eq(variables['Agent.JobStatus'], 'SucceededWithIssues')))
  inputs:
    codeCoverageTool: 'JaCoCo' # Use JaCoCo que aceita XML genérico
    summaryFileLocation: '$(Build.SourcesDirectory)/coverage.opencover.xml'
    pathToSources: '$(Build.SourcesDirectory)'
    failIfCoverageEmpty: false

## -> Publish Coverage Files as Pipeline Artifacts
- task: Bash@3
  displayName: 'Prepare Coverage Artifacts'
  condition: and(always(), or(succeeded(), eq(variables['Agent.JobStatus'], 'SucceededWithIssues')))
  inputs:
    targetType: inline
    script: |
      echo "=== Preparando artifacts de cobertura ==="
      
      # Criar diretório para artifacts
      ARTIFACTS_DIR="$(Build.ArtifactStagingDirectory)/coverage-artifacts"
      mkdir -p "$ARTIFACTS_DIR"
      
      # Copiar arquivos de cobertura se existirem
      if [ -f "$(Build.SourcesDirectory)/coverage.json" ]; then
        echo "📄 Copiando coverage.json"
        cp "$(Build.SourcesDirectory)/coverage.json" "$ARTIFACTS_DIR/"
      fi
      
      if [ -f "$(Build.SourcesDirectory)/coverage.opencover.xml" ]; then
        echo "📄 Copiando coverage.opencover.xml"
        cp "$(Build.SourcesDirectory)/coverage.opencover.xml" "$ARTIFACTS_DIR/"
      fi
      
      if [ -f "$(Build.SourcesDirectory)/test-results.trx" ]; then
        echo "📄 Copiando test-results.trx"
        cp "$(Build.SourcesDirectory)/test-results.trx" "$ARTIFACTS_DIR/"
      fi
      
      echo "✅ Artifacts preparados em: $ARTIFACTS_DIR"
      ls -la "$ARTIFACTS_DIR"

## -> Publish Coverage Artifacts
- task: PublishPipelineArtifact@1
  displayName: 'Publish Coverage Artifacts'
  condition: and(always(), or(succeeded(), eq(variables['Agent.JobStatus'], 'SucceededWithIssues')))
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/coverage-artifacts'
    artifactName: 'coverage-reports'
    publishLocation: 'pipeline'

## -> Publish .NET Projects
- task: DotNetCoreCLI@2
  displayName: 'Publish .NET Projects'
  condition: succeeded()
  name: Publish
  inputs:
    command: 'publish'
    publishWebProjects: true
    projects: '${{ parameters.entrypoint }}'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build'

## -> Publish Build Artifacts
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'bin'
    
## -> Run Sonarqube Analysis
- task: SonarQubeAnalyze@7
  displayName: 'Run Code Analysis'
  continueOnError: true
  inputs:
    sonarScannerArgs: '-X'
  env:
    ASDF_JAVA_VERSION: "openjdk-17.0.2"

## -> Get Sonarqube taskId
- task: Bash@3
  displayName: Get Sonar TaskId
  name: sonar_task_id
  condition: succeeded()
  continueOnError: true
  inputs:
    workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
    targetType: inline
    script: |

      ## -> Load report_task
      if [[ -z $(REPORT_TASK_NAME) ]]; then
        echo "##[debug] report not found."
        exit 1;
      else
        sonarTaskId="$(cat $(REPORT_TASK_NAME) | grep -o 'ceTaskId=[^,]*' | awk -F= '{print $2}')"
        echo "##[debug] SONAR_TASK_ID.......: $sonarTaskId"
        echo "##vso[task.setvariable variable=SONAR_TASK_ID;isOutput=true]$sonarTaskId"
      fi

## -> Publish Quality Gate Result
- task: SonarQubePublish@7
  displayName: 'Publish Quality Gate Result'
  continueOnError: true
  inputs:
    pollingTimeoutSec: '300'
  env:
    NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

## -> Verify QualityGate Status
- task: Bash@3
  displayName: Analyze Quality Gate Status
  name: quality_gate_status
  condition: succeeded()
  continueOnError: true
  inputs:
    workingDirectory: $(Agent.TempDirectory)/sonar/$(Build.BuildId)
    targetType: inline
    script: |

      echo "##[debug] SONAR_TASK_ID...............: $(sonar_task_id.SONAR_TASK_ID)"

      sonarTaskUrl="$(SONARQUBE_URL)/api/ce/task?id=$(sonar_task_id.SONAR_TASK_ID)"
      echo "##[debug] SONAR_TASK_URL..............: $sonarTaskUrl"

      analysisId="$(curl -s -u "$(SONARQUBE_TOKEN):" "$sonarTaskUrl" | jq -r '.task.analysisId')"
      echo "##[debug] ANALYSIS_ID.................: $analysisId"

      sonarProjectStatusUrl="$(SONARQUBE_URL)/api/qualitygates/project_status?analysisId=$analysisId"
      echo "##[debug] SONAR_PROJECT_STATUS_URL....: $sonarProjectStatusUrl"

      analysisStatus="$(curl -s -u "$(SONARQUBE_TOKEN):" "$sonarProjectStatusUrl" | jq -r '.projectStatus.status')"
      echo "##[debug] ANALYSIS_STATUS.............: $analysisStatus"

      if [[ "$analysisStatus" == "ERROR" ]]; then
        echo "##vso[task.logissue type=error;] Sonar Quality Gate status is ERROR - View details on step Run Code Analysis."
        echo "##vso[task.complete result=Failed;]"
      fi