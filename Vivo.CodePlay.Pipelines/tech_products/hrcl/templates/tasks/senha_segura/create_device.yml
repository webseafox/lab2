parameters:
- name: deviceHostname
- name: deviceIp
- name: deviceSite
- name: deviceModel
- name: deviceVendor
- name: deviceType
- name: deviceDomain
- name: deviceConnectivities
- name: tags

steps:
- task: PythonScript@0
  displayName: '[PAM] Create Device'
  inputs:
    scriptSource: inline
    script: |
      import requests
      import os
            
      base_url = os.getenv('SENHA_SEGURA_BASE_URL')
      access_token = os.getenv('ACCESS_TOKEN')
      device_hostname = os.getenv('DEVICE_HOSTNAME')
      device_ip = os.getenv('DEVICE_IP')
      device_site = os.getenv('DEVICE_SITE')
      device_model = os.getenv('DEVICE_MODEL')
      device_vendor = os.getenv('DEVICE_VENDOR')
      device_type = os.getenv('DEVICE_TYPE')
      device_domain = os.getenv('DEVICE_DOMAIN')
      device_connectivities = os.getenv('DEVICE_CONNECTIVITIES')
      tags = os.getenv('TAGS')

      def create_device():
        url = base_url + '/iso/pam/device'
        body = {
          'hostname': device_hostname,
          'ip': device_ip,
          'site': device_site,
          'model': device_model,
          'vendor': device_vendor,
          'type': device_type,
          'device_domain': device_domain,
          'device_tags': tags,
          'connectivities': device_connectivities
        }

        print('##[command] POST {} - Criar Dispositivo'.format(url))
        print('##[debug] request_json...................: ', body)
        response = requests.post(
          url,
          headers = {
            'Authorization': 'Bearer ' + access_token,
            'Content-Type': 'application/json'
          },
          json = body,
          verify = False
        )
        response_json = response.json()
        print('##[debug] response_json..................: ', response_json)

        response_code = response_json['response']['status']
        print('##[debug] response_code..................: ', response_code)
        if (response_code != 200) and (response_code != 201):
          raise Exception('##[error] Erro ao criar/atualizar device')

        return response_json

      create_device()
  env:
    SENHA_SEGURA_BASE_URL: $(SENHA_SEGURA_BASE_URL)
    ACCESS_TOKEN: $(SENHA_SEGURA_ACCESS_TOKEN)
    DEVICE_HOSTNAME: ${{ parameters.deviceHostname }}
    DEVICE_IP: ${{ parameters.deviceIp }}
    DEVICE_SITE: ${{ parameters.deviceSite }}
    DEVICE_MODEL: ${{ parameters.deviceModel }}
    DEVICE_VENDOR: ${{ parameters.deviceVendor }}
    DEVICE_TYPE: ${{ parameters.deviceType }}
    DEVICE_DOMAIN: ${{ parameters.deviceDomain }}
    DEVICE_CONNECTIVITIES: ${{ parameters.deviceConnectivities }}
    TAGS: ${{ parameters.tags }}