parameters:
- name: appName
- name: appNamespace

steps:
- script: |
    echo "##[debug] Initiating rollback of the application '${{ parameters.appName }}' in the namespace '${{ parameters.appNamespace }}'."
    echo "##[command] kubectl argo rollouts undo ${{ parameters.appName }} -n ${{ parameters.appNamespace }}"
    kubectl-argo-rollouts undo ${{ parameters.appName }} -n ${{ parameters.appNamespace }}

    TIMEOUT=${ARGOROLLOUTS_UPGRADE_TIMEOUT}
    INTERVAL=10
    ELAPSED=0
    echo "##[debug] Total timeout of ${TIMEOUT}s"
    while [[ $ELAPSED -lt $TIMEOUT ]]; do
        STATUS=$(kubectl-argo-rollouts status ${{ parameters.appName }} -n ${{ parameters.appNamespace }} --timeout 10s 2>/dev/null || true)
        if echo "$STATUS" | grep -E "Paused|Healthy|waiting for all steps to complete"; then
            echo "##[debug] Status is Paused or Healthy, proceeding with promotion."
            break
        fi
        echo "##[debug] Waiting for rollout to be ready..."
        sleep $INTERVAL
        ELAPSED=$((ELAPSED + INTERVAL))
    done
    if [[ $ELAPSED -ge $TIMEOUT ]]; then
        echo "##[debug] Timeout reached, rollout did not become ready."
        exit 1
    fi
    sleep $INTERVAL

  displayName: 'Rollback application with Argo Rollouts'
  name: rollback_app_argo_rollouts
  workingDirectory: '$(Agent.TempDirectory)'
  env:
    ARGOROLLOUTS_UPGRADE_TIMEOUT: $(ARGOROLLOUTS_UPGRADE_TIMEOUT)