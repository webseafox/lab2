steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: DevOpsSharedResources
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      DEV_TAG="dev-${APP_VERSION}"
      if [[ "${DEV_TAG}" != "${NEW_TAG}" ]]; then
        echo "##[DEBUG]Starting update Image with new tag '${NEW_TAG}'..."

        IMAGE_FULL_NAME="${REGISTRY_NAME}/${IMAGE_NAME}"

        az acr login --name ${REGISTRY_NAME}
        az acr import --name ${REGISTRY_NAME} --source ${IMAGE_FULL_NAME}:${DEV_TAG} --image ${IMAGE_NAME}:${NEW_TAG} --force
      else
        echo "##[DEBUG]Skipping image tagging due deploy is for development"
      fi
  displayName: 'New Tag Image'
  condition: and(eq(variables['isACRRegistry'], 'true'), eq(lower(variables['ACR_TAGGING_ENABLED']), 'true'))
  env:
    REGISTRY_NAME: "$(REGISTRY_NAME)"
    APP_VERSION: "$(APP_VERSION)"
    NEW_TAG: "$(HELM_IMAGE_TAG)"
    IMAGE_NAME: "$(DOCKER_IMAGE_NAME)"