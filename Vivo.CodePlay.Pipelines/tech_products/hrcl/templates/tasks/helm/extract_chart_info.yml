parameters:
- name: chartNameOut
  default: CHART_NAME
- name: chartCurrentVersionOut
  default: CHART_VERSION

steps:
- script: |
    CHART_NAME=$(yq -r '.name' Chart.yaml)
    CHART_VERSION=$(yq -r '.version' Chart.yaml)

    echo "##[debug] ${CHART_NAME_OUT}...........: ${CHART_NAME}"
    echo "##[debug] ${CHART_VERSION_OUT}........: ${CHART_VERSION}"

    echo "##vso[task.setvariable variable=${CHART_NAME_OUT}]$CHART_NAME"
    echo "##vso[task.setvariable variable=${CHART_VERSION_OUT}]$CHART_VERSION"
  displayName: Extract Chart info
  env:
    CHART_NAME_OUT: ${{ parameters.chartNameOut }}
    CHART_VERSION_OUT: ${{ parameters.chartCurrentVersionOut }}
  workingDirectory: $(Build.SourcesDirectory)