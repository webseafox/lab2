parameters:
- name: newVersion
  type: string
- name: condition
  type: object
- name: currentVersion
  type: string
- name: gitTag

steps:
- template: /tech_products/hrcl/templates/tasks/versioning/update_repo_version.yml
  parameters:
    condition: ${{ parameters.condition }}
    componentNewVersion: ${{ parameters.newVersion }}
    bashScript: 
      content: echo ${NEW_VERSION} > VERSIONFILE
      envs:
        NEW_VERSION: ${{ parameters.newVersion }}

- ${{ if eq(parameters.gitTag, 'true') }}:
  - bash: |
      GIT_TAG=${NEW_VERSION}
      if [[ -z "${NEW_VERSION}" ]]; then
        GIT_TAG=${CURRENT_VERSION}
      fi

      echo "##vso[task.setvariable variable=VAR_GIT_TAG]${GIT_TAG}"
      echo "##[debug] Exporting variable 'VAR_GIT_TAG': ${GIT_TAG}"
    displayName: Defining Git Tag Version
    env:
      NEW_VERSION: ${{ parameters.newVersion }}
      CURRENT_VERSION: ${{ parameters.currentVersion }}

  - template: /tech_products/hrcl/templates/tasks/git/tag.yml
    parameters:
      staticTagName: '$(VAR_GIT_TAG)'