parameters:
- name: dockerImageName
  default: $(DOCKER_IMAGE_NAME)
- name: dockerImageTag
  default: $(DOCKER_IMAGE_TAG)
- name: dockerAppVersion
  default: $(APP_VERSION)

steps:
- script: |
    cat <<EOF > docker.json
    {
      "DOCKER_REGISTRY": "${DOCKER_REGISTRY}",
      "DOCKER_IMAGE_NAME": "${DOCKER_IMAGE_NAME}",
      "DOCKER_IMAGE_TAG": "${DOCKER_IMAGE_TAG}",
      "DOCKER_APP": "${DOCKER_APP_NAME}",
      "DOCKER_APP_VERSION": "$(APP_VERSION)",
      "DOCKER_IMAGE_NAME_FULL": "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}",
      "K8S_NAMESPACE": "${K8S_NAMESPACE}",
      "GIT_TAG": "${DOCKER_IMAGE_TAG}"
    }
    EOF

    echo "##[command] cat docker.json"
    cat docker.json
  displayName: "Generate docker.json metadata"
  env:
    DOCKER_REGISTRY: $(DOCKER_DEFAULT_REGISTRY)
    DOCKER_IMAGE_NAME: ${{ parameters.dockerImageName }}
    DOCKER_IMAGE_TAG: ${{ parameters.dockerImageTag }}
    DOCKER_APP_NAME: $(APP_NAME)
    DOCKER_APP_VERSION: ${{ parameters.dockerAppVersion }}
    K8S_NAMESPACE: $(K8S_NAMESPACE)
