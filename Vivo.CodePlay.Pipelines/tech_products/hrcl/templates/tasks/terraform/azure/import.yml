parameters:
- name: resourceAddress
- name: resourceId
- name: commandOptions
  default: ''
- name: environmentVariables
  type: object
  default: []

steps:
- script: |
    echo "##[debug] RESOURCE_ADDRESS......: ${RESOURCE_ADDRESS}"
    echo "##[debug] RESOURCE_ID...........: ${RESOURCE_ID}"
    echo "##[debug] COMMAND_OPTIONS.......: ${COMMAND_OPTIONS}"
  displayName: 'Show Import Parameters'
  env:
    COMMAND_OPTIONS: ${{ parameters.commandOptions }}
    RESOURCE_ADDRESS: ${{ parameters.resourceAddress }}
    RESOURCE_ID: ${{ parameters.resourceId }}
- task: TerraformTaskV4@4
  displayName: 'Terraform IMPORT'
  inputs:
    command: custom
    customCommand: import
    commandOptions: '${{ parameters.commandOptions }} "${{ parameters.resourceAddress }}" ${{ parameters.resourceId }}'
    environmentServiceNameAzureRM: $(TF_PROVIDER_SERVICE_CONNECTION)
    workingDirectory: $(Build.SourcesDirectory)
  env:
    AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
    PHPIPAM_APP_ID: $(PHPIPAM_APP_ID)
    PHPIPAM_ENDPOINT_ADDR: $(PHPIPAM_ENDPOINT_ADDR)
    PHPIPAM_PASSWORD: $(PHPIPAM-PASSWORD)
    PHPIPAM_USER_NAME: $(PHPIPAM_USER_NAME)
    TF_VAR_NEXUS_USERNAME: $(NEXUS-DEPS-USR)
    TF_VAR_NEXUS_PASSWORD: $(NEXUS-DEPS-PSW)
    TF_VAR_runtime_tags: $(TF_VAR_runtime_tags)
    ASDF_HELM_VERSION: $(HELM_VERSION)
    HELM_DEBUG: $(HELM_DEBUG_LEVEL)
    ${{ each env in parameters.environmentVariables }}:
      ${{ env.name }}: ${{ env.value }}