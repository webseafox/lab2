parameters:
- name: apiOrganizationID
- name: datFileLocation
- name: repository
- name: remoteFileLocation

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] API_ORGANIZATION_ID......: ${API_ORGANIZATION_ID}"
    echo "##[debug] DAT_FILE_LOCATION........: ${DAT_FILE_LOCATION}"

    echo "##[command] POST /proxies/import"
    curl -s -i -k --fail -X POST "${API_MANAGER_BASE_URL}/proxies/import" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --form "file=@${DAT_FILE_LOCATION}" \
    --form "organizationId=${API_ORGANIZATION_ID}" \
    --form "password=${DAT_FILE_PASSWORD}"
  displayName: Import .dat to API Manager
  continueOnError: false
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    API_ORGANIZATION_ID: ${{ parameters.apiOrganizationID }}
    DAT_FILE_LOCATION: ${{ parameters.datFileLocation }}
    DAT_FILE_PASSWORD: $(DAT_FILE_PASSWORD)

- script: |
    echo "Erro: A tentativa de POST para o endpoint ${API_MANAGER_BASE_URL}/proxies/import não obteve êxito."
    echo "Por favor, validar se todas esses parâmetros estão integros:"
    echo "- O arquivo .dat está presente em: ${API_MANAGER_BASE_HOST_URL_DEV}${EXPORT_LOCATION} ?"
    echo "- O arquivo .dat foi importado para o Nexus no caminho: ${URL}/${REPOSITORY}/${REMOTE_FILE_LOCATION} ?"
    echo "- O arquivo presente no ApiManager possui tamanho equivalente ao que foi importado no Nexus?"
    echo ""
    echo "Caso estes e os demais parâmetros estejam integros, por favor, avalie "
    echo "a resposta na API ${API_MANAGER_BASE_URL} através de seu log, e, "
    echo "se necessário, abrir chamado com a equipe de DevOps."
    exit 1
  displayName: Troubleshooting help
  condition: failed()
  env:
    URL: $(NEXUS_REPOSITORY_URL)
    REPOSITORY: ${{ parameters.repository }}
    LOCAL_FILE_LOCATION: ${{ parameters.datFileLocation }}
    REMOTE_FILE_LOCATION: ${{ parameters.remoteFileLocation }}
    API_MANAGER_BASE_HOST_URL_DEV: $(API_MANAGER_BASE_HOST_URL_DEV)