parameters:
- name: frontendApiID
- name: methodName

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] FRONTEND_API_ID..........: ${FRONTEND_API_ID}"
    echo "##[debug] METHOD_NAME..............: ${METHOD_NAME}"

    if [[ "${METHOD_NAME}" == "*" ]]; then
      echo "##[debug] FRONTEND_OPERATION_ID....: ${METHOD_NAME}"
      echo "##vso[task.setvariable variable=FRONTEND_OPERATION_ID]${METHOD_NAME}"
      exit
    fi

    echo "##[command] GET /proxies/${FRONTEND_API_ID}/operations"
    FRONTEND_OPERATION_ID="$(curl -s -k --fail --get \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/proxies/${FRONTEND_API_ID}/operations" | jq -r --arg methodName "${METHOD_NAME}" '.[] | select(.name == $methodName).id // empty')"

    if [[ -z "${FRONTEND_OPERATION_ID}" ]]; then
      echo "##vso[task.logissue type=error;] API Method not found in API Manager."
      echo "##vso[task.complete result=Failed;]"
      exit
    fi

    echo "##[debug] FRONTEND_OPERATION_ID....: ${FRONTEND_OPERATION_ID}"
    echo "##vso[task.setvariable variable=FRONTEND_OPERATION_ID]${FRONTEND_OPERATION_ID}"
  displayName: Get Method Operation ID
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    FRONTEND_API_ID: ${{ parameters.frontendApiID }}
    METHOD_NAME: ${{ parameters.methodName }}