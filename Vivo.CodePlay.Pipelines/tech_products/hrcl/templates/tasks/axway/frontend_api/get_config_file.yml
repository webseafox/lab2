parameters:
- name: frontendApiID
- name: apiVersion

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] FRONTEND_API_ID..........: ${FRONTEND_API_ID}"
    echo "##[debug] API_VERSION..............: ${API_VERSION}"

    echo "##[command] GET /proxies/${FRONTEND_API_ID} > ${CONFIG_FRONTEND_FILE_PATH}"
    curl -s -k --fail --get \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/proxies/${FRONTEND_API_ID}" > "${CONFIG_FRONTEND_FILE_PATH}"

    jq '.' ${CONFIG_FRONTEND_FILE_PATH}
  displayName: Get Frontend Config JSON File
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    FRONTEND_API_ID: ${{ parameters.frontendApiID }}
    API_VERSION: ${{ parameters.apiVersion }}
    CONFIG_FRONTEND_FILE_PATH: "$(Agent.TempDIrectory)/configFrontend-${{ parameters.apiVersion }}.json"