parameters:
- name: apiOrganizationName
- name: apiSharedOrganizations
- name: applicationName
- name: applicationOrgName

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL........: ${API_MANAGER_BASE_URL}"
    echo "##[debug] API_ORGANIZATION_NAME.......: ${API_ORGANIZATION_NAME}"
    echo "##[debug] API_SHARED_ORGANIZATIONS....: ${API_SHARED_ORGANIZATIONS}"
    echo "##[debug] APPLICATION_NAME............: ${APPLICATION_NAME}"
    echo "##[debug] APPLICATION_ORG_NAME........: ${APPLICATION_ORG_NAME}"

    CONTAINS_SHARED=$(echo "${API_SHARED_ORGANIZATIONS}" | jq --arg applicationOrgName "${APPLICATION_ORG_NAME}" --arg apiOrganizationName "${API_ORGANIZATION_NAME}" -R 'split(",") | . += [$apiOrganizationName] | index($applicationOrgName) // empty')

    if [ -z "${CONTAINS_SHARED}" ]; then
      echo "##vso[task.logissue type=warning] Application Organization is not in Shared Organizations."
      exit
    fi

    APPLICATION_ID=$(curl -s -k --fail --get \
    --data-urlencode "field=name" \
    --data-urlencode "op=eq" \
    --data-urlencode "value=${APPLICATION_NAME}" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    "${API_MANAGER_BASE_URL}/applications" | jq '.[0].id // empty')

    echo "##[debug] APPLICATION_ID..............: ${APPLICATION_ID}"
    if [ -z "${APPLICATION_ID}" ]; then
      echo "##vso[task.logissue type=warning] Application '${APPLICATION_NAME}' not found in API Manager."
      exit
    fi
    
    echo "##vso[task.setvariable variable=APPLICATION_ID]${APPLICATION_ID}"
  displayName: Get Application ID
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    API_ORGANIZATION_NAME: ${{ parameters.apiOrganizationName }}
    API_SHARED_ORGANIZATIONS: ${{ parameters.apiSharedOrganizations }}
    APPLICATION_NAME: ${{ parameters.applicationName }}
    APPLICATION_ORG_NAME: ${{ parameters.applicationOrgName }}