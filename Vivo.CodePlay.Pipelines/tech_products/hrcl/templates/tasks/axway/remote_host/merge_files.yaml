parameters:
- name: defaultRemoteHostFilePath
  type: string
- name: gatewayRemoteHostFilePath
  type: string
- name: environmentRemoteHostFilePath
  type: string
- name: outputFilePath
  type: string
- name: remoteHostAlias
  type: string
- name: organizationId
  type: string


steps:
- script: |
    echo "##[debug] DEFAULT_FILE_PATH.............: ${DEFAULT_FILE_PATH}"
    echo "##[debug] GATEWAY_FILE_PATH.............: ${GATEWAY_FILE_PATH}"
    echo "##[debug] ENVIRONMENT_FILE_PATH.........: ${ENVIRONMENT_FILE_PATH}"
    echo "##[debug] OUTPUT_FILE_PATH..............: ${OUTPUT_FILE_PATH}"
    echo "##[debug] REMOTE_HOST_ALIAS.............: ${REMOTE_HOST_ALIAS}"
    echo "##[debug] ORGANIZATION_ID...............: ${ORGANIZATION_ID}"

    if [ ! -f "$DEFAULT_FILE_PATH" ]; then
        echo "##[error] Default Remote Host File '$DEFAULT_FILE_PATH' não encontrado!"
        exit 1
    fi
    if [ ! -f "$GATEWAY_FILE_PATH" ]; then
        echo "##[error] Patch Remote File '$GATEWAY_FILE_PATH' não encontrado!"
        exit 1
    fi
    if [ ! -f "$ENVIRONMENT_FILE_PATH" ]; then
        echo "##[error] Patch Remote File '$ENVIRONMENT_FILE_PATH' não encontrado!"
        exit 1
    fi
    echo "##[debug] Arquivos encontrados com sucesso!"
    echo "##[command] merge files $DEFAULT_FILE_PATH, $GATEWAY_FILE_PATH and $ENVIRONMENT_FILE_PATH"
    jq -s --arg alias "$REMOTE_HOST_ALIAS" --arg orgId "$ORGANIZATION_ID" '.[0] * .[1] * .[2] | .alias = $alias | .organizationId = $orgId' "$DEFAULT_FILE_PATH" "$GATEWAY_FILE_PATH" "$ENVIRONMENT_FILE_PATH" > "$OUTPUT_FILE_PATH"
    echo "##[debug] Arquivo '$OUTPUT_FILE_PATH' criado com sucesso!"
    cat "$OUTPUT_FILE_PATH"
  displayName: Generate and merge JSON files
  name: remote_host_merge_files
  env:
    DEFAULT_FILE_PATH: ${{ parameters.defaultRemoteHostFilePath }}
    GATEWAY_FILE_PATH: ${{ parameters.gatewayRemoteHostFilePath }}
    ENVIRONMENT_FILE_PATH: ${{ parameters.environmentRemoteHostFilePath }}
    OUTPUT_FILE_PATH: ${{ parameters.outputFilePath }}
    REMOTE_HOST_ALIAS: ${{ parameters.remoteHostAlias }}
    ORGANIZATION_ID: ${{ parameters.organizationId }}