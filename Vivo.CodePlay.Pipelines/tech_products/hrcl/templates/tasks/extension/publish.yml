parameters:
- name: publisherId
- name: extensionId
- name: extensionName
- name: azdoExtensionServiceConnection
- name: versionAction
  default: 'Patch'
- name: artifactName

steps:

- task: PublishAzureDevOpsExtension@4
  inputs:
    connectTo: 'VsTeam'
    connectedServiceName: '${{ parameters.azdoExtensionServiceConnection }}'
    fileType: 'vsix'
    vsixFile: '$(System.DefaultWorkingDirectory)/${{ parameters.artifactName }}/${{ parameters.publisherId }}.${{ parameters.extensionId }}-$(EXTENSION_VERSION).vsix'
    publisherId: '${{ parameters.publisherId }}'
    extensionId: '${{ parameters.extensionId }}'
    extensionName: '${{ parameters.extensionName }}'
    updateTasksVersion: false
    extensionVisibility: 'private'
    extensionPricing: 'free'