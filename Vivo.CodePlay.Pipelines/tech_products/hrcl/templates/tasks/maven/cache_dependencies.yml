parameters:
  - name: appDependenciesCachePathOutputVarName
    type: string
  - name: appDependenciesCacheFolderOutputVarName
    type: string
  - name: condition
    type: object

steps:
- bash: |

    APP_DEPENDENCIES_CACHE_PATH=""
    APP_DEPENDENCIES_CACHE_TMP_PATH=""
    FOLDER_CACHE=""
    FOLDER_TMP=""

    echo "##[debug] CACHE_APP_DEPENDENCIES..................: ${CACHE_APP_DEPENDENCIES}"

    if [ "${CACHE_APP_DEPENDENCIES}" == "true" ]; then
      FOLDER_CACHE=".cache/app_dependencies/repository"
      FOLDER_TMP=".cache/app_dependencies/temp"
      APP_DEPENDENCIES_CACHE_PATH="$(Pipeline.Workspace)/${FOLDER_CACHE}"
      APP_DEPENDENCIES_CACHE_TMP_PATH="$(Pipeline.Workspace)/${FOLDER_TMP}"
      
      rm -R -f $APP_DEPENDENCIES_CACHE_PATH
      mkdir -p $APP_DEPENDENCIES_CACHE_PATH
      rm -R -f $APP_DEPENDENCIES_CACHE_TMP_PATH
      mkdir -p $APP_DEPENDENCIES_CACHE_TMP_PATH
    fi

    echo "##vso[task.setvariable variable=$PATH_OUTPUT_VARIABLE_NAME;isreadonly=true]$APP_DEPENDENCIES_CACHE_PATH"
    echo "##vso[task.setvariable variable=$FOLDER_OUTPUT_VARIABLE_NAME;isreadonly=true]$FOLDER_CACHE"
    echo "##vso[task.setvariable variable=APP_DEPENDENCIES_CACHE_TMP_PATH;isreadonly=true]$APP_DEPENDENCIES_CACHE_TMP_PATH"
  displayName: Prepare App Dependencies Cache Repository
  env:
    PATH_OUTPUT_VARIABLE_NAME: ${{ parameters.appDependenciesCachePathOutputVarName }}
    FOLDER_OUTPUT_VARIABLE_NAME: ${{ parameters.appDependenciesCacheFolderOutputVarName }}
    CACHE_APP_DEPENDENCIES: ${{ parameters.condition }}

- task: Cache@2
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
      maven
    path: "$(${{ parameters.appDependenciesCachePathOutputVarName }})"
  displayName: Cache Maven Dependencies
  condition: ${{ parameters.condition }}
  env:
    TMPDIR: $(APP_DEPENDENCIES_CACHE_TMP_PATH) # This is a workaround to avoid the error "No space left on device" o agent's "/tmp" when dealing with big cache directories

- script: |
    echo "Erro: A tarefa de cache falhou. Em caso do erro "No space left on device","
    echo "considere alterar o valor da variável TMPDIR"
    echo ""
    echo "Ação Requerida: Configure a variável APP_DEPENDENCIES_CACHE_TMP_PATH"
    echo "para um diretório com mais espaço disponível."
    echo "Examplo: Adicione às suas variáveis de pipeline:"
    echo "  - name: APP_DEPENDENCIES_CACHE_TMP_PATH"
    echo "    value: '/devops/.cache"
    exit 1
  displayName: Troubleshooting help
  condition: failed()