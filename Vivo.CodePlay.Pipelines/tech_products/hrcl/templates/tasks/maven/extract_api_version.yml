parameters:
- name: currentVersionVariableOut
  default: API_CURRENT_VERSION

steps:
- template: /tech_products/hrcl/templates/global/general/set-output-variable.yml
  parameters:
    variable: CURRENT_VERSION
    command: $(DOCKER_CMD_EXTRACT_POM_XML_VERSION)

- bash: |
    echo "##vso[task.setvariable variable=${API_CURRENT_VERSION_OUT};isOutput=true]${CURRENT_VERSION}"
    echo "##[debug] Exporting variable '${API_CURRENT_VERSION_OUT}': ${CURRENT_VERSION}"
  displayName: Defining Current Version
  name: export_current_version
  env:
    CURRENT_VERSION: $(CURRENT_VERSION)
    API_CURRENT_VERSION_OUT: ${{ parameters.currentVersionVariableOut }}