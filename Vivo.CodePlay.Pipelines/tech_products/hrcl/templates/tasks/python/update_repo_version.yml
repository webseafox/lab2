parameters:
- name: pythonVersion
  type: string
- name: currentVersion
  type: string
- name: newVersion
  type: string
- name: incrementLevel
  default: patch
- name: condition
  type: object
- name: createGitTag
  type: boolean
  default: true

steps:
- template: /tech_products/hrcl/templates/tasks/versioning/update_repo_version.yml
  parameters:
    condition: ${{ parameters.condition }}
    componentNewVersion: ${{ parameters.newVersion }}
    createGitTag: ${{ parameters.createGitTag }}
    bashScript: 
      content: |
        cat << EOF > lib-bump.sh
        #!/bin/bash
        echo "##[debug]Criando ambiente virtual python..."
        python -m venv .venv

        echo "##[debug]Ativando ambiente virtual python..."
        source .venv/bin/activate

        echo "##[debug]Instalando biblioteca bumpversion..."
        pip install bumpversion

        echo "##[debug]Atualizando versão"
        bumpversion --current-version ${CURRENT_VERSION} --new-version ${NEW_VERSION} ${INCREMENT_LEVEL} setup.py
        EOF

        echo "Atualizando versão da library atraves de container"
        docker run --rm \
          --user="$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)" \
          --network host \
          --log-driver none \
          -e HTTPS_PROXY="$HTTPS_PROXY" \
          -e HTTP_PROXY="$HTTP_PROXY" \
          -e NO_PROXY="$NO_PROXY" \
          -v $(pwd):/app \
          vcr-group.nexus.telefonica.com.br/corp/python/${PYTHON_VERSION}/builder/corp-py${PYTHON_VERSION} \
          bash lib-bump.sh

        rm -f lib-bump.sh
      envs:
        PYTHON_VERSION: "${{ parameters.pythonVersion }}"
        CURRENT_VERSION: ${{ parameters.currentVersion }}
        NEW_VERSION: ${{ parameters.newVersion }}
        INCREMENT_LEVEL: ${{ parameters.incrementLevel }}
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)