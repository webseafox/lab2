steps:
- task: CmdLine@2
  displayName: Run install
  inputs:
    script: 'flutter pub get'

- script: |
    echo "##[debug]Executando comando: 'dart analyze --no-fatal-warnings' e exportando relatório para 'analyze-report.txt'"
    dart analyze --no-fatal-warnings > analyze-report.txt

    echo "##[debug]Resultado da analise:"
    cat analyze-report.txt
  displayName: Analyze application
  workingDirectory: '$(Build.SourcesDirectory)'
  continueOnError: true

- task: FlutterTest@0
  displayName: "Run unit tests"
  inputs:
    generateCodeCoverageReport: true
    projectDirectory: '$(Build.SourcesDirectory)'

- template: /tech_products/hrcl/templates/tasks/artifacts/publish_app.yml

- template: /tech_products/hrcl/templates/tasks/tests/publish_coverage_report.yml
  parameters:
    reportPath: "**/lcov.info"
    codeCoverageTool: "Cobertura"
