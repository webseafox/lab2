parameters:
- name: flutterVersion
  type: string
  default: "3.16.0"

- name: iosProvProfileSecureFile
  type: string

steps:
- template: setup_build.yml
  parameters:
    flutterVersion: ${{ parameters.flutterVersion }}

- task: InstallAppleCertificate@2
  displayName: Install certificate
  inputs:
    certSecureFile: 'ios_distribution.p12'
    certPwd: '$(IOS_P12_CERTIFICATE_PWD)'
    keychain: $(IOS_P12_CERTIFICATE_KEY)

- task: InstallAppleProvisioningProfile@1
  displayName: Install provisioning file
  inputs:
    provisioningProfileLocation: 'secureFiles'
    provProfileSecureFile: ${{ parameters.iosProvProfileSecureFile }}
    removeProfile: false