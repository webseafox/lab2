parameters:
- name: workdirArtifacts
  default: $(Build.SourcesDirectory)
- name: testResultsFilesPattern
  default: "**/TEST-*.xml"
- name: coverageFilePattern
  default: "**/coverage.xml"
- name: additionalCodeCoverageFiles
  default: ""
- name: pathToSources
  default: ""
- name: reportDirectory
  default: "$(System.DefaultWorkingDirectory).devops/test/**/lcov-report"
- name: publishRunAttachments
  default: false
- name: codeCoverageTool
  default: "JaCoCo"
- name: testRunTitle
  default: "Test Results"
- name: publishCoverTaskVersion
  default: 1 # Existe bug ativo na versão 2 que impede o uso dela através de um proxy (caso dos agentes on-premises)

steps:
- template: /tech_products/hrcl/templates/tasks/tests/publish_tests_result.yml
  parameters:
    testResultsFilesPattern: '${{ parameters.testResultsFilesPattern }}'
    searchFolder: '${{ parameters.workdirArtifacts }}'
    publishRunAttachments: '${{ parameters.publishRunAttachments }}'
    testRunTitle: '${{ parameters.testRunTitle }}'

- ${{ if eq(parameters.publishCoverTaskVersion, 1) }}:
  - template: /tech_products/hrcl/templates/tasks/tests/publish_coverage_report_v1.yml
    parameters:
      codeCoverageTool: '${{ parameters.codeCoverageTool }}'
      reportPath: '${{ parameters.workdirArtifacts }}/${{ parameters.coverageFilePattern }}'
      pathToSources: '${{ parameters.workdirArtifacts }}/${{ parameters.pathToSources }}'
      reportDirectory: '${{ parameters.workdirArtifacts }}/${{ parameters.reportDirectory }}'
      additionalCodeCoverageFiles: '${{ parameters.workdirArtifacts }}/${{ parameters.additionalCodeCoverageFiles }}'
- ${{ else }}:
  - template: /tech_products/hrcl/templates/tasks/tests/publish_coverage_report.yml
    parameters:
      codeCoverageTool: '${{ parameters.codeCoverageTool }}'
      reportPath: '${{ parameters.workdirArtifacts }}/${{ parameters.coverageFilePattern }}'
      pathToSources: '${{ parameters.workdirArtifacts }}/${{ parameters.pathToSources }}'
      reportDirectory: '${{ parameters.workdirArtifacts }}/${{ parameters.reportDirectory }}'
      additionalCodeCoverageFiles: '${{ parameters.workdirArtifacts }}/${{ parameters.additionalCodeCoverageFiles }}'