steps:
- template: /tech_products/hrcl/templates/tasks/bash/welcome.yml
  parameters:
    message: $(DB_ROLLBACK_WELCOME_MSG)
    
- template: /tech_products/hrcl/templates/tasks/artifacts/download_db.yml

- template: /tech_products/hrcl/templates/tasks/azure_key_vault/get_akv_credentials.yml
  parameters:
    secretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

- template: /tech_products/hrcl/templates/tasks/docker/docker_image_build.yml.yml
  parameters:
    workingDirectory: '$(System.ArtifactsDirectory)/extracted_tars/db'

- template: /tech_products/hrcl/templates/tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'rollback'
    taskName: 't_rollback_changes'
    displayName: 'Rollback All Changes after Tag pre-$(Build.BuildNumber)'
    workingDirectory: '$(System.ArtifactsDirectory)/extracted_tars/db'
    extraAttributes: '-Dliquibase.rollbackTag=pre-$(Build.BuildNumber)'


- template: /tech_products/hrcl/templates/tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'listRollbackChangesets'
    taskName: 't_verify_undeployed_changesets'
    displayName: 'Verify Undeployed Changesets'
    workingDirectory: '$(System.ArtifactsDirectory)/extracted_tars/db'
    continueOnError: 'true'
    condition: succeededOrFailed()

- template: /tech_products/hrcl/templates/tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'diff'
    taskName: 't_compare_database_state_rollbacked'
    displayName: 'Compare Database Objects after Rollback'
    workingDirectory: '$(System.ArtifactsDirectory)/extracted_tars/db'
    condition: and(succeededOrFailed(), eq(variables.ENABLE_SNAPSHOT_COMPARE, true) )
    continueOnError: 'true'
    extraAttributes: '-Dliquibase.referenceUrl=offline:$db_type?snapshot=snapshot_db_$(environment).json'
