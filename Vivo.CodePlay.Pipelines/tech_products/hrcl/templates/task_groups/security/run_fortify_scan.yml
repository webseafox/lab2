  - task: Bash@3
    displayName: "Prepare Fortify Project Version Fields"
    inputs:
      targetType: "inline"
      script: |
        FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

        echo "Incluido/atualizando atributos na Versão do Projeto"
        RESPONSE_ATTR=$(curl --cacert ${CACORP_LOCATION} -s -g \
        -X PUT "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/attributes" \
        --header 'Accept: application/json' \
        --header 'Content-Type: application/json' \
        --header "Authorization: FortifyToken $FORTIFY_TOKEN" \
        --data @${FORTIFY_ATTRIBUTES_FILE_NAME})

        COUNTER=$(echo $RESPONSE_ATTR | jq .count)
        echo "Atributos Adicionados/Atualizados. Total: ${COUNTER}"

        echo "Atualizando campo 'committed' da Versão do Projeto"
        RESPONSE_UPDATE=$(curl --cacert ${CACORP_LOCATION} -s -g \
        -X PUT "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}" \
        --header 'Accept: application/json' \
        --header 'Content-Type: application/json' \
        --header "Authorization: FortifyToken $FORTIFY_TOKEN" \
        --data '{"committed": true}')

        PROJECT_VERSION_ID=$(echo $RESPONSE_UPDATE | jq .data.id)
        if [[ -n "${PROJECT_VERSION_ID}" ]]; then
          echo "Campo 'committed' da Versão do Projeto atualizado."
        else
          echo -n "Erro ao atualizar campo 'committed' da Versão do Projeto: "
          echo $RESPONSE_UPDATE | jq .message
          exit -1
        fi
    env:
      CACORP_LOCATION: "$(CACORP_LOCATION)"
      FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
      FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
      FORTIFY_PROJECT_ID: "$(FORTIFY_PROJECT_ID)"
      FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
      FORTIFY_ATTRIBUTES_FILE_NAME: ${{ parameters.fortifyAttributesFileName }}

  - task: Bash@3
    displayName: "Run Fortify SAST (client)"
    inputs:
      targetType: "inline"
      script: |
        echo "##[debug]Running Fortify scan with local ScanCentral Client version ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}..."

        SCANCENTRAL_CMD=${FORTIFY_SCANCENTRAL_PATH}${FORTIFY_LOCAL_SCANCENTRAL_VERSION}${FORTIFY_LOCAL_SCANCENTRAL_SCRIPT}

        echo "##[command]${SCANCENTRAL_CMD}"
        echo "##[debug]FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT...: ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT}"
        echo "##[debug]FORTIFY_SSC_ENDPOINT......................: ${FORTIFY_SSC_ENDPOINT}"
        echo "##[debug]EXCLUDE_FILE_PARAM........................: $(EXCLUDE_FILE_PARAM)"
        echo "##[debug]FORTIFY_APP_NAME..........................: ${FORTIFY_APP_NAME}"
        echo "##[debug]FORTIFY_APP_VERSION.......................: ${FORTIFY_APP_VERSION}"

        ${SCANCENTRAL_CMD} -url ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT} -sscurl ${FORTIFY_SSC_ENDPOINT} \
        -ssctoken ${FORTIFY_SSC_CLI_TOKEN} \
        start $(EXCLUDE_FILE_PARAM) -bt none -upload -block \
        --log-file "${FORTIFY_APP_NAME}-${SYSTEM_JOBATTEMPT}-fortify.log" --overwrite \
        --application "${FORTIFY_APP_NAME}" --application-version "${FORTIFY_APP_VERSION}" \
        -uptoken ${FORTIFY_SSC_CLI_TOKEN}

        if [ $? -eq 0 ]; then
          echo "##[debug]Fortify scan completed successfully."
        else
          echo "##vso[task.logissue type=error;] Fortify scan exited with errors."
          echo "##vso[task.complete result=Failed;]"
        fi
    env:
      FORTIFY_SCANCENTRAL_PATH: "$(FORTIFY_LOCAL_SCANCENTRAL_PATH)"
      FORTIFY_LOCAL_SCANCENTRAL_VERSION: "$(FORTIFY_LOCAL_SCANCENTRAL_VERSION)"
      FORTIFY_LOCAL_SCANCENTRAL_SCRIPT: "$(FORTIFY_LOCAL_SCANCENTRAL_SCRIPT)"
      FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT: "$(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT)"
      FORTIFY_SSC_ENDPOINT: $(FORTIFY_SSC_ENDPOINT)"
      FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
      FORTIFY_APP_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
      FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
      SYSTEM_JOBATTEMPT: "$(System.JobAttempt)"
      ASDF_JAVA_VERSION: "openjdk-17.0.2"

  - template: /tech_products/hrcl/templates/tasks/artifacts/publish_pipeline.yml
    parameters:
      displayName: "Publish scan log"
      artifactName: "fortify-$(System.JobAttempt)"
      targetPath: "$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log"

  # Etapa que aguarda o FPR ter êxito no PROCESS_COMPLETE
  - task: Bash@3
    displayName: "Get Fortify Report"
    inputs:
      targetType: "inline"
      script: |
        i="0"
        retries="10"
        FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

        echo "Aguardando processamento do Relatório..."

        while [[ $i -lt $retries ]]
        do
          sleep 30s
          RESPONSE_ARTIFACT=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/artifacts?limit=1" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          STATUS=$(echo $RESPONSE_ARTIFACT | jq -r .data[0].status)
          echo "Status atual do processamento: ${STATUS}"

          if [[ "$STATUS" == "REQUIRE_AUTH" ]]
          then
              echo "##vso[task.logissue type=error] Existe uma aprovação pendente no portal do Fortify. Para dar proseguimento com a aprovação entre em contato com o AppSec pelo e-mail(appsec_vivo.br@telefonica.com)"
              exit 1;
          elif [[ "$STATUS" == "PROCESS_COMPLETE" ]]
          then
              echo "Processamento finalizado"
              break
          fi
          i=$[$i+1]
        done

        # Coleta das issues
        echo "Get scan report (Fortify)"

        RESPONSE_ISSUES=$(curl --cacert ${CACORP_LOCATION} -s -g \
        -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/issues?orderby=id" \
        --header 'Accept: application/json' \
        --header 'Content-Type: application/json' \
        --header "Authorization: FortifyToken $FORTIFY_TOKEN")

        # Variavel ISSUES_COUNT_2 junta todos os status das vulnerabilidades.
        #ISSUES_COUNT=$(echo $RESPONSE_ISSUES | jq --raw-output '.data | group_by(.enginePriority) | map({"prioridade": .[0].enginePriority, "count": length})')
        ISSUES_COUNT_2=$(echo $RESPONSE_ISSUES | jq --raw-output '.data | map({"prioridade": .enginePriority, "avaliado": .issueStatus, "situacoes": .primaryTag, "count": 1})')
        #echo "${ISSUES_COUNT_2}"
        
       
        #Variaveis que salvam nao avaliados
        criticas_not_reviewed=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "Critical" and .avaliado == "Unreviewed")] | map(.count) | add' || echo "0")
        altas_not_reviewed=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "High" and .avaliado == "Unreviewed")] | map(.count) | add' || echo "0")

        #Variaveis que salvam as exploitable
        criticas_exploitable=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "Critical" and .situacoes == "Exploitable")] | map(.count) | add' || echo "0")
        altas_exploitable=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "High" and .situacoes == "Exploitable")] | map(.count) | add' || echo "0")


        #criticas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Critical") | .count' || echo "0")
        #altas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "High") | .count' || echo "0")
        #medias=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Medium") | .count' || echo "0")
        #baixas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Low") | .count' || echo "0")

        
        #criticas=$([[ -n $criticas ]] && echo $criticas || echo 0)
        #altas=$([[ -n $altas ]] && echo $altas || echo 0)
        #medias=$([[ -n $medias ]] && echo $medias || echo 0)
        #baixas=$([[ -n $baixas ]] && echo $baixas || echo 0)

        vulns_totais=$((criticas_not_reviewed + altas_not_reviewed + criticas_exploitable + altas_exploitable))
        if [[ $vulns_totais -gt 0 ]]; then
          echo "##vso[task.logissue type=error;]Foram encontradas vulnerabilidades críticas e/ou altas neste projeto. Número de violações identificadas: $((criticas_not_reviewed + altas_not_reviewed + criticas_exploitable + altas_exploitable))"
        else
          echo "Não há violações identificadas"
        fi

        echo "##[command]## List of issues ##"
        echo $RESPONSE_ISSUES | jq -r '.data[] | "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName'

        echo "##vso[task.setvariable variable=vulnerabilidadesCriticasNaoavaliadas;isreadonly=true]$criticas_not_reviewed"
        echo "##vso[task.setvariable variable=vulnerabilidadesAltasNaoavaliadas;isreadonly=true]$altas_not_reviewed"
        echo "##vso[task.setvariable variable=vulnerabilidadesCriticasVulneraveis;isreadonly=true]$criticas_exploitable"
        echo "##vso[task.setvariable variable=vulnerabilidadesAltasVulneraveis;isreadonly=true]$altas_exploitable"
        

    env:
      CACORP_LOCATION: "$(CACORP_LOCATION)"
      FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
      FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
      FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
      FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"

      # Conviso api
  - task: Bash@3
    displayName: "Conviso Associate"
    continueOnError: true
    inputs:
      targetType: "inline"
      script: |
        if [[ ! "${CONVISO_FLAG}" =~ ^(T|t)rue$ ]]; then
          echo "##vso[task.logissue type=warning;]A Flag da Conviso está desligada."
        else          
          #Verificar o conviso_company_id, remover o hardcoded
          RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/associate_project" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data '{"company_id": '${CONVISO_COMPANY_ID}',"project_id": "'${FORTIFY_PROJECT_VERSION_ID}'"}')

          ASSOCIATION_ID=$(echo $RESPONSE | jq .data.id)
          PROJECT_ID=$(echo $RESPONSE | jq .data.project.id)
          ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)
          echo "##vso[task.setvariable variable=convisoAssetId]$ASSET_ID"    
          echo "##vso[task.setvariable variable=${CONVISO_PROJECT_ID_OUT}]$PROJECT_ID"
          echo "##vso[task.setvariable variable=${CONVISO_ASSOCIATION_ID_OUT}]$ASSOCIATION_ID"

          #RESPONSE_CODE=$(tail -n1 <<< "$RESPONSE_RAW")
          #echo "##[debug]RESPONSE_CODE....: ${RESPONSE_CODE}"
          echo "Association ID -> ${ASSOCIATION_ID}"

          ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')
          if [[ ! -z "$ERROR" ]]; then
            MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
            echo "##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
          else
            echo "Passou com sucesso"
            exit
          fi
        fi
    env:
      SOURCE_BRANCH: "$(Build.SourceBranch)"
      IS_GITFLOW: ${{ parameters.isGitFlow }}
      CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
      CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
      CONVISO_API_KEY: "$(CONVISO-API-KEY)"
      FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
      CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
      CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
      CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
      PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      CONVISO_FLAG: ${{ parameters.useconviso }}
      RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"


  
  - task: Bash@3
    displayName: "Conviso Sync"
    continueOnError: true
    inputs:
      targetType: "inline"
      script: |
        # Remover result failed | colocar como warning
        if [[ ! "${CONVISO_FLAG}" =~ ^(T|t)rue$ ]]; then
          echo "##vso[task.logissue type=warning;]A Flag da Conviso está desligada."
        else
          i="0"
          retries="3" 
          while [[ $i -lt $retries ]]
          do

            RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize" \
            --proxy "${PROXY_AGENT_HTTPS}" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${CONVISO_API_KEY}" \
            --data '{"company_id": '${CONVISO_COMPANY_ID}',"integration_association_id": "'${CONVISO_ASSOCIATION_ID}'"}')
            
            echo "Response: ${RESPONSE}"

            if [[ ! -z "$RESPONSE" ]]; then
              break             
            fi
            echo "Algo inesperado aconteceu. Tentando realizar a sincronização novamente. Aguarde..."
            sleep 5s
            i=$[$i+1]
          done

          TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)
          ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)

          echo "Conviso Asset ID: ${ASSET_ID}"

          if [[ -z "$ASSET_ID" ]]; then      
             echo "##vso[task.logissue type=error;] An error occurred while requesting Conviso API. Please, try running the pipeline again. If the error persists, contact the AppSec team on appsec_vivo.br@telefonica.com"
             exit
          fi

          echo "##[debug]Sincronização iniciada com sucesso."

          ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')
          if [[ ! -z "$ERROR" ]]; then
            MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
            echo "##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
          else
            echo "Passou com sucesso"
            exit
          fi
        fi
    env:
      SOURCE_BRANCH: "$(Build.SourceBranch)"
      IS_GITFLOW: ${{ parameters.isGitFlow }}
      CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
      CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
      CONVISO_API_KEY: "$(CONVISO-API-KEY)"
      FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
      CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
      CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
      CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
      PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      CONVISO_FLAG: ${{ parameters.useconviso }}
      CONVISO_ASSET_ID: "$(convisoAssetId)"
      RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"


  # Aqui é a etapa do Gate de Segurança (Fora da Conviso)
  - task: Bash@3
    displayName: "Evaluate Security Gate"
    #condition: ${{ parameters.gateCondition }}
    continueOnError: false
    inputs:
      targetType: "inline"
      script: |
        if [[ ! "${SKIP_SECURITY_GATE}" =~ ^(T|t)rue$ ]]; then
          declare -i vulnerabilidadesCriticasNaoavaliadas=$(vulnerabilidadesCriticasNaoavaliadas)
          declare -i vulnerabilidadesAltasNaoavaliadas=$(vulnerabilidadesAltasNaoavaliadas)
          declare -i vulnerabilidadesCriticasVulneraveis=$(vulnerabilidadesCriticasVulneraveis)
          declare -i vulnerabilidadesAltasVulneraveis=$(vulnerabilidadesAltasVulneraveis)

          if [[ $vulnerabilidadesCriticasNaoavaliadas -gt 0 || $vulnerabilidadesAltasNaoavaliadas -gt 0 || vulnerabilidadesCriticasVulneraveis -gt 0 || vulnerabilidadesAltasVulneraveis -gt 0 ]]; then
            echo "##[error]ATENÇÃO! Security Gate não foi atingido devido existência de vulnerabilidades Críticas e/ou Altas!"
            echo "##vso[task.complete result=Failed;]"

            IS_MASTER_OR_MAIN=$(echo ${SOURCE_BRANCH} | grep -Po "master|main")
            if [[ ! -z "${IS_MASTER_OR_MAIN}" ]] && [[ ${IS_GITFLOW} =~ ^(T|t)rue$ ]] || [[ ! ${IS_GITFLOW} =~ ^(T|t)rue$ ]]; then
              exit 1
            else
              echo "##[debug]A pipeline continuará a execução, dado a seguinte condição:"
              echo "##[debug]Branch Master ou Main: ${SOURCE_BRANCH}"
              echo "##[debug]Modelo SCM GitFlow: ${IS_GITFLOW}"
            fi

          else 
            echo "##[debug]Security Gate atingido!"
          fi
        else
          echo "O Gate foi Skipado devido a configuração da Flag"
        fi
    env:
      SOURCE_BRANCH: "$(Build.SourceBranch)"
      IS_GITFLOW: ${{ parameters.isGitFlow }}
      CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
      CONVISO_API_KEY: "$(CONVISO-API-KEY)"
      FORTIFY_PROJECT_ID: "$(fortifyProjectId)"
      CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
      CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
      CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
      PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      CONVISO_FLAG: ${{ parameters.useconviso }}
      SKIP_SECURITY_GATE: ${{ parameters.skipSecurityGate }}

