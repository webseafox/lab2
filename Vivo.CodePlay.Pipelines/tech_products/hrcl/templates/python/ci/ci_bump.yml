steps:
  - task: Bash@3
    displayName: 'Bump Image Version and Create Tag'
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        echo "##[debug] BRANCH_NAME............: ${BRANCH_NAME}"

        git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
        git config --global user.name "Azure DevOps"
        git fetch --prune --tags
        git checkout -f ${BRANCH_NAME}
        git reset --hard origin/${BRANCH_NAME}

        cz bump --yes
        git push --tags origin ${BRANCH_NAME}
    env:
      BRANCH_NAME: ${{ replace( variables['Build.SourceBranch'], 'refs/heads/', '') }}