parameters:
  - name: proxy
    type: string
steps:
  - task: Bash@3
    displayName: Gathering Information
    name: extract_version_and_sha
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        echo "##[command] Show cz.json"
        yq '.' cz.json

        git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
        git config --global user.name "Azure DevOps"
        
        CURRENT_VERSION=$(yq -r .commitizen.version cz.json)

        cz bump --files-only --yes
        NEXT_VERSION=$(yq -r .commitizen.version cz.json)
        TAG_PATTERN=$(yq -r .commitizen.tag_format cz.json)
        IMAGE_VERSION=$(eval "echo $TAG_PATTERN")
        COMMIT_SHA=${BUILD_SOURCEVERSION:0:7}

        echo ""
        echo "##[debug] CURRENT_VERSION...............: ${CURRENT_VERSION}"
        echo "##[debug] NEXT_VERSION..................: ${NEXT_VERSION}"
        echo "##[debug] TAG_PATTERN...................: ${TAG_PATTERN}"
        echo "##[debug] COMMIT_SHA....................: ${COMMIT_SHA}"
        echo "##[debug] REGISTRY_SERVICE_CONNECTION...: ${REGISTRY_SERVICE_CONNECTION}"
        echo "##[debug] SKIP_SCAN.....................: ${SKIP_SCAN}"
        echo "##[debug] AKV_DEVOPS_NAME...............: ${AKV_DEVOPS_NAME}"
        echo "##[debug] DT_SCA_ENDPOINT...............: ${DT_SCA_ENDPOINT}"
        echo "##[debug] CACORP_LOCATION...............: ${CACORP_LOCATION}"
        echo "##[debug] REGISTRY_NAME.................: ${REGISTRY_NAME}"
        echo "##[debug] PROXY.........................: ${PROXY}"

        if [[ ${NEXT_VERSION} == "null" || ${NEXT_VERSION} == "" ]]
        then
          echo "##vso[task.logissue type=error] Image version has not been defined"
          exit 1
        fi

        echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=true]${CURRENT_VERSION}"
        echo "##vso[task.setvariable variable=NEXT_VERSION;isOutput=true]${NEXT_VERSION}"
        echo "##vso[task.setvariable variable=TAG_PATTERN;isOutput=true]${TAG_PATTERN}"
        echo "##vso[task.setvariable variable=COMMIT_SHA;isOutput=true]${COMMIT_SHA}"
    env:
      PROXY: ${{ parameters.proxy }}