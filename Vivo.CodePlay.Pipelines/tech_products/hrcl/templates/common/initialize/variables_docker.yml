variables:

# Variables for Docker
- name: DOCKER_REGISTRY
  value: vcr-docker.nexus.telefonica.com.br
- name: DOCKER_SERVICE_CONNECTION
  value: "VCR-DOCKER"
- name: DOCKER-REGISTRY-USERNAME
  value: ""
- name: DOCKER-REGISTRY-PASSWORD
  value: ""
- name: DOCKER_REGISTRY_EMAIL
  value: "arquiteturati@telefonica.com.br"
- name: DOCKER_CMD_USERNAME
  value: $(id -u)
- name: DOCKER_CMD_GROUP
  value: $(id -g)
- name: DOCKER_WORKDIR
  value: "/app"
- name: DOCKER_BUILDKIT # https://github.com/microsoft/azure-pipelines-tasks/issues/17893
  value: 1
- name: isNexusRegistry
  value: $[ contains(variables.DOCKER_DEFAULT_REGISTRY, 'nexus') ]
- name: ACR_URL
  value: "acrsharedservices01.azurecr.io"