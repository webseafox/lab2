parameters:
- name: environment
- name: version
- name: operation

steps:
- task: Bash@3
  displayName: 'Get Namespace'
  name: get_namespace
  condition: succeeded()
  continueOnError: false
  inputs:
    targetType: inline
    script: |
      selected_var=$(echo "K8S_NAMESPACE_${{ parameters.environment }}" |  tr 'a-z' 'A-Z')
      NAMESPACE=${!selected_var}

      if [ -z "$NAMESPACE" ] && [ ! -z "$(K8S_NAMESPACE)" ]; then
        NAMESPACE=$(K8S_NAMESPACE)
      fi
      echo "##[debug] K8S_NAMESPACE: $NAMESPACE"
      echo "##vso[task.setvariable variable=K8S_NAMESPACE]$NAMESPACE"

- script: |
    set -e

    echo "##[debug] APP_NAME....................: ${APP_NAME}"
    echo "##[debug] VERSION.....................: ${VERSION}"
    echo "##[debug] ENVIRONMENT.................: ${ENVIRONMENT}"
    echo "##[debug] CLUSTER.....................: ${CLUSTER}"
    echo "##[debug] K8S_NAMESPACE...............: ${K8S_NAMESPACE}"
    echo "##[debug] CATALOG_INFO_FILE_CONTENT...: ${CATALOG_INFO_FILE_CONTENT}"
  displayName: Show Data
  env:
    APP_NAME: $(APP_NAME)
    VERSION: ${{ parameters.version }}
    ENVIRONMENT: ${{ parameters.environment }}
    CLUSTER: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
    K8S_NAMESPACE: $(K8S_NAMESPACE)
    CATALOG_INFO_FILE_CONTENT: $(CATALOG_INFO_FILE_CONTENT)

- task: VivoGovernance@1
  inputs:
    breakglass: false
    serverEndpoint: 'governanceapi'
    operation: ${{ parameters.operation }}
    component: $(APP_NAME)
    version: ${{ parameters.version }}
    cluster: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
    namespace: $(K8S_NAMESPACE)
    deployment: $(APP_NAME)
    environment: ${{ parameters.environment }}
    catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
  displayName: GovApp Action - ${{ parameters.operation }}
  continueOnError: true # devido falhas de timeout e redes mantem a entrega com warning
  name: gov_app_integration

- task: CatchLogsToLocalDirectoryFromVivo@4
  displayName: Export Logs
  inputs:
    dumpDir: $(Build.ArtifactStagingDirectory)/audit
- task: PublishBuildArtifacts@1
  displayName: 'Publish Logs'
  inputs:
    ArtifactName: audit
    PathtoPublish: $(Build.ArtifactStagingDirectory)/audit