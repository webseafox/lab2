parameters:
  - name: proxy
    type: string
    
steps:
  - task: Bash@3
    displayName: "Get Version"
    name: get_current_version
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
        git config --global user.name "Azure DevOps"
        
        CURRENT_VERSION=$(yq -r '.version' package.json)

        echo ""
        echo "##[debug] CURRENT_VERSION...............: ${CURRENT_VERSION}"

        echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=true]${CURRENT_VERSION}"
        echo "##vso[task.setvariable variable=COMPONENT_VERSION]${CURRENT_VERSION}"

  - task: semver-bump@1
    displayName: "Bump Version"
    condition: and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'))
    inputs:
      VersionVariable: 'COMPONENT_VERSION'
      IncrementLevel: patch
      
  - task: Bash@3
    displayName: "Extract Version Info"
    name: extract_version_and_sha
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
        git config --global user.name "Azure DevOps"
        
        CURRENT_VERSION=$(yq -r '.version' package.json)
        NEXT_APP_NAME=$(yq -r '.name' package.json)
        COMMIT_SHA=${BUILD_SOURCEVERSION:0:7}

        echo ""
        echo "##[debug] CURRENT_VERSION...............: ${CURRENT_VERSION}"
        echo "##[debug] NEXT_VERSION..................: ${NEW_VERSION}"
        echo "##[debug] COMMIT_SHA....................: ${COMMIT_SHA}"
        echo "##[debug] REGISTRY_SERVICE_CONNECTION...: ${REGISTRY_SERVICE_CONNECTION}"
        echo "##[debug] SKIP_SCAN.....................: ${SKIP_SCAN}"
        echo "##[debug] AKV_DEVOPS_NAME...............: ${AKV_DEVOPS_NAME}"
        echo "##[debug] DT_SCA_ENDPOINT...............: ${DT_SCA_ENDPOINT}"
        echo "##[debug] CACORP_LOCATION...............: ${CACORP_LOCATION}"
        echo "##[debug] REGISTRY_NAME.................: ${REGISTRY_NAME}"
        echo "##[debug] PROXY.........................: ${PROXY}"

        if [[ ${NEW_VERSION} == "null" || ${NEW_VERSION} == "" ]]
        then
          echo "##vso[task.logissue type=error] Image Version has not been defined"
          exit 1
        fi

        echo "##vso[task.setvariable variable=NEXT_VERSION;isOutput=true]${NEW_VERSION}"
    env:
      PROXY: ${{ parameters.proxy }}
      NEW_VERSION: $(COMPONENT_VERSION)
