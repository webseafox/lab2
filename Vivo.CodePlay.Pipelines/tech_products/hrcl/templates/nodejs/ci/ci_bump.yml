steps:
  - task: Bash@3
    displayName: 'Bump and Tag'
    condition: succeeded()
    inputs:
      targetType: inline
      script: |       
        echo "##[debug] BRANCH_NAME........................: ${BRANCH_NAME}"
        echo "##[debug] NEXT_VERSION.......................: ${NEXT_VERSION}"

        git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
        git config --global user.name "Azure DevOps"

        # A versão utilizada do NPM é a versão default do Node.js nos agentes
        # Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF) na pasta raiz do projeto 
        npm version ${NEXT_VERSION} --no-git-tag-version --no-commit-hooks
        
        git stash save package.json
        git clean -fdX

        echo "##[command] git checkout ${BRANCH_NAME}"
        git fetch --prune --tags
        git checkout -f ${BRANCH_NAME}
        git pull --rebase origin ${BRANCH_NAME}
        git stash pop

        echo "##[command] git commit"
        git add package.json
        git commit -m "[skip ci] Version has been updated to ${NEXT_VERSION}"

        echo "##[command]git tag ${NEXT_VERSION}"
        git tag ${NEXT_VERSION} -m "Version has been updated to ${NEXT_VERSION}"

        echo "##[command] git push origin ${BRANCH_NAME}"
        git push origin --tags ${BRANCH_NAME}      
    env:
      BRANCH_NAME: ${{ replace( variables['Build.SourceBranch'], 'refs/heads/', '') }}