## -> Parameters:
parameters:
  - name: environment
  - name: skipDeploy
  - name: proxy
  - name: packageVersion
  - name: cacheAppDependencies
  - name: kubernetesServiceConnectionEnabled
    default: false

## -> CI
stages:
#ENVIRONMENT INIT
  - template: /tech_products/hrcl/templates/common/stages/initialize/environment.yml
    parameters:
      packageVersion: ${{ parameters.packageVersion }}

#PREPARE
  - stage: prepare
    dependsOn:
      - environment_init
    displayName: "Prepare Pipeline"
    jobs:
      - job: extract
        displayName: "Set Variables"
        pool:
          name: GeneralPurposeLinuxAgentsCI
        steps:
          - checkout: self
            persistCredentials: true
            fetchTags: true
            clean: true
          - template: /tech_products/hrcl/templates/nodejs/ci/ci_prepare.yml
            parameters:
              proxy: ${{ parameters.proxy }}

  ## BUILD AND PACKAGE
  - stage: build_package
    dependsOn:
      - prepare
      - environment_init
    variables:
      # -> Catalog Info Variables
      - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
      - name: CURRENT_VERSION
        value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.CURRENT_VERSION'] ]
      - name: NEXT_VERSION
        value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.NEXT_VERSION'] ]
      - name: TAG_VERSION
        value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.TAG_VERSION'] ]
      - name: COMMIT_SHA
        value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.COMMIT_SHA'] ]
    displayName: "Build & Test & Package"
    jobs:
      - job: build_package
        displayName: "Build & Test & Package"
        pool:
          name: GeneralPurposeLinuxAgentsCI
        steps:
          - checkout: self
            persistCredentials: true
            fetchTags: true
            clean: true
          - template: /tech_products/hrcl/templates/nodejs/ci/ci_build_test_package.yml
            parameters:
              nextVersion: $(NEXT_VERSION)
              cacheAppDependencies: "${{ parameters.cacheAppDependencies }}"

#QUALITY GATE - GOV APP
  - stage: gov_app_quality_gate
    displayName: "Governance Gate"
    pool:
      name: GeneralPurposeLinuxAgentsCI
    dependsOn:
      - environment_init
      - prepare
      - build_package
    condition: succeeded()
    ## -> Loads variables from other stages.
    variables:
    - name: NEXT_VERSION
      value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.NEXT_VERSION'] ]
    - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
    jobs:
    - job: governance
      displayName: "Check Governance"
      condition: succeeded()
      steps:
      ## -> Validate the application on Governance App
      - template: /tech_products/hrcl/templates/common/gates/gov_app/gov_app.yml
        parameters:
          environment: "${{ parameters.environment }}"
          operation: "validate"
          version: "$(NEXT_VERSION)"

  ## SONARQUBE
  - stage: sonarqube_quality_gate
    displayName: "SonarQube Gate"
    pool:
      name: GeneralPurposeLinuxAgentsCI
    dependsOn:
      - environment_init
      - prepare
      - build_package
    condition: succeeded()
    ## -> Loads variables from other stages.
    variables:
    - name: NEXT_VERSION
      value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.NEXT_VERSION'] ]
    - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
    jobs:
    - job: sonarqube
      displayName: "Code Analysis"
      condition: succeeded()
      steps:
      ## -> Quality Gates (SonarQube)
      - template: /tech_products/hrcl/templates/nodejs/ci/ci_sonarqube.yml
        parameters:
          environment: "${{ parameters.environment }}"

#QUALITY GATE - SECURITY
  - template: /tech_products/hrcl/templates/common/stages/security/security.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion

#BUMPING VERSION
  - stage: bump
    dependsOn:
      - prepare
      - security_quality_gate
      - sonarqube_quality_gate
      - gov_app_quality_gate
    displayName: "Bump Version"
    variables:
      # -> Catalog Info Variables
      - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
      # -> variables are automatically exported as environment variables so this will override pip's default cache dir
      - name: NEXT_VERSION
        value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.NEXT_VERSION'] ]
    jobs:
      - job: PushTag
        displayName: "Push Tag"
        pool:
          name: GeneralPurposeLinuxAgentsCI
        steps:
          - checkout: self
            persistCredentials: true
            fetchTags: true
          - template: /tech_products/hrcl/templates/nodejs/ci/ci_bump.yml

    ## -> CD
  - ${{ if ne(parameters.skipDeploy, True) }}:
      - stage: Deploy
        dependsOn:
          - prepare
          - environment_init
          - bump
        pool:
          name: GeneralPurposeLinuxAgentsCD
        variables:
          - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
          - template: /tech_products/hrcl/templates/common/initialize/variables_helm.yml
          - name: NEXT_VERSION
            value: $[ stageDependencies.prepare.extract.outputs['extract_version_and_sha.NEXT_VERSION'] ]
        jobs:
          - deployment: deploy_${{ parameters.environment }}
            displayName: "Run Deploy"
            environment: deploy-${{ parameters.environment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: /tech_products/hrcl/templates/common/initialize/deploy_environment.yml
                      parameters:
                        environment: "${{ parameters.environment }}"
                    ## -> Use HELM to deploy
                    - template: /tech_products/hrcl/templates/common/cd/cd_deploy.yml
                      parameters:
                        environment: "${{ parameters.environment }}"
                        packageVersion: $(NEXT_VERSION)
                        kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}
                on:
                  success:
                    steps:
                      ## -> Notifies 'Success on Deploy' on Governance App
                      - task: Bash@3
                        displayName: 'Get Namespace'
                        name: get_namespace
                        condition: succeeded()
                        continueOnError: false
                        inputs:
                          targetType: inline
                          script: |
                            selected_var=$(echo "K8S_NAMESPACE_${{ parameters.environment }}" |  tr 'a-z' 'A-Z')
                            NAMESPACE=${!selected_var}

                            if [ -z "$NAMESPACE" ] && [ ! -z "$(K8S_NAMESPACE)" ]; then
                              NAMESPACE=$(K8S_NAMESPACE)
                            fi
                            echo "##[debug] K8S_NAMESPACE: $NAMESPACE"
                            echo "##vso[task.setvariable variable=K8S_NAMESPACE]$NAMESPACE"

                      - script: |
                          set -e
                      
                          echo "##[debug] APP_NAME....................: ${APP_NAME}"
                          echo "##[debug] VERSION.....................: ${VERSION}"
                          echo "##[debug] ENVIRONMENT.................: ${ENVIRONMENT}"
                          echo "##[debug] CLUSTER.....................: ${CLUSTER}"
                          echo "##[debug] K8S_NAMESPACE...............: ${K8S_NAMESPACE}"
                          echo "##[debug] CATALOG_INFO_FILE_CONTENT...: ${CATALOG_INFO_FILE_CONTENT}"
                        displayName: "Show Deploy Info"
                        env:
                          APP_NAME: $(APP_NAME)
                          VERSION: $(NEXT_VERSION)
                          ENVIRONMENT: ${{ parameters.environment }}
                          CLUSTER: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
                          K8S_NAMESPACE: $(K8S_NAMESPACE)
                          CATALOG_INFO_FILE_CONTENT: $(CATALOG_INFO_FILE_CONTENT)

                      - task: VivoGovernance@1
                        inputs:
                          breakglass: false
                          serverEndpoint: 'governanceapi'
                          operation: deploy
                          component: $(APP_NAME)
                          version: $(NEXT_VERSION)
                          cluster: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
                          namespace: $(K8S_NAMESPACE)
                          deployment: $(APP_NAME)
                          environment: ${{ parameters.environment }}
                          catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
                        displayName: "Notify GovApp"
                        continueOnError: true # devido falhas de timeout e redes mantem a entrega com warning
                        name: gov_app_integration
                  failure:
                    steps:
                      - task: CatchLogsToLocalDirectoryFromVivo@4
                        displayName: "Export Logs"
                        inputs:
                          dumpDir: $(Build.ArtifactStagingDirectory)/audit
                      - task: PublishBuildArtifacts@1
                        displayName: "Publish Logs"
                        inputs:
                          ArtifactName: audit
                          PathtoPublish: $(Build.ArtifactStagingDirectory)/audit
