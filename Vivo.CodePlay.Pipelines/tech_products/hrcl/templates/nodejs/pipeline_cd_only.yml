## -> Parameters:
parameters:
  - name: environment
    type: string
    default: "dev"
  - name: packageVersion
    type: string
    default: "latest"
  - name: kubernetesServiceConnectionEnabled
    default: false

## -> CD
stages:
  - template: /tech_products/hrcl/templates/common/stages/initialize/environment.yml
    parameters:
      packageVersion: ${{ parameters.packageVersion }}

  - stage: Deploy
    dependsOn:
      - environment_init
    pool:
      name: GeneralPurposeLinuxAgentsCD
    variables:
      # -> Catalog Info Variables
      - template: /tech_products/hrcl/templates/common/initialize/variables_catalog_info.yml
      - template: /tech_products/hrcl/templates/common/initialize/variables_helm.yml
    jobs:
      - deployment: deploy_${{ parameters.environment }}
        displayName: "Run Deploy"
        environment: deploy-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /tech_products/hrcl/templates/common/initialize/deploy_environment.yml
                  parameters:
                    environment: "${{ parameters.environment }}"
                - template: /tech_products/hrcl/templates/common/cd/cd_deploy.yml
                  parameters:
                    environment: "${{ parameters.environment }}"
                    packageVersion: "${{ parameters.packageVersion }}"
                    kubernetesServiceConnectionEnabled: ${{ parameters.kubernetesServiceConnectionEnabled }}
            on:
              success:
                steps:
                  - task: Bash@3
                    displayName: 'Get Namespace'
                    name: get_namespace
                    condition: succeeded()
                    continueOnError: false
                    inputs:
                      targetType: inline
                      script: |
                        selected_var=$(echo "K8S_NAMESPACE_${{ parameters.environment }}" |  tr 'a-z' 'A-Z')
                        NAMESPACE=${!selected_var}

                        if [ -z "$NAMESPACE" ] && [ ! -z "$(K8S_NAMESPACE)" ]; then
                          NAMESPACE=$(K8S_NAMESPACE)
                        fi
                        echo "##[debug] K8S_NAMESPACE: $NAMESPACE"
                        echo "##vso[task.setvariable variable=K8S_NAMESPACE]$NAMESPACE"

                  - script: |
                      set -e
                  
                      echo "##[debug] APP_NAME....................: ${APP_NAME}"
                      echo "##[debug] VERSION.....................: ${VERSION}"
                      echo "##[debug] ENVIRONMENT.................: ${ENVIRONMENT}"
                      echo "##[debug] CLUSTER.....................: ${CLUSTER}"
                      echo "##[debug] K8S_NAMESPACE...............: ${K8S_NAMESPACE}"
                      echo "##[debug] CATALOG_INFO_FILE_CONTENT...: ${CATALOG_INFO_FILE_CONTENT}"
                    displayName: 'Show Deploy Info'
                    env:
                      APP_NAME: $(APP_NAME)
                      VERSION: "${{ parameters.packageVersion }}"
                      ENVIRONMENT: ${{ parameters.environment }}
                      CLUSTER: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
                      K8S_NAMESPACE: $(K8S_NAMESPACE)
                      CATALOG_INFO_FILE_CONTENT: $(CATALOG_INFO_FILE_CONTENT)

                  - task: VivoGovernance@1
                    displayName: 'Notify GovApp'
                    inputs:
                      breakglass: false
                      serverEndpoint: 'governanceapi'
                      operation: deploy
                      component: $(APP_NAME)
                      version: "${{ parameters.packageVersion }}"
                      cluster: $(GOV_APP_ACRONYM)-${{ parameters.environment }}
                      namespace: $(K8S_NAMESPACE)
                      deployment: $(APP_NAME)
                      environment: ${{ parameters.environment }}
                      catalogInfo: $(CATALOG_INFO_FILE_CONTENT)
                    continueOnError: true # devido falhas de timeout e redes mantem a entrega com warning
                    name: gov_app_integration
              failure:
                steps:
                  - task: CatchLogsToLocalDirectoryFromVivo@4
                    displayName: 'Export logs'
                    inputs:
                      dumpDir: $(Build.ArtifactStagingDirectory)/audit
                  - task: PublishBuildArtifacts@1
                    displayName: "Publish logs"
                    inputs:
                      ArtifactName: audit
                      PathtoPublish: $(Build.ArtifactStagingDirectory)/audit
