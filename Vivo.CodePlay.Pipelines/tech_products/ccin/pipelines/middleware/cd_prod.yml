              inputs:
                sshEndpoint: 'SSH_WLS_WAS_ROTEAMENTO_BRN_PRD'
                runOptions: 'inline'
                inline: >-
                  echo "Conectado com sucesso via Service Connection SSH_WLS_WAS_ROTEAMENTO_BRN_PRD"
                  echo "Testando conectividade com AdminServer BRN..."
                  nc -z brtlvlts0620pl 7000 && echo "AdminServer BRN está acessível" || echo "ERRO: AdminServer BRN não está acessível!"
                  ls -lha $(SCRIPTS_TARGETFOLDER) || echo "Diretório $(SCRIPTS_TARGETFOLDER) não existe ainda"
                readyTimeout: '20000'

          - ${{ if eq(parameters.deployCIC, true) }}:
