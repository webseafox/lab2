parameters:
  - name: packageVersion
    displayName: 'Versão do pacote para deploy'
    type: string
  - name: environment
    displayName: 'Ambiente de destino'
    default: producao
    values:
      - producao
  #    - dev
  #- name: deployRotQA4
  #  type: boolean
  #- name: deployMovQA3
  #  displayName: 'Deploy no site MOV QA3'
  #  type: boolean
  #  default: false
  - name: deployBRN
    displayName: 'Deploy no site BRN'
    type: boolean
    default: false
  - name: deployCIC
    displayName: 'Deploy no site CIC'
    type: boolean
    default: false
  - name: deployNDC
    displayName: 'Deploy no site NDC'
    type: boolean
    default: false
  - name: skipAtualizaVersionMd
    displayName: 'Pular atualização do VERSION.md'
    type: boolean
    default: false

stages:
- stage: Deploy
  displayName: '🚀 Deploy Produção'
  pool: GeneralPurposeLinuxAgentsCD
  
  jobs:
  - deployment: Deploy
    environment: 'deploy-${{ parameters.environment }}'
    displayName: '🚀 Deploy'
    workspace:
      clean: all
    
    strategy:
      runOnce:
        preDeploy:
          steps:
          
          - task: Bash@3
