                echo "##[debug] SCRIPTS_TARGETFOLDER=$(SCRIPTS_TARGETFOLDER)"
                echo "##[debug] ARTIFACT_TARGETFOLDER=$(ARTIFACT_TARGETFOLDER)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_BRN=$(WEBLOGIC_ADMIN_SERVER_URL_BRN)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_CIC=$(WEBLOGIC_ADMIN_SERVER_URL_CIC)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_NDC=$(WEBLOGIC_ADMIN_SERVER_URL_NDC)"
                echo "##[debug] Pipeline.Workspace=$(Pipeline.Workspace)"
                echo "##[debug] Build.SourcesDirectory=$(Build.SourcesDirectory)"
                echo "##[debug] deployBRN=${{ parameters.deployBRN }}"
                echo "##[debug] deployCIC=${{ parameters.deployCIC }}"
                echo "##[debug] deployNDC=${{ parameters.deployNDC }}"
            displayName: '🔍 Debug variáveis'
            condition: eq(variables['System.Debug'], 'true')

          # - task: SSH@0
          #   displayName: Testa Conexao ROT QA4
