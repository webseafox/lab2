            - ${{ if eq(parameters.deployBRN, true) }}:
                - task: CopyFilesOverSSH@0
                  name: CopyFilesBRN
                  displayName: '📤 Transfer WAR to BRN'
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_ROTEAMENTO_BRN_PRD
                    contents: '**/*.war'
                    readyTimeout: '20000'
                    targetFolder: '$(ARTIFACT_TARGETFOLDER)'
                    sourceFolder: '$(Pipeline.Workspace)/middleware'
                
                - task: SSH@0
                  displayName: '🗑️ Undeploy app BRN'
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_ROTEAMENTO_BRN_PRD'
                    runOptions: 'commands'
                    commands: |
                      CRED_FILE=$(mktemp /tmp/wlst_creds.XXXXXX)
                      chmod 600 "$CRED_FILE"
                      echo "$(WEBLOGIC_USER)" > "$CRED_FILE"
                      echo "$(WEBLOGIC_PASS)" >> "$CRED_FILE"
                      sudo -u weblogic $(WLST_SCRIPT) $(SCRIPTS_TARGETFOLDER)/UndeployApp.py --cred-file "$CRED_FILE" $(WEBLOGIC_ADMIN_SERVER_URL_BRN) $(APP)
                      STATUS=$?
                      rm -f "$CRED_FILE"
                      exit $STATUS
                    readyTimeout: '20000'

                - task: SSH@0
                  name: CleanDeployBRN
                  displayName: '🚀 Clean Deploy WLST BRN'
