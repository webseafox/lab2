            - task: PowerShell@2
              displayName: '🏷️ Atualiza STATUS no VERSION.md'
              condition: and(succeeded(), ${{ eq(parameters.skipAtualizaVersionMd, false) }})
              inputs:
                targetType: 'inline'
                script: |
                  $version = "${{ parameters.packageVersion }}"
                  $deployDate = Get-Date -Format "dd/MM/yyyy"
                  $file = "VERSION.md"
                  if (Test-Path $file) {
                    $lines = Get-Content $file
                    for ($i = 0; $i -lt $lines.Length; $i++) {
                      if ($lines[$i] -match "^\|\s*$version\s*\|[^|]*\|[^|]*\|\s*Not deployed\s*\|") {
                        $lines[$i] = $lines[$i] -replace "\|\s*Not deployed\s*\|", "| $deployDate |"
                        Write-Host "Versão $version marcada como deployada em $deployDate"
                        break
                      }
                    }
                    $lastUpdated = Get-Date -Format "MMMM yyyy"
                    $newContent = ($lines -join "`n") -replace '\*Last updated: [^*]+\*', "*Last updated: $lastUpdated*"
                    Set-Content $file -Value $newContent -Encoding UTF8
                    Write-Host "VERSION.md atualizado - versão $version deployada"
                  } else {
                    Write-Error "VERSION.md não encontrado!"
                    exit 1
                  }
                workingDirectory: '$(Build.SourcesDirectory)'
            

            - task: CmdLine@2
              displayName: '📝 Commit status de deploy no VERSION.md'
              condition: and(succeeded(), ${{ eq(parameters.skipAtualizaVersionMd, false) }})
              inputs:
                script: |
                  git config --local user.email "devops-automation@telefonicati.onmicrosoft.com"
                  git config --local user.name "DevOps Automation"
                  git checkout master || git checkout -b master
                  git add VERSION.md
                  git commit -m "chore: marca versão ${{ parameters.packageVersion }} como deployada"
                  git push origin master
                workingDirectory: '$(Build.SourcesDirectory)'


            # Sincroniza VERSION.md em todas as branchs remotas
            - task: CmdLine@2
              displayName: '🔃 Sync VERSION.md em todas as branches'
              condition: and(succeeded(), ${{ eq(parameters.skipAtualizaVersionMd, false) }})
              inputs:
                script: |
                  BRANCH_NAME=$(echo $(Build.SourceBranch) | sed 's#refs/heads/##')
                  if ! git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
                    git fetch origin $BRANCH_NAME
                    git checkout $BRANCH_NAME
                  fi
                  for BRANCH in $(git branch -r | grep -v "$BRANCH_NAME" | grep -v '\->' | sed 's#origin/##'); do
                    echo "Sincronizando VERSION.md para $BRANCH"
                    git fetch origin $BRANCH || continue
                    git checkout $BRANCH
                    git pull origin $BRANCH
                    git checkout $BRANCH_NAME -- VERSION.md
                    git add VERSION.md
                    git commit -m "chore: sincroniza VERSION.md da branch $BRANCH_NAME" || echo "Nada a commitar em $BRANCH."
                    git status
                    git push origin $BRANCH
                  done
                workingDirectory: '$(Build.SourcesDirectory)'

            - task: VivoEventHubTools@2
              displayName: '📡 Registro de deploy no EventHub'
              condition: always()
              continueOnError: true
              inputs:
                command: 'deploy'
                eventHubConnection: 'EVHCodeProd'
                componentVersion: '${{ parameters.packageVersion }}'
                deployArtifactName: '$(APP)'
                deployArtifactType: 'war'
                deployEnvironmentType: 'weblogic'
                deployEnvironmentName: '${{ parameters.environment }}'
                annotations: 'deploy-mechanism=wlst,artifact-type=war,server-type=weblogic,sites=BRN/CIC/NDC'
                pipelineType: 'tech_products/ccin/middleware'

        on:
          success:
            steps:
            - task: Bash@3
              displayName: '✅ Deploy success'
              name: t_success_message
              inputs:
                targetType: inline
                script: |
                  echo "##[section]================================================================================================================================="
                  echo "##[section]                                                 SUCCESS WEBLOGIC DEPLOY"
                  echo "##[section]================================================================================================================================="
                  echo "##[section]Parabéns o artefato '$(APP)' versão '${{ parameters.packageVersion }}' foi publicado com sucesso no Weblogic"
                  echo "##[section]"
                  echo "##[section]================================================================================================================================="

          failure:
            steps:
            - task: Bash@3
              displayName: '❌ Deploy failure'
              name: t_failure_message
              inputs:
                targetType: inline
                script: |
                  echo "##[error] ================================================================================================================================="
                  echo "##[error]                                                  FAILURE WEBLOGIC DEPLOY"
                  echo "##[error] ================================================================================================================================="
                  echo "##[error] Deploy do artefato '$(APP)' falhou para o(s) ambiente(s) selecionado(s)."
                  echo "##[error] "
                  echo "##[error] ================================================================================================================================="