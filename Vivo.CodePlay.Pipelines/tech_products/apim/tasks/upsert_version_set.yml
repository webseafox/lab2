parameters:
- name: serviceConnectionSuffix
  type: string
  default: "$(subscriptionEnv)"
- name: subscriptionId
  type: string
- name: resourceGroup
  type: string
- name: apimName
  type: string
- name: apiDisplayName
  type: string
- name: apiVersionSet
  type: string
- name: environment
  type: string
- name: versioningScheme
  type: string
  default: "Segment"
- name: description
  type: string
  default: "Last Modify On: $(System.TeamProject) - Build Id: $(Build.BuildId)"
- name: condition
  type: object
  default: succeeded()

steps:
- task: AzureCLI@2
  displayName: "Create / Update Version Set: ${{ parameters.apiVersionSet }}-${{ parameters.environment }}"
  condition: ${{ parameters.condition }}
  inputs:
    azureSubscription: $(serviceConnectionPrefixName)-${{ parameters.serviceConnectionSuffix }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      az account set --subscription "${{ parameters.subscriptionId }}"
      
      # Criar Version Set (idempotente)
      az apim api versionset create \
        --resource-group "${{ parameters.resourceGroup }}" \
        --service-name "${{ parameters.apimName }}" \
        --version-set-id "${{ parameters.apiVersionSet }}-${{ parameters.environment }}" \
        --display-name "${{ parameters.apiDisplayName }}-${{ parameters.environment }}" \
        --versioning-scheme "${{ parameters.versioningScheme }}" \
        --description "${{ parameters.description }}"

      echo "✅ Version Set criado ou atualizado com sucesso."
