parameters:
- name: serviceConnectionSuffix
  type: string
  default: "$(subscriptionEnv)"
- name: subscriptionId
  type: string
- name: resourceGroup
  type: string
- name: storageAccountName
  type: string
- name: environment
  type: string
- name: condition
  type: object
  default: succeeded()

steps:
- task: AzureCLI@2
  displayName: "Validate Credentials Uniqueness - ${{ parameters.environment }}"
  condition: ${{ parameters.condition }}
  name: validate_credentials
  inputs:
    azureSubscription: $(serviceConnectionPrefixName)-${{ parameters.serviceConnectionSuffix }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      az account set --subscription "${{ parameters.subscriptionId }}"

      CONFIG_FILE="$(Build.SourcesDirectory)/.azuredevops/env/${{ parameters.environment }}/client-config.json"
      if [ ! -f "$CONFIG_FILE" ]; then
        echo "##vso[task.logissue type=error] Client config file not found: $CONFIG_FILE"
        exit 1
      fi

      APP_ID=$(jq -r '.id' "$CONFIG_FILE" | tr '[:upper:]' '[:lower:]')
      APP_NAME=$(jq -r '.name' "$CONFIG_FILE")
      echo "##[debug] Validating credentials for application: $APP_NAME ($APP_ID)"

      # Get storage account key
      ACCOUNT_KEY=$(az storage account keys list \
        --account-name "${{ parameters.storageAccountName }}" \
        --resource-group "${{ parameters.resourceGroup }}" \
        --query '[0].value' -o tsv)

      CREDENTIALS=$(jq -c '.credentials // [] | .[]' "$CONFIG_FILE")
      if [ -z "$CREDENTIALS" ]; then
        echo "No credentials found in config. Skipping validation."
        exit 0
      fi

      HAS_ERROR=false

      while IFS= read -r cred; do
        CRED_VALUE=$(echo "$cred" | jq -r '.value')

        # Query credentials table for this credential value (RowKey)
        RESULT=$(az storage entity query \
          --table-name "credentials${{ parameters.environment }}" \
          --filter "RowKey eq '${CRED_VALUE}'" \
          --account-name "${{ parameters.storageAccountName }}" \
          --account-key "$ACCOUNT_KEY" \
          -o json 2>/dev/null || echo '{"items":[]}')

        # Check if credential exists under a different application (PartitionKey)
        CONFLICT=$(echo "$RESULT" | jq -r ".items[] | select(.PartitionKey != \"${APP_ID}\") | .PartitionKey" | head -1)

        if [ -n "$CONFLICT" ]; then
          echo "##vso[task.logissue type=error] ❌ Credential '${CRED_VALUE}' is already associated with application '${CONFLICT}'. A credential can only belong to one application."
          HAS_ERROR=true
        else
          echo "✅ Credential '${CRED_VALUE}' - validation passed."
        fi
      done <<< "$CREDENTIALS"

      if [ "$HAS_ERROR" = true ]; then
        echo "##vso[task.logissue type=error] Credential validation failed. One or more credentials are already associated with different applications."
        exit 1
      fi

      echo "✅ All credentials validated successfully!"
