parameters:
- name: serviceConnectionSuffix
  type: string
  default: "$(subscriptionEnv)"
- name: subscriptionId
  type: string
- name: resourceGroup
  type: string
- name: storageAccountName
  type: string
- name: environment
  type: string
- name: condition
  type: object
  default: succeeded()

steps:
- task: AzureCLI@2
  displayName: "Upsert Credentials - ${{ parameters.environment }}"
  condition: ${{ parameters.condition }}
  name: upsert_credentials
  inputs:
    azureSubscription: $(serviceConnectionPrefixName)-${{ parameters.serviceConnectionSuffix }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      az account set --subscription "${{ parameters.subscriptionId }}"

      CONFIG_FILE="$(Build.SourcesDirectory)/.azuredevops/env/${{ parameters.environment }}/client-config.json"
      if [ ! -f "$CONFIG_FILE" ]; then
        echo "##vso[task.logissue type=error] Client config file not found: $CONFIG_FILE"
        exit 1
      fi

      APP_ID=$(jq -r '.id' "$CONFIG_FILE" | tr '[:upper:]' '[:lower:]')
      APP_NAME=$(jq -r '.name' "$CONFIG_FILE")
      echo "##[debug] Upserting credentials for application: $APP_NAME ($APP_ID)"

      # Get storage account key
      ACCOUNT_KEY=$(az storage account keys list \
        --account-name "${{ parameters.storageAccountName }}" \
        --resource-group "${{ parameters.resourceGroup }}" \
        --query '[0].value' -o tsv)

      CREDENTIALS=$(jq -c '.credentials // [] | .[]' "$CONFIG_FILE")
      if [ -z "$CREDENTIALS" ]; then
        echo "No credentials found in config. Skipping."
        exit 0
      fi

      CRED_COUNT=0

      while IFS= read -r cred; do
        CRED_TYPE=$(echo "$cred" | jq -r '.type')
        CRED_VALUE=$(echo "$cred" | jq -r '.value')
        CRED_ENABLED=$(echo "$cred" | jq -r '.enabled')

        # Upsert credential entity
        # PartitionKey = application ID (RowKey da tabela applications)
        # RowKey = clientID ou thumbprint
        az storage entity insert \
          --table-name "credentials${{ parameters.environment }}" \
          --entity \
            PartitionKey="${APP_ID}" \
            RowKey="${CRED_VALUE}" \
            type="${CRED_TYPE}" \
            enabled="${CRED_ENABLED}" \
            enabled@odata.type=Edm.Boolean \
          --if-exists merge \
          --account-name "${{ parameters.storageAccountName }}" \
          --account-key "$ACCOUNT_KEY"

        echo "  ✅ Credential '${CRED_VALUE}' upserted."
        CRED_COUNT=$((CRED_COUNT + 1))
      done <<< "$CREDENTIALS"

      echo "✅ ${CRED_COUNT} credential(s) upserted for application '${APP_NAME}'!"
