parameters:
- name: shortEnv
  type: string
  default: dev

variables:
- group: "azdo-team-project-variables"

- ${{ if eq(parameters.shortEnv, 'prod') }}:
  - name: subscriptionEnv
    value: prod
- ${{ elseif eq(parameters.shortEnv, 'noprod') }}:
  - name: subscriptionEnv
    value: test
- ${{ else }}:
  - name: subscriptionEnv
    value: dev
