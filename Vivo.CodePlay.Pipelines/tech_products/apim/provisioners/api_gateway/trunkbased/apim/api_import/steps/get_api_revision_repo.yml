steps:
- script: |
    set -euo pipefail

    CURRENT_API_REVISION=$(cat REVISION)
    echo "##[debug] CURRENT_API_REVISION..: ${CURRENT_API_REVISION}"

    echo "##vso[task.setvariable variable=CURRENT_API_REVISION;isoutput=true]${CURRENT_API_REVISION}"
    echo "##vso[task.logissue type=warning;] Current API Revision: ${CURRENT_API_REVISION}"
  displayName: Get current REVISION
  condition: succeeded()
  name: get_api_revision_repo
  workingDirectory: $(Build.SourcesDirectory)
