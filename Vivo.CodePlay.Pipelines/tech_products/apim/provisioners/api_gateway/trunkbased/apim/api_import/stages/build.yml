parameters:
- name: privateAgentPool
  type: string
  default: $(PRIVATE_AGENT_DEFAULT)

stages:
- stage: stage_build
  pool: ${{ parameters.privateAgentPool }}
  displayName: Build
  condition: eq(variables.flowIsMain, true)
  dependsOn: []
  jobs:
  - job: job_get_revision
    displayName: 'Get API Revision'
    steps:
    - checkout: self
      clean: true
      persistCredentials: true
    - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/steps/get_api_revision_repo.yml
  - job: job_bump_revision
    displayName: 'Bump API Revision'
    dependsOn:
      - job_get_revision
    variables:
      - name: CURRENT_API_REVISION
        value: $[ dependencies.job_get_revision.outputs['get_api_revision_repo.CURRENT_API_REVISION'] ]
    steps:
    - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
      - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/task_groups/bump_version.yml
        parameters:
          currentVersion: $(CURRENT_API_REVISION)
          newVersionVariableOut: 'NEW_API_REVISION'
          incrementLevel: 'minor'
          bumpVersionOnManual: true
    - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/') }}:
      - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/task_groups/bump_version.yml
        parameters:
          currentVersion: $(CURRENT_API_REVISION)
          newVersionVariableOut: 'NEW_API_REVISION'
          incrementLevel: 'patch'
          bumpVersionOnManual: true