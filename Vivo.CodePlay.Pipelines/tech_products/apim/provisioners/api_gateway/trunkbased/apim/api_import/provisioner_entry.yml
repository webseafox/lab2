parameters:
- name: shortEnv
  type: string
- name: details
  type: string
- name: noprodEnvironments
  type: object
  default:
  - esteira1
  - esteira2
  - preprod
  - prodlike

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CodePlay

variables:
  - template: /global/variables/pipeline.yml@CorePipelines
  - template: /tech_products/apim/global/variables/load.yml
    parameters:
      shortEnv: ${{ parameters.shortEnv }}

stages: 
# CI / CD Flow
- ${{ if or( in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/') ) }}:
  ## BUILD
  - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/stages/build.yml

  ## VALIDATIONS
  #- template: /provisioners/app/trunkbased/java/api_default/stages/validation.yml@CorePipelines

  ## DEPLOY DEV
  - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/stages/deploy.yml
    parameters:
      environment: "dev"
      description: ${{ parameters.details }}
      dependsOn: stage_build

  # MANUAL DEPLOY
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
  - ${{ if eq(parameters.shortEnv, 'noprod') }}:
    - ${{ each noprodEnvironment in parameters.noprodEnvironments }}:
      - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/stages/deploy.yml
        parameters:
          environment: ${{ noprodEnvironment }}
          description: ${{ parameters.details }}
          deployComponentVersion: ${{ replace(variables['Build.SourceBranch'], 'refs/tags/', '') }}
  - ${{ else }}:
    - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apim/api_import/stages/deploy.yml
      parameters:
        environment: ${{ parameters.shortEnv }}
        description: ${{ parameters.details }}
        deployComponentVersion: ${{ replace(variables['Build.SourceBranch'], 'refs/tags/', '') }}