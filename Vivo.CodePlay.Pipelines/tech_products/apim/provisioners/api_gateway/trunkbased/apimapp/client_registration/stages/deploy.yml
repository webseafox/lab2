parameters:
- name: environment
  type: string
- name: privateAgentPool
  type: string
  default: $(PRIVATE_AGENT_SHARED)
- name: dependsOn
  type: object
  default: []

stages:
- stage: deploy_${{ parameters.environment }}
  pool: ${{ parameters.privateAgentPool }}
  displayName: "Deploy Client Registry - ${{ parameters.environment }}"
  variables:
    - template: /.azuredevops/env/${{ parameters.environment }}/apiconfig.yml@self
  dependsOn: ${{ parameters.dependsOn }}
  jobs:
  # ===== Validação de Credentials =====
  # Verifica se alguma credential já está associada a outra application
  - job: validate_credentials_${{ parameters.environment }}
    displayName: "Validate Credentials - ${{ parameters.environment }}"
    steps:
    - checkout: self
      clean: true
    - template: /tech_products/apim/tasks/validate_credentials.yml
      parameters:
        subscriptionId: $(subscriptionId)
        resourceGroup: $(resourceGroup)
        storageAccountName: $(storageAccountName)
        environment: ${{ parameters.environment }}

  # ===== Upsert de Entities no Table Storage =====
  # Insere/atualiza application, credentials e allowed APIs
  - deployment: upsert_${{ parameters.environment }}
    dependsOn:
      - validate_credentials_${{ parameters.environment }}
    workspace:
      clean: all
    displayName: "Upsert Client Registry - ${{ parameters.environment }}"
    environment: "deploy-${{ parameters.environment }}"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # 1. Upsert Application
          - template: /tech_products/apim/tasks/upsert_application.yml
            parameters:
              subscriptionId: $(subscriptionId)
              resourceGroup: $(resourceGroup)
              storageAccountName: $(storageAccountName)
              environment: ${{ parameters.environment }}

          # 2. Upsert Credentials
          - template: /tech_products/apim/tasks/upsert_credentials.yml
            parameters:
              subscriptionId: $(subscriptionId)
              resourceGroup: $(resourceGroup)
              storageAccountName: $(storageAccountName)
              environment: ${{ parameters.environment }}

          # 3. Upsert Allowed APIs
          - template: /tech_products/apim/tasks/upsert_allowed_apis.yml
            parameters:
              subscriptionId: $(subscriptionId)
              resourceGroup: $(resourceGroup)
              storageAccountName: $(storageAccountName)
              environment: ${{ parameters.environment }}
