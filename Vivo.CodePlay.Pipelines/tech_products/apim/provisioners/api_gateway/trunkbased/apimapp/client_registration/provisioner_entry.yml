parameters:
- name: shortEnv
  type: string
- name: noprodEnvironments
  type: object
  default:
  - esteira1
  - esteira2
  - preprod
  - prodlike

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/v1
      endpoint: CodePlay

variables:
  - template: /global/variables/pipeline.yml@CorePipelines
  - template: /tech_products/apim/global/variables/load.yml
    parameters:
      shortEnv: ${{ parameters.shortEnv }}

stages:
# CI / CD Flow AND MANUAL DEPLOY
- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  - ${{ if eq(parameters.shortEnv, 'noprod') }}:
    - ${{ each noprodEnvironment in parameters.noprodEnvironments }}:
      - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apimapp/client_registration/stages/deploy.yml
        parameters:
          environment: ${{ noprodEnvironment }}
          dependsOn: []
  - ${{ else }}:
    - template: /tech_products/apim/provisioners/api_gateway/trunkbased/apimapp/client_registration/stages/deploy.yml
      parameters:
        environment: ${{ parameters.shortEnv }}
        dependsOn: []
