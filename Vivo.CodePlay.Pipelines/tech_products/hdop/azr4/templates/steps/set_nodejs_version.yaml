parameters:
  - name: NODE_VERSION
    type: string
    default: ''
steps:
  - script: |
      if [[ -s .nvmrc ]]; then
        echo "##[debug] .nvmrc detected, using node version specified in .nvmrc"
        export NODE_VERSION=$(cat .nvmrc)
        echo "##[debug] validate if is using in semantic format"
        if [[ ! $NODE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "##[warning] Invalid NODE_VERSION format. trying the best to convert, please consider using envs.NODE_VERSION parameter and semantic versioning format"
          if [[ $NODE_VERSION =~ ^v[0-9]+\.[0-9]+$ ]]; then
            export NODE_VERSION="${NODE_VERSION//v}.0"
          fi
        fi
      fi
      echo "##[debug] NODE_VERSION: $NODE_VERSION"
      if [[ "${NODE_VERSION}" != '' ]]; then
        echo "##[debug] adding nodejs $NODE_VERSION to .tool-versions"
        asdf install nodejs $NODE_VERSION
        echo "nodejs $NODE_VERSION" > .tool-versions
      fi
      node --version
    displayName: 'Set Node.js version'
    env:
      NODE_VERSION: $(NODE_VERSION)