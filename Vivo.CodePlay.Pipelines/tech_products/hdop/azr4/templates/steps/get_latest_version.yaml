steps:  
  - task: Bash@3
    name: get_version
    displayName: 'Get version'
    continueOnError: false
    env:
      BRANCH_NAME: $(Build.SourceBranchName)
      BRANCHING_STRATEGY: $(BRANCHING_STRATEGY)
    inputs:
      targetType: inline
      script: |
        #!/bin/bash
        if [ -d "$(Agent.BuildDirectory)/source" ]; then
            cd "$(Agent.BuildDirectory)/source" || { echo "##[error] Failed to change directory"; exit 1; }
        fi
        if [[ "$VERSION" == 'latest' && "$BRANCHING_STRATEGY" != 'gitlabflow' ]]; then
            export VERSION=$(git for-each-ref --sort=creatordate --format '%(refname:short)' refs/tags | tail -n 1)
        elif [[ "$VERSION" == 'latest' && "$BRANCHING_STRATEGY" == 'gitlabflow' ]]; then
            if [[ -z "$BRANCH_NAME" ]]; then
                echo "##vso[task.logissue type=error] BRANCH_NAME não está definido"
                exit 1
            fi
            export VERSION=$(git for-each-ref --sort=creatordate --format '%(refname:short)' refs/tags | grep -E "^${BRANCH_NAME}-[a-f0-9]+$" | tail -n 1)
        fi
        if ! [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+|${BRANCH_NAME}-[a-f0-9]+|[0-9]+\.[0-9]+\.[0-9]+-${BRANCH_NAME}|${BRANCH_NAME}-[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "##[error] Version '${VERSION}' is not in a known format"
            exit 1
        fi

        
        export VERSION=${VERSION}
        echo "##[debug] Version: ${VERSION}"
        echo "##vso[task.setvariable variable=VERSION;isOutput=true]${VERSION}"