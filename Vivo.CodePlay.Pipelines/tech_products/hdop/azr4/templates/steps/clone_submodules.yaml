# Task desenvolvida como medida paleativa para clonar submódulos de repositórios privados
# https://developercommunity.visualstudio.com/t/Clone-Submodule-Error:-The-Git-repositor/10823634
parameters:
  - name: cloneGitSubmodules
    type: string
    default: 'false'
  - name: azureDevOpsPATToken
    type: string
    default: variables['AZ_DEVOPS_PAT_TOKEN']


steps:  
  - task: Bash@3
    name: clone_submodules
    displayName: 'Clone Git Submodules'
    continueOnError: false
    #condition: ${{ parameters.cloneGitSubmodules }} Nao funciona -_-
    inputs:
      targetType: inline
      script: |
        #!/bin/bash
        if [[ "${CLONE_GIT_SUBMODULES}" == 'false' ]]; then
          echo "##[debug] Skipping clone of submodules"
          exit 0
        fi
        set -e
        echo "##[warning] Essa task é apenas paliativa, não é a melhor prática, mas visa resolver o problema de clone de submódulos em repositórios privados"
        if [ -z "$(cat .gitmodules)" ]; then
          echo "##[debug] No submodules found"
          exit 0
        fi
        GIT_SUBMODULES_LIST=$(cat .gitmodules | grep 'url = ' | awk '{print $3}')
        for submodule in $GIT_SUBMODULES_LIST; do
          echo "##[debug] Cloning submodule: $submodule"
          GIT_MODULE_AUTH_URL=$(echo $submodule | sed 's/https:\/\/telefonica-vivo-brasil@/https:\/\/telefonica-vivo-brasil:$(AZ_DEVOPS_PAT_TOKEN)@/')
          git clone $GIT_MODULE_AUTH_URL
          ls -la
        done
    env:
      AZ_DEVOPS_PAT_TOKEN: ${{ parameters.azureDevOpsPATToken }}
      CLONE_GIT_SUBMODULES: ${{ parameters.cloneGitSubmodules }}
