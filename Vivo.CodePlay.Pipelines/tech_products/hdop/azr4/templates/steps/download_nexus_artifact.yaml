parameters:
  - name: file
    type: string
  - name: repository
    type: string
    default: '4plataforma-raw'
  - name: folder
    type: string
    default: 'devops-bin'
  - name: outputFilePath
    type: string
  - name: version
    type: string
    default: ''
  - name: chmod
    type: string
    default: '644'
  - name: fileExtension
    type: string
    default: ''
  - name: nexusUrl
    type: string
    default: 'https://nexus.telefonicabigdata.com/repository'

steps:
  - task: Bash@3
    displayName: 'Download Nexus Artifact'
    env:
      DOWNLOAD_NEXUS_PASSWORD: $(NEXUS_PASSWORD)
      DOWNLOAD_NEXUS_USERNAME: $(NEXUS_USERNAME)
      DOWNLOAD_FILE: ${{ parameters.file }}
      DOWNLOAD_REPOSITORY: ${{ parameters.repository }}
      DOWNLOAD_FOLDER: ${{ parameters.folder }}
      DOWNLOAD_OUTPUT_FILE_PATH: ${{ parameters.outputFilePath }}
      DOWNLOAD_VERSION: ${{ parameters.version }}
      DOWNLOAD_CHMOD: ${{ parameters.chmod }}
      DOWNLOAD_FILE_EXTENSION: ${{ parameters.fileExtension }}
      DOWNLOAD_NEXUS_URL: ${{ parameters.nexusUrl }}
    inputs:
      targetType: 'inline'
      script: |
        #!/bin/bash
      
        file="${DOWNLOAD_FILE}"
        repository="${DOWNLOAD_REPOSITORY}"
        folder="${DOWNLOAD_FOLDER}"
        outputFilePath="${DOWNLOAD_OUTPUT_FILE_PATH}"
        version="${DOWNLOAD_VERSION}"
        chmod="${DOWNLOAD_CHMOD}"
        fileExtension="${DOWNLOAD_FILE_EXTENSION}"
        nexusUrl="${DOWNLOAD_NEXUS_URL}"

        if [ -f "$outputFilePath" ]; then
            echo "##[debug] O arquivo '$outputFilePath' já existe. skiping..."
            exit 0
        fi

        echo "##[debug] Downloading '${file}' with version '${version} 'from Nexus repository '${repository}' in folder '${folder}' ..."

        TOKEN=$(echo -n ${DOWNLOAD_NEXUS_USERNAME}:${DOWNLOAD_NEXUS_PASSWORD} | base64 -w0)
        
        fileVersion=""

        if [ -n "$version" ]; then
            fileVersion="${file}-${version}"
        fi
        if [ -n "$fileExtension" ]; then
            fileVersion="${fileVersion}.${fileExtension}"
        fi

        urlList=("$repository" "$folder" "$file" "$version" "$fileVersion")
        url=""

        for element in "${urlList[@]}"; do
            if [ -n "$element" ]; then
              url="$url/$element"
            fi
        done
        url="${nexusUrl}${url}"

        echo "##[debug] Downloading '${url}' ..."
        HTTP_STATUS=$(curl --location --request GET "${url}" \
            --header "Authorization: Basic ${TOKEN}" \
            -o "${outputFilePath}" \
            -w "%{http_code}")

        if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "##vso[task.logissue type=error] Download failed with status code $HTTP_STATUS"
            exit 1
        fi

        if [ -n "$chmod" ]; then
            chmod ${chmod} ${outputFilePath}
        fi
        echo "##[debug] Downloaded ${outputFilePath}"