variables:
- ${{ if not(variables.MULTI_CONTAINERAPP) }}:
  - name: MULTI_CONTAINERAPP
    value: false
- name: AZURE_CLIENT_ID
  value: $(HML_AZURE_CLIENT_ID)
- name: AZURE_CLIENT_SECRET
  value: $(HML_AZURE_CLIENT_SECRET)
- name: AZURE_TENANT_ID
  value: $(AZURE_TENANT_ID)
- name: AZURE_SUBSCRIPTION
  value: $(HML_AZURE_SUBSCRIPTION)