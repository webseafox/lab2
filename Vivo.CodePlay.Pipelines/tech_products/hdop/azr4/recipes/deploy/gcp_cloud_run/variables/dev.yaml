parameters:
- name: 'envs'
  type: object
  default: {}


variables:
- name: GCP_CRED_FILE_B64
  value: $(DEV_GCP_CRED_FILE_B64)
- name: IMAGE_REGISTRY
  value: $(DEV_IMAGE_REGISTRY)
- name: GCP_PROJECT_NAME
  value: $(DEV_GCP_PROJECT_NAME)
- name: ENVIRONMENT
  value: dev
- name: IMAGE_NAME
  value: ${{ coalesce(parameters.envs.DEV_IMAGE_NAME, variables['Build.Repository.Name']) }}
- name: DEFAULT_CLOUDRUN_JOB_FILE_PATH
  value: gcp/$(ENVIRONMENT)-job.yaml
- name: DEPLOY_AND_EXECUTE_JOB
  value: ${{ coalesce( parameters.envs.DEPLOY_AND_EXECUTE_JOB, 'false') }}
- name: DEPLOY_CLI_SERVICE
  value: ${{ coalesce( parameters.envs.DEPLOY_CLI_SERVICE, 'false') }}
- name: CLOUDRUN_JOB_FILE_PATH
  value:  ${{ coalesce( parameters.envs.DEV_CLOUDRUN_JOB_FILE_PATH, variables['DEFAULT_CLOUDRUN_JOB_FILE_PATH']) }}
- name: DEFAULT_CLOUDRUN_CLI_FILE_PATH
  value: gcp/$(ENVIRONMENT)-cli.yaml
- name: CLOUDRUN_CLI_FILE_PATH
  value:  ${{ coalesce( parameters.envs.DEV_CLOUDRUN_CLI_FILE_PATH, variables['DEFAULT_CLOUDRUN_CLI_FILE_PATH']) }}
- name: DEPLOY_SERVICE
  value: ${{ coalesce( parameters.envs.DEPLOY_SERVICE, 'true') }}
- name: DEFAULT_CLOUDRUN_FILE_PATH
  value: gcp/$(ENVIRONMENT).yaml
- name: CLOUDRUN_FILE_PATH
  value:  ${{ coalesce( parameters.envs.DEV_CLOUDRUN_FILE_PATH, variables['DEFAULT_CLOUDRUN_FILE_PATH']) }}
## VOLUME CONFIGURATION ##############
- name: CREATE_VOLUME
  value: ${{ coalesce( parameters.envs.CREATE_VOLUME, 'false') }}
- name: VOLUME_NAME
  value: ${{ coalesce( parameters.envs.VOLUME_NAME, 'cloud-run-volume') }}
- name: VOLUME_TYPE
  value: ${{ coalesce( parameters.envs.VOLUME_TYPE, 'cloud-storage') }}
- name: VOLUME_MOUNT_PATH
  value: ${{ coalesce( parameters.envs.VOLUME_MOUNT_PATH, '/usr/src/app/src/images/') }}
- name: VOLUME_BUCKET
  value: ${{ coalesce( parameters.envs.DEV_VOLUME_BUCKET, 'dev-amazonia-vale-saude-portal') }}  
