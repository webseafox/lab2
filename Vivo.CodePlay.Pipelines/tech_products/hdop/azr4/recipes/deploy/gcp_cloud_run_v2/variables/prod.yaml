parameters:
- name: 'envs'
  type: object
  default: {}


variables:
- ${{ if eq(parameters.envs.PROD_GCP_CRED_FILE_B64, 'POC_GCP_CRED_FILE_B64') }}:
  - name: PROD_GCP_CRED_FILE_B64
    value:  $(POC_GCP_CRED_FILE_B64)
- name: GCP_CRED_FILE_B64
  value: $(PROD_GCP_CRED_FILE_B64)
- name: IMAGE_REGISTRY
  value: ${{ coalesce(parameters.envs.PROD_IMAGE_REGISTRY, variables['PROD_IMAGE_REGISTRY']) }}
- name: GCP_PROJECT_NAME
  value: ${{ coalesce(parameters.envs.PROD_GCP_PROJECT_NAME, variables['PROD_GCP_PROJECT_NAME']) }}
- name: ENVIRONMENT
  value: prod
- name: IMAGE_NAME
  value: ${{ coalesce(parameters.envs.PROD_IMAGE_NAME, variables['Build.Repository.Name']) }}
- name: DEPLOY_AND_EXECUTE_JOB
  value: ${{ coalesce( parameters.envs.DEPLOY_AND_EXECUTE_JOB, 'false') }}
- name: DEFAULT_CLOUDRUN_JOB_FILE_PATH
  value: gcp/$(ENVIRONMENT)-job.yaml
- name: CLOUDRUN_JOB_FILE_PATH
  value:  ${{ coalesce( parameters.envs.PROD_CLOUDRUN_JOB_FILE_PATH, variables['DEFAULT_CLOUDRUN_JOB_FILE_PATH']) }}
- name: DEFAULT_CLOUDRUN_CLI_FILE_PATH
  value: gcp/$(ENVIRONMENT)-cli.yaml
- name: CLOUDRUN_CLI_FILE_PATH
  value:  ${{ coalesce( parameters.envs.PROD_CLOUDRUN_CLI_FILE_PATH, variables['DEFAULT_CLOUDRUN_CLI_FILE_PATH']) }}
- name: DEPLOY_SERVICE
  value: ${{ coalesce( parameters.envs.DEPLOY_SERVICE, 'true') }}
- name: DEFAULT_CLOUDRUN_FILE_PATH
  value: gcp/$(ENVIRONMENT).yaml
- name: CLOUDRUN_FILE_PATH
  value:  ${{ coalesce( parameters.envs.PROD_CLOUDRUN_FILE_PATH, variables['DEFAULT_CLOUDRUN_FILE_PATH']) }}
