jobs:
  - job: prep
    pool: GeneralPurposeLinuxAgentsCI
    workspace:
      clean: all
    steps:
    # - task: AzureKeyVault@2
    #   displayName: 'Getting AKV Credentials'
    #   timeoutInMinutes: 1
    #   retryCountOnTaskFailure: 5
    #   inputs:
    #     azureSubscription: 'DevOpsSharedResources'
    #     KeyVaultName: 'kv-azdevops-shared'
    #     SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'
    # - script: echo "##vso[task.setvariable variable=NEXUS_DEFAULT_USR]$(NEXUS-DEPS-USR)"
    #   displayName: Set NEXUS_DEFAULT_USR Var
    # - script: echo "##vso[task.setvariable variable=NEXUS_DEFAULT_PSW]$(NEXUS-DEPS-PSW)"
    #   displayName: Set NEXUS_DEFAULT_PSW Var
    
    - task: DownloadSecureFile@1
      name: CustomSettings
      displayName: 'Download custom settings.xml from secure file'
      inputs:
        secureFile: settings.xml

    - script: echo "##vso[task.setvariable variable=MAVEN_SETTINGS]$(CustomSettings.secureFilePath)"
      displayName: Set MAVEN_SETTINGS Var

    - bash: |
        echo "##[debug]DEFAULT_SETTINGS_TEMP_FILE_PATH.....: ${MAVEN_SETTINGS}"
  
        if [ -f ${MAVEN_SETTINGS} ]; then
          echo "##[debug]O arquivo settings.xml foi encontrado!"
        else
          echo "##vso[task.logissue type=error]O arquivo settings.xml não foi encontrado!"
          echo "##[error]O arquivo settings.xml não foi encontrado!"
          exit 1;
        fi
      displayName: "Setting up settings.xml"