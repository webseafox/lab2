jobs:
- job: security
  pool: GeneralPurposeLinuxAgentsCI
  continueOnError: false
  steps:
    - template: /tech_products/hdop/templates/steps/download_nexus_artifact.yaml
      parameters:
        file: 'securitygatecli-linux-amd64'
        folder: 'devops'
        outputFilePath: 'securitygatecli'
        version: $(SECURITY_GATE_CLI_VERSION)
        chmod: 755
    - script: |
        SIGLA=$(echo ${AZDO_PROJECT} | cut -d' ' -f1)
        if [[ "${SIGLA}" == "VVMY" ]]; then
          echo "##[debug] SIGLA: ${SIGLA} -> Setting COMPANY_ID to 639."
          export COMPANY_ID=639
        elif [[ "${SIGLA}" == "VLSS" ]]; then
          echo "##[debug] SIGLA: ${SIGLA} -> Setting COMPANY_ID to 862."
          export COMPANY_ID=862
        fi
        echo "##[debug] Executing Security Gates Company ID: ${COMPANY_ID}"
        ./securitygatecli verify \
          --project "${AZDO_PROJECT}" \
          --project-id ${PROJECT_ID} \
          --id ${COMPONENT_ID} \
          --name "${COMPONENT_NAME}" \
          --company-id ${COMPANY_ID} \
          ${SECURITY_GATE_CLI_ARGS}
      displayName: 'Verify Securtiy Gates'
      condition: succeeded()
      env:
        AZURE_APP_CONFIG_CONNECTION_STRING: $(AZURE_APP_CONFIG_CONNECTION_STRING)
        API_KEY: $(CONVISO_API_KEY)
        AZDO_PROJECT: $(System.TeamProject)
        COMPONENT_NAME: $(Build.Repository.Name)
        PROJECT_ID: $(System.TeamProjectId)
        COMPONENT_ID: $(Build.Repository.ID)
        COMPANY_ID: '439'
        SECURITY_GATE_CLI_ARGS: '--debug'