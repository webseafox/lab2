parameters:
- name: 'envs'
  type: object
  default: {}

variables:
- name: VERSION_FILE_PATH
  value: ${{ coalesce(parameters.envs.VERSION_FILE_PATH, 'package.json') }}
- name: CACHE_APP_DEPENDENCIES
  value: true
- name: PIPELINE_TECH
  value: 'node'
- name: EXECUTE_TESTS
  value: ${{ coalesce(parameters.envs.EXECUTE_TESTS, 'true') }}
- name: EXECUTE_BUILD
  value: ${{ coalesce(parameters.envs.EXECUTE_BUILD, 'true') }}
- name: NODE_VERSION
  value: ${{ coalesce(parameters.envs.NODE_VERSION, '18.x') }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.15' )}}