variables:
  - name: ENVIRONMENT
    value: 'hml'
  - name:  IMAGE_REGISTRY_CONNECTION
    value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION_QA1, parameters.envs.IMAGE_REGISTRY_CONNECTION, 'registry-telefonicabigdata') }}
  - ${{ if eq( parameters.envs.GCP_CONTAINER_REGISTRY, 'true') }}:
    - ${{ if ne(parameters.envs.GCP_PROJECT_NAME_QA1, '') }}:
      - name: GCP_PROJECT_NAME_QA1
        value: ${{ parameters.envs.GCP_PROJECT_NAME_QA1 }}
    - name: GCP_PROJECT_NAME
      value: $(GCP_PROJECT_NAME_QA1)
    - name: DEFAULT_REGISTRY_NAME
      value: $(GCP_PROJECT_NAME)-registry
    - name: GCP_REGISTRY_NAME
      value: ${{ coalesce(parameters.envs.GCP_REGISTRY_NAME_QA1, variables['DEFAULT_REGISTRY_NAME']) }}
    - name: IMAGE_NAME_QA1
      value: $(GCP_PROJECT_NAME)/$(GCP_REGISTRY_NAME)/$(Build.Repository.Name)    
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_QA1, variables['IMAGE_NAME_QA1']) }}
  - ${{ else }}:
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_QA1, parameters.envs.IMAGE_NAME, variables['Build.Repository.Name']) }}
  - name: DOCKER_BUILD_ARGS
    value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS_QA1, parameters.envs.DOCKER_BUILD_ARGS, '') }}