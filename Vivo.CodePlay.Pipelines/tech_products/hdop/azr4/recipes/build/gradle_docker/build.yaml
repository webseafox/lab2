    #   inputs:
    #     key: "sbt | $(Agent.OS) | **/build.sbt"
    #     path: "$(Build.SourcesDirectory)/.ivy2"
    #     restoreKeys: |
    #       sbt | $(Agent.OS)
    #       sbt
    # TODO
    - template: /tech_products/hdop/templates/steps/execute_in_docker.yaml
      parameters:
        image: 'registry.telefonicabigdata.com/gradle:7.5.1-jdk11-jammy-0'
        # imagem: https://git.telefonicabigdata.com/devops-commons/images-bases-4p/gradle
        script: |
          #!/bin/bash
