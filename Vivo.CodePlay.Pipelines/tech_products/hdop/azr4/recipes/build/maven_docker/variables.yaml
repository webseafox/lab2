variables:
- name: IMAGE_NAME
  value: '4thplatform/$(Build.Repository.Name)'
- name: IMAGE_REGISTRY_CONNECTION
  value: 'registry-telefonicabigdata'
- name: REGISTRY
  value: registry.telefonicabigdata.com
- name: DOCKERFILE_PATH
  value: 'Dockerfile'
- name: CACHE_RESTORED
  value: 'true'
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: 'settings.xml'
- name: MAVEN_CUSTOM_SETTINGS_SECURITY_FILE
  value: 'settings-security.xml'
- name: VERSION_FILE_PATH
  value: pom.xml
- name: PIPELINE_TECH
  value: 'java'
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.15' )}}