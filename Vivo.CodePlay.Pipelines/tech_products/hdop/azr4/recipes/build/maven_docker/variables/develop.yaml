variables:
  - name: ENVIRONMENT
    value: 'dev'
  - name:  IMAGE_REGISTRY_CONNECTION
    value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION_DEVELOP, parameters.envs.IMAGE_REGISTRY_CONNECTION, variables['IMAGE_REGISTRY_CONNECTION_DEVELOP'], 'registry-telefonicabigdata') }}
  - ${{ if eq( parameters.envs.GCP_CONTAINER_REGISTRY, 'true') }}:
    - ${{ if ne(parameters.envs.GCP_PROJECT_NAME_DEVELOP, '') }}:
      - name: GCP_PROJECT_NAME_DEVELOP
        value: ${{ parameters.envs.GCP_PROJECT_NAME_DEVELOP }}
    - name: GCP_PROJECT_NAME
      value: $(GCP_PROJECT_NAME_DEVELOP)
    - name: DEFAULT_REGISTRY_NAME
      value: $(GCP_PROJECT_NAME)-registry
    - name: GCP_REGISTRY_NAME
      value: ${{ coalesce(parameters.envs.GCP_REGISTRY_NAME_DEVELOP, variables['DEFAULT_REGISTRY_NAME']) }}
    - name: IMAGE_NAME_DEVELOP
      value: $(GCP_PROJECT_NAME)/$(GCP_REGISTRY_NAME)/$(Build.Repository.Name)
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_DEVELOP, variables['IMAGE_NAME_DEVELOP']) }}
  - ${{ else }}:
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_DEVELOP, parameters.envs.IMAGE_NAME, variables['Build.Repository.Name']) }}
  - name: DOCKER_BUILD_ARGS
    value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS_DEVELOP, parameters.envs.DOCKER_BUILD_ARGS, '') }}