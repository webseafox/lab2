variables:
  - name: ENVIRONMENT
    value: 'prod'
  - name:  IMAGE_REGISTRY_CONNECTION
    value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION_MAIN, parameters.envs.IMAGE_REGISTRY_CONNECTION, variables.IMAGE_REGISTRY_CONNECTION_MAIN, 'registry-telefonicabigdata') }}
# Não funciona com variáveis de ambiente
# https://developercommunity.visualstudio.com/t/coalesce-not-works-with-variables/10812978
  - ${{ if eq( parameters.envs.GCP_CONTAINER_REGISTRY, 'true') }}:
    - ${{ if ne(parameters.envs.GCP_PROJECT_NAME_MAIN, '') }}:
      - name: GCP_PROJECT_NAME_MAIN
        value: ${{ parameters.envs.GCP_PROJECT_NAME_MAIN }}
    - name: GCP_PROJECT_NAME
      value: $(GCP_PROJECT_NAME_MAIN)
    - name: DEFAULT_REGISTRY_NAME
      value: $(GCP_PROJECT_NAME)-registry
    - name: GCP_REGISTRY_NAME
      value: ${{ coalesce(parameters.envs.GCP_REGISTRY_NAME_MAIN, variables['DEFAULT_REGISTRY_NAME']) }}
    - name: IMAGE_NAME_MAIN
      value: $(GCP_PROJECT_NAME)/$(GCP_REGISTRY_NAME)/$(Build.Repository.Name)    
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_MAIN, variables['IMAGE_NAME_MAIN']) }}
  - ${{ else }}:
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_MAIN, parameters.envs.IMAGE_NAME, variables['Build.Repository.Name']) }}
  - name: DOCKER_BUILD_ARGS
    value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS_MAIN, parameters.envs.DOCKER_BUILD_ARGS, '') }}