jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  condition: true
  steps:
  - task: Docker@2
    displayName: 'Login to Docker Registry'
    inputs:
      command: 'login'
      containerRegistry: registry-telefonicabigdata
  - task: Bash@3
    name: 'unit_test'
    displayName: 'Unit test'
    inputs:
      targetType: 'inline'
      script: |
        run_go_command(){
          command=$1
          echo "##[debug] Running go command: $command"
          docker run --rm -v $PWD:/app \
            -e command="$command" \
            registry.telefonicabigdata.com/golang:alpine \
            sh -c "cd /app && $command"
          if [ $? -ne 0 ]; then
            echo "##vso[task.logissue type=error] Failed to run go command: $1"
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi
          echo "##[debug] $command finished"
        }
        run_go_command "go mod download"
        run_go_command "go test -v ./..."