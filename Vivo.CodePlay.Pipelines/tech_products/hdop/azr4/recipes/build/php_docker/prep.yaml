jobs:
- job: prep
  pool: GeneralPurposeLinuxAgentsCI
  condition: true
  steps:
  - task: Docker@2
    inputs:
      containerRegistry: registry-telefonicabigdata
      displayName: 'Login to Docker Registry'
      command: 'login'
  - task: Bash@3
    inputs:
      targetType: inline
      script: |
        echo "##[debug] Initing Build Stage"
        echo "##[command] composer install"
        docker run --rm -v $PWD:/app \
          -e COMPOSER_ALLOW_SUPERUSER=1 \
          registry.telefonicabigdata.com/devops4p/php-composer:1.0.0 \
          bash -c "cd /app && composer install"
        echo "##[debug] Composer install finished"