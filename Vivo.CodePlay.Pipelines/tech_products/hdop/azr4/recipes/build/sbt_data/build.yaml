jobs:
- job: install
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  steps:
    - script: |
        asdf install java ${ASDF_JDK}
        asdf local java ${ASDF_JDK}
      displayName: Use Java ${ASDF_JDK}
    - template: /tech_products/hdop/templates/steps/version_update.yaml
    - task: Cache@2
      condition: eq(variables['USE_CACHE'], 'true')
      inputs:
        key: "sbt | $(Agent.OS) | **/build.sbt"
        path: "$(Build.SourcesDirectory)/.ivy2"
        restoreKeys: |
          sbt | $(Agent.OS)
          sbt
    - script: |
        export FILE_PATH=$(Build.ArtifactStagingDirectory)/${PROJECT_NAME}-${SET_VERSION_VERSION}.tar.gz
        echo "##vso[task.setvariable variable=FILE_PATH;isOutput=true]${FILE_PATH}"
        sbt assembly --ivy $(Build.SourcesDirectory)/.ivy2 --verbose
        mkdir -p framework/bin
        echo "##[debug] Copying Files"
        mv -f target/**/${PROJECT_NAME}-assembly-${SET_VERSION_VERSION}.jar framework/bin
        mv -f framework-template ${PROJECT_NAME}/
      name: build
      displayName: 'Build'
    - script: |
        echo "##[command] tar -zcvf ${BUILD_FILE_PATH} framework/ ${PROJECT_NAME}/"
        tar -zcvf ${BUILD_FILE_PATH} framework/ ${PROJECT_NAME}/
      displayName: 'Compressing Artifact'
    - task: PublishBuildArtifacts@1
      displayName: 'Cache Artifact'
      condition: succeeded()
      continueOnError: false
      inputs:
        PathtoPublish: '$(build.FILE_PATH)'
        ArtifactName: $(PROJECT_NAME)
        StoreAsTar: true
