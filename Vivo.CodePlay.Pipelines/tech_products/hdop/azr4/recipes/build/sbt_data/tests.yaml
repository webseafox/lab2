jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  steps:
    - script: |
        asdf install java ${ASDF_JDK}
        asdf local java ${ASDF_JDK}
      displayName: Use Java ${ASDF_JDK}
    - task: Cache@2
      condition: eq(variables['USE_CACHE'], 'true')
      inputs:
        key: "sbt | $(Agent.OS) | **/build.sbt"
        path: "$(Build.SourcesDirectory)/.ivy2"
        restoreKeys: |
          sbt | $(Agent.OS)
          sbt
    - script: |
        sbt coverage test coverageReport coverageOff --ivy $(Build.SourcesDirectory)/.ivy2 --verbose
      displayName: “Unit Test”
      continueOnError: False
      condition: eq(variables['EXECUTE_UNIT_TESTS'], 'true')

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH)'
        artifactName: drop


    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'Cobertura' # ou 'JaCoCo', dependendo da ferramenta que você está usando
        summaryFileLocation: '$(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH)/cobertura.xml' # Caminho para o arquivo de cobertura
        reportDirectory: '$(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH)' # Diretório do relatório de cobertura
        failIfCoverageEmpty: false