parameters:
- name: 'envs'
  type: object
  default: {}

variables:
- name: SOME_CROSS_ENVIRONMENT_VARIABLE
  value: 'Cross environment variable value'
- name: VERSION_FILE_PATH
  value: VERSION
- name: PIPELINE_TECH
  value: 'none'
- name: EXAMPLE_VARIABLE
  value: ${{ coalesce(parameters.envs.EXAMPLE_VARIABLE, 'EXAMPLE_DEFAULT_VALUE') }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.15' )}}
