jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  condition: and(succeeded(), eq(variables['EXECUTE_TESTS'], 'true'))
  workspace:
    clean: all
  variables:
    CI: 'true'
  steps:
  # - task: DownloadBuildArtifacts@1
  #   displayName: 'Download Build Artifacts'
  #   inputs:
  #     artifactName: node_modules
  #     cleanDestinationFolder: false
  #     extractTars: true
  #     parallelizationLimit: 8
  #     downloadPath: $(Build.SourcesDirectory)
      
  # - script: |
  #     unzip -q 'extracted_tars/node_modules/node_modules.zip'
  #     rm 'extracted_tars/node_modules/node_modules.zip'
  #   displayName: 'Unzip with symlinks'
  - task: Cache@2
    condition: eq(variables['CACHE_APP_DEPENDENCIES'], 'true')
    continueOnError: true
    inputs:
      key: "node | $(Agent.OS) | **/package-lock.json, **/npm-shrinkwrap.json, **/package.json"
      path: "$(Build.SourcesDirectory)/node_modules"
      restoreKeys: |
        node | $(Agent.OS)
        node
  - template: /tech_products/hdop//templates/steps/set_nodejs_version.yaml
    parameters:
      NODE_VERSION: $(NODE_VERSION)
  - script: |
      npm run test -- --coverage
    displayName: 'Run Unit Tests'
  # Publish Unit Test Coverage
  - task: PublishCodeCoverageResults@1
    inputs:
      codeCoverageTool: 'Cobertura' # Compatible with lcov.info
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/reports/unit/lcov.info'
      reportDirectory: '$(System.DefaultWorkingDirectory)/reports/unit'
  # Publish E2E Test Coverage
  - task: PublishCodeCoverageResults@1
    inputs:
      codeCoverageTool: 'Cobertura' # Compatible with lcov.info
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/e2e/lcov.info'
      reportDirectory: '$(System.DefaultWorkingDirectory)/coverage/e2e'

  # - task: PublishBuildArtifacts@1
  #   inputs:
  #     pathToPublish: '$(Build.SourcesDirectory)'
  #     artifactName: drop