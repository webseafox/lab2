parameters:
- name: 'envs'
  type: object
  default: {}

variables:
- name: IMAGE_NAME
  value: '4thplatform/$(Build.Repository.Name)'
- name: IMAGE_REGISTRY_CONNECTION
  value: 'registry-telefonicabigdata'
- name: DOCKERFILE_PATH
  value: ${{ coalesce(parameters.envs.DOCKERFILE_PATH, 'Dockerfile') }}
- name: VERSION_FILE_PATH
  value: ${{ coalesce(parameters.envs.VERSION_FILE_PATH, 'package.json') }}
- name: CACHE_APP_DEPENDENCIES
  value: ${{ coalesce(parameters.envs.CACHE_APP_DEPENDENCIES, 'true') }}
- name: PIPELINE_TECH
  value: 'node'
- name: EXECUTE_TESTS
  value: ${{ coalesce(parameters.envs.EXECUTE_TESTS, 'true') }}
- name: DOCKER_BUILD_ARGS
  value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS, '') }}
- name: NPM_INSTALL_ARGS
  value: ${{ coalesce(parameters.envs.NPM_INSTALL_ARGS, '') }}
- name: NODE_VERSION
  value: ${{ coalesce(parameters.envs.NODE_VERSION, '') }}
- name: DOCKER_BUILD_CONTEXT
  value: ${{ coalesce(parameters.envs.DOCKER_BUILD_CONTEXT, variables['Build.SourcesDirectory']) }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.15' )}}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.15' )}}