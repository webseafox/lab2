parameters:
- name: recipe
  type: string
  values:
  - nodejs_docker
  - sbt_data
  - maven_docker
  - docker
  - maven_libs
  - python_docker
  - php_docker
  - golang-binary
  - mlops_v1
  - mlops_v2
- name: branching_strategy
  type: string
  values:
  - gitlabflow
  - releaseflow
  - stb
  default: stb
- name: runSonar
  type: boolean
  default: false
- name: envs
  type: object
  default: {}

stages:
#### PREPARATION #############################
  - stage: preparation
    displayName: Preparation - ${{ parameters.recipe }} recipe
    jobs:
    - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/prep.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
      ### Security #############################
