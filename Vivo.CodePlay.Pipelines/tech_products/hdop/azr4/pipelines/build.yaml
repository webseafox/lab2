parameters:
- name: recipe
  type: string
  values:
  - nodejs_docker
  - sbt_data
  - maven_docker
  - docker
  - maven_libs
  - example
  - python_docker
  - php_docker
  - golang-binary
  - mlops_v1
  - mlops_v2
  - gradle_docker
  - nodejs_libs
- name: branching_strategy
  type: string
  values:
  - gitlabflow
  - releaseflow
  - stb
  - gitlabflow-semantic
  default: stb
- name: runSonar
  type: boolean
  default: true
- name: envs
  type: object
  default: {}
- name: additionalStages
  type: object
  default: []

stages:
#### PREPARATION #############################
  - stage: preparation
    displayName: Preparation - ${{ parameters.recipe }} recipe
    jobs:
    - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/prep.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
        ### Security #############################
  - stage: security
    displayName: Security Analysis
    condition: succeeded()
    dependsOn:
    - preparation
    jobs:
    - template: /tech_products/hdop/recipes/build/commons/fortify.yaml
    - template: /tech_products/hdop/recipes/build/commons/sca.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### BUILD #############################
  - stage: build
    displayName: Build - ${{ parameters.recipe }} recipe
    condition: succeeded()
    dependsOn:
    - preparation
    jobs:
    - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/build.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### TESTS #############################
  - stage: tests
    displayName: Tests - ${{ parameters.recipe }} recipe
    condition: succeeded()
    dependsOn:
    - build
    jobs:
    - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/tests.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### SONAR #############################
  - stage: sonar
    displayName: Sonar Analysis
    condition: succeeded()
    dependsOn:
    - tests
    jobs:
    - template: /tech_products/hdop/recipes/build/commons/sonar.yaml
      parameters:
        runSonar: ${{ parameters.runSonar }}
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### Gates #############################
  - stage: gates
    displayName: Security and Quality Gates
    condition: succeeded()
    dependsOn:
    - security
    jobs:
    - template: /tech_products/hdop/recipes/build/commons/gates.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### PACKAGE AND PUBLISH #############################
  - stage: publish
    displayName: Package and Publish - ${{ parameters.recipe }} recipe
    condition: succeeded()
    dependsOn:
    - sonar
    - gates
    jobs:
    - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/publish.yaml
      parameters:
        branching_strategy: ${{ parameters.branching_strategy }}
        envs: ${{ parameters.envs }}
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
        ### COMMIT VERSION #############################
  - stage: commit_version
    displayName: Commit Version
    condition: succeeded()
    dependsOn:
    - publish
    jobs:
    - template: /tech_products/hdop/recipes/build/commons/commit_version.yaml
      ${{ if contains( parameters.recipe, 'maven') }}:
        parameters:
          downloadSettings: true
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/hdop/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml
          parameters:
            envs: ${{ parameters.envs }}
  ### ADDITIONAL STAGES #############################
  - ${{ each stage in parameters.additionalStages }}:
      - ${{ stage }}