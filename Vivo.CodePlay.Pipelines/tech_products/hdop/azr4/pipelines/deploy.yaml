parameters:
- name: recipe
  type: string
  values:
  - update_gitops
  - sbt_data
  - example
  - az_container_apps
  - mlops_v1
  - mlops_v2
  - gcp_cloud_run
  - gcp_cloud_run_v2
  - terraform
- name: environment
  type: string
  default: dev
  values:
    - dev
    - hml
    - preprod
    - qa1
    - stg
    - darklaunch
    - prod
    - from_branch
- name: version
  type: string
  default: latest
- name: chg_number
  type: string
  default: ''
- name: 'envs'
  type: object
  default: {}
  

stages:
#### PREPARATION #############################
  - stage: preparation
    displayName: Preparation - ${{ parameters.environment }} - ${{ parameters.recipe }} recipe
    jobs:
    - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/prep.yaml
      parameters:
        chg_number: ${{ parameters.chg_number }}
        ${{ if and(eq( parameters.environment, 'from_branch'), eq(variables['Build.SourceBranchName'], 'develop'))  }}:
          environment: dev
        ${{ elseif and(eq( parameters.environment, 'from_branch'), eq(variables['Build.SourceBranchName'], 'homolog'))  }}:
          environment: hml
        ${{ elseif and(eq( parameters.environment, 'from_branch'), or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')))  }}:
          environment: prod
        ${{ else }}:
          environment: ${{ parameters.environment }}
    variables:
      - group: '4p-core-default-variables'
      - ${{ if and(eq( parameters.environment, 'from_branch'), ne(variables['Build.SourceBranchName'], ''))  }}:
        - template: /tech_products/hdop/templates/branch_variables/${{ variables['Build.SourceBranchName'] }}.yaml
          parameters:
            envs: ${{ parameters.envs }}
            recipe: ${{ parameters.recipe }} 
      - ${{ elseif ne(parameters.environment,'from_branch') }}:
        - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/variables/${{ parameters.environment }}.yaml
          parameters:
            envs: ${{ parameters.envs }}
      - name: VERSION
        value: ${{ parameters.version }}
#### DEPLOYMENT #############################
  - stage: deployment
    displayName: Deployment - ${{ parameters.environment }} - ${{ parameters.recipe }} recipe
    condition: and(succeeded(), ne(variables['EXECUTE_DEPLOY'], 'false'))
    dependsOn:
    - preparation
    jobs:
    - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/deployment.yaml
      parameters:
        chg_number: ${{ parameters.chg_number }}
        ${{ if and(eq( parameters.environment, 'from_branch'), eq(variables['Build.SourceBranchName'], 'develop'))  }}:
          environment: dev
        ${{ elseif and(eq( parameters.environment, 'from_branch'), eq(variables['Build.SourceBranchName'], 'homolog'))  }}:
          environment: hml
        ${{ elseif and(eq( parameters.environment, 'from_branch'), or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')))  }}:
          environment: prod
        ${{ else }}:
          environment: ${{ parameters.environment }}
    variables:
      - group: '4p-core-default-variables'
      - ${{ if and(eq( parameters.environment, 'from_branch'), ne(variables['Build.SourceBranchName'], ''))  }}:
        - template: /tech_products/hdop/templates/branch_variables/${{ variables['Build.SourceBranchName'] }}.yaml
          parameters:
            recipe: ${{ parameters.recipe }} 
            envs: ${{ parameters.envs }}
      - ${{ elseif ne(parameters.environment,'from_branch') }}:
        - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/variables/${{ parameters.environment }}.yaml
          parameters:
            envs: ${{ parameters.envs }}
      - name: VERSION
        value: ${{ parameters.version }}
#### POST DEPLOYMENT #############################
  - stage: post_deployment
    dependsOn:
    - deployment
    displayName: Post Deployment - ${{ parameters.environment }} - ${{ parameters.recipe }} recipe 
    jobs:
    - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/post_deployment.yaml
    variables:
      - group: '4p-core-default-variables'
      - ${{ if and(eq( parameters.environment, 'from_branch'), ne(variables['Build.SourceBranchName'], ''))  }}:
        - template: /tech_products/hdop/templates/branch_variables/${{ variables['Build.SourceBranchName'] }}.yaml
          parameters:
            recipe: ${{ parameters.recipe }}
            envs: ${{ parameters.envs }}
      - ${{ elseif ne(parameters.environment,'from_branch') }}:
        - template: /tech_products/hdop/recipes/deploy/${{ parameters.recipe }}/variables/${{ parameters.environment }}.yaml
          parameters:
            envs: ${{ parameters.envs }}
      - name: ENVIRONMENT
        value: ${{ parameters.environment }}
      - name: VERSION
        value: ${{ parameters.version }}