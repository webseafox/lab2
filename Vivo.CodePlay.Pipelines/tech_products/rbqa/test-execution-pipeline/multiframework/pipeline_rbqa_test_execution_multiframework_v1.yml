# Pipeline RBQA de execução de testes
# Suporta múltiplos frameworks (Cypress e Playwright)
parameters:
- name: framework
  displayName: Framework
  type: string
  default: "cypress"
  values:
    - cypress
    - playwright
    - playwright-bdd
- name: variableGroup
  type: string
  default: ""
- name: tags               
  type: string
  default: ""
- name: optionals
  type: string
  default: ""
- name: browser
  type: string
  default: chromium
- name: generate_report
  type: boolean
  default: false
- name: test_environment
  type: string
  default: "PREPROD"
- name: update_octane
  type: boolean
  default: false
- name: generate_pdf
  type: boolean
  default: false  
- name: headless
  type: boolean
  default: true
- name: retry_count
  type: string
  default: "0"
- name: parallel_workers
  type: string
  default: "2"
- name: playwright_install_browsers
  type: boolean
  default: false
- name: cucumber_profile
  type: string
  default: ""
     

## Initialize global variables
variables:
  - template: /tech_products/qa/execution/initialize/init.yml


stages:
  # Environment prep
  - template:  /tech_products/qa/execution/templates/ci/ci_environment.yml
    parameters:
      framework: "${{ parameters.framework }}"
  
  # Test Execution
  - template:  /tech_products/rbqa/test-execution-pipeline/multiframework/templates/test_execution.yml
    parameters:
      variableGroup: "${{ parameters.variableGroup }}"
      framework: "${{ parameters.framework }}"
      tags: "${{ parameters.tags }}"
      optionals: "${{ parameters.optionals }}"
      browser: "${{ parameters.browser }}"
      test_environment: ${{ parameters.test_environment }}
      generate_report: ${{ parameters.generate_report }}
      generate_pdf: ${{ parameters.generate_pdf }}        
      update_octane: ${{ parameters.update_octane }}
      headless: ${{ parameters.headless }}
      retry_count: ${{ parameters.retry_count }}
      parallel_workers: ${{ parameters.parallel_workers }}
      playwright_install_browsers: ${{ parameters.playwright_install_browsers }}
      cucumber_profile: ${{ parameters.cucumber_profile }}



  
  # Clean up
  - template:  /tech_products/qa/execution/templates/ci/ci_clean.yml