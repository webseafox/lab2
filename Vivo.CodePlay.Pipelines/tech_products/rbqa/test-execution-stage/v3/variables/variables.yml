parameters:
- name: octane_environment
  type: string
  default: 'PROD'
# TEST STAGE VARIABLES
variables:

# VARIÁVEL PARA MAPEAMENTO DO POOL DE AGENTES EXCLUSIVO PARA EXECUÇÃO DOS TESTES AUTOMATIZADOS
- name: PRIVATE_AGENT_QA
  value: TestRunnerAgents

#Variáveis globais
- name: DOCKER_WORKDIR
  value: "/app"
- name: AKV_DEVOPS_NAME
  value: "kv-azdevops-shared"

# INCLUINDO GRUPO DE VARIÁVEIS NECESSÁRIAS PARA COMUNICAÇÃO COM O OCTANE
- ${{ if eq(parameters.octane_environment, 'PROD') }}:
  - group: "test-stage-octane-variables"
- ${{ else }}:
  - group: "test-stage-octane-variables-hom"

# INCLUINDO VARIÁVEIS DE PROXY
- name: HTTP_QA_PROXY
  value: "proxy.redecorp.br:8080"
- name: HTTPS_QA_PROXY
  value: "proxy.redecorp.br:8080"
- name: NO_PROXY
  value: "vivo360-preprod-qa.redecorp.br,akhq-events.ecare.tlf-dev.redecorp.br,10.129.203.28,10.129.163.92,10.129.178.44,10.129.203.130,127.0.0.1,10.0.0.0/8,10.238.60.90,nexus.telefonica.com.br"