# Vivo Pipeline Core's entrypoint
# ===============================================================
#
# Usage sample for end user:
#
# trigger: none
#
# resources:
#   repositories:
#     - repository: CodePlay
#       name: DevOps/Vivo.CodePlay.Pipelines
#       type: git
#       ref: refs/heads/master
#       endpoint: CodePlay
#
# extends:
#   template: /tech_products/rbqa/pipeline_rbqa_testexecution_ci_v1.yml@CodePlay
#   parameters:
#     config:
#       pipelineType: qa
#       technology: java
#       modelName: scenarios_default
#       branchingStrategy: trunkbased
#       params:
#         framework: "${{ parameters.framework }}"
#         cenario: "${{ parameters.cenario }}"
#         optionals: "${{ parameters.optionals }}"
#         docker_image: "${{ parameters.docker_image }}"
#         test_environment: "${{ parameters.test_environment }}"
#         maven_settings: $(pwd)/settings.xml
#
#  ===============================================================

parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    pipelineType: app # i.e. app, infra, api_gateway, automation
    technology: java  # i.e. java, nodejs, python, helm, terraform, axway, flutter, acr, azdo_extension, azure_artifacts
    modelName: api_default # i.e. bff_client_default, api_default, lib_default, chart_default, databricks_default, azure, mobile_default, purge (App Legacy names: trunkbasedmicroservicek8s, gitflowmicroservicek8s, azure/m1, api/m2), default
    branchingStrategy: "" # i.e. trunkbased, vivoflow (for "app" type pipelines only)

extends:
  template: /tech_products/qa/execution/templates/provisioner_entry.yml
  ${{ if parameters }}:
    parameters: "${{ parameters.config.params }}"