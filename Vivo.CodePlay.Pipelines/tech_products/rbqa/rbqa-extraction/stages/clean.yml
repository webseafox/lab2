stages:
  - stage: clean_archives
    displayName: "Deletando logs e arquivos da pipeline"
    pool:
      name: TestRunnerAgents
      demands:
      - Agent.Version -equals 3.232.3

    jobs:
      - job: clean
        displayName: Deletando logs e arquivos da pipeline
        timeoutInMinutes: 120
        steps:

            - task: DeleteFiles@1
              displayName: "Clean logs directory"
              inputs:
                SourceFolder: '$(Agent.TempDirectory)'
                Contents: '*.log'
                removeSourceFolder: false

            - task: DeleteFiles@1
              displayName: "Clean build sources directory"
              inputs:
                SourceFolder: '$(Build.SourcesDirectory)'
                Contents: '*'
                removeSourceFolder: false