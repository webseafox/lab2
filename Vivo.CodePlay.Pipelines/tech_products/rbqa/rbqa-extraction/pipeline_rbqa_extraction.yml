## Resources
resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines


## Initialize global variables
variables:
  - group: rbqa-azure-extraction-scripts
  - name: FORTIFY_APP_DEFAULT_VERSION
    value: DevSecOps
  - name: PROXY_NSKP_SERVER
    value: "nskp.redecorp.br:8080"
  - name: PROXY_SQUID_SERVER
    value: "10.240.58.39:3128"
  - name: PROXY_AGENT_HTTP
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_HTTPS
    value: "http://$(PROXY_NSKP_SERVER)"
  - name: PROXY_AGENT_NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"

stages:


  # Extração
  - template: /tech_products/rbqa/rbqa-extraction/stages/extraction.yml

  # Security
  - template: /tech_products/rbqa/rbqa-extraction/stages/security.yml

  # Clean
  - template: /tech_products/rbqa/rbqa-extraction/stages/clean.yml