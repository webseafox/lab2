# This YAML file defines a pipeline task for tagging a repository in Azure Repos.

parameters:
  - name: tag # The tag name to be created.
  - name: repository # The path to the repository.
  - name: tagMessage # The message to be associated with the tag.

steps:
  - task: CmdLine@2
    displayName: "Tag in Azure Repos"
    retryCountOnTaskFailure: 3
    inputs:
      workingDirectory: ${{ parameters.repository }}
      script: |
        # Print debug information about the repository, branch, tag, and tag message.
        echo "##[debug] REPOSITORY.....................: ${REPOSITORY}"
        echo "##[debug] BRANCH.........................: ${BRANCH}"
        echo "##[debug] TAG............................: ${TAG}"
        echo "##[debug] TAG_MESSAGE....................: ${TAG_MESSAGE}"

        echo "##[group]Git Configuration"

        # Configure the user email for the Git command.
        echo "##[command]git config --local user.email "fnix.devops@telefonicati.onmicrosoft.com""
        git config --local user.email "fnix.devops@telefonicati.onmicrosoft.com"

        # Configure the user name for the Git command.
        echo "##[command]git config --local user.name "Azure Pipeline Fênix""
        git config --local user.name "Azure Pipeline Fênix"

        # Create a new annotated tag with the specified tag name and message.
        echo "##[command]git tag -a "${TAG}" -m "${TAG_MESSAGE}""
        git tag -a "${TAG}" -m "${TAG_MESSAGE}" 

        # Show the details of the created tag.
        echo "##[command]git show "${TAG}""
        git show "${TAG}"

        echo "##[endgroup]"

        # Push the created tag to the origin repository.
        echo "##[command]git push origin "${TAG}""
        git push origin "${TAG}"
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      REPOSITORY: ${{ parameters.repository }}
      TAG: ${{ parameters.tag }}
      TAG_MESSAGE: ${{ parameters.tagMessage }}
      BRANCH: $(Build.SourceBranchName)
