# This YAML file defines a pipeline task for performing a pull rebase operation on a Git repository.

parameters:
  - name: workingDirectory # The working directory where the Git repository is located.
  - name: repository # The name of the Git repository.
  - name: disablePullRebase
    default: false

steps:
  - task: CmdLine@2
    displayName: "Pull Rebase ${{ parameters.repository }}"
    condition: eq(${{ parameters.disablePullRebase }}, false)
    retryCountOnTaskFailure: 3
    inputs:
      workingDirectory: $(Agent.BuildDirectory)/${{ parameters.workingDirectory }}
      script: |
        echo "##[debug] WORKING_DIRECTORY.............: $(Agent.BuildDirectory)/${{ parameters.workingDirectory }}"

        printf "\n>>>>> Pull Rebase ...\n"

        echo "##[command]git config --local pull.rebase true"
        # Set the Git configuration to perform a rebase when pulling.
        git config --local pull.rebase true

        echo "##[command]git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)"
        # Fetch the latest changes from the remote repository for the current branch.
        git fetch -f --depth 1 origin $(Build.SourceBranchName):$(Build.SourceBranchName)

        echo "##[command]git checkout -f $(Build.SourceBranchName)"
        # Checkout the current branch.
        git checkout -f $(Build.SourceBranchName)

        lastCommitHash=$(git rev-parse --short=6 HEAD)

        printf "\n>>>>> Last Commit: $lastCommitHash <<<<<\n"
        # Print the hash of the last commit.
