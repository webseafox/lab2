parameters:
  environment: ""
  podStatus: ""
  nodesStatus: ""

steps:
  - task: CmdLine@2
    name: observability_process_data
    displayName: "Observability Process Data"
    inputs:
      script: |
        echo "##[debug] ENVIRONMENT ...............................................: ${{ parameters.environment }}"
        echo "##[debug] POD STATUS ................................................: ${{ parameters.podStatus }}"
        echo "##[debug] NODES STATUS ..............................................: ${{ parameters.nodesStatus }}"

        non_running_pods=""
        non_running_pods_count=0
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          name=${line%%,*}
          rest=${line#*,}
          status=${rest%%,*}
          if [ "$status" != "Running" ] && [ "$status" != "Completed" ] && [ "$status" != "NotRecognized" ]; then
            [ -n "$non_running_pods" ] && non_running_pods="${non_running_pods};"
            non_running_pods="${non_running_pods}${name},${status}"
            non_running_pods_count=$((non_running_pods_count + 1))
          fi
        done < <(echo "${{ parameters.podStatus }}" | tr ';' '\n' | tr ' ' '\n')
        [ -z "$non_running_pods" ] && non_running_pods="NONE"

        non_ready_nodes=""
        non_ready_nodes_count=0
        while IFS= read -r nline; do
          [ -z "$nline" ] && continue
          n_ip=${nline%%,*}
          n_rest=${nline#*,}
          n_status=${n_rest%%,*}
          if [ "$n_status" != "Ready" ]; then
            [ -n "$non_ready_nodes" ] && non_ready_nodes="${non_ready_nodes};"
            non_ready_nodes="${non_ready_nodes}${n_ip},${n_status}"
            non_ready_nodes_count=$((non_ready_nodes_count + 1))
          fi
        done < <(echo "${{ parameters.nodesStatus }}" | tr ';' '\n' | tr ' ' '\n')
        [ -z "$non_ready_nodes" ] && non_ready_nodes="NONE"

        echo ""
        echo ">> Nodes: ${{ parameters.nodesStatus }}"
        echo ">>> Non-Ready Nodes: [$non_ready_nodes_count] $non_ready_nodes"
        echo ""
        echo ">> Pods: ${{ parameters.podStatus }}"
        echo ">>> Non-running Pods: [$non_running_pods_count] $non_running_pods"

        echo "##vso[task.setvariable variable=NON_RUNNING_PODS_COUNT;isOutput=true]$non_running_pods_count"
        echo "##vso[task.setvariable variable=NON_READY_NODES_COUNT;isOutput=true]$non_ready_nodes_count"
        echo "##vso[task.setvariable variable=ERRORS_${{ parameters.environment }};isOutput=true]$non_ready_nodes_count,$non_running_pods_count"
        echo "##vso[task.setvariable variable=NON_RUNNING_PODS_${{ parameters.environment }};isOutput=true]$non_running_pods"
        echo "##vso[task.setvariable variable=NON_READY_NODES_${{ parameters.environment }};isOutput=true]$non_ready_nodes"
