steps:
- task: SSH@0
  name: verify_brm_apps_version
  displayName: "BRM Versions in $(ENVIRONMENT) Environment"
  inputs:
    sshEndpoint: BRM_BASTION_$(ENVIRONMENT)
    runOptions: 'inline'
    inline: |
      # This task verifies the versions of various BRM (Billing and Revenue Management) applications in the specified environment.
      # It uses SSH to connect to the BRM bastion server and runs inline commands to retrieve the image versions of different pods.
      # The retrieved versions are then stored as output variables for further use in the pipeline.

      billingcare=$(kubectl describe pod billingcare-domain-admin-server | grep Image | grep billingcare_tlf: | cut -d":" -f3)
      billingcare_extension=$(kubectl describe pod bcws-domain-admin-server | grep Image | grep billingcare_extension_tlf: | cut -d":" -f3)
      brm_apps=$(kubectl describe pod pje- | grep Image | grep brm_apps_tlf: | cut -d":" -f3)
      config_jobs=$(kubectl describe pod config-jobs- | grep Image | grep config_jobs_tlf: | cut -d":" -f3)
      connection_manager=$(kubectl describe pod cm- | grep Image | grep cm_tlf: | cut -d":" -f3)
      db_upgrade=$(kubectl describe pod db-upgrade- | grep Image | grep db_upgrade: | cut -d":" -f3)
      elastic_charging_engine=$(kubectl describe pod ecs-0 | grep -m 1 Image | grep oc-cn-ece_tlf: | cut -d":" -f3)
      pricing_design_center=$(kubectl describe pod pdcdomain-adminserver | grep Image | grep db_upgrade: | cut -d":" -f3)

      echo "##[debug] BILLINGCARE...............................: $billingcare"
      echo "##[debug] BILLINGCARE-EXTENSION.....................: $billingcare_extension"
      echo "##[debug] BRM-APPS..................................: $brm_apps"
      echo "##[debug] CONFIG-JOBS...............................: $config_jobs"
      echo "##[debug] CONNECTION-MANAGER........................: $connection_manager"
      echo "##[debug] DB-UPGRADE................................: $db_upgrade"
      echo "##[debug] ELASTIC-CHARGING-ENGINE...................: $elastic_charging_engine"
      echo "##[debug] PRICING-DESIGN-CENTER.....................: $pricing_design_center"

      echo "##vso[task.setvariable variable=BILLINGCARE;isoutput=true]$billingcare"
      echo "##vso[task.setvariable variable=BILLINGCARE_EXTENSION;isoutput=true]$billingcare_extension"
      echo "##vso[task.setvariable variable=BRM_APPS;isoutput=true]$brm_apps"
      echo "##vso[task.setvariable variable=CONFIG_JOBS;isoutput=true]$config_jobs"
      echo "##vso[task.setvariable variable=CONNECTION_MANAGER;isoutput=true]$connection_manager"
      echo "##vso[task.setvariable variable=DB_UPGRADE;isoutput=true]$db_upgrade"
      echo "##vso[task.setvariable variable=ELASTIC_CHARGING_ENGINE;isoutput=true]$elastic_charging_engine"
      echo "##vso[task.setvariable variable=PRICING_DESIGN_CENTER;isoutput=true]$pricing_design_center"
    readyTimeout: '20000'
    failOnStdErr: false