parameters:
- name: sourceFile
- name: transpiledFileTargetFolder
- name: transpiledFileName
- name: extraVars # Ex.: extraVars: 'VB1=12_VB1;VB2=12_VB2;ZX0=12_ZX0'
  default: ''
- name: condition # Ex.: extraVars: 'VB1=12_VB1;VB2=12_VB2;ZX0=12_ZX0'
  default: True

steps: 
- task: CmdLine@2
  displayName: "Replace variables in ${{ parameters.sourceFile }} File"
  condition: ${{ parameters.condition }}
  inputs:
    script: |
      set -e
      
      echo "##[debug] SOURCE FILE........................................: ${SOURCE_FILE}"
      echo "##[debug] TARGET FILE FOLDER.................................: ${TARGET_FILE_FOLDER}"
      echo "##[debug] TARGET FILE NAME...................................: ${TARGET_FILE_NAME}"
      echo "##[debug] TARGET FILE FULL PATH..............................: ${TARGET_FILE_FULL_PATH}"

      echo "##[command]rm -rf ${TARGET_FILE_FOLDER}/${TARGET_FILE_NAME}"
      rm -rf ${TARGET_FILE_FOLDER}/${TARGET_FILE_NAME}

      echo "##[command]mkdir -p ${TARGET_FILE_FOLDER}"
      mkdir -p ${TARGET_FILE_FOLDER}

      if [ -z "${{ parameters.extraVars }}" ]; then
        echo "##[debug] No extra variables provided."

        echo "##[command]envsubst < ${SOURCE_FILE} > ${TARGET_FILE_FULL_PATH}"
        envsubst < ${SOURCE_FILE} > ${TARGET_FILE_FULL_PATH}      
      else
        echo "##[debug] EXTRA VARIABLES....................................: ${{ parameters.extraVars }}"

        EX_VAR=''
        IFS=';' read -ra ADDR <<< "${{ parameters.extraVars }}"
        for varr in "${ADDR[@]}"; do
          arrIN=(${varr//=/ })

          EX_VAR+=$([ "${#EX_VAR}" -gt 0 ] && echo ",\$${arrIN[0]}" || echo "\$${arrIN[0]}")
        done

        echo "##[command]envsubst $EX_VAR < ${SOURCE_FILE} > ${TARGET_FILE_FULL_PATH}"
        envsubst $EX_VAR < ${SOURCE_FILE} > ${TARGET_FILE_FULL_PATH}
      fi
      
      echo "##[command]cat ${TARGET_FILE_FULL_PATH}"
      echo "##[group]Command file"
      cat ${TARGET_FILE_FULL_PATH}
      echo "##[endgroup]"
  env:
    SOURCE_FILE: ${{ parameters.sourceFile }}
    TARGET_FILE_FOLDER: ${{ parameters.transpiledFileTargetFolder }}
    TARGET_FILE_NAME: ${{ parameters.transpiledFileName }}
    TARGET_FILE_FULL_PATH: ${{ parameters.transpiledFileTargetFolder }}/${{ parameters.transpiledFileName }}
    ${{ each varr in split(parameters.extraVars, ';') }}:
      ${{ split(varr, '=')[0] }}: ${{ split(varr, '=')[1] }}