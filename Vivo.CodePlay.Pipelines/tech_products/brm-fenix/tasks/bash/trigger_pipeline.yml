parameters:
- name: pipelineId
- name: branch
- name: params
- name: teamProjectId
  default: $(System.TeamProjectId)
- name: accessToken
  default: $(System.AccessToken)

steps: 
- task: CmdLine@2
  displayName: "Trigger Pipeline"
  name: trigger_pipeline
  retryCountOnTaskFailure: 3
  inputs:
    script: |
      echo "##[debug] PIPELINE_ID...................................: ${PIPELINE_ID}"
      echo "##[debug] BRANCH........................................: ${BRANCH}"
      echo "##[debug] PARAMETERS....................................: ${PARAMETERS}"
      echo "##[debug] TEAM PROJECT ID...............................: ${TEAM_PROJECT_ID}"
      echo ""

      DATA='{
        "resources": {
          "repositories": {
          "self": {
          "refName": "refs/heads/'${BRANCH}'"
          }
          }
        },
        "templateParameters": '${PARAMETERS}'
      }'

      echo "##[command]curl -s -H "Content-Type: application/json" -d "$DATA" -u :$AZURE_DEVOPS_EXT_PAT -X POST $(System.CollectionUri)${TEAM_PROJECT_ID}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.1-preview.1"
      response=$(curl -s -H "Content-Type: application/json" -d "$DATA" -u :$AZURE_DEVOPS_EXT_PAT -X POST $(System.CollectionUri)${TEAM_PROJECT_ID}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.1-preview.1)
      
      PIPELINE_TRIGGED_STATE=$(echo "$response" | jq -r '.state')
      PIPELINE_NAME=$(echo "$response" | jq -r '.name')
      PIPELINE_URL=$(echo "$response" | jq -r '._links.web.href')

      echo ""

      if [ "$PIPELINE_TRIGGED_STATE" != "inProgress" ]; then
        echo "##vso[task.logissue type=error;] Failed to Trigger Pipeline. Error: $(echo "$response" | jq -r '.message')"
        echo "##vso[task.complete result=Failed;]"
      else
        echo ">>>>>>>>>> Pipeline triggered successfully <<<<<<<<<<"
        echo ">>>>> Pipeline State: $PIPELINE_TRIGGED_STATE"
        echo ">>>>> Pipeline Name: $PIPELINE_NAME"
        echo ">>>>> Pipeline URL: $PIPELINE_URL"

        echo "##vso[task.setvariable variable=CD_PIPELINE_TRIGGERED;isoutput=true]$PIPELINE_NAME"
        echo "##vso[task.setvariable variable=CD_PIPELINE_TRIGGERED_URL;isoutput=true]$PIPELINE_URL"
      fi
  env:
    AZURE_DEVOPS_EXT_PAT:  ${{ parameters.accessToken }}
    PIPELINE_ID: ${{ parameters.pipelineId }}
    BRANCH: ${{ parameters.branch }}
    PARAMETERS: ${{ parameters.params }}
    TEAM_PROJECT_ID: ${{ parameters.teamProjectId }}