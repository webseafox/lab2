# This YAML file defines a pipeline task that creates a logs file based on input variables.

parameters:
  - name: inputVariableLogs # The input variable that contains the logs to be written to the file.
  - name: logsFileOutput # The output variable that represents the path of the created logs file.

steps:
  - task: CmdLine@2
    displayName: "Create Logs File"
    inputs:
      script: |
        echo "##[debug] DEPLOY LOG FILE OUTPUT .........................................: ${{ parameters.logsFileOutput }}"
        echo "##[debug] DEPLOY LOG FILE CONTENT [${#_INPUT_LOGS}] ................................: $_INPUT_LOGS"
        echo ""

        # Check if input is not empty
        if [ -z "$_INPUT_LOGS" ]; then
          echo "##[error]Input variable logs is empty"
          echo "No logs to process" >> "${{ parameters.logsFileOutput }}"
          exit 1
        fi
        
        echo "##[group]Log File Configuration ..."
        echo "##[command]rm -fv ${{ parameters.logsFileOutput }}"
        rm -fv "${{ parameters.logsFileOutput }}"

        # Create the logs file using the logsFileOutput parameter.
        echo "##[command]touch ${{ parameters.logsFileOutput }}"
        touch "${{ parameters.logsFileOutput }}"
        echo "##[endgroup]"
        echo ""

        COUNT_LINES=0

        # Create a temporary file to safely handle the input
        TEMP_INPUT="/tmp/temp_input_$$.txt"
        printf '%s' "$_INPUT_LOGS" > "$TEMP_INPUT"
        
        # Use sed to replace semicolons with newlines and process
        sed 's/;/\n/g' "$TEMP_INPUT" > "${{ parameters.logsFileOutput }}"
        
        # Count non-empty lines
        COUNT_LINES=$(grep -c . "${{ parameters.logsFileOutput }}" 2>/dev/null || echo 0)
        
        # Clean up temporary file
        rm -f "$TEMP_INPUT"

        echo ">> Processing logs with length: ${#_INPUT_LOGS}. $COUNT_LINES lines added to ${{ parameters.logsFileOutput }}"

        # Verify file was created and show content safely
        if [ -f "${{ parameters.logsFileOutput }}" ]; then
          FILE_SIZE=$(wc -c < "${{ parameters.logsFileOutput }}" 2>/dev/null || echo "0")
          
          echo ""
          echo "##[group]Log file content preview"

          if [ "$COUNT_LINES" -le 0 ]; then
            echo "##[warning]Log file is empty"
          elif [ "$COUNT_LINES" -le 40 ]; then
            echo "##[info]Log file has $COUNT_LINES lines (<=40). Showing full content:"
            cat "${{ parameters.logsFileOutput }}" 2>/dev/null || echo "Error reading file"
          else
            echo "##[info]Log file has $COUNT_LINES lines. Showing first 10 and last 10 lines:"
            echo ""
            echo "=============================================="
            echo "==================== HEAD ===================="
            echo "=============================================="
            echo "##[command]head -10 ${{ parameters.logsFileOutput }}"
            head -10 "${{ parameters.logsFileOutput }}" 2>/dev/null || echo "Error reading file"
            echo "... ($(($COUNT_LINES - 10)) lines omitted) ..."
            echo "=============================================="
            echo ""
            echo ""
            echo "=============================================="
            echo "==================== TAIL ===================="
            echo "=============================================="
            echo "##[command]tail -10 ${{ parameters.logsFileOutput }}"
            echo "... ($(($COUNT_LINES - 10)) lines omitted) ..."
            tail -10 "${{ parameters.logsFileOutput }}" 2>/dev/null || echo "Error reading file"
            echo "=============================================="
          fi
          echo "##[endgroup]"
        else
          echo "##[error]Failed to create log file: ${{ parameters.logsFileOutput }}"
          exit 1
        fi
    env:
      _INPUT_LOGS: ${{ parameters.inputVariableLogs }}
