# This YAML file defines a pipeline task for updating the application version in a Helm chart.

parameters:
  - name: helmChart # The name of the Helm chart.
  - name: helmChartFile # The name of the Helm chart file.
  - name: helmChartVersionKey # The key in the Helm chart file where the version is stored.
  - name: applicationVersion # The new version to update in the Helm chart.
  - name: condition
    default: succeeded()

steps:
  - task: CmdLine@2
    displayName: "Update Application Version"
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        # Print debug information about the parameters.
        echo "##[debug] HELM_CHART.................: ${HELM_CHART}"
        echo "##[debug] HELM_CHART_FILE............: ${HELM_CHART_FILE}"
        echo "##[debug] HELM_CHART_FILE_PATH.......: ${HELM_CHART_FILE_PATH}"
        echo "##[debug] HELM_CHART_VERSION_KEY.....: ${HELM_CHART_VERSION_KEY}"
        echo "##[debug] APPLICATION_VERSION........: ${APPLICATION_VERSION}"

        # Update the application version in the Helm chart file.
        echo ">>>> Updating application version in ${HELM_CHART}/env/${HELM_CHART_FILE}"

        echo "##[command]yq -i '${{ parameters.helmChartVersionKey }} = "${{ parameters.applicationVersion }}"' $(Pipeline.Workspace)/${{ parameters.helmChart }}/env/${{ parameters.helmChartFile }}"

        yq -i '${{ parameters.helmChartVersionKey }} = "${{ parameters.applicationVersion }}"' $(Pipeline.Workspace)/${{ parameters.helmChart }}/env/${{ parameters.helmChartFile }}

        # Print the updated version.
        echo " "
        echo =========== RETURN ===========
        STR=${HELM_CHART_VERSION_KEY}
        STR2=$(echo "${STR%.*}")
        echo ">> $STR2 <<"
        echo "$(yq e $STR2 ${HELM_CHART_FILE_PATH})"
        echo ==============================

    env:
      HELM_CHART: ${{ parameters.helmChart }}
      HELM_CHART_FILE: ${{ parameters.helmChartFile }}
      HELM_CHART_FILE_PATH: $(Pipeline.Workspace)/${{ parameters.helmChart }}/env/${{ parameters.helmChartFile }}
      HELM_CHART_VERSION_KEY: ${{ parameters.helmChartVersionKey }}
      APPLICATION_VERSION: ${{ parameters.applicationVersion }}
