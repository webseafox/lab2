# This YAML file defines a Docker login task for a specific container registry.

parameters:
# The name of the container registry to log in to.
- name: containerRegistry

steps: 
- task: Docker@2
  displayName: Docker Login in ${{ parameters.containerRegistry }}
  inputs:
    command: login # Specifies the Docker command to execute, which is 'login' in this case.
    containerRegistry: ${{ parameters.containerRegistry }} # Specifies the container registry to log in to. The value is provided by the 'containerRegistry' parameter.
