# This YAML file defines a pipeline task for validating an image publish in a container registry.

parameters:
  # The name of the image to validate.
  - name: image
  # The name of the Azure Container Registry (ACR) to use.
  - name: acrRegistryName
  # The name of the container registry.
  - name: containerRegistry
  - name: condition
    default: 'True'

steps:
  - task: CmdLine@2
    displayName: "Validate Image Publish in ${{ parameters.containerRegistry }}"
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        # Prints debug information to the pipeline logs.
        echo "##[debug] ACR REGISTRY NAME ...........................: ${ACR_REGISTRY_NAME}"
        echo "##[debug] IMAGE .......................................: ${IMAGE}"
        echo "##[debug] ACR USER ....................................: ${_ACR_USER}"

        echo ""
        # Runs the 'az acr repository show' command to check if the image exists in the ACR.
        echo "##[command]az acr repository show -n ${ACR_REGISTRY_NAME} --image ${IMAGE} --output table -u ${_ACR_USER} -p ${_ACR_PASSWORD}"
        echo "##[command]az account clear"
        az account clear
        echo "##[command]az acr login --name $(ACR_REGISTRY_NAME) -u $(ACR_USER) -p $(ACR_PASSWORD)"
        az acr login --name $(ACR_REGISTRY_NAME) -u $(ACR_USER) -p $(ACR_PASSWORD)
        IMAGE_FOUND=$(az acr repository show -n ${ACR_REGISTRY_NAME} --image ${IMAGE} --output table -u ${_ACR_USER} -p ${_ACR_PASSWORD})

        # Checks if the image was found. If it is empty, logs an error and marks the task as failed.
        if [[ -z $IMAGE_FOUND ]]; then
          echo "##vso[task.logissue type=error;]Image not found in ACR"
          echo "##vso[task.complete result=Failed;]"
        fi

        # Prints the found image information.
        echo "$IMAGE_FOUND"
    env:
      ACR_REGISTRY_NAME: ${{ parameters.acrRegistryName }}
      IMAGE: ${{ parameters.image }}
      _ACR_USER: $(ACR_USER)
      _ACR_PASSWORD: $(ACR_PASSWORD)
