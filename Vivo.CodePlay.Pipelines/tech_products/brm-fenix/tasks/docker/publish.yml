# This YAML file defines a pipeline task for publishing a Docker image to a container registry.

parameters:
  # The name of the container registry where the image will be published.
  - name: containerRegistry
  # The name of the repository within the container registry.
  - name: repository
  # The tags to be applied to the published image.
  - name: tags
  - name: condition
    default: "succeeded()" # The condition under which the task will run.
  - name: displayName
    default: "Publish Image ACR"

steps:
  - task: Docker@2
    displayName: "${{ parameters.displayName }}"
    condition: ${{ parameters.condition }}
    inputs:
      command: push # The Docker command to execute. In this case, it is 'push' to publish the image.
      containerRegistry: ${{ parameters.containerRegistry }} # The name of the container registry where the image will be published.
      repository: ${{ parameters.repository }} # The name of the repository within the container registry.
      tags: ${{ parameters.tags }} # The tags to be applied to the published image.
