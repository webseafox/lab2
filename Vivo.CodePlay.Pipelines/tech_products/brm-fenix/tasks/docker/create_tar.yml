parameters:
  - name: imageTag
  - name: imageName

steps:
  - task: CmdLine@2
    name: create_tar
    displayName: "Create Docker Image Tar"
    inputs:
      script: |
        echo "##[debug] IMAGE_TAG ...........................: ${IMAGE_TAG}"
        echo "##[debug] IMAGE_NAME ..........................: ${IMAGE_NAME}"
        echo "##[debug] DOCKER_BUILDKIT .....................: ${DOCKER_BUILDKIT}"

        echo ""
        echo ">>>>> Creating Docker image tar file ..."
        echo "##[command]docker save ${IMAGE_TAG} -o $(Pipeline.Workspace)/${IMAGE_NAME}.tar"
        docker save ${IMAGE_TAG} -o $(Pipeline.Workspace)/${IMAGE_NAME}.tar

        echo ">>>>>>>>>> Validating the created tar file ..."
        if [ -f "$(Pipeline.Workspace)/${IMAGE_NAME}.tar" ]; then
          echo "    ✅ Successfully created .tar file: ${IMAGE_NAME}"
        else
          echo "##[error] ❌ Error: .tar file was not created!"
          exit 1
        fi
    env:
      DOCKER_BUILDKIT: 1
      IMAGE_TAG: ${{ parameters.imageTag }}
      IMAGE_NAME: ${{ parameters.imageName }}
