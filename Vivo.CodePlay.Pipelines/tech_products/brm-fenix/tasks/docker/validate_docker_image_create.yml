# This YAML file defines a pipeline task for validating a Docker image build.
# It takes two parameters: 'imageName' and 'applicationVersion'.

parameters:
  # The name of the Docker image to validate.
  - name: imageName
  # The version of the application associated with the Docker image.
  - name: applicationVersion

steps:
  - task: CmdLine@2
    name: show_docker_image
    displayName: "Validate Docker Image Build"
    inputs:
      script: |
        # Print debug information about the image name and application version.
        echo "##[debug] IMAGE NAME ...............................................: ${IMAGE_NAME}"
        echo "##[debug] APPLICATION VERSION ......................................: ${APPLICATION_VERSION}"

        echo ""
        echo ">>>>> Validating if the Docker image [${APPLICATION_VERSION}] was created successfully ..."
        echo "##[command]docker images | grep ${IMAGE_NAME} | grep ${APPLICATION_VERSION}"
        IMAGES=$(docker images | grep ${IMAGE_NAME} | grep ${APPLICATION_VERSION})
        docker images | grep ${IMAGE_NAME} | grep ${APPLICATION_VERSION}
        if [[ -z $IMAGES ]]; then
          echo "##vso[task.logissue type=error;]The Docker Image was not created. Check the log file for more details."
          echo "##vso[task.complete result=Failed;]"
        fi
    env:
      IMAGE_NAME: ${{ parameters.imageName }}
      APPLICATION_VERSION: ${{ parameters.applicationVersion }}
