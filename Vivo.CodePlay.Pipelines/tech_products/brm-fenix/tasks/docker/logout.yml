# This YAML file defines a Docker logout task for a specific container registry.

parameters:
  # The name of the container registry to logout from.
  - name: containerRegistry

steps:
  - task: Docker@2
    displayName: Docker Logout in ${{ parameters.containerRegistry }}
    inputs:
      command: logout # Specifies the Docker command to execute, which is 'logout' in this case.
      containerRegistry: ${{ parameters.containerRegistry }} # Specifies the container registry to logout from, using the value provided in the 'containerRegistry' parameter.