# This YAML file defines the steps for the "Execution Mode" task.
# It checks the execution mode defined in the Azure Library for ECE execution and sets the ECE_EXECUTION_MODE variable accordingly.

steps: 
- task: CmdLine@2
  displayName: "Execution Mode"
  name: mode
  inputs:
    script: |
      # Print debug information about proxy settings and environment variables
      echo "##[debug] ENVIRONMENT............: ${_ENVIRONMENT}"

      # Evaluate the value of EXECUTION_MODE based on the _ENVIRONMENT variable
      eval EEM='$'EXECUTION_MODE_$(echo ${_ENVIRONMENT} | tr 'a-z' 'A-Z')

      # Convert the value of EEM to uppercase and assign it to _EXECUTION_MODE
      _EXECUTION_MODE=$(echo $EEM | tr 'a-z' 'A-Z') 

      # Check if the execution mode is valid
      if [[ $_EXECUTION_MODE != "RESTART" && $_EXECUTION_MODE != "DEPLOY" ]]; then
        # Print an error message and fail the task if the execution mode is invalid
        echo "##vso[task.logissue type=error;]!!!!!!!!!! The [$_EXECUTION_MODE] execution mode was defined in the Azure Library for ECE execution. This mode is INVALID !!!!!!!!!!"
        echo "##vso[task.complete result=Failed;]"

        exit 1
      else
        # Print a success message if the execution mode is valid
        printf ">>>>> The [$_EXECUTION_MODE] execution mode was defined in the Azure Library for ECE execution <<<<<\n\n"
        
        # Set the ECE_EXECUTION_MODE variable as an output variable
        echo "##[debug] EXECUTION_MODE.........: ${_EXECUTION_MODE}"
        echo "##vso[task.setvariable variable=ECE_EXECUTION_MODE;isoutput=true]$_EXECUTION_MODE"
      fi

  # Set environment variables
  env:
    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    _ENVIRONMENT: $(ENVIRONMENT)