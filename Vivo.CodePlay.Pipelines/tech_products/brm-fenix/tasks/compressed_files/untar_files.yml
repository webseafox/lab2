parameters:
- name: tarGzFilesFolderPath

steps:
- task: CmdLine@2
  displayName: "Untar .tar.gz Files"
  inputs:
    script: |
      echo "##[debug] TAR.GZ FILES FOLDER PATH ........................................: ${{ parameters.tarGzFilesFolderPath }}"

      untar_files () {
        printf "\n>>>>> Checking if there are .tar.gz files in the [$1] folder\n"

        # Find all .tar.gz files in the specified folder.
        ALL_TAR_GZ_FILES=$(find "$1" -name "*.tar.gz" 2>/dev/null)
        
        if [ "${#ALL_TAR_GZ_FILES}" -gt 0 ]; then
            printf "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ .tar.gz Files: @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n $ALL_TAR_GZ_FILES\n"
            printf "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\n"
            
            COUNT_TAR_GZ_FILES=0
            while IFS= read -r tar_file || [[ -n "$tar_file" ]]; do
                ((COUNT_TAR_GZ_FILES++))
                COMPRESSED_FILE=${tar_file##*/}
                echo ">>>>>>>>>>>>>>>>>> ($COUNT_TAR_GZ_FILES) $COMPRESSED_FILE <<<<<<<<<<<<<<<<"

                FOLDER=$(IFS='.' read -ra comp_file2 <<< "$COMPRESSED_FILE" && echo "${comp_file2[0]}")

                echo "############## [$FOLDER]"

                printf ">>>>>>>>>>>>>>>>>>>>>>>>>> Extracting the file\n"

                # Extract the .tar.gz file and recursively check for more .tar.gz files in the extracted folder.
                mkdir -p "$1/$FOLDER"
                tar -xzf "$tar_file" -C "$1/$FOLDER"

                untar_files "$1/$FOLDER"

                echo "============================== : =============================="
            done <<< "$(echo "$ALL_TAR_GZ_FILES")"
        else
            echo "There is no .tar.gz file in the folder."
        fi
      }

      # Call the untar_files function to check for .tar.gz files in the folder.
      untar_files ${{ parameters.tarGzFilesFolderPath }}
