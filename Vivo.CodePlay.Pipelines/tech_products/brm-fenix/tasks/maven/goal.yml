# This YAML file defines the parameters and steps for a Maven task in an Azure DevOps pipeline.

parameters:
- name: displayName # The display name of the Maven task.
- name: pomFile # The path to the Maven POM file.
- name: goal # The Maven goal to execute.
- name: options  # Additional options for the Maven command.
  default: ''
- name: condition # The condition under which the task should run.
  default: 'succeeded()'
steps: 
- task: Maven@4
  displayName: ${{ parameters.displayName }}
  condition: ${{ parameters.condition }}
  inputs:
    mavenPOMFile: ${{ parameters.pomFile }} # The path to the Maven POM file, using the value of the pomFile parameter.
    goals: ${{ parameters.goal }} # The Maven goal to execute, using the value of the goal parameter.
    options: '${{ parameters.options }}'  # Additional options for the Maven command, using the value of the options parameter.
    publishJUnitResults: false # Whether to publish JUnit test results.
  env:
    PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR) # The username for the Nexus repository credentials.
    PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW) # The password for the Nexus repository credentials.
    ASDF_JAVA_VERSION: $(JAVA_VERSION) # The version of Java to use.
