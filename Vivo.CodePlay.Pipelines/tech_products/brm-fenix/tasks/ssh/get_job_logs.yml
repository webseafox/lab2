parameters:
- name: sshEndpoint
- name: jobPodName
- name: imageName
  default: ''
- name: jobPodWaitTimeout
  default: 10m

steps: 
- task: SSH@0
  displayName: "${{ parameters.jobPodName }} Status"
  inputs:
    sshEndpoint: ${{ parameters.sshEndpoint }}
    runOptions: 'inline'
    inline: |
      LOGS=""
      LOGS_2=""
      LOGS_3=""
      LOGS_4=""
      LOGS_5=""
      LOGS_6=""
      LOGS_7=""
      LOGS_8=""
      LOGS_9=""
      LOGS_10=""
      
      LINE_COUNT=0

      printf "##[debug] JOB POD NAME.....................................: ${{ parameters.jobPodName }}\n"
      printf "##[debug] JOB POD WAIT TIMEOUT.............................: ${{ parameters.jobPodWaitTimeout }}\n"
      printf "##[debug] IMAGE NAME.......................................: ${{ parameters.imageName }}\n"
      printf "##[debug] SSH ENDPOINT.....................................: ${{ parameters.sshEndpoint }}\n"

      RELEASE_VERSION="$(BRM_CORE_RELEASE_VERSION)"
      REL_NAMESPACE="brm${RELEASE_VERSION}-apps"

      printf "\n##[group]>> Get Job Logs\n"
      printf '\n>>>>>> 1/3 >>> Waiting Job ${{ parameters.jobPodName }} Created [Timeout: ${{ parameters.jobPodWaitTimeout }}] ...\n'
      printf "##[debug] BRM_CORE_RELEASE_VERSION................................: ${RELEASE_VERSION}\n"
      printf "##[debug] NAMESPACE...............................................: ${REL_NAMESPACE}\n"
      printf "##[command]kubectl wait --for=condition=complete --timeout=${{ parameters.jobPodWaitTimeout }} --namespace ${REL_NAMESPACE} job/${{ parameters.jobPodName }}\n"
      printf ">> Start of the process: $(date)\n"
      kubectl wait --for=condition=complete --timeout=${{ parameters.jobPodWaitTimeout }} --namespace ${REL_NAMESPACE} job/${{ parameters.jobPodName }}
      printf ">> End of process: $(date)\n"

      printf '\n>>>>>> 2/3 >>> ${{ parameters.jobPodName }} POD Information\n'
      printf "##[command]kubectl describe pod ${{ parameters.jobPodName }} -n ${REL_NAMESPACE} | grep Image | grep ${{ parameters.imageName }}: | cut -d":" -f3\n"
      printf "Running Version: $(kubectl describe pod ${{ parameters.jobPodName }} -n ${REL_NAMESPACE} | grep Image | grep ${{ parameters.imageName }}: | cut -d":" -f3)\n"
      printf "##[command]kubectl describe pod ${{ parameters.jobPodName }} -n ${REL_NAMESPACE} | grep "Start Time"\n"
      kubectl describe pod ${{ parameters.jobPodName }} -n ${REL_NAMESPACE} | grep "Start Time"

      printf '\n>>>>>> 3/3 >>> Get Job ${{ parameters.jobPodName }} Logs ...\n'
      printf "##[command]kubectl logs job/${{ parameters.jobPodName }} -n ${REL_NAMESPACE} |& tee log_file.txt\n"
      kubectl logs job/${{ parameters.jobPodName }} -n ${REL_NAMESPACE} |& tee log_file.txt
      printf "=======================================================================\n"
      printf "##[endgroup]\n"

      while IFS= read -r line || [[ -n "$line" ]]; do
        LINE_COUNT=$((LINE_COUNT + 1))
        
        read -r line <<<"${line//[$'\t\r\n']}"
        
        trim () {
          local str ellipsis_utf8
          local -i maxlen

          # use explaining variables; avoid magic numbers
          str="$*"
          maxlen="2000"
          ellipsis_utf8=$'\u2026'
          
          # only truncate $str when longer than $maxlen
          if (( "${#str}" > "$maxlen" )); then
            printf "%s%s\n" "${str:0:$maxlen}" " ${ellipsis_utf8}"
          else
            printf "%s\n" "$str"
          fi
        }
        
        line=$(trim $line)
        if [ -z "$line" ]; then
          continue
        fi

        # Remove leading timestamp like "[ 2026-01-13 17:51:01 ]" if present
        original_line="$line"
        line=$(sed -E 's/^\[[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+[0-9]{2}:[0-9]{2}:[0-9]{2}[[:space:]]*\][[:space:]]*//' <<<"$line")

        # Limits LOGS to 4000 characters to avoid truncation by Azure DevOps
        MAX_AZDO_VAR_SIZE=4000
        if (( "${#LOGS}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS" ]; then
              LOGS+="$line;"
          else
              LOGS="[L1>>]$line;"
          fi
          IN_L1="${#LOGS}"
        elif (( "${#LOGS_2}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_2" ]; then
              LOGS_2+="$line;"
          else
              LOGS_2="[L2>>]$line;"
          fi
          IN_L2="${#LOGS_2}"
        elif (( "${#LOGS_3}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_3" ]; then
              LOGS_3+="$line;"
          else
              LOGS_3="[L3>>]$line;"
          fi
          IN_L3="${#LOGS_3}"
        elif (( "${#LOGS_4}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_4" ]; then
              LOGS_4+="$line;"
          else
              LOGS_4="[L4>>]$line;"
          fi
          IN_L4="${#LOGS_4}"
        elif (( "${#LOGS_5}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_5" ]; then
              LOGS_5+="$line;"
          else
              LOGS_5="[L5>>]$line;"
          fi
          IN_L5="${#LOGS_5}"
        elif (( "${#LOGS_6}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_6" ]; then
              LOGS_6+="$line;"
          else
              LOGS_6="[L6>>]$line;"
          fi
          IN_L6="${#LOGS_6}"
        elif (( "${#LOGS_7}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_7" ]; then
              LOGS_7+="$line;"
          else
              LOGS_7="[L7>>]$line;"
          fi
          IN_L7="${#LOGS_7}"
        elif (( "${#LOGS_8}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_8" ]; then
              LOGS_8+="$line;"
          else
              LOGS_8="[L8>>]$line;"
          fi
          IN_L8="${#LOGS_8}"
        elif (( "${#LOGS_9}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_9" ]; then
              LOGS_9+="$line;"
          else
              LOGS_9="[L9>>]$line;"
          fi
          IN_L9="${#LOGS_9}"
        elif (( "${#LOGS_10}" < "$MAX_AZDO_VAR_SIZE" )); then
          if [ -n "$LOGS_10" ]; then
              LOGS_10+="$line;"
          else
              LOGS_10="[L10>>]$line;"
          fi
          IN_L10="${#LOGS_10}"
        fi
      done < log_file.txt

      printf "##[group]>> Logs Variables Content\n"
      TOTAL_CHARS=0
      for name in LOGS LOGS_2 LOGS_3 LOGS_4 LOGS_5 LOGS_6 LOGS_7 LOGS_8 LOGS_9 LOGS_10; do
        val="${!name}"
        TOTAL_CHARS=$((TOTAL_CHARS + ${#val}))
      done
      
      printf "🔹 L1\n"
      printf "\t- Size: ${#LOGS}\n"
      printf "\t- Content: $LOGS\n"
      printf "🔹 L2\n"
      printf "\t- Size: ${#LOGS_2}\n"
      printf "\t- Content: $LOGS_2\n"
      printf "🔹 L3\n"
      printf "\t- Size: ${#LOGS_3}\n"
      printf "\t- Content: $LOGS_3\n"
      printf "🔹 L4\n"
      printf "\t- Size: ${#LOGS_4}\n"
      printf "\t- Content: $LOGS_4\n"
      printf "🔹 L5\n"
      printf "\t- Size: ${#LOGS_5}\n"
      printf "\t- Content: $LOGS_5\n"
      printf "🔹 L6\n"
      printf "\t- Size: ${#LOGS_6}\n"
      printf "\t- Content: $LOGS_6\n"
      printf "🔹 L7\n"
      printf "\t- Size: ${#LOGS_7}\n"
      printf "\t- Content: $LOGS_7\n"
      printf "🔹 L8\n"
      printf "\t- Size: ${#LOGS_8}\n"
      printf "\t- Content: $LOGS_8\n"
      printf "🔹 L9\n"
      printf "\t- Size: ${#LOGS_9}\n"
      printf "\t- Content: $LOGS_9\n"
      printf "🔹 L10\n"
      printf "\t- Size: ${#LOGS_10}\n"
      printf "\t- Content: $LOGS_10\n"
      printf "##[endgroup]\n"

      printf ">> Log file character count: $TOTAL_CHARS \n"
      printf ">> Log file line count: $LINE_COUNT \n"
      
      printf "##vso[task.setvariable variable=JOB_LOGS;]%s\n" "$LOGS"
      printf "##vso[task.setvariable variable=JOB_LOGS_2;]%s\n" "${LOGS_2:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_3;]%s\n" "${LOGS_3:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_4;]%s\n" "${LOGS_4:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_5;]%s\n" "${LOGS_5:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_6;]%s\n" "${LOGS_6:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_7;]%s\n" "${LOGS_7:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_8;]%s\n" "${LOGS_8:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_9;]%s\n" "${LOGS_9:-}"
      printf "##vso[task.setvariable variable=JOB_LOGS_10;]%s\n" "${LOGS_10:-}"
    readyTimeout: '20000'
    failOnStdErr: false