# This YAML file defines a pipeline task for bumping the version number of a project.
parameters:
- name: appVersionReceived
- name: condition
  default: 'True'

steps:
  - task: CmdLine@2
    displayName: "Get Version"
    name: get_version
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        # This script is executed to bump the version number of the project.

        # Print the current environment and current version for debugging purposes.
        echo "##[debug] ENVIRONMENT.............................: ${_ENVIRONMENT}"
        echo "##[debug] LATEST VERSION..........................: ${_CURRENT_VERSION}"
        echo "##[debug] APPLICATION VERSION RECEIVED............: ${{ parameters.appVersionReceived }}"

        if [ "${{ parameters.appVersionReceived }}" != "LATEST" ]; then         
          echo ">>>>> Using provided version"
          NEW_VERSION=${{ parameters.appVersionReceived }}
        else
          echo ">>>>> Fetching Version in Library ..."
          NEW_VERSION=${_CURRENT_VERSION}
        fi

        if [ ${_ENVIRONMENT} == 'prod' ]; then
          NEW_VERSION=$NEW_VERSION
        else
          NEW_VERSION=$NEW_VERSION-${_ENVIRONMENT}
        fi

        echo "##vso[task.setvariable variable=_VERSION;isoutput=true]$NEW_VERSION"
        echo ">>>>>>>>>> Version: $NEW_VERSION"
    env:
      _CURRENT_VERSION: $(CURRENT_VERSION)
      _ENVIRONMENT: $(ENVIRONMENT)