# This YAML file defines a pipeline task for bumping the version number of a project.

parameters:
  - name: condition
    default: 'True'

steps:
  - task: CmdLine@2
    displayName: "Bump"
    name: bump
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        # This script is executed to bump the version number of the project.

        # Print the current environment and current version for debugging purposes.
        echo "##[debug] ENVIRONMENT.................: ${_ENVIRONMENT}"
        echo "##[debug] CURRENT_VERSION.............: ${_CURRENT_VERSION}"

        # Increment the last part of the current version number by 1.
        AUX=$(echo ${_CURRENT_VERSION} | awk -F. -v OFS=. '{$NF += 1 ; print}')

        # Determine the new version based on the environment.
        if [ ${_ENVIRONMENT} == 'prod' ]; then
          NEW_VERSION=$AUX
        else
          NEW_VERSION=$AUX-${_ENVIRONMENT}
        fi

        # Set the new version as an output variable.
        echo "##vso[task.setvariable variable=_VERSION;isoutput=true]$NEW_VERSION"

        # Print the new version for debugging purposes.
        echo "##[debug] NEW_VERSION.................: $NEW_VERSION"
    env:
      _CURRENT_VERSION: $(CURRENT_VERSION)
      _ENVIRONMENT: $(ENVIRONMENT)