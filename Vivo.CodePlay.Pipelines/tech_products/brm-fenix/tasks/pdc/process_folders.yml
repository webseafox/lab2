parameters:
  - name: workingDirectory
  - name: XMLFilesFolderToDeploy

steps:
- task: CmdLine@2
  name: process_folders
  displayName: "Process Pricing-Config Folders"
  inputs:
    workingDirectory: ${{ parameters.workingDirectory }}
    script: |
      echo "##[debug] WORKING_DIRECTORY................: ${{ parameters.workingDirectory }}"

      echo "##[command]ls -1v | tail -n 1"
      NEWEST_FOLDER=$(ls -1v | tail -n 1)
      echo "##[debug] NEWEST_FOLDER....................: $NEWEST_FOLDER"

      echo "##[command]ls -1v $NEWEST_FOLDER"
      NEWEST_SUBFOLDERS=$(ls -1v $NEWEST_FOLDER)

      echo "##[command]rm -Rf ${{ parameters.XMLFilesFolderToDeploy }}"
      rm -Rf ${{ parameters.XMLFilesFolderToDeploy }} 

      echo "##[command]mkdir -p ${{ parameters.XMLFilesFolderToDeploy }}"
      mkdir -p ${{ parameters.XMLFilesFolderToDeploy }} 

      echo ">>>>> Pricing-config Components to deploy:"
      PRICING_CONFIG_COMPONENTS_TO_DEPLOY=""
      while read line 
      do
        echo "> $line"

        arrIN=(${line//_/ })
        COMP=${arrIN[1]}

        echo "##[command]cp $NEWEST_FOLDER/$line/$COMP.xml ${{ parameters.XMLFilesFolderToDeploy }}/$line.xml"
        cp $NEWEST_FOLDER/$line/$COMP.xml ${{ parameters.XMLFilesFolderToDeploy }}/$line.xml

        if [ "${#PRICING_CONFIG_COMPONENTS_TO_DEPLOY}" -gt 0 ]; then
          PRICING_CONFIG_COMPONENTS_TO_DEPLOY+=",$line"
        else
          PRICING_CONFIG_COMPONENTS_TO_DEPLOY+="$line"
        fi
      done <<< "$NEWEST_SUBFOLDERS"

      echo ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>"
      echo ">>>>> Folder: ${{ parameters.XMLFilesFolderToDeploy }}"
      ls -la ${{ parameters.XMLFilesFolderToDeploy }}

      echo "##vso[task.setvariable variable=NEWEST_FOLDER;isoutput=true]$NEWEST_FOLDER"
      echo "##vso[task.setvariable variable=PRICING_CONFIG_COMPONENTS_TO_DEPLOY;isoutput=true]$PRICING_CONFIG_COMPONENTS_TO_DEPLOY"