parameters:
- name: scriptName
- name: scriptPath

steps:
- task: CmdLine@2
  displayName: "DB File Packaging Script"
  inputs:
    workingDirectory: ${{ parameters.scriptPath }}
    script: |
      echo "##[debug] SCRIPT.................................................: ${SCRIPT}"
      echo "##[debug] WORKING DIRECTORY......................................: ${SCRIPT_PATH}"

      echo "##[command]chmod +x ${SCRIPT}"
      chmod +x ${SCRIPT}

      echo "##[command]bash ${SCRIPT}"
      bash ${SCRIPT}
  env:
    SCRIPT_PATH: ${{ parameters.scriptPath }}
    SCRIPT: ${{ parameters.scriptPath }}/${{ parameters.scriptName }}