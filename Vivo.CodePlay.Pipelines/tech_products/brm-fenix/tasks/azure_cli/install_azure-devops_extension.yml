# This YAML file defines a pipeline task to install the azure-devops CLI extension.

steps:
  - task: CmdLine@2
    displayName: "Install azure-devops CLI extension"
    retryCountOnTaskFailure: 3
    inputs:
      script: |
        # Install azure-devops extension
        echo "##[group]Install azure-devops extension"
        echo "##[command]az extension add --name azure-devops"
        az extension add --name azure-devops
        echo "##[endgroup]"
