parameters:
  - name: condition
    default: succeeded()
  - name: environment
  - name: compartmentId
  - name: dbSystemId
  - name: dbSystemName

steps:
  - task: CmdLine@2
    name: get_database
    displayName: "Get Database"
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        echo "##[debug] ENVIRONMENT ...............................................: ${{ parameters.environment }}"
        echo "##[debug] COMPARTMENT ID ............................................: ${{ parameters.compartmentId }}"
        echo "##[debug] DB SYSTEM NAME ............................................: ${{ parameters.dbSystemName }}"
        echo "##[debug] DB SYSTEM ID ..............................................: ${{ parameters.dbSystemId }}"
        echo "##[debug] CONDITION .................................................: ${{ parameters.condition }}"
        echo ""
        
        echo "##[group]>>>>> Get ${{ parameters.dbSystemName }} Database ..."
        echo "##[command]oci db database list --compartment-id ${{ parameters.compartmentId }} --db-system-id ${{ parameters.dbSystemId }}"
        DATABASE=$(oci db database list --compartment-id ${{ parameters.compartmentId }} --db-system-id ${{ parameters.dbSystemId }})

        echo "$DATABASE | jq ."
        echo "##[endgroup]"

        DATABASE_ID=$(echo "$DATABASE" | jq -r '.data[0].id')
        DATABASE_NAME=$(echo "$DATABASE" | jq -r '.data[0]["db-name"]')
        DATABASE_UNIQUE_NAME=$(echo "$DATABASE" | jq -r '.data[0]["db-unique-name"]')
        DATABASE_STATE=$(echo "$DATABASE" | jq -r '.data[0]["lifecycle-state"]')

        if [ -z "$DATABASE_ID" ] || [ -z "$DATABASE_NAME" ] || [ -z "$DATABASE_UNIQUE_NAME" ] || [ -z "$DATABASE_STATE" ]; then
          echo "##[error]Failed to extract database details for environment ${{ parameters.environment }}"
          exit 1
        fi

        echo ""
        echo ">> Database Name: $DATABASE_NAME"
        echo ">> Database Unique Name: $DATABASE_UNIQUE_NAME"
        echo ">> Database ID: $DATABASE_ID"
        echo ">> Database State: $DATABASE_STATE"

        echo "##vso[task.setvariable variable=DATABASE;isoutput=true]"$DATABASE""
        echo "##vso[task.setvariable variable=DATABASE_ID;isoutput=true]$DATABASE_ID"
        echo "##vso[task.setvariable variable=DATABASE_NAME;isoutput=true]$DATABASE_NAME"
        echo "##vso[task.setvariable variable=DATABASE_STATE;isoutput=true]$DATABASE_STATE"
        echo "##vso[task.setvariable variable=DATABASE_UNIQUE_NAME;isoutput=true]$DATABASE_UNIQUE_NAME"