parameters:
  - name: condition
    default: succeeded()

steps:
  - task: CmdLine@2
    displayName: "Validate OCI CLI"
    name: validate_oci_cli
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        echo "##[debug] CONDITION .........................................................: ${{ parameters.condition }}"
        echo ""

        echo "🔍 Checking OCI CLI installation ..."
        if ! command -v oci &> /dev/null; then
          echo "    ❌ OCI CLI is not installed."

          echo "##vso[task.logissue type=error;]OCI CLI is not installed"
          echo "##vso[task.complete result=Failed;]"
        else
          OCI_VER=$(oci --version)
          echo "    ✅ OCI CLI is already installed. Version $OCI_VER"
        fi

        echo "##vso[task.setvariable variable=OCI_VERSION;isOutput=true]$OCI_VER"