parameters:
  - name: condition
    default: succeeded()
  - name: environment
  - name: compartmentId

steps:
  - task: CmdLine@2
    name: get_cluster
    displayName: "Get ${{ parameters.environment }} Cluster"
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        echo "##[debug] ENVIRONMENT ...............................................: ${{ parameters.environment }}"
        echo "##[debug] COMPARTMENT ID ............................................: ${{ parameters.compartmentId }}"
        echo "##[debug] CONDITION .................................................: ${{ parameters.condition }}"
        echo ""

        echo "##[group]>>>>> Get "$(echo ${{ parameters.environment }} | tr '[:lower:]' '[:upper:]')" Cluster ..."
        echo "##[command]oci ce cluster list --compartment-id ${{ parameters.compartmentId }} | jq -r '.data[] | select(.name | contains("'$(echo ${{ parameters.environment }} | tr '[:lower:]' '[:upper:]')'"))'"
        CLUSTER=$(oci ce cluster list --compartment-id ${{ parameters.compartmentId }} | jq -r '.data[] | select(.name | contains("'$(echo ${{ parameters.environment }} | tr '[:lower:]' '[:upper:]')'"))')

        echo "$CLUSTER | jq ."
        echo "##[endgroup]"

        CLUSTER_ID=$(echo $CLUSTER | jq -r '.id')
        CLUSTER_NAME=$(echo $CLUSTER | jq -r '.name')
        CLUSTER_STATE=$(echo $CLUSTER | jq -r '.["lifecycle-state"]')

        if [ -z "$CLUSTER_ID" ] || [ -z "$CLUSTER_NAME" ] || [ -z "$CLUSTER_STATE" ]; then
          echo "##[error]Failed to extract cluster details for environment ${{ parameters.environment }}"
          exit 1
        fi

        echo ""
        echo ">> Cluster Name: $CLUSTER_NAME"
        echo ">> Cluster ID: $CLUSTER_ID"
        echo ">> Cluster State: $CLUSTER_STATE"

        echo "##vso[task.setvariable variable=CLUSTER;isoutput=true]"$CLUSTER""
        echo "##vso[task.setvariable variable=CLUSTER_ID;isoutput=true]$CLUSTER_ID"
        echo "##vso[task.setvariable variable=CLUSTER_NAME;isoutput=true]$CLUSTER_NAME"
        echo "##vso[task.setvariable variable=CLUSTER_STATE;isoutput=true]$CLUSTER_STATE"
