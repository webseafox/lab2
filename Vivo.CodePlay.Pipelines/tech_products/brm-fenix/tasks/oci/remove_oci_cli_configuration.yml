parameters:
  - name: ociCliFolder
  - name: ociCliFolderPath
  - name: condition
    default: always()

steps:
  - task: CmdLine@2
    name: remove_oci_cli_configuration
    displayName: "Remove OCI CLI Configuration"
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        echo "##[debug] OCI CLI FOLDER PATH ...............................................: ${{ parameters.ociCliFolderPath }}"
        echo "##[debug] OCI CLI FOLDER ....................................................: ${{ parameters.ociCliFolder }}"
        echo "##[debug] CONDITION .........................................................: ${{ parameters.condition }}"
        echo ""

        echo "🔧 Removing OCI CLI BRM Fênix Configuration ..."
        echo "##[group]    📁 ❌ Remove ${{ parameters.ociCliFolderPath }} folder ..."
        echo "##[command]           rm -frv ${{ parameters.ociCliFolderPath }}"
        rm -frv ${{ parameters.ociCliFolderPath }}
        echo "##[endgroup]"

        echo "    🔍 View ${{ parameters.ociCliFolder }} folder content ..."
        echo "##[command]        ls -la $(Agent.HomeDirectory) | grep ${{ parameters.ociCliFolder }}"
        echo "        Files:"
        ls -la $(Agent.HomeDirectory) | grep ${{ parameters.ociCliFolder }} | awk '{print "        " $9}'
