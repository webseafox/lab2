parameters:
- name: pricingConfigComponentsToDeploy

steps:
- task: SSH@0
  displayName: "Backup XML Files"
  inputs:    
    sshEndpoint: BRM_BASTION_$(ENVIRONMENT)
    runOptions: 'inline'
    inline: |
      echo "##[debug] PDC_BRE_DEPLOYMENT_POD................: $(PDC_BRE_DEPLOYMENT_POD)"
      echo "##[debug] PDC_EXPORT_TARGET_FOLDER..............: $(PDC_EXPORT_TARGET_FOLDER)"
      echo "##[debug] PDC_EXPORT_FILE_NAME_PREFIX...........: $(PDC_EXPORT_FILE_NAME_PREFIX)"

      IFS=',' read -ra ADDR <<< "${{ parameters.pricingConfigComponentsToDeploy }}"
      for component in "${ADDR[@]}"; do
        arrIN=(${component//_/ })
        export COMPONENT=${arrIN[1]}
        

        echo ">>>>> $COMPONENT >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>"
        PDC_EXPORT_FILE_NAME=$(PDC_EXPORT_FILE_NAME_PREFIX)_$COMPONENT.xml
        echo "##[debug] PDC EXPORT FILE NAME................: $PDC_EXPORT_FILE_NAME"

        echo "##[command]mkdir -p $(PDC_EXPORT_TARGET_FOLDER)"
        mkdir -p $(PDC_EXPORT_TARGET_FOLDER)

        echo "##[command]kubectl cp $(PDC_BRE_DEPLOYMENT_POD):/u01/PDC_BRM_SHARE/$PDC_EXPORT_FILE_NAME $(PDC_EXPORT_TARGET_FOLDER)/$PDC_EXPORT_FILE_NAME"
        kubectl cp $(PDC_BRE_DEPLOYMENT_POD):/u01/PDC_BRM_SHARE/$PDC_EXPORT_FILE_NAME $(PDC_EXPORT_TARGET_FOLDER)/$PDC_EXPORT_FILE_NAME 2>&1 >/dev/null
      done
    readyTimeout: '20000'
    failOnStdErr: false

- task: SSH@0
  displayName: "Validate Backup XML Files"
  inputs:    
    sshEndpoint: BRM_BASTION_$(ENVIRONMENT)
    runOptions: 'inline'
    inline: |
      echo "##[debug] PDC_BRE_DEPLOYMENT_POD................: $(PDC_BRE_DEPLOYMENT_POD)"
      echo "##[debug] PDC_EXPORT_TARGET_FOLDER..............: $(PDC_EXPORT_TARGET_FOLDER)"
      echo "##[debug] PDC_EXPORT_FILE_NAME_PREFIX...........: $(PDC_EXPORT_FILE_NAME_PREFIX)"

      IFS=',' read -ra ADDR <<< "${{ parameters.pricingConfigComponentsToDeploy }}"
      for component in "${ADDR[@]}"; do
        arrIN=(${component//_/ })
        export COMPONENT=${arrIN[1]}

        echo ">>>>> $COMPONENT >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>"
        PDC_EXPORT_FILE_NAME=$(PDC_EXPORT_FILE_NAME_PREFIX)_$COMPONENT.xml
        echo "##[debug] PDC EXPORT FILE NAME................: $PDC_EXPORT_FILE_NAME"

        echo "##[command]ls -la $(PDC_EXPORT_TARGET_FOLDER)/$PDC_EXPORT_FILE_NAME | grep $PDC_EXPORT_FILE_NAME | awk '{print $9}'"
        VALIDATE=$(ls -la $(PDC_EXPORT_TARGET_FOLDER)/ | grep $PDC_EXPORT_FILE_NAME | awk '{print $9}')

        if [[ $VALIDATE == "$PDC_EXPORT_FILE_NAME" ]]; then
          echo ">>>>> [$VALIDATE] Export Successfully Completed <<<<<"
        else
          echo "##vso[task.logissue type=error;]Export not executed !!!"
          echo "##vso[task.complete result=Failed;]"

          exit 1
        fi
      done

      echo ">>>>> BACKUP XML FILES >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>"
      echo "##[command]ls -la $(PDC_EXPORT_TARGET_FOLDER)"
      ls -la $(PDC_EXPORT_TARGET_FOLDER)
    readyTimeout: '20000'
    failOnStdErr: false