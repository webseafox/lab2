parameters:
- name: workingDirectory
- name: XMLFilesFolderToDeploy

steps:
- template: ../../tasks/pdc/process_folders.yml
  parameters:
    workingDirectory: ${{ parameters.workingDirectory }}
    XMLFilesFolderToDeploy: ${{ parameters.XMLFilesFolderToDeploy }}

- template: ../../task_groups/artifact/publish.yml
  parameters:
    artifactName: pricing-config-components-to-deploy
    targetPath: ${{ parameters.XMLFilesFolderToDeploy }}