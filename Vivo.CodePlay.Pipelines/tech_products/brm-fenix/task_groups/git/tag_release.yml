# This YAML file defines a pipeline task group for tagging and releasing a repository.

parameters:
- name: version # The version number of the release.
- name: repository # The name of the repository.
- name: artifactName # The name of the artifact.
- name: deployApprovalComment # The comment for the deployment approval.

steps:
# This step sets the current date and time as a variable.
- script: |
    DATE_NOW=$(date '+%d-%m-%Y %H:%M:%S')
    echo "##[debug] DATE_NOW....................: $DATE_NOW"
    echo "##vso[task.setvariable variable=DATE_NOW;isoutput=true]$DATE_NOW"
  name: prep
  displayName: "Preparation"

- template: ../../task_groups/artifact/download.yml
  parameters:
    displayName: Download Pipeline Artifact [${{ parameters.artifactName }}]
    artifactName: ${{ parameters.artifactName }}
    targetPath: $(Agent.BuildDirectory)/${{ parameters.artifactName }}

# This step pushes the changes to the repository with a commit message containing the build number and the deployment date.
- template: ../../tasks/git/push.yml
  parameters:
    repository: ${{ parameters.artifactName }}
    repositoryLocalPath: ${{ parameters.repository }}
    commitMessage: "[skip ci] Application deployed by Pipeline build $(Build.BuildNumber) in $(prep.DATE_NOW)"
    isEmptyCommit: true

# This step creates a tag in the repository with the specified version number and tag message.
- template: ../../tasks/git/tag.yml
  parameters:
    tag: ${{ parameters.version }}
    repository: ${{ parameters.repository }}
    tagMessage: "[skip ci] Release executed by Pipeline build $(Build.BuildNumber) on $(prep.DATE_NOW). Change Request (CHG): ${{ parameters.deployApprovalComment }}"
