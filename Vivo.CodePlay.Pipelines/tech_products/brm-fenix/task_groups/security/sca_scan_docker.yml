parameters:
  - name: tarFile

steps:
  - script: |
      echo "##[debug] TAR FILE .........................................: ${{ parameters.tarFile }}"

      echo "##[command]docker images --format "{{.Repository}}:{{.Tag}}" | grep "$ACR_BRM_REPOSITORY" | xargs -r docker rmi -f"
      docker images --format "{{.Repository}}:{{.Tag}}" | grep "$ACR_BRM_REPOSITORY" | xargs -r docker rmi -f

      echo ""
      echo "##[command]docker load --input ${{ parameters.tarFile }}"
      LOADED_IMAGE=$(docker load --input ${{ parameters.tarFile }})

      IMG_APP_RAW=$(IFS=':' read -ra comp_file <<< $LOADED_IMAGE && echo "${comp_file[1]}" | tr -d '[:space:]')
      IMG_VERSION=$(IFS=':' read -ra comp_file <<< $LOADED_IMAGE && echo "${comp_file[2]}" | tr -d '[:space:]')

      echo ""
      echo "##[debug] IMAGE NAME .......................................: $IMG_APP_RAW"
      echo "##[debug] IMAGE VERSION ....................................: $IMG_VERSION"

      echo ""
      echo "##[command]docker tag $IMG_APP_RAW:$IMG_VERSION $(DOCKER_ACR_REGISTRY)/$IMG_APP_RAW:$IMG_VERSION"
      docker tag $IMG_APP_RAW:$IMG_VERSION $(DOCKER_ACR_REGISTRY)/$IMG_APP_RAW:$IMG_VERSION

      echo ""
      echo "##[command]docker images | grep $IMG_VERSION"
      docker images | grep $IMG_VERSION

      echo "##vso[task.setvariable variable=DOCKER_IMAGE_NAME;isOutput=true]$IMG_APP_RAW"
      echo "##vso[task.setvariable variable=DOCKER_IMAGE_TAG;isOutput=true]$IMG_VERSION"
    name: docker_metadata
    displayName: "Docker Metadata"

  - template: /security/define_appsec_app_version.yml@CodePlay

  - template: /security/run_sca_scan_docker.yml@CodePlay
    parameters:
      appVersion: "$(FORTIFY_APP_VERSION)"
      vivoFlow: "dev01_15,dev02_15,dev03_15,tpm_15,preprod_15,prodlike_15,master_15"
