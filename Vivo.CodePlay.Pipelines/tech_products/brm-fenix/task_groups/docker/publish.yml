# This YAML file defines the parameters and steps for publishing a Docker image to a container registry.

parameters:
  # The name of the container registry where the Docker image will be published.
  - name: containerRegistry
  # The name of the repository within the container registry where the Docker image will be published.
  - name: repositoryRegistry
  # The tags to be applied to the Docker image.
  - name: tags
  # The name of the Azure Container Registry (ACR) where the Docker image will be published.
  - name: acrRegistryName
  - name: imageName

steps:
  - task: CmdLine@2
    name: publish_show_parameters
    displayName: Publish Show Parameters
    inputs:
      script: |
        echo "##[debug] IMAGE NAME ......................................................: ${{ parameters.imageName }}"
        echo "##[debug] CONTAINER REGISTRY ..............................................: ${{ parameters.containerRegistry }}"
        echo "##[debug] REPOSITORY REGISTRY .............................................: ${{ parameters.repositoryRegistry }}"
        echo "##[debug] TAGS ............................................................: ${{ parameters.tags }}"
        echo "##[debug] ACR REGISTRY NAME ...............................................: ${{ parameters.acrRegistryName }}"

  # This step uses a template to publish the Docker image to the specified container registry.
  # It publishes both the version tag and the latest tag in a single operation.
  - template: ../../tasks/docker/publish.yml
    parameters:
      displayName: "Publish ${{ parameters.imageName }} in ${{ parameters.containerRegistry }}"
      containerRegistry: ${{ parameters.containerRegistry }} # Passes the value of the "containerRegistry" parameter to the template.
      repository: ${{ parameters.repositoryRegistry }} # Passes the value of the "repositoryRegistry" parameter to the template.
      tags: |
        ${{ parameters.tags }}
        $(ENVIRONMENT)_$(BRM_CORE_RELEASE_VERSION)_latest

  # This step uses a template to validate the published Docker image using Azure CLI.
  # It references the "validate_image_publish.yml" template located in the "../../tasks/azure_cli" directory.
  - template: ../../tasks/docker/validate_docker_image_publish.yml
    parameters:
      image: ${{ parameters.repositoryRegistry }}:${{ parameters.tags }} # Passes the value of the "repositoryRegistry" and "tags" parameters to the template to form the image name.
      containerRegistry: ${{ parameters.containerRegistry }} # Passes the value of the "containerRegistry" parameter to the template.
      acrRegistryName: ${{ parameters.acrRegistryName }} # Passes the value of the "acrRegistryName" parameter to the template.
