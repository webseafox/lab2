# This YAML file defines a build pipeline for a Docker image. It contains parameters for configuring the build process and several steps that are executed in sequence.

parameters:
  - name: containerRegistry # The name of the container registry to use for the Docker image.
  - name: dockerRegistry
  - name: dockerImageTag # The tag to assign to the Docker image.
  - name: applicationVersion # The version of the application being built.
  - name: dockerfile # The path to the Dockerfile used for building the image.
  - name: buildContext # The path to the build context directory.
  - name: outputFile # The path to the output file where the build logs will be saved.
  - name: buildArgs # Additional build arguments to pass to the Docker build command.
    default: ""

steps:
  # Step to log in to the container registry.
  - template: ../../tasks/docker/login.yml
    parameters:
      containerRegistry: ${{ parameters.containerRegistry }}

  # Step to build the Docker image.
  - template: ../../tasks/docker/build.yml
    parameters:
      dockerfile: ${{ parameters.dockerfile }}
      buildArgs: ${{ parameters.buildArgs }}
      imageRegistry: ${{ parameters.dockerRegistry }}
      imageName: ${{ parameters.dockerImageTag }}
      imageVersion: ${{ parameters.applicationVersion }}
      buildContext: ${{ parameters.buildContext }}
      outputFile: ${{ parameters.outputFile }}

  # Step to log out from the container registry.
  - template: ../../tasks/docker/logout.yml
    parameters:
      containerRegistry: ${{ parameters.containerRegistry }}

  # Step to check for errors during the build process.
  - template: ../../tasks/bash/check_errors_v2.yml
    parameters:
      step: "Build Application Image"
      outputFile: ${{ parameters.outputFile }}

  # Step to validate the created Docker image.
  - template: ../../tasks/docker/validate_docker_image_create.yml
    parameters:
      imageName: ${{ parameters.dockerImageTag }}
      applicationVersion: ${{ parameters.applicationVersion }}

  - template: ../../tasks/docker/create_tar.yml
    parameters:
      imageTag: $(build_image.IMAGE_TAG)
      imageName: $(build_image.IMAGE_NAME)

  - template: ../../task_groups/artifact/publish.yml
    parameters:
      artifactName: custom_image
      targetPath: $(Pipeline.Workspace)/$(build_image.IMAGE_NAME).tar
      isFile: true
