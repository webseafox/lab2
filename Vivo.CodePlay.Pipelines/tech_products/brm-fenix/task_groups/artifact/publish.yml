# This YAML file defines a pipeline task for publishing artifacts.

parameters:
  - name: artifactName # The name of the artifact to be published.
  - name: targetPath # The target path where the artifact will be published.
  - name: isFile # Specifies whether the artifact is a file or a directory. Default value is false.
    default: false
  - name: condition
    default: succeeded()

steps:
  - ${{ if eq(parameters.isFile, 'false') }}:
      - task: CmdLine@2
        displayName: "Publish Pipeline Artifact [${{ parameters.artifactName }}] - Prepare"
        condition: ${{ parameters.condition }}
        inputs:
          workingDirectory: ${{ parameters.targetPath }}
          script: |
            echo "##[debug] ARTIFACT NAME ...........................................: ${{ parameters.artifactName }}"
            echo "##[debug] TARGET PATH .............................................: ${{ parameters.targetPath }}"

  - task: PublishPipelineArtifact@1
    displayName: Publish Pipeline Artifact [${{ parameters.artifactName }}]
    condition: ${{ parameters.condition }}
    inputs:
      targetPath: ${{ parameters.targetPath }}
      artifactName: ${{ parameters.artifactName }}
      publishLocation: pipeline
