parameters:
  - name: displayName
  - name: artifactName
  - name: targetPath
  - name: disableCleanDirectory
    default: false
  - name: disableShowParameters
    default: false
  - name: itemPattern
    default: "**"
  - name: condition
    default: succeeded()

steps:
  - ${{ if eq(parameters.disableShowParameters, false) }}:
      - task: CmdLine@2
        displayName: Download Show Parameters
        condition: ${{ parameters.condition }}
        inputs:
          script: |
            echo "##[debug] DISPLAY NAME ..............................................: ${{ parameters.displayName }}"
            echo "##[debug] ARTIFACT NAME .............................................: ${{ parameters.artifactName }}"
            echo "##[debug] TARGET PATH ...............................................: ${{ parameters.targetPath }}"
            echo "##[debug] DISABLE CLEAN DIRECTORY ...................................: ${{ parameters.disableCleanDirectory }}"
            echo "##[debug] ITEM PATTERN ..............................................: ${{ parameters.itemPattern }}"
            echo "##[debug] CONDITION .................................................: ${{ parameters.condition }}"

  - ${{ if eq(parameters.disableCleanDirectory, false) }}:
      - template: ../../tasks/bash/clean_directory.yml
        parameters:
          directory: ${{ parameters.targetPath }}
          disableCleanDirectory: ${{ parameters.disableCleanDirectory }}
          condition: ${{ parameters.condition }}

  - task: DownloadPipelineArtifact@2
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}
    inputs:
      buildType: current
      artifactName: ${{ parameters.artifactName }}
      targetPath: ${{ parameters.targetPath }}
      itemPattern: ${{ parameters.itemPattern }}
