parameters:
  sourceCodeFolder: ""
  filesPath: ""
  environmentsObservability: ""
  dashboardHistoryId: ""
  cleanEntries: ""

steps:
  - task: CmdLine@2
    displayName: "Parameters"
    inputs:
      script: |
        echo "##[debug] SOURCE CODE FOLDER ........................................: ${{ parameters.sourceCodeFolder }}"
        echo "##[debug] FILES PATH ................................................: ${{ parameters.filesPath }}"
        echo "##[debug] ENVIRONMENTS OBSERVABILITY ................................: ${{ parameters.environmentsObservability }}"
        echo "##[debug] DASHBOARD HISTORY ID ......................................: ${{ parameters.dashboardHistoryId }}"
        echo "##[debug] CLEAN ENTRIES .............................................: ${{ parameters.cleanEntries }}"

  - template: ../../task_groups/checkout/checkout.yml
    parameters:
      repository: self
      path: ${{ parameters.sourceCodeFolder }}

  - template: ../../tasks/observability/create_history_file.yml
    parameters:
      filesPath: ${{ parameters.filesPath }}
      environmentsObservability: ${{ parameters.environmentsObservability }}
      cleanEntries: ${{ parameters.cleanEntries }}
  
  - template: ../../tasks/observability/create_dashboard_file.yml
    parameters:
      environmentsObservability: ${{ parameters.environmentsObservability }}
      filesPath: ${{ parameters.filesPath }}
      dashboardHistoryUrl: "$(System.CollectionUri)$(System.TeamProjectId)/_dashboards/dashboard/${{ parameters.dashboardHistoryId }}"

  - template: ../../tasks/git/push.yml
    parameters:
      repository: self
      repositoryLocalPath: ${{ parameters.dashboardObservabilityFilesFolderPath }}
      commitMessage: "[Automated Commit] [$(Build.BuildNumber)] Update observability dashboard files"
      isOnlyFilesChanged: false
