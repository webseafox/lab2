# This YAML file defines the parameters and steps for the checkout process in a CI/CD pipeline.

parameters:
- name: repository # The name of the repository to checkout.
- name: path # The path where the repository will be checked out.
- name: clean # Specifies whether to clean the workspace before checking out the repository. Default is true.
  default: true  
- name: submodules # Specifies whether to include submodules when checking out the repository. Default is true.
  default: true  
- name: persistCredentials # Specifies whether to persist credentials during the checkout process. Default is true.
  default: true  
- name: disableCleanDirectory
  default: false
- name: disablePullRebase
  default: false

steps:
- script: |
    echo "##[debug] REPOSITORY ...............................................: ${{ parameters.repository }}"
    echo "##[debug] PATH .....................................................: ${{ parameters.path }}"
    echo "##[debug] CLEAN ....................................................: ${{ parameters.clean }}"
    echo "##[debug] SUBMODULES ...............................................: ${{ parameters.submodules }}"
    echo "##[debug] PERSIST CREDENTIALS ......................................: ${{ parameters.persistCredentials }}"
    echo "##[debug] DISABLE CLEAN DIRECTORY ..................................: ${{ parameters.disableCleanDirectory }}"
    echo "##[debug] DISABLE PULL REBASE ......................................: ${{ parameters.disablePullRebase }}"
  displayName: 'Checkout Show Parameters'

- template: ../../tasks/bash/clean_directory.yml
  parameters:
    directory: $(Agent.BuildDirectory)/${{ parameters.path }}
    disableCleanDirectory: ${{ parameters.disableCleanDirectory }}

# The checkout step checks out the specified repository to the specified path.
# It also supports cleaning the workspace, including submodules, and persisting credentials.
# If the checkout fails, it will retry up to 3 times.
- checkout: ${{ parameters.repository }}
  path: ${{ parameters.path }}
  clean: ${{ parameters.clean }}
  submodules: ${{ parameters.submodules }}
  persistCredentials: ${{ parameters.persistCredentials }}
  retryCountOnTaskFailure: 3

# This step uses a template to perform a pull and rebase operation on the checked out repository.
# It specifies the working directory and repository to perform the operation on.
- template: ../../tasks/git/pullRebase.yml
  parameters:
    workingDirectory: ${{ parameters.path }}
    repository: ${{ parameters.repository }}
    disablePullRebase: ${{ parameters.disablePullRebase }}