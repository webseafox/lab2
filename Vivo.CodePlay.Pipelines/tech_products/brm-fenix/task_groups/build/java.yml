# This YAML file defines a pipeline for building a Java project. It contains steps for retrieving Azure Key Vault credentials,
# downloading secure files, purging Java dependencies, installing the project, and removing a settings file.

parameters:
# The name of the settings XML file used for Maven configuration.
- name: settingsXmlFile
# The name of the POM file (Project Object Model) for the Java project.
- name: pomFile

steps:
# The filter for retrieving specific secrets from Azure Key Vault.
- template: /tasks/azure_key_vault/get_akv_credentials.yml@CorePipelines
  parameters:
    secretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

# Downloads the secure settings XML file from Azure DevOps secure files.
- template: /tasks/artifacts/download_secure_files.yml@CorePipelines
  parameters:
    name: settingsXmlFile
    secureFile: ${{ parameters.settingsXmlFile }}

# Runs the Maven goal 'dependency:purge-local-repository' to remove all local dependencies.
- template: ../../tasks/maven/goal.yml
  parameters:
    displayName: 'Purge Java Dependencies'
    pomFile: ${{ parameters.pomFile }}
    goal: 'dependency:purge-local-repository'
    options: '-s $(settingsXmlFile.secureFilePath)'

# Runs the Maven goal 'clean install' to build and install the Java project.
- template: ../../tasks/maven/goal.yml
  parameters:
    displayName: 'Install'
    pomFile: ${{ parameters.pomFile }}
    goal: 'clean install'
    options: '-s $(settingsXmlFile.secureFilePath) -DskipTests=true -U'

# Executes a command line task to remove the settings file.
- task: CmdLine@2
  displayName: "Remove settings file $(settingsXmlFile.secureFilePath)"
  inputs:
    script: |
      echo "##[debug] SECRET_VALUES_FILE...........: ${_SECRET_VALUES_FILE}"

      echo "##[command]rm -Rfv ${_SECRET_VALUES_FILE}"
      rm -Rfv ${_SECRET_VALUES_FILE}
  env:
    _SECRET_VALUES_FILE: $(settingsXmlFile.secureFilePath) # Sets the environment variable _SECRET_VALUES_FILE to the path of the settings file.
