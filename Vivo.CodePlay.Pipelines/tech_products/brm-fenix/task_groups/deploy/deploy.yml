# This YAML file defines a deployment pipeline task group for deploying a project.
# It contains parameters, steps, and templates for executing the deployment process.

parameters:
- name: deployCommandsFile # The name of the file containing the deployment commands.
- name: deployLogFile # The name of the log file to store the deployment logs.
- name: applicationName
- name: displayName
  default: 'Deploy'
- name: sshEndpoint

steps:
- script: |
    echo "##[debug] deployCommandsFile.........................................: ${{ parameters.deployCommandsFile }}"
    echo "##[debug] deployLogFile..............................................: ${{ parameters.deployLogFile }}"
    echo "##[debug] applicationName............................................: ${{ parameters.applicationName }}"
    echo "##[debug] displayName................................................: ${{ parameters.displayName }}"
    echo "##[debug] sshEndpoint................................................: ${{ parameters.sshEndpoint }}"

    # Computado aqui (agente local) para estar disponivel como variavel de pipeline
    # antes do SSH — permite interpolacao em templates posteriores via $(DEPLOY_MARKER_FILE)
    MARKER_FILE="/tmp/${{ parameters.applicationName }}_$(Build.SourceBranchName)_$(Build.BuildId)"
    echo "##[debug] deployMarkerFile...........................................: $MARKER_FILE"
    echo "##vso[task.setvariable variable=DEPLOY_MARKER_FILE;]$MARKER_FILE"
  displayName: 'Show Parameters'

- template: ../../tasks/ssh/deploy.yml
  parameters:
    deployCommandsFile: ${{ parameters.deployCommandsFile }}
    deployLogFile: ${{ parameters.deployLogFile }}
    sshEndpoint: ${{ parameters.sshEndpoint }}
    displayName: ${{ parameters.displayName }}
    markerFile: $(DEPLOY_MARKER_FILE)

- template: ../../tasks/bash/create_logs_file.yml
  parameters:
    inputVariableLogs: $(DEPLOY_LOGS) # Passes the 'DEPLOY_LOGS' variable to the template.
    logsFileOutput: $(Agent.BuildDirectory)/${{ parameters.deployLogFile }}.txt # Specifies the output file path for the deployment logs.

- template: ../../task_groups/artifact/publish.yml
  parameters:
    artifactName: ${{ parameters.deployLogFile }} # The name of the artifact to publish.
    targetPath: $(Agent.BuildDirectory)/${{ parameters.deployLogFile }}.txt # The target path for the published artifact.
    isFile: true # Specifies that the artifact is a file.