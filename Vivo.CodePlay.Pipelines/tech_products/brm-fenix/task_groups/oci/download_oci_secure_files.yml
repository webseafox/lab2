parameters:
  - name: ociCliConfigFileName
  - name: ociCliKeyFileName
  - name: condition
    default: succeeded()

steps:
  - task: DownloadSecureFile@1
    name: oci_config_secure_file
    displayName: "Download ${{ parameters.ociCliConfigFileName }} Secure File"
    condition: ${{ parameters.condition }}
    inputs:
      secureFile: ${{ parameters.ociCliConfigFileName }}

  - task: DownloadSecureFile@1
    name: oci_api_key_secure_file
    displayName: "Download ${{ parameters.ociCliKeyFileName }} Secure File"
    condition: ${{ parameters.condition }}
    inputs:
      secureFile: ${{ parameters.ociCliKeyFileName }}
