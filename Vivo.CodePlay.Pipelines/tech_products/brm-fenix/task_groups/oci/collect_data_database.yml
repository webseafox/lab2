parameters:
  - name: action
  - name: environment
  - name: compartmentId
  - name: dbSystemDisplayName
  - name: ociCliFolder
  - name: ociCliFolderPath
  - name: ociCliKeyFile
  - name: ociCliConfigFile
  - name: ociCliConfigFileName
  - name: ociCliKeyFileName
  - name: condition
    default: succeeded()

steps:
  - task: CmdLine@2
    displayName: Collect Data Database Show Parameters
    condition: ${{ parameters.condition }}
    inputs:
      script: |
        echo "##[debug] ACTION .......................................................: ${{ parameters.action }}"
        echo "##[debug] ENVIRONMENT ..................................................: ${{ parameters.environment }}"
        echo "##[debug] COMPARTMENT ID ...............................................: ${{ parameters.compartmentId }}"
        echo "##[debug] DB SYSTEM DISPLAY NAME .......................................: ${{ parameters.dbSystemDisplayName }}"
        echo "##[debug] OCI CLI FOLDER ...............................................: ${{ parameters.ociCliFolder }}"
        echo "##[debug] OCI CLI FOLDER PATH ..........................................: ${{ parameters.ociCliFolderPath }}"
        echo "##[debug] OCI CLI KEY FILE .............................................: ${{ parameters.ociCliKeyFile }}"
        echo "##[debug] OCI CLI CONFIG FILE ..........................................: ${{ parameters.ociCliConfigFile }}"
        echo "##[debug] OCI CLI KEY FILE NAME ........................................: ${{ parameters.ociCliKeyFileName }}"
        echo "##[debug] OCI CLI CONFIG FILE NAME .....................................: ${{ parameters.ociCliConfigFileName }}"
        echo "##[debug] CONDITION ....................................................: ${{ parameters.condition }}"

  - template: ../../task_groups/oci/configure_oci_cli.yml
    parameters:
      ociCliFolderPath: ${{ parameters.ociCliFolderPath }}
      ociCliKeyFile: ${{ parameters.ociCliKeyFile }}
      ociCliConfigFile: ${{ parameters.ociCliConfigFile }}
      ociCliConfigFileName: ${{ parameters.ociCliConfigFileName }}
      ociCliKeyFileName: ${{ parameters.ociCliKeyFileName }}
      condition: ${{ parameters.condition }}

  - template: ../../tasks/oci/get_db_system.yml
    parameters:
      environment: ${{ parameters.environment }}
      compartmentId: ${{ parameters.compartmentId }}
      dbSystemDisplayName: ${{ parameters.dbSystemDisplayName }}
  
  - template: ../../tasks/oci/get_database.yml
    parameters:
      environment: ${{ parameters.environment }}
      compartmentId: ${{ parameters.compartmentId }}
      dbSystemId: $(get_db_system.DB_SYSTEM_ID) 
      dbSystemName: $(get_db_system.DB_SYSTEM_NAME)

  - template: ../../tasks/oci/get_pluggable_databases.yml
    parameters:
      environment: ${{ parameters.environment }}
      databaseId: $(get_database.DATABASE_ID) 
      databaseName: $(get_database.DATABASE_NAME)
  
  - template: ../../tasks/oci/get_db_nodes.yml
    parameters:
      compartmentId: ${{ parameters.compartmentId }}
      environment: ${{ parameters.environment }}
      databaseId: $(get_db_system.DB_SYSTEM_ID)
      databaseName: $(get_db_system.DB_SYSTEM_NAME)
      databaseNodeCount: $(get_db_system.DB_SYSTEM_NODE_COUNT)
      action: ${{ parameters.action }}

  - template: ../../tasks/oci/remove_oci_cli_configuration.yml
    parameters:
      ociCliFolder: ${{ parameters.ociCliFolder }}
      ociCliFolderPath: ${{ parameters.ociCliFolderPath }}
