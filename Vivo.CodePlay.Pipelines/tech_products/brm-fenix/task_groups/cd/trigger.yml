parameters:
- name: pipelineName
- name: branch
- name: params
  type: string
  default: '{}' ## "{\"appVersion\": \"$(VERSION)\"}"
- name: teamProjectId
  type: string
  default: $(System.TeamProjectId)
- name: accessToken
  type: string
  default: $(System.AccessToken)

steps:
- script: |
    echo "##[debug] pipeline Name ..........................................: ${{ parameters.pipelineName }}"
    echo "##[debug] branch .................................................: ${{ parameters.branch }}"
    echo "##[debug] parameters .............................................: ${{ parameters.params }}"
    echo "##[debug] team Project ID ........................................: ${{ parameters.teamProjectId }}"
    echo "##[debug] access Token ...........................................: ***"
  displayName: 'Show Parameters'

- template: ../../tasks/bash/get_pipeline_id.yml
  parameters:
    pipelineName: ${{ parameters.pipelineName }}
    teamProjectId: ${{ parameters.teamProjectId }}
    accessToken: ${{ parameters.accessToken }}

- template: ../../tasks/bash/trigger_pipeline.yml
  parameters:
    pipelineId: $(PIPELINE_ID)
    branch: ${{ parameters.branch }}
    params: ${{ parameters.params }}
    teamProjectId: ${{ parameters.teamProjectId }}
    accessToken: ${{ parameters.accessToken }}