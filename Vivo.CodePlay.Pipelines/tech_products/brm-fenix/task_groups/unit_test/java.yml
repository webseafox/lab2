# This YAML file defines a pipeline for running unit tests on a Java project.

parameters:
- name: settingsXmlFile # The name of the settings.xml file used for Maven configuration.
- name: pomFile # The name of the pom.xml file for the Java project.

steps:
# Filter for the secrets to retrieve from Azure Key Vault.
- template: /tasks/azure_key_vault/get_akv_credentials.yml@CorePipelines
  parameters:
    secretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

# Download the secure settings.xml file from Azure DevOps secure files.
- template: /tasks/artifacts/download_secure_files.yml@CorePipelines
  parameters:
    name: settingsXmlFile
    secureFile: ${{ parameters.settingsXmlFile }}

- template: ../../tasks/maven/goal.yml
  parameters:
    displayName: 'Unit Test'
    pomFile: ${{ parameters.pomFile }}
    goal: 'test'
    options: '-s $(settingsXmlFile.secureFilePath)'
    # Run Maven goal 'test' for the Java project, using the specified pom.xml file and options.

- task: PublishTestResults@2
  displayName: 'Publish JUnit Result'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/TEST-*.xml' 
    publishRunAttachments: false
    # Publish JUnit test results in Azure DevOps.

- task: PublishCodeCoverageResults@2
  displayName: "Publish Code Coverage"
  inputs:
    summaryFileLocation: $(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml
    pathToSources: $(System.DefaultWorkingDirectory)/src/main/java/
    # Publish code coverage results in Azure DevOps.

# Executes a command line task to remove the settings file.
- task: CmdLine@2
  displayName: "Remove settings file $(settingsXmlFile.secureFilePath)"
  inputs:
    script: |
      echo "##[debug] SECRET_VALUES_FILE...........: ${_SECRET_VALUES_FILE}"

      echo "##[command]rm -Rfv ${_SECRET_VALUES_FILE}"
      rm -Rfv ${_SECRET_VALUES_FILE}
  env:
    _SECRET_VALUES_FILE: $(settingsXmlFile.secureFilePath) # Sets the environment variable _SECRET_VALUES_FILE to the path of the settings file.