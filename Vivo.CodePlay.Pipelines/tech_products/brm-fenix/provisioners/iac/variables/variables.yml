parameters:
  - name: config
    type: object
  - name: iacParameters
    type: object

variables:
  - name: APPLICATION_NAME
    value: iac
  - name: POOL
    value: $(AGENT_POOL_CI)
  - name: ENVIRONMENT
    value: "${{ parameters.iacParameters.environment }}"
  - name: IAC_TARGET
    value: "${{ parameters.iacParameters.target }}"
  - name: OPERATION_HOST_ENVIRONMENT
    ${{ if eq(variables['ENVIRONMENT'], 'poc_15') }}:
      value: POC
    ${{ if eq(variables['ENVIRONMENT'], 'dev01_15') }}:
      value: DEV01
    ${{ if eq(variables['ENVIRONMENT'], 'dev02_15') }}:
      value: DEV02
    ${{ if eq(variables['ENVIRONMENT'], 'dev03_15') }}:
      value: DEV03
    ${{ if eq(variables['ENVIRONMENT'], 'qa01_15') }}:
      value: QA1
    ${{ if eq(variables['ENVIRONMENT'], 'qa02_15') }}:
      value: QA2
    ${{ if eq(variables['ENVIRONMENT'], 'bugfix01_15') }}:
      value: BUGFIX
    ${{ if eq(variables['ENVIRONMENT'], 'tpm_15') }}:
      value: TPM
    ${{ if eq(variables['ENVIRONMENT'], 'preprod_15') }}:
      value: PREPROD
    ${{ if eq(variables['ENVIRONMENT'], 'prodlike_15') }}:
      value: PRODLIKE
    ${{ if eq(variables['ENVIRONMENT'], 'master_15') }}:
      value: PROD
  
  - name: ACTION
    value: "${{ parameters.iacParameters.action }}"

  - name: COMMANDS_FILES_OPERATION_HOST_PATH
    ${{ if eq(variables['ENVIRONMENT'], 'bugfix01_15') }}:
      value: /midias/BUGFIX01/iac_commands
    ${{ else }}:
      value: /midias/$(OPERATION_HOST_ENVIRONMENT)/iac_commands
  
  - name: COMMANDS_FILES_ROOT_PATH
    ${{ if eq(parameters.iacParameters.target, 'environment') }}:
      value: $(Agent.BuildDirectory)/source_code/.azuredevops/environment
    ${{ if eq(parameters.iacParameters.target, 'database') }}:
      value: $(Agent.BuildDirectory)/source_code/.azuredevops/database
  
  - name: COMMANDS_FILE
    value: $(COMMANDS_FILES_ROOT_PATH)/commands
  - name: COMMANDS_EXECUTED_LOGS
    value: commands_logs
  - name: COMMANDS_PRE_STOP_FILE
    value: $(COMMANDS_FILES_ROOT_PATH)/commands_pre-stop
  - name: COMMANDS_POST_START_FILE
    value: $(COMMANDS_FILES_ROOT_PATH)/commands_post-start

  - name: BRM_CORE_RELEASE_VERSION
    value: $[ variables[format('BRM_CORE_RELEASE_VERSION_{0}', variables['ENVIRONMENT'])] ]
