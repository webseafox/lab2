              continueOnError: true
              inputs:
                script: |
                  set -euo pipefail

                  ENVIRONMENT="$(echo "$(ENVIRONMENT)" | tr '[:upper:]' '[:lower:]')"
                  TOKEN_URL="https://autenticainthml.redecorp.br/ms_oauth/oauth2/endpoints/vivooauthservice/tokens"
                  HEALTHCHECK_URL="https://brm${ENVIRONMENT}-api.redecorp.oci/bcws/webresources/v1.0/tlf/taxcalc/product/management"
                  RESPONSE_FILE="/tmp/brm_response.json"

                  printf "##[section]Starting BRM functional validation\n"
                  printf "##[debug]Timestamp UTC: %s\n" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  printf "##[section]1/2 - Retrieving access token\n"
                  printf "##[command]curl --silent --show-error --location --request POST '$TOKEN_URL' -H 'Content-Type: application/x-www-form-urlencoded;charset=UTF-8' -H 'Authorization: Basic ***' -d 'grant_type=password&username=SVC_MULESOFT&password=***&scope=ServiceAccount.Profile'\n"

                  TOKEN=$(curl --silent --show-error --location --request POST "$TOKEN_URL" \
                            -H 'Content-Type: application/x-www-form-urlencoded;charset=UTF-8' \
                            -H 'Authorization: Basic $(HEALTHCHECK_ENVIRONMENT_GET_TOKEN_AUTH)' \
                            -d 'grant_type=password&username=SVC_MULESOFT&password=$(HEALTHCHECK_ENVIRONMENT_GET_TOKEN_PASS)&scope=ServiceAccount.Profile')

                  if command -v jq >/dev/null 2>&1; then
                    ACCESS_TOKEN=$(printf "%s" "$TOKEN" | jq -r '.access_token // empty')
                  else
                      printf "##[warning]jq not found. Falling back to grep/cut to extract access_token.\n"
                    ACCESS_TOKEN=$(printf "%s" "$TOKEN" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
                  fi

                  if [ -z "${ACCESS_TOKEN:-}" ]; then
                    printf "##[error]Failed to retrieve access_token\n"
                    exit 1
                  fi

                  printf "##[debug]Access token retrieved successfully (length=%s).\n" "$(printf "%s" "$ACCESS_TOKEN" | wc -c)"

                  printf "##[section]2/2 - BRM health check\n"
                  printf "##[command]curl --silent --show-error --insecure --location '$HEALTHCHECK_URL' --header 'Authorization: Bearer ***' --header 'Accept: application/json' --header 'Content-Type: application/json' --data '[{"classeProduto":"/service/vivo/voz/pabxVirtual","uf":"RJ","idItemCotacao":"0QLQQ00000HT68H4AT","valorBruto":"954.26"}]'\n"

                  HTTP_CODE=$(curl --silent --show-error --insecure --location "$HEALTHCHECK_URL" \
                              --header "Authorization: Bearer $ACCESS_TOKEN" \
                              --header 'Accept: application/json' \
                              --header 'Content-Type: application/json' \
                              --data '[
                                      {
                                        "classeProduto": "/service/vivo/voz/pabxVirtual",
                                        "uf": "RJ",
                                        "idItemCotacao": "0QLQQ00000HT68H4AT",
                                        "valorBruto": "954.26"
                                      }
                                    ]' \
                              --write-out "%{http_code}" \
                              --output "$RESPONSE_FILE")

                  printf "##[debug]Health check HTTP status code: %s\n" "$HTTP_CODE"

                  if [ -s "$RESPONSE_FILE" ]; then
                    printf "##[section]Response body\n"
                    if command -v jq >/dev/null 2>&1; then
                      jq . "$RESPONSE_FILE" 2>/dev/null || cat "$RESPONSE_FILE"
                    else
                      cat "$RESPONSE_FILE"
                    fi
                  else
                    printf "##[warning]Empty response body.\n"
                  fi

                  if [ "$HTTP_CODE" -eq 200 ]; then
                    printf "##[section]Functional analysis OK (HTTP 200).\n"
                  else
                    printf "##[error]Functional analysis failed (HTTP %s).\n" "$HTTP_CODE"
                    exit 1
                  fi

