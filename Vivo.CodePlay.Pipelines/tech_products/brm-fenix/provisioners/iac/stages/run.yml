            - task: CmdLine@2
              name: validate_environment_state
              displayName: "Validate Environment State"
              inputs:
                script: |
                  state="$(get_cluster.CLUSTER_STATE)"
                  action="${{ parameters.iacParameters.action }}"
                  env="${{ parameters.iacParameters.environment }}"
                  nodes="$(get_nodes.NODES)"
                  affected_nodes=$(AFFECTED_NODES)

                  RUNNING_NODES_COUNT=0
                  STOPPED_NODES_COUNT=0

                  echo "##[debug] BRM ENVIRONMENT STATE ................................................: $state"
                  echo "##[debug] ACTION ...............................................................: $action"
                  echo "##[debug] ENVIRONMENT ..........................................................: $env"
                  echo "##[debug] NODES ................................................................: $nodes"
                  echo "##[debug] AFFECTED NODES .......................................................: $affected_nodes"
                  
                  IFS=';' read -ra node_array <<< "$nodes"
                  for node in "${node_array[@]}"; do
                    state=$(echo "$node" | cut -d',' -f4)

                    if [ "$state" == "RUNNING" ]; then
                      RUNNING_NODES_COUNT=$(( RUNNING_NODES_COUNT + 1 ))
                    elif [ "$state" == "STOPPED" ]; then
                      STOPPED_NODES_COUNT=$(( STOPPED_NODES_COUNT + 1 ))
                    fi
                  done

                  if [ "$action" == "START" ]; then
                    echo "##[debug] RUNNING NODES COUNT ..................................................: $RUNNING_NODES_COUNT"
                    echo ""
                    
                    if [ "$RUNNING_NODES_COUNT" -ge "$affected_nodes" ]; then
                      echo "✅ All nodes were started as requested."
                    else
                      echo "❌ Not all nodes were started. Expected: $affected_nodes, Started: $RUNNING_NODES_COUNT"
                      echo "##vso[task.logissue type=error;]Not all nodes were started. Expected: $affected_nodes, Started: $RUNNING_NODES_COUNT"
                      echo "##vso[task.complete result=Failed;]"
                    fi
                  elif [ "$action" == "STOP" ]; then
                    echo "##[debug] STOPPED NODES COUNT ..................................................: $STOPPED_NODES_COUNT"
                    echo ""

                    if [ "$STOPPED_NODES_COUNT" -ge "$affected_nodes" ]; then
                      echo "✅ All nodes were stopped as requested."
                    else
                      echo "❌ Not all nodes were stopped. Expected: $affected_nodes, Stopped: $STOPPED_NODES_COUNT"
                      echo "##vso[task.logissue type=error;]Not all nodes were stopped. Expected: $affected_nodes, Stopped: $STOPPED_NODES_COUNT"
                      echo "##vso[task.complete result=Failed;]"
                    fi
                  fi

