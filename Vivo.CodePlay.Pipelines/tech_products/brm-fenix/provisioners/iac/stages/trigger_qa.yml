parameters:
  - name: iacParameters
    type: object

stages:
  - stage: stage_trigger_qa
    displayName: "Trigger the QA pipeline"
    pool: $(POOL)
    dependsOn:
      - stage_prep
      - stage_run
    condition: |
      and(
        eq(variables['DISABLE_IAC_TRIGGER_QA_PIPELINE'], 'false'),
        in(dependencies.stage_prep.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.stage_run.result, 'Succeeded', 'SucceededWithIssues')
      )
    jobs:
      - job: triggerPipeline
        displayName: "Trigger Pipeline"
        steps:
          - checkout: none
          - template: ../../../task_groups/cd/trigger.yml
            parameters:
              pipelineName: "$(QA_PIPELINE_NAME)"
              branch: "$(QA_BRANCH)"
              params: "$(QA_PARAMS)"
              teamProjectId: $(QA_PROJECT_ID)
              accessToken: "$(QA_ACCESS_TOKEN)"
