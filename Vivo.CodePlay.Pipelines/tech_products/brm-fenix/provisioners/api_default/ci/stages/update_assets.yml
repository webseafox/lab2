# This YAML file defines the stage for creating a release tag after a successful CD deploy.

parameters:
  - name: config
    type: object
  - name: flow
    type: object

stages:
  # The 'update_assets' stage creates a release tag in Azure Repos after a successful deploy on master_15.
  - stage: update_assets
    displayName: "Update Assets"
    pool: $(POOL)
    dependsOn:
      - stage_prep
      - stage_deploy
    condition: |
      and(
        eq(variables['Build.SourceBranchName'], 'master_15'),
        ne(variables['TECHNOLOGY'], 'onlyHelmUpdate'),
        ne(variables['APPLICATION_NAME'], 'bi-publisher-reports'),
        in(dependencies.stage_prep.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.stage_deploy.result, 'Succeeded', 'SucceededWithIssues')
      )
    variables:
      - name: VERSION
        value: $[ stageDependencies.stage_prep.version.outputs['version.VERSION'] ]
    jobs:
      - job: tag
        displayName: "Create Tag in Azure Repos"
        condition: |
          and(
            ne(variables['TECHNOLOGY'], 'onlyHelmUpdate'),
            ne(variables['TECHNOLOGY'], 'helmCharts')
          )
        steps:
          - checkout: none
          - template: ../../../../tasks/bash/approval_details.yml
            parameters:
              withEnvironmentApproval: true
          - template: ../../../../task_groups/git/tag_release.yml
            parameters:
              version: $(VERSION)
              artifactName: source_with_shared_files
              repository: $(Agent.BuildDirectory)/source_code
              deployApprovalComment: $(details.DEPLOY_APPROVAL_COMMENT)
