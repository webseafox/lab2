stages:
  - stage: trigger_cd
    displayName: "Trigger the CD pipeline"
    pool: $(POOL)
    dependsOn:
      - stage_prep
      - stage_build_test
      - stage_static_code_analysis
      - stage_code_security_analysis
      - stage_bundle
    condition: |
      or(
        eq(variables['TRIGGER_CD'], True),
        and(
          eq(variables['TRIGGER_CD'], False),
          ne(variables['Build.Reason'], 'Manual'),
          eq(variables['STAGE_SECURITY_ONLY'], False),
          not(in(variables['Build.SourceBranchName'], 'master_15')),
          in(dependencies.stage_prep.result, 'Succeeded', 'SucceededWithIssues'),
          in(dependencies.stage_build_test.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
          in(dependencies.stage_static_code_analysis.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
          in(dependencies.stage_code_security_analysis.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
          in(dependencies.stage_bundle.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
        )
      )
    variables:
      - name: CD_PIPELINE_NAME
        value: "$(APPLICATION_NAME)_cd"
    jobs:
      - job: triggerPipeline
        displayName: "Trigger Pipeline"
        steps:
          - checkout: none
          - template: ../../../../task_groups/cd/trigger.yml
            parameters:
              pipelineName: $(CD_PIPELINE_NAME)
              branch: $(Build.SourceBranchName)
