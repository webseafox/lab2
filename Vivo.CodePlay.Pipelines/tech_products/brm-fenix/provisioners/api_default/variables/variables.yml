# This YAML file contains the variables and parameters used in the provisioning process for the API default environment of the BRM Fenix project.

# The configuration object that contains the parameters for the provisioning process.
parameters:
  - name: config
    type: object
  - name: flow
    type: object

variables:
  - name: FLOW
    value: "${{ parameters.flow.flow }}"
  - name: POOL
    ${{ if eq(parameters.flow.flow, 'CI') }}:
      value: $(AGENT_POOL_CI)
    ${{ if eq(parameters.flow.flow, 'CD') }}:
      value: $(AGENT_POOL_CD)
  # The 'TECHNOLOGY' variable is used to store the value of the 'technology' property in the 'config' parameter.
  - name: TECHNOLOGY
    value: "${{ parameters.config.technology }}"
  - name: BRM_CORE_RELEASE_VERSION
    value: $[ variables[format('BRM_CORE_RELEASE_VERSION_{0}', variables['ENVIRONMENT'])] ]
  # Indicates whether the provisioning process should only include the security stage.
  - name: STAGE_SECURITY_ONLY
    value: "${{ parameters.config.stageSecurityOnly }}"
  - name: AZURE_ENVIRONMENT
    value: deploy-$(ENVIRONMENT)
  - name: TRIGGER_CD
    value: "${{ parameters.flow.triggerCD }}"
  # Determines the environment based on the source branch name. If the source branch is 'master_15', the environment is set to 'prod'. Otherwise, it is set to the source branch name.
  # The name of the application being provisioned.
  - name: APPLICATION_NAME
    value: "${{ parameters.config.applicationParameters.applicationName }}"
  # The current version of the application, derived from the application name and environment.
  - name: CURRENT_VERSION
    value: $[ format('$({0})', replace(upper(format('{0}_{1}', variables['APPLICATION_NAME'], variables['ENVIRONMENT'])),'-','_')) ]
  # The file name of the Helm chart for the environment.
  - name: HELM_CHART_FILE
    value: $[ format('{0}.{1}', variables['ENVIRONMENT'], 'yaml') ]
  # The key used to retrieve the Helm chart version.
  - name: HELM_CHART_VERSION_KEY
    value: "${{ parameters.config.applicationParameters.helmChartVersionKey }}"
  # The name of the container image for the application.
  - name: CONTAINER_IMAGE_NAME
    value: "${{ parameters.config.applicationParameters.containerImageName }}"
  # The build arguments for the application.
  - name: BUILD_ARGS
    value: "${{ parameters.config.applicationParameters.buildArgs }}"
  # Indicates whether the environment is a controlled environment.
  # Determines the operation host environment based on the source branch name.
  - name: OPERATION_HOST_ENVIRONMENT
    ${{ if eq(variables['Build.SourceBranchName'], 'poc_15') }}:
      value: POC
    ${{ if eq(variables['Build.SourceBranchName'], 'dev01_15') }}:
      value: DEV01
    ${{ if eq(variables['Build.SourceBranchName'], 'dev02_15') }}:
      value: DEV02
    ${{ if eq(variables['Build.SourceBranchName'], 'dev03_15') }}:
      value: DEV03
    ${{ if eq(variables['Build.SourceBranchName'], 'qa01_15') }}:
      value: QA01
    ${{ if eq(variables['Build.SourceBranchName'], 'qa02_15') }}:
      value: QA02
    ${{ if eq(variables['Build.SourceBranchName'], 'bugfix01_15') }}:
      value: BUGFIX01
    ${{ if eq(variables['Build.SourceBranchName'], 'tpm_15') }}:
      value: TPM
    ${{ if eq(variables['Build.SourceBranchName'], 'preprod_15') }}:
      value: PREPROD
    ${{ if eq(variables['Build.SourceBranchName'], 'prodlike_15') }}:
      value: PRODLIKE
    ${{ if eq(variables['Build.SourceBranchName'], 'master_15') }}:
      value: PROD
  # The file name of the Helm chart for the operation host environment.
  - name: HELM_CHART_FILE
    ${{ if eq(variables['Build.SourceBranchName'], 'master_15') }}:
      value: prod.yaml
    ${{ else }}:
      value: $(Build.SourceBranchName).yaml
  - name: OPERATION_HOST_HELM_PATH
    value: $[ variables[format('OPERATION_HOST_HELM_PATH_BRM_{0}', variables['BRM_CORE_RELEASE_VERSION'])] ]
  - name: OPERATION_HOST_COMMANDS_PATH
    value: "$(OPERATION_HOST_HELM_PATH)/commands"
  # Variable to store the prefix for the PDC export file name.
  # The value is generated using the format '{0}_{1}_{2:ddMMyyyyHHmmss}', where:
  # - {0} is the value of the 'ENVIRONMENT' variable
  # - {1} is the value of the 'Build.BuildNumber' variable
  # - {2:ddMMyyyyHHmmss} is the current date and time in the format 'ddMMyyyyHHmmss'
  - name: PDC_EXPORT_FILE_NAME_PREFIX
    value: $[ format('{0}_{1}_{2:ddMMyyyyHHmmss}', variables['ENVIRONMENT'], variables['Build.BuildNumber'], pipeline.startTime) ]
  # Variable to store the target folder for the PDC export.
  # The value is constructed using the 'OPERATION_HOST_HELM_PATH' variable and the 'PDC_EXPORT_FILE_NAME_PREFIX' variable.
  - name: PDC_EXPORT_TARGET_FOLDER
    value: "$(OPERATION_HOST_HELM_PATH)/BACKUP-PDC-XML/$(PDC_EXPORT_FILE_NAME_PREFIX)"
  # Variable to store the file path for the import/export XML commands file.
  # The value is constructed using the 'Agent.BuildDirectory' variable and the path '.azuredevops/import_export_xml_commands'.
  - name: PDC_IMPORT_EXPORT_XML_COMMANDS_FILE
    value: $(Agent.BuildDirectory)/source_code/.azuredevops/import_export_xml_commands  
  # Indicates the script to be used for deploying BC BCWS, named deploy_bc_bcws.sh.
  - name: BC_BCWS_DEPLOY_SCRIPT
    value: deploy_bc_bcws.sh
  # Dynamically sets the script mode based on the application name parameter.
  - name: SCRIPT_MODE
    value: "${{ parameters.config.applicationParameters.applicationName }}"
  # Constructs the BRM release name using a formatted string that includes the environment variable.
  - name: IS_BIP_ENVIRONMENTS
    value: $[ contains(variables['BIP_ENVIRONMENTS'], variables['ENVIRONMENT']) ]
  - name: BIP_BASE_PATH
    ${{ if in(variables['Build.SourceBranchName'], 'poc_15', 'dev01_15') }}:
      value: /opt/web/domains/WLS_BiPublisher_DEV
    ${{ if in(variables['Build.SourceBranchName'], 'qa01_15', 'qa02_15', 'preprod_15', 'prodlike_15') }}:
      value: /opt/web/domains/WLS_BiPublisher_QA
    ${{ if eq(variables['Build.SourceBranchName'], 'master_15') }}:
      value: /opt/web/domains/WLS_BiPublisher_PROD
  - name: BIP_SCRIPT_SERVER_PATH
    value: $[ format('{0}/{1}', variables['BIP_BASE_PATH'], 'bin') ]
  - name: BIP_COMMANDS_PATH
    value: "cd_deploy/commands"
  - name: BIP_MIGRATION_FILES_PATH
    value: "cd_deploy/migration_files"
  - name: BIP_TMP_MIGRATIONS_FILES
    value: $[ format('{0}_{1}', '/tmp/bip_migration_files', variables['Build.BuildNumber']) ]
  - name: BIP_BRM_REPORTS_BACKUP_FOLDER
    value: "BUILDS_BACKUP"
  - name: BIP_BRM_REPORTS_BACKUP_FOLDER_PATH
    value: $[ format('{0}/{1}/{2}', variables['BIP_BASE_PATH'], 'bidata/components/bipublisher/repository/Reports', variables['BIP_BRM_REPORTS_BACKUP_FOLDER']) ]
  - name: BIP_MIGRATION_FILES_TARGET_PATH
    value: $[ format('{0}/{1}', variables['BIP_BASE_PATH'], 'bidata/components/bipublisher/repository/Reports/BRM_Reports') ]
  - name: HELM_RELEASE_TO_VALIDATION
    value: "${{ replace(parameters.config.applicationParameters.helmReleaseNames, ',', '|') }}"
  - name: APPLICATION_POD
    value: "${{ parameters.config.applicationParameters.container }}"
  - name: AZURE_ENVIRONMENT
    value: deploy-$(ENVIRONMENT)
  # Variable to store the file path for the deploy commands file.
  # The value is constructed using the 'Agent.BuildDirectory' variable and the path '.azuredevops/deploy_commands'.
  - name: DEPLOY_COMMANDS_FILE
    value: $(Agent.BuildDirectory)/source_code/.azuredevops/deploy_commands
  - name: JAVA_VERSION
    value: $[ variables[format('JAVA_VERSION_BRM_{0}', variables['BRM_CORE_RELEASE_VERSION'])] ]  
  
  # Verifica se o branch de origem está na lista de branches com análise de segurança desabilitada.
  # O valor de DISABLE_STAGE_CODE_SECURITY_ANALYSIS é uma lista separada por vírgulas (ex: "qa01_15,qa02_15").
  # O uso de format(',{0},') garante que não haja falsos positivos em correspondências parciais.
  # - name: DISABLE_STAGE_CODE_SECURITY_ANALYSIS
  #   value: $[ contains(format(',{0},', replace(variables['DISABLE_STAGE_CODE_SECURITY_ANALYSIS_V2'], ' ', '')), format(',{0},', variables['Build.SourceBranchName'])) ]
  # - name: DISABLE_SCA_SCAN
  #   value: $[ contains(format(',{0},', replace(variables['DISABLE_SCA_SCAN_V2'], ' ', '')), format(',{0},', variables['Build.SourceBranchName'])) ]