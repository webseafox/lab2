# This YAML file defines the parameters and variables used in the provisioning process for the BRM-Fenix API.

parameters:
  # The 'config' parameter is used to pass configuration data to the provisioning process.
  - name: config # The 'config' parameter is used to pass configuration data to the provisioning process.
    type: object
  - name: flow
    type: object

variables:
  # This imports variables from the 'BRM_TOGGLE_FEATURES' variable group.
  - group: BRM_TOGGLE_FEATURES

  - name: ENVIRONMENT
    ${{ if eq(variables['Build.SourceBranchName'], 'poc_15') }}:
      value: poc
    ${{ if eq(variables['Build.SourceBranchName'], 'dev01_15') }}:
      value: dev01
    ${{ if eq(variables['Build.SourceBranchName'], 'dev02_15') }}:
      value: dev02
    ${{ if eq(variables['Build.SourceBranchName'], 'dev03_15') }}:
      value: dev03
    ${{ if eq(variables['Build.SourceBranchName'], 'qa01_15') }}:
      value: qa01
    ${{ if eq(variables['Build.SourceBranchName'], 'qa02_15') }}:
      value: qa02
    ${{ if eq(variables['Build.SourceBranchName'], 'bugfix01_15') }}:
      value: bugfix01
    ${{ if eq(variables['Build.SourceBranchName'], 'tpm_15') }}:
      value: tpm
    ${{ if eq(variables['Build.SourceBranchName'], 'preprod_15') }}:
      value: preprod
    ${{ if eq(variables['Build.SourceBranchName'], 'prodlike_15') }}:
      value: prodlike
    ${{ if eq(variables['Build.SourceBranchName'], 'master_15') }}:
      value: prod

  # The 'variables.yml' template is included to define additional variables used in the provisioning process.
  # The 'config' parameter is passed to the template to provide configuration data.
  - template: variables.yml
    parameters:
      config: ${{ parameters.config }}
      flow: ${{ parameters.flow }}

  - name: VERSION
    value: $(BRM_CORE_RELEASE_VERSION)

  # This YAML file contains the variable "BRM_PDC_MODE" which is conditionally defined based on the value of the "applicationName" parameter. If the value of the "applicationName" parameter is equal to "pricing-design-center", then the "BRM_PDC_MODE" variable is included in the group. This variable is used for provisioning the API default configuration in the BRM Fenix project.
  - ${{ if eq(parameters.config.applicationParameters.applicationName, 'pricing-design-center') }}:
      - group: BRM_PDC_MODE

  # The 'BRM_ECE_MODE' variable group contains variables related to the ECE (Elastic Charging Engine) mode used in the provisioning process.
  - ${{ if eq(parameters.config.applicationParameters.applicationName, 'elastic-charging-engine') }}:
      - group: BRM_ECE_MODE

  # The 'BRM_BIP_MODE' variable group contains variables related to the BIP (bi-publisher-reports) mode used in the provisioning process.
  - ${{ if eq(parameters.config.applicationParameters.applicationName, 'bi-publisher-reports') }}:
      - group: BRM_BIP_MODE
