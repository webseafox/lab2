parameters:
  - name: config
    type: object
  - name: oracleBaseImageUpdate
    type: object

variables:
  - template: ../../global/variables/load.yml
  - template: variables/load.yml
    parameters:
      oracleBaseImageUpdate: ${{ parameters.oracleBaseImageUpdate }}

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines
    - repository: CodePlay
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CodePlay

stages:
  - template: stages/preparation.yml
    parameters:
      oracleBaseImageUpdate: ${{ parameters.oracleBaseImageUpdate }}
  - template: stages/download.yml
    parameters:
      oracleBaseImageUpdate: ${{ parameters.oracleBaseImageUpdate }}
  - template: stages/process.yml
    parameters:
      oracleBaseImageUpdate: ${{ parameters.oracleBaseImageUpdate }}
  - template: stages/security_analysis.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion
  - template: stages/publish.yml
  - template: stages/finish.yml
