parameters:
  - name: oracleBaseImageUpdate
    type: object

variables:
  - name: POOL
    value: $(AGENT_POOL_CI)

  - name: ORACLE_IMAGE_LINK
    value: "${{ parameters.oracleBaseImageUpdate.oracleImageLink }}"
  - name: PUSH_PATH_ACR
    value: "${{ parameters.oracleBaseImageUpdate.pathACR }}"
  - name: IMAGE_CUSTOM_TAG
    ${{ if eq(parameters.oracleBaseImageUpdate.oracleImageLink, '-') }}:
      value: "${{ parameters.oracleBaseImageUpdate.customTag }}"
    ${{ if ne(parameters.oracleBaseImageUpdate.oracleImageLink, '-') }}:
      value: "-"

  - name: VALID_EXTENSIONS
    value: "tar,tar.gz"
  - name: IMAGES_FOLDER_IN_REPOSITORY
    value: images-to-push-ACR

  - name: DOWNLOADED_COMPACTED_IMAGES_FOLDER
    value: downloaded_compacted_images
  - name: DOWNLOADED_COMPACTED_IMAGES_FOLDER_PATH
    value: "$(Pipeline.Workspace)/$(DOWNLOADED_COMPACTED_IMAGES_FOLDER)"

  - name: TAR_IMAGES_FOLDER
    value: tar_images
  - name: TAR_IMAGES_FOLDER_PATH
    value: "$(Pipeline.Workspace)/$(TAR_IMAGES_FOLDER)"

  - name: SOURCE_CODE_FOLDER
    value: source_code
  - name: SOURCE_CODE_FOLDER_PATH
    value: "$(Pipeline.Workspace)/$(SOURCE_CODE_FOLDER)"
