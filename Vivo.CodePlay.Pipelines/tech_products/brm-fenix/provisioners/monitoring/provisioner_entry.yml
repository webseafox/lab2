parameters:
  - name: config
    type: object
  - name: monitoringParameters
    type: object

variables:
  - template: ../../global/variables/load.yml
  - template: variables/load.yml

resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

stages:
  - template: stages/run.yml
    parameters:
      monitoringParameters: ${{ parameters.monitoringParameters }}
