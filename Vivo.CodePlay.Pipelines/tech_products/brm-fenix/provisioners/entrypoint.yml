# ==========================================================================================
# BRM Fenix Provisioner Entrypoint Pipeline
#
# Description:
#   This pipeline serves as the entrypoint for provisioning operations in BRM Fenix. It defines
#   the main parameters and conditional logic to extend specific provisioning templates based on
#   the selected model and build reason. The pipeline supports multiple provisioning flows such as
#   API default, Oracle base image update, and BRM shutdown actions.
#                  
# Parameters:
#   - config: Main configuration object for the provisioner logic. Includes model, technology,
#     and application-specific settings.
#   - flow: Object for CD flow control, managing deployment flow and parameters.
#   - oracleBaseImageUpdate: Parameters for Oracle base image update operations.
#   - turnOff: Parameters for BRM shutdown actions.
#
# Extends Logic:
#   - If triggered by a Pull Request, extends the PR-specific template for the selected model.
#   - Otherwise, extends the default template for the selected model.
#   - Passes relevant parameters to the extended template based on the modelName.
#
# Usage Example:
#   - To provision using the API default model:
#       config:
#         modelName: "api_default"
#         technology: "java"
#         applicationParameters:
#           applicationName: "brm-app"
#       flow:
#         flow: "main"
#         triggerCD: true
#
# Best Practices:
#   - Keep parameter objects updated and documented.
#   - Use conditional logic to select the correct template for each provisioning scenario.
#   - Review extended templates for environment-specific logic and variables.
# ==========================================================================================

parameters:
  - name: config
    type: object
    default:
      stageSecurityOnly: False
      modelName: ""
      technology: ""
      applicationParameters:
        applicationName: ""
        helmCharts: ""
        helmChartVersionKey: ""
        containerImageName: ""
        buildArgs: ""
        container: ""
        helmReleaseNames: ""
  - name: flow
    type: object
    default:
      flow: ""
      triggerCD: false
      cd_params:
        forceDeployment: false
  - name: oracleBaseImageUpdate
    type: object
    default:
      oracleImageLink: ""
      pathACR: ""
      customTag: ""
  - name: iacParameters
    type: object
    default:
      target: ""
      action: ""
      environment: ""
      numberAffectedNodes: ""
      pipelineFlow: ""
  - name: monitoringParameters
    type: object
    default:
      environmentsMonitoring: ""
      environmentsObservability: ""

extends:
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: ${{ parameters.config.modelName }}/provisioner_entry_pr.yml
  ${{ else }}:
    template: ${{ parameters.config.modelName }}/provisioner_entry.yml
  parameters:
    config: ${{ parameters.config }}

    ${{ if eq(parameters.config.modelName, 'api_default') }}:
      flow: ${{ parameters.flow }}

    ${{ if eq(parameters.config.modelName, 'oracle_base_image') }}:
      oracleBaseImageUpdate: ${{ parameters.oracleBaseImageUpdate }}

    ${{ if eq(parameters.config.modelName, 'iac') }}:
      iacParameters: ${{ parameters.iacParameters }}

    ${{ if eq(parameters.config.modelName, 'monitoring') }}:
      monitoringParameters: ${{ parameters.monitoringParameters }}
