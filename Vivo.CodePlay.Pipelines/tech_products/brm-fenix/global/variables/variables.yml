# This YAML file contains the parameters and variables used in the pipeline.

parameters:
  - name: environment
    type: string
  - name: iacParameters
    type: object

variables:
  # The repository for the container image in the Azure Container Registry.
  - name: ACR_BRM_REPOSITORY
    value: "$(DOCKER_ACR_REGISTRY)/fnix/"

  - name: DOCKER_SERVICE_CONNECTION # PARA USO NO DOCKER LOAD DO STAGE DE SEGURANÇA (SCA)
    value: $[ variables['DOCKER_ACR_REGISTRY_SERVICE_CONNECTION_NAME'] ]

  - name: IAC_OCI_COMPARTMENT_ID
    ${{ if or(in(parameters.iacParameters.environment, 'poc', 'dev01', 'dev02', 'dev03'), in(parameters.environment, 'poc', 'dev01', 'dev02', 'dev03')) }}:
      value: $(COMPARTMENT_ID_DEV)
    ${{ if or(in(parameters.iacParameters.environment, 'qa01', 'qa02', 'bugfix01', 'prodlike', 'preprod', 'tpm'), in(parameters.environment, 'qa01', 'qa02', 'bugfix01', 'prodlike', 'preprod', 'tpm')) }}:
      value: $(COMPARTMENT_ID_TEST)

  - name: OCI_CLI_FOLDER
    value: ".oci_fenix"
  - name: OCI_CLI_FOLDER_PATH
    value: "$(Agent.HomeDirectory)/$(OCI_CLI_FOLDER)"

  - name: OCI_CLI_CONFIG_FILE_NAME
    value: "oci_config_brm_fenix"
  - name: OCI_CLI_CONFIG_FILE_PATH
    value: "$(OCI_CLI_FOLDER_PATH)/$(OCI_CLI_CONFIG_FILE_NAME)"
  
  - name: OCI_CLI_CONFIG_FILE # CONFIGURA A VARIAVEL DE AMBIENTE QUE APONTA PARA O ARQUIVO DE CONFIG QUE SERA USADO PELA CLI NA VERSÃO 3.65.1
    value: $(OCI_CLI_CONFIG_FILE_PATH)
  - name: OCI_CLI_RC_FILE # CONFIGURA A VARIAVEL DE AMBIENTE QUE APONTA PARA O ARQUIVO DE CONFIG QUE SERA USADO PELA CLI NA VERSÃO 3.71.0
    value: $(OCI_CLI_CONFIG_FILE_PATH)
  
  - name: PYTHONWARNINGS # SUPRIMIR AVISOS DE PYTHON
    value: "ignore"

  - name: OCI_CLI_KEY_FILE_NAME
    value: "oci_api_key_brm_fenix.pem"
  - name: OCI_CLI_KEY_FILE
    value: "$(OCI_CLI_FOLDER_PATH)/$(OCI_CLI_KEY_FILE_NAME)"

  - name: IAC_DB_SYSTEM_DISPLAY_NAME
    ${{ if or(in(parameters.iacParameters.environment, 'poc', 'dev01', 'dev02', 'dev03'), in(parameters.environment, 'poc', 'dev01', 'dev02', 'dev03')) }}:
      value: $(DATABASE_SYSTEM_DISPLAY_NAME_DEV)
    ${{ if or(in(parameters.iacParameters.environment, 'qa01', 'qa02', 'bugfix01', 'prodlike', 'preprod', 'tpm'), in(parameters.environment, 'qa01', 'qa02', 'bugfix01', 'prodlike', 'preprod', 'tpm')) }}:
      value: $(DATABASE_SYSTEM_DISPLAY_NAME_TEST)