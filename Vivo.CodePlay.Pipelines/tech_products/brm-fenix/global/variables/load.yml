# This YAML file defines the parameters and variables used in the pipeline.

parameters:
  - name: environment
    type: string
    default: ""
  - name: iacParameters
    type: object
    default:
      target: ""
      action: ""
      environment: ""
      numberAffectedNodes: ""

variables:
  - template: /global/variables/pipeline.yml@CorePipelines

  - group: BRM_VARIABLES
  - group: BRM_IAC_VARIABLES
  - group: BRM_CORE_RELEASE_VERSION

  - template: variables.yml
    parameters:
      environment: ${{ parameters.environment }}
      iacParameters: ${{ parameters.iacParameters }}
