# ==============================================================================
# Arquivo: azure-pipeline.yml
# Descrição: Pipeline de monitoramento dos ambientes do BRM Fenix. Este arquivo
# agenda execuções periódicas, define o repositório de origem, e estende um
# template de provisionamento para monitorar múltiplos ambientes.
# ==============================================================================

schedules:
  - cron: "*/10 7-22 * * *"
    displayName: Monitoring Environments (Every 10 minutes from 7:00 to 22:59)
    always: true
    branches:
      include:
        - master_15
  - cron: "*/30 23 * * *"
    displayName: Monitoring Environments (Every 30 minutes at 23:xx)
    always: true
    branches:
      include:
        - master_15
  - cron: "*/30 0-6 * * *"
    displayName: Monitoring Environments (Every 30 minutes from 0:00 to 6:59)
    always: true
    branches:
      include:
        - master_15

trigger: none

resources:
  repositories:
    - repository: CodePlayPipelines
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/tags/brm/latest_monitoring
      endpoint: CodePlay

extends:
  template: tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines
  parameters:
    config:
      modelName: monitoring
    monitoringParameters:
      environmentsMonitoring: poc_15,dev01_15,dev02_15,dev03_15,qa01_15,qa02_15,bugfix01_15,tpm_15,preprod_15,prodlike_15
      environmentsObservability: poc_15,qa01_15,qa02_15,preprod_15,prodlike_15
