# ==============================================================================
# Arquivo: azure-pipeline.yml
# Descrição: Pipeline para provisionamento da imagem base Oracle no BRM Fenix.
# Permite parametrização do link da imagem, pasta no ACR e tag customizada.
# ==============================================================================

# Parâmetro para informar o link da imagem Oracle
parameters:
  - name: oracleImageLink
    displayName: Oracle Image Link
    type: string
    default: "-"
  # Parâmetro para informar a pasta no ACR
  - name: pathACR
    displayName: Folder in ACR
    type: string
    default: "-"
  # Parâmetro para informar uma TAG customizada
  - name: customTag
    displayName: Custom TAG (only single image in Branch)
    type: string
    default: "-"

# Desabilita o gatilho automático do pipeline
trigger: none

# Define o repositório de origem para o pipeline
resources:
  repositories:
    - repository: CodePlayPipelines
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/tags/brm/latest
      endpoint: CodePlay

# Estende o template de provisionamento, passando parâmetros de configuração
extends:
  template: tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines
  parameters:
    config:
      modelName: oracle_base_image
      oracleImageLink: ${{ parameters.oracleImageLink }}
      pathACR: ${{ parameters.pathACR }}
      customTag: ${{ parameters.customTag }}
