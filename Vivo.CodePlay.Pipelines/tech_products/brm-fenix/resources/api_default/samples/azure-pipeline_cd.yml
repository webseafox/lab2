# Documentação do Pipeline CD
# Este arquivo descreve o funcionamento do pipeline CD definido em `azure-pipeline_cd.yml`.
# ## Parâmetros
# - **appVersion**: Versão a ser implantada (Exemplo: 1.2.3). Padrão: "LATEST".
# - **forceDeployment**: Força a implantação mesmo se a versão já estiver implantada. (booleano, padrão: false)
# ## Gatilho (trigger)
# - O pipeline não possui gatilho automático (`trigger: none`). Deve ser iniciado manualmente ou por outro pipeline.
# ## Recursos
# - Repositório externo: `DevOps/Vivo.CodePlay.Pipelines` (tag: brm/latest).
# ## Extensão de Template
# - Utiliza o template: `tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines`.
# - Parâmetros principais:
#   - **config**:
#     - modelName: api_default
#     - technology: C
#     - applicationParameters:
#       - applicationName: config-jobs
#       - helmCharts: package-oc-cn-helm-chart
#       - helmReleaseNames: brm15-core
#       - container: config-jobs
#       - containerImageName: config_jobs_tlf
#   - **flow**:
#     - flow: CD
#     - cd_params:
#       - appVersion: versão a ser implantada
#       - forceDeployment: força implantação da mesma versão
# ## Fluxo Resumido
# 1. O pipeline é iniciado manualmente ou por outro pipeline.
# 2. Os parâmetros controlam a versão e o comportamento da implantação.
# 3. O template externo define os jobs e tarefas detalhadas do CD.
# ## Observações
# - Para customizar o pipeline, altere os parâmetros no início do arquivo.
# - O template referenciado pode conter lógica adicional para validação, deploy, rollback e pós-deploy.
# ---
# Última atualização: 31/07/2025

parameters:
  - name: appVersion
    type: string
    displayName: "Version to be deployed (Ex.: 1.2.3)"
    default: "LATEST"
  - name: forceDeployment
    displayName: Force Deployment with Same Version
    type: boolean
    default: false

trigger: none

resources:
  repositories:
    - repository: CodePlayPipelines
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/tags/brm/latest
      endpoint: CodePlay

extends:
  template: tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines
  parameters:
    config:
      modelName: api_default
      technology: C
      applicationParameters:
        applicationName: config-jobs
        helmCharts: package-oc-cn-helm-chart
        helmChartVersionKey: .ocbrm.config_jobs.deployment.imageTag
        helmReleaseNames: brm15-core
        container: config-jobs
        containerImageName: config_jobs_tlf
    flow:
      flow: CD
      cd_params:
        appVersion: ${{ parameters.appVersion }}
        forceDeployment: ${{ parameters.forceDeployment }}
