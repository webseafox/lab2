# Documentação do Pipeline CI
# Este arquivo descreve o funcionamento do pipeline CI definido em `azure-pipeline_ci.yml`.
# ## Parâmetros
# - **stageSecurityOnly**: Executa apenas o estágio de segurança. (booleano, padrão: false)
# - **triggerCD**: Dispara o pipeline de CD ao final do CI. (booleano, padrão: false)
# ## Gatilho (trigger)
# - Executa em branches: poc_15, dev01_15, dev02_15, dev03_15, qa01_15, qa02_15, bugfix01_15, tpm_15, preprod_15, prodlike_15, master_15.
# - Ignora alterações em `.azuredevops/*` e `.vsts/*`.
# - Executa em modo batch.
# ## Recursos
# - Repositório externo: `DevOps/Vivo.CodePlay.Pipelines` (tag: brm/latest).
# ## Extensão de Template
# - Utiliza o template: `tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines`.
# - Parâmetros principais:
#   - **config**:
#     - stageSecurityOnly: controla execução do estágio de segurança.
#     - modelName: api_default
#     - technology: C
#     - applicationParameters:
#       - applicationName: config-jobs
#       - helmCharts: package-oc-cn-helm-chart
#       - helmChartVersionKey: .ocbrm.config_jobs.deployment.imageTag
#       - containerImageName: config_jobs_tlf
#       - buildArgs: "--build-arg REGISTRY=$(ACR_BRM_REPOSITORY)"
#   - **flow**:
#     - flow: CI
#     - triggerCD: controla disparo do pipeline CD.
# ## Fluxo Resumido
# 1. O pipeline é disparado por alterações nas branches configuradas.
# 2. Os parâmetros controlam execução de estágios e disparo do CD.
# 3. O template externo define os jobs e tarefas detalhadas do CI.
# ## Observações
# - Para customizar o pipeline, altere os parâmetros no início do arquivo.
# - O template referenciado pode conter lógica adicional para build, testes, validação e publicação.
# ---
# Última atualização: 31/07/2025

parameters:
  - name: stageSecurityOnly
    displayName: Stage Security Only
    type: boolean
    default: false
  - name: triggerCD
    displayName: Trigger the CD Pipeline
    type: boolean
    default: false

trigger:
  batch: true
  paths:
    exclude:
    - .azuredevops/*
    - .vsts/*
  branches:
    include:
    - poc_15
    - dev01_15
    - dev02_15
    - dev03_15
    - qa01_15
    - qa02_15
    - bugfix01_15
    - tpm_15
    - preprod_15
    - prodlike_15
    - master_15

resources:
  repositories:
    - repository: CodePlayPipelines
      name: DevOps/Vivo.CodePlay.Pipelines
      type: git
      ref: refs/tags/brm/latest
      endpoint: CodePlay

extends:
  template: tech_products/brm-fenix/provisioners/entrypoint.yml@CodePlayPipelines
  parameters:
    config:
      stageSecurityOnly: ${{ parameters.stageSecurityOnly }}
      modelName: api_default
      technology: C
      applicationParameters:
        applicationName: config-jobs
        helmCharts: package-oc-cn-helm-chart
        helmChartVersionKey: .ocbrm.config_jobs.deployment.imageTag
        containerImageName: config_jobs_tlf
        buildArgs: "--build-arg REGISTRY=$(ACR_BRM_REPOSITORY)"
    flow:
      flow: CI
      triggerCD: ${{ parameters.triggerCD }}
