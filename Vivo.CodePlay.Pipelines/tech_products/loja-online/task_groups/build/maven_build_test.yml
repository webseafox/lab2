parameters:
- name: newVersion
  default: ""

steps:
- template: /tasks/maven/custom_settings_setup.yml
  parameters:
    mavenSettingsLocationOutputVarName: "MAVEN_SETTINGS_LOCATION"

- template: /tasks/maven/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tasks/maven/build_with_docker.yml
  parameters:
    mavenSettingsLocation: $(MAVEN_SETTINGS_LOCATION)

- template: /tech_products/loja-online/tasks/artifacts/publish_app.yml