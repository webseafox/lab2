parameters:
- name: cmdBuildTest
  default: $(CMD_BUILD_TEST)
- name: artifactPublishEnable
  default: true
- name: artifactPublishName
  default: app
- name: dockerWorkDir
  type: string
  default: $(DOCKER_WORKDIR)
- name: newVersion
  default: ""

steps:
- template: /tech_products/loja-online/tasks/nodejs/setup_credentials.yml

- template: /tech_products/loja-online/tasks/nodejs/update_build_version.yml
  parameters:
    newVersion: ${{ parameters.newVersion }}
    condition: eq(variables.BUMP_VERSION_ENABLED, true)

- template: /tech_products/loja-online/tasks/nodejs/build_with_docker.yml
  parameters:
    dockerWorkDir: ${{ parameters.dockerWorkDir}}
    cmdBuildTest: ${{ parameters.cmdBuildTest }}

- ${{ if eq(parameters.artifactPublishEnable, true) }}:
  - template: /tech_products/loja-online/tasks/artifacts/publish_app.yml
    parameters:
      artifactPublishName: ${{ parameters.artifactPublishName }}