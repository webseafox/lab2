steps:
- template: /tech_products/loja-online/tasks/docker/docker_image_build.yml.yml

- template: /tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'clearCheckSums'
    taskName: 't_clear_checksums'
    displayName: 'Clear CheckSums'
    condition: and(succeeded(), eq(variables['CLEAR_CHECKSUM'], 'true'))

- template: /tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'validate'
    taskName: 't_validate_changelogs'
    displayName: 'Validade Changelogs'

- template: /tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: "snapshot"
    taskName: 't_snapshot_database'
    displayName: 'Snapshot Database'
    condition: and(succeeded(), eq(variables.ENABLE_SNAPSHOT_COMPARE, true) )

- template: /tech_products/loja-online/tasks/artifacts/publish_db.yml

- template: /tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'futureRollbackSQL'
    taskName: 't_generate_sql_rollback_script'
    displayName: 'Generate SQL Rollback Script'
    condition: and(eq(variables.ENABLE_ROLLBACK, 'true'), succeeded() )
    extraAttributes: '-Dliquibase.outputFile=rollback.sql'

- template: /tech_products/loja-online/tasks/artifacts/publish_pipeline.yml
  parameters:
    displayName: 'Publish SQL Rollback Script'
    targetPath: rollback.sql
    artifactName: rollback_sql_scripts
    condition: and(eq(variables.ENABLE_ROLLBACK, 'true'), succeeded() )

- template: /tasks/liquibase/run_liquibase_maven_goal.yml
  parameters:
    goal: 'updateSQL'
    taskName: 't_generate_sql_deploy_script'
    displayName: 'Generate SQL Deploy Script'
    extraAttributes: '-Dliquibase.migrationSqlOutputFile=migrate.sql'
    continueOnError: 'true'

- template: /tech_products/loja-online/tasks/artifacts/publish_pipeline.yml
  parameters:
    displayName: 'Publish SQL Deploy Script'
    targetPath: 'migrate.sql'
    artifactName: deploy_sql_scripts