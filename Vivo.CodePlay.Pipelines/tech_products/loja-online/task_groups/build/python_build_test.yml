parameters:
- name: pythonVersion
  type: string

steps:
- template: /tasks/python/lint_with_make_and_docker.yml
  parameters:
    pythonVersion: ${{ parameters.pythonVersion }}

- template: /tasks/python/tests_with_make_and_docker.yml
  parameters:
    pythonVersion: ${{ parameters.pythonVersion }}

- template: /tech_products/loja-online/tasks/artifacts/publish_app.yml
  parameters:
    contents: |
      **/*
      !.git/**/*
      !?/**/*
      !**/*.log
      !.venv/**/*
