steps:
- template: /tech_products/loja-online/tasks/bash/welcome.yml
  parameters:
    message: $(DB_DEPLOY_SUCCESS_MSG)

- template: /tech_products/loja-online/tasks/bash/add_azure_pipeline_tag.yml.yml
  parameters:
    displayName: 'Add Pipeline Tag'
    tagName: '$(System.StageName)-$(environment)=succeeded'

- template: /tasks/maven/update_repo_version.yml
  parameters:
    newVersion: "$(DB_NEW_VERSION)"
    condition: and( eq(variables.BUMP_VERSION_ENABLED, true), ne(variables.DB_NEW_VERSION, variables.DB_CURRENT_VERSION) )

- ${{ if and(not( and( notIn(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(parameters.environment, 'dev'))), not(and(eq(parameters.environment, 'dev'), notIn(variables['Build.SourceBranchName'], 'main', 'master'))))}}:
  - template: /tech_products/loja-online/tasks/git/tag.yml
    ${{if eq(parameters.environment, 'dev')}}:
      parameters:
        staticTagName: "$(DB_NEW_VERSION)"
    ${{else}}:
      parameters:
        staticTagName: ${{parameters.environment}}
