parameters:
- name: environment
- name: azureServiceConnectionEnabled
- name: kubernetesServiceConnectionEnabled
- name: kubeconfig

steps:
- template: /tech_products/loja-online/tasks/docker/export_k8s_namespace.yml
  parameters:
    environment: ${{ parameters.environment }}
    variableNameOut: "K8S_NAMESPACE"

- ${{ if or(eq(parameters.azureServiceConnectionEnabled, true), eq(parameters.kubernetesServiceConnectionEnabled, true)) }}:
  - ${{ if eq(parameters.azureServiceConnectionEnabled, true) }}:
    - template: /tasks/kubectl/login_azurerm.yml
      parameters:
        serviceConnection: "$(azureServiceConnectionPrefix)-$(serviceConnectionDeploySuffix)"
        azureResourceGroup: "$(azureResourceGroupPrefix)-$(serviceConnectionDeploySuffix)"
        kubernetesCluster: "$(azureKubernetesClusterPrefix)-$(serviceConnectionDeploySuffix)"

  - ${{ elseif eq(parameters.kubernetesServiceConnectionEnabled, true) }}:
    - template: /tasks/kubectl/login_kubernetes.yml
      parameters:
        serviceConnection: "$(kubernetesServiceConnectionPrefix)-$(serviceConnectionDeploySuffix)"

  - template: /tasks/kubectl/argorollouts_rollback.yml
    parameters:
      appName: "$(APP_NAME)"
      appNamespace: "$(K8S_NAMESPACE)"
  - template: /tasks/kubectl/argorollouts_promote.yml
    parameters:
      appName: "$(APP_NAME)"
      appNamespace: "$(K8S_NAMESPACE)"

- ${{ else }}:
  - template: /tech_products/loja-online/tasks/artifacts/download_secure_files.yml
    parameters:
      secureFile: '${{parameters.kubeconfig}}'
  - template: /tasks/kubectl/argorollouts_rollback_with_kubeconfig.yml
    parameters:
      appName: "$(APP_NAME)"
      appNamespace: "$(K8S_NAMESPACE)"
      k8sKubeconfig: $(secureFile.secureFilePath)
  - template: /tasks/kubectl/argorollouts_promote_with_kubeconfig.yml
    parameters:
      appName: "$(APP_NAME)"
      appNamespace: "$(K8S_NAMESPACE)"
      k8sKubeconfig: $(secureFile.secureFilePath)