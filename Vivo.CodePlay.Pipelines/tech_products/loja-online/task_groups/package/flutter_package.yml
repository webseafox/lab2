parameters:
- name: target
  values:
  - 'apk'
  - 'ios'

- name: iosProvProfileSecureFile
  type: string
  default: ''

steps:
- ${{ if eq(parameters.target, 'apk') }}:
  - template: /tasks/flutter/setup_package_apk.yml

  - task: FlutterBuild@0
    displayName: "Build application"
    inputs:
      target: 'apk'
      projectDirectory: '$(Build.SourcesDirectory)'

  - template: /tech_products/loja-online/tasks/artifacts/copy_to_staging.yml
    parameters:
      contents: '**/release/*.apk'

- ${{ if eq(parameters.target, 'ios') }}:
  - template: /tasks/flutter/setup_package_ios.yml
    parameters:
      iosProvProfileSecureFile: ${{ parameters.iosProvProfileSecureFile }}

  - task: FlutterBuild@0
    displayName: "Build application"
    inputs:
      target: 'ios'
      projectDirectory: '$(Build.SourcesDirectory)'
      buildName: '$(Build.BuildNumber)'
      iosCodesign: false

  - task: Xcode@5
    displayName: "Manual signing"
    inputs:
      actions: 'build archive'
      signingOption: 'manual'
      signingIdentity: '$(APPLE_CERTIFICATE_SIGNING_IDENTITY)'
      provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
      sdk: 'iphoneos'
      scheme: 'Runner'
      packageApp: true
      exportPath: '$(Build.SourcesDirectory)/ios/deploy/Runner.ipa'
      args: '-verbose'
  
  - template: /tech_products/loja-online/tasks/artifacts/copy_to_staging.yml
    parameters:
      contents: '**/Runner.ipa/myappios.ipa'

- template: /tech_products/loja-online/tasks/artifacts/publish_pipeline.yml
  parameters:
    artifactName: '${{ parameters.target }}_package'