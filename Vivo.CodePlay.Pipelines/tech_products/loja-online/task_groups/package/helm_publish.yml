parameters:
- name: chartNewVersion
  default: ""

steps:
- template: /tech_products/loja-online/tasks/helm/extract_chart_info.yml
- template: /tech_products/loja-online/tasks/helm/installer.yml
- template: /tech_products/loja-online/tasks/helm/package.yml
  parameters:
    chartNewVersion: ${{ parameters.chartNewVersion }}
- template: /tech_products/loja-online/tasks/helm/registry_login.yml
- template: /tech_products/loja-online/tasks/helm/publish_registry_acr.yml
  parameters:
      chartNewVersion: ${{ parameters.chartNewVersion }}
- template: /tech_products/loja-online/tasks/helm/publish_registry_nexus.yml
  parameters:
    chartNewVersion: ${{ parameters.chartNewVersion }}
- template: /tech_products/loja-online/tasks/telemetry/telemetry.yml