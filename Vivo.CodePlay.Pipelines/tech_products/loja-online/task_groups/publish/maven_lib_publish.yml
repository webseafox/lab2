parameters:
  - name: mavenSettingsLocation
    type: string
    default: $(DEFAULT_MAVEN_SETTINGS)

steps:
- template: /tech_products/loja-online/tasks/artifacts/download_app.yml

- template: /tasks/maven/publish_to_nexus.yml
  parameters:
    artifactDir: "$(DEFAULT_WORKDIR_ARTIFACTS)"
    publishCondition: ne(variables['AZURE_ARTIFACTS_PUBLISH_ENABLE'], 'true')
    mavenSettingsLocation: ${{ parameters.mavenSettingsLocation }}

- template: /tasks/maven/publish_to_azure_artifacts.yml
  parameters:
    artifactDir: "$(DEFAULT_WORKDIR_ARTIFACTS)"
    publishCondition: eq(variables['AZURE_ARTIFACTS_PUBLISH_ENABLE'], 'true')
    mavenSettingsLocation: ${{ parameters.mavenSettingsLocation }}

