parameters:
- name: run_component_test
  type: boolean
- name: dev_namespace_to_deploy
  type: string
  default: ''
- name: environment
- name: microserviceName
  default: $(MICROSERVICE_NAME)
  type: string

stages:
- stage: package
  dependsOn:
  - security
  - gate  
  - build_test
  - ${{ if eq(parameters.run_component_test, True)}}:
    - component_test
  displayName: "Package & Publish"
  pool: $(GENERAL_PURPOSE_CI_AGENT)
  jobs:
  - job: "Package"
    condition: or(
                and(
                  always(),
                  eq(variables.flowIsTagging, false),
                  eq(variables.flowIsMain, true)
                ),
                or(
                  eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                  eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                  eq(variables['Build.Reason'], 'PullRequest'), 
                  and(
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/'), 
                    ${{ ne(parameters.dev_namespace_to_deploy, '') }}
                  )
                )
            )
    displayName: "Package"
    variables:
      - name: APP_VERSION
        value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
    steps:
    - template: /tech_products/loja-online/tasks/catalog_info/extract_variables.yml
      parameters:
        workingDirectory: $(Build.SourcesDirectory)
    - template: /tech_products/loja-online/task_groups/package/docker_package.yml
      parameters:
        environment: ${{ parameters.environment }}
        microserviceName: ${{ parameters.microserviceName }}
    - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
      - template: /tech_products/loja-online/tasks/nodejs/update_repo_version.yml
        parameters:
          newVersion: "$(APP_VERSION)"
          condition: eq(variables.BUMP_VERSION_ENABLED, true)