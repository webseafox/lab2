parameters:
- name: config # Pipeline configuration object
  type: object
  default:
    pipelineType: ci # i.e. ci, cd

extends:
  # PULL REQUEST
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    template: /tech_products/loja-online/provisioners/api_default/provisioner_entry_pr.yml
  ${{ else }}:
    ${{ if eq(parameters.config.pipelineType, 'ci') }}:
      template: /tech_products/loja-online/provisioners/api_default/ci/provisioner_entry.yml
    ${{ elseif eq(parameters.config.pipelineType, 'cd') }}:
      template: /tech_products/loja-online/provisioners/api_default/cd/provisioner_entry.yml
  parameters: 
    ${{ if parameters.config.params }}:
      ${{ parameters.config.params }}