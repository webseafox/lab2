parameters:
- name: pythonVersion
  type: string
- name: currentVersion
  type: string
- name: newVersion
  type: string
  default: ""
- name: incrementLevel
  default: patch

steps:
- bash: |
    echo "newversion: ${NEW_VERSION}"

    cat << EOF > lib-package.sh
    #!/bin/bash
    echo "##[debug]Iniciando processo de empacotamento da library através do container..."
    
    echo "##[debug]Criando ambiente virtual python..."
    make virtualenv

    echo "##[debug]Ativando ambiente virtual python..."
    source .venv/bin/activate

    if [ -n "${NEW_VERSION}" ]; then
      echo "##[debug]BumpVersion ativo. A versão '${NEW_VERSION}' será usada no processo de empacotamento"

      echo "##[debug]Atualizando versão da library..."
      bumpversion --current-version ${CURRENT_VERSION} --new-version ${NEW_VERSION} ${INCREMENT_LEVEL} setup.py
    fi

    echo "##[debug]Instalando/Restaurando dependências da library..."
    make install
    
    echo "##[debug]Instalando wheel library..."
    pip install wheel

    echo "##[debug]Criando o pacote da library..."
    make build
    EOF
  displayName: Create Package Script
  env:
    CURRENT_VERSION: "${{ parameters.currentVersion }}"
    NEW_VERSION: "${{ parameters.newVersion }}"
    INCREMENT_LEVEL: ${{ parameters.incrementLevel }}

- template: /tasks/python/run_bash_on_docker.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    scriptNameOrCmd: "bash lib-package.sh"
    displayName: Build and Package