parameters:
- name: appCenterServiceConnection
  default: $(APP_CENTER_DEFAULT_SERVICE_CONNECTION)
- name: appSlugIOS
  type: string
- name: releaseNotesInput
  type: string

steps:
- template: /tech_products/loja-online/tasks/artifacts/download_pipeline.yml
  parameters:
    artifactName: 'ios_package'
    targetPath: '$(DEFAULT_WORKDIR_ARTIFACTS)'

- task: AppCenterDistribute@3
  inputs:
    serverEndpoint: ${{ parameters.appCenterServiceConnection }}
    appSlug: ${{ parameters.appSlugIOS }}
    appFile: '$(DEFAULT_WORKDIR_ARTIFACTS)/**/Runner.ipa/*.ipa'
    symbolsOption: 'Apple'
    releaseNotesOption: 'input'
    releaseNotesInput: ${{ parameters.releaseNotesInput }}
  env:
    HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
    HTTP_PROXY: $(PROXY_AGENT_HTTP)
    NO_PROXY: $(PROXY_AGENT_NO_PROXY)
