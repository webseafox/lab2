parameters:
- name: pythonVersion
  type: string
- name: excludePaths
  default: ""

steps:
- bash: |
    cat << EOF > lint.sh
    #!/bin/bash
    echo "##[debug]Iniciando processo de lint no código fonte"

    echo "##[debug]Criando ambiente virtual python..."
    python -m venv .venv

    echo "##[debug]Ativando ambiente virtual python..."
    source .venv/bin/activate

    echo "##[debug]Instalando o pacote 'flake8'..."
    pip install flake8

    echo "##[debug]Configurando exclusões..."
    CMD_LINT="pflake"
    if [ -n "${EXCLUDE_PATHS}" ]; then
      echo "##[debug]Excluindo o(s) seguinte(s) caminho(s): ${EXCLUDE_PATHS}"
      CMD_LINT="${CMD_LINT} --exclude ${EXCLUDE_PATHS}"
    fi

    echo "##[debug]Executando lint com a ferramenta 'flake8'..."
    eval $CMD_LINT
    EOF
  displayName: Create Lint Script
  env:
    EXCLUDE_PATHS: ${{ parameters.excludePaths }}

- template: /tasks/python/run_bash_on_docker.yml
  parameters:
    pythonVersion: "${{ parameters.pythonVersion }}"
    scriptNameOrCmd: "bash lint.sh"
    displayName: Running Lint
