parameters:
- name: deviceHostname
- name: deviceIp
- name: credentialUsername
- name: credentialPassword
- name: credentialType
- name: credentialAutomaticChange
- name: credentialChangePlugin
- name: credentialChangeTemplate
- name: credentialUseOwnCredentialToConnect
- name: credentialRDP
  default: false
- name: credentialSSH
  default: false
- name: tags

steps:
- task: PythonScript@0
  displayName: '[PAM] Create Credential'
  inputs:
    scriptSource: inline
    script: |
      import requests
      import os
            
      base_url = os.getenv('SENHA_SEGURA_BASE_URL')
      access_token = os.getenv('ACCESS_TOKEN')
      device_hostname = os.getenv('DEVICE_HOSTNAME')
      device_ip = os.getenv('DEVICE_IP')
      credential_username = os.getenv('CREDENTIAL_USERNAME')
      credential_password = os.getenv('CREDENTIAL_PASSWORD')
      credential_type = os.getenv('CREDENTIAL_TYPE')
      credential_automatic_change = os.getenv('CREDENTIAL_AUTOMATIC_CHANGE')
      credential_change_plugin = os.getenv('CREDENTIAL_CHANGE_PLUGIN')
      credential_change_template = os.getenv('CREDENTIAL_CHANGE_TEMPLATE')
      credential_use_own_credential_to_connect = os.getenv('CREDENTIAL_USE_OWN_CREDENTIAL_TO_CONNECT')
      credential_rdp = os.getenv('CREDENTIAL_RDP')
      credential_ssh = os.getenv('CREDENTIAL_SSH')
      tags = os.getenv('TAGS')

      def create_credential():
        url = base_url + '/iso/pam/credential'
        body = {
          'hostname': device_hostname,
          'ip': device_ip,
          'username': credential_username,
          'content': credential_password,
          'additional': 'Created by Azure DevOps Pipeline',
          'credential_type': credential_type,
          'tags': tags,
          'execution_settings': {
            'automatic_change': credential_automatic_change,
            'change_plugin': credential_change_plugin,
            'change_template': credential_change_template,
            'use_own_credential_to_connect': credential_use_own_credential_to_connect,
          },
          'session_settings': {
            'RDP': credential_rdp,
            'SSH': credential_ssh
          }
        }

        print('##[command] POST {} - Criar Credencial'.format(url))
        print('##[debug] device_hostname....................................: ', device_hostname)
        print('##[debug] device_ip..........................................: ', device_ip)
        print('##[debug] credential_username................................: ', credential_username)
        print('##[debug] credential_type....................................: ', credential_type)
        print('##[debug] credential_automatic_change........................: ', credential_automatic_change)
        print('##[debug] credential_change_plugin...........................: ', credential_change_plugin)
        print('##[debug] credential_change_template.........................: ', credential_change_template)
        print('##[debug] credential_use_own_credential_to_connect...........: ', credential_use_own_credential_to_connect)
        print('##[debug] credential_rdp.....................................: ', credential_rdp)
        print('##[debug] credential_ssh.....................................: ', credential_ssh)
        print('##[debug] tags...............................................: ', tags)
        response = requests.post(
          url,
          headers = {
            'Authorization': 'Bearer ' + access_token,
            'Content-Type': 'application/json'
          },
          json = body,
          verify = False
        )
        response_json = response.json()
        print('##[debug] response_json......................................: ', response_json)

        response_code = response_json['response']['status']
        if (response_code != 200) and (response_code != 201):
          raise Exception('##[error] Erro ao criar/atualizar credential. Verifique a documentação https://docs.senhasegura.io/v3-32/docs/pt/a2a-pam-core-create-or-update-a-credential')

        return response_json

      create_credential()
  env:
    SENHA_SEGURA_BASE_URL: $(SENHA_SEGURA_BASE_URL)
    ACCESS_TOKEN: $(SENHA_SEGURA_ACCESS_TOKEN)
    DEVICE_HOSTNAME: ${{ parameters.deviceHostname }}
    DEVICE_IP: ${{ parameters.deviceIp }}
    CREDENTIAL_USERNAME: ${{ parameters.credentialUsername }}
    CREDENTIAL_PASSWORD: ${{ parameters.credentialPassword }}
    CREDENTIAL_TYPE: ${{ parameters.credentialType }}
    CREDENTIAL_AUTOMATIC_CHANGE: ${{ parameters.credentialAutomaticChange }}
    CREDENTIAL_CHANGE_PLUGIN: ${{ parameters.credentialChangePlugin }}
    CREDENTIAL_CHANGE_TEMPLATE: ${{ parameters.credentialChangeTemplate }}
    CREDENTIAL_USE_OWN_CREDENTIAL_TO_CONNECT: ${{ parameters.credentialUseOwnCredentialToConnect }}
    CREDENTIAL_RDP: ${{ parameters.credentialRDP }}
    CREDENTIAL_SSH: ${{ parameters.credentialSSH }}
    TAGS: ${{ parameters.tags }}