parameters:
- name: staticTagName
- name: condition
  type: object
  default: []

steps:
- task: jabbera.git-tag-on-release-task.git-tag-on-release-task.git-tag-on-release-task@9
  retryCountOnTaskFailure: 3
  displayName: "Git tag with version"
  inputs:
    staticTagName: ${{parameters.staticTagName}}
  ${{ if ne(length(parameters.condition),0) }}:
    condition: ${{ parameters.condition }}
  