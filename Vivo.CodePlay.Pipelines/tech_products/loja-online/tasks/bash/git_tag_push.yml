parameters:
- name: tagName
- name: tagMessage
  default: "Automatically generated tag"

steps:
- script: |
    git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
    git config --global user.name "Azure DevOps"
    git fetch --prune --tags
    git tag -d ${TAG_NAME}
    git tag -a ${TAG_NAME} -m "${TAG_MESSAGE}"
    git push -f origin ${TAG_NAME}
  displayName: 'Create and push tag ${{ parameters.tagName }}'
  env:
    TAG_NAME: ${{ parameters.tagName }}
    TAG_MESSAGE: ${{ parameters.tagMessage }}

