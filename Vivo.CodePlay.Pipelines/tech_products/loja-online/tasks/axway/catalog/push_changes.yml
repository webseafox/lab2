parameters:
- name: commitMessage
  default: "feat: Update Catalog [skip ci]"

steps:
- script: |
    set -e

    git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
    git config --global user.name "Azure DevOps"

    git stash save ${CATALOG_FILE_NAME}

    echo "##[command] git checkout ${BUILD_SOURCEBRANCHNAME} --"
    git fetch
    git checkout ${BUILD_SOURCEBRANCHNAME} --
    git pull -r
    git stash pop

    echo "##[command] git add --all"
    git add --all

    echo "##[command] git diff"
    git diff

    echo "##[command] git commit"
    git commit -m "${COMMIT_MESSAGE}"

    echo "##[command] git push origin ${BUILD_SOURCEBRANCHNAME}"
    git push origin ${BUILD_SOURCEBRANCHNAME}
  displayName: 'Git push Catalog'
  workingDirectory: $(Build.SourcesDirectory)
  condition: and(succeeded(), eq(variables.updateCatalog, 'Yes'))
  env:
    CATALOG_FILE_NAME: $(CATALOG_FILE_NAME)
    COMMIT_MESSAGE: ${{ parameters.commitMessage }}