parameters:
- name: applicationID
- name: apiID

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] APPLICATION_ID...........: ${APPLICATION_ID}"
    echo "##[debug] API_ID...................: ${API_ID}"

    echo "##[command] POST /applications/${APPLICATION_ID}/apis"
    HTTP_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" "${API_MANAGER_BASE_URL}/applications/${APPLICATION_ID}/apis" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --header 'content-type: application/json' \
    --data '{ 
      "apiId": "'${API_ID}'", 
      "enabled": true 
    }')

    if [[ "${HTTP_CODE}" = "200" || "${HTTP_CODE}" = "201" ]]; then
      echo "##[debug] API Subscription Done, http_code '${HTTP_CODE}'."
      echo "##vso[task.complete result=Succeeded;]"
    elif [[ "${HTTP_CODE}" = "409" ]]; then
      echo "##[debug] HTTP_CODE................: ${HTTP_CODE}"
      echo "##vso[task.logissue type=warning;] API already subscribed."
      echo "##vso[task.complete result=SucceededWithIssues;]"
    else
      echo "##vso[task.logissue type=error;] API Subscription response http_code '${HTTP_CODE}'."
      echo "##vso[task.complete result=Failed;]"
    fi
  displayName: Subscribe API
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    APPLICATION_ID: ${{ parameters.applicationID }}
    API_ID: ${{ parameters.apiID }}