parameters:
- name: apiOrganizationID
- name: datFileLocation

steps:
- script: |
    echo "##[debug] API_MANAGER_BASE_URL.....: ${API_MANAGER_BASE_URL}"
    echo "##[debug] API_ORGANIZATION_ID......: ${API_ORGANIZATION_ID}"
    echo "##[debug] DAT_FILE_LOCATION........: ${DAT_FILE_LOCATION}"

    echo "##[command] POST /proxies/import"
    curl -s -i -k --fail -X POST "${API_MANAGER_BASE_URL}/proxies/import" \
    --user "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
    --form "file=@${DAT_FILE_LOCATION}" \
    --form "organizationId=${API_ORGANIZATION_ID}" \
    --form "password=${DAT_FILE_PASSWORD}"
  displayName: Import .dat to API Manager
  continueOnError: false
  env:
    API_MANAGER_BASE_URL: $(API_MANAGER_BASE_URL)
    ADMIN_USERNAME: $(ADMIN_USERNAME)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    API_ORGANIZATION_ID: ${{ parameters.apiOrganizationID }}
    DAT_FILE_LOCATION: ${{ parameters.datFileLocation }}
    DAT_FILE_PASSWORD: $(DAT_FILE_PASSWORD)