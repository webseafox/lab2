parameters:
- name: buildApiVersion
- name: parameterApiVersion

steps:
- script: |
    echo "##[debug] PARAMETER_API_VERSION..........: ${PARAMETER_API_VERSION}"
    echo "##[debug] BUILD_API_VERSION..............: ${BUILD_API_VERSION}"

    if [[ ! -z "${PARAMETER_API_VERSION}" ]]; then
      echo "##[warning] API_VERSION set with Pipeline Parameter value."
      echo "##vso[task.setvariable variable=API_VERSION;]${PARAMETER_API_VERSION}"
      echo "##vso[task.complete result=Succeeded;]"
    elif [[ ! -z "${BUILD_API_VERSION}" ]]; then
      echo "##[warning] API_VERSION set with Build & Package value."
      echo "##vso[task.setvariable variable=API_VERSION;]${BUILD_API_VERSION}"
      echo "##vso[task.complete result=Succeeded;]"
    else
      echo "##vso[task.logissue type=error;] Invalid API_VERSION"
      echo "##vso[task.complete result=Failed;]"
    fi
  displayName: Set deploy API_VERSION
  env:
    PARAMETER_API_VERSION: ${{ parameters.parameterApiVersion }}
    BUILD_API_VERSION: ${{ parameters.buildApiVersion }}