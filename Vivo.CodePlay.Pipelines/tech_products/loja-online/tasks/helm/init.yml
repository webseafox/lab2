parameters:
- name: environment
- name: workdir
  default: $(Build.SourcesDirectory)

steps:
- script: |
    setVariables(){
      eval result=$2
      echo "##vso[task.setvariable variable=$1;]$result"
    }

    DOCKER_OUTPUT="$(cat $(DEFAULT_WORKDIR_DOCKER_ARTIFACTS)/docker.json)"
    echo $DOCKER_OUTPUT | jq .

    setVariables "K8S_NAMESPACE" "$(echo $DOCKER_OUTPUT | jq -r '.K8S_NAMESPACE')"

    HELM_RELEASE_NAME="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_APP')"
    echo "##vso[task.setvariable variable=HELM_RELEASE_NAME;]$HELM_RELEASE_NAME"
    
    HELM_IMAGE_REPOSITORY="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_IMAGE_NAME_FULL')"
    echo "##vso[task.setvariable variable=HELM_IMAGE_REPOSITORY;]$HELM_IMAGE_REPOSITORY"
    
    HELM_IMAGE_TAG="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_IMAGE_TAG')"
    echo "##vso[task.setvariable variable=HELM_IMAGE_TAG;]$HELM_IMAGE_TAG"
    
    REGISTRY_NAME="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_REGISTRY')"
    echo "##vso[task.setvariable variable=REGISTRY_NAME;]$REGISTRY_NAME"

    APP_VERSION="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_APP_VERSION')"
    echo "##vso[task.setvariable variable=APP_VERSION;]$APP_VERSION"
    
    DOCKER_IMAGE_NAME="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_IMAGE_NAME')"
    echo "##vso[task.setvariable variable=DOCKER_IMAGE_NAME;]$DOCKER_IMAGE_NAME"

  displayName: "Set output variables"
  workingDirectory: "${{ parameters.workdir }}"