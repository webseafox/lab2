parameters:
- name: playbookLocation
  default: $(ansiblePlaybookLocation)
- name: vmIp
- name: vmHostname
- name: vmAdminUsername
- name: vmAdminPassword
- name: domainUsername
  default: ''
- name: domainPassword
  default: ''
- name: svc_sscs_password
  default: ''
- name: unix_root_password
  default: ''
- name: windows_spt8486f_password
  default: ''

steps:
- task: ms-vscs-rm.vss-services-ansible.ansible-task.Ansible@0
  inputs:
    playbookPathOnAgentMachine: ${{ parameters.playbookLocation }}
    failOnStdErr: false
    inventoriesAgentMachine: inlineContent
    inventoryInlineContentAgentMachine: |
      [hosts]
      ${{ parameters.vmIp }}

      [hosts:vars]
      hostname=${{ parameters.vmHostname }}
      ansible_user=${{ parameters.vmAdminUsername }}
      ansible_ssh_pass=${{ parameters.vmAdminPassword }}
      ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      svc_sscs_password=${{ parameters.svc_sscs_password }}

      ansible_winrm_server_cert_validation=ignore
      domain_user=${{ parameters.domainUsername }}
      domain_password=${{ parameters.domainPassword }}
      windows_spt8486f_password=${WINDOWS_SPT8486F_PASSWORD}

      unix_root_password=${{ parameters.unix_root_password }}
  displayName: Ansible Playbook VM
  env:
    ANSIBLE_VERBOSITY: $(ANSIBLE_VERBOSITY)