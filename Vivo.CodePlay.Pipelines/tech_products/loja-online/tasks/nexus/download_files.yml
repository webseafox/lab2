parameters:
- name: displayName
  default: "Download from Nexus"
- name: repository
- name: remoteFileLocation
  type: object
- name: localFileLocation
  default: $(Agent.TempDirectory)
- name: credentialsEnabled
  default: true

steps:
- ${{ if eq(parameters.credentialsEnabled, true) }}:
  - task: AzureKeyVault@2
    displayName: Get Nexus credentials
    inputs:
      azureSubscription: DevOpsSharedResources
      KeyVaultName: $(AKV_DEVOPS_NAME)
      SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

- ${{ each file in parameters.remoteFileLocation }}:
  - script: |
      echo "##[debug] URL......................: ${URL}"
      echo "##[debug] REPOSITORY...............: ${REPOSITORY}"
      echo "##[debug] LOCAL_FILE_LOCATION......: ${LOCAL_FILE_LOCATION}"
      echo "##[debug] REMOTE_FILE_LOCATION.....: ${REMOTE_FILE_LOCATION}"
      echo "##[command] wget download file"
      wget --content-on-error --user ${USERNAME} --password ${PASSWORD} "${URL}/${REPOSITORY}/${REMOTE_FILE_LOCATION}"
    displayName: ${{ parameters.displayName }} - ${{ file }}
    workingDirectory: $(Agent.TempDirectory)
    env:
      URL: $(NEXUS_REPOSITORY_URL)
      REPOSITORY: ${{ parameters.repository }}
      LOCAL_FILE_LOCATION: ${{ parameters.localFileLocation }}
      REMOTE_FILE_LOCATION: ${{ file }}
      USERNAME: $(NEXUS-DEFAULT-USR)
      PASSWORD: $(NEXUS-DEFAULT-PSW)
