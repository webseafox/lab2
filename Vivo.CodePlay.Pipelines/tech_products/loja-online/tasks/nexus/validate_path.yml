parameters:
- name: displayName
  default: "Validate Nexus path existence"
- name: repository
- name: remoteFileLocation
- name: credentialsEnabled
  default: true

steps:
- ${{ if eq(parameters.credentialsEnabled, true) }}:
  - task: AzureKeyVault@2
    displayName: Get Nexus credentials
    inputs:    
      azureSubscription: DevOpsSharedResources    
      KeyVaultName: $(AKV_DEVOPS_NAME)
      SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'

- script: |
    echo "##[debug] URL......................: ${URL}"
    echo "##[debug] REPOSITORY...............: ${REPOSITORY}"
    echo "##[debug] REMOTE_FILE_LOCATION.....: ${REMOTE_FILE_LOCATION}"

    echo "##[command] GET path"
    HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u ${USERNAME}:${PASSWORD} "${URL}/${REPOSITORY}/${REMOTE_FILE_LOCATION}")

    if [[ "${HTTP_STATUS}" == "200" ]]; then
      echo "##vso[task.logissue type=error] Artifact already exists on Nexus."
      echo "##vso[task.complete result=Failed;]"
      exit
    fi

    echo "##[section] Artifact path is valid on Nexus and can be used."
  displayName: ${{ parameters.displayName }}
  env:
    URL: $(NEXUS_REPOSITORY_URL)
    REPOSITORY: ${{ parameters.repository }}
    REMOTE_FILE_LOCATION: ${{ parameters.remoteFileLocation }}
    USERNAME: $(NEXUS-DEFAULT-USR)
    PASSWORD: $(NEXUS-DEFAULT-PSW)