#########################################
##  Script: UndeployAppRetired.yml     ##
##  Weblogic 12.1.3                    ##
#########################################
parameters:
  WEBLOGIC_USER: ''
  WEBLOGIC_PASS: ''
  WEBLOGIC_ADMIN_SERVER_URL: ''
  ARTIFACT_ID: ''

steps:
    - task: Bash@3
      displayName: Start UndeployAppRetired
      name: Start_UndeployAppRetired
      condition: succeeded()
      inputs:
           targetType: inline
           workingDirectory: $(Pipeline.Workspace)
           script: |

            CYAN='\033[96m'
            RED='\033[91m'
            RESET='\033[0m'

            # set -x

            echo -e "${CYAN}=========================================${RESET}"
            echo -e "${CYAN}     Starting UndeployAppRetired.sh      ${RESET}"
            echo -e "${CYAN}=========================================${RESET}"

            wlsAdmin=${{ parameters.WEBLOGIC_USER }}
            wlsPassword=${{ parameters.WEBLOGIC_PASS }}
            wlsUrl=${{ parameters.WEBLOGIC_ADMIN_SERVER_URL }}
            appName=${{ parameters.ARTIFACT_ID }}

            if [ -z "$wlsAdmin" ] || [ -z "$wlsPassword" ] || [ -z "$wlsUrl" ] || [ -z "$appName" ]; then
                echo -e "${RED} Um dos parametros wlsAdmin, wlsPassword, wlsUrl ou appName não estão definidos!${RESET}"
                exit 1  # Sair com erro
            fi

            # Função para chamar a API REST
            function call_rest_api() {
                local url=$1
                local method=$2
                local data=$3

                if [[ -n "$data" ]]; then
                    echo $(curl -s -u "$wlsAdmin:$wlsPassword" -X "$method" -H "X-Requested-By: curl" -H "Accept: application/json" -H "Content-Type: application/json" -d "$data" "$url")
                else
                    echo $(curl -s -u "$wlsAdmin:$wlsPassword" -X "$method" -H "X-Requested-By: curl" -H "Accept: application/json" -H "Content-Type: application/json" "$url")
                fi
            }

            # 1. Buscar todas as aplicações e seus status
            echo "Searching for application $appName with RETIRED status..."
            response=$(call_rest_api "$wlsUrl/management/wls/latest/deployments?links" "GET")
            
            # 2. Verificar se a aplicação foi encontrada e e esta com status active 
            appFound=$(echo "$response" |jq -r --arg app $appName '.items[] | select((.name | startswith($app)) and (.state == "active")) | .name' | grep -Eo "^$appName#[^ ]+")

            #Se não achou o pacote pesquisa se tem outro pacote com o qualquer status
            if [[ -z "$appFound" ]]; then
                appFound=$(echo "$response" | jq -r --arg app $appName '.items[] | select(.name | startswith($app)) | .name' | grep -Eo "^$appName#[^ ]+" | head -n 1)                
            fi

            #if [[ "$appFound" == "$appName" ]]; then
            if [[ -n "$appFound" ]]; then
                echo "Application $appFound found. Checking deployment status..."

                # Se quiser buscar mais detalhes, como os targets ou outra propriedade
                appTargets=$(echo "$response" | jq -r --arg appName "$appFound" '.items[] | select(.name == $appName) | .targets[]')
    
                echo "Application $appName is deployed to the following targets: $appTargets"

                # Busca a URL do pacote API REST
                url_app=$(echo $response |jq -r --arg title "$appFound" '.links[] | select(.title == $title) | .uri' )
                # echo -e "URL_APP: $url_app"
                
                # API para STOP a aplicação (Package)
                #undeploy_response=$(call_rest_api "$url_app/stop" "POST")

                ## API para DELETE a aplicação (Package)
                undeploy_response=$(call_rest_api "$url_app" "DELETE")
                # Valida o retorno da API
                if [[ $(echo "$undeploy_response" | jq -r '.item.status' ) == "completed" ]]; then
                    echo "Stop of application $appFound completed!"
                else
                    echo -e "${RED}Error during stop of application $appName!${RESET}"
                    echo -e "Resultado: \n $undeploy_response"
                    exit 1
                fi
            else
                echo "No application named $appName found in the response!"
                # exit 1
            fi

            # Encerrar script
            exit 0


          