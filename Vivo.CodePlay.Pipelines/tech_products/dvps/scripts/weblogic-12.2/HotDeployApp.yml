#########################################
##  Script: HotDeployApp.yml           ##
##  Weblogic 12.2                      ##
#########################################

parameters:
    WEBLOGIC_USER: ""
    WEBLOGIC_PASS: ""
    WEBLOGIC_ADMIN_SERVER_URL: ""
    ARTIFACT_ID: ""
    APPLICATIONS_SERVER_PATH_ARTIFACT_ID: ""
    ARTIFACT_FILE: ""
    WEBLOGIC_CLUSTER: ""

steps:
    - task: Bash@3
      displayName: Start Hot Deploy Weblogic
      name: Start_Hot_Deploy_Weblogic
      condition: succeeded()
      inputs:
          targetType: inline
          workingDirectory: $(Pipeline.Workspace)
          script: |

            CYAN='\033[96m'
            RED='\033[91m'
            RESET='\033[0m'

            echo -e "${CYAN}=========================================${RESET}"
            echo -e "${CYAN}       Starting HotDeployApp.sh          ${RESET}"
            echo -e "${CYAN}=========================================${RESET}"

             # Parâmetros
            wlsAdmin=${{ parameters.WEBLOGIC_USER }}
            wlsPassword=${{ parameters.WEBLOGIC_PASS }}
            wlsUrl=${{ parameters.WEBLOGIC_ADMIN_SERVER_URL }}
            appName=${{ parameters.ARTIFACT_ID }}
            appArtifactPath=${{ parameters.APPLICATIONS_SERVER_PATH_ARTIFACT_ID }}
            appArtifactFile=${{ parameters.ARTIFACT_FILE }}
            appTarget=${{ parameters.WEBLOGIC_CLUSTER }}
            appArtifactPathFile=${{ parameters.APPLICATIONS_SERVER_PATH_ARTIFACT_ID }}/\${{ parameters.ARTIFACT_FILE }}

            #echo -e "Valores de imput: \n wlsAdmin: $wlsAdmin \n wlsPassword: $wlsPassword \n wlsUrl: $wlsUrl \n appName: $appName \n appArtifactPath: $appArtifactPath \n appTarget: $appTarget"

            if [ -z "$wlsAdmin" ] || [ -z "$wlsPassword" ] || [ -z "$wlsUrl" ] || [ -z "$appName" ] || [ -z "$appArtifactPath" ] || [ -z "$appArtifactFile" ] || [ -z "$appTarget" ]; then
                echo -e "${RED} Um dos parametros wlsAdmin, wlsPassword, wlsUrl, appName, appArtifactPath, appArtifactFile ou appTarget não estão definidos!${RESET}"
                exit 1  # Sair com erro
            fi

            # Função para fazer chamadas REST (autenticação básica)
            function call_rest_api() {
                local url=$1
                local method=$2
                local data=$3
                local file=$4

                if [[ -n "$file" ]]; then
                    # Se houver um arquivo, usar --form para enviar dados multipart/form                 
                    curl -s -u "$wlsAdmin:$wlsPassword" -X "$method" -H "X-Requested-By: curl" -H Content-Type:multipart/form-data --form "model=$data" --form "sourcePath=@$file" "$url"
                elif [[ -n "$data" ]]; then
                    # Se houver dados, incluí-los na chamada curl como JSON
                    curl -s -u "$wlsAdmin:$wlsPassword" -X "$method" -H "X-Requested-By: curl" -H "Accept: application/json" -H "Content-Type: application/json" -d "$data" "$url"
                else
                    # Se não houver dados ou arquivos, fazer chamada curl simples
                    curl -s -u "$wlsAdmin:$wlsPassword" -X "$method" -H "X-Requested-By: curl" -H "Accept: application/json" "$url"
                fi

                return_curl=$?

                if [[ $return_curl -ne 0 ]]; then
                    echo -e "${RED}Erro ao executar curl - Retorno código: $return_curl ${RESET} \n Log de saida: $response " 
                fi
            }

            # Função para fazer requisição REST e realizar deploy
            deploy_app() {
                local appName="$1"
                local appArtifactPath="$2"
                local appTarget="$3"

                echo "Deploying application $appName ..."

                # Construir o corpo da requisição com JSON
                json_data=$(jq -n \
                    --arg name "$appName" \
                    --arg target "$appTarget" \
                    '{
                        name: $name,
                        targets: [
                            {
                                identity: [
                                "clusters",
                                $target
                                ]
                            }
                        ]
                    }'
                )
                  
                # Fazer deploy via API REST do WebLogic
                retorno_deploy=$(call_rest_api "$wlsUrl/management/weblogic/latest/edit/appDeployments" "POST" "$json_data" "$appArtifactPath")
                
                # Verificar se o deploy foi bem-sucedido
                if [[ $(echo "$retorno_deploy" | jq -r '.state') != "STATE_COMPLETED" ]]; then
                    echo -e "${RED}Error during deployment of application $appName!${RESET}"
                    echo -e "Log:\n$retorno_deploy"
                    exit 1
                fi

                echo "Hot deploy completed for $appName!"
            }

            delete_package(){
                local package="$1"
                # Apaga o pacote da aplicação no agent
                if [[ -f $package ]]; then
                    echo "Delete $package."
                    rm -f $package
                fi
            }

            if [[ -f $appArtifactPathFile ]]; then
                echo -e "${CYAN}File $appArtifactPathFile found!.${RESET}"
            else
                echo -e "${RED}File $appArtifactPathFile not found!.${RESET}"
                exit 1
            fi

            # Conectar e realizar o deploy
            echo "Connecting to AdminServer at $wlsUrl ..."
            response=$(call_rest_api "$wlsUrl/management/weblogic/latest/serverRuntime" "GET")

            if [[ $response == *"ServerRuntime"* ]]; then
                echo "Connected!"
                deploy_app "$appName" "$appArtifactPathFile" "$appTarget"
                delete_package "$appArtifactPathFile"
                exit 0  
            else
                echo -e "${RED}Error while connecting to AdminServer!${RESET}"
                echo "$response"
                delete_package "$appArtifactPathFile"
                exit 1
            fi