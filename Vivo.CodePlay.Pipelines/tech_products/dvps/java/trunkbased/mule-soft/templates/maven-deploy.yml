parameters:
  - name: extraOption
    type: string
    default: ''
    displayName: 'Extra Maven options'

steps:
  - script: |
      echo "##[section]Maven Deploy - command to be executed:"
      echo ""
      echo "mvn -f '$(Build.ArtifactStagingDirectory)/pom.xml' mule:deploy \\"
      echo "  -s '$(muleSettings.secureFilePath)' \\"
      echo "  -DmuleDeploy \\"
      echo "  -Dmule.artifact='$(Build.ArtifactStagingDirectory)/target/$(ARTIFACT_ID)-$(POM_VERSION)-mule-application.jar' \\"
      echo "  -DskipTests \\"
      echo "  -DconnectedAppClientId='$(MULE_APP_CLIENT_ID)' \\"
      echo "  -DconnectedAppClientSecret='$(MULE_APP_CLIENT_SECRET)' \\"
      echo "  -Denv.short='$(ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME)' \\"
      echo "  -DbusinessGroupId='$(MULE_BUSINESS_GROUP_ID)' \\"
      echo "  -Denv='$(ANYPOINT_ENVIRONMENT)' \\"
      echo "  -Dsecurity.key='$(MULE_SECURITY_KEY)' \\"
      echo "  -Danypoint.platform.client_id='$(MULE_ANYPOINT_CLIENT_ID)' \\"
      echo "  -Danypoint.platform.client_secret='$(MULE_ANYPOINT_CLIENT_SECRET)' \\"
      echo "  ${MAVEN_EXTRA_OPTION} \\"
      echo "  $(CLOUD_HUB_PROPS)"
    displayName: "Log Maven deploy command (extraOption expanded)"
    env:
      MAVEN_EXTRA_OPTION: ${{ parameters.extraOption }}

  - task: Maven@4
    displayName: 'Executing maven deploy on CloudHub'
    inputs:
      mavenPOMFile: '$(Build.ArtifactStagingDirectory)/pom.xml'
      goals: 'mule:deploy'
      options: >-
        -s $(muleSettings.secureFilePath)
        -DmuleDeploy
        -Dmule.artifact=$(Build.ArtifactStagingDirectory)/target/$(ARTIFACT_ID)-$(POM_VERSION)-mule-application.jar
        -DskipTests
        -DconnectedAppClientId=$(MULE_APP_CLIENT_ID)
        -DconnectedAppClientSecret=$(MULE_APP_CLIENT_SECRET)
        -Denv.short=$(ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME)
        -DbusinessGroupId=$(MULE_BUSINESS_GROUP_ID)
        -Denv=$(ANYPOINT_ENVIRONMENT)
        -Dsecurity.key=$(MULE_SECURITY_KEY)
        -Danypoint.platform.client_id=$(MULE_ANYPOINT_CLIENT_ID)
        -Danypoint.platform.client_secret=$(MULE_ANYPOINT_CLIENT_SECRET)
        ${{ parameters.extraOption }}
        $(CLOUD_HUB_PROPS)
    env:
      PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
      PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
      HTTP_PROXY: $(PROXY_AGENT_HTTP)
      HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
