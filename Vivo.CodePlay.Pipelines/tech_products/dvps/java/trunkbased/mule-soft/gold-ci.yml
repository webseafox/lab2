- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
  - group: "mule-prod-variables"

- name: ADDITIONAL_PROPERTIES_DEPLOY
  value: ""

stages:
- stage: pipeline_init
  displayName: "Pipeline initialization"
  condition: eq(variables['SKIP_LEGACY_PIPELINE'], 'true')
  variables:
  - name: BRANCH_NAME
    value: $[ coalesce(variables['System.PullRequest.targetBranchName'], variables['Build.SourceBranchName']) ]
  pool:
    name: $(AGENT_POOL_CI)
  jobs:

  - job: prepare_pipeline
    displayName: "Prepare"
    steps:
    - task: XmlParseFromVivo@4
      displayName: 'Getting project.artifactId from pom.xml'
      name: pom_reference
      condition: True
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var ARTIFACT_ID = .project.artifactId._text

    - task: CopyFiles@2
      displayName: "Copy catalog-info.yaml to Staging Directory"
      inputs:
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          catalog-info.yaml

    - task: PublishBuildArtifacts@1
      displayName: "Publish catalog-info.yaml"
      inputs:
        artifactName: "catalog-info"
        targetPath: "$(Build.ArtifactStagingDirectory)"
  - job: get_new_version
    displayName: "Get new version"
    steps:
    - task: CmdLine@2
      displayName: Getting last semantic version tag
      name: semantic_version
      inputs:
        script: >
          SEM_VER_TAGS=$(git tag -l | grep -E '^v?\.?[0-9]+\.[0-9]+\.[0-9]+$')

          echo "##[debug] Semantic version tags: $SEM_VER_TAGS"


          if [ -z "$SEM_VER_TAGS" ]; then
            echo "##[debug] Nenhuma tag SemVer encontrada."
            exit 0
          fi


          NORMALIZED_TAGS=$(echo "$SEM_VER_TAGS" | sed 's/^v\.//; s/^v//')

          echo "##[debug] Normalized tags: $NORMALIZED_TAGS"


          LAST_VERSION=$(echo "$NORMALIZED_TAGS" | sort -V | tail -n 1)

          echo "##[debug] Current version: $LAST_VERSION"

          echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=false]$LAST_VERSION"

    - task: XmlParseFromVivo@4
      displayName: 'Getting project.version from pom.xml'
      name: pom_reference
      condition: eq(variables['CURRENT_VERSION'], '')
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var CURRENT_VERSION = .project.version._text

    - task: CmdLine@2
      displayName: "Normalize current version"
      inputs:
        script: |
          echo "Current version: $(CURRENT_VERSION)"
          if [[ ! "$(CURRENT_VERSION)" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$(CURRENT_VERSION)" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
            if (( PATCH > 0 )); then
              ((PATCH--))
            fi
            CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "Normalized current version: $(CURRENT_VERSION)"
          echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=false]$(CURRENT_VERSION)"

    - task: CmdLine@2
      name: increment_version
      displayName: "Incrementing version"
      inputs:
        script: >
          echo "version: $(CURRENT_VERSION)"
          echo "outputVariable: NEW_VERSION"

          NEW_VERSION=$(echo "$(CURRENT_VERSION)" | awk -F. -v OFS=. '{$NF += 1 ; print}')

          echo "NEW_VERSION: ${NEW_VERSION}"

          echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]${NEW_VERSION}"
    - ${{ if not(eq(variables['Build.SourceBranch'], 'refs/heads/master')) }}:
      - task: CmdLine@2
        displayName: Getting dev build version
        name: versioning
        condition: not(eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        env:
          NEW_VERSION: $(increment_version.NEW_VERSION)
        inputs:
          script: >
            echo "##[debug] NEW_VERSION=${NEW_VERSION}"

            echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]${NEW_VERSION}"
    - ${{ else }}:
      - task: CmdLine@2
        name: versioning
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
        env:
          NEW_VERSION: $(increment_version.NEW_VERSION)
        inputs:
          script: |
            echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]${NEW_VERSION}"

- stage: build_test
  displayName: "Build & Test"
  dependsOn:
  - pipeline_init
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  - name: ARTIFACT_ID
    value: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  pool:
    name: $(AGENT_POOL_CI)
  jobs:
  - job: build_test
    displayName: "Build & Test"
    variables:
    - name: SKIP_UNIT_TESTS
      value: $[ ne(variables['Build.SourceBranchName'], 'dev') ]
    - name: EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT
      value: $[ lower(coalesce(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED'], false)) ]
    - name: EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH
      value: $[ lower(containsValue(split(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BRANCHES'], ','), variables['Build.SourceBranchName'])) ]
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >-
          NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW

    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)

    - task: CmdLine@2
      displayName: Extracting properties from config file
      inputs:
        script: >
          echo "##vso[task.setvariable variable=UNIT_TEST_PROPS]"

          if [ ! -f "src/main/resources/properties/$(PROPERTIES_FILE_NAME)" ]; then
              echo "The file 'src/main/resources/properties/$(PROPERTIES_FILE_NAME)' does not exist."
              exit 0
          fi

          PROPS=$(yq '.unitTestProperties | select (.!=null)' src/main/resources/properties/$(PROPERTIES_FILE_NAME) | tr -d ':' | awk '{print $1}')

          if [ -z "$PROPS" ]; then
              echo "The field 'unitTestProperties' does not exist."
              exit 0
          fi

          for PROP in $PROPS; do
            PROPERTIES_ARGS_STRING="$PROPERTIES_ARGS_STRING -D$PROP=$(yq ".unitTestProperties.$PROP" src/main/resources/properties/$(PROPERTIES_FILE_NAME))"
          done

          echo "##vso[task.setvariable variable=UNIT_TEST_PROPS]${PROPERTIES_ARGS_STRING}"
        workingDirectory: $(Build.SourcesDirectory)
    - task: Maven@4
      displayName: 'Setting new version'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'versions:set'
        options: >-
          -s $(muleSettings.secureFilePath)
          -Dmaven.test.skip=true
          -DskipTests=true
          -DnewVersion=$(NEW_VERSION)
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_NSKP_HTTP)
        HTTPS_PROXY: $(PROXY_NSKP_HTTP)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - task: CmdLine@2
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], true))
      displayName: Tests config validation
      inputs:
        script: |
          echo "##vso[task.logissue type=warning;] Tests execution was disabled."
          echo "##vso[task.complete result=SucceededWithIssues;]"
    - task: CmdLine@2
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      displayName: Defining unit tests properties
      inputs:
        script: |
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
          echo "##[debug] ANYPOINT_ENVIRONMENT: $(ANYPOINT_ENV)"
          echo "##[debug] ---------------------------------"

          if [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT" == "true" ] || [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH" == "true" ]; then
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(EXCLUSIVE_UNIT_TESTS_PROPERTIES)"
          else
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $(ANYPOINT_ENV)"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(ANYPOINT_ENV)"
          fi
    - task: Maven@4
      displayName: 'Executing unit tests'
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      continueOnError: ${{ not(eq(variables['Build.SourceBranch'], 'refs/heads/master')) }}

      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean test'
        options: >
          -s $(muleSettings.secureFilePath) -Djava.net.useSystemProxies=true -Dsecurity.key=$(MULE_SECURITY_KEY) -Denv=$(UNIT_TESTS_ENV_PROPERTIES) $(UNIT_TEST_PROPS)
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)

    - task: PublishTestResults@2
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], false))
      continueOnError: ${{ not(eq(variables['Build.SourceBranch'], 'refs/heads/master')) }}
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        publishRunAttachments: false
        failTaskOnFailedTests: true
    
    - task: CmdLine@2
      displayName: 'Define ASDF Java Version'
      inputs:
        script: |
          CUSTOMIZED_VERSION="$(CUSTOMIZED_JAVA_VERSION)"
          
          if [ -n "$CUSTOMIZED_VERSION" ]; then
            echo "CUSTOMIZED_JAVA_VERSION is set to: $CUSTOMIZED_VERSION"
            echo "##vso[task.setvariable variable=ASDF_JAVA_VERSION_VALUE]$CUSTOMIZED_VERSION"
          else
            echo "CUSTOMIZED_JAVA_VERSION is empty or not set. Using default."
            echo "##vso[task.setvariable variable=ASDF_JAVA_VERSION_VALUE]"
          fi

    - task: Maven@4
      displayName: 'Executing maven build'
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean install'
        options: >-
          -s $(muleSettings.secureFilePath) 
          -Djava.net.useSystemProxies=true 
          -Dsecurity.key=$(MULE_SECURITY_KEY) 
          -Denv=$(ANYPOINT_ENV) 
          -DskipTests=true
          
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_NSKP_HTTP)
        HTTPS_PROXY: $(PROXY_NSKP_HTTP)
        # NO_PROXY: $(PROXY_AGENT_NO_PROXY)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION_VALUE)

    - task: Maven@4
      displayName: 'Dependency tree'
      continueOnError: true
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'dependency:tree'
        options: >-
          -s $(muleSettings.secureFilePath)
          -Djava.net.useSystemProxies=true
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_NSKP_HTTP)
        HTTPS_PROXY: $(PROXY_NSKP_HTTP)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION_VALUE)

    - task: Maven@4
      displayName: 'Dependency updates'
      continueOnError: true
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'versions:display-dependency-updates'
        options: >-
          -s $(muleSettings.secureFilePath)
          -Djava.net.useSystemProxies=true
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_NSKP_HTTP)
        HTTPS_PROXY: $(PROXY_NSKP_HTTP)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION_VALUE)

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: "$(build.sourcesdirectory)"
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        Contents: |
          **/target/classes/**
          **/target/*.*ar
          **/target/*.ejb
          **/surefire-reports/TEST-*.xml
          **/pom.xml
          .azuredevops/**/*
          .azuredevops/*
          catalog-info.y*ml
          mule-artifact.json
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'bin'

- stage: quality_gates
  displayName: "Code Quality Analysis"
  condition: true
  dependsOn:
  - pipeline_init
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  pool:
    name: $(AGENT_POOL_CI)
  jobs:
  - job: run_sonar_scanner
    displayName: "Running Sonar Scanner"
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: "Get catalog-info.yaml"
      inputs:
        buildType: current
        artifactName: catalog-info
        targetPath: $(System.ArtifactsDirectory)
    - task: CmdLine@2
      displayName: "Extract catalog-info.yaml variables"
      inputs:
        script: |
          if [ ! -f "catalog-info.yaml" ]; then
            echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
            exit 1
          fi

          GOV_APP_ACRONYM="$(yq -r '.metadata.annotations."techarch.governance-app.acronym" | select (.!=null) | downcase' catalog-info.yaml)"
          SONAR_PROJECT_KEY="$(yq -r 'select(documentIndex == 0) | .metadata.annotations."sonarqube.org/project-key" | select (.!=null)' catalog-info.yaml)"

          echo "##[debug] GOV_APP_ACRONYM............: ${GOV_APP_ACRONYM}"
          echo "##[debug] SONAR_PROJECT_KEY..........: ${SONAR_PROJECT_KEY}"

          echo "##vso[task.setvariable variable=GOV_APP_ACRONYM]${GOV_APP_ACRONYM}"
          echo "##vso[task.setvariable variable=SONAR_PROJECT_KEY]${SONAR_PROJECT_KEY}"
        workingDirectory: $(System.ArtifactsDirectory)
    - task: SonarAnalysisFromVivo@4
      displayName: 'Sonar Analysis (Vivo)'
      continueOnError: true
      inputs:
        command: 'analysis'
        useAppConfig: true
        azureSubscription: '$(APP_CONFIGURATION_AZURE_SUBSCRIPTION)'
        appConfigurationEndpoint: '$(APP_CONFIGURATIN_ENDPOINT)'
        SonarQube: '$(SONARQUBE_SERVICE_CONNECTION_NAME)'
        scannerMode: 'cli'
        configMode: 'file'
        configFile: '$(Build.SourcesDirectory)/.azuredevops/sonar-project.properties'
        cliScannerVersion: '$(SONARQUBE_CLI_VERSION)'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(System.TeamProject)-$(Build.Repository.Name)'
        cliProjectVersion: '$(NEW_VERSION)'
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(Build.SourcesDirectory)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.lang.patterns.xml=$(SONAR_LANG_PATTERNS_XML)
          sonar.lang.patterns.mule=$(SONAR_LANG_PATTERNS_MULE)
          sonar.mule.file.suffixes=$(SONAR_MULE_FILE_SUFFIXES)
          sonar.exclusion=$(SONAR_MULE_EXCLUSIONS)
        jdkversion: 'JAVA_HOME'
        pollingTimeoutSec: '300'
        acronym: '$(GOV_APP_ACRONYM)'
        reportPath: '$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt'
        useOpaRepository: true
        codePlayServiceConnection: 'CodePlay'
        opaBranch: 'master'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        NO_PROXY: "$(PROXY_AGENT_NO_PROXY),sonar.devops.redecorp.br,sonar-vip.devops.redecorp.br"
        ASDF_JAVA_VERSION: 'openjdk-11.0.2'

- stage: software_composition_analysis
  displayName: "Software Composition Analysis"
  condition: true
  dependsOn: build_test
  pool:
    name: $(AGENT_POOL_CI)
  jobs:
  - job: app_config_keys
    displayName: "Get AppSec Config Keys"
    steps:
    - template: /task_groups/security/get_appconfig_keys.yml@CorePipelines

  - job: sca_scan
    dependsOn: app_config_keys
    variables: 
      USE_DEPENDENCY_TRACK: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]
      USE_CONVISO: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
      SKIP_SECURITY_GATE_SCA: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE_SCA'] ]
      USE_DT_DOCKER: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
      SCA_BUILD_ARTIFACT: true
    condition: and(
                succeeded(),
                eq(variables.USE_DEPENDENCY_TRACK, 'true'),
                eq(variables.flowIsToReview, true),
                not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
              )
    displayName: "SCA Scan Master"
    steps:
    - template: /security/define_appsec_app_version.yml@AppSecCodePlay
    - template: /security/run_sca_scan.yml@AppSecCodePlay
      parameters:
        buildArtifactName: "bin"
        appVersion: "$(FORTIFY_APP_VERSION)"
        vivoFlow: "dev,preprod,prodlike,master,release/*"

- stage: code_security_analysis
  displayName: "Code Security Analysis"
  condition: true
  pool: $(AGENT_POOL_CI)
  dependsOn: pipeline_init
  jobs:
    # The job that retrieves the application security configuration keys.
    - job: app_config_keys
      displayName: "Get AppSec Config Keys"
      steps:
        - template: /tasks/bash/welcome.yml@CorePipelines
        - template: /task_groups/security/get_appconfig_keys.yml@CorePipelines
 
    # The job that performs the Fortify scan.
    - job: fortify_scan
      dependsOn: app_config_keys
      variables:
        USE_FORTIFY: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_FORTIFY'] ]
        USE_CONVISO: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
        SKIP_SECURITY_GATE: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
      condition: and(
        succeeded(),
        eq(variables.USE_FORTIFY, 'true'),
        eq(variables.flowIsToReview, true),
        not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
        )
      displayName: "Fortify Scan"
      steps:
        - template: /security/define_appsec_app_version.yml@AppSecCodePlay
        - template: /security/run_fortify_scan.yml@AppSecCodePlay
          parameters:
            fortifyExclusionRepository: ${{ parameters.fortifyExclusionRepository }}
            appVersion: "$(FORTIFY_APP_VERSION)"
            vivoFlow: "dev,preprod,prodlike,master,release/*"
        - template: /tasks/telemetry/telemetry.yml@CorePipelines

    # The job that performs the Checkmarx scan.
    - job: checkmarx_scan
      dependsOn: app_config_keys
      variables:
        USE_CHECKMARX: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CHECKMARX'] ]
        SKIP_SECURITY_GATE: $[ or(eq(dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'], 'true'), eq(variables.CHECKMARX_IGNORE_SECURITY_GATE, 'true')) ]
      condition: and(
        succeeded(),
        eq(variables.USE_CHECKMARX, 'true'),
        eq(variables.flowIsToReview, true),
        not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
        )
      displayName: "Checkmarx Scan"
      steps:
        - template: /task_groups/security/run_checkmarx_scan.yml@CorePipelines
          parameters:
            skipSecurityGate: $(SKIP_SECURITY_GATE)

- stage: publish
  displayName: "Publish Artifacts"
  dependsOn:
  - pipeline_init
  - build_test
  - quality_gates
  - software_composition_analysis
  - code_security_analysis
  condition: |
    and(
      succeeded('pipeline_init'),
      succeeded('build_test'),
      succeeded('software_composition_analysis'),
      succeeded('code_security_analysis'),
      in(dependencies.quality_gates.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
      eq(variables['isEnvBranch'], true)
    )
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  - name: ARTIFACT_ID
    value: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  pool:
    name: $(AGENT_POOL_CI)
  jobs:
  - job: update_version
    # condition: eq(variables['isBumpingVersion'], true)
    variables:
    - name: UPDATE_VERSION_BRANCH_NAME
      value: $[ replace(variables['Build.SourceBranch'], 'refs/heads/', '') ]
    displayName: "Update version and commit"
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >-
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW
    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)
    - task: CmdLine@2
      displayName: 'Inject ngin-mvn server into settings file'
      inputs:
        script: |
          SETTINGS_FILE="$(muleSettings.secureFilePath)"
          sed -i "s|</servers>|<server><id>ngin-mvn</id><username>\${env.NEXUS_DEPS_USR}</username><password>\${env.NEXUS_DEPS_PSW}</password></server></servers>|" "$SETTINGS_FILE"
          echo "##[debug] ngin-mvn server injected into $SETTINGS_FILE"
    - task: Bash@3
      displayName: "Preparation"
      inputs:
        targetType: inline
        script: |
          BRANCH_NAME="$(echo $(Build.SourceBranch) | sed 's#refs/heads/##')"
          echo "##[debug] BRANCH_NAME: $BRANCH_NAME"

          git config --global --replace-all user.name "Azure DevOps"
          git config --global --replace-all user.email "azuredevops@telefonica.com"
          
          git config pull.rebase true
          git fetch -f --depth 1 origin $BRANCH_NAME:$BRANCH_NAME
          git checkout -f $BRANCH_NAME
    - task: Maven@4
      displayName: 'Setting new version'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'versions:set'
        options: >-
          -s $(muleSettings.secureFilePath)
          -DnewVersion=$(NEW_VERSION)
      env:
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        HTTP_PROXY: $(PROXY_NSKP_HTTP)
        HTTPS_PROXY: $(PROXY_NSKP_HTTP)
    - task: Bash@3
      displayName: 'Commit Updated Version'
      env:
        BRANCH_NAME: $(UPDATE_VERSION_BRANCH_NAME)
        NEW_VERSION: $(NEW_VERSION)
        TAG_REPO: true
      inputs:
        targetType: inline
        script: |
          echo "##[debug] Branch: $BRANCH_NAME"
          echo "##[debug] New Version: $NEW_VERSION"

          git add pom.xml
          git commit -am "[CI SKIP] Project version has been updated. Released version '$NEW_VERSION'"

          if [[ "$TAG_REPO" == "true" ]]; then
            echo "##[debug] Creating tag $NEW_VERSION"
            git tag $NEW_VERSION
          fi

          git push origin $BRANCH_NAME
          if [[ "$TAG_REPO" == "true" ]]; then
            git push origin $NEW_VERSION
          fi

          if [ $? -ne 0 ]; then
            echo "##vso[task.logissue type=error] Git push failed. Permission denied or refspec invalid"
            echo "##vso[task.complete result=Failed;]"
            exit 1
          fi

  - job: publish_to_artifacts
    displayName: "Publishing to Artifacts"
    dependsOn: update_version
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Getting previous stage artifact'
      inputs:
        buildType: current
        artifactName: bin
        targetPath: '$(Build.ArtifactStagingDirectory)'
    - task: XmlParseFromVivo@4
      displayName: 'Get New pom.xml info'
      inputs:
        type: 'file'
        origin: $(Build.ArtifactStagingDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_GROUP_ID = .project.groupId._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
        
    - task: Bash@3
      name: SetPackageName
      displayName: "Define package name"
      inputs:
        targetType: inline
        script: |
          echo "BRANCH_NAME: $BRANCH_NAME"
          if [[ "${BRANCH_NAME,,}" == *"rlm"* ]]; then
            PACKAGE_NAME="${POM_XML_GROUP_ID}.release.${POM_XML_ARTIFACT_ID}"
          else
            PACKAGE_NAME="${POM_XML_GROUP_ID}.${BRANCH_NAME,,}.${POM_XML_ARTIFACT_ID}"
          fi
          echo "PACKAGE_NAME resolved as: $PACKAGE_NAME"
          echo "##vso[task.setvariable variable=PACKAGE_NAME]$PACKAGE_NAME"

    - task: Bash@3
      name:  SetPackageVersion
      displayName: "Prepare package version"
      inputs:
        targetType: inline
        script: |
          PACKAGE_VERSION="$( echo "$(NEW_VERSION)" | tr 'A-Z' 'a-z')"

          echo "PACKAGE_VERSION (lower case): $PACKAGE_VERSION"

          echo "##vso[task.setvariable variable=PACKAGE_VERSION]$PACKAGE_VERSION"

    - bash: |
        ORG=$(System.CollectionUri)
        PROJECT=$(System.TeamProjectId)
        GROUP_NAME="$(Build.Repository.Name)"
        PACKAGE_VERSION=$(PACKAGE_VERSION)

        echo "##[debug] ORG: $ORG"
        echo "##[debug] PROJECT: $PROJECT"
        echo "##[debug] GROUP_NAME: $GROUP_NAME"

        if [[ "$(Build.SourceBranchName)" == *"release"* ]]; then
          VAR_NAME="RELEASE_PACKAGE_VERSION"
        else
          VAR_NAME=$(echo "$(Build.SourceBranchName)_PACKAGE_VERSION" | tr '[:lower:]' '[:upper:]')
        fi

        echo "##[debug] VAR_NAME: $VAR_NAME"

        echo "##[command]az pipelines variable-group list --org $ORG --project $PROJECT --query \"[?name=='$GROUP_NAME'].id\" -o tsv"

        GROUP_ID=$(az pipelines variable-group list \
          --org $ORG \
          --project $PROJECT \
          --query "[?name=='$GROUP_NAME'].id" \
          -o tsv)

        # Validar se achou o grupo
        if [ -z "$GROUP_ID" ]; then
          echo "Grupo de variáveis '$GROUP_NAME' não encontrado."
          exit 1
        fi

        echo "##[command]az pipelines variable-group variable update --group-id $GROUP_ID --name $VAR_NAME --value $PACKAGE_VERSION --org $ORG --project $PROJECT"

        az pipelines variable-group variable update \
          --group-id "$GROUP_ID" \
          --name "$VAR_NAME" \
          --value "$PACKAGE_VERSION" \
          --org "$ORG" \
          --project "$PROJECT" || {
            echo "Variable '$VAR_NAME' does not exist. Creating it..."
            echo "##[command]az pipelines variable-group variable create --group-id $GROUP_ID --name $VAR_NAME --value $PACKAGE_VERSION --org $ORG --project $PROJECT"
            az pipelines variable-group variable create \
              --group-id "$GROUP_ID" \
              --name "$VAR_NAME" \
              --value "$PACKAGE_VERSION" \
              --org "$ORG" \
              --project "$PROJECT"
          }
          
      displayName: "Update variable group version"
      env:
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
        PACKAGE_VERSION: $(PACKAGE_VERSION)

    - task: UniversalPackages@0
      displayName: Publish a Universal Package
      inputs:
        command: publish
        publishDirectory: "$(Build.ArtifactStagingDirectory)"
        feedsToUsePublish: "internal"
        vstsFeedPublish: "3d53bc62-8749-4931-ae46-a443b73bc87a"
        vstsFeedPackagePublish: "$(PACKAGE_NAME)"
        packagePublishDescription: ""
        versionOption: "custom"
        versionPublish: "$(PACKAGE_VERSION)"
