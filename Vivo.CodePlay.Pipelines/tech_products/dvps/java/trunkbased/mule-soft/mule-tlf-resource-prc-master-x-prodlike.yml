stages:
- stage: pipeline_init
  displayName: "Pipeline initialization"
  variables:
  - name: BRANCH_NAME
    value: $[ coalesce(variables['System.PullRequest.targetBranchName'], variables['Build.SourceBranchName']) ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: get_env_config
    displayName: "Getting Environment Configuration"
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: CodePlay
    - task: CmdLine@2
      name: env_configuration
      displayName: "Setting Environment"
      env:
        ENV_CONFIG_NAME: $(BRANCH_NAME)
        DEFAULT_ENV_CONFIG: $(MULE_DEFAULT_ENV_CONFIG)
      inputs:
        script: >
          echo "##[debug] ENV_CONFIG_NAME: $ENV_CONFIG_NAME"

          if [ ! -f "tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml" ]; then
            echo "##vso[task.logissue type=error] Unable to find tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml file."
            exit 1
          fi


          if [ $(yq eval "has(\"$ENV_CONFIG_NAME\")" "tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml") != true ]; then
            ENV_CONFIG_NAME=$MULE_DEFAULT_ENV_CONFIG
            echo "##[debug] Using default value for ENV_CONFIG_NAME: $ENV_CONFIG_NAME"
          fi


          PROPERTIES_FILE_NAME="$(yq -r .${ENV_CONFIG_NAME}.propertiesFileName tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ANYPOINT_ENV="$(yq -r .${ENV_CONFIG_NAME}.anypointEnv tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ANYPOINT_ENV_APP_NAME="$(yq -r .${ENV_CONFIG_NAME}.anypointEnvAppName tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ENV_HEALTH_ENDPOINT="$(yq -r .${ENV_CONFIG_NAME}.envHealthEndpoint tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"


          echo "##[debug] PROPERTIES_FILE_NAME: ....................$PROPERTIES_FILE_NAME"

          echo "##[debug] ANYPOINT_ENVIRONMENT: ....................$ANYPOINT_ENV"

          echo "##[debug] ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME: $ANYPOINT_ENV_APP_NAME"

          echo "##[debug] ENVIRONMENT_HEALTH_ENDPOINT: .............$ENV_HEALTH_ENDPOINT"


          if [ "${PROPERTIES_FILE_NAME}" == "null" ]; then
            echo "##vso[task.logissue type=error] There is no env configuration for this branch on env_config.yml."
            exit 1
          fi


          echo "##vso[task.setvariable variable=PROPERTIES_FILE_NAME;isoutput=true]${PROPERTIES_FILE_NAME}"

          echo "##vso[task.setvariable variable=ANYPOINT_ENVIRONMENT;isoutput=true]${ANYPOINT_ENV}"

          echo "##vso[task.setvariable variable=ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME;isoutput=true]${ANYPOINT_ENV_APP_NAME}"

          echo "##vso[task.setvariable variable=ENVIRONMENT_HEALTH_ENDPOINT;isoutput=true]${ENV_HEALTH_ENDPOINT}"
        workingDirectory: $(Build.SourcesDirectory)
  - job: prepare_pipeline
    displayName: "Prepare"
    steps:
    - task: CmdLine@2
      displayName: Getting project.artifactId from pom.xml
      name: pom_reference
      condition: True
      inputs:
        script: "if [ ! -f \"pom.xml\" ]; then\n  echo \"##vso[task.logissue type=error] Unable to find pom.xml file.\"\n  exit 1\nfi\n\neval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)\nif [ -z \"$PROP_VALUE\" ]; then\n  echo \"##[debug] Unable to find \\\"project.artifactId\\\" on pom.xml file. Trying again...\"\n  eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.artifactId pom.xml)    \n  if [ -z \"$PROP_VALUE\" ]; then\n    echo \"##vso[task.logissue type=error] Unable to find \\\"project.artifactId\\\" on pom.xml file.\"\n    exit 1\n  fi\nfi\n\necho \"##[debug] Exporting \\\"project.artifactId\\\" property with value \\\"${PROP_VALUE}\\\" to output variable \\\"ARTIFACT_ID\\\".\"\necho \"##vso[task.setvariable variable=ARTIFACT_ID;isoutput=true]$PROP_VALUE\"\n"
        workingDirectory: $(Build.SourcesDirectory)
    - task: CopyFiles@2
      displayName: "Copy catalog-info.yaml to Staging Directory"
      inputs:
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          catalog-info.yaml
    - task: PublishPipelineArtifact@1
      displayName: "Publish catalog-info.yaml"
      inputs:
        artifactName: "catalog-info"
        targetPath: "$(Build.ArtifactStagingDirectory)"
  - job: get_new_version
    displayName: "Get new version"
    steps:
    - task: CmdLine@2
      displayName: Getting last semantic version tag
      name: semantic_version
      inputs:
        script: >
          SEM_VER_TAGS=$(git tag -l | grep -E '^v?\.?[0-9]+\.[0-9]+\.[0-9]+$')

          echo "##[debug] Semantic version tags: $SEM_VER_TAGS"


          if [ -z "$SEM_VER_TAGS" ]; then
            echo "##[debug] Nenhuma tag SemVer encontrada."
            exit 0
          fi


          NORMALIZED_TAGS=$(echo "$SEM_VER_TAGS" | sed 's/^v\.//; s/^v//')

          echo "##[debug] Normalized tags: $NORMALIZED_TAGS"


          CURRENT_VERSION=$(echo "$NORMALIZED_TAGS" | sort -V | tail -n 1)

          echo "##[debug] Current version: $CURRENT_VERSION"

          echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=false]${CURRENT_VERSION}"
    - task: CmdLine@2
      displayName: Getting project.version from pom.xml
      name: pom_reference
      condition: eq(variables['CURRENT_VERSION'], '')
      inputs:
        script: "if [ ! -f \"pom.xml\" ]; then\n  echo \"##vso[task.logissue type=error] Unable to find pom.xml file.\"\n  exit 1\nfi\n\neval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)\nif [ -z \"$PROP_VALUE\" ]; then\n  echo \"##[debug] Unable to find \\\"project.version\\\" on pom.xml file. Trying again...\"\n  eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)    \n  if [ -z \"$PROP_VALUE\" ]; then\n    echo \"##vso[task.logissue type=error] Unable to find \\\"project.version\\\" on pom.xml file.\"\n    exit 1\n  fi\nfi\n\necho \"##[debug] Exporting \\\"project.version\\\" property with value \\\"${PROP_VALUE}\\\" to output variable \\\"CURRENT_VERSION\\\".\"\necho \"##vso[task.setvariable variable=CURRENT_VERSION;isoutput=false]$PROP_VALUE\"\n"
        workingDirectory: $(Build.SourcesDirectory)
    - task: CmdLine@2
      displayName: "Normalize current version"
      env:
        CURRENT_VERSION: $(CURRENT_VERSION)
      inputs:
        script: |
          echo "Current version: $CURRENT_VERSION"
          if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$CURRENT_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
            if (( PATCH > 0 )); then
              ((PATCH--))
            fi
            CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "Normalized current version: $CURRENT_VERSION"
          echo "##vso[task.setvariable variable=CURRENT_VERSION;isOutput=false]$CURRENT_VERSION"
    - task: CmdLine@2
      name: increment_version
      displayName: "Incrementing version"
      env:
        CURRENT_VERSION: $(CURRENT_VERSION)
      inputs:
        script: >
          echo "version: $CURRENT_VERSION"

          echo "outputVariable: NEW_VERSION"

          NEW_VERSION=$(echo ${CURRENT_VERSION} | awk -F. -v OFS=. '{$NF += 1 ; print}')


          echo "NEW_VERSION: ${NEW_VERSION}"

          echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]${NEW_VERSION}"
    - task: CmdLine@2
      displayName: Getting dev build version
      name: versioning
      condition: not(eq(variables['Build.SourceBranch'], 'refs/heads/master'))
      env:
        BUILD_ID: $(Build.BuildId)
        BUILD_NUMBER: $(Build.BuildNumber)
        INCREMENTED_SEM_VER: $(increment_version.NEW_VERSION)
      inputs:
        script: >
          NEW_VERSION="${INCREMENTED_SEM_VER}-${BUILD_NUMBER}-${BUILD_ID}"

          echo "##[debug] NEW_VERSION=${NEW_VERSION}"

          echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]${NEW_VERSION}"

    - task: CmdLine@2
      name: versioning
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
      env:
        NEW_VERSION: $(increment_version.NEW_VERSION)
      inputs:
        script: |
          echo "##vso[task.setvariable variable=NEW_VERSION;isOutput=true]$NEW_VERSION"
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
  - pipeline_init
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  - name: PROPERTIES_FILE_NAME
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.PROPERTIES_FILE_NAME'] ]
  - name: ANYPOINT_ENVIRONMENT
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ANYPOINT_ENVIRONMENT'] ]
  - name: ARTIFACT_ID
    value: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: build_test
    displayName: "Build & Test"
    variables:
    - name: SKIP_UNIT_TESTS
      value: $[ ne(variables['Build.SourceBranchName'], 'dev') ]
    - name: EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT
      value: $[ lower(coalesce(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED'], false)) ]
    - name: EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH
      value: $[ lower(containsValue(split(variables['EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BRANCHES'], ','), variables['Build.SourceBranchName'])) ]
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'
    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)
    - task: CmdLine@2
      displayName: Extracting properties from config file
      inputs:
        script: >
          echo "##vso[task.setvariable variable=UNIT_TEST_PROPS]"

          if [ ! -f "src/main/resources/properties/$(PROPERTIES_FILE_NAME)" ]; then
              echo "The file 'src/main/resources/properties/$(PROPERTIES_FILE_NAME)' does not exist."
              exit 0
          fi

          PROPS=$(yq '.unitTestProperties | select (.!=null)' src/main/resources/properties/$(PROPERTIES_FILE_NAME) | tr -d ':' | awk '{print $1}')

          if [ -z "$PROPS" ]; then
              echo "The field 'unitTestProperties' does not exist."
              exit 0
          fi

          for PROP in $PROPS; do
            PROPERTIES_ARGS_STRING="$PROPERTIES_ARGS_STRING -D$PROP=$(yq ".unitTestProperties.$PROP" src/main/resources/properties/$(PROPERTIES_FILE_NAME))"
          done

          echo "##vso[task.setvariable variable=UNIT_TEST_PROPS]${PROPERTIES_ARGS_STRING}"
        workingDirectory: $(Build.SourcesDirectory)
    - task: Maven@4
      condition: eq(variables['isBumpingVersion'], true)
      displayName: 'Setting new version'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'versions:set'
        options: '-DnewVersion=$(NEW_VERSION)'
    - task: CmdLine@2
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], true))
      displayName: Tests config validation
      inputs:
        script: |
          echo "##vso[task.logissue type=warning;] Tests execution was disabled."
          echo "##vso[task.complete result=SucceededWithIssues;]"
    - task: CmdLine@2
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      displayName: Defining unit tests properties
      inputs:
        script: |
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH: $EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH"
          echo "##[debug] EXCLUSIVE_UNIT_TESTS_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
          echo "##[debug] ANYPOINT_ENVIRONMENT: $ANYPOINT_ENVIRONMENT"
          echo "##[debug] ---------------------------------"

          if [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_DEFAULT" == "true" ] || [ "$EXCLUSIVE_UNIT_TESTS_PROPERTIES_ENABLED_BY_BRANCH" == "true" ]; then
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $EXCLUSIVE_UNIT_TESTS_PROPERTIES"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(EXCLUSIVE_UNIT_TESTS_PROPERTIES)"
          else
            echo "##[debug] UNIT_TESTS_ENV_PROPERTIES: $ANYPOINT_ENVIRONMENT"
            echo "##vso[task.setvariable variable=UNIT_TESTS_ENV_PROPERTIES;]$(ANYPOINT_ENVIRONMENT)"
          fi
    - task: Maven@4
      displayName: 'Executing unit tests'
      condition: and(succeeded(), ne(variables['SKIP_UNIT_TESTS'], true))
      # continueOnError: False
      continueOnError: not(eq(variables['Build.SourceBranch'], 'refs/heads/master'))
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean test'
        options: >
          -s $(muleSettings.secureFilePath) -Djava.net.useSystemProxies=true -Dsecurity.key=$(MULE_SECURITY_KEY) -Denv=$(UNIT_TESTS_ENV_PROPERTIES) $(UNIT_TEST_PROPS)
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)
    - task: PublishTestResults@2
      condition: and(succeeded(), eq(variables['SKIP_UNIT_TESTS'], false))
      # continueOnError: False
      continueOnError: not(eq(variables['Build.SourceBranch'], 'refs/heads/master'))
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        publishRunAttachments: false
        failTaskOnFailedTests: true
    - task: Maven@4
      displayName: 'Executing maven build'
      inputs:
        publishJUnitResults: false
        mavenPOMFile: 'pom.xml'
        goals: 'clean install'
        options: >
          -s $(muleSettings.secureFilePath) -Djava.net.useSystemProxies=true -Dsecurity.key=$(MULE_SECURITY_KEY) -Denv=$(ANYPOINT_ENVIRONMENT) -DskipTests=true
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
        HTTP_PROXY: $(PROXY_SQUID_HTTP)
        HTTPS_PROXY: $(PROXY_SQUID_HTTP)
    - task: CopyFiles@2
      displayName: 'Copy to Staging Directory'
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          **/*
          !.git/**/*
          !?/**/*
          !**/*.log
    - task: PublishPipelineArtifact@1
      displayName: 'Publishing pipeline artifact'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: app
        publishLocation: pipeline
- stage: quality_gates
  displayName: "Quality Gates"
  dependsOn:
  - pipeline_init
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: run_sonar_scanner
    displayName: "Running Sonar Scanner"
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: "Get catalog-info.yaml"
      inputs:
        buildType: current
        artifactName: catalog-info
        targetPath: $(System.ArtifactsDirectory)
    - task: CmdLine@2
      displayName: "Extract catalog-info.yaml variables"
      inputs:
        script: |
          if [ ! -f "catalog-info.yaml" ]; then
            echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
            exit 1
          fi

          GOV_APP_ACRONYM="$(yq -r '.metadata.annotations."techarch.governance-app.acronym" | select (.!=null) | downcase' catalog-info.yaml)"
          APP_SYSTEM="$(yq -r 'select(documentIndex == 0) | .spec.system | select (.!=null)' catalog-info.yaml)"
          APP_NAME="$(yq -r 'select(documentIndex == 0) | .metadata.name | select (.!=null)' catalog-info.yaml)"
          SONAR_PROJECT_KEY="$(yq -r 'select(documentIndex == 0) | .metadata.annotations."sonarqube.org/project-key" | select (.!=null)' catalog-info.yaml)"
          K8S_CONFIG="$(yq -r '.metadata.annotations."vivo.io/kubernetes-config" | select (.!=null)' catalog-info.yaml)"
          K8S_DEV="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-dev" | select (.!=null)' catalog-info.yaml)"
          K8S_HML="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-hml" | select (.!=null)' catalog-info.yaml)"
          K8S_PRD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-prd" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE="$(yq -r '.metadata.annotations."vivo.io/kubernetes-namespace" | select (.!=null)' catalog-info.yaml)"
          HELM_RELEASE="$(yq -r '.metadata.annotations."backstage.io/kubernetes-id" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_DEV="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-dev" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_HML="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-hml" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-prd" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_ESTEIRA1="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-esteira1" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_ESTEIRA2="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-esteira2" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PREPROD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-preprod" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRODLIKE="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-prodlike" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRODUCAO="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-producao" | select (.!=null)' catalog-info.yaml)"

          echo "##[debug] GOV_APP_ACRONYM............: ${GOV_APP_ACRONYM}"
          echo "##[debug] APP_SYSTEM.................: ${APP_SYSTEM}"
          echo "##[debug] APP_NAME...................: ${APP_NAME}"
          echo "##[debug] SONAR_PROJECT_KEY..........: ${SONAR_PROJECT_KEY}"
          echo "##[debug] K8S_CONFIG.................: ${K8S_CONFIG}"
          echo "##[debug] K8S_DEV....................: ${K8S_DEV}"
          echo "##[debug] K8S_HML....................: ${K8S_HML}"
          echo "##[debug] K8S_PRD....................: ${K8S_PRD}"
          echo "##[debug] K8S_NAMESPACE..............: ${K8S_NAMESPACE}"
          echo "##[debug] HELM_RELEASE...............: ${HELM_RELEASE}"
          echo "##[debug] K8S_NAMESPACE_DEV..........: ${K8S_NAMESPACE_DEV}"
          echo "##[debug] K8S_NAMESPACE_HML..........: ${K8S_NAMESPACE_HML}"
          echo "##[debug] K8S_NAMESPACE_PRD..........: ${K8S_NAMESPACE_PRD}"
          echo "##[debug] K8S_NAMESPACE_ESTEIRA1.....: ${K8S_NAMESPACE_ESTEIRA1}"
          echo "##[debug] K8S_NAMESPACE_ESTEIRA2.....: ${K8S_NAMESPACE_ESTEIRA2}"
          echo "##[debug] K8S_NAMESPACE_PREPROD......: ${K8S_NAMESPACE_PREPROD}"
          echo "##[debug] K8S_NAMESPACE_PRODLIKE.....: ${K8S_NAMESPACE_PRODLIKE}"
          echo "##[debug] K8S_NAMESPACE_PRODUCAO.....: ${K8S_NAMESPACE_PRODUCAO}"

          echo "##vso[task.setvariable variable=GOV_APP_ACRONYM]${GOV_APP_ACRONYM}"
          echo "##vso[task.setvariable variable=APP_SYSTEM]${APP_SYSTEM}"
          echo "##vso[task.setvariable variable=APP_NAME]${APP_NAME}"
          echo "##vso[task.setvariable variable=SONAR_PROJECT_KEY]${SONAR_PROJECT_KEY}"
          echo "##vso[task.setvariable variable=K8S_CONFIG]${K8S_CONFIG}"
          echo "##vso[task.setvariable variable=K8S_DEV]${K8S_DEV}"
          echo "##vso[task.setvariable variable=K8S_HML]${K8S_HML}"
          echo "##vso[task.setvariable variable=K8S_PRD]${K8S_PRD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE]${K8S_NAMESPACE}"
          echo "##vso[task.setvariable variable=HELM_RELEASE]${HELM_RELEASE}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_DEV]${K8S_NAMESPACE_DEV}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_HML]${K8S_NAMESPACE_HML}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRD]${K8S_NAMESPACE_PRD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA1]${K8S_NAMESPACE_ESTEIRA1}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA2]${K8S_NAMESPACE_ESTEIRA2}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PREPROD]${K8S_NAMESPACE_PREPROD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODLIKE]${K8S_NAMESPACE_PRODLIKE}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODUCAO]${K8S_NAMESPACE_PRODUCAO}"
        workingDirectory: $(System.ArtifactsDirectory)
    - task: SonarQubePrepare@7
      displayName: 'Prepare analysis on SonarQube'
      inputs:
        SonarQube: '$(SONARQUBE_SERVICE_CONNECTION_NAME)'
        scannerMode: CLI
        cliVersion: '$(SONARQUBE_CLI_VERSION)'
        configFile: '$(Build.SourcesDirectory)/.azuredevops/sonar-project.properties'
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(Build.SourcesDirectory)
          sonar.projectKey=$(SONAR_PROJECT_KEY)
          sonar.projectName=$(System.TeamProject)-$(Build.Repository.Name)
          sonar.projectVersion=$(NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300
          sonar.lang.patterns.xml=$(SONAR_LANG_PATTERNS_XML)
          sonar.lang.patterns.mule=$(SONAR_LANG_PATTERNS_MULE)
          sonar.mule.file.suffixes=$(SONAR_MULE_FILE_SUFFIXES)
          sonar.exclusion=$(SONAR_MULE_EXCLUSIONS)
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
    - task: SonarQubeAnalyze@7
      displayName: 'Run Code Analysis'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: 'openjdk-11.0.2'
    - task: SonarQubePublish@7
      displayName: 'Publish Quality Gate Result'
      continueOnError: true
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
- stage: sca
  displayName: "SCA"
  dependsOn:
  - build_test
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: app_config_keys
    displayName: "Get AppSec Config Keys"
    steps:
    - task: Bash@3
      displayName: "App Configuration Info"
      inputs:
        targetType: inline
        script: >
          echo "##[debug] APP CONFIG ENABLED.............: True"

          echo "##[debug] APP CONFIG SUBSCRIPTION........: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)"

          echo "##[debug] APP CONFIG ENDPOINT............: $(APP_CONFIGURATIN_ENDPOINT)"
    - task: Bash@3
      condition: and( succeeded(), True )
      displayName: 'Generate app configuration keys'
      inputs:
        targetType: inline
        script: |
          source ~/.bashrc

          REPO_ID="`echo $(Build.Repository.ID) | tr '-' '_'`"
          REPO_NAME="$(Build.Repository.Name)"
          TEAM_PROJECT_NAME="$(System.TeamProject)"
          TEAM_PROJECT_ID="`echo $(System.TeamProjectId) | tr '-' '_'`"

          LABEL_GLOBAL="GLOBAL"
          echo "##[debug] LABEL_GLOBAL.......................: $LABEL_GLOBAL"
          KEY_GLOBAL_FORTIFY=$(echo "fortify" | awk 'BEGIN { getline; print toupper($0) }')
          echo "##[debug] KEY_GLOBAL_FORTIFY.................: $KEY_GLOBAL_FORTIFY"
          KEY_GLOBAL_DEPENDENCY_TRACK=$(echo "dependency_track" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_DT_DOCKER=$(echo "dt_docker" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_CONVISO=$(echo "conviso" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_CHECKMARX=$(echo "checkmarx" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_SKIP_SECURITY_GATE=$(echo "skip_security_gate" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca" | awk 'BEGIN { getline; print toupper($0) }')

          LABEL_PROJECT="$TEAM_PROJECT_NAME"
          KEY_PROJECT_FORTIFY=$(echo "fortify_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_DEPENDENCY_TRACK=$(echo "dependency_track_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_DT_DOCKER=$(echo "dt_docker_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_CONVISO=$(echo "conviso_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_CHECKMARX=$(echo "checkmarx_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')

          LABEL_COMPONENT="$TEAM_PROJECT_NAME/$REPO_NAME"
          KEY_COMPONENT_FORTIFY=$(echo "fortify_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_DEPENDENCY_TRACK=$(echo "dependency_track_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_DT_DOCKER=$(echo "dt_docker_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_CONVISO=$(echo "conviso_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_CHECKMARX=$(echo "checkmarx_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')

          echo "##[debug] KEY_GLOBAL_CONVISO.................: $KEY_GLOBAL_CONVISO"
          echo "##[debug] KEY_GLOBAL_CHECKMARX...............: $KEY_GLOBAL_CHECKMARX"
          echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE......: $KEY_GLOBAL_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE_SCA..: $KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##[debug] LABEL_PROJECT......................: $LABEL_PROJECT"
          echo "##[debug] KEY_PROJECT_FORTIFY................: $KEY_PROJECT_FORTIFY"
          echo "##[debug] KEY_PROJECT_DEPENDENCY_TRACK.......: $KEY_PROJECT_DEPENDENCY_TRACK"
          echo "##[debug] KEY_PROJECT_DT_DOCKER..............: $KEY_PROJECT_DT_DOCKER"
          echo "##[debug] KEY_PROJECT_CONVISO................: $KEY_PROJECT_CONVISO"
          echo "##[debug] KEY_PROJECT_CHECKMARX..............: $KEY_PROJECT_CHECKMARX"
          echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE.....: $KEY_PROJECT_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE_SCA.: $KEY_PROJECT_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##[debug] LABEL_COMPONENT....................: $LABEL_COMPONENT"
          echo "##[debug] KEY_COMPONENT_FORTIFY..............: $KEY_COMPONENT_FORTIFY"
          echo "##[debug] KEY_COMPONENT_DEPENDENCY_TRACK.....: $KEY_COMPONENT_DEPENDENCY_TRACK"
          echo "##[debug] KEY_COMPONENT_DT_DOCKER............: $KEY_COMPONENT_DT_DOCKER"
          echo "##[debug] KEY_COMPONENT_CONVISO..............: $KEY_COMPONENT_CONVISO"
          echo "##[debug] KEY_COMPONENT_CHECKMARX............: $KEY_COMPONENT_CHECKMARX"
          echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE...: $KEY_COMPONENT_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE_SCA: $KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##vso[task.setvariable variable=OUT_LABEL_GLOBAL]$LABEL_GLOBAL"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_FORTIFY]$KEY_GLOBAL_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_DEPENDENCY_TRACK]$KEY_GLOBAL_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_DT_DOCKER]$KEY_GLOBAL_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CONVISO]$KEY_GLOBAL_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CHECKMARX]$KEY_GLOBAL_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE]$KEY_GLOBAL_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA]$KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"

          echo "##vso[task.setvariable variable=OUT_LABEL_PROJECT]$LABEL_PROJECT"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_FORTIFY]$KEY_PROJECT_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_DEPENDENCY_TRACK]$KEY_PROJECT_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_DT_DOCKER]$KEY_PROJECT_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CONVISO]$KEY_PROJECT_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CHECKMARX]$KEY_PROJECT_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE]$KEY_PROJECT_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA]$KEY_PROJECT_SKIP_SECURITY_GATE_SCA"

          echo "##vso[task.setvariable variable=OUT_LABEL_COMPONENT]$LABEL_COMPONENT"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_FORTIFY]$KEY_COMPONENT_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_DEPENDENCY_TRACK]$KEY_COMPONENT_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_DT_DOCKER]$KEY_COMPONENT_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CONVISO]$KEY_COMPONENT_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CHECKMARX]$KEY_COMPONENT_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE]$KEY_COMPONENT_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA]$KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
    - task: AzureAppConfiguration@8
      displayName: 'Download app configuration keys'
      condition: and( succeeded(), True )
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        Label: '$(OUT_LABEL_GLOBAL),$(OUT_LABEL_PROJECT),$(OUT_LABEL_COMPONENT)'
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      condition: and( succeeded(), True )
      displayName: 'Validate app configuration keys'
      inputs:
        targetType: inline
        script: |
          source ~/.bashrc

          get_app_configuration_key() {
              VAR_NAME="$1";
              DEFAULT_VALUE="$2"
              eval VAR_VALUE="\$$VAR_NAME";
              [ -z "$VAR_VALUE" ] && echo "$DEFAULT_VALUE" || echo "$VAR_VALUE"
          }

          GLOBAL_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_FORTIFY "true"`
          GLOBAL_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_DEPENDENCY_TRACK "true"`
          GLOBAL_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_DT_DOCKER "true"`
          GLOBAL_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CONVISO "true"`
          GLOBAL_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CHECKMARX "false"`
          GLOBAL_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE "false"`
          GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA "false"`

          PROJECT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_FORTIFY "true"`
          PROJECT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_DEPENDENCY_TRACK "true"`
          PROJECT_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_DT_DOCKER "true"`
          PROJECT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CONVISO "true"`
          PROJECT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CHECKMARX "false"`
          PROJECT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE "false"`
          PROJECT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA "false"`

          COMPONENT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_FORTIFY "true"`
          COMPONENT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_DEPENDENCY_TRACK "true"`
          COMPONENT_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_DT_DOCKER "false"`
          COMPONENT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CONVISO "true"`
          COMPONENT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CHECKMARX "false"`
          COMPONENT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE "false"`
          COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA "true"`

          echo "##[debug] GLOBAL VARIABLES"
          echo "##[debug] OUT_KEY_GLOBAL_FORTIFY.................: $GLOBAL_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_DEPENDENCY_TRACK........: $GLOBAL_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_DT_DOCKER...............: $GLOBAL_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_CONVISO.................: $GLOBAL_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_CHECKMARX...............: $GLOBAL_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE......: $GLOBAL_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA..: $GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          echo "##[debug] PROJECT VARIABLES"
          echo "##[debug] OUT_KEY_PROJECT_FORTIFY................: $PROJECT_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_DEPENDENCY_TRACK.......: $PROJECT_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_DT_DOCKER..............: $PROJECT_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_CONVISO................: $PROJECT_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_CHECKMARX..............: $PROJECT_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE.....: $PROJECT_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA.: $PROJECT_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          echo "##[debug] COMPONENT VARIABLES"
          echo "##[debug] OUT_KEY_COMPONENT_FORTIFY..............: $COMPONENT_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_DEPENDENCY_TRACK.....: $COMPONENT_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_DT_DOCKER............: $COMPONENT_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_CONVISO..............: $COMPONENT_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_CHECKMARX............: $COMPONENT_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE...: $COMPONENT_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA: $COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          cat <<EOF > ${AGENT_TEMPDIRECTORY}/app_config_vars.json
          {
            "items": [
              {"key": "$OUT_KEY_GLOBAL_FORTIFY","value": "$GLOBAL_FORTIFY_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_DEPENDENCY_TRACK","value": "$GLOBAL_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_DT_DOCKER","value": "$GLOBAL_DT_DOCKER_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_CONVISO","value": "$GLOBAL_CONVISO_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_CHECKMARX","value": "$GLOBAL_CHECKMARX_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE","value": "$GLOBAL_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA","value": "$GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_FORTIFY", "value": "$PROJECT_FORTIFY_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_DEPENDENCY_TRACK", "value": "$PROJECT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_DT_DOCKER", "value": "$PROJECT_DT_DOCKER_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_CONVISO","value": "$PROJECT_CONVISO_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_CHECKMARX","value": "$PROJECT_CHECKMARX_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE","value": "$PROJECT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA","value": "$PROJECT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_FORTIFY","value": "$COMPONENT_FORTIFY_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_DEPENDENCY_TRACK","value": "$COMPONENT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_DT_DOCKER","value": "$COMPONENT_DT_DOCKER_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_CONVISO","value": "$COMPONENT_CONVISO_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_CHECKMARX","value": "$COMPONENT_CHECKMARX_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE","value": "$COMPONENT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA","value": "$COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}}
            ]
          }
          EOF
    - task: AzureAppConfigurationPush@7
      displayName: 'Push app configuration keys'
      condition: and( succeeded(), True )
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        ConfigurationFile: '$(Agent.TempDirectory)/app_config_vars.json'
        FileContentProfile: appconfig/kvset
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      condition: succeeded()
      displayName: 'Evaluate security flags'
      name: evaluate_flags
      inputs:
        targetType: inline
        script: "source ~/.bashrc\n\ngetvar() {\n    VAR_NAME=\"$1\"; \n    eval VAR_VALUE=\"\\$$VAR_NAME\"; \n    [ -z \"$VAR_VALUE\" ] && echo \"false\" || echo \"$VAR_VALUE\"\n}\n\nUSE_FORTIFY=false\nUSE_DEPENDENCY_TRACK=false\nUSE_DT_DOCKER=false\nUSE_CONVISO=false\nUSE_CHECKMARX=false\nSKIP_GATE=false\nSKIP_GATE_SCA=false\nUSE_APPCONFIG=\"True\"\n\nif [[ \"$USE_APPCONFIG\" =~ ^(T|t)rue$ ]]; then\n  # FORTIFY SETTING\n  FORTIFY_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_FORTIFY)\"\n  FORITFY_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_FORTIFY\" )\"\n  FORTIFY_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_FORTIFY)\"\n  if [ \"$FORTIFY_GLOBAL\" = \"true\" ] && [ \"$FORITFY_PROJECT\" = \"true\" ] && [ \"$FORTIFY_COMPONENT\" = \"true\" ]; then\n      USE_FORTIFY=true\n  fi\n\n  # DEPENDENCY_TRACK SETTING\n  DEPENDENCY_TRACK_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_DEPENDENCY_TRACK)\"\n  DEPENDENCY_TRACK_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_DEPENDENCY_TRACK\" )\"\n  DEPENDENCY_TRACK_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_DEPENDENCY_TRACK)\"\n  if [ \"$DEPENDENCY_TRACK_GLOBAL\" = \"true\" ] && [ \"$DEPENDENCY_TRACK_PROJECT\" = \"true\" ] && [ \"$DEPENDENCY_TRACK_COMPONENT\" = \"true\" ]; then\n      USE_DEPENDENCY_TRACK=true\n  fi      \n\n  # DT_DOCKER SETTING\n  DT_DOCKER_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_DT_DOCKER)\"\n  DT_DOCKER_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_DT_DOCKER\" )\"\n  DT_DOCKER_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_DT_DOCKER)\"\n  if [ \"$DT_DOCKER_GLOBAL\" = \"true\" ] && [ \"$DT_DOCKER_PROJECT\" = \"true\" ] && [ \"$DT_DOCKER_COMPONENT\" = \"true\" ]; then\n      USE_DT_DOCKER=true\n  fi             \n  \n  # CONVISO SETTING\n  CONVISO_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_CONVISO)\"\n  CONVISO_PROJECT=\"$(getvar $OUT_KEY_PROJECT_CONVISO)\"\n  CONVISO_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_CONVISO)\"\n  if [ \"$CONVISO_GLOBAL\" = \"true\" ] && [ \"$CONVISO_PROJECT\" = \"true\" ] && [ \"$CONVISO_COMPONENT\" = \"true\" ]  && [ \"$USE_FORTIFY\" = \"true\" ]; then\n      USE_CONVISO=true\n  fi\n  \n  # CHECKMARX SETTING\n  CHECKMARX_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_CHECKMARX)\"\n  CHECKMARX_PROJECT=\"$(getvar $OUT_KEY_PROJECT_CHECKMARX)\"\n  CHECKMARX_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_CHECKMARX)\"\n  if [ \"$CHECKMARX_GLOBAL\" = \"true\" ] && [ \"$CHECKMARX_PROJECT\" = \"true\" ] && [ \"$CHECKMARX_COMPONENT\" = \"true\" ]; then\n      USE_CHECKMARX=true\n      USE_FORTIFY=false\n      USE_CONVISO=false\n  fi\n\n  # SKIP_SECURITY_GATE SETTING\n  SKIP_SECURITY_GATE_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE)\"\n  SKIP_SECURITY_GATE_PROJECT=\"$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE)\"\n  SKIP_SECURITY_GATE_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE)\"\n  if [ \"$SKIP_SECURITY_GATE_GLOBAL\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_PROJECT\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_COMPONENT\" = \"true\" ]; then\n      SKIP_GATE=true\n  fi\n\n  # SKIP_SECURITY_GATE_SCA SETTING\n  SKIP_SECURITY_GATE_SCA_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA)\"\n  SKIP_SECURITY_GATE_SCA_PROJECT=\"$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA)\"\n  SKIP_SECURITY_GATE_SCA_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA)\"\n  if [ \"$SKIP_SECURITY_GATE_SCA_GLOBAL\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_SCA_PROJECT\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_SCA_COMPONENT\" = \"true\" ]; then\n      SKIP_GATE_SCA=true\n  fi        \n\n  echo \"##[debug] GLOBAL VARIABLES ###########################################\"\n  echo \"##[debug] FORTIFY_GLOBAL................: $FORTIFY_GLOBAL\"\n  echo \"##[debug] DEPENDENCY_TRACK_GLOBAL.......: $DEPENDENCY_TRACK_GLOBAL\"\n  echo \"##[debug] DT_DOCKER_GLOBAL..............: $DT_DOCKER_GLOBAL\"\n  echo \"##[debug] CONVISO_GLOBAL................: $CONVISO_GLOBAL\"\n  echo \"##[debug] CHECKMARX_GLOBAL..............: $CHECKMARX_GLOBAL\"\n  echo \"##[debug] SKIP_SECURITY_GATE_GLOBAL.....: $SKIP_SECURITY_GATE_GLOBAL\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_GLOBAL.: $SKIP_SECURITY_GATE_SCA_GLOBAL\"\n  echo \"\"\n  \n  echo \"##[debug] PROJECT VARIABLES ###########################################\"\n  echo \"##[debug] FORITFY_PROJECT...............: $FORITFY_PROJECT\"\n  echo \"##[debug] DEPENDENCY_TRACK_PROJECT......: $DEPENDENCY_TRACK_PROJECT\"\n  echo \"##[debug] DT_DOCKER_PROJECT.............: $DT_DOCKER_PROJECT\"\n  echo \"##[debug] CONVISO_PROJECT...............: $CONVISO_PROJECT\"\n  echo \"##[debug] CHECKMARX_PROJECT.............: $CHECKMARX_PROJECT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_PROJECT....: $SKIP_SECURITY_GATE_PROJECT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_PROJECT: $SKIP_SECURITY_GATE_SCA_PROJECT\"\n  echo \"\"\n  \n  echo \"##[debug] COMPONENT VARIABLES #########################################\"\n  echo \"##[debug] FORTIFY_COMPONENT.............: $FORTIFY_COMPONENT\"\n  echo \"##[debug] DEPENDENCY_TRACK_COMPONENT....: $DEPENDENCY_TRACK_COMPONENT\"\n  echo \"##[debug] DT_DOCKER_COMPONENT...........: $DT_DOCKER_COMPONENT\"\n  echo \"##[debug] CONVISO_COMPONENT.............: $CONVISO_COMPONENT\"\n  echo \"##[debug] CHECKMARX_COMPONENT...........: $CHECKMARX_COMPONENT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_COMPONENT..: $SKIP_SECURITY_GATE_COMPONENT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_COMPONENT: $SKIP_SECURITY_GATE_SCA_COMPONENT\"\n  echo \"\"\n  \n  echo \"##[debug] USE_FORTIFY..........: $USE_FORTIFY\"\n  echo \"##[debug] USE_DEPENDENCY_TRACK.: $USE_DEPENDENCY_TRACK\"\n  echo \"##[debug] USE_DT_DOCKER........: $USE_DT_DOCKER\"\n  echo \"##[debug] USE_CONVISO..........: $USE_CONVISO\"\n  echo \"##[debug] USE_CHECKMARX........: $USE_CHECKMARX\"\n  echo \"##[debug] SKIP_SECURITY_GATE...: $SKIP_GATE\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA: $SKIP_GATE_SCA\"\n  echo \"\"\nelse\n  USE_FORTIFY=\"false\"\n  USE_DEPENDENCY_TRACK=\"false\"\n  USE_DT_DOCKER=\"false\"\n  USE_CONVISO=\"false\"\n  USE_CHECKMARX=\"$(USE_CHECKMARX)\"\n  SKIP_GATE=\"$(SKIP_SECURITY_GATE)\"\n  SKIP_GATE_SCA=\"$(SKIP_SECURITY_GATE_SCA)\"\n\n  SKIP_SECURITY=\"$(skip_security)\"\n  SKIP_FORTIFY_GATE=\"$(skip_fortify_gate)\"\n  SKIP_CONVISO_SECURITY_GATE=\"$(SKIP_CONVISO_SECURITY_GATE)\"\n\n  if [ \"$SKIP_SECURITY\" != \"true\" ]; then\n\n    if [ \"$SKIP_FORTIFY_GATE\" != 'true' ]; then\n      USE_FORTIFY=\"true\"\n    fi\n\n    if [ \"$SKIP_CONVISO_SECURITY_GATE\" != 'true' ]; then\n      USE_CONVISO=\"true\"\n    fi\n\n    if [ \"$USE_CHECKMARX\" = 'true' ]; then\n      USE_FORTIFY=\"false\"\n      USE_CONVISO=\"false\"\n    fi\n  else\n    USE_CHECKMARX=\"false\"\n  fi\n\n  echo \"##[debug] SKIP_SECURITY...............: $SKIP_SECURITY\"\n  echo \"##[debug] SKIP_FORTIFY_GATE...........: $SKIP_FORTIFY_GATE\"\n  echo \"##[debug] SKIP_CONVISO_SECURITY_GATE..: $SKIP_CONVISO_SECURITY_GATE\"\n  echo \"\"\n\n  echo \"##[debug] USE_FORTIFY..........: $USE_FORTIFY\"\n  echo \"##[debug] USE_DEPENDENCY_TRACK.: $USE_DEPENDENCY_TRACK\"\n  echo \"##[debug] USE_DT_DOCKER........: $USE_DT_DOCKER\"\n  echo \"##[debug] USE_CONVISO..........: $USE_CONVISO\"\n  echo \"##[debug] USE_CHECKMARX........: $USE_CHECKMARX\"\n  echo \"##[debug] SKIP_SECURITY_GATE...: $SKIP_GATE\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA: $SKIP_GATE_SCA\"\n  echo \"\"\nfi\n\necho \"##vso[task.setvariable variable=USE_FORTIFY;isOutput=true;]$USE_FORTIFY\"\necho \"##vso[task.setvariable variable=USE_DEPENDENCY_TRACK;isOutput=true;]$USE_DEPENDENCY_TRACK\"\necho \"##vso[task.setvariable variable=USE_DT_DOCKER;isOutput=true;]$USE_DT_DOCKER\"\necho \"##vso[task.setvariable variable=USE_CONVISO;isOutput=true;]$USE_CONVISO\"\necho \"##vso[task.setvariable variable=USE_CHECKMARX;isOutput=true;]$USE_CHECKMARX\"\necho \"##vso[task.setvariable variable=SKIP_SECURITY_GATE;isOutput=true;]$SKIP_GATE\"\necho \"##vso[task.setvariable variable=SKIP_SECURITY_GATE_SCA;isOutput=true;]$SKIP_GATE_SCA\"\n"
  - job: sca_scan
    dependsOn:
    - app_config_keys
    variables:
    - name: USE_DEPENDENCY_TRACK
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DEPENDENCY_TRACK'] ]
    - name: USE_CONVISO
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
    - name: SKIP_SECURITY_GATE
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
    - name: USE_DT_DOCKER
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_DT_DOCKER'] ]
    - name: SCA_BUILD_ARTIFACT
      value: true
    condition: and( succeeded(), eq(variables.USE_DEPENDENCY_TRACK, 'true'), eq(variables.flowIsToReview, true), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) )
    displayName: "SCA Scan"
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'DEPENDENCY-TRACK-TOKEN, CONVISO-API-KEY'
      condition: and(eq(variables['DEPENDENCY-TRACK-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''))
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: app
        path: '$(Pipeline.Workspace)/downloaded'
      condition: eq(variables.SCA_BUILD_ARTIFACT, 'true')
    - task: Bash@3
      displayName: About Stage
      inputs:
        targetType: inline
        script: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'

          echo ' ================================================================================================================================'
          echo '|                                                      _____             _______                                                 |'
          echo '|                                    /\               / ____|           |__   __|                                                |'
          echo '|                                   /  \   _ __  _ __| (___   ___  ___     | | ___  __ _ _ __ ___                                |'
          echo '|                                  / /\ \ |  _ \|  _ \\___ \ / _ \/ __|    | |/ _ \/ _  |  _   _ \                               |'
          echo '|                                 / ____ \| |_) | |_) |___) |  __/ (__     | |  __/ (_| | | | | | |                              |'
          echo '|                                /_/    \_\ .__/| .__/_____/ \___|\___|    |_|\___|\__,_|_| |_| |_|                              |'
          echo '|                                         | |   | |                                                                              |'
          echo '|                                         |_|   |_|                                                                              |'
          echo ' ================================================================================================================================'
          echo "                                                                                                      powered by Vivo AppSec Team"
          echo ""

          printf "
          =================================================================================================================================
          ${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME}
          =================================================================================================================================

          ${MESSAGE}

          ${YELLOW}O objetivo desse estágio é avaliar se existem vulnerabilidades nas dependências e bibliotecas de terceiros utilizadas nessa aplicação.
          ${YELLOW}Em caso de dúvidas sobre essa fase do pipeline acesse a documentação https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659

          =================================================================================================================================
          "
    - task: Bash@3
      displayName: Run Scan and Send syft report to Dependency Track
      env:
        DT_SCA_ENDPOINT: $(DT_SCA_ENDPOINT)
        CACORP_LOCATION: $(CACORP_LOCATION)
        DT_TOKEN: $(DEPENDENCY-TRACK-TOKEN)
        DT_PROJECT_ID: $(DT_PROJECT_ID)
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        SG_SEVERITY: "0"
      inputs:
        targetType: inline
        script: "echo \"##[debug]Getting SYFT Tool...\"\ncurl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /devops/syft v1.19.0\n\necho \"##[debug]SYFT Version: \"\n/devops/syft/syft --version\n\nif [ \"${SCA_BUILD_ARTIFACT}\" = \"true\" ]; then\n  if [ -f \"$(Pipeline.Workspace)/downloaded/app.tar.gz\" ]; then\n    echo \"##[debug]Running syft for Artifact (TAR.GZ) ...\"\n    TMPDIR=$(Agent.TempDirectory) /devops/syft/syft $(Pipeline.Workspace)/downloaded/app.tar.gz --verbose -o cyclonedx-json=raw_cyclonedx_report.json\n   else\n    echo \"##[debug]Running syft for Artifact (TAR) ...\"\n    TMPDIR=$(Agent.TempDirectory) /devops/syft/syft scan $(Pipeline.Workspace)/downloaded/app.tar --verbose -o cyclonedx-json=raw_cyclonedx_report.json\n  fi\nelse    \n  echo \"##[debug]Running syft for repo (DIRECTORY) ...\"\n  TMPDIR=$(Agent.TempDirectory) /devops/syft/syft scan dir:. --verbose -o cyclonedx-json=raw_cyclonedx_report.json\nfi    \n\njq 'if .components then .components |= unique_by(.name,.version) else . end' raw_cyclonedx_report.json > cyclonedx_report.json  \n\nif [ -e \"cyclonedx_report.json\" ]; then\n  echo \"##[debug]Scan completed.\"\nelse\n  echo \"##[debug]Scan fail.\"\n  exit 1\nfi\n\necho \"##[debug]Uploading BOM to DT...\"\n\nBOMCONTENT=$(cat cyclonedx_report.json | base64 -w 0)\nODTFILE=\"bom_payload.json\"\n\necho \"Nome do projeto: ${DT_APP_DEFAULT_NAME}\"\necho \"Versão: ${DT_APP_DEFAULT_VERSION}\"\necho \"Docker registry: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)\"\n\nPAYLOAD='{ \"projectName\": \"'${DT_APP_DEFAULT_NAME}'\", \"projectVersion\": \"'${DT_APP_DEFAULT_VERSION}'\", \"autoCreate\": true, \"bom\": \"'${BOMCONTENT}'\" }'\n\necho -n $PAYLOAD > $ODTFILE\n\nRESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n            -X PUT \"${DT_SCA_ENDPOINT}/v1/bom\" \\\n            -H \"X-API-Key: ${DT_TOKEN}\" \\\n            -H 'Content-Type: application/json' \\\n            -d \"@${ODTFILE}\")\n\necho \"##[debug]Uploaded! Response: ${RESPONSE}\"\n\nsbomToken=$(jq -r '.token' <<< \"$RESPONSE\")\n\necho \"##[debug]Moving SBOM to Artifacts directory...\"\n\nmv raw_cyclonedx_report.json $(Build.ArtifactStagingDirectory)/    \n\ni=\"0\"\nretries=\"25\"\necho \"Aguardando Sincronização finalizar\"\nwhile [[ $i -lt $retries ]]\ndo\n\nRESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n             -X GET \"${DT_SCA_ENDPOINT}/v1/bom/token/${sbomToken}\" \\\n             -H \"X-API-Key: ${DT_TOKEN}\" \\\n             -H 'Content-Type: application/json')\n\necho \"##[debug]Status de processamento: ${RESPONSE}\"\n\n  if [[ \"$(jq -r '.processing' <<< \"$RESPONSE\")\" == \"false\" ]]\n  then\n      echo \"Sincronização finalizada com sucesso\"\n\n      DT_APP_DEFAULT_NAME=\"${DT_APP_DEFAULT_NAME// /%20}\"\n\n      RESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n                   -X GET \"${DT_SCA_ENDPOINT}/v1/project/lookup?name=${DT_APP_DEFAULT_NAME}&version=${DT_APP_DEFAULT_VERSION}\" \\\n                   -H \"X-API-Key: ${DT_TOKEN}\" \\\n                   -H 'Content-Type: application/json')\n\n      echo \"##[debug]Valor do Lookup: ${RESPONSE}\"\n\n      DT_PROJECT_ID=$(jq -r '.uuid' <<< \"$RESPONSE\")\n\n      gateValidation=$(jq -r '.metrics.policyViolationsSecurityUnaudited' <<< \"$RESPONSE\")\n\n      echo \"##[debug]Valor do UUID: ${DT_PROJECT_ID}\"\n\n      echo \"##[debug]Violações não auditadas: ${gateValidation}\"\n\n      echo \"##vso[task.setvariable variable=GATE_VALIDATION]$gateValidation\"\n\n      echo \"##vso[task.setvariable variable=DT_PROJECT_ID]$DT_PROJECT_ID\"          \n\n      if [ \"$gateValidation\" -gt \"${SG_SEVERITY}\" ]; then\n\n       echo \"##vso[task.logissue type=error;]Foram encontradas vulnerabilidades críticas e/ou altas neste projeto. Número de violações identificadas: $gateValidation\"\n\n       SG_BLOCK=\"true\"\n\n       echo \"##vso[task.setvariable variable=sgBlock]$SG_BLOCK\"\n                \n       exit\n      fi\n\n      exit 0\n  fi\n  i=$[$i+1]\n  sleep 15s\n  done  \n\necho \"##vso[task.logissue type=error;]Tempo esgotado - A Sincronização não foi finalizada, tente rodar novamente.\"\necho \"##vso[task.complete result=Failed;]\"\n"
    - task: convisoAzureSyncTask@1
      displayName: "Conviso Sync"
      condition: eq(variables.USE_CONVISO, 'true')
      continueOnError: true
      inputs:
        API_KEY: "$(CONVISO-API-KEY)"
        PROJECT_ID: "$(DT_PROJECT_ID)"
        INTEGRATION: "DEPENDENCY_TRACK"
        COMPANY_ID: "$(CONVISO_COMPANY_ID)"
    - task: PublishBuildArtifacts@1
      displayName: "Publishing SBOM"
      inputs:
        pathToPublish: "$(Build.ArtifactStagingDirectory)/raw_cyclonedx_report.json"
        artifactName: "sbom-artifact"
    - task: Bash@3
      displayName: "Evaluate Security Gate"
      inputs:
        targetType: 'inline'
        script: |2

          echo "SKIP_SECURITY_GATE_SCA: ${SKIP_SECURITY_GATE_SCA}"
          echo "SG_BLOCK: ${SG_BLOCK}"

          if [[ "${SG_BLOCK}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=error;]O Security Gate falhou pois foram encontradas potenciais vulnerabilidades críticas e altas por nossas ferramentas de segurança em código fonte para este projeto. Para mais informações, acesse a wiki do time de AppSec da Vivo em https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659"
            echo "##vso[task.complete result=Failed;]"
            exit
          fi
          echo "##[debug]Não foram encontradas vulnerabilidades críticas e altas que violam as políticas de AppSec. Para mais informações sobre o nosso processo, acesse https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659"
      condition: eq(variables.SKIP_SECURITY_GATE_SCA, 'false')
      env:
        SKIP_SECURITY_GATE_SCA: $(SKIP_SECURITY_GATE)
        SG_BLOCK: "$(sgBlock)"
- stage: security
  displayName: "Security"
  dependsOn:
  - pipeline_init
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: app_config_keys
    displayName: "Get AppSec Config Keys"
    steps:
    - task: Bash@3
      displayName: "App Configuration Info"
      inputs:
        targetType: inline
        script: >
          echo "##[debug] APP CONFIG ENABLED.............: True"

          echo "##[debug] APP CONFIG SUBSCRIPTION........: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)"

          echo "##[debug] APP CONFIG ENDPOINT............: $(APP_CONFIGURATIN_ENDPOINT)"
    - task: Bash@3
      condition: and( succeeded(), True )
      displayName: 'Generate app configuration keys'
      inputs:
        targetType: inline
        script: |
          source ~/.bashrc

          REPO_ID="`echo $(Build.Repository.ID) | tr '-' '_'`"
          REPO_NAME="$(Build.Repository.Name)"
          TEAM_PROJECT_NAME="$(System.TeamProject)"
          TEAM_PROJECT_ID="`echo $(System.TeamProjectId) | tr '-' '_'`"

          LABEL_GLOBAL="GLOBAL"
          echo "##[debug] LABEL_GLOBAL.......................: $LABEL_GLOBAL"
          KEY_GLOBAL_FORTIFY=$(echo "fortify" | awk 'BEGIN { getline; print toupper($0) }')
          echo "##[debug] KEY_GLOBAL_FORTIFY.................: $KEY_GLOBAL_FORTIFY"
          KEY_GLOBAL_DEPENDENCY_TRACK=$(echo "dependency_track" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_DT_DOCKER=$(echo "dt_docker" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_CONVISO=$(echo "conviso" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_CHECKMARX=$(echo "checkmarx" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_SKIP_SECURITY_GATE=$(echo "skip_security_gate" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_GLOBAL_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca" | awk 'BEGIN { getline; print toupper($0) }')

          LABEL_PROJECT="$TEAM_PROJECT_NAME"
          KEY_PROJECT_FORTIFY=$(echo "fortify_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_DEPENDENCY_TRACK=$(echo "dependency_track_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_DT_DOCKER=$(echo "dt_docker_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_CONVISO=$(echo "conviso_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_CHECKMARX=$(echo "checkmarx_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_PROJECT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$TEAM_PROJECT_ID" | awk 'BEGIN { getline; print toupper($0) }')

          LABEL_COMPONENT="$TEAM_PROJECT_NAME/$REPO_NAME"
          KEY_COMPONENT_FORTIFY=$(echo "fortify_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_DEPENDENCY_TRACK=$(echo "dependency_track_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_DT_DOCKER=$(echo "dt_docker_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_CONVISO=$(echo "conviso_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_CHECKMARX=$(echo "checkmarx_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_SKIP_SECURITY_GATE=$(echo "skip_security_gate_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')
          KEY_COMPONENT_SKIP_SECURITY_GATE_SCA=$(echo "skip_security_gate_sca_$REPO_ID" | awk 'BEGIN { getline; print toupper($0) }')

          echo "##[debug] KEY_GLOBAL_CONVISO.................: $KEY_GLOBAL_CONVISO"
          echo "##[debug] KEY_GLOBAL_CHECKMARX...............: $KEY_GLOBAL_CHECKMARX"
          echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE......: $KEY_GLOBAL_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_GLOBAL_SKIP_SECURITY_GATE_SCA..: $KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##[debug] LABEL_PROJECT......................: $LABEL_PROJECT"
          echo "##[debug] KEY_PROJECT_FORTIFY................: $KEY_PROJECT_FORTIFY"
          echo "##[debug] KEY_PROJECT_DEPENDENCY_TRACK.......: $KEY_PROJECT_DEPENDENCY_TRACK"
          echo "##[debug] KEY_PROJECT_DT_DOCKER..............: $KEY_PROJECT_DT_DOCKER"
          echo "##[debug] KEY_PROJECT_CONVISO................: $KEY_PROJECT_CONVISO"
          echo "##[debug] KEY_PROJECT_CHECKMARX..............: $KEY_PROJECT_CHECKMARX"
          echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE.....: $KEY_PROJECT_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_PROJECT_SKIP_SECURITY_GATE_SCA.: $KEY_PROJECT_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##[debug] LABEL_COMPONENT....................: $LABEL_COMPONENT"
          echo "##[debug] KEY_COMPONENT_FORTIFY..............: $KEY_COMPONENT_FORTIFY"
          echo "##[debug] KEY_COMPONENT_DEPENDENCY_TRACK.....: $KEY_COMPONENT_DEPENDENCY_TRACK"
          echo "##[debug] KEY_COMPONENT_DT_DOCKER............: $KEY_COMPONENT_DT_DOCKER"
          echo "##[debug] KEY_COMPONENT_CONVISO..............: $KEY_COMPONENT_CONVISO"
          echo "##[debug] KEY_COMPONENT_CHECKMARX............: $KEY_COMPONENT_CHECKMARX"
          echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE...: $KEY_COMPONENT_SKIP_SECURITY_GATE"
          echo "##[debug] KEY_COMPONENT_SKIP_SECURITY_GATE_SCA: $KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
          echo ""

          echo "##vso[task.setvariable variable=OUT_LABEL_GLOBAL]$LABEL_GLOBAL"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_FORTIFY]$KEY_GLOBAL_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_DEPENDENCY_TRACK]$KEY_GLOBAL_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_DT_DOCKER]$KEY_GLOBAL_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CONVISO]$KEY_GLOBAL_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_CHECKMARX]$KEY_GLOBAL_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE]$KEY_GLOBAL_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA]$KEY_GLOBAL_SKIP_SECURITY_GATE_SCA"

          echo "##vso[task.setvariable variable=OUT_LABEL_PROJECT]$LABEL_PROJECT"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_FORTIFY]$KEY_PROJECT_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_DEPENDENCY_TRACK]$KEY_PROJECT_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_DT_DOCKER]$KEY_PROJECT_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CONVISO]$KEY_PROJECT_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_CHECKMARX]$KEY_PROJECT_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE]$KEY_PROJECT_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA]$KEY_PROJECT_SKIP_SECURITY_GATE_SCA"

          echo "##vso[task.setvariable variable=OUT_LABEL_COMPONENT]$LABEL_COMPONENT"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_FORTIFY]$KEY_COMPONENT_FORTIFY"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_DEPENDENCY_TRACK]$KEY_COMPONENT_DEPENDENCY_TRACK"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_DT_DOCKER]$KEY_COMPONENT_DT_DOCKER"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CONVISO]$KEY_COMPONENT_CONVISO"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_CHECKMARX]$KEY_COMPONENT_CHECKMARX"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE]$KEY_COMPONENT_SKIP_SECURITY_GATE"
          echo "##vso[task.setvariable variable=OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA]$KEY_COMPONENT_SKIP_SECURITY_GATE_SCA"
    - task: AzureAppConfiguration@8
      displayName: 'Download app configuration keys'
      condition: and( succeeded(), True )
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        Label: '$(OUT_LABEL_GLOBAL),$(OUT_LABEL_PROJECT),$(OUT_LABEL_COMPONENT)'
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      condition: and( succeeded(), True )
      displayName: 'Validate app configuration keys'
      inputs:
        targetType: inline
        script: |
          source ~/.bashrc

          get_app_configuration_key() {
              VAR_NAME="$1";
              DEFAULT_VALUE="$2"
              eval VAR_VALUE="\$$VAR_NAME";
              [ -z "$VAR_VALUE" ] && echo "$DEFAULT_VALUE" || echo "$VAR_VALUE"
          }

          GLOBAL_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_FORTIFY "true"`
          GLOBAL_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_DEPENDENCY_TRACK "true"`
          GLOBAL_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_DT_DOCKER "true"`
          GLOBAL_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CONVISO "true"`
          GLOBAL_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_CHECKMARX "false"`
          GLOBAL_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE "false"`
          GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA "false"`

          PROJECT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_FORTIFY "true"`
          PROJECT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_DEPENDENCY_TRACK "true"`
          PROJECT_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_DT_DOCKER "true"`
          PROJECT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CONVISO "true"`
          PROJECT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_CHECKMARX "false"`
          PROJECT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE "false"`
          PROJECT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA "false"`

          COMPONENT_FORTIFY_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_FORTIFY "true"`
          COMPONENT_DEPENDENCY_TRACK_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_DEPENDENCY_TRACK "true"`
          COMPONENT_DT_DOCKER_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_DT_DOCKER "false"`
          COMPONENT_CONVISO_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CONVISO "true"`
          COMPONENT_CHECKMARX_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_CHECKMARX "false"`
          COMPONENT_SKIP_SECURITY_GATE_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE "false"`
          COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE=`get_app_configuration_key $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA "true"`

          echo "##[debug] GLOBAL VARIABLES"
          echo "##[debug] OUT_KEY_GLOBAL_FORTIFY.................: $GLOBAL_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_DEPENDENCY_TRACK........: $GLOBAL_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_DT_DOCKER...............: $GLOBAL_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_CONVISO.................: $GLOBAL_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_CHECKMARX...............: $GLOBAL_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE......: $GLOBAL_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA..: $GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          echo "##[debug] PROJECT VARIABLES"
          echo "##[debug] OUT_KEY_PROJECT_FORTIFY................: $PROJECT_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_DEPENDENCY_TRACK.......: $PROJECT_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_DT_DOCKER..............: $PROJECT_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_CONVISO................: $PROJECT_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_CHECKMARX..............: $PROJECT_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE.....: $PROJECT_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA.: $PROJECT_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          echo "##[debug] COMPONENT VARIABLES"
          echo "##[debug] OUT_KEY_COMPONENT_FORTIFY..............: $COMPONENT_FORTIFY_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_DEPENDENCY_TRACK.....: $COMPONENT_DEPENDENCY_TRACK_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_DT_DOCKER............: $COMPONENT_DT_DOCKER_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_CONVISO..............: $COMPONENT_CONVISO_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_CHECKMARX............: $COMPONENT_CHECKMARX_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE...: $COMPONENT_SKIP_SECURITY_GATE_VALUE"
          echo "##[debug] OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA: $COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE"
          echo ""

          cat <<EOF > ${AGENT_TEMPDIRECTORY}/app_config_vars.json
          {
            "items": [
              {"key": "$OUT_KEY_GLOBAL_FORTIFY","value": "$GLOBAL_FORTIFY_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_DEPENDENCY_TRACK","value": "$GLOBAL_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_DT_DOCKER","value": "$GLOBAL_DT_DOCKER_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_CONVISO","value": "$GLOBAL_CONVISO_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_CHECKMARX","value": "$GLOBAL_CHECKMARX_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE","value": "$GLOBAL_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA","value": "$GLOBAL_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_GLOBAL","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_FORTIFY", "value": "$PROJECT_FORTIFY_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_DEPENDENCY_TRACK", "value": "$PROJECT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_DT_DOCKER", "value": "$PROJECT_DT_DOCKER_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_CONVISO","value": "$PROJECT_CONVISO_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_CHECKMARX","value": "$PROJECT_CHECKMARX_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE","value": "$PROJECT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA","value": "$PROJECT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_PROJECT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_FORTIFY","value": "$COMPONENT_FORTIFY_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_DEPENDENCY_TRACK","value": "$COMPONENT_DEPENDENCY_TRACK_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_DT_DOCKER","value": "$COMPONENT_DT_DOCKER_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_CONVISO","value": "$COMPONENT_CONVISO_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_CHECKMARX","value": "$COMPONENT_CHECKMARX_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE","value": "$COMPONENT_SKIP_SECURITY_GATE_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}},
              {"key": "$OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA","value": "$COMPONENT_SKIP_SECURITY_GATE_SCA_VALUE","label": "$OUT_LABEL_COMPONENT","content_type": null,"tags": {}}
            ]
          }
          EOF
    - task: AzureAppConfigurationPush@7
      displayName: 'Push app configuration keys'
      condition: and( succeeded(), True )
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        ConfigurationFile: '$(Agent.TempDirectory)/app_config_vars.json'
        FileContentProfile: appconfig/kvset
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      condition: succeeded()
      displayName: 'Evaluate security flags'
      name: evaluate_flags
      inputs:
        targetType: inline
        script: "source ~/.bashrc\n\ngetvar() {\n    VAR_NAME=\"$1\"; \n    eval VAR_VALUE=\"\\$$VAR_NAME\"; \n    [ -z \"$VAR_VALUE\" ] && echo \"false\" || echo \"$VAR_VALUE\"\n}\n\nUSE_FORTIFY=false\nUSE_DEPENDENCY_TRACK=false\nUSE_DT_DOCKER=false\nUSE_CONVISO=false\nUSE_CHECKMARX=false\nSKIP_GATE=false\nSKIP_GATE_SCA=false\nUSE_APPCONFIG=\"True\"\n\nif [[ \"$USE_APPCONFIG\" =~ ^(T|t)rue$ ]]; then\n  # FORTIFY SETTING\n  FORTIFY_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_FORTIFY)\"\n  FORITFY_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_FORTIFY\" )\"\n  FORTIFY_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_FORTIFY)\"\n  if [ \"$FORTIFY_GLOBAL\" = \"true\" ] && [ \"$FORITFY_PROJECT\" = \"true\" ] && [ \"$FORTIFY_COMPONENT\" = \"true\" ]; then\n      USE_FORTIFY=true\n  fi\n\n  # DEPENDENCY_TRACK SETTING\n  DEPENDENCY_TRACK_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_DEPENDENCY_TRACK)\"\n  DEPENDENCY_TRACK_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_DEPENDENCY_TRACK\" )\"\n  DEPENDENCY_TRACK_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_DEPENDENCY_TRACK)\"\n  if [ \"$DEPENDENCY_TRACK_GLOBAL\" = \"true\" ] && [ \"$DEPENDENCY_TRACK_PROJECT\" = \"true\" ] && [ \"$DEPENDENCY_TRACK_COMPONENT\" = \"true\" ]; then\n      USE_DEPENDENCY_TRACK=true\n  fi      \n\n  # DT_DOCKER SETTING\n  DT_DOCKER_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_DT_DOCKER)\"\n  DT_DOCKER_PROJECT=\"$(getvar \"$OUT_KEY_PROJECT_DT_DOCKER\" )\"\n  DT_DOCKER_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_DT_DOCKER)\"\n  if [ \"$DT_DOCKER_GLOBAL\" = \"true\" ] && [ \"$DT_DOCKER_PROJECT\" = \"true\" ] && [ \"$DT_DOCKER_COMPONENT\" = \"true\" ]; then\n      USE_DT_DOCKER=true\n  fi             \n  \n  # CONVISO SETTING\n  CONVISO_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_CONVISO)\"\n  CONVISO_PROJECT=\"$(getvar $OUT_KEY_PROJECT_CONVISO)\"\n  CONVISO_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_CONVISO)\"\n  if [ \"$CONVISO_GLOBAL\" = \"true\" ] && [ \"$CONVISO_PROJECT\" = \"true\" ] && [ \"$CONVISO_COMPONENT\" = \"true\" ]  && [ \"$USE_FORTIFY\" = \"true\" ]; then\n      USE_CONVISO=true\n  fi\n  \n  # CHECKMARX SETTING\n  CHECKMARX_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_CHECKMARX)\"\n  CHECKMARX_PROJECT=\"$(getvar $OUT_KEY_PROJECT_CHECKMARX)\"\n  CHECKMARX_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_CHECKMARX)\"\n  if [ \"$CHECKMARX_GLOBAL\" = \"true\" ] && [ \"$CHECKMARX_PROJECT\" = \"true\" ] && [ \"$CHECKMARX_COMPONENT\" = \"true\" ]; then\n      USE_CHECKMARX=true\n      USE_FORTIFY=false\n      USE_CONVISO=false\n  fi\n\n  # SKIP_SECURITY_GATE SETTING\n  SKIP_SECURITY_GATE_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE)\"\n  SKIP_SECURITY_GATE_PROJECT=\"$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE)\"\n  SKIP_SECURITY_GATE_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE)\"\n  if [ \"$SKIP_SECURITY_GATE_GLOBAL\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_PROJECT\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_COMPONENT\" = \"true\" ]; then\n      SKIP_GATE=true\n  fi\n\n  # SKIP_SECURITY_GATE_SCA SETTING\n  SKIP_SECURITY_GATE_SCA_GLOBAL=\"$(getvar $OUT_KEY_GLOBAL_SKIP_SECURITY_GATE_SCA)\"\n  SKIP_SECURITY_GATE_SCA_PROJECT=\"$(getvar $OUT_KEY_PROJECT_SKIP_SECURITY_GATE_SCA)\"\n  SKIP_SECURITY_GATE_SCA_COMPONENT=\"$(getvar $OUT_KEY_COMPONENT_SKIP_SECURITY_GATE_SCA)\"\n  if [ \"$SKIP_SECURITY_GATE_SCA_GLOBAL\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_SCA_PROJECT\" = \"true\" ] || [ \"$SKIP_SECURITY_GATE_SCA_COMPONENT\" = \"true\" ]; then\n      SKIP_GATE_SCA=true\n  fi        \n\n  echo \"##[debug] GLOBAL VARIABLES ###########################################\"\n  echo \"##[debug] FORTIFY_GLOBAL................: $FORTIFY_GLOBAL\"\n  echo \"##[debug] DEPENDENCY_TRACK_GLOBAL.......: $DEPENDENCY_TRACK_GLOBAL\"\n  echo \"##[debug] DT_DOCKER_GLOBAL..............: $DT_DOCKER_GLOBAL\"\n  echo \"##[debug] CONVISO_GLOBAL................: $CONVISO_GLOBAL\"\n  echo \"##[debug] CHECKMARX_GLOBAL..............: $CHECKMARX_GLOBAL\"\n  echo \"##[debug] SKIP_SECURITY_GATE_GLOBAL.....: $SKIP_SECURITY_GATE_GLOBAL\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_GLOBAL.: $SKIP_SECURITY_GATE_SCA_GLOBAL\"\n  echo \"\"\n  \n  echo \"##[debug] PROJECT VARIABLES ###########################################\"\n  echo \"##[debug] FORITFY_PROJECT...............: $FORITFY_PROJECT\"\n  echo \"##[debug] DEPENDENCY_TRACK_PROJECT......: $DEPENDENCY_TRACK_PROJECT\"\n  echo \"##[debug] DT_DOCKER_PROJECT.............: $DT_DOCKER_PROJECT\"\n  echo \"##[debug] CONVISO_PROJECT...............: $CONVISO_PROJECT\"\n  echo \"##[debug] CHECKMARX_PROJECT.............: $CHECKMARX_PROJECT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_PROJECT....: $SKIP_SECURITY_GATE_PROJECT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_PROJECT: $SKIP_SECURITY_GATE_SCA_PROJECT\"\n  echo \"\"\n  \n  echo \"##[debug] COMPONENT VARIABLES #########################################\"\n  echo \"##[debug] FORTIFY_COMPONENT.............: $FORTIFY_COMPONENT\"\n  echo \"##[debug] DEPENDENCY_TRACK_COMPONENT....: $DEPENDENCY_TRACK_COMPONENT\"\n  echo \"##[debug] DT_DOCKER_COMPONENT...........: $DT_DOCKER_COMPONENT\"\n  echo \"##[debug] CONVISO_COMPONENT.............: $CONVISO_COMPONENT\"\n  echo \"##[debug] CHECKMARX_COMPONENT...........: $CHECKMARX_COMPONENT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_COMPONENT..: $SKIP_SECURITY_GATE_COMPONENT\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA_COMPONENT: $SKIP_SECURITY_GATE_SCA_COMPONENT\"\n  echo \"\"\n  \n  echo \"##[debug] USE_FORTIFY..........: $USE_FORTIFY\"\n  echo \"##[debug] USE_DEPENDENCY_TRACK.: $USE_DEPENDENCY_TRACK\"\n  echo \"##[debug] USE_DT_DOCKER........: $USE_DT_DOCKER\"\n  echo \"##[debug] USE_CONVISO..........: $USE_CONVISO\"\n  echo \"##[debug] USE_CHECKMARX........: $USE_CHECKMARX\"\n  echo \"##[debug] SKIP_SECURITY_GATE...: $SKIP_GATE\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA: $SKIP_GATE_SCA\"\n  echo \"\"\nelse\n  USE_FORTIFY=\"false\"\n  USE_DEPENDENCY_TRACK=\"false\"\n  USE_DT_DOCKER=\"false\"\n  USE_CONVISO=\"false\"\n  USE_CHECKMARX=\"$(USE_CHECKMARX)\"\n  SKIP_GATE=\"$(SKIP_SECURITY_GATE)\"\n  SKIP_GATE_SCA=\"$(SKIP_SECURITY_GATE_SCA)\"\n\n  SKIP_SECURITY=\"$(skip_security)\"\n  SKIP_FORTIFY_GATE=\"$(skip_fortify_gate)\"\n  SKIP_CONVISO_SECURITY_GATE=\"$(SKIP_CONVISO_SECURITY_GATE)\"\n\n  if [ \"$SKIP_SECURITY\" != \"true\" ]; then\n\n    if [ \"$SKIP_FORTIFY_GATE\" != 'true' ]; then\n      USE_FORTIFY=\"true\"\n    fi\n\n    if [ \"$SKIP_CONVISO_SECURITY_GATE\" != 'true' ]; then\n      USE_CONVISO=\"true\"\n    fi\n\n    if [ \"$USE_CHECKMARX\" = 'true' ]; then\n      USE_FORTIFY=\"false\"\n      USE_CONVISO=\"false\"\n    fi\n  else\n    USE_CHECKMARX=\"false\"\n  fi\n\n  echo \"##[debug] SKIP_SECURITY...............: $SKIP_SECURITY\"\n  echo \"##[debug] SKIP_FORTIFY_GATE...........: $SKIP_FORTIFY_GATE\"\n  echo \"##[debug] SKIP_CONVISO_SECURITY_GATE..: $SKIP_CONVISO_SECURITY_GATE\"\n  echo \"\"\n\n  echo \"##[debug] USE_FORTIFY..........: $USE_FORTIFY\"\n  echo \"##[debug] USE_DEPENDENCY_TRACK.: $USE_DEPENDENCY_TRACK\"\n  echo \"##[debug] USE_DT_DOCKER........: $USE_DT_DOCKER\"\n  echo \"##[debug] USE_CONVISO..........: $USE_CONVISO\"\n  echo \"##[debug] USE_CHECKMARX........: $USE_CHECKMARX\"\n  echo \"##[debug] SKIP_SECURITY_GATE...: $SKIP_GATE\"\n  echo \"##[debug] SKIP_SECURITY_GATE_SCA: $SKIP_GATE_SCA\"\n  echo \"\"\nfi\n\necho \"##vso[task.setvariable variable=USE_FORTIFY;isOutput=true;]$USE_FORTIFY\"\necho \"##vso[task.setvariable variable=USE_DEPENDENCY_TRACK;isOutput=true;]$USE_DEPENDENCY_TRACK\"\necho \"##vso[task.setvariable variable=USE_DT_DOCKER;isOutput=true;]$USE_DT_DOCKER\"\necho \"##vso[task.setvariable variable=USE_CONVISO;isOutput=true;]$USE_CONVISO\"\necho \"##vso[task.setvariable variable=USE_CHECKMARX;isOutput=true;]$USE_CHECKMARX\"\necho \"##vso[task.setvariable variable=SKIP_SECURITY_GATE;isOutput=true;]$SKIP_GATE\"\necho \"##vso[task.setvariable variable=SKIP_SECURITY_GATE_SCA;isOutput=true;]$SKIP_GATE_SCA\"\n"
  - job: fortify_scan
    dependsOn:
    - app_config_keys
    variables:
    - name: USE_FORTIFY
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_FORTIFY'] ]
    - name: USE_CONVISO
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
    - name: SKIP_SECURITY_GATE
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
    condition: and( succeeded(), and( eq(variables.USE_FORTIFY, 'true'), eq(variables.flowIsToReview, true), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) ) )
    displayName: "Fortify Scan"
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, FORTIFY-SCANCENTRAL-CLIENT-TOKEN, CONVISO-API-KEY'
    - task: Bash@3
      displayName: About Stage
      inputs:
        targetType: inline
        script: "RED='\\033[0;31m'\nGREEN='\\033[0;32m'\nBLUE='\\033[0;34m'\nYELLOW='\\033[1;33m'\nBG_GREEN='\\033[42;1;37m'\n\necho ' ================================================================================================================================'\necho '|                                                      _____             _______                                                 |'\necho '|                                    /\\               / ____|           |__   __|                                                |'\necho '|                                   /  \\   _ __  _ __| (___   ___  ___     | | ___  __ _ _ __ ___                                |'\necho '|                                  / /\\ \\ |  _ \\|  _ \\\\___ \\ / _ \\/ __|    | |/ _ \\/ _  |  _   _ \\                               |'\necho '|                                 / ____ \\| |_) | |_) |___) |  __/ (__     | |  __/ (_| | | | | | |                              |'\necho '|                                /_/    \\_\\ .__/| .__/_____/ \\___|\\___|    |_|\\___|\\__,_|_| |_| |_|                              |'\necho '|                                         | |   | |                                                                              |'\necho '|                                         |_|   |_|                                                                              |'\necho ' ================================================================================================================================'\necho \"                                                                                                      powered by Vivo AppSec Team\"\necho \"\"\n\nprintf \"\n=================================================================================================================================\n${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME} \n=================================================================================================================================\n\n${MESSAGE}\n\n${YELLOW}O objetivo desse estágio é avaliar se existem vulnerabilidades no codigo fonte desta aplicação.\n${YELLOW}Em caso de dúvidas sobre essa fase do pipeline acesse a documentação https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659\n\n=================================================================================================================================\n\"\n"
    - task: AzureAppConfiguration@8
      displayName: "Download configuration keys"
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        KeyFilter: "RT_CONVISO_NEW_INTEGRATION,FORTIFY_LOCAL_SCANCENTRAL_VERSION"
        Label: "VIVO-CORE-PIPELINES"
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: FortifyExclusion
        path: "fortify-exclusions"
        fetchDepth: 1
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 1
    - task: Bash@3
      displayName: "Setup Fortify Exclusions"
      inputs:
        targetType: "inline"
        script: "project_name=\"${SYSTEM_TEAMPROJECT}\"\nrepository_name=\"${BUILD_REPOSITORY_NAME}\"\nexcludeFileParam=\"\"\nexcludel=\"\"\n\n# Workaround para interpretar corretamente a tecnologia das pipelines\ncd \"${repository_name}\"\nAPP_LANGUAGE=\"$(yq -r '.metadata.annotations.\"arqtech.telefonica.com.br/language\" | select (.!=null)' catalog-info.yaml)\"\nfortify_repository_tech=\"${APP_LANGUAGE}\"\ncd ..\n\n# Workaround para evitar interpretação dos wildcards como caminhos em disco\nmkdir -p $(Pipeline.Workspace)/fortify-exclusions/tmp\ncd $(Pipeline.Workspace)/fortify-exclusions/tmp\n\njson=$(jq -c '.' < $(Pipeline.Workspace)/fortify-exclusions/${FORTIFY_EXCLUSION_FILE})\n\n# search exclusions based on (PROJECT/REPOSITORY)\nexcludeList=$(echo \"$json\" | jq -r --arg project_name \"${project_name:-0}\" --arg repository_name \"${repository_name:-0}\" '.[$project_name + \"/\" + $repository_name]')\n\nif [ \"$excludeList\" != \"null\" ]; then\n  excludel=($(grep -oE '\\S+' <<< \"$excludeList\"))\n  echo -e \"\\033[0;32mEXCLUSION KEY: ${project_name}/${repository_name}\"\nelse\n  #seach exclusions based on technology\n  if [[ -n \"$fortify_repository_tech\" && \"$fortify_repository_tech\" != \"null\" ]]; then\n    repository_type=$fortify_repository_tech\n    query_origin=\"Library\"\n    excludeList=$(echo \"$json\" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')\n    if [[ \"$excludeList\" == \"null\" || -z \"$excludeList\" ]]; then\n      echo -e \"Tecnologia ${repository_type} não cadastrada no Regex\"\n      repository_type=\"other\"\n      excludeList=$(echo \"$json\" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')\n    fi\n      excludel=($(grep -oE '\\S+' <<< \"$excludeList\"))\n      echo -e \"\\033[0;32mEXCLUSION KEY: ${repository_type} (FROM: $query_origin)\"\n  else\n    #Usa Other caso a tecnologia nem o nome seja encontrado\n    repository_type=\"other\"\n    excludeList=$(echo \"$json\" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')\n    query_origin=\"Library\"\n    excludel=($(grep -oE '\\S+' <<< \"$excludeList\"))\n    echo -e \"\\033[0;32mEXCLUSION KEY: ${repository_type} (FROM: $query_origin)\"\n  fi \nfi\n\n# validate query\nif [[ -n \"$excludel\" && \"$excludel\" != \"null\" ]]; then\n  echo -e \"\\033[0;32mWILL BE EXCLUDED FROM FORTIFY SCAN:\"\n  for arg in \"${excludel[@]}\"; do\n    excludeFileParam+=\"-exclude \\\"${arg}\\\" \"\n    echo \"[Excluded]: $arg\"\n  done\nelse\n  echo -e \"\\033[0;33m NONE OF THE KEYS WERE FOUND IN THE EXCLUSIONS FILE. KEYS: ${project_name}/${repository_name}, ${repository_type}\"\nfi\n\necho \"##vso[task.setvariable variable=${EXCLUDE_FILE_PARAM_OUT};isreadonly=true]$excludeFileParam\"\n"
      env:
        FORTIFY_EXCLUSION_FILE: "$(FORTIFY_EXCLUSION_FILE)"
        EXCLUDE_FILE_PARAM_OUT: "EXCLUDE_FILE_PARAM"
    - task: Bash@3
      displayName: "Defining App Version"
      inputs:
        targetType: "inline"
        script: |
          if [[ -z "${APP_VERSION}" ]]; then
            echo "Usando a lógica de versão padrão."

            IS_MASTER_OR_MAIN=$(echo ${SOURCE_BRANCH} | grep -Po "master|main")
            if [[ -z "${IS_MASTER_OR_MAIN}" ]] && [[ ${IS_GITFLOW} = [Tt][Rr][Uu][Ee] ]]; then
              APP_VERSION="${FORTIFY_APP_DEFAULT_VERSION}-"$(echo ${SOURCE_BRANCH} | grep -Po "release|develop")
            else
              APP_VERSION="${FORTIFY_APP_DEFAULT_VERSION}"
            fi
          fi

          echo "##vso[task.setvariable variable=${FORTIFY_APP_VERSION_OUT}]$APP_VERSION"
          echo "Exportando a Versão '${APP_VERSION}' da aplicação para variável '${FORTIFY_APP_VERSION_OUT}'."
      env:
        SOURCE_BRANCH: "$(Build.SourceBranch)"
        IS_GITFLOW: True
        FORTIFY_APP_DEFAULT_VERSION: "$(FORTIFY_APP_DEFAULT_VERSION)"
        FORTIFY_APP_VERSION_OUT: "FORTIFY_APP_VERSION"
        APP_VERSION: ''
    - task: Bash@3
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_DEFAULT_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
        FORTIFY_APP_DEFAULT_VERSION: "$(FORTIFY_APP_DEFAULT_VERSION)"
        FORTIFY_APP_VERSION: "$('$(FORTIFY_APP_VERSION_OUT)')"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_PROJECT_ID_OUT: "FORTIFY_PROJECT_ID"
        FORTIFY_PROJECT_VERSION_ID_OUT: "FORTIFY_PROJECT_VERSION_ID"
      displayName: "Getting Fortify Project/Project Version ID"
      inputs:
        targetType: inline
        script: |
          FORTIFY_APP_DEFAULT_NAME="${FORTIFY_APP_DEFAULT_NAME// /%20}"
          FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

          REQUEST_QUERY="project.name:${FORTIFY_APP_DEFAULT_NAME}"
          REQUEST_PARAMS="fields=id,name,project&q=$REQUEST_QUERY"

          RESPONSE=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions?${REQUEST_PARAMS}" \
          --header 'Accept: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          echo "##[debug]RESPONSE....: ${RESPONSE}"

          PROJECT_ID=$(echo $RESPONSE | jq -r '.data[0].project.id // ""')
          PROJECT_VERSION_ID=$(echo $RESPONSE | jq '.data[] | select(.name == "'${FORTIFY_APP_VERSION}'") | .id')
          PROJECT_MAIN_VERSION_ID=$(echo $RESPONSE | jq '.data[] | select(.name == "'${FORTIFY_APP_DEFAULT_VERSION}'") | .id')

          echo "##vso[task.setvariable variable=${FORTIFY_PROJECT_ID_OUT}]$PROJECT_ID"
          echo "Exportando ID do Projeto '${PROJECT_ID}' no Fortify para variável '${FORTIFY_PROJECT_ID_OUT}'."

          echo "##vso[task.setvariable variable=${FORTIFY_PROJECT_VERSION_ID_OUT}]$PROJECT_VERSION_ID"
          echo "Exportando ID da Versão do Projeto '${PROJECT_VERSION_ID}' no Fortify para variável '${FORTIFY_PROJECT_VERSION_ID_OUT}'."

          echo "##vso[task.setvariable variable=fortifyMainProjectVersionId]$PROJECT_MAIN_VERSION_ID"
          echo "Exportando ID da Versão Main/Master do Projeto '${PROJECT_MAIN_VERSION_ID}' no Fortify para variável 'fortifyMainProjectVersionId'."
    - task: Bash@3
      displayName: "Create Fortify Project/Project Version"
      inputs:
        targetType: "inline"
        script: "# Não cria o Projeto/Versão se já existir\nif [[ -n \"${FORTIFY_PROJECT_VERSION_ID}\" ]]; then\n  echo \"Pulando a criação do Projeto/Versão, pois já existem.\"\n  exit 0;\nfi\n\nFORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)\nREQUEST_BODY_PROJECT='{ \n  \"name\": \"'${FORTIFY_APP_DEFAULT_NAME}'\",\n  \"issueTemplateId\": \"Prioritized-HighRisk-Project-Template\",\n  \"auditEnabled\": true\n}'\n\necho \"REQUEST_BODY_PROJECT: $REQUEST_BODY_PROJECT\"\n\n# Caso já exista o Projeto criado, será apenas necessário criar a Versão\nif [[ -n \"${FORTIFY_PROJECT_ID}\" ]]\nthen\n  REQUEST_BODY_PROJECT='{ \"id\": '${FORTIFY_PROJECT_ID}' }'\nfi\nREQUEST_DATA='{\n  \"name\": \"'${FORTIFY_APP_VERSION}'\",\n  \"issueTemplateId\": \"Prioritized-HighRisk-Project-Template\",\n  \"project\": '${REQUEST_BODY_PROJECT}',\n  \"customTagValuesAutoApply\": true,\n  \"autoPredict\": true, \n  \"predictionPolicy\": \"Telefonica-Policy-v2\"\n}'\n\necho \"Criando um Projeto/Versão para a Aplicação\"\nRESPONSE_PROJECT=$(curl --cacert ${CACORP_LOCATION} -s -g \\\n-X POST \"${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions\" \\\n--header 'Accept: application/json' \\\n--header 'Content-Type: application/json' \\\n--header \"Authorization: FortifyToken $FORTIFY_TOKEN\" \\\n--data \"${REQUEST_DATA}\")\n\necho \"RESPONSE_PROJECT: ${RESPONSE_PROJECT}\"\nPROJECT_VERSION_ID=$(echo $RESPONSE_PROJECT | jq .data.id)\nPROJECT_ID=$(echo $RESPONSE_PROJECT | jq .data.project.id)\nif [[ -n \"${PROJECT_VERSION_ID}\" ]]; then\n  echo \"Versão de Projeto '${PROJECT_VERSION_ID}' criada.\"\n  \n  echo \"##vso[task.setvariable variable=${FORTIFY_PROJECT_VERSION_ID_OUT}]$PROJECT_VERSION_ID\"\n  echo \"Exportando ID da Versão do Projeto '${PROJECT_VERSION_ID}' no Fortify para variável '${FORTIFY_PROJECT_VERSION_ID_OUT}'.\"\n  \n  echo \"##vso[task.setvariable variable=${FORTIFY_PROJECT_ID_OUT}]$PROJECT_ID\"\n  echo \"Exportando ID do Projeto '${PROJECT_ID}' no Fortify para variável '${FORTIFY_PROJECT_ID_OUT}'.\"\nelse\n  echo \"Erro ao criar um Projeto/Versão: \"\n  echo $RESPONSE_PROJECT | jq .message\n  exit -1\nfi\n\nif [[ -n ${FORTIFY_MAIN_PROJECT_VERSION_ID} && \"${FORTIFY_MAIN_PROJECT_VERSION_ID}\" != \"${PROJECT_VERSION_ID}\" ]]; then\n  echo \"Copiando State da Versão Main para a atual\"\n  RESPONSE_PROJECT=$(curl --cacert ${CACORP_LOCATION} -s -g \\\n  -X POST \"${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/action/copyCurrentState\" \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: FortifyToken $FORTIFY_TOKEN\" \\\n  --data '{\n    \"previousProjectVersionId\": '${FORTIFY_MAIN_PROJECT_VERSION_ID}',\n    \"projectVersionId\": '${PROJECT_VERSION_ID}'\n  }')\nfi\n"
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_VERSION: "$('$(FORTIFY_APP_VERSION_OUT))"
        FORTIFY_PROJECT_ID: "$('$(FORTIFY_PROJECT_ID_OUT)')"
        FORTIFY_PROJECT_VERSION_ID: "$('$(FORTIFY_PROJECT_VERSION_ID_OUT)')"
        FORTIFY_PROJECT_ID_OUT: "FORTIFY_PROJECT_ID"
        FORTIFY_PROJECT_VERSION_ID_OUT: "FORTIFY_PROJECT_VERSION_ID"
        FORTIFY_MAIN_PROJECT_VERSION_ID: "$(fortifyMainProjectVersionId)"
