        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_PROJECT_ID: "$(FORTIFY_PROJECT_ID)"
        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
        FORTIFY_ATTRIBUTES_FILE_NAME: fortify-attributes
    - task: Bash@3
      displayName: "Run Fortify SAST (client)"
      inputs:
        targetType: "inline"
        script: |
          echo "##[debug]Running Fortify scan with local ScanCentral Client version ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}..."

          SCANCENTRAL_CMD=${FORTIFY_SCANCENTRAL_PATH}${FORTIFY_LOCAL_SCANCENTRAL_VERSION}${FORTIFY_LOCAL_SCANCENTRAL_SCRIPT}

          echo "##[command]${SCANCENTRAL_CMD}"
          echo "##[debug]FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT...: ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT}"
          echo "##[debug]FORTIFY_SSC_ENDPOINT......................: ${FORTIFY_SSC_ENDPOINT}"
          echo "##[debug]EXCLUDE_FILE_PARAM........................: $(EXCLUDE_FILE_PARAM)"
          echo "##[debug]FORTIFY_APP_NAME..........................: ${FORTIFY_APP_NAME}"
          echo "##[debug]FORTIFY_APP_VERSION.......................: ${FORTIFY_APP_VERSION}"

          ${SCANCENTRAL_CMD} -url ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT} -sscurl ${FORTIFY_SSC_ENDPOINT} \
          -ssctoken ${FORTIFY_SSC_CLI_TOKEN} \
          start $(EXCLUDE_FILE_PARAM) -bt none -upload -block \
          --log-file "${FORTIFY_APP_NAME}-${SYSTEM_JOBATTEMPT}-fortify.log" --overwrite \
          --application "${FORTIFY_APP_NAME}" --application-version "${FORTIFY_APP_VERSION}" \
          -uptoken ${FORTIFY_SSC_CLI_TOKEN}

          if [ $? -eq 0 ]; then
            echo "##[debug]Fortify scan completed successfully."
          else
            echo "##vso[task.logissue type=error;] Fortify scan exited with errors."
            echo "##vso[task.complete result=Failed;]"
          fi
      env:
        FORTIFY_SCANCENTRAL_PATH: "$(FORTIFY_LOCAL_SCANCENTRAL_PATH)"
        FORTIFY_LOCAL_SCANCENTRAL_VERSION: "$(FORTIFY_LOCAL_SCANCENTRAL_VERSION)"
        FORTIFY_LOCAL_SCANCENTRAL_SCRIPT: "$(FORTIFY_LOCAL_SCANCENTRAL_SCRIPT)"
        FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT: "$(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT)"
        FORTIFY_SSC_ENDPOINT: $(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
        FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
        SYSTEM_JOBATTEMPT: "$(System.JobAttempt)"
        ASDF_JAVA_VERSION: "openjdk-17.0.2"
    - task: PublishPipelineArtifact@1
      displayName: Publish scan log
      condition: ''
      inputs:
        targetPath: $(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log
        artifactName: fortify-$(System.JobAttempt)
        publishLocation: pipeline
    - task: Bash@3
      displayName: "Get Fortify Report"
      inputs:
        targetType: "inline"
        script: |
          i="0"
          retries="10"
          FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

          echo "Aguardando processamento do Relatório..."

          while [[ $i -lt $retries ]]
          do
            sleep 30s
            RESPONSE_ARTIFACT=$(curl --cacert ${CACORP_LOCATION} -s -g \
            -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/artifacts?limit=1" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: FortifyToken $FORTIFY_TOKEN")

            STATUS=$(echo $RESPONSE_ARTIFACT | jq -r .data[0].status)
            echo "Status atual do processamento: ${STATUS}"

            if [[ "$STATUS" == "REQUIRE_AUTH" ]]
            then
                echo "##vso[task.logissue type=error] Existe uma aprovação pendente no portal do Fortify. Para dar proseguimento com a aprovação entre em contato com o AppSec pelo e-mail(appsec_vivo.br@telefonica.com)"
                exit 1;
            elif [[ "$STATUS" == "PROCESS_COMPLETE" ]]
            then
                echo "Processamento finalizado"
                break
            fi
            i=$[$i+1]
          done

          # Coleta das issues
          echo "Get scan report (Fortify)"

          RESPONSE_ISSUES=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/issues?orderby=id" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          # Variavel ISSUES_COUNT_2 junta todos os status das vulnerabilidades.
          #ISSUES_COUNT=$(echo $RESPONSE_ISSUES | jq --raw-output '.data | group_by(.enginePriority) | map({"prioridade": .[0].enginePriority, "count": length})')
          ISSUES_COUNT_2=$(echo $RESPONSE_ISSUES | jq --raw-output '.data | map({"prioridade": .enginePriority, "avaliado": .issueStatus, "situacoes": .primaryTag, "count": 1})')
          #echo "${ISSUES_COUNT_2}"


          #Variaveis que salvam nao avaliados
          criticas_not_reviewed=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "Critical" and .avaliado == "Unreviewed")] | map(.count) | add' || echo "0")
          altas_not_reviewed=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "High" and .avaliado == "Unreviewed")] | map(.count) | add' || echo "0")

          #Variaveis que salvam as exploitable
          criticas_exploitable=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "Critical" and .situacoes == "Exploitable")] | map(.count) | add' || echo "0")
          altas_exploitable=$(echo $ISSUES_COUNT_2 | jq '[.[] | select(.prioridade == "High" and .situacoes == "Exploitable")] | map(.count) | add' || echo "0")


          #criticas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Critical") | .count' || echo "0")
          #altas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "High") | .count' || echo "0")
          #medias=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Medium") | .count' || echo "0")
          #baixas=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Low") | .count' || echo "0")


          #criticas=$([[ -n $criticas ]] && echo $criticas || echo 0)
          #altas=$([[ -n $altas ]] && echo $altas || echo 0)
          #medias=$([[ -n $medias ]] && echo $medias || echo 0)
          #baixas=$([[ -n $baixas ]] && echo $baixas || echo 0)

          vulns_totais=$((criticas_not_reviewed + altas_not_reviewed + criticas_exploitable + altas_exploitable))
          if [[ $vulns_totais -gt 0 ]]; then
            echo "##vso[task.logissue type=error;]Foram encontradas vulnerabilidades críticas e/ou altas neste projeto. Número de violações identificadas: $((criticas_not_reviewed + altas_not_reviewed + criticas_exploitable + altas_exploitable))"
          else
            echo "Não há violações identificadas"
          fi

          echo "##[command]## List of issues ##"
          echo $RESPONSE_ISSUES | jq -r '.data[] | "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName'

          echo "##vso[task.setvariable variable=vulnerabilidadesCriticasNaoavaliadas;isreadonly=true]$criticas_not_reviewed"
          echo "##vso[task.setvariable variable=vulnerabilidadesAltasNaoavaliadas;isreadonly=true]$altas_not_reviewed"
          echo "##vso[task.setvariable variable=vulnerabilidadesCriticasVulneraveis;isreadonly=true]$criticas_exploitable"
          echo "##vso[task.setvariable variable=vulnerabilidadesAltasVulneraveis;isreadonly=true]$altas_exploitable"
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
    - task: Bash@3
      displayName: "Conviso Associate"
      continueOnError: true
      inputs:
        targetType: "inline"
        script: "if [[ ! \"${CONVISO_FLAG}\" =~ ^(T|t)rue$ ]]; then\n  echo \"##vso[task.logissue type=warning;]A Flag da Conviso está desligada.\"\nelse          \n  #Verificar o conviso_company_id, remover o hardcoded\n  RESPONSE=$(curl -s -S -g -X POST \"${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/associate_project\" \\\n  --proxy \"${PROXY_AGENT_HTTPS}\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n  --data '{\"company_id\": '${CONVISO_COMPANY_ID}',\"project_id\": \"'${FORTIFY_PROJECT_VERSION_ID}'\"}')\n\n  ASSOCIATION_ID=$(echo $RESPONSE | jq .data.id)\n  PROJECT_ID=$(echo $RESPONSE | jq .data.project.id)\n  ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)\n  echo \"##vso[task.setvariable variable=convisoAssetId]$ASSET_ID\"    \n  echo \"##vso[task.setvariable variable=${CONVISO_PROJECT_ID_OUT}]$PROJECT_ID\"\n  echo \"##vso[task.setvariable variable=${CONVISO_ASSOCIATION_ID_OUT}]$ASSOCIATION_ID\"\n\n  #RESPONSE_CODE=$(tail -n1 <<< \"$RESPONSE_RAW\")\n  #echo \"##[debug]RESPONSE_CODE....: ${RESPONSE_CODE}\"\n  echo \"Association ID -> ${ASSOCIATION_ID}\"\n\n  ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')\n  if [[ ! -z \"$ERROR\" ]]; then\n    MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')\n    echo \"##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}\"\n  else\n    echo \"Passou com sucesso\"\n    exit\n  fi\nfi\n"
      env:
        SOURCE_BRANCH: "$(Build.SourceBranch)"
        IS_GITFLOW: True
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        CONVISO_FLAG: $(USE_CONVISO)
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
    - task: Bash@3
      displayName: "Conviso Sync"
      continueOnError: true
      inputs:
        targetType: "inline"
        script: "# Remover result failed | colocar como warning\nif [[ ! \"${CONVISO_FLAG}\" =~ ^(T|t)rue$ ]]; then\n  echo \"##vso[task.logissue type=warning;]A Flag da Conviso está desligada.\"\nelse\n  i=\"0\"\n  retries=\"3\" \n  while [[ $i -lt $retries ]]\n  do\n\n    RESPONSE=$(curl -s -S -g -X POST \"${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize\" \\\n    --proxy \"${PROXY_AGENT_HTTPS}\" \\\n    --header 'Content-Type: application/json' \\\n    --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n    --data '{\"company_id\": '${CONVISO_COMPANY_ID}',\"integration_association_id\": \"'${CONVISO_ASSOCIATION_ID}'\"}')\n    \n    echo \"Response: ${RESPONSE}\"\n\n    if [[ ! -z \"$RESPONSE\" ]]; then\n      break             \n    fi\n    echo \"Algo inesperado aconteceu. Tentando realizar a sincronização novamente. Aguarde...\"\n    sleep 5s\n    i=$[$i+1]\n  done\n\n  TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)\n  ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)\n\n  echo \"Conviso Asset ID: ${ASSET_ID}\"\n\n  if [[ -z \"$ASSET_ID\" ]]; then      \n     echo \"##vso[task.logissue type=error;] An error occurred while requesting Conviso API. Please, try running the pipeline again. If the error persists, contact the AppSec team on appsec_vivo.br@telefonica.com\"\n     exit\n  fi\n\n  echo \"##[debug]Sincronização iniciada com sucesso.\"\n\n  ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')\n  if [[ ! -z \"$ERROR\" ]]; then\n    MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')\n    echo \"##vso[task.logissue type=warning;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}\"\n  else\n    echo \"Passou com sucesso\"\n    exit\n  fi\nfi\n"
      env:
        SOURCE_BRANCH: "$(Build.SourceBranch)"
        IS_GITFLOW: True
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        CONVISO_FLAG: $(USE_CONVISO)
        CONVISO_ASSET_ID: "$(convisoAssetId)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
    - task: Bash@3
      displayName: "Evaluate Security Gate"
      continueOnError: false
      inputs:
        targetType: "inline"
        script: "if [[ ! \"${SKIP_SECURITY_GATE}\" =~ ^(T|t)rue$ ]]; then\n  declare -i vulnerabilidadesCriticasNaoavaliadas=$(vulnerabilidadesCriticasNaoavaliadas)\n  declare -i vulnerabilidadesAltasNaoavaliadas=$(vulnerabilidadesAltasNaoavaliadas)\n  declare -i vulnerabilidadesCriticasVulneraveis=$(vulnerabilidadesCriticasVulneraveis)\n  declare -i vulnerabilidadesAltasVulneraveis=$(vulnerabilidadesAltasVulneraveis)\n\n  if [[ $vulnerabilidadesCriticasNaoavaliadas -gt 0 || $vulnerabilidadesAltasNaoavaliadas -gt 0 || vulnerabilidadesCriticasVulneraveis -gt 0 || vulnerabilidadesAltasVulneraveis -gt 0 ]]; then\n    echo \"##[error]ATENÇÃO! Security Gate não foi atingido devido existência de vulnerabilidades Críticas e/ou Altas!\"\n    echo \"##vso[task.complete result=Failed;]\"\n\n    IS_MASTER_OR_MAIN=$(echo ${SOURCE_BRANCH} | grep -Po \"master|main\")\n    if [[ ! -z \"${IS_MASTER_OR_MAIN}\" ]] && [[ ${IS_GITFLOW} =~ ^(T|t)rue$ ]] || [[ ! ${IS_GITFLOW} =~ ^(T|t)rue$ ]]; then\n      exit 1\n    else\n      echo \"##[debug]A pipeline continuará a execução, dado a seguinte condição:\"\n      echo \"##[debug]Branch Master ou Main: ${SOURCE_BRANCH}\"\n      echo \"##[debug]Modelo SCM GitFlow: ${IS_GITFLOW}\"\n    fi\n\n  else \n    echo \"##[debug]Security Gate atingido!\"\n  fi\nelse\n  echo \"O Gate foi Skipado devido a configuração da Flag\"\nfi\n"
      env:
        SOURCE_BRANCH: "$(Build.SourceBranch)"
        IS_GITFLOW: True
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        FORTIFY_PROJECT_ID: "$(fortifyProjectId)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        CONVISO_FLAG: $(USE_CONVISO)
        SKIP_SECURITY_GATE: $(SKIP_SECURITY_GATE)
    - task: Bash@3
      displayName: Telemetry
      condition: always()
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'

          printf "${YELLOW}=================================================================================================================================
          ${YELLOW}                                                       TELEMETRY
          ${YELLOW}=================================================================================================================================
          Esse step é responsável em enviar alguns dados de execução do pipeline um datalake para posteriomente ser proccesso.
          Em caso de falha deste step o fluxo de execução do pipeline não será interrompido.

          Para saber mais sobre esse step, entre em contato com time de DevOps Corporativo.
          "
          echo "AGENT_JOBNAME=$(Agent.JobName)"
          echo "AGENT_JOBSTATUS=$(Agent.JobStatus)"
          echo "AGENT_MACHINENAME=$(Agent.MachineName)"
          echo "BUILD_BUILDID=$(Build.BuildId)"
          echo "BUILD_BUILDURI=$(Build.BuildUri)"
          echo "BUILD_DEFINITIONNAME=$(Build.DefinitionName)"
          echo "Build_Reason=$(Build.Reason)"
          echo "Build_Repository_Name=$(Build.Repository.Name)"
          echo "Build_RequestedFor=$(Build.RequestedFor)"
          echo "Build_RequestedForEmail=$(Build.RequestedForEmail)"
          echo "Build_SourceBranch=$(Build.SourceBranch)"
          echo "Build_SourceBranchName=$(Build.SourceBranchName)"
          echo "SYSTEM_COLLECTIONURI=$(System.CollectionUri)"
          echo "SYSTEM_JOBATTEMPT=$(System.JobAttempt)"
          echo "SYSTEM_JOBDISPLAYNAME=$(System.JobDisplayName)"
          echo "SYSTEM_JOBNAME=$(System.JobName)"
          echo "SYSTEM_PHASEDISPLAYNAME=$(System.PhaseDisplayName)"
          echo "SYSTEM_PHASENAME=$(System.PhaseName)"
          echo "SYSTEM_STAGEDISPLAYNAME=$(System.StageDisplayName)"
          echo "SYSTEM_STAGENAME=$(System.StageName)"
          echo "SYSTEM_TEAMPROJECT=$(System.TeamProject)"
          echo "SYSTEM_HOSTTYPE=$(System.HostType)"
          echo "SYSTEM_DEFINITIONID=$(System.DefinitionId)"
          echo "SYSTEM_TIMELINEID=$(System.TimelineId)"

          printf "${YELLOW}================================================================================================================================="
  - job: conviso_sync
    dependsOn:
    - fortify_scan
    - app_config_keys
    variables:
    - name: USE_CONVISO
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
    - name: SKIP_SECURITY_GATE
      value: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
    condition: and( succeeded(), eq(variables.USE_CONVISO, 'true'), or ( eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/master'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main') ) )
    displayName: "Conviso Sync"
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, CONVISO-API-KEY'
      condition: and(eq(variables['FORTIFY-SSC-CLI-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''))
    - task: CmdLine@2
      displayName: "Troubleshooting help"
      condition: failed()
      inputs:
        script: |
          if [ "$(Agent.JobStatus)" == "Failed" ]; then
            echo "##[error]Erro na obtenção das credenciais AKV"
            echo ""
            echo "Por favor, reexecute mais uma vez para descartar problemas de rede."
            exit 1
          fi
    - task: AzureAppConfiguration@8
      displayName: 'Download configuration keys'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: $(APP_CONFIGURATION_AZURE_SUBSCRIPTION)
        AppConfigurationEndpoint: $(APP_CONFIGURATIN_ENDPOINT)
        KeyFilter: "RT_CONVISO_NEW_INTEGRATION"
        Label: 'VIVO-CORE-PIPELINES'
      condition: eq(variables['RT_CONVISO_NEW_INTEGRATION'], '')
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_DEFAULT_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
        FORTIFY_APP_DEFAULT_VERSION: "$(FORTIFY_APP_DEFAULT_VERSION)"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
      displayName: "Getting Fortify Project ID"
      inputs:
        targetType: inline
        script: |
          FORTIFY_APP_DEFAULT_NAME="${FORTIFY_APP_DEFAULT_NAME// /%20}"
          FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

          REQUEST_QUERY="project.name:${FORTIFY_APP_DEFAULT_NAME},name:${FORTIFY_APP_DEFAULT_VERSION}"
          REQUEST_PARAMS="fields=id&start=0&limit=200&fulltextsearch=false&includeInactive=false&myAssignedIssues=false&onlyIfHasIssues=false&q=$REQUEST_QUERY"

          RESPONSE=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions?${REQUEST_PARAMS}" \
          --header 'Accept: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          PROJECT_ID=$(echo $RESPONSE | jq .data[0].id)

          echo "##vso[task.setvariable variable=fortifyProjectId]$PROJECT_ID"
          echo "Exportando ID do Projeto '${PROJECT_ID}' no Fortify para variável 'fortifyProjectId'."
    - task: Bash@3
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        FORTIFY_PROJECT_ID: "$(fortifyProjectId)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      displayName: "Getting Conviso Association and Project IDs"
      inputs:
        targetType: inline
        script: |
          sleep 5s
          RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/associate_project" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data '{"company_id": '${CONVISO_COMPANY_ID}',"project_id": "'${FORTIFY_PROJECT_ID}'"}')

          ASSOCIATION_ID=$(echo $RESPONSE | jq .data.id)
          PROJECT_ID=$(echo $RESPONSE | jq .data.project.id)

          ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')
          if [[ ! -z "$ERROR" ]]; then
            MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
            echo "##vso[task.logissue type=error;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
            echo "##vso[task.complete result=Failed;]"
            exit
          fi

          echo "##vso[task.setvariable variable=${CONVISO_PROJECT_ID_OUT}]$PROJECT_ID"
          echo "Exportando ID do Projeto '${PROJECT_ID}' no Conviso para variável '${CONVISO_PROJECT_ID_OUT}'."

          echo "##vso[task.setvariable variable=${CONVISO_ASSOCIATION_ID_OUT}]$ASSOCIATION_ID"
          echo "Exportando ID da Associação '${ASSOCIATION_ID}' do Conviso com o Fortify para variável '${CONVISO_ASSOCIATION_ID_OUT}'."
    - task: Bash@3
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_ASSOCIATION_ID: "$(CONVISO_ASSOCIATION_ID)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      displayName: "Starting Conviso Synchronization and Getting Track Key / Asset ID"
      inputs:
        targetType: inline
        script: "echo \"##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}\"\n\nif [ \"${RT_CONVISO_NEW_INTEGRATION}\" = \"true\" ]; then\n  syncStartDateTime=$(date -u +\"%Y-%m-%dT%H:%M:%S%z\")\n\n  echo \"##vso[task.setvariable variable=SYNC_START_DATE_TIME]$syncStartDateTime\" \n  echo \"##[debug]Exportando Data e Hora atual '${syncStartDateTime}' para variável 'SYNC_START_DATE_TIME'.\"\n\n  sleep 5s\n\n  RESPONSE=$(curl -s -S -g -X POST \"${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize\" \\\n  --proxy \"${PROXY_AGENT_HTTPS}\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n  --data '{\"company_id\": '${CONVISO_COMPANY_ID}',\"integration_association_id\": \"'${CONVISO_ASSOCIATION_ID}'\"}')\n\n  TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)\n  ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)\n\n  echo \"Track ID da Sync '${TRACK_KEY}' do Conviso.\"\n  \n  echo \"##vso[task.setvariable variable=convisoAssetId]$ASSET_ID\"\n  echo \"##[debug]Exportando Asset ID da Sync '${ASSET_ID}' do Conviso para variável 'convisoAssetId'.\"\nelse\n  sleep 5s\n  RESPONSE=$(curl -s -S -g -X POST \"${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize\" \\\n  --proxy \"${PROXY_AGENT_HTTPS}\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n  --data '{\"company_id\": '${CONVISO_COMPANY_ID}',\"integration_association_id\": \"'${CONVISO_ASSOCIATION_ID}'\"}')\n\n  TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)\n  \n  echo \"##vso[task.setvariable variable=convisoTrackId]$TRACK_KEY\"\n  echo \"Exportando Track ID da Sync '${TRACK_KEY}' do Conviso para variável 'convisoTrackId'.\"\nfi\n"
    - task: Bash@3
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_TRACK_KEY: "$(convisoTrackId)"
        CONVISO_ASSET_ID: "$(convisoAssetId)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        SYNC_START_DATE_TIME: "$(syncStartDateTime)"
        SYNC_START_DATE_TIME_NEW: "$(SYNC_START_DATE_TIME)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      displayName: "Getting Conviso Synchronization status"
      inputs:
        targetType: inline
        script: "echo \"##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}\"\n\nif [ \"${RT_CONVISO_NEW_INTEGRATION}\" = \"true\" ]; then\n  sleep 5s\n  i=\"0\"\n  retries=\"10\"\n  echo \"Aguardando Sincronização finalizar\"\n  while [[ $i -lt $retries ]]\n  do\n      DATA=\"{\\\"operationName\\\":null,\\\"variables\\\":{},\\\"query\\\":\\\"{ syncStatus(assetId: ${CONVISO_ASSET_ID}, integration: FORTIFY, startDate: \\\\\\\"${SYNC_START_DATE_TIME}\\\\\\\") { status failureReason } }\\\"}\"\n      echo $DATA\n      RESPONSE_RAW=$(curl -s -S -w \"\\n%{http_code}\" \"${CONVISO_GRAPHQL_ENDPOINT}\" \\\n        --proxy \"${PROXY_AGENT_HTTPS}\" \\\n        --header \"Content-Type: application/json\" \\\n        --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n        --data-raw \"${DATA}\")\n\n      RESPONSE=$(sed '$d' <<< \"$RESPONSE_RAW\")\n      RESPONSE_CODE=$(tail -n1 <<< \"$RESPONSE_RAW\")\n\n      echo \"##[debug]RESPONSE.........: ${RESPONSE}\"\n      echo \"##[debug]RESPONSE_CODE....: ${RESPONSE_CODE}\"\n      \n      SYNC_STATUS=$(echo $RESPONSE | jq -r .data.syncStatus.status)\n      echo \"Status atual da Sincronização: ${SYNC_STATUS}\"\n\n      if [[ \"$SYNC_STATUS\" == \"succeeded\" ]]\n      then\n          echo \"Sincronização finalizada com sucesso\"\n          exit 0\n      fi\n      sleep 30s\n      i=$[$i+1]\n  done\n\n  echo \"##vso[task.logissue type=error;]Tempo esgotado - A Sincronização não foi finalizada, tente rodar novamente.\"\n  echo \"##vso[task.complete result=Failed;]\"\nelse\n  sleep 5s\n  i=\"0\"\n  retries=\"10\"\n  API_URL=\"${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/job/${CONVISO_TRACK_KEY}\"\n\n  echo \"Aguardando Sincronização finalizar\"\n  while [[ $i -lt $retries ]]\n  do\n      SYNC_STATUS=$(curl -s -S -X GET ${API_URL} \\\n      --proxy \"${PROXY_AGENT_HTTPS}\" \\\n      --header \"x-api-key: ${CONVISO_API_KEY}\" | jq -r .data.status)\n\n      echo \"Status atual da Sincronização: ${SYNC_STATUS}\"\n\n      if [[ \"$SYNC_STATUS\" == \"completed\" ]]\n      then\n          echo \"Sincronização finalizada com sucesso\"\n          exit 0\n      fi\n      sleep 30s\n      i=$[$i+1]\n  done\n\n  echo \"##vso[task.logissue type=error;]Tempo esgotado - A Sincronização não foi finalizada, tente rodar novamente.\"\n  echo \"##vso[task.complete result=Failed;]\"\nfi\n"
    - task: Bash@3
      env:
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_PROJECT_ID: "$(CONVISO_PROJECT_ID)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      displayName: "Getting Conviso Project API CODE"
      inputs:
        targetType: inline
        script: |
          RESPONSE=$(curl -s -S "${CONVISO_GRAPHQL_ENDPOINT}" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data-raw '{"operationName":null,"variables":{},"query":"{ projects(params: { idEq: '${CONVISO_PROJECT_ID}' }) { collection { apiCode } } }"}')

          API_CODE=$(echo $RESPONSE | jq -r .data.projects.collection[0].apiCode)

          echo "##vso[task.setvariable variable=convisoProjectApiCode]$API_CODE"
          echo "##[debug]Exportando API CODE '${API_CODE}' do Projeto do Conviso para variável 'convisoProjectApiCode'."
    - task: Bash@3
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_PROJECT_API_CODE: "$(convisoProjectApiCode)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_ASSET_ID: "$(convisoAssetId)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        SG_SEVERITY_CRITICAL: "0"
        SG_SEVERITY_HIGH: "0"
        SG_SEVERITY_MEDIUM: ""
        SG_SEVERITY_LOW: ""
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      continueOnError: true
      displayName: "Getting Security Gate Data and Validate"
      inputs:
        targetType: inline
        script: "echo \"##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}\"\n\nif [ \"${RT_CONVISO_NEW_INTEGRATION}\" = \"true\" ]; then\n  SG_STATUS_TO_BE_BLOCKED=\"IDENTIFIED IN_PROGRESS\"\n  DATA=\"{\\\"operationName\\\":null,\\\"variables\\\":{},\\\"query\\\":\\\"{ issuesStats(companyId: ${CONVISO_COMPANY_ID}, filters: {assetIds: [${CONVISO_ASSET_ID}], integrationTypes: Fortify, statuses: [$SG_STATUS_TO_BE_BLOCKED]}) { severities { count value } } }\\\"}\"\n      \n  RESPONSE=$(curl -s -S \"${CONVISO_GRAPHQL_ENDPOINT}\" \\\n    --proxy \"${PROXY_AGENT_HTTPS}\" \\\n    --header \"Content-Type: application/json\" \\\n    --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n    --data-raw \"${DATA}\")\n\n  CRITICAL_SEVERITY_COUNT=$(echo $RESPONSE | jq -r .data.issuesStats.severities[4].count)\n  HIGH_SEVERITY_COUNT=$(echo $RESPONSE | jq -r .data.issuesStats.severities[3].count)\n\n  if [ \"$CRITICAL_SEVERITY_COUNT\" -gt \"${SG_SEVERITY_CRITICAL}\" ]; then\n    echo \"##vso[task.logissue type=error;]A Análise encontrou Vulnerabilidades Críticas: $CRITICAL_SEVERITY_COUNT\"\n    echo \"##vso[task.complete result=Failed;]\"\n    exit\n  fi\n\n  if [ \"$HIGH_SEVERITY_COUNT\" -gt \"${SG_SEVERITY_HIGH}\" ]; then\n    echo \"##vso[task.logissue type=error;]A Análise encontrou Vulnerabilidades Altas: $HIGH_SEVERITY_COUNT\"\n    echo \"##vso[task.complete result=Failed;]\"\n    exit\n  fi\n\n  echo \"A Análise finalizou sem Vulnerabilidades Identificadas\"\n  exit 0\nelse\n  CRITICAL=$([[ -n ${SG_SEVERITY_CRITICAL} ]] && echo -n '\"critical\": { \"maximum\": '${SG_SEVERITY_CRITICAL}' }' || echo -n \"\")\n  HIGH=$([[ -n ${SG_SEVERITY_HIGH} ]] && echo -n '\"high\": { \"maximum\": '${SG_SEVERITY_HIGH}' }' || echo -n \"\")\n  MEDIUM=$([[ -n ${SG_SEVERITY_MEDIUM} ]] && echo -n '\"medium\": { \"maximum\": '${SG_SEVERITY_MEDIUM}' }' || echo -n \"\")\n  LOW=$([[ -n ${SG_SEVERITY_LOW} ]] && echo -n '\"low\": { \"maximum\": '${SG_SEVERITY_LOW}' }' || echo -n \"\")\n\n  DATA_SEVERITY=$(echo -n ${CRITICAL})\n  DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${HIGH} ]] && echo -n \",\"; echo -n ${HIGH})\n  DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${MEDIUM} ]] && echo -n \",\"; echo -n ${MEDIUM})\n  DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${LOW} ]] && echo -n \",\"; echo -n ${LOW})\n  \n  DATA='{ \"api_code\": \"'${CONVISO_PROJECT_API_CODE}'\",\"rules\": [{ \"from\": \"any\", \"severity\": { '${DATA_SEVERITY}' } }] }'\n  \n  RESPONSE=$(curl -s -S -g -X POST \"${CONVISO_APP_ENDPOINT}/api/v3/security_gate/vulnerabilities\" \\\n  --proxy \"${PROXY_AGENT_HTTPS}\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"x-api-key: ${CONVISO_API_KEY}\" \\\n  --data \"${DATA}\")\n\n  LOCKED=$(echo $RESPONSE | jq .locked)\n\n  if [[ \"${LOCKED}\" == \"true\" ]]\n  then\n    echo \"##vso[task.logissue type=error;]A análise encontrou vulnerabilidades. Entre em contato com o Security Champion do seu projeto.\"\n    echo $RESPONSE | jq .summary\n    echo \"##vso[task.complete result=Failed;]\"\n    exit\n  fi\n\n  echo \"A análise finalizou sem vulnerabilidades identificadas.\"\n  exit 0\nfi\n"
    - task: Bash@3
      displayName: Gate Validation
      condition: in(variables['Agent.JobStatus'], 'SucceededWithIssues')
      env:
        SKIP_SECURITY_GATE: $(SKIP_SECURITY_GATE)
      inputs:
        targetType: inline
        script: |
          echo "SKIP_SECURITY_GATE: ${SKIP_SECURITY_GATE}"
          if [[ ! "${SKIP_SECURITY_GATE}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=error;]O Security Gate falhou pois foram encontradas potenciais vulnerabilidades críticas e altas por nossas ferramentas de segurança em código fonte para este projeto. Para mais informações, acesse a wiki do time de AppSec da Vivo em https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659"
            echo "##vso[task.complete result=Failed;]"
            exit
          fi
          echo "##[warning]O Security Gate NÃO está habilitado para este projeto, entretanto, foram identificadas vulnerabilidades de alta criticidade em seu código fonte. Antes de seguir com este código para outros ambientes, consulte em O Security Gate não está habilitado para este projeto e podem existir alguns motivos para isso... Este projeto ainda não foi tombado pelo time de AppSec ou se trata de um ativo de testes. No entanto, foram identificadas vulnerabilidades críticas e altas no step anterior e recomendamos que estas vulnerabilidades sejam analisadas e a estratégia de correção das mesmas sejam avaliadas. Para mais informações, acesse a wiki do time de AppSec da Vivo em https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659 para verificar como solicitar acesso as informações dessas descobertas para as respectivas tratativas. É responsabilidade de todos o mantimento de código fonte seguro no ambiente, faça sua parte."
- stage: publish
  displayName: "Publish"
  dependsOn:
  - pipeline_init
  - build_test
  - quality_gates
  - security
  condition: and(not(failed()), not(canceled()), eq(variables['isBumpingVersion'], true))
  variables:
  - name: NEW_VERSION
    value: $[ stageDependencies.pipeline_init.get_new_version.outputs['versioning.NEW_VERSION'] ]
  - name: ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME'] ]
  - name: ARTIFACT_ID
    value: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: update_version
    variables:
    - name: UPDATE_VERSION_BRANCH_NAME
      value: $[ replace(variables['Build.SourceBranch'], 'refs/heads/', '') ]
    displayName: "Update version and commit"
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true
    - task: Bash@3
      displayName: "Preparation"
      env:
        BRANCH_NAME: "$(UPDATE_VERSION_BRANCH_NAME)"
      inputs:
        targetType: inline
        script: |
          git config --global --replace-all user.name "Azure DevOps"
          git config --global --replace-all user.email "azuredevops@telefonica.com"

          git config pull.rebase true
          git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
          git checkout -f ${BRANCH_NAME}
    - task: Maven@4
      displayName: 'Setting new version'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'versions:set'
        options: -DnewVersion=$(NEW_VERSION)
    - task: Bash@3
      displayName: 'Commit Updated Version'
      env:
        BRANCH_NAME: "$(UPDATE_VERSION_BRANCH_NAME)"
        NEW_VERSION: $(NEW_VERSION)
        TAG_REPO: True
      inputs:
        targetType: inline
        script: "git add pom.xml\ngit commit -am \"[CI SKIP] Project version has been updated. Released version '${NEW_VERSION}'\"\n\n\nTAG_PUSH_PARAM=\"\"\nif [[ \"${TAG_REPO}\" == \"True\" ]]; then\n  echo \"##[debug] Creating tag ${NEW_VERSION}.\"\n  TAG_PUSH_PARAM=\"--tags\"\n\n  git tag ${NEW_VERSION}\nfi\n\ngit push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}\n\nif [ $? -ne 0 ]; then \n  echo \"##vso[task.logissue type=error;] Git push failed. Permission denied\"\n  echo \"##vso[task.complete result=Failed;]\"\n  exit 1\nfi  \n\necho \"Version updated to ${NEW_VERSION}\"\n"
  - job: publish_to_artifacts
    dependsOn:
    - update_version
    displayName: "Publishing to Artifacts"
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Getting previous stage artifact'
      inputs:
        buildType: current
        artifactName: app
        targetPath: '$(Build.ArtifactStagingDirectory)'
    - task: CmdLine@2
      displayName: Getting project.groupId from pom.xml
      name: extract_group_id
      condition: True
      inputs:
        script: "if [ ! -f \"pom.xml\" ]; then\n  echo \"##vso[task.logissue type=error] Unable to find pom.xml file.\"\n  exit 1\nfi\n\neval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.groupId pom.xml)\nif [ -z \"$PROP_VALUE\" ]; then\n  echo \"##[debug] Unable to find \\\"project.groupId\\\" on pom.xml file. Trying again...\"\n  eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.groupId pom.xml)    \n  if [ -z \"$PROP_VALUE\" ]; then\n    echo \"##vso[task.logissue type=error] Unable to find \\\"project.groupId\\\" on pom.xml file.\"\n    exit 1\n  fi\nfi\n\necho \"##[debug] Exporting \\\"project.groupId\\\" property with value \\\"${PROP_VALUE}\\\" to output variable \\\"GROUP_ID\\\".\"\necho \"##vso[task.setvariable variable=GROUP_ID;isoutput=true]$PROP_VALUE\"\n"
        workingDirectory: $(Build.ArtifactStagingDirectory)
    - task: CmdLine@2
      displayName: 'Getting artifact id preffix'
      env:
        BRANCH_NAME: $(Build.SourceBranchName)
        BRANCH_REF_NAME: $(Build.SourceBranch)
        ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME: $(ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME)
      inputs:
        script: |
          preffix=""
          if [ "$BRANCH_NAME" != "master" ]; then
            if [[ $BRANCH_REF_NAME == refs/heads/release/* ]]; then
              preffix="release-"
            else
              preffix="${ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME}-"
            fi
          fi
          echo "##vso[task.setvariable variable=PREFFIX_ARTIFACT_ID;]${preffix}"
          echo "PREFFIX_ARTIFACT_ID: ${preffix}"
        workingDirectory: '$(Build.ArtifactStagingDirectory)'
    - task: CmdLine@2
      displayName: Getting project.packaging from pom.xml
      name: extract_packaging
      condition: True
      inputs:
        script: "if [ ! -f \"pom.xml\" ]; then\n  echo \"##vso[task.logissue type=error] Unable to find pom.xml file.\"\n  exit 1\nfi\n\neval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.packaging pom.xml)\nif [ -z \"$PROP_VALUE\" ]; then\n  echo \"##[debug] Unable to find \\\"project.packaging\\\" on pom.xml file. Trying again...\"\n  eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.packaging pom.xml)    \n  if [ -z \"$PROP_VALUE\" ]; then\n    echo \"##vso[task.logissue type=error] Unable to find \\\"project.packaging\\\" on pom.xml file.\"\n    exit 1\n  fi\nfi\n\necho \"##[debug] Exporting \\\"project.packaging\\\" property with value \\\"${PROP_VALUE}\\\" to output variable \\\"PACKAGING\\\".\"\necho \"##vso[task.setvariable variable=PACKAGING;isoutput=true]$PROP_VALUE\"\n"
        workingDirectory: $(Build.ArtifactStagingDirectory)
    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)
    - task: Maven@4
      displayName: 'Deploying file with maven'
      inputs:
        mavenPOMFile: '$(Build.ArtifactStagingDirectory)/pom.xml'
        goals: 'deploy:deploy-file'
        options: '-Durl=$(AZURE_ARTIFACTS_MAVEN_FEED_URL) -DrepositoryId=$(AZURE_ARTIFACTS_ORGANIZATION) -Dfile=$(Build.ArtifactStagingDirectory)/target/$(ARTIFACT_ID)-$(NEW_VERSION)-mule-application.jar -DgroupId=$(extract_group_id.GROUP_ID) -DartifactId=$(PREFFIX_ARTIFACT_ID)$(ARTIFACT_ID) -Dversion=$(NEW_VERSION) -Dpackaging=$(extract_packaging.PACKAGING).jar'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
- stage: deploy
  displayName: "Deploy"
  dependsOn:
  - pipeline_init
  - build_test
  - quality_gates
  - security
  - publish
  variables:
  - name: PROPERTIES_FILE_NAME
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.PROPERTIES_FILE_NAME'] ]
  - name: ANYPOINT_ENVIRONMENT
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ANYPOINT_ENVIRONMENT'] ]
  - name: ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME'] ]
  - name: ENVIRONMENT_HEALTH_ENDPOINT
    value: $[ stageDependencies.pipeline_init.get_env_config.outputs['env_configuration.ENVIRONMENT_HEALTH_ENDPOINT'] ]
  - name: ARTIFACT_ID
    value: $[ stageDependencies.pipeline_init.prepare_pipeline.outputs['pom_reference.ARTIFACT_ID'] ]
  condition: and(not(failed()), not(canceled()), eq(variables.ENABLE_DEPLOY, 'true'), eq(variables['isEnvBranch'], true))
  pool:
    name: $(PRIVATE_AGENT_DEFAULT_DEPLOY)
  jobs:
  - job: run_deploy
    displayName: "Running deploy on CloudHub"
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Getting previous stage artifact'
      inputs:
        buildType: current
        artifactName: app
        targetPath: '$(Build.ArtifactStagingDirectory)'
    - task: CmdLine@2
      displayName: Getting project.version from pom.xml
      name: get_version
      condition: True
      inputs:
        script: "if [ ! -f \"pom.xml\" ]; then\n  echo \"##vso[task.logissue type=error] Unable to find pom.xml file.\"\n  exit 1\nfi\n\neval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)\nif [ -z \"$PROP_VALUE\" ]; then\n  echo \"##[debug] Unable to find \\\"project.version\\\" on pom.xml file. Trying again...\"\n  eval PROP_VALUE=$(docker run --rm --log-driver none --entrypoint xq -v $(pwd)/pom.xml:$(pwd)/pom.xml -w $(pwd) vcr-group.nexus.telefonica.com.br/linuxserver/yq -r .project.version pom.xml)    \n  if [ -z \"$PROP_VALUE\" ]; then\n    echo \"##vso[task.logissue type=error] Unable to find \\\"project.version\\\" on pom.xml file.\"\n    exit 1\n  fi\nfi\n\necho \"##[debug] Exporting \\\"project.version\\\" property with value \\\"${PROP_VALUE}\\\" to output variable \\\"POM_VERSION\\\".\"\necho \"##vso[task.setvariable variable=POM_VERSION;isoutput=false]$PROP_VALUE\"\n"
        workingDirectory: $(Build.ArtifactStagingDirectory)
    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)
    - task: CmdLine@2
      displayName: Extracting properties from config file
      inputs:
        script: >
          echo "##vso[task.setvariable variable=CLOUD_HUB_PROPS]"

          if [ ! -f "src/main/resources/properties/$(PROPERTIES_FILE_NAME)" ]; then
              echo "The file 'src/main/resources/properties/$(PROPERTIES_FILE_NAME)' does not exist."
              exit 0
          fi

          PROPS=$(yq '.cloudhub | select (.!=null)' src/main/resources/properties/$(PROPERTIES_FILE_NAME) | tr -d ':' | awk '{print $1}')

          if [ -z "$PROPS" ]; then
              echo "The field 'cloudhub' does not exist."
              exit 0
          fi

          for PROP in $PROPS; do
            PROPERTIES_ARGS_STRING="$PROPERTIES_ARGS_STRING -D$PROP=$(yq ".cloudhub.$PROP" src/main/resources/properties/$(PROPERTIES_FILE_NAME))"
          done

          echo "##vso[task.setvariable variable=CLOUD_HUB_PROPS]${PROPERTIES_ARGS_STRING}"
        workingDirectory: $(Build.ArtifactStagingDirectory)
    - task: Maven@4
      displayName: 'Executing maven deploy on CloudHub'
      inputs:
        mavenPOMFile: '$(Build.ArtifactStagingDirectory)/pom.xml'
        goals: 'mule:deploy'
        options: '-s $(muleSettings.secureFilePath) -DmuleDeploy -Dmule.artifact=$(Build.ArtifactStagingDirectory)/target/$(ARTIFACT_ID)-$(POM_VERSION)-mule-application.jar -DskipTests -DconnectedAppClientId=$(MULE_APP_CLIENT_ID) -DconnectedAppClientSecret=$(MULE_APP_CLIENT_SECRET) -Denv.short=$(ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME) -DbusinessGroupId=$(MULE_BUSINESS_GROUP_ID) -Denv=$(ANYPOINT_ENVIRONMENT) -Dsecurity.key=$(MULE_SECURITY_KEY) -Danypoint.platform.client_id=$(MULE_ANYPOINT_CLIENT_ID) -Danypoint.platform.client_secret=$(MULE_ANYPOINT_CLIENT_SECRET) $(CLOUD_HUB_PROPS)'
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)
  - job: run_master_additional_deploy
    condition: and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['ENABLE_MASTER_ADDITIONAL_DEPLOY'], 'true'))
    displayName: "Running master additional deploy on CloudHub"
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: CodePlay
        path: 'codeplay'
    - task: CmdLine@2
      name: env_config
      displayName: "Setting Environment"
      env:
        ENV_CONFIG_NAME: $(MASTER_ADDITIONAL_DEPLOY_ENV_NAME)
        DEFAULT_ENV_CONFIG: $(MULE_DEFAULT_ENV_CONFIG)
      inputs:
        script: >
          echo "##[debug] ENV_CONFIG_NAME: $ENV_CONFIG_NAME"

          if [ ! -f "tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml" ]; then
            echo "##vso[task.logissue type=error] Unable to find tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml file."
            exit 1
          fi


          if [ $(yq eval "has(\"$ENV_CONFIG_NAME\")" "tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml") != true ]; then
            ENV_CONFIG_NAME=$MULE_DEFAULT_ENV_CONFIG
            echo "##[debug] Using default value for ENV_CONFIG_NAME: $ENV_CONFIG_NAME"
          fi


          PROPERTIES_FILE_NAME="$(yq -r .${ENV_CONFIG_NAME}.propertiesFileName tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ANYPOINT_ENV="$(yq -r .${ENV_CONFIG_NAME}.anypointEnv tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ANYPOINT_ENV_APP_NAME="$(yq -r .${ENV_CONFIG_NAME}.anypointEnvAppName tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"

          ENV_HEALTH_ENDPOINT="$(yq -r .${ENV_CONFIG_NAME}.envHealthEndpoint tech_products/mule-fenix/provisioners/mule/api_default/env_config.yml)"


          echo "##[debug] PROPERTIES_FILE_NAME: ....................$PROPERTIES_FILE_NAME"

          echo "##[debug] ANYPOINT_ENVIRONMENT: ....................$ANYPOINT_ENV"

          echo "##[debug] ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME: $ANYPOINT_ENV_APP_NAME"

          echo "##[debug] ENVIRONMENT_HEALTH_ENDPOINT: .............$ENV_HEALTH_ENDPOINT"


          if [ "${PROPERTIES_FILE_NAME}" == "null" ]; then
            echo "##vso[task.logissue type=error] There is no env configuration for this branch on env_config.yml."
            exit 1
          fi


          echo "##vso[task.setvariable variable=PROPERTIES_FILE_NAME;isoutput=true]${PROPERTIES_FILE_NAME}"

          echo "##vso[task.setvariable variable=ANYPOINT_ENVIRONMENT;isoutput=true]${ANYPOINT_ENV}"

          echo "##vso[task.setvariable variable=ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME;isoutput=true]${ANYPOINT_ENV_APP_NAME}"

          echo "##vso[task.setvariable variable=ENVIRONMENT_HEALTH_ENDPOINT;isoutput=true]${ENV_HEALTH_ENDPOINT}"
        workingDirectory: $(Pipeline.Workspace)/codeplay
    - task: DownloadPipelineArtifact@2
      displayName: 'Getting previous stage artifact'
      inputs:
        buildType: current
        artifactName: app
        targetPath: '$(Build.SourcesDirectory)'
    - task: DownloadSecureFile@1
      displayName: 'Getting settings file'
      name: muleSettings
      inputs:
        secureFile: $(MULE_SETTINGS_FILE)
    - task: CmdLine@2
      displayName: Extracting properties from config file
      inputs:
        script: >
          echo "##vso[task.setvariable variable=CLOUD_HUB_PROPS]"

          if [ ! -f "src/main/resources/properties/$(PROPERTIES_FILE_NAME)" ]; then
              echo "The file 'src/main/resources/properties/$(PROPERTIES_FILE_NAME)' does not exist."
              exit 0
          fi

          PROPS=$(yq '.cloudhub | select (.!=null)' src/main/resources/properties/$(PROPERTIES_FILE_NAME) | tr -d ':' | awk '{print $1}')

          if [ -z "$PROPS" ]; then
              echo "The field 'cloudhub' does not exist."
              exit 0
          fi

          for PROP in $PROPS; do
            PROPERTIES_ARGS_STRING="$PROPERTIES_ARGS_STRING -D$PROP=$(yq ".cloudhub.$PROP" src/main/resources/properties/$(PROPERTIES_FILE_NAME))"
          done

          echo "##vso[task.setvariable variable=CLOUD_HUB_PROPS]${PROPERTIES_ARGS_STRING}"
        workingDirectory: $(Build.SourcesDirectory)
    - task: Maven@4
      displayName: 'Executing maven deploy on CloudHub'
      inputs:
        mavenPOMFile: '$(Build.SourcesDirectory)/pom.xml'
        goals: 'mule:deploy'
        options: '-s $(muleSettings.secureFilePath) -DmuleDeploy -Dmule.artifact=$(Build.SourcesDirectory)/target/$(ARTIFACT_ID)-$(NEW_VERSION)-mule-application.jar -DskipTests -DconnectedAppClientId=$(MULE_APP_CLIENT_ID) -DconnectedAppClientSecret=$(MULE_APP_CLIENT_SECRET) -Denv.short=$(env_config.ANYPOINT_ENVIRONMENT_IN_APPLICATION_NAME) -DbusinessGroupId=$(MULE_BUSINESS_GROUP_ID) -Denv=$(env_config.ANYPOINT_ENVIRONMENT) -Dsecurity.key=$(MULE_SECURITY_KEY) -Danypoint.platform.client_id=$(MULE_ANYPOINT_CLIENT_ID) -Danypoint.platform.client_secret=$(MULE_ANYPOINT_CLIENT_SECRET) $(CLOUD_HUB_PROPS)'
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEFAULT-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEFAULT-PSW)

