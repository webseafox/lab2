

trigger: none

#Incluir Variaveis da Library
variables:
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: System.debug
  value: "true"

stages:
- stage:
  displayName: 'Deploy Helm Chart'
  jobs:
  - job:
    continueOnError: False
    condition: succeeded()
    displayName: 'Deploy Helm Chart'
    pool: GeneralPurposeLinuxAgentsCI
    steps:

    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    # - task: YamlParseFromVivo@4
    #   displayName: 'Get Metadata Info'
    #   inputs:
    #     type: 'file'
    #     origin: $(Build.SourcesDirectory)/catalog-info.yaml
    #     jpaths: |
    #       var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
    #       var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
    #       var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
    #       var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - script: |-
        echo "##vso[build.addbuildtag]ci"
        echo "##vso[build.addbuildtag]helm"
        echo "##vso[build.addbuildtag]kubernetes"
        echo "##vso[build.addbuildtag]maven"
        echo "##vso[build.addbuildtag]nexus"
        echo "##vso[build.addbuildtag]buildpack"
        # echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
        # echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: >- 
          DOCKER-REGISTRY-USERNAME, DOCKER-REGISTRY-PASSWORD,
          HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
          HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW
    
    - task: YamlParseFromVivo@4
      displayName: 'Get Helm/Kube Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pipeline/properties.yaml
        jpaths: |
          var CHART_NAME = .helm.['chart-name']
          # "helm-conv86"
          var PROPERTIES_NEXUS_REPOSITORY = .helm.['nexus-repository']
          # "conv86-helm"
          var PROPERTIES_NEXUS_REPOSITORY_URL = .helm.['nexus-repository-url']
          # "http://10.129.178.173:8082/repository/conv86-helm"
          var PROPERTIES_KUBECTL_VERSION = .helm.['kubectl-version']
          # "v1.10.11"
          var PROPERTIES_HELM_VERSION = .helm.['helm-version']
          # "3.5.3"
          var PROPERTIES_RUN_LINT = .helm.['run-lint']
          # "false"

    - task: YamlParseFromVivo@4
      displayName: 'Get Helm Chart Info'
      name:
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/Chart.yaml
        jpaths: |
          var CHART_VERSION = .version
          var CHART_NAME = .name

    - script: |
        # ref: https://reemus.dev/tldr/git-tag-versioning-script

        # Get version type from first argument passed to script
        # VERSION_TYPE="${1-}"
        
        VERSION_TYPE="patch"
        VERSION_NEXT=""
        
        if [ "$VERSION_TYPE" = "patch" ]; then
          # Increment patch version
          VERSION_NEXT="$(echo "$CHART_VERSION" | awk -F. '{$NF++; print $1"."$2"."$NF}')"
        elif [ "$VERSION_TYPE" = "minor" ]; then
          # Increment minor version
          VERSION_NEXT="$(echo "$CHART_VERSION" | awk -F. '{$2++; $3=0; print $1"."$2"."$3}')"
        elif [ "$VERSION_TYPE" = "major" ]; then
          # Increment major version
          VERSION_NEXT="$(echo "$CHART_VERSION" | awk -F. '{$1++; $2=0; $3=0; print $1"."$2"."$3}')"
        else
          # Print error for unknown versioning type
          printf "\nError: invalid VERSION_TYPE arg passed, must be 'patch', 'minor' or 'major'\n\n"
          # Exit with error code
          exit 1
        fi
        echo "##vso[task.setvariable variable=VERSION_NEXT]$VERSION_NEXT"

      displayName: 'Bump Version'
    - task: RegexReplace@4
      inputs:
        sourceType: 'file'
        source: 'Chart.yaml'
        destType: 'file'
        dest: 'Chart.yaml'
        regex: '/^(version {0,}: {0,})[^ \n]+/gm'
        substitution: '$1$(VERSION_NEXT)'

    - script: cat Chart.yaml
      displayName: 'Show new Chart.yaml'

    - task: Bash@3
      displayName: 'Commit new version'
      inputs:
        targetType: inline
        script: |-
          
          git stash save Chart.yaml
          git clean -fdX
          
          export TAG="$(VERSION_NEXT)"

          echo "##[command] git checkout ${BUILD_SOURCEBRANCHNAME} --"
          git fetch
          git checkout ${BUILD_SOURCEBRANCHNAME} --
          git pull --rebase origin ${BUILD_SOURCEBRANCHNAME}
          git stash pop

          echo "##[command] git commit"
          git add Chart.yaml
          git commit -m "[skip ci] CodePlay bump version ${TAG}"

          echo "##[command]git tag ${TAG}"
          git tag ${TAG} -m "Version has been updated to ${TAG}"

          echo "##[command] git push origin ${BUILD_SOURCEBRANCHNAME}"
          git push origin --tags ${BUILD_SOURCEBRANCHNAME}

    - script: helm package .
      displayName: 'Helm Package'
      condition: succeeded()

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: |
          *.tgz
          Chart.yaml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        ArtifactName: bin

    - task: NexusUploadHelmFromVivo@5
      displayName: 'Helm push to (Nexus)'
      inputs:
        nexusEndpoint: "Nexus Asis"
        repository: $(PROPERTIES_NEXUS_REPOSITORY)
        asset: "*.tgz"
