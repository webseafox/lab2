parameters:

- name: variable_groups
  displayName: Lista de Variables Groups para complementar variaveis e segredos.
  default: []
  type: object

- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - production

- name: vivonow_chg
  displayName: 'Numero CHG do VivoNow, somente para "production"'
  default: CHG0000001

- name: variables
  displayName: 'Sobrescreve ou adiciona novas variaveis globais'
  type: object
  default: []

variables:
- name: System.debug
  value: 'true'
- ${{ each group_name in parameters.variable_groups }}:
  - group: ${{ group_name }}

- name: ASDF_JDK_8
  value: "adoptopenjdk-8.0.352+8"
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"
- name: ASDF_JDK_17
  value: "openjdk-17.0.2"
- name: ASDF_JDK_21
  value: "adoptopenjdk-21.0.4+7.0.LTS"

- name: ASDF_JDK_SAP17
  value: "sapmachine-17.0.10"

- name: RELEASE_TYPE
  ${{ if eq('${{ parameters.environment }}', 'production') }}:
    value: 'RELEASE'
  ${{ else }}:
    value: 'SNAPSHOT'

- ${{ each variable in parameters.variables }}:
  - name: ${{ variable.name }}
    value: ${{ variable.value }}

stages:
- stage:
  displayName: "Ensure config files"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: 
    displayName: Ensure files
    steps:
    - checkout: self
      fetchDepth: 1

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: "catalog-info.yaml"
        jpaths: |-
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - task: XmlParseFromVivo@4
      displayName: 'Get pom.xml info'
      inputs:
        type: 'file'
        origin: "pom.xml"
        jpaths: |
          var POM_XML_VERSION = .project.version._text
    - task: TemplateInline@4
      displayName: 'Bind "ASDF_JAVA_VERSION"'
      inputs:
        source: |
          var ASDF_JAVA_VERSION = {{ ASDF_JDK_$(CATALOG_YAML_JAVA_LANGUAGE_VERSION) }}

    - script: | # shell
        asdf install java $(ASDF_JAVA_VERSION)
        asdf install maven 3.9.9
        echo "##vso[task.setvariable variable=ASDF_MAVEN39_PATH]$(asdf where maven 3.9.9)"
      displayName: 'Ensure tools versions'

    - task: ListFilesAndFolders@4
      displayName: 'Find Custom Maven Settings file'
      inputs:
        script: 'var://MAVEN_SETTINGS_FILES = **/*settings.xml'
        dot: true

    - task: PythonRunner@4
      displayName: 'Ensure Maven Config'
      inputs:
        script: | # py
          import os
          set_variable('MAVEN_CUSTOM_SETTINGS',
            (os.getenv('MAVEN_SETTINGS_FILES') or '/home/svc_devopscorp/.m2/settings.xml')
            .split(',')[0]
          )

    - task: SemverIncrementCustomFromVivo@5
      displayName: 'Semver Increment "patch"'
      name: new_version
      inputs:
        currentversion: $(POM_XML_VERSION)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"

    - task: Maven@4
      displayName: "Maven versions:set"
      env:
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        options: >
          -gs /home/svc_devopscorp/.m2/settings.xml
          -s $(MAVEN_CUSTOM_SETTINGS)
          -Dmaven.test.skip=true 
          -DnewVersion=$(new_version.NEW_VERSION)
          -DprocessAllModules
          -DgenerateBackupPoms=false
          -N versions:update-child-modules
        mavenPomFile: $(Build.SourcesDirectory)/pom.xml
        mavenOptions: "-Xmx3072m"
        mavenVersionOption: 'Path'
        mavenDirectory: $(ASDF_MAVEN39_PATH)
        javaHomeOption: "JDKVersion"
        goals: "versions:set"

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          .azuredevops/config/${{ parameters.environment }}/values.yml
          .azuredevops/config/${{ parameters.environment }}/environments_variables.yml
          .azuredevops/config/${{ parameters.environment }}/secrets.yaml
          **/pom.xml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'generated-sources'
        PathtoPublish: $(Build.ArtifactStagingDirectory)
- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  condition: succeeded()
  jobs:
  - job:
    displayName: 'Jira Commit Integration'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Regex@4
      displayName: 'Filter Commit Message'
      inputs:
        source: $(Build.SourceVersionMessage)
        regex: '/^[^:]+ {0,}: {0,}(([^| ]+) {0,}\| {0,}([^| ]+) {0,}\| {0,}(.+) {0,})/gm'


    - task: TypeScriptRunner@4
      displayName: 'Get Commit Info'
      condition: eq(variables['REGEX_HAS_MATCH'], 'true')
      inputs:
        azureDevOpsEndpoint: 'Azure DevOps Api Generic'
        script: |- # typescript
          const { BUILD_REPOSITORY_ID } = process.env;
          const commits = await (await connection.getGitApi()).getCommits(BUILD_REPOSITORY_ID, {$top: 1});
          
          set_variable('COMMITTER_NAME)', commits[0].committer.name);
          set_variable('COMMIT_DATE)', commits[0].committer.date);

    # - task: KafkaProducer@0.0.16
    #   displayName: 'Publicar informações no tópico'
    #   condition: eq(variables['REGEX_HAS_MATCH'], 'true')
    #   inputs:
    #     kafkaOamEndpoint: 'KafkaEsteiraDigitalProd'
    #     kafkaProducerClientId: 'esteira-digital-group'
    #     kafkaServer: 'oauth.bootstrap.apps.ocp-kafka-prd.redecorp.br:443'
    #     commitDate: $(COMMIT_DATE)
    #     commitId: $(Build.SourceVersion)
    #     commitMessage: $(Build.SourceVersionMessage)
    #     committerName: $(COMMITTER_NAME)
    #     repoName: $(Build.Repository.Name)
    #     kafkaTopic: "integracao-azure-jira-branch-master"
    #     debug: true

  - job:
    displayName: 'Build, Unit Test and Pack'
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'generated-sources'
        downloadPath: $(System.ArtifactsDirectory)
    
    - task: CopyFiles@2
      displayName: Overwrite generated sources
      inputs:
        SourceFolder: $(System.ArtifactsDirectory)/generated-sources
        Contents: '**'
        TargetFolder: './'
        OverWrite: true

    - task: AzureKeyVault@2
      displayName: 'Secrets from AKV'
      inputs:
        RunAsPreJob: true
        azureSubscription: "DevOpsSharedResources"
        KeyVaultName: "kv-azdevops-shared"
        SecretsFilter: >-
          NEXUS-DEPS-USR,
          NEXUS-DEPS-PSW

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']


    - script: |- # shell
        echo "##vso[build.addbuildtag]artifacts"
        echo "##vso[build.addbuildtag]java-$(CATALOG_YAML_JAVA_LANGUAGE_VERSION)"
        echo "##vso[build.addbuildtag]maven"
        echo "##vso[build.addbuildtag]ci-lite"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
      displayName: 'Set tags'

    - task: TemplateInline@4
      displayName: 'Bind "ASDF_JAVA_VERSION"'
      inputs:
        sourceType: 'text'
        source: |
          var ASDF_JAVA_VERSION = {{ ASDF_JDK_$(CATALOG_YAML_JAVA_LANGUAGE_VERSION) }}

    - script: | # shell
        
        asdf install java $(ASDF_JAVA_VERSION)
        asdf install maven 3.9.9
        echo "##vso[task.setvariable variable=ASDF_MAVEN39_PATH]$(asdf where maven 3.9.9)"
      displayName: 'Ensure tools versions'

    - task: ListFilesAndFolders@4
      displayName: 'Find Custom Maven Settings file'
      inputs:
        script: 'var://MAVEN_SETTINGS_FILES = **/*settings.xml'
        dot: true

    - task: PythonRunner@4
      displayName: 'Ensure Maven Config'
      inputs:
        script: | # py
          import os
          set_variable('MAVEN_CUSTOM_SETTINGS',
            (os.getenv('MAVEN_SETTINGS_FILES') or '/home/svc_devopscorp/.m2/settings.xml')
            .split(',')[0]
          )

    - task: Maven@4
      displayName: 'Maven Build, Test & Package'
      env:
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        options: >-
          -gs /home/svc_devopscorp/.m2/settings.xml
          -s $(MAVEN_CUSTOM_SETTINGS)
          -Dmaven.repo.local=/home/svc_devopscorp/.m2/repository
        mavenPomFile: $(Build.SourcesDirectory)/pom.xml
        mavenOptions: "-Xmx3072m"
        mavenVersionOption: 'Path'
        mavenDirectory: $(ASDF_MAVEN39_PATH)
        javaHomeOption: "JDKVersion"
        publishJUnitResults: false
        testResultsFiles: $(Build.SourcesDirectory)/**/surefire-reports/TEST-*.xml
        goals: "clean dependency:purge-local-repository install"

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mergeTestResults: true

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: "$(build.sourcesdirectory)"
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        Contents: |
          **/target/classes/**
          **/target/*.*ar
          **/target/*.ejb
          **/surefire-reports/TEST-*.xml
          **/pom.xml
          .azuredevops/**/*
          .azuredevops/*
          catalog-info.y*ml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: bin

- stage:
  displayName: 'Push to Repositories'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: artifacts
    displayName: 'Push to Artifacts'
