  - job:
    dependsOn: artifacts
    displayName: 'Push to Git (TAG)'
    steps:
    - checkout: self
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'generated-sources'
        downloadPath: $(System.ArtifactsDirectory)

    - task: XmlParseFromVivo@4
      displayName: 'Get pom.xml info'
      inputs:
        type: 'file'
        origin: "pom.xml"
        jpaths: |
          var POM_XML_VERSION = .project.version._text

    - task: Bash@3
      displayName: 'Commit new version'
      continueOnError: false
      inputs:
        targetType: inline
        script: |- # shell

          git switch -c $(Build.SourceBranch)
          yes | cp -r -f $(System.ArtifactsDirectory)/generated-sources/* ./

          git add .
          git commit -m "[skip ci] CodePlay bump version $(POM_XML_VERSION)"
          git tag $(POM_XML_VERSION) -m "Version has been updated to $(POM_XML_VERSION)"
          git push origin --tags HEAD:$(Build.SourceBranch)

          echo "##[command] yes | cp -r -f $(System.ArtifactsDirectory)/generated-sources/* ./"
          echo "##[command] git add ."
          echo "##[command] git commit -m \"[skip ci] CodePlay bump version $(POM_XML_VERSION)\""
          echo "##[command] git tag $(POM_XML_VERSION) -m \"Version has been updated to $(POM_XML_VERSION)\""
          echo "##[command] git push origin --tags HEAD:$(Build.SourceBranch)"
