parameters:
- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - preprod
  - prod

variables:
- name: System.debug
  value: "true"

stages:
- stage:
  displayName: 'Kube logs'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job: 
    displayName: 'Kube logs'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: >- 
          DOCKER-REGISTRY-ACR-USERNAME, DOCKER-REGISTRY-ACR-PASSWORD,
          HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
          HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW

    - task: DownloadSecureFile@1
      name: kubeconfig
      displayName: 'Download config from (${{parameters.environment}})'
      inputs:
        # secureFile: 'aks-${{parameters.sigla_bu}}-${{parameters.environment}}'
        secureFile: 'kube-${{parameters.environment}}'

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      name: catalog_info
      inputs:
        type: 'file'
        origin: catalog-info.yaml
        jpaths: |-
          var CATALOG_YAML_KUBE_ID = .metadata.annotations['backstage.io/kubernetes-id']
          var CATALOG_YAML_KUBE_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']

    # - script: >-
    #     kubectl get pods --all-namespaces 
    #     -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name | 
    #     awk 'NR>1 {print $1, $2}'
 
    - script: >-
        kubectl get pods 
        --no-headers -o custom-columns=":metadata.name"
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID) 

    - script: >- 
        kubectl rollout status deployment $(CATALOG_YAML_KUBE_ID) 
        -n $(CATALOG_YAML_KUBE_NS)
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID)

    - script: >- 
        kubectl get pods --all-namespaces 
        -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name 
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID) 
        | 
        awk 'NR>1 {print $1, $2}'
        
    - script: >- 
        kubectl get pods 
        --no-headers -o custom-columns=":metadata.name"
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID)
        | 
        xargs -I {} 
        kubectl get pod {} 
        --subresource status 
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify 

    - script: >-
        kubectl get pods 
        --no-headers -o custom-columns=":metadata.name"
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID)
        | 
        xargs -I {} 
        kubectl logs -f {} 
        --kubeconfig="$(kubeconfig.secureFilePath)" 
        --insecure-skip-tls-verify 
      displayName: 'Fetch logs'

