#Incluir Variaveis da Library
variables:
  - name: System.debug
    value: "true"
  - group: "${{ variables['Build.Repository.Name'] }}"
  
stages:
- stage:
  displayName: 'Push to Nexus'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    displayName: 'Push Nexus (Maven)'
    steps:
    - checkout: none
    # - task: DownloadBuildArtifacts@1
    #   displayName: 'Get new pom.xml'
    #   inputs:
    #     buildType: "current"
    #     downloadPath: "$(System.ArtifactsDirectory)"

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        project: '57baa0e3-242e-439f-a875-edf1a441a4c0'
        pipeline: '24619'
        buildVersionToDownload: 'specific'
        buildId: '363021'
        buildType: 'specific'
        # itemPattern: |
        #   bin/**/*.*ar
        #   bin/**/pom.xml
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - task: XmlParseFromVivo@4
      displayName: 'Get Main Info'
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      name: catalog_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']

    - task: NunjucksInline@4
      displayName: 'Bind Variables'
      inputs:
        sourceType: 'text'
        source: |
          var MAVEN_REPO_NAME = {{ '$(NEXUS_REPO_LIB_MVN)' or '$(CATALOG_YAML_ACRONYM)-mvn' }}

    - task: NexusUploadAllMvnFromVivo@5
      displayName: 'Push to Nexus'
      inputs:
        nexusEndpoint: 'Nexus Asis'
        nexusRepoMaven: $(MAVEN_REPO_NAME)
        publishInfoFile: publishInfo.md
        mainPomDirectory: $(System.ArtifactsDirectory)/bin
