variables:
- name: System.debug
  value: "true"

stages:
- stage:
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    steps:
    - checkout: self
      fetchDepth: 1

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: catalog-info.yaml
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']
          var CATALOG_YAML_KUBE_ID = .metadata.annotations['backstage.io/kubernetes-id']

    - task: DownloadSecureFile@1
      # this task must have a name
      name: kubeconfig
      displayName: 'Download config from (dev)'
      inputs:
        secureFile: 'kube-dev'

    - script: |-
        source ~/.bashrc
        kubectl get deployments --kubeconfig="$(kubeconfig.secureFilePath)" --insecure-skip-tls-verify

    - task: CLIPolling@4
      inputs:
        interpreter: bash
        startDelay: 1s
        pollingInterval: 100ms
        timeout: 30s
        script: |-
          source ~/.bashrc
          # kubectl get deployments --kubeconfig="$(kubeconfig.secureFilePath)" --insecure-skip-tls-verify -o json
          
          kubectl get deployments --kubeconfig="$(kubeconfig.secureFilePath)" --insecure-skip-tls-verify
          kubectl get pods --kubeconfig="$(kubeconfig.secureFilePath)" --insecure-skip-tls-verify

          kubectl get pods \
          --no-headers -o custom-columns=":metadata.name"\
          --kubeconfig="$(kubeconfig.secureFilePath)" \
          --insecure-skip-tls-verify | grep $(CATALOG_YAML_KUBE_ID)\
          | \
          xargs -I {} \
          kubectl logs -f {} \
          --kubeconfig="$(kubeconfig.secureFilePath)" \
          --insecure-skip-tls-verify 

        stopScript: |-
          file://$(Build.SourcesDirectory)/status.txt = / successfully rolled out/img
          text://stdout = / successfully rolled out/img
          text://stderr = / successfully rolled out/img