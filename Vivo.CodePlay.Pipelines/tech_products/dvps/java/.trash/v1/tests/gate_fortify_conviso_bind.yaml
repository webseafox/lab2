variables:
- name: System.debug
  value: "true"

stages:
- stage:
  displayName: 'Conviso Gate'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    variables:
    - name: CACORP_LOCATION
      value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"
    - name: PROXY_AGENT_HTTP
      value: "http://$(PROXY_SQUID_SERVER)"
    - name: PROXY_AGENT_HTTPS
      value: "http://$(PROXY_SQUID_SERVER)"
    - name: PROXY_AGENT_NO_PROXY
      value: 
        localhost,
        0.0.0.0,
        127.0.0.1,
        10.244.0.0/16,
        192.168.0.0/16,
        10.129.178.173,
        nexus.telefonica.com.br,
        acrsharedservices01.azurecr.io,
        appcs-azdevops-shared.azconfig.io,
        scm.azurewebsites.net

    displayName: Conviso
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, CONVISO-API-KEY'

    - task: NunjucksInline@4
      displayName: 'Generate app configuration keys'
      inputs:
        sourceType: 'text'
        autoSurround: false
        source: |
          secret FORTIFY_SSC_CLI_TOKEN_64 = {{ '$(FORTIFY-SSC-CLI-TOKEN)' | encode64 }}
          var FORTIFY_PROJECT_NAME = {{ (SYSTEM_TEAMPROJECT + '-' + BUILD_REPOSITORY_NAME) | replace(r/ +/igm, '_') | lower }}-codeplay-v1

          # var LABEL_GLOBAL = GLOBAL
          # var KEY_GLOBAL_FORTIFY = FORTIFY
          # var KEY_GLOBAL_CONVISO = CONVISO
          # var KEY_GLOBAL_CHECKMARX = CHECKMARX
          # var KEY_GLOBAL_SKIP_SECURITY_GATE = SKIP_SECURITY_GATE

          var LABEL_PROJECT = {{ SYSTEM_TEAMPROJECT }}
          var KEY_PROJECT_FORTIFY = FORTIFY_{{ SYSTEM_TEAMPROJECTID | replace(r/-/ig, '_') | upper }}
          var KEY_PROJECT_CONVISO = CONVISO_{{ SYSTEM_TEAMPROJECTID | replace(r/-/ig, '_') | upper }}
          var KEY_PROJECT_CHECKMARX = CHECKMARX_{{ SYSTEM_TEAMPROJECTID | replace(r/-/ig, '_') | upper }}
          var KEY_PROJECT_SKIP_SECURITY_GATE = SKIP_SECURITY_GATE_{{ SYSTEM_TEAMPROJECTID | replace(r/-/ig, '_') | upper }}

          var LABEL_COMPONENT = {{ SYSTEM_TEAMPROJECT }}/{{ BUILD_REPOSITORY_NAME }}
          var KEY_COMPONENT_FORTIFY = FORTIFY_{{ BUILD_REPOSITORY_ID | replace(r/-/ig, '_') | upper }}
          var KEY_COMPONENT_CONVISO = CONVISO_{{ BUILD_REPOSITORY_ID | replace(r/-/ig, '_') | upper }}
          var KEY_COMPONENT_CHECKMARX = CHECKMARX_{{ BUILD_REPOSITORY_ID | replace(r/-/ig, '_') | upper }}
          var KEY_COMPONENT_SKIP_SECURITY_GATE = SKIP_SECURITY_GATE_{{ BUILD_REPOSITORY_ID | replace(r/-/ig, '_') | upper }}

    
    # Busca o ID do projeto/versão no FORTIFY
    - task: AxiosFromVivo@4
      displayName: 'Fetch Fortify Project Info'
      inputs:
        sourceType: 'text'
        source: |
          var options = {
            method: 'GET',
            url: 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions',
            params: {
              fields: 'id,name,project', 
              q: 'project.name:$(FORTIFY_PROJECT_NAME)'
            },
            headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'}
          };
        variablePrefix: 'FORTIFY_PROJECT_INFO_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: JsonParseFromVivo@4
      displayName: 'Extract Fortify Project Info'
      inputs:
        source: $(FORTIFY_PROJECT_INFO_BODY)
        sourceType: 'text'
        queries: |
          var FORTIFY_PROJECT_ID = $.data[?(@.project.name.match(/$(FORTIFY_PROJECT_NAME)/i))].project.id
          var FORTIFY_PROJECT_VERSION_ID = $.data[?(@.project.name.match(/$(FORTIFY_PROJECT_NAME)/i))].id

    # - task: AxiosFromVivo@4
    #   displayName: 'Fetch Conviso Association'
    #   inputs:
    #     sourceType: 'text'
    #     source: |
    #       var options = {
    #         method: 'POST',
    #         url: 'https://app.conviso.com.br/api/v2/integrations/scanners/fortify/associate_project',
    #         body: {
    #           company_id: "430", 
    #           project_id: "$(FORTIFY_PROJECT_ID)"
    #         },
    #         headers: {
    #           'Content-Type': 'application/json',
    #           'x-api-key': '$(CONVISO-API-KEY)'
    #         }
    #       };
    #     variablePrefix: 'CONVISO_BIND_INFO_'
    #   env:
    #     NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - script: >-
        curl 'https://app.convisoappsec.com/graphql' 
        -H 'Accept-Encoding: gzip, deflate, br' 
        -H 'Content-Type: application/json' 
        -H 'Accept: application/json' 
        -H 'Connection: keep-alive' 
        -H 'x-api-key: $(CONVISO-API-KEY)'
        --data-binary '{"query":"mutation AssociateProject {\n associateProject(\n   input: {\n     projectId: 6540\n     companyId: 430\n     integration: FORTIFY\n   }\n ){\n   data {\n     asset {\n       id\n       name\n     }\n     externalToolProject {\n       reference\n       referenceName\n       integrationType\n     }\n   }\n }\n}","variables":{}}' 
        --compressed    

    - task: JsonParseFromVivo@4
      displayName: 'Extract Conviso Association'
      inputs:
        source: $(CONVISO_BIND_INFO_BODY)
        sourceType: 'text'
        queries: |
          var CONVISO_ASSOCIATION_ID = $.data.id
          var CONVISO_PROJECT_ID = $.data.project.id
          var CONVISO_FETCH_ERROR_TYPE = $.error.status_type
          var CONVISO_FETCH_ERROR_DETAILS = $.error.details

    - bash: |
          echo "##vso[task.logissue type=error;] An error occurred while requesting Conviso API. ${CONVISO_FETCH_ERROR_TYPE} - ${CONVISO_FETCH_ERROR_DETAILS}"
          echo "##vso[task.complete result=Failed;]"
      condition: not(eq(variables['CONVISO_FETCH_ERROR_TYPE'], ''))
      displayName: "Validating Conviso Association and Project IDs"

