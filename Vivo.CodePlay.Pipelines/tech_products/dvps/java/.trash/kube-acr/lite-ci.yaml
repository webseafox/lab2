
parameters:
- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - preprod
  - prod

# - name: gov_app_acronym
#   displayName: 
#     Gov app acronym para a service connection ex 'aks-{gov_app_acronym}-brsouth-dev', 
#     Veja esse parametro no catalog-info.yaml do seu projeto
#   type: string
#   default: mvpk
- name: environment_map
  type: object
  default: 
    dev: development
    prod: production
    test: test
    preprod: preproduction
    prodlike: productionlike
    esteira1: esteira1
    esteira2: esteira2
    esteira3: esteira3

variables:
- name: System.debug
  value: "true"

stages:
- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    displayName: 'Build, Unit Test and Pack'
    variables:
    - name: ASDF_JDK_8
      value: "adoptopenjdk-8.0.352+8"
    - name: ASDF_JDK_11
      value: "openjdk-11.0.2"
    - name: ASDF_JDK_17
      value: "openjdk-17.0.2"
    - name: ASDF_JDK_21
      value: "adoptopenjdk-21.0.4+7.0.LTS"

    - name: ASDF_JDK_SAP17
      value: "sapmachine-17.0.10"

    - name: SONARQUBE_PROJECT_NAME
      value: "$(System.TeamProject)-$(Build.Repository.Name)"

    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: AzureKeyVault@2
      displayName: 'Secrets from AKV'
      inputs:
        RunAsPreJob: true
        azureSubscription: "DevOpsSharedResources"
        KeyVaultName: "kv-azdevops-shared"
        SecretsFilter: >-
          NEXUS-DEPS-USR,
          NEXUS-DEPS-PSW,
          SONARQUBE-TOKEN

    - task: XmlParseFromVivo@4
      displayName: 'Get pom.xml info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - task: NunjucksInline@4
      displayName: 'Bind "ASDF_JAVA_VERSION"'
      inputs:
        sourceType: 'text'
        source: |
          var ASDF_JAVA_VERSION = {{ ASDF_JDK_$(CATALOG_YAML_JAVA_LANGUAGE_VERSION) }}

    - script: |-
        echo "##vso[build.addbuildtag]helm"
        echo "##vso[build.addbuildtag]kubernetes"
        echo "##vso[build.addbuildtag]acr"
        echo "##vso[build.addbuildtag]kube-config"
        echo "##vso[build.addbuildtag]java-$(CATALOG_YAML_JAVA_LANGUAGE_VERSION)"
        echo "##vso[build.addbuildtag]maven"
        echo "##vso[build.addbuildtag]nexus"
        echo "##vso[build.addbuildtag]ci-lite"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'

    - script: asdf install java $(ASDF_JAVA_VERSION)
      displayName: 'Ensure Project Java Version'

    - task: SemverIncrementCustomFromVivo@5
      displayName: 'Semver Increment "patch"'
      name: new_version
      continueOnError: false
      inputs:
        currentversion: $(POM_XML_VERSION)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"

    - task: Maven@3
      displayName: "Maven versions:set"
      env:
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      inputs:
        options: >
          -s /home/svc_devopscorp/.m2/settings.xml
          -Dmaven.test.skip=true 
          -DnewVersion=$(new_version.NEW_VERSION)
          -DprocessAllModules
          -DgenerateBackupPoms=false
          -N versions:update-child-modules
        mavenPomFile: $(Build.SourcesDirectory)/pom.xml
        mavenOptions: "-Xmx3072m"
        javaHomeOption: "JDKVersion"
        goals: "versions:set"

    - task: XmlParseFromVivo@4
      displayName: 'Get New pom.xml info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text

    - task: Maven@3
      displayName: 'Maven Build, Test & Package'
      continueOnError: False
      env:
        ASDF_JAVA_VERSION: $(ASDF_JAVA_VERSION)
        NEXUS_DEPS_USR: $(NEXUS-DEPS-USR)
        NEXUS_DEPS_PSW: $(NEXUS-DEPS-PSW)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        options: >-
          -s /home/svc_devopscorp/.m2/settings.xml
          -Dmaven.repo.local=/home/svc_devopscorp/.m2/repository
        mavenPomFile: $(Build.SourcesDirectory)/pom.xml
        mavenOptions: "-Xmx3072m"
        javaHomeOption: "JDKVersion"
        publishJUnitResults: false
        testResultsFiles: $(Build.SourcesDirectory)/**/surefire-reports/TEST-*.xml
        goals: "clean dependency:purge-local-repository install test"

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mergeTestResults: true

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: "$(build.sourcesdirectory)"
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        Contents: |
          **/target/classes/**
          **/target/*.*ar
          **/target/*.ejb
          **/surefire-reports/TEST-*.xml
          **/pom.xml
          .azuredevops/**/*
          .azuredevops/*
          catalog-info.y*ml
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: bin

    - task: Bash@3
      displayName: 'Commit new version'
      continueOnError: false
      inputs:
        targetType: inline
        script: |-
          git stash save pom.xml
          git clean -fdX

          # export TAG="${POM_XML_VERSION:4}+$(date -u +"%Y%m%d%H%M")-${BUILD_SOURCEBRANCHNAME}-${BUILD_BUILDID}"

          export TAG="${POM_XML_VERSION}"

          echo "##[command] git checkout ${BUILD_SOURCEBRANCHNAME} --"
          git fetch
          git checkout ${BUILD_SOURCEBRANCHNAME} --
          git pull --rebase origin ${BUILD_SOURCEBRANCHNAME}
          git stash pop

          echo "##[command] git commit"
          git add pom.xml
          git commit -m "[skip ci] CodePlay bump version ${TAG}"

          echo "##[command]git tag ${TAG}"
          git tag ${TAG} -m "Version has been updated to ${TAG}"

          echo "##[command] git push origin ${BUILD_SOURCEBRANCHNAME}"
          git push origin --tags ${BUILD_SOURCEBRANCHNAME}

- stage:
  displayName: 'Push to Repositories'
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    displayName: 'Push to Docker (SNAPSHOT)'
    variables:
    - name: HTTP_PROXY
      value: 'http://10.240.58.39:3128'
    - name: HTTPS_PROXY
      value: 'http://10.240.58.39:3128'
    - name: NO_PROXY
      value: 
        localhost,
        0.0.0.0,
        127.0.0.1,
        10.244.0.0/16,
        192.168.0.0/16,
        10.129.178.173,
        nexus.telefonica.com.br,
        acrsharedservices01.azurecr.io,
        appcs-azdevops-shared.azconfig.io,
        scm.azurewebsites.net

    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadPath: $(System.ArtifactsDirectory)

    - task: XmlParseFromVivo@4
      displayName: 'Get Main Info'
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION = .project.version._text
          var POM_XML_ARTIFACT_ID = .project.artifactId._text
          var POM_XML_GROUP_ID = .project.groupId._text

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']
          var CATALOG_YAML_NAME = .metadata.name

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(System.ArtifactsDirectory)/bin
        policySets: |
          image-definition-files

    - task: Docker@2
      displayName: 'Docker Build'
      condition: succeeded()
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: build
        repository: $(CATALOG_YAML_ACRONYM)/$(Build.Repository.Name)
        Dockerfile: $(System.ArtifactsDirectory)/bin/.azuredevops/runtime.Dockerfile
        buildContext: $(System.ArtifactsDirectory)/bin
        arguments: >-
          --no-cache 
          --build-arg APPLICATION_NAME=$(CATALOG_YAML_NAME)
          --build-arg APP_VERSION=$(POM_XML_VERSION) 
          --build-arg APPLICATION_PATH=target 
          --build-arg HTTP_PROXY="$(HTTP_PROXY)"
          --build-arg HTTPS_PROXY="$(HTTPS_PROXY)"
          --build-arg NO_PROXY="$(NO_PROXY)"

        tags: >
          $(POM_XML_VERSION)-SNAPSHOT

    - task: Docker@2
      displayName: 'Docker Push'
      condition: succeeded()
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: push
        repository: $(CATALOG_YAML_ACRONYM)/$(Build.Repository.Name)
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(POM_XML_VERSION)-SNAPSHOT

- stage:
  displayName: 'Deploy on (dev)'
  pool: GeneralPurposeLinuxAgentsCI
  variables:
  - name: System.debug
    value: "true"
  jobs:
  - deployment:
    displayName: 'Deploy on (dev)'
    # creates an environment if it doesn't exist
    environment:
      name: 'deploy-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 1

          - task: XmlParseFromVivo@4
            displayName: 'Get Main Info'
            inputs:
              type: 'file'
              origin: pom.xml
              jpaths: |
                var POM_XML_VERSION = .project.version._text

          - task: YamlParseFromVivo@4
            displayName: 'Get Metadata Info'
            inputs:
              type: 'file'
              origin: catalog-info.yaml
              jpaths: |-
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']

          - task: NunjucksInline@4
            displayName: 'Bind Variables'
            inputs:
              sourceType: 'text'
              source: |
                var HELM_REPO_PREFIX = {{ CATALOG_YAML_ACRONYM or 'devops'}}

          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: >-
                HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
                HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD

          - task: DownloadSecureFile@1
            # this task must have a name
            name: kubeconfig
            displayName: 'Download config from (${{parameters.environment}})'
            inputs:
              # secureFile: 'aks-${{parameters.sigla_bu}}-${{parameters.environment}}'
              # secureFile: 'kube-${{ parameters.environment }}'
              secureFile: 'kube-${{ parameters.environment_map[parameters.environment] }}'

          - task: Bash@3
            displayName: 'Add Helm repo from (ACR)'
            inputs:
              targetType: inline
              script: >-
                helm repo add devops-helm
                "https://nexus.telefonica.com.br/repository/devops-helm"
                --force-update
                --insecure-skip-tls-verify
                --username $(HELM-REGISTRY-NEXUS-USERNAME)
                --password $(HELM-REGISTRY-NEXUS-PASSWORD)
                --kubeconfig $(kubeconfig.secureFilePath)

          - task: Bash@3
            displayName: 'Helm repo update from (ACR)'
            inputs:
              targetType: inline
              script: >-
                helm repo update --kubeconfig $(kubeconfig.secureFilePath)

          - task: Bash@3
            displayName: 'Helm login from (ACR)'
            inputs:
              targetType: inline
              script: >-
                helm registry login
                acrsharedservices01.azurecr.io
                --username $(HELM-REGISTRY-ACR-USERNAME)
                --password "$(HELM-REGISTRY-ACR-PASSWORD)"

          - task: Bash@3
            displayName: 'Helm upgrade on (dev)'
            inputs:
              workingDirectory: $(Build.SourcesDirectory)
              targetType: inline
              script: >-
                helm upgrade $(CATALOG_YAML_NAME)
                oci://acrsharedservices01.azurecr.io/helm/devops/generic-java-microservice
                --version "1.0.15"
                --set "nameOverride=$(CATALOG_YAML_NAME)"
                --set "fullnameOverride=$(CATALOG_YAML_NAME)"
                --set "containerName=$(CATALOG_YAML_NAME)"
                --set "image.repository=acrsharedservices01.azurecr.io/$(CATALOG_YAML_ACRONYM)/$(CATALOG_YAML_NAME)"
                --set "image.tag=$(POM_XML_VERSION)-SNAPSHOT"
                --set "imagePullSecrets[0].name=acr-$(CATALOG_YAML_ACRONYM)"
                -f "./.azuredevops/config/dev/values.yml"
                -f "./.azuredevops/config/dev/environments_variables.yml"
                -f "./.azuredevops/config/dev/secrets.yaml"
                --kubeconfig $(kubeconfig.secureFilePath)
                --namespace "$(CATALOG_YAML_K8S_NS)"
                --install
                --insecure-skip-tls-verify
                --wait
                --timeout 300s
                --output table
                --history-max 2
                --atomic
                --debug

        on:
          success:
            steps:
            - checkout: self
              fetchDepth: 1

            - task: XmlParseFromVivo@4
              displayName: 'Get pom.xml info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/pom.xml
                jpaths: |
                  var POM_XML_VERSION = .project.version._text

            - task: LoadFile@4
              displayName: 'Load catalog-info.yaml'
              inputs:
                script: |
                  CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

            - task: YamlParseFromVivo@4
              displayName: 'Get Metadata Info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/catalog-info.yaml
                jpaths: |
                  var CATALOG_YAML_NAME = .metadata.name
                  var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                  var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

            - task: VivoGovernance@1
              continueOnError: true
              displayName: 'Gov Notify "deploy"'
              inputs:
                breakglass: false
                serverEndpoint: 'governanceapi'
                operation: 'deploy'
                component: $(CATALOG_YAML_NAME)
                version: $(POM_XML_VERSION)
                cluster: aks-$(CATALOG_YAML_ACRONYM)-dev
                namespace: $(CATALOG_YAML_K8S_NS)
                deployment: $(CATALOG_YAML_NAME)
                environment: dev
                catalogInfo: $(CATALOG_YAML_CONTENT)

          failure:
            steps:
            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

