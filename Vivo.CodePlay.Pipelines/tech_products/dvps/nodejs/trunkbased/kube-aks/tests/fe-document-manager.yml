      continueOnError: true
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
    - task: CmdLine@2
      displayName: 'Break build on quality gate failure'
      name: break_build_on_quality_gate_failure
      continueOnError: true
      env:
        SONARQUBE_TOKEN: $(SONARQUBE-TOKEN)
        SONARQUBE_URL: $(SONARQUBE_URL)
        SONAR_TASK_ID: $(sonar_task_id.SONAR_TASK_ID)
      inputs:
        script: "echo \"##[debug] SONAR_TASK_ID...............: ${SONAR_TASK_ID}\"\nSONAR_TASK_URL=\"${SONARQUBE_URL}/api/ce/task?id=${SONAR_TASK_ID}\"\necho \"##[debug] SONAR_TASK_URL..............: ${SONAR_TASK_URL}\"\nANALYSIS_ID=\"$(curl -s -u \"${SONARQUBE_TOKEN}:\" \"${SONAR_TASK_URL}\" | jq -r '.task.analysisId')\"\necho \"##[debug] ANALYSIS_ID.................: ${ANALYSIS_ID}\"\n\nSONAR_PROJECT_STATUS_URL=\"${SONARQUBE_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}\"\n\n\necho \"##[debug] SONAR_PROJECT_STATUS_URL....: ${SONAR_PROJECT_STATUS_URL}\"\n\nRESPONSE_CODE=$(curl -s -u \"${SONARQUBE_TOKEN}:\" \"${SONAR_PROJECT_STATUS_URL}\" -w \"%{http_code}\" -o response.json)\n\nif [ \"${RESPONSE_CODE}\" == 200 ]; then\n  ANALYSIS_STATUS=$(cat response.json | jq -r '.projectStatus.status')\n  METRICKEYS_STATUS=$(cat response.json | jq -r '.projectStatus.conditions[] | \"##[debug] \\(.metricKey)=\\(.status)\"')\n  \n\n  if [[ \"${ANALYSIS_STATUS}\" == \"null\" ]]; then\n    echo \"##vso[task.logissue type=error;] Failed to get data from Sonar Analysis - View details on step Run Code Analysis.\"\n    echo \"##vso[task.complete result=Failed;]\"\n  fi\n\n  echo \"##[debug] ANALYSIS_STATUS.............: ${ANALYSIS_STATUS}\"\n  echo \"##[debug] METRICKEYS_STATUS...........: \"\n  echo \"${METRICKEYS_STATUS}\"\n\n  echo \"##vso[task.setvariable variable=SONARQUBE_ANALYSIS_STATUS;isoutput=true]$ANALYSIS_STATUS\"\n  echo \"##vso[task.setvariable variable=SONARQUBE_ANALYSIS_METRICKEYS_STATUS;isoutput=true]\"$METRICKEYS_STATUS\"\"\n\n  if [[ \"${ANALYSIS_STATUS}\" == \"ERROR\" ]]; then\n    echo \"##vso[task.logissue type=error;] Sonar Quality Gate status is ERROR - View details on step Run Code Analysis.\"\n    echo \"##vso[task.complete result=Failed;]\"\n  fi\nelse\n  echo \"##vso[task.logissue type=error;] Failed to get data from Sonar Analysis - HTTP RESPONSE CODE is ${RESPONSE_CODE}.\"\n  echo \"##vso[task.complete result=Failed;]\"\nfi\n"
    - task: Bash@3
      displayName: 'Info about Code Analysis Break'
      condition: and(in(variables['Agent.JobStatus'], 'SucceededWithIssues', 'Failed'), eq(variables.SONAR_CONTINUE_ON_QUALITY_ERROR, false))
      inputs:
        targetType: inline
        script: |
