stages:
- stage: pipeline_init
  displayName: "Pipeline initialization"
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: prepare_pipeline
    displayName: "Prepare"
    steps:
    - task: CmdLine@2
      displayName: "Check for catalog-info.yml"
      env:
        BREAK_WHEN_NOT_FOUND: True
      inputs:
        script: |
          echo "##[debug] BREAK_WHEN_NOT_FOUND.....: ${BREAK_WHEN_NOT_FOUND}"

          if [ ! -f "catalog-info.yaml" ]; then

            if [ "$BREAK_WHEN_NOT_FOUND" = 'True' ]; then
              echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
              exit 1
            fi

          fi
    - task: CopyFiles@2
      displayName: "Copy catalog-info.yaml to Staging Directory"
      inputs:
        TargetFolder: "$(Build.ArtifactStagingDirectory)"
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          catalog-info.yaml
    - task: PublishPipelineArtifact@1
      displayName: "Publish catalog-info.yaml"
      inputs:
        artifactName: "catalog-info"
        targetPath: "$(Build.ArtifactStagingDirectory)"
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
  - pipeline_init
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: bump_version
    displayName: Bumping Version
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true
    - task: Bash@3
      displayName: Checkout last commit
      name: checkout_last_commit
      env:
        BRANCH_NAME: $(Build.SourceBranchName)
      inputs:
        targetType: inline
        script: |
          echo "##[info] Checkout last commit from '${BRANCH_NAME}'"

          git config pull.rebase true
          git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
          git checkout -f ${BRANCH_NAME}

          echo "##[debug] Git command result code: '${?}'"
    - task: CmdLine@2
      displayName: Set output variable CURRENT_VERSION
      env:
        VARIABLE_NAME: CURRENT_VERSION
        VARIABLE_VALUE: $(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)
      inputs:
        script: |
          setVariables(){
            eval result=$2
            echo "##vso[task.setvariable variable=$1;]$result"
          }
          setVariables "${VARIABLE_NAME}" "${VARIABLE_VALUE}"
    - task: Bash@3
      displayName: Defining Current Version
      name: export_current_version
      env:
        CURRENT_VERSION: $(CURRENT_VERSION)
        CURRENT_VERSION_OUT: CURRENT_VERSION
      inputs:
        targetType: inline
        script: |
          echo "##vso[task.setvariable variable=${CURRENT_VERSION_OUT};isOutput=true]${CURRENT_VERSION}"
          echo "##[debug] Exporting variable '${CURRENT_VERSION_OUT}': ${CURRENT_VERSION}"
    - task: CmdLine@2
      displayName: 'Set Current Version'
      env:
        COMPONENT_VERSION: $(export_current_version.CURRENT_VERSION)
      inputs:
        script: |
          echo "##vso[task.setvariable variable=COMPONENT_VERSION]${COMPONENT_VERSION}"
          echo "##[debug] Setting variable 'COMPONENT_VERSION': ${COMPONENT_VERSION}"
    - task: semver-bump@1
      displayName: Bump Version
      condition: or(and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')), and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'),eq(variables['Build.Reason'], 'BatchedCI')), and(succeeded(), eq(False, true),eq(variables['Build.Reason'], 'Manual')))
      inputs:
        VersionVariable: 'COMPONENT_VERSION'
        IncrementLevel: patch
    - task: Bash@3
      displayName: 'Defining New Component Version'
      name: component_bump_version
      env:
        NEW_VERSION: $(COMPONENT_VERSION)
        NEW_VERSION_OUT: NEW_VERSION
      inputs:
        targetType: inline
        script: |
          echo "##vso[task.setvariable variable=${NEW_VERSION_OUT};isOutput=true]${NEW_VERSION}"
          echo "##[debug] Exporting variable '${NEW_VERSION_OUT}': ${NEW_VERSION}"
  - job: build_test
    displayName: Build & Test & Coverage
    dependsOn:
    - bump_version
    variables:
    - name: NEW_VERSION
      value: $[ dependencies.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
    steps:
    - task: Bash@3
      displayName: About Stage
      env:
        DOC_URL: $(CORPORATE_WIKI_DOC_URL)
        MESSAGE: >
          Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.
      inputs:
        targetType: inline
        script: "RED='\\033[0;31m'\nGREEN='\\033[0;32m'\nBLUE='\\033[0;34m'\nYELLOW='\\033[1;33m'\nBG_GREEN='\\033[42;1;37m'\n\necho ' ================================================================================================================================'\necho '|                            _                ___                   ___ _            _ _                                         |'\necho '|                     /\\   /(_)_   _____     / __\\___  _ __ ___    / _ (_)_ __   ___| (_)_ __   ___  ___                         |'\necho '|                     \\ \\ / / \\ \\ / / _ \\   / /  / _ \\|  __/ _ \\  / /_)/ |  _ \\ / _ \\ | |  _ \\ / _ \\/ __|                        |'\necho '|                      \\ V /| |\\ V / (_) | / /__| (_) | | |  __/ / ___/| | |_) |  __/ | | | | |  __/\\__ \\                        |'\necho '|                       \\_/ |_| \\_/ \\___/  \\____/\\___/|_|  \\___| \\/    |_|  __/ \\___|_|_|_| |_|\\___||___/                        |'\necho '|                                                                        |_|                                                     |'\necho ' ================================================================================================================================'\necho \"                                                                                                      powered by Vivo DevOps Team\"\necho \"\"\n\nprintf \"\n=================================================================================================================================\n${GREEN}                                                 ${SYSTEM_STAGEDISPLAYNAME} \n=================================================================================================================================\n\n${MESSAGE}\n\n${YELLOW}Em caso de dúvidas sobre essa fase do pipeline acesse a documentação: ${BLUE}${DOC_URL}\n\n=================================================================================================================================\n\"\n"
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'
    - task: Bash@3
      displayName: "Setting up .npmrc"
      env:
        DEFAULT_NPMRC_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
      inputs:
        targetType: inline
        script: |
          echo "##[debug]DEFAULT_NPMRC_TEMP_FILE_PATH.....: ${DEFAULT_NPMRC_TEMP_FILE_PATH}"

          if [ -f .npmrc ]; then
            cp .npmrc ${DEFAULT_NPMRC_TEMP_FILE_PATH}
          else
            echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
            echo "##[error]O arquivo .npmrc não foi encontrado!"
            exit 1;
          fi

          echo ##vso[task.setvariable variable=NPM_CONFIG_USERCONFIG]${DEFAULT_NPMRC_TEMP_FILE_PATH}
    - task: npmAuthenticate@0
      inputs:
        workingFile: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
      displayName: Set dependencies credentials (Azure Artifacts)
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
    - task: Bash@3
      displayName: "Set dependencies credentials (Nexus)"
      env:
        NEXUS_DEFAULT_USR: $(NEXUS-DEFAULT-USR)
        NEXUS_DEFAULT_PSW: $(NEXUS-DEFAULT-PSW)
      inputs:
        targetType: inline
        script: |
          if [ -f .npmrc ]; then
            auth_opt="email=vivo.devops.br@telefonica.com\nalways-auth=true"
            auth=$(echo -n ${NEXUS_DEFAULT_USR}:${NEXUS_DEFAULT_PSW} | openssl base64)
            repos=$(grep -o "registry=.*" .npmrc | cut -d':' -f2 | awk -v auth="$auth" '{print $0 ":_auth="auth""}')
            { printf '\n'; echo -e "$repos\n$auth_opt"; } | tee -a >(cat >> .npmrc) > /dev/null
            echo "##[debug]Credenciais configuradas!"
          else
            echo "##vso[task.logissue type=error]O arquivo .npmrc não foi encontrado!"
            echo "##[error]O arquivo .npmrc não foi encontrado!"
            exit 1;
          fi
        workingDirectory: $(DEFAULT_NPMRC_TEMP_PATH)
    - task: Bash@3
      displayName: 'Update package.json version'
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      env:
        NEW_VERSION: $(NEW_VERSION)
      inputs:
        targetType: inline
        script: "\necho \"##[debug]Update Build Version:\"\n        \n# A versão utilizada do NPM é a versão default do Node.js nos agentes\n# Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF) na pasta raiz do projeto \nnpm --no-git-tag-version version ${NEW_VERSION} --allow-same-version\n"
    - task: Bash@3
      displayName: Determine NPM Cache Key
      env:
        PATH_OUTPUT_VARIABLE_NAME: APP_DEPENDENCIES_CACHE_PATH
        FOLDER_OUTPUT_VARIABLE_NAME: APP_DEPENDENCIES_CACHE_FOLDER
        CACHE_APP_DEPENDENCIES: eq(variables.CACHE_APP_DEPENDENCIES, true)
      inputs:
        targetType: inline
        script: "LOCK_FILE=$( [ -e \"package-lock.json\" ] && echo \"package-lock.json\" || echo \"package.json\" )\nCACHE_KEY=$(echo \"npm | $(Agent.OS) | $LOCK_FILE\")\n\nAPP_DEPENDENCIES_CACHE_PATH=\"\"\nAPP_DEPENDENCIES_CACHE_TMP_PATH=\"\"\nFOLDER=\"\"\nFOLDER_TMP=\"\"\n\necho \"##[debug] CACHE_APP_DEPENDENCIES..................: ${CACHE_APP_DEPENDENCIES}\"\n\nif [ \"${CACHE_APP_DEPENDENCIES}\" == \"true\" ]; then\n  FOLDER=\".cache/app_dependencies\"\n  FOLDER_TMP=\".cache/app_dependencies/temp\"\n  APP_DEPENDENCIES_CACHE_PATH=\"$(Pipeline.Workspace)/${FOLDER}\"\n  APP_DEPENDENCIES_CACHE_TMP_PATH=\"$(Pipeline.Workspace)/${FOLDER_TMP}\"\n  \n  rm -R -f $APP_DEPENDENCIES_CACHE_PATH\n  mkdir -p $APP_DEPENDENCIES_CACHE_PATH\n  rm -R -f $APP_DEPENDENCIES_CACHE_TMP_PATH\n  mkdir -p $APP_DEPENDENCIES_CACHE_TMP_PATH\nfi\n\necho \"##vso[task.setvariable variable=CACHE_KEY;]$CACHE_KEY\"\necho \"##vso[task.setvariable variable=$PATH_OUTPUT_VARIABLE_NAME;isreadonly=true]$APP_DEPENDENCIES_CACHE_PATH\"\necho \"##vso[task.setvariable variable=$FOLDER_OUTPUT_VARIABLE_NAME;isreadonly=true]$FOLDER\"]\necho \"##vso[task.setvariable variable=APP_DEPENDENCIES_CACHE_TMP_PATH;isreadonly=true]$APP_DEPENDENCIES_CACHE_TMP_PATH\"\n"
    - task: Cache@2
      inputs:
        key: $(CACHE_KEY)
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(APP_DEPENDENCIES_CACHE_PATH)
      displayName: Cache NPM Dependencies
      condition: eq(variables.CACHE_APP_DEPENDENCIES, true)
      env:
        TMPDIR: $(APP_DEPENDENCIES_CACHE_TMP_PATH)
    - task: Bash@3
      displayName: Build & Test & Coverage
      env:
        DOCKER_WORKDIR: $(DOCKER_WORKDIR)
        COMMAND_BUILD_TEST: $(CMD_BUILD_TEST)
        NPM_TEMP_FILE_PATH: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)
      inputs:
        targetType: inline
        script: "echo \"##[debug] HTTPS_PROXY..........................: ${HTTPS_PROXY}\"\necho \"##[debug] HTTP_PROXY...........................: ${HTTP_PROXY}\"\necho \"##[debug] NO_PROXY.............................: ${NO_PROXY}\"\necho \"##[debug] parameters.appDependenciesCachePath..: '$(APP_DEPENDENCIES_CACHE_PATH)'\"\n\nBUILDER_IMAGE_NAME=\"builder/node\"\ndocker build -t $BUILDER_IMAGE_NAME -f .azuredevops/builder.Dockerfile .\n\nNPM_CACHE_VOLUME=\"\"\nif [ -n \"$(APP_DEPENDENCIES_CACHE_PATH)\" ]; then\n  NPM_CACHE_FOLDER_CONTAINER=\"/tmp/$(APP_DEPENDENCIES_CACHE_FOLDER)\"\n  NPM_CACHE_VOLUME=\"-e NPM_CONFIG_CACHE=${NPM_CACHE_FOLDER_CONTAINER} -v $(APP_DEPENDENCIES_CACHE_PATH):${NPM_CACHE_FOLDER_CONTAINER}\"\n  \n  echo \"##[debug] parameters.appDependenciesCachePath....: $(APP_DEPENDENCIES_CACHE_PATH)\"\n  echo \"##[debug] parameters.appDependenciesCacheFolder..: $(APP_DEPENDENCIES_CACHE_FOLDER)\"\n  echo \"##[debug] app cache volume.......................: ${NPM_CACHE_VOLUME}\"\nfi\n\ndocker run --rm \\\n  --user=\"$(DOCKER_CMD_USERNAME):$(DOCKER_CMD_GROUP)\" \\\n  --network host \\\n  --log-driver none \\\n  -e NPM_CONFIG_USERCONFIG=\"/tmp/.npmrc\" \\\n  -e HTTPS_PROXY=\"$HTTPS_PROXY\" \\\n  -e HTTP_PROXY=\"$HTTP_PROXY\" \\\n  -e NO_PROXY=\"$NO_PROXY\" \\\n  -v $(pwd):/app \\\n  -v ${NPM_TEMP_FILE_PATH}:/tmp/.npmrc \\\n  -w ${DOCKER_WORKDIR} \\\n  ${NPM_CACHE_VOLUME} \\\n  $BUILDER_IMAGE_NAME sh -c \"${COMMAND_BUILD_TEST}\"\n"
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Copy to Staging Directory'
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: >
          **/*

          !.git/**/*

          !?/**/*

          !**/*.log
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        ArtifactName: app
        StoreAsTar: true
        PathtoPublish: $(Build.ArtifactStagingDirectory)
    - task: PublishTestResults@2
      name: t_publish_test_result
      displayName: Publish Test Results
      inputs:
        mergeTestResults: true
        searchFolder: $(Build.SourcesDirectory)
        testResultsFiles: '**/junit.xml'
        testResultsFormat: JUnit
        testRunTitle: Test Results
        failTaskOnFailedTests: true
        publishRunAttachments: false
      continueOnError: true
      condition: succeeded()
    - task: PublishCodeCoverageResults@1
      name: t_publish_code_coverage_result
      displayName: 'Publish Code Coverage Result'
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: $(Build.SourcesDirectory)/**/cobertura-coverage.xml
        pathToSources: $(Build.SourcesDirectory)/
        reportDirectory: $(Build.SourcesDirectory)/$(System.DefaultWorkingDirectory).devops/test/**/lcov-report
        additionalCodeCoverageFiles: $(Build.SourcesDirectory)/
      continueOnError: true
- stage: gate
  displayName: "Quality Gates"
  dependsOn:
  - build_test
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: gates_development_flow
    displayName: "Check development flow"
    condition: and( eq(variables.DEVELOPMENT_ENVIRONMENT_FLOW, true), notIn( variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master' ) )
    steps:
    - task: Bash@3
      displayName: "About stage"
      inputs:
        targetType: inline
        script: echo "##[warning] Pulando validações de quality gates devido ser um fluxo de desenvolvimento"
  - job: sonarqube
    condition: and( succeeded(), eq(variables.flowIsTagging, false), ne(variables.skip_sonarqube, true), ne(variables.DEVELOPMENT_ENVIRONMENT_FLOW, true) )
    displayName: Code Analysis
    variables:
    - name: APP_VERSION
      value: $[ stageDependencies.build_test.bump_version.outputs['component_bump_version.NEW_VERSION'] ]
    steps:
    - task: CmdLine@2
      displayName: "Extract catalog-info.yaml variables"
      condition: succeeded()
      inputs:
        script: |
          if [ ! -f "catalog-info.yaml" ]; then
            echo "##vso[task.logissue type=error] Unable to find catalog-info.yaml file (path=$(pwd))."
            exit 1
          fi

          GOV_APP_ACRONYM="$(yq -r '.metadata.annotations."techarch.governance-app.acronym" | select (.!=null) | downcase' catalog-info.yaml)"
          APP_SYSTEM="$(yq -r 'select(documentIndex == 0) | .spec.system | select (.!=null)' catalog-info.yaml)"
          APP_NAME="$(yq -r 'select(documentIndex == 0) | .metadata.name | select (.!=null)' catalog-info.yaml)"
          APP_DESCRIPTION="$(yq -r 'select(documentIndex == 0) | .metadata.description | select (.!=null)' catalog-info.yaml)"
          SONAR_PROJECT_KEY="$(yq -r 'select(documentIndex == 0) | .metadata.annotations."sonarqube.org/project-key" | select (.!=null)' catalog-info.yaml)"
          K8S_CONFIG="$(yq -r '.metadata.annotations."vivo.io/kubernetes-config" | select (.!=null)' catalog-info.yaml)"
          K8S_DEV="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-dev" | select (.!=null)' catalog-info.yaml)"
          K8S_HML="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-hml" | select (.!=null)' catalog-info.yaml)"
          K8S_PRD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-prd" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE="$(yq -r '.metadata.annotations."vivo.io/kubernetes-namespace" | select (.!=null)' catalog-info.yaml)"
          HELM_RELEASE="$(yq -r '.metadata.annotations."backstage.io/kubernetes-id" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_DEV="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-dev" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_HML="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-hml" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-prd" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_ESTEIRA1="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-esteira1" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_ESTEIRA2="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-esteira2" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PREPROD="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-preprod" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRODLIKE="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-prodlike" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_PRODUCAO="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-producao" | select (.!=null)' catalog-info.yaml)"
          K8S_NAMESPACE_DEVOPS="$(yq -r '.metadata.annotations."vivo.io/kubernetes-k8s-namespace-devops" | select (.!=null)' catalog-info.yaml)"

          echo "##[debug] GOV_APP_ACRONYM............: ${GOV_APP_ACRONYM}"
          echo "##[debug] APP_SYSTEM.................: ${APP_SYSTEM}"
          echo "##[debug] APP_NAME...................: ${APP_NAME}"
          echo "##[debug] SONAR_PROJECT_KEY..........: ${SONAR_PROJECT_KEY}"
          echo "##[debug] K8S_CONFIG.................: ${K8S_CONFIG}"
          echo "##[debug] K8S_DEV....................: ${K8S_DEV}"
          echo "##[debug] K8S_HML....................: ${K8S_HML}"
          echo "##[debug] K8S_PRD....................: ${K8S_PRD}"
          echo "##[debug] K8S_NAMESPACE..............: ${K8S_NAMESPACE}"
          echo "##[debug] HELM_RELEASE...............: ${HELM_RELEASE}"
          echo "##[debug] K8S_NAMESPACE_DEV..........: ${K8S_NAMESPACE_DEV}"
          echo "##[debug] K8S_NAMESPACE_HML..........: ${K8S_NAMESPACE_HML}"
          echo "##[debug] K8S_NAMESPACE_PRD..........: ${K8S_NAMESPACE_PRD}"
          echo "##[debug] K8S_NAMESPACE_ESTEIRA1.....: ${K8S_NAMESPACE_ESTEIRA1}"
          echo "##[debug] K8S_NAMESPACE_ESTEIRA2.....: ${K8S_NAMESPACE_ESTEIRA2}"
          echo "##[debug] K8S_NAMESPACE_PREPROD......: ${K8S_NAMESPACE_PREPROD}"
          echo "##[debug] K8S_NAMESPACE_PRODLIKE.....: ${K8S_NAMESPACE_PRODLIKE}"
          echo "##[debug] K8S_NAMESPACE_PRODUCAO.....: ${K8S_NAMESPACE_PRODUCAO}"
          echo "##[debug] K8S_NAMESPACE_DEVOPS.......: ${K8S_NAMESPACE_DEVOPS}"
          echo "##[debug] APP_DESCRIPTION............: ${APP_DESCRIPTION}"

          echo "##vso[task.setvariable variable=GOV_APP_ACRONYM]${GOV_APP_ACRONYM}"
          echo "##vso[task.setvariable variable=APP_SYSTEM]${APP_SYSTEM}"
          echo "##vso[task.setvariable variable=APP_NAME]${APP_NAME}"
          echo "##vso[task.setvariable variable=SONAR_PROJECT_KEY]${SONAR_PROJECT_KEY}"
          echo "##vso[task.setvariable variable=K8S_CONFIG]${K8S_CONFIG}"
          echo "##vso[task.setvariable variable=K8S_DEV]${K8S_DEV}"
          echo "##vso[task.setvariable variable=K8S_HML]${K8S_HML}"
          echo "##vso[task.setvariable variable=K8S_PRD]${K8S_PRD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE]${K8S_NAMESPACE}"
          echo "##vso[task.setvariable variable=HELM_RELEASE]${HELM_RELEASE}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_DEV]${K8S_NAMESPACE_DEV}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_HML]${K8S_NAMESPACE_HML}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRD]${K8S_NAMESPACE_PRD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA1]${K8S_NAMESPACE_ESTEIRA1}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA2]${K8S_NAMESPACE_ESTEIRA2}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PREPROD]${K8S_NAMESPACE_PREPROD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODLIKE]${K8S_NAMESPACE_PRODLIKE}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODUCAO]${K8S_NAMESPACE_PRODUCAO}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_DEVOPS]${K8S_NAMESPACE_DEVOPS}"
          echo "##vso[task.setvariable variable=APP_DESCRIPTION]${APP_DESCRIPTION}"
        workingDirectory: $(Build.SourcesDirectory)
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'SONARQUBE-TOKEN, SONARQUBE-TOKEN-TAG'
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: app
        parallelizationLimit: 20
        extractTars: true
    - task: CmdLine@2
      displayName: Set output variable LIBRARIES_PATH
      env:
        VARIABLE_NAME: LIBRARIES_PATH
        VARIABLE_VALUE: $(echo $(MAVEN_CACHE_FOLDER))
      inputs:
        script: |
          setVariables(){
            eval result=$2
            echo "##vso[task.setvariable variable=$1;]$result"
          }
          setVariables "${VARIABLE_NAME}" "${VARIABLE_VALUE}"
    - task: CmdLine@2
      displayName: Set output variable APP_VERSION
      env:
        VARIABLE_NAME: APP_VERSION
        VARIABLE_VALUE: $(DOCKER_CMD_EXTRACT_PACKAGE_JSON_VERSION)
      inputs:
        script: |
          setVariables(){
            eval result=$2
            echo "##vso[task.setvariable variable=$1;]$result"
          }
          setVariables "${VARIABLE_NAME}" "${VARIABLE_VALUE}"
    - task: Bash@3
      displayName: 'Setup Project & Quality Gate'
      env:
        SONARQUBE_TOKEN: $(SONARQUBE-TOKEN)
      inputs:
        targetType: inline
        script: "# Set value for timeout variable to SonarQube \n# If not set, default to 300 seconds\nif [ -z \"$SONARQUBE_QUALITYGATE_TIMEOUT\" ]; then\n  echo \"##vso[task.setvariable variable=SONARQUBE_QUALITYGATE_TIMEOUT]300\"\nelse\n  echo \"##vso[task.setvariable variable=SONARQUBE_QUALITYGATE_TIMEOUT]$SONARQUBE_QUALITYGATE_TIMEOUT\"\nfi\necho 'Sonar Timeout: ${SONARQUBE_QUALITYGATE_TIMEOUT}'\n\nurl=\"$(SONARQUBE_URL)\"\ntoken=\"${SONARQUBE_TOKEN}\"\nproject_key=\"$(SONAR_PROJECT_KEY)\"\nproject_name=\"$(System.TeamProject)-$(Build.Repository.Name)\"\napp_quality_gate=\"$(SONARQUBE_PROJECT_QUALITYGATE)\"\ndefault_quality_gate=\"$(SONARQUBE_DEFAULT_QUALITYGATE)\"\n\n# If no custom quality gate was provided, use default.\nif [[ -z $app_quality_gate ]]; then\n    app_quality_gate=\"$default_quality_gate\"\nfi\n\n# Checks if the project exists. If not, creates it.\nproject_exists=$(curl -s -X POST -u $token: \"$url/api/projects/search?projects=$project_key\" | jq '.paging.total' | sed 's/null/0/g')\n\nif [ \"$project_exists\" -ne 1 ]; then\n    project_status=$(curl -s -X POST -o ./.tmp.sonar.out -w \"%{http_code}\" -u $token: \"$url/api/projects/create?name=$project_name&project=$project_key&visibility=public\")\n\n    if [ \"$project_status\" -eq 200 ]; then\n        echo \"SonarQube project created for $project_name\"\n    else\n        echo \"Error creating SonarQube project for $project_name...($(cat ./.tmp.sonar.out | jq '.errors[0].msg'))\"\n    fi\nfi\n\n# Checks if the project's Quality Gate exists. If not, use default.\napp_quality_gate_status=$(curl -s -o /dev/null -w \"%{http_code}\" -u $token: \"$url/api/qualitygates/show?name=$app_quality_gate\")\n\nif [ \"$app_quality_gate_status\" -eq 200 ]; then\n    echo \"Quality Gate found ($app_quality_gate)\"\nelse\n    echo \"Quality Gate not found ($app_quality_gate). Using default...\"\n    \n    app_quality_gate=\"$default_quality_gate\"\nfi\n\n# Links the project to its Quality Gate\necho \"Ensuring project is linked to Quality Gate...\"\n\nstatus=$(curl -s -X POST -o /dev/null -w \"%{http_code}\" -u $token: \"$url/api/qualitygates/select?gateName=$app_quality_gate&projectKey=$project_key\")\n\nif [ \"$status\" -ne 204 ]; then\n    echo \"Error while linking application to Quality Gate!\"\nfi\n\nrm -rf ./.tmp.sonar.out\n"
    - task: Bash@3
      displayName: 'Setup Acronym to SonarQube Project'
      env:
        SONARQUBE_TOKEN_TAG: $(SONARQUBE-TOKEN-TAG)
        GOV_APP_ACRONYM: $(GOV_APP_ACRONYM)
      inputs:
        targetType: inline
        script: >
          url="$(SONARQUBE_URL)"

          token="${SONARQUBE_TOKEN_TAG}"

          project_key="$(SONAR_PROJECT_KEY)"

          gov_app_acronym=$(echo ${GOV_APP_ACRONYM} | tr '[:upper:]' '[:lower:]')


          echo "##[debug]PROJECT_KEY....................$project_key"

          echo "##[debug]GOV_APP_ACRONYM................$gov_app_acronym"


          check_tag_exists() {
              local t="$1"
              shift
              local array=("$@")
              for item in "${array[@]}"; do
                  if [[ "$item" == "$t" ]]; then
                      return 0
                  fi
              done
              return 1
          }


          tag_list=$(curl -s -u $token: "$url/api/components/search_projects?ps=500&filter=query%20%3D%20${project_key}" | jq -r --arg project_key "${project_key}" '.components[] | select(.key==$project_key) | .tags[]')

          readarray -t tag_list_arr <<<"$tag_list"


          if check_tag_exists "${gov_app_acronym}" "${tag_list_arr[@]}"; then
              echo "Tag ($gov_app_acronym) is already applied to the project $project_key!"
          else
              echo "Tag is missing!"
              echo "Applying tag ($gov_app_acronym) to $project_key..."
              tag_creation_status=$(curl -s -u $token: -d "project=${project_key}&tags=${gov_app_acronym}" -X POST -o ./.tmp.sonar.out -w "%{http_code}" "$url/api/project_tags/set")

              if [ "$tag_creation_status" -eq 204 ]; then
                  echo "Tag has been applied!"
              else
