          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA1]${K8S_NAMESPACE_ESTEIRA1}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_ESTEIRA2]${K8S_NAMESPACE_ESTEIRA2}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PREPROD]${K8S_NAMESPACE_PREPROD}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODLIKE]${K8S_NAMESPACE_PRODLIKE}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODUCAO]${K8S_NAMESPACE_PRODUCAO}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_DEVOPS]${K8S_NAMESPACE_DEVOPS}"
          echo "##vso[task.setvariable variable=APP_DESCRIPTION]${APP_DESCRIPTION}"
        workingDirectory: $(System.ArtifactsDirectory)
    - task: Bash@3
      condition: and( succeeded(), eq(variables.CONFIG_MANAGEMENT, true) )
      displayName: "Config management validations"
      env:
        ENVIRONMENT_CONFIG: dev
        HELM_RELEASE_NAMESPACE: ''
        helm_release_name_prefix: $(DEFAULT_PREFIX_HELM_RELEASE_NAME_DEV)
      inputs:
        targetType: inline
        script: "echo \"##[debug] Executando script de configuração de gerenciamento\"\ncd $(Build.SourcesDirectory)/$(Build.Repository.Name)\nnamespaces=($ARGOCD_NAMESPACES)\n\necho \"Gerando Config Map para $APP_NAME\"\n\nif [[ \"${ARGOCD_ALLNAMESPACES_HML}\" == \"true\" && ! ( \"${ENVIRONMENT_CONFIG}\" == \"producao\" || \"${ENVIRONMENT_CONFIG}\" == \"prod\" || \"${ENVIRONMENT_CONFIG}\" == \"production\" || \"${ENVIRONMENT_CONFIG}\" == \"ms\" ) ]]; then\n    echo \"##[debug] Executando argocd em homologacao\"\n    for env_config in \"${namespaces[@]}\"; do\n        mkdir ${env_config}\n        python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py -cm -cmf env/env.yaml -cmn $APP_NAME -cms ${env_config} -cmda ./${env_config}\n        if [[ $? != 0 ]]; then\n          exit 1\n        fi\n        mv ./${env_config}/configmap${env_config}.yaml ./${env_config}/$APP_NAME-ConfigMap.yaml\n        cd ../argocd/\n        git config --global --replace-all user.name \"Azure DevOps\"\n        git config --global --replace-all user.email \"azuredevops@telefonicati.onmicrosoft.com\"\n        git fetch\n        git checkout master\n        git reset --hard origin/master\n        cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${env_config}/$APP_NAME-ConfigMap.yaml ${env_config}\n        git pull origin master\n        git add ${env_config}/\n        git commit -m \"Nova versão de Configmap do $APP_NAME-ConfigMap no namespace ${env_config} \"\n        git push origin master\n        if [ $? -ne 0 ]; then\n          echo \"##vso[task.logissue type=error;] Git push failed. Exiting with error\"\n          echo \"##vso[task.complete result=Failed;]\"\n          exit 1\n        fi\n        cd $(Build.SourcesDirectory)/$(Build.Repository.Name)              \n    done\nelif [[ \"${ENVIRONMENT_CONFIG}\" == \"production\" || \"${ENVIRONMENT_CONFIG}\" == \"prod\" || \"${ENVIRONMENT_CONFIG}\" == \"producao\" || \"${ENVIRONMENT_CONFIG}\" == \"ms\" ]]; then\n    echo \"##[debug] Executando argocd em producao\"\n    mkdir ${ENVIRONMENT_CONF}\n    python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py -cm -cmf env/env.yaml -cmn $APP_NAME -cms ${ENVIRONMENT_CONF} -cmda ./${ENVIRONMENT_CONF}/\n    if [[ $? != 0 ]]; then\n      exit 1\n    fi\n    mv ${ENVIRONMENT_CONF}/configmap${ENVIRONMENT_CONF}.yaml ./${ENVIRONMENT_CONF}/$APP_NAME-ConfigMap.yaml\n    ls -la ../\n    cp ./${ENVIRONMENT_CONF}/$APP_NAME-ConfigMap.yaml ../argocd-production/${ENVIRONMENT_CONF}\n    cd ../argocd-production/\n    git config --global --replace-all user.name \"Azure DevOps\"\n    git config --global --replace-all user.email \"azuredevops@telefonicati.onmicrosoft.com\"\n    git fetch\n    git checkout master\n    git reset --hard origin/master\n    cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${ENVIRONMENT_CONF}/$APP_NAME-ConfigMap.yaml ${ENVIRONMENT_CONF}\n    git pull origin master\n    git add ${ENVIRONMENT_CONF}/\n    git commit -m \"Nova versão de Configmap do $APP_NAME-ConfigMap no namespace ${ENVIRONMENT_CONF} \"\n    git push origin master\n    if [ $? -ne 0 ]; then\n        echo \"##vso[task.logissue type=error;] Git push failed. Exiting with error\"\n        echo \"##vso[task.complete result=Failed;]\"\n        exit 1\n    fi\n    cd $(Build.SourcesDirectory)/$(Build.Repository.Name) \nelif [[ \"${CONFIG_MANAGEMENT_DEV}\" == \"true\" ]]; then\n    echo \"##[debug] Executando argocd em ambiente de desenvolvimento\"\n    mkdir ${ENVIRONMENT_CONFIG}\n    python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py -cm -cmf env/env.yaml -cmn $APP_NAME -cms dev -cmda ./${ENVIRONMENT_CONFIG}\n    if [[ $? != 0 ]]; then\n      exit 1\n    fi\n    mv ./${ENVIRONMENT_CONFIG}/configmapdev.yaml ./${ENVIRONMENT_CONFIG}/configmap${ENVIRONMENT_CONFIG}.yaml\n    mv ${ENVIRONMENT_CONFIG}/configmap${ENVIRONMENT_CONFIG}.yaml ./${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml\n    sed -i \"s/namespace: dev/namespace: ${ENVIRONMENT_CONFIG}/g\" ./${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml\n    ls -la ../\n    cp ./${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml ../argocd/${ENVIRONMENT_CONFIG}\n    cd ../argocd/\n    git config --global --replace-all user.name \"Azure DevOps\"\n    git config --global --replace-all user.email \"azuredevops@telefonicati.onmicrosoft.com\"\n    git fetch\n    git checkout master\n    git reset --hard origin/master\n    cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml ${ENVIRONMENT_CONFIG}\n    git pull origin master\n    git add ${ENVIRONMENT_CONFIG}/\n    git commit -m \"Nova versão de Configmap do $APP_NAME-ConfigMap no namespace ${ENVIRONMENT_CONFIG} \"\n    git push origin master\n    if [ $? -ne 0 ]; then\n      echo \"##vso[task.logissue type=error;] Git push failed. Exiting with error\"\n      echo \"##vso[task.complete result=Failed;]\"\n      exit 1\n    fi\n    cd $(Build.SourcesDirectory)/$(Build.Repository.Name)\nelse\n    echo \"##[debug] Executando argocd em homologacao\"\n    mkdir ${ENVIRONMENT_CONFIG}\n    python $(Build.SourcesDirectory)/Vivo.Core.Pipelines.Scripts/app.py -cm -cmf env/env.yaml -cmn $APP_NAME -cms ${ENVIRONMENT_CONFIG} -cmda ./${ENVIRONMENT_CONFIG}/\n    if [[ $? != 0 ]]; then\n      exit 1\n    fi\n    mv ${ENVIRONMENT_CONFIG}/configmap${ENVIRONMENT_CONFIG}.yaml ./${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml\n    cd ../argocd/\n    git config --global --replace-all user.name \"Azure DevOps\"\n    git config --global --replace-all user.email \"azuredevops@telefonicati.onmicrosoft.com\"\n    git fetch\n    git checkout master\n    git reset --hard origin/master\n    cp -f $(Build.SourcesDirectory)/$(Build.Repository.Name)/${ENVIRONMENT_CONFIG}/$APP_NAME-ConfigMap.yaml ${ENVIRONMENT_CONFIG}\n    git pull origin master\n    git add ${ENVIRONMENT_CONFIG}/\n    git commit -m \"Nova versão de Configmap do $APP_NAME-ConfigMap no namespace ${ENVIRONMENT_CONF} \"\n    git push origin master\n    if [ $? -ne 0 ]; then\n      echo \"##vso[task.logissue type=error;] Git push failed. Exiting with error\"\n      echo \"##vso[task.complete result=Failed;]\"\n      exit 1\n    fi\n    cd $(Build.SourcesDirectory)/$(Build.Repository.Name) \nfi\necho $(Build.SourcesDirectory)\necho $(Build.Repository.Name)\necho $APP_NAME\necho ${ENVIRONMENT_CONFIG}\nls -la\n"
  - deployment: dev
    condition: "or ( and( always(), eq(variables.flowIsTagging, false), eq(variables.flowIsMain, true)\n), startsWith(variables['Build.SourceBranch'], 'refs/heads/') )"
    workspace:
      clean: all
    displayName: Deploy
    environment:
      name: deploy-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
            inputs:
              repository: self
          - task: CmdLine@2
            displayName: "Checkout to Master or Main"
            condition: eq(variables['CHECKOUT_MASTER'], 'true')
            inputs:
              script: "echo \"\U0001F50D Buscando branches e verificando qual está mais atualizada...\"\ngit fetch --all\n\nMAIN_DATE=$(git log -1 --format=%ct origin/main 2>/dev/null || echo 0)\nMASTER_DATE=$(git log -1 --format=%ct origin/master 2>/dev/null || echo 0)\n\nif [[ \"$MAIN_DATE\" -eq 0 && \"$MASTER_DATE\" -eq 0 ]]; then\n  echo \"❌ Nenhuma das branches 'main' ou 'master' foi encontrada.\"\n  exit 1\nfi\n\nBRANCH=\"main\"\nif [[ \"$MASTER_DATE\" -gt \"$MAIN_DATE\" ]]; then\n  BRANCH=\"master\"\nfi\n\necho \"\U0001F504 A branch mais recente é '$BRANCH'. Fazendo checkout...\"\n\ngit switch \"$BRANCH\" || { echo \"⚠️ Erro ao fazer o checkout da branch '$BRANCH'\"; exit 1; }\ngit reset --hard origin/\"$BRANCH\" || { echo \"⚠️ Erro ao atualizar a branch '$BRANCH'\"; exit 1; }\n\necho \"✅ Código atualizado com sucesso na branch '$BRANCH'.\"\n"
          - task: DownloadBuildArtifacts@1
            displayName: 'Download Build docker'
            inputs:
              artifactName: docker
              parallelizationLimit: 20
              extractTars: false
              downloadPath: $(System.ArtifactsDirectory)
          - task: AzureKeyVault@2
            displayName: '[Helm Nexus] Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 3
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: $(AKV_DEVOPS_NAME)
              SecretsFilter: 'HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD'
            condition: and(succeeded(), ne(variables['HELM_REGISTRY_ACR_ENABLED'], 'true'))
          - task: AzureKeyVault@2
            displayName: '[Helm ACR] Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 3
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: $(AKV_DEVOPS_NAME)
              SecretsFilter: 'HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD'
            condition: and(succeeded(), eq(variables['HELM_REGISTRY_ACR_ENABLED'], 'true'), eq(variables['HELM-REGISTRY-ACR-USERNAME'], ''), eq(variables['HELM-REGISTRY-ACR-PASSWORD'], ''))
          - task: CmdLine@2
            displayName: "[ACR] Helm registry login"
            condition: and(succeeded(), eq(lower(variables['HELM_REGISTRY_ACR_ENABLED']), 'true'))
            env:
              HOST: $(HELM_REGISTRY_ACR_NAME)
              USERNAME: $(HELM-REGISTRY-ACR-USERNAME)
              PASSWORD: $(HELM-REGISTRY-ACR-PASSWORD)
            inputs:
              script: |
                source ~/.bashrc
                echo "##[debug] HOST.......: ${HOST}"
                echo "##[debug] USERNAME...: ${USERNAME}"
                echo "##[debug] PASSWORD...: ************"

                helm registry login ${HOST} \
                  --username ${USERNAME} \
                  --password "${PASSWORD}"
          - task: CmdLine@2
            displayName: "Set output variables"
            inputs:
              script: |
                setVariables(){
                  eval result=$2
                  echo "##vso[task.setvariable variable=$1;]$result"
                }

                DOCKER_OUTPUT="$(cat $(DEFAULT_WORKDIR_DOCKER_ARTIFACTS)/docker.json)"
                echo $DOCKER_OUTPUT | jq .

                setVariables "K8S_NAMESPACE" "$(echo $DOCKER_OUTPUT | jq -r '.K8S_NAMESPACE')"

                HELM_RELEASE_NAME="$(echo $DOCKER_OUTPUT | jq -r '.DOCKER_APP')"
                echo "##vso[task.setvariable variable=HELM_RELEASE_NAME;]$HELM_RELEASE_NAME"

