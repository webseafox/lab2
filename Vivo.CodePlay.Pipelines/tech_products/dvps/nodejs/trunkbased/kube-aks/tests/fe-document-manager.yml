pool:
  name: GeneralPurposeLinuxAgentsCI
trigger:
  batch: true
  branches:
    include:
    - main
    - master
  paths:
    include:
    - '*'
    exclude:
    - .azuredevops/*
    - docs/*
    - catalog-info.yaml
    - mkdocs.yml
    - scripts.py
    - catalog/*
parameters:
- name: qa_environment
  displayName: Escolha o ambiente para deploy
  type: string
  default: dev
