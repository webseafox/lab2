          echo "##vso[task.setvariable variable=K8S_NAMESPACE_PRODUCAO]${K8S_NAMESPACE_PRODUCAO}"
          echo "##vso[task.setvariable variable=K8S_NAMESPACE_DEVOPS]${K8S_NAMESPACE_DEVOPS}"
          echo "##vso[task.setvariable variable=APP_DESCRIPTION]${APP_DESCRIPTION}"
        workingDirectory: $(Build.SourcesDirectory)
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: app
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)
    - task: CmdLine@2
      displayName: Define Docker Tags
      env:
        MANUAL_RELEASE: false
        NAMESPACE: $(GOV_APP_ACRONYM)
        APP_SYSTEM: $(APP_SYSTEM)
        APP_NAME: $(APP_NAME)
        APP_VERSION: $(APP_VERSION)
        IS_NEXUS_REGISTRY: $(isNexusRegistry)
        IS_ACR_REGISTRY: $(isACRRegistry)
        DOCKER_SERVICE_CONNECTION: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)
        ENVIRONMENT: dev
        ACR_TAGGING_ENABLED: $[ eq(variables.ACR_TAGGING_ENABLED, true) ]
      inputs:
        script: "echo \"##[debug] BUILD_SOURCEBRANCH............: ${BUILD_SOURCEBRANCH}\"\necho \"##[debug] MANUAL_RELEASE................: ${MANUAL_RELEASE}\"\necho \"##[debug] NAMESPACE.....................: ${NAMESPACE}\"\necho \"##[debug] APP_SYSTEM....................: ${APP_SYSTEM}\"\necho \"##[debug] APP_NAME......................: ${APP_NAME}\"\necho \"##[debug] APP_VERSION...................: ${APP_VERSION}\"\necho \"##[debug] DOCKER_DEFAULT_REGISTRY.......: ${DOCKER_DEFAULT_REGISTRY}\"\necho \"##[debug] DOCKER_SERVICE_CONNECTION.....: ${DOCKER_SERVICE_CONNECTION}\"\necho \"##[debug] IS_NEXUS_REGISTRY.............: ${IS_NEXUS_REGISTRY}\"\necho \"##[debug] IS_ACR_REGISTRY...............: ${IS_ACR_REGISTRY}\"\necho \"##[debug] ENVIRONMENT...................: ${ENVIRONMENT}\"\necho \"##[debug] ACR_TAGGING_ENABLED...........: ${ACR_TAGGING_ENABLED}\"\n\necho \"##[section] Define docker tags\"\nSUFFIX=\"\"\nif [[ \"${BUILD_SOURCEBRANCH}\" == \"refs/heads/develop\" || \"${BUILD_SOURCEBRANCH}\" =~ ^\"refs/heads/develop/\" ]]; then\n  PREFIX=dev\n  BUILD_VERSION=\"${BUILD_SOURCEVERSION:0:7}\"\n  SUFFIX=\"-SNAPSHOT\"\nelif [[ \"${BUILD_SOURCEBRANCH}\" == \"refs/heads/release\" || \"${BUILD_SOURCEBRANCH}\" =~ ^\"refs/heads/release/\" ]]; then\n  PREFIX=rc\n  BUILD_VERSION=\"${BUILD_SOURCEVERSION:0:7}\"\n  SUFFIX=\"-RC\"\nelif [[ \"${BUILD_SOURCEBRANCH}\" == \"refs/heads/esteira1\" || \"${BUILD_SOURCEBRANCH}\" =~ ^\"refs/heads/esteira1/\" ]]; then\n  PREFIX=rc\n  BUILD_VERSION=\"${BUILD_SOURCEVERSION:0:7}\"\n  SUFFIX=\"-RC\"  \nelif [[ \"${BUILD_SOURCEBRANCH}\" == \"refs/heads/master\" || \"${BUILD_SOURCEBRANCH}\" == \"refs/heads/main\" || \"${BUILD_SOURCEBRANCH}\" =~ ^\"refs/tags/production/\" || \"${MANUAL_RELEASE}\" == \"true\" ]]; then\n  BUILD_VERSION=\"${BUILD_SOURCEVERSION:0:7}\"\n  if [[ \"${ENVIRONMENT}\" == \"dev\" ]]; then\n    PREFIX=dev\n  elif [[ \"${ENVIRONMENT}\" == \"esteira1\" || \"${ENVIRONMENT}\" == \"esteira2\" || \"${ENVIRONMENT}\" == \"preprod\" || \"${ENVIRONMENT}\" == \"prodlike\" ]]; then\n    PREFIX=rc\n  else\n    PREFIX=prd\n  fi\nfi\n\nif [[ -z \"${NAMESPACE}\" ]]; then\n  echo \"##[debug] RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND.............: ${RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND}\"\n  if [[ \"${RT_BROKEN_PIPE_WHEN_ACRONYM_NOT_FOUND}\" == \"true\" ]]; then\n    echo \"##vso[task.logissue type=error] Unable to find Governance App Acronym (techarch.governance-app.acronym) in catalog-info.yaml file. Contact DevOps Team for help.\"\n    exit 1;\n  else\n    echo \"##vso[task.logissue type=warning] Governance App Acronym property not found in catalog-info.yaml file. Setting APP_SYSTEM as NAMESPACE. Contact DevOps Team for help.\"\n    NAMESPACE=\"${APP_SYSTEM}\"\n  fi\nfi\n\n    \nIMAGE_NAME=\"${NAMESPACE}/${APP_NAME}\"\n\nif [[ \"${DEVELOPMENT_ENVIRONMENT_FLOW}\" == \"true\" ]]; then\n  echo \"##[warning] Development flow\"\n  APP_VERSION=$(DOCKER_CMD_DEVELOPMENT_FLOW_VERSION)\nfi\n\nif [[ ! \"${IS_ACR_REGISTRY}\" =~ \"(T|t)rue$\" ]]; then\n  BUILD_VERSION=\"${BUILD_VERSION}${SUFFIX}\"\nfi\n\nif [[ \"${BUMP_VERSION_ENABLED}\" == \"true\" || \"${BUMP_VERSION_ENABLED}\" == True ]]; then\n  IMAGE_TAG=\"${APP_VERSION}\"\nelse\n  IMAGE_TAG=\"${APP_VERSION}-${BUILD_VERSION}\"\nfi\n\nif [[ ${IS_ACR_REGISTRY} =~ (T|t)rue$ && ${ACR_TAGGING_ENABLED} =~ (T|t)rue$ ]]; then\n  IMAGE_TAG=\"${PREFIX}-${IMAGE_TAG}\"\nfi\n\n\necho \"##vso[task.setvariable variable=DOCKER_IMAGE_NAME;]${IMAGE_NAME}\"\necho \"##vso[task.setvariable variable=DOCKER_IMAGE_TAG;]${IMAGE_TAG}\"\n\necho \"##[debug] APP_VERSION...................: ${APP_VERSION}\"\necho \"##[debug] DOCKER_IMAGE_NAME.............: ${IMAGE_NAME}\"\necho \"##[debug] DOCKER_IMAGE_TAG..............: ${IMAGE_TAG}\"\n"
    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        workDir: $(DEFAULT_WORKDIR_ARTIFACTS)
        policySets: |
          image-definition-files
    - task: Docker@2
      displayName: Docker Build
      inputs:
        containerRegistry: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)
        command: build
        repository: $(DOCKER_IMAGE_NAME)
        Dockerfile: "$(DEFAULT_WORKDIR_ARTIFACTS)/.azuredevops/runtime.Dockerfile"
        buildContext: "$(DEFAULT_WORKDIR_ARTIFACTS)"
        arguments: --no-cache --build-arg APPLICATION_NAME=$(APP_NAME) --build-arg APPLICATION_PATH=target --build-arg APP_VERSION=$(APP_VERSION) --build-arg HTTP_PROXY="$(PROXY_AGENT_HTTP)" --build-arg HTTPS_PROXY="$(PROXY_AGENT_HTTPS)" --build-arg NO_PROXY="$(PROXY_AGENT_NO_PROXY)"
        tags: >
          $(DOCKER_IMAGE_TAG)
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'DEPENDENCY-TRACK-TOKEN, CONVISO-API-KEY'
      condition: and(eq(variables['DEPENDENCY-TRACK-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''), eq(variables.USE_DT_DOCKER, 'true'))
    - task: Bash@3
      displayName: About Stage
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        targetType: inline
        script: "RED='\\033[0;31m'\nGREEN='\\033[0;32m'\nBLUE='\\033[0;34m'\nYELLOW='\\033[1;33m'\nBG_GREEN='\\033[42;1;37m'\n\necho ' ================================================================================================================================'\necho '|                                                      _____             _______                                                 |'\necho '|                                    /\\               / ____|           |__   __|                                                |'\necho '|                                   /  \\   _ __  _ __| (___   ___  ___     | | ___  __ _ _ __ ___                                |'\necho '|                                  / /\\ \\ |  _ \\|  _ \\\\___ \\ / _ \\/ __|    | |/ _ \\/ _  |  _   _ \\                               |'\necho '|                                 / ____ \\| |_) | |_) |___) |  __/ (__     | |  __/ (_| | | | | | |                              |'\necho '|                                /_/    \\_\\ .__/| .__/_____/ \\___|\\___|    |_|\\___|\\__,_|_| |_| |_|                              |'\necho '|                                         | |   | |                                                                              |'\necho '|                                         |_|   |_|                                                                              |'\necho ' ================================================================================================================================'\necho \"                                                                                                      powered by Vivo AppSec Team\"\necho \"\"\n\nprintf \"\n=================================================================================================================================\n${GREEN}                                                 ${STAGENAME_DOCKER} \n=================================================================================================================================\n\n${MESSAGE}\n\n${YELLOW}O objetivo desse estágio é avaliar se existem vulnerabilidades nas dependências e bibliotecas de terceiros utilizadas em imagens Docker.\n${YELLOW}Em caso de dúvidas sobre essa fase do pipeline acesse a documentação https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659\n\n=================================================================================================================================\n\"\n"
    - task: LoadEndpointDockerRegistryFromVivo@4
      name: dockerendpoint
      displayName: 'Loading Docker Registry'
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        endpoint: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)
        authParamsFilter: 'REGISTRY'
    - task: TemplateInline@4
      condition: eq(variables.USE_DT_DOCKER, 'true')
      displayName: 'Generating Image Source for SCA Scan'
      inputs:
        source: |
          var DOCKER_REGISTRY = {{"$(dockerendpoint.AUTH_REGISTRY)" | replace(r/https?:\/\//, '')}}
    - task: Bash@3
      displayName: Run Scan and Send syft report to Dependency Track
      condition: eq(variables.USE_DT_DOCKER, 'true')
      env:
        DT_SCA_ENDPOINT: $(DT_SCA_ENDPOINT)
        CACORP_LOCATION: $(CACORP_LOCATION)
        DT_TOKEN: $(DEPENDENCY-TRACK-TOKEN)
        DT_PROJECT_ID: $(DT_PROJECT_ID)
        DT_APP_DEFAULT_VERSION: $(DT_APP_DEFAULT_VERSION)
        DT_APP_DEFAULT_NAME: $(DT_APP_DEFAULT_NAME)
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        SG_SEVERITY: "0"
      inputs:
        targetType: inline
        script: "echo \"##[debug]Getting SYFT Tool...\"\ncurl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /devops/syft v1.19.0\n\necho \"##[debug]SYFT Version: \"\n/devops/syft/syft --version\n\nIMAGE_SOURCE=\"${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}\"\n\necho \"Image Source ${IMAGE_SOURCE}\"\n\necho \"##[debug]Saving image .tar...\"\ndocker save -o ./docker-image.tar $IMAGE_SOURCE    \n\necho \"##[debug]Running syft for docker ...\"\nTMPDIR=$(Agent.TempDirectory) /devops/syft/syft scan ./docker-image.tar --verbose -o cyclonedx-json=raw_cyclonedx_report.json    \n\njq '.components |= unique_by(.name,.version)' raw_cyclonedx_report.json > cyclonedx_report.json    \n\nif [ -e \"cyclonedx_report.json\" ]; then\n  echo \"##[debug]Scan completed.\"\nelse\n  echo \"##[debug]Scan fail.\"\n  exit 1\nfi\n\necho \"##[debug]Uploading BOM to DT...\"\n\nBOMCONTENT=$(cat cyclonedx_report.json | base64 -w 0)\nODTFILE=\"bom_payload.json\"\n\necho \"Nome do projeto: ${DT_APP_DEFAULT_NAME}\"\necho \"Versão: ${DT_APP_DEFAULT_VERSION}\"\n\nPAYLOAD='{ \"projectName\": \"'${DT_APP_DEFAULT_NAME}'\", \"projectVersion\": \"'${DT_APP_DEFAULT_VERSION}'\", \"autoCreate\": true, \"bom\": \"'${BOMCONTENT}'\" }'\n\necho -n $PAYLOAD > $ODTFILE\n\nRESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n            -X PUT \"${DT_SCA_ENDPOINT}/v1/bom\" \\\n            -H \"X-API-Key: ${DT_TOKEN}\" \\\n            -H 'Content-Type: application/json' \\\n            -d \"@${ODTFILE}\")\n\necho \"##[debug]Uploaded! Response: ${RESPONSE}\"\n\nsbomToken=$(jq -r '.token' <<< \"$RESPONSE\")\n\necho \"##[debug]Moving SBOM to Artifacts directory...\"\n\nmv raw_cyclonedx_report.json $(Build.ArtifactStagingDirectory)/\n\ni=\"0\"\nretries=\"25\"\necho \"Aguardando Sincronização finalizar\"\nwhile [[ $i -lt $retries ]]\ndo\n\nRESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n             -X GET \"${DT_SCA_ENDPOINT}/v1/bom/token/${sbomToken}\" \\\n             -H \"X-API-Key: ${DT_TOKEN}\" \\\n             -H 'Content-Type: application/json')\n\necho \"##[debug]Status de processamento: ${RESPONSE}\"\n\n  if [[ \"$(jq -r '.processing' <<< \"$RESPONSE\")\" == \"false\" ]]\n  then\n      echo \"Sincronização finalizada com sucesso\"\n\n      DT_APP_DEFAULT_NAME=\"${DT_APP_DEFAULT_NAME// /%20}\"\n\n      echo ${DT_APP_DEFAULT_NAME}\n      \n      RESPONSE=$(curl -s --cacert ${CACORP_LOCATION} \\\n                   -X GET \"${DT_SCA_ENDPOINT}/v1/project/lookup?name=${DT_APP_DEFAULT_NAME}&version=${DT_APP_DEFAULT_VERSION}\" \\\n                   -H \"X-API-Key: ${DT_TOKEN}\" \\\n                   -H 'Content-Type: application/json')\n\n      echo \"##[debug]Valor do Lookup: ${RESPONSE}\"\n\n      DT_PROJECT_ID=$(jq -r '.uuid' <<< \"$RESPONSE\")\n\n      gateValidation=$(jq -r '.metrics.policyViolationsSecurityUnaudited' <<< \"$RESPONSE\")\n\n      echo \"##[debug]Valor do UUID: ${DT_PROJECT_ID}\"\n\n      echo \"##[debug]Violações não auditadas: ${gateValidation}\"\n\n      echo \"##vso[task.setvariable variable=DT_PROJECT_ID]$DT_PROJECT_ID\"          \n\n      if [ \"$gateValidation\" -gt \"${SG_SEVERITY}\" ]; then\n\n       echo \"##vso[task.logissue type=error;]Foram encontradas vulnerabilidades críticas e/ou altas neste projeto. Número de violações identificadas: $gateValidation\"\n\n       SG_BLOCK=\"true\"\n\n       echo \"##vso[task.setvariable variable=sgBlock]$SG_BLOCK\"\n                \n       exit\n      fi\n\n      exit 0\n  fi\n  i=$[$i+1]\n  sleep 15s\n  done  \n\necho \"##vso[task.logissue type=error;]Tempo esgotado - A Sincronização não foi finalizada, tente rodar novamente.\"\necho \"##vso[task.complete result=Failed;]\"\n"
    - task: convisoAzureSyncTask@1
      displayName: "Conviso Sync"
      condition: and( eq(variables.USE_CONVISO, 'true'), eq(variables.USE_DT_DOCKER, 'true'))
      continueOnError: true
      inputs:
        API_KEY: "$(CONVISO-API-KEY)"
        PROJECT_ID: "$(DT_PROJECT_ID)"
        INTEGRATION: "DEPENDENCY_TRACK"
        COMPANY_ID: "$(CONVISO_COMPANY_ID)"
    - task: PublishBuildArtifacts@1
      displayName: "Publishing SBOM"
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        pathToPublish: "$(Build.ArtifactStagingDirectory)/raw_cyclonedx_report.json"
        artifactName: "sbom-docker"
    - task: Bash@3
      displayName: "Evaluate Security Gate"
      inputs:
        targetType: 'inline'
        script: |2

          echo "SKIP_SECURITY_GATE_SCA: ${SKIP_SECURITY_GATE_SCA}"
          echo "SG_BLOCK: ${SG_BLOCK}"

          if [[ "${SG_BLOCK}" =~ ^(T|t)rue$ ]]; then
            echo "##vso[task.logissue type=error;]O Security Gate falhou pois foram encontradas potenciais vulnerabilidades críticas e altas por nossas ferramentas de segurança em código fonte para este projeto. Para mais informações, acesse a wiki do time de AppSec da Vivo em https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659"
            echo "##vso[task.complete result=Failed;]"
            exit
          fi
          echo "##[debug]Não foram encontradas vulnerabilidades críticas e altas que violam as políticas de AppSec. Para mais informações sobre o nosso processo, acesse https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659"
      condition: and( eq(variables.SKIP_SECURITY_GATE_SCA, 'false'), eq(variables.USE_DT_DOCKER, 'true'))
      env:
        SKIP_SECURITY_GATE_SCA: ''
        SG_BLOCK: "$(sgBlock)"
    - task: Docker@2
      displayName: Docker Push
      name: dockerPushImage
      condition: and(succeeded(), eq(variables.flowIsPullRequest, false))
      inputs:
        containerRegistry: $(DOCKER_DEFAULT_REGISTRY_SERVICE_CONNECTION_NAME)
        command: push
        repository: $(DOCKER_IMAGE_NAME)
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(DOCKER_IMAGE_TAG)
    - task: CmdLine@2
      displayName: "Troubleshooting help"
      condition: failed()
      inputs:
        script: >
          if [ "$(Agent.JobStatus)" == "Failed" ]; then
            echo "##[error]Erro no push da imagem Docker. Possíveis causas:"
            echo "1. Verifique se está havendo instabilidade na rede e tente novamente."
            echo "2. Verifique se as credenciais do registry estão configuradas corretamente."
            echo "3. Verifique se a imagem já existe, pois não é permitida a sobrescrita."
            echo "4. Valide o nome e a tag da imagem:"
            echo "   - Nome: $(DOCKER_IMAGE_NAME)"
            echo "   - Tag: $(DOCKER_IMAGE_TAG)"
            echo "5. Verifique permissões de escrita no registro."
            exit 1
          fi
    - task: CmdLine@2
      displayName: Export Image Digest
      name: docker_digest
      env:
        DOCKER_OUTPUT: $(dockerPushImage.DockerOutput)
      inputs:
        script: |
          echo "##[group] ${DOCKER_OUTPUT}"
          cat ${DOCKER_OUTPUT}
          echo "##[endgroup]"

          DOCKER_DIGEST="$(cat ${DOCKER_OUTPUT} | grep "digest" | awk -F ' ' '{print $3}')"
          echo "##[debug] DOCKER_DIGEST..........: ${DOCKER_DIGEST}"
          echo "##vso[task.setvariable variable=DOCKER_DIGEST;isOutput=true]${DOCKER_DIGEST}"
    - task: jabbera.git-tag-on-release-task.git-tag-on-release-task.git-tag-on-release-task@9
      retryCountOnTaskFailure: 3
      displayName: "Git tag with version"
      inputs:
        staticTagName: $(DOCKER_IMAGE_TAG)
      condition: ne(variables.BUMP_VERSION_ENABLED, true)
    - task: CmdLine@2
      displayName: "Generate docker.json metadata"
      env:
        DOCKER_REGISTRY: $(DOCKER_DEFAULT_REGISTRY)
        DOCKER_IMAGE_NAME: $(DOCKER_IMAGE_NAME)
        DOCKER_IMAGE_TAG: $(DOCKER_IMAGE_TAG)
        DOCKER_APP_NAME: $(APP_NAME)
        DOCKER_APP_VERSION: $(APP_VERSION)
        K8S_NAMESPACE: $(K8S_NAMESPACE)
      inputs:
        script: |
          cat <<EOF > docker.json
          {
            "DOCKER_REGISTRY": "${DOCKER_REGISTRY}",
            "DOCKER_IMAGE_NAME": "${DOCKER_IMAGE_NAME}",
            "DOCKER_IMAGE_TAG": "${DOCKER_IMAGE_TAG}",
            "DOCKER_APP": "${DOCKER_APP_NAME}",
            "DOCKER_APP_VERSION": "$(APP_VERSION)",
            "DOCKER_IMAGE_NAME_FULL": "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}",
            "K8S_NAMESPACE": "${K8S_NAMESPACE}",
            "GIT_TAG": "${DOCKER_IMAGE_TAG}"
          }
          EOF

          echo "##[command] cat docker.json"
          cat docker.json
    - task: CopyFiles@2
      displayName: 'Copy to Staging Directory'
      inputs:
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true
        CleanTargetFolder: true
        Contents: |
          docker.json
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact Docker'
      inputs:
        ArtifactName: docker
        StoreAsTar: false
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      inputs:
        repository: self
        persistCredentials: "true"
        clean: true
    - task: Bash@3
      displayName: "Preparation"
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      env:
        BRANCH_NAME: "$(Build.SourceBranchName)"
      inputs:
        targetType: inline
        script: |
          git config pull.rebase true
          git fetch -f --depth 1 origin ${BRANCH_NAME}:${BRANCH_NAME}
          git checkout -f ${BRANCH_NAME}
    - task: Bash@3
      displayName: 'Update Component Version'
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      env:
        NEW_VERSION: $(APP_VERSION)
      inputs:
        targetType: inline
        script: "\necho \"##[debug] Update Repository Version:\"\n\n# A versão utilizada do NPM é a versão default do Node.js nos agentes\n# Caso seja necessário uma versão diferente, é necessário adicionar o .tool-versions (ASDF)na pasta do projeto \nnpm --no-git-tag-version version ${NEW_VERSION} --allow-same-version\n"
    - task: Bash@3
      displayName: 'Commit Updated Version'
      condition: eq(variables.BUMP_VERSION_ENABLED, true)
      env:
        COMPONENT_NEW_VERSION: $(APP_VERSION)
        BRANCH_NAME: "$(Build.SourceBranchName)"
        TAG_REPO: true
      inputs:
        targetType: inline
        script: "TAG_PUSH_PARAM=\"\"\n\necho \"##[debug] TAG_REPO.....: ${TAG_REPO}\"\n\ngit add .\ngit commit -am \"[CI SKIP] Project version has been updated. Released version '${COMPONENT_NEW_VERSION}'\" --author=\"$BUILD_REQUESTEDFOR <$BUILD_REQUESTEDFOREMAIL>\"\n\nif [[ \"${TAG_REPO}\" == \"true\" ]]; then\n  TAG_PUSH_PARAM=\"--tags\"\n\n  git tag ${COMPONENT_NEW_VERSION}\nfi\n\ngit status\necho \"##[command] git push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}\"\ngit push origin ${TAG_PUSH_PARAM} ${BRANCH_NAME}\n\nif [ $? -ne 0 ]; then \n  echo \"##vso[task.logissue type=error;] Git push failed. Permission denied\"\n  echo \"##vso[task.complete result=Failed;]\"\n  exit 1\nfi  \n\necho \"Version updated to ${COMPONENT_NEW_VERSION}\"\n"
    - task: CmdLine@2
      displayName: "Troubleshooting help"
      condition: failed()
      inputs:
        script: |
          if [ "$(Agent.JobStatus)" == "Failed" ]; then
            echo "##[error]Erro no push para o repositório"
            echo ""
            echo "Por favor, reexecute novamente para descartar problemas"
            echo "de rede. Caso a reexecução falhe, verifique se repositório informado"
            echo "existe e se a pipeline tem permissão para acessá-lo."
            exit 1
          fi
- stage: validation
  displayName: "Validation"
  dependsOn:
  - package
  pool:
    name: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: validation
    condition: and(succeeded(), eq(variables.flowIsTagging, false), eq(variables.flowIsMain, true))
    displayName: "Gates Validation"
    steps:
    - task: Bash@3
      displayName: About Stage
      env:
        DOC_URL: $(CORPORATE_WIKI_DOC_URL)
        MESSAGE: >
          Lembre-se que a esteira apenas reflete o comportamento da sua aplicação e de acordo com as variáveis definidas.
      inputs:
        targetType: inline
