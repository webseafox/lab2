          echo "##[debug] K8S_NAMESPACE_HML..........: ${K8S_NAMESPACE_HML}"
          echo "##[debug] K8S_NAMESPACE_PRD..........: ${K8S_NAMESPACE_PRD}"
          echo "##[debug] K8S_NAMESPACE_ESTEIRA1.....: ${K8S_NAMESPACE_ESTEIRA1}"
