parameters:
- name: helm_chart_name
  displayName: Nome do Heml Chart dentro do repositorio 'devops-helm' default 'generic-microservice'
  default: generic-microservice

- name: helm_chart_version
  default: 1.0.8

- name: overwrite_variables
  displayName: 'Sobrescreve ou adiciona novas variaveis globais'
  type: object
  default: []

- name: variable_groups
  displayName: Lista de Variables Groups para complementar variaveis e segredos.
  default: []
  type: object

- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - esteira1
  - esteira2
  - esteira3
  - preprod
  - production
  - prodlike

- name: kubernetes_connection
  displayName: 
    "Service connection do AKS ex 'aks-[app_acronym]-brsouth-[environment]'"
  type: string

- name: resource_group
  displayName: 
    "Resrouce Group da Azure ex 'rg-[app_acronym]-brsouth-[environment]'"
  type: string

- name: vivonow_chg
  displayName: 'Numero CHG do VivoNow, somente para "production"'
  default: CHG0000001

variables:
- name: System.debug
  value: 'true'
- ${{ each group_name in parameters.variable_groups }}:
  - group: ${{ group_name }}

- name: DOCKER_TAG_SUFIX
  ${{ if eq('${{ parameters.environment }}', 'production') }}:
    value: 'RELEASE'
  ${{ else }}:
    value: 'SNAPSHOT'

- ${{ each variable in parameters.overwrite_variables }}:
  - name: ${{ variable.name }}
    value: ${{ variable.value }}


stages:
- stage:
  displayName: "Ensure config files"
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job: 
    displayName: "Ensure files"
    steps:
    - checkout: self
      fetchDepth: 1

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: "catalog-info.yaml"
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']

    - task: TypescriptRunner@4
      displayName: 'Extract variables'
      inputs:
        script: |- # typescript
          const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
          set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

    - script: |- # shell
        echo "##vso[build.addbuildtag]helm"
        echo "##vso[build.addbuildtag]kubernetes"
        echo "##vso[build.addbuildtag]acr"
        echo "##vso[build.addbuildtag]azure-feneration"
        echo "##vso[build.addbuildtag]nodejs"
        echo "##vso[build.addbuildtag]artifacts"
        echo "##vso[build.addbuildtag]cd-gold"
        echo "##vso[build.addbuildtag]$(GOV_APP_ACRONYM)"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'

    - task: EnsureFile@4
      displayName: 'Ensure .nvmrc'
      inputs:
        fileName: '.nvmrc'
        createIfNotExist: true
        defaultContent: 'v18.15.0'

    - task: EnsureFile@4
      displayName: 'Ensure .npmrc'
      inputs:
        fileName: '.npmrc'
        createIfNotExist: true
        defaultContent: |
          registry=https://pkgs.dev.azure.com/telefonica-vivo-brasil/_packaging/DevOps/npm/registry/
          always-auth=true

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/values.yml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/values.yml
        createIfNotExist: true
        defaultContent: |-
          replicaCount: 1

          # See https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
          serviceAccount:
            create: false
            annotations: {}
            name: ""

          # See https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          podAnnotations:
            instrumentation.opentelemetry.io/inject-java: "true"
            
          # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
          podSecurityContext: {}

          # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
          securityContext: {}

          # See https://kubernetes.io/docs/concepts/services-networking/service/
          service:
            type: ClusterIP
            port: 8080

          # container settings
          container:
            port: 80
            schema: HTTP

          # See https://istio.io/
          istio:
            # Enabled istio service mesh
            enabled: true
            # Enabled istio release canary
            canaryEnabled: false
            # See https://istio.io/latest/docs/tasks/traffic-management/circuit-breaking/
            circuitBreak:
              connectionPool:
                # Enabled circuit break
                enabled: false
                # The maximum number of connections to a backend. Any excess connection will be pending in
                # a queue. You can modify this number by changing the maxConnections field.
                maxConnections: 10
                # The maximum number of pending requests to a backend. Any excess pending requests will be 
                # denied. You can modify this number by changing the http1MaxPendingRequests field.
                http1MaxPendingRequests: 50
                # The maximum number of requests in a cluster at any given time. You can modify this 
                # number by changing the maxRequestsPerConnection field.
                maxRequestsPerConnection: 10 
            # See https://istio.io/latest/docs/reference/config/networking/virtual-service/
            virtualService:
              hosts: 
                - "vvat-integracao.redecorp.br"
              gateways:
                - "vvat-gateway.vvat-common.svc.cluster.local"
              
          #     # See https://istio.io/latest/docs/reference/config/networking/virtual-service/#CorsPolicy
          #     allowOrigins: ["*"]
          #     allowCredentials: True
          #     allowHeaders: []
          #     allowMethods: ["POST", "GET", "PUT", "DELETE", "OPTIONS", "PATCH", "TRACE", "HEAD", "CONNECT" ]

          # See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources: {}
            # limits:
            #   cpu: 500m
            #   memory: 512Mi
            # requests:
            #   cpu: 100m
            #   memory: 128Mi

          # See https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
          autoscaling:
            enabled: false
            istioEnabled: false
            minReplicas: 1
            maxReplicas: 1
            targetCPUUtilizationPercentage:

          # See https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
          nodeSelector: {}

          # See https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
          tolerations: []

          # See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
          affinity: {}

          # See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          liveness:
            enabled: false
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php
          # See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          readiness:
            enabled: false
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php

          ####################################################################################################################
          #                                          MICROSERVICE SECTION                                                    #
          ####################################################################################################################
          # Microservice default Timezone
          timezone: "America/Sao_Paulo"

          # Name of your microservice, this name will be registered in service discovery,
          # so it is important to follow a pattern of names and that this name is not too long.
          # Ex: cac-sample-microservice.
          applicationName: "$(CATALOG_YAML_NAME)"
          applicationVersion: "1"
          applicationPrefix: "/$(CATALOG_YAML_NAME)/v1"
              
          # Additional keys that will be added to the configmap.
          # See the examples below.
          configMapKeys: {}
            # key: value

            # configuration: |
            #   #!/bin/bash
            #   echo teste ..  

          # Environment variables that will be used by the worker.
          # See the example below.
          applicationVariables: []

          volumes: []

          volumeMounts: []
        # defaultContent: |-
        #   applicationName: "$(CATALOG_YAML_NAME)"
        #   applicationVersion: "SNAPSHOT"
        #   applicationPrefix: "/"

        #   replicaCount: 1
        #   serviceAccount:
        #     create: false
        #     annotations: {}
        #     name: ""
        #   podAnnotations: {}
        #   podSecurityContext: {}
        #   securityContext: {}
        #   service:
        #     type: ClusterIP
        #     port: 8080
        #   container:
        #     port: 80
        #     schema: HTTP
        #   istio:
        #     enabled: true
        #     canaryEnabled: false
        #     circuitBreak:
        #       connectionPool:
        #         enabled: false
        #         maxConnections: 10
        #         http1MaxPendingRequests: 50
        #         maxRequestsPerConnection: 10
        #     virtualService:
        #       hosts:
        #         - "$(CATALOG_YAML_K8S_NS).redecorp.azr"
        #       gateways:
        #         - "$(CATALOG_YAML_ACRONYM)-gateway.$(CATALOG_YAML_ACRONYM)-common.svc.cluster.local"
        #       rewriteUri: /
        #   resources: {}
        #   autoscaling:
        #     enabled: false
        #     istioEnabled: false
        #     minReplicas: 1
        #     maxReplicas: 1
        #     targetCPUUtilizationPercentage:

        #   nodeSelector: {}
        #   tolerations: []
        #   affinity: {}
        #   liveness:
        #     enabled: false
        #     failureThreshold: 3
        #     initialDelaySeconds: 10
        #     periodSeconds: 10
        #     successThreshold: 1
        #     timeoutSeconds: 120
        #     healthCheck: /health

        #   readiness:
        #     enabled: false
        #     failureThreshold: 3
        #     periodSeconds: 10
        #     successThreshold: 1
        #     timeoutSeconds: 120
        #     healthCheck: /health

        #   timezone: "America/Sao_Paulo"
        #   configMapKeys: {}
        #   applicationVariables: []
        #   volumes: []
        #   volumeMounts: []

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/environments_variables.yml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/environments_variables.yml
        createIfNotExist: true
        defaultContent: |-
          env: []

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/secrets.yaml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/secrets.yaml
        createIfNotExist: true
        defaultContent: |-
          secrets: []
          secretFiles: []

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          .nvmrc
          .npmrc
          .azuredevops/config/${{ parameters.environment }}/values.yml
          .azuredevops/config/${{ parameters.environment }}/environments_variables.yml
          .azuredevops/config/${{ parameters.environment }}/secrets.yaml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'generated-sources'
        PathtoPublish: $(Build.ArtifactStagingDirectory)

- stage:
  displayName: 'VivoNow Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Check on (VivoNow)'
    condition: eq('${{ parameters.environment }}', 'production')
    steps:

    - task: AxiosFromVivo@4
      displayName: 'Fetch CHG'
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'GET',
            url: 'http://10.41.252.111:9010/vivonow/viewer/${{ parameters.vivonow_chg }}'
          };
        variablePrefix: 'VIVO_NOW_CHG_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: RegexMatch@4
      displayName: 'Query CHG'
      inputs:
        source: $(VIVO_NOW_CHG_BODY)
        regex: '/(<title>)(.*)(<\/title>)/ig'
        outVarPrefix: 'CHG_FOUND_'

    - script: exit 1
      displayName: 'Check CHG'
      condition: not(variables['CHG_FOUND_HAS_MATCH'])

- stage:
  displayName: 'GovApp Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Governance Policies Check'
    steps:
    - checkout: self

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version

    - task: LoadFile@4
      displayName: 'Load catalog-info.yaml'
      inputs:
        script: |
          CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

    - task: VivoGovernance@1
      continueOnError: true
      displayName: 'Governance Validate'
      inputs:
        breakglass: false
        serverEndpoint: 'governanceapi'
        operation: 'validate'
        component: $(CATALOG_YAML_NAME)
        version: $(POM_XML_VERSION)
        cluster: ${{ parameters.kubernetes_connection }}
        namespace: $(CATALOG_YAML_K8S_NS)
        deployment: $(CATALOG_YAML_NAME)
        environment: ${{ parameters.environment }}
        catalogInfo: $(CATALOG_YAML_CONTENT)

- stage:
  displayName: 'Push to Repositories'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    condition: eq('${{ parameters.environment }}', 'production')
    displayName: 'Push to Docker (RELEASE)'
    steps:

    - checkout: self
      fetchDepth: 1

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: 'package.json'
        jpaths: |
          var PACKAGE_JSON_VERSION = .version

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: 'catalog-info.yaml'
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']

    - task: TypescriptRunner@4
      displayName: 'Extract variables'
      inputs:
        script: |- # typescript
          const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
          set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

    - task: Docker@2
      displayName: 'Docker Pull (SNAPSHOT)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: pull
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(GOV_APP_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-SNAPSHOT\
          "

    - task: Docker@2
      displayName: 'Docker Tag to (RELEASE)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: tag
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(GOV_APP_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-SNAPSHOT\
          \ \
          acrsharedservices01.azurecr.io\
          /$(GOV_APP_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-RELEASE\
          "

    - task: Docker@2
      displayName: 'Push to Docker (RELEASE)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: push
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(GOV_APP_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-RELEASE\
          "

- stage:
  displayName: 'Deploy on (${{ parameters.environment }})'
  pool: GeneralPurposeLinuxAgentsCD
  variables:
  - name: System.debug
    value: "true"
  jobs:
  - deployment:
    displayName: 'Deploy on (${{ parameters.environment }})'
    # creates an environment if it doesn't exist
    environment:
      name: 'deploy-${{ parameters.environment }}'
    # variables:
    #   - name: HELM_EXPERIMENTAL_OCI
    #     value: 1
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 1

          - task: DownloadBuildArtifacts@1
            displayName: 'Download generated files'
            inputs:
              buildType: 'current'
              artifactName: 'generated-sources'
              downloadPath: $(System.ArtifactsDirectory)
          
          - task: CopyFiles@2
            displayName: 'Overwrite generated sources'
            inputs:
              SourceFolder: $(System.ArtifactsDirectory)/generated-sources
              Contents: '**'
              TargetFolder: './'
              OverWrite: true

          - task: JsonParseFromVivo@4
            displayName: 'Get package.json info'
            inputs:
              type: 'file'
              origin: 'package.json'
              jpaths: |
                var PACKAGE_JSON_VERSION = .version

          - task: YamlParseFromVivo@4
            displayName: 'Get catalog-info.yaml info'
            inputs:
              type: 'file'
              origin: catalog-info.yaml
              jpaths: |-
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
                
          - task: TypescriptRunner@4
            displayName: 'Extract variables'
            inputs:
              script: |- # typescript
                const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
                set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: >-
                NEXUS-DEPS-USR, NEXUS-DEPS-PSW,
                HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
                HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD

          - task: Kubernetes@1
            displayName: "Kube config initialize"
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: ${{ parameters.kubernetes_connection }}
              azureResourceGroup: ${{ parameters.resource_group }}
              kubernetesCluster: ${{ parameters.kubernetes_connection }}
              command: 'login'

          - task: PlaceInFiles@4
            displayName: "Apply config variables"
            inputs:
              globPattern: ".azuredevops/config/${{ parameters.environment }}/*.y*ml"
              regex: '/\$\(([^\)]+)\)/gmi'

          - task: Bash@3
            displayName: 'Helm status on (${{ parameters.environment }})'
            inputs:
              targetType: inline
              script: |- # shell
                HELM_STATUS=$(helm history "$(CATALOG_YAML_NAME)"  \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig $(KUBECONFIG) \
                -o json)

                echo "##vso[task.setvariable variable=HELM_STATUS;]$HELM_STATUS";

          - task: JsonParseFromVivo@4
            displayName: 'Helm revision info'
            condition: not(eq(variables['HELM_STATUS'], ''))
            inputs:
              sourceType: 'var'
              source: 'HELM_STATUS'
              queries: |-
                # last deployed revision
                var LAST_DEPLOYED_REV = $[?(@.status=='deployed')].revision
                # last deployed
                var LAST_STATUS = $[-1:].status
                # last failed
                var LAST_REV = $[-1:].revision

          - task: TypescriptRunner@4
            displayName: 'Ensure LAST_DEPLOYED_REV'
            inputs:
              script: | #typescript
                set_variable(
                  'LAST_DEPLOYED_REV', 
                  process.env.LAST_DEPLOYED_REV || '0'
                );

          - task: Bash@3
            displayName: 'Helm rollback last failure on (${{ parameters.environment }})'
            condition:
              and(
                not(eq(variables['LAST_STATUS'], 'deployed')),
                not(eq(variables['LAST_REV'], ''))
              )
            continueOnError: true
            inputs:
              targetType: inline
              script: >- # shell
                
                helm rollback "$(CATALOG_YAML_NAME)" $(LAST_DEPLOYED_REV)
                --namespace "$(CATALOG_YAML_K8S_NS)"
                --kubeconfig $(KUBECONFIG)

          - task: Bash@3
            displayName: 'Helm force uninstall (${{ parameters.environment }})'
            condition: in(variables['Agent.JobStatus'], 'Failed', 'SucceededWithIssues')
            inputs:
              targetType: inline
              script: >- # shell
                
                helm uninstall "$(CATALOG_YAML_NAME)"
                --namespace "$(CATALOG_YAML_K8S_NS)" 
                --kubeconfig $(KUBECONFIG)
                --description "[codeplay-nodejs-aks] Failed to rollback, forcing uninstall"
                --wait

          - task: Bash@3
            displayName: Check namespace
            inputs:
              targetType: inline
              script: >- # shell
                #                
                kubectl get deployment "$(CATALOG_YAML_NAME)" \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig=" $(KUBECONFIG)" \
                --insecure-skip-tls-verify

                echo "##vso[task.setvariable variable=EXISTING_DEPLOYMENT]$?"

          - task: Bash@3
            displayName: Check All Deployments in namespace
            inputs:
              targetType: inline
              script: >- # shell
                #                
                kubectl get all "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig=" $(KUBECONFIG)" \
                --insecure-skip-tls-verify

          - task: Bash@3
            displayName: "Helm registry login (ACR)"
            inputs:
              targetType: inline
              script: >- # shell
                #
                helm registry login acrsharedservices01.azurecr.io
                --username $(HELM-REGISTRY-ACR-USERNAME)
                --password "$(HELM-REGISTRY-ACR-PASSWORD)"

          - task: HelmDeploy@1
            displayName: 'Add devops-helm repo from (Nexus)'
            inputs:
              azureSubscription: ${{ parameters.kubernetes_connection }}
              azureResourceGroup: ${{ parameters.resource_group }}
              kubernetesCluster: ${{ parameters.kubernetes_connection }}
              command: 'repo'
              arguments: >-
                add devops-helm
                "https://nexus.telefonica.com.br/repository/devops-helm"
                --force-update
                --insecure-skip-tls-verify
                --username "$(HELM-REGISTRY-NEXUS-USERNAME)"
                --password "$(HELM-REGISTRY-NEXUS-PASSWORD)"


          - task: TypeScriptRunner@4
            displayName: 'Helm upgrade on (${{ parameters.environment }})'
            inputs:
              script: | # typescript
                const existDeployment = !process.env.EXISTING_DEPLOYMENT

                const helmUpgradeCommand = [
                  `helm upgrade ${existDeployment ? '' : '--install'} $(CATALOG_YAML_NAME)`,
                  'oci://acrsharedservices01.azurecr.io/helm/devops/${{ parameters.helm_chart_name }}',
                  '--version "${{ parameters.helm_chart_version }}"',
                  '--set "nameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "fullnameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "containerName=$(CATALOG_YAML_NAME)"',
                  '--set "image.repository=acrsharedservices01.azurecr.io/$(GOV_APP_ACRONYM)/$(CATALOG_YAML_NAME)"',
                  '--set "image.tag=$(PACKAGE_JSON_VERSION)-$(DOCKER_TAG_SUFIX)"',
                  '--set "imagePullSecrets[0].name=acr-devops"',
                  '-f .azuredevops/config/${{ parameters.environment }}/values.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/environments_variables.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/secrets.yaml',
                  '--kubeconfig $(KUBECONFIG)',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--install',
                  '--insecure-skip-tls-verify',
                  '--output table',
                  '--history-max 5',
                  '--debug',
                  '--atomic',
                  '--wait',
                  '--timeout 300s',
                ].join(' ');

                const kubelogs = [
                  'kubectl logs',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-f',
                  '--all-containers=true',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(KUBECONFIG)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const kubeevents = [
                  'kubectl events',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-w',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(KUBECONFIG)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const cwd = process.cwd();
                const pid1out = [];
                const pid2out = [];

                const pid1 = sh.exec(kubeevents, { cwd, async: true, silent: true });
                pid1.stdout.on('data', (chunk) => pid1out.push(chunk))
                pid1.stderr.on('data', (chunk) => pid1out.push(chunk))

                const pid2 = sh.exec(kubelogs, { cwd, async: true, silent: true });
                pid2.stdout.on('data', (chunk) => pid2out.push(chunk))
                pid2.stderr.on('data', (chunk) => pid2out.push(chunk))

                const pid = sh.exec(helmUpgradeCommand, { cwd }, (code, stdout, stderr) => {
                  console.info('kube events!')
                  console.log(pid1out.join('') || 'No events!');

                  console.info('kube logs!')
                  console.log(pid2out.join('') || 'No logs');

                  process.exit(code);
                });

        on:
          success:
            steps:
            - checkout: self
              fetchDepth: 1

            - task: JsonParseFromVivo@4
              displayName: 'Get package.json info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/package.json
                jpaths: |
                  var PACKAGE_JSON_VERSION = .version

            - task: LoadFile@4
              displayName: 'Load catalog-info.yaml'
              inputs:
                script: |
                  CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

            - task: YamlParseFromVivo@4
              displayName: 'Get Metadata Info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/catalog-info.yaml
                jpaths: |
                  var CATALOG_YAML_NAME = .metadata.name
                  var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

            - task: VivoGovernance@1
              displayName: 'Gov Notify "deploy"'
              inputs:
                breakglass: false
                serverEndpoint: 'governanceapi'
                operation: 'deploy'
                component: $(CATALOG_YAML_NAME)
                version: $(PACKAGE_JSON_VERSION)
                cluster: ${{ parameters.kubernetes_connection }}
                namespace: $(CATALOG_YAML_K8S_NS)
                deployment: $(CATALOG_YAML_NAME)
                environment: ${{ parameters.environment }}
                catalogInfo: $(CATALOG_YAML_CONTENT)

          failure:
            steps:
            - checkout: none

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

