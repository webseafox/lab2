    - task: TypeScriptRunner@4
      displayName: 'Commit project updates'
      inputs:
        script: | # typescript
          const res = await fetch(
            'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)',
            {
              method: 'PUT',
              headers: {
