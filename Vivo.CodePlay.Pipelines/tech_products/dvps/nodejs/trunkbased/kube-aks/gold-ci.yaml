parameters:
- name: helm_chart_name
  displayName: Nome do Heml Chart dentro do repositorio 'devops-helm' default 'generic-microservice'
  default: generic-microservice

- name: helm_chart_version
  default: 1.0.8

- name: overwrite_variables
  displayName: 'Sobrescreve ou adiciona novas variaveis globais'
  type: object
  default: []

- name: variable_groups
  displayName: Lista de Variables Groups para complementar variaveis e segredos.
  default: []
  type: object

- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - esteira1
  - esteira2
  - esteira3
  - preprod
  - production
  - prodlike

- name: kubernetes_connection
  displayName: 
    "Service connection do AKS ex 'aks-[app_acronym]-brsouth-[environment]'"
  type: string

- name: resource_group
  displayName: 
    "Resrouce Group da Azure ex 'rg-[app_acronym]-brsouth-[environment]'"
  type: string

- name: vivonow_chg
  displayName: 'Numero CHG do VivoNow, somente para "production"'
  default: CHG0000001

variables:
- name: System.debug
  value: 'true'
- ${{ each group_name in parameters.variable_groups }}:
  - group: ${{ group_name }}

- name: SONARQUBE_PROJECT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: ASDF_JDK_11
  value: "openjdk-11.0.2"

- name: DOCKER_TAG_SUFIX
  ${{ if eq('${{ parameters.environment }}', 'production') }}:
    value: 'RELEASE'
  ${{ else }}:
    value: 'SNAPSHOT'

- ${{ each variable in parameters.overwrite_variables }}:
  - name: ${{ variable.name }}
    value: ${{ variable.value }}


stages:
- stage:
  displayName: "Ensure config files"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: 
    displayName: "Ensure files"
    steps:
    - checkout: self
      fetchDepth: 1

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: "catalog-info.yaml"
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']

    - task: TypescriptRunner@4
      displayName: 'Extract variables'
      inputs:
        script: |- # typescript
          const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
          set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

    - script: |- # shell
        echo "##vso[build.addbuildtag]helm"
        echo "##vso[build.addbuildtag]kubernetes"
        echo "##vso[build.addbuildtag]acr"
        echo "##vso[build.addbuildtag]azure-feneration"
        echo "##vso[build.addbuildtag]nodejs"
        echo "##vso[build.addbuildtag]artifacts"
        echo "##vso[build.addbuildtag]ci-gold"
        echo "##vso[build.addbuildtag]sonar-scan"
        echo "##vso[build.addbuildtag]fortify"
        echo "##vso[build.addbuildtag]$(GOV_APP_ACRONYM)"
        echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'

    - task: EnsureFile@4
      displayName: 'Ensure .nvmrc'
      inputs:
        fileName: '.nvmrc'
        createIfNotExist: true
        defaultContent: 'v18.15.0'

    - task: EnsureFile@4
      displayName: 'Ensure .npmrc'
      inputs:
        fileName: '.npmrc'
        createIfNotExist: true
        defaultContent: |
          registry=https://pkgs.dev.azure.com/telefonica-vivo-brasil/_packaging/DevOps/npm/registry/
          always-auth=true

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/values.yml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/values.yml
        createIfNotExist: true
        defaultContent: |-
          replicaCount: 1

          # See https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
          serviceAccount:
            create: false
            annotations: {}
            name: ""

          # See https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          podAnnotations:
            instrumentation.opentelemetry.io/inject-java: "true"
            
          # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
          podSecurityContext: {}

          # See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
          securityContext: {}

          # See https://kubernetes.io/docs/concepts/services-networking/service/
          service:
            type: ClusterIP
            port: 8080

          # container settings
          container:
            port: 80
            schema: HTTP

          # See https://istio.io/
          istio:
            # Enabled istio service mesh
            enabled: true
            # Enabled istio release canary
            canaryEnabled: false
            # See https://istio.io/latest/docs/tasks/traffic-management/circuit-breaking/
            circuitBreak:
              connectionPool:
                # Enabled circuit break
                enabled: false
                # The maximum number of connections to a backend. Any excess connection will be pending in
                # a queue. You can modify this number by changing the maxConnections field.
                maxConnections: 10
                # The maximum number of pending requests to a backend. Any excess pending requests will be 
                # denied. You can modify this number by changing the http1MaxPendingRequests field.
                http1MaxPendingRequests: 50
                # The maximum number of requests in a cluster at any given time. You can modify this 
                # number by changing the maxRequestsPerConnection field.
                maxRequestsPerConnection: 10 
            # See https://istio.io/latest/docs/reference/config/networking/virtual-service/
            virtualService:
              hosts: 
                - "vvat-integracao.redecorp.br"
              gateways:
                - "vvat-gateway.vvat-common.svc.cluster.local"
              
          #     # See https://istio.io/latest/docs/reference/config/networking/virtual-service/#CorsPolicy
          #     allowOrigins: ["*"]
          #     allowCredentials: True
          #     allowHeaders: []
          #     allowMethods: ["POST", "GET", "PUT", "DELETE", "OPTIONS", "PATCH", "TRACE", "HEAD", "CONNECT" ]

          # See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources: {}
            # limits:
            #   cpu: 500m
            #   memory: 512Mi
            # requests:
            #   cpu: 100m
            #   memory: 128Mi

          # See https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
          autoscaling:
            enabled: false
            istioEnabled: false
            minReplicas: 1
            maxReplicas: 1
            targetCPUUtilizationPercentage:

          # See https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
          nodeSelector: {}

          # See https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
          tolerations: []

          # See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
          affinity: {}

          # See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          liveness:
            enabled: false
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php
          # See https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          readiness:
            enabled: false
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php

          ####################################################################################################################
          #                                          MICROSERVICE SECTION                                                    #
          ####################################################################################################################
          # Microservice default Timezone
          timezone: "America/Sao_Paulo"

          # Name of your microservice, this name will be registered in service discovery,
          # so it is important to follow a pattern of names and that this name is not too long.
          # Ex: cac-sample-microservice.
          applicationName: "$(CATALOG_YAML_NAME)"
          applicationVersion: "1"
          applicationPrefix: "/$(CATALOG_YAML_NAME)/v1"
              
          # Additional keys that will be added to the configmap.
          # See the examples below.
          configMapKeys: {}
            # key: value

            # configuration: |
            #   #!/bin/bash
            #   echo teste ..  

          # Environment variables that will be used by the worker.
          # See the example below.
          applicationVariables: []

          volumes: []

          volumeMounts: []
        # defaultContent: |-
        #   applicationName: "$(CATALOG_YAML_NAME)"
        #   applicationVersion: "SNAPSHOT"
        #   applicationPrefix: "/"

        #   replicaCount: 1
        #   serviceAccount:
        #     create: false
        #     annotations: {}
        #     name: ""
        #   podAnnotations: {}
        #   podSecurityContext: {}
        #   securityContext: {}
        #   service:
        #     type: ClusterIP
        #     port: 8080
        #   container:
        #     port: 80
        #     schema: HTTP
        #   istio:
        #     enabled: true
        #     canaryEnabled: false
        #     circuitBreak:
        #       connectionPool:
        #         enabled: false
        #         maxConnections: 10
        #         http1MaxPendingRequests: 50
        #         maxRequestsPerConnection: 10
        #     virtualService:
        #       hosts:
        #         - "$(CATALOG_YAML_K8S_NS).redecorp.azr"
        #       gateways:
        #         - "$(CATALOG_YAML_ACRONYM)-gateway.$(CATALOG_YAML_ACRONYM)-common.svc.cluster.local"
        #       rewriteUri: /
        #   resources: {}
        #   autoscaling:
        #     enabled: false
        #     istioEnabled: false
        #     minReplicas: 1
        #     maxReplicas: 1
        #     targetCPUUtilizationPercentage:

        #   nodeSelector: {}
        #   tolerations: []
        #   affinity: {}
        #   liveness:
        #     enabled: false
        #     failureThreshold: 3
        #     initialDelaySeconds: 10
        #     periodSeconds: 10
        #     successThreshold: 1
        #     timeoutSeconds: 120
        #     healthCheck: /health

        #   readiness:
        #     enabled: false
        #     failureThreshold: 3
        #     periodSeconds: 10
        #     successThreshold: 1
        #     timeoutSeconds: 120
        #     healthCheck: /health

        #   timezone: "America/Sao_Paulo"
        #   configMapKeys: {}
        #   applicationVariables: []
        #   volumes: []
        #   volumeMounts: []

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/environments_variables.yml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/environments_variables.yml
        createIfNotExist: true
        defaultContent: |-
          env: []

    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/secrets.yaml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/secrets.yaml
        createIfNotExist: true
        defaultContent: |-
          secrets: []
          secretFiles: []

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version

    - task: SemverIncrementCustomFromVivo@5
      displayName: 'Semver Increment "patch"'
      name: new_version
      inputs:
        currentversion: $(PACKAGE_JSON_VERSION)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"

    # Alternative
    # - script: npm version patch --no-git-tag-version
    #   displayName: Bump version

    - task: NodeTool@0
      displayName: "Ensure Node"
      inputs:
        versionSource: 'fromFile'
        versionFilePath: '.nvmrc'

    - task: Npm@1
      displayName: "npm version"
      inputs:
        command: 'custom'
        customCommand: >- 
          --no-git-tag-version
          version $(new_version.NEW_VERSION)

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          .nvmrc
          .npmrc
          .azuredevops/config/${{ parameters.environment }}/values.yml
          .azuredevops/config/${{ parameters.environment }}/environments_variables.yml
          .azuredevops/config/${{ parameters.environment }}/secrets.yaml
          package.json
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'generated-sources'
        PathtoPublish: $(Build.ArtifactStagingDirectory)
- stage:
  displayName: 'VivoNow Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Check on (VivoNow)'
    condition: eq('${{ parameters.environment }}', 'production')
    steps:

    - task: AxiosFromVivo@4
      displayName: 'Fetch CHG'
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'GET',
            url: 'http://10.41.252.111:9010/vivonow/viewer/${{ parameters.vivonow_chg }}'
          };
        variablePrefix: 'VIVO_NOW_CHG_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: RegexMatch@4
      displayName: 'Query CHG'
      inputs:
        source: $(VIVO_NOW_CHG_BODY)
        regex: '/(<title>)(.*)(<\/title>)/ig'
        outVarPrefix: 'CHG_FOUND_'

    - script: exit 1
      displayName: 'Check CHG'
      condition: not(variables['CHG_FOUND_HAS_MATCH'])

- stage:
  displayName: 'GovApp Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Governance Policies Check'
    steps:
    - checkout: self

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version

    - task: LoadFile@4
      inputs:
        script: |
          CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

    - task: VivoGovernance@1
      continueOnError: true
      displayName: 'Governance Validate'
      inputs:
        breakglass: false
        serverEndpoint: 'governanceapi'
        operation: 'validate'
        component: $(CATALOG_YAML_NAME)
        version: $(POM_XML_VERSION)
        cluster: ${{ parameters.kubernetes_connection }}
        namespace: $(CATALOG_YAML_K8S_NS)
        deployment: $(CATALOG_YAML_NAME)
        environment: ${{ parameters.environment }}
        catalogInfo: $(CATALOG_YAML_CONTENT)

- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  condition: succeeded()
  jobs:
  - job:
    displayName: 'Jira Commit Integration'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Regex@4
      displayName: 'Filter Commit Message'
      inputs:
        source: $(Build.SourceVersionMessage)
        regex: '/^[^:]+ {0,}: {0,}(([^| ]+) {0,}\| {0,}([^| ]+) {0,}\| {0,}(.+) {0,})/gm'


    - task: TypeScriptRunner@4
      displayName: 'Get Commit Info'
      condition: eq(variables['REGEX_HAS_MATCH'], 'true')
      inputs:
        azureDevOpsEndpoint: 'Azure DevOps Api Generic'
        script: |- # typescript
          const { BUILD_REPOSITORY_ID } = process.env;
          const commits = await (await connection.getGitApi()).getCommits(BUILD_REPOSITORY_ID, {$top: 1});
          
          set_variable('COMMITTER_NAME)', commits[0].committer.name);
          set_variable('COMMIT_DATE)', commits[0].committer.date);

    # - task: KafkaProducer@0.0.16
    #   displayName: 'Publicar informações no tópico'
    #   condition: eq(variables['REGEX_HAS_MATCH'], 'true')
    #   inputs:
    #     kafkaOamEndpoint: 'KafkaEsteiraDigitalProd'
    #     kafkaProducerClientId: 'esteira-digital-group'
    #     kafkaServer: 'oauth.bootstrap.apps.ocp-kafka-prd.redecorp.br:443'
    #     commitDate: $(COMMIT_DATE)
    #     commitId: $(Build.SourceVersion)
    #     commitMessage: $(Build.SourceVersionMessage)
    #     committerName: $(COMMITTER_NAME)
    #     repoName: $(Build.Repository.Name)
    #     kafkaTopic: "integracao-azure-jira-branch-master"
    #     debug: true

  - job: build
    displayName: 'Build, Unit Test and Pack'
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'generated-sources'
        downloadPath: $(System.ArtifactsDirectory)

    - task: CopyFiles@2
      displayName: Overwrite generated sources
      inputs:
        SourceFolder: $(System.ArtifactsDirectory)/generated-sources
        Contents: '**'
        TargetFolder: './'
        OverWrite: true

    - task: AzureKeyVault@2
      displayName: 'Secrets from AKV'
      inputs:
        RunAsPreJob: true
        azureSubscription: "DevOpsSharedResources"
        KeyVaultName: "kv-azdevops-shared"
        SecretsFilter: >-
          NEXUS-DEPS-USR, NEXUS-DEPS-PSW,
          NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW,
          SONARQUBE-TOKEN

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version
          var PACKAGE_JSON_NODE_VERSION = .engines.node

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - task: TypescriptRunner@4
      displayName: 'Extract variables'
      inputs:
        script: |- # typescript
          const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
          set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

    - task: NodeTool@0
      displayName: Ensure Node 
      inputs:
        versionSource: 'fromFile'
        versionFilePath: '.nvmrc'

    - task: npmAuthenticate@0
      displayName: Npm Artifacts Authentication
      inputs:
        workingFile: ".npmrc"

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version
          var PACKAGE_JSON_BUILD = .scripts.build
          var PACKAGE_JSON_TEST = .scripts.test
          var PACKAGE_JSON_LINT = .scripts.lint

    - task: Npm@1
      displayName: "Install dependencies"
      inputs:
        command: 'custom'
        customCommand: 'i -ddd'
    
    - task: Npm@1
      condition: not(eq(variables['PACKAGE_JSON_LINT'], ''))
      continueOnError: true
      displayName: "Run Lint"
      inputs:
        command: 'custom'
        customCommand: 'run lint'

    - task: Npm@1
      condition: not(eq(variables['PACKAGE_JSON_BUILD'], ''))
      displayName: "Transpile and Bundle"
      inputs:
        command: 'custom'
        customCommand: 'run build'

    - task: Npm@1
      condition: not(eq(variables['PACKAGE_JSON_TEST'], ''))
      continueOnError: true
      displayName: "Run Test"
      inputs:
        command: 'custom'
        customCommand: 'run test'

    - task: PublishTestResults@2
      condition: not(eq(variables['PACKAGE_JSON_TEST'], ''))
      inputs:
        testResultsFormat: 'JUnit'
        mergeTestResults: true

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)/bin
        Contents: |
          coverage/**/*
          dist/**/*
          bin/**/*
          out/**/*
          lib/**/*
        CleanTargetFolder: true
        # OverWrite: true
        flattenFolders: false

    - task: ListFilesAndFolders@4
      displayName: 'Find "sonar.java.binaries"'
      inputs:
        scriptSource: 'text'
        separator: ','
        script: 
          var://BINARIES_DIRECTORIES = $(Build.SourcesDirectory)/**/dist

    - task: SonarQubePrepare@5
      displayName: 'Config Sonar'
      inputs:
        SonarQube: VIVO_SONARQUBE
        scannerMode: "CLI"
        # configFile Não funciona no scannerMode Other, apenas CLI (https://learn.microsoft.com/pt-br/azure/devops/pipelines/tasks/reference/sonar-qube-prepare-v5?view=azure-pipelines)
        configFile: $(Build.SourcesDirectory)/sonar-project.properties
        extraProperties: |
          sonar.scm.disabled=True
          sonar.projectBaseDir=$(Build.SourcesDirectory)
          sonar.projectKey=$(CATALOG_YAML_SONAR_PROJECT_KEY)
          sonar.projectName=$(SONARQUBE_PROJECT_NAME)
          sonar.projectVersion=$(new_version.NEW_VERSION)
          sonar.analysis.repositoryName=$(Build.Repository.Name)
          sonar.analysis.buildId=$(Build.BuildId)
          sonar.analysis.repositoryId=$(Build.Repository.ID)
          sonar.analysis.projectName=$(System.TeamProject)
          sonar.analysis.projectId=$(System.TeamProjectId)
          sonar.links.homepage=$(System.TeamFoundationCollectionUri)$(System.TeamProject)
          sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&_a=summary
          sonar.links.issue=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_workitems
          sonar.links.scm=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)
          sonar.scanner.metadataFilePath=$(Agent.TempDirectory)/sonar/$(Build.BuildId)/report-task.txt
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300
          sonar.sources=.
          sonar.inclusions=**/src/**/*
          sonar.java.binaries=$(BINARIES_DIRECTORIES)

    - script: asdf install java $(ASDF_JDK_11)
      displayName: 'Ensure Sonarqube Java Version'

    - task: SonarQubeAnalyze@5
      displayName: 'Sonar Scan'
      continueOnError: true
      env:
        ASDF_JAVA_VERSION: $(ASDF_JDK_11)

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'bin'
        PathtoPublish: $(Build.ArtifactStagingDirectory)/bin

    - task: ListFilesAndFolders@4
      displayName: 'Find Dockerfile'
      inputs:
        script: 'var://DOCKERFILES = **/*ockerfile'
        dot: true

    - task: PythonRunner@4
      displayName: 'Ensure Dockerfile'
      inputs:
        script: | # py
          import os
          set_variable('DOCKERFILE',
            (os.getenv('DOCKERFILES') or '.azuredevops/runtime.Dockerfile')
            .split(',')[0]
          )

    # ==================================================================
    # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
    # ==================================================================
    - task: VivoDevOpsConfigCompliance@1
      displayName: 'Check DevOps Config Compliance'
      inputs:
        policySets: |
          image-definition-files

    - task: Docker@2
      displayName: 'Docker Build'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: build
        repository: $(GOV_APP_ACRONYM)/$(CATALOG_YAML_NAME)
        Dockerfile: $(DOCKERFILE)
        buildContext: ./
        addPipelineData: true
        addBaseImageData: true
        arguments: >-
          --no-cache 
          --build-arg APPLICATION_NAME=$(CATALOG_YAML_NAME)
          --build-arg APP_VERSION=$(PACKAGE_JSON_VERSION) 
          --build-arg APPLICATION_PATH=target 
          --build-arg HTTP_PROXY="http://10.240.58.39:3128"
          --build-arg HTTPS_PROXY="http://10.240.58.39:3128"
          --build-arg NO_PROXY="localhost, 0.0.0.0, 127.0.0.1, 10.244.0.0/16, 192.168.0.0/16, 10.129.178.173, nexus.telefonica.com.br, acrsharedservices01.azurecr.io, appcs-azdevops-shared.azconfig.io, scm.azurewebsites.net"

        tags: >
          $(PACKAGE_JSON_VERSION)-SNAPSHOT

    - task: Docker@2
      displayName: 'Push to Docker (SNAPSHOT)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: push
        repository: $(GOV_APP_ACRONYM)/$(CATALOG_YAML_NAME)
        addPipelineData: true
        addBaseImageData: true
        tags: >
          $(PACKAGE_JSON_VERSION)-SNAPSHOT

  - job:
    dependsOn: build
    displayName: 'Push to Git (TAG)'
    steps:
    - checkout: self
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'generated-sources'
        downloadPath: $(Build.ArtifactStagingDirectory)

    - task: JsonParseFromVivo@4
      displayName: 'Get package.json info'
      inputs:
        type: 'file'
        origin: $(Build.ArtifactStagingDirectory)/generated-sources/package.json
        jpaths: |
          var PACKAGE_JSON_VERSION = .version

    - task: Bash@3
      displayName: 'Commit new version'
      continueOnError: false
      inputs:
        targetType: inline
        script: |- # shell
          git switch -c $(Build.SourceBranch)
          yes | cp -r -f $(Build.ArtifactStagingDirectory)/generated-sources/package.json ./

          git add .
          git commit -m "[skip ci] CodePlay bump version $(PACKAGE_JSON_VERSION)"
          git tag $(PACKAGE_JSON_VERSION) -m "Version has been updated to $(PACKAGE_JSON_VERSION)"
          git push origin --tags HEAD:$(Build.SourceBranchName)

          echo "##[command] yes | cp -r -f $(Build.ArtifactStagingDirectory)/generated-sources/package.json ./"
          echo "##[command] git add ."
          echo "##[command] git commit -m \"[skip ci] CodePlay bump version $(PACKAGE_JSON_VERSION)\""
          echo "##[command] git tag $(PACKAGE_JSON_VERSION) -m \"Version has been updated to $(PACKAGE_JSON_VERSION)\""
          echo "##[command] git push origin --tags HEAD:$(Build.SourceBranchName)"

- stage:
  displayName: 'Fortify Gate'
  condition: succeeded()
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job:
    displayName: 'Fortify Scan'
    variables:
    - name: System.debug
      value: true
    - name: CACORP_LOCATION
      value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"
    steps:
    - checkout: self
      fetchDepth: 1

    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: >-
          FORTIFY-SSC-CLI-TOKEN,
          FORTIFY-SCANCENTRAL-CLIENT-TOKEN,
          CONVISO-API-KEY

    - task: AzureAppConfiguration@8
      displayName: 'Download configuration keys'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        AppConfigurationEndpoint: https://appcs-azdevops-shared.azconfig.io
        KeyFilter: "RT_CONVISO_NEW_INTEGRATION"
        Label: 'VIVO-CORE-PIPELINES'

    - task: TemplateInline@4
      displayName: 'Bind Fortify Variables'
      inputs:
        autoSurround: false
        sourceType: 'text'
        source: |-
          var FORTIFY_PROJECT_NAME = {{ (SYSTEM_TEAMPROJECT + '-' + BUILD_REPOSITORY_NAME) | replace(r/ +/ig, '-') | replace(r/-+/i, '-') }}
          secret FORTIFY_SSC_CLI_TOKEN_64 = {{ '$(FORTIFY-SSC-CLI-TOKEN)' | base64 }}

    # Busca o ID do projeto/versão no FORTIFY
    - task: TypescriptRunner@4
      displayName: 'Check Project Exists'
      inputs:
        script: |- # typescript
          let _params = new URLSearchParams({
            fields: 'id,name,project', 
            q: 'project.name:$(FORTIFY_PROJECT_NAME)'
          });
          let _res = await fetch(
            `https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions?${_params.toString()}`,
            {
              method: 'GET',
              headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'}
            }
          );
          let _json = await _res.json();
          log_debug(JSON.stringify(_json, undefined, 2));

          if(!_json?.data?.length){
            log_warning(`Fortify Project '$(FORTIFY_PROJECT_NAME)' not found!`);
            return;
          }
          const FORTIFY_PROJECT_ID = jq(
            `$.data[?(@.project.name == '$(FORTIFY_PROJECT_NAME)')]`, 
            _json || {}
          )[0]?.project?.id;
          
          const FORTIFY_PROJECT_VERSION_ID = jq(
            `$.data[?(@.project.name == '$(FORTIFY_PROJECT_NAME)' && @.name === 'DevSecOps')]`, 
            _json || {}
          )[0]?.id;

          set_variable('FORTIFY_PROJECT_ID', FORTIFY_PROJECT_ID);
          console.log(`Fortify project: ${FORTIFY_PROJECT_ID}`);
          if(FORTIFY_PROJECT_VERSION_ID) {
            set_variable('FORTIFY_PROJECT_VERSION_ID', FORTIFY_PROJECT_VERSION_ID);
            console.log(`Fortify project version: ${FORTIFY_PROJECT_VERSION_ID}`);
          }
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: TypescriptRunner@4
      displayName: "Create Fortify Project"
      condition: not(variables['FORTIFY_PROJECT_ID'])
      inputs:
        script: |- # typescript
          const _res = await fetch(
            'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions',
            {
              method: 'POST',
              headers: {
                Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'
                'Accept': 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                "name": "DevSecOps",
                "issueTemplateId": "Prioritized-HighRisk-Project-Template",
                "project": {
                  "name": "$(FORTIFY_PROJECT_NAME)",
                  "issueTemplateId": "Prioritized-HighRisk-Project-Template"
                }
              })
            }
          );
          const _json = await _res.json();
          log_debug(JSON.stringify(_json, undefined, 2));
          
          if(!_json.data || !_json.data.id) {
            task_failed(`Fortify Project '$(FORTIFY_PROJECT_NAME)' not created!`)
            return;
          }

          set_variable('FORTIFY_PROJECT_ID', _json.data.project.id);
          set_variable('FORTIFY_PROJECT_VERSION_ID', _json.data.id);
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: TypescriptRunner@4
      displayName: "Create Fortify Version"
      condition: not(variables['FORTIFY_PROJECT_VERSION_ID'])
      inputs:
        script: |- # typescript
          const _res = await fetch(          
            'https://ssc-fortify.redecorp.br/ssc/api/v1/projects/$(FORTIFY_PROJECT_ID)/versions',
            {
              method: 'POST',
              headers: {
                Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'
                'Accept': 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                "name": "DevSecOps",
                "description": "$(BUILD_SOURCEVERSIONMESSAGE)",
                "active": true,
                "issueTemplateId": "Prioritized-HighRisk-Project-Template"
              })
            }
          );
          const _json = await _res.json();
          log_debug(JSON.stringify(_json, undefined, 2));
          
          if(!_json.data || !_json.data.id) {
            task_failed(`Fortify Project Version '$(FORTIFY_PROJECT_VERSION_NAME)' not created!`)
            return;
          }

          set_variable('FORTIFY_PROJECT_VERSION_ID', _json.data.id);
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    # - task: TypeScriptRunner@4
    #   displayName: 'Prevent acive scan'
    #   inputs:
    #     script: | # typescript
    #       const res = await fetch(
    #         // 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/artifacts?limit=5',
    #         'https://ssc-fortify.redecorp.br/ssc/api/v1/artifacts/$(FORTIFY_PROJECT_VERSION_ID)/scans',
    #         {
