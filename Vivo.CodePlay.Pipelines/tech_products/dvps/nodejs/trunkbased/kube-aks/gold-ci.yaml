    - script: |- # shell

        asdf install java openjdk-17.0.2
        echo "##vso[task.setvariable variable=ASDF_JDK_17_PATH]$(asdf where java openjdk-17.0.2)"
      displayName: 'Ensure Fortify JDK 17'

    - task: TypeScriptRunner@4
      displayName: 'Ensure Fortify ScanCentral tool'
      inputs:
        script: | # typescript
          let toolpath = '$(Agent.ToolsDirectory)/scancentral/24.4.0/x64/bin/scancentral';
          if(!fs.existsSync(toolpath)) toolpath = '/devops/fortify/scancentral/24.4.0/bin/scancentral';
          if(!fs.existsSync(toolpath)) {
            const versions = toollib.findLocalToolVersions('scancentral');
            console.log(versions);
            if(!versions || versions.length == 0){
              task_failed(`scancentral not found!`);
              return;
            }
            toolpath = toollib.findLocalTool('scancentral', versions[versions.length - 1]);
          }
          set_variable('SCANCENTRAL_BIN', toolpath);

    # - script: $(SCANCENTRAL_BIN) --help start # Start a remote scan job        
    #   displayName: "SCANCENTRAL HELP start"

    - task: TypeScriptRunner@4
      displayName: 'Fortify Scan SAST'
      continueOnError: true
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
        ASDF_JAVA_VERSION: "openjdk-17.0.2"
        SCANCENTRAL_JAVA_HOME: $(ASDF_JDK_17_PATH)
        JAVA_HOME_17_X64: $(ASDF_JDK_17_PATH)
        JAVA_HOME: $(ASDF_JDK_17_PATH)
      inputs:
        script: | # typescript
          const {SCANCENTRAL_BIN} = process.env;
          const cwd = process.cwd();
          const scancmd = [
            `${SCANCENTRAL_BIN}`,
            `-url 'https://scancentral-sast.redecorp.br/scancentral-ctrl'`,
            `-sscurl 'https://ssc-fortify.redecorp.br/ssc/'`,
            `-ssctoken '$(FORTIFY-SSC-CLI-TOKEN)'`,
            `start`,
            `-sargs "-sc 'devops'"`,
            `-skipBuild`,
            `-upload`,
            `-uptoken '$(FORTIFY-SSC-CLI-TOKEN)'`,
            `-bt none`,
            `-diag debug-fortify.zip`,
            // `-block`,
            `--overwrite`,
            `--log-file "$(FORTIFY_PROJECT_NAME)-$(System.JobAttempt)-fortify.log"`,
            `--application "$(FORTIFY_PROJECT_NAME)"`,
            // `--application-version "DevSecOps"`,
            `--application-version-id "$(FORTIFY_PROJECT_VERSION_ID)"`,
            `-exclude "catalog"`,
            `-exclude "docs"`,
            `-exclude ".gitignore"`,
            `-exclude "catalog-info.yaml"`,
            `-exclude "code_review.yml"`,
            `-exclude "mkdocs.yml"`,
            `-exclude "README.md"`,
            `-exclude "dist"`,
            `-exclude "**/*.svg"`,
            `-exclude "**/*.css"`,
            `-exclude "**/*.eot"`,
            `-exclude "**/*.zip"`,
            `-exclude "**/*.js"`,
            `-exclude "node_modules"`,
          ].join(' ')

          sh.exec(scancmd, {cwd}, (code, stdout, stderr) => {
            const m = /Submitted job and received token: {0,}([^ ]+)/i.exec(stdout);
            if(!m){
              task_failed('Scan job has not scheduled!');
              return;
            }
            const token = m[1];
            log_debug(token);
            set_variable('SCAN_JOB_TOKEN', token)
            process.exit(code);
          });

    - task: TypescriptRunner@4
      displayName: 'Bind Fortify x Conviso'
      inputs:
        script: |- # typescript
          const conviso_res = await fetch(
            `https://app.conviso.com.br/api/v2/integrations/scanners/fortify/associate_project` , 
            {
              method: 'POST',
              body: JSON.stringify({
                "company_id": '430',
                "project_id": '$(FORTIFY_PROJECT_VERSION_ID)'
              }),
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': '$(CONVISO-API-KEY)'
              }
            }
          );
          
          const conviso_json = await conviso_res.json();
          
          JSON.stringify(conviso_json, undefined, 2)
          .split('\n').map(log_debug);

          if(conviso_json.error?.status_type) {
            log_error(`An error occurred while requesting Conviso API. ${conviso_json.error.status_type} - ${conviso_json.error.details}`);
            task_failed(`Conviso API association error!`);
            return;
          }

          set_variable('CONVISO_PROJECT_ID', conviso_json.data.project.id);
          set_variable('CONVISO_EXTERNAL_TOOL_PROJECT_ID', conviso_json.data.external_tool_project.id);
          set_variable('CONVISO_ASSOCIATION_ID', conviso_json.data.id);

      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)


    - task: TypescriptRunner@4
      displayName: 'Sync Fortify x Conviso'
      inputs:
        script: |- # typescript
          for(let i = 0; i < 3;i++){
            await sleep(2000);

            const conviso_res = await fetch(
              `https://app.conviso.com.br/api/v2/integrations/scanners/fortify/synchronize` , 
              {
                method: 'POST',
                body: JSON.stringify({
                  "company_id": '430',
                  "integration_association_id": "$(CONVISO_ASSOCIATION_ID)"
                }),
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': '$(CONVISO-API-KEY)'
                }
              }
            );
          
            const conviso_json = await conviso_res.json();
            
            JSON.stringify(conviso_json, undefined, 2)
            .split('\n').map(log_debug);

            if(conviso_json.error?.status_type) {
              console.info(`An error occurred while requesting synchronizing Conviso. Retrying....`);
              consola.error(conviso_json.error);
              continue;
            }
            return;
          }
          
          task_failed(`Conviso API synchronization error!`);

      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

- stage:
  displayName: 'Deploy on (${{ parameters.environment }})'
  pool: GeneralPurposeLinuxAgentsCD
  variables:
  - name: System.debug
    value: "true"
  - name: DOCKER_TAG_SUFIX
    ${{ if eq('${{ parameters.environment }}', 'production') }}:
      value: 'RELEASE'
    ${{ else }}:
      value: 'SNAPSHOT'
  jobs:
  - deployment:
    displayName: 'Deploy on (${{ parameters.environment }})'
    # creates an environment if it doesn't exist
    environment:
      name: 'deploy-${{ parameters.environment }}'
    # variables:
    #   - name: HELM_EXPERIMENTAL_OCI
    #     value: 1
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 1

          - task: DownloadBuildArtifacts@1
            displayName: 'Download generated files'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'generated-sources'
              downloadPath: $(System.ArtifactsDirectory)
          
          - task: CopyFiles@2
            displayName: 'Overwrite generated sources'
            inputs:
              SourceFolder: '$(System.ArtifactsDirectory)/generated-sources'
              Contents: '**'
              TargetFolder: './'
              OverWrite: true

          - task: JsonParseFromVivo@4
            displayName: 'Get package.json info'
            inputs:
              type: 'file'
              origin: 'package.json'
              jpaths: |
                var PACKAGE_JSON_VERSION = .version

          - task: YamlParseFromVivo@4
            displayName: 'Get catalog-info.yaml info'
            inputs:
              type: 'file'
              origin: catalog-info.yaml
              jpaths: |-
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
                
          - task: TypescriptRunner@4
            displayName: 'Extract variables'
            inputs:
              script: |- # typescript
                const [ ,GOV_APP_ACRONYM ] = '${{ parameters.kubernetes_connection }}'.split('-');
                set_variable('GOV_APP_ACRONYM', GOV_APP_ACRONYM);

          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: >-
                NEXUS-DEPS-USR, NEXUS-DEPS-PSW,
                HELM-REGISTRY-NEXUS-USERNAME, HELM-REGISTRY-NEXUS-PASSWORD,
                HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD,
                DOCKER-REGISTRY-ACR-USERNAME, DOCKER-REGISTRY-ACR-PASSWORD

          - task: Kubernetes@1
            displayName: "Kube config initialize"
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: ${{ parameters.kubernetes_connection }}
              azureResourceGroup: ${{ parameters.resource_group }}
              kubernetesCluster: ${{ parameters.kubernetes_connection }}
              command: 'login'

          - task: PlaceInFiles@4
            displayName: "Apply config variables"
            inputs:
              globPattern: ".azuredevops/config/${{ parameters.environment }}/*.y*ml"
              regex: '/\$\(([^\)]+)\)/gmi'

          # - script: |-
          #     kubectl get ns \
          #     -o json \
          #     --kubeconfig="$(KUBECONFIG)" \
          #     --insecure-skip-tls-verify \
          #     > existing-namespaces.json
          #   displayName: Fetch namespaces

          # - task: JsonParseFromVivo@4
          #   displayName: Query for Namespace
          #   inputs:
          #     type: file
          #     origin: existing-namespaces.json
          #     jpaths: |-
          #       var EXISTING_NAMESPACES = $.items[?(@.metadata.name.match(/$(CATALOG_YAML_K8S_NS)/i))].metadata.name

          # - script: >-
          #     kubectl create ns "$(CATALOG_YAML_K8S_NS)"
          #     --kubeconfig="$(KUBECONFIG)"
          #     --insecure-skip-tls-verify
          #   displayName: Create Namespace
          #   condition: not(variables['EXISTING_NAMESPACES'])

          # - script: >-
          #     kubectl delete secret acr-devops
          #     --namespace $(CATALOG_YAML_K8S_NS)
          #     --kubeconfig="$(KUBECONFIG)"
          #     --insecure-skip-tls-verify
          #   displayName: DELETE Docker Secret

          - script: |- # shell
              kubectl get secrets acr-devops \
              --namespace $(CATALOG_YAML_K8S_NS) \
              --kubeconfig="$(KUBECONFIG)" \
              --insecure-skip-tls-verify

              echo "##vso[task.setvariable variable=EXISTING_SECRETS]$?"
            displayName: Fetch Docker Secret

          - script: >- # shell
              kubectl create secret docker-registry acr-devops
              --docker-server="acrsharedservices01.azurecr.io" 
              --docker-username="$(DOCKER-REGISTRY-ACR-USERNAME)" 
              --docker-password="$(DOCKER-REGISTRY-ACR-PASSWORD)" 
              --docker-email='arquiteturati@telefonica.com.br'
              --namespace $(CATALOG_YAML_K8S_NS)
              --kubeconfig="$(KUBECONFIG)"
              --insecure-skip-tls-verify
            condition: eq(variables['EXISTING_SECRETS'], '1')
            displayName: Create Docker Secret

          # - task: Bash@3
          #   displayName: 'Helm repo update (ACR)'
          #   inputs:
          #     targetType: inline
          #     script: >-
          #       helm repo update --kubeconfig $(KUBECONFIG)

          - task: Bash@3
            displayName: 'Helm login (ACR)'
            inputs:
              targetType: inline
              script: >- # shell
                helm registry login
                acrsharedservices01.azurecr.io
                --username $(DOCKER-REGISTRY-ACR-USERNAME)
                --password "$(DOCKER-REGISTRY-ACR-PASSWORD)"

          - task: Bash@3
            displayName: 'Helm status on (${{ parameters.environment }})'
            inputs:
              targetType: inline
              script: |- # shell
                HELM_STATUS=$(helm history "$(CATALOG_YAML_NAME)"  \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig $(KUBECONFIG) \
                -o json)

                echo "##vso[task.setvariable variable=HELM_STATUS;]$HELM_STATUS";
          
          - task: JsonParseFromVivo@4
            displayName: 'Helm revision info'
            condition: not(eq(variables['HELM_STATUS'], ''))
            inputs:
              sourceType: 'var'
              source: 'HELM_STATUS'
              queries: |-
                # last deployed revision
                var LAST_DEPLOYED_REV = $[?(@.status=='deployed')].revision
                # last deployed
                var LAST_STATUS = $[-1:].status
                # last failed
                var LAST_REV = $[-1:].revision

          - task: TypescriptRunner@4
            displayName: 'Ensure LAST_DEPLOYED_REV'
            inputs:
              script: | #typescript
                set_variable(
                  'LAST_DEPLOYED_REV', 
                  process.env.LAST_DEPLOYED_REV || '0'
                );

          - task: Bash@3
            displayName: 'Helm rollback last failure on (${{ parameters.environment }})'
            condition:
              and(
                not(eq(variables['LAST_STATUS'], 'deployed')),
                not(eq(variables['LAST_REV'], ''))
              )
            continueOnError: true
            inputs:
              targetType: inline
              script: >- # shell
                
                helm rollback "$(CATALOG_YAML_NAME)" $(LAST_DEPLOYED_REV)
                --namespace "$(CATALOG_YAML_K8S_NS)"
                --kubeconfig $(KUBECONFIG)

          - task: Bash@3
            displayName: 'Helm force uninstall (${{ parameters.environment }})'
            condition: in(variables['Agent.JobStatus'], 'Failed', 'SucceededWithIssues')
            inputs:
              targetType: inline
              script: >- # shell
                
                helm uninstall "$(CATALOG_YAML_NAME)"
                --namespace "$(CATALOG_YAML_K8S_NS)" 
                --kubeconfig $(KUBECONFIG)
                --description "[codeplay-nodejs-aks] Failed to rollback, forcing uninstall"
                --wait

          - task: Bash@3
            displayName: Check namespace
            inputs:
              targetType: inline
              script: >- # shell
                #                
                kubectl get deployment "$(CATALOG_YAML_NAME)" \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig=" $(KUBECONFIG)" \
                --insecure-skip-tls-verify

                echo "##vso[task.setvariable variable=EXISTING_DEPLOYMENT]$?"

          - task: Bash@3
            displayName: Check All Deployments in namespace
            inputs:
              targetType: inline
              script: >- # shell
                #                
                kubectl get all "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig=" $(KUBECONFIG)" \
                --insecure-skip-tls-verify

          - task: Bash@3
            displayName: "Helm registry login (ACR)"
            inputs:
              targetType: inline
              script: >- # shell
                #
                helm registry login acrsharedservices01.azurecr.io
                --username $(HELM-REGISTRY-ACR-USERNAME)
                --password "$(HELM-REGISTRY-ACR-PASSWORD)"

          - script:  >- # shell
              helm registry login acrsharedservices01.azurecr.io
              --username $(HELM-REGISTRY-ACR-USERNAME)
              --password "$(HELM-REGISTRY-ACR-PASSWORD)"
            displayName: "Helm registry login (ACR)"

          - task: HelmDeploy@1
            displayName: 'Add devops-helm repo from (Nexus)'
            inputs:
              azureSubscription: ${{ parameters.kubernetes_connection }}
              azureResourceGroup: ${{ parameters.resource_group }}
              kubernetesCluster: ${{ parameters.kubernetes_connection }}
              command: 'repo'
              arguments: >-
                add devops-helm
                "https://nexus.telefonica.com.br/repository/devops-helm"
                --force-update
                --insecure-skip-tls-verify
                --username "$(HELM-REGISTRY-NEXUS-USERNAME)"
                --password "$(HELM-REGISTRY-NEXUS-PASSWORD)"


          - task: TypeScriptRunner@4
            displayName: 'Helm upgrade on (${{ parameters.environment }})'
            inputs:
              script: | # typescript
                const existDeployment = !process.env.EXISTING_DEPLOYMENT

                const helmUpgradeCommand = [
                  `helm upgrade ${existDeployment ? '' : '--install'} $(CATALOG_YAML_NAME)`,
                  'oci://acrsharedservices01.azurecr.io/helm/devops/${{ parameters.helm_chart_name }}',
                  '--version "${{ parameters.helm_chart_version }}"',
                  '--set "nameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "fullnameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "containerName=$(CATALOG_YAML_NAME)"',
                  '--set "image.repository=acrsharedservices01.azurecr.io/$(GOV_APP_ACRONYM)/$(CATALOG_YAML_NAME)"',
                  '--set "image.tag=$(PACKAGE_JSON_VERSION)-$(DOCKER_TAG_SUFIX)"',
                  '--set "imagePullSecrets[0].name=acr-devops"',
                  '-f .azuredevops/config/${{ parameters.environment }}/values.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/environments_variables.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/secrets.yaml',
                  '--kubeconfig $(KUBECONFIG)',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--install',
                  '--insecure-skip-tls-verify',
                  '--output table',
                  '--history-max 5',
                  '--debug',
                  '--atomic',
                  '--wait',
                  '--timeout 300s',
                ].join(' ');

                const kubelogs = [
                  'kubectl logs',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-f',
                  '--all-containers=true',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(KUBECONFIG)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const kubeevents = [
                  'kubectl events',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-w',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(KUBECONFIG)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const cwd = process.cwd();
                const pid1out = [];
                const pid2out = [];

                const pid1 = sh.exec(kubeevents, { cwd, async: true, silent: true });
                pid1.stdout.on('data', (chunk) => pid1out.push(chunk))
                pid1.stderr.on('data', (chunk) => pid1out.push(chunk))

                const pid2 = sh.exec(kubelogs, { cwd, async: true, silent: true });
                pid2.stdout.on('data', (chunk) => pid2out.push(chunk))
                pid2.stderr.on('data', (chunk) => pid2out.push(chunk))

                const pid = sh.exec(helmUpgradeCommand, { cwd }, (code, stdout, stderr) => {
                  console.info('kube events!')
                  console.log(pid1out.join('') || 'No events!');

                  console.info('kube logs!')
                  console.log(pid2out.join('') || 'No logs');

                  process.exit(code);
                });

        on:
          success:
            steps:
            - checkout: self
              fetchDepth: 1

            - task: JsonParseFromVivo@4
              displayName: 'Get package.json info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/package.json
                jpaths: |
                  var PACKAGE_JSON_VERSION = .version

            - task: LoadFile@4
              displayName: 'Load catalog-info.yaml'
              inputs:
                script: |
                  CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

            - task: YamlParseFromVivo@4
              displayName: 'Get Metadata Info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/catalog-info.yaml
                jpaths: |
                  var CATALOG_YAML_NAME = .metadata.name
                  var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

            - task: VivoGovernance@1
              displayName: 'Gov Notify "deploy"'
              inputs:
                breakglass: false
                serverEndpoint: 'governanceapi'
                operation: 'deploy'
                component: $(CATALOG_YAML_NAME)
                version: $(PACKAGE_JSON_VERSION)
                cluster: ${{ parameters.kubernetes_connection }}
                namespace: $(CATALOG_YAML_K8S_NS)
                deployment: $(CATALOG_YAML_NAME)
                environment: ${{ parameters.environment }}
                catalogInfo: $(CATALOG_YAML_CONTENT)

          failure:
            steps:
            - checkout: none
            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

