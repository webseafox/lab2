parameters:

- name: packageFolder
  displayName: 
    Pasta para empacotar, diretorio do onde estara o 
    vss-extension.json e os arquivos transpilados. 
    Ex. "dist", "package"'
  type: string
  default: './'

variables:
- name: System.debug
  value: 'true'

stages:
- stage:
  displayName: "Ensure config files"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: 
    displayName: "Ensure files"
    steps:
    - checkout: self
      fetchDepth: 1
    # TODO: talvez no futuro
    # - task: YamlParseFromVivo@4
    #   displayName: 'Get Metadata Info'
    #   inputs:
    #     type: 'file'
    #     origin: "catalog-info.yaml"
    #     jpaths: |-
    #       var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
    #       var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']

    - script: |- # shell
        echo "##vso[build.addbuildtag]nodejs"
        echo "##vso[build.addbuildtag]azuredevops"
        echo "##vso[build.addbuildtag]extension"
        echo "##vso[build.addbuildtag]ci-lite"
        # TODO: talvez no futuro
        # echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
        # echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'

    - task: EnsureFile@4
      displayName: 'Ensure .nvmrc'
      inputs:
        fileName: '.nvmrc'
        createIfNotExist: true
        defaultContent: 'v18.15.0'

    - task: EnsureFile@4
      displayName: 'Ensure .npmrc'
      inputs:
        fileName: '.npmrc'
        createIfNotExist: true
        defaultContent: |
          registry=https://pkgs.dev.azure.com/telefonica-vivo-brasil/_packaging/DevOps/npm/registry/
          always-auth=true

    - task: NodeTool@0
      displayName: 'Ensure Node'
      inputs:
        versionSource: 'fromFile'
        versionFilePath: '.nvmrc'

    - task: Npm@1
      displayName: 'Ensure standard-version'
      inputs:
        command: 'custom'
        customCommand: 'install standard-version'
        customRegistry: 'useFeed'
        customFeed: '3d53bc62-8749-4931-ae46-a443b73bc87a'

    - script: "./node_modules/.bin/standard-version --skip.tag --skip.commit"
      displayName: "Bump version (generic)"

    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          .npmrc
          tasks/*/*/task*json
          tasks/*/*/package*json
          package*json
          vss-extension*json
        # .nvmrc
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'generated-sources'
        PathtoPublish: $(Build.ArtifactStagingDirectory)

- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  condition: succeeded()
  jobs:
  # - job:
  #   displayName: 'Jira Commit Integration'
  #   steps:
  #   - checkout: self
  #     fetchDepth: 1

  #   - task: Regex@4
  #     displayName: 'Filter Commit Message'
