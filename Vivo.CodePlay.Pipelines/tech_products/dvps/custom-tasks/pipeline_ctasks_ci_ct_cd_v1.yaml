## -> Parameters:
parameters:
  - name: environment
  - name: EXTENSION_NAME
  - name: EXTENSION_ID
  - name: SKIP_TESTS
  - name: TAG
  - name: PAT_INSTALL_PREPROD
  - name: PAT_INSTALL_PROD

#variables:
  ## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
  ## -> Use this to change the variables on runtime
#  - group: "${{ variables['Build.Repository.Name'] }}"
#  - template: /global_initializer.yml

stages:
  ## -> Entrypoint
- ${{ if eq(parameters.environment, 'CI') }}:

  - ${{ if eq(parameters.SKIP_TESTS, 'false' ) }}:
   ## -> Tests
    - template: /tech_products/dvps/custom-tasks/templates/ct/ct_test_coverage.yml
      parameters:
        EXTENSION_NAME: "${{ parameters.EXTENSION_NAME }}"
        EXTENSION_ID: "${{ parameters.EXTENSION_ID }}"
        SKIP_TESTS: "${{ parameters.SKIP_TESTS }}"
        TAG: "${{ parameters.TAG }}"
        environment: "${{ parameters.environment }}"

    ## -> Installing Packages
  - template: /tech_products/dvps/custom-tasks/templates/ci/ci_npm_install.yml
    parameters:
      EXTENSION_NAME: "${{ parameters.EXTENSION_NAME }}"
      EXTENSION_ID: "${{ parameters.EXTENSION_ID }}"
      SKIP_TESTS: "${{ parameters.SKIP_TESTS }}"
      TAG: "${{ parameters.TAG }}"
      environment: "${{ parameters.environment }}"


- ${{ if or(eq(parameters.environment, 'producao'), eq(parameters.environment, 'preprod')) }}:

  - template: /tech_products/dvps/custom-tasks/templates/ci/ci_validate_tag_npm_install.yml
    parameters:
      EXTENSION_NAME: "${{ parameters.EXTENSION_NAME }}"
      EXTENSION_ID: "${{ parameters.EXTENSION_ID }}"
      SKIP_TESTS: "${{ parameters.SKIP_TESTS }}"
      environment: "${{ parameters.environment }}"
      TAG: "${{ parameters.TAG }}"
      
  - template: /tech_products/dvps/custom-tasks/templates/cd/cd_publish_marketplace.yml
    parameters:
      EXTENSION_NAME: "${{ parameters.EXTENSION_NAME }}"
      EXTENSION_ID: "${{ parameters.EXTENSION_ID }}"
      SKIP_TESTS: "${{ parameters.SKIP_TESTS }}"
      TAG: "${{ parameters.TAG }}"
      environment: "${{ parameters.environment }}"
      PAT_INSTALL_PREPROD: "${{ parameters.PAT_INSTALL_PREPROD }}"
      PAT_INSTALL_PROD: "${{ parameters.PAT_INSTALL_PROD }}"