## -> Parameters:
parameters:
  - name: environment
    displayName: Selecione a esteira
    type: string
    default: devops
    values:
    - devops
  - name: action
    displayName: Ação
    type: string
    default: add
    values:
    - add
    - update
  - name: clusterName
    type: string
    default: ""
  - name: resourceGroup
    type: string
    default: ""
  - name: subscriptionId
    type: string
    default: ""
  - name: kubeconfigBase64
    displayName: 'Kubeconfig em Base64 (opcional) - echo "$(cat ~/.kube/config)" | base64 -w 0'
    type: string
    default: ''
variables:
  ## -> Override global variables, with variables set in Library/Variable Groups (Pipelines)
  ## -> Use this to change the variables on runtime
  - group: "${{ variables['Build.Repository.Name'] }}"
  - template: /tech_products/dvps/externals-packages/initializers/global_initializer.yml

stages:
  - template: /tech_products/dvps/externals-packages/initializers/default_initializer.yml
  ## -> Entrypoint
  - template: /tech_products/dvps/argocd/add-cluster/add-cluster.yaml
    parameters:
      action: "${{ parameters.action }}"
      environment: "${{ parameters.environment }}"
      clusterName: "${{ parameters.clusterName }}"
      resourceGroup: "${{ parameters.resourceGroup }}"
      subscriptionId: "${{parameters.subscriptionId}}"
      kubeconfigBase64: "${{ parameters.kubeconfigBase64 }}"
