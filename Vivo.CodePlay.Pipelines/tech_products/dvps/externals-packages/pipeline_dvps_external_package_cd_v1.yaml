## -> Parameters:
parameters:
  - name: environment
    displayName: "Escolha o ambiente para publicar"
    type: string
    default: dev
    values:
      - dev
      - esteira1
      - esteira2
      - preprod
      - prodlike
      - producao
  - name: packageName
  - name: packageVersion
  - name: infrastructureType
    type: string
    default: "weblogic"
    values:
      - weblogic

stages:
  ## -> Entrypoint
  ## -> Use CI-CD pipeline if no package version has been provided
  ## -> Use CD only pipeline if package version has been provided
  - ${{ if eq(parameters.infrastructureType, 'weblogic') }}:
      - template: /tech_products/dvps/externals-deploy/templates/cd/cd_deploy_weblogic.yml
        parameters:
          environment: "${{ parameters.environment }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
