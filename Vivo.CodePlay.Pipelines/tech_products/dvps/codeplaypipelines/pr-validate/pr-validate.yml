trigger: none 
pr:
  branches:
    include:
    - master
pool:
  name: GeneralPurposeLinuxAgentsCI


jobs:
- job: CheckYAMLFiles
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    fetchTags: false
    persistCredentials: true

  - script: |
      pip install pyyaml
    displayName: 'Instala PyYAML'

  - script: |
      chmod +x $(Build.SourcesDirectory)/count_shell_lines.py
      echo "Procurando arquivos YAML alterados"
      TARGET_BRANCH=$(echo $SYSTEM_PULLREQUEST_TARGETBRANCH | sed 's#refs/heads/##')
      if [ -n "$TARGET_BRANCH" ]; then
        echo "TARGET_BRANCH_PULLREQUEST identificada: $TARGET_BRANCH"
        git fetch origin $TARGET_BRANCH
        FILES=$(git diff --name-only origin/$TARGET_BRANCH...HEAD | grep -E '\.yml$' || true)
      else
        echo "Target Branch de Pull Request não identificada"
        exit 0
      fi
      echo "Yamls commited:$FILES"
      if [ -z "$FILES" ]; then
        echo "Nenhum arquivo YAML alterado."
        exit 0
      else
        for FILE in $FILES; do
            echo "Validando arquivo: $FILE"
            cd $(Build.SourcesDirectory)
            python3 $(Build.SourcesDirectory)/tech_products/dvps/codeplaypipelines/pr-validate/count_shell_lines.py "$FILE"
        done
        
      fi
    displayName: 'Verifica numeros linhas de shell script em arquivos YAML'
  
  - script: |
      curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz -o shellcheck.tar.xz
      tar -xf shellcheck.tar.xz
      ./shellcheck-v0.9.0/shellcheck $(Build.SourcesDirectory)/scripts_extraidos.sh || true
    displayName: 'Executa shellcheck em scripts encontrados'
    continueOnError: true