parameters:
- name: variable_groups
  displayName: Lista de Variables Groups para complementar variaveis e segredos.
  default: []
  type: object

- name: environment
  displayName: 'Escolha o ambiente para publicar'
  type: string
  default: dev
  values:
  - dev
  - esteira1
  - esteira2
  - esteira3
  - preprod
  - production
  - prodlike

- name: vivonow_chg
  displayName: 'Numero CHG do VivoNow, somente para "production"'
  default: CHG0000001

- name: website_physical_path
  displayName: 'Endereco de implantacao (IISWebAppManagementOnMachineGroup > WebsitePhysicalPath)'
  default: '' # S:\Sistema_Web

- name: website_name
  displayName: 'Nome do Web Site (IISWebAppManagementOnMachineGroup > [WebsiteName, ParentWebsiteNameForVD, AppPoolName, StartStopRecycleAppPoolName, VirtualApplication])'
  default: 'default' # TiSimplesProjeto

variables:
- name: System.debug
  value: 'true'
- ${{ each group_name in parameters.variable_groups }}:
  - group: ${{ group_name }}

stages:
- stage:
  displayName: "Ensure config files"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
  - job: 
    displayName: Ensure files
    steps:
    - checkout: self
      fetchDepth: 1

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '3.x'

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: | # shell
          
          dotnet new tool-manifest
          dotnet tool install dotnet-setversion --version 2.6.0
      displayName: 'Ensure dotnet-setversion'
      

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: | #shell
          SLN_PROJ=$(ls *.sln *.csproj 2>/dev/null | head -n1)
          dotnet msbuild $SLN_PROJ -nologo -v:diag > dotnet-project-info.txt | true
          cat dotnet-project-info.txt
      displayName: 'Dump project info'

    - task: RegexInline@4
      displayName: 'Get Project info'
      inputs:
        source: file://./dotnet-project-info.txt
        regexes: |
          var CSPROJ_PACKAGE_VERSION = /( PackageVersion )= ([^\n]+)/gm

    - task: SemverIncrementCustomFromVivo@5
      displayName: 'Semver Increment "patch"'
      name: new_version
      inputs:
        currentversion: $(CSPROJ_PACKAGE_VERSION_GROUP_2)
        outputVariableName: "NEW_VERSION"
        releaseType: "patch"
        template: "${NEW_COERCED_VERSION}"


    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: dotnet tool run setversion $(new_version.NEW_VERSION)
      displayName: "dotnet-setversion"

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: | #shell
          rm -rf dotnet-project-info.txt
          SLN_PROJ=$(ls *.sln *.csproj 2>/dev/null | head -n1)
          dotnet msbuild $SLN_PROJ -nologo -v:diag > dotnet-project-info.txt | true
          cat dotnet-project-info.txt
      displayName: 'Dump project info'


    - task: CopyFiles@2
      displayName: 'Staging Artifacts'
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          **/*.csproj
          *.csproj
          dotnet-project-info.txt
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'generated-sources'
        PathtoPublish: $(Build.ArtifactStagingDirectory)

- stage:
  displayName: 'Build'
  pool: GeneralPurposeLinuxAgentsCI
  condition: succeeded()
  jobs:
  - job:
    displayName: 'Jira Commit Integration'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Regex@4
      displayName: 'Filter Commit Message'
      inputs:
        source: $(Build.SourceVersionMessage)
        regex: '/^[^:]+ {0,}: {0,}(([^| ]+) {0,}\| {0,}([^| ]+) {0,}\| {0,}(.+) {0,})/gm'


    - task: TypeScriptRunner@4
      displayName: 'Get Commit Info'
      condition: eq(variables['REGEX_HAS_MATCH'], 'true')
      inputs:
        azureDevOpsEndpoint: 'Azure DevOps Api Generic'
        script: |- # typescript
          const { BUILD_REPOSITORY_ID } = process.env;
          const commits = await (await connection.getGitApi()).getCommits(BUILD_REPOSITORY_ID, {$top: 1});
          
          set_variable('COMMITTER_NAME)', commits[0].committer.name);
          set_variable('COMMIT_DATE)', commits[0].committer.date);
        

    # - task: KafkaProducer@0.0.16
    #   displayName: 'Publicar informações no tópico'
    #   condition: eq(variables['REGEX_HAS_MATCH'], 'true')
    #   inputs:
    #     kafkaOamEndpoint: 'KafkaEsteiraDigitalProd'
    #     kafkaProducerClientId: 'esteira-digital-group'
    #     kafkaServer: 'oauth.bootstrap.apps.ocp-kafka-prd.redecorp.br:443'
    #     commitDate: $(COMMIT_DATE)
    #     commitId: $(Build.SourceVersion)
    #     commitMessage: $(Build.SourceVersionMessage)
    #     committerName: $(COMMITTER_NAME)
    #     repoName: $(Build.Repository.Name)
    #     kafkaTopic: "integracao-azure-jira-branch-master"
    #     debug: true

  - job: build
    displayName: 'Build, Unit Test and Pack'
    variables:
    - name: SONARQUBE_PROJECT_NAME
      value: "$(System.TeamProject)-$(Build.Repository.Name)"
    - name: ARTIFACT_SUFIX
      ${{ if eq('${{ parameters.environment }}', 'production') }}:
        value: 'rc'
      ${{ else }}:
        value: 'alpha'
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'generated-sources'
        downloadPath: $(Build.ArtifactStagingDirectory)

    - task: RegexInline@4
      displayName: 'Get Project info'
      inputs:
        source: file://$(Build.ArtifactStagingDirectory)/generated-sources/dotnet-project-info.txt
        regexes: |
          var CSPROJ_PACKAGE_VERSION = /( PackageVersion )= ([^\n]+)/gm
    
    - task: CopyFiles@2
      displayName: Overwrite generated sources
      inputs:
        SourceFolder: $(System.ArtifactsDirectory)/generated-sources
        Contents: '**'
        TargetFolder: './'
        OverWrite: true

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |- # shell
          echo "##vso[build.addbuildtag]dotnet"
          echo "##vso[build.addbuildtag]self-hosted"        
          echo "##vso[build.addbuildtag]iis"
          echo "##vso[build.addbuildtag]ci-lite"
          echo "##vso[build.addbuildtag]$(CATALOG_YAML_ACRONYM)"
          echo "##vso[build.addbuildtag]$(CATALOG_YAML_MODULE)"
      displayName: 'Set tags'
      

    - task: DotNetCoreCLI@2
      displayName: "Build"
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        # arguments: '--configuration Release --output $(build.artifactStagingDirectory)'

    - task: AzureKeyVault@2
      displayName: 'Secrets from AKV'
      inputs:
        RunAsPreJob: true
        azureSubscription: "DevOpsSharedResources"
        KeyVaultName: "kv-azdevops-shared"
        SecretsFilter: SONARQUBE-TOKEN


    # dotnet tool install --global dotnet-sonarscanner
    # dotnet sonarscanner begin /k:"project-key" /d:sonar.token="<token>" /d:sonar.host.url="http://localhost:9000"
    # dotnet build <path to project file or .sln file> --no-incremental
    # dotnet sonarscanner end /d:sonar.token="<token>"

    - task: Bash@3
      displayName: "Ensure dotnet-sonarscanner"
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          dotnet new tool-manifest
          dotnet tool install dotnet-sonarscanner --version 5.15.0

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: >-
          dotnet sonarscanner begin 
          /k:"$(CATALOG_YAML_SONAR_PROJECT_KEY)" 
          /v:"1.0.1"
          /n:"$(SONARQUBE_PROJECT_NAME)"
          /d:sonar.token="$(SONARQUBE-TOKEN)" 
          /d:sonar.host.url="http://sonar.devops.redecorp.br"
      displayName: "Begin Sonar Config"
      
        
    - task: Bash@3
      displayName: "Build with Sonar"
      inputs:
        targetType: 'inline'
        script: |
          SLN_PROJ=$(ls *.sln *.csproj 2>/dev/null | head -n1)
          dotnet build $SLN_PROJ --no-incremental
      
      # dotnet build ./comp-ti-mais-simples.sln --no-incremental

    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: >-
          dotnet sonarscanner end
          /d:sonar.login="$(SONARQUBE-TOKEN)" 
      displayName: "End Sonar Config"

    # - task: PublishTestResults@2
    #   condition: not(eq(variables['PACKAGE_JSON_TEST'], ''))
    #   inputs:
    #     testResultsFormat: 'JUnit'
    #     mergeTestResults: true

    - task: DotNetCoreCLI@2
      displayName: "Release"
      inputs:
        command: 'publish'
        projects: '**/*.csproj'
        arguments: '--configuration Release --output ./publish'

    - task: ArchiveFiles@2
      displayName: "Package"
      inputs:
        rootFolderOrFile: './publish'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: $(Build.ArtifactStagingDirectory)/publish.zip
        replaceExistingArchive: true
    
    - task: PublishBuildArtifacts@1
      displayName: "Push Artifacts"
      inputs:
        ArtifactName: 'bin'
        PathtoPublish: $(Build.ArtifactStagingDirectory)

    # TODO: PUBLICAR UMA COPIA DOS BINARIOS NO ARTIFACTS
    - task: UniversalPackages@0
      displayName: "Publish a Universal Package"
      inputs:
        command: publish
        publishDirectory: $(Build.ArtifactStagingDirectory)
        feedsToUsePublish: "internal"
        vstsFeedPublish: "3d53bc62-8749-4931-ae46-a443b73bc87a"
        vstsFeedPackagePublish: $(CATALOG_YAML_NAME)
        packagePublishDescription: ""
        versionOption: "custom"
        versionPublish: $(CSPROJ_PACKAGE_VERSION_GROUP_2)-$(ARTIFACT_SUFIX)

  - job:
    dependsOn: build
    displayName: 'Push to Git (TAG)'
    steps:
    - checkout: self
      persistCredentials: true

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'generated-sources'
        downloadPath: $(Build.ArtifactStagingDirectory)

    - task: RegexInline@4
      displayName: 'Get Project info'
      inputs:
        source: file://$(Build.ArtifactStagingDirectory)/generated-sources/dotnet-project-info.txt
        regexes: |
          var CSPROJ_PACKAGE_VERSION = /( PackageVersion )= ([^\n]+)/gm

    - task: Bash@3
      displayName: 'Commit new version'
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |- # shell
          yes | cp -r -f $(Build.ArtifactStagingDirectory)/generated-sources/* ./
          rm -rf dotnet-project-info.txt
          git add .
          git commit -m "[skip ci] CodePlay bump version $(CSPROJ_PACKAGE_VERSION_GROUP_2)"
          git tag $(CSPROJ_PACKAGE_VERSION_GROUP_2) -m "Version has been updated to $(CSPROJ_PACKAGE_VERSION_GROUP_2)"
          git push origin --tags HEAD:$(Build.SourceBranchName)

          echo "##[command] yes | cp -r -f $(Build.ArtifactStagingDirectory)/generated-sources/package.json ./"
          echo "##[command] git add ."
          echo "##[command] git commit -m \"[skip ci] CodePlay bump version $(CSPROJ_PACKAGE_VERSION_GROUP_2)\""
          echo "##[command] git tag $(CSPROJ_PACKAGE_VERSION_GROUP_2) -m \"Version has been updated to $(CSPROJ_PACKAGE_VERSION_GROUP_2)\""
          echo "##[command] git push origin --tags HEAD:$(Build.SourceBranchName)"
        

- stage:
  displayName: 'Deploy on (${{ parameters.environment }})'
  pool: GeneralPurposeLinuxAgentsCI
  variables:
  - name: System.debug
    value: "true"
  - name: ARTIFACT_SUFIX
    ${{ if eq('${{ parameters.environment }}', 'production') }}:
      value: 'rc'
    ${{ else }}:
      value: 'alpha'
  jobs:
  - deployment:
    displayName: 'Deploy on (${{ parameters.environment }})'
    # creates an environment if it doesn't exist
    environment:
      name: 'deploy-${{ parameters.environment }}'
      # resourceName: BRTLVBGS0447PL

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 1
            clean: true

          - task: DownloadBuildArtifacts@1
            displayName: 'Download Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'generated-sources'
              downloadPath: $(Build.ArtifactStagingDirectory)

          - task: RegexInline@4
            displayName: 'Get Project info'
            inputs:
              source: file://$(Build.ArtifactStagingDirectory)/generated-sources/dotnet-project-info.txt
              regexes: |
                var CSPROJ_PACKAGE_VERSION = /( PackageVersion )= ([^\n]+)/gm
          
          - task: CopyFiles@2
            displayName: Overwrite generated sources
            inputs:
              SourceFolder: $(System.ArtifactsDirectory)/generated-sources
              Contents: '**'
              TargetFolder: './'
              OverWrite: true

          - task: YamlParseFromVivo@4
            displayName: 'Get Metadata Info'
            inputs:
              type: 'file'
              origin: $(Build.SourcesDirectory)/catalog-info.yaml
              jpaths: |
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
                var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']

          - task: UniversalPackages@0
            displayName: Download a Universal Package
            condition: succeeded()
            continueOnError: false
            inputs:
              command: download
              vstsFeed: "3d53bc62-8749-4931-ae46-a443b73bc87a"
              vstsFeedPackage: $(CATALOG_YAML_NAME)
              vstsPackageVersion: $(CSPROJ_PACKAGE_VERSION_GROUP_2)-$(ARTIFACT_SUFIX)
              downloadDirectory: "$(Pipeline.Workspace)"
          

          - task: IISWebAppManagementOnMachineGroup@0
            displayName: Ensure IIS Site
            inputs:
              IISDeploymentType: 'IISWebsite'
              ActionIISWebsite: 'CreateOrUpdateWebsite'
              WebsiteName: '${{ parameters.website_name }}'
              WebsitePhysicalPath: '${{ parameters.website_physical_path }}'
              WebsitePhysicalPathAuth: 'WebsiteUserPassThrough'
              AddBinding: false
              ParentWebsiteNameForVD: '${{ parameters.website_name }}'
              ParentWebsiteNameForApplication: 'Dasboard'
              AppPoolName: '${{ parameters.website_name }}'

          - task: IISWebAppManagementOnMachineGroup@0
            displayName: Stop IIS Site
            inputs:
              IISDeploymentType: 'IISApplicationPool'
              ActionIISApplicationPool: 'StopAppPool'
              StartStopRecycleAppPoolName: '${{ parameters.website_name }}'

          - task: IISWebAppDeploymentOnMachineGroup@0
            displayName: Update IIS Site
            inputs:
              WebSiteName: 'Dasboard'
              VirtualApplication: '${{ parameters.website_name }}'
              Package: '$(Build.ArtifactStagingDirectory)/app.zip'
              TakeAppOfflineFlag: true

          - task: IISWebAppManagementOnMachineGroup@0
            displayName: Start IIS Site
            inputs: 
              IISDeploymentType: 'IISApplicationPool'
              ActionIISApplicationPool: 'StartAppPool'
              StartStopRecycleAppPoolName: '${{ parameters.website_name }}'
        on:
          success:
            steps:
            - checkout: self
              fetchDepth: 1

            - task: JsonParseFromVivo@4
              displayName: 'Get package.json info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/package.json
                jpaths: |
                  var PACKAGE_JSON_VERSION = .version

            - task: LoadFile@4
              displayName: 'Load catalog-info.yaml'
              inputs:
                script: |
                  CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml
                

            - task: YamlParseFromVivo@4
              displayName: 'Get Metadata Info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/catalog-info.yaml
                jpaths: |
                  var CATALOG_YAML_NAME = .metadata.name
                  var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

            - task: VivoGovernance@1
              displayName: 'Gov Notify "deploy"'
              inputs:
                breakglass: false
                serverEndpoint: 'governanceapi'
                operation: 'deploy'
                component: $(CATALOG_YAML_NAME)
                version: $(PACKAGE_JSON_VERSION)
                cluster: 'NA' # ${{ parameters.kubernetes_connection }}
                namespace: $(CATALOG_YAML_K8S_NS)
                deployment: $(CATALOG_YAML_NAME)
                environment: ${{ parameters.environment }}
                catalogInfo: $(CATALOG_YAML_CONTENT)

          failure:
            steps:
            - checkout: none
            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

