parameters:
  - name: environment

stages:
- stage: Deploy
  displayName: Deploy to ${{ parameters.environment }}
  jobs:
  - job: Deploy_Helm_Chart
    displayName: Deploy Helm Chart to ${{ parameters.environment }}
    pool:
      name: $(PRIVATE_AGENT_SHARED)
    steps:
    - script: |
        source ~/.bashrc

        echo "##[debug] APP_VERSION........: ${APP_VERSION}"
        echo "##[debug] AZURE_SUBSCRIPTION: ${AZURE_SUBSCRIPTION}"
        echo "##[debug] K8S_RESOURCE_GROUP: ${K8S_RESOURCE_GROUP}"
        echo "##[debug] NAMESPACE.........: ${NAMESPACE}"
        echo "##[debug] IMAGE_REGISTRY...: ${IMAGE_REGISTRY}"
        echo "##[debug] HELM_REGISTRY....: ${HELM_REGISTRY}"
        echo "##[debug] IMAGE_PATH.......: ${IMAGE_PATH}"
        echo "##[debug] IMAGE_NAME.......: ${IMAGE_NAME}"
        echo "##[debug] HELM_CHART_NAME..: ${HELM_CHART_NAME}"
        echo "##[debug] HELM_CHART_VERSION: ${HELM_CHART_VERSION}"
      displayName: "LOAD VARS PIPELINE"
      env:
        APP_VERSION: $(APP_VERSION)
        AZURE_SUBSCRIPTION: $(AZURE_SUBSCRIPTION)
        K8S_RESOURCE_GROUP: $(K8S_RESOURCE_GROUP)
        NAMESPACE: $(NAMESPACE)
        IMAGE_REGISTRY: $(IMAGE_REGISTRY)
        HELM_REGISTRY: $(HELM_REGISTRY)
        IMAGE_PATH: $(IMAGE_PATH)
        IMAGE_NAME: $(IMAGE_NAME)
        HELM_CHART_NAME: $(HELM_CHART_NAME)
        HELM_CHART_VERSION: $(HELM_CHART_VERSION)

    - task: AzureKeyVault@2  
      displayName: '[Helm ACR] Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 3
      inputs:
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'HELM-REGISTRY-ACR-USERNAME, HELM-REGISTRY-ACR-PASSWORD'
      condition: and(succeeded(), eq(variables['HELM-REGISTRY-ACR-USERNAME'], ''), eq(variables['HELM-REGISTRY-ACR-PASSWORD'], ''))

    - script: |
        source ~/.bashrc
        echo "##[debug] HELM REGISTRY.......: ${HELM_REGISTRY}"
        echo "##[debug] USERNAME...: ${USERNAME}"
        echo "##[debug] PASSWORD...: ************"

        helm registry login ${HELM_REGISTRY} \
        --username ${USERNAME} \
        --password "${PASSWORD}"
      displayName: "[ACR] Helm registry login"
      condition: and(succeeded(), eq(lower(variables['HELM_REGISTRY_ACR_ENABLED']), 'true'))
      env:
        HELM_REGISTRY: $(HELM_REGISTRY)
        USERNAME: $(HELM-REGISTRY-ACR-USERNAME)
        PASSWORD: $(HELM-REGISTRY-ACR-PASSWORD)

    - task: HelmDeploy@1
      displayName: Deploy-${{ parameters.environment }}
      inputs:
        connectionType: "Azure Resource Manager"
        azureSubscription: "$(AZURE_SUBSCRIPTION)"
        kubernetesCluster: "$(AZURE_SUBSCRIPTION)"
        azureResourceGroup: "$(K8S_RESOURCE_GROUP)"
        command: "upgrade"
        chartName: "devops-helm/$(HELM_CHART_NAME)"
        chartVersion: "$(HELM_CHART_VERSION)"
        releaseName: "$(VAR_HELM_RELEASE)"
        valueFile: ".azuredevops/config/${{ parameters.environment }}/values.yml"
        namespace: "$(NAMESPACE)"
        arguments: >-
          --atomic
          --wait 
          --insecure-skip-tls-verify
          -f "$(Build.SourcesDirectory)/.azuredevops/config/${{ parameters.environment }}/environments_variables.yml"
          -f "$(Build.SourcesDirectory)/.azuredevops/config/${{ parameters.environment }}/secrets.yaml"
          --history-max 2
          --debug
          --output table
        publishPipelineMetadata: false
        overrideValues: |
          image.repository=$(IMAGE_PATH)
          image.tag=$(IMAGE_VERSION)
          imagePullSecrets[0].name=acr-devops
        install: true
        wait: true
        timeout: 600s
        failOnStderr: false
      env:
        HELM_CHART_NAME: $(HELM_CHART_NAME)
        HELM_CHART_VERSION: $(HELM_CHART_VERSION)
        NAMESPACE: ${{ parameters.namespace }}-${{ parameters.environment }}
        IMAGE_PATH : $(IMAGE_REGISTRY)/$(IMAGE_PATH)/$(IMAGE_NAME)
        IMAGE_VERSION : $(APP_VERSION)
        
