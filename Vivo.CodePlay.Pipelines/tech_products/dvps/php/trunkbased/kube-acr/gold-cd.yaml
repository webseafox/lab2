    - task: EnsureFile@4
      displayName: 'Ensure ${{ parameters.environment }}/values.yml'
      inputs:
        fileName: .azuredevops/config/${{ parameters.environment }}/values.yml
        createIfNotExist: true
        defaultContent: |-
          applicationName: "$(CATALOG_YAML_NAME)"
          applicationVersion: "$(COMPOSER_JSON_VERSION)-$(DOCKER_TAG_SUFIX)"
          applicationPrefix: "/"

          replicaCount: 1
          serviceAccount:
            create: false
            annotations: {}
            name: ""
          podAnnotations: {}
          podSecurityContext: {}
          securityContext: {}
          service:
            type: ClusterIP
            port: 8080
          container:
            port: 80
            schema: HTTP
          # istio:
          #   enabled: true
          #   canaryEnabled: false
          #   circuitBreak:
