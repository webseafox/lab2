        PathtoPublish: $(Build.ArtifactStagingDirectory)

- stage: vivonow
  displayName: 'VivoNow Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Jira Commit Integration'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Regex@4
      displayName: 'Filter Commit Message'
      inputs:
        source: $(Build.SourceVersionMessage)
        regex: '/^[^:]+ {0,}: {0,}(([^| ]+) {0,}\| {0,}([^| ]+) {0,}\| {0,}(.+) {0,})/gm'


    - task: TypeScriptRunner@4
      displayName: 'Get Commit Info'
      condition: eq(variables['REGEX_HAS_MATCH'], 'true')
      inputs:
        azureDevOpsEndpoint: 'Azure DevOps Api Generic'
        script: |- # typescript
          const { BUILD_REPOSITORY_ID } = process.env;
          const commits = await (await connection.getGitApi()).getCommits(BUILD_REPOSITORY_ID, {$top: 1});
          
          set_variable('COMMITTER_NAME)', commits[0].committer.name);
          set_variable('COMMIT_DATE)', commits[0].committer.date);

    # - task: KafkaProducer@0.0.16
    #   displayName: 'Publicar informações no tópico'
    #   condition: eq(variables['REGEX_HAS_MATCH'], 'true')
    #   inputs:
    #     kafkaOamEndpoint: 'KafkaEsteiraDigitalProd'
    #     kafkaProducerClientId: 'esteira-digital-group'
    #     kafkaServer: 'oauth.bootstrap.apps.ocp-kafka-prd.redecorp.br:443'
    #     commitDate: $(COMMIT_DATE)
    #     commitId: $(Build.SourceVersion)
    #     commitMessage: $(Build.SourceVersionMessage)
    #     committerName: $(COMMITTER_NAME)
    #     repoName: $(Build.Repository.Name)
    #     kafkaTopic: "integracao-azure-jira-branch-master"
    #     debug: true

  - job:
    displayName: 'Check on (VivoNow)'
    condition: eq('${{ parameters.environment }}', 'production')
    steps:

    - task: AxiosFromVivo@4
      displayName: 'Fetch CHG'
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'GET',
            url: 'http://10.41.252.111:9010/vivonow/viewer/${{ parameters.vivonow_chg }}'
          };
        variablePrefix: 'VIVO_NOW_CHG_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: RegexMatch@4
      displayName: 'Query CHG'
      inputs:
        source: $(VIVO_NOW_CHG_BODY)
        regex: '/(<title>)(.*)(<\/title>)/ig'
        outVarPrefix: 'CHG_FOUND_'

    - script: exit 1
      displayName: 'Check CHG'
      condition: not(variables['CHG_FOUND_HAS_MATCH'])

- stage: govapp
  displayName: 'GovApp Gate'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job:
    displayName: 'Governance Policies Check'
    steps:
    - checkout: self

    - task: JsonParseFromVivo@4
      displayName: 'Get composer.json info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/composer.json
        jpaths: |
          var COMPOSER_JSON_VERSION = .version

    - task: LoadFile@4
      inputs:
        script: |
          CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

    - task: VivoGovernance@1
      continueOnError: true
      displayName: 'Governance Validate'
      inputs:
        breakglass: false
        serverEndpoint: 'governanceapi'
        operation: 'validate'
        component: $(CATALOG_YAML_NAME)
        version: $(COMPOSER_JSON_VERSION)
        cluster: aks-$(CATALOG_YAML_ACRONYM)-${{ parameters.environment }}
        namespace: $(CATALOG_YAML_K8S_NS)
        deployment: $(CATALOG_YAML_NAME)
        environment: ${{ parameters.environment }}
        catalogInfo: $(CATALOG_YAML_CONTENT)

- stage:
  displayName: 'Push to Repositories'
  pool: GeneralPurposeLinuxAgentsCD
  dependsOn:
  - vivonow
  - govapp
  jobs:
  - job:
    condition: eq('${{ parameters.environment }}', 'production')
    displayName: 'Push to Docker (RELEASE)'
    steps:

    - checkout: self
      fetchDepth: 1

    - task: JsonParseFromVivo@4
      displayName: 'Get composer.json info'
      inputs:
        type: 'file'
        origin: 'composer.json'
        jpaths: |
          var COMPOSER_JSON_VERSION = .version

    - task: YamlParseFromVivo@4
      displayName: 'Get Metadata Info'
      inputs:
        type: 'file'
        origin: 'catalog-info.yaml'
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']

    - task: Docker@2
      displayName: 'Docker Pull (SNAPSHOT)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: pull
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(CATALOG_YAML_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-SNAPSHOT\
          "

    - task: Docker@2
      displayName: 'Docker Tag to (RELEASE)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: tag
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(CATALOG_YAML_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-SNAPSHOT\
          \ \
          acrsharedservices01.azurecr.io\
          /$(CATALOG_YAML_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-RELEASE\
          "

    - task: Docker@2
      displayName: 'Push to Docker (RELEASE)'
      inputs:
        containerRegistry: 'ACR-DEVOPS'
        command: push
        arguments:
          "\
          acrsharedservices01.azurecr.io\
          /$(CATALOG_YAML_ACRONYM)\
          /$(CATALOG_YAML_NAME)\
          :$(POM_XML_VERSION)-RELEASE\
          "

- stage:
  displayName: 'Deploy on (${{ parameters.environment }})'
  pool: GeneralPurposeLinuxAgentsCD
  variables:
  - name: System.debug
    value: "true"
  jobs:
  - deployment:
    displayName: 'Deploy on (${{ parameters.environment }})'
    # creates an environment if it doesn't exist
    environment:
      name: 'deploy-${{ parameters.environment }}'
    variables:
      - name: HELM_EXPERIMENTAL_OCI
        value: 1
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 1

          - task: DownloadBuildArtifacts@1
            displayName: 'Download Artifact'
            inputs:
              buildType: 'current'
              artifactName: 'generated-sources'
              downloadPath: $(System.ArtifactsDirectory)
          
          - task: CopyFiles@2
            displayName: Overwrite generated sources
            inputs:
              SourceFolder: $(System.ArtifactsDirectory)/generated-sources
              Contents: '**'
              TargetFolder: './'
              OverWrite: true

          # - script: |
          #     ls -lha .azuredevops/config/**/*
          #     cat .azuredevops/config/${{parameters.environment}}/values.yml

          - task: JsonParseFromVivo@4
            displayName: 'Get composer.json info'
            inputs:
              type: 'file'
              origin: $(Build.SourcesDirectory)/composer.json
              jpaths: |
                var COMPOSER_JSON_VERSION = .version

          - task: YamlParseFromVivo@4
            displayName: 'Get Metadata Info'
            inputs:
              type: 'file'
              origin: catalog-info.yaml
              jpaths: |-
                var CATALOG_YAML_NAME = .metadata.name
                var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
                var CATALOG_YAML_KUBE_ID = .metadata.annotations['backstage.io/kubernetes-id']

          - task: AzureKeyVault@2
            displayName: 'Getting AKV credentials'
            timeoutInMinutes: 1
            retryCountOnTaskFailure: 5
            inputs:
              azureSubscription: DevOpsSharedResources
              KeyVaultName: kv-azdevops-shared
              SecretsFilter: >-
                DOCKER-REGISTRY-ACR-USERNAME, DOCKER-REGISTRY-ACR-PASSWORD

          - task: DownloadSecureFile@1
            name: kubeconfig
            displayName: 'Download config from (kube-${{parameters.environment}})'
            inputs:
              secureFile: 'kube-${{ parameters.environment }}'

          - task: PlaceInFiles@4
            displayName: "Apply config variables"
            inputs:
              globPattern: ".azuredevops/config/${{ parameters.environment }}/*.y*ml"
              regex: '/\$\(([^\)]+)\)/gmi'

          # - script: |-
          #     kubectl get ns \
          #     -o json \
          #     --kubeconfig="$(kubeconfig.secureFilePath)" \
          #     --insecure-skip-tls-verify \
          #     > existing-namespaces.json
          #   displayName: Fetch namespaces

          # - task: JsonParseFromVivo@4
          #   displayName: Query for Namespace
          #   inputs:
          #     type: file
          #     origin: existing-namespaces.json
          #     jpaths: |-
          #       var EXISTING_NAMESPACES = $.items[?(@.metadata.name.match(/$(CATALOG_YAML_K8S_NS)/i))].metadata.name

          # - script: >-
          #     kubectl create ns "$(CATALOG_YAML_K8S_NS)"
          #     --kubeconfig="$(kubeconfig.secureFilePath)"
          #     --insecure-skip-tls-verify
          #   displayName: Create Namespace
          #   condition: not(variables['EXISTING_NAMESPACES'])

          # - script: >-
          #     kubectl delete secret acr-devops
          #     --namespace $(CATALOG_YAML_K8S_NS)
          #     --kubeconfig="$(kubeconfig.secureFilePath)"
          #     --insecure-skip-tls-verify
          #   displayName: DELETE Docker Secret

          - script: |- # shell
              kubectl get secrets acr-devops \
              --namespace $(CATALOG_YAML_K8S_NS) \
              --kubeconfig="$(kubeconfig.secureFilePath)" \
              --insecure-skip-tls-verify

              echo "##vso[task.setvariable variable=EXISTING_SECRETS]$?"
            displayName: Fetch Docker Secret

          - script: >- # shell
              kubectl create secret docker-registry acr-devops
              --docker-server="acrsharedservices01.azurecr.io" 
              --docker-username="$(DOCKER-REGISTRY-ACR-USERNAME)" 
              --docker-password="$(DOCKER-REGISTRY-ACR-PASSWORD)" 
              --docker-email='arquiteturati@telefonica.com.br'
              --namespace $(CATALOG_YAML_K8S_NS)
              --kubeconfig="$(kubeconfig.secureFilePath)"
              --insecure-skip-tls-verify
            condition: eq(variables['EXISTING_SECRETS'], '1')
            displayName: Create Docker Secret

          - task: Bash@3
            displayName: 'Helm login (ACR)'
            inputs:
              targetType: inline
              script: >- # shell
                helm registry login
                acrsharedservices01.azurecr.io
                --username $(DOCKER-REGISTRY-ACR-USERNAME)
                --password "$(DOCKER-REGISTRY-ACR-PASSWORD)"

          - task: Bash@3
            displayName: 'Helm status on (${{ parameters.environment }})'
            inputs:
              targetType: inline
              script: |- # shell
                HELM_STATUS=$(helm history "$(CATALOG_YAML_NAME)"  \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig $(kubeconfig.secureFilePath) \
                -o json)

                echo "##vso[task.setvariable variable=HELM_STATUS;]$HELM_STATUS";

          - task: JsonParseFromVivo@4
            displayName: 'Helm revision info'
            condition: not(eq(variables['HELM_STATUS'], ''))
            inputs:
              sourceType: 'var'
              source: 'HELM_STATUS'
              queries: |-
                # last deployed revision
                var LAST_DEPLOYED_REV = $[?(@.status=='deployed')].revision
                # last deployed
                var LAST_STATUS = $[-1:].status
                # last failed
                var LAST_REV = $[-1:].revision
                # last deployed revision

          - task: Bash@3
            displayName: 'Helm rollback last failure on (${{ parameters.environment }})'
            condition:
              and(
                not(eq(variables['LAST_STATUS'], 'deployed')),
                not(eq(variables['LAST_REV'], ''))
              )
            inputs:
              targetType: inline
              script: >- # shell
                
                helm rollback "$(CATALOG_YAML_NAME)" $(LAST_DEPLOYED_REV)
                --namespace "$(CATALOG_YAML_K8S_NS)"
                --kubeconfig $(kubeconfig.secureFilePath) | true

          - task: Bash@3
            displayName: 'Helm force uninstall (${{ parameters.environment }})'
            condition: in(variables['Agent.JobStatus'], 'Failed', 'SucceededWithIssues')
            inputs:
              targetType: inline
              script: >- # shell
                
                helm uninstall "$(CATALOG_YAML_NAME)"
                --namespace "$(CATALOG_YAML_K8S_NS)" 
                --kubeconfig $(kubeconfig.secureFilePath)
                --description "[codeplay-nodejs-aks] Failed to rollback, forcing uninstall"
                --wait

          - task: Bash@3
            displayName: Debug Kube resources
            inputs:
              targetType: inline
              script: |- # shell
                #
                kubectl get all "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig="$(kubeconfig.secureFilePath)" \
                --insecure-skip-tls-verify

                kubectl api-resources --verbs=list \
                --kubeconfig="$(kubeconfig.secureFilePath)" \
                --insecure-skip-tls-verify

          - task: Bash@3
            displayName: Check namespace
            inputs:
              targetType: inline
              script: |- # shell
                #
                kubectl get deployment "$(CATALOG_YAML_NAME)" \
                --namespace "$(CATALOG_YAML_K8S_NS)" \
                --kubeconfig="$(kubeconfig.secureFilePath)" \
                --insecure-skip-tls-verify

                echo "##vso[task.setvariable variable=EXISTING_DEPLOYMENT]$?"

          - task: TypeScriptRunner@4
            displayName: 'Helm upgrade on (${{ parameters.environment }})'
            inputs:
              script: | # typescript
                const existDeployment = !process.env.EXISTING_DEPLOYMENT

                const helmUpgradeCommand = [
                  `helm upgrade ${existDeployment ? '' : '--install'} $(CATALOG_YAML_NAME)`,
                  'oci://acrsharedservices01.azurecr.io/helm/devops/${{ parameters.helm_chart_name }}',
                  '--version "${{ parameters.helm_chart_version }}"',
                  '--set "nameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "fullnameOverride=$(CATALOG_YAML_NAME)"',
                  '--set "containerName=$(CATALOG_YAML_NAME)"',
                  '--set "image.repository=acrsharedservices01.azurecr.io/$(CATALOG_YAML_ACRONYM)/$(CATALOG_YAML_NAME)"',
                  '--set "image.tag=$(COMPOSER_JSON_VERSION)-$(DOCKER_TAG_SUFIX)"',
                  '--set "imagePullSecrets[0].name=acr-devops"',
                  '-f .azuredevops/config/${{ parameters.environment }}/values.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/environments_variables.yml',
                  '-f .azuredevops/config/${{ parameters.environment }}/secrets.yaml',
                  '--kubeconfig $(kubeconfig.secureFilePath)',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--install',
                  '--insecure-skip-tls-verify',
                  '--output table',
                  '--history-max 5',
                  '--debug',
                  '--atomic',
                  '--wait',
                  '--timeout 300s',
                ].join(' ');

                const kubelogs = [
                  'kubectl logs',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-f',
                  '--all-containers=true',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(kubeconfig.secureFilePath)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const kubeevents = [
                  'kubectl events',
                  'deployment/$(CATALOG_YAML_NAME)',
                  '-w',
                  '--namespace "$(CATALOG_YAML_K8S_NS)"',
                  '--kubeconfig $(kubeconfig.secureFilePath)',
                  '--insecure-skip-tls-verify',
                ].join(' ')

                const cwd = process.cwd();
                const pid1out = [];
                const pid2out = [];

                const pid1 = sh.exec(kubeevents, { cwd, async: true, silent: true });
                pid1.stdout.on('data', (chunk) => pid1out.push(chunk))
                pid1.stderr.on('data', (chunk) => pid1out.push(chunk))

                const pid2 = sh.exec(kubelogs, { cwd, async: true, silent: true });
                pid2.stdout.on('data', (chunk) => pid2out.push(chunk))
                pid2.stderr.on('data', (chunk) => pid2out.push(chunk))

                const pid = sh.exec(helmUpgradeCommand, { cwd }, (code, stdout, stderr) => {
                  console.info('kube events!')
                  console.log(pid1out.join('') || 'No events!');

                  console.info('kube logs!')
                  console.log(pid2out.join('') || 'No logs');

                  process.exit(code);
                });

        on:
          success:
            steps:
            - checkout: self
              fetchDepth: 1

            - task: JsonParseFromVivo@4
              displayName: 'Get composer.json info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/composer.json
                jpaths: |
                  var COMPOSER_JSON_VERSION = .version

            - task: LoadFile@4
              displayName: 'Load catalog-info.yaml'
              inputs:
                script: |
                  CATALOG_YAML_CONTENT = $(Build.SourcesDirectory)/catalog-info.yaml

            - task: YamlParseFromVivo@4
              displayName: 'Get Metadata Info'
              inputs:
                type: 'file'
                origin: $(Build.SourcesDirectory)/catalog-info.yaml
                jpaths: |
                  var CATALOG_YAML_NAME = .metadata.name
                  var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
                  var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

            - task: VivoGovernance@1
              displayName: 'Gov Notify "deploy"'
              inputs:
                breakglass: false
                serverEndpoint: 'governanceapi'
                operation: 'deploy'
                component: $(CATALOG_YAML_NAME)
                version: $(COMPOSER_JSON_VERSION)
                cluster: aks-$(CATALOG_YAML_ACRONYM)-${{ parameters.environment }}
                namespace: $(CATALOG_YAML_K8S_NS)
                deployment: $(CATALOG_YAML_NAME)
                environment: ${{ parameters.environment }}
                catalogInfo: $(CATALOG_YAML_CONTENT)

          failure:
            steps:
            - checkout: none

            - task: CatchLogsToLocalDirectoryFromVivo@4
              displayName: 'Dump logs and metas'
              inputs:
                dumpDir: $(Build.ArtifactStagingDirectory)/audit

            - task: PublishBuildArtifacts@1
              displayName: 'Push Logs to Artifacts'
              inputs:
                ArtifactName: audit
                PathtoPublish: $(Build.ArtifactStagingDirectory)/audit

