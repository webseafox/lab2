          autoscaling:
            enabled: false
            istioEnabled: false
            minReplicas: 1
            maxReplicas: 1
            targetCPUUtilizationPercentage:

          nodeSelector: {}
          tolerations: []
          affinity: {}
          liveness:
            enabled: false
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php

          readiness:
            enabled: false
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 120
            healthCheck: /health.php

          timezone: "America/Sao_Paulo"
          configMapKeys: {}
          applicationVariables: []
          volumes: []
          volumeMounts: []

