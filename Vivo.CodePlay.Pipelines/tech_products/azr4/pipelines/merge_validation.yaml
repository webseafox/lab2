parameters:
- name: recipe
  type: string
  values:
  - nodejs_docker
  - sbt_data
  - maven_docker
  - docker
  - maven_libs
  - maven_libs_v2
  - example
  - python_docker
  - python_docker_uv
  - php_docker
  - golang-binary
  - mlops_v1
  - mlops_v2
  - gradle_docker
  - nodejs_libs
- name: branching_strategy
  type: string
  values:
  - gitlabflow
  - releaseflow
  - stb
  - gitlabflow-semantic
  default: stb
- name: envs
  type: object
  default: {}
- name: additionalStages
  type: object
  default: []

stages:
#### PREPARATION #############################
  - stage: preparation
    displayName: Preparation - ${{ parameters.recipe }} recipe
    jobs:
    - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/prep.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
