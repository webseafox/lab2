### BUILD #############################
  - stage: build
    displayName: Build - ${{ parameters.recipe }} recipe
    condition: succeeded()
    dependsOn:
    - preparation
    jobs:
    - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/build.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### TESTS #############################
  - stage: tests
    displayName: Tests & Code Analysis - ${{ parameters.recipe }} recipe
    condition: succeeded()
    dependsOn:
    - build
    jobs:
    - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/tests.yaml
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
### SONAR #############################
  - stage: sonar
    displayName: Sonar Analysis
    condition: succeeded()
    dependsOn:
    - tests
    jobs:
    - template: /tech_products/azr4/recipes/build/commons/sonar.yaml
      parameters:
        recipe: ${{ parameters.recipe }}
    variables:
      - group: '4p-core-default-variables'
      - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables.yaml
        parameters:
          envs: ${{ parameters.envs }}
      - name: RECIPE
        value: ${{ parameters.recipe }}
      - name: BRANCHING_STRATEGY
        value: ${{ parameters.branching_strategy }}
      - ${{ if and(eq( parameters.branching_strategy, 'gitlabflow'), ne(variables['Build.SourceBranchName'], '')) }}:
        - template: /tech_products/azr4/recipes/build/${{ parameters.recipe }}/variables/${{ variables['Build.SourceBranchName'] }}.yaml  
          parameters:
            envs: ${{ parameters.envs }}
