parameters:
  - name: asdf_jdk
    type: string
    default: "17.0.2"
  - name: toolVersionsPath
    type: string
    default: ".tool-versions"
steps:
  - script: |
      set -euo pipefail

      DEFAULT_VERSION='${{ parameters.asdf_jdk }}'
      TOOL_VERSIONS_FILE='${{ parameters.toolVersionsPath }}'
      TOOL_JDK_VERSION=""

      if ! command -v asdf >/dev/null 2>&1; then
        echo "##[error]asdf not found on this agent. Provision asdf or change pipeline to install it."
        exit 1
      fi

      # Novo comportamento: tenta obter a versao do .tool-versions
      if [ -f "$TOOL_VERSIONS_FILE" ]; then
        echo "##[debug] using $TOOL_VERSIONS_FILE versions"
        TOOL_JDK_VERSION="$(awk '$1 == "java" { print $2; exit }' "$TOOL_VERSIONS_FILE")"
      fi

      install_default_java() {
        # Comportamento antigo: instala a versao default (${DEFAULT_VERSION})
        echo "##[debug] Installing asdf Java version ${DEFAULT_VERSION}"
        asdf install java "openjdk-${DEFAULT_VERSION}"
        asdf local java "openjdk-${DEFAULT_VERSION}"
      }

      if [ -n "$TOOL_JDK_VERSION" ]; then
        # Versao veio do .tool-versions -> NUNCA instala (deve ser provisionada via Ansible)
        echo "##[debug] Checking for asdf Java version ${TOOL_JDK_VERSION} from $TOOL_VERSIONS_FILE"
        if asdf list java | grep -q "${TOOL_JDK_VERSION}"; then
          echo "##[debug] Java version ${TOOL_JDK_VERSION} found, using it"
          asdf local java "${TOOL_JDK_VERSION}"
        else
          echo "##[warning] Java version ${TOOL_JDK_VERSION} not available (request installation via Ansible), falling back to ${DEFAULT_VERSION}"
          install_default_java
        fi
      else
        # Sem versao no .tool-versions -> comportamento antigo (instala a default)
        install_default_java
      fi

      asdf current java
    displayName: Set Java Version
