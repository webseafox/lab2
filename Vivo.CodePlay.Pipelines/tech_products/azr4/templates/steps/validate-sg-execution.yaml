

steps:
- script: |
    set -e
    if [[ "${SECURITY_GATE_PASSED}" != "true" ]]; then
      echo "##[error] Security Gates were not executed or failed. Please ensure the security gates job has run successfully."
      echo "##[error] Expected: 'true', Got: '${SECURITY_GATE_PASSED}'"
      echo "##vso[task.logissue type=error]Security Gates were not executed or failed. Please ensure the security gates job has run successfully."
      exit 1
    fi
    echo "##[debug] Security Gates execution validated successfully."
    echo "##vso[task.complete result=Succeeded;]Security Gates validation completed successfully"
  displayName: 'Validate Security Gates Execution'
  name: ValidateSGExecution
  condition: succeeded()

