parameters:
  - name: type
    type: string
    default: 'build'
  - name: chg_number
    type: string
    default: ''
steps:
- ${{ if eq(parameters.type, 'build') }}:
  - script:
      echo "##vso[build.addbuildtag]type-build"
    displayName: 'Add tag to build'
    continueOnError: true
    env:
      RECIPE: $(RECIPE)
      BRANCHING_STRATEGY: $(BRANCHING_STRATEGY)
- ${{ if eq(parameters.type, 'deploy') }}:
  - script:
      #!/bin/bash
      echo "##[debug] setting tags for deploy pipeline"
      echo "##vso[release.addreleasetag]type-deploy"
      echo "##vso[release.addreleasetag]recipe-${RECIPE}"
      echo "##vso[release.addreleasetag]environment-${ENVIRONMENT}"
    displayName: 'Add tag to release'
    continueOnError: true
    env:
      RECIPE: $(RECIPE)
      ENVIRONMENT: $(ENVIRONMENT)