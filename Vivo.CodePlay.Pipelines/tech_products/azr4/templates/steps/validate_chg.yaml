parameters:
- name: 'chg_number'
  type: string
  default: ''

steps:
  - template: /tech_products/azr4/templates/steps/download_nexus_artifact.yaml
    parameters:
      file: 'validatemr-cli-linux-amd64'
      folder: 'devops'
      outputFilePath: $(Agent.TempDirectory)/validatemr-cli
      version: "1.0.11"
      chmod: 755
  - task: YamlParseFromVivo@4
    displayName: 'Get Metadata Info'
    inputs:
      type: 'file'
      origin: $(Build.SourcesDirectory)/catalog-info.yaml
      jpaths: |
        var ALLOWED_IC = .metadata.annotations['techarch.governance-app.ic']
  - task: Bash@3
    name: 'validate_chg'
    displayName: "Validate CHG"
    continueOnError: false
    inputs:
      targetType: 'inline'
      script: |
        echo "##[debug] Validating CHG ${CHG_NUMBER}"
        ALLOWED_IC=$(echo "$ALLOWED_IC" | tr '[:lower:]' '[:upper:]')
        if [[ "${ALLOWED_IC}" == "SKIP_CHG_VALIDATION" ]]; then
          echo "##[debug] Skipping CHG Verification"
          exit 0
        fi
        echo "##[command] ${VALIDADEMR_CLI_PATH} check now --number ${CHG_NUMBER} --allowed-state Implementar --allowed-ics '${ALLOWED_IC}'"
        ${VALIDADEMR_CLI_PATH} check now --number ${CHG_NUMBER} --allowed-state Implementar --allowed-ics "${ALLOWED_IC}"
    env:
      CHG_NUMBER: ${{ parameters.chg_number }}
      VALIDADEMR_CLI_PATH: $(Agent.TempDirectory)/validatemr-cli
      SERVICE_NOW_AUTH_TOKEN: $(SERVICE_NOW_AUTH_TOKEN)
      AZDO_PROJECT: $(System.TeamProject)