# Template: Install Python requirements, NLTK data and optional npm dependencies
# Usage:
#   - template: /tech_products/azr4/templates/installLibraries.yml
#     parameters:
#       requirementsPath: '$(Build.Repository.LocalPath)/requirements.txt'
#       nexusHost: 'nexus.tid.es'
#       nexusUrl: 'https://$(NEXUS_USERNAME):$(NEXUS_PASSWORD)@nexus.tid.es/repository/pypi-nlpau-aura-cognitive-buffer/simple'

parameters:
  - name: requirementsPath
    type: string
    default: '$(Build.Repository.LocalPath)/requirements.txt'
  - name: nexusHost
    type: string
    default: 'nexus.tid.es'
  - name: nexusUrl
    type: string
    default: ''

steps:
  - bash: |
      #!/bin/bash
      set -e
      set -x

      REQS_PATH="${{ parameters.requirementsPath }}"

      if [ -z "$(AURA_VENVBASE)" ]; then
        echo "AURA_VENVBASE is not set. Aborting."
        exit 1
      fi

      source "$(AURA_VENVBASE)/bin/activate"

      if [ -f "$REQS_PATH" ]; then
        echo "Installing requirements from $REQS_PATH"
          CLEAN_PAT=$(echo "${EXTERNAL_ARTIFACTS_PAT_2}" | tr -d "'\"")
          export PIP_INDEX_URL="https://aura-core-br:${CLEAN_PAT}@pkgs.dev.azure.com/div-aura/c833fd5d-6da1-4867-a4a1-1e518d009c19/_packaging/aura-core-br/pypi/simple/"
          export PIP_EXTRA_INDEX_URL="https://pypi.org/simple"
          pip install -r "$REQS_PATH"
      else
        echo "Requirements file not found at $REQS_PATH — skipping pip install"
      fi
    displayName: 'Install Python requirements'
    env:
      PIP_CONFIG_FILE: ~/.pypirc
      EXTERNAL_ARTIFACTS_PAT_2: $(EXTERNAL_ARTIFACTS_PAT_2)

  - bash: |
      #!/bin/bash
      set -e
      set -x

      source "$(AURA_VENVBASE)/bin/activate"
      echo "Installing NLTK data (stopwords, punkt)"
      python3 -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')"
    displayName: 'Install NLTK data'

  - bash: |
      #!/bin/bash
      set -e
      set -x

      if [ -f package.json ]; then
        echo "Installing npm dependencies"
        npm ci || npm install
      else
        echo "No package.json found — skipping npm install"
      fi
    displayName: 'Install npm dependencies'
