# Template: Import nlpdata-tools and copy requirements
# Runs the repository-provided import script and copies the requirements
# file from the imported module to the project root.
#
# Usage:
#   - template: /tech_products/azr4/templates/importNlpdataTools.yml
#
steps:
  - bash: |
      #!/bin/bash
      set -eo pipefail

      REPO_ROOT="$(Build.Repository.LocalPath)"
      CI_CACHE_DIR="$REPO_ROOT/.tmp/aura-nlpdata-tools"
      AURACAO_CI_REPO="https://dev.azure.com/telefonica-vivo-brasil/QPRK%20-%204P%20AURA%20WHATSAPP%20FACEBOOK/_git/aura-nlpdata-tools"
      SRC_REQ="$CI_CACHE_DIR/requirements/requirements.txt"
      DEST_REQ="$REPO_ROOT/requirements.txt"

      echo "##[group]Import nlpdata-tools"
      echo "##[debug]Repository root: $REPO_ROOT"
      echo "##[debug]Cache dir: $CI_CACHE_DIR"

      # Guard: ensure System.AccessToken was injected (fails if Build Service lacks permission)
      if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
        echo "##[error]SYSTEM_ACCESSTOKEN is empty."
        echo "##[error]Grant the Build Service read access to 'aura-nlpdata-tools' in Project Settings > Repositories (ADR-0008)."
        exit 1
      fi

      # Activate virtualenv if available
      if [ -n "${AURA_VENVBASE:-}" ] && [ -f "${AURA_VENVBASE}/bin/activate" ]; then
        echo "##[debug]Activating virtualenv: $AURA_VENVBASE"
        # shellcheck source=/dev/null
        source "${AURA_VENVBASE}/bin/activate"
      fi

      # Remove stale cache dir to avoid "already exists" failure on retries/re-runs
      if [ -d "$CI_CACHE_DIR" ]; then
        echo "##[debug]Removing stale cache dir before clone..."
        rm -rf "$CI_CACHE_DIR"
      fi
      mkdir -p "$CI_CACHE_DIR"

      # Clone using Bearer token — never embed credentials in the URL (ADR-0008)
      echo "Cloning aura-nlpdata-tools (branch release/br)..."
      git -c http.extraHeader="Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
          clone --branch release/br --depth 1 "$AURACAO_CI_REPO" "$CI_CACHE_DIR"
      echo "##[debug]Clone completed successfully."

      # Copy requirements from the imported module
      if [ -f "$SRC_REQ" ]; then
        cp "$SRC_REQ" "$DEST_REQ"
        echo "Requirements copied: $SRC_REQ -> $DEST_REQ"
      else
        echo "##[warning]requirements.txt not found at $SRC_REQ — skipping copy."
      fi

      echo "##[endgroup]"
    displayName: "Import nlpdata-tools and copy requirements"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)