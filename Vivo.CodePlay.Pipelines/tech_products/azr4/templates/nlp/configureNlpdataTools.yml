# Template: Configure Nlpdata Tools Repository
# This template configures the nlpdata tools for a specific branch,
# setting up the repository configuration via the auracog-ci CLI.
#
# Usage in pipeline:
#   - template: /tech_products/azr4/templates/configureNlpdataTools.yml
#     parameters:
#       repository: '$(Build.Repository.Name)'
#       branch: '$(Build.SourceBranchName)'

parameters:
  - name: repository
    type: string
    default: ''
  - name: branch
    type: string
    default: ''

steps:
  - bash: |
      #!/bin/bash
      set -e
      set -x
      
      REPOSITORY="${{ parameters.repository }}"
      BRANCH="${{ parameters.branch }}"
      
      echo "##[group]Configuring nlpdata tools"
      echo "Repository: $REPOSITORY"
      echo "Branch: $BRANCH"
      
      source "$(AURA_VENVBASE)/bin/activate"
      
      python3 -m auracog_ci.scripts.training.training_repos_cli \
          --task configure_repo \
          --repositoryName "$REPOSITORY" \
          --branchName "$BRANCH" \
          --githubUser "$(GITHUB_USER)" \
          --githubToken "$(GITHUB_TOKEN)" \
          --githubAdminUser "$(GITHUB_ADMIN_USER)" \
          --githubAdminToken "$(GITHUB_ADMIN_TOKEN)"
      
      echo "##[endgroup]"
    displayName: 'Configure nlpdata tools'
    env:
      GITHUB_USER: $(GITHUB_USER)
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      GITHUB_ADMIN_USER: $(GITHUB_ADMIN_USER)
      GITHUB_ADMIN_TOKEN: $(GITHUB_ADMIN_TOKEN)
