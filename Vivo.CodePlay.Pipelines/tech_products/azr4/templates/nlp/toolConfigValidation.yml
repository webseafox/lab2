# Template: Import nlpdata-tools and copy requirements
# Runs the repository-provided import script and copies the requirements
# file from the imported module to the project root.
#
# Usage:
#   - template: /tech_products/azr4/templates/toolConfigValidation.yml
#
steps:
  - bash: |
      set -e
      set -x

      source "${AURA_VENVBASE}/bin/activate"

      PROJECT_ROOT_FOLDER="$(Build.Repository.LocalPath)"
      VALIDATION_TMP_FOLDER="${PROJECT_ROOT_FOLDER}/validation_tmp"

      validation_cfg=$(cat <<EOF
          [
            {
              "path": "auracog_pipelines.utilities.validators.nlp_data_tool_config_validator.nlp_data_tool_config_validator.NLPDataToolConfigValidator",
              "params": {
                "target_branch": "${CHANGE_TARGET}",
                "nlp_data_tool_config_file_path": "${PROJECT_ROOT_FOLDER}/config.txt",
                "branch_patterns_for_validation": ['release/br']
              },
              "actions": [
                {
                  "path": "auracog_lib.validation.actions.github_comment.github_comment.GithubCommentActionValidator",
                  "params": {
                    "user": "${GITHUB_USER}",
                    "token": "${GITHUB_TOKEN}",
                    "issue_id": "${ghprbPullId}",
                    "repo_owner": "Telefonica",
                    "repo_name": "${REPO_NAME}"
                  }
                },
                {
                  "path": "auracog_lib.validation.actions.update_nlpdata_tools_config_content.update_nlpdata_tools_config_content.UpdateNlpdataToolsConfigContentActionValidator",
                  "params": {
                    "repo_owner": "Telefonica",
                    "repo_name": "${REPO_NAME}",
                    "target_branch": "${CHANGE_TARGET}",
                    "source_branch": "${MERGED_BRANCH}",
                    "github_user": "${GITHUB_ADMIN_USER}",
                    "github_token": "${GITHUB_ADMIN_TOKEN}"
                  }
                },
                {
                  "path": "auracog_lib.validation.actions.systemexit.systemexit.SystemExitActionValidator",
                  "params": {
                    "error_code": -1
                  }
                }
              ]
            }
          ]
      EOF
      )

      echo ${validation_cfg} > ${VALIDATION_TMP_FOLDER}/validation_nlp_data_tool_config.json.tpl

      envsubst < ${VALIDATION_TMP_FOLDER}/validation_nlp_data_tool_config.json.tpl > ${VALIDATION_TMP_FOLDER}/validation_nlp_data_tool_config.json

      python3 -m auracog_lib.validation.validation_cli \
          --path "${VALIDATION_TMP_FOLDER}/config/etc" \
          --config "bootstrap" \
          --validationConfigFilePath "${VALIDATION_TMP_FOLDER}/validation_nlp_data_tool_config.json" \
          --logName "nlp"

    displayName: 'Tool Config Validation'
