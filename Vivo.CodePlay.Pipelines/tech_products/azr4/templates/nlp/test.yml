# Template: Run pipeline evaluation tests
# Runs evaluation for testsets and regression as in Jenkins `test()`.
# Usage:
#  - template: /tech_products/azr4/templates/test.yml

parameters: {}

steps:
  - bash: |
      #!/bin/bash
      set -e
      set -x

      if [ -z "$(AURA_VENVBASE)" ]; then
        echo "AURA_VENVBASE not set; ensure createVirtualenv ran earlier"
        exit 1
      fi

      source "$(AURA_VENVBASE)/bin/activate"

      # Recompute from the authoritative predefined variable to avoid a
      # corrupted/quoted value propagated by ##vso[task.setvariable].
      TMP_FOLDER="${BUILD_REPOSITORY_LOCALPATH}/tmp"
      PIPELINE_EVAL_FOLDER="${TMP_FOLDER}/pipeline_eval"

      echo "Running pipeline evaluation (testsets)"

      python3 -m auracog_pipelines.pipeline_eval.eval \
        --ob "BR" \
        --path "${TMP_FOLDER}/config" \
        --reportPath "${PIPELINE_EVAL_FOLDER}/ob/BR/resources/results.json" \
        --fullDetails "${PIPELINE_EVAL_FOLDER}/ob/BR/resources" \
        --testsetNames "testset*.json" \
        --workingDirectory "${PIPELINE_EVAL_FOLDER}/ob" \
        --dataSourceDirectory "${DATA_FOLDER}" \
        --nlpConfigDirectoryPath "${TMP_FOLDER}/config/etc/nlp_config" \
        --logName "nlp" \
        --logKPIName "recognizer_kpi"

      echo "Running pipeline evaluation (regression)"

      python3 -m auracog_pipelines.pipeline_eval.eval \
        --ob "BR" \
        --path "${TMP_FOLDER}/config" \
        --reportPath "${PIPELINE_EVAL_FOLDER}/ob/BR/resources/regression/results.json" \
        --fullDetails "${PIPELINE_EVAL_FOLDER}/ob/BR/resources/regression" \
        --testsetNames "regression.json" \
        --workingDirectory "${PIPELINE_EVAL_FOLDER}/ob" \
        --dataSourceDirectory "${DATA_FOLDER}" \
        --nlpConfigDirectoryPath "${TMP_FOLDER}/config/etc/nlp_config" \
        --logName "nlp" \
        --logKPIName "recognizer_kpi"
    displayName: 'Run pipeline evaluation tests'
    env:
      TMP_FOLDER: tmp
      PIPELINE_EVAL_FOLDER: tmp/pipeline_eval
      DATA_FOLDER: data
