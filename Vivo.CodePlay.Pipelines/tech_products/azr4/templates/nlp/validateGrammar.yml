# Template: Validate grammar using auracog_lib.validation.validation_cli
# Usage:
#  - template: /tech_products/azr4/templates/validateGrammar.yml

parameters: {}

steps:
  - bash: |
      #!/bin/bash
      set -e
      set -x

      if [ -z "$(AURA_VENVBASE)" ]; then
        echo "AURA_VENVBASE not set; ensure createVirtualenv ran earlier"
        exit 1
      fi

      source "$(AURA_VENVBASE)/bin/activate"

      # Ensure validation tmp folder exists
      mkdir -p "${VALIDATION_TMP_FOLDER}"

      # Render config from template
      if [ -f "${VALIDATION_TMP_FOLDER}/validation_config_grammar.json.tpl" ]; then
        envsubst < "${VALIDATION_TMP_FOLDER}/validation_config_grammar.json.tpl" > "${VALIDATION_TMP_FOLDER}/validation_config_grammar.json"
      else
        echo "Template ${VALIDATION_TMP_FOLDER}/validation_config_grammar.json.tpl not found"
        exit 1
      fi

      # Run the grammar validation
      python3 -m auracog_lib.validation.validation_cli \
        --path "${VALIDATION_TMP_FOLDER}/config/etc" \
        --config "grammar_validator" \
        --validationConfigFilePath "${VALIDATION_TMP_FOLDER}/validation_config_grammar.json" \
        --logName "nlp" \
        --logKPIName "recognizer_kpi"
    displayName: 'Validate grammar'
    env:
      AURA_VENVBASE: $(AURA_VENVBASE)
      VALIDATION_TMP_FOLDER: 'validation_tmp'
