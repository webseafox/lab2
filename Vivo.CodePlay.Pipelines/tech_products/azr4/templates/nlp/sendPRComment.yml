# Template: Send PR comment via Azure DevOps RTM dispatch event
# This template extracts the merged branch name from the current commit,
# validates branch conditions, and sends an Azure DevOps pipeline trigger
# to the Release Train Manager repository.
#
# Usage in pipeline:
#   - template: /tech_products/azr4/templates/sendPRComment.yml
#     parameters:
#       organization: 'your-org'
#       title: 'Generating package for $(REPO_NAME)'
#       body: 'Pipeline generating package NLP url: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'

parameters:
  - name: organization
    type: string
    default: 'Telefonica'
  - name: title
    type: string
    default: 'Generating package'
  - name: body
    type: string
    default: ''

steps:
  - bash: |
      #!/bin/bash
      set -e
      
      # Extract the merged branch name from commit message
      COMMIT_INFO=$(git log --format="%s" -n1 "$(Build.SourceVersion)")
      echo "Commit message: $COMMIT_INFO"
      
      # Regex 1: Match "Telefonica/(.+)$"
      if [[ $COMMIT_INFO =~ Telefonica/(.+)$ ]]; then
        BRANCH_RTM="${BASH_REMATCH[1]}"
        echo "Branch RTM (regex1): $BRANCH_RTM"
      # Regex 2: Match "^feat: branch (.+) merged into"
      elif [[ $COMMIT_INFO =~ ^feat:\ branch\ (.+)\ merged\ into ]]; then
        BRANCH_RTM="${BASH_REMATCH[1]}"
        echo "Branch RTM (regex2): $BRANCH_RTM"
      else
        echo "No matching branch pattern found in commit message"
        BRANCH_RTM=""
      fi
      
      echo "##vso[task.setvariable variable=BRANCH_RTM]$BRANCH_RTM"
    displayName: 'Extract merged branch name from commit'

  - bash: |
      #!/bin/bash
      set -e
      
      BRANCH_RTM="$(BRANCH_RTM)"
      CURRENT_BRANCH="$(Build.SourceBranchName)"
      MASTER="master"
      
      # Branch prefixes (adapt to your versioning scheme)
      MAIN_PREFIX="main/"
      HOTFIX_PREFIX="hotfix/"
      RELEASE_PREFIX="release/"
      
      # Validate branch conditions:
      # branchRTM must exist AND
      # (current branch == master OR starts with release/) AND
      # (branchRTM starts with main/ OR starts with hotfix/)
      
      if [ -z "$BRANCH_RTM" ]; then
        echo "BRANCH_RTM is empty, skipping dispatch event"
        exit 0
      fi
      
      IS_VALID_CURRENT_BRANCH=false
      if [ "$CURRENT_BRANCH" = "$MASTER" ] || [[ "$CURRENT_BRANCH" =~ ^release/ ]]; then
        IS_VALID_CURRENT_BRANCH=true
      fi
      
      IS_VALID_RTM_BRANCH=false
      if [[ "$BRANCH_RTM" =~ ^main/ ]] || [[ "$BRANCH_RTM" =~ ^hotfix/ ]]; then
        IS_VALID_RTM_BRANCH=true
      fi
      
      if [ "$IS_VALID_CURRENT_BRANCH" = true ] && [ "$IS_VALID_RTM_BRANCH" = true ]; then
        echo "Conditions met, will send dispatch event"
        echo "##vso[task.setvariable variable=SEND_DISPATCH_EVENT]true"
      else
        echo "Conditions not met:"
        echo "  IS_VALID_CURRENT_BRANCH=$IS_VALID_CURRENT_BRANCH"
        echo "  IS_VALID_RTM_BRANCH=$IS_VALID_RTM_BRANCH"
        echo "  BRANCH_RTM=$BRANCH_RTM"
        echo "  CURRENT_BRANCH=$CURRENT_BRANCH"
      fi
    displayName: 'Validate branch conditions'

  - bash: |
      #!/bin/bash
      set -e
      
      if [ "$(SEND_DISPATCH_EVENT)" != "true" ]; then
        echo "Skipping Azure DevOps pipeline trigger (conditions not met)"
        exit 0
      fi
      
      TITLE="${{ parameters.title }}"
      BODY="${{ parameters.body }}"
      BRANCH_RTM="$(BRANCH_RTM)"
      ORGANIZATION="${{ parameters.organization }}"
      REPO_NAME="aura-release-train-manager"
      PROJECT_NAME="cognitive"
      PIPELINE_NAME="jenkins-comment-pr-event"
      
      echo "Triggering Azure DevOps pipeline..."
      echo "Organization: $ORGANIZATION"
      echo "Project: $PROJECT_NAME"
      echo "Repository: $REPO_NAME"
      echo "Pipeline: $PIPELINE_NAME"
      echo "Branch: $BRANCH_RTM"
      
      # Prepare the JSON payload for Azure DevOps pipeline trigger
      # This uses the Azure DevOps REST API to trigger a pipeline with variables
      PAYLOAD=$(cat <<EOF
      {
        "templateParameters": {
          "branch": "$BRANCH_RTM",
          "comment_type": "info",
          "comment_title": "$TITLE",
          "comment_body": "$BODY"
        }
      }
      EOF
      )
      
      echo "Payload: $PAYLOAD"
      
      # Trigger the Azure DevOps pipeline
      # You may need to adjust the pipeline ID or name based on your setup
      curl --location --request POST "https://dev.azure.com/$ORGANIZATION/$PROJECT_NAME/_apis/pipelines/runs?api-version=7.0" \
        --header "Authorization: Bearer $(System.AccessToken)" \
        --header "Content-Type: application/json" \
        --data-raw "$PAYLOAD"
      
      echo "Azure DevOps pipeline triggered successfully"
    displayName: 'Trigger Azure DevOps pipeline'
