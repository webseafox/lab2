# Template: Install auracog-pipelines (specific version) and auracog-lib
# Intended to run in a single-job pipeline after the virtualenv is created.
# Usage:
#  - template: /tech_products/azr4/templates/installPipelinesAndLibs.yml
#    parameters:
#      pipelinesVersion: '1.0.3'
#      libVersion: '1.0.1'
#      nexusHost: 'nexus.tid.es'
#      nexusUrl: 'https://$(NEXUS_USERNAME):$(NEXUS_PASSWORD)@nexus.tid.es/repository/pypi-nlpau-aura-cognitive-buffer/simple'

parameters:
  - name: pipelinesVersion
    type: string
    default: '2.0.1'
  - name: libVersion
    type: string
    default: '2.0.1'
  - name: pipConfFilePath
    type: string
    default: ''
    displayName: 'Path to pip-confg file downloaded by parent pipeline'
  - name: pypiConfFilePath
    type: string
    default: ''
    displayName: 'Path to pypi-confg file downloaded by parent pipeline'

steps:

  # 2. Setup pip.conf in home directory (if provided by parent pipeline)
  - bash: |
      #!/bin/bash
      set -e
      if [ -n "$PIP_CONF_FILE" ] && [ -f "$PIP_CONF_FILE" ]; then
        mkdir -p ~/.config/pip
        cp "$PIP_CONF_FILE" ~/.config/pip/pip.conf
        cp "$PYPI_CONF_FILE" ~/.pypirc
        chmod 600 ~/.config/pip/pip.conf
        chmod 600 ~/.pypirc
        echo "✅ Configured pip.conf for pip authentication"
      else
        echo "⚠️ pip.conf not provided or not found at: $PIP_CONF_FILE"
        echo "pip will attempt authentication with System.AccessToken in URLs"
      fi
    displayName: 'Setup pip authentication (if provided)'
    env:
      PIP_CONF_FILE: ${{ parameters.pipConfFilePath }}
      PYPI_CONF_FILE: ${{ parameters.pypiConfFilePath }}

  - bash: |
      #!/bin/bash
      set -e
      set -x

      echo "##[group]Install last version of auracog-pipelines"
      if [ -z "$(AURA_VENVBASE)" ]; then
        echo "AURA_VENVBASE is not set. Aborting."
        exit 1
      fi

      source "$(AURA_VENVBASE)/bin/activate"

      echo "Uninstalling existing auracog-pipelines (if any)"
      pip uninstall auracog-pipelines --yes || true

      echo "Installing auracog-pipelines==${{ parameters.pipelinesVersion }}"
      CLEAN_PAT=$(echo "${EXTERNAL_ARTIFACTS_PAT_2}" | tr -d "'\"")
      export PIP_INDEX_URL="https://aura-core-br:${CLEAN_PAT}@pkgs.dev.azure.com/div-aura/c833fd5d-6da1-4867-a4a1-1e518d009c19/_packaging/aura-core-br/pypi/simple/"
      export PIP_EXTRA_INDEX_URL="https://pypi.org/simple"
      pip install "auracog-pipelines==${{ parameters.pipelinesVersion }}"

      echo "##[endgroup]"
    displayName: 'Install auracog-pipelines'
    env:
      PIP_CONFIG_FILE: ~/.pypirc
      EXTERNAL_ARTIFACTS_PAT_2: $(EXTERNAL_ARTIFACTS_PAT_2)

  - bash: |
      #!/bin/bash
      set -e
      set -x

      echo "##[group]Install auracog-lib"
      source "$(AURA_VENVBASE)/bin/activate"

      CLEAN_PAT=$(echo "${EXTERNAL_ARTIFACTS_PAT_2}" | tr -d "'\"")
      export PIP_INDEX_URL="https://aura-core-br:${CLEAN_PAT}@pkgs.dev.azure.com/div-aura/c833fd5d-6da1-4867-a4a1-1e518d009c19/_packaging/aura-core-br/pypi/simple/"
      export PIP_EXTRA_INDEX_URL="https://pypi.org/simple"
      pip install "auracog-lib==${{ parameters.libVersion }}"

      echo "##[endgroup]"
    displayName: 'Install auracog-lib'
    env:
      PIP_CONFIG_FILE: ~/.pypirc
      EXTERNAL_ARTIFACTS_PAT_2: $(EXTERNAL_ARTIFACTS_PAT_2)
