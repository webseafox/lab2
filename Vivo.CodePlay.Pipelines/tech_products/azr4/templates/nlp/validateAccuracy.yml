# Template: Validate accuracy using auracog_lib.validation.validation_cli
# Renders accuracy config from template and runs validation CLI with "bootstrap" config
# Usage:
#  - template: /tech_products/azr4/templates/validateAccuracy.yml

parameters: {}

steps:
  - bash: |
      #!/bin/bash
      set -e
      set -x
      set -euo pipefail

      mkdir -p .logs

      RESULTS_FOLDER="${TMP_FOLDER}/results"
      RESULT_FOLDER="${TMP_FOLDER}/results"
      export RESULT_FOLDER="${TMP_FOLDER}/results"

      RESULTS_JSON="${RESULTS_FOLDER}/pipeline_eval/BR/results.json"
      RESULTS_REGRESSION_JSON="${RESULTS_FOLDER}/pipeline_eval/BR/regression/results.json"
      PROJECT_ROOT_FOLDER="$(Build.Repository.LocalPath)"
      DATA_FOLDER="${PROJECT_ROOT_FOLDER}/data"

      export PROJECT_ROOT_FOLDER="$(Build.Repository.LocalPath)"
      export DATA_FOLDER="${PROJECT_ROOT_FOLDER}/data"

      VALIDATION_TMP_FOLDER="${PROJECT_ROOT_FOLDER}/validation_tmp"
      PLATFORM="BR"

      echo "${RESULT_FOLDER}"

      if [ -z "$(AURA_VENVBASE)" ]; then
        echo "AURA_VENVBASE not set; ensure createVirtualenv ran earlier"
        exit 1
      fi

      source "$(AURA_VENVBASE)/bin/activate"

      # Render config from template
      if [ -f "${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json.tpl" ]; then
        envsubst < "${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json.tpl" > "${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json"
        cat "${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json"
      else
        echo "Template ${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json.tpl not found"
        exit 1
      fi

      # Run the accuracy validation (bootstrap)
      python3 -m auracog_lib.validation.validation_cli \
        --path "${VALIDATION_TMP_FOLDER}/config/etc" \
        --config "bootstrap" \
        --validationConfigFilePath "${VALIDATION_TMP_FOLDER}/validation_config_accuracy.json" \
        --logName "nlp" 2>&1 | tee .logs/accuracy.log
      exit ${PIPESTATUS[0]}
    displayName: 'Validate accuracy'
    continueOnError: true
    env:
      AURA_VENVBASE: $(AURA_VENVBASE)
      VALIDATION_TMP_FOLDER: validation_tmp
