parameters:
  environment: ''
  chg_number: ''

jobs:
- deployment: deployment
  pool: GeneralPurposeLinuxAgentsCD
  environment: 
    name: deploy-${{ parameters.environment }}
  strategy:
    runOnce:   
      deploy:
        steps:
        - checkout: self
          persistCredentials: true
        - template: /tech_products/azr4/templates/steps/get_latest_version.yaml
        - task: Bash@3
          name: deploy
          displayName: 'Deploy'
          continueOnError: false
          env:
            NEW_VERSION: $(get_version.VERSION)
          inputs:
            targetType: inline
            script: |
              export
            
