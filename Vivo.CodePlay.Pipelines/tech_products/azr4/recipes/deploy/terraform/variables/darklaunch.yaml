variables:
- name: ARM_TENANT_ID
  value: ${{ coalesce(parameters.envs.ARM_TENANT_ID, '0fce1554-ffcc-4e69-aa8d-9334eb2d8fd7') }}
- name: TARGET_DIR
  value: ${{ coalesce(parameters.envs.TARGET_DIR, '') }}
- ${{ if variables['system.debug'] }}:
  - name: TF_LOG
    value: ${{ coalesce(parameters.envs.TF_LOG, 'INFO') }}
- ${{ else }}:
  - name: TF_LOG
    value: ${{ coalesce(parameters.envs.TF_LOG, 'INFO') }}
- name: EXECUTE_APPLY
  value: ${{ coalesce(parameters.envs.EXECUTE_APPLY, 'false') }}
- name: AKV_DEVOPS_NAME
  value: ${{ coalesce(parameters.envs.AKV_DEVOPS_NAME, 'kv-azdevops-shared') }}
- name: GET_CRED_SUB_NAME
  value: ${{ coalesce(parameters.envs.GET_CRED_SUB_NAME, variables['Build.Repository.Name']) }}
- name: EXECUTE_DEPLOY
  value: ${{ coalesce(parameters.envs.EXECUTE_APPLY, 'false') }}
- name: TERRAFORM_PROJECT_NAME
  value: ${{ coalesce(parameters.envs.TERRAFORM_PROJECT_NAME, replace(variables['TARGET_DIR'],'/','-')) }}
- name: FORCE_REPLACE_APIM_API
  value: ${{ coalesce(parameters.envs.FORCE_REPLACE_APIM_API, 'false') }}
