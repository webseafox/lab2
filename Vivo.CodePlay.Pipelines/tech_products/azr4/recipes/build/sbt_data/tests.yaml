jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  condition: eq(variables['EXECUTE_TESTS'], 'true')
  workspace:
    clean: all
  steps:
    - script: |
        asdf install java ${ASDF_JDK}
        asdf local java ${ASDF_JDK}
      displayName: Use Java ${ASDF_JDK}
    - task: Cache@2
      condition: eq(variables['USE_CACHE'], 'true')
      inputs:
        key: "sbt | $(Agent.OS) | **/build.sbt"
        path: "$(Build.SourcesDirectory)/.ivy2"
        restoreKeys: |
          sbt | $(Agent.OS)
          sbt
    - script: |
        set -e
        sbt coverage test coverageReport coverageOff --ivy $(Build.SourcesDirectory)/.ivy2 --verbose
        ls -la $(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH) || true

        if [ -e $(Build.SourcesDirectory)/${DROP_SUBPATH}/*/*/scoverage.xml ]; then

          echo "##[group] Incluindo variavel no arquivo de report scoverage.xml para ser substituida na etapa do sonar (quando for build SBT)"

          BUILD_SOURCE_DIR_REPLACED=$(echo $(Build.SourcesDirectory) | sed 's/\//\\\//g')
          echo "##[command] sed -i 's/${BUILD_SOURCE_DIR_REPLACED}/TEST_SOURCE_DIR/g' $(Build.SourcesDirectory)/${DROP_SUBPATH}/*/*/scoverage.xml"
          sed -i "s/${BUILD_SOURCE_DIR_REPLACED}/TEST_SOURCE_DIR/g" $(Build.SourcesDirectory)/${DROP_SUBPATH}/*/*/scoverage*.xml
          cat $(Build.SourcesDirectory)/${DROP_SUBPATH}/*/*/scoverage.xml

          echo "##[endgroup]"
        
        fi
      displayName: “Unit Test”
      continueOnError: False

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)/$(DROP_SUBPATH)'
        artifactName: drop

    - task: PublishCodeCoverageResults@2
      continueOnError: true
      inputs:
        summaryFileLocation: $(Build.SourcesDirectory)/$(COVERAGE_REPORT_PATH)