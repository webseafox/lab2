
jobs:
- job: publish
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  variables:
    - name: SECURITY_GATE_PASSED
      value: $[ stageDependencies.gates.security.outputs['VerifySecurityGates.SECURITY_GATE_PASSED'] ]
    - name: SECURITY_JOB_RESULT
      value: $[ stageDependencies.gates.security.result ]
    - template: ./variables.yaml
  continueOnError: false
  steps:
    - template: /tech_products/azr4/templates/steps/validate-sg-execution.yaml
    - template: /tech_products/azr4/templates/steps/version_update.yaml
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: $(PROJECT_NAME)
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(Build.ArtifactStagingDirectory)
    - script: |
        export FILE_PATH=$(Build.ArtifactStagingDirectory)/extracted_tars/$(PROJECT_NAME)/$(PROJECT_NAME)-${SET_VERSION_VERSION}.tar.gz
        ls -laR $(Build.ArtifactStagingDirectory)
        echo "##[debug] Uploading artifact to Nexus"
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u $NEXUS_USERNAME:$NEXUS_PASSWORD \
          --upload-file $FILE_PATH \
          "$NEXUS_PROTOCOL://$NEXUS_URL/repository/$NEXUS_GROUP_NAME/$NEXUS_GROUP_ID/$NEXUS_SUB_ARTIFACT_ID/$SET_VERSION_VERSION/$NEXUS_SUB_ARTIFACT_ID-$SET_VERSION_VERSION.tar.gz")
        
        if [[ $HTTP_STATUS -ne 201 ]]; then
          echo "##vso[task.logissue type=error] Upload failed with status code $HTTP_STATUS"
          echo "##vso[task.logissue type=error] File path: $FILE_PATH"
          echo "##vso[task.logissue type=error] Nexus URL: $NEXUS_PROTOCOL://$NEXUS_URL/repository/$NEXUS_GROUP_NAME/$NEXUS_GROUP_ID/$NEXUS_SUB_ARTIFACT_ID/$SET_VERSION_VERSION/$NEXUS_SUB_ARTIFACT_ID-$SET_VERSION_VERSION.tar.gz"
          echo "##vso[task.logissue type=error] curl response: $HTTP_RESPONSE"
          echo "##vso[task.complete result=Failed;]"
          exit 1
        else
          echo "##[debug] Upload successful with status code $HTTP_STATUS"
        fi
# TODO: Add a task to publish the sha1 and md5 checksums of the artifact to Nexus
      displayName: 'Upload Artifact to Nexus'
      env:
        NEXUS_USERNAME: $(NEXUS_USERNAME)
        NEXUS_PASSWORD: $(NEXUS_PASSWORD)
        NEXUS_PROTOCOL: $(NEXUS_PROTOCOL)
        NEXUS_URL: $(NEXUS_URL)
        NEXUS_GROUP_NAME: $(NEXUS_GROUP_NAME)
        NEXUS_GROUP_ID: $(NEXUS_GROUP_ID)
        NEXUS_SUB_ARTIFACT_ID: $(NEXUS_SUB_ARTIFACT_ID)
        FILE_PATH: $(FILE_PATH)
