parameters:
- name: 'envs'
  type: object
  default: {}

variables:
- name: PROJECT_NAME
  value: $(Build.Repository.Name)
- name: VERSION_FILE_PATH
  value: 'build.sbt framework/config/'
# Publish Variables 
- name: NEXUS_PROTOCOL
  value: 'https'
- name: NEXUS_URL
  value: 'nexus.telefonicabigdata.com'
- name: NEXUS_GROUP_NAME
  value: 'data-engineering-4p-raw'
- name: NEXUS_GROUP_ID
  value: 'br/com/vivo'
- name: NEXUS_SUB_ARTIFACT_ID
  value: $(PROJECT_NAME)
# Using group: '4p-core-default-variables'
# - name: NEXUS_USERNAME
#   value: $(NEXUS_USERNAME)
# - name: NEXUS_PASSWORD
#   value: $(NEXUS_PASSWORD)
- name: PIPELINE_TECH
  value: 'sbt'
- name: EXECUTE_TESTS
  value: ${{ coalesce(parameters.envs.EXECUTE_UNIT_TESTS, parameters.envs.EXECUTE_TESTS, 'true') }}
- name: USE_CACHE
  value: ${{ coalesce(parameters.envs.USE_CACHE, 'true') }}
- name: ASDF_JDK
  value: ${{ coalesce(parameters.envs.ASDF_JDK, 'adoptopenjdk-8.0.352+8') }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: COVERAGE_REPORT_PATH
  value: 'target/scala-2.11/coverage-report/cobertura.xml'
- name: DROP_SUBPATH
  value: 'target'
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
