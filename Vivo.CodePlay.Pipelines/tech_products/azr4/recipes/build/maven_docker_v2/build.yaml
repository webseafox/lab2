parameters:
  - name: mavenCommand
    type: string
    default: "mvn clean install -DskipTests"
  - name: condition
    type: object
    default: "true"
  - name: MAVEN_CACHE_FOLDER
    type: string
    default: "$(Pipeline.Workspace)/.cache/app_dependencies/repository"
  - name: asdf_jdk
    default: "17.0.2"
  - name: envs
    type: object
    default: {}

jobs:
- job: install
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  steps:

  - template: /tech_products/azr4/templates/steps/set_java_version.yaml
    parameters:
      asdf_jdk: ${{ parameters.asdf_jdk }}

  - template: /tech_products/azr4/templates/steps/setup_maven_settings.yaml

  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: ${{ parameters.MAVEN_CACHE_FOLDER }}
    displayName: Cache Maven Dependencies
    condition: ${{ parameters.condition }}

  - bash: |
      # Define the directory path
      CACHE_DIR="$(Pipeline.Workspace)/.cache/app_dependencies/repository"

      # Check if the directory already exists
      if [ ! -d "$CACHE_DIR" ]; then
        # Create the directory if it does not exist
        mkdir -p "$CACHE_DIR"
      fi
      
      mvn -v
      echo "##[debug] ARTIFACT_REPOSITORY.....: ${ARTIFACT_REPOSITORY}"
      echo "##[debug] MAVEN_SETTINGS_ARGS.....: ${MAVEN_SETTINGS_ARGS}"
      ${{ parameters.mavenCommand }} ${MAVEN_SETTINGS_ARGS} -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true
    displayName: Maven Build
    env:
      AZURE_DEVOPS_PAT: $(System.AccessToken)

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)'
      artifactName: build