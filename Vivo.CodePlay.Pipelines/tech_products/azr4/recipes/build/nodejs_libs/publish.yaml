
jobs:
- job: package
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  variables:
    - name: SECURITY_GATE_PASSED
      value: $[ stageDependencies.gates.security.outputs['VerifySecurityGates.SECURITY_GATE_PASSED'] ]
    - name: SECURITY_JOB_RESULT
      value: $[ stageDependencies.gates.security.result ]
  steps:
  - template: /tech_products/azr4/templates/steps/validate-sg-execution.yaml
  - task: DownloadSecureFile@1
    name: CustomSettings
    displayName: 'Download custom npmrc from secure file'
    inputs:
      secureFile: npmrc
  - script: echo "##vso[task.setvariable variable=DEFAULT_NPMRC_TEMP_FILE_PATH]$(CustomSettings.secureFilePath)"
    displayName: Set DEFAULT_NPMRC_TEMP_FILE_PATH Var
  - template: /tech_products/azr4/templates/steps/version_update.yaml
  - task: UseNode@1
    inputs:
      version: $(NODE_VERSION)
    env:
      NPM_CONFIG_USERCONFIG: $(DEFAULT_NPMRC_TEMP_FILE_PATH)
  - task: Cache@2
    continueOnError: true
    condition: eq(variables['CACHE_APP_DEPENDENCIES'], 'true')
    inputs:
      key: "node | $(Agent.OS) | **/package-lock.json, **/npm-shrinkwrap.json, **/package.json"
      path: "$(Build.SourcesDirectory)/node_modules"
      restoreKeys: |
        node | $(Agent.OS)
        node
  - script: |
      npm install
    displayName: 'Install Dependencies'
  - script: |
      npm run build
    displayName: 'Build'
    condition: eq(variables['EXECUTE_BUILD'], 'true')
  - script: |
      cp -f ${NPM_CONFIG_USERCONFIG} .npmrc
      npm publish
    displayName: 'Publish'
    env:
      NPM_CONFIG_USERCONFIG: $(DEFAULT_NPMRC_TEMP_FILE_PATH)

