parameters:
  - name: mavenCommand
    type: string
    default: "mvn clean install -DskipTests"
  - name: condition
    type: object
    default: "true"
  - name: MAVEN_CACHE_FOLDER
    type: string
    default: "$(Pipeline.Workspace)/.cache/app_dependencies/repository"
  - name: asdf_jdk
    default: "17.0.2"
  - name: envs
    type: object
    default: {}

jobs:
- job: install
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  steps:

  - script: |
      if [ -f .tool-versions ]; then
        echo "##[debug] using .tool-versions versions"
        cat .tool-versions
        echo ""
      else
        "##[debug] Installing asdf Java version ${{ parameters.asdf_jdk }}"
        asdf install java openjdk-${{ parameters.asdf_jdk }}
        asdf local java openjdk-${{ parameters.asdf_jdk }}
      fi
      asdf current java
    displayName: Set Java Version

  - task: DownloadSecureFile@1
    name: securitysettings
    displayName: 'Download custom security.xml from secure file'
    inputs:
      secureFile: 'settings-security.xml'

  - script: echo "##vso[task.setvariable variable=MAVEN_SETTINGS_SECURITY]$(securitysettings.secureFilePath)"
    displayName: Set MAVEN_SETTINGS_SECURITY Var

  - task: DownloadSecureFile@1
    name: CustomSettings
    displayName: 'Download custom settings.xml from secure file'
    inputs:
      secureFile: settings.xml
  - script: echo "##vso[task.setvariable variable=MAVEN_SETTINGS]$(CustomSettings.secureFilePath)"
    displayName: Set MAVEN_SETTINGS Var

  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: ${{ parameters.MAVEN_CACHE_FOLDER }}
    displayName: Cache Maven Dependencies
    condition: ${{ parameters.condition }}

  - bash: |
      # Define the directory path
      CACHE_DIR="$(Pipeline.Workspace)/.cache/app_dependencies/repository"

      # Check if the directory already exists
      if [ ! -d "$CACHE_DIR" ]; then
        # Create the directory if it does not exist
        mkdir -p "$CACHE_DIR"
      fi
      
      mvn -v
      ${{ parameters.mavenCommand }} -s ${MAVEN_SETTINGS} -Dsettings.security=$(MAVEN_SETTINGS_SECURITY) -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true  
    displayName: Maven Build
  
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)'
      artifactName: build