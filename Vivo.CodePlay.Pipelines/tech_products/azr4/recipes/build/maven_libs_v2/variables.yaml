variables:
- name: IMAGE_NAME
  value: $(Build.Repository.Name)
- name: IMAGE_REGISTRY_CONNECTION
  value: 'registry-telefonicabigdata'
- name: DOCKERFILE_PATH
  value: 'Dockerfile'
- name: MAVEN_CUSTOM_SETTINGS_SECURE_FILE
  value: 'settings.xml'
- name: MAVEN_CUSTOM_SETTINGS_SECURITY_FILE
  value: 'settings-security.xml'
- name: VERSION_FILE_PATH
  value: ${{ coalesce(parameters.envs.VERSION_FILE_PATH, 'pom.xml') }}
- name: PIPELINE_TECH
  value: 'java'
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
# Repositório de artefatos alvo: 'nexus' (default) ou 'azure_artifacts'
- name: ARTIFACT_REPOSITORY
  value: ${{ coalesce(parameters.envs.ARTIFACT_REPOSITORY, 'nexus') }}
# Caminho do settings.xml versionado no repositório (usado quando ARTIFACT_REPOSITORY=azure_artifacts)
- name: MAVEN_CUSTOM_SETTINGS_PATH
  value: ${{ coalesce(parameters.envs.MAVEN_CUSTOM_SETTINGS_PATH, '.azuredevops/settings.xml') }}
- name: MAVEN_GLOBAL_SETTINGS_PATH
  value: ${{ coalesce(parameters.envs.MAVEN_GLOBAL_SETTINGS_PATH, '/home/svc_devopscorp/.m2/settings.xml') }}
# Opcional: quando preenchido, publica via -DaltDeploymentRepository em vez do distributionManagement do pom.xml
- name: ARTIFACT_FEED_URL
  value: ${{ coalesce(parameters.envs.ARTIFACT_FEED_URL, '') }}
- name: ARTIFACT_FEED_SERVER_ID
  value: ${{ coalesce(parameters.envs.ARTIFACT_FEED_SERVER_ID, '') }}
