parameters:
- name: 'envs'
  type: object
  default: {}
variables:
- name: VERSION_FILE_PATH
  value: 'VERSION'
- name: PIPELINE_TECH
  value: 'python'
- name: SONAR_ARGS
  value: '-Dsonar.python.coverage.reportPaths=coverage.xml'
- name: PROJECT_NAME
  value: $(Build.Repository.Name)
- name: MAIN_FILE_PATH
  value: ${{ coalesce(parameters.envs.MAIN_FILE_PATH, 'execute_file.py') }}
- name: BIN_FILE
  value: './dist/execute_file'
- name: PATH_KEYTAB
  value: ${{ coalesce(parameters.envs.PATH_KEYTAB, '/home/AURA_BRAIN/.jenkins/aura_brain.keytab') }}
- name: PYINSTALLER_ARGS
  value: ${{ coalesce(parameters.envs.PYINSTALLER_ARGS, '') }}
- name: EXECUTE_TRAIN
  value: ${{ coalesce(parameters.envs.EXECUTE_TRAIN, 'false') }}
- name: SSH_SERVER
  value: ${{ coalesce(parameters.envs.SSH_SERVER, '10.240.56.19') }}
- name: SSH_PATH
  value: ${{ coalesce(parameters.envs.SSH_PATH, '/home/SVC_ANALYTICSMLOPS/advanced-analytics') }}
- name: SSH_USER
  value: ${{ coalesce(parameters.envs.SSH_USER, 'aura_brain') }}
- name: TESTS_ENABLED
  value: ${{ coalesce(parameters.envs.TESTS_ENABLED, 'false') }}
- name: NEXUS_VERSION
  value: ${{ coalesce(parameters.envs.NEXUS_VERSION, 'nexus3') }}
- name: NEXUS_PROTOCOL
  value: ${{ coalesce(parameters.envs.NEXUS_PROTOCOL, 'https') }}
- name: NEXUS_URL
  value: ${{ coalesce(parameters.envs.NEXUS_URL, 'nexus.telefonicabigdata.com') }}
- name: NEXUS_GROUP_ID
  value: ${{ coalesce(parameters.envs.NEXUS_GROUP_ID, 'br/com/vivo/advanced-analytics/models') }}
- name: NEXUS_GROUP_NAME
  value: ${{ coalesce(parameters.envs.NEXUS_GROUP_NAME, '4plataforma-raw') }}
- name: NEXUS_SUB_ARTIFACT_ID
  value: ${{ coalesce(parameters.envs.NEXUS_SUB_ARTIFACT_ID, variables['Build.Repository.Name']) }}
- name: NEXUS_CLASSIFIER
  value: ${{ coalesce(parameters.envs.NEXUS_CLASSIFIER, '') }}
- name: DEPRECIATION_MESSAGE
  value: "##[warning] This pipeline is deprecated. Please use the new pipeline mlops_v2"
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
