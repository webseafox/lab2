variables:
- name: DOCKERFILE_PATH
  value: ${{ coalesce(parameters.envs.DOCKERFILE_PATH, 'Dockerfile') }}
- name: VERSION_FILE_PATH
  value: ${{ coalesce(parameters.envs.VERSION_FILE_PATH, 'VERSION') }}
- name: PIPELINE_TECH
  value: 'docker'
- name: RECIPE
  value: 'docker'
- name: IMAGE_NAME
  value: ${{ coalesce(parameters.envs.IMAGE_NAME, variables['Build.Repository.Name']) }}
- name: IMAGE_REGISTRY_CONNECTION
  value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION, 'registry-telefonicabigdata') }}
- name: DOCKER_BUILD_ARGS
  value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS, '') }}
- name: DOCKER_BUILD_CONTEXT
  value: ${{ coalesce(parameters.envs.DOCKER_BUILD_CONTEXT, variables['Build.SourcesDirectory']) }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: CLONE_GIT_SUBMODULES
  value: ${{ coalesce(parameters.envs.CLONE_GIT_SUBMODULES, 'false') }}
- name: EXECUTE_TESTS
  value: ${{ coalesce(parameters.envs.EXECUTE_TESTS, 'false') }}
- name: SONARQUBE_WAIT_FOR_QUALITY_GATE
  value: ${{ coalesce(parameters.envs.SONARQUBE_WAIT_FOR_QUALITY_GATE, 'false') }}
- name: PUBLISH_TIMEOUT
  value: ${{ coalesce(parameters.envs.PUBLISH_TIMEOUT, '60') }}
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
