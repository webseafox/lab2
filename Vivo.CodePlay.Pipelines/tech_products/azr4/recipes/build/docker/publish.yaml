parameters:
- name: envs
  type: object
  default: {}
- name: branching_strategy
  type: string
  default: 'stb'

jobs:
- job: package
  pool: GeneralPurposeLinuxAgentsCI
  timeoutInMinutes: 120
  workspace:
    clean: all
  variables:
    # Precisa importar de novo, do contrário não funciona
    - name: SECURITY_GATE_PASSED
      value: $[ stageDependencies.gates.security.outputs['VerifySecurityGates.SECURITY_GATE_PASSED'] ]
    - name: SECURITY_JOB_RESULT
      value: $[ stageDependencies.gates.security.result ]
    - template: ./variables.yaml
      parameters:
          envs: ${{ parameters.envs }}
    - ${{ if and(or(eq(parameters.branching_strategy, 'gitlabflow'), eq(parameters.branching_strategy, 'gitlabflow-semantic')), ne(variables['Build.SourceBranchName'], '')) }}:
      - template: ./variables/${{ variables['Build.SourceBranchName'] }}.yaml
        parameters:
            envs: ${{ parameters.envs }}
  steps:
  - template: /tech_products/azr4/templates/steps/validate-sg-execution.yaml
  - checkout: self
    continueOnError: true
    persistCredentials: true
  - template: /tech_products/azr4/templates/steps/clone_submodules.yaml
    parameters:
      cloneGitSubmodules: ${{ variables['CLONE_GIT_SUBMODULES'] }}
      azureDevOpsPATToken: $(AZ_DEVOPS_PAT_TOKEN)
  - template: /tech_products/azr4/templates/steps/version_update.yaml
  - task: Docker@2
    name: login_devops
    displayName: 'Login to Docker Registry ACR-DEVOPS'
    continueOnError: true
    inputs:
      containerRegistry: ACR-DEVOPS
      displayName: 'Login to Docker Registry ${{ variables.IMAGE_REGISTRY_CONNECTION }}'
      command: 'login'
  - task: Docker@2
    name: login
    displayName: 'Login to Docker Registry'
    inputs:
      containerRegistry: ${{ variables.IMAGE_REGISTRY_CONNECTION }}
      displayName: 'Login to Docker Registry'
      command: 'login'
  # ==================================================================
  # [Compliance] Verifica se o repositório está em conformidade com as políticas de configuração
  # ==================================================================
  - task: VivoDevOpsConfigCompliance@1
    displayName: 'Check DevOps Config Compliance'
    inputs:
      workDir: ${{ variables.DOCKER_BUILD_CONTEXT }}
      policySets: |
        image-definition-files
  - task: Docker@2
    name: build
    displayName: 'Build Docker Image'
    inputs:
      containerRegistry: ${{ variables.IMAGE_REGISTRY_CONNECTION }}
      repository: ${{ variables.IMAGE_NAME }}
      displayName: 'Docker Build'
      command: 'build'
      Dockerfile: ${{ variables.DOCKERFILE_PATH }}
      tags: $(set_version.version)
      arguments: ${{ variables.DOCKER_BUILD_ARGS }}
      buildContext: ${{ variables.DOCKER_BUILD_CONTEXT }}
  - script: |
      FULL_IMAGE_NAME=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "${IMAGE_NAME}:${IMAGE_TAG}")
      echo "##[debug] FULL_IMAGE_NAME: $FULL_IMAGE_NAME"
      echo "##vso[task.setvariable variable=FULL_IMAGE_NAME;isOutput=true]${FULL_IMAGE_NAME}"
      echo "##[debug] Inspect Image"
      docker images | grep "${IMAGE_NAME}:${IMAGE_TAG}"
      docker inspect $FULL_IMAGE_NAME
    displayName: 'Extract Docker Image Name to SCA'
    name: get_image
    env:
      IMAGE_NAME: ${{ variables.IMAGE_NAME }}
      IMAGE_TAG: $(set_version.version)
  - task: Docker@2
    name: publish
    displayName: 'Publish Docker Image'
    condition: succeeded()
    inputs:
      containerRegistry: ${{ variables.IMAGE_REGISTRY_CONNECTION }}
      repository: ${{ variables.IMAGE_NAME }}
      displayName: 'Docker Publish'
      command: 'push'
      addPipelineData: true
      addBaseImageData: true
      Dockerfile: ${{ variables.DOCKERFILE_PATH }}
      tags: $(set_version.version)