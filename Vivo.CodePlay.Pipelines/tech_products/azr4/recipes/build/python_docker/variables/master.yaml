variables:
  - name: ENVIRONMENT
    value: 'prod'
  - name:  IMAGE_REGISTRY_CONNECTION
    value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION_MASTER, parameters.envs.IMAGE_REGISTRY_CONNECTION, 'registry-telefonicabigdata') }}
  - ${{ if eq( parameters.envs.GCP_CONTAINER_REGISTRY, 'true') }}:
    - ${{ if ne(parameters.envs.GCP_PROJECT_NAME_MASTER, '') }}:
      - name: GCP_PROJECT_NAME_MASTER
        value: ${{ parameters.envs.GCP_PROJECT_NAME_MASTER }}
    - name: GCP_PROJECT_NAME
      value: $(GCP_PROJECT_NAME_MASTER)
    - name: DEFAULT_REGISTRY_NAME
      value: $(GCP_PROJECT_NAME)-registry
    - name: GCP_REGISTRY_NAME
      value: ${{ coalesce(parameters.envs.GCP_REGISTRY_NAME_MASTER, variables['DEFAULT_REGISTRY_NAME']) }}
    - name: IMAGE_NAME_MASTER
      value: $(GCP_PROJECT_NAME)/$(GCP_REGISTRY_NAME)/$(Build.Repository.Name)    
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_MASTER, variables['IMAGE_NAME_MASTER']) }}
  - ${{ else }}:
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_MASTER, variables['Build.Repository.Name']) }}
  - name: DOCKER_BUILD_ARGS
    value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS_MASTER, parameters.envs.DOCKER_BUILD_ARGS, '') }}