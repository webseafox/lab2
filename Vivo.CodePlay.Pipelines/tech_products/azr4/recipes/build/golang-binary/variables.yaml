variables:
- name: PROJECT_NAME
  value: $(Build.Repository.Name)
- name: VERSION_FILE_PATH
  value: 'main.go'
# Publish Variables 
- name: NEXUS_PROTOCOL
  value: 'https'
- name: NEXUS_URL
  value: 'nexus.telefonicabigdata.com'
- name: NEXUS_GROUP_NAME
  value: '4plataforma-raw'
- name: NEXUS_GROUP_ID
  value: 'devops'
# Using group: '4p-core-default-variables'
# - name: NEXUS_USERNAME
#   value: $(NEXUS_USERNAME)
# - name: NEXUS_PASSWORD
#   value: $(NEXUS_PASSWORD)
- name: PIPELINE_TECH
  value: 'go'
- name: GO_PLATFORM_LIST
  value: 'windows/amd64,windows/386,darwin/amd64,linux/amd64'
- name: GO_PATH
  value: '$(Agent.BuildDirectory)/go'
- name: CACHE_APP_DEPENDENCIES
  value: 'true'
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
