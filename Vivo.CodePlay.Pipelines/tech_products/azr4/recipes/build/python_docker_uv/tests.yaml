jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  condition: and(succeeded(), eq(variables['TESTS_ENABLED'], 'true'))
  steps:
  # - task: UsePythonVersion@0
  #   inputs:
  #     versionSpec: $(PYTHON_VERSION)
  #   displayName: 'Use Python $(PYTHON_VERSION)'
  # ##[error]Version spec 3.12 for architecture x64 did not match any version in Agent.ToolsDirecto
  - script: |
      python -m pip install --upgrade pip
      pip install uv
      uv sync --frozen
    displayName: 'Install dependencies'
  - script: |
      uv add pytest pytest-azurepipelines coverage
      uv run pytest
      uv run coverage run -m pytest
      uv run coverage xml
    displayName: 'pytest'
        