jobs:
- job: sca
  displayName: 'Security Analysis - SCA'
  dependsOn: FortifyAnalysis  # <-- O nome exato do Job do Fortify!
  condition: succeeded()      # <-- Só corre se o Fortify tiver sucesso
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  continueOnError: false
  steps:
  - template: /tech_products/azr4/templates/steps/execute_sca.yaml
    parameters:
      scaAnalysisType: 'filesystem'