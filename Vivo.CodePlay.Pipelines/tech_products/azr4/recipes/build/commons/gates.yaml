jobs:
- job: security
  pool: GeneralPurposeLinuxAgentsCI
  continueOnError: false
  steps:
    - script: |
        echo "##[section] INTEGRAÇÃO CODEPLAY ATIVA"
        echo "O bloqueio de vulnerabilidades (Security Gate) agora ocorre nativamente de forma descentralizada durante as tasks de AppSec (SCA e SAST) via 'fail-fast'."
        echo "A verificação legada (securitygatecli) foi desativada para evitar deadlocks em receitas Docker."
        
        # Emitindo a variável de saída para garantir compatibilidade retroativa
        # Isso evita que os estágios de Publish ou Deploy sejam ignorados (skipped).
        echo "##vso[task.setvariable variable=SECURITY_GATE_PASSED;isOutput=true]true"
        echo "##vso[task.complete result=Succeeded;]"
      displayName: 'Verify Security Gates (CodePlay Native)'
      name: VerifySecurityGates