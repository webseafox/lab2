variables:
  - name: ENVIRONMENT
    value: 'hml'
  - name:  IMAGE_REGISTRY_CONNECTION
    value: ${{ coalesce(parameters.envs.IMAGE_REGISTRY_CONNECTION_HOMOLOG, parameters.envs.IMAGE_REGISTRY_CONNECTION, 'registry-telefonicabigdata') }}
  - ${{ if eq( parameters.envs.GCP_CONTAINER_REGISTRY, 'true') }}:
    - ${{ if ne(parameters.envs.GCP_PROJECT_NAME_HOMOLOG, '') }}:
      - name: GCP_PROJECT_NAME_HOMOLOG
        value: ${{ parameters.envs.GCP_PROJECT_NAME_HOMOLOG }}
    - name: GCP_PROJECT_NAME
      value: $(GCP_PROJECT_NAME_HOMOLOG)
    - name: DEFAULT_REGISTRY_NAME
      value: $(GCP_PROJECT_NAME)-registry
    - name: GCP_REGISTRY_NAME
      value: ${{ coalesce(parameters.envs.GCP_REGISTRY_NAME_HOMOLOG, variables['DEFAULT_REGISTRY_NAME']) }}
    - name: IMAGE_NAME_HOMOLOG
      value: $(GCP_PROJECT_NAME)/$(GCP_REGISTRY_NAME)/$(Build.Repository.Name)    
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_HOMOLOG, variables['IMAGE_NAME_HOMOLOG']) }}
  - ${{ else }}:
    - name: IMAGE_NAME
      value: ${{ coalesce(parameters.envs.IMAGE_NAME_HOMOLOG, parameters.envs.IMAGE_NAME, variables['Build.Repository.Name']) }}
  - name: DOCKER_BUILD_ARGS
    value: ${{ coalesce(parameters.envs.DOCKER_BUILD_ARGS_HOMOLOG, parameters.envs.DOCKER_BUILD_ARGS, '') }}
