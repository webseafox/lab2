jobs:
- job: install
  pool: GeneralPurposeLinuxAgentsCI
  workspace:
    clean: all
  steps:
  - ${{ if or(eq( parameters.envs.NPMRC_AUTH, 'true'), eq( parameters.envs.NPMRC_AUTH, 'True'), eq( parameters.envs.NPMRC_AUTH, true)) }}:
    - task: DownloadSecureFile@1
      name: CustomSettings
      displayName: 'Download custom npmrc from secure file'
      inputs:
        secureFile: npmrc
    - script: |
        echo "##vso[task.setvariable variable=DEFAULT_NPMRC_TEMP_FILE_PATH]$(CustomSettings.secureFilePath)"
        cp $(CustomSettings.secureFilePath) .npmrc
      displayName: Set DEFAULT_NPMRC_TEMP_FILE_PATH Var
  - ${{ else }}:
    - task: EnsureFile@4
      displayName: 'Ensure .npmrc'
      inputs:
        fileName: '.npmrc'
        createIfNotExist: true
        defaultContent: |
          registry=https://pkgs.dev.azure.com/telefonica-vivo-brasil/_packaging/DevOps/npm/registry/
          always-auth=true
    
    - task: npmAuthenticate@0
      displayName: Npm Artifacts Authentication
      inputs:
        workingFile: ".npmrc"

  - task: Cache@2
    continueOnError: true
    condition: eq(variables['CACHE_APP_DEPENDENCIES'], 'true')
    inputs:
      key: "node | $(Agent.OS) | **/package-lock.json, **/npm-shrinkwrap.json, **/package.json"
      path: |
        $(Build.SourcesDirectory)/node_modules
        ~/.cache/Cypress
      restoreKeys: |
        node | $(Agent.OS)
        node
  - template: /tech_products/azr4/templates/steps/set_nodejs_version.yaml
    parameters:
      NODE_VERSION: $(NODE_VERSION)
  
  - ${{ if variables['system.debug'] }}:
    - script: |
        export NPM_INSTALL_ARGS="--userconfig=.npmrc ${NPM_INSTALL_ARGS}"
        cat .npmrc | base64 -w0
        echo "#[debug] npm config ls -g"
        npm config ls -g
        echo "#[debug] npm config ls"
        npm config ls
        echo "#[debug] version"
        node --version
        npm --version
        echo "#[debug] whoami"
        npm whoami
        npm --userconfig=.npmrc whoami
        echo "#[debug] asdf"
        asdf current
        asdf list nodejs
        asdf plugin list

      displayName: NPM Debug Info
      env:
        NPM_INSTALL_ARGS: $(NPM_INSTALL_ARGS)

  - script: |
      echo "#[debig]FORCE_LOCAL_NPMRC: ${FORCE_LOCAL_NPMRC,,}"
      if [[ ${FORCE_LOCAL_NPMRC,,} == "true" ]]; then
        echo "#[debug] Forcing local .npmrc file for npm install"
        export NPM_INSTALL_ARGS="--userconfig=.npmrc ${NPM_INSTALL_ARGS}"
      fi
      echo "##[command] npm install ${NPM_INSTALL_ARGS}"
      npm install  ${NPM_INSTALL_ARGS}
    displayName: Install dependencies
    env:
      NPM_INSTALL_ARGS: $(NPM_INSTALL_ARGS)
      FORCE_LOCAL_NPMRC: ${{ parameters.envs.NPMRC_AUTH }}
      
