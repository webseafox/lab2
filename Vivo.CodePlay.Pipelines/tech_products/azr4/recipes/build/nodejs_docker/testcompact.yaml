jobs:
- job: tests
  pool: GeneralPurposeLinuxAgentsCI
  condition: and(succeeded(), eq(variables['EXECUTE_TESTS'], 'true'))
  workspace:
    clean: all
  variables:
    CI: 'true'
  steps:
  - task: Cache@2
    condition: eq(variables['CACHE_APP_DEPENDENCIES'], 'true')
    continueOnError: true
    inputs:
      key: "node | $(Agent.OS) | **/package-lock.json, **/npm-shrinkwrap.json, **/package.json"
      path: "$(Build.SourcesDirectory)/node_modules"
      restoreKeys: |
        node | $(Agent.OS)
        node
  - task: UseNode@1
    inputs:
      version: '18.x'
  - script: |
      npm run test -- --coverage
    displayName: 'Run Unit Tests'

  - script: |
      tar -cvf $(Build.Repository.Name).tar $(Build.SourcesDirectory)
    displayName: 'Create tar file for test results'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.Repository.Name).tar'
      artifactName: drop
