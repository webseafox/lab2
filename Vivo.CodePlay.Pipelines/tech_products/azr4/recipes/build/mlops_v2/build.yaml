jobs:
- job: build
  pool: GeneralPurposeLinuxAgents4P
  condition: true
  steps:
  - template: /tech_products/azr4/templates/steps/version_update.yaml
  - script: mkdir temp_result
    displayName: 'Create temp_result dir'
  - template: /tech_products/azr4/templates/steps/execute_in_docker.yaml
    parameters:
      image: 'registry.telefonicabigdata.com/ml-python:2.0.7'
      # imagem: https://git.telefonicabigdata.com/devops-commons/images-bases-4p/ml-python/-/blob/main/Dockerfile?ref_type=heads
      args: --add-host=flytealias:$(FLYTE_HOST)
      script: |
        #!/bin/bash
        set -e
        python3 -V
        export PATH=$PATH:/.local/bin:$PWD/bin:$PWD/.local/bin:/home/devops/.local/bin
        echo "##[debug] PATH: ${PATH}"
        echo "##[debug] ===== ${FLYTE_HOST}"
        ping -c 3 flytealias || true
        export CFLAGS="-std=c99"
        echo "##[debug] Install python requirements.txt"
        pip3 install xgboost
        pip3 install -r requirements.txt
        echo "##[debug] pyinstaller"
        echo "## [command] pyinstaller ${PYINSTALLER_ARGS} --onefile ${MAIN_FILE_PATH}"
        pyinstaller ${PYINSTALLER_ARGS} --onefile ${MAIN_FILE_PATH}
      envs:
        FLYTE_HOST: $(FLYTE_HOST)
        PROJECT_NAME: $(PROJECT_NAME)
        VERSION: $(set_version.VERSION)
        PYINSTALLER_ARGS: $(PYINSTALLER_ARGS)
        MAIN_FILE_PATH: $(MAIN_FILE_PATH)
  - script: |
        mkdir dist_${PROJECT_NAME}
        cp -r model/ config/ lib/ dist/* dist_${PROJECT_NAME}/   
        tar -zcvf ${TAR_FILE_PATH} ./dist_${PROJECT_NAME}/*
        ls -la
    displayName: 'Generate .tar'
    env:
      TAR_FILE_PATH: $(PROJECT_NAME)-$(set_version.VERSION).tar.gz
      PROJECT_NAME: $(PROJECT_NAME)

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(PROJECT_NAME)-$(set_version.VERSION).tar.gz
      artifact: 'ml_model'
      publishLocation: 'pipeline'