parameters:
- name: 'envs'
  type: object
  default: {}

variables:
- name: PROJECT_NAME
  value: ${{ variables['Build.Repository.Name'] }}
- name: VERSION_FILE_PATH
  value: ${{ coalesce(parameters.envs.VERSION_FILE_PATH, './VERSION') }}
- name: MAIN_FILE_PATH
  value: ${{ coalesce(parameters.envs.MAIN_FILE_PATH, 'lib/main.py') }}
- name: BIN_FILE
  value: './dist/main'
- name: SSH_USER
  value: 'svc_analyticsmlops'
- name: PYINSTALLER_ARGS
  value: ${{ coalesce(parameters.envs.PYINSTALLER_ARGS, '') }}

# SSH
- name: SSH_SERVER
  value: ${{ parameters.envs.SSH_SERVER }}
- name: SSH_PATH
  value: ${{ parameters.envs.SSH_PATH }}
- name: SSH_CREDENTIAL_ID
  value: ${{ parameters.envs.SSH_CREDENTIAL_ID }}

# Tests
- name: TESTS_ENABLED
  value: ${{ coalesce(parameters.envs.TESTS_ENABLED, 'false') }}
- name: SONAR_CONTAINER
  value: ${{ coalesce(parameters.envs.SONAR_CONTAINER, 'sonar-scanner') }}
- name: SONAR_ENABLED
  value: ${{ coalesce(parameters.envs.SONAR_ENABLED, 'false') }}

- name: NEW_FORTIFY
  value: 'true'

# Nexus
- name: NEXUS_VERSION
  value: ${{ coalesce(parameters.envs.NEXUS_VERSION, 'nexus3') }}
- name: NEXUS_PROTOCOL
  value: ${{ coalesce(parameters.envs.NEXUS_PROTOCOL, 'https') }}
- name: NEXUS_URL
  value: ${{ coalesce(parameters.envs.NEXUS_URL, 'nexus.telefonicabigdata.com') }}
- name: NEXUS_GROUP_ID
  value: ${{ coalesce(parameters.envs.NEXUS_GROUP_ID, 'br/com/vivo/advanced-analytics/models') }}
- name: NEXUS_GROUP_NAME
  value: ${{ coalesce(parameters.envs.NEXUS_GROUP_NAME, '4plataforma-raw') }}
- name: NEXUS_CREDENTIALS_ID
  value: ${{ coalesce(parameters.envs.NEXUS_CREDENTIALS_ID, 'NEXUS_CRED') }}
- name: NEXUS_SUB_ARTIFACT_ID
  value: ${{ variables['Build.Repository.Name'] }}
- name: NEXUS_CLASSIFIER
  value: ${{ coalesce(parameters.envs.NEXUS_CLASSIFIER, '') }}

- name: FLYTE_HOST
  value: '10.130.4.121'
- name: NEXT_JOB_NAME
  value: ${{ coalesce(parameters.envs.NEXT_JOB_NAME, 'deploy_score') }}
- name: SECURITY_GATE_CLI_VERSION
  value: ${{ coalesce(parameters.envs.SECURITY_GATE_CLI_VERSION, variables['SECURITY_GATE_CLI_VERSION'], '2.0.54' )}}
- name: EXECUTE_SONAR
  value: ${{ coalesce(parameters.envs.EXECUTE_SONAR, 'true') }}
