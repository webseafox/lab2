              -Dpod='$(POD)'
              -Dambiente=${{ parameters.maven.ambiente }} 
              -Dtest='$(EXECUCAO-DIARIA-QUARTA)'
        
        ${{ if eq(parameters.inputs.allScenarios, True) }}:
          ${{ if eq(parameters.inputs.dayWeek, 'BRM_Execucao_Diaria_Quinta') }}:
            maven_command: >-
              $(COMMOM-PARAMTERS-MAVEN)
              -DtipoTeste=${{ parameters.maven.testeType }}
              -Dmonitor=${{ parameters.maven.monitor }}
              -Destado='${{ parameters.inputs.estado }}'
              -Dpod=${{ parameters.inputs.pod }}
              -Dambiente=${{ parameters.maven.ambiente }} 
              -Dtest='$(EXECUCAO-DIARIA-QUINTA)'

        ${{ if eq(parameters.inputs.allScenarios, True) }}:
          ${{ if eq(parameters.inputs.dayWeek, 'BRM_Execucao_Diaria_Sexta') }}:
            maven_command: >-
              $(COMMOM-PARAMTERS-MAVEN)
              -DtipoTeste=${{ parameters.maven.testeType }}
              -Dmonitor=${{ parameters.maven.monitor }}
