parameters:
  - name: description
    displayName: "Descrição do cenário"
    type: string
    default: "Execução cenário"

  - name: docker_image
    displayName: "Tecnologia utilizada no cenário"
    type: string
    default: selenium
    values:
      - selenium

  - name: branch
    type: string
    default: master

  - name: update_alm_tool
    displayName: "Atualizar ou não o Octane?"
    type: boolean
    default: False

  - name: scenariosType
    type: string
    default: ""

  - name: suit
    type: string
    default: ""

  - name: inputs
    type: object

  - name: maven
    type: object

  - name: general
    type: object
    default: "{}"

variables:
  - template: /tech_products/automation-b2b/provisioners/trunkbased/java/scenarios_default/variables/load.yml
  - name: COMMOM-PARAMTERS-MAVEN
    value: "clean ${{ parameters.maven.command }} -f ${{ parameters.maven.pathFilePom }} -s ${{ parameters.maven.pathFileSettings }} -Djava.awt.headless=true -Doracle.jdbc.timezoneAsRegion=false -Dmaven.repo.local=${{ parameters.maven.repoLocal }} -Dremote-server=${{ parameters.maven.remoteServer }} -DtipoTeste=${{ parameters.maven.testeType }} -Dmonitor=${{ parameters.maven.monitor }}"
  # -X Debug -U força o Maven a atualizar as dependências antes de executar o build

stages:

  #- stage: 'Preparacao'
  #  jobs:
  #  - job: Preparacao
  #    displayName: "Preparação"
  #    timeoutInMinutes: 180
  #    cancelTimeoutInMinutes: 3

  - template: /tech_products/automation-b2b/provisioners/trunkbased/java/scenarios_default/stages/scenarios_exec.yml
    parameters:
      scenariosType: "${{ parameters.scenariosType }}"
      description: "${{ parameters.description }}"
      docker_image: "{{ parameters.docker_image }}"
      
      #############################
      ############ E2E ############
      ############################# 
      ${{ if eq(parameters.scenariosType, 'e2e') }}:
        maven_command: >-
          $(COMMOM-PARAMTERS-MAVEN)
          -Dambiente=${{ parameters.maven.ambiente }}
          -Dpod=${{ parameters.inputs.pod }}
          -Dtest=${{ parameters.inputs.test }}
          -Dcnpj=${{parameters.inputs.cnpj}} 

      #############################
      ############ BRM ############
      ############################# 
      ${{ if eq(parameters.scenariosType, 'brm') }}:
        ${{ if eq(parameters.inputs.allScenarios, False) }}:
          maven_command: >-
            $(COMMOM-PARAMTERS-MAVEN)
            -DtipoTeste=${{ parameters.maven.testeType }}
            -Dmonitor=${{ parameters.maven.monitor }}
            -Dambiente=${{ parameters.maven.ambiente }}
            -Destado='${{ parameters.inputs.estado }}'
            -Dpod=${{ parameters.inputs.pod }}
            -Dtest=${{ parameters.inputs.test }}
            -Ddata_de_criacao_cliente=${{parameters.inputs.data_de_criacao_cliente}} 
            -Ddata_de_compra_produto=${{parameters.inputs.data_de_compra_produto}} 
            -Dqnt_licenca_ramal=${{parameters.inputs.qnt_licenca_ramal}} 
            -Dvalor_licenca_ramal=${{parameters.inputs.valor_licenca_ramal}}
            -Dconta_pai=${{parameters.inputs.conta_pai}} 
            -Dconta_filha=${{parameters.inputs.conta_filha}} 
            -Dbill_no_pp=${{parameters.inputs.bill_no_pp}} 
            -Dinvoice_obj=${{parameters.inputs.invoice_obj}} 
            -Dbill_info=${{parameters.inputs.bill_info}}
        #              -Dalm_test_root_path="RL08 - 18/08/2024"

        #############################
        ####### BRM REGRESSÃO #######
        ######### PRÉ PROD ##########
        #############################

        ${{ if eq(parameters.inputs.allScenarios, True) }}:
          ${{ if eq(parameters.inputs.dayWeek, 'BRM_Regressao') }}:
            maven_command: >-
              $(COMMOM-PARAMTERS-MAVEN)
              -DtipoTeste=${{ parameters.maven.testeType }}
              -Dmonitor=${{ parameters.maven.monitor }}
              -Destado='${{ parameters.inputs.estado }}'
              -Dpod=${{ parameters.inputs.pod }}
              -Dambiente=${{ parameters.maven.ambiente }} 
              -Dtest='$(BRM-REGRESSAO)'

        #############################
        ### BRM EXECUÇÕES DIARIAS ###
        ######### PRÉ PROD ##########
        #############################

        ${{ if eq(parameters.inputs.allScenarios, True) }}:
          ${{ if eq(parameters.inputs.dayWeek, 'BRM_Execucao_Diaria_Segunda') }}:
            maven_command: >-
              $(COMMOM-PARAMTERS-MAVEN)
              -DtipoTeste=${{ parameters.maven.testeType }}
              -Dmonitor=${{ parameters.maven.monitor }}
              -Destado='${{ parameters.inputs.estado }}'
              -Dpod=${{ parameters.inputs.pod }}
              -Dambiente=${{ parameters.maven.ambiente }} 
              -Dtest='$(EXECUCAO-DIARIA-SEGUNDA)'

        ${{ if eq(parameters.inputs.allScenarios, True) }}:
          ${{ if eq(parameters.inputs.dayWeek, 'BRM_Execucao_Diaria_Terca') }}:
            maven_command: >-
              $(COMMOM-PARAMTERS-MAVEN)
              -DtipoTeste=${{ parameters.maven.testeType }}
              -Dmonitor=${{ parameters.maven.monitor }}
