variables:

# agents
- name: PRIVATE_AGENT_DEFAULT
  value: DefaultDevopsAgents

# CACORP CERTIFICATE
- name: CACORP_LOCATION
  value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"

# checkmarx
- name: USE_CHECKMARX
  value: 'false'
- name: CHECKMARX_TENANT
  value: 'vivo'
- name: CHECKMARX_APP_DEFAULT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: CHECKMARX_IGNORE_SECURITY_GATE
  value: $[and(
            not(in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/production')),
            not(and(
              eq(variables['Build.Reason'], 'PullRequest'),
              in(variables['System.PullRequest.TargetBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/production')
            ))
          )]

# conviso
- name: CONVISO_APP_ENDPOINT
  value: "https://app.conviso.com.br"
- name: CONVISO_COMPANY_ID
  value: "430"
- name: CONVISO_GRAPHQL_ENDPOINT
  value: "https://app.convisoappsec.com/graphql"
- name: SKIP_CONVISO_SECURITY_GATE
  value: 'true'
- name: CONVISO-API-KEY
  value: ""

# fortfy
- name: FORTIFY_SSC_ENDPOINT
  value: "https://ssc-fortify.redecorp.br/ssc/"
- name: FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT
  value: "https://scancentral-sast.redecorp.br/scancentral-ctrl"
- name: FORTIFY_APP_DEFAULT_NAME
  value: "$(System.TeamProject)-$(Build.Repository.Name)"
- name: FORTIFY_APP_DEFAULT_VERSION
  value: "DevSecOps"
- name: FORTIFY_EXCLUSION_FILE
  value: "sast_fortify_exclude_files.json"
- name: FORTIFY_REPOSITORY_TECH
  value: ""
- name: FORTIFY_LOCAL_SCANCENTRAL_VERSION
  value: "22.1.0"
- name: FORTIFY_LOCAL_SCANCENTRAL_PATH
  value: "/devops/fortify/scancentral/"
- name: FORTIFY_LOCAL_SCANCENTRAL_SCRIPT
  value: "/bin/scancentral"
- name: FORTIFY-SSC-CLI-TOKEN
  value: ""  

# AKV DevOps
- name: AKV_DEVOPS_NAME
  value: "kv-azdevops-shared"

# proxy
- name: PROXY_SQUID_SERVER
  value: "10.240.58.39:3128" # proxy Squid para evitar erros de timeout do proxy NetSkope.
- name: PROXY_NSKP_SERVER
  value: "nskp.redecorp.br:8080"
- name: PROXY_AGENT_HTTP
  value: "http://$(PROXY_SQUID_SERVER)"
- name: PROXY_AGENT_HTTPS
  value: "http://$(PROXY_SQUID_SERVER)"
- name: PROXY_AGENT_NO_PROXY
  value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
- name: PROXY_ADDL_NO_PROXY
  value: ""

# sonar
- name: SONARQUBE_URL
  value: "http://sonar.devops.redecorp.br"
- name: SONARQUBE_DEFAULT_QUALITYGATE
  value: "AzureDevOps-Default"
- name: SONARQUBE_PROJECT_QUALITYGATE
  value: ""
- name: SONAR_SCANNER_TEMP_CACHE
  value: "$(Agent.HomeDirectory)/.sonar"
- name: PUBLISH_TEST_RESULT_FORMAT
  value: JUnit
- name: PUBLISH_TEST_RESULT_FILES
  value: target/site/jacoco/jacoco.xml
- name: PUBLISH_TEST_HTML_REPORT
  value: target/site/jacoco/index.html
- name: PUBLISH_TEST_COVERAGE_TOOL
  value: jacoco
- name: PUBLISH_TEST_COVERAGE_PATH_TO_SOURCES
  value: target
- name: SONARQUBE_SERVICE_CONNECTION_NAME
  value: VIVO_SONARQUBE
- name: SONARQUBE_CONFIG_FILE
  value: "$(DEFAULT_WORKDIR_ARTIFACTS)/.azuredevops/sonar-project.properties"
- name: SONAR_PROJECT_KEY
  value: ""
- name: REPORT_TASK_NAME
  value: "report-task.txt"
  
# workflow
- name: flowIsMain
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')]
- name: flowIsTriggerCI
  value: $[in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')]
- name: flowIsManual
  value: $[eq(variables['Build.Reason'], 'Manual')]
- name: flowIsPullRequest
  value: $[eq(variables['Build.Reason'],'PullRequest')]
- name: flowIsTagging
  value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
- name: flowIsToReview
  value: $[or( eq(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))]
- name: flowIsTobuildAndRegistry
  value: $[in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/release', 'refs/heads/develop')]
- name: flowIsToDeploy
  value: $[or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master', 'refs/heads/release',  'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/develop/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/main/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/master/'), startsWith(variables['Build.SourceBranch'], 'refs/tags/develop'),startsWith(variables['Build.SourceBranch'], 'refs/tags/release'),startsWith(variables['Build.SourceBranch'], 'refs/tags/production'))]
- name: flowSkipSecurity
  value: $[and( eq(variables['SKIP_SECURITY'], 'false'), in( variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main', 'refs/heads/release'))]

# APP CONFIGURATION VARIABLES
- name: APP_CONFIGURATION_ENABLED
  value: "true"
- name: APP_CONFIGURATION_AZURE_SUBSCRIPTION
  value: "DevOpsSharedResources"
- name: APP_CONFIGURATIN_ENDPOINT
  value: 'https://appcs-azdevops-shared.azconfig.io'

#BUMP VERSION
- name: BUMP_VERSION_ENABLED
  value: 'true'

# Governance App
- name: GOVAPP_INTEGRATION_ENABLED
  value: "false"
- name: GOVAPP_SERVICE_CONNECTION_NAME
  value: "governanceapi"

- group: "azdo-team-project-variables"

- group: "azdo-weblogic-v12.2.1"

- group: "azdo-java-v8"

- group: "azdo-maven-v3.9.6"