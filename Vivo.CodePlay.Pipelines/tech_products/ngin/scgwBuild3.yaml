parameters:
  - name: deploy_scgw_app
    type: boolean
    default: false
  - name: deploy_scgw_tools
    type: boolean
    default: false
  - name: deploy_scgw_sync
    type: boolean
    default: false
  - name: deploy_scgw_cdr
    type: boolean
    default: false
  - name: deploy_scgw_rrp
    type: boolean
    default: false  
  - name: qa_environment
    type: string  
  - name: components_to_install
    type: string    

variables:
  - template: /tech_products/ngin/initialize/variables_global_scgw.yml
  - template: /tech_products/ngin/initialize/variables_weblogic_osgi.yml
  - template: /.azuredevops/config/${{ parameters.qa_environment }}/environments_variables.yml@self
  - group: "${{ variables['Build.DefinitionName'] }}"

resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CodePlay
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git
      ref: refs/tags/latest
      endpoint: CorePipelines     

stages:
  - stage: build_test
    jobs:
      - job: build_test
        displayName: 'Build Job'
        pool: VivoAzureCloudSharedAgents
          #mImage: 'ubuntu-latest'
          #name: 'VivoAzureCloudSharedAgents'
        variables:
          MAVEN_OPTS: '-Xmx3072m'
          MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository

        steps:
          - task: JavaToolInstaller@0
            displayName: 'Use Java 17'
            inputs:
              versionSpec: 17
              jdkArchitectureOption: x64
              jdkSourceOption: 'PreInstalled'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Artifacts from Previous Build'
            inputs:
              buildType: 'specific'
              project: 'SMRC - SMART CGW'
              pipeline: 'alarm-monitor-libs'
              runVersion: 'latest'
              artifact: 'eisa'
              targetPath: '$(Pipeline.Workspace)/maven-repo'

          - script: |
              echo "Using downloaded artifacts..."
              mkdir -p ~/.m2/repository/br/com/eisa
              cp -r $(Pipeline.Workspace)/maven-repo/* ~/.m2/repository/br/com/eisa/
              echo "Contents of ~/.m2/repository/br:"
              ls -laR ~/.m2/repository/br
            displayName: 'Copy Artifacts to Local Maven Repository'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              options: '-B -e -X -DskipTests'
              goals: 'clean install'

          - script: |
              echo "Build directory: $(Build.SourcesDirectory)"
              echo "Staging directory: $(Build.ArtifactStagingDirectory)"
              echo "Copying JARs and POMs from Maven local repository to staging directory..."
              mkdir -p $(Build.ArtifactStagingDirectory)
              cp -r ~/.m2/repository/br/com/eisa/smarts/* $(Build.ArtifactStagingDirectory)/
              ls -la $(Build.ArtifactStagingDirectory)
            displayName: 'Copy Maven Local Repository to Staging Directory'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'jar'
  
  ## -> Gates for CI - Weblogic
  - template: /tech_products/ngin/templates/ci/ci_gates_scgw.yml
    parameters:
      qa_environment: ${{ parameters.qa_environment }}

  ## -> Security for CI - Weblogic
  - template: /tech_products/ngin/templates/ci/ci_security_weblogic_osgi.yml
    parameters:
      fortifyExclusionRepository: FortifyExclusion
  
  - stage: Deploy
    jobs:
      - job: PreDeploymentChecks
        displayName: 'PreDeployment Checks'
        pool: VivoAzureCloudSharedAgents
          #vmImage: 'ubuntu-latest'
          #name: 'VivoAzureCloudSharedAgents'
        steps:
          - script: echo "Running pre-deployment checks..."
            displayName: 'Run PreDeployment Checks'

      - job: Deploy
        displayName: 'Deploy Job'
        ##dependsOn: build_test
        pool: VivoAzureCloudSharedAgents
          #vmImage: 'ubuntu-latest'
          #name: 'VivoAzureCloudSharedAgents'
        condition: succeeded()
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'maven-artifact'
              targetPath: '$(Pipeline.Workspace)/maven-artifact'

          - ${{ if eq(parameters.deploy_scgw_app, true) }}:
            - template: copyDeployTemplate.yaml
              parameters:
                displayName: 'Copy for scgw-app'
                sshEndpoint: 'scgwQA41'
                sourceFolder: '$(Pipeline.Workspace)/maven-artifact/scgw/package/scgw-app-rpm/1.2.9-SNAPSHOT/'
                contents: 'scgw-app-rpm-1.2.9-SNAPSHOT-rpm.rpm'
                targetFolder: '/tmp/oms'
                service_name: 'scgw-app'

          - ${{ if eq(parameters.deploy_scgw_tools, true) }}:
            - template: copyDeployTemplate.yaml
              parameters:
                displayName: 'Copy for scgw-tools'
                sshEndpoint: 'scgwQA41'
                sourceFolder: '$(Pipeline.Workspace)/maven-artifact/scgw/package/scgw-tools-rpm/1.2.9-SNAPSHOT/'
                contents: 'scgw-tools-rpm-1.2.9-SNAPSHOT-rpm.rpm'
                targetFolder: '/tmp/oms'
                service_name: 'scgw-tools'

          - ${{ if eq(parameters.deploy_scgw_sync, true) }}:
            - template: copyDeployTemplate.yaml
              parameters:
                displayName: 'Copy for scgw-sync'
                sshEndpoint: 'scgwQA41'
                sourceFolder: '$(Pipeline.Workspace)/maven-artifact/scgw/package/scgw-sync-rpm/1.2.9-SNAPSHOT/'
                contents: 'scgw-sync-rpm-1.2.9-SNAPSHOT-rpm.rpm'
                targetFolder: '/tmp/oms'
                service_name: 'scgw-sync'

          - ${{ if eq(parameters.deploy_scgw_cdr, true) }}:
            - template: copyDeployTemplate.yaml
              parameters:
                displayName: 'Copy for scgw-cdr'
                sshEndpoint: 'scgwQA41'
                sourceFolder: '$(Pipeline.Workspace)/maven-artifact/scgw/package/scgw-cdr-rpm/1.2.9-SNAPSHOT/'
                contents: 'scgw-cdr-rpm-1.2.9-SNAPSHOT-rpm.rpm'
                targetFolder: '/tmp/oms'
                service_name: 'scgw-cdr'

          - ${{ if eq(parameters.deploy_scgw_rrp, true) }}:
            - template: copyDeployTemplate.yaml
              parameters:
                displayName: 'Copy for scgw-rrp'
                sshEndpoint: 'scgwQA41'
                sourceFolder: '$(Pipeline.Workspace)/maven-artifact/scgw/package/scgw-rrp-rpm/1.2.9-SNAPSHOT/'
                contents: 'scgw-rrp-rpm-1.2.9-SNAPSHOT-rpm.rpm'
                targetFolder: '/tmp/oms'
                service_name: 'scgw-rrp'
