parameters:
- name: environmentName
  type: string
  default: 'development'
- name: artifactPath
  type: string
  default: '$(Pipeline.Workspace)/maven-artifact'

jobs:
- job: DeployTo$(environmentName)
  displayName: 'Deploy to $(environmentName)'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: CopyFiles@2
    displayName: 'Copy Artifact to Target Environment'
    inputs:
      SourceFolder: '$(artifactPath)'
      Contents: '**'
      TargetFolder: '/target/path/in/your/environment'
