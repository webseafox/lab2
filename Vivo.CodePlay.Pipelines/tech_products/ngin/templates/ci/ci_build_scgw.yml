stages:
- stage: build_test
  displayName: "Build & Test"
  dependsOn:
  - pipeline_init
  pool: $(PRIVATE_AGENT_DEFAULT)
  jobs:
  - job: bump_version
    displayName: Bumping Version
    condition: and(succeeded(), eq(variables.flowIsTagging, false))
    steps:
    - checkout: self
      persistCredentials: "true"
      clean: true

    - bash: |
        version=$(grep version pom.xml | grep -v '<?xml' | grep '<version>'|head -n 1|awk '{print $1}'| cut -d'>' -f 2 | cut -d'<' -f 1)
        echo "##vso[task.setvariable variable=APP_CURRENT_VERSION]$version"
        echo "##[debug] Exporting variable 'APP_CURRENT_VERSION': $version"
      name: export_current_version
      displayName: Extract App Version     

    - task: semver-bump@1
      displayName: Bump Version
      condition:  or(
                    and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'IndividualCI')), 
                    and(succeeded(), eq(variables.BUMP_VERSION_ENABLED, 'true'), eq(variables['Build.Reason'], 'BatchedCI'))
                  )
      inputs:
        VersionVariable: 'APP_CURRENT_VERSION'
        IncrementLevel: 'patch' 

    - bash: |
        echo "##vso[task.setvariable variable=${NEW_VERSION_OUT};isOutput=true]${NEW_VERSION}"
        echo "##[debug] Exporting variable '${NEW_VERSION_OUT}': ${NEW_VERSION}"
      displayName: 'Defining New Component Version'
      name: component_bump_version
      env:
        NEW_VERSION: $(APP_CURRENT_VERSION)
        NEW_VERSION_OUT: "APP_NEW_VERSION"

  - job: build_app
    displayName: Build & Test   
    dependsOn:
      - bump_version
    condition: and(succeeded(), eq(variables.flowIsTagging, false))
    variables:
    - name: APP_NEW_VERSION 
      value: $[ dependencies.bump_version.outputs['component_bump_version.APP_NEW_VERSION'] ]
    steps:
    ## SETUP
    - task: MavenAuthenticate@0
      displayName: 'Maven Authenticate'
      inputs:
        artifactsFeeds: DevOps

    - task: Cache@2
      displayName: Cache Maven local repo
      inputs:
        key: 'maven | "$(Agent.OS)"'
        path: '$(MAVEN_CACHE_FOLDER)'
        cacheHitVar: 'CacheRestored'
        restoreKeys: |
          maven | "$(Agent.OS)"
          maven

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW'

    - task: ReplaceTokens@3
      displayName: 'Configuring Settings.xml'
      inputs:
        rootDirectory: '$(system.defaultWorkingDirectory)'
        targetFiles: 'settings.xml'
        tokenPattern: azpipelines
        tokenPrefix: '#{'
        tokenSuffix: '}#'         

    - task: DownloadPackage@1
      displayName: 'Download Oracle JDK-17'
      inputs:
        packageType: 'upack'
        feed: '/3d53bc62-8749-4931-ae46-a443b73bc87a'
        view: 'da88d2ff-67d7-44d6-a91b-cc4bffa5fa70'
        definition: '017f4968-da6d-4cf4-b1db-b4a4499604a7'
        version: '17.0.3'
        downloadPath: '$(System.ArtifactsDirectory)'
      env:
         HTTPS_PROXY: "http://10.240.58.39:3128"

    - task: ExtractFiles@1
      displayName: 'Extract Oracle JDK'
      inputs:
        archiveFilePatterns: '$(System.ArtifactsDirectory)/*.zip'  # Adjust this path to the downloaded JDK file
        destinationFolder: '$(System.ArtifactsDirectory)/jdk'
        cleanDestinationFolder: false

    - bash: |
        export JAVA_HOME=$(System.ArtifactsDirectory)/jdk
        export PATH=$JAVA_HOME/bin:$PATH
        echo "JAVA_HOME is set to $JAVA_HOME"
        echo "PATH is set to $PATH"
        echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_HOME"
        echo "##vso[task.setvariable variable=PATH]$PATH"
      displayName: 'Set JAVA_HOME and Update PATH'

    - script: |
        echo "JAVA_HOME is $JAVA_HOME"
        echo "PATH is $PATH"
        mvn -version
      displayName: 'Verify JAVA_HOME and Maven'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Artifacts from Previous Build'
      inputs:
        buildType: 'specific'
        project: 'SMRC - SMART CGW'
        pipeline: 'alarm-monitor-libs'
        runVersion: 'latest'
        artifact: 'eisa'
        targetPath: '$(Pipeline.Workspace)/maven-repo'

    - script: |
          echo "Using downloaded artifacts..."
          mkdir -p ~/.m2/repository/br/com/eisa
          cp -r $(Pipeline.Workspace)/maven-repo/* ~/.m2/repository/br/com/eisa/
          echo "Contents of ~/.m2/repository/br:"
          ls -laR ~/.m2/repository/br
        

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        options: '-B -e -X -DskipTests'
        goals: 'clean install'

    - script: |
        echo "Build directory: $(Build.SourcesDirectory)"
        echo "Staging directory: $(Build.ArtifactStagingDirectory)"
        echo "Copying JARs and POMs from Maven local repository to staging directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)
        cp -r ~/.m2/repository/br/com/eisa/smarts/* $(Build.ArtifactStagingDirectory)/
        ls -la $(Build.ArtifactStagingDirectory)
      displayName: 'Copy Maven Local Repository to Staging Directory'    

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'maven-artifact'

    - task: CopyFiles@2
      displayName: Copy Files Staging Directory
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        Contents: |
          **/*
          !.git/**/*
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishBuildArtifacts@1
      displayName: Publish Build Artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: app
        StoreAsTar: true    

    - task: CopyFiles@2
      displayName: Copy Bundles Files Staging Directory
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        Contents: |
          **/*.jar
          !$HOME/**/*        
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: true

    - task: PublishBuildArtifacts@1
      displayName: Publish Bundles Artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: bundles
        StoreAsTar: true
