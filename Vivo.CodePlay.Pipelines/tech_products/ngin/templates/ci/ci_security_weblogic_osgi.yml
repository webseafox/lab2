        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"
        FORTIFY_ATTRIBUTES_FILE_NAME: "fortify-attributes"

    - task: Bash@3
      displayName: "Run Fortify SAST (client)"
      inputs:
        targetType: 'inline'
        script: |
          echo "##[debug]Running Fortify scan with local ScanCentral Client version ${FORTIFY_LOCAL_SCANCENTRAL_VERSION}..."

          SCANCENTRAL_CMD=${FORTIFY_SCANCENTRAL_PATH}${FORTIFY_LOCAL_SCANCENTRAL_VERSION}${FORTIFY_LOCAL_SCANCENTRAL_SCRIPT}

          echo "##[command]${SCANCENTRAL_CMD}"
          echo "##[debug]FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT...: ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT}"
          echo "##[debug]FORTIFY_SSC_ENDPOINT......................: ${FORTIFY_SSC_ENDPOINT}"
          echo "##[debug]EXCLUDE_FILE_PARAM........................: $(EXCLUDE_FILE_PARAM)"
          echo "##[debug]FORTIFY_APP_NAME..........................: ${FORTIFY_APP_NAME}"
          echo "##[debug]FORTIFY_APP_VERSION.......................: ${FORTIFY_APP_VERSION}"

          ${SCANCENTRAL_CMD} -url ${FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT} -sscurl ${FORTIFY_SSC_ENDPOINT} \
          -ssctoken ${FORTIFY_SSC_CLI_TOKEN} \
          -debug start $(EXCLUDE_FILE_PARAM) -bt none -upload -block \
          --log-file "${FORTIFY_APP_NAME}-${SYSTEM_JOBATTEMPT}-fortify.log" --overwrite \
          --application "${FORTIFY_APP_NAME}" --application-version "${FORTIFY_APP_VERSION}" \
          -uptoken ${FORTIFY_SSC_CLI_TOKEN}

          if [ $? -eq 0 ]; then
            echo "##[debug]Fortify scan completed successfully."
          else
            echo "##vso[task.logissue type=error;] Fortify scan exited with errors."
            echo "##vso[task.complete result=Failed;]"
          fi
      env:
        FORTIFY_SCANCENTRAL_PATH: "$(FORTIFY_LOCAL_SCANCENTRAL_PATH)"
        FORTIFY_LOCAL_SCANCENTRAL_VERSION: "$(FORTIFY_LOCAL_SCANCENTRAL_VERSION)"
        FORTIFY_LOCAL_SCANCENTRAL_SCRIPT: "$(FORTIFY_LOCAL_SCANCENTRAL_SCRIPT)"
        FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT: "$(FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT)"
        FORTIFY_SSC_ENDPOINT: $(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
        FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
        SYSTEM_JOBATTEMPT: "$(System.JobAttempt)"
        ASDF_JAVA_VERSION: "openjdk-11.0.2"

    - task: PublishPipelineArtifact@1
      displayName: "Publish scan log"
      inputs:
        targetPath: "$(FORTIFY_APP_DEFAULT_NAME)-$(System.JobAttempt)-fortify.log"
        artifactName: "fortify-$(System.JobAttempt)"
        publishLocation: pipeline

    - task: Bash@3
      displayName: "Get Fortify Report"
      inputs:
        targetType: 'inline'
        script: |
          i="0"
          retries="10"
          FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

          echo "##[debug] Waiting for FORTIFY report to process..."

          while [[ $i -lt $retries ]]
          do
            sleep 30s
            RESPONSE_ARTIFACT=$(curl --cacert ${CACORP_LOCATION} -s -g \
            -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/artifacts?limit=1" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: FortifyToken $FORTIFY_TOKEN")

            STATUS=$(echo $RESPONSE_ARTIFACT | jq -r .data[0].status)
            echo "##[debug] Process status: $status"

            if [[ "$STATUS" == "REQUIRE_AUTH" ]]
            then
                echo "##vso[task.logissue type=error] Existe uma aprovação pendente no portal do Fortify. Para dar proseguimento com a aprovação entre em contato com o AppSec pelo e-mail(appsec_vivo.br@telefonica.com)"
                exit 1;
            elif [[ "$STATUS" == "PROCESS_COMPLETE" ]]
            then
                echo "##[debug] Process complete!"
                break
            fi
            i=$[$i+1]
          done

          echo "##[debug] Get result report for FORTIFY"
          
          RESPONSE_ISSUES=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions/${FORTIFY_PROJECT_VERSION_ID}/issues?orderby=id" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          ISSUES_COUNT=$(echo $RESPONSE_ISSUES | jq --raw-output '.data | group_by(.enginePriority) | map({"prioridade": .[0].enginePriority, "count": length})')

          critical=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Critical") | .count' || echo "0")
          high=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "High") | .count' || echo "0")
          medium=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Medium") | .count' || echo "0")
          low=$(echo $ISSUES_COUNT | jq '.[] | select(.prioridade == "Low") | .count' || echo "0")
          critical=$([[ -n $critical ]] && echo $critical || echo 0)
          high=$([[ -n $high ]] && echo $high || echo 0)
          medium=$([[ -n $medium ]] && echo $medium || echo 0)
          low=$([[ -n $low ]] && echo $low || echo 0)

          echo ""
          echo "##[section] ## All issues found ##"

          echo "##[error]     CRITICAL............: $critical"
          echo "##[error]     HIGH................: $high"
          echo "##[warning]   Medium..............: $medium"
          echo "##[debug]     Low.................: $low"
          echo ""

          echo "##[section] ## List of all issues ##"

          echo $RESPONSE_ISSUES | jq -r '.data[] | "[" + .enginePriority + "]" + .primaryLocation + ":" + (.lineNumber|tostring) + " - " + .issueName'

          echo "##vso[task.setvariable variable=CRITICAL_VULNERABILITIES;isreadonly=true]$critical"
          echo "##vso[task.setvariable variable=HIGH_VULNERABILITIES;isreadonly=true]$high"
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_VERSION: "$(FORTIFY_APP_VERSION)"
        FORTIFY_PROJECT_VERSION_ID: "$(FORTIFY_PROJECT_VERSION_ID)"

    - task: Bash@3
      displayName: "Evaluate Security Gate"
      condition: and(
                      succeeded(),
                      ne(variables.USE_CONVISO, 'true')
                    )
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          if [[ ! "$(SKIP_SECURITY_GATE)" =~ ^(T|t)rue$ ]]; then
          
            ## -> Analyze Security Gate data
            declare -i critical=$(CRITICAL_VULNERABILITIES)
            declare -i high=$(HIGH_VULNERABILITIES)
            
            if [[ $critical -gt 0 || $high -gt 0 ]]; then
              echo "##[error] Security Gate was not reached due to the existence of Critical and/or High vulnerabilities!"
              echo "##vso[task.logissue type=error;] O Security Gate failed!"
              echo "##vso[task.complete result=Failed;]"
              exit
            else 
              echo "##[debug] Security Gate has been reached!"
            fi

          else
            echo "##vso[task.logissue type=warning;] Security Gate is OFF and Gate validation has been skipped! "
            echo "##[warning] Even if the Security Gate is turned off at the moment this does not mean that it cannot be turned on again in the near future. "
            echo "##[warning] Please analyze the Critical and High vulnerabilities and try to fix them as soon as possible. "            
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi

  ## -> Conviso Sync
  - job: conviso_sync
    dependsOn:
    - fortify_scan
    - app_config_keys
    variables: 
      USE_CONVISO: $[ dependencies.app_config_keys.outputs['evaluate_flags.USE_CONVISO'] ]
      SKIP_SECURITY_GATE: $[ dependencies.app_config_keys.outputs['evaluate_flags.SKIP_SECURITY_GATE'] ]
    condition: and(
                succeeded(),
                eq(variables.USE_CONVISO, 'true'),
                ne(variables.skip_conviso, true)
              )
    displayName: "Conviso Sync"
    steps:
    - task: AzureKeyVault@2
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, CONVISO-API-KEY'
      condition: and(eq(variables['FORTIFY-SSC-CLI-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''))

    - task: AzureAppConfiguration@6
      displayName: 'Download configuration keys'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: "$(APP_CONFIGURATION_AZURE_SUBSCRIPTION)"
        AppConfigurationEndpoint: "$(APP_CONFIGURATIN_ENDPOINT)"
        KeyFilter: "RT_CONVISO_NEW_INTEGRATION"
        Label: 'VIVO-CORE-PIPELINES'
      condition: eq(variables['RT_CONVISO_NEW_INTEGRATION'], '')
      env:
        HTTPS_PROXY: $(PROXY_AGENT_HTTPS)
        HTTP_PROXY: $(PROXY_AGENT_HTTP)
        NO_PROXY: $(PROXY_AGENT_NO_PROXY)

    # Busca o ID do projeto no FORTIFY
    - bash: |
          FORTIFY_APP_DEFAULT_NAME="${FORTIFY_APP_DEFAULT_NAME// /%20}"
          FORTIFY_TOKEN=$(echo -n ${FORTIFY_SSC_CLI_TOKEN} | base64)

          REQUEST_QUERY="project.name:${FORTIFY_APP_DEFAULT_NAME},name:${FORTIFY_APP_DEFAULT_VERSION}"
          REQUEST_PARAMS="fields=id&start=0&limit=200&fulltextsearch=false&includeInactive=false&myAssignedIssues=false&onlyIfHasIssues=false&q=$REQUEST_QUERY"
          
          RESPONSE=$(curl --cacert ${CACORP_LOCATION} -s -g \
          -X GET "${FORTIFY_SSC_ENDPOINT}api/v1/projectVersions?${REQUEST_PARAMS}" \
          --header 'Accept: application/json' \
          --header "Authorization: FortifyToken $FORTIFY_TOKEN")

          PROJECT_ID=$(echo $RESPONSE | jq .data[0].id)

          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_ID]$PROJECT_ID"
          echo "##[debug] Set Fortify Project ID '${PROJECT_ID}' to 'FORTIFY_PROJECT_ID'."
      env:
        CACORP_LOCATION: "$(CACORP_LOCATION)"
        FORTIFY_SSC_CLI_TOKEN: "$(FORTIFY-SSC-CLI-TOKEN)"
        FORTIFY_APP_DEFAULT_NAME: "$(FORTIFY_APP_DEFAULT_NAME)"
        FORTIFY_APP_DEFAULT_VERSION: "$(FORTIFY_APP_DEFAULT_VERSION)"
        FORTIFY_SSC_ENDPOINT: "$(FORTIFY_SSC_ENDPOINT)"
      displayName: "Getting Fortify Project ID"

      #Associa projeto no conviso
    - bash: |
          sleep 5s
          RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/associate_project" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data '{"company_id": '${CONVISO_COMPANY_ID}',"project_id": "'${FORTIFY_PROJECT_ID}'"}')

          ASSOCIATION_ID=$(echo $RESPONSE | jq .data.id)
          PROJECT_ID=$(echo $RESPONSE | jq .data.project.id)
          
          ERROR=$(echo $RESPONSE | jq '.error.status_type // empty')
          if [[ ! -z "$ERROR" ]]; then
            MESSAGE=$(echo $RESPONSE | jq '.error.details // empty')
            echo "##vso[task.logissue type=error;] An error occurred while requesting Conviso API. ${ERROR} - ${MESSAGE}"
            echo "##vso[task.complete result=Failed;]"
            exit
          fi
          
          echo "##vso[task.setvariable variable=${CONVISO_PROJECT_ID_OUT}]$PROJECT_ID"
          echo "##[debug]Set Conviso Project ID '${PROJECT_ID}' to '${CONVISO_PROJECT_ID_OUT}'."
          
          echo "##vso[task.setvariable variable=${CONVISO_ASSOCIATION_ID_OUT}]$ASSOCIATION_ID"
          echo "##[debug]Set Fortify Conviso Association ID '${ASSOCIATION_ID}' to '${CONVISO_ASSOCIATION_ID_OUT}'."
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        FORTIFY_PROJECT_ID: "$(FORTIFY_PROJECT_ID)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        CONVISO_PROJECT_ID_OUT: "CONVISO_PROJECT_ID"
        CONVISO_ASSOCIATION_ID_OUT: "CONVISO_ASSOCIATION_ID"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      displayName: "Getting Conviso Association and Project IDs"

    # Executa o sync no Conviso 
    - bash: |
          echo "##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}"

          if [ "${RT_CONVISO_NEW_INTEGRATION}" = "true" ]; then
            syncStartDateTime=$(date -u +"%Y-%m-%dT%H:%M:%S%z")

            echo "##vso[task.setvariable variable=SYNC_START_DATE_TIME]$syncStartDateTime" 
            echo "##[debug]Set Current Date and Time '${syncStartDateTime}' to 'SYNC_START_DATE_TIME'."

            sleep 5s

            RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize" \
            --proxy "${PROXY_AGENT_HTTPS}" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${CONVISO_API_KEY}" \
            --data '{"company_id": '${CONVISO_COMPANY_ID}',"integration_association_id": "'${CONVISO_ASSOCIATION_ID}'"}')

            TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)
            ASSET_ID=$(echo $RESPONSE | jq -r .data.asset.id)

            echo "##[debug]Track ID Conviso Sync: '${TRACK_KEY}'."
            
            echo "##vso[task.setvariable variable=convisoAssetId]$ASSET_ID"
            echo "##[debug]Set Asset ID Conviso Sync '${ASSET_ID}' to 'convisoAssetId'."
          else
            sleep 5s
            RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/fortify/synchronize" \
            --proxy "${PROXY_AGENT_HTTPS}" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${CONVISO_API_KEY}" \
            --data '{"company_id": '${CONVISO_COMPANY_ID}',"integration_association_id": "'${CONVISO_ASSOCIATION_ID}'"}')

            TRACK_KEY=$(echo $RESPONSE | jq -r .data.job.track_key)
            
            echo "##vso[task.setvariable variable=convisoTrackId]$TRACK_KEY"
            echo "##[debug]Set Track ID Conviso Sync '${TRACK_KEY}' to 'convisoTrackId'."
          fi
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_ASSOCIATION_ID: "$(CONVISO_ASSOCIATION_ID)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      displayName: "Starting Conviso Synchronization and Getting Track Key / Asset ID"

    # Busca o Status do sync no Conviso
    - bash: |
          echo "##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}"

          if [ "${RT_CONVISO_NEW_INTEGRATION}" = "true" ]; then
            sleep 5s
            i="0"
            retries="10"
            echo "Waiting for Synchronization to finish..."
            while [[ $i -lt $retries ]]
            do
                DATA="{\"operationName\":null,\"variables\":{},\"query\":\"{ syncStatus(assetId: ${CONVISO_ASSET_ID}, integration: FORTIFY, startDate: \\\"${SYNC_START_DATE_TIME}\\\") { status failureReason } }\"}"
                echo $DATA
                RESPONSE_RAW=$(curl -s -S -w "\n%{http_code}" "${CONVISO_GRAPHQL_ENDPOINT}" \
                  --proxy "${PROXY_AGENT_HTTPS}" \
                  --header "Content-Type: application/json" \
                  --header "x-api-key: ${CONVISO_API_KEY}" \
                  --data-raw "${DATA}")

                RESPONSE=$(sed '$d' <<< "$RESPONSE_RAW")
                RESPONSE_CODE=$(tail -n1 <<< "$RESPONSE_RAW")

                echo "##[debug]RESPONSE.........: ${RESPONSE}"
                echo "##[debug]RESPONSE_CODE....: ${RESPONSE_CODE}"
                
                SYNC_STATUS=$(echo $RESPONSE | jq -r .data.syncStatus.status)
                echo "##[debug] Current Sync Status: ${SYNC_STATUS}"

                if [[ "$SYNC_STATUS" == "succeeded" ]]
                then
                    echo "##[debug] Synchronization completed successfully."
                    exit 0
                fi
                sleep 30s
                i=$[$i+1]
            done

            echo "##vso[task.logissue type=error;]Timed out - Sync was not finished, please try running again."
            echo "##vso[task.complete result=Failed;]"
          else
            sleep 5s
            i="0"
            retries="10"
            API_URL="${CONVISO_APP_ENDPOINT}/api/v2/integrations/scanners/job/${CONVISO_TRACK_KEY}"

            echo "##[debug] Waiting for Synchronization to finish..."
            while [[ $i -lt $retries ]]
            do
                SYNC_STATUS=$(curl -s -S -X GET ${API_URL} \
                --proxy "${PROXY_AGENT_HTTPS}" \
                --header "x-api-key: ${CONVISO_API_KEY}" | jq -r .data.status)

                echo "##[debug] Current Sync Status: ${SYNC_STATUS}"

                if [[ "$SYNC_STATUS" == "completed" ]]
                then
                    echo "##[debug] Synchronization completed successfully."
                    exit 0
                fi
                sleep 30s
                i=$[$i+1]
            done

            echo "##vso[task.logissue type=error;]Timed out - Sync was not finished, please try running again."
            echo "##vso[task.complete result=Failed;]"
          fi
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_TRACK_KEY: "$(convisoTrackId)"
        CONVISO_ASSET_ID: "$(convisoAssetId)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        SYNC_START_DATE_TIME: "$(syncStartDateTime)"
        SYNC_START_DATE_TIME_NEW: "$(SYNC_START_DATE_TIME)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      displayName: "Getting Conviso Synchronization status"

    # Busca API Code do Projeto no Conviso
    - bash: |
          RESPONSE=$(curl -s -S "${CONVISO_GRAPHQL_ENDPOINT}" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data-raw '{"operationName":null,"variables":{},"query":"{ projects(params: { idEq: '${CONVISO_PROJECT_ID}' }) { collection { apiCode } } }"}')

          API_CODE=$(echo $RESPONSE | jq -r .data.projects.collection[0].apiCode)

          echo "##vso[task.setvariable variable=convisoProjectApiCode]$API_CODE"
          echo "##[debug] Set API CODE '${API_CODE}' Conviso Project to 'convisoProjectApiCode'."
      env:
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_PROJECT_ID: "$(CONVISO_PROJECT_ID)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      displayName: "Getting Conviso Project API CODE"

    # Busca Vulnerabilidades não avaliadas
    - bash: |
          EVALUATION_STATUS=0 # ID do Status 'Not Evaluated'
          FILTER='scopeId: '${CONVISO_COMPANY_ID}', projectKey: \"'${CONVISO_PROJECT_API_CODE}'\", evaluationStatus: '${EVALUATION_STATUS}''
          FIELDS="integrationName category titleEn descriptionEn evaluationStatus businessSeverity originalSeverity technicalSeverity"
          DATA='{"operationName":null,"variables":{},"query":"{ findings(page: 0, params: { '$FILTER' }) { collection { '$FIELDS' } } }"}'

          RESPONSE=$(curl -s -S "${CONVISO_GRAPHQL_ENDPOINT}" \
          --proxy "${PROXY_AGENT_HTTPS}" \
          --header 'Content-Type: application/json' \
          --header "x-api-key: ${CONVISO_API_KEY}" \
          --data-raw "${DATA}")

          echo "##[debug] Vulnerabilities not yet assessed:"
          echo $RESPONSE | jq .data.findings.collection
      env:
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_PROJECT_API_CODE: "$(convisoProjectApiCode)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
      displayName: "Getting Conviso Vulnerabilities Not Evaluated"

    # Busca o dados do Security Gate
    - bash: |
          echo "##[debug]RT_CONVISO_NEW_INTEGRATION....: ${RT_CONVISO_NEW_INTEGRATION}"

          if [ "${RT_CONVISO_NEW_INTEGRATION}" = "true" ]; then
            SG_STATUS_TO_BE_BLOCKED="IDENTIFIED IN_PROGRESS"
            DATA="{\"operationName\":null,\"variables\":{},\"query\":\"{ issuesStats(companyId: ${CONVISO_COMPANY_ID}, filters: {assetIds: [${CONVISO_ASSET_ID}], integrationTypes: Fortify, statuses: [$SG_STATUS_TO_BE_BLOCKED]}) { severities { count value } } }\"}"
                
            RESPONSE=$(curl -s -S "${CONVISO_GRAPHQL_ENDPOINT}" \
              --proxy "${PROXY_AGENT_HTTPS}" \
              --header "Content-Type: application/json" \
              --header "x-api-key: ${CONVISO_API_KEY}" \
              --data-raw "${DATA}")

            CRITICAL_SEVERITY_COUNT=$(echo $RESPONSE | jq -r .data.issuesStats.severities[4].count)
            HIGH_SEVERITY_COUNT=$(echo $RESPONSE | jq -r .data.issuesStats.severities[3].count)

            if [ "$CRITICAL_SEVERITY_COUNT" -gt "${SG_SEVERITY_CRITICAL}" ]; then
              echo "##vso[task.logissue type=error;]Scan Found Critical Vulnerabilities: $CRITICAL_SEVERITY_COUNT"
              echo "##vso[task.complete result=Failed;]"
              exit
            fi

            if [ "$HIGH_SEVERITY_COUNT" -gt "${SG_SEVERITY_HIGH}" ]; then
              echo "##vso[task.logissue type=error;]Scan found High Vulnerabilities: $HIGH_SEVERITY_COUNT"
              echo "##vso[task.complete result=Failed;]"
              exit
            fi

            echo "##[debug] No vulnerabilities found!"
            exit 0
          else
            CRITICAL=$([[ -n ${SG_SEVERITY_CRITICAL} ]] && echo -n '"critical": { "maximum": '${SG_SEVERITY_CRITICAL}' }' || echo -n "")
            HIGH=$([[ -n ${SG_SEVERITY_HIGH} ]] && echo -n '"high": { "maximum": '${SG_SEVERITY_HIGH}' }' || echo -n "")
            MEDIUM=$([[ -n ${SG_SEVERITY_MEDIUM} ]] && echo -n '"medium": { "maximum": '${SG_SEVERITY_MEDIUM}' }' || echo -n "")
            LOW=$([[ -n ${SG_SEVERITY_LOW} ]] && echo -n '"low": { "maximum": '${SG_SEVERITY_LOW}' }' || echo -n "")

            DATA_SEVERITY=$(echo -n ${CRITICAL})
            DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${HIGH} ]] && echo -n ","; echo -n ${HIGH})
            DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${MEDIUM} ]] && echo -n ","; echo -n ${MEDIUM})
            DATA_SEVERITY=$(echo -n ${DATA_SEVERITY}; [[ -n ${DATA_SEVERITY} ]] && [[ -n ${LOW} ]] && echo -n ","; echo -n ${LOW})
            
            DATA='{ "api_code": "'${CONVISO_PROJECT_API_CODE}'","rules": [{ "from": "any", "severity": { '${DATA_SEVERITY}' } }] }'
            
            RESPONSE=$(curl -s -S -g -X POST "${CONVISO_APP_ENDPOINT}/api/v3/security_gate/vulnerabilities" \
            --proxy "${PROXY_AGENT_HTTPS}" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${CONVISO_API_KEY}" \
            --data "${DATA}")

            LOCKED=$(echo $RESPONSE | jq .locked)

            if [[ "${LOCKED}" == "true" ]]
            then
              echo "##[error] Vulnerabilities found! Please, contact Project Security Champion."
              echo $RESPONSE | jq .summary
              echo "##vso[task.complete result=Failed;]"
              exit
            fi
            echo "##[debug] No vulnerabilities found!"
            exit 0
          fi
      env:
        CONVISO_APP_ENDPOINT: "$(CONVISO_APP_ENDPOINT)"
        CONVISO_PROJECT_API_CODE: "$(convisoProjectApiCode)"
        CONVISO_GRAPHQL_ENDPOINT: "$(CONVISO_GRAPHQL_ENDPOINT)"
        CONVISO_API_KEY: "$(CONVISO-API-KEY)"
        CONVISO_ASSET_ID: "$(convisoAssetId)"
        CONVISO_COMPANY_ID: "$(CONVISO_COMPANY_ID)"
        SG_SEVERITY_CRITICAL: "0"
        SG_SEVERITY_HIGH: "0"
        SG_SEVERITY_MEDIUM: ""
        SG_SEVERITY_LOW: ""
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"
        RT_CONVISO_NEW_INTEGRATION: "$(RT_CONVISO_NEW_INTEGRATION)"
      continueOnError: true
      displayName: "Getting Security Gate Data and Validate"

    - task: Bash@3
      displayName: "Evaluate Security Gate"
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |

          echo "##[debug]SKIP_SECURITY_GATE: $(SKIP_SECURITY_GATE)"
          if [[ ! "$(SKIP_SECURITY_GATE)" =~ ^(T|t)rue$ ]]; then

            if [[ "$Agent.JobStatus" == "SucceededWithIssues" ]]; then
              echo "##[error] Security Gate was not reached due to the existence of vulnerabilities!"
              echo "##vso[task.logissue type=error;] O Security Gate failed!"
              echo "##vso[task.complete result=Failed;]"
              exit
            else
                echo "##[debug] Security Gate has been reached!"
            fi

          else
            echo "##vso[task.logissue type=warning;] Security Gate is OFF and Gate validation has been skipped! "
            echo "##[warning] Even if the Security Gate is turned off at the moment this does not mean that it cannot be turned on again in the near future. "
            echo "##[warning] Please analyze the Critical and High vulnerabilities and try to fix them as soon as possible. "            
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi

      
