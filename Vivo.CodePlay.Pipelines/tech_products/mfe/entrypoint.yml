parameters:
  - name: config
    type: object
    default:
      pipelineType: ''
      technology: ''
      modelName: ''
      branchingStrategy: ''
      params: {}
  - name: qa_environment
    type: string
    default: 'dev'

variables:
  - template: initialize/variables_global.yml

stages:
  - ${{ if eq(parameters.config.pipelineType, 'app') }}:
    - stage: ValidateConfig
      displayName: 'Validate Configuration'
      jobs:
        - job: Validate
          displayName: 'Validate Pipeline Parameters'
          pool:
            name: $(PRIVATE_AGENT_DEFAULT)
          steps:
            - script: |
                if [[ "${{ parameters.config.technology }}" != "nodejs" ]]; then
                  echo "##vso[task.logissue type=error]Technology must be 'nodejs'"
                  exit 1
                fi
                if [[ "${{ parameters.config.modelName }}" != "mfe_default" ]]; then
                  echo "##vso[task.logissue type=error]Model name must be 'mfe_default'"
                  exit 1
                fi
              displayName: 'Validate Parameters'

    # Include CI stages - roda em commits e PRs
    - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      - template: pipeline_mfe_ci.yml
        parameters:
          workingDirectory: $(System.DefaultWorkingDirectory)

    # Include CD stages - roda apenas quando tag é especificada
    - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
      - template: pipeline_mfe_cd.yml
        parameters:
          environment: ${{ parameters.config.params.qa_environment }}
          tag_version: ${{ replace(variables['Build.SourceBranch'], 'refs/tags/', '') }}