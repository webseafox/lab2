## -> Parameters:
parameters:
  - name: environment
  - name: packageName
  - name: packageVersion
  - name: infrastructureType

stages:
  ## -> CI
  ## -> Initialize enviroment
  - template: /tech_products/cnte/externals-packages/initializers/default_initializer.yml

  ## -> Rename Package
  - template: /tech_products/cnte/externals-packages/templates/ci/ci_rename_package.yml
    parameters:
      packageName: "${{parameters.packageName}}"
      packageVersion: "${{parameters.packageVersion}}"

  ## -> Ask for Package to be uploaded
  - template: /tech_products/cnte/externals-packages/templates/ci/ci_upload_external_package.yml
    parameters:
      packageName: "${{parameters.packageName}}"

  ## -> Initialize Gates enviroment
  - template: /tech_products/cnte/externals-packages/initializers/gates_initializer.yml

  ## -> Security Gates
  - template: /tech_products/cnte/externals-packages/templates/ci/ci_security.yml
    parameters:
      packageName: "${{parameters.packageName}}"

  ## -> Publish Build for CI
  - template: /tech_products/cnte/externals-packages/templates/ci/ci_publish_package.yml
    parameters:
      packageName: "${{parameters.packageName}}"
      packageVersion: "${{parameters.packageVersion}}"
      infrastructureType: "${{ parameters.infrastructureType }}"
