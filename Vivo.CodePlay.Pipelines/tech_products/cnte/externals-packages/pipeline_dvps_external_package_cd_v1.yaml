## -> Parameters:
parameters:
  - name: environment
    displayName: "Escolha o ambiente para publicar"
    type: string
    default: preprod
    values:
      - preprod
      - producao
  - name: deliveryModel
  - name: packageName
  - name: packageVersion
  - name: infrastructureType
    type: string
    default: "weblogic"
    values:
      - weblogic

stages:
  ## -> Entrypoint
  ## -> Use CI-CD pipeline if no package version has been provided
  ## -> Use CD only pipeline if package version has been provided

  ## -> CD
  ## -> Initialize enviroment
  - template: /tech_products/cnte/externals-packages/initializers/cd_initializer.yml

  - ${{ if and(eq(parameters.environment, 'producao'), eq(parameters.deliveryModel, 'deployOnly')) }}:
      - template: /tech_products/cnte/externals-packages/templates/cd/pipeline_prod/cd_deploy_prod.yml
        parameters:
          environment: "${{ parameters.environment }}"
          packageVersion: "${{ parameters.packageVersion }}"
          packageName: "${{ parameters.packageName }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          deliveryModel: "${{ parameters.deliveryModel }}"

  - ${{ elseif and(eq(parameters.environment, 'preprod'), eq(parameters.deliveryModel, 'deployOnly')) }}:
      - template: /tech_products/cnte/externals-packages/templates/cd/pipeline_qa/cd_deploy_qa.yml
        parameters:
          environment: "${{ parameters.environment }}"
          packageVersion: "${{ parameters.packageVersion }}"
          packageName: "${{ parameters.packageName }}"
          infrastructureType: "${{ parameters.infrastructureType }}"
          deliveryModel: "${{ parameters.deliveryModel }}"
