parameters:
- name: private_agent_pool
  type: string

- name: environment
  type: string

- name: pipeline_extra_args
  type: string
  default: " -s 'SMALL' -c 1  --replicas '1' --redeploy --wait "

stages:
- stage: deploy
  dependsOn:
  - security
  pool: ${{ parameters.private_agent_pool }}
  displayName: "Deploy ${{ parameters.environment }}"
  jobs:
  - deployment: ${{ parameters.environment }}
    workspace:
      clean: all
    displayName: Deploy
    environment: "deploy-digibee-${{ parameters.environment }}"
    strategy:
      runOnce: 
        deploy:
          steps:
          - checkout: self
            persistCredentials: "true"
            clean: true
          - template: /tech_products/digibee/templates/setup_digibee.yml
          - template: /tech_products/digibee/templates/download_digibee_artifacts.yml
          - template: /tech_products/digibee/templates/extract_digibee_metadata.yml
          - template: /tech_products/digibee/templates/deploy_digibee.yml
            parameters:
              pipeline_id: $(OUT_DIGIBEE_PIPELINE_ID)
              pipeline_name: $(OUT_DIGIBEE_PIPELINE_NAME)
              pipeline_version: $(OUT_DIGIBEE_PIPELINE_VERSION)
              environment: '${{ parameters.environment }}'
              pipeline_extra_args: "${{ parameters.pipeline_extra_args }}"
                        
        on:
          success:
            steps:
            - script: |
                echo "##[debug] NOT_IMPLEMENTED.....: Not Implemented"  
              displayName: "OnSucess digibee pipeline"
              
          failure:
            steps:
            - script: |
                echo "##[debug] NOT_IMPLEMENTED.....: Not Implemented"  
              displayName: "OnFailure digibee pipeline"