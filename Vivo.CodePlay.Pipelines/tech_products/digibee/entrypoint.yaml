
parameters:
- name: config 
  type: object
  default:
    pipelineType: "app"
    technology: "digibee"
    modelName: "api_default"
    branchingStrategy: ""

extends:
  # SETUP - Setup digibee projects.
  ${{ if eq(parameters.config.params.action, 'SETUP') }}:
    template: /tech_products/digibee/provisioners/provisioner_entry_setup.yml
    parameters: 
      digibee_project: ${{ parameters.config.params.digibee_project }}
      pipeline_name: ${{ parameters.config.params.pipeline_name }}
  # DEPLOY - Deploy digibee pipelines.
  ${{ else }}:
    template: /tech_products/digibee/provisioners/provisioner_entry.yml
    parameters:
      environment: ${{ parameters.config.params.environment }}
      pipeline_name: ${{ parameters.config.params.pipeline_name }}
      pipeline_version: ${{ parameters.config.params.pipeline_version }}
      pipeline_extra_args: ${{ parameters.config.params.pipeline_extra_args }}