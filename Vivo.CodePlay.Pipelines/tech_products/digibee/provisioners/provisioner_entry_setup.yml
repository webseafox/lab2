parameters:
- name: digibee_project
  type: string
  default: ""

- name: pipeline_name
  type: string
  default: ""

variables:
- template: /tech_products/digibee/variables/load.yml
  
resources:
  repositories:
    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git       
      ref: refs/tags/v1
      endpoint: CorePipelines

stages: 
## INIT
- template: /tech_products/digibee/stages/init.yml

## SETUP
- template: /tech_products/digibee/stages/setup.yml
  parameters:
    digibee_project: ${{ parameters.digibee_project }}
    pipeline_name: ${{ parameters.pipeline_name }}