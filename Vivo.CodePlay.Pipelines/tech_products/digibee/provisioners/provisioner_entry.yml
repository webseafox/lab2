parameters:
- name: environment
  type: string

- name: pipeline_name
  type: string
  default: ""

- name: pipeline_version
  type: string
  default: ""

- name: pipeline_extra_args
  type: string
  default: " -s 'SMALL' -c 1  --replicas '1' --redeploy --wait "

variables:
- template: /tech_products/digibee/variables/load.yml
  
resources:
  repositories:
    - repository: FortifyExclusion
      name: DevOps/Vivo.Fortify.Exclusions
      type: git
      ref: refs/heads/master
      endpoint: CorePipelines

    - repository: CorePipelines
      name: DevOps/Vivo.Core.Pipelines
      type: git       
      ref: refs/tags/v1
      endpoint: CorePipelines

stages: 
## INIT
- template: /tech_products/digibee/stages/init.yml

- ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master') }}:
  ## BUILD & TEST
  - template: /tech_products/digibee/stages/build_test.yml
    parameters:
      environment: "${{ parameters.environment }}"
      pipeline_name: "${{ parameters.pipeline_name }}"
      pipeline_version: "${{ parameters.pipeline_version }}"

  ## SECURITY
  - template: /provisioners/app/trunkbased/java/api_default/stages/security.yml@CorePipelines
    parameters:
      fortifyExclusionRepository: FortifyExclusion

  ## DEPLOY
  - template: /tech_products/digibee/stages/deploy.yml
    parameters:
      environment: ${{ parameters.environment }}
      pipeline_extra_args: "${{ parameters.pipeline_extra_args }}"
      private_agent_pool: $(PRIVATE_AGENT_DEFAULT)