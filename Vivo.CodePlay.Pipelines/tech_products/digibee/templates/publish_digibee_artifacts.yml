steps:
- task: CopyFiles@2
  displayName: 'Copy to Staging Directory'
  inputs:
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    OverWrite: true
    CleanTargetFolder: true
    Contents: |
      digibee.json

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact Digibee'
  inputs:
    ArtifactName: digibee
    StoreAsTar: false