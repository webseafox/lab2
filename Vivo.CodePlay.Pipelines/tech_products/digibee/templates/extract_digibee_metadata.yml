steps:
- script: |
    source ~/.bashrc

    DIGIBEE_OUTPUT="$(cat $(System.ArtifactsDirectory)/digibee/digibee.json)"
    echo $DIGIBEE_OUTPUT | jq .

    DIGIBEE_PIPELINE_ID="$(echo $DIGIBEE_OUTPUT | jq -r '.DIGIBEE_PIPELINE_ID')"
    echo "##vso[task.setvariable variable=OUT_DIGIBEE_PIPELINE_ID;]$DIGIBEE_PIPELINE_ID"
    
    DIGIBEE_PIPELINE_NAME="$(echo $DIGIBEE_OUTPUT | jq -r '.DIGIBEE_PIPELINE_NAME')"
    echo "##vso[task.setvariable variable=OUT_DIGIBEE_PIPELINE_NAME;]$DIGIBEE_PIPELINE_NAME"

    DIGIBEE_PIPELINE_VERSION="$(echo $DIGIBEE_OUTPUT | jq -r '.DIGIBEE_PIPELINE_VERSION')"
    echo "##vso[task.setvariable variable=OUT_DIGIBEE_PIPELINE_VERSION;]$DIGIBEE_PIPELINE_VERSION"

    DIGIBEE_ENVIRONMENT="$(echo $DIGIBEE_OUTPUT | jq -r '.DIGIBEE_ENVIRONMENT')"
    echo "##vso[task.setvariable variable=OUT_DIGIBEE_ENVIRONMENT;]$DIGIBEE_ENVIRONMENT"

    echo "##[debug] Digibee extract metadata debug variables"
    echo "##[debug] OUT_DIGIBEE_PIPELINE_ID: ................... $DIGIBEE_PIPELINE_ID"
    echo "##[debug] OUT_DIGIBEE_PIPELINE_NAME: ................. $DIGIBEE_PIPELINE_NAME"
    echo "##[debug] OUT_DIGIBEE_PIPELINE_VERSION: .............. $DIGIBEE_PIPELINE_VERSION"
    echo "##[debug] OUT_DIGIBEE_ENVIRONMENT: ................... $DIGIBEE_ENVIRONMENT"

  displayName: "Extract digibee metadata"
    