parameters:
- name: environment
  type: string

- name: pipeline_name
  type: string

- name: pipeline_version
  type: string

steps:
- checkout: self
  persistCredentials: "true"
  clean: true

- task: DigibeeGetPipelineId@1
  displayName: 'Digibee Get Pipeline Id'
  inputs:
    digibeeDirectory: '$(System.ArtifactsDirectory)/digibee'
    pipelineName: '${{ parameters.pipeline_name }}'
    pipelineVersion: '${{ parameters.pipeline_version }}'
    pipelineIdVariable: 'pipeline_id'

- task: Bash@3
  displayName: 'Update Pipeline Specs to Repo'
  name: save_pipeline_to_repo
  env:
    PIPELINE_ID: $(pipeline_id)
  inputs:
    targetType: inline
    script: |
      echo "##[debug] Digibee load pipeline debug variables"
      echo "##[debug] PIPELINE_ID:...................... $(PIPELINE_ID)"
      echo "##[debug] Branch:........................... $(Build.SourceBranchName)"
      BRANCH="$(Build.SourceBranchName)"

      echo "##[debug] "
      echo "##[debug] Git config settings"
      git config --global user.email "azuredevops@telefonicati.onmicrosoft.com"
      git config --global user.name "Azure DevOps"
      git config pull.rebase true
      git fetch -f --depth 1 origin ${BRANCH}:${BRANCH}
      git checkout -f ${BRANCH}
      git status

      echo "##[debug] "
      echo "##[debug] Get Digibee Spec"
      R=`digibeectl get pipeline --allspecs --pipeline-id ${PIPELINE_ID}`
      echo "##[debug] DIGIBEE_SPECS:................... $(echo $R | jq -c '.')"

      echo "##[debug] "
      echo "##[debug] Update pipeline.json"
      echo "$R" > pipeline.json

      H=$(echo -n "$R" | sha256sum | awk '{print $1}')
      echo "$H" > pipeline_hash
      echo "##[debug] HASH_SPECS:...................... $H"
      
      echo "##[debug] git add pipeline.json"
      git add pipeline.json

      echo "##[debug] git add pipeline_hash"
      git add pipeline_hash

      echo "##[debug] git commit -m 'Adicionando pipeline.json ao Repo'"
      git commit -m "Adicionando pipeline.json ao Repo"

      git status

      echo "##[debug] git push --set-upstream origin ${BRANCH}"
      git push --set-upstream origin ${BRANCH}
