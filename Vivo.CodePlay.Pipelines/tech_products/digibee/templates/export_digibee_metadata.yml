parameters:
- name: environment
  type: string

- name: pipeline_name
  type: string

- name: pipeline_version
  type: string

steps:
- script: |
    cat <<EOF > digibee.json
    {
      "DIGIBEE_PIPELINE_ID": "${DIGIBEE_PIPELINE_ID}",
      "DIGIBEE_PIPELINE_NAME": "${DIGIBEE_PIPELINE_NAME}",
      "DIGIBEE_PIPELINE_VERSION": "${DIGIBEE_PIPELINE_VERSION}",
      "DIGIBEE_ENVIRONMENT": "${DIGIBEE_ENVIRONMENT}"
    }
    EOF

    echo "##[command] cat digibee.json"
    cat digibee.json
  displayName: "Generate digibee.json metadata"
  env:
    DIGIBEE_PIPELINE_ID: $(pipeline_id)
    DIGIBEE_PIPELINE_NAME: ${{ parameters.pipeline_name }}
    DIGIBEE_PIPELINE_VERSION: ${{ parameters.pipeline_version }}
    DIGIBEE_ENVIRONMENT: ${{ parameters.environment }}
    