steps:
- task: AzureKeyVault@2
  displayName: 'Get DigibeeCTL Credentials'
  name: digibee_keyvaut
  inputs:    
    azureSubscription: DevOpsSharedResources    
    KeyVaultName: $(AKV_DEVOPS_NAME)
    SecretsFilter: 'DIGIBEE-ENCRYPTION-KEY, DIGIBEE-ENCRYPTION-PASSWORD, DIGIBEE-JSON-FILE'

- task: Bash@3
  name: digibee_config
  displayName: 'Download Digibee json file'
  inputs:
    targetType: inline
    script: |
      echo "##[debug] Digibee setup debug variables"
      echo "##[debug] DIGIBEE-ENCRYPTION-KEY: ........ $(DIGIBEE-ENCRYPTION-KEY)"
      echo "##[debug] DIGIBEE-ENCRYPTION-PASSWORD: ... $(DIGIBEE-ENCRYPTION-PASSWORD)"
      echo "##[debug] DIGIBEE-JSON-FILE: ............. $(DIGIBEE-JSON-FILE)"
      echo $(DIGIBEE-JSON-FILE) | jq -r '.' > $(Agent.TempDirectory)/digibee.json

- task: DigibeeInstall@1
  displayName: 'Digibee Install'
  inputs:
    mode: auto
    useCache: true

- task: DigibeeSetupConfig@1
  displayName: 'Digibee Setup Config'
  inputs:
   digibeeDirectory: "$(System.ArtifactsDirectory)/digibee"
   jsonConfigFilePath: "$(Agent.TempDirectory)/digibee.json"
   encryptionKey: "$(DIGIBEE-ENCRYPTION-KEY)"
   encryptionPassword: "$(DIGIBEE-ENCRYPTION-PASSWORD)"
   