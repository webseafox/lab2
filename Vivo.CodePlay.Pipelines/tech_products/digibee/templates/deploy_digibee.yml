parameters:
- name: environment
  type: string

- name: pipeline_id
  type: string

- name: pipeline_name
  type: string

- name: pipeline_version
  type: string

- name: pipeline_extra_args
  type: string
  default: " -s 'SMALL' -c 1  --replicas '1' --redeploy --wait "

steps:  
- task: Bash@3
  displayName: 'Digibee Verify Hash'
  name: digibee_verify_hash
  env:
    PIPELINE_ID: "${{ parameters.pipeline_id }}"
    PIPELINE_NAME: "${{ parameters.pipeline_name }}"
    PIPELINE_VERSION: "${{ parameters.pipeline_version }}"
    PIPELINE_EXTRA_ARGS: "${{ parameters.pipeline_extra_args }}"
    ENVIRONMENT: "${{ parameters.environment }}"
  inputs:
    targetType: inline
    script: |
      echo "##[debug] Digibee verify hash variables"
      echo "##[debug] PIPELINE_ID: ................... $PIPELINE_ID"
      echo "##[debug] PIPELINE_NAME: ................. $PIPELINE_NAME"
      echo "##[debug] PIPELINE_VERSION: .............. $PIPELINE_VERSION"
      echo "##[debug] PIPELINE_EXTRA_ARGS: ........... $PIPELINE_EXTRA_ARGS"
      echo "##[debug] ENVIRONMENT: ................... $ENVIRONMENT"
      BRANCH="$(Build.SourceBranchName)"
      cd $(Build.SourcesDirectory);
      git fetch -f --depth 1 origin ${BRANCH}:${BRANCH}
      git checkout -f ${BRANCH}
      git pull --set-upstream origin ${BRANCH}

      HASH_REPO=$(cat $(Build.SourcesDirectory)/pipeline_hash)
      echo "##[debug] HASH_LOCAL_REPO: ............... $HASH_REPO"
      
      R=`digibeectl get pipeline --allspecs --pipeline-id ${PIPELINE_ID}`
      HASH_DIGI=$(echo -n "$R" | sha256sum | awk '{print $1}')
      echo "##[debug] HASH_DIGIBEE: .................. $HASH_DIGI"

      if [ "$HASH_REPO" == "$HASH_DIGI" ]; then
        echo "##[debug]Validação de HASH pipeline realizada com sucesso!"
      else
        echo "##[debug]Validação de HASH 'failed', existe diferenças entre o repositório local e a digibee!"
        exit 1
      fi

- task: DigibeeDeployPipeline@1
  displayName: 'Deploy Pipeline'
  inputs:
    environment: "${{ parameters.environment }}"
    pipelineId: "${{ parameters.pipeline_id }}"
    extraArgs: "${{ parameters.pipeline_extra_args }}"

