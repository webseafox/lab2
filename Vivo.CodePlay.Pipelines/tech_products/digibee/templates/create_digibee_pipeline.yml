steps:
- task: Bash@3
  displayName: 'Create Digibee Pipeline'
  inputs:
    targetType: inline
    script: |
      echo "##[debug] Digibee create pipeline debug variables"
      echo "##[debug] digibee_project:.................. ${{ parameters.digibee_project }}"
      echo "##[debug] pipeline_name:.................... ${{ parameters.pipeline_name }}"

      echo "Verificando se o pipeline ${{ parameters.pipeline_name }} já existe."
      DIGIBEE_PROJECT_NAME="${{ parameters.digibee_project }}"
      DIGIBEE_PIPELINE_NAME="${{ parameters.pipeline_name }}"
      DIGIBEECTL="digibeectl"

      DIGIBEE_PIPELINE_RESULT=`$DIGIBEECTL get pipeline -n "$DIGIBEE_PIPELINE_NAME" --project-name "$DIGIBEE_PROJECT_NAME" 2>&1`

      if [ $? -ne 0 ]; then
          echo "Ocorreu um error durante a verificação do pipeline [$DIGIBEE_PIPELINE_NAME] na DIGIBEE";
          exit 1;
      else
          ## Verifica se o pipeline já existe na digibee caso não exista cria o pipeline.
          if [[ "$DIGIBEE_PIPELINE_RESULT" == *"No resources found."* ]]; then
            echo "O pipeline [$DIGIBEE_PIPELINE_NAME] não encontrado na digibee!"
            echo "Criando o pipeline [$DIGIBEE_PIPELINE_NAME]"

            DIGIBEE_CREATE_RESULT=`$DIGIBEECTL create pipeline -n "$DIGIBEE_PIPELINE_NAME" -p "$DIGIBEE_PROJECT_NAME" -d "Created by plataform code" 2>&1`
            if [ $? -ne 0 ]; then
              echo "Ocorreu um erro durante a criação do pipeline na digibee [$DIGIBEE_PIPELINE_NAME]";
              echo "$DIGIBEE_CREATE_RESULT";
              exit 2;
            else
              echo "Pipeline [$DIGIBEE_PIPELINE_NAME] criado com sucesso!";
              echo "$DIGIBEE_CREATE_RESULT";
            fi
          else
            echo "O pipeline [$DIGIBEE_PIPELINE_NAME] já existe na plataforma digibee!";
            echo "Nenhuma ação é necessária!";
          fi
      fi