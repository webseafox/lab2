steps:
- task: Bash@3
  displayName: 'Create Digibee Project'
  inputs:
    targetType: inline
    script: |
      echo "##[debug] Digibee create pipeline debug variables"
      echo "##[debug] digibee_project:.................. ${{ parameters.digibee_project }}"

      echo "Verificando se o projeto ${{ parameters.digibee_project }} já existe."
      DIGIBEE_PROJECT_NAME="${{ parameters.digibee_project }}"
      DIGIBEECTL="digibeectl"

      DIGIBEE_PROJECT_RESULT=`$DIGIBEECTL get project -n $DIGIBEE_PROJECT_NAME -o json 2>&1`

      if [ $? -ne 0 ]; then
          echo "Ocorreu um error durante a verificação do projeto [$DIGIBEE_PROJECT_NAME] na DIGIBEE";
          echo "$DIGIBEE_PROJECT_RESULT"
          exit 1;
      else
          ## Verifica se o projeto já existe na digibee caso não exista cria o projeto.
          if [[ "$DIGIBEE_PROJECT_RESULT" == *"Project not found"* ]]; then
            echo "O projeto [$DIGIBEE_PROJECT_NAME] não encontrado na digibee!"
            echo "Criando o projeto [$DIGIBEE_PROJECT_NAME]"

            DIGIBEE_CREATE_RESULT=`$DIGIBEECTL create project --name "$DIGIBEE_PROJECT_NAME" --description "Created by plataform code [$DIGIBEE_PROJECT_NAME]" 2>&1`
            if [ $? -ne 0 ]; then
              echo "Ocorreu um erro durante a criação do projeto na digibee [$DIGIBEE_PROJECT_NAME]";
              echo "$DIGIBEE_CREATE_RESULT";
              exit 2;
            else
              echo "Projeto [$DIGIBEE_PROJECT_NAME] criado com sucesso!";
              echo "$DIGIBEE_CREATE_RESULT";
            fi
          else
            echo "O projeto [$DIGIBEE_PROJECT_NAME] já existe na plataforma digibee!";
            echo "Nenhuma ação é necessária!";
          fi
      fi