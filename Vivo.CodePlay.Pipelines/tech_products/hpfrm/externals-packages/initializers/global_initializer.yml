variables:
  # Variables for Agents
  - name: AGENT_POOL_CI
    value: GeneralPurposeLinuxAgentsCI
  - name: AGENT_POOL_CD
    value: GeneralPurposeLinuxAgentsCD
  - name: PRIVATE_AGENT_DEV
    value: $(PRIVATE_AGENT_SHARED)
  - name: PRIVATE_AGENT_ESTEIRA1
    value: $(PRIVATE_AGENT_SHARED)
  - name: PRIVATE_AGENT_ESTEIRA2
    value: $(PRIVATE_AGENT_SHARED)
  - name: PRIVATE_AGENT_PREPROD
    value: $(PRIVATE_AGENT_SHARED)
  - name: PRIVATE_AGENT_PRODLIKE
    value: $(PRIVATE_AGENT_SHARED)
  - name: PRIVATE_AGENT_PRODUCAO
    value: VivoOnPremPrdAgents

  # Variables for CACORP Certificate
  - name: CACORP_LOCATION
    value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"

  # Variables for AKV DevOps
  - name: AKV_DEVOPS_NAME
    value: "kv-azdevops-shared"

  # Variables for Azure Artifacts
  - name: AZURE_ARTIFACTS_ORGANIZATION
    value: "telefonica-vivo-brasil"
  - name: AZURE_ARTIFACTS_FEED
    value: "DevOps"
  - name: AZURE_ARTIFACTS_MAVEN_FEED_URL
    value: "https://pkgs.dev.azure.com/$(AZURE_ARTIFACTS_ORGANIZATION)/_packaging/$(AZURE_ARTIFACTS_FEED)/maven/v1"
  - name: AZURE_ARTIFACTS_PUBLISH_ENABLE
    value: "true"

  # Variables for Governance App
  - name: GOVAPP_INTEGRATION_ENABLED
    value: False
  - name: GOVAPP_SERVICE_CONNECTION_NAME
    value: "governanceapi"

  # Variables for Messages
  - name: FORMATED_TIME_TAGS
    value: "$(date +%F--%H-%M-%S)"
  - name: ALERT_MESSAGE_START
    value: "##[warning] +------------------+ \n##[warning] | LEIA COM ATENCAO | \n##[warning] +------------------+"
  - name: ALERT_MESSAGE_START_SUCCESS
    value: "##[success] +------------------+ \n##[success] | STAGE COMPLETO | \n##[success] +------------------+"
  - name: ALERT_MESSAGE_START_ERROR
    value: "##[error] +------------------+ \n##[error] | LEIA COM ATENCAO | \n##[error] +------------------+"
  - name: ALERT_MESSAGE_PREFIX_ARROW
    value: "##[warning] ➔"
  - name: ALERT_MESSAGE_ARROW
    value: "➔"
  - name: ALERT_MESSAGE_PREFIX_WARNING
    value: "##[warning] "
  - name: ALERT_MESSAGE_PREFIX_ERROR
    value: "##[error] ➔"
  - name: ALERT_MESSAGE_END
    value: "##[warning] +------------------+ \n##[warning] | ---------------- | \n##[warning] +------------------+"
  - name: ALERT_MESSAGE_END_SUCCESS
    value: "##[success] +------------------+ \n##[success] | ---------------- | \n##[success] +------------------+"
  - name: ALERT_MESSAGE_END_ERROR
    value: "##[error] +------------------+ \n##[error] | ---------------- | \n##[error] +------------------+"
  - name: ALERT_MESSAGE_DEBUG_PREFIX
    value: "##[debug] ?"
  - name: ALERT_MESSAGE_SECTION_PREFIX
    value: "##[section] "
  - name: GIT_AUTHOR_NAME
    value: "CorePipeline"
  - name: GIT_AUTHOR_EMAIL
    value: "core-pipeline@telefonica.com.br"
  - name: GIT_COMMITTER_NAME
    value: "CorePipeline"
  - name: GIT_COMMITTER_EMAIL
    value: "core-pipeline@telefonica.com.br"
  - name: ORG_NAME
    value: "$(echo $(System.CollectionUri) | cut -d/ -f 4)"
  - name: CORPORATE_WIKI_DOC_URL
    value: "https://wikicorp.telefonica.com.br/display/AC/Vivo+Core+Pipelines"

  # Variables for NEXUS
  - name: NEXUS_ENDPOINT_API_REPOSITORY
    value: "https://nexus.telefonica.com.br/service/rest/v1"
  - name: NEXUS_REPOSITORY_URL
    value: "https://nexus.telefonica.com.br/repository"
  - name: NEXUS_REPO_LIB_MVN
    value: "azdevops-libs-mvn"
  - name: NEXUS_REPO_OSSDEVOPSLABS
    value: "ossdevopslabs-mvn"
  - name: GROUP_ID_OSSDEVOPSLABS
    value: "com.tlf.oss.ossdevopslabs"
  - name: WEBLOGIC_OSS_SCRIPTS_REPO
    value: "weblogic-oss-scripts"
  - name: WEBLOGIC_OSS_SCRIPTS_REPO
    value: "weblogic-oss-scripts"
  - name: WEBLOGIC_OSS_SCRIPTS_VERSION
    value: "0.0.1"

  # Variables for Pipeline Default
  - name: DEFAULT_WORKDIR_SOURCE_CODE
    value: "(Pipeline.Workspace)/source_code/"
  - name: DEFAULT_WORKDIR_ARTIFACTS
    value: "$(System.ArtifactsDirectory)/extracted_tars/"
  - name: DEFAULT_WORKDIR_DOCKER_ARTIFACTS
    value: "$(System.ArtifactsDirectory)/docker"
  - name: DEFAULT_WORKDIR_WEBLOGIC_CONFIG
    value: "$(Pipeline.Workspace)/source_code/.azuredevops/config"
  - name: CMD-GET-ORGANIZATION-NAME
    value: $(echo $(System.CollectionUri) | cut -d/ -f 4)
  - name: DEFAULT_MAX_MEMORY_BUILD
    value: "4096m"
  - name: AZURE_APP_CONFIGURATION_ENABLED
    value: "true"
  - name: AZURE_APP_CONFIGURATION_AZURE_SUBSCRIPTION
    value: "DevOpsSharedResources"
  - name: AZURE_APP_CONFIGURATIN_ENDPOINT
    value: "https://appcs-azdevops-shared.azconfig.io"
  - name: BUMP_VERSION_ENABLED
    value: "true"
  - name: DEPLOY_ENVIRONMENT_LIB
    value: "deploy-lib"
  - name: MULTIBRANCH_EXCLUSIONS_FILE
    value: multibranch.yml
  - name: USERS_EXCLUSIONS_FILE
    value: users.yml

  # Variables for Proxy
  - name: PROXY_SQUID_SERVER
    value: "10.240.58.39:3128" # proxy Squid para evitar erros de timeout do proxy NetSkope.
  - name: PROXY_NSKP_SERVER
    value: "nskp.redecorp.br:8080"
  - name: PROXY_AGENT_HTTP
    value: "http://$(PROXY_SQUID_SERVER)"
  - name: PROXY_AGENT_HTTPS
    value: "http://$(PROXY_SQUID_SERVER)"
  - name: PROXY_AGENT_NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
  - name: PROXY_ADDL_NO_PROXY
    value: ""

  # Variables for Fortify
  - name: FORTIFY_SSC_ENDPOINT
    value: "https://ssc-fortify.redecorp.br/ssc/"
  - name: FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT
    value: "https://scancentral-sast.redecorp.br/scancentral-ctrl"
  - name: FORTIFY_APP_DEFAULT_NAME
    value: "$(System.TeamProject)-$(Build.Repository.Name)"
  - name: FORTIFY_APP_DEFAULT_VERSION
    value: "DevSecOps"
  - name: FORTIFY_EXCLUSION_FILE
    value: "sast_fortify_exclude_files.json"
  - name: FORTIFY_REPOSITORY_TECH
    value: ""
  - name: FORTIFY_LOCAL_SCANCENTRAL_VERSION
    value: "22.1.0"
  - name: FORTIFY_LOCAL_SCANCENTRAL_PATH
    value: "/devops/fortify/scancentral/"
  - name: FORTIFY_LOCAL_SCANCENTRAL_SCRIPT
    value: "/bin/scancentral"
  - name: FORTIFY-SSC-CLI-TOKEN
    value: ""

  #Variables for Dependency-Track
  - name: DT_SCA_ENDPOINT
    value: "https://sca.redecorp.br/api"
  - name: DT_APP_DEFAULT_NAME
    value: "$(System.TeamProject)-$(Build.Repository.Name)"
  - name: DT_APP_DEFAULT_VERSION
    value: "DevSecOps"
  - name: STAGENAME_DOCKER
    value: "SCA Scan em imagem Docker"

  # conviso
  - name: CONVISO_APP_ENDPOINT
    value: "https://app.conviso.com.br"
  - name: CONVISO_COMPANY_ID
    value: "430"
  - name: CONVISO_GRAPHQL_ENDPOINT
    value: "https://app.convisoappsec.com/graphql"
  - name: SKIP_CONVISO_SECURITY_GATE
    value: "true"
  - name: CONVISO-API-KEY
    value: ""
