parameters:
- name: pythonVersion
  type: string
  default: "3.13"

jobs:
- job: Tests
  displayName: "Run tests"
  pool:
    name: GeneralPurposeLinuxAgentsCI

  steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"; }

        log "🐍 Python ${{ parameters.pythonVersion }}"
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"

        uv sync --python ${{ parameters.pythonVersion }}
        uv run pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-results.xml

        log "✅ Testes finalizados"
      displayName: "Run pytest"
