jobs:
- job: ValidateConfig
  displayName: "Validate config.yaml & jobs-config.json"
  pool:
    name: GeneralPurposeLinuxAgentsCI

  steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        ############################
        # CONTEXTO DE EXECUÇÃO
        ############################
        ROOT_DIR="$SYSTEM_DEFAULTWORKINGDIRECTORY"
        CONFIG_FILE="$ROOT_DIR/config/config.yaml"
        JOBS_CONFIG_FILE="$ROOT_DIR/config/jobs-config.json"

        log() {
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
        }

        log "🔎 Contexto de execução"
        log "ROOT_DIR: $ROOT_DIR"
        log "CONFIG_FILE: $CONFIG_FILE"
        log "JOBS_CONFIG_FILE: $JOBS_CONFIG_FILE"

        ############################
        # VERIFICA EXISTÊNCIA
        ############################
        if [[ ! -f "$CONFIG_FILE" ]]; then
          log "❌ ERRO: config.yaml não encontrado"
          log "📂 Conteúdo do diretório config:"
          ls -la "$ROOT_DIR/config" || true
          exit 2
        fi

        if [[ ! -f "$JOBS_CONFIG_FILE" ]]; then
          log "❌ ERRO: jobs-config.json não encontrado"
          log "📂 Conteúdo do diretório config:"
          ls -la "$ROOT_DIR/config" || true
          exit 2
        fi

        log "✅ Arquivos de configuração encontrados"

        ############################
        # VALIDAÇÃO YAML (REAL)
        ############################
        log "🧪 Validando estrutura e conteúdo do YAML"

        export CONFIG_FILE

        python3 - <<'EOF'
        import yaml
        import sys
        import os

        config_path = os.environ["CONFIG_FILE"]

        required_fields = [
            "mlflow_uri",
            "mlflow_model_name",
            "feature_store_implementation",
            "feature_table_or_service",
        ]

        try:
            with open(config_path) as f:
                config = yaml.safe_load(f)
        except yaml.YAMLError as e:
            print(f"❌ ERRO: YAML inválido: {e}")
            sys.exit(1)

        if not isinstance(config, dict):
            print("❌ ERRO: YAML inválido (estrutura raiz não é um dicionário)")
            sys.exit(1)

        missing = []
        empty = []

        for key in required_fields:
            if key not in config:
                missing.append(key)
            elif config[key] in (None, "", []):
                empty.append(key)

        if missing:
            print("❌ Campos obrigatórios AUSENTES:")
            for k in missing:
                print(f" - {k}")
            sys.exit(1)

        if empty:
            print("⚠️ Campos obrigatórios VAZIOS:")
            for k in empty:
                print(f" - {k}")

        print("✅ YAML válido e campos obrigatórios presentes")
        EOF

        log "🎉 Validação concluída com sucesso"
      displayName: "Validate config.yaml & jobs-config.json"
