steps:
  - checkout: none
  
  - task: NexusUploadMvnFromVivo@5
    displayName: 'Uploading soaconfig.jar'
    condition: and(succeeded(), in(variables['PROJECT_TYPE'], 'COMPOSITE'))
    inputs:
      nexusEndpoint: 'Nexus'
      nexusRepoMaven: '$(NEXUS_PUBLISH_REPOSITORY)'
      groupId: '$(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)'
      artifactId: 'soaconfig'
      artifactVersion: '$(System.PullRequest.PullRequestId)'
      artifactFile1: 'soaconfig-$(System.PullRequest.PullRequestId).jar'
      artifactExtension1: 'jar'

  - task: NexusUploadMvnFromVivo@5
    displayName: 'Uploading soaconfig.txt'
    condition: and(succeeded(), in(variables['PROJECT_TYPE'], 'COMPOSITE'))
    inputs:
      nexusEndpoint: 'Nexus'
      nexusRepoMaven: '$(NEXUS_PUBLISH_REPOSITORY)'
      groupId: '$(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)'
      artifactId: 'soaconfig'
      artifactVersion: '$(System.PullRequest.PullRequestId)'
      artifactFile1: 'soaconfig-$(System.PullRequest.PullRequestId).txt'
      artifactExtension1: 'txt'

  - task: NexusUploadMvnFromVivo@5
    displayName: 'Uploading oramds.zip'
    condition: and(succeeded(), in(variables['PROJECT_TYPE'], 'METADATA_STORE'))
    inputs:
      nexusEndpoint: 'Nexus'
      nexusRepoMaven: '$(NEXUS_PUBLISH_REPOSITORY)'
      groupId: '$(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)'
      artifactId: 'oramds'
      artifactVersion: '$(System.PullRequest.PullRequestId)'
      artifactFile1: 'oramds-$(System.PullRequest.PullRequestId).zip'
      artifactExtension1: 'zip'

  - task: NexusUploadMvnFromVivo@5
    displayName: 'Uploading oramds.jar'
    condition: and(succeeded(), in(variables['PROJECT_TYPE'], 'METADATA_STORE'))
    inputs:
      nexusEndpoint: 'Nexus'
      nexusRepoMaven: '$(NEXUS_PUBLISH_REPOSITORY)'
      groupId: '$(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)'
      artifactId: 'oramds'
      artifactVersion: '$(System.PullRequest.PullRequestId)'
      artifactFile1: 'oramds-$(System.PullRequest.PullRequestId).jar'
      artifactExtension1: 'jar'

  - task: NexusUploadMvnFromVivo@5
    displayName: 'Uploading oramds.txt'
    condition: and(succeeded(), in(variables['PROJECT_TYPE'], 'METADATA_STORE'))
    inputs:
      nexusEndpoint: 'Nexus'
      nexusRepoMaven: '$(NEXUS_PUBLISH_REPOSITORY)'
      groupId: '$(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)'
      artifactId: 'oramds'
      artifactVersion: '$(System.PullRequest.PullRequestId)'
      artifactFile1: 'oramds-$(System.PullRequest.PullRequestId).txt'
      artifactExtension1: 'txt'