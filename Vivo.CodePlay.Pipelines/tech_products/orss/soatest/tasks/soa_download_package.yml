steps:
  - checkout: none

  - task: Bash@3
    name: IdentifyPackageNumber
    displayName: 'Identifying package number'
    inputs:
      targetType: 'inline'
      script: |
        TAG=$(Build.SourceBranch)
        echo "##vso[task.setvariable variable=PACKAGE_NUMBER;isOutput=true]$(echo ${TAG:14})"

  - task: DownloadArtifactsNexusMavenRepositoryV3@3
    displayName: "Download MDS Package"
    condition: contains(variables['Build.SourceBranch'], 'MDS')
    inputs:
      NexusConnection: 'Nexus'
      RepositoryId: $(NEXUS_PUBLISH_REPOSITORY)
      GroupId: $(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)
      ArtifactId: oramds
      BaseVersion: $(IdentifyPackageNumber.PACKAGE_NUMBER)
      Packaging: jar
      DownloadPath: $(Build.SourcesDirectory)
      
  - task: DownloadArtifactsNexusMavenRepositoryV3@3
    displayName: "Download BPEL Package"
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'SOA'))
    inputs:
      NexusConnection: 'Nexus'
      RepositoryId: $(NEXUS_PUBLISH_REPOSITORY)
      GroupId: $(NEXUS_PUBLISH_REPOSITORY_GROUP_ID)
      ArtifactId: soaconfig
      BaseVersion: $(IdentifyPackageNumber.PACKAGE_NUMBER)
      Packaging: jar
      DownloadPath: $(Build.SourcesDirectory)