parameters:
- name: environment
  type: string
  values:
  - esteira1
  - esteira2
  - preprod
  - prodlike

stages:
- ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
  - template: /tech_products/orss/soa-refactor/stages/validate.yml
  - template: /tech_products/orss/soa-refactor/stages/build_and_package.yml

- ${{ else }}:
  - stage: Error
    jobs:
    - job: Error
      steps:  
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            script: |
              print("##vso[task.logissue type=error;]Do Not Run Pipelines Without a Pull Request")
              print("##vso[task.complete result=Failed;]Text")