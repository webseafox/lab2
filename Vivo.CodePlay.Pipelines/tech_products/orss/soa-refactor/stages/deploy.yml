parameters:
- name: environment
  type: string
  values:
  - esteira1
  - esteira2
  - preprod
  - prodlike

stages:
- stage: Deploy_${{ parameters.environment }}
  displayName: Deploy - ${{ parameters.environment }}
  pool: GeneralPurposeLinuxAgentsCD
  condition: succeeded()
  dependsOn:
  - PrepareDeploy_${{ parameters.environment }}
  jobs:
  - deployment: deployment_${{ parameters.environment }}
    environment: soa-deploy-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - bash: |
              echo "##vso[task.setvariable variable=AGENT_NAME;isoutput=true]$(Agent.Name)"
            name: GetAgent
          - template: /tech_products/orss/soa-refactor/tasks/soa_validation.yml

          - template: /tech_products/orss/soa-refactor/tasks/soa_download_package.yml

          - template: /tech_products/orss/soa-refactor/tasks/soa_deploy.yml
            parameters:
              environment: ${{ parameters.environment }}      
