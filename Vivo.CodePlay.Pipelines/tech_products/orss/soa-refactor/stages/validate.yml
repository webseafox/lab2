stages:
- stage: Validate
  displayName: "Validate"
  pool: GeneralPurposeLinuxAgentsCI
  jobs:
    - job: PreparationPipeline
      displayName: "Preparing Pipeline"
      steps:
        - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
          submodules: true
          persistCredentials: true
          clean: false
          fetchDepth: 0

        - bash: |
            echo "##[debug] PREPARING PIPELINE"
    
    - job: Validate
      displayName: "Validating"
      steps:
        - bash: |
            echo "##vso[task.setvariable variable=AGENT_NAME;isoutput=true]$(Agent.Name)"
          name: GetAgent
        - template: /tech_products/orss/soa-refactor/tasks/soa_validation.yml