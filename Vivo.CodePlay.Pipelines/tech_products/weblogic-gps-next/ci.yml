- stage: deploy_nexus
  displayName: Deploy Nexus
  condition: and(succeeded(), ${{ eq(parameters.publishNexus, true) }})

  jobs:
  - job: deploy_on_nexus
    continueOnError: False
    condition: succeeded()

    displayName: Deploy on Nexus
    pool: DefaultDevOpsAgents
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: bin
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)

    - task: XmlParseFromVivo@4
      displayName: Get Main Info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/pom.xml
        jpaths: |
          var POM_XML_VERSION      =  .project.version._text
          var POM_XML_GROUP_ID     =  .project.groupId._text
        
    - task: NexusUploadMvnFromVivo@5
      continueOnError: true
      displayName: Upload admin-common-ui
      inputs:
        nexusEndpoint: "Nexus Asis"
        nexusRepoMaven: "gps2-mvn"
        groupId: $(POM_XML_GROUP_ID) # br.com.vivo.gps4
        generatePom: false
        artifactId: admin-common-ui
        artifactVersion: $(POM_XML_VERSION)
        artifactFile1: $(System.ArtifactsDirectory)/bin/admin-common-ui/target/admin-common-ui.$(POM_XML_VERSION).jar
        artifactExtension1: jar
        artifactFile2: $(System.ArtifactsDirectory)/bin/admin-common-ui/pom.xml
        artifactExtension2: pom
        artifactFile3: $(System.ArtifactsDirectory)/bin/admin-common-ui/target/admin-common-ui.$(POM_XML_VERSION)-sources.jar
        artifactExtension3: jar
        artifactClassifier3: sources
      
    - task: NexusUploadMvnFromVivo@5
      continueOnError: true
      displayName: Upload admin-external-common-ui
      inputs:
        nexusEndpoint: "Nexus Asis"
        nexusRepoMaven: "gps2-mvn"
        groupId: $(POM_XML_GROUP_ID) # br.com.vivo.gps4
        generatePom: false
        artifactId: admin-external-common-ui
        artifactVersion: $(POM_XML_VERSION)
        artifactFile1: $(System.ArtifactsDirectory)/bin/admin-external-common-ui/target/admin-external-common-ui.$(POM_XML_VERSION).jar
        artifactExtension1: jar
        artifactFile2: $(System.ArtifactsDirectory)/bin/admin-external-common-ui/pom.xml
        artifactExtension2: pom
        artifactFile3: $(System.ArtifactsDirectory)/bin/admin-external-common-ui/target/admin-external-common-ui.$(POM_XML_VERSION)-sources.jar
        artifactExtension3: jar
        artifactClassifier3: sources

    - task: NexusUploadMvnFromVivo@5
      continueOnError: true
      displayName: Upload common-model
      inputs:
        nexusEndpoint: "Nexus Asis"
        nexusRepoMaven: "gps2-mvn"
        groupId: $(POM_XML_GROUP_ID) # br.com.vivo.gps4
        generatePom: false
        artifactId: common-model
        artifactVersion: $(POM_XML_VERSION)
        artifactFile1: $(System.ArtifactsDirectory)/bin/common-model/target/common-model.$(POM_XML_VERSION).jar
        artifactExtension1: jar
        artifactFile2: $(System.ArtifactsDirectory)/bin/common-model/pom.xml
        artifactExtension2: pom
        artifactFile3: $(System.ArtifactsDirectory)/bin/common-model/target/common-model.$(POM_XML_VERSION)-sources.jar
        artifactExtension3: jar
        artifactClassifier3: sources

    - task: NexusUploadMvnFromVivo@5
      continueOnError: true
      displayName: Upload common-ui
