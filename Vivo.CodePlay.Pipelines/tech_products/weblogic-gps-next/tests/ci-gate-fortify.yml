###
### ISTO NAO E UM TEMPLATE 
###
### E UM TESTE DE SCAN DO FORTIFY
###

trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - '*'
    exclude:
      - docs/*
   
parameters:
- name: skipTest
  displayName: Nao Testar (skipTest)
  type: boolean
  default: true
  
- name: deploy
  displayName: Publicar (Deploy)
  type: boolean
  default: True

- name: useMavenCache
  displayName: Usar cache do maven
  type: boolean
  default: True

- name: setEnvironment
  displayName: Escolha a esteira de QA para para deploy
  type: string
  default: dev
  values:
  - dev
  - esteira1
  - esteira2
  - preprod
  - prodlike
  - producao-master-impar
  - producao-master-par
  - producao-slave-impar
  - producao-slave-par
  - producao-background-impar
  - producao-background-par
 
#Incluir Variaveis da Library
variables:
  - name: ASDF_JDK_8
    value: "adoptopenjdk-8.0.352+8"
  - name: ASDF_JDK_11
    value: "openjdk-11.0.2"
  - name: System.debug
    value: "true"
  - group: ci.ci-gps2-resources-creds

  - name: SONARQUBE_CONNECTION_NAME
    value: VIVO_SONARQUBE
  - name: SONARQUBE_CONFIG_FILE
    value: "$(Build.SourcesDirectory)/$(Build.Repository.Name)/.azuredevops/sonar-project.properties"
  - name: SONARQUBE_PROJECTKEY
    value: br.com.vivo.gps4:app-gps-convergente
  - name: SONARQUBE_URL
    value: http://sonar.devops.redecorp.br
  - name: SONARQUBE_PROJECT_NAME
    value: $(System.TeamProject)-$(Build.Repository.Name)

  - name: PROXY_SQUID_SERVER
    value: "10.240.58.39:3128" # proxy Squid para evitar erros de timeout do proxy NetSkope.
  - name: PROXY_NSKP_SERVER
    value: "nskp.redecorp.br:8080"
  - name: PROXY_AGENT_HTTP
    value: "http://$(PROXY_SQUID_SERVER)"
  - name: PROXY_AGENT_HTTPS
    value: "http://$(PROXY_SQUID_SERVER)"
  - name: PROXY_AGENT_NO_PROXY
    value: "localhost,0.0.0.0,127.0.0.1,10.244.0.0/16,192.168.0.0/16,10.129.178.173,nexus.telefonica.com.br,acrsharedservices01.azurecr.io,appcs-azdevops-shared.azconfig.io,scm.azurewebsites.net"
  - name: PROXY_ADDL_NO_PROXY
    value: ""

stages:
- stage: gates
  displayName: Gates
  # condition: ${{ not(not(parameters.deploy)) }}
  # dependsOn:
  #   - build

  variables:
  # fortfy
  - name: FORTIFY_SSC_ENDPOINT
    value: "https://ssc-fortify.redecorp.br/ssc/"
  - name: FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT
    value: "https://scancentral-sast.redecorp.br/scancentral-ctrl"

  - name: BRANCH_NAME
    value: ${{ split(variables['Build.SourceBranch'], 'refs/heads/')[1] }}

  - name: FORTIFY_VERSION_NAME
    value: DevSecOps-${{ split(variables['Build.SourceBranch'], 'refs/heads/')[1] }}

  - name: FORTIFY_PROJECT_NAME
    value: "$(System.TeamProject)-$(Build.Repository.Name)"

  - name: FORTIFY_EXCLUSION_FILE
    value: "sast_fortify_exclude_files.json"
  - name: FORTIFY_REPOSITORY_TECH
    value: ""
  - name: FORTIFY-SSC-CLI-TOKEN
    value: ""
  - name: FORTIFY_EXCLUSIONS
    value: >-
      -targs "-exclude '**/*test*'"
      -targs "-exclude '**/*spec*/**/*'"
      -targs "-exclude '**/*xsd*/**/*'"
      -targs "-exclude '**/*xsd*'"
      -targs "-exclude '**/*groovy*'"
      -targs "-exclude '**/*groovy*/**/*'"
      -targs "-exclude '**/*stryker*'"
      -targs "-exclude '**/*stryker*/**/*'"
      -targs "-exclude '**/*html*'"
      -targs "-exclude '**/*html*/**/*'"
      -targs "-exclude '**/*json*'"
      -targs "-exclude '**/*json*/**/*'"
      -targs "-exclude '**/*Dockerfile*'"
      -targs "-exclude '**/*Dockerfile*/**/*'"
      -targs "-exclude '**/*config*'"
      -targs "-exclude '**/*config*/**/*'"
      -targs "-exclude '**/*platform*'"
      -targs "-exclude '**/*platform*/**/*'"
      -targs "-exclude '**/*pipeline*'"
      -targs "-exclude '**/*pipeline*/**/*'"
      -targs "-exclude '**/*router*'"
      -targs "-exclude '**/*router*/**/*'"
      -targs "-exclude '**/*lib*'"
      -targs "-exclude '**/*lib*/**/*'"
      -targs "-exclude '**/*certs*'"
      -targs "-exclude '**/*certs*/**/*'"
      -targs "-exclude '**/*dist*'"
      -targs "-exclude '**/*dist*/**/*'"
      -targs "-exclude '**/*yaml*'"
      -targs "-exclude '**/*yaml*/**/*'"
      -targs "-exclude '**/*docker*'"
      -targs "-exclude '**/*docker*/**/*'"
      -targs "-exclude '**/*.yml*'"
      -targs "-exclude '**/*.yml*/**/*'"
  - name: CACORP_LOCATION
    value: "$(Agent.HomeDirectory)/../../certs/CACORP.pem"

  jobs:
  - job: fortify
    displayName: Fortify
    pool: DefaultDevOpsAgents
    steps:
    - checkout: self
      fetchDepth: 1

    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, FORTIFY-SCANCENTRAL-CLIENT-TOKEN'

    - task: Base64FromVivo@4
      displayName:
      inputs:
        content: $(FORTIFY-SSC-CLI-TOKEN)
        outputVariable: FORTIFY_SSC_CLI_TOKEN_64
        isSecret: true

    # Busca o ID do projeto/versão no FORTIFY
    - task: AxiosFromVivo@4
      name: fortifyExists
      displayName: Check Project Exists
      inputs:
        sourceType: 'text'
        source: |
          var options = {
            method: 'GET',
            url: 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions',
            params: {fields: 'id,name,project', q: 'project.name:$(FORTIFY_PROJECT_NAME)'},
            headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'}
          };
        variablePrefix: 'FORTIFY_EXISTS_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: JsonParseFromVivo@4         
      displayName: Get existing info
      inputs:
        source: $(FORTIFY_EXISTS_BODY)
        sourceType: 'text'
        queries: |
          var FORTIFY_PROJECT_ID = $.data[?(@.project.name.match(/$(FORTIFY_PROJECT_NAME)/i))].project.id
          var FORTIFY_PROJECT_VERSION_ID = $.data[?(@.project.name.match(/$(FORTIFY_PROJECT_NAME)/i))].id

    - task: AxiosFromVivo@4
      name: fortifyCreate
      displayName: "Create Fortify Project/Project Version"
      condition: not(variables['FORTIFY_PROJECT_VERSION_ID'])
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'POST',
            url: 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions',
            headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'},
            data: {
              "name": "$(FORTIFY_VERSION_NAME)",
              "issueTemplateId": "Prioritized-HighRisk-Project-Template",
              "project": { 
                "name": "$(FORTIFY_PROJECT_NAME)",
                "issueTemplateId": "Prioritized-HighRisk-Project-Template"
              }
            },
          };
        variablePrefix: 'FORTIFY_CREATE_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: JsonParseFromVivo@4         
      displayName: Get created info
      condition: not(variables['FORTIFY_PROJECT_VERSION_ID'])
      inputs:
        source: $(FORTIFY_EXISTS_BODY)
        queries: |
          var FORTIFY_PROJECT_ID = $.data.project.id
          var FORTIFY_PROJECT_VERSION_ID = $.data.id

    - task: AxiosFromVivo@4
      name: fortifyAttr
      displayName: "Incluido/atualizando atributos na Versão do Projeto"
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'PUT',
            url: 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)/attributes',
            headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'},
            data: [
              {
                "attributeDefinitionId":"1",
                "values":[ { "guid": "High", "name": "High", "description": "High Business Risk. This application is critical to the primary business goals of the organization.", "inUse": true } ],
                "guid": "BusinessRisk"
              },
              {
                "attributeDefinitionId": 2,
                "values": [ { "guid": "NONE", "name": "None", "description": "There are no known legal compliance obligations", "inUse": true } ],
                "guid": "Compliance"
              },
              {
                "attributeDefinitionId": 3,
                "values": [ { "guid": "Unknown", "name": "Unknown Data", "description": "Interacts with data of an unknown classification type. Data of this type should be assumed to at least be Restricted. ", "inUse": true } ],
                "guid": "InfoClassification"
              },
              {
                "attributeDefinitionId": 4,
                "values": [
                  { "guid": "Pro", "name": "Product", "description": "Product delivery and confirmation", "inUse": true },
                  { "guid": "Sales", "name": "Sales", "description": "Customer relationship management and transaction processing", "inUse": true },
                  { "guid": "Services", "name": "Services", "description": "Customer support and service delivery improvement systems", "inUse": true }
                ],
                "guid": "ProjectClassification"
              },
              {
                "attributeDefinitionId": 5,
                "values": [ { "guid": "New", "name": "New", "description": "This application has just begun development and has not had a production release.", "inUse": true } ],
                "guid": "DevPhase"
              },
              {
                "attributeDefinitionId": 6,
                "values": [ { "guid": "Partial", "name": "Partially Outsourced", "description": "Development duties partially outsourced. Design, management, development, and support duties are split between internal employees and an outsourced resource.", "inUse": true } ],
                "guid": "DevStrategy"
              },
              {
                "attributeDefinitionId": 7,
                "values": [ { "guid": "externalpublicnetwork", "name": "External Public Network Access Required", "description": "Interaction can occur from an untrusted public network (e.g. the public internet).", "inUse": true } ],
                "guid": "Accessibility"
              },
              {
                "attributeDefinitionId": 8,
                "values": [ { "guid": "ApplicationComponent", "name": "Application Component", "description": "A module which performs a business function that is not a self contained application", "inUse": true } ],
                "guid": "ProjectType"
              },
              {
                "attributeDefinitionId": 9,
                "values": [ { "guid": "NA", "name": "Platform Neutral", "description": "Application does not rely on any operating system", "inUse": true } ],
                "guid": "TargetPlatform"
              },
              {
                "attributeDefinitionId": 10,
                "values": [ { "guid": "API", "name": "Programmatic API", "description": "Logic is only available through programmatic API access.", "inUse": true } ],
                "guid": "Interfaces"
              },
              {
                "attributeDefinitionId": 12,
                "values": [ { "guid": "Custom", "name": "Custom", "description": "", "inUse": true } ],
                "guid": "AuthenticationSystem"
              },
              {
                "attributeDefinitionId": 14,
                "values": [ { "guid": "Operations", "name": "Operations", "description": "Operations business unit", "inUse": true } ],
                "guid": "BusinessUnit"
              },
              {
                "attributeDefinitionId": 15,
                "values": [ { "guid": "Retail", "name": "Retail", "description": "Retail industry", "inUse": true } ],
                "guid": "Industry"
              },
              {
                "attributeDefinitionId": 16,
                "values": [ { "guid": "Americas", "name": "Americas", "description": "The Americas region", "inUse": true } ],
                "guid": "Region"
              }
            ]
          };
        variablePrefix: 'FORTIFY_ATTR_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: AxiosFromVivo@4
      name: fortifyCommit
      displayName: "Atualizando campo 'committed' da Versão do Projeto"
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'PUT',
            url: 'https://ssc-fortify.redecorp.br/ssc/api/v1/projectVersions/$(FORTIFY_PROJECT_VERSION_ID)',
            headers: {Authorization: 'FortifyToken $(FORTIFY_SSC_CLI_TOKEN_64)'},
            data: {"committed": true},
          };
        variablePrefix: 'FORTIFY_COMMIT_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: FortifyScanCentralSAST@7
      displayName: "Fortify SAST Scan"
      inputs:
        scanCentralCtrlUrl: https://scancentral-sast.redecorp.br/scancentral-ctrl
        scanCentralClientToken: $(FORTIFY-SCANCENTRAL-CLIENT-TOKEN)
        sscUrl: https://ssc-fortify.redecorp.br/ssc/
        sscCiToken: $(FORTIFY-SSC-CLI-TOKEN)
        uploadToSSC: true
        buildFailureCriteria: "[fortify priority order]:critical"
        applicationName: $(FORTIFY_PROJECT_NAME)
        applicationVersion: $(FORTIFY_VERSION_NAME)
        buildTool: none # must be 'none' for skipBuild
        buildCommand: "$(FORTIFY_EXCLUSIONS)"
        block: true
        skipBuild: true # this param doesn't matter
        outputFile: $(FORTIFY_PROJECT_NAME)-fortify.fpr
        logFile: $(FORTIFY_PROJECT_NAME)-fortify.log
        overwrite: true
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)
        ASDF_JAVA_VERSION: "openjdk-11.0.2"

    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Staging Results'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: $(build.sourcesdirectory)
        TargetFolder: $(Build.ArtifactStagingDirectory)
        Contents: |
          *-fortify.*
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: false

    - task: PublishPipelineArtifact@1
      displayName: "Publish Results"
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: "fortify"
