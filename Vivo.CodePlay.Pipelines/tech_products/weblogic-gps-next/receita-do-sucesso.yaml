# TODO: @deprecated!

parameters:
- name: skipTest
  displayName: Nao Testar (skipTest)
  type: boolean
  default: true
  
- name: deploy
  displayName: Publicar (Deploy)
  type: boolean
  default: False

- name: useMavenCache
  displayName: Usar cache do maven
  type: boolean
  default: True



# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:

#Incluir Variaveis da Library
variables:
  - name: JAVA_VERSION
    value: "adoptopenjdk-8.0.352+8"
  - name: System.debug
    value: "true"
  - name: USE_MAVEN_CACHE
    ${{ if not(not(parameters.useMavenCache)) }}:
      value: ''
    ${{ if not(parameters.useMavenCache) }}:
      value: '-U'  
  
stages:
- stage: build
  displayName: Build
  jobs:
  - job: package
    displayName: Build, Test and Pack
    pool: DefaultDevOpsAgents
    steps:

    - checkout: self

    - task: XmlParseFromVivo@4
      displayName: Get pom.xml info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/pom.xml
        jpaths: |
          var POM_XML_VERSION      =  .project.version._text
          var POM_XML_JAVA_VERSION =  .project.properties["java.version"]._text
          var POM_XML_MODULES      =  .project..modules._text
          var POM_XML_ARTIFACT_ID  =  .project.artifactId._text
          var POM_XML_GROUP_ID     =  .project.groupId._text

    - task: SemverIncrementCustomFromVivo@5
      displayName: Semver Increment 'patch'
      name: new_version
      continueOnError: false
      inputs:
        currentversion: $(POM_XML_VERSION)
        outputVariableName: "NEW_VERSION"
        template: "${NEW_COERCED_VERSION}-${BUILD_SOURCEBRANCHNAME}-${(BUILD_SOURCEVERSION).substring(0,6)}"
        releaseType: "patch"
    
    # https://dev.azure.com/telefonica-vivo-brasil/MIGR-Gps2/_library?itemType=SecureFiles
    - task: DownloadSecureFile@1      
      displayName: 'settings-gps2.xml'
      name: GPS2_NEXUS_SETTINGS
      continueOnError: false
      inputs:
        actionOnNoFiles: 'error'
        secureFile: settings-gps2.xml

    - task: Maven@3
      displayName: "Maven versions:set"
      env:
        ASDF_JAVA_VERSION: $(JAVA_VERSION)
      inputs:
          options: >
            -Dmaven.test.skip=true 
            -DnewVersion=$(new_version.NEW_VERSION)
          mavenPomFile: $(Build.SourcesDirectory)/pom.xml
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          goals: 'versions:set'

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, NEXUS-DEFAULT-USR, NEXUS-DEFAULT-PSW'
        RunAsPreJob: true

    - task: Maven@3
      env:
        PUB_CREDENTIAL_USR: $(NEXUS-DEPS-USR)
        PUB_CREDENTIAL_PSW: $(NEXUS-DEPS-PSW)
        DEPS_CREDENTIAL_USR: $(NEXUS-DEPS-USR)
        DEPS_CREDENTIAL_PSW: $(NEXUS-DEPS-PSW)
        ASDF_JAVA_VERSION: $(JAVA_VERSION)
      inputs:
          options: > 
            -Dmaven.test.skip=${{ not(not(parameters.skipTest)) }}
            -s $(GPS2_NEXUS_SETTINGS.secureFilePath)
            $(USE_MAVEN_CACHE)
            
          mavenPomFile: $(Build.SourcesDirectory)/pom.xml
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          publishJUnitResults: ${{ not(not(parameters.skipTest)) }}
          testResultsFiles: $(Build.SourcesDirectory)/**/surefire-reports/TEST-*.xml
          goals: 'package'

    ## -> Copy files for staging area
    - task: CopyFiles@2
      name: t_copy_file
      displayName: 'Copy to Staging Directory'
      condition: succeeded()
      continueOnError: false
      inputs:
        SourceFolder: '$(build.sourcesdirectory)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: |
          **/target/*.*ar
          **/target/*.ejb
          pom.xml
        CleanTargetFolder: true
        OverWrite: true
        flattenFolders: true

    ## -> Compress artifacts into tar. This allows to use less space and to be used in other stages, jobs or tasks.           
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      condition: succeeded()
      continueOnError: false
      inputs:
        ArtifactName: bin
        # StoreAsTar: true

- stage: gates
  displayName: Gates
  # condition: ${{ not(not(parameters.deploy)) }}
  dependsOn:
    - build
  jobs:
  - job: sonar
    displayName: Sonar
    pool: DefaultDevOpsAgents
    steps:
    - task: AzureKeyVault@2  
      displayName: 'Getting AKV credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5  
      inputs:    
        azureSubscription: DevOpsSharedResources    
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'SONARQUBE-TOKEN'

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: bin
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)



- stage: deploy
  displayName: Deploy
  condition: ${{ not(not(parameters.deploy)) }}
  dependsOn:
    - build
  jobs:
  - job: deploy_on_nexus
    displayName: Deploy on Nexus
    pool: DefaultDevOpsAgents
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        artifactName: bin
        cleanDestinationFolder: false
        extractTars: true
        parallelizationLimit: 8
        downloadPath: $(System.ArtifactsDirectory)

    - task: XmlParseFromVivo@4
      displayName: New pom.xml info
      name: pom_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/**/pom.xml
        jpaths: |
          var POM_XML_VERSION      =  .project.version._text
          var POM_XML_JAVA_VERSION =  .project.properties["java.version"]._text
          var POM_XML_MODULES      =  .project..modules._text
          var POM_XML_ARTIFACT_ID  =  .project.artifactId._text
          var POM_XML_GROUP_ID     =  .project.groupId._text
        
    - task: NexusUploadMvnFromVivo@5
      displayName: Upload maven artifact
      inputs:
        nexusEndpoint: "Nexus Asis"
        nexusRepoMaven: "gps2-mvn"
        groupId: $(POM_XML_GROUP_ID) # br.com.vivo.gps4
        artifactId: wizard-next-ear
        artifactVersion: $(POM_XML_VERSION)
        artifactExtension: "ear"
        artifactFile: $(System.ArtifactsDirectory)/bin/wizard-next-ear*.ear
