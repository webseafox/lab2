parameters:
  - name: packageName
  - name: packageVersion

stages:
  - stage: ci_publish_package
    displayName: "CI - Publish"
    pool:
      name: $(AGENT_POOL_CI)
    dependsOn:
      - ci_security
    condition: succeeded()

    jobs:
      - job: publish
        displayName: "Publish"
        steps:
          ## -> Download Artifacts
          - download: none

          - task: DownloadPipelineArtifact@1
            displayName: Download Artifact
            inputs:
              buildType: "current"
              downloadPath: "$(Build.ArtifactStagingDirectory)"

          - task: UniversalPackages@0
            displayName: Publish a Universal Package
            inputs:
              command: publish
              publishDirectory: "$(Build.ArtifactStagingDirectory)"
              feedsToUsePublish: "internal"
              vstsFeedPublish: "3d53bc62-8749-4931-ae46-a443b73bc87a"
              vstsFeedPackagePublish: "${{ parameters.packageName }}"
              packagePublishDescription: "Pacote externo de implantação de ajustes no GEDOC."
              versionOption: "custom"
              versionPublish: "${{ parameters.packageVersion }}"
