## -> Parameters:
parameters:
  - name: environment
  - name: packageName
  - name: packageVersion

stages:
  ## -> CI
  ## -> Initialize enviroment
  - template: /tech_products/gdoc/initializers/default_initializer.yml

  ## -> Ask for Package to be uploaded
  - template: /tech_products/gdoc/templates/ci/ci_upload_external_package.yml
    parameters:
      packageName: "${{ parameters.packageName }}"

  ## -> Initialize Gates enviroment
  - template: /tech_products/gdoc/initializers/gates_initializer.yml

  ## -> Security Gate
  - template: /tech_products/gdoc/templates/ci/ci_security.yml
    parameters:
      packageName: "${{ parameters.packageName }}"

  ## -> Publish Build for CI
  - template: /tech_products/gdoc/templates/ci/ci_publish_package.yml
    parameters:
      packageName: "${{ parameters.packageName }}"
      packageVersion: "${{ parameters.packageVersion }}"

