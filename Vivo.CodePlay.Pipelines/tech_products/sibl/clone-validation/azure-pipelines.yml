                  metrics_json=""
                  sep=""

                  for i in "${!metrics[@]}"; do
                    name="${metrics[$i]}"
                    dev="${dev_values[$i]}"
                    if ! [[ "$dev" =~ ^[0-9]+$ ]]; then
                      echo "🚫 Resultado inválido para ${name}: DEV='${dev}'"
                      exit 1
                    fi
                    metrics_json="${metrics_json}${sep}\"${name}\":${dev}"
                    sep=","
                  done
                  baseline_json=""
                  comparison_json=""
                  baseline_provided="false"
