                  required_vars="SIEBEL_SERVER_IP_DEV_SECONDARY SIEBEL_SERVER_USER_DEV SIEBEL_SERVER_PASS_DEV SIEBEL_DATABASE_USER_READONLY SIEBEL_DATABASE_PASSWORD_READONLY SIEBEL_DATABASE_HOST_DEV5 SIEBEL_DATABASE_PORT SIEBEL_DATABASE_SERVICE"
                  missing=0
