          - job: Obrigatorio_DEV7
            displayName: '⚙️ DEV7 - Passos Obrigatórios (1-9)'
            variables:
              - group: vg-sibl-env-dev-esteira2
            steps:
              - script: |
                  set -e
                  echo "Validando contrato para servidor e banco do ambiente DEV7..."
                  required_vars="SIEBEL_SERVER_IP_DEV_PRIMARY SIEBEL_SERVER_USER_DEV SIEBEL_SERVER_PASS_DEV SIEBEL_DATABASE_USER_READONLY SIEBEL_DATABASE_PASSWORD_READONLY SIEBEL_DATABASE_HOST_DEV7 SIEBEL_DATABASE_PORT SIEBEL_DATABASE_SERVICE"
                  missing=0
                  for v in $required_vars; do
                    eval "val=\${$v:-}"
                    if [ -z "$val" ]; then
                      echo "✗ Variável ausente: $v"
                      missing=1
                    else
                      echo "✓ $v definido"
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "🚫 Falha de contrato: valide o Variable Group da esteira com servidor único e variáveis de banco."
                    exit 1
                  fi
                displayName: 'Validar Contrato DEV7 (servidor + DB)'
              - script: |
                  set -euo pipefail
                  # ⚡ ESTRATÉGIA 5: Logging Detalhado com Diagnóstico
                  
                  if [ "$(DRY_RUN_MODE)" = "true" ]; then
                    echo "🧪 DRY-RUN ativo: pulando validação remota SSH + SQL*Plus (DEV7)."
                    exit 0
                  fi

                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "🚫 SSH não disponível no agente" >&2
                    exit 1
                  fi
                  if ! command -v sshpass >/dev/null 2>&1; then
                    echo "🚫 sshpass não disponível no agente" >&2
                    exit 1
                  fi

                  server_user="${SIEBEL_SERVER_USER_DEV:-}"
                  server_ip_raw="${SIEBEL_SERVER_IP_DEV_PRIMARY:-}"
                  server_pass="${SIEBEL_SERVER_PASS_DEV:-}"
                  if [ -z "$server_user" ] || [ -z "$server_ip_raw" ]; then
                    echo "🚫 Variáveis SIEBEL_SERVER_USER_DEV/SIEBEL_SERVER_IP_DEV_PRIMARY ausentes" >&2
                    exit 1
                  fi
                  if [ -z "$server_pass" ]; then
                    echo "🚫 Variável SIEBEL_SERVER_PASS_DEV ausente" >&2
                    exit 1
                  fi

                  server_ip="${server_ip_raw}"
                  echo "[SSH] target='${server_user}@${server_ip}'" >&2
                  oracle_password="${ORACLE_PASSWORD:-}"
                  if [ -z "$oracle_password" ]; then
                    oracle_password="${SIEBEL_DATABASE_PASSWORD_READONLY:-}"
                  fi
                  if [ -z "$oracle_password" ]; then
                    echo "🚫 Falha de autenticação Oracle: variável secreta ORACLE_PASSWORD não definida" >&2
                    exit 1
                  fi

                  db_user="${SIEBEL_DATABASE_USER_READONLY:-}"
                  db_host="${SIEBEL_DATABASE_HOST_DEV7:-${SIEBEL_DATABASE_HOST_DEV_SECONDARY:-}}"
                  db_port="${SIEBEL_DATABASE_PORT_DEV7:-${SIEBEL_DATABASE_PORT:-}}"
                  db_service="${SIEBEL_DATABASE_SERVICE_DEV7:-${SIEBEL_DATABASE_SERVICE:-}}"

                  echo "=== DIAGNÓSTICO DEV7: VALIDAÇÃO SSH + SQL*Plus ===" >&2
                  
                  # Teste 1: Conectividade SSH simples
                  echo "" >&2
                  echo "[TESTE 1] Conectividade SSH simples para ${server_user}@${server_ip}..." >&2
                  SSHPASS="$server_pass" sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=15 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" "hostname" 2>&1 || { echo "❌ SSH Test 1 FALHOU" >&2; exit 1; }
                  echo "✅ Teste 1 OK" >&2

                  # Teste 2: Verificar SQLPlus no servidor (procurar em múltiplos paths)
                  echo "" >&2
                  echo "[TESTE 2] Verificar disponibilidade de sqlplus no servidor..." >&2
                  SSHPASS="$server_pass" timeout 30 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=20 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "bash -lc 'which sqlplus && sqlplus -v'" 2>&1 || { echo "❌ SQLPlus Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 2 OK" >&2

                  # Teste 3: Teste TNS simples
                  echo "" >&2
                  echo "[TESTE 3] Teste TNS conexão ao banco DEV (${db_host}:${db_port}/${db_service})..." >&2
