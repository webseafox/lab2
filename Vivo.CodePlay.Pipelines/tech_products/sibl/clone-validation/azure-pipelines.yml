                  DH="${SIEBEL_DATABASE_HOST_DEV8:-${SIEBEL_DATABASE_HOST_DEV:-}}"; DP="${SIEBEL_DATABASE_PORT_DEV8:-${SIEBEL_DATABASE_PORT:-}}"; DS="${SIEBEL_DATABASE_SERVICE_DEV8:-${SIEBEL_DATABASE_SERVICE:-}}"
                  SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=60 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1"
                  RESULT=$({ printf '%s\n' "WHENEVER SQLERROR EXIT FAILURE" "CONNECT ${DU}/\"${OP}\"@//${DH}:${DP}/${DS}" \
                    "SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF LINESIZE 200" \
                    "UPDATE SIEBEL.S_SYS_PREF SET VAL = 'TRUE' WHERE SYS_PREF_CD = 'Runtime Scripts System Access';" \
                    "SELECT 'SYSPREF|'||VAL FROM SIEBEL.S_SYS_PREF WHERE SYS_PREF_CD = 'Runtime Scripts System Access';" \
                    "EXIT;"
                  } | SSHPASS="$SP" timeout 120 sshpass -e ssh $SSH_OPTS "${SU}@${SI}" "bash -lc 'timeout 90 sqlplus -s /nolog'" 2>&1)
                  RC=$?
                  EM=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s)*1000 )))
                  ST=$([ "$RC" -eq 0 ] && echo "SUCCESS" || echo "FAILED")
                  SYSPREF_LINE=$(echo "$RESULT" | tr -d '\r' | awk -F'|' '/^SYSPREF\|/ {print $0}' | tail -n1)
                  SYSPREF_VAL=$(echo "$SYSPREF_LINE" | awk -F'|' '{print $2}' | tr -d '[:space:]')
                  if [ "$SYSPREF_VAL" = "TRUE" ]; then
                    SYSPREF_OK="UPDATED"
                  else
                    SYSPREF_OK="NOT_CONFIRMED"
                  fi
                  echo "{\"env_id\":\"${ENV_ID}\",\"step\":${STEP},\"step_name\":\"Atualizar SysPref\",\"status\":\"${ST}\",\"duration_ms\":$((EM-SM)),\"results\":{\"syspref_value\":\"${SYSPREF_VAL:-N/A}\",\"syspref_status\":\"${SYSPREF_OK}\"},\"timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > "${DD}/${ENV_ID}_step0${STEP}.json"
                  echo "$([ \"$ST\" = 'SUCCESS' ] && echo '✅' || echo '❌') Passo ${STEP} - ${ENV_ID}: SysPref=${SYSPREF_VAL:-N/A} [${SYSPREF_OK}] ($((EM-SM))ms)"
                displayName: '⚙️ Passo 9 - Atualizar SysPref Runtime Scripts (DEV8)'
                continueOnError: true

              - task: PublishBuildArtifacts@1
                inputs:
                  PathtoPublish: '$(Build.ArtifactStagingDirectory)/data'
                  ArtifactName: 'clone-validation-dev8-data'
                  publishLocation: 'Container'
                displayName: '📤 Publicar evidências DEV8'
                condition: always()

  - stage: Evidencia
    displayName: '📊 Evidencia - Consolidar Resultados'
    pool:
      name: '$(CLONE_VALIDATION_POOL)'
    # Propósito: consolidar reports e evidências de todos os ambientes processados
    dependsOn: ExecutarObrigatorio
    condition: always()
    
    jobs:
      - job: PublicarArtefatos
        displayName: 'Publicar artefatos e evidências'
        steps:
          
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'all'
              downloadPath: '$(Pipeline.Workspace)'
            displayName: '📥 Baixar Todos os Artifacts'
            condition: always()
          
          - script: |
              echo "##################################"
              echo "Consolidando evidências..."
              echo "##################################"
              
              if [ -d "$(REPORTS_DIR)" ]; then
                echo "✓ Diretório de artefatos encontrado: $(REPORTS_DIR)"
                find "$(REPORTS_DIR)" -type f \( -name "*.json" -o -name "*.md" \) | head -20
              else
                echo "⚠️ Nenhum artefato gerado"
                mkdir -p "$(REPORTS_DIR)"
                echo "dry-run: sem evidências consolidadas neste job" > "$(REPORTS_DIR)/README.md"
              fi
            displayName: 'Verificar Artefatos'
            continueOnError: true

          - script: |
              set -e
              python3 - <<'PY'
              import json
              from datetime import datetime, timezone
              from pathlib import Path

              reports_dir = Path('$(REPORTS_DIR)')
              reports_dir.mkdir(parents=True, exist_ok=True)

              entries = []
              for evidence_file in sorted(reports_dir.rglob('evidence.json')):
                  try:
                      data = json.loads(evidence_file.read_text(encoding='utf-8'))
                  except Exception:
                      continue

                  metadata = data.get('metadata', {})
                  entries.append({
                      'env_id': metadata.get('env_id', 'UNKNOWN'),
                      'status': metadata.get('overall_status', 'UNKNOWN'),
                      'duration_ms': metadata.get('total_duration_ms', 0),
                      'relative_path': evidence_file.as_posix()
                  })

              execution_manifest = {
                  'schema_version': '1.0',
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'pipeline': {
                      'definition_name': '$(Build.DefinitionName)',
                      'build_id': '$(Build.BuildId)',
                      'build_number': '$(Build.BuildNumber)',
                      'source_branch': '$(Build.SourceBranch)',
                      'source_version': '$(Build.SourceVersion)'
                  },
                  'execution': {
                      'environment': '${{ parameters.environment }}',
                      'dry_run': '$(DRY_RUN_MODE)',
                      'skip_optional_steps': '$(SKIP_OPTIONAL_MODE)'
                  },
                  'evidence_summary': {
                      'total_reports': len(entries),
                      'reports': entries
                  }
              }

              provenance = {
                  'schema_version': '1.0',
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'build': {
                      'build_id': '$(Build.BuildId)',
                      'build_number': '$(Build.BuildNumber)',
                      'pipeline_definition': '$(Build.DefinitionName)'
                  },
                  'source': {
                      'repository': '$(Build.Repository.Name)',
                      'branch': '$(Build.SourceBranch)',
                      'commit': '$(Build.SourceVersion)'
                  },
                  'artifact': {
                      'name': 'clone-validation-reports',
                      'reports_directory': reports_dir.as_posix(),
                      'package_version': '$(PACKAGE_VERSION)'
                  }
              }

              (reports_dir / 'execution_manifest.json').write_text(
                  json.dumps(execution_manifest, ensure_ascii=True, indent=2),
                  encoding='utf-8'
              )
              (reports_dir / 'provenance.json').write_text(
                  json.dumps(provenance, ensure_ascii=True, indent=2),
                  encoding='utf-8'
              )

              print('Manifesto gerado em:', (reports_dir / 'execution_manifest.json').as_posix())
              print('Proveniencia gerada em:', (reports_dir / 'provenance.json').as_posix())
              PY
            displayName: 'Gerar Manifesto de Execucao e Procedencia'
            continueOnError: true

          - script: |
              echo "Preparando diretórios para cópia/publicação de artefatos..."
              mkdir -p "$(REPORTS_DIR)"
            displayName: 'Preparar Diretórios de Artefatos'
            continueOnError: true
          
          - script: |
              set +e
              REPORTS_DIR="$(REPORTS_DIR)"
              DATA_DIR="$(Build.ArtifactStagingDirectory)/data"
              
              mkdir -p "$REPORTS_DIR"
              mkdir -p "$DATA_DIR"
              
              # Baixar artifacts de todos os DEV jobs
              echo "📥 Baixando artifacts de DEV jobs..."
              for env in dev2 dev3 dev5 dev7 dev8; do
                artifact_dir="$(Pipeline.Workspace)/clone-validation-${env}-data"
                if [ -d "$artifact_dir" ]; then
                  echo "  ✓ Encontrado: $artifact_dir"
                  cp -r "$artifact_dir/"* "$DATA_DIR/" 2>/dev/null || true
                else
                  echo "  ⊘ Não encontrado: $artifact_dir"
                fi
              done
              echo ""
              
              # Verificar JSONs disponíveis
              echo "📋 JSONs disponíveis:"
              find "$DATA_DIR" -name "*_step*.json" -type f 2>/dev/null | sort
              echo ""
              
              # Nomes dos passos
              declare -A STEP_NAMES
              STEP_NAMES[1]="Volumetria"
              STEP_NAMES[15]="Conceder DROP ANY TABLE"
              STEP_NAMES[2]="Limpar Tabelas"
              STEP_NAMES[3]="Cache LOV (Update)"
              STEP_NAMES[4]="Administração de Cache do Produto"
              STEP_NAMES[5]="Desbloquear Objetos"
              STEP_NAMES[6]="Restaurar Permissões"
              STEP_NAMES[7]="Apontamentos"
              STEP_NAMES[8]="Criar Usuários"
              STEP_NAMES[9]="Atualizar SysPref"

              BASELINE_INPUT_RAW="$(BASELINE_VOLUMETRY)"
              BASELINE_INPUT=$(echo "$BASELINE_INPUT_RAW" | tr -d '[:space:]')
              BASELINE_ENABLED="false"
              if [ -n "$BASELINE_INPUT" ]; then
                BASELINE_ENABLED="true"
                IFS='|' read -r BASE_CONTAS BASE_PRODUTOS BASE_MAPA BASE_APPLETS BASE_BCS BASE_IOS BASE_DUP <<< "$BASELINE_INPUT"
              fi
              
              # Coletar envs únicos a partir dos JSONs
              declare -a ENVS_FOUND
              declare -a ENVS_UNIQUE
              if [ -d "$DATA_DIR" ]; then
                while IFS= read -r jf; do
                  eid=$(grep -o '"env_id":"[^"]*"' "$jf" | cut -d'"' -f4)
                  [ -n "$eid" ] && ENVS_FOUND+=("$eid")
                done < <(find "$DATA_DIR" -name "*_step*.json" -type f)
                ENVS_UNIQUE=($(printf '%s\n' "${ENVS_FOUND[@]}" | sort -u))
              fi

              # Fallback: quando os artifacts por ambiente não estiverem disponíveis,
              # usa os ambientes esperados da esteira para exibir o fluxo completo.
              declare -a EXPECTED_ENVS
              case "${{ parameters.environment }}" in
                esteira1)
                  EXPECTED_ENVS=("DEV2" "DEV3")
                  ;;
                esteira2)
                  EXPECTED_ENVS=("DEV5" "DEV7")
                  ;;
                prodlike)
                  EXPECTED_ENVS=("DEV8")
                  ;;
                *)
                  EXPECTED_ENVS=()
                  ;;
              esac

              if [ "${#ENVS_UNIQUE[@]}" -eq 0 ] && [ "${#EXPECTED_ENVS[@]}" -gt 0 ]; then
                ENVS_UNIQUE=("${EXPECTED_ENVS[@]}")
                echo "⚠️  Nenhum JSON de passo encontrado via artifacts por ambiente."
                echo "   Exibindo fluxo esperado para: ${ENVS_UNIQUE[*]}"
              fi
              
              # Criar audit_summary.txt consolidado com todos os passos por ambiente
              {
                echo ""
                echo "╔════════════════════════════════════════════════════════════════════════════╗"
                echo "║          SIEBEL CLONE VALIDATION - RELATÓRIO COMPLETO DE AUDITORIA        ║"
                echo "╚════════════════════════════════════════════════════════════════════════════╝"
                echo ""
                echo "  Pipeline     : $(Build.DefinitionName)"
                echo "  Build ID     : $(Build.BuildId)"
                echo "  Execução     : $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
                echo "  Esteira      : ${{ parameters.environment }}"
                echo "  Dry-Run      : $(DRY_RUN_MODE)"
                echo ""
                echo "════════════════════════════════════════════════════════════════════════════"
                
                total_envs=0
                total_ok=0
                total_nok=0
                
                for env_id in "${ENVS_UNIQUE[@]}"; do
                  # Coletar info do step01 (tem server_ip e database)
                  step01_file="$DATA_DIR/${env_id}_step01.json"
                  if [ -f "$step01_file" ]; then
                    env_name=$(grep -o '"env_name":"[^"]*"' "$step01_file" | cut -d'"' -f4)
                    server_ip=$(grep -o '"server_ip":"[^"]*"' "$step01_file" | cut -d'"' -f4)
                    database=$(grep -o '"database":"[^"]*"' "$step01_file" | cut -d'"' -f4)
                  else
                    env_name="$env_id"
                    server_ip="N/A"
                    database="N/A"
                  fi
                  
                  echo ""
                  echo "┌─ AMBIENTE: $env_id - $env_name"
                  echo "│  Servidor : $server_ip"
                  echo "│  Database : $database"
                  echo "│"
                  
                  env_ok=0
                  env_nok=0
                  env_skip=0
                  env_duration=0
                  
                  for step_num in 1 15 2 3 4 5 6 7 8 9; do
                    if [ "$step_num" -eq 15 ]; then
                      step_file=$(find "$DATA_DIR" -name "${env_id}_step15.json" 2>/dev/null | head -1)
                    else
                      step_file=$(find "$DATA_DIR" -name "${env_id}_step0${step_num}.json" 2>/dev/null | head -1)
                    fi
                    
                    if [ -z "$step_file" ] || [ ! -f "$step_file" ]; then
                      if [ "$(DRY_RUN_MODE)" = "true" ]; then
                        step_name="${STEP_NAMES[$step_num]:-Passo ${step_num}}"
                        case "$step_num" in
                          15)
                            status="SKIPPED_DRYRUN"
                            icon="⏭️ "
                            ((env_skip++))
                            ;;
                          2|3|5|6|7|8)
                            status="SKIPPED_DRYRUN"
                            icon="⏭️ "
                            ((env_skip++))
                            ;;
                          4|9)
                            status="READ_EXECUTION_NOT_COLLECTED"
                            icon="⚠️ "
                            ;;
                          1)
                            status="DRYRUN_VALIDATION_ONLY"
                            icon="🧪"
                            ;;
                          *)
                            status="NOT_EXECUTED"
                            icon="⬜"
                            ;;
                        esac
                        if [ $step_num -eq 9 ]; then
                          PREFIX="└─"
                        else
                          PREFIX="├─"
                        fi
                        step_label="$step_num"
                        [ "$step_num" -eq 15 ] && step_label="1.5"
                        printf "│  %s Passo %s - %-30s : %s %-26s (%s)\n" "$PREFIX" "$step_label" "$step_name" "$icon" "$status" "sem artifact"
                      else
                        step_label="$step_num"
                        [ "$step_num" -eq 15 ] && step_label="1.5"
                        ((env_skip++))
                        echo "│  ├─ Passo ${step_label} - ${STEP_NAMES[$step_num]:-Passo ${step_num}} : ⚠️ NÃO COLETADO (artifact ausente)"
                      fi
                      continue
                    fi
                    
                    status=$(grep -o '"status":"[^"]*"' "$step_file" | cut -d'"' -f4)
                    duration=$(grep -o '"duration_ms":[0-9]*' "$step_file" | cut -d':' -f2)
                    step_name=$(grep -o '"step_name":"[^"]*"' "$step_file" | cut -d'"' -f4)
                    [ -z "$step_name" ] && step_name="${STEP_NAMES[$step_num]:-Passo ${step_num}}"
                    [ -z "$duration" ] && duration=0
                    
                    case "$status" in
                      SUCCESS)
                        icon="✅"
                        ((env_ok++))
                        ;;
                      SKIPPED_DRYRUN)
                        icon="⏭️ "
                        ((env_skip++))
                        ;;
                      FAILED)
                        icon="❌"
                        ((env_nok++))
                        ;;
                      *)
                        icon="⚠️ "
                        ;;
                    esac
                    
                    ((env_duration += duration))
                    
                    # Linha principal do passo
                    if [ $step_num -eq 9 ]; then
                      PREFIX="└─"
                    else
                      PREFIX="├─"
                    fi
                    
                    step_label="$step_num"
                    [ "$step_num" -eq 15 ] && step_label="1.5"
                    printf "│  %s Passo %s - %-30s : %s %-15s (%dms)\n" "$PREFIX" "$step_label" "$step_name" "$icon" "$status" "$duration"
                    
                    # Exibir SysPref value para Passo 9
                    if [ "$step_num" -eq 9 ]; then
                      sp_val=$(grep -o '"syspref_value":"[^"]*"' "$step_file" | cut -d'"' -f4)
                      sp_ok=$(grep -o '"syspref_status":"[^"]*"' "$step_file" | cut -d'"' -f4)
                      if [ -n "$sp_val" ]; then
                        printf "│     └─  Runtime Scripts System Access = %-6s [%s]\n" "$sp_val" "$sp_ok"
                      fi
                    fi
                    
                    # Exibir cache value para Passo 4
                    if [ "$step_num" -eq 4 ] && [ "$status" = "SUCCESS" ]; then
                      cv=$(grep -o '"cache_server_value":"[^"]*"' "$step_file" | cut -d'"' -f4)
                      [ -n "$cv" ] && printf "│     └─  Cache Server = %s\n" "$cv"
                    fi
                  done
                  
                  echo "│"
                  
                  # Status summary do ambiente
                  env_total_steps=$((env_ok + env_nok + env_skip))
                  if [ "$env_nok" -gt 0 ]; then
                    env_status="❌ FALHA"
                    ((total_nok++))
                  else
                    env_status="✅ OK"
                    ((total_ok++))
                  fi
                  ((total_envs++))
                  
                  printf "└─ Resumo: %s | Passos: %d OK / %d FALHA / %d SKIPPED | Duração: %ds\n" \
                    "$env_status" "$env_ok" "$env_nok" "$env_skip" "$((env_duration / 1000))"
                  echo ""
                done

                if [ "$BASELINE_ENABLED" = "true" ] && [ "$(DRY_RUN_MODE)" != "true" ]; then
                  echo ""
                  echo "════════════════════════════════════════════════════════════════════════════"
                  echo "COMPARAÇÃO VOLUMETRIA - PARÂMETRO"
                  echo "════════════════════════════════════════════════════════════════════════════"
                  echo ""

                  metric_names=("Contas" "Produtos" "Mapas Dados" "Applets" "Business Components" "Integration Objects" "Prod. Duplicados")
                  metric_keys=("qtd_contas" "qtd_produtos" "qtd_mapa_dados" "qtd_applets" "qtd_bcs" "qtd_ios" "qtd_duplicidade_produto")
                  base_values=("$BASE_CONTAS" "$BASE_PRODUTOS" "$BASE_MAPA" "$BASE_APPLETS" "$BASE_BCS" "$BASE_IOS" "$BASE_DUP")

                  if [ "${{ parameters.environment }}" = "prodlike" ]; then
                    f1="$DATA_DIR/DEV8_step01.json"
                    if [ -f "$f1" ]; then
                      echo "  DEV8 | PARAMETRO | DIFERENCA"
                      for i in "${!metric_keys[@]}"; do
                        key="${metric_keys[$i]}"
                        label="${metric_names[$i]}"
                        base="${base_values[$i]}"
                        dev=$(grep -o "\"${key}\":[0-9]*" "$f1" | head -1 | cut -d':' -f2)
                        [ -z "$dev" ] && dev=0
                        diff=$((dev-base))
                        printf "  %-23s : %-10s | %-10s | %+d\n" "$label" "$dev" "$base" "$diff"
                      done
                    fi
                  else
                    if [ "${{ parameters.environment }}" = "esteira1" ]; then
                      env_a="DEV2"
                      env_b="DEV3"
                    else
                      env_a="DEV5"
                      env_b="DEV7"
                    fi

                    f1="$DATA_DIR/${env_a}_step01.json"
                    f2="$DATA_DIR/${env_b}_step01.json"
                    if [ -f "$f1" ] && [ -f "$f2" ]; then
                      echo "  ${env_a} | ${env_b} | PARAMETRO | DIF_${env_a} | DIF_${env_b}"
                      for i in "${!metric_keys[@]}"; do
                        key="${metric_keys[$i]}"
                        label="${metric_names[$i]}"
                        base="${base_values[$i]}"
                        d1=$(grep -o "\"${key}\":[0-9]*" "$f1" | head -1 | cut -d':' -f2)
                        d2=$(grep -o "\"${key}\":[0-9]*" "$f2" | head -1 | cut -d':' -f2)
                        [ -z "$d1" ] && d1=0
                        [ -z "$d2" ] && d2=0
                        diff1=$((d1-base))
                        diff2=$((d2-base))
                        printf "  %-23s : %-10s | %-10s | %-10s | %+d | %+d\n" "$label" "$d1" "$d2" "$base" "$diff1" "$diff2"
                      done
                    fi
                  fi
                elif [ "$BASELINE_ENABLED" = "true" ] && [ "$(DRY_RUN_MODE)" = "true" ]; then
                  echo ""
                  echo "════════════════════════════════════════════════════════════════════════════"
                  echo "COMPARAÇÃO VOLUMETRIA - PARÂMETRO"
                  echo "════════════════════════════════════════════════════════════════════════════"
                  echo "  baseline_volumetry informado, porém dry-run ativo: sem comparação real."
                fi
                
                echo "════════════════════════════════════════════════════════════════════════════"
                echo "RESUMO EXECUTIVO"
                echo "════════════════════════════════════════════════════════════════════════════"
                echo ""
                printf "  %-30s : %d\n" "Total de Ambientes" "$total_envs"
                printf "  %-30s : %d ✅\n" "Ambientes sem falha" "$total_ok"
                printf "  %-30s : %d ❌\n" "Ambientes com falha" "$total_nok"
                [ "$(DRY_RUN_MODE)" = "true" ] && echo "  ⚠️  Modo Dry-Run ativo: passos WRITE foram simulados (não executados)"
                echo ""
                echo "════════════════════════════════════════════════════════════════════════════"
              } > "$REPORTS_DIR/audit_summary.txt"
              
              echo "✅ Relatório de auditoria gerado: $REPORTS_DIR/audit_summary.txt"
              rm -f "$DATA_DIR"/*_step*.json
              echo "🗑️  JSONs intermediários removidos"
            displayName: '📄 Consolidar Auditoria: Gerar audit_summary.txt'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(REPORTS_DIR)'
              ArtifactName: 'clone-validation-audit-report'
              publishLocation: 'Container'
            displayName: '📤 Publicar audit_summary.txt'
            condition: always()
          
          - script: |
              echo "##################################"
              echo "✅ Evidencia completado"
              echo "##################################"
              echo ""
              echo "Relatório final disponível em: $(REPORTS_DIR)/audit_summary.txt"
            displayName: '📊 Evidencia - Concluído'

  ###########################################################################
  # Stage 4: RESUMO
  # Exibe resumo final para auditoria (sempre executado)
  ###########################################################################
  - stage: Resumo
    displayName: '📋 Resumo - Relatório Final de Execução'
    pool:
      name: '$(CLONE_VALIDATION_POOL)'
    # Propósito: exibir relatório consolidado e completo de toda a execução em formato texto
    dependsOn: Evidencia
    condition: always()

    jobs:
      - job: ResumoExecucao
        displayName: '📋 Relatório Final de Execução'
        steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              artifactName: 'clone-validation-audit-report'
              downloadPath: '$(Build.ArtifactStagingDirectory)'
            displayName: '📥 Baixar Relatório de Auditoria'
            condition: always()

          - script: |
              set +e
              
              AUDIT_FILE="$(Build.ArtifactStagingDirectory)/clone-validation-audit-report/audit_summary.txt"
              
              if [ -f "$AUDIT_FILE" ]; then
                echo ""
                cat "$AUDIT_FILE"
                echo ""
              else
                echo ""
                echo "╔════════════════════════════════════════════════════════════════════════╗"
                echo "║                 ❌ RELATÓRIO NÃO ENCONTRADO                            ║"
                echo "╚════════════════════════════════════════════════════════════════════════╝"
                echo ""
                echo "Arquivo esperado: $AUDIT_FILE"
                echo ""
                echo "Arquivos disponíveis em $(Build.ArtifactStagingDirectory)/clone-validation-audit-report:"
                if [ -d "$(Build.ArtifactStagingDirectory)/clone-validation-audit-report" ]; then
                  find "$(Build.ArtifactStagingDirectory)/clone-validation-audit-report" -type f 2>/dev/null | head -20
                else
                  echo "  Diretório não encontrado"
                fi
                echo ""
              fi
            displayName: '📋 Exibir Relatório Final Completo de Auditoria'
            continueOnError: true



