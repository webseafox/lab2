###############################################################################
# Clone Validation Pipeline — SIBL 2015
# 
# Purpose:
#   Valida ambientes SIBL após clone de banco de dados, executando:
#   - Comparação de volumetria
#   - Limpeza de tabelas técnicas
#   - Atualização de LOVs e caches
#   - Desbloqueio de objetos
#   - Restauração de permissões
#   - Apontamentos por ambiente
#   - Criação de usuários
#   - Validações de SysPref
#
# Tipo: Template remoto consumido por `extends` no entrypoint do produto
# Agent: Self-hosted (rede corporativa), configurado nos stages abaixo
# Entry point: o repositorio consumidor declara `resources` e `extends`
#
# Configuração — Fase 6 (Global Environments via Variable Groups):
#   - Variable Group único por esteira (vg-sibl-env-dev-esteira1, vg-sibl-env-dev-esteira2, vg-sibl-env-dev-prodlike)
#   - Todas as variáveis da esteira ficam no mesmo group
#   - Modelo operacional: 1 servidor de execução + bancos por ambiente
#   - config/environments.yml  [REFERÊNCIA DOCUMENTAL — não lido em runtime oficial]
#   - config/users_per_env.yml  (usuários para passo 8)
#
# Contrato de variáveis: docs/CONFIGURATION.md#variable-groups-fase-6
# Contrato versão: 1.0.0
###############################################################################

parameters:
  # ==================================================================
  # Seção 1: Esteira e Ambiente
  # ==================================================================
  - name: environment
    displayName: '🌍 Esteira a validar (esteira1|esteira2|prodlike)'
    type: string
    default: 'esteira1'
    values:
      - esteira1
      - esteira2
      - prodlike

  - name: override_environments
    displayName: '🔧 Ambientes Customizados (vazio = usar esteira padrão)'
    type: string
    default: ''

  # ==================================================================
  # Seção 2: Controle de Execução
  # ==================================================================
  - name: dryRun
    displayName: '🧪 Modo Dry-Run (validação sem WRITE no banco)'
    type: boolean
    default: true

  - name: skip_optional_steps
    displayName: '⏭️ Pular Passos Opcionais (stats, filas, sequence)'
    type: boolean
    default: true

  - name: baseline_volumetry
    displayName: '📊 Baseline Volumetria (contas|produtos|mapas|applets|bcs|ios|dup)'
    type: string
    default: ''


variables:
  # ==================================================================
  # Variáveis Globais e Rastreabilidade
  # ==================================================================
  - name: SIGLA
    value: $[ lower(split(variables['System.TeamProject'],' ')[0]) ]

  - name: TIMESTAMP
    value: $[format('{0:yyyyMMddHHmmss}', pipeline.startTime)]

  - name: PACKAGE_VERSION
    value: '1.0.$(Build.BuildId)'

  # ==================================================================
  # Normalização de Flags Booleanas (parâmetros → variáveis string)
  # Necessário para uso em scripts e conditions de stage
  # ==================================================================
  - name: DRY_RUN_MODE
    ${{ if eq(parameters.dryRun, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: SKIP_OPTIONAL_MODE
    ${{ if eq(parameters.skip_optional_steps, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  # ==================================================================
  # Configuração de Execução
  # ==================================================================
  - name: PYTHON_VERSION
    value: '3.10'

  - name: ARTIFACT_STAGING_DIR
    value: '$(Build.ArtifactStagingDirectory)'

  - name: REPORTS_DIR
    value: '$(Build.ArtifactStagingDirectory)/reports'

  - name: STEP1_DIVERGENCE_THRESHOLD_PERCENT
    value: '2.0'

  - name: BASELINE_VOLUMETRY
    value: '${{ parameters.baseline_volumetry }}'

  - name: CLONE_VALIDATION_POOL
    value: 'GeneralPurposeLinuxAgentsCD'

  # ==================================================================
  # Variable Groups por esteira
  # ------------------------------------------------------------------
  # Não carregamos grupos neste nível para evitar conflitos entre esteiras.
  # O group da esteira é carregado no nível de cada job.
  # ==================================================================

stages:

  ###########################################################################
  # Stage 0: BUILD_VALIDATION
  # Valida YAMLs obrigatorios e contratos minimos antes da execucao
  ###########################################################################
  - stage: ValidacaoConstrucao
    displayName: '✅ ValidacaoConstrucao - Validar YAMLs do Fluxo'
    pool:
      name: '$(CLONE_VALIDATION_POOL)'

    jobs:
      - job: ValidarYaml
        displayName: 'Validar YAML de pipeline, template e configuracao'
        steps:

          - script: |
              echo "##################################"
              echo "Validando contrato de entrada"
              echo "##################################"
              case "${{ parameters.environment }}" in
                esteira1|esteira2|prodlike)
                  echo "✓ Environment válido: ${{ parameters.environment }}"
                  ;;
                *)
                  echo "✗ Environment inválido: ${{ parameters.environment }}"
                  exit 1
                  ;;
              esac
            displayName: 'Validar Contrato de Parâmetros'

          - script: |
              set -e
              BASELINE_RAW='${{ parameters.baseline_volumetry }}'
              BASELINE_VAL=$(echo "$BASELINE_RAW" | tr -d '[:space:]')
              if [ -z "$BASELINE_VAL" ]; then
                echo "✓ baseline_volumetry vazio: comparação opcional desabilitada"
                exit 0
              fi
              if echo "$BASELINE_VAL" | grep -Eq '^[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+$'; then
                echo "✓ baseline_volumetry válido: $BASELINE_VAL"
              else
                echo "✗ baseline_volumetry inválido: '$BASELINE_RAW'"
                echo "  Formato esperado: contas|produtos|mapas|applets|bcs|ios|duplicados"
                echo "  Exemplo: 532707|8493|1529|37898|19113|6091|0"
                exit 1
              fi
            displayName: 'Validar Formato do baseline_volumetry'

          - script: |
              echo "##################################"
              echo "✅ BuildValidation completado"
              echo "##################################"
            displayName: 'ValidacaoConstrucao - Concluido'
  
  ###########################################################################
  # Stage 1: PREPARE
  # Valida parâmetros, resolve esteira/ambientes, testa credenciais
  ###########################################################################
  - stage: Preparar
    displayName: '🔧 Preparar - Validar Configuração'
    pool:
      name: '$(CLONE_VALIDATION_POOL)'
    dependsOn: ValidacaoConstrucao
    condition: succeeded()
    
    jobs:
      - job: ValidarEResolver
        displayName: 'Validar parâmetros e resolver configuração'
        steps:
          
          - script: |
              echo "##################################"
              echo "Validação de Parâmetros"
              echo "##################################"
              echo ""
              echo "Esteira: ${{ parameters.environment }}"
              echo "Dry-Run: ${{ parameters.dryRun }}"
              echo "Override Environments: ${{ parameters.override_environments }}"
              echo "Skip Optional Steps: ${{ parameters.skip_optional_steps }}"
              echo ""
            displayName: 'Exibir Parâmetros de Entrada'
          
          - script: |
              echo "Validando config/environments.yml..."
              if [ -f "config/environments.yml" ]; then
                echo "✓ config/environments.yml encontrado (uso documental)"
              else
                echo "⚠️ config/environments.yml não encontrado. Seguindo com Variable Groups como fonte de verdade."
              fi
            displayName: 'Validar environments.yml [REFERENCIA DOCUMENTAL - Fase 6]'
            continueOnError: true

          # ---------------------------------------------------------------
          # Fase 6: Validação do contrato de variáveis via Variable Groups
          # O environments.yml NÃO é lido como fonte obrigatória aqui.
          # ---------------------------------------------------------------
          - script: |
              echo "Validando mapeamento de esteira para grupos por ambiente..."
              case "${{ parameters.environment }}" in
                esteira1)
                  echo "✓ Esteira1 -> vg-sibl-env-dev-esteira1"
                  ;;
                esteira2)
                  echo "✓ Esteira2 -> vg-sibl-env-dev-esteira2"
                  ;;
                prodlike)
                  echo "✓ ProdLike -> vg-sibl-env-dev-prodlike"
                  ;;
                *)
                  echo "✗ Environment inválido: ${{ parameters.environment }}"
                  exit 1
                  ;;
              esac
            displayName: '🔐 Validar Mapeamento de Esteira'
            continueOnError: false

          - script: |
              echo "Validando config/users_per_env.yml (Passo 8)..."
              if [ -f "config/users_per_env.yml" ]; then
                echo "✓ config/users_per_env.yml encontrado (uso documental)"
              else
                echo "⚠️ config/users_per_env.yml não encontrado. Execução seguirá sem validação desse arquivo."
              fi
            displayName: 'Validar users_per_env.yml (Passo 8)'
            continueOnError: true

          # ---------------------------------------------------------------
          # Fase 6: Confirmar hosts resolvidos a partir de Variable Groups
          # ---------------------------------------------------------------
          - script: |
              echo "A resolução de variáveis por ambiente será feita nos jobs de execução."
              echo "Cada job carrega o Variable Group único da esteira correspondente."
            displayName: '🔍 Estratégia de Carga de Variable Groups'
            continueOnError: false
          
          - script: |
              echo "##################################"
              echo "✅ Preparar completado com sucesso"
              echo "##################################"
            displayName: 'Preparar - Concluído'
  
  ###########################################################################
  # Stage 2: EXECUTAR_OBRIGATORIO
  # Executa passos obrigatórios (1-9) em paralelo por ambiente
  ###########################################################################
  - stage: ExecutarObrigatorio
    displayName: '⚙️ ExecutarObrigatorio - Passos 1-9 Obrigatórios'
    pool:
      name: '$(CLONE_VALIDATION_POOL)'
    # Propósito: executar passos obrigatórios em sequência por ambiente (paralelo entre ambientes)
    dependsOn: Preparar
    condition: succeeded()
    
    jobs:
      # esteira1: DEV2 e DEV3
      - ${{ if eq(parameters.environment, 'esteira1') }}:
          - job: Obrigatorio_DEV2
            displayName: '⚙️ DEV2 - Passos Obrigatórios (1-9)'
            variables:
              - group: vg-sibl-env-dev-esteira1
            steps:
              - script: |
                  set -e
                  echo "Validando contrato para servidor e banco do ambiente DEV2..."
                  required_vars="SIEBEL_SERVER_IP_DEV_PRIMARY SIEBEL_SERVER_USER_DEV SIEBEL_SERVER_PASS_DEV SIEBEL_DATABASE_USER_READONLY SIEBEL_DATABASE_PASSWORD_READONLY SIEBEL_DATABASE_HOST_DEV_PRIMARY SIEBEL_DATABASE_PORT SIEBEL_DATABASE_SERVICE"
                  missing=0
                  for v in $required_vars; do
                    eval "val=\${$v:-}"
                    if [ -z "$val" ]; then
                      echo "✗ Variável ausente: $v"
                      missing=1
                    else
                      echo "✓ $v definido"
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "🚫 Falha de contrato: valide o Variable Group da esteira com servidor único e variáveis de banco."
                    exit 1
                  fi
                displayName: 'Validar Contrato DEV2 (servidor + DB)'
              - script: |
                  set -euo pipefail
                  # ⚡ ESTRATÉGIA 5: Logging Detalhado com Diagnóstico
                  
                  if [ "$(DRY_RUN_MODE)" = "true" ]; then
                    echo "🧪 DRY-RUN ativo: pulando validação remota SSH + SQL*Plus (DEV2)."
                    exit 0
                  fi

                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "🚫 SSH não disponível no agente" >&2
                    exit 1
                  fi
                  if ! command -v sshpass >/dev/null 2>&1; then
                    echo "🚫 sshpass não disponível no agente" >&2
                    exit 1
                  fi

                  server_user="${SIEBEL_SERVER_USER_DEV:-}"
                  server_ip_raw="${SIEBEL_SERVER_IP_DEV_PRIMARY:-}"
                  server_pass="${SIEBEL_SERVER_PASS_DEV:-}"
                  if [ -z "$server_user" ] || [ -z "$server_ip_raw" ]; then
                    echo "🚫 Variáveis SIEBEL_SERVER_USER_DEV/SIEBEL_SERVER_IP_DEV_PRIMARY ausentes" >&2
                    exit 1
                  fi
                  if [ -z "$server_pass" ]; then
                    echo "🚫 Variável SIEBEL_SERVER_PASS_DEV ausente" >&2
                    exit 1
                  fi

                  server_ip="${server_ip_raw}"
                  echo "[SSH] target='${server_user}@${server_ip}'" >&2
                  oracle_password="${ORACLE_PASSWORD:-}"
                  if [ -z "$oracle_password" ]; then
                    oracle_password="${SIEBEL_DATABASE_PASSWORD_READONLY:-}"
                  fi
                  if [ -z "$oracle_password" ]; then
                    echo "🚫 Falha de autenticação Oracle: variável secreta ORACLE_PASSWORD não definida" >&2
                    exit 1
                  fi

                  db_user="${SIEBEL_DATABASE_USER_READONLY:-}"
                  db_host="${SIEBEL_DATABASE_HOST_DEV_PRIMARY:-}"
                  db_port="${SIEBEL_DATABASE_PORT:-}"
                  db_service="${SIEBEL_DATABASE_SERVICE:-}"

                  echo "=== DIAGNÓSTICO DEV2: VALIDAÇÃO SSH + SQL*Plus ===" >&2
                  
                  # Teste 1: Conectividade SSH simples
                  echo "" >&2
                  echo "[TESTE 1] Conectividade SSH simples para ${server_user}@${server_ip}..." >&2
                  SSHPASS="$server_pass" sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=15 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" "hostname" 2>&1 || { echo "❌ SSH Test 1 FALHOU" >&2; exit 1; }
                  echo "✅ Teste 1 OK" >&2

                  # Teste 2: Verificar SQLPlus no servidor (procurar em múltiplos paths)
                  echo "" >&2
                  echo "[TESTE 2] Verificar disponibilidade de sqlplus no servidor..." >&2
                  SSHPASS="$server_pass" timeout 30 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=20 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "bash -lc 'which sqlplus && sqlplus -v'" 2>&1 || { echo "❌ SQLPlus Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 2 OK" >&2

                  # Teste 3: Teste TNS simples
                  echo "" >&2
                  echo "[TESTE 3] Teste TNS conexão ao banco DEV (${db_host}:${db_port}/${db_service})..." >&2
                  SSHPASS="$server_pass" timeout 180 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=30 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "timeout 45 bash -lc 'echo \"SELECT SYSDATE FROM dual;\" | sqlplus -s \"${db_user}/${oracle_password}@//${db_host}:${db_port}/${db_service}\"'" 2>&1 || { echo "❌ TNS Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 3 OK" >&2
                  
                  echo "" >&2
                  echo "=== DIAGNÓSTICO DEV2: TODOS OS TESTES PASSARAM ===" >&2
                displayName: 'Validar SSH + SQL*Plus remoto (DEV2) — COM LOGGING DETALHADO'

              - script: |
                  set -euo pipefail
                  # ⚡ ESTRATÉGIA 5: Logging Detalhado com Time e Debug
                  
                  mkdir -p "$(REPORTS_DIR)/DEV2"

                  if [ "$(DRY_RUN_MODE)" = "true" ]; then
                    start_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))
                    end_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))
                    duration_ms=$((end_ms - start_ms))

                    cat > "$(REPORTS_DIR)/DEV2/evidence.json" <<EOF
                  {
                    "metadata": {
                      "env_id": "DEV2",
                      "overall_status": "DRYRUN",
                      "total_duration_ms": ${duration_ms},
                      "dry_run": $(DRY_RUN_MODE),
                      "environment": "${{ parameters.environment }}",
                      "step": "01"
                    },
                    "comparison": {
                      "mode": "dry-run",
                      "message": "Passo 1 executado em modo simulado (sem conexao Oracle)."
                    }
                  }
                  EOF

                    {
                      echo "Clone Validation Step 01 - DEV2"
                      echo "Status: DRYRUN"
                      echo "Duração(ms): ${duration_ms}"
                      echo "Mensagem: Execução simulada sem acesso a banco"
                    } > "$(REPORTS_DIR)/DEV2/step01_volumetry_report.txt"

                    echo "🧪 DRY-RUN ativo: evidência simulada gerada para DEV2."
                    exit 0
                  fi

                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "🚫 SSH não disponível no agente" >&2
                    exit 1
                  fi

                  env_id="DEV2"
                  threshold="${STEP1_DIVERGENCE_THRESHOLD_PERCENT:-2.0}"
                  server_user="${SIEBEL_SERVER_USER_DEV:-}"
                  server_ip_raw="${SIEBEL_SERVER_IP_DEV_PRIMARY:-}"
                  server_pass="${SIEBEL_SERVER_PASS_DEV:-}"
                  if [ -z "$server_user" ] || [ -z "$server_ip_raw" ]; then
                    echo "🚫 Variáveis SIEBEL_SERVER_USER_DEV/SIEBEL_SERVER_IP_DEV_PRIMARY ausentes" >&2
                    exit 1
                  fi
                  if [ -z "$server_pass" ]; then
                    echo "🚫 Variável SIEBEL_SERVER_PASS_DEV ausente" >&2
                    exit 1
                  fi

                  server_ip="${server_ip_raw}"
                  echo "[SSH] target='${server_user}@${server_ip}'" >&2
                  db_user="${SIEBEL_DATABASE_USER_READONLY:-}"
                  oracle_password="${ORACLE_PASSWORD:-}"
                  if [ -z "$oracle_password" ]; then
                    oracle_password="${SIEBEL_DATABASE_PASSWORD_READONLY:-}"
                  fi
                  if [ -z "$oracle_password" ]; then
                    echo "🚫 Falha de autenticação Oracle: variável secreta ORACLE_PASSWORD não definida" >&2
                    exit 1
                  fi
                  dev_host="${SIEBEL_DATABASE_HOST_DEV_PRIMARY:-}"
                  db_port="${SIEBEL_DATABASE_PORT:-}"
                  db_service="${SIEBEL_DATABASE_SERVICE:-}"

                  echo "=== EXECUÇÃO PASSO 1 DEV2: COLETA DE MÉTRICAS COM LOGGING ===" >&2
                  start_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))

                  run_metrics_remote() {
                    local target_host="$1"
                    echo "[run_metrics_remote] Iniciando para host: $target_host" >&2
                    echo "[run_metrics_remote] Timeout total: 300s, ConnectTimeout: 60s" >&2
                    {
                      printf '%s\n' \
                        "whenever sqlerror exit failure" \
                        "connect ${db_user}/\"${oracle_password}\"@//${target_host}:${db_port}/${db_service}" \
                        "set heading off" \
                        "set feedback off" \
                        "set pagesize 0" \
                        "set verify off" \
                        "set echo off" \
                        "set trimspool on" \
                        "set linesize 32767" \
                        "SELECT" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_ORG_EXT) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_PROD_INT) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_INT_OBJMAP) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_APPLET) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_BUSCOMP) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_INT_OBJ) || '|' ||" \
                        "  (SELECT COUNT(1) FROM (" \
                        "    SELECT ROW_ID" \
                        "    FROM SIEBEL.S_PROD_INT" \
                        "    GROUP BY ROW_ID" \
                        "    HAVING COUNT(1) > 1" \
                        "  ))" \
                        "FROM DUAL;" \
                        "exit;"
                    } | SSHPASS="$server_pass" timeout 300 sshpass -e ssh \
                      -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      -o PreferredAuthentications=password \
                      -o PubkeyAuthentication=no \
                      -o ConnectTimeout=60 \
                      -o ServerAliveInterval=10 \
                      -o ServerAliveCountMax=3 \
                      -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                      "${server_user}@${server_ip}" "bash -lc 'timeout 270 sqlplus -s /nolog'" 2>&1
                  }

                  extract_line() {
                    printf '%s\n' "$1" | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n1
                  }

                  set +e
                  echo "" >&2
                  echo "[EXECUÇÃO] Coletando métricas de DEV (${dev_host})..." >&2
                  dev_raw=$(run_metrics_remote "$dev_host")
                  dev_rc=$?
                  echo "[EXECUÇÃO] RC DEV: $dev_rc" >&2
                  
                  echo "" >&2
                  set -e

                  if [ "$dev_rc" -ne 0 ]; then
                    echo "" >&2
                    echo "❌ FALHA NA COLETA DE MÉTRICAS" >&2
                    echo "[DEV] Output (últimos 100 chars): ${dev_raw: -100}" >&2
                    if echo "$dev_raw" | grep -Eq 'ORA-12170'; then
                      echo "⚠️ ERRO ORA-12170 detectado: Timeout de conexão TNS"
                    fi
                    {
                      echo "Falha na coleta de métricas DEV2:"
                      echo "$dev_raw"
                    } > "$(REPORTS_DIR)/DEV2/step01_error_detail.log"
                    exit 1
                  fi


                  dev_line=$(extract_line "$dev_raw")

                  IFS='|' read -r dev_contas dev_produtos dev_mapa dev_applets dev_bcs dev_ios dev_dup <<< "$dev_line"
                  metrics=(qtd_contas qtd_produtos qtd_mapa_dados qtd_applets qtd_bcs qtd_ios qtd_duplicidade_produto)
                  dev_values=("$dev_contas" "$dev_produtos" "$dev_mapa" "$dev_applets" "$dev_bcs" "$dev_ios" "$dev_dup")

                  metrics_json=""
                  sep=""

                  for i in "${!metrics[@]}"; do
                    name="${metrics[$i]}"
                    dev="${dev_values[$i]}"
                    if ! [[ "$dev" =~ ^[0-9]+$ ]]; then
                      echo "🚫 Resultado inválido para ${name}: DEV='${dev}'"
                      exit 1
                    fi
                    metrics_json="${metrics_json}${sep}\"${name}\":${dev}"
                    sep=","
                  done
                  baseline_json=""
                  comparison_json=""
                  baseline_provided="false"
                  baseline_raw="${BASELINE_VOLUMETRY:-}"
                  baseline_val=$(echo "$baseline_raw" | tr -d '[:space:]')
                  if [ -n "$baseline_val" ]; then
                    IFS='|' read -r b_contas b_produtos b_mapa b_applets b_bcs b_ios b_dup <<< "$baseline_val"
                    baseline_values=("$b_contas" "$b_produtos" "$b_mapa" "$b_applets" "$b_bcs" "$b_ios" "$b_dup")
                    baseline_json="\"qtd_contas\":${b_contas},\"qtd_produtos\":${b_produtos},\"qtd_mapa_dados\":${b_mapa},\"qtd_applets\":${b_applets},\"qtd_bcs\":${b_bcs},\"qtd_ios\":${b_ios},\"qtd_duplicidade_produto\":${b_dup}"
                    comparison_sep=""
                    for i in "${!metrics[@]}"; do
                      name="${metrics[$i]}"
                      dev="${dev_values[$i]}"
                      base="${baseline_values[$i]}"
                      if ! [[ "$base" =~ ^[0-9]+$ ]]; then
                        echo "🚫 Baseline inválido para ${name}: '${base}'"
                        exit 1
                      fi
                      diff=$((dev-base))
                      comparison_json="${comparison_json}${comparison_sep}\"${name}\":${diff}"
                      comparison_sep=","
                    done
                    baseline_provided="true"
                  fi
                  overall_status="SUCCESS"

                  end_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))
                  duration_ms=$((end_ms - start_ms))

                  # Criar JSON intermediário para consolidação na Stage Evidencia
                  mkdir -p "$(Build.ArtifactStagingDirectory)/data"
                  if [ "$baseline_provided" = "true" ]; then
