                  db_service="${SIEBEL_DATABASE_SERVICE_DEV5:-${SIEBEL_DATABASE_SERVICE:-}}"

                  echo "=== DIAGNÓSTICO DEV5: VALIDAÇÃO SSH + SQL*Plus ===" >&2
                  
                  # Teste 1: Conectividade SSH simples
                  echo "" >&2
                  echo "[TESTE 1] Conectividade SSH simples para ${server_user}@${server_ip}..." >&2
                  SSHPASS="$server_pass" sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=15 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" "hostname" 2>&1 || { echo "❌ SSH Test 1 FALHOU" >&2; exit 1; }
                  echo "✅ Teste 1 OK" >&2

                  # Teste 2: Verificar SQLPlus no servidor (procurar em múltiplos paths)
                  echo "" >&2
                  echo "[TESTE 2] Verificar disponibilidade de sqlplus no servidor..." >&2
                  SSHPASS="$server_pass" timeout 30 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=20 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "bash -lc 'which sqlplus && sqlplus -v'" 2>&1 || { echo "❌ SQLPlus Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 2 OK" >&2

                  # Teste 3: Teste TNS simples
                  echo "" >&2
                  echo "[TESTE 3] Teste TNS conexão ao banco DEV (${db_host}:${db_port}/${db_service})..." >&2
                  SSHPASS="$server_pass" timeout 180 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=30 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "timeout 45 bash -lc 'echo \"SELECT SYSDATE FROM dual;\" | sqlplus -s \"${db_user}/${oracle_password}@//${db_host}:${db_port}/${db_service}\"'" 2>&1 || { echo "❌ TNS Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 3 OK" >&2
                  
                  echo "" >&2
                  echo "=== DIAGNÓSTICO DEV5: TODOS OS TESTES PASSARAM ===" >&2
                displayName: 'Validar SSH + SQL*Plus remoto (DEV5) — COM LOGGING DETALHADO'

