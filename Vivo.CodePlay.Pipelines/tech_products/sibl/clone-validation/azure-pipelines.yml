                    if [ -z "$val" ]; then
                      echo "✗ Variável ausente: $v"
                      missing=1
                    else
                      echo "✓ $v definido"
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "🚫 Falha de contrato: valide o Variable Group da esteira com servidor único e variáveis de banco."
                    exit 1
                  fi
                displayName: 'Validar Contrato DEV5 (servidor + DB)'
              - script: |
                  set -euo pipefail
