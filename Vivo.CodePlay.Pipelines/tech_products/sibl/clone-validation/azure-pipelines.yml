                  SU="${SIEBEL_SERVER_USER_DEV:-}"; SI="${SIEBEL_SERVER_IP_DEV_PRIMARY:-}"; SP="${SIEBEL_SERVER_PASS_DEV:-}"
                  DU="${SIEBEL_DATABASE_USER_READONLY:-}"; OP="${ORACLE_PASSWORD:-${SIEBEL_DATABASE_PASSWORD_READONLY:-}}"
                  DH="${SIEBEL_DATABASE_HOST_DEV_PRIMARY:-}"; DP="${SIEBEL_DATABASE_PORT:-}"; DS="${SIEBEL_DATABASE_SERVICE:-}"
                  SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=60 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1"
                  RESULT=$({ printf '%s\n' "WHENEVER SQLERROR EXIT FAILURE" "CONNECT ${DU}/\"${OP}\"@//${DH}:${DP}/${DS}" \
                    "SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF LINESIZE 200" \
                    "UPDATE SIEBEL.S_SYS_PREF SET VAL = 'TRUE' WHERE SYS_PREF_CD = 'Runtime Scripts System Access';" \
                    "SELECT 'SYSPREF|'||VAL FROM SIEBEL.S_SYS_PREF WHERE SYS_PREF_CD = 'Runtime Scripts System Access';" \
                    "EXIT;"
                  } | SSHPASS="$SP" timeout 120 sshpass -e ssh $SSH_OPTS "${SU}@${SI}" "bash -lc 'timeout 90 sqlplus -s /nolog'" 2>&1)
                  RC=$?
                  EM=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s)*1000 )))
                  ST=$([ "$RC" -eq 0 ] && echo "SUCCESS" || echo "FAILED")
                  SYSPREF_LINE=$(echo "$RESULT" | tr -d '\r' | awk -F'|' '/^SYSPREF\|/ {print $0}' | tail -n1)
                  SYSPREF_VAL=$(echo "$SYSPREF_LINE" | awk -F'|' '{print $2}' | tr -d '[:space:]')
                  if [ "$SYSPREF_VAL" = "TRUE" ]; then
                    SYSPREF_OK="UPDATED"
                  else
                    SYSPREF_OK="NOT_CONFIRMED"
                  fi
                  echo "{\"env_id\":\"${ENV_ID}\",\"step\":${STEP},\"step_name\":\"Atualizar SysPref\",\"status\":\"${ST}\",\"duration_ms\":$((EM-SM)),\"results\":{\"syspref_value\":\"${SYSPREF_VAL:-N/A}\",\"syspref_status\":\"${SYSPREF_OK}\"},\"timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > "${DD}/${ENV_ID}_step0${STEP}.json"
                  echo "$([ \"$ST\" = 'SUCCESS' ] && echo '✅' || echo '❌') Passo ${STEP} - ${ENV_ID}: SysPref=${SYSPREF_VAL:-N/A} [${SYSPREF_OK}] ($((EM-SM))ms)"
                displayName: '⚙️ Passo 9 - Atualizar SysPref Runtime Scripts (DEV2)'
                continueOnError: true

              - task: PublishBuildArtifacts@1
                inputs:
                  PathtoPublish: '$(Build.ArtifactStagingDirectory)/data'
                  ArtifactName: 'clone-validation-dev2-data'
                  publishLocation: 'Container'
                displayName: '📤 Publicar evidências DEV2'
                condition: always()

          - job: Obrigatorio_DEV3
            displayName: '⚙️ DEV3 - Passos Obrigatórios (1-9)'
            variables:
              - group: vg-sibl-env-dev-esteira1
            steps:
              - script: |
                  set -e
                  echo "Validando contrato para servidor e banco do ambiente DEV3..."
                  required_vars="SIEBEL_SERVER_IP_DEV_SECONDARY SIEBEL_SERVER_USER_DEV SIEBEL_SERVER_PASS_DEV SIEBEL_DATABASE_USER_READONLY SIEBEL_DATABASE_PASSWORD_READONLY SIEBEL_DATABASE_HOST_DEV_SECONDARY SIEBEL_DATABASE_PORT SIEBEL_DATABASE_SERVICE"
                  missing=0
                  for v in $required_vars; do
                    eval "val=\${$v:-}"
                    if [ -z "$val" ]; then
                      echo "✗ Variável ausente: $v"
                      missing=1
                    else
                      echo "✓ $v definido"
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "🚫 Falha de contrato: valide o Variable Group da esteira com servidor único e variáveis de banco."
                    exit 1
                  fi
                displayName: 'Validar Contrato DEV3 (servidor + DB)'
              - script: |
                  set -euo pipefail
                  # ⚡ ESTRATÉGIA 5: Logging Detalhado com Diagnóstico
                  
                  if [ "$(DRY_RUN_MODE)" = "true" ]; then
                    echo "🧪 DRY-RUN ativo: pulando validação remota SSH + SQL*Plus (DEV3)."
                    exit 0
                  fi

                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "🚫 SSH não disponível no agente" >&2
                    exit 1
                  fi
                  if ! command -v sshpass >/dev/null 2>&1; then
                    echo "🚫 sshpass não disponível no agente" >&2
                    exit 1
                  fi

                  server_user="${SIEBEL_SERVER_USER_DEV:-}"
                  server_ip_raw="${SIEBEL_SERVER_IP_DEV_SECONDARY:-}"
                  server_pass="${SIEBEL_SERVER_PASS_DEV:-}"
                  if [ -z "$server_user" ] || [ -z "$server_ip_raw" ]; then
                    echo "🚫 Variáveis SIEBEL_SERVER_USER_DEV/SIEBEL_SERVER_IP_DEV_SECONDARY ausentes" >&2
                    exit 1
                  fi
                  if [ -z "$server_pass" ]; then
                    echo "🚫 Variável SIEBEL_SERVER_PASS_DEV ausente" >&2
                    exit 1
                  fi

                  server_ip="${server_ip_raw}"
                  echo "[SSH] target='${server_user}@${server_ip}'" >&2
                  oracle_password="${ORACLE_PASSWORD:-}"
                  if [ -z "$oracle_password" ]; then
                    oracle_password="${SIEBEL_DATABASE_PASSWORD_READONLY:-}"
                  fi
                  if [ -z "$oracle_password" ]; then
                    echo "🚫 Falha de autenticação Oracle: variável secreta ORACLE_PASSWORD não definida" >&2
                    exit 1
                  fi

                  db_user="${SIEBEL_DATABASE_USER_READONLY:-}"
                  db_host="${SIEBEL_DATABASE_HOST_DEV_SECONDARY:-}"
                  db_port="${SIEBEL_DATABASE_PORT:-}"
                  db_service="${SIEBEL_DATABASE_SERVICE:-}"

                  echo "=== DIAGNÓSTICO DEV3: VALIDAÇÃO SSH + SQL*Plus ===" >&2
                  
                  # Teste 1: Conectividade SSH simples
                  echo "" >&2
                  echo "[TESTE 1] Conectividade SSH simples para ${server_user}@${server_ip}..." >&2
                  SSHPASS="$server_pass" sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=15 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" "hostname" 2>&1 || { echo "❌ SSH Test 1 FALHOU" >&2; exit 1; }
                  echo "✅ Teste 1 OK" >&2

                  # Teste 2: Verificar SQLPlus no servidor (procurar em múltiplos paths)
                  echo "" >&2
                  echo "[TESTE 2] Verificar disponibilidade de sqlplus no servidor..." >&2
                  SSHPASS="$server_pass" timeout 30 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=20 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "bash -lc 'which sqlplus && sqlplus -v'" 2>&1 || { echo "❌ SQLPlus Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 2 OK" >&2

                  # Teste 3: Teste TNS simples
                  echo "" >&2
                  echo "[TESTE 3] Teste TNS conexão ao banco DEV (${db_host}:${db_port}/${db_service})..." >&2
                  SSHPASS="$server_pass" timeout 180 sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -o PreferredAuthentications=password \
                    -o PubkeyAuthentication=no \
                    -o ConnectTimeout=30 \
                    -o ServerAliveInterval=10 \
                    -o ServerAliveCountMax=3 \
                    -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                    "${server_user}@${server_ip}" \
                    "timeout 45 bash -lc 'echo \"SELECT SYSDATE FROM dual;\" | sqlplus -s \"${db_user}/${oracle_password}@//${db_host}:${db_port}/${db_service}\"'" 2>&1 || { echo "❌ TNS Test FALHOU" >&2; exit 1; }
                  echo "✅ Teste 3 OK" >&2
                  
                  echo "" >&2
                  echo "=== DIAGNÓSTICO DEV3: TODOS OS TESTES PASSARAM ===" >&2
                displayName: 'Validar SSH + SQL*Plus remoto (DEV3) — COM LOGGING DETALHADO'

              - script: |
                  set -euo pipefail
                  # ⚡ ESTRATÉGIA 5: Logging Detalhado com Time e Debug
                  
                  mkdir -p "$(REPORTS_DIR)/DEV3"

                  if [ "$(DRY_RUN_MODE)" = "true" ]; then
                    start_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))
                    end_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))
                    duration_ms=$((end_ms - start_ms))

                    cat > "$(REPORTS_DIR)/DEV3/evidence.json" <<EOF
                  {
                    "metadata": {
                      "env_id": "DEV3",
                      "overall_status": "DRYRUN",
                      "total_duration_ms": ${duration_ms},
                      "dry_run": $(DRY_RUN_MODE),
                      "environment": "${{ parameters.environment }}",
                      "step": "01"
                    },
                    "comparison": {
                      "mode": "dry-run",
                      "message": "Passo 1 executado em modo simulado (sem conexao Oracle)."
                    }
                  }
                  EOF

                    {
                      echo "Clone Validation Step 01 - DEV3"
                      echo "Status: DRYRUN"
                      echo "Duração(ms): ${duration_ms}"
                      echo "Mensagem: Execução simulada sem acesso a banco"
                    } > "$(REPORTS_DIR)/DEV3/step01_volumetry_report.txt"

                    echo "🧪 DRY-RUN ativo: evidência simulada gerada para DEV3."
                    exit 0
                  fi

                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "🚫 SSH não disponível no agente" >&2
                    exit 1
                  fi

                  env_id="DEV3"
                  threshold="${STEP1_DIVERGENCE_THRESHOLD_PERCENT:-2.0}"
                  server_user="${SIEBEL_SERVER_USER_DEV:-}"
                  server_ip_raw="${SIEBEL_SERVER_IP_DEV_SECONDARY:-}"
                  server_pass="${SIEBEL_SERVER_PASS_DEV:-}"
                  if [ -z "$server_user" ] || [ -z "$server_ip_raw" ]; then
                    echo "🚫 Variáveis SIEBEL_SERVER_USER_DEV/SIEBEL_SERVER_IP_DEV_SECONDARY ausentes" >&2
                    exit 1
                  fi
                  if [ -z "$server_pass" ]; then
                    echo "🚫 Variável SIEBEL_SERVER_PASS_DEV ausente" >&2
                    exit 1
                  fi

                  server_ip="${server_ip_raw}"
                  echo "[SSH] target='${server_user}@${server_ip}'" >&2
                  db_user="${SIEBEL_DATABASE_USER_READONLY:-}"
                  oracle_password="${ORACLE_PASSWORD:-}"
                  if [ -z "$oracle_password" ]; then
                    oracle_password="${SIEBEL_DATABASE_PASSWORD_READONLY:-}"
                  fi
                  if [ -z "$oracle_password" ]; then
                    echo "🚫 Falha de autenticação Oracle: variável secreta ORACLE_PASSWORD não definida" >&2
                    exit 1
                  fi
                  dev_host="${SIEBEL_DATABASE_HOST_DEV_SECONDARY:-}"
                  db_port="${SIEBEL_DATABASE_PORT:-}"
                  db_service="${SIEBEL_DATABASE_SERVICE:-}"

                  echo "=== EXECUÇÃO PASSO 1 DEV3: COLETA DE MÉTRICAS COM LOGGING ===" >&2
                  start_ms=$(date +%s%3N 2>/dev/null || echo $(( $(date +%s) * 1000 )))

                  run_metrics_remote() {
                    local target_host="$1"
                    echo "[run_metrics_remote] Iniciando para host: $target_host" >&2
                    echo "[run_metrics_remote] Timeout total: 300s, ConnectTimeout: 60s" >&2
                    {
                      printf '%s\n' \
                        "whenever sqlerror exit failure" \
                        "connect ${db_user}/\"${oracle_password}\"@//${target_host}:${db_port}/${db_service}" \
                        "set heading off" \
                        "set feedback off" \
                        "set pagesize 0" \
                        "set verify off" \
                        "set echo off" \
                        "set trimspool on" \
                        "set linesize 32767" \
                        "SELECT" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_ORG_EXT) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_PROD_INT) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_INT_OBJMAP) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_APPLET) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_BUSCOMP) || '|' ||" \
                        "  (SELECT COUNT(1) FROM SIEBEL.S_INT_OBJ) || '|' ||" \
                        "  (SELECT COUNT(1) FROM (" \
                        "    SELECT ROW_ID" \
                        "    FROM SIEBEL.S_PROD_INT" \
                        "    GROUP BY ROW_ID" \
                        "    HAVING COUNT(1) > 1" \
                        "  ))" \
                        "FROM DUAL;" \
                        "exit;"
                    } | SSHPASS="$server_pass" timeout 300 sshpass -e ssh \
                      -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      -o PreferredAuthentications=password \
                      -o PubkeyAuthentication=no \
                      -o ConnectTimeout=60 \
                      -o ServerAliveInterval=10 \
                      -o ServerAliveCountMax=3 \
                      -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 \
                      "${server_user}@${server_ip}" "bash -lc 'timeout 270 sqlplus -s /nolog'" 2>&1
                  }

                  extract_line() {
                    printf '%s\n' "$1" | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n1
                  }

                  set +e
                  echo "" >&2
                  echo "[EXECUÇÃO] Coletando métricas de DEV (${dev_host})..." >&2
                  dev_raw=$(run_metrics_remote "$dev_host")
                  dev_rc=$?
                  echo "[EXECUÇÃO] RC DEV: $dev_rc" >&2
                  
                  echo "" >&2
                  set -e

                  if [ "$dev_rc" -ne 0 ]; then
                    echo "" >&2
                    echo "❌ FALHA NA COLETA DE MÉTRICAS" >&2
                    echo "[DEV] Output (últimos 100 chars): ${dev_raw: -100}" >&2
                    if echo "$dev_raw" | grep -Eq 'ORA-12170'; then
                      echo "⚠️ ERRO ORA-12170 detectado: Timeout de conexão TNS"
                    fi
                    {
                      echo "Falha na coleta de métricas DEV3:"
                      echo "$dev_raw"
                    } > "$(REPORTS_DIR)/DEV3/step01_error_detail.log"
                    exit 1
                  fi


                  dev_line=$(extract_line "$dev_raw")

