    value: 'SV2KPREM2'

  - name: SIEBEL_EXPORT_TOOLS_PATH
    value: 'D:\Siebel\Tools15\BIN'

  - name: SIEBEL_EXPORT_CONFIG_PATH
    value: '$(Agent.TempDirectory)\$(SIEBEL_EXPORT_BUILD_REF)\tools_DevOps.cfg'

  - name: SIEBEL_EXPORT_USER
    value: 'CRM_MIGRADOR_SIEBEL8_PROD'

  - name: SIEBEL_EXPORT_REPOSITORY
    value: 'Siebel Repository'

  - name: SIEBEL_EXPORT_OBJECT_LIST_FILE
    value: '$(Agent.TempDirectory)\$(SIEBEL_EXPORT_BUILD_REF)\lista_sifs_sieb8.txt'

  - name: SIEBEL_EXPORT_LOG_FILE
    value: 'D:\Siebellogs\export_log_${{ parameters.environment }}_$(SIEBEL_EXPORT_BUILD_REF).txt'

  - name: SIEBEL_EXPORT_BUILD_REF
    value: '$(Build.DefinitionName)-$(Build.BuildId)'

  - name: SIEBEL_EXPORT_LOCAL_SIF_DIR
    value: '$(Pipeline.Workspace)\sif_files'

  # ==================================================================
  # Configuração Dinâmica de Scan Fortify
  # ------------------------------------------------------------------
  # Determina o diretório de scan baseado em enableFortifyExclusions
  # ==================================================================
  - ${{ if eq(parameters.enableFortifyExclusions, true) }}:
    - name: FORTIFY_SCAN_DIRECTORY
      value: '$(Build.SourcesDirectory)/$(Build.Repository.Name)'
  - ${{ else }}:
    - name: FORTIFY_SCAN_DIRECTORY
      value: '$(Build.SourcesDirectory)'

  # ==================================================================
  # Configuração DEV6  NonRepository Export (srvrmgr ADMBatchProc)
  # ------------------------------------------------------------------
  # Defaults para export inline via SSH DEV6.
  # Sobrescritos pelo vg-sibl-env-dev6 quando cadastrados no Variable Group.
  # ==================================================================
