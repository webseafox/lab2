# ==================================================================
# Pipeline: SIBL Repository Migration - Exportação e Validação Siebel
# -----------------------------------------------------
# Pipeline de Integração Contínua para migração controlada de objetos
# Siebel (repository .sif / non-repository .xml) com identificação manual,
# export via SSH remoto, Fortify SAST, SonarQube Quality Gate e suporte
# a 4 ambientes (esteira1, esteira2, preprod, prodlike).
# -----------------------------------------------------
# Capacidades Implementadas:
# ✅ Validação forte de parâmetros (Jira, objectType, ambiente)
# ✅ Identificação manual com manifesto JSON estruturado (jq + fallback)
# ✅ Mapeamento automático IDs → Paths Siebel (dicionário inline)
# ✅ Export via SSH remoto (siebdev.exe / WfProcMgr)
# ✅ Fortify SAST obrigatório (compliance)
# ✅ SonarQube Quality Gate bloqueador (SonarAnalysisFromVivo@2)
# ✅ Security Gate consolidado (fail-safe: assume FAILED)
# ✅ Resumo de execução para auditoria (condition: always)
# -----------------------------------------------------
# TODOs Futuras Melhorias:
# - GitOperations: commit/tag automático pós-export
# - Compile: compilação SRF automática
# - Import: importação de objetos no ambiente destino
# - DatabaseMigration: DDL/DML/DCL scripts
# - Gate de aprovação manual (ManualValidation@1)
# ==================================================================

parameters:
  # ==================================================================
  # Configuração de Ambiente e Rastreabilidade
  # ==================================================================
  - name: environment
    displayName: '🌍 Ambiente de Destino'
    type: string
    default: 'preprod'
    values:
      - dev1
      - qa1
      - qa3
      - pp
      - esteira1
      - esteira2
      - preprod
      - prodlike

  - name: jiraProject
    displayName: '🎫 Código do Projeto Jira (recomendado para rastreabilidade)'
    type: string
    default: ''

  # ==================================================================
  # Configuração de Objetos Siebel
  # ------------------------------------------------------------------
  # objectType: Tipo de objeto a filtrar (repository .sif, nonrepository .xml, both)
  # objectIds: Formato type{subtype=Nome} separado por vírgula (vazio = projeto completo)
  # projectName: Nome do projeto Siebel (default: nome do repositório Git)
  # ==================================================================
  - name: objectType
    displayName: '📁 Tipo de Objeto Siebel'
    type: string
    default: 'both'
    values:
      - repository      # Objetos repository (.sif) - Siebel Tools
      - nonrepository   # Objetos non-repository (.xml) - WfProcMgr
      - both            # Ambos tipos simultâneamente

  - name: objectIds
    displayName: '📋 Especificação de Objetos Siebel (type{subtype=Nome})'
    type: string
    default: ''

  - name: projectName
    displayName: '📂 Nome do Projeto Siebel'
    type: string
    default: '$(Build.Repository.Name)'

  # ==================================================================
  # Controle de Fluxo e Capacidades
  # ==================================================================
  - name: enableExport
    displayName: '📤 Habilitar Export de Objetos Siebel'
    type: boolean
    default: true

  - name: enableGitOperations
    displayName: '🔀 Habilitar Operações Git (Commit/Tag)'
    type: boolean
    default: true

  - name: enableCompile
    displayName: '🔨 Habilitar Compilação SRF'
    type: boolean
    default: true

  - name: enableImport
    displayName: '📥 Habilitar Import de Objetos'
    type: boolean
    default: true

  # ==================================================================
  # Configurações de Segurança e Qualidade
  # ==================================================================
  - name: sonarServiceConnection
    type: string
    default: 'VIVO_SONARQUBE'
    displayName: 'Service Connection do SonarQube'

  - name: sonarQualityGate
    type: string
    default: 'AzureDevOps-Default'
    displayName: 'Quality Gate do SonarQube'

  - name: sonarScannerMode
    type: string
    default: 'cli'
    displayName: 'Modo do scanner SonarQube'
    values:
      - 'cli'
      - 'dotnet'

  - name: sonarPollingTimeoutSec
    type: string
    default: '600'
    displayName: 'Timeout do Polling SonarQube (segundos)'

  - name: sonarWsTimeoutSec
    type: string
    default: '300'
    displayName: 'Timeout da API SonarQube (segundos)'

  - name: sonarTaskRetryCount
    type: number
    default: 2
    displayName: 'Tentativas automáticas da task SonarQube em falha transitória'

  - name: useAppConfig
    type: boolean
    default: true
    displayName: 'Usar Azure App Configuration para SonarQube'

  - name: enableFortifyExclusions
    displayName: 'Habilitar exclusões Fortify (checkout repositório)'
    type: boolean
    default: false
  
  - name: SKIP_SECURITY_GATE
    displayName: 'Pular Gate de Segurança'
    type: boolean
    default: false

  # ==================================================================
  # Capacidades Futuras (Roadmap)
  # ==================================================================
  - name: enableDatabaseMigration
    displayName: '🗄️ Habilitar Migração de Banco (DDL/DML/DCL)'
    type: boolean
    default: false

  # ==================================================================
  # Diagnóstico e Simulação
  # ==================================================================
  - name: debugMode
    displayName: '🐛 Modo Debug (logs detalhados)'
    type: boolean
    default: false

  - name: dryRun
    displayName: '🧪 Dry Run (simular sem executar)'
    type: boolean
    default: true

  # ==================================================================
  # Publicação no Azure Artifacts
  # ==================================================================
  - name: enableArtifactsPublish
    displayName: '📦 Habilitar publicação no Azure Artifacts'
    type: boolean
    default: true

  - name: artifactsFeed
    displayName: '📚 Feed do Azure Artifacts'
    type: string
    default: 'DevOps'

  - name: artifactsPackageName
    displayName: '📦 Prefixo do pacote no Azure Artifacts (concatenado com environment)'
    type: string
    default: 'sibl-exports-'

# ==================================================================
# Variáveis Internas do Pipeline
# ==================================================================
variables:
  # ==================================================================
  # Variáveis Globais e Rastreabilidade
  # ==================================================================
  - name: SIGLA
    value: $[ lower(split(variables['System.TeamProject'],' ')[0]) ]

  - name: TIMESTAMP
    value: $[format('{0:yyyyMMddHHmmss}', pipeline.startTime)]

  - name: ARTIFACTS_ENV_SUFFIX
    ${{ if eq(parameters.environment, 'dev1') }}:
      value: 'esteira1'
    ${{ elseif eq(parameters.environment, 'qa1') }}:
      value: 'esteira2'
    ${{ elseif eq(parameters.environment, 'qa3') }}:
      value: 'preprod'
    ${{ elseif eq(parameters.environment, 'pp') }}:
      value: 'preprod'
    ${{ else }}:
      value: '${{ parameters.environment }}'

  # Nome do pacote Azure Artifacts: prefixo + ambiente (ex: sibl-exports-esteira1)
  - name: ARTIFACTS_PACKAGE_NAME
    value: '${{ parameters.artifactsPackageName }}$(ARTIFACTS_ENV_SUFFIX)'

  - name: Git.UserName
    value: 'Azure DevOps Pipeline'

  - name: Git.UserEmail
    value: 'pipeline@telefonicati.onmicrosoft.com'

  # ==================================================================
  # Normalização de Flags Booleanas (parâmetros → variáveis string)
  # ==================================================================
  - name: DEBUG_MODE
    ${{ if eq(parameters.debugMode, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_EXPORT
    ${{ if eq(parameters.enableExport, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_GIT_OPERATIONS
    ${{ if eq(parameters.enableGitOperations, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: DRY_RUN_MODE
    ${{ if eq(parameters.dryRun, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  # ==================================================================
  # AppSec / Azure App Configuration
  # ------------------------------------------------------------------
  # ⚠️ Coordenar alterações com AppSec Team
  # Override via Variable Group ou Azure Key Vault
  # ==================================================================
  - name: APP_CONFIGURATION_AZURE_SUBSCRIPTION
    value: 'DevOpsSharedResources'

  - name: AZURE_APP_CONFIGURATION_ENDPOINT
    value: 'https://appcs-azdevops-shared.azconfig.io'

  - name: AKV_DEVOPS_NAME
    value: 'kv-azdevops-shared'

  # Variáveis utilizadas por templates de Segurança (Fortify/SCA)
  - name: CACORP_LOCATION
    value: '$(Agent.HomeDirectory)/../../certs/CACORP.pem'

  # ==================================================================
  # Infraestrutura de Execução (Agent Pools)
  # ==================================================================
  - name: CI_AGENT_POOL
    value: 'GeneralPurposeLinuxAgentsCI'
  - name: CI_AGENT_POOL_WINDOWS
    value: 'SiebelAgents'

  # ==================================================================
  # Variáveis por Ambiente (carregadas por Variable Groups)
  # ------------------------------------------------------------------
  # Valores reais são injetados via Variable Groups do Azure DevOps.
  # Os placeholders OVERRIDE_VIA_VARIABLE_GROUP indicam que o valor
  # DEVE ser sobrescrito pelo Variable Group correspondente.
  # ==================================================================
  - ${{ if eq(parameters.environment, 'esteira1') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira1_DEV'

  - ${{ if eq(parameters.environment, 'dev1') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira1_DEV'

  - ${{ if eq(parameters.environment, 'esteira2') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira2_DEV'

  - ${{ if eq(parameters.environment, 'qa1') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira2_DEV'

  - ${{ if eq(parameters.environment, 'preprod') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraPreProd_DEV'

  - ${{ if eq(parameters.environment, 'qa3') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraPreProd_DEV'

  - ${{ if eq(parameters.environment, 'pp') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraPreProd_DEV'

  - ${{ if eq(parameters.environment, 'prodlike') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraProdLike_DEV'
    - group: vg-sibl-env-dev-prodlike

  # ==================================================================
  # Paths e Diretórios de Processamento
  # ==================================================================
  - name: EXPORT_PATH
    value: '$(SIEBEL_EXPORT_PATH)\$(TIMESTAMP)'

  - name: SIF_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/sif_files'

  - name: XML_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/xml_files'

  - name: SRF_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/srf_output'

  # ==================================================================
  # Configuração Padrão de Export Siebel
  # ------------------------------------------------------------------
  # Valores default para export sem Variable Groups.
  # ⚠️ SIEBEL_EXPORT_PASSWORD DEVE ser sobrescrito via Variable Group / Key Vault
  # ==================================================================
