# ==================================================================
# Pipeline: SIBL CD Migration Pipeline - Registro de Deploy e Governança
# -----------------------------------------------------
# Pipeline de entrega contínua para consolidar metadados de execução e
# registrar o evento de conclusão de deployment no Event Hub corporativo,
# mantendo rastreabilidade, auditoria e governança no contexto SIBL.
# ==================================================================

# ==================================================================
# Parâmetros do Pipeline
# ==================================================================
parameters:
  # ==================================================================
  # Configuração de Ambiente
  # ==================================================================
  - name: environment
    displayName: '🌍 Ambiente de Destino'
    type: string
    default: 'preprod'
    values:
      - esteira1
      - esteira2
      - preprod
      - prodlike

  # ==================================================================
  # Configuração de Migração de Objetos
  # ==================================================================
  - name: migrationMode
    displayName: '🔄 Modo de Migração'
    type: string
    default: 'manual'
    values:
      - manual      # DEV seleciona objetos manualmente
      - automatic   # Identificação automática de alterações

  - name: objectType
    displayName: '📁 Tipo de Objeto'
    type: string
    default: 'both'
    values:
      - repository      # Objetos .sif (Siebel Tools)
      - nonrepository   # Objetos .xml (WfProcMgr)
      - both            # Ambos tipos

  - name: exportMode
    displayName: '📤 Modo de Exportação'
    type: string
    default: 'unificado'
    values:
      - massivo     # exprep/imprep (export/import completo)
      - unificado   # siebdev (export/import granular)

  - name: projectName
    displayName: '📂 Nome do Projeto Siebel'
    type: string
    default: '$(Build.Repository.Name)'

  # ==================================================================
  # Parâmetros de Controle de Execução
  # ==================================================================
  - name: enableGitOperations
    displayName: '🔀 Habilitar Operações Git (Commit/Tag)'
    type: boolean
    default: true

  - name: enableImport
    displayName: '📥 Habilitar Import de Objetos'
    type: boolean
    default: true

  - name: enableSrfCompilation
    displayName: '🔨 Habilitar Compilação SRF'
    type: boolean
    default: false

  - name: enableRestart
    displayName: '🔄 Habilitar Restart de Serviços'
    type: boolean
    default: false

  - name: projectLockBy
    displayName: 'Identificador Siebel para Lock de Projetos'
    type: string
    default: ''

  - name: restartEnvironmentsCsv
    displayName: '🌐 Ambientes habilitados para Restart (CSV)'
    type: string
    default: 'esteira1,esteira2,preprod,prodlike'

  - name: enableActivate
    displayName: '✅ Habilitar Ativação de Objetos (WF/RS/Task)'
    type: boolean
    default: false

  # ==================================================================
  # Capacidades de Migração Especial (Evolutivas)
  # ==================================================================
  - name: enableDatabaseMigration
    displayName: '🗄️ Habilitar Migração de Banco (DDL/DML/DCL)'
    type: boolean
    default: false

  - name: enableWorkspaceProjects
    displayName: '📦 Habilitar Migração de Workspace Projects'
    type: boolean
    default: false

  - name: enableJobMigration
    displayName: '⏰ Habilitar Migração de JOBs'
    type: boolean
    default: false

  # ==================================================================
  # Configurações de Artefato e Versionamento
  # ==================================================================
  - name: artifactsFeed
    displayName: '📚 Feed do Azure Artifacts (origem dos exports do CI)'
    type: string
    default: 'DevOps'

  - name: artifactsProject
    displayName: '🏗️ Projeto Azure DevOps do feed de origem'
    type: string
    default: 'DevOps'

  - name: artifactsPackageName
    displayName: '📦 Prefixo do pacote no Azure Artifacts (concatenado com environment)'
    type: string
    default: 'sibl-exports-'

  - name: artifactsPackageVersion
    displayName: '🔖 Versão do pacote a importar (ex: 2026.4.23-1993735 | vazio = latest)'
    type: string
    default: ''

  - name: additionalArtifacts
    displayName: '📦 Artefatos adicionais para deploy'
    type: object
    default: []
    # Cada item deve conter:
    # - alias: identificador curto e único do pacote
    # - feed: feed Azure Artifacts de origem
    # - packageName: nome do pacote no feed
    # - packageVersion: versão exata do pacote

  # ==================================================================
  # Diagnóstico e Simulação
  # ==================================================================
  - name: debugMode
    displayName: '🐛 Modo Debug (logs detalhados)'
    type: boolean
    default: false

  - name: dryRun
    displayName: '🧪 Dry Run (simular sem executar)'
    type: boolean
    default: false

# ==================================================================
# Variáveis Internas do Pipeline
# ==================================================================
variables:
  # ==================================================================
  # Variáveis Globais e de Rastreabilidade
  # ==================================================================
  - name: SIGLA
    value: $[ lower(split(variables['System.TeamProject'],' ')[0]) ]

  - name: TIMESTAMP
    value: $[format('{0:yyyyMMddHHmmss}', pipeline.startTime)]

  - name: ARTIFACTS_ENV_SUFFIX
    value: '${{ parameters.environment }}'

  # Nome do pacote Azure Artifacts: prefixo + ambiente (ex: sibl-exports-dev1)
  - name: ARTIFACTS_PACKAGE_NAME
    value: '${{ parameters.artifactsPackageName }}$(ARTIFACTS_ENV_SUFFIX)'

  # ==================================================================
  # Normalização de Flags Booleanas (parâmetros -> variáveis string)
  # ==================================================================
  # ⚠️ VARIÁVEIS DERIVADAS DE PARÂMETROS BOOLEANOS (Normalização)
  # Convertendo booleanos para strings 'true'/'false' para consistência

  - name: DEBUG_MODE
    ${{ if eq(parameters.debugMode, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: DRY_RUN_MODE
    ${{ if eq(parameters.dryRun, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_IMPORT
    ${{ if eq(parameters.enableImport, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_SRF_COMPILATION
    ${{ if eq(parameters.enableSrfCompilation, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_RESTART
    ${{ if eq(parameters.enableRestart, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  - name: ENABLE_ACTIVATE
    ${{ if eq(parameters.enableActivate, true) }}:
      value: 'true'
    ${{ else }}:
      value: 'false'

  # ==================================================================
  # Configuração AppSec / Azure App Configuration
  # ==================================================================
  # ⚠️ Azure App Configuration (AppSec) - Coordenar com AppSec Team
  # Customizações: Atualizar endpoint + Key Vault name + coordenar com AppSec
  - name: APP_CONFIGURATION_AZURE_SUBSCRIPTION
    value: 'DevOpsSharedResources'
    # Override: Use variable group ou Azure Key Vault ref

  - name: AZURE_APP_CONFIGURATION_ENDPOINT
    value: 'https://appcs-azdevops-shared.azconfig.io'
    # Override: Use seu próprio endpoint: https://appcs-<environment>-<region>.azconfig.io

  - name: AKV_DEVOPS_NAME
    value: 'kv-devops-shared'
    # Override: Use seu próprio Key Vault name: kv-<project>-<environment>

  # ==================================================================
  # Infraestrutura de Execução (Agent Pools)
  # ==================================================================
  # Agent Pools
  - name: CD_AGENT_POOL
    value: 'GeneralPurposeLinuxAgentsCD'

  # [FUTURE] TODO: Configurar pool específico Siebel quando disponível
  # Quando houver agentes Siebel dedicados, uncomment e configure:
  # - name: SIEBEL_AGENT_POOL
  #   value: 'PollSiebelAgents'
  # Status: MVP usa pools Linux padrão (será customizado em fase 2)

  # ==================================================================
  # Variáveis por Ambiente (carregadas por Variable Groups)
  # ==================================================================
  # ⚠️ VARIÁVEIS DE AMBIENTE: Usar Variable Groups (NUNCA hardcode credenciais)
  # Valores injetados via Variable Groups — placeholders OVERRIDE_VIA_VARIABLE_GROUP
  # indicam que o valor DEVE ser sobrescrito pelo Variable Group correspondente.
  - ${{ if eq(parameters.environment, 'esteira1') }}:
    - name: SIEBEL_SERVER
      value: '$(SIEBEL_SERVER_ESTEIRA1)'
    - name: SIEBEL_SERVER_IP
      value: '$(SIEBEL_SERVER_IP_ESTEIRA1)'
    - name: WINDOWS_SERVER
      value: '$(WINDOWS_SERVER_ESTEIRA1)'
    - name: WINDOWS_SERVER_IP
      value: '$(WINDOWS_SERVER_IP_ESTEIRA1)'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira1_DEV'
    - name: SIEBEL_SRF_DEST_PATH
      value: 'D:\SRF\ESTEIRA1\siebel_sia.srf'
    - group: vg-sibl-env-dev2

  - ${{ if eq(parameters.environment, 'esteira2') }}:
    - name: SIEBEL_SERVER
      value: '$(SIEBEL_SERVER_ESTEIRA2)'
    - name: SIEBEL_SERVER_IP
      value: '$(SIEBEL_SERVER_IP_ESTEIRA2)'
    - name: WINDOWS_SERVER
      value: '$(WINDOWS_SERVER_ESTEIRA2)'
    - name: WINDOWS_SERVER_IP
      value: '$(WINDOWS_SERVER_IP_ESTEIRA2)'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_Esteira2_DEV'
    - name: SIEBEL_SRF_DEST_PATH
      value: 'D:\SRF\ESTEIRA2\siebel_sia.srf'
    - group: vg-sibl-env-dev5

  - ${{ if eq(parameters.environment, 'preprod') }}:
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraPreProd_DEV'
    - name: SIEBEL_SRF_DEST_PATH
      value: 'D:\SRF\PREPROD\siebel_sia.srf'
    #- group: vg-sibl-env-dev4
    - group: vg-sibl-env-dev-preprod

  - ${{ if eq(parameters.environment, 'prodlike') }}:
    - name: SIEBEL_LOG
      value: 'D:\SiebelLogs\prodlike_$(Build.BuildId).log'
    - name: SIEBEL_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: WINDOWS_SERVER_IP
      value: 'OVERRIDE_VIA_VARIABLE_GROUP'
    - name: SIEBEL_EXPORT_DATASOURCE
      value: 'SIBL_EsteiraProdLike_DEV'
    - name: SIEBEL_SRF_DEST_PATH
      value: 'D:\SRF\DEV8\siebel_sia.srf'
    - group: vg-sibl-env-dev-prodlike


  # ==================================================================
  # Paths e Diretórios de Processamento
  # ==================================================================
  # Paths e Diretórios (usar Variable Groups em produção)

  # ==================================================================
  # Configuração Siebel Tools (Import)
  # ------------------------------------------------------------------
  # Mesmos defaults do CI — sobrescrever via Variable Group em produção.
  # ⚠️ SIEBEL_EXPORT_PASSWORD DEVE ser sobrescrito via Variable Group / Key Vault
  # ==================================================================

  # Caminho do binário Siebel Tools (siebdev.exe) no agent Windows
  # Override: defina SIEBEL_EXPORT_TOOLS_PATH no variable group vg-sibl-env-global
  - name: SIEBEL_EXPORT_TOOLS_PATH
    value: 'D:\Siebel\Tools15\BIN'

  # Referência única de build para nomear arquivos de log e cfg temporários
  - name: SIEBEL_EXPORT_BUILD_REF
    value: '$(Build.DefinitionName)-$(Build.BuildId)'

  # Caminho do tools_DevOps.cfg usado pelo siebdev.exe (/batchimport e /bc)
  - name: SIEBEL_EXPORT_CONFIG_PATH
    value: '$(Agent.TempDirectory)\$(SIEBEL_EXPORT_BUILD_REF)\tools_DevOps.cfg'

  # Usuário de serviço Siebel para autenticação via siebdev.exe e srvrmgr
  - name: SIEBEL_EXPORT_USER
    value: 'CRM_MIGRADOR_SIEBEL8_PROD'

  # Nome do repositório Siebel alvo do import
  - name: SIEBEL_EXPORT_REPOSITORY
    value: 'Siebel Repository'

  # ROW_ID do usuário registrado como responsável pelo lock de projetos no Siebel Tools
  - name: SIEBEL_PROJECT_LOCK_LANG
    value: 'PTB'

  # Caminho do srvrmgr no servidor Linux (job ImportNonRepository)
  - name: SIEBEL_SRVRMGR_PATH
    value: '/app/siebel/siebsrvr/bin/srvrmgr'

  # Diretório remoto de export no servidor Siebel Linux
  - name: SIEBEL_REMOTE_EXPORT_DIR
    value: '/app/siebel/exports/adm/$(Build.BuildId)'

  # Idioma do srvrmgr
  - name: SIEBEL_SRVRMGR_LANG
    value: 'PTB'

  # RowID padrão do processo UDA Batch Import no WfProcMgr.
  # Pode ser sobrescrito por variable group por ambiente quando necessário.
  - name: SIEBEL_UDA_IMPORT_ROWID
    value: 'UDA_BATCH_IMPORT_DEFAULT'

  - name: EXPORT_PATH
    value: '$(SIEBEL_EXPORT_PATH)\$(TIMESTAMP)\$(Build.BuildId)'

  - name: SIF_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/sif_files/$(Build.BuildId)'

  - name: XML_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/xml_files/$(Build.BuildId)'

  - name: INI_OUTPUT_PATH
    value: '$(Agent.TempDirectory)/ini_files/$(Build.BuildId)'

  - name: SRF_OUTPUT_PATH
    value: '$(Pipeline.Workspace)/srf_output/$(Build.BuildId)'

  # Diretório base único dos artefatos baixados para deploy
  - name: DEPLOY_ARTIFACTS_PATH
    value: '$(Pipeline.Workspace)\deploy-artifacts\$(Build.BuildId)'

  # Diretório de logs da execução (isolado por BuildId)
  - name: SIEBEL_PIPE_EXEC_LOG_DIR
    value: '$(DEPLOY_ARTIFACTS_PATH)\LogsPipe$(Build.BuildId)'

  # Parâmetros de polling do import repository (PowerShell)
  - name: IMPORT_LOG_WAIT_TIMEOUT_SECONDS
    value: '600'

  - name: IMPORT_LOG_POLL_SECONDS
    value: '10'

  - name: IMPORT_LOG_READ_ATTEMPTS
    value: '31'

  - name: IMPORT_LOG_READ_POLL_SECONDS
    value: '5'

  # Caminho do SRF de destino no agent — definido por ambiente nas variáveis condicionais acima
  # Override: defina SIEBEL_SRF_DEST_PATH no variable group vg-sibl-env-global

  # ==================================================================
  # Variable Groups Compartilhados
  # ==================================================================
  - group: vg-sibl-env-global
  #- group: vg-sibl-env-dev-preprod

# ==================================================================
# Estágios do Pipeline
# ==================================================================
stages:

  # ==================================================================
  # Stage 1: Prepare - Inicialização e Validação
  # Descrição: Valida parâmetros de entrada, exibe configuração e
  #            resolve a versão do artefato a ser importado.
  # ==================================================================
  - stage: Prepare
    displayName: '🚀 Prepare - Inicialização'
    pool:
      name: $(CD_AGENT_POOL)
    jobs:
      - job: Initialize
        displayName: 'Inicialização e Validação'
        steps:
          - checkout: none

          - bash: |
              set -eo pipefail
              echo "--- Pré-check Azure Artifacts CLI ---"

              if ! command -v az >/dev/null 2>&1; then
                echo "##[error]Azure CLI (az) não encontrado no agente."
                echo "##[error]Instale az cli e extensão azure-devops no pool $(CD_AGENT_POOL)."
                exit 1
              fi

              if ! az extension show --name azure-devops >/dev/null 2>&1; then
                echo "Instalando extensão azure-devops..."
                az extension add --name azure-devops --only-show-errors >/dev/null
              fi

              if [[ -z "$(System.AccessToken)" ]]; then
                echo "##[error]System.AccessToken indisponível."
                echo "##[error]Habilite 'Allow scripts to access OAuth token' na pipeline."
                exit 1
              fi

              echo "✅ Pré-check do Azure CLI concluído"
            displayName: '🔧 Pré-check Azure CLI/Extensão'

          - bash: |
              echo "--- SIBL CD Pipeline ---"
              echo "Build: $(Build.BuildId) | Ambiente: ${{ parameters.environment }} | Tipo: ${{ parameters.objectType }}"
              echo "Import: ${{ parameters.enableImport }} | CompileSRF: ${{ parameters.enableSrfCompilation }} | Restart: ${{ parameters.enableRestart }} | Activate: ${{ parameters.enableActivate }}"
              if [[ "$(DEBUG_MODE)" == "true" ]]; then
                echo "[DEBUG] MigrationMode=${{ parameters.migrationMode }} | ExportMode=${{ parameters.exportMode }}"
                echo "[DEBUG] Feed=${{ parameters.artifactsFeed }} | Package=$(ARTIFACTS_PACKAGE_NAME) | Version=${{ parameters.artifactsPackageVersion }}"
                echo "[DEBUG] DryRun=${{ parameters.dryRun }} | Debug=${{ parameters.debugMode }} | EnableSRF=$(ENABLE_SRF_COMPILATION)"
              fi
            displayName: '📋 Exibir Configuração'

          - bash: |
              set -eo pipefail
              errors=0

              environment="${{ parameters.environment }}"
              echo "✅ Ambiente: ${environment}"

              # Bloqueio: prod requer aprovação manual
              if [[ "${environment}" == "prod" ]]; then
                echo "🚨 ERRO: Deploy para PROD requer gate de aprovação manual. Configure ManualValidation no pipeline."
                errors=$((errors + 1))
              fi

              # Aviso: nenhuma operação habilitada
              enableImport="${{ parameters.enableImport }}"
              enableRestart="${{ parameters.enableRestart }}"
              enableActivate="${{ parameters.enableActivate }}"
              if [[ "${enableImport}" == "false" && "${enableRestart}" == "false" && "${enableActivate}" == "false" ]]; then
                echo "⚠️  AVISO: Nenhuma operação habilitada (import, restart, activate). Pipeline executará apenas o Summary."
              fi

              echo "--- Resultado: ${errors} erro(s) ---"
              if [[ ${errors} -gt 0 ]]; then exit 1; fi
              echo "✅ Validação OK"
            displayName: '✅ Validar Parâmetros'

          - bash: |
              set -eo pipefail
              # Resolve artifact version: aceita valor único, '*' ou CSV (usa o primeiro para o pacote principal)
              artifactVersionInput="${{ parameters.artifactsPackageVersion }}"
              artifactVersion=""
              artifactVersionsCsv=""
              validVersions=()

              echo "##########################################################################################"
              echo "# 🔍 RASTREAMENTO DE VERSÕES - ENTRADA DO PIPELINE CD"
              echo "##########################################################################################"
              echo ""
              echo "📥 Versão(ões) de entrada recebida(s): '${artifactVersionInput}'"
              echo ""

              if [[ -z "${artifactVersionInput}" || "${artifactVersionInput}" == "*" ]]; then
                artifactVersion="*"
                artifactVersionsCsv="*"
                echo "ℹ️  Versão não especificada — usando latest (*)"
              else
                IFS=',' read -ra rawVersions <<< "${artifactVersionInput}"

                for rawVersion in "${rawVersions[@]}"; do
                  version="$(echo "${rawVersion}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  [[ -z "${version}" ]] && continue

                  if [[ "${version}" != "*" && ! "${version}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-[0-9]+$ ]]; then
                    echo "🚨 ERRO: Formato de versão inválido: '${artifactVersionInput}'"
                    echo "   Item inválido: '${version}'"
                    echo "   Esperado: YYYY.M.D-BuildId (ex: 2026.4.23-1993735), vazio ou '*' para latest"
                    exit 1
                  fi

                  validVersions+=("${version}")
                done

                if [[ ${#validVersions[@]} -eq 0 ]]; then
                  artifactVersion="*"
                  artifactVersionsCsv="*"
                  echo "ℹ️  Nenhuma versão válida informada — usando latest (*)"
                else
                  artifactVersion="${validVersions[0]}"
                  artifactVersionsCsv="$(IFS=','; echo "${validVersions[*]}")"
                  if [[ ${#validVersions[@]} -gt 1 ]]; then
                    echo "⚠️  Múltiplas versões recebidas (${artifactVersionInput})."
                    echo "⚠️  Todas as versões válidas serão baixadas: ${artifactVersionsCsv}"
                    echo "⚠️  Metadado do pacote principal permanece na primeira versão: ${artifactVersion}"
                  fi
                fi
              fi

              if [[ "${artifactVersion}" == "*" ]]; then
                echo "ℹ️  Versão resolvida para pacote principal: latest (*)"
              else
                echo "ℹ️  Versão resolvida para pacote principal: ${artifactVersion}"
              fi

              echo ""
              echo "📊 RESUMO DE VERSÕES PARA PROCESSAMENTO:"
              echo "  • Versão(ões) a processar (CSV): ${artifactVersionsCsv}"
              echo "  • Total de versões: $(echo "${artifactVersionsCsv}" | tr ',' '\n' | grep -v '^$' | wc -l)"
              if [[ ${#validVersions[@]} -gt 1 ]]; then
                echo "  ⚠️  MODO MULTI-VERSÃO ATIVADO: ${#validVersions[@]} versão(ões) serão processadas"
                for idx in "${!validVersions[@]}"; do
                  echo "      [$((idx+1))/${#validVersions[@]}] ${validVersions[$idx]}"
                done
              fi
              echo ""
              echo "##vso[task.setvariable variable=ARTIFACT_VERSION;isOutput=true]${artifactVersion}"
              echo "##vso[task.setvariable variable=ARTIFACT_VERSIONS;isOutput=true]${artifactVersionsCsv}"
              echo "✅ Versão do artefato resolvida: ${artifactVersion}"
              echo "##########################################################################################"
              echo ""
            name: resolveVersion
            displayName: '🔖 Resolver Versão do Artefato'

  # ==================================================================
  # Stage 2: Download - Obter Artefatos do Azure Artifacts
  # Descrição: Baixa o Universal Package publicado pelo CI (sibl-exports)
  #            e publica como pipeline artifact para consumo do Deploy.
  # ==================================================================
  - stage: Download
    displayName: '📥 Download - Artefatos do CI'
    dependsOn: Prepare
    # Roda quando enableImport=true OU quando dryRun=true (download sempre ocorre em simulação)
    condition: and(succeeded(), or(eq('${{ parameters.enableImport }}', 'true'), eq('${{ parameters.dryRun }}', 'true')))
    pool:
      name: $(CD_AGENT_POOL)
    jobs:
      - job: DownloadArtifacts
        displayName: 'Download Universal Package'
        variables:
          ARTIFACT_VERSION: $[ stageDependencies.Prepare.Initialize.outputs['resolveVersion.ARTIFACT_VERSION'] ]
          ARTIFACT_VERSIONS: $[ stageDependencies.Prepare.Initialize.outputs['resolveVersion.ARTIFACT_VERSIONS'] ]
        steps:
          - checkout: none

          - bash: |
              set -eo pipefail

              feed='${{ parameters.artifactsFeed }}'
              project='${{ parameters.artifactsProject }}'
              packageName='$(ARTIFACTS_PACKAGE_NAME)'
              versionsCsv='$(ARTIFACT_VERSIONS)'
              combinedRoot='$(Pipeline.Workspace)/combined-artifacts'
              tempRoot='$(Pipeline.Workspace)/main-artifacts-by-version'

              # Evita acumular manifesto/artefatos de execuções anteriores em agentes persistentes
              workspaceRoot="$(Pipeline.Workspace)"
              for cleanupPath in "${combinedRoot}" "${tempRoot}"; do
                if [[ "${cleanupPath}" != "${workspaceRoot}"/* ]]; then
                  echo "##[error]Caminho de limpeza fora de Pipeline.Workspace: ${cleanupPath}"
                  exit 1
                fi
                rm -rf -- "${cleanupPath}"
                mkdir -p -- "${cleanupPath}"
              done

              IFS=',' read -ra requestedVersions <<< "${versionsCsv}"
              downloads=0
              downloadedVersions=()

              echo "##########################################################################################"
              echo "# 📥 RASTREAMENTO DE DOWNLOAD - VERSÕES POR VERSÃO"
              echo "##########################################################################################"
              echo ""

              for rawVersion in "${requestedVersions[@]}"; do
                version="$(echo "${rawVersion}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                [[ -z "${version}" ]] && continue

                versionLabel="${version}"
                if [[ "${version}" == "*" ]]; then
                  versionLabel="latest"
                fi

                targetDir="${tempRoot}/${downloads}-${versionLabel}"
                mkdir -p "${targetDir}"

                echo ""
                echo "🔄 INICIANDO DOWNLOAD #$((downloads + 1))"
                echo "  Pacote     : ${packageName}"
                echo "  Versão     : ${version} (${versionLabel})"
                echo "  Destino    : ${targetDir}"
                echo "  Feed       : ${feed}"
                echo "  Timestamp  : $(date +'%Y-%m-%d %H:%M:%S')"
                echo ""

                echo "📥 Baixando pacote principal: ${packageName} versão ${version}"
                az artifacts universal download \
                  --organization "$(System.CollectionUri)" \
                  --scope organization \
                  --feed "${feed}" \
                  --name "${packageName}" \
                  --version "${version}" \
                  --path "${targetDir}" || {
                  echo "🚨 Falha ao baixar pacote principal na versão ${version}"
                  echo "💡 Verifique permissões do System.AccessToken e acesso ao feed ${feed}"
                  exit 1
                }

                echo "✅ Download concluído para versão ${version}"
                echo "   📋 Objetos baixados nesta versão:"
                versionFileCount=0
                while IFS= read -r f; do
                  relPath="${f#${targetDir}/}"
                  echo "     • ${relPath}"
                  echo "${version}|${relPath}" >> "${combinedRoot}/.version-manifest.txt"
                  versionFileCount=$((versionFileCount + 1))
                done < <(find "${targetDir}" -type f | sort)
                echo "   Total: ${versionFileCount} objeto(s)"
                echo ""

                echo "   🔍 Verificando conflitos com versões anteriores:"
                overwriteCount=0
                while IFS= read -r srcFile; do
                  relPath="${srcFile#${targetDir}/}"
                  destFile="${combinedRoot}/${relPath}"
                  if [[ -f "${destFile}" ]]; then
                    prevVersion=$(grep "|${relPath}$" "${combinedRoot}/.version-manifest.txt" | head -1 | cut -d'|' -f1)
                    echo "     ⚠️  SOBRESCRITA: ${relPath}"
                    echo "        Versão anterior: ${prevVersion} → será substituída por: ${version}"
                    overwriteCount=$((overwriteCount + 1))
                  fi
                done < <(find "${targetDir}" -type f | sort)
                if [[ ${overwriteCount} -eq 0 ]]; then
                  echo "     ✅ Sem conflitos — todos os objetos são novos nesta versão"
                else
                  echo "     ⚠️  ${overwriteCount} objeto(s) sobrescrito(s) por ${version}"
                fi
                echo ""

                shopt -s dotglob nullglob
                cp -R "${targetDir}"/. "${combinedRoot}"/
                shopt -u dotglob nullglob

                downloadedVersions+=("${version}")
                downloads=$((downloads + 1))
              done

              if [[ ${downloads} -eq 0 ]]; then
                echo "##[error]Nenhuma versão válida foi processada para o pacote principal."
                exit 1
              fi

              echo ""
              echo "##########################################################################################"
              echo "# ✅ RESUMO FINAL DE DOWNLOADS"
              echo "##########################################################################################"
              echo ""
              echo "✅ Pacote principal baixado em ${downloads} versão(ões)."
              echo ""
              echo "📋 AUDITORIA DE VERSÕES PROCESSADAS:"
              idx=1
              for processedVersion in "${downloadedVersions[@]}"; do
                if [[ "${processedVersion}" == "*" ]]; then
                  echo "  [$idx/${#downloadedVersions[@]}] latest (*)"
                else
                  echo "  [$idx/${#downloadedVersions[@]}] ${processedVersion}"
                fi
                idx=$((idx + 1))
              done
              echo ""
              echo "📦 Metadados:"
              echo "  • Pacote     : ${packageName}"
              echo "  • Feed       : ${feed}"
              echo "  • Total versões: ${downloads}"
              echo "  • Caminho consolidado: ${combinedRoot}"
              echo ""
              echo "##########################################################################################"
            displayName: '📥 Download Universal Package (todas as versões)'
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              AZURE_DEVOPS_EXT_ARTIFACTTOOL_PATVAR: $(System.AccessToken)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - bash: |
              set -eo pipefail

              additionalArtifactsJson='${{ convertToJson(parameters.additionalArtifacts) }}'

              if [[ "$additionalArtifactsJson" == "[]" || -z "$additionalArtifactsJson" ]]; then
                echo "ℹ️  Nenhum artefato adicional para download"
                exit 0
              fi

              echo "Processando artefatos adicionais..."
              echo "$additionalArtifactsJson" | jq -r '.[] | @base64' | while read artifact_b64; do
                artifact=$(echo "$artifact_b64" | base64 -d)
                alias=$(echo "$artifact" | jq -r '.alias')
                feed=$(echo "$artifact" | jq -r '.feed')
                packageName=$(echo "$artifact" | jq -r '.packageName')
                packageVersion=$(echo "$artifact" | jq -r '.packageVersion')

                # Normalizar versão: vazio ou '*' = '*' (latest)
                if [[ -z "$packageVersion" || "$packageVersion" == "null" || "$packageVersion" == "*" ]]; then
                  packageVersion="*"
                fi

                echo "📥 Baixando artefato adicional: $alias (versão: $packageVersion)"

                # Exportar como variáveis de ambiente para a task Azure CLI
                export ADDITIONAL_ARTIFACT_ALIAS="$alias"
                export ADDITIONAL_ARTIFACT_FEED="$feed"
                export ADDITIONAL_ARTIFACT_PACKAGE="$packageName"
                export ADDITIONAL_ARTIFACT_VERSION="$packageVersion"
              done
            displayName: '🔍 Validar Artefatos Adicionais'
            condition: ne('${{ length(parameters.additionalArtifacts) }}', 0)

          - bash: |
              set -eo pipefail

              additionalArtifactsJson='${{ convertToJson(parameters.additionalArtifacts) }}'
              project='${{ parameters.artifactsProject }}'

              if [[ "$additionalArtifactsJson" == "[]" || -z "$additionalArtifactsJson" ]]; then
                exit 0
              fi

              echo "$additionalArtifactsJson" | jq -r '.[] | @base64' | while read artifact_b64; do
                artifact=$(echo "$artifact_b64" | base64 -d)
                alias=$(echo "$artifact" | jq -r '.alias')
                feed=$(echo "$artifact" | jq -r '.feed')
                packageName=$(echo "$artifact" | jq -r '.packageName')
                packageVersion=$(echo "$artifact" | jq -r '.packageVersion')

                # Normalizar versão
                if [[ -z "$packageVersion" || "$packageVersion" == "null" || "$packageVersion" == "*" ]]; then
                  packageVersion="*"
                fi

                downloadDir="$(Pipeline.Workspace)/additional-artifacts/${alias}"
                mkdir -p "$downloadDir"

                echo "📥 Download: $packageName v$packageVersion de $feed para $downloadDir"

                # Usar az cli para download (alternativa a task UniversalPackages quando loop não funciona)
                az artifacts universal download \
                  --organization "$(System.CollectionUri)" \
                  --scope organization \
                  --feed "$feed" \
                  --name "$packageName" \
                  --version "$packageVersion" \
                  --path "$downloadDir" || {
                  echo "🚨 Falha ao baixar $alias"
                  echo "💡 Verifique permissões do System.AccessToken e acesso ao feed $feed"
                  exit 1
                }
              done
            displayName: '📥 Download Artefatos Adicionais (via az cli)'
            condition: ne('${{ length(parameters.additionalArtifacts) }}', 0)
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              AZURE_DEVOPS_EXT_ARTIFACTTOOL_PATVAR: $(System.AccessToken)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - bash: |
              set -eo pipefail

              combinedRoot="$(Pipeline.Workspace)/combined-artifacts"
              additionalRoot="$(Pipeline.Workspace)/additional-artifacts"

              if [[ -d "${additionalRoot}" ]]; then
                shopt -s dotglob nullglob
                for packageDir in "${additionalRoot}"/*; do
                  if [[ -d "${packageDir}" ]]; then
                    echo "Mesclando artefatos adicionais de: ${packageDir}"
                    cp -R "${packageDir}"/. "${combinedRoot}"/
                  fi
                done
                shopt -u dotglob nullglob
              fi

              echo "Estrutura consolidada dos artefatos:"
              find "${combinedRoot}" -maxdepth 3 -type f | sed 's/^/  • /' || true
            displayName: '🔀 Consolidar Artefatos para Deploy'

          - bash: |
              set -eo pipefail
              sifDir="$(Pipeline.Workspace)/combined-artifacts/repository-export-raw"
              xmlDir="$(Pipeline.Workspace)/combined-artifacts/exported-xml-files"

              sifCount=$(find "${sifDir}" -maxdepth 1 -name '*.sif' -type f 2>/dev/null | wc -l | tr -d ' ')
              xmlCount=$(find "${xmlDir}" -maxdepth 1 -name '*.xml' -type f 2>/dev/null | wc -l | tr -d ' ')

              echo ""
              echo "##########################################################################################"
              echo "# 🔀 CONSOLIDAÇÃO DE ARTEFATOS - RASTREAMENTO"
              echo "##########################################################################################"
              echo ""
              echo "📊 ARTEFATOS CONSOLIDADOS:"
              echo "  • Arquivos .sif (Repository): ${sifCount}"
              echo "  • Arquivos .xml (Non-Repository): ${xmlCount}"
              echo "  • Total de artefatos: $((sifCount + xmlCount))"
              echo ""
              echo "📁 ESTRUTURA CONSOLIDADA (primeiros 30 arquivos):"
              find "$(Pipeline.Workspace)/combined-artifacts" -maxdepth 3 -type f | head -30 | sed 's/^/     • /' || true

              totalFiles=$(find "$(Pipeline.Workspace)/combined-artifacts" -type f | wc -l)
              if [[ $totalFiles -gt 30 ]]; then
                echo "     • ... e mais $((totalFiles - 30)) arquivo(s)"
              fi
              echo ""

              if [[ "${sifCount}" -eq 0 && "${xmlCount}" -eq 0 ]]; then
                echo "##[error]Nenhum arquivo .sif ou .xml encontrado no pacote. Verifique o feed/pacote/versão."
                exit 1
              fi
              echo "✅ Consolidação concluída com sucesso"

              # Leitura do manifesto para resolução final versão→objetos
              manifestFile="$(Pipeline.Workspace)/combined-artifacts/.version-manifest.txt"
              if [[ -f "${manifestFile}" ]]; then
                echo ""
                echo "##########################################################################################"
                echo "# 📦 RESOLUÇÃO FINAL: QUAL VERSÃO DE CADA OBJETO FOI IMPLEMENTADA"
                echo "##########################################################################################"
                echo ""
                echo "🎯 OBJETOS → VERSÃO IMPLEMENTADA (última versão prevalece em conflitos):"
                echo ""
                declare -A finalVersion
                while IFS='|' read -r ver relPath; do
                  finalVersion["${relPath}"]="${ver}"
                done < "${manifestFile}"
                for relPath in $(echo "${!finalVersion[@]}" | tr ' ' '\n' | sort); do
                  ver="${finalVersion[${relPath}]}"
                  echo "  • ${relPath}"
                  echo "      └─ versão: ${ver}"
                done
                echo ""
                echo "⚠️  OBJETOS EM CONFLITO (presentes em múltiplas versões):"
                conflictFound=false
                while IFS= read -r relPath; do
                  count=$(grep -c "|${relPath}$" "${manifestFile}" || true)
                  if [[ ${count} -gt 1 ]]; then
                    conflictFound=true
                    echo "  • ${relPath}"
                    grep "|${relPath}$" "${manifestFile}" | while IFS='|' read -r ver _; do
                      echo "      - ${ver}"
                    done
                    finalVer=$(grep "|${relPath}$" "${manifestFile}" | tail -1 | cut -d'|' -f1)
                    echo "      ✅ PREVALECEU: ${finalVer}"
                    echo ""
                  fi
                done < <(cut -d'|' -f2 "${manifestFile}" | sort -u)
                if [[ "${conflictFound}" == "false" ]]; then
                  echo "  ✅ Nenhum conflito — cada objeto pertence a exatamente uma versão"
                fi
                echo ""
              fi
              echo "##########################################################################################"
              echo ""

              echo "##vso[task.setvariable variable=SIF_COUNT;isOutput=true]${sifCount}"
              echo "##vso[task.setvariable variable=XML_COUNT;isOutput=true]${xmlCount}"
              echo "✅ Artefatos validados"
            name: validateArtifacts
            displayName: '✅ Validar Artefatos'

          - task: PublishPipelineArtifact@1
            displayName: '📤 Publicar Artefatos para Stage Deploy'
            inputs:
              targetPath: '$(Pipeline.Workspace)/combined-artifacts'
              artifact: 'deploy-artifacts'
              publishLocation: 'pipeline'

  # ==================================================================
  # Stage 3: Deploy - Importação de Objetos Siebel
  # Descrição: Importa objetos repository (.sif via siebdev.exe) e/ou
  #            non-repository (.xml via srvrmgr/ADMBatchProc) no ambiente
  #            de destino. Jobs paralelos por tipo de objeto.
  # ==================================================================
  - stage: Deploy
    displayName: '🚀 Deploy - Importação Siebel'
    dependsOn:
      - Prepare
      - Download
    # Roda quando enableImport=true OU dryRun=true (simula import + validate log + compilação SRF)
    condition: and(succeeded(), or(eq('${{ parameters.enableImport }}', 'true'), eq('${{ parameters.dryRun }}', 'true')))
    jobs:
      # ------------------------------------------------------------------
      # Job 1: Import Repository (.sif) via siebdev.exe
      # Executa no pool SiebelAgents (Windows com Siebel Tools instalado)
      # ------------------------------------------------------------------
      - job: ImportRepository
        displayName: 'Import Repository Objects (.sif)'
        condition: and(succeeded(), or(eq('${{ parameters.objectType }}', 'repository'), eq('${{ parameters.objectType }}', 'both')))
        # Sem kill por PID: o siebdev.exe roda de forma síncrona e o corte de execução
        # passa a ser este timeout de job (import ~3 min + compilação SRF até ~80 min).
        timeoutInMinutes: 180
        pool:
          name: SiebelAgents
        steps:
          - checkout: none

          - task: DownloadSecureFile@1
            name: downloadSiebelSecureConfigImport
            displayName: '🔐 Download Secure File tools_DevOps.cfg (Import)'
            inputs:
              secureFile: 'tools_DevOps.cfg'
            env:
              NODE_SKIP_PLATFORM_CHECK: '1'

          - powershell: |
              Write-Host "--- Preparar Configuração Siebel Tools (Import) ---"

              $secureFileFromJob = "$(downloadSiebelSecureConfigImport.secureFilePath)"
              if ([string]::IsNullOrWhiteSpace($secureFileFromJob)) {
                Write-Error "Caminho do Secure File não foi retornado pelo DownloadSecureFile"
                exit 1
              }

              if (-not (Test-Path $secureFileFromJob)) {
                Write-Error "Secure File tools_DevOps.cfg não encontrado no job: $secureFileFromJob"
                exit 1
              }

              Write-Host "Secure File disponível em: $secureFileFromJob"
              Write-Host "##vso[task.setvariable variable=SIEBEL_EXPORT_CONFIG_PATH]$secureFileFromJob"
              Write-Host "Configuração efetiva definida para o import: $secureFileFromJob"
            displayName: '🧩 Resolver tools_DevOps.cfg para Import Repository'

          - task: DownloadPipelineArtifact@2
            displayName: '📥 Download Artefatos (Repository)'
            inputs:
              artifactName: 'deploy-artifacts'
              targetPath: '$(DEPLOY_ARTIFACTS_PATH)'

          - powershell: |
              Write-Host "--- Preparar Diretório de Logs da Execução (Import Repository) ---"

              $executionLogDir = "$(SIEBEL_PIPE_EXEC_LOG_DIR)"
              if ([string]::IsNullOrWhiteSpace($executionLogDir)) {
                $executionLogDir = "$(DEPLOY_ARTIFACTS_PATH)\LogsPipe$(Build.BuildId)"
              }

              New-Item -ItemType Directory -Path $executionLogDir -Force | Out-Null

              $precheckLogPath = Join-Path $executionLogDir "precheck_import_$(Build.BuildId).log"
              $processLogPath = Join-Path $executionLogDir "process_monitoring_$(Build.BuildId).log"
              $forensicLogPath = Join-Path $executionLogDir "forensic_import_$(Build.BuildId).log"

              "[$(Get-Date)] Iniciando precheck do Import Repository" | Set-Content -Path $precheckLogPath -Encoding UTF8
              "ExecutionLogDir=$executionLogDir" | Add-Content -Path $precheckLogPath -Encoding UTF8
              "CurrentUser=$([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)" | Add-Content -Path $precheckLogPath -Encoding UTF8
              "SessionName=$($env:SESSIONNAME)" | Add-Content -Path $precheckLogPath -Encoding UTF8

              $cfgPath = "$(SIEBEL_EXPORT_CONFIG_PATH)"
              if (-not (Test-Path $cfgPath)) {
                Write-Error "tools_DevOps.cfg não encontrado para precheck: $cfgPath"
                exit 1
              }

              try {
                $cfgRaw = Get-Content -Path $cfgPath -Raw -ErrorAction Stop
                if ([string]::IsNullOrWhiteSpace($cfgRaw)) {
                  Write-Error "tools_DevOps.cfg vazio ou ilegível: $cfgPath"
                  exit 1
                }
              }
              catch {
                Write-Error "Falha ao ler tools_DevOps.cfg: $($_.Exception.Message)"
                exit 1
              }

              $testFile = Join-Path $executionLogDir "write_test.tmp"
              "ok" | Set-Content -Path $testFile -Encoding ASCII
              Remove-Item -Path $testFile -Force -ErrorAction SilentlyContinue

              $sifDir = "$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw"
              $sifCount = (Get-ChildItem -Path $sifDir -Filter "*.sif" -ErrorAction SilentlyContinue | Measure-Object).Count
              "SifDir=$sifDir" | Add-Content -Path $precheckLogPath -Encoding UTF8
              "SifCount=$sifCount" | Add-Content -Path $precheckLogPath -Encoding UTF8

              Write-Host "Diretório de logs da execução: $executionLogDir"
              Write-Host "Precheck log: $precheckLogPath"
              Write-Host "[CFG-LOG-001] Diretório nativo de logs Siebel: D:\SiebelLogs"
              Write-Host "##vso[task.setvariable variable=PIPE_EXEC_LOG_DIR]$executionLogDir"
              Write-Host "##vso[task.setvariable variable=PIPE_PRECHECK_LOG_PATH]$precheckLogPath"
              Write-Host "##vso[task.setvariable variable=PIPE_PROCESS_LOG_PATH]$processLogPath"
              Write-Host "##vso[task.setvariable variable=PIPE_FORENSIC_LOG_PATH]$forensicLogPath"
              Write-Host "##vso[task.setvariable variable=SIEBEL_LOG_DIR]D:\SiebelLogs"
            displayName: '🧪 Precheck e Setup de Logs da Execução'

          # ------------------------------------------------------------------
          # Step: Validando SQL*Plus
          # Descrição: Confirma o cliente Oracle no agente e testa a conexão
          #            usada pelos steps de lock/unlock de projetos.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host "--- Validando SQL*Plus e Conexão Oracle ---"

              $stepStart = Get-Date
              $startedAt = $stepStart.ToString('yyyy-MM-dd HH:mm:ss')
              $dbUser = "${env:SIEBEL_DB_USER}"
              $dbPassword = "${env:SIEBEL_DB_PASSWORD}"

              # Nomes de host variam por esteira no Variable Group — resolve na ordem de precedência.
              $hostCandidates = [ordered]@{
                'SIEBEL_DATABASE_HOST'             = $env:SIEBEL_DATABASE_HOST
                'SIEBEL_DATABASE_HOST_DEV'         = $env:SIEBEL_DATABASE_HOST_DEV
                'SIEBEL_DATABASE_HOST_DEV_PRIMARY' = $env:SIEBEL_DATABASE_HOST_DEV_PRIMARY
                'SIEBEL_DATABASE_HOST_DEV8'        = $env:SIEBEL_DATABASE_HOST_DEV8
              }
              $dbHost = $null
              $dbHostSource = 'nenhuma'
              foreach ($candidate in $hostCandidates.GetEnumerator()) {
                if (-not [string]::IsNullOrWhiteSpace($candidate.Value)) {
                  $dbHost = $candidate.Value
                  $dbHostSource = $candidate.Key
                  break
                }
              }
              $dbPort = $env:SIEBEL_DATABASE_PORT
              $dbService = $env:SIEBEL_DATABASE_SERVICE
              $connectTarget = "//${dbHost}:${dbPort}/${dbService}"

              Write-Host "[SQL-VAL-CTX] Ambiente        : ${{ parameters.environment }}"
              Write-Host "[SQL-VAL-CTX] Build ID        : $(Build.BuildId)"
              Write-Host "[SQL-VAL-CTX] Início          : $startedAt"
              Write-Host "[SQL-VAL-CTX] Usuário Oracle  : $dbUser"
              Write-Host "[SQL-VAL-CTX] Host resolvido  : $dbHost (origem: $dbHostSource)"
              Write-Host "[SQL-VAL-CTX] Porta / Serviço : $dbPort / $dbService"
              Write-Host "[SQL-VAL-CTX] Alvo de conexão : $connectTarget"
              foreach ($candidate in $hostCandidates.GetEnumerator()) {
                if ([string]::IsNullOrWhiteSpace($candidate.Value)) {
                  Write-Host "[SQL-VAL-CTX] Variável vazia  : $($candidate.Key)"
                }
              }

              $sqlLines = @(
                'WHENEVER SQLERROR EXIT FAILURE',
                "CONNECT $dbUser/`"$dbPassword`"@$connectTarget",
                'SET HEADING OFF FEEDBACK OFF PAGESIZE 0',
                "SELECT 'ORACLE_OK' FROM dual;",
                'EXIT;'
              )
              $maskedLines = $sqlLines -replace [regex]::Escape("/`"$dbPassword`"@"), '/***@'
              Write-Host "[SQL-VAL-CMD] SQL enviado ao sqlplus:"
              for ($i = 0; $i -lt $maskedLines.Count; $i++) {
                Write-Host ("[SQL-VAL-CMD]   {0:d2}: {1}" -f ($i + 1), $maskedLines[$i])
              }

              if ("$(DRY_RUN_MODE)" -eq "true") {
                Write-Host "[SQL-VAL-RES] DRY RUN — nenhuma conexão foi aberta"
                exit 0
              }

              $sqlplusCmd = Get-Command sqlplus -ErrorAction SilentlyContinue
              if (-not $sqlplusCmd) {
                Write-Host "[SQL-VAL-RES] sqlplus: NÃO ENCONTRADO"
                Write-Error "🚨 sqlplus não encontrado no PATH do agente — necessário para bloquear/desbloquear projetos."
                exit 1
              }
              Write-Host "[SQL-VAL-CTX] sqlplus         : $($sqlplusCmd.Source)"
              $sqlplusVersion = (& sqlplus -v 2>&1 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) -join ' | '
              Write-Host "[SQL-VAL-CTX] Versão          : $sqlplusVersion"

              if ([string]::IsNullOrWhiteSpace($dbHost) -or [string]::IsNullOrWhiteSpace($dbPort) -or [string]::IsNullOrWhiteSpace($dbService)) {
                Write-Host "[SQL-VAL-RES] Conexão Oracle: INCOMPLETA"
                Write-Error "🚨 Conexão Oracle incompleta (host='$dbHost' porta='$dbPort' serviço='$dbService'). Defina SIEBEL_DATABASE_HOST/SIEBEL_DATABASE_PORT/SIEBEL_DATABASE_SERVICE no Variable Group do ambiente."
                exit 1
              }

              $testOutput = ($sqlLines -join [Environment]::NewLine) | & sqlplus -s /nolog 2>&1
              $testExit = $LASTEXITCODE
              $durationSec = [Math]::Round(((Get-Date) - $stepStart).TotalSeconds, 2)

              $safeOutput = @($testOutput | ForEach-Object { "$_" })
              if (-not [string]::IsNullOrEmpty($dbPassword)) {
                $safeOutput = @($safeOutput | ForEach-Object { $_ -replace [regex]::Escape($dbPassword), '***' })
              }

              Write-Host "[SQL-VAL-OUT] --- INÍCIO SAÍDA SQL*PLUS ---"
              if ($safeOutput.Count -eq 0) {
                Write-Host "[SQL-VAL-OUT] (sem saída)"
              }
              else {
                $safeOutput | ForEach-Object { Write-Host "[SQL-VAL-OUT] $_" }
              }
              Write-Host "[SQL-VAL-OUT] --- FIM SAÍDA SQL*PLUS ---"
              Write-Host "[SQL-VAL-RC] ExitCode: $testExit | Duração: ${durationSec}s"

              if ($testExit -ne 0 -or ($safeOutput -match 'ORA-')) {
                Write-Host "[SQL-VAL-RES] Conexão Oracle: FALHOU"
                Write-Error "🚨 Falha na conexão Oracle (ExitCode=$testExit) para $connectTarget com o usuário $dbUser."
                exit 1
              }

              Write-Host "##vso[task.setvariable variable=SIEBEL_DB_CONNECT_TARGET]$connectTarget"
              Write-Host "[SQL-VAL-RES] Conexão Oracle: OK"
            displayName: '🔎 Validando SQL*Plus'
            env:
              SIEBEL_DB_USER: $(SIEBEL_EXPORT_USER)
              SIEBEL_DB_PASSWORD: $(SIEBEL_EXPORT_PASSWORD)

          # ------------------------------------------------------------------
          # Step: Bloqueando Projetos
          # Descrição: O /batchimport só grava com os projetos bloqueados no
          #            Tools; o lock é global para cobrir qualquer objeto do artefato.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host "--- Bloqueando Projetos no Siebel Tools ---"

              $stepStart = Get-Date
              $startedAt = $stepStart.ToString('yyyy-MM-dd HH:mm:ss')
              $dbUser = "${env:SIEBEL_DB_USER}"
              $dbPassword = "${env:SIEBEL_DB_PASSWORD}"
              $isDryRun = "$(DRY_RUN_MODE)" -eq "true"

              $connectTarget = "$(SIEBEL_DB_CONNECT_TARGET)"
              if ([string]::IsNullOrWhiteSpace($connectTarget) -or $connectTarget -like '$(*') {
                $connectTarget = if ($isDryRun) { '(não resolvido — dry run)' } else { '' }
              }

              Write-Host "[SQL-LOCK-CTX] Ambiente        : ${{ parameters.environment }}"
              Write-Host "[SQL-LOCK-CTX] Build ID        : $(Build.BuildId)"
              Write-Host "[SQL-LOCK-CTX] Início          : $startedAt"
              Write-Host "[SQL-LOCK-CTX] Usuário Oracle  : $dbUser"
              Write-Host "[SQL-LOCK-CTX] Alvo de conexão : $connectTarget"
              $lockBy = '${{ parameters.projectLockBy }}'
              if (-not $isDryRun -and [string]::IsNullOrWhiteSpace($lockBy)) {
                Write-Error '[SQL-LOCK-001] O parâmetro projectLockBy é obrigatório fora do dry run.'
                exit 1
              }

              Write-Host "[SQL-LOCK-CTX] LOCKED_BY       : $lockBy"
              Write-Host "[SQL-LOCK-CTX] LOCKED_LANG     : $(SIEBEL_PROJECT_LOCK_LANG)"

              $sqlLines = @(
                'WHENEVER SQLERROR EXIT FAILURE',
                "CONNECT $dbUser/`"$dbPassword`"@$connectTarget",
                'SET HEADING OFF FEEDBACK ON PAGESIZE 0',
                "UPDATE SIEBEL.S_PROJECT SET LOCKED_FLG = 'Y', LOCKED_DATE = SYSDATE, LOCKED_BY = '$lockBy', LOCKED_LANG = '$(SIEBEL_PROJECT_LOCK_LANG)';",
                'COMMIT;',
                "SELECT 'LOCKED|' || COUNT(1) FROM SIEBEL.S_PROJECT WHERE LOCKED_FLG = 'Y';",
                'EXIT;'
              )
              $maskedLines = $sqlLines -replace [regex]::Escape("/`"$dbPassword`"@"), '/***@'
              Write-Host "[SQL-LOCK-CMD] SQL enviado ao sqlplus:"
              for ($i = 0; $i -lt $maskedLines.Count; $i++) {
                Write-Host ("[SQL-LOCK-CMD]   {0:d2}: {1}" -f ($i + 1), $maskedLines[$i])
              }

              if ($isDryRun) {
                Write-Host "[SQL-LOCK-RES] DRY RUN — nenhuma alteração aplicada"
                exit 0
              }

              if ([string]::IsNullOrWhiteSpace($connectTarget)) {
                Write-Host "[SQL-LOCK-RES] Bloqueio: NÃO EXECUTADO"
                Write-Error "🚨 SIEBEL_DB_CONNECT_TARGET não resolvido — o step de validação do SQL*Plus não foi executado."
                exit 1
              }

              $lockOutput = ($sqlLines -join [Environment]::NewLine) | & sqlplus -s /nolog 2>&1
              $lockExit = $LASTEXITCODE
              $durationSec = [Math]::Round(((Get-Date) - $stepStart).TotalSeconds, 2)

              $safeOutput = @($lockOutput | ForEach-Object { "$_" })
              if (-not [string]::IsNullOrEmpty($dbPassword)) {
                $safeOutput = @($safeOutput | ForEach-Object { $_ -replace [regex]::Escape($dbPassword), '***' })
              }

              Write-Host "[SQL-LOCK-OUT] --- INÍCIO SAÍDA SQL*PLUS ---"
              if ($safeOutput.Count -eq 0) {
                Write-Host "[SQL-LOCK-OUT] (sem saída)"
              }
              else {
                $safeOutput | ForEach-Object { Write-Host "[SQL-LOCK-OUT] $_" }
              }
              Write-Host "[SQL-LOCK-OUT] --- FIM SAÍDA SQL*PLUS ---"
              Write-Host "[SQL-LOCK-RC] ExitCode: $lockExit | Duração: ${durationSec}s"

              if ($lockExit -ne 0 -or ($safeOutput -match 'ORA-')) {
                Write-Host "[SQL-LOCK-RES] Bloqueio: FALHOU"
                Write-Error "🚨 Falha ao bloquear projetos no Siebel Tools (ExitCode=$lockExit)."
                exit 1
              }

              $feedbackLine = $safeOutput | Where-Object { $_ -match '(?i)(updated|atualizad)' } | Select-Object -First 1
              $rowsFeedback = if ($feedbackLine) { $feedbackLine.Trim() } else { 'N/A' }
              $lockedLine = $safeOutput | Select-String -Pattern 'LOCKED\|' | Select-Object -Last 1
              $lockedCount = if ($lockedLine) { ($lockedLine.ToString() -split '\|')[1].Trim() } else { 'N/A' }

              Write-Host "[SQL-LOCK-RES] Feedback do UPDATE          : $rowsFeedback"
              Write-Host "[SQL-LOCK-RES] Projetos com LOCKED_FLG='Y' : $lockedCount"
              Write-Host "[SQL-LOCK-RES] Bloqueio: OK — projetos prontos para o import"
            displayName: '🔒 Bloqueando Projetos'
            env:
              SIEBEL_DB_USER: $(SIEBEL_EXPORT_USER)
              SIEBEL_DB_PASSWORD: $(SIEBEL_EXPORT_PASSWORD)

          - powershell: |
              Write-Host ""
              Write-Host "##########################################################################################"
              Write-Host "# 🚀 RASTREAMENTO DE IMPORT REPOSITORY - VERSÕES SENDO IMPLEMENTADAS"
              Write-Host "##########################################################################################"
              Write-Host ""
              Write-Host "--- Informações de Execução ---"
              Write-Host "  Build ID         : $(Build.BuildId)"
              Write-Host "  Ambiente         : ${{ parameters.environment }}"
              Write-Host "  Timestamp        : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
              Write-Host "  Caminho artefatos: $(DEPLOY_ARTIFACTS_PATH)"
              Write-Host ""
              Write-Host "--- Prévia dos Comandos (senha mascarada) ---"
              Write-Host "  [Import Repository]"
              Write-Host "    & `"$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe`" /c `"$(SIEBEL_EXPORT_CONFIG_PATH)`" /d $(SIEBEL_EXPORT_DATASOURCE) /u $(SIEBEL_EXPORT_USER) /p *** /tl PTB /batchimport `"$(SIEBEL_EXPORT_REPOSITORY)`" overwrite `"$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw`" `"D:\SiebelLogs\import_log_${{ parameters.environment }}_$(Build.BuildId)_<timestamp>.txt`""
              Write-Host "  [Compilação SRF - step seguinte]"
              Write-Host "    & `"$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe`" /c `"$(SIEBEL_EXPORT_CONFIG_PATH)`" /d $(SIEBEL_EXPORT_DATASOURCE) /u $(SIEBEL_EXPORT_USER) /p *** /tl PTB /bc `"$(SIEBEL_EXPORT_REPOSITORY)`" `"$(SIEBEL_SRF_DEST_PATH)`""
              Write-Host "---"
              Write-Host ""

              # Verificar presença de arquivos .sif
              $sifFiles = Get-ChildItem -Path "$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw" -Filter "*.sif" -ErrorAction SilentlyContinue

              if (-not $sifFiles -or $sifFiles.Count -eq 0) {
                Write-Host "⚠️  Nenhum arquivo .sif encontrado em: $(DEPLOY_ARTIFACTS_PATH)\repository-export-raw"
                Write-Host "⚠️  Prévia acima é informativa — import repository pulado por ausência de arquivos."
                Write-Host "##vso[task.setvariable variable=HAS_SIF_FILES;isOutput=true]false"
                exit 0
              }

              Write-Host "📊 ANÁLISE DE ARTEFATOS .SIF:"
              Write-Host "  Total de arquivos .sif: $($sifFiles.Count)"
              if ($sifFiles.Count -gt 1) {
                Write-Host "  ⚠️  Modo multi-artefato detectado: $($sifFiles.Count) artefato(s) serão processados"
              }
              Write-Host ""
              Write-Host "📋 DETALHE DOS ARTEFATOS A IMPLEMENTAR:"
              $fileIndex = 0
              $sifFiles | ForEach-Object {
                $fileIndex++
                $fileSize = [math]::Round($_.Length / 1MB, 2)
                Write-Host "  [$fileIndex/$($sifFiles.Count)] Nome: $($_.Name)"
                Write-Host "              Tamanho: ${fileSize} MB"
                Write-Host "              Caminho: $($_.FullName)"
                Write-Host "              Criado: $($_.CreationTime.ToString('yyyy-MM-dd HH:mm:ss'))"
                Write-Host ""
              }
              Write-Host "##vso[task.setvariable variable=HAS_SIF_FILES;isOutput=true]true"
              Write-Host "##########################################################################################"
              Write-Host ""

              if (-not (Test-Path "D:\SiebelLogs")) { New-Item -ItemType Directory -Path "D:\SiebelLogs" -Force | Out-Null }

              # DRY RUN: pipeline flag ou fallback quando ferramentas não disponíveis
              if ("$(DRY_RUN_MODE)" -eq "true" -or -not (Test-Path "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe") -or [string]::IsNullOrWhiteSpace("$(SIEBEL_EXPORT_PASSWORD)")) {

                if (-not (Test-Path "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe")) {
                  Write-Host "⚠️  siebdev.exe não encontrado em: $(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe — ativando DRY RUN"
                }
                if ([string]::IsNullOrWhiteSpace("$(SIEBEL_EXPORT_PASSWORD)")) {
                  Write-Host "⚠️  SIEBEL_EXPORT_PASSWORD não definida — ativando DRY RUN"
                }
                Write-Host "--- Artefatos que seriam importados no batch ---"
                $fileIndex = 0
                $sifFiles | ForEach-Object {
                  $fileIndex++
                  Write-Host "[ARTEFATO $fileIndex/$($sifFiles.Count)] Iniciando tratamento: $($_.Name)"
                }
                Write-Host "🧪 DRY RUN — simulando batchimport"
                Write-Host "✅ Import Repository simulado com sucesso"
                exit 0
              }
              else {
                $toolsPath = "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe"
                $configPath = "$(SIEBEL_EXPORT_CONFIG_PATH)"
                $sourceDir = "$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw"
                $executionLogDir = "$(PIPE_EXEC_LOG_DIR)"
                if ([string]::IsNullOrWhiteSpace($executionLogDir)) {
                  $executionLogDir = "$(SIEBEL_PIPE_EXEC_LOG_DIR)"
                }
                if (-not (Test-Path $executionLogDir)) {
                  New-Item -ItemType Directory -Path $executionLogDir -Force | Out-Null
                }
                $nativeSiebelLogDir = "D:\SiebelLogs"
                if (-not (Test-Path $nativeSiebelLogDir)) {
                  New-Item -ItemType Directory -Path $nativeSiebelLogDir -Force | Out-Null
                }
                $logStamp = Get-Date -Format "yyyyMMdd_HHmmss"
                $logPath = Join-Path $nativeSiebelLogDir "import_log_${{ parameters.environment }}_$(Build.BuildId)_$logStamp.txt"
                $processLogPath = "$(PIPE_PROCESS_LOG_PATH)"
                if ([string]::IsNullOrWhiteSpace($processLogPath)) {
                  $processLogPath = Join-Path $executionLogDir "process_monitoring_$(Build.BuildId).log"
                }
                $forensicLogPath = "$(PIPE_FORENSIC_LOG_PATH)"
                if ([string]::IsNullOrWhiteSpace($forensicLogPath)) {
                  $forensicLogPath = Join-Path $executionLogDir "forensic_import_$(Build.BuildId).log"
                }
                $dataSource = "$(SIEBEL_EXPORT_DATASOURCE)"
                $repositoryName = "$(SIEBEL_EXPORT_REPOSITORY)"

                if (-not (Test-Path $toolsPath)) {
                  Write-Error "siebdev.exe não encontrado em: $toolsPath"
                  exit 1
                }

                if (-not (Test-Path $configPath)) {
                  Write-Error "tools_DevOps.cfg não encontrado em: $configPath"
                  exit 1
                }

                if (-not (Test-Path $sourceDir)) {
                  Write-Error "Diretório de origem não encontrado: $sourceDir"
                  exit 1
                }

                function Sync-NativeSiebelLogs {
                  param(
                    [string]$SourceDir,
                    [string]$TargetDir,
                    [datetime]$RunStart
                  )

                  Write-Host "[LOG-SYNC-001] Sincronizando logs nativos para diretório da execução..."
                  Write-Host "[LOG-SYNC-001] Origem: $SourceDir"
                  Write-Host "[LOG-SYNC-001] Destino: $TargetDir"
                  Write-Host "[LOG-SYNC-001] Filtro de data/hora (>=): $($RunStart.ToString('o'))"

                  $copiedCount = 0
                  Get-ChildItem -Path $SourceDir -Filter "import_log_${{ parameters.environment }}_$(Build.BuildId)_*.txt" -ErrorAction SilentlyContinue |
                    Where-Object { $_.LastWriteTime -ge $RunStart } |
                    Sort-Object LastWriteTime -Descending |
                    ForEach-Object {
                      Copy-Item -Path $_.FullName -Destination (Join-Path $TargetDir $_.Name) -Force -ErrorAction SilentlyContinue
                      $copiedCount++
                    }

                  Get-ChildItem -Path $SourceDir -Filter "siebdev*.log" -ErrorAction SilentlyContinue |
                    Where-Object { $_.LastWriteTime -ge $RunStart } |
                    Sort-Object LastWriteTime -Descending |
                    ForEach-Object {
                      Copy-Item -Path $_.FullName -Destination (Join-Path $TargetDir $_.Name) -Force -ErrorAction SilentlyContinue
                      $copiedCount++
                      Write-Host "[LOG-SYNC-002] Copiado log Siebel: $($_.Name)"
                    }

                  Write-Host "[LOG-SYNC-002] Arquivos sincronizados: $copiedCount"
                }

                $env:SIEBEL_LOG_DIR = $nativeSiebelLogDir
                Write-Host "[CFG-LOG-002] SIEBEL_LOG_DIR efetivo: $env:SIEBEL_LOG_DIR"
                Write-Host "##vso[task.setvariable variable=IMPORT_LOG_PATH;isOutput=true]$logPath"
                "[$(Get-Date)] Iniciando execução do import. LogPath=$logPath" | Add-Content -Path $processLogPath -Encoding UTF8

                Write-Host "🚀 EXECUTANDO siebdev.exe / BATCHIMPORT - PARÂMETROS DE EXECUÇÃO:"
                Write-Host "  Ferramenta       : $toolsPath"
                Write-Host "  DataSource       : $dataSource"
                Write-Host "  Repository       : $repositoryName"
                Write-Host "  Modo             : overwrite"
                Write-Host "  Origem           : $sourceDir"
                Write-Host "  Config           : $configPath"
                Write-Host "  Log              : $logPath"
                Write-Host "  Log nativo base  : $nativeSiebelLogDir"
                Write-Host "  Log artifact dir : $executionLogDir"
                Write-Host ""
                Write-Host "📦 ARTEFATOS INCLUÍDOS NO BATCHIMPORT:"
                $fileIndex = 0
                $totalSizeBytes = 0
                $sifFiles | ForEach-Object {
                  $fileIndex++
                  $fileSize = [math]::Round($_.Length / 1MB, 2)
                  $totalSizeBytes += $_.Length
                  Write-Host "  [$fileIndex/$($sifFiles.Count)] $($_.Name) - ${fileSize} MB"
                }
                $totalSizeMB = [math]::Round($totalSizeBytes / 1MB, 2)
                Write-Host ""
                Write-Host "  📊 Tamanho total dos artefatos: ${totalSizeMB} MB"
                Write-Host "  ⏱️ Horário de início: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Write-Host ""

                $cfgContent = Get-Content -Path $configPath -Raw -ErrorAction SilentlyContinue

                if ([string]::IsNullOrWhiteSpace($cfgContent)) {
                  Write-Error "tools_DevOps.cfg está vazio ou ilegível: $configPath"
                  exit 1
                }

                if ($cfgContent -notmatch [regex]::Escape($dataSource)) {
                  Write-Host "⚠️  DataSource não encontrado textualmente no cfg: $dataSource"
                  Write-Host "⚠️  Isso pode causar falha silenciosa no siebdev."
                }

                $exitCode = -1
                $runStart = Get-Date
                Write-Host "[CFG-RUN-001] runStart: $($runStart.ToString('o'))"
                Write-Host "##vso[task.setvariable variable=IMPORT_RUN_START_UTC;isOutput=true]$($runStart.ToString('o'))"
                Write-Host "[CMD-IMP-001] Preparando comando batchimport"
                Write-Host "[CMD-IMP-002] Comando executado:"
                $commandPreview = "& `"$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe`" /c `"$(SIEBEL_EXPORT_CONFIG_PATH)`" /d $(SIEBEL_EXPORT_DATASOURCE) /u $(SIEBEL_EXPORT_USER) /p *** /tl PTB /batchimport `"$(SIEBEL_EXPORT_REPOSITORY)`" overwrite `"$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw`" `"$logPath`""
                Write-Host "  $commandPreview"
                "[$(Get-Date)] Command: $commandPreview" | Add-Content -Path $processLogPath -Encoding UTF8

                $workDir = Split-Path -Parent "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe"
                $startTime = Get-Date
                Write-Host "[CMD-IMP-003] Diretório de trabalho do processo: $workDir"

                Push-Location $workDir
                try {
                  # Execucao direta (igual ao teste manual no host), sem Start-Process/redirect.
                  & "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe" '/c' "$(SIEBEL_EXPORT_CONFIG_PATH)" '/d' "$(SIEBEL_EXPORT_DATASOURCE)" '/u' "$(SIEBEL_EXPORT_USER)" '/p' "$(SIEBEL_EXPORT_PASSWORD)" '/tl' 'PTB' '/batchimport' "$(SIEBEL_EXPORT_REPOSITORY)" 'overwrite' "$(DEPLOY_ARTIFACTS_PATH)\repository-export-raw" "$logPath"
                  $exitCode = $LASTEXITCODE
                }
                finally {
                  Pop-Location
                }

                $durationSec = [Math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
                Write-Host "[CMD-IMP-008] ExitCode capturado do siebdev.exe: $exitCode"
                Write-Host "[CMD-IMP-008] Duração da execução (s): $durationSec"
                "[$(Get-Date)] Process exit code: $exitCode (duração: ${durationSec}s)" | Add-Content -Path $processLogPath -Encoding UTF8

                Write-Host "[CFG-LOG-005] Verificando geração de siebdev*.log nesta execução"
                $probeLogs = @(Get-ChildItem -Path $nativeSiebelLogDir -Filter "siebdev*.log" -ErrorAction SilentlyContinue |
                  Where-Object { $_.LastWriteTime -ge $runStart })

                if ($probeLogs.Count -gt 0) {
                  Write-Host "[CFG-LOG-006] Encontrado(s) siebdev*.log na run atual:"
                  $probeLogs | Sort-Object LastWriteTime -Descending | ForEach-Object {
                    Write-Host "  - $($_.FullName) | LastWriteTime=$($_.LastWriteTime)"
                  }
                }
                else {
                  Write-Host "[CFG-LOG-007] Nenhum siebdev*.log gerado nesta execução — siebdev.exe pode não ter iniciado."
                }

                $logText = ""
                $tentativas = [int]"$(IMPORT_LOG_READ_ATTEMPTS)"
                $waitTimeoutSeconds = [int]"$(IMPORT_LOG_WAIT_TIMEOUT_SECONDS)"
                $pollIntervalSeconds = [int]"$(IMPORT_LOG_POLL_SECONDS)"
                $readPollSeconds = [int]"$(IMPORT_LOG_READ_POLL_SECONDS)"

                Write-Host "[CMD-IMP-009] Aguardando disponibilidade do log de importação..."
                $logReady = $false
                $deadline = (Get-Date).AddSeconds($waitTimeoutSeconds)
                while ((Get-Date) -lt $deadline -and -not $logReady) {
                  if (Test-Path $logPath) {
                    $logSize = (Get-Item -Path $logPath).Length
                    if ($logSize -gt 0) {
                      $logReady = $true
                    }
                  }
                  if (-not $logReady) {
                    Start-Sleep -Seconds $pollIntervalSeconds
                  }
                }

                if (Test-Path $logPath) {
                  Write-Host "[CMD-IMP-010] Log encontrado. Iniciando leitura e validação."
                  Write-Host ""
                  Write-Host "##########################################################################################"
                  Write-Host "# ✅ VALIDAÇÃO PÓS-EXECUÇÃO - RASTREAMENTO DO LOG DE IMPLEMENTAÇÃO"
                  Write-Host "##########################################################################################"
                  Write-Host ""
                  Write-Host "🔍 Processando log de importação..."
                  Write-Host "   Arquivo de log: $logPath"
                  Write-Host "   Timestamp de leitura: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                  Write-Host ""
                  # Algumas execuções escrevem o log com pequeno atraso. Tenta leitura robusta antes de seguir.
                  $readAttempts = 0
                  while ($readAttempts -lt $tentativas -and [string]::IsNullOrWhiteSpace($logText)) {
                    try {
                      $logText = Get-Content -Path $logPath -Raw -ErrorAction Stop
                    }
                    catch {
                      Write-Host "⚠️  Tentativa $($readAttempts + 1)/${tentativas}: falha ao ler log ($($_.Exception.Message))"
                    }

                    if ([string]::IsNullOrWhiteSpace($logText)) {
                      Start-Sleep -Seconds $readPollSeconds
                    }
                    $readAttempts++
                  }

                  if ([string]::IsNullOrWhiteSpace($logText)) {
                    Write-Error "🚨 Log encontrado, mas não foi possível ler conteúdo válido: $logPath"
                    exit 1
                  }
                  Write-Host "✅ Log de importação lido com sucesso após $readAttempts tentativa(s)."
                }
                else {
                  Write-Host "[CMD-IMP-011] Log não encontrado dentro da janela de espera."
                  Write-Host "⚠️ Log de importação não encontrado após timeout: $logPath"
                }

                Sync-NativeSiebelLogs -SourceDir $nativeSiebelLogDir -TargetDir $executionLogDir -RunStart $runStart

                $exitCodeText = if ($null -eq $exitCode -or [string]::IsNullOrWhiteSpace("$exitCode")) { '<empty>' } else { "$exitCode" }
                $hasImportSuccessful = $logText -match '(?im)^STATUS:\s*Import\s+Successful\s*$'
                $statusMatch = [regex]::Match($logText, '(?im)^STATUS:\s*Total:\s*(\d+)\s*,\s*Successful\s+Imports:\s*(\d+)\s*,\s*Failed\s+Imports:\s*(\d+)\s*$')
                $hasSuccess = $false
                $hasError = $logText -match '(?im)\b(Error|Exception|Import failed)\b'

                if ($statusMatch.Success) {
                  $totalImports = [int]$statusMatch.Groups[1].Value
                  $successfulImports = [int]$statusMatch.Groups[2].Value
                  $failedImports = [int]$statusMatch.Groups[3].Value
                  $hasSuccess = $failedImports -eq 0 -and $totalImports -gt 0 -and $totalImports -eq $successfulImports
                  if ($failedImports -gt 0) {
                    $hasError = $true
                  }

                  Write-Host ""
                  Write-Host "##########################################################################################"
                  Write-Host "# 📊 RESUMO DETALHADO DE IMPLEMENTAÇÃO"
                  Write-Host "##########################################################################################"
                  Write-Host ""
                  Write-Host "📈 ESTATÍSTICAS DE IMPORT:"
                  Write-Host "  Total de objetos processados    : $totalImports"
                  Write-Host "  Objetos importados com sucesso  : $successfulImports"
                  Write-Host "  Objetos falhados                : $failedImports"
                  Write-Host ""
                  Write-Host "✅ STATUS: " -NoNewline
                  if ($hasSuccess) {
                    Write-Host "IMPLEMENTAÇÃO BEM-SUCEDIDA ✅" -ForegroundColor Green
                  } else {
                    Write-Host "IMPLEMENTAÇÃO COM PROBLEMAS ⚠️" -ForegroundColor Yellow
                  }
                  Write-Host ""
                  Write-Host "🎯 ARTEFATOS IMPLEMENTADOS:"
                  $fileIndex = 0
                  $sifFiles | ForEach-Object {
                    $fileIndex++
                    $fileSize = [math]::Round($_.Length / 1MB, 2)
                    Write-Host "  [$fileIndex/$($sifFiles.Count)] $($_.Name)"
                    Write-Host "              Tamanho: ${fileSize} MB"
                    Write-Host "              Status: IMPLEMENTADO COM SUCESSO ✅"
                    Write-Host ""
                  }
                  Write-Host "##########################################################################################"
                }

                if ("$(DEBUG_MODE)" -eq "true") {
                  Write-Host "[DEBUG] hasImportSuccessful=$hasImportSuccessful hasSuccess=$hasSuccess hasError=$hasError exitCode=$exitCodeText logPath=$logPath"
                }

                if ($hasSuccess -and -not $hasError) {
                  Write-Host "✅ Import Repository concluído (sucesso explícito no log, ExitCode=$exitCodeText)"
                  exit 0
                }

                if ($exitCode -eq 0 -and -not $hasError) {
                  Write-Host "✅ Import Repository concluído (ExitCode=0, sem erros no log)"
                  exit 0
                }

                if (-not [string]::IsNullOrWhiteSpace($logText) -and -not $hasError) {
                  Write-Host "⚠️  Log legível e sem erros críticos, mas sem critério forte de sucesso no step executor."
                  Write-Host "⚠️  Prosseguindo para o step dedicado de validação do log (ExitCode=$exitCodeText)."
                  exit 0
                }

                "[$(Get-Date)] Falha no batchimport. ExitCode=$exitCodeText LogPath=$logPath" | Add-Content -Path $forensicLogPath -Encoding UTF8
                if (Test-Path $logPath) {
                  "--- Tail do import log ---" | Add-Content -Path $forensicLogPath -Encoding UTF8
                  Get-Content -Path $logPath -Tail 120 -ErrorAction SilentlyContinue |
                    Out-String | Add-Content -Path $forensicLogPath -Encoding UTF8
                }

                Write-Error "🚨 siebdev.exe /batchimport falhou (ExitCode=$exitCodeText, LogPath=$logPath)"
                exit 1
              }
            name: importSif
            displayName: '🚀 Executar Import Repository (siebdev.exe /batchimport)'

          # ------------------------------------------------------------------
          # Step: Desbloqueando Projetos
          # Descrição: Roda sempre — se o import falhar e o unlock não ocorrer,
          #            os projetos ficam travados para os desenvolvedores.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host "--- Desbloqueando Projetos no Siebel Tools ---"

              $stepStart = Get-Date
              $startedAt = $stepStart.ToString('yyyy-MM-dd HH:mm:ss')
              $dbUser = "${env:SIEBEL_DB_USER}"
              $dbPassword = "${env:SIEBEL_DB_PASSWORD}"
              $isDryRun = "$(DRY_RUN_MODE)" -eq "true"

              $connectTarget = "$(SIEBEL_DB_CONNECT_TARGET)"
              if ([string]::IsNullOrWhiteSpace($connectTarget) -or $connectTarget -like '$(*') {
                $connectTarget = if ($isDryRun) { '(não resolvido — dry run)' } else { '' }
              }

              Write-Host "[SQL-UNLOCK-CTX] Ambiente        : ${{ parameters.environment }}"
              Write-Host "[SQL-UNLOCK-CTX] Build ID        : $(Build.BuildId)"
              Write-Host "[SQL-UNLOCK-CTX] Início          : $startedAt"
              Write-Host "[SQL-UNLOCK-CTX] Usuário Oracle  : $dbUser"
              Write-Host "[SQL-UNLOCK-CTX] Alvo de conexão : $connectTarget"

              $sqlLines = @(
                'WHENEVER SQLERROR EXIT FAILURE',
                "CONNECT $dbUser/`"$dbPassword`"@$connectTarget",
                'SET HEADING OFF FEEDBACK ON PAGESIZE 0',
                "UPDATE SIEBEL.S_PROJECT SET LOCKED_FLG = 'N', LOCKED_DATE = NULL, LOCKED_BY = NULL, LOCKED_LANG = NULL;",
                'COMMIT;',
                "SELECT 'LOCKED|' || COUNT(1) FROM SIEBEL.S_PROJECT WHERE LOCKED_FLG = 'Y';",
                'EXIT;'
              )
              $maskedLines = $sqlLines -replace [regex]::Escape("/`"$dbPassword`"@"), '/***@'
              Write-Host "[SQL-UNLOCK-CMD] SQL enviado ao sqlplus:"
              for ($i = 0; $i -lt $maskedLines.Count; $i++) {
                Write-Host ("[SQL-UNLOCK-CMD]   {0:d2}: {1}" -f ($i + 1), $maskedLines[$i])
              }

              if ($isDryRun) {
                Write-Host "[SQL-UNLOCK-RES] DRY RUN — nenhuma alteração aplicada"
                exit 0
              }

              if ([string]::IsNullOrWhiteSpace($connectTarget)) {
                Write-Host "[SQL-UNLOCK-RES] Nada a desbloquear — nenhum bloqueio foi aplicado nesta execução"
                exit 0
              }

              $unlockOutput = ($sqlLines -join [Environment]::NewLine) | & sqlplus -s /nolog 2>&1
              $unlockExit = $LASTEXITCODE
              $durationSec = [Math]::Round(((Get-Date) - $stepStart).TotalSeconds, 2)

              $safeOutput = @($unlockOutput | ForEach-Object { "$_" })
              if (-not [string]::IsNullOrEmpty($dbPassword)) {
                $safeOutput = @($safeOutput | ForEach-Object { $_ -replace [regex]::Escape($dbPassword), '***' })
              }

              Write-Host "[SQL-UNLOCK-OUT] --- INÍCIO SAÍDA SQL*PLUS ---"
              if ($safeOutput.Count -eq 0) {
                Write-Host "[SQL-UNLOCK-OUT] (sem saída)"
              }
              else {
                $safeOutput | ForEach-Object { Write-Host "[SQL-UNLOCK-OUT] $_" }
              }
              Write-Host "[SQL-UNLOCK-OUT] --- FIM SAÍDA SQL*PLUS ---"
              Write-Host "[SQL-UNLOCK-RC] ExitCode: $unlockExit | Duração: ${durationSec}s"

              if ($unlockExit -ne 0 -or ($safeOutput -match 'ORA-')) {
                Write-Host "[SQL-UNLOCK-RES] Desbloqueio: FALHOU"
                Write-Error "🚨 Falha ao desbloquear projetos no Siebel Tools (ExitCode=$unlockExit). Projetos podem seguir bloqueados — desbloqueio manual necessário."
                exit 1
              }

              $feedbackLine = $safeOutput | Where-Object { $_ -match '(?i)(updated|atualizad)' } | Select-Object -First 1
              $rowsFeedback = if ($feedbackLine) { $feedbackLine.Trim() } else { 'N/A' }
              $lockedLine = $safeOutput | Select-String -Pattern 'LOCKED\|' | Select-Object -Last 1
              $lockedCount = if ($lockedLine) { ($lockedLine.ToString() -split '\|')[1].Trim() } else { 'N/A' }

              Write-Host "[SQL-UNLOCK-RES] Feedback do UPDATE       : $rowsFeedback"
              Write-Host "[SQL-UNLOCK-RES] Projetos ainda bloqueados: $lockedCount"

              if ($lockedCount -ne '0' -and $lockedCount -ne 'N/A') {
                Write-Host "[SQL-UNLOCK-RES] ⚠️  Ainda há projetos com LOCKED_FLG='Y' — verificar no Siebel Tools"
              }
              Write-Host "[SQL-UNLOCK-RES] Desbloqueio: OK"
            displayName: '🔓 Desbloqueando Projetos'
            condition: always()
            env:
              SIEBEL_DB_USER: $(SIEBEL_EXPORT_USER)
              SIEBEL_DB_PASSWORD: $(SIEBEL_EXPORT_PASSWORD)

          # ------------------------------------------------------------------
          # Step: Validar Log de Importação
          # Descrição: Lê o log gerado pelo /batchimport e falha se houver
          #            erros críticos. Em dryRun exibe o que seria verificado.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host ""
              Write-Host "##########################################################################################"
              Write-Host "# ✅ VALIDAÇÃO DO LOG DE IMPORTAÇÃO - CONFIRMAÇÃO FINAL"
              Write-Host "##########################################################################################"
              Write-Host ""

              if ("$(DRY_RUN_MODE)" -eq "true") {
                Write-Host "🧪 DRY RUN — simulando validação do log de importação"
                Write-Host "Arquivo de log que seria verificado: $(PIPE_EXEC_LOG_DIR)\import_log_${{ parameters.environment }}_$(Build.BuildId)_<timestamp>.txt"
                Write-Host "Padrões de erro pesquisados: 'Error', 'Exception', 'Failed', 'Cannot'"
                Write-Host "✅ Validação do log simulada com sucesso"
                Write-Host "##########################################################################################"
              }
              else {
                $logPath = "$(importSif.IMPORT_LOG_PATH)"
                if ([string]::IsNullOrWhiteSpace($logPath) -or $logPath -like '$(*') {
                  $nativeDir = "D:\SiebelLogs"
                  $fallbackPattern = "import_log_${{ parameters.environment }}_$(Build.BuildId)_*.txt"
                  $runStartRaw = "$(importSif.IMPORT_RUN_START_UTC)"
                  $runStartRef = $null
                  if (-not [string]::IsNullOrWhiteSpace($runStartRaw) -and $runStartRaw -notlike '$(*') {
                    try {
                      $runStartRef = [datetime]::Parse($runStartRaw)
                    }
                    catch {
                      $runStartRef = $null
                    }
                  }
                  $fallbackLog = Get-ChildItem -Path $nativeDir -Filter $fallbackPattern -ErrorAction SilentlyContinue |
                    Where-Object { -not $runStartRef -or $_.LastWriteTime -ge $runStartRef } |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1
                  if ($fallbackLog) {
                    $logPath = $fallbackLog.FullName
                    Write-Host "[CFG-LOG-003] IMPORT_LOG_PATH não recebido. Usando fallback nativo: $logPath"
                    if ($runStartRef) {
                      Write-Host "[CFG-LOG-003] Filtro de fallback aplicado com runStart: $($runStartRef.ToString('o'))"
                    }
                  }
                }
                if (-not (Test-Path $logPath)) {
                  Write-Error "🚨 Log não encontrado para validação: $logPath"
                  exit 1
                }

                Write-Host "🔍 Processando resultado final de implementação..."
                Write-Host "   Arquivo de log: $logPath"
                Write-Host ""
                $content = Get-Content -Path $logPath -ErrorAction SilentlyContinue
                $contentText = ($content | Out-String)
                $statusMatch = [regex]::Match($contentText, '(?im)^STATUS:\s*Total:\s*(\d+)\s*,\s*Successful\s+Imports:\s*(\d+)\s*,\s*Failed\s+Imports:\s*(\d+)\s*$')
                $errorLines = $content | Where-Object { $_ -match '(?i)\b(Error|Exception|Import failed)\b' }

                if ($statusMatch.Success) {
                  $totalImports = [int]$statusMatch.Groups[1].Value
                  $successfulImports = [int]$statusMatch.Groups[2].Value
                  $failedImports = [int]$statusMatch.Groups[3].Value

                  Write-Host "📊 RESULTADO FINAL DE IMPLEMENTAÇÃO:"
                  Write-Host "  ├─ Total de objetos processados    : $totalImports"
                  Write-Host "  ├─ Objetos importados com sucesso  : $successfulImports"
                  Write-Host "  └─ Objetos falhados                : $failedImports"
                  Write-Host ""

                  if ($failedImports -eq 0 -and $totalImports -gt 0) {
                    Write-Host "✅ STATUS FINAL: IMPLEMENTAÇÃO 100% BEM-SUCEDIDA" -ForegroundColor Green
                    Write-Host "   Todos os $totalImports objeto(s) foram implementados com sucesso!"
                  } elseif ($failedImports -gt 0) {
                    Write-Host "⚠️  STATUS FINAL: IMPLEMENTAÇÃO COM FALHAS" -ForegroundColor Yellow
                    Write-Host "   $failedImports de $totalImports objeto(s) falharam na implementação"
                    $errorLines += "STATUS: Total=$totalImports, Successful Imports=$successfulImports, Failed Imports=$failedImports"
                  }
                  Write-Host ""
                }

                if ($errorLines) {
                  Write-Host "🚨 ERROS E AVISOS ENCONTRADOS NO LOG DE IMPORTAÇÃO:"
                  $errorLines | ForEach-Object { Write-Host "  ❌ $_" }
                  Write-Host ""
                  Write-Error "Log de importação contém erros — abortando pipeline"
                  exit 1
                }

                $hasSuccessStatus = $content | Where-Object { $_ -match '(?i)^STATUS:.*(Import|Batch).*Successful' }
                if (-not $hasSuccessStatus) {
                  Write-Host "⚠️ Nenhuma linha de Sucesso explícito encontrada no log."
                  Write-Host ""
                }

                Write-Host "✅ Validação concluída: Log de importação válido — nenhum erro crítico encontrado"
                Write-Host "##########################################################################################"
              }
            displayName: '✅ Validar Log de Importação'
            condition: and(succeeded(), eq(variables['importSif.HAS_SIF_FILES'], 'true'))

          # ------------------------------------------------------------------
          # Step: Compilação SRF
          # Descrição: Compila o SRF via siebdev.exe /bc após o import.
          #            Em dryRun exibe o comando que seria executado.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host "--- Compilação SRF ---"
              # Variáveis de pipeline consumidas diretamente via $(...).
              # DRY RUN: pipeline flag ou fallback quando ferramentas não disponíveis
              if ("$(DRY_RUN_MODE)" -eq "true" -or -not (Test-Path "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe") -or [string]::IsNullOrWhiteSpace("$(SIEBEL_EXPORT_PASSWORD)")) {
                if (-not (Test-Path "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe")) {
                  Write-Host "⚠️  siebdev.exe não encontrado — ativando DRY RUN para compilação"
                }
                if ([string]::IsNullOrWhiteSpace("$(SIEBEL_EXPORT_PASSWORD)")) {
                  Write-Host "⚠️  SIEBEL_EXPORT_PASSWORD não definida — ativando DRY RUN para compilação"
                }

                # Prévia do comando (sempre exibida, com senha mascarada)
                Write-Host ""
                Write-Host "--- Prévia do Comando (senha mascarada) ---"
                Write-Host "  [Compilação SRF]"
                Write-Host "    & `"$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe`" /c `"$(SIEBEL_EXPORT_CONFIG_PATH)`" /d $(SIEBEL_EXPORT_DATASOURCE) /u $(SIEBEL_EXPORT_USER) /p *** /tl PTB /bc `"$(SIEBEL_EXPORT_REPOSITORY)`" `"$(SIEBEL_SRF_DEST_PATH)`""
                Write-Host "---"
                Write-Host ""
                Write-Host "🧪 DRY RUN — simulando compilação SRF"
                Write-Host "✅ Compilação SRF simulada com sucesso"
              }
              else {
                Write-Host "🔨 Executando compilação SRF..."
                $toolsPath = "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe"
                $configPath = "$(SIEBEL_EXPORT_CONFIG_PATH)"
                $srfDir = Split-Path -Parent "$(SIEBEL_SRF_DEST_PATH)"

                if (-not (Test-Path $toolsPath)) {
                  Write-Error "siebdev.exe não encontrado em: $toolsPath"
                  exit 1
                }

                if (-not (Test-Path $configPath)) {
                  Write-Error "tools_DevOps.cfg não encontrado em: $configPath"
                  exit 1
                }

                Write-Host "  Ferramenta : $toolsPath"
                Write-Host "  DataSource : $(SIEBEL_EXPORT_DATASOURCE)"
                Write-Host "  SRF destino: $(SIEBEL_SRF_DEST_PATH)"
                Write-Host ""
                Write-Host "srfDir = $srfDir"

                if (-not (Test-Path $srfDir)) { New-Item -ItemType Directory -Path $srfDir -Force | Out-Null }

                Write-Host "###########################################################################"
                Write-Host "toolsPath = $toolsPath"
                Write-Host "/c"
                Write-Host "configPath = $configPath"
                Write-Host "/d"
                Write-Host "(SIEBEL_EXPORT_DATASOURCE) = $(SIEBEL_EXPORT_DATASOURCE)"
                Write-Host "/u"
                Write-Host "(SIEBEL_EXPORT_USER) = $(SIEBEL_EXPORT_USER)"
                Write-Host "/p"
                Write-Host "(SIEBEL_EXPORT_PASSWORD) = ***"
                Write-Host "/tl PTB /bc"
                Write-Host "(SIEBEL_EXPORT_REPOSITORY) = $(SIEBEL_EXPORT_REPOSITORY)"
                Write-Host "(SIEBEL_SRF_DEST_PATH) = $(SIEBEL_SRF_DEST_PATH)"
                ##$apagar = "$toolsPath" '/c' "$configPath" '/d' "$(SIEBEL_EXPORT_DATASOURCE)" '/u' "$(SIEBEL_EXPORT_USER)" '/p' "$(SIEBEL_EXPORT_PASSWORD)" '/tl' 'PTB' '/bc' "$(SIEBEL_EXPORT_REPOSITORY)" "$(SIEBEL_SRF_DEST_PATH)"
                Write-Host "###########################################################################"

                # Log inicio
                $executionLogDir = "$(PIPE_EXEC_LOG_DIR)"
                if ([string]::IsNullOrWhiteSpace($executionLogDir)) {
                  $executionLogDir = "$(SIEBEL_PIPE_EXEC_LOG_DIR)"
                }
                if (-not (Test-Path $executionLogDir)) {
                  New-Item -ItemType Directory -Path $executionLogDir -Force | Out-Null
                }
                $nativeSiebelLogDir = "D:\SiebelLogs"
                if (-not (Test-Path $nativeSiebelLogDir)) {
                  New-Item -ItemType Directory -Path $nativeSiebelLogDir -Force | Out-Null
                }
                $env:SIEBEL_LOG_DIR = $nativeSiebelLogDir
                Write-Host "[CFG-LOG-004] SIEBEL_LOG_DIR efetivo na compilação SRF: $env:SIEBEL_LOG_DIR"
                $srfLogStamp = Get-Date -Format "yyyyMMdd_HHmmss"
                $log_path = Join-Path $executionLogDir "compilation_srf_$(Build.BuildId)_$srfLogStamp.log"
                Write-Host " log_path = $log_path"

                Write-Host "[$(Get-Date)] Starting Siebel process..."

                Add-Content -Path $log_path -Value "[$(Get-Date)] Starting Siebel process..."

                # Compila sempre que houve import de .sif nesta execução, além do controle via parâmetro.
                $enableSrfCompilation = ("$(ENABLE_SRF_COMPILATION)" -eq "true") -or ("$(importSif.HAS_SIF_FILES)" -eq "true")
                $jumpCompilationSRF = -not $enableSrfCompilation

                if (-not $jumpCompilationSRF) {
                  try {

                    $commandPreview = "& `"$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe`" /c `"$(SIEBEL_EXPORT_CONFIG_PATH)`" /d $(SIEBEL_EXPORT_DATASOURCE) /u $(SIEBEL_EXPORT_USER) /p *** /tl PTB /bc `"$(SIEBEL_EXPORT_REPOSITORY)`" `"$(SIEBEL_SRF_DEST_PATH)`""
                    Write-Host "[CMD-SRF-001] Comando de compilação SRF:"
                    Write-Host "  $commandPreview"
                    Add-Content -Path $log_path -Value "[$(Get-Date)] Command: $commandPreview"

                    $workDir = Split-Path -Parent "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe"
                    $startTime = Get-Date
                    Write-Host "[CMD-SRF-002] Diretório de trabalho do processo: $workDir"

                    Push-Location $workDir
                    try {
                      # Execucao direta (igual ao teste manual no host), sem Start-Process/redirect.
                      & "$(SIEBEL_EXPORT_TOOLS_PATH)\siebdev.exe" '/c' "$(SIEBEL_EXPORT_CONFIG_PATH)" '/d' "$(SIEBEL_EXPORT_DATASOURCE)" '/u' "$(SIEBEL_EXPORT_USER)" '/p' "$(SIEBEL_EXPORT_PASSWORD)" '/tl' 'PTB' '/bc' "$(SIEBEL_EXPORT_REPOSITORY)" "$(SIEBEL_SRF_DEST_PATH)"
                      $exitCode = $LASTEXITCODE
                    }
                    finally {
                      Pop-Location
                    }

                    $srfSizeBytes = 0
                    if (Test-Path "$(SIEBEL_SRF_DEST_PATH)") {
                      $srfSizeBytes = (Get-Item -Path "$(SIEBEL_SRF_DEST_PATH)").Length
                    }
                    $durationSec = [Math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
                    Write-Host "[CMD-SRF-003] ExitCode capturado do siebdev.exe: $exitCode"
                    Write-Host "[CMD-SRF-003] Duração da execução (s): $durationSec | srfSizeBytes = $srfSizeBytes"
                    Add-Content -Path $log_path -Value "[$(Get-Date)] Compilation finished. ExitCode=$exitCode Size=$srfSizeBytes bytes Duration=${durationSec}s"

                    Write-Host "[LOG-SYNC-101] Sincronizando logs nativos após compilação SRF..."
                    Get-ChildItem -Path $nativeSiebelLogDir -Filter "*.log" -ErrorAction SilentlyContinue |
                      Sort-Object LastWriteTime -Descending |
                      Select-Object -First 20 |
                      ForEach-Object {
                        Copy-Item -Path $_.FullName -Destination (Join-Path $executionLogDir $_.Name) -Force -ErrorAction SilentlyContinue
                        Write-Host "[LOG-SYNC-102] Copiado: $($_.Name)"
                      }
                  } catch {
                    Write-Error "🚨 Erro ao iniciar o processo Siebel: $($_.Exception.Message)"
                    exit 1
                  }
                }
                else {
                  Write-Host "⏭️ Compilação SRF pulada porque enableSrfCompilation=false"
                }

                }
            displayName: '🔨 Compilação SRF (siebdev.exe /bc)'
            condition: and(succeeded(), eq(variables['importSif.HAS_SIF_FILES'], 'true'))

          # ------------------------------------------------------------------
          # Step: Validar SRF Gerada
          # Descrição: Verifica se o arquivo SRF foi gerado/atualizado com
          #            tamanho válido. Em dryRun simula a verificação.
          # ------------------------------------------------------------------
          - powershell: |
              Write-Host "--- Validação do SRF Gerado ---"

              if ("$(DRY_RUN_MODE)" -eq "true") {
                Write-Host "🧪 DRY RUN — simulando validação do SRF"
                Write-Host "Arquivo SRF que seria verificado: $(SIEBEL_SRF_DEST_PATH)"
                Write-Host "Critério1: arquivo existe e tamanho <> 0 bytes"
                Write-Host "Critério2: arquivo existe e tamanho > 70 Mbytes"
                Write-Host "Critério3: Verifica se o SRF foi modificado nos últimos 10 minutos"
                Write-Host "✅ Validação do SRF simulada com sucesso"
              }
              else {
                Write-Host "Verificando SRF em: $(SIEBEL_SRF_DEST_PATH)"

                $srfPath = "$(SIEBEL_SRF_DEST_PATH)"

                if (-not (Test-Path $srfPath)) {
                  Write-Error "🚨 SRF não encontrado após compilação: $srfPath"
                  exit 1
                }

                $srfFile = Get-Item -Path $srfPath
                $sizeKB  = [math]::Round($srfFile.Length / 1KB, 2)
                $sizeMB  = [math]::Round($srfFile.Length / 1MB, 2)
                Write-Host "  Tamanho: ${sizeKB} KB"
                Write-Host "  Modificado: $($srfFile.LastWriteTime)"

                if ($srfFile.Length -eq 0) {
                  Write-Error "🚨 SRF gerado está vazio (0 bytes) — compilação falhou silenciosamente"
                  exit 1
                }

                $minimumSrfSizeBytes = 70MB
                if ($srfFile.Length -lt $minimumSrfSizeBytes) {
                  Write-Error "🚨 SRF gerado está com tamanho menor que o padrão de 70MB — compilação gerou arquivo com ${sizeMB} MB"
                  exit 1
                } else {
                  Write-Host "✅ SRF gerado --> tamanho: ${sizeMB} MB"
                }

                # Verifica se o SRF foi modificado nos últimos 10 minutos
                $ageMinutes = (Get-Date) - $srfFile.LastWriteTime | Select-Object -ExpandProperty TotalMinutes
                if ($ageMinutes -gt 10) {
                  Write-Host "⚠️  SRF existe mas não foi atualizado recentemente (${ageMinutes:F1} min atrás) — verificar compilação"
                }
                else {
                  Write-Host "✅ SRF gerado e atualizado há ${ageMinutes:F1} minutos"
                }
                Write-Host "✅ Validação do SRF concluída"
              }
            displayName: '🔍 Validar SRF Gerada'
            condition: and(succeeded(), eq(variables['importSif.HAS_SIF_FILES'], 'true'))

          - task: PublishPipelineArtifact@1
            displayName: '📤 Publicar Logs da Execução (Import/SRF)'
            inputs:
              targetPath: '$(PIPE_EXEC_LOG_DIR)'
              artifact: 'siebel-exec-logs-$(Build.BuildId)'
              publishLocation: 'pipeline'
            condition: always()
            continueOnError: true

      # ------------------------------------------------------------------
      # Job 2: Import NonRepository (.xml) via srvrmgr SSH
      # Executa no pool Linux padrão via SSH ao servidor Siebel
      # ------------------------------------------------------------------
      - job: ImportNonRepository
        displayName: 'Import NonRepository Objects (.xml)'
        condition: and(succeeded(), or(eq('${{ parameters.objectType }}', 'nonrepository'), eq('${{ parameters.objectType }}', 'both')))
        pool:
          name: $(CD_AGENT_POOL)
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: '📥 Download Artefatos (NonRepository)'
            inputs:
              artifactName: 'deploy-artifacts'
              targetPath: '$(Pipeline.Workspace)/deploy-artifacts'

          - bash: |

              set -eo pipefail
              # Lógica principal do job:
              # 1) copiar XML/INI para servidor Siebel
              # 2) montar arquivo batch de comandos srvrmgr
              # 3) executar import em lote e validar erros de configuração (TaskCfgSvalError)
              echo "--- Import NonRepository Objects (.xml) ---"
              echo ""

              xmlDir="$(Pipeline.Workspace)/deploy-artifacts/exported-xml-files"
              xmlCount=$(find "${xmlDir}" -maxdepth 1 -name '*.xml' -type f 2>/dev/null | wc -l | tr -d ' ')

              if [[ "${xmlCount}" -eq 0 ]]; then
                echo "⚠️  Nenhum arquivo .xml encontrado em: ${xmlDir}"
                echo "   Pulando import nonrepository."
                exit 0
              fi

              echo "xmlDir = ${xmlDir}"
              echo "Arquivos .xml encontrados: ${xmlCount}"
              if [[ "${xmlCount}" -gt 1 ]]; then
                xmlNames=$(find "${xmlDir}" -maxdepth 1 -name '*.xml' -type f 2>/dev/null | xargs -r -n1 basename | paste -sd '|' - | sed 's/|/ | /g')
                echo "ℹ️  Modo multi-artefato habilitado (${xmlCount} artefatos). Artefatos: ${xmlNames}"
              fi
              find "${xmlDir}" -maxdepth 1 -name '*.xml' | sed 's/^/  • /' || true
              echo ""

              dryRun="$(DRY_RUN_MODE)"
              srvrmgrPath="$(SIEBEL_SRVRMGR_PATH)"
              ### siebelServer="$(SIEBEL_SERVER)"
              # siebelEnterprise="$(SIEBEL_ENTERPRISE)"
              # siebelServerIp="$(SIEBEL_SERVER_IP)"

              sshUser="$(SIEBEL_SERVER_USER)"
              sshPassword="$(SIEBEL_SERVER_PASS)"
              exportUser="$(SIEBEL_EXPORT_USER)"
              exportPassword="$(SIEBEL_EXPORT_PASSWORD)"
              remoteExportDir="$(SIEBEL_REMOTE_EXPORT_DIR)"
              udaImportDir="${SIEBEL_ADM_IMPORT_DIR:-/app/scripts/jobs/sieb8_deploy/.novo/NonRepository}"
              wfServer="${SIEBEL_SRVRMGR_SERVER:-${SIEBEL_SERVER}}"

              # Variável reservada para cenário futuro com RowID global.
              # Nesta implementação o contrato operacional é RowID por arquivo,
              # casando 1:1 com o nome do INI (<RowID>.ini).
              udaImportRowId="$(SIEBEL_UDA_IMPORT_ROWID)"
              localCmdFile="$(Agent.TempDirectory)/srvrmgr_import_cmds_$(Build.BuildId).txt"
              remoteCmdFile="${udaImportDir}/srvrmgr_import_cmds_$(Build.BuildId).txt"

              if [[ -z "${exportPassword}" ]]; then
                echo "⚠️  SIEBEL_EXPORT_PASSWORD não definida — ativando DRY RUN"
                dryRun="true"
              fi

              if [[ -z "${sshUser}" || -z "${sshPassword}" ]]; then
                echo "⚠️  SIEBEL_SERVER_USER ou SIEBEL_SERVER_PASS não definidos — ativando DRY RUN"
                dryRun="true"
              fi

              if [[ "${dryRun}" != "true" ]] && ! command -v sshpass >/dev/null 2>&1; then
                echo "##[error]sshpass não instalado no agente Linux"
                exit 1
              fi

              if [[ "${dryRun}" == "true" ]]; then
                echo "🧪 DRY RUN — simulando import via srvrmgr/ADMBatchProc"
                echo ""
                echo "Servidor destino: ${SIEBEL_SERVER} (${SIEBEL_SERVER_IP})"
                  echo "Usuário SSH: ${sshUser}"
                  echo "Usuário Siebel: ${exportUser}"
                echo "Diretório remoto (exports): ${remoteExportDir}"
                echo "Diretório remoto (UDA import): ${udaImportDir}"
                echo "Arquivo de comandos remoto: ${remoteCmdFile}"
                echo "Diretório remoto 2 remoteExportDir: ${remoteExportDir}"
                echo "Diretório remoto SIEBEL_REMOTE_EXPORT_DIR: $(SIEBEL_REMOTE_EXPORT_DIR)"
                echo "RowID import UDA: por arquivo (derivado do nome do XML)"
                echo "Build: $(Build.BuildId)"
                echo ""

                fileIndex=0
                find "${xmlDir}" -maxdepth 1 -name '*.xml' | sort | while read -r xmlFile; do
                  fileIndex=$((fileIndex + 1))
                  baseName=$(basename "${xmlFile}")
                  xmlStem="${baseName%.*}"
                  echo "[ARTEFATO ${fileIndex}/${xmlCount}] Iniciando tratamento: ${baseName}"
                  # Contrato UDA: o process tenta abrir <RowID>.ini no diretório remoto.
                  # Portanto RowID e nome do INI precisam ser idênticos.
                  iniRowId="$(echo "${xmlStem}" | tr -cd '[:alnum:]_.-')"
                  if [[ -z "${iniRowId}" ]]; then
                    echo "##[error]RowID inválido após sanitização para arquivo ${baseName}."
                    exit 1
                  fi
                  iniName="${iniRowId}.ini"
                  echo ""
                  echo "  xmlStem = ${xmlStem}"
                  echo "  iniRowId = ${iniRowId}"
                  echo ""
                  echo "--- Arquivo ${fileIndex}: ${baseName} ---"
                  echo "  Passo 1: Copiar XML e INI para servidor remoto via SCP"
                  echo ""
                  echo "  esse é o numero do Build  $(Build.BuildId) "
                  echo "  arquivo ini = ${iniName}"
                  echo "  com conteúdo: ${baseName}"
                  echo ""
                  echo "  Gerar INI local (${iniName}) com conteúdo: ${baseName}"
                  echo "  Comando:"
                  echo "    SSHPASS=*** sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 \\"
                  echo "        \"${xmlFile}\" \\"
                  echo "        \"${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${baseName}\""
                  echo "    mkdir -p \"$(INI_OUTPUT_PATH)\""
                  echo "    echo \"${baseName}\" > \"$(INI_OUTPUT_PATH)/${iniName}\""
                  echo "    cat \"$(INI_OUTPUT_PATH)/${iniName}\""
                  echo "    SSHPASS=*** sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 \\"
                  echo "        \"$(INI_OUTPUT_PATH)/${iniName}\" \\"
                  echo "        \"${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${iniName}\""
                  echo ""
                done

                echo "  Passo 2: Gerar arquivo texto com os comandos de import"
                echo "  Exemplo de linha no arquivo:"
                echo "    start task for comp WfProcMgr server ${wfServer} with ProcessName=\"UDA Batch Import\",RowID=\"arquivo001\""
                echo ""
                echo " Conteúdo que seria gerado em: ${remoteCmdFile}"
                echo "  ---"
                fileIndex=0
                find "${xmlDir}" -maxdepth 1 -name '*.xml' | sort | while read -r xmlFile; do
                  fileIndex=$((fileIndex + 1))
                  baseName=$(basename "${xmlFile}")
                  xmlStem="${baseName%.*}"
                  # Contrato UDA no dry run: RowID por arquivo e INI com mesmo nome.
                  iniRowId="$(echo "${xmlStem}" | tr -cd '[:alnum:]_.-')"
                  if [[ -z "${iniRowId}" ]]; then
                    echo "##[error]RowID inválido após sanitização para arquivo ${baseName}."
                    exit 1
                  fi
                  iniName="${iniRowId}.ini"
                  echo " "
                  echo "    start task for comp WfProcMgr server ${wfServer} with ProcessName=\"UDA Batch Import\",RowID=\"${iniRowId}\""
                done
                echo "  ---"
                echo ""
                echo "  Passo 3: Enviar arquivo de comandos para o servidor"
                echo "  Comando:"
                echo "    SSHPASS=*** sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 \\"
                echo "        \"${localCmdFile}\" \\"
                echo "        \"${sshUser}@${SIEBEL_SERVER_IP}:${remoteCmdFile}\""
                echo ""
                echo "  Passo 4: Executar import em lote via srvrmgr com -i (uma única chamada)"
                echo "  Comando:"
                echo "    SSHPASS=*** sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \\"
                echo "        \"${sshUser}@${SIEBEL_SERVER_IP}\" \\"
                echo "        \"source /app/siebel/siebsrvr/siebenv.sh && ${srvrmgrPath} -g ${SIEBEL_GATEWAY} -e ${SIEBEL_ENTERPRISE} \\"
                echo "         -u ${exportUser} -p ${exportUser} \\"
                echo "         -i ${remoteCmdFile}\""

                echo "✅ Import NonRepository simulado com sucesso (${xmlCount} arquivo(s))"
              else
                echo "Modo DRY RUN - desligado"
                echo "🚀 Importando via srvrmgr/ADMBatchProc no servidor: ${SIEBEL_SERVER} (${SIEBEL_SERVER_IP})"
                echo ""

                rm -f "${localCmdFile}"

                mkdir -p "$(INI_OUTPUT_PATH)"


                sshErrMsg=$(SSHPASS="${sshPassword}" sshpass -e ssh \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=30 \
                  "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "mkdir -p '${remoteExportDir}' '${udaImportDir}'" 2>&1) || sshErr=$?


                sshErr="${sshErr:-0}"
                if [[ "${sshErr}" -ne 0 ]]; then
                  echo "##[error]Falha na conexão SSH para ${SIEBEL_SERVER_IP}:22 (código: ${sshErr})"
                  echo "##[error]Mensagem: ${sshErrMsg}"
                  echo "##[error]Verifique rota/firewall entre o agente e o servidor Siebel."
                  exit 1
                fi

                echo "Diretórios remotos criados (ou já existentes): ${remoteExportDir}, ${udaImportDir}"

                fileIndex=0
                find "${xmlDir}" -maxdepth 1 -name '*.xml' | while read -r xmlFile; do
                  fileIndex=$((fileIndex + 1))
                  baseName=$(basename "${xmlFile}")
                  xmlStem="${baseName%.*}"
                  echo "[ARTEFATO ${fileIndex}/${xmlCount}] Iniciando tratamento: ${baseName}"

                  # Contrato UDA em execução real: RowID por arquivo e INI com mesmo nome.
                  iniRowId="$(echo "${xmlStem}" | tr -cd '[:alnum:]_.-')"

                  if [[ -z "${iniRowId}" ]]; then
                    echo "##[error]RowID inválido após sanitização para arquivo ${baseName}."
                    exit 1
                  fi
                  iniName="${iniRowId}.ini"
                  localIniFile="$(INI_OUTPUT_PATH)/${iniName}"
                  echo "  Importando: ${baseName}..."

                  echo "Servidor destino: ${SIEBEL_SERVER} (${SIEBEL_SERVER_IP})"
                  echo "Usuário SSH: ${sshUser}"
                  echo "Usuário Siebel: ${exportUser}"
                  echo "xmlFile: ${xmlFile}"
                  echo "SIEBEL_SERVER_IP: ${SIEBEL_SERVER_IP}"
                  echo "remoteExportDir: ${remoteExportDir}"
                  echo "baseName: ${baseName}"
                  echo "iniName:  ${iniName}"
                  echo "iniRowId: ${iniRowId}"
                  echo "Build: $(Build.BuildId)"
                  echo "xmlFile : ${xmlFile}"
                  echo "localIniFile: ${localIniFile}"
                  echo "linha1 = ${xmlFile} \ ${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${baseName}"
                  echo "linha2 = ${localIniFile} \ ${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${iniName}"

                  # Implementação atual (segura para YAML + Bash): grava o INI com printf.
                  printf '%s\n' \
                    '[Import]' \
                    "FileName=${baseName}" \
                    "FilePath=${udaImportDir}/${baseName}" \
                    "InputFile=${udaImportDir}/${baseName}" \
                    > "${localIniFile}"
                  echo "Conteúdo do INI gerado (${localIniFile}):"
                  sed 's/^/  /' "${localIniFile}" || true

                    SSHPASS="${sshPassword}" sshpass -e scp \
                      -o StrictHostKeyChecking=no \
                      -o ConnectTimeout=30 \
                      "${xmlFile}" \
                      "${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${baseName}"

                    SSHPASS="${sshPassword}" sshpass -e scp \
                      -o StrictHostKeyChecking=no \
                      -o ConnectTimeout=30 \
                      "${localIniFile}" \
                      "${sshUser}@${SIEBEL_SERVER_IP}:${udaImportDir}/${iniName}"

                  echo "Arquivos XML e INI copiados para o servidor remoto via SCP"

                  # Validação pós-cópia: confirma no servidor remoto que XML e INI existem e têm tamanho > 0.
                  SSHPASS="${sshPassword}" sshpass -e ssh \
                    -o StrictHostKeyChecking=no \
                    -o ConnectTimeout=30 \
                    "${sshUser}@${SIEBEL_SERVER_IP}" \
                    "test -s '${udaImportDir}/${baseName}' && test -s '${udaImportDir}/${iniName}' && ls -lh '${udaImportDir}/${baseName}' '${udaImportDir}/${iniName}'"

                  echo "Validação pós-cópia confirmada para ${baseName} e ${iniName}"

                  # Adicionar comando no arquivo batch para execução única via srvrmgr -i
                  # Importante: RowID vem de variável fixa para evitar erro de validação de configuração.
                  echo "start task for comp WfProcMgr server ${wfServer} with ProcessName=\"UDA Batch Import\",RowID=\"${iniRowId}\"" >> "${localCmdFile}"

                  echo "  ✅ ${baseName} e ${iniName} copiados e comando adicionado ao batch"
                done

                if [[ ! -s "${localCmdFile}" ]]; then
                  echo "⚠️ [error]Arquivo de comandos srvrmgr não foi gerado: ${localCmdFile}"
                  exit 1
                fi



                echo ""
                echo "📄 Conteúdo do arquivo de comandos gerado (${localCmdFile}):"
                echo "  ---"
                while IFS= read -r linha; do echo "    ${linha}"; done < "${localCmdFile}"
                echo "  ---"

                echo ""
                echo "📄 Enviando arquivo de comandos para o servidor: ${remoteCmdFile}"
                SSHPASS="${sshPassword}" sshpass -e scp \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=30 \
                  "${localCmdFile}" \
                  "${sshUser}@${SIEBEL_SERVER_IP}:${remoteCmdFile}"

                # Validação do arquivo de comandos no servidor remoto antes de executar srvrmgr -i.
                SSHPASS="${sshPassword}" sshpass -e ssh \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=30 \
                  "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "test -s '${remoteCmdFile}' && wc -l '${remoteCmdFile}'"

                echo "🚀 Executando import em lote no srvrmgr (uma única chamada com -i)"
                remoteOutputFile="${remoteExportDir}/output_NonRepository_$(Build.BuildId).log"

                echo "remoteOutputFile = ${remoteOutputFile}"

                echo "**********************************************"
                echo "sshUser = ${sshUser}"
                echo "SIEBEL_SERVER_IP = ${SIEBEL_SERVER_IP}"
                echo "srvrmgrPath = ${srvrmgrPath}"
                echo "exportUser = ${exportUser}"
                echo "exportPassword = ***"
                echo "remoteCmdFile = ${remoteCmdFile}"
                echo "remoteOutputFile = ${remoteOutputFile}"
                echo "importExitCode = ${importExitCode}"
                echo "**********************************************"

                SSHPASS="${sshPassword}" sshpass -e ssh \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=30 \
                  "${sshUser}@${SIEBEL_SERVER_IP}" \
                    "source /app/siebel/siebsrvr/siebenv.sh && ${srvrmgrPath} -g ${SIEBEL_GATEWAY} -e ${SIEBEL_ENTERPRISE}\
                     -u ${exportUser} -p '${exportPassword}' \
                     -i ${remoteCmdFile} \
                     -o ${remoteOutputFile}"
                importExitCode=$?


                # Fail fast: se o srvrmgr já retornou erro, aborta com contexto claro.
                if [[ "${importExitCode}" -ne 0 ]]; then
                  echo "##[error]srvrmgr retornou código ${importExitCode} ao executar import em lote."
                  echo "##[error]Arquivo de comandos remoto: ${remoteCmdFile}"
                  echo "##[error]Arquivo de output remoto: ${remoteOutputFile}"
                  exit ${importExitCode}
                fi

                echo ""
                echo "--- Verificação de Output e Logs do Import NonRepository ---"
                echo "Arquivo de output do srvrmgr: ${remoteOutputFile}"

                SSHPASS="${sshPassword}" sshpass -e ssh \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=30 \
                  "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "outputFile='${remoteOutputFile}'; \
                   logDir='/app/siebel/logs'; \
                   hasErrors=0; \
                   if [[ ! -f \"\${outputFile}\" ]]; then \
                     echo '⚠️ Arquivo de output não encontrado:' \"\${outputFile}\"; \
                   else \
                     echo '📄 Conteúdo do arquivo de output:'; \
                     echo '---'; \
                     cat \"\${outputFile}\"; \
                     echo '---'; \
                     if grep -qi 'TaskCfgSvalError' \"\${outputFile}\" 2>/dev/null; then \
                       echo '🚨 TaskCfgSvalError detectado no output do srvrmgr'; \
                       hasErrors=1; \
                     fi; \
                     if grep -qi 'SBL-DEV-00464' "\${outputFile}" 2>/dev/null; then \
                       echo '🚨 SBL-DEV-00464 detectado: o UDA não encontrou o arquivo esperado.'; \
                       echo '💡 Verifique consistência entre RowID e nome do INI (<RowID>.ini).'; \
                       hasErrors=1; \
                     fi; \
                     taskIds=\$(grep -E '^[[:space:]]*[^[:space:]]+[[:space:]]+WfProcMgr[[:space:]]+[0-9]+' \"\${outputFile}\" | awk '{print \$3}' | sort -u); \
                     if [[ -z \"\${taskIds}\" ]]; then \
                       echo '⚠️ Nenhum TK_TASKID encontrado no output do srvrmgr'; \
                     else \
                       echo '🔎 TK_TASKID(s) identificados:'; \
                       echo \"\${taskIds}\" | sed 's/^/  - /'; \
                       for taskId in \${taskIds}; do \
                         echo ''; \
                         echo \"--- Varredura de logs para TK_TASKID=\${taskId} ---\"; \
                         taskLogs=\$(find \"\${logDir}\" -maxdepth 1 -type f -name \"WfProcMgr_*_\${taskId}.log\" 2>/dev/null); \
                         if [[ -z \"\${taskLogs}\" ]]; then \
                           echo \"⚠️ Nenhum log encontrado para TK_TASKID=\${taskId}\"; \
                           continue; \
                         fi; \
                         echo '📋 Logs encontrados:'; \
                         echo \"\${taskLogs}\" | sed 's/^/  - /'; \
                         while IFS= read -r logFile; do \
                           [[ -z \"\${logFile}\" ]] && continue; \
                           echo \"Analisando: \${logFile}\"; \
                           if grep -Eqi 'error|TaskCfgSvalError|SBL-[A-Z0-9]+' \"\${logFile}\" 2>/dev/null; then \
                             echo \"🚨 ERROR encontrado no log: \${logFile}\"; \
                             grep -Eni 'error|TaskCfgSvalError|SBL-[A-Z0-9]+' \"\${logFile}\" | sed 's/^/  /'; \
                             hasErrors=1; \
                           else \
                             echo \"✅ Sem error no log: \${logFile}\"; \
                           fi; \
                         done <<< \"\${taskLogs}\"; \
                       done; \
                     fi; \
                   fi; \
                   exit \${hasErrors}"

                # Limpeza opcional do arquivo remoto de comandos (desabilitada por enquanto)
                # Descomente quando validado no ambiente para evitar residuos no servidor.
                # ssh -o StrictHostKeyChecking=no \
                #     -o ConnectTimeout=30 \
                #     "${exportUser}@${SIEBEL_SERVER_IP}" \
                #     "rm -f ${remoteCmdFile}"

                echo ""
                echo "✅ Import NonRepository concluído"
              fi
            displayName: '🚀 Executar Import NonRepository (srvrmgr/ADMBatchProc)'

  # ==================================================================
  # Stage 4: PostDeploy - Restart de Serviços e Ativação de Objetos
  # Descrição: Reinicia serviços Siebel e/ou ativa objetos WF/RS/Task
  #            após importação bem-sucedida. Stages condicionais.
  # ==================================================================
  - stage: PostDeploy
    displayName: '🔧 PostDeploy - Restart e Ativação'
    dependsOn:
      - Prepare
      - Download
      - Deploy
    condition: always()
    pool:
      name: $(CD_AGENT_POOL)
    jobs:
      # Restart depende de haver objetos repository (.sif) no pacote baixado do CI, não de hash de SRF.
      - job: RestartIfRepositoryChanged
        displayName: '🔄 Restart quando Objetos Repository (.sif) Alterados'
        condition: always()
        variables:
          SIF_COUNT: $[ coalesce(stageDependencies.Download.DownloadArtifacts.outputs['validateArtifacts.SIF_COUNT'], '0') ]
          XML_COUNT: $[ coalesce(stageDependencies.Download.DownloadArtifacts.outputs['validateArtifacts.XML_COUNT'], '0') ]
        steps:
          - checkout: none

          - bash: |
              echo "--- Restart Condicional ---"
              echo "Restart: ${{ parameters.enableRestart }} | Ambiente: ${{ parameters.environment }}"
              echo "SIF_COUNT: $(SIF_COUNT) | XML_COUNT: $(XML_COUNT)"
              echo ""

              sifCount="$(SIF_COUNT)"
              xmlCount="$(XML_COUNT)"

              if [[ -z "${sifCount}" ]]; then
                sifCount="0"
              fi
              if [[ -z "${xmlCount}" ]]; then
                xmlCount="0"
              fi

              if ! [[ "${sifCount}" =~ ^[0-9]+$ ]]; then
                echo "⚠️  SIF_COUNT inválido (${sifCount}). Assumindo 0 para proteger o restart."
                sifCount="0"
              fi

              if ! [[ "${xmlCount}" =~ ^[0-9]+$ ]]; then
                echo "⚠️  XML_COUNT inválido (${xmlCount}). Assumindo 0 para diagnóstico."
                xmlCount="0"
              fi

              if [[ "${sifCount}" -le 0 ]]; then
                echo "=== Skip Restart ==="
                if [[ "${xmlCount}" -gt 0 ]]; then
                  echo "Foi identificado apenas objetos Não repositorios."
                else
                  echo "Não foi identificado objeto repository alterado."
                fi
                exit 0
              fi

              restartTargetsRaw='${{ parameters.restartEnvironmentsCsv }}'
              currentEnv='${{ parameters.environment }}'
              normalizedTargets="$(echo "${restartTargetsRaw}" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
              normalizedEnv="$(echo "${currentEnv}" | tr '[:upper:]' '[:lower:]')"

              if [[ ",${normalizedTargets}," != *",${normalizedEnv},"* ]]; then
                echo "=== Skip Restart ==="
                echo "ℹ️ Ambiente ${currentEnv} não está na lista de restart (${restartTargetsRaw})."
                echo "ℹ️ Skip de restart por parâmetro."
                exit 0
              fi

              sshUser="$(SIEBEL_SERVER_USER)"
              sshPassword="$(SIEBEL_SERVER_PASS)"
              dryRun="$(DRY_RUN_MODE)"

              if [[ -z "${sshUser}" || -z "${sshPassword}" ]]; then
                echo "⚠️  SIEBEL_SERVER_USER ou SIEBEL_SERVER_PASS não definidos — ativando DRY RUN"
                dryRun="true"
              fi

              if [[ "${dryRun}" != "true" ]] && ! command -v sshpass >/dev/null 2>&1; then
                echo "##[error]sshpass não instalado no agente Linux"
                exit 1
              fi

              echo "🔄 Restart de serviços Siebel (stop_server / start_server)..."
              if [[ "${dryRun}" == "true" ]]; then
                echo "🧪 DRY RUN — simulando restart"
                echo ""
                echo "  Servidor destino: ${SIEBEL_SERVER} (${SIEBEL_SERVER_IP})"
                echo "  Usuário SSH: ${sshUser}"
                echo ""
                echo "  Comando que seria executado:"
                echo "    SSHPASS=*** sshpass -e ssh -o StrictHostKeyChecking=no \"${sshUser}@${SIEBEL_SERVER_IP}\" \\"
                echo "        \"source /app/siebel/siebsrvr/siebenv.sh && \\"
                echo "         echo '=== LIST SERVER (ANTES do restart) ===' && \\"
                echo "         /app/siebel/siebsrvr/bin/list_server all && \\"
                echo "         echo '=== STOP SERVER ===' && \\"
                echo "         /app/siebel/siebsrvr/bin/stop_server all && \\"
                echo "         echo '=== START SERVER ===' && \\"
                echo "         /app/siebel/siebsrvr/bin/start_server all && \\"
                echo "         echo '=== LIST SERVER (DEPOIS do restart) ===' && \\"
                echo "         /app/siebel/siebsrvr/bin/list_server all\""
                echo ""
                echo "✅ Restart simulado com sucesso"

              else
                # Restart real via stop_server/start_server em etapas separadas
                echo '=== LIST SERVER (ANTES do restart) ==='
                SSHPASS="${sshPassword}" sshpass -e ssh -o StrictHostKeyChecking=no "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "source /app/siebel/siebsrvr/siebenv.sh && \
                   /app/siebel/siebsrvr/bin/list_server all"
                listBeforeExit=$?
                if [[ "${listBeforeExit}" -ne 0 ]]; then
                  echo "##[error]Falha no LIST SERVER antes do restart (código: ${listBeforeExit})"
                  exit 1
                fi

                echo '=== STOP SERVER ==='
                SSHPASS="${sshPassword}" sshpass -e ssh -o StrictHostKeyChecking=no "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "source /app/siebel/siebsrvr/siebenv.sh && \
                   /app/siebel/siebsrvr/bin/stop_server all"
                stopExit=$?
                if [[ "${stopExit}" -ne 0 ]]; then
                  echo "##[error]Falha no STOP SERVER (código: ${stopExit})"
                  exit 1
                fi

                echo '=== START SERVER ==='
                SSHPASS="${sshPassword}" sshpass -e ssh -o StrictHostKeyChecking=no "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "source /app/siebel/siebsrvr/siebenv.sh && \
                   /app/siebel/siebsrvr/bin/start_server all"
                startExit=$?
                if [[ "${startExit}" -ne 0 ]]; then
                  echo "##[error]Falha no START SERVER (código: ${startExit})"
                  exit 1
                fi

                echo '=== LIST SERVER (DEPOIS do restart) ==='
                SSHPASS="${sshPassword}" sshpass -e ssh -o StrictHostKeyChecking=no "${sshUser}@${SIEBEL_SERVER_IP}" \
                  "source /app/siebel/siebsrvr/siebenv.sh && \
                   /app/siebel/siebsrvr/bin/list_server all"
                listAfterExit=$?
                if [[ "${listAfterExit}" -ne 0 ]]; then
                  echo "##[error]Falha no LIST SERVER depois do restart (código: ${listAfterExit})"
                  exit 1
                fi

                echo "✅ Restart solicitado"
              fi
            displayName: '🔄 Executar Restart Siebel'

      - job: ActivateIfEnabled
        displayName: '✅ Ativação Pós-Deploy'
        condition: and(in(stageDependencies.Deploy.ImportRepository.result, 'Succeeded', 'Skipped'), in(stageDependencies.Deploy.ImportNonRepository.result, 'Succeeded', 'Skipped'), eq('${{ parameters.enableActivate }}', 'true'))
        steps:
          - checkout: none

          - bash: |
              echo "--- Ativação Pós-Deploy ---"
              echo "Activate: ${{ parameters.enableActivate }}"
              echo ""

              sshUser="$(SIEBEL_SERVER_USER)"
              sshPassword="$(SIEBEL_SERVER_PASS)"
              exportUser="$(SIEBEL_EXPORT_USER)"
              srvrmgrPath="$(SIEBEL_SRVRMGR_PATH)"
              dryRun="$(DRY_RUN_MODE)"

              if [[ -z "${sshUser}" || -z "${sshPassword}" ]]; then
                echo "⚠️  SIEBEL_SERVER_USER ou SIEBEL_SERVER_PASS não definidos — ativando DRY RUN"
                dryRun="true"
              fi

              if [[ "${dryRun}" != "true" ]] && ! command -v sshpass >/dev/null 2>&1; then
                echo "##[error]sshpass não instalado no agente Linux"
                exit 1
              fi

              echo "✅ Ativação de objetos WF/RS/Task..."
              if [[ "${dryRun}" == "true" ]]; then
                echo "🧪 DRY RUN — simulando ativação"
                echo ""
                echo "  Servidor destino: ${SIEBEL_SERVER} (${SIEBEL_SERVER_IP})"
                echo "  Usuário SSH: ${sshUser}"
                echo "  Usuário Siebel: ${exportUser}"
                echo ""
                echo "  Comando que seria executado:"
                echo "    SSHPASS=*** sshpass -e ssh -o StrictHostKeyChecking=no \"${sshUser}@${SIEBEL_SERVER_IP}\" \\"
                echo "        \"${srvrmgrPath} -g ${SIEBEL_GATEWAY} -e ${SIEBEL_ENTERPRISE}\\"
                echo "         -u ${exportUser} -p *** \\"
                echo "         -i 'run task for comp WfProcMgr with ModeType=ACTIVATE'\""
                echo ""
                echo "✅ Ativação simulada com sucesso"
              else
                # Ativação de Workflow Processes
                echo "✅ Ativação simulada (comando exibido) com sucesso"
                echo "✅ Ativação concluída"
              fi
            displayName: '✅ Executar Ativação Pós-Deploy'


  # ==================================================================
  # Stage 6: DeploymentCompleted - Registro obrigatório no Event Hub
  # ==================================================================
  # Descrição: consolida status do deployment e publica evento corporativo.
  # Impacto: rastreamento centralizado, auditoria e compliance de entrega.
  - stage: DeploymentCompleted
    displayName: '📊 Deployment Completed - Event Registration'
    dependsOn:
      - Prepare
      - Deploy
      - PostDeploy
    condition: always()
    pool:
      name: $(CD_AGENT_POOL)
    jobs:
      - job: RegisterDeploymentEvent
        displayName: 'Register Deployment Event to Event Hub'
        variables:
          NEW_VERSION: $[ stageDependencies.Prepare.Initialize.outputs['resolveVersion.ARTIFACT_VERSION'] ]
        steps:
          # Verificação final: job focado em telemetria pós-deploy

          # Publicação: registro de conclusão do deployment no Event Hub
          - task: VivoEventHubTools@2
            displayName: 'Register Deployment Completion Event'
            inputs:
              appName: '$(Build.Repository.Name)'
              appVersion: '$(NEW_VERSION)'
              deploymentEnvironment: '${{ parameters.environment }}'
              deploymentStatus: 'Completed'
              deploymentDuration: '$(System.JobDisplayName)'
              serviceConnection: 'DevOpsSharedResources'
              eventType: 'DeploymentCompleted'
              includeArtifacts: true
            continueOnError: false
            enabled: true
