      condition: not(variables['CATALOG_YAML_HELM_REPO_NAME'])
      displayName: Using default 'devops-helm'


    - task: HelmDeploy@1
      displayName: '[Nexus] Helm repo add'
      condition: succeeded()
      inputs:
        # connectionType: 'Azure Resource Manager'
        # azureResourceGroup: $(CATALOG_YAML_RG)
        # kubernetesCluster: aks-$(CATALOG_YAML_SIGLA_BU)-brsouth-${{ parameters.environment }}
