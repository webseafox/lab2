    #       helm registry login acrsharedservices01.azurecr.io
    #         --username $(HELM-REGISTRY-ACR-USERNAME)
    #         --password "$(HELM-REGISTRY-ACR-PASSWORD)

    - task: YamlParseFromVivo@4
      displayName: Get Metadata Info
      name: catalog_info
      inputs:
        type: 'file'
        origin: $(System.ArtifactsDirectory)/bin/catalog-info.yaml
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
          var CATALOG_YAML_SIGLA_BU = .metadata.annotations['techarch.governance-app.sigla_bu']
          var CATALOG_YAML_RG = .metadata.annotations['techarch.governance-app.resource_group']
          var CATALOG_YAML_MODULE = .metadata.annotations['techarch.governance-app.module']
          var CATALOG_YAML_SONAR_PROJECT_KEY = .metadata.annotations['sonarqube.org/project-key']
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']
          var CATALOG_YAML_K8S_NS = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-${{ parameters.environment }}']
          var CATALOG_YAML_K8S_NS_DEV = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-dev']
          var CATALOG_YAML_K8S_NS_HML = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-hml']
          var CATALOG_YAML_K8S_NS_PRD = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-prd']
          var CATALOG_YAML_K8S_NS_ESTEIRA1 = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-esteira1']
          var CATALOG_YAML_K8S_NS_ESTEIRA2 = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-esteira2']
          var CATALOG_YAML_K8S_NS_PREPROD = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-preprod']
          var CATALOG_YAML_K8S_NS_PRODLIKE = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-prodlike']
          var CATALOG_YAML_K8S_NS_PRODUCAO = .metadata.annotations['vivo.io/kubernetes-k8s-namespace-producao']

          var CATALOG_YAML_HELM_REPO_NAME = .metadata.annotations['vivo.io/helm-repo-name']
    # - template: /tech_products/code/template_tasks_javabasecloud_cd_v5-helm.yaml
