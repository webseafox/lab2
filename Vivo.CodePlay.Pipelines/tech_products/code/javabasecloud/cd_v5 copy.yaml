  jobs:
  - job: deploy_on_kube
    continueOnError: False
    condition: succeeded()
    displayName: Deploy on Kubernetes (${{ parameters.environment }})
    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        project: '5dd6e0e3-0415-43c4-b730-17063944d467'
        pipeline: '21575'
        buildVersionToDownload: 'specific'
        buildId: '290555'
        buildType: 'specific'
        itemPattern: |
          bin/**/pom.xml
          bin/.azuredevops/**/*
          bin/catalog-info.y*ml
          bin/pom.xml
        downloadPath: '$(System.ArtifactsDirectory)'
        cleanDestinationFolder: true

    - checkout: none
    # - task: DownloadBuildArtifacts@1
    #   displayName: Download Artifact
    #   inputs:
    #     buildType: 'current'
