        azureResourceGroup: 'rg-devops-sharedservices'
        azureSubscription: Development
        # azureSubscription: DevOpsSharedResources
        # azureSubscription: 'Development(76461b8e-edbd-464c-ad30-b13ba994709c)'
        kubernetesCluster: 'aks-devops-shared'

        command: 'repo'
        arguments: >-
          add $(CATALOG_YAML_HELM_REPO_NAME) 
          "https://nexus.telefonica.com.br/repository/$(CATALOG_YAML_HELM_REPO_NAME)" 
          --force-update 
          --insecure-skip-tls-verify 
          --username $(HELM-REGISTRY-NEXUS-USERNAME) 
          --password $(HELM-REGISTRY-NEXUS-PASSWORD)
