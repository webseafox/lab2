
stages:
- stage: logs_audit
  displayName: Audit Logs
  variables:
  - name: System.debug
    value: "true"  

  pool: 
    name: DefaultDevopsAgents
    # demands:
    # - Agent.Name -equals BRTAZLTS0085CO.azagent004
  jobs:
  - job: job_build
    displayName: Build, Unit Test and Pack
    variables:
    - name: ASDF_JDK_8
      value: "adoptopenjdk-8.0.352+8"
    - name: ASDF_JDK_11
      value: "openjdk-11.0.2"
    - name: ASDF_JDK_17
      value: "openjdk-17.0.2"
    - name: ASDF_JDK_SAP17
      value: "sapmachine-17.0.10"

    - name: SONARQUBE_PROJECT_NAME
      value: "$(System.TeamProject)-$(Build.Repository.Name)"

    steps:
    - checkout: self
      fetchDepth: 1

    - task: AzureKeyVault@2
      displayName: Secrets from AKV
      inputs:
        azureSubscription: 'DevOpsSharedResources'
        KeyVaultName: 'kv-azdevops-shared'
        SecretsFilter: 'NEXUS-DEPS-USR, NEXUS-DEPS-PSW, SONARQUBE-TOKEN'
        RunAsPreJob: true

    - task: YamlParseFromVivo@4
      displayName: Get Metadata Info
      name: catalog_info
      inputs:
        type: 'file'
        origin: $(Build.SourcesDirectory)/catalog-info.yaml
        jpaths: |
          var CATALOG_YAML_JAVA_LANGUAGE_VERSION = .metadata.annotations['arqtech.telefonica.com.br/language-version']

    - task: NunjucksInline@4
      displayName: Bind 'ASDF_JAVA_VERSION'
      inputs:
        sourceType: 'text'
        source: |
          var ASDF_JAVA_VERSION = {{ ASDF_JDK_$(CATALOG_YAML_JAVA_LANGUAGE_VERSION) }}

    - task: CatchLogsToLocalDirectoryFromVivo@4
      displayName: Dump logs and metas
      inputs:
        dumpDir: $(Build.ArtifactStagingDirectory)/audit # default is '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Push Logs to Artifacts'
      inputs:
        ArtifactName: audit
        PathtoPublish: $(Build.ArtifactStagingDirectory)/audit
