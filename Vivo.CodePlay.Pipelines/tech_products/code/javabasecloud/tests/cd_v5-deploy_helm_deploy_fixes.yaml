- stage: stage_rollback_deploy
  displayName: "FIX: Rollback deploy on (${{ parameters.environment }})"
  pool: DefaultDevopsAgents
  jobs:
  - job: job_rollback_deploy
    displayName: Recreate ACR Secret on (${{ parameters.environment }})
    steps:
    - checkout: self
      fetchDepth: 1

    - task: YamlParseFromVivo@4
      displayName: Get Metadata Info
      name: catalog_info
      inputs:
        type: 'file'
        origin: catalog-info.yaml
        jpaths: |-
          var CATALOG_YAML_NAME = .metadata.name
          var CATALOG_YAML_ACRONYM = .metadata.annotations['techarch.governance-app.acronym']
