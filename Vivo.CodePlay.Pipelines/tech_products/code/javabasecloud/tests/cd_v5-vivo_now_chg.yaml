parameters:
- name: environment
  displayName: Escolha o ambiente para publicar
  type: string
  default: dev
  values:
  - dev
  - preprod
  - prod

- name: vivonow_chg
  displayName: Numero CHG do VivoNow, somente para 'prod'
  default: CHG0000001


variables:
- name: System.debug
  value: "true"

stages:
- stage: stage_vivonow_gate
  displayName: VivoNow Gate
  # pool: VivoAzureCloudSharedAgents
  pool: 
    name: DefaultDevopsAgents
    # demands:
    # - Agent.Name -equals BRTAZLTS0085CO.azagent004
  jobs:
  - job: job_vivonow_chg
    displayName: Check on (VivoNow)
    continueOnError: False
    condition: eq('${{ parameters.environment }}', 'prod')
    steps:

    - task: AxiosFromVivo@4
      name: vivoNowCHG
      displayName: "Fetch CHG"
      inputs:
        type: 'text'
        origin: |
          var options = {
            method: 'GET',
            url: 'http://10.41.252.111:9010/vivonow/viewer/${{ parameters.vivonow_chg }}'
          };
        variablePrefix: 'VIVO_NOW_CHG_'
      env:
        NODE_EXTRA_CA_CERTS: $(CACORP_LOCATION)

    - task: RegexMatch@4
      displayName: Query CHG
      inputs:
        source: $(VIVO_NOW_CHG_BODY)
        regex: '/(<title>)(.*)(<\/title>)/ig'
        outVarPrefix: 'CHG_FOUND_'

    - script: exit 1
      displayName: Check CHG
      condition: not(variables['CHG_FOUND_HAS_MATCH'])

    - checkout: self
      fetchDepth: 1

