stages:
- stage: Deploy
  displayName: '🚀 Deploy arquivo'
  condition: succeeded('Validate')
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job: Deploy
    displayName: '🚚 Deploy'
    steps:
    - task: CopyFilesOverSSH@0
      displayName: '📤 Transfer client-props.json via SSH'
      inputs:
        sshEndpoint: 'SSH_MOVEL_DEV'
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'client-props.json'
        targetFolder: '/opt/web/applications/ccenter/ura_movel/config'
        readyTimeout: '20000'
    - task: CmdLine@2
      displayName: '🔄 Restart Cache'
      inputs:
        script: 'curl ''http://10.129.176.157:7101/oam-token-manager/restart-cache'''
  dependsOn: 
    - Validate