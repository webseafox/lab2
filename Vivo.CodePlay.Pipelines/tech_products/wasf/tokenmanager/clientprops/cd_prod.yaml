parameters:
  - name: packageVersion
    displayName: 'Versão do pacote para deploy'
    type: string

stages:
- stage: Deploy
  displayName: '🚀 Deploy PROD'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:

  - job: Deploy
    displayName: '🚚 Deploy'
    steps:
    - task: UniversalPackages@0
      displayName: '⬇️ Download client-props package'
      inputs:
        command: 'download'
        downloadDirectory: '$(Pipeline.Workspace)/client-props'
        feedsToUse: 'internal'
        vstsFeed: '3d53bc62-8749-4931-ae46-a443b73bc87a'
        vstsFeedPackage: 'token-manager-client-props'
        vstsPackageVersion: ${{ parameters.packageVersion }}

    - script: ls -R $(Pipeline.Workspace)
      displayName: '📋 Lista Pipeline Workspace'
    - script: ls -R $(Build.ArtifactStagingDirectory)
      displayName: '📋 Lista ArtifactStagingDirectory'
    - task: CopyFilesOverSSH@0
      displayName: '📤 Copia client-props.json para servidor de produção'
      inputs:
        sshEndpoint: '$(SSH_PROD)'
        sourceFolder: '$(Pipeline.Workspace)/client-props'
        contents: 'client-props.json'
        targetFolder: '/opt/web/applications/ccenter/ura_movel/config'
        readyTimeout: '20000'
    - task: CmdLine@2
      displayName: '🔄 Restart Cache'
      inputs:
        script: 'curl ''http://10.129.176.157:7101/oam-token-manager/restart-cache'''