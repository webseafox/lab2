parameters:
  - name: packageVersion
    displayName: 'Versão do pacote para deploy'
    type: string
  - name: environment
    displayName: 'Ambiente de destino'
    default: producao
    values:
      - producao
  - name: deployFerramentasBRN
    displayName: 'Deploy Ferramentas BRN Cluster'
    type: boolean
    default: false
  - name: deployFerramentasCIC
    displayName: 'Deploy Ferramentas CIC Cluster'
    type: boolean
    default: false
  - name: deployFerramentasNDC
    displayName: 'Deploy Ferramentas NDC Cluster'
    type: boolean
    default: false

stages:
- stage: Deploy
  displayName: '🚀 Deploy Produção Ferramentas'
  pool: GeneralPurposeLinuxAgentsCD
  
  jobs:
  - deployment: Deploy
    environment: 'deploy-${{ parameters.environment }}'
    displayName: '🚀 Deploy Ferramentas'
    workspace:
      clean: all
    
    strategy:
      runOnce:
        preDeploy:
          steps:
          - task: Bash@3
            displayName: '🔍 Verifica Variáveis'
            inputs:
              targetType: 'inline'
              script: |
                echo "##[debug] Verificando variáveis de ambiente para deployment..."
                echo "##[debug] packageVersion=${{ parameters.packageVersion }}"
                echo "##[debug] environment=${{ parameters.environment }}"
                echo "##[debug] FEED_PACKAGE=$(FEED_PACKAGE)"
                echo "##[debug] APP=$(APP)"
                echo "##[debug] WLST_SCRIPT=$(WLST_SCRIPT)"
                echo "##[debug] WEBLOGIC_USER=$(WEBLOGIC_USER)"
                echo "##[debug] WEBLOGIC_PASS=*** # Não deve ser exibido!"
                echo "##[debug] SCRIPTS_TARGETFOLDER=$(SCRIPTS_TARGETFOLDER)"
                echo "##[debug] ARTIFACT_TARGETFOLDER=$(ARTIFACT_TARGETFOLDER)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_BRN=$(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_BRN)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC=$(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC)"
                echo "##[debug] WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_NDC=$(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_NDC)"
                echo "##[debug] Pipeline.Workspace=$(Pipeline.Workspace)"
                echo "##[debug] Build.SourcesDirectory=$(Build.SourcesDirectory)"
                echo "##[debug] deployFerramentasBRN=${{ parameters.deployFerramentasBRN }}"
                echo "##[debug] deployFerramentasCIC=${{ parameters.deployFerramentasCIC }}"
                echo "##[debug] deployFerramentasNDC=${{ parameters.deployFerramentasNDC }}"

          - task: SSH@0
            displayName: '🔗 Testa Conexao Ferramentas BRN'
            inputs:
              sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_BRN_PRD'
              runOptions: 'inline'
              inline: >-
                echo "Conectado com sucesso via Service Connection SSH_WLS_WAS_FERRAMENTAS_BRN_PRD"
                echo "Testando conectividade com AdminServer Ferramentas BRN..."
                nc -z 10.128.13.228 7000 && echo "AdminServer Ferramentas BRN está acessível na porta 7000" || echo "ERRO: AdminServer Ferramentas BRN não está acessível!"
                ls -lha $(SCRIPTS_TARGETFOLDER) || echo "Diretório $(SCRIPTS_TARGETFOLDER) não existe ainda"
              readyTimeout: '20000'

          - task: SSH@0
            displayName: '🔗 Testa Conexao Ferramentas CIC'
            inputs:
              sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_CIC_PRD'
              runOptions: 'inline'
              inline: >-
                echo "Conectado com sucesso via Service Connection SSH_WLS_WAS_FERRAMENTAS_CIC_PRD"
                echo "Testando conectividade com AdminServer Ferramentas CIC..."
                nc -z 10.41.24.15 7000 && echo "AdminServer Ferramentas CIC está acessível na porta 7000" || echo "ERRO: AdminServer Ferramentas CIC não está acessível!"
                ls -lha $(SCRIPTS_TARGETFOLDER) || echo "Diretório $(SCRIPTS_TARGETFOLDER) não existe ainda"
              readyTimeout: '20000'

          - task: SSH@0
            displayName: '🔗 Testa Conexao Ferramentas NDC'
            inputs:
              sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_NDC_PRD'
              runOptions: 'inline'
              inline: >-
                echo "Conectado com sucesso via Service Connection SSH_WLS_WAS_FERRAMENTAS_NDC_PRD"
                echo "Testando conectividade com AdminServer Ferramentas NDC..."
                nc -z 10.240.61.117 7000 && echo "AdminServer Ferramentas NDC está acessível na porta 7000" || echo "ERRO: AdminServer Ferramentas NDC não está acessível!"
                ls -lha $(SCRIPTS_TARGETFOLDER) || echo "Diretório $(SCRIPTS_TARGETFOLDER) não existe ainda"
              readyTimeout: '20000'
          
          ## -> Checkout no repositório CodePlay que contém os scripts WLST
          - checkout: CodePlay
            displayName: '🔄 Checkout CodePlay'
            fetchDepth: 1

          ## -> Transfere os scripts WLST para os servidores necessários
          - ${{ if eq(parameters.deployFerramentasBRN, true) }}:
              - task: CopyFilesOverSSH@0
                displayName: '📤 Transfere Scripts Ferramentas BRN'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_BRN_PRD'
                  sourceFolder: $(Build.SourcesDirectory)/tech_products/ccin/pipelines/weblogic-scripts
                  contents: '*'
                  targetFolder: '$(SCRIPTS_TARGETFOLDER)'
                  readyTimeout: '20000'
              
              - task: SSH@0
                displayName: '🔒 Permissao Scripts Ferramentas BRN'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_BRN_PRD'
                  runOptions: 'inline'
                  inline: 'chmod 775 $(SCRIPTS_TARGETFOLDER)/*.py'
                  readyTimeout: '20000'
          
          - ${{ if eq(parameters.deployFerramentasCIC, true) }}:
              - task: CopyFilesOverSSH@0
                displayName: '📤 Transfere Scripts Ferramentas CIC'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_CIC_PRD'
                  sourceFolder: $(Build.SourcesDirectory)/tech_products/ccin/pipelines/weblogic-scripts
                  contents: '*'
                  targetFolder: '$(SCRIPTS_TARGETFOLDER)'
                  readyTimeout: '20000'
              
              - task: SSH@0
                displayName: '🔒 Permissao Scripts Ferramentas CIC'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_CIC_PRD'
                  runOptions: 'inline'
                  inline: 'chmod 775 $(SCRIPTS_TARGETFOLDER)/*.py'
                  readyTimeout: '20000'
          
          - ${{ if eq(parameters.deployFerramentasNDC, true) }}:
              - task: CopyFilesOverSSH@0
                displayName: '📤 Transfere Scripts Ferramentas NDC'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_NDC_PRD'
                  sourceFolder: $(Build.SourcesDirectory)/tech_products/ccin/pipelines/weblogic-scripts
                  contents: '*'
                  targetFolder: '$(SCRIPTS_TARGETFOLDER)'
                  readyTimeout: '20000'
              
              - task: SSH@0
                displayName: '🔒 Permissao Scripts Ferramentas NDC'
                inputs:
                  sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_NDC_PRD'
                  runOptions: 'inline'
                  inline: 'chmod 775 $(SCRIPTS_TARGETFOLDER)/*.py'
                  readyTimeout: '20000'

        deploy:
          steps:
            - checkout: self
              displayName: '🔄 Checkout Self'
              fetchDepth: 0
              persistCredentials: true
              clean: true

            - task: UniversalPackages@0
              displayName: '⬇️ Baixa Pacote Artifacts'
              inputs:
                command: 'download'
                downloadDirectory: '$(Pipeline.Workspace)/middleware'
                feedsToUse: 'internal'
                vstsFeed: '3d53bc62-8749-4931-ae46-a443b73bc87a'
                vstsFeedPackage: '$(FEED_PACKAGE)'
                vstsPackageVersion: '${{ parameters.packageVersion }}'

            - script: ls -R $(Pipeline.Workspace)
              displayName: '📋 Lista Pipeline Workspace'
            - script: ls -R $(Build.ArtifactStagingDirectory)
              displayName: '📋 Lista Build ArtifactStagingDirectory'

            # Ferramentas BRN
            - ${{ if eq(parameters.deployFerramentasBRN, true) }}:
                - task: CopyFilesOverSSH@0
                  name: CopyFilesFerramentasBRN
                  displayName: '📤 Transfere WAR Ferramentas BRN'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_BRN_PRD'
                    sourceFolder: '$(Pipeline.Workspace)/middleware'
                    contents: '$(APP).war'
                    targetFolder: '$(ARTIFACT_TARGETFOLDER)'
                    readyTimeout: '20000'
                
                - task: SSH@0
                  displayName: '🗑️ UndeployApp Ferramentas BRN'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_BRN_PRD'
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/UndeployApp.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_BRN)
                      $(APP)
                    readyTimeout: '20000'
                
                - task: SSH@0
                  name: DeployWarFerramentasBRN
                  displayName: '🚀 CleanDeploy WLST Ferramentas BRN'
                  continueOnError: true
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_BRN_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/CleanDeployApp.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_BRN)
                      $(APP)
                      $(ARTIFACT_TARGETFOLDER)/$(APP).war
                      WLS_WAS_FERRAMENTAS_BRN_PRD_CLUSTER
                      ${{ parameters.packageVersion }}
                    readyTimeout: '20000'

                - task: SSH@0
                  name: ValidateDeploymentFerramentasBRN
                  displayName: '✅ Valida Deploy Ferramentas BRN'
                  continueOnError: false
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_BRN_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/ValidateDeployment.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_BRN)
                      $(APP)
                    readyTimeout: '20000'
                # - task: SSH@0
                #   name: LimpezaDeCacheJVMMovelBRN
                #   displayName: Limpeza cache JVM Movel BRN
                #   inputs:
                #     sshEndpoint: SSH_WLS_WAS_URA_MOVEL_BRN_PRD
                #     runOptions: 'commands'
                #     commands: '/opt/web/scripts/jvm_cache_clean.sh'
                #     readyTimeout: '20000'

            # Ferramentas CIC
            - ${{ if eq(parameters.deployFerramentasCIC, true) }}:
                - task: CopyFilesOverSSH@0
                  name: CopyFilesFerramentasCIC
                  displayName: '📤 Transfere WAR Ferramentas CIC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_CIC_PRD'
                    sourceFolder: '$(Pipeline.Workspace)/middleware'
                    contents: '$(APP).war'
                    targetFolder: '$(ARTIFACT_TARGETFOLDER)'
                    readyTimeout: '20000'
                
                - task: SSH@0
                  displayName: '🗑️ Undeploy Artefato Preparado Ferramentas CIC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_CIC_PRD'
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/UndeployAppRetired.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC)
                      $(APP)
                    readyTimeout: '20000'
                
                - task: SSH@0
                  name: DeployWarFerramentasCIC
                  displayName: '🚀 Deploy WLST Ferramentas CIC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_CIC_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/HotDeployApp.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC)
                      $(APP)
                      $(ARTIFACT_TARGETFOLDER)/$(APP).war
                      WLS_WAS_FERRAMENTAS_CIC_PRD_CLUSTER
                      ${{ parameters.packageVersion }}
                    readyTimeout: '20000'

                - task: SSH@0
                  name: UndeployAfterDeployFerramentasCIC
                  displayName: '🗑️ Undeploy após Deploy Ferramentas CIC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_CIC_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/UndeployAppRetired.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC)
                      $(APP)
                    readyTimeout: '20000'
                
                - task: SSH@0
                  name: ValidateDeploymentFerramentasCIC
                  displayName: '✅ Valida Deploy Ferramentas CIC'
                  continueOnError: false
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_CIC_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/ValidateDeployment.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_CIC)
                      $(APP)
                    readyTimeout: '20000'

            # Ferramentas NDC
            - ${{ if eq(parameters.deployFerramentasNDC, true) }}:
                - task: CopyFilesOverSSH@0
                  name: CopyFilesFerramentasNDC
                  displayName: '📤 Transfere WAR Ferramentas NDC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_NDC_PRD'
                    sourceFolder: '$(Pipeline.Workspace)/middleware'
                    contents: '$(APP).war'
                    targetFolder: '$(ARTIFACT_TARGETFOLDER)'
                    readyTimeout: '20000'
                
                - task: SSH@0
                  displayName: '🗑️ UndeployApp Ferramentas NDC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: 'SSH_WLS_WAS_FERRAMENTAS_NDC_PRD'
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/UndeployApp.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_NDC)
                      $(APP)
                    readyTimeout: '20000'
                
                - task: SSH@0
                  name: DeployWarFerramentasNDC
                  displayName: '🚀 CleanDeploy WLST Ferramentas NDC'
                  continueOnError: true
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_NDC_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/CleanDeployApp.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_NDC)
                      $(APP)
                      $(ARTIFACT_TARGETFOLDER)/$(APP).war
                      WLS_WAS_FERRAMENTAS_NDC_PRD_CLUSTER
                      ${{ parameters.packageVersion }}
                    readyTimeout: '20000'
                
                - task: SSH@0
                  name: ValidateDeploymentFerramentasNDC
                  displayName: '✅ Valida Deploy Ferramentas NDC'
                  continueOnError: false
                  inputs:
                    sshEndpoint: SSH_WLS_WAS_FERRAMENTAS_NDC_PRD
                    runOptions: 'commands'
                    commands: >
                      sudo -u weblogic $(WLST_SCRIPT)
                      $(SCRIPTS_TARGETFOLDER)/ValidateDeployment.py
                      $(WEBLOGIC_USER)
                      $(WEBLOGIC_PASS)
                      $(WEBLOGIC_ADMIN_SERVER_URL_FERRAMENTAS_NDC)
                      $(APP)
                    readyTimeout: '20000'

            - task: PowerShell@2
              displayName: '🏷️ Atualizando STATUS no VERSION.md'
              inputs:
                targetType: 'inline'
                script: |
                    $version = "${{ parameters.packageVersion }}"
                    $deployDate = Get-Date -Format "dd/MM/yyyy"
                    if (Test-Path "VERSION.md") {
                      $content = Get-Content "VERSION.md" -Raw
                      $lines = $content -split "`r?`n"
                      $versionUpdated = $false
                      for ($i = 0; $i -lt $lines.Length; $i++) {
                        # Procura pela linha da versão (com espaços variáveis) e "Not deployed"
                        if ($lines[$i] -match "^\|\s*$version\s*\|.*\|\s*Not deployed\s*\|") {
                          # Substitui "Not deployed" pela data atual, mantendo o resto da linha
                          $lines[$i] = $lines[$i] -replace "Not deployed", $deployDate
                          Write-Host "Versão $version marcada como deployada em $deployDate"
                          $versionUpdated = $true
                          break
                        }
                      }
                      if (-not $versionUpdated) {
                        Write-Warning "Versão $version não encontrada ou já deployada"
                      }
                      $newContent = $lines -join "`n"
                      $lastUpdated = Get-Date -Format "yyyy.MM.dd"
                      $newContent = $newContent -replace '\*Last updated: [^*]+\*', "*Last updated: $lastUpdated*"
                      Set-Content "VERSION.md" -Value $newContent -Encoding UTF8
                      Write-Host "VERSION.md atualizado - versão $version deployada"
                    } else {
                      Write-Error "VERSION.md não encontrado!"
                      exit 1
                    }
                workingDirectory: '$(Build.SourcesDirectory)'
            
            - task: CmdLine@2
              displayName: '📝 Commitando status de deploy no VERSION.md'
              inputs:
                script: |
                  git config user.email "azure-pipelines@telefonicati.onmicrosoft.com"
                  git config user.name "Azure Pipelines"
                  git checkout master || git checkout -b master
                  git add VERSION.md
                  git commit -m "chore: marca versão ${{ parameters.packageVersion }} como deployada"
                  git push origin master
                workingDirectory: '$(Build.SourcesDirectory)'
            
            - task: CmdLine@2
              displayName: '🔃 Sincronizando VERSION.md em todas as branchs remotas'
              inputs:
                script: |
                  BRANCH_NAME=$(echo $(Build.SourceBranch) | sed 's#refs/heads/##')
                  # Garante que a branch principal existe localmente antes de copiar o VERSION.md
                  if ! git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
                    git fetch origin $BRANCH_NAME
                    git checkout $BRANCH_NAME
                  fi
                  for BRANCH in $(git branch -r | grep -v "$BRANCH_NAME" | grep -v '\->' | sed 's#origin/##'); do
                    echo "Sincronizando VERSION.md para $BRANCH"
                    git fetch origin $BRANCH || continue
                    git checkout $BRANCH
                    git pull origin $BRANCH
                    git checkout $BRANCH_NAME -- VERSION.md
                    git add VERSION.md
                    git commit -m "chore: sincroniza VERSION.md da branch $BRANCH_NAME - versão ${{ parameters.packageVersion }} deployada" || echo "Nada a commitar em $BRANCH, forçando push."
                    git status
                    git push --force origin $BRANCH
                  done
                workingDirectory: '$(Build.SourcesDirectory)'

        on:
          success:
            steps:
            - task: Bash@3
              displayName: '✅ Deploy on WebLogic Success'
              name: t_success_message
              inputs:
                targetType: inline
                script: |
                  echo "##[section]================================================================================================================================="
                  echo "##[section]                                                 SUCCESS WEBLOGIC DEPLOY"
                  echo "##[section]================================================================================================================================="
                  echo "##[section]Parabéns o artefato '$(APP)' versão '${{ parameters.packageVersion }}' foi publicado com sucesso no Weblogic"
                  echo "##[section]"
                  echo "##[section]================================================================================================================================="

          failure:
            steps:
            - task: Bash@3
              displayName: '❌ Deploy on WebLogic Failure'
              name: t_failure_message
              inputs:
                targetType: inline
                script: |
                  echo "##[error] ================================================================================================================================="
                  echo "##[error]                                                  FAILURE WEBLOGIC DEPLOY"
                  echo "##[error] ================================================================================================================================="
                  echo "##[error] Deploy do artefato '$(APP)' falhou para o(s) ambiente(s) selecionado(s)."
                  echo "##[error] "
                  echo "##[error] ================================================================================================================================="