# Pipeline baseado no exemplo da Ping
# https://github.com/pingidentity/pipeline-example-infrastructure/blob/prod/.github/workflows/deploy.yaml
# https://videos.pingidentity.com/detail/video/6318020361112/reference-cicd-pipeline-demonstration

parameters:
  - name: environment
    type: string
    values:
      - dev
      - esteira01
      - esteira02
      - preprod
      - prodlike
      - prod

variables:
  group: server-profiles

stages:
- stage:
  displayName: 'Deploy'
  pool: GeneralPurposeLinuxAgentsCD
  jobs:
  - job: deploy
    displayName: Deploy ${{parameters.environment}}
    steps:
    # Install oc so that it can be used within a 'script' or bash 'task'
    - task: oc-setup@3
      displayName: Install openshift client
      inputs:
        openshiftService: vivoshift-${{parameters.environment}}
        version: 4.8.11

    - task: HelmInstaller@1
      displayName: Install helm
      inputs:
        helmVersionToInstall: 'latest'
    - task: Bash@3
      displayName: Install Dependencies
      inputs:
        targetType: inline
        script: |
          . scripts/functions.sh
          . scripts/vars.sh
          kubectl version
          helm repo add "${HELM_CHART_NAME%%/*}" https://helm.pingidentity.com/
          helm plugin list | grep -q "diff" || helm plugin install https://github.com/databus23/helm-diff
          
          #sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys CC86BB64

      
    - task: Bash@3
      displayName: Deploy
      inputs: 
        targetType: inline
        script: |
          # Deploy
          env
          sh scripts/deploy.sh
      env:
        PING_IDENTITY_DEVOPS_USER_BASE64: dGVzdGUNCg==
        PING_IDENTITY_DEVOPS_KEY_BASE64: dGVzdGUNCg==
        ENV: ${{parameters.environment}}
        K8S_NAMESPACE: wiam-${{parameters.environment}}
        SERVER_PROFILE_BRANCH: $(Build.SourceBranch)
