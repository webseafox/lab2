parameters:
- name: skipSecurityGate
  default: false
- name: convisoCompany
  default: 430
- name: appVersion
  default: "DevSecOps"
- name: vivoFlow
  type: string
  default: "none"
- name: imageSource
  default: "$(DOCKER_REGISTRY)/$(docker_metadata.DOCKER_IMAGE_NAME):$(docker_metadata.DOCKER_IMAGE_TAG)"

steps:
  - ${{ if or(eq(parameters.vivoFlow, 'none'),and(ne(parameters.vivoFlow, 'none'),or(eq(variables['Build.SourceBranchName'], 'master'),eq(variables['Build.SourceBranchName'], 'main'),startsWith(variables['Build.SourceBranchName'], 'release/'),contains(parameters.vivoFlow, variables['Build.SourceBranchName']),and(eq(variables['Build.Reason'], 'PullRequest'),contains(parameters.vivoFlow, replace(variables['System.PullRequest.TargetBranch'], 'refs/heads/', '')))))) }}:
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download AppSec Endpoints Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'AppSecEndpoints'
        targetPath: '$(Pipeline.Workspace)/AppSecEndpoints'

    - task: Bash@3
      displayName: 'Set SCA Docker Variables'
      inputs:
        targetType: inline
        script: |
          ENDPOINTS_FILE="$(Pipeline.Workspace)/AppSecEndpoints/appsec_endpoints.json"
          
          if [ ! -f "$ENDPOINTS_FILE" ]; then
            echo "##vso[task.logissue type=error]AppSec Endpoints artifact not found!"
            echo "##[error]The required artifact 'AppSecEndpoints' containing the configuration JSON could not be found."
            exit 1
          fi

          echo "##[debug] Parsing endpoints from artifact..."
          USE_DT_SCA_ENDPOINT=$(jq -r '.DT_SCA_ENDPOINT // empty' "$ENDPOINTS_FILE")
          
          if [ -z "$USE_DT_SCA_ENDPOINT" ]; then
            echo "##vso[task.logissue type=error]Missing required DT_SCA_ENDPOINT variable in AppSec Endpoints artifact!"
            exit 1
          fi

          echo "=================================================================="
          echo "AppSec Endpoints Loaded:"
          echo "DT_SCA_ENDPOINT.........................: $USE_DT_SCA_ENDPOINT"
          echo "=================================================================="

          echo "##vso[task.setvariable variable=DT_SCA_ENDPOINT]$USE_DT_SCA_ENDPOINT"
          echo "##vso[task.setvariable variable=DT_APP_DEFAULT_NAME]$(System.TeamProject)-$(Build.Repository.Name)"
          echo "##vso[task.setvariable variable=DT_APP_DEFAULT_VERSION]DevSecOps"
          
          echo "Security variables for this job have been set."

    ## -> Download Security Tokens
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Security Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: $(AKV_DEVOPS_NAME)
        SecretsFilter: 'CONVISO-API-KEY, DEPENDENCY-TRACK-TOKEN'
      condition: and(eq(variables['DEPENDENCY-TRACK-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''))

    ## -> Syft Install
    - task: SyftInstall@1
      displayName: Install Syft
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        mode: custom
        useCache: true
        version: 1.19.0

    ## -> Get Service Connection
    - task: LoadEndpointDockerRegistryFromVivo@4
      name: docker_endpoint
      displayName: 'Loading Docker Registry'  
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        endpoint: $(DOCKER_SERVICE_CONNECTION)
        authParamsFilter: 'REGISTRY'

    ## -> Remove HTTPS:// from Docker Registry
    - task: NunjucksInline@4
      condition: eq(variables.USE_DT_DOCKER, 'true')
      displayName: 'Generating Image Source for SCA Scan' 
      inputs:
        sourceType: 'text'
        source: |
          var DOCKER_REGISTRY = {{"$(docker_endpoint.AUTH_REGISTRY)" | replace(r/https?:\/\//, '')}}

    ## -> Generates SBOM from Docker image    
    - task: GenerateSbomSyft@1
      displayName: 'Generating SBOM with Syft'
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        useDockerImage: true
        reportPath: "cyclonedx_report.json"
        imageSource: ${{ parameters.imageSource }}
      
    ## -> Validates whether the image scan occurred normally and the SBOM was generated
    - task: Bash@3
      displayName: 'Validating SCAN'
      condition: eq(variables.USE_DT_DOCKER, 'true')
      env:
        DT_APP_DEFAULT_NAME: "$(System.TeamProject)-$(Build.Repository.Name)"
      inputs:
        workingDirectory: '$(Build.SourcesDirectory)'
        targetType: inline
        script: |

          echo "##[debug] Project name: $(DT_APP_DEFAULT_NAME)"
          echo "##[debug] Project version: ${{ parameters.appVersion }}"          
          echo "##[debug] Report Path: cyclonedx_report.json"
          if [ -e "cyclonedx_report.json" ]; then
            echo "##[debug] Scan completed."
            echo "##[debug] REPORT_PATH content (base64): $(base64 -w 0 cyclonedx_report.json)"
          else
            echo "##[debug] Scan fail."
            exit 1
          fi

    - bash: |
        echo "##[debug] Uploading BOM to DT..."

        BOMCONTENT=$(cat cyclonedx_report.json | base64 -w 0)
        ODTFILE="bom_payload.json"

        echo "Nome do projeto: ${DT_APP_DEFAULT_NAME}"
        echo "Versão: ${{ parameters.appVersion }}"

        PAYLOAD='{ "projectName": "'${DT_APP_DEFAULT_NAME}'", "projectVersion": "'${{ parameters.appVersion }}'", "autoCreate": true, "bom": "'${BOMCONTENT}'" }'

        echo -n $PAYLOAD > $ODTFILE
        
        RESPONSE=$(curl -s \
                    -X PUT "${DT_SCA_ENDPOINT}/v1/bom" \
                    -H "X-API-Key: ${DT_TOKEN}" \
                    -H 'Content-Type: application/json' \
                    -d "@${ODTFILE}")
        
        echo "##[debug]Uploaded! Response: ${RESPONSE}"

        sbomToken=$(jq -r '.token' <<< "$RESPONSE")
        echo "##vso[task.setvariable variable=SBOM_TOKEN]$sbomToken"

        i="0"
        retries="25"
        echo "Aguardando Sincronização finalizar"
        while [[ $i -lt $retries ]]
        do

        RESPONSE=$(curl -s \
                    -X GET "${DT_SCA_ENDPOINT}/v1/event/token/${sbomToken}" \
                    -H "X-API-Key: $(DEPENDENCY-TRACK-TOKEN)" \
                    -H 'Content-Type: application/json')

        echo "##[debug]Status de processamento: ${RESPONSE}"

        if [[ "$(jq -r '.processing' <<< "$RESPONSE")" == "false" ]]
        then
            echo "Sincronização finalizada com sucesso"

            DT_APP_DEFAULT_NAME=$(echo -n "$DT_APP_DEFAULT_NAME" | jq -sRr @uri)

            echo "Nome do projeto: ${DT_APP_DEFAULT_NAME}"

            RESPONSE=$(curl -s \
                        -X GET "${DT_SCA_ENDPOINT}/v1/project/lookup?name=${DT_APP_DEFAULT_NAME}&version=${{ parameters.appVersion }}" \
                        -H "X-API-Key: ${DT_TOKEN}" \
                        -H 'Content-Type: application/json')

            echo "##[debug]Valor do Lookup: ${RESPONSE}"

            DT_PROJECT_ID=$(jq -r '.uuid' <<< "$RESPONSE")

            gateValidation=$(jq -r '.metrics.policyViolationsSecurityUnaudited' <<< "$RESPONSE")

            echo "##[debug]Valor do UUID: ${DT_PROJECT_ID}"

            echo "##[debug]Violações não auditadas: ${gateValidation}"

            echo "##vso[task.setvariable variable=GATE_VALIDATION]$gateValidation"

            echo "##vso[task.setvariable variable=PROJECT_ID]$DT_PROJECT_ID"

            exit 0
        fi
        i=$[$i+1]
        sleep 15s
        done

        echo "##vso[task.logissue type=error;]Tempo esgotado - A Sincronização não foi finalizada, tente rodar novamente."
        echo "##vso[task.complete result=Failed;]"        
      displayName: Uploading SBOM to DT
      condition: eq(variables.USE_DT_DOCKER, 'true')
      env:
        DT_SCA_ENDPOINT: $(DT_SCA_ENDPOINT)
        CACORP_LOCATION: $(CACORP_LOCATION)
        DT_TOKEN: $(DEPENDENCY-TRACK-TOKEN)
        DT_APP_DEFAULT_NAME: $(DT_APP_DEFAULT_NAME)
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"

    ## -> Apply project tag based on extracted sigla
    - bash: |
        # Extrair sigla e fazer tagging do projeto
        PROJECT_NAME_CLEAN=$(echo "${DT_APP_DEFAULT_NAME}" | sed 's/%20/ /g')
        
        # Extrair a sigla
        if [[ "$PROJECT_NAME_CLEAN" == *" - "* ]]; then
          PROJECT_SIGLA=$(echo "${PROJECT_NAME_CLEAN}" | cut -d'-' -f1 | xargs | tr '[:upper:]' '[:lower:]')
        else
          PROJECT_SIGLA=$(echo "${PROJECT_NAME_CLEAN}" | sed -E 's/[-.].*//' | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')
        fi
        
        # Fazer tagging se a sigla não estiver vazia
        if [ ! -z "$PROJECT_SIGLA" ]; then
          TAG_PAYLOAD='["$(PROJECT_ID)"]'
          
          TAG_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                -X POST "${DT_SCA_ENDPOINT}/v1/tag/${PROJECT_SIGLA}/project" \
                -H "X-API-Key: ${DT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${TAG_PAYLOAD}")
          
          HTTP_STATUS=$(echo "$TAG_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          if [[ "$HTTP_STATUS" =~ ^(200|204)$ ]]; then
            echo "##[section]Projeto taggeado com sucesso: ${PROJECT_SIGLA}"
          else
            echo "##[warning]Falha ao aplicar tag '${PROJECT_SIGLA}'. HTTP Status: ${HTTP_STATUS}"
          fi
        fi       
      displayName: Tagging Asset in Dependency-Track
      condition: eq(variables.USE_DT_DOCKER, 'true')
      continueOnError: true
      env:
        DT_SCA_ENDPOINT: $(DT_SCA_ENDPOINT)
        CACORP_LOCATION: $(CACORP_LOCATION)
        DT_TOKEN: $(DEPENDENCY-TRACK-TOKEN)
        DT_APP_DEFAULT_NAME: $(DT_APP_DEFAULT_NAME)
        PROXY_AGENT_HTTPS: "$(PROXY_AGENT_HTTPS)"

    ## -> Retriving SBOM Token and Moving SBOM to Artifacts Directory
    - task: Bash@3
      displayName: 'Moving SBOM'
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        targetType: inline
        script: |
          echo "##[debug] SBOM token: $(SBOM_TOKEN)"
          mv cyclonedx_report.json $(Build.ArtifactStagingDirectory)/  

    - task: PublishBuildArtifacts@1
      displayName: "Publishing SBOM"
      condition: eq(variables.USE_DT_DOCKER, 'true')
      inputs:
        pathToPublish: "$(Build.ArtifactStagingDirectory)/cyclonedx_report.json"
        artifactName: "sbom-docker"

    - task: convisoAzureSyncTask@1
      displayName: "Conviso Sync"
      condition: and( ne(variables.USE_CONVISO, 'false'), eq(variables.USE_DT_DOCKER, 'true'))
      continueOnError: true
      inputs:
        API_KEY: "$(CONVISO-API-KEY)"
        PROJECT_ID: "$(PROJECT_ID)"
        INTEGRATION: "DEPENDENCY_TRACK"
        COMPANY_ID: ${{ parameters.convisoCompany }}

    - task: Bash@3
      displayName: "Evaluate Security Gate"
      condition: and( ne(variables.SKIP_SECURITY_GATE_SCA, 'true'), eq(variables.USE_DT_DOCKER, 'true'))
      env:
        CONVISO_COMPANY_ID: ${{ parameters.convisoCompany }}
        APP_VERSION: ${{ parameters.appVersion }}
      inputs:
        targetType: 'inline'
        script: |
          echo "##[debug] Dependency-Track Project ID: $(PROJECT_ID)"

          set -e

          isGateBranch=false
          build_reason="$(Build.Reason)"
          
          if [[ "$build_reason" == "PullRequest" ]]; then
            eval_ref="$(System.PullRequest.TargetBranch)"
            eval_name="${eval_ref#refs/heads/}"
          else
            eval_ref="$(Build.SourceBranch)"
            eval_name="$(Build.SourceBranchName)"
          fi
          
          if [[ "$eval_name" == "master" || "$eval_name" == "main" || "$eval_ref" == refs/heads/release* || "$eval_ref" == refs/heads/stage* ]]; then
            isGateBranch=true
          fi

          curl -sf \
            -X GET "${DT_SCA_ENDPOINT}/v1/violation/project/$(PROJECT_ID)?suppressed=true&pageNumber=1&pageSize=1000" \
            -H "X-API-Key: $(DEPENDENCY-TRACK-TOKEN)" \
            -H 'Content-Type: application/json' > dt_violations.json || {
              echo "##vso[task.logissue type=error;] The Dependency-Track API is not responding due to a unexpected error. Please, try again by clicking on Rerun Failed Jobs or contact appsec_vivo.br@telefonica.com. Thanks"
              echo "##vso[task.complete result=Failed;]"
              exit 1
            }     
          
          curl -sf \
            -X GET "${DT_SCA_ENDPOINT}/v1/finding/project/$(PROJECT_ID)?suppressed=false" \
            -H "X-API-Key: $(DEPENDENCY-TRACK-TOKEN)" \
            -H 'Content-Type: application/json' > dt_findings.json || echo "[]" > dt_findings.json

          if [ ! -s dt_violations.json ] || [ "$(cat dt_violations.json)" == "null" ]; then echo "[]" > dt_violations.json; fi
          if [ ! -s dt_findings.json ] || [ "$(cat dt_findings.json)" == "null" ]; then echo "[]" > dt_findings.json; fi

          COUNT=$(jq '[ .[] | select((.analysis.analysisState=="NOT_SET") or (.analysis == null) or (.analysis.analysisState == null)) ] | length' dt_violations.json)

          jq -n --slurpfile findings dt_findings.json --slurpfile violations dt_violations.json '[
            ($violations[0] | map(
              select(.analysis.analysisState == "APPROVED" or .analysis.analysisState == "REJECTED") |
              if .vulnerability and .vulnerability.vulnId then
                "\(.component.uuid)|\(.vulnerability.vulnId)"
              else
                "\(.component.uuid)|ALL"
              end
            )) as $audited_keys |
            $findings[0][]? |
            select(
              (.vulnerability.severity == "CRITICAL" or .vulnerability.severity == "HIGH") and
              (.analysis.isSuppressed != true) and
              (.analysis.state != "FALSE_POSITIVE" and .analysis.state != "NOT_AFFECTED" and .analysis.state != "RESOLVED") and
              (
                "\(.component.uuid)|\(.vulnerability.vulnId)" as $key1 |
                "\(.component.uuid)|ALL" as $key2 |
                ($audited_keys | index($key1) == null) and
                ($audited_keys | index($key2) == null)
              )
            )
          ]' > dt_blocking.json

          # Para cada pacote vulnerável, procura no Dependency-Track a primeira versão
          # em que a CVE já está corrigida e mostra ela junto das outras informações.

          minusculo() {
            tr '[:upper:]' '[:lower:]'
          }

          # Verdadeiro quando $1 vem antes de $2 (sort -V compara versão, não texto).
          versao_menor() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ]
          }

          purl_sem_versao() {
            echo "$1" | sed 's/[?#].*//; s/@[^@]*$//' | minusculo
          }

          tipo_do_purl() {
            echo "$1" | sed 's|^pkg:||; s|[/@?].*||' | minusculo
          }

          # O nome do pacote está no 5º campo do CPE (cpe:2.3:a:fornecedor:PACOTE:...)
          # ou no último trecho do PURL (pkg:maven/grupo/PACOTE@versao).
          nome_do_pacote() {
            local nome="$2"

            case "$1" in
              PURL) nome=$(purl_sem_versao "$nome"); nome="${nome##*/}" ;;
              *)    nome=$(echo "$nome" | cut -d: -f5) ;;
            esac

            echo "$nome" | minusculo
          }

          ecossistema() {
            local valor
            valor=$(echo "$1" | minusculo)

            case "$valor" in
              node.js|nodejs|node|npm)         echo npm ;;
              python|pypi|pip)                 echo pypi ;;
              java|maven)                      echo maven ;;
              go|golang)                       echo golang ;;
              .net|dotnet|nuget)               echo nuget ;;
              php|composer)                    echo composer ;;
              ruby|rubygems|gem)               echo gem ;;
              rust|cargo)                      echo cargo ;;
              wordpress|drupal|joomla|magento) echo "$valor" ;;
              *)                               echo "" ;;
            esac
          }

          plataforma_da_correcao() {
            case "$1" in
              PURL) ecossistema "$(tipo_do_purl "$2")" ;;
              *)    ecossistema "$(echo "$2" | cut -d: -f11)" ;;
            esac
          }

          plataforma_compativel() {
            [ -z "$1" ] || [ -z "$2" ] || [ "$1" = "$2" ]
          }

          mesmo_pacote() {
            if [ "$1" = "PURL" ] && [ -n "$4" ]; then
              [ "$(purl_sem_versao "$2")" = "$(purl_sem_versao "$4")" ]
              return
            fi

            [ "$(nome_do_pacote "$1" "$2")" = "$(echo "$3" | minusculo)" ]
          }

          dentro_da_faixa() {
            if [ -n "$2" ] && versao_menor "$1" "$2"; then
              return 1
            fi

            if [ -n "$3" ] && ! versao_menor "$3" "$1"; then
              return 1
            fi

            return 0
          }

          detalhe_da_vulnerabilidade() {
            curl -sf --max-time 10 \
              -X GET "${DT_SCA_ENDPOINT}/v1/vulnerability/source/$1/vuln/$2" \
              -H "X-API-Key: $(DEPENDENCY-TRACK-TOKEN)" \
              -H 'Content-Type: application/json'
          }

          correcoes_publicadas() {
            echo "$1" | jq -r '.affectedComponents[]?
              | select((.versionEndExcluding // "") != "")
              | [.identityType, .identity, .versionEndExcluding,
                 (.versionStartIncluding // ""), (.versionStartExcluding // "")]
              | @tsv'
          }

          faixas_da_cve() {
            local detalhe="$1" nome="$2" versao="$3" purl="$4"
            local correcoes tipo identidade fix inicio_incl inicio_excl plataforma
            local meu_ecossistema por_nome="" por_plataforma="" produtos="" divergente=""

            meu_ecossistema=$(ecossistema "$(tipo_do_purl "$purl")")
            correcoes=$(correcoes_publicadas "$detalhe") || return 0

            while IFS=$'\t' read -r tipo identidade fix inicio_incl inicio_excl; do
              [ -n "$fix" ] || continue
              versao_menor "$versao" "$fix" || continue
              dentro_da_faixa "$versao" "$inicio_incl" "$inicio_excl" || continue

              plataforma=$(plataforma_da_correcao "$tipo" "$identidade")
              plataforma_compativel "$meu_ecossistema" "$plataforma" || {
                mesmo_pacote "$tipo" "$identidade" "$nome" "$purl" && divergente="sim"
                continue
              }

              if mesmo_pacote "$tipo" "$identidade" "$nome" "$purl"; then
                por_nome="${por_nome}${fix}|${inicio_incl}|${inicio_excl}"$'\n'
              elif [ -n "$meu_ecossistema" ] && [ "$plataforma" = "$meu_ecossistema" ]; then
                produtos="${produtos}$(nome_do_pacote "$tipo" "$identidade")"$'\n'
                por_plataforma="${por_plataforma}${fix}|${inicio_incl}|${inicio_excl}"$'\n'
              fi
            done <<< "$correcoes"

            if [ -n "$por_nome" ]; then
              echo "$por_nome" | sort -u
              return 0
            fi

            if [ "$(echo "$produtos" | grep -v '^$' | sort -u | wc -l)" -eq 1 ]; then
              echo "$por_plataforma" | sort -u
            elif [ -n "$divergente" ]; then
              echo "DIVERGENTE"
            fi
          }

          versao_limpa() {
            local faixas="$1" candidata fix inicio_incl inicio_excl

            while IFS= read -r candidata; do
              [ -n "$candidata" ] || continue

              while IFS='|' read -r fix inicio_incl inicio_excl; do
                versao_menor "$candidata" "$fix" || continue
                dentro_da_faixa "$candidata" "$inicio_incl" "$inicio_excl" || continue
                continue 2
              done <<< "$faixas"

              echo "$candidata"
              return 0
            done <<< "$(echo "$faixas" | cut -d'|' -f1 | sort -V -u)"
          }

          SAFE_VERSIONS=""
          SAFE_PACKAGES=""
          FAIXAS=""
          VULN_LIST=$(jq -r '.[] | [(.vulnerability.source // "NVD"), (.vulnerability.vulnId // ""), (.component.name // ""), (.component.version // ""), (.component.purl // "")] | @tsv' dt_blocking.json | sort -u | head -n 50)

          while IFS=$'\t' read -r VULN_SOURCE VULN_ID PKG_NAME PKG_VERSION PKG_PURL; do
            [ -n "$VULN_ID" ] && [ -n "$PKG_VERSION" ] || continue

            VULN_DETAIL=$(detalhe_da_vulnerabilidade "$VULN_SOURCE" "$VULN_ID") || {
              echo "##[debug] Sem dados de correção no Dependency-Track para ${VULN_ID}"
              continue
            }

            FAIXAS_DA_CVE=$(faixas_da_cve "$VULN_DETAIL" "$PKG_NAME" "$PKG_VERSION" "$PKG_PURL")
            SAFE_VERSION=$(echo "$FAIXAS_DA_CVE" | cut -d'|' -f1 | grep -v '^$' | sort -V | head -n 1)
            [ -n "$SAFE_VERSION" ] || continue

            SAFE_VERSIONS="${SAFE_VERSIONS}${VULN_ID}|${PKG_NAME}|${PKG_VERSION}|${SAFE_VERSION}"$'\n'
            [ "$SAFE_VERSION" != "DIVERGENTE" ] || continue

            while IFS= read -r FAIXA; do
              FAIXAS="${FAIXAS}${PKG_NAME}|${PKG_VERSION}|${FAIXA}"$'\n'
            done <<< "$FAIXAS_DA_CVE"
          done <<< "$VULN_LIST"

          while IFS='|' read -r PACOTE INSTALADA; do
            [ -n "$PACOTE" ] || continue

            PKG_FAIXAS=""
            while IFS='|' read -r NOME VERSAO FIX INI_INCL INI_EXCL; do
              [ "$NOME" = "$PACOTE" ] && [ "$VERSAO" = "$INSTALADA" ] || continue
              PKG_FAIXAS="${PKG_FAIXAS}${FIX}|${INI_INCL}|${INI_EXCL}"$'\n'
            done <<< "$FAIXAS"

            LIMPA=$(versao_limpa "$PKG_FAIXAS")
            [ -n "$LIMPA" ] || continue

            SAFE_PACKAGES="${SAFE_PACKAGES}${PACOTE}|${INSTALADA}|${LIMPA}"$'\n'
          done <<< "$(echo "$FAIXAS" | cut -d'|' -f1,2 | sort -u)"

          if ENRICHED=$(jq --arg safe "$SAFE_VERSIONS" --arg pacotes "$SAFE_PACKAGES" '
            ($safe | split("\n") | map(select(. != "") | split("|"))) as $linhas
            | ($linhas | map({ key: "\(.[0])|\(.[1])|\(.[2])", value: .[3] }) | from_entries) as $correcoes
            | ($linhas | map(select(.[3] == "DIVERGENTE")) | map({ key: "\(.[1])|\(.[2])", value: true }) | from_entries) as $divergentes
            | ($linhas | map(select(.[3] != "DIVERGENTE")) | group_by("\(.[1])|\(.[2])") | map(select(length > 1) | { key: "\(.[0][1])|\(.[0][2])", value: "│  CVEs cobertas: \([.[] | .[0]] | unique | join(", "))\n" }) | from_entries) as $cves
            | ($pacotes | split("\n") | map(select(. != "") | split("|")) | map({ key: "\(.[0])|\(.[1])", value: .[2] }) | from_entries) as $limpas
            | map(("\(.component.name // "")|\(.component.version // "")") as $chave
                  | ($correcoes["\(.vulnerability.vulnId // "")|\($chave)"] // "") as $min
                  | ($limpas[$chave] // "") as $limpa
                  | (if $limpa != "" then $limpa elif $min != "" then $min elif $divergentes[$chave] then "DIVERGENTE" else "" end) as $seg
                  | (if $limpa != "" then ($cves[$chave] // "") else "" end) as $lista
                  | . + { safe_texto: (if $seg == "" then "não identificada automaticamente. Veja a Referência abaixo"
                            elif $seg == "DIVERGENTE" then "ambiente do pacote divergente. Acione um Security Champion para avaliar a possibilidade de falso positivo"
                            else "\u001b[1;32m\($seg)\u001b[0m (ou superior)\(if $lista == "" then ". Valide se essa versão não é afetada por outra CVE antes de atualizar" else "" end)" end),
                          safe_extra: ((if $min != "" and $min != "DIVERGENTE" then "│  Minimum Fix  : \($min)\n" else "" end) + $lista) })
          ' dt_blocking.json); then
            echo "$ENRICHED" > dt_blocking.json
          fi

          SBOM_FILE="$(Build.ArtifactStagingDirectory)/cyclonedx_report.json"

          if [ -f "$SBOM_FILE" ]; then
            jq -r --slurpfile bom "$SBOM_FILE" '
              ($bom[0].metadata.component["bom-ref"]? // "") as $root_ref |
              (($bom[0].dependencies // []) | map(select(.ref == $root_ref)) | (.[0] // {}).dependsOn // []) as $direct_refs |
              (($bom[0].components // []) | map(select(.["bom-ref"] != null and .purl != null) | {(.["bom-ref"]): .purl}) | add // {}) as $refToPurl |
              ($direct_refs | map($refToPurl[.]) | map(select(. != null)) | map({(.): true}) | add // {}) as $directPurls |
              (($bom[0].components // []) | map(select(.purl != null) | {(.purl): .}) | add // {}) as $bomDict |
              (($bom[0].components // []) | map(select(.purl == null) | {("\(.name)@\(.version)"): .type}) | add // {}) as $osDict |

              map(
                (if .component.purl != null then (((.component.purl | split(":")[1]) // "") | split("/")[0] // "Unknown") else "Unknown" end) as $pkg_type |
                ($bomDict[.component.purl // "NO_PURL"] | .properties // null) as $full_props |
                (if $full_props != null then
                  ([$full_props[]? | select(.name | test("syft:location.*path")) | .value][0] // "N/A")
                else "N/A" end) as $location |

                (if $pkg_type == "apk" or $pkg_type == "deb" or $pkg_type == "rpm" or $pkg_type == "oci" or $pkg_type == "alpm"
                  then "🐳 Container (Imagem Base \($pkg_type))"
                elif ($pkg_type == "Unknown" and (($osDict["\(.component.name)@\(.component.version)"] == "operating-system") or ((.component.cpe // "") | test("^cpe:2\\.3:o:|^cpe:/o:"))))
                  then "🐳 Container (OS/Sistema Operacional)"
                elif ($location != "N/A" and ($location | test("^(/usr/local/lib/node_modules|/usr/lib/node_modules|/usr/local/lib/python|/usr/lib/python|/usr/share/java|/usr/local/tomcat|/opt|/usr/local/bin|/usr/bin|/bin|/sbin|/usr/sbin)")))
                  then "🐳 Container (Global \($pkg_type))"
                else "📦 Aplicação/SCA (\($pkg_type))" end) as $origin |

                (if ($origin | test("Container"))
                  then "N/A (Infra/OS)"
                elif (.component.purl != null and $directPurls[.component.purl])
                  then "🎯 Direta (Direct)"
                else "🔀 Transitiva (Transitive)" end) as $dep_type |

                (if ($origin | test("Container")) then "container" else "app" end) as $origin_type |

                . + {
                  origin: $origin,
                  dep_type: $dep_type,
                  location: $location,
                  origin_type: $origin_type
                }
              )
            ' dt_blocking.json > dt_enriched.json
          else
            echo "##[warning] Arquivo cyclonedx_report.json não encontrado. Tratando todas as vulnerabilidades como de Projeto."
            jq '
              map(. + {
                origin: "📦 Aplicação/SCA (Desconhecido)",
                dep_type: "Desconhecido",
                location: "N/A",
                origin_type: "app"
              })
            ' dt_blocking.json > dt_enriched.json
          fi

          jq '[.[] | select(.origin_type == "app")]' dt_enriched.json > dt_app_blocking.json
          jq '[.[] | select(.origin_type == "container")]' dt_enriched.json > dt_container_warnings.json

          APP_COUNT=$(jq 'length' dt_app_blocking.json)
          CONTAINER_COUNT=$(jq 'length' dt_container_warnings.json)
          TOTAL_BLOCKING=$((APP_COUNT + CONTAINER_COUNT))

          if [ "$TOTAL_BLOCKING" -gt 0 ]; then

            APP_CRITICAL_COUNT=$(jq '[.[] | select(.vulnerability.severity == "CRITICAL")] | length' dt_app_blocking.json)
            APP_HIGH_COUNT=$(jq '[.[] | select(.vulnerability.severity == "HIGH")] | length' dt_app_blocking.json)
            
            CONT_CRITICAL_COUNT=$(jq '[.[] | select(.vulnerability.severity == "CRITICAL")] | length' dt_container_warnings.json)
            CONT_HIGH_COUNT=$(jq '[.[] | select(.vulnerability.severity == "HIGH")] | length' dt_container_warnings.json)

            ASSET_NAME_SEARCH="${DT_APP_DEFAULT_NAME} ${APP_VERSION}"
            ASSET_QUERY="{ assets(companyId: \"${CONVISO_COMPANY_ID}\", page: 1, limit: 10, search: {name: \"$ASSET_NAME_SEARCH\"}) { collection { id name } } }"
            ASSET_PAYLOAD=$(jq -n --arg q "$ASSET_QUERY" '{query: $q}')
            CONVISO_ASSET_ID=$(curl -sS --retry 3 --retry-delay 2 --max-time 15 -X POST -H "x-api-key: $(CONVISO-API-KEY)" -H "Content-Type: application/json" -d "$ASSET_PAYLOAD" "https://api.convisoappsec.com/graphql" | jq -r --arg exact_name "$ASSET_NAME_SEARCH" '[.data.assets.collection[]? | select(.name == $exact_name) | .id][0] // empty')

            echo ""
            if [ "$APP_COUNT" -gt 0 ]; then
              if [[ "$isGateBranch" == "true" ]]; then
                echo "##vso[task.logissue type=error;] Security Gate failed because critical and high potential vulnerabilities were found by our security tools in the APPLICATION SOURCE CODE for this project."
                echo "##vso[task.logissue type=error;] Check Vivo Appsec team wiki in https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659 for more details."
                echo "════════════════════════════════════════════════════════════════════════════════"
                echo "##[error]❌ SECURITY GATE FAILED — SCA (PROJETO/APLICAÇÃO)"
                echo "════════════════════════════════════════════════════════════════════════════════"
              else
                echo "##vso[task.logissue type=warning;] Critical and high potential vulnerabilities were found by our security tools in the APPLICATION SOURCE CODE for this project."
                echo "##vso[task.logissue type=warning;] Check Vivo Appsec team wiki in https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659 for more details."
                echo "════════════════════════════════════════════════════════════════════════════════"
                echo "##[warning]⚠️ VULNERABILIDADES ENCONTRADAS — SCA (PROJETO/APLICAÇÃO) — Gate não bloqueia em branch não produtiva"
                echo "##vso[task.logissue type=warning;]⚠️ ATENÇÃO: O bloqueio do Security Gate está habilitado apenas para as branches principais (main, master, release* e stage*). Recomendamos fortemente a correção imediata destas vulnerabilidades. Caso não sejam corrigidas agora, sua pipeline será BLOQUEADA ao tentar realizar o merge/commit para as branches principais."
                echo "════════════════════════════════════════════════════════════════════════════════"
              fi
            else
              echo "════════════════════════════════════════════════════════════════════════════════"
              echo "##[warning]⚠️ SECURITY GATE WARNING — SCA (CONTAINER)"
              echo "════════════════════════════════════════════════════════════════════════════════"
            fi

            if [ "$CONTAINER_COUNT" -gt 0 ]; then
              echo "##vso[task.logissue type=warning;] Container vulnerabilities (Critical/High) were found but will NOT block the pipeline."
            fi
            echo "📊 Resumo Geral de Violações de Política Não Auditadas: $COUNT"
            
            if [ "$APP_COUNT" -gt 0 ]; then
              echo "📦 Resumo de Vulnerabilidades de PROJETO:"
              echo "   🔴 Critical : $APP_CRITICAL_COUNT"
              echo "   🟠 High     : $APP_HIGH_COUNT"
            fi
            
            if [ "$CONTAINER_COUNT" -gt 0 ]; then
              echo "🐳 Resumo de Vulnerabilidades de CONTAINER (⚠️ NÃO BLOQUEANTES / WARNING):"
              echo "   🔴 Critical : $CONT_CRITICAL_COUNT"
              echo "   🟠 High     : $CONT_HIGH_COUNT"
              echo "   ----------------------------------------------------------------------------"
              echo "   📢 AVISO IMPORTANTE SOBRE CONTAINERS:"
              echo "   As vulnerabilidades acima são da Imagem Base ou de pacotes do Sistema"
              echo "   Operacional. Elas geram este alerta, mas NÃO QUEBRAM a sua pipeline."
              echo "   O deploy continuará normalmente."
              echo "   Ação recomendada: Atualize a versão da imagem base (FROM) no seu Dockerfile."
            fi
            
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "📖 PLAYBOOK DE CORREÇÃO (SCA) / REMEDIATION PLAYBOOK"
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "Preparamos um guia passo a passo para te ajudar a corrigir essas vulnerabilidades:"
            echo "👉 https://wikicorp.telefonica.com.br/spaces/SEGDIG/pages/796298043/Playbook+para+Devs"
            echo ""
            echo "💡 DICA DE CORREÇÃO (DevEx):"
            echo "• Se a Origem for 📦 Aplicação e o Tipo for Transitiva, NÃO edite arquivos em pastas internas."
            echo "  Atualize a versão indiretamente pelo manifesto raiz (ex: package.json, pom.xml)."
            echo "• Se a Origem for 🐳 Container, você NÃO conseguirá corrigir via código-fonte."
            echo "  Você precisará atualizar a Imagem Base (ex: alterar a versão do FROM no Dockerfile)."
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo ""

            if [ -n "$CONVISO_ASSET_ID" ]; then
              echo "🔗 Para detalhes completos das vulnerabilidades, acesse a listagem na Conviso Platform:"
              echo "   https://app.convisoappsec.com/spa/company/${CONVISO_COMPANY_ID}/vulnerabilities?assetIds=$CONVISO_ASSET_ID&severities=HIGH&severities=CRITICAL&statuses=IDENTIFIED&statuses=CREATED&page=1&perPage=100"
            else
              echo "⚠️  Não foi possível obter o link das vulnerabilidades na Conviso Platform."
            fi

            print_vulns() {
              local data_file="$1"
              jq -r '
                .[] |
                "┌─ [\(.vulnerability.severity // "UNKNOWN")] \(.vulnerability.vulnId // "UNKNOWN")\n" +
                "│  Componente   : \(.component.name // "Unknown") \(.component.version // "Unknown")\n" +
                "│  Best Fix     : \(.safe_texto)\n\(.safe_extra)" +
                "│  Origem       : \(.origin // "Unknown")\n" +
                "│  Tipo Dep     : \(.dep_type // "Unknown")\n" +
                "│  Caminho/Path : \(.location // "N/A")\n" +
                "│  CWEs         : \(if (.vulnerability.cwes // []) | length > 0 then [.vulnerability.cwes[]? | "CWE-\(.cweId // "Unknown")"] | join(", ") else "N/A" end)\n" +
                "│  Descrição    : \(.vulnerability.description // "Sem descrição" | gsub("[\r\n]+"; " ") | .[0:250])\(if (.vulnerability.description != null and (.vulnerability.description | length) > 100) then "..." else "" end)\n" +
                "│  Referência   : \(if (.vulnerability.vulnId // "") | startswith("CVE") then "https://nvd.nist.gov/vuln/detail/\(.vulnerability.vulnId)" else "https://osv.dev/vulnerability/\(.vulnerability.vulnId // "Unknown")" end)\n" +
                "└────────────────────────────────────────────────────────────────"
              ' "$data_file"
            }

            if [ "$APP_COUNT" -gt 0 ]; then
              echo ""
              echo "##[section]## Detalhes das Vulnerabilidades Bloqueantes (Projeto/Aplicação) ##"
              echo ""
              print_vulns dt_app_blocking.json
            fi

            if [ "$CONTAINER_COUNT" -gt 0 ]; then
              echo ""
              echo "##[section]## Detalhes das Vulnerabilidades Não Bloqueantes (Container / Imagem Base) - WARNING ##"
              echo ""
              print_vulns dt_container_warnings.json
            fi

            cat dt_violations.json > "$(Build.ArtifactStagingDirectory)/sca-violations.json"

            echo ""
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "📢 NOVO CANAL DE SUPORTE APPSEC / NEW APPSEC SUPPORT CHANNEL"
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "👉 Acesse nosso Centro de Excelência: https://telefonicacorp.sharepoint.com/sites/SuporteSecurityChampions.TMBNL/SitePages/Home.aspx"
            echo "Dúvidas sobre como corrigir essas vulnerabilidades? Nosso suporte agora é centralizado no Teams para garantir um melhor atendimento!"
            echo "(Questions on how to fix these vulnerabilities? Our support is now centralized on Teams to ensure a better support experience!)"
            echo ""
            echo "DICA!!! Preparamos um guia passo a passo para te ajudar a corrigir essas vulnerabilidades: https://wikicorp.telefonica.com.br/spaces/SEGDIG/pages/796298043/Playbook+para+Devs"
            echo "1️⃣ Primeiro acesso? Cadastre-se rápido aqui:"
            echo "   First access? Register quickly here:"
            echo "   👉 https://protect.checkpoint.com/v2/r02/___https://forms.office.com/Pages/ResponsePage.aspx?id=DmBElwQ-Lkm6oSXsJFxvEIEUqkLE2nxJo9w5p_Ap3pBUQlUzV00zTTg5Rk1KSDVGSFUxTjMyR0g0UC4u___.YzJlOnRlbGVmb25pY2FicmF6aWw6YzpvOjE5ZDMxODQ5YTI2ODEyYzAzNzZhYjM4MTI0NmU3NTM2Ojc6YmY5MDplZDUwOWM3Y2IzOWY3MDU1YjlhZTE0NzI4NTI5OTEwNmNkZDE2MmFlNDJhOGQ5N2E0NDQyYmM3ZjkwYTk5ZGFiOmg6VDpG"
            echo ""
            echo "2️⃣ Acesse o Centro De Excelência AppSec Vivo (Teams):"
            echo "   Access the AppSec Vivo Center of Excellence (Teams):"
            echo "   👉 https://protect.checkpoint.com/v2/r02/___https://teams.microsoft.com/l/team/19%3A5umImaIp9MNp2h-NjxPlAXYxUdm5Y-ez-2jWOCyH-6A1*40thread.tacv2/conversations?groupId=f337901f-f683-4b96-bf88-71d273fbb61e&tenantId=9744600e-3e04-492e-baa1-25ec245c6f10___.YzJlOnRlbGVmb25pY2FicmF6aWw6YzpvOjE5ZDMxODQ5YTI2ODEyYzAzNzZhYjM4MTI0NmU3NTM2Ojc6NzBiMzo0YTgzNzQ1ZDU4ZTA5MDUwMDAzZWZkMzFhODEzMWE3Y2Q2ODM4NjZjYmU2ZWUwOGY1ZjU1NTBjMTVkMmFhYTZiOmg6VDpG"
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "📧 E-mail / Email: appsec_vivo.br@telefonica.com"
            echo "🌙 Plantão / After-hours support (Evernow): +55 (11) 5028-1152"
            echo ""

            # Validação Final de Falha
            if [ "$APP_COUNT" -gt 0 ]; then
              if [[ "$isGateBranch" == "true" ]]; then
                echo "##vso[task.complete result=Failed;]Vulnerabilidades bloqueantes de projeto encontradas na branch principal."
                exit 1
              else
                echo "##vso[task.complete result=SucceededWithIssues;]Vulnerabilidades de projeto encontradas em branch não produtiva."
                exit 0
              fi
            elif [ "$CONTAINER_COUNT" -gt 0 ]; then
              echo "##vso[task.complete result=SucceededWithIssues;]Vulnerabilidades de container identificadas (Nao bloqueantes)."
            else
              echo "##[debug] Nenhuma vulnerabilidade encontrada. A pipeline seguira normalmente."
            fi
            
          else
            echo "##[debug] No critical and high vulnerabilities were found that violate AppSec policies."
            echo "##[debug] For more information about the process, check Vivo Appsec team wiki in https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659."
          fi

    - task: PublishBuildArtifacts@1
      displayName: "Publicar relatório de vulnerabilidades SCA"
      condition: failed()
      inputs:
        pathToPublish: "$(Build.ArtifactStagingDirectory)/sca-violations.json"
        artifactName: "sca-violations"

    - bash: |
        echo "##vso[task.setvariable variable=SCA_FAILED;isOutput=true]true"
      name: sca_status
      condition: failed()
      displayName: "Set Variable SCA Failed"
      
  - ${{ else }}:
    - task: Bash@3
      displayName: 'Security Scan Skipped'
      inputs:
        targetType: inline
        script: |
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color

          if [[ "$(Build.Reason)" == "PullRequest" ]]; then
            TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's/refs\/heads\///')
            BRANCH_INFO="Target: $TARGET_BRANCH (via PR)"
          else
            BRANCH_INFO="$(Build.SourceBranchName)"
          fi

          echo -e "${YELLOW}==================================[ AÇÃO: SCAN IGNORADO (SKIPPED) ]==================================${NC}"
          echo -e "Modo de Operação Ativo: ${YELLOW}VivoFlow${NC}"
          echo -e "Branch Avaliada: ${YELLOW}$BRANCH_INFO${NC}"
          echo -e "Regras de Validação em Vigor: ${YELLOW}master, main, release/*, ${{ join(', ', parameters.vivoFlow) }}${NC}"
          echo ""
          echo -e "${YELLOW}MOTIVO: O scan de segurança foi intencionalmente ignorado pois o branch avaliado '$BRANCH_INFO' não corresponde a nenhuma das regras de validação ativas.${NC}"
          echo ""
          echo -e "${BLUE}Dica: Se este branch deveria ser validado, acione a Equipe de AppSec appsec_vivo.br@telefonica.com${NC}"
          echo -e "${YELLOW}====================================================================================================${NC}"