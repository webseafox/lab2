parameters:
- name: fortifyExclusionRepository
- name: convisoCompany
  default: 430
- name: appVersion
  type: string
  default: "DevSecOps"
- name: vivoFlow
  type: string
  default: "master,main,develop,dev,preprod,homolog,staging,prodlike,release"
- name: fortifyArtifactName
  type: string
  default: "fortify-log-$(System.JobAttempt)"
- name: fortifyArtifactNameToPublish
  type: string
  default: "fortify-vulnerabilities-report-$(System.JobAttempt)"
- name: repositoryAlias
  type: string
  default: ''
- name: repositoryName
  type: string
  default: "$(Build.Repository.Name)"
- name: branchName
  type: string
  default: ''
- name: enableFortifyExclusions
  type: boolean
  default: true
- name: appLanguage
  type: string
  default: 'other'
- name: azureSubscription
  default: "$(APP_CONFIGURATION_AZURE_SUBSCRIPTION)"

steps:
  - ${{ if or(eq(parameters.vivoFlow, 'none'),and(ne(parameters.vivoFlow, 'none'),or(eq(variables['Build.SourceBranchName'], 'master'),eq(variables['Build.SourceBranchName'], 'main'),contains(parameters.vivoFlow, variables['Build.SourceBranchName']),and(eq(variables['Build.Reason'], 'PullRequest'),contains(parameters.vivoFlow, replace(variables['System.PullRequest.TargetBranch'], 'refs/heads/', '')))))) }}:

    ## -> Taks the explain this job
    - task: Bash@3
      displayName: 'About the Job'
      inputs:
        targetType: inline
        script: |

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          BG_GREEN='\033[42;1;37m'
          NC='\033[0m'

          echo ' ================================================================================================================================'
          echo '|                                                      _____             _______                                                 |'
          echo '|                                    /\               / ____|           |__   __|                                                |'
          echo '|                                   /  \   _ __  _ __| (___   ___  ___     | | ___  __ _ _ __ ___                                |'
          echo '|                                  / /\ \ |  _ \|  _ \\___ \ / _ \/ __|    | |/ _ \/ _  |  _   _ \                               |'
          echo '|                                 / ____ \| |_) | |_) |___) |  __/ (__     | |  __/ (_| | | | | | |                              |'
          echo '|                                /_/    \_\ .__/| .__/_____/ \___|\___|    |_|\___|\__,_|_| |_| |_|                              |'
          echo '|                                         | |   | |                                                                              |'
          echo '|                                         |_|   |_|                                                                              |'
          echo ' ================================================================================================================================'
          echo "                                                                                                      powered by Vivo AppSec Team"
          echo "                                                                    restructured to OSS pipeline standards by the Devops OSS Team"
          echo ""

          printf "
          =================================================================================================================================
          ${GREEN}                                                 ${SYSTEM_JOBDISPLAYNAME}
          =================================================================================================================================

          ${YELLOW}The objective of this stage is to assess whether there are vulnerabilities in the source code of this application..
          ${YELLOW}If you have any questions about this phase of the pipeline, access the documentation https://wikicorp.telefonica.com.br/pages/viewpage.action?pageId=524036659

          ================================================================================================================================="

    - task: DownloadPipelineArtifact@2
      displayName: 'Download AppSec Endpoints Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'AppSecEndpoints'
        targetPath: '$(Pipeline.Workspace)/AppSecEndpoints'

    - task: Bash@3
      displayName: 'Set SAST Security Variables'
      env:
        REPOSITORY_NAME: "${{ parameters.repositoryName }}"
      inputs:
        targetType: inline
        script: |
          ENDPOINTS_FILE="$(Pipeline.Workspace)/AppSecEndpoints/appsec_endpoints.json"
          
          if [ ! -f "$ENDPOINTS_FILE" ]; then
            echo "##vso[task.logissue type=error]AppSec Endpoints artifact not found!"
            echo "##[error]The required artifact 'AppSecEndpoints' containing the configuration JSON could not be found."
            exit 1
          fi

          echo "##[debug] Parsing endpoints from artifact..."
          USE_FORTIFY_LOCAL_SCANCENTRAL_VERSION=$(jq -r '.FORTIFY_LOCAL_SCANCENTRAL_VERSION // empty' "$ENDPOINTS_FILE")
          USE_FORTIFY_SSC_ENDPOINT=$(jq -r '.FORTIFY_SSC_ENDPOINT // empty' "$ENDPOINTS_FILE")
          USE_FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT=$(jq -r '.FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT // empty' "$ENDPOINTS_FILE")
          
          if [ -z "$USE_FORTIFY_LOCAL_SCANCENTRAL_VERSION" ] || [ -z "$USE_FORTIFY_SSC_ENDPOINT" ] || [ -z "$USE_FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT" ]; then
            echo "##vso[task.logissue type=error]Missing required variables in AppSec Endpoints artifact!"
            exit 1
          fi

          echo "=================================================================="
          echo "AppSec Endpoints Loaded:"
          echo "FORTIFY_LOCAL_SCANCENTRAL_VERSION.......: $USE_FORTIFY_LOCAL_SCANCENTRAL_VERSION"
          echo "FORTIFY_SSC_ENDPOINT....................: $USE_FORTIFY_SSC_ENDPOINT"
          echo "FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT.: $USE_FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT"
          echo "=================================================================="

          echo "##vso[task.setvariable variable=FORTIFY_SSC_ENDPOINT]$USE_FORTIFY_SSC_ENDPOINT"
          echo "##vso[task.setvariable variable=FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT]$USE_FORTIFY_SCANCENTRAL_CONTROLLER_ENDPOINT"
          echo "##vso[task.setvariable variable=FORTIFY_APP_DEFAULT_NAME]$(System.TeamProject)-${REPOSITORY_NAME}"
          echo "##vso[task.setvariable variable=FORTIFY_APP_DEFAULT_VERSION]DevSecOps"
          echo "##vso[task.setvariable variable=FORTIFY_EXCLUSION_FILE]sast_fortify_exclude_files.json"
          echo "##vso[task.setvariable variable=FORTIFY_LOCAL_SCANCENTRAL_VERSION]$USE_FORTIFY_LOCAL_SCANCENTRAL_VERSION"
          echo "##vso[task.setvariable variable=FORTIFY_LOCAL_SCANCENTRAL_PATH]/devops/fortify/scancentral/"
          echo "##vso[task.setvariable variable=FORTIFY_LOCAL_SCANCENTRAL_SCRIPT]/bin/scancentral"

          # Resolve REPO_ROOT uma vez e expõe para todos os steps seguintes
          if [ -d "$(Build.SourcesDirectory)/${REPOSITORY_NAME}" ]; then
            REPO_ROOT_VALUE="$(Build.SourcesDirectory)/${REPOSITORY_NAME}"
          else
            REPO_ROOT_VALUE="$(Build.SourcesDirectory)"
          fi
          echo "##vso[task.setvariable variable=FORTIFY_REPO_ROOT]$REPO_ROOT_VALUE"
          echo "##[debug] FORTIFY_REPO_ROOT: $REPO_ROOT_VALUE"

          echo "Security variables for this job have been set."

    - ${{ if eq(parameters.enableFortifyExclusions, true) }}:
      ## -> Checkout FortifyExclusion repository
      - checkout: ${{ parameters.fortifyExclusionRepository }}
        path: 'fortify-exclusions'
        fetchDepth: 1

    ## -> Checkout project
    - ${{ if or(eq(parameters.repositoryAlias, ''), eq(parameters.branchName, '')) }}:
      - checkout: self
        fetchDepth: 0

    - ${{ else }}:

      - checkout: ${{ parameters.repositoryAlias }}
        clean: true
        fetchDepth: 0
        fetchTags: false
        persistCredentials: true
    
      - bash: |
          cd $(Build.SourcesDirectory)/${{ parameters.repositoryName  }}
          git pull origin $BRANCH_NAME
          git fetch --no-tags origin "$BRANCH_NAME:$BRANCH_NAME" -f
          git checkout "$BRANCH_NAME"
        displayName: "Get source of ${{ parameters.repositoryAlias  }} (branch ${{parameters.branchName }})"
        env:
          BRANCH_NAME: ${{ parameters.branchName }}


    ## -> Download Security Tokens
    - task: AzureKeyVault@2
      displayName: 'Getting AKV Security Credentials'
      timeoutInMinutes: 1
      retryCountOnTaskFailure: 5
      inputs:
        azureSubscription: DevOpsSharedResources
        KeyVaultName: kv-azdevops-shared
        SecretsFilter: 'FORTIFY-SSC-CLI-TOKEN, CONVISO-API-KEY, ASPM-BASE-URL, ASPM-OAUTH-CLIENT-ID, ASPM-OAUTH-CLIENT-SECRET'
      condition: and(eq(variables['FORTIFY-SSC-CLI-TOKEN'], ''), eq(variables['CONVISO-API-KEY'], ''))

    - ${{ if eq(parameters.enableFortifyExclusions, true) }}:
      ## -> Setup FORTIFY exclusions
      - task: Bash@3
        displayName: 'Setup FORTIFY Exclusions'
        name: fortify_exclusions
        condition: succeeded()
        continueOnError: false
        env:
          REPOSITORY_NAME: "${{ parameters.repositoryName }}"
        inputs:
          targetType: inline
          script: |

            fortifyRepositoryTech="${APP_LANGUAGE}"
            project_name="${SYSTEM_TEAMPROJECT}"
            repository_name="${REPOSITORY_NAME}"
            excludeFileParam=""
            excludel=""

            # Workaround to avoid interpreting wildcards as disk paths
            mkdir -p $(Pipeline.Workspace)/fortify-exclusions/tmp
            cd $(Pipeline.Workspace)/fortify-exclusions/tmp

            json=$(jq -c '.' < $(Pipeline.Workspace)/fortify-exclusions/${FORTIFY_EXCLUSION_FILE})

            # search exclusions based on (PROJECT/REPOSITORY)
            excludeList=$(echo "$json" | jq -r --arg project_name "${project_name:-0}" --arg repository_name "${repository_name:-0}" '.[$project_name + "/" + $repository_name]')

            if [ "$excludeList" != "null" ]; then
              excludel=($(grep -oE '\S+' <<< "$excludeList"))
              echo -e "\033[0;32mEXCLUSION KEY: ${project_name}/${repository_name}"
            else
              #seach exclusions based on technology
              if [[ -n "$fortifyRepositoryTech" && "$fortifyRepositoryTech" != "null" ]]; then
                repository_type=$fortifyRepositoryTech
                query_origin="Library"
                excludeList=$(echo "$json" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')
                if [[ "$excludeList" == "null" || -z "$excludeList" ]]; then
                  echo -e "Tecnologia ${repository_type} não cadastrada no Regex"
                  repository_type="other"
                  excludeList=$(echo "$json" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')
                fi
                  excludel=($(grep -oE '\S+' <<< "$excludeList"))
                  echo -e "\033[0;32mEXCLUSION KEY: ${repository_type} (FROM: $query_origin)"
              else
                #Usa Other caso a tecnologia nem o nome seja encontrado
                repository_type="other"
                excludeList=$(echo "$json" | jq -r --arg repository_type ${repository_type:-0} '.[$repository_type]')
                query_origin="Library"
                excludel=($(grep -oE '\S+' <<< "$excludeList"))
                echo -e "\033[0;32mEXCLUSION KEY: ${repository_type} (FROM: $query_origin)"
              fi
            fi

            ## -> Validade Exclusion Query
            if [[ -n "$excludel" && "$excludel" != "null" ]]; then
                echo "##[debug] Will be excluded from FORTIFY scan:"
              for arg in "${excludel[@]}"; do
                excludeFileParam+="-exclude \"${arg}\" "
                echo "[Excluded]: $arg"
              done
            else
              echo "##[debug] None of the keys were found in the exclusions files."
              echo "##[debug] Keys: ${project_name}/${repository_name}, ${repository_type}"
            fi
            echo "##vso[task.setvariable variable=EXCLUDE_FILE_PARAM;isreadonly=true]$excludeFileParam"

    - ${{ else }}:
      - task: Bash@3
        displayName: 'Set Default FORTIFY Exclusions'
        inputs:
          targetType: inline
          script: |
            appLanguage="${{ parameters.appLanguage }}"
            case "$appLanguage" in
              java)
                excludeFileParam='-exclude "**/*test*" -exclude "**/*test*/**/*" -exclude "**/*spec*/**/*" -exclude "**/*stryker*" -exclude "**/*spec*" -exclude "**/*mock*" -exclude "**/*swagger*"'
                ;;
              nodejs)
                excludeFileParam='-exclude "**/*test*" -exclude "**/*test*/**/*" -exclude "**/*spec*/**/*" -exclude "**/*stryker*" -exclude "**/*spec*" -exclude "**/*mock*" -exclude "**/*swagger*"'
                ;;
              *)
                excludeFileParam='-exclude "**/*test*" -exclude "**/*test*/**/*" -exclude "**/*spec*/**/*" -exclude "**/*stryker*" -exclude "**/*spec*" -exclude "**/*mock*" -exclude "**/*swagger*"'
                ;;
            esac

            echo "##[debug] Default Fortify exclusions for '$appLanguage': $excludeFileParam"
            echo "##vso[task.setvariable variable=EXCLUDE_FILE_PARAM;isreadonly=true]$excludeFileParam"

    ## -> Defines the version name for the scan
    - task: Bash@3
      displayName: 'Defining App Version'
      name: scan_version_name
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          echo "##[debug] FORTIFY APP VERSION...........: ${{ parameters.appVersion }}"

          appVersion="${{ parameters.appVersion }}"

          echo "##vso[task.setvariable variable=FORTIFY_APP_VERSION]$appVersion"
          echo "##[debug] FORTIFY_APP_VERSION: $appVersion."


     ## -> Search FORTIFY Project/Project Version ID
    - task: Bash@3
      displayName: 'Search FORTIFY Project/Project Version ID'
      name: search_fortify_project
      condition: succeeded()
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          rawName="$(FORTIFY_APP_DEFAULT_NAME)"

          fortifyAppDefaultName=$(echo -n "$rawName" | jq -sRr @uri)


          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          echo "##[debug] FORTIFY rawName...............: $rawName"
          echo "##[debug] FORTIFY URL encoded...........: $fortifyAppDefaultName"

          requestQuery="project.name:$fortifyAppDefaultName"
          requestParams="fields=id,name,project&q=$requestQuery"

          response=$(curl -s -g \
          -X GET "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions?$requestParams" \
          --header 'Accept: application/json' \
          --header "Authorization: FortifyToken $fortifyToken")

          echo "##[debug] Response....: $response"

          projectId=$(echo "$response" | jq -r '.data[0].project.id // empty')
          projectVersionId=$(echo "$response" | jq -r '.data[] | select(.name == "'$(FORTIFY_APP_VERSION)'") | .id // empty')

          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_ID]$projectId"
          echo "##[debug] FORTIFY_PROJECT_ID: $projectId."

          echo "##vso[task.setvariable variable=FORTIFY_PROJECT_VERSION_ID]$projectVersionId"
          echo "##[debug] FORTIFY_PROJECT_VERSION_ID: $projectVersionId."

     ## -> Create Fortify Project/Project Version
    - task: Bash@3
      displayName: 'Create FORTIFY Project/Project Version ID'
      name: create_fortify_project
      condition: and(
        succeeded(),
        eq(variables.FORTIFY_PROJECT_VERSION_ID, ''))
      continueOnError: false
      inputs:
        targetType: inline
        script: |

          fortifyToken=$(echo -n $(FORTIFY-SSC-CLI-TOKEN) | base64)

          ## -> If the Project already exists, it will only be necessary to create the version
          if [[ -n "$(FORTIFY_PROJECT_ID)" ]]; then
            echo "##[debug] Project already exists, creating Project Version Id..."
            requestBodyProject='{ "id": $(FORTIFY_PROJECT_ID) }'
          else
            echo "##[debug] Creating both Project and Project Version Id..."
            requestBodyProject='{
              "name": "$(FORTIFY_APP_DEFAULT_NAME)",
              "issueTemplateId": "Prioritized-HighRisk-Project-Template",
              "auditEnabled": true
            }'
          fi

          requestData='{
            "name": "'$(FORTIFY_APP_VERSION)'",
            "issueTemplateId": "Prioritized-HighRisk-Project-Template",
            "project": '$requestBodyProject',
            "customTagValuesAutoApply": true,
            "autoPredict": true,
            "predictionPolicy": "Telefonica-Policy-v2"
          }'

          responseProject=$(curl -s -g \
          -X POST "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header "Authorization: FortifyToken $fortifyToken" \
          --data "$requestData")

          projectVersionId=$(echo $responseProject | jq .data.id)
          projectId=$(echo $responseProject | jq .data.project.id)

          if [[ -n $projectVersionId ]]; then
            echo "##[debug] Success while creating both Project and Project Version Id..."

            echo "##vso[task.setvariable variable=FORTIFY_PROJECT_ID]$projectId"
            echo "##[debug] FORTIFY_PROJECT_ID: $projectId."

            echo "##vso[task.setvariable variable=FORTIFY_PROJECT_VERSION_ID]$projectVersionId"
            echo "##[debug] FORTIFY_PROJECT_VERSION_ID: $projectVersionId."

          else
            echo "##[error] Error while creating both Project and Project Version Id..."
            echo $responseProject | jq .message
            exit -1
          fi

          #Regras de processamento
          response=$(curl -sS -k \
          -X PUT "$(FORTIFY_SSC_ENDPOINT)api/v1/projectVersions/$projectVersionId/resultProcessingRules" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -H "Authorization: FortifyToken $fortifyToken" \
          --data '[{"displayName":"Require approval if the Build Project is different between scans.","identifier":"com.fortify.manager.BLL.processingrules.BuildProjectProcessingRule","enabled":false,"displayable":true},{"displayName":"Check external metadata file versions in scan against versions on server.","identifier":"com.fortify.manager.BLL.processingrules.ExternalListVersionProcessingRule","enabled":true,"displayable":true},{"displayName":"Require approval if file count decreases by more than 10%. (File count of previous scan must be at least 1).","identifier":"com.fortify.manager.BLL.processingrules.FileCountDecreaseProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if file count increases by more than 10%. (File count of previous scan must be at least 1).","identifier":"com.fortify.manager.BLL.processingrules.FileCountIncreaseProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if result has Fortify Java Annotations.","identifier":"com.fortify.manager.BLL.processingrules.FortifyAnnotationsProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if line count decreases by more than 10%. (Line count of previous scan must be at least 1).","identifier":"com.fortify.manager.BLL.processingrules.LineCountDecreaseProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if line count increases by more than 10%. (Line count of previous scan must be at least 1).","identifier":"com.fortify.manager.BLL.processingrules.LineCountIncreaseProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if the engine version of a scan is newer than the engine version of the previous scan.","identifier":"com.fortify.manager.BLL.processingrules.NewerEngineVersionProcessingRule","enabled":false,"displayable":true},{"displayName":"Ignore SCA quick scan results and SCA speed dial results performed with a setting of less than four.","identifier":"com.fortify.manager.BLL.processingrules.QuickScanProcessingRule","enabled":true,"displayable":true},{"displayName":"Require approval if the rulepacks used in the scan do not match the rulepacks used in the previous scan.","identifier":"com.fortify.manager.BLL.processingrules.RulePackVersionProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if the rulepacks used in the scan are older than the rulepacks installed in SSC.","identifier":"com.fortify.manager.BLL.processingrules.SscRulePackVersionMatchProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if SCA or WebInspect Agent scan does not have valid certification.","identifier":"com.fortify.manager.BLL.processingrules.ValidCertificationProcessingRule","enabled":false,"displayable":true},{"displayName":"Require approval if result has analysis warnings.","identifier":"com.fortify.manager.BLL.processingrules.WarningProcessingRule","enabled":false,"displayable":true},{"displayName":"Perform Force Instance ID migration on upload.","identifier":"com.fortify.manager.BLL.processingrules.ForceMigrationProcessingRule","enabled":false,"displayable":true},{"displayName":"Automatically perform Instance ID migration on upload.","identifier":"com.fortify.manager.BLL.processingrules.MigrationProcessingRule","enabled":true,"displayable":true},{"displayName":"Warn if audit information includes unknown custom tag.","identifier":"com.fortify.manager.BLL.processingrules.UnknownOrDisallowedAuditedAttrChecker","enabled":true,"displayable":true},{"displayName":"Require the issue audit permission to upload audited analysis files.","identifier":"com.fortify.manager.BLL.processingrules.AuditedAnalysisRule","enabled":false,"displayable":true},{"displayName":"Disallow upload of analysis results that change values of hidden tags.","identifier":"com.fortify.manager.BLL.processingrules.HiddenTagAuditsAnalysisRule","enabled":false,"displayable":true},{"displayName":"Disallow upload of analysis results if there is one pending approval.","identifier":"com.fortify.manager.BLL.processingrules.PendingApprovalChecker","enabled":false,"displayable":true},{"displayName":"Disallow approval for processing if an earlier artifact requires approval. When unchecked, the approval of latest artifacts will cause older scans to automatically get approved and processed.","identifier":"com.fortify.manager.BLL.processingrules.VetoCascadingApprovalProcessingRule","enabled":false,"displayable":true}]')

          status_code=$(echo "$response" | jq -r '.responseCode')
          if [ "$status_code" -eq 200 ]; then
            echo "Ativo Configurado automaticamente"
          else
            echo "##[error]Erro ao configurar as regras de processamento. Por favor, chame um Security Champion."
          fi

    ## -> Define FORTIFY Attributes to Project Version
    - task: Bash@3
      displayName: 'Define FORTIFY Attributes'
      name: define_fortify_attributes
      condition: succeeded()
      continueOnError: false
      env:
        FORTIFY_ATTRIBUTES_FILE_NAME: "fortify-attributes"
