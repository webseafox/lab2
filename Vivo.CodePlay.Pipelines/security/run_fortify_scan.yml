                }
              ],
              "guid": "BusinessUnit"
            },
            {
              "attributeDefinitionId": 15,
              "values": [
                {
                  "guid": "Retail",
                  "name": "Retail",
                  "description": "Retail industry",
                  "inUse": true
                }
              ],
              "guid": "Industry"
            },
            {
              "attributeDefinitionId": 16,
              "values": [
                {
                  "guid": "Americas",
