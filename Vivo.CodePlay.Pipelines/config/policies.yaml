# Configuração de Políticas de Validação
# ========================================
# Este arquivo define as regras de validação aplicadas aos pipelines.

policies:
  # Convenção de Nomenclatura
  # -------------------------
  # Valida se os parâmetros seguem o padrão camelCase
  naming_convention:
    enabled: true
    severity: medium  # critical, high, medium, low, info
    config:
      convention: camelCase  # Padrão de nomenclatura esperado

  # Parâmetros Não Utilizados
  # --------------------------
  # Detecta parâmetros definidos mas não referenciados no pipeline
  unused_parameters:
    enabled: true
    severity: medium
    config: {}

  # Valores Default Duplicados
  # ---------------------------
  # Identifica parâmetros com mesmo nome mas valores default diferentes entre pipelines
  duplicate_defaults:
    enabled: true
    severity: high
    config: {}

  # DisplayName Obrigatório
  # -----------------------
  # Verifica se todos os parâmetros têm displayName definido
  required_display_name:
    enabled: true
    severity: low
    config: {}

  # Consistência de Tipos
  # ----------------------
  # Valida se parâmetros com mesmo nome têm tipos consistentes entre pipelines
  type_consistency:
    enabled: true
    severity: high
    config: {}

  # Validação de Tipos dos Valores Default
  # ---------------------------------------
  # Verifica se o valor default corresponde ao tipo declarado do parâmetro
  default_value_types:
    enabled: true
    severity: medium
    config: {}

  # Documentação de Parâmetros
  # ---------------------------
  # Exige comentários descritivos antes da definição de cada parâmetro
  parameter_documentation:
    enabled: false  # Desabilitado por padrão (pode gerar muitos avisos)
    severity: info
    config:
      min_comment_length: 20  # Tamanho mínimo do comentário em caracteres

  # Valores Default Sensíveis
  # --------------------------
  # Detecta parâmetros sensíveis (senha, token, etc) com valores default
  security_sensitive_defaults:
    enabled: true
    severity: critical
    config:
      keywords:
        - password
        - secret
        - token
        - key
        - credential
        - apikey
        - accesskey
        - privatekey
      # Lista de parâmetros permitidos (whitelist) - não serão reportados
      # mesmo que contenham palavras-chave sensíveis
      whitelist:
        - usePublicKey        # Exemplo: flag booleano para usar chave pública
        - enableKeyRotation   # Configuração de rotação
        - keyVaultName        # Nome do Key Vault (não é um segredo)
        - sonarProjectKey     # chave do projeto SonarQube (não é segredo)
        - secretManifestFile # Caminho para arquivo de manifesto de Secret (não é segredo em si)
        - placeholdersSecretManifestFile # Caminho para arquivo de manifesto de Secret com placeholders (não é segredo em si)
        - createDockerConfigSecret # Flag para criação de Secret com config do Docker (não é segredo em si)
        # Adicione seus parâmetros permitidos aqui

  # Parâmetros Duplicados
  # ---------------------
  # Detecta parâmetros definidos mais de uma vez no mesmo pipeline (CRÍTICO)
  duplicate_parameters:
    enabled: true
    severity: critical
    config: {}

  # Tasks Obrigatórias
  # ------------------
  # Valida se o pipeline contém as tasks obrigatórias definidas para CI ou CD
  required_tasks:
    enabled: true
    severity: high
    config:
      # Tasks obrigatórias para pipelines CI
      ci_required_tasks:
        - task: VersionManagerVivo@
          description: "Task que gerencia o motor de versionamento do framework CodePlay"
        # Adicione outras tasks obrigatórias para CI aqui

      # Tasks obrigatórias para pipelines CD
      cd_required_tasks:
        - task: VivoEventHubTools@
          description: "Task Utilizada para Registro de Deploys"
        - task: VersionManagerVivo@
          description: "Task que gerencia o motor de versionamento do framework CodePlay"
        # Adicione outras tasks obrigatórias para CD aqui

      # Bypass por pipeline específico
      # Use o nome do diretório do pipeline (ex: deploy-helm, build-java)
      bypass_rules:
        # Exemplo: Pipeline de deploy-example não precisa de VivoUtilsFromVivo@1
        deploy-example:
          skip_tasks:
            - VivoUtilsFromVivo@1
        # Pipeline de CD Liquibase não utiliza versionamento por VersionManagerVivo
        deploy-liquibase:
          skip_tasks:
            - VersionManagerVivo@
        # Adicione mais regras de bypass conforme necessário


  # ========================================
  # POLÍTICAS DE DOCUMENTAÇÃO
  # ========================================

  # README Obrigatório
  # ------------------
  # Exige que cada pipeline tenha um README.md com tamanho mínimo
  required_readme:
    enabled: true
    severity: critical
    config:
      min_length: 500  # Tamanho mínimo em caracteres

  # Parâmetros Documentados
  # -----------------------
  # Todos os parâmetros do pipeline devem estar documentados no README
  parameters_documented:
    enabled: true
    severity: high
    config: {}

  # Parâmetros Extras no README
  # ---------------------------
  # Detecta parâmetros documentados no README que não existem no pipeline
  readme_extra_parameters:
    enabled: true
    severity: medium
    config: {}

  # Ordem de Seções do README
  # -------------------------
  # Valida se o README segue a estrutura padrão de seções
  readme_section_order:
    enabled: true
    severity: low
    config:
      required_sections:
        - Descrição
        - Quick Start (5 minutos)
        - Matriz de Capacidades
        - Estrutura do Pipeline
        - Parâmetros Disponíveis
        - Dependências Externas
        - Comportamentos Customizados
        - Variáveis de Ambiente
        - FAQ
        - Suporte
        - Decisões Tomadas

  # Completude da Documentação de Parâmetros
  # -----------------------------------------
  # Valida se cada parâmetro tem todos os campos obrigatórios documentados
  parameter_doc_completeness:
    enabled: true
    severity: medium
    config:
      required_fields:
        - nome
        - tipo
        - default
        - descrição
        - dependências
      min_description_length: 50  # Tamanho mínimo da descrição

  # Consistência entre README e Pipeline
  # -------------------------------------
  # Verifica se tipos e defaults no README correspondem aos do pipeline
  readme_pipeline_consistency:
    enabled: true
    severity: high
    config: {}

  # Qualidade do README
  # -------------------
  # Valida aspectos de qualidade como exemplos e diagramas
  readme_quality:
    enabled: true
    severity: low
    config:
      min_examples: 2        # Número mínimo de exemplos de código
      require_diagram: true  # Exige diagrama visual do fluxo
